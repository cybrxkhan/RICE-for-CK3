# The ck3-tiger.conf file is in standard Paradox script format.
# It should be placed in the top directory of your mod.

filter = {
	show_vanilla = no
	show_loaded_mods = no

	trigger = {
		severity >= Warning
		confidence >= Reasonable

		########################################################################
		# False positives
		########################################################################

		NAND = { # Vanilla's add_excommunication_actual_effect reads scope:target_character only in a block guarded by exists = scope:requesting_character, which war declarations never set (tiger issue #346)
			key = strict-scopes
			text = "`on_declared_war` expects scope:target_character to be set"
		}
		NAND = { # scope:raid_province is only used after scope:raid_province.county ?= this (tiger issue #332)
			key = strict-scopes
			OR = {
				text = "`fp2_border_raid_effect` expects scope:raid_province to be set"
				text = "`RICE_sicily_border_raid_cb_damage_effect` expects scope:raid_province to be set"
			}
		}
		NAND = { # Scopes saved by the events that use these localization keys (tiger issue #330)
			key = datafunctions
			OR = {
				text = "unknown datafunction CSM_original_compiler"
				text = "unknown datafunction courtier"
				text = "unknown datafunction religious_head"
				text = "unknown datafunction RICE_aachen_spa_goer"
				text = "unknown datafunction RICE_baklava_test"
				text = "unknown datafunction RICE_courtier_poet_winner"
				text = "unknown datafunction RICE_tarim_basin_fake_china_person"
				text = "unknown datafunction RICE_trans_saharan_merchant_spawn"
				text = "unknown datafunction RICE_volga_dnieper_merchant_spawn"
				text = "unknown datafunction RICE_yazata_cult_destroyer"
			}
		}
		NAND = { # Saved by the Mordvin events that use it, but not by granada.0050 (tiger issue #330)
			key = datafunctions
			text = "unknown datafunction capital_province"
			NOT = { file = localization/german/rice_granada_l_german.yml }
		}

		########################################################################
		# False positives due to tiger not updated to 1.20.x
		########################################################################

		NAND = { # New triggers, effects, event targets, and links tiger can't parse
			key = unknown-field
			OR = {
				text = "unknown token `add_tenet`"
				text = "unknown token `change_spiritual_fulfillment`"
				text = "unknown token `every_faith_rite`"
				text = "unknown token `has_personal_tenet_flag`"
				text = "unknown token `has_tenet`"
				text = "unknown token `main_rite`"
				text = "unknown token `remove_tenet`"
				text = "unknown token `rite`"
				text = "unknown token `rite_has_doctrine`"
				text = "unknown token `rite_religion_tag`"
				text = "unknown token `set_character_rite`"
				text = "unknown token `set_character_rite_with_conversion`"
				text = "unknown token `set_county_rite`"
				text = "unknown token `stress_and_fulfillment_impact`"
			}
		}
		NAND = { # New modifiers
			key = unknown-field
			OR = {
				text = "unknown modifier `rite_creation_piety_cost_mult`"
				text = "unknown modifier `rite_modifier`"
			}
		}
		NAND = { # New gui datafunctions
			key = datafunctions
			OR = {
				text = "unknown datafunction GetDoctrineType"
				text = "unknown datafunction GetRiteByKey"
				text = "unknown datafunction GetTenetType"
			}
		}
		NAND = { # New rite: and tenet: prefixes
			key = validation
			OR = {
				text = "unknown prefix `rite`"
				text = "unknown prefix `rite:`"
				text = "unknown prefix `tenet`"
			}
		}
		NAND = { # Scopes saved from rite: prefixes are unknown in localization
			key = datafunctions
			text = "unknown datafunction catholic"
			file = localization/
		}
		NAND = { # Laws are now top-level objects, with law groups moved to common/law_groups/
			key = missing-item
			text = " not defined in common/laws/"
		}
		NAND = { # Faiths moved to common/religion/faith_types/
			key = missing-item
			OR = {
				text = " not defined in common/religion/religions/"
				text = "could not find any manichaean_faith"
				text = "could not find any miaphysitism"
			}
		}
		NAND = { # Doctrine and tenet parameters are now lists in common/religion/doctrine_types/ and common/religion/tenet_types/
			key = missing-item
			text = " not defined in common/religion/doctrine_types/"
		}
		NAND = { # Doctrine parameters are now lists of flags
			key = structure
			text = "found loose value"
			file = common/religion/doctrine_types/
		}
		NAND = { # family moved into religion_details in religion types
			key = field-missing
			text = "required field `family` missing"
			file = common/religion/religion_types/
		}

		########################################################################
		# False positives due to tiger not updated to 1.21.x
		########################################################################

		NAND = { # New triggers, effects, event targets, and links tiger can't parse
			key = unknown-field
			OR = {
				text = "unknown token `add_special_district_slot`"
				text = "unknown token `add_special_district`"
				text = "unknown token `any_owned_trade_post_district`"
				text = "unknown token `can_start_building_construction_for_owner`"
				text = "unknown token `change_prosperity_level`"
				text = "unknown token `change_prosperity_progress_with_overflow`"
				text = "unknown token `change_prosperity_progress`"
				text = "unknown token `has_special_district`"
				text = "unknown token `is_governor`"
				text = "unknown token `prosperity_level`"
				text = "unknown token `remove_district_type`"
				text = "unknown token `special_district`"
				text = "unknown token `start_building_construction_for_holder`"
			}
		}
		NAND = { # New modifiers
			key = unknown-field
			OR = {
				text = "unknown modifier `building_slots_for_host_district`"
				text = "unknown modifier `desert_mountains_prosperity_growth_factor`"
				text = "unknown modifier `desert_prosperity_growth_factor`"
				text = "unknown modifier `different_faith_popular_opinion_mult`"
				text = "unknown modifier `drylands_prosperity_growth_factor`"
				text = "unknown modifier `farmlands_prosperity_growth_factor`"
				text = "unknown modifier `floodplains_prosperity_growth_factor`"
				text = "unknown modifier `forest_prosperity_growth_factor`"
				text = "unknown modifier `hills_prosperity_growth_factor`"
				text = "unknown modifier `jungle_prosperity_growth_factor`"
				text = "unknown modifier `monthly_agricultural_tax`"
				text = "unknown modifier `monthly_artisan_tax`"
				text = "unknown modifier `monthly_civic_tax`"
				text = "unknown modifier `monthly_commerce_tax`"
				text = "unknown modifier `monthly_control_change_at_war_mult`"
				text = "unknown modifier `monthly_control_change_when_above_baseline_mult`"
				text = "unknown modifier `monthly_control_change_when_below_baseline_mult`"
				text = "unknown modifier `monthly_maritime_tax`"
				text = "unknown modifier `monthly_mining_tax`"
				text = "unknown modifier `monthly_religious_tax`"
				text = "unknown modifier `monthly_urban_tax`"
				text = "unknown modifier `monthly_woodland_tax`"
				text = "unknown modifier `mountains_prosperity_growth_factor`"
				text = "unknown modifier `oasis_prosperity_growth_factor`"
				text = "unknown modifier `prosperity_decline_factor`"
				text = "unknown modifier `prosperity_decline`"
				text = "unknown modifier `prosperity_growth_factor`"
				text = "unknown modifier `prosperity_growth`"
				text = "unknown modifier `terraced_hills_prosperity_growth_factor`"
				text = "unknown modifier `wetlands_prosperity_growth_factor`"
			}
		}
		NAND = { # New modifiers, misparsed as tax slot or terrain modifiers
			key = missing-item
			OR = {
				text = "could not find tax slot type character_capital_county_monthly_prosperity_growth"
				text = "could not find tax slot type control_baseline"
				text = "could not find tax slot type monthly_control_change_at_war"
				text = "could not find tax slot type monthly_control_change_when_below_baseline"
				text = "could not find tax slot type popular_opinion"
				text = "could not find terrain agricultural"
				text = "could not find terrain all"
				text = "could not find terrain artisan"
				text = "could not find terrain civic"
				text = "could not find terrain commerce"
				text = "could not find terrain maritime"
				text = "could not find terrain mining"
				text = "could not find terrain religious"
				text = "could not find terrain tribal"
				text = "could not find terrain urban"
				text = "could not find terrain woodland"
			}
		}
		NAND = { # Modifiers with new use areas, as the 1.21 script docs show
			key = modifiers
			OR = {
				text = "`control_baseline_add` is a modifier for character but"
				text = "`monthly_control_change_at_war_add` is a modifier for character but"
				text = "`monthly_control_change_when_below_baseline_add` is a modifier for character but"
				text = "`popular_opinion_add` is a modifier for character but"
			}
		}
		NAND = { # New global data function GetBuildingType
			key = datafunctions
			text = "GetBuildingType cannot be the first in a chain"
		}
		NAND = { # Building types are set on districts now
			key = validation
			text = "` is only for duchy_capital buildings"
		}
		NAND = { # New directories
			key = filename
			text = "file in unexpected directory `common/districts`"
		}
		NAND = { # Scopes saved only inside new district iterators, which tiger skips
			key = strict-scopes
			text = "expects scope:destroyed_building_type to be set"
		}
		NAND = { # History sets the faith now, whose main rite is the bookmark's rite (christian_faith, catholic)
			key = bookmarks
			text = "rite is roman_rite in bookmark but character has no rite in history"
		}
		NAND = { # Building names and descriptions lost the building_ prefix of their localization keys
			key = missing-localization
			OR = {
				text = "localization key building_RICE_"
				text = "localization key building_bao_"
				text = "localization key building_wap_"
			}
		}

		########################################################################
		# Intended
		########################################################################

		NAND = { # Checks for other mods' cultures and faiths, e.g. The Fallen Eagle, only used with exists
			key = missing-item
			OR = {
				text = "culture ce_copt not defined"
				text = "culture coptic not defined"
				text = "culture guanche not defined"
				text = "culture kemetic not defined"
				text = "culture khotanese not defined"
				text = "culture mahri not defined"
				text = "culture soissons not defined"
				text = "faith denawar not defined"
			}
		}
		NAND = { # RICE's game start effects set the cultures of these bookmark characters
			key = bookmarks
			OR = {
				text = "culture is greek in bookmark but sicilian"
				text = "culture is khalaj in bookmark but afghan"
				text = "culture is pamiri in bookmark but tajik"
				text = "culture is sorbian in bookmark but czech"
				text = "culture is turco_hephthalite in bookmark but afghan"
			}
		}
		NAND = { # Informational only
			key = deprecated
			text = "should use `is_available` instead of `ai_potential`"
		}

		########################################################################
		# RICE issues
		########################################################################

		NAND = { # Invalid data functions and syntax errors in localization (RICE issue #350)
			key = datafunctions
		}
		NAND = { # References to missing objects, and checks for other mods' objects without exists (RICE issue #350)
			key = missing-item
			NOT = { file = common/bookmarks/ }
		}
		NAND = { # Localization missing in all languages (RICE issue #350)
			key = missing-localization
			text = "missing english, spanish, french, german, russian, japanese and polish localization"
		}
		NAND = { # Localization syntax errors (RICE issue #350)
			key = localization
		}
		NAND = { # Localization syntax errors (RICE issue #350)
			key = markup
		}
		NAND = { # Duplicate localization (RICE issue #350)
			key = duplicate-item
			text = "localization is redefined by another localization"
		}
		NAND = { # Scope errors (RICE issue #350)
			key = scopes
		}
		NAND = { # Scope errors (RICE issue #350)
			key = strict-scopes
			OR = {
				text = "`RICE_generate_small_family` expects scope:RICE_burusho_warrior_spawn to be set"
				text = "`RICE_venerate_ancestors_completed_log_entry_effect` expects scope:actor to be set"
			}
		}
		NAND = { # Scope errors (RICE issue #350)
			key = wrong-use
			text = "`scope:CSM_xp` is a trigger and can't be used as an effect"
		}
		NAND = { # Missing graphics (RICE issue #350)
			key = missing-file
		}
		NAND = { # Invalid graphics (RICE issue #350)
			key = image-size
		}
		NAND = { # Missing graphics (RICE issue #350)
			key = reader-directives
		}
		NAND = { # Missing translations (RICE issue #351)
			key = missing-localization
			NOT = { text = "missing english, spanish, french, german, russian, japanese and polish localization" }
		}
		NAND = { # TODO Check duplicate fields
			key = duplicate-field
		}
		NAND = { # TODO Check duplicate objects
			key = duplicate-item
			NOT = { text = "localization is redefined by another localization" }
		}
		NAND = { # TODO Check duplicate objects
			key = exact-duplicate-item
		}
		NAND = { # TODO Check missing perspectives
			key = missing-perspective
		}
		NAND = { # TODO Check conflicting doctrines
			key = conflict
		}
		NAND = { # TODO Check out-of-range values
			key = range
		}
		NAND = { # TODO Check deaths before an event
			key = history
		}
		NAND = { # TODO Check a date compared with a year
			key = unknown-field
			text = "unknown token `950`"
		}
		NAND = { # TODO Check reformed icons of unreformed faiths
			key = validation
			text = "`reformed_icon = ` is only for unreformed faiths"
		}
		NAND = { # TODO Check random effects in messages and toasts
			key = logic
			OR = {
				text = "inside `send_interface_message` does not work right"
				text = "inside `send_interface_toast` does not work right"
			}
		}
		NAND = { # TODO Check too complex tooltips
			key = tooltip
			text = "is a too complex trigger to be tooltipped in a trigger that shows failures only"
		}
		NAND = { # TODO Check bookmark dynasties without a coat of arms
			key = missing-item
			text = "not defined in common/coat_of_arms/coat_of_arms/"
			file = common/bookmarks/
		}

		########################################################################
		# Unclear
		########################################################################

		NAND = { # Adventurer titles have no adjective, as vanilla's; check in game whether texts with their adjective show the key
			key = missing-localization
			OR = {
				text = "localization key d_laamp_"
				text = "localization key d_nf_RICE_"
			}
			text = "_adj"
		}
		NAND = { # Special option categories have no name, as vanilla's; check in game whether the activity planner shows the key
			key = missing-localization
			text = "localization key special_type"
			file = common/activities/activity_types/
		}
		NAND = { # Bookmark cultures, rites and dynasties that the history doesn't give; check in game whether RICE's game start effects set them
			key = bookmarks
			OR = {
				text = "dynasty is "
				text = "culture is egyptian in bookmark but armenian"
				text = "culture is magadhi in bookmark but bengali"
				text = "culture is persian in bookmark but tajik"
				text = "culture is senoi in bookmark but malay"
				text = "culture is sicilian in bookmark but italo_norman"
				text = "culture is siqilli in bookmark but baranis"
				text = "culture is siqilli in bookmark but maghrebi"
				text = "culture is south_arabian in bookmark but yemeni"
				text = "culture is zhangzhung in bookmark but bodpa"
				text = "rite is halmahera_pagan in bookmark but tolotang"
				text = "rite is hanafi in bookmark but ismaili"
				text = "rite is insular_celtic in bookmark but roman_rite"
			}
		}
		NAND = { # Localization of a memory type that RICE creates only in commented-out code
			key = datafunctions
			text = "unknown datafunction host"
		}
	}
}
