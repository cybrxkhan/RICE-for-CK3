l_polish:

 SEVEN_SEAS_GLOSS: "Although popularly associated with stereotypical pirates from the Golden Age of Piracy, the #Bold Seven Seas#! as a figurative term for the entirety of the world's oceans dates back to ancient times. During the ancient and medieval period, the list of “Seven Seas” varied depending on who you asked. Medieval Arabic literature, for instance, defined the Seven Seas as the Persian Gulf, Arabian Sea, the Bay of Bengal, the Strait of Malacca, the Singapore Strait, the Gulf of Thailand, and the South China Sea."
 ERYTHRAEAN_SEA_GLOSS: "The ancient Greeks used the term #Bold Erythraean Sea#! to describe the waters of the Gulf of Aden (between Yemen and the Horn of Africa), and sometimes even beyond that, including the Red Sea, Persian Gulf, Arabian Sea, and parts of the Indian Ocean."
 MODERN_SOUTH_ARABIAN_LANGUAGES_GLOSS: "The #Bold Modern South Arabian Langauges#! (or MSAL) are an endangered branch of the Semitic language family native to Yemen and Oman, including Mehri and Soqotri. They are not to be confused with, and are not descended from, the Old South Arabian Languages, a separate branch of Semitic for the ancient languages of Yemen."
 OLD_SOUTH_ARABIAN_LANGUAGES_GLOSS: "The #Bold Old South Arabian Langauges#! (or OSAL) were a branch of the Semitic language family spoken in the ancient kingdoms of pre-Islamic South Arabia like Saba and Hadhramaut. They are not to be confused with, and are not the ancestors of, the Modern South Arabian Languages, a separate branch of Semitic cosisting of several endangered languages in Yemen and Oman. Several modern languages spoken in the mountains of western Yemen, including Razihi, Faifi, and Rijal Alma, preserve features of the OSAL languages, but their classification as remnants of OSAL are disputed."