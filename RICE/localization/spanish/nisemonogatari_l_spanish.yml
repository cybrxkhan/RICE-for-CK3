 pudgalavada:0 "Sammitiya"
 pudgalavada_adj:0 "Sammitiya"
 pudgalavada_adherent:0 "Sammitiyano"
 pudgalavada_adherent_plural:0 "Sammitiyanos"
 pudgalavada_desc:0 "Las llamadas escuelas personalistas del budismo sostienen que, aunque no existe un yo, sí existe una persona que carga con las cargas del karma y los cinco agregados. Otras escuelas budistas consideran heréticas sus posturas filosóficas, pero ellos creen que en realidad defienden las verdaderas enseñanzas del Buda."
 d_regional_Sammitiya_rite:0 "Rito Sammitiya Regional"

 #Sammitiya
 sammitiya:0 "Sammitiya"
 sammitiya_adj:0 "Sammitiya"
 sammitiya_adherent:0 "Sammitiyano"
 sammitiya_adherent_plural:0 "Sammitiyanos"
 sammitiya_desc:0 "Los Sammitiya son la escuela más exitosa y extendida de las que se escindieron de los Vatsiputriyas, con monasterios que en su día estuvieron dispersos por el norte de la India. Su principal diferencia con otras ramas importantes del budismo es su firme creencia en el concepto de una persona que carga con las cargas del karma, lo que, según sostienen, no contradice, sino que de hecho respalda y amplía la profunda enseñanza del Buda sobre la inexistencia del yo."
 
 #Sammitiya
 vatsiputriya:0 "Vatsiputriya"
 vatsiputriya_adj:0 "Vatsiputriya"
 vatsiputriya_adherent:0 "Vatsiputriyano"
 vatsiputriya_adherent_plural:0 "Vatsiputriyanos"
 vatsiputriya_desc:0 "Unos siglos después de la vida del Buda, el anciano Vatsiputra estableció la escuela que formuló la existencia de una persona que carga con las cargas del karma. Aunque se trata de una afirmación controvertida, cuando no herética, para todos los demás budistas, sus puntos de vista fueron en su día populares en gran parte de la India."


tenet_rice_personalism_name: "Pudgala"
tenet_rice_personalism_desc: "Aunque no existe el atman, sí existe un pudgala, o persona, que no es ni un dharma condicionado ni un dharma incondicionado. El camino hacia la iluminación implica comprender este pudgala a través de la experiencia personal, la reflexión y el razonamiento."
