 oceania.0061.t:0 "Los Guerreros [biak_culture.GetNameNoTooltip]"
 oceania.0061.desc.intro.peaceful:0 "Los guerreros [biak_culture.GetName] llegaron en barcos [Glossary( 'wairon', 'WAIRON_GLOSS' )] – engañosamente esbeltos y elegantes, pero con rostros temibles tallados en su madera, testimonio del valor aventurero de sus dueños."
 oceania.0061.desc.intro.tense:0 "[biak_leader.GetFirstName] no fue demasiado codicioso, afortunadamente, y aceptó nuestros términos renegociados.\n\nAunque tuvimos un comienzo difícil, y aunque no podemos confiar plenamente en ellos, por ahora,"
 oceania.0061.desc.peaceful:0 "$oceania.0061.desc.intro.peaceful$\n\nAfortunadamente, los guerreros con los que entré en contacto, liderados por un tal [biak_leader.GetFirstName], son amistosos y están dispuestos a luchar por extranjeros como nosotros. A cambio de pago, traerán gloria y honor a sus clanes en su tierra natal."
 oceania.0061.desc.biak:0 "$oceania.0061.desc.intro.peaceful$\n\nComo compañeros [biak_culture.GetCollectiveNoun], entendemos bien qué tipo de fuerza, astucia y valentía necesita un guerrero para tener éxito en sus aventuras. Los guerreros con los que entré en contacto, liderados por [biak_leader.GetFirstName], cumplen de sobra con estos requisitos, y están contentos de trabajar conmigo siempre que puedan compartir el botín."
 oceania.0061.desc.tense:0 "$oceania.0061.desc.intro.tense$ parecen contentos de luchar para mí. A cambio de pago, traerán gloria y honor a sus clanes en su tierra natal."
 oceania.0061.a:0 "Bien. Trabajemos juntos."
 oceania.0061.b:0 "Algunos de vosotros también podéis asentaros en nuestras tierras."
 oceania.0061.c:0 "¿Puedes tú mismo trabajar también con nosotros?"
 oceania.0061.d:0 "Me vendría bien alguien como tú como compañero."
 oceania.0062.t:0 "Los Comerciantes [biak_culture.GetNameNoTooltip]"
 oceania.0062.desc.intro.peaceful:0 "Los comerciantes [biak_culture.GetName] llegaron en barcos [Glossary( 'waimansusu', 'WAIMANSUSU_GLOSS' )] – grandes, y con suficiente espacio para transportar mucha carga, testimonio del intrépido sentido de los negocios de sus dueños."
 oceania.0062.desc.intro.tense:0 "$oceania.0061.desc.intro.tense$"
 oceania.0062.desc.peaceful:0 "$oceania.0062.desc.intro.peaceful$\n\nEl grupo de comerciantes con el que entré en contacto estaba liderado por un tal [biak_leader.GetFirstName], quien me asegura que con mi apoyo pueden comerciar a lo largo y ancho, y traer riquezas a los puertos sobre los que tengo dominio. Al hacerlo, también traerán gloria y honor a sus clanes en su tierra natal."
 oceania.0062.desc.biak:0 "$oceania.0062.desc.intro.peaceful$\n\nComo compañeros [biak_culture.GetCollectiveNoun], entendemos bien que las aventuras exitosas no consisten solo en poner a prueba el valor en la batalla. Los logros en el comercio y la diplomacia son igualmente impresionantes, y los comerciantes con los que entré en contacto, liderados por [biak_leader.GetFirstName], parecen experimentados en esos aspectos. Están contentos de trabajar conmigo siempre que nos ayudemos mutuamente."
 oceania.0062.desc.tense:0 "$oceania.0061.desc.intro.tense$ han aceptado trabajar con nosotros para beneficiarnos mutuamente del comercio. Al hacerlo, también traerán gloria y honor a sus clanes en su tierra natal."
 oceania.0062.a:0 "$oceania.0061.a$"
 oceania.0062.b:0 "$oceania.0061.b$"
 oceania.0062.c:0 "$oceania.0061.c$"
 oceania.0062.d:0 "$oceania.0061.d$"
 oceania.0063.t:0 "Las Exigencias de los [biak_culture.GetNameNoTooltip]"
 oceania.0063.desc.warriors:0 "$oceania.0061.desc.intro.peaceful$\n\nDesafortunadamente, nuestras negociaciones con ellos para que luchen bajo mi estandarte están fracasando. Exigen más oro de mí y amenazan con tomar represalias con incursiones en mis tierras si no accedo.\n\nAy, #italic son#! conocidos también por sus habilidades en la piratería, así que debemos actuar con cuidado…."
 oceania.0063.desc.traders:0 "$oceania.0062.desc.intro.peaceful$\n\nDesafortunadamente, nuestras negociaciones con ellos para trabajar juntos en beneficio mutuo están fracasando. Exigen más oro de mí y amenazan con tomar represalias con incursiones en mis tierras si no accedo.\n\nAy, aunque son mejores comerciantes y diplomáticos, la piratería #italic es#! tradicionalmente otra forma de obtener beneficios para ellos también, así que debemos actuar con cuidado…."
 oceania.0063.desc.fallback:0 "Nuestros intentos de negociar con los aventureros [biak_culture.GetCollectiveNoun] han fracasado.\n\nAmenazan con atacarnos si no les ofrecemos más oro."
 oceania.0063.a:0 "De acuerdo. Recibiréis vuestro pago extra."
 oceania.0063.b:0 "No. #italic Aceptaréis#! nuestra propuesta original."
 oceania.0063.b.failure:0 "Se niegan y se dedican a la piratería"
 oceania.0063.b.success:0 "Se echan atrás y aceptan la propuesta original"
 oceania.0064.t:0 "Los Piratas [biak_culture.GetNameNoTooltip]"
 oceania.0064.desc.original:0 "Nuestros intentos de negociar con la banda de [biak_culture.GetName] liderada por [biak_leader.GetFirstName] han fracasado.\n\n[biak_leader.GetFirstNameNoTooltip] y [biak_leader.GetHerHis] gente están ahora remontando las vías fluviales de [target_duchy.GetNameNoTier], atacando y saqueando todo lo que pueden. Aunque el daño que son capaces de causar es limitado, sus depredaciones no me favorecen."
 oceania.0064.desc:0 "[original_negotiator.GetTitledFirstName] intentó recientemente reclutar los servicios de aventureros [biak_culture.GetName] liderados por un tal [biak_leader.GetFirstName].\n\nSin embargo, las negociaciones fracasaron y, como resultado, [biak_leader.GetFirstNameNoTooltip] y [biak_leader.GetHerHis] gente están ahora remontando las vías fluviales de [target_duchy.GetNameNoTier], atacando y saqueando todo lo que pueden. Aunque el daño que son capaces de causar es limitado, ¡mis territorios también han sido objeto de estas depredaciones, a pesar de que originalmente no estábamos involucrados en absoluto!"
 oceania.0064.a:0 "Vaya…."
 oceania.0064.b:0 "[original_negotiator.GetFirstNameNoTooltip], ¡Necio! ¡¿Qué has hecho?!"
