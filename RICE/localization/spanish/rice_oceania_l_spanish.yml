 oceania.0040.t:0 "Otra Ceremonia Sasi"
 oceania.0040.desc:0 "El [Glossary( 'sasi', 'SASI_GLOSS' )] es nuestra tradición, como [ROOT.Char.GetCulture.GetName], de designar periódicamente recursos que no pueden ser recolectados durante un período de tiempo, para preservar dichos recursos para uso futuro. El #italic sasi#!, por supuesto, va acompañado de las ceremonias [ROOT.Char.GetFaith.GetReligion.GetAdjective] apropiadas.\n\n"
 oceania.0040.desc.land:0 "Pronto aplicaremos un #italic sasi de tierra#! en [location.GetName], y estaré presente en la ceremonia de cierre del #italic sasi#!. Después, se prohibirá a la gente acceder y explotar los recursos en las zonas silvestres de allí durante algún tiempo."
 oceania.0040.desc.water:0 "Pronto aplicaremos un #italic sasi de agua#! en [location.GetName], y estaré presente en la ceremonia de cierre del #italic sasi#!. Se prohibirá a la gente acceder y explotar los recursos en ciertos cuerpos de agua de allí durante algún tiempo."
 oceania.0040.a:0 "¡Pongámonos en marcha!"
 oceania.0041.t:0 "Llegada"
 oceania.0041.desc:0 "Tras llegar al pueblo de [location.GetName] donde se celebrará la ceremonia de cierre del [Glossary( 'sasi', 'SASI_GLOSS' )], los lugareños nos recibieron con gran pompa y alegría.\n\nLa ceremonia tendrá lugar pronto, en los próximos días. Sin embargo, quizás pueda distraerme con algo mientras tanto…."
 oceania.0041.a:0 "Pasar tiempo en oración a [ROOT.Char.GetFaith.HighGodName]"
 oceania.0041.b:0 "Discutir asuntos locales con los líderes de la comunidad"
 oceania.0041.c:0 "Relajarme y disfrutar del hermoso paisaje de la zona"
 oceania.0042.t:0 "Cerrando el Sasi"
 oceania.0042.desc:0 "Una vez completada la ceremonia de hoy, el [Glossary( 'sasi', 'SASI_GLOSS' )] quedará cerrado según los términos que yo y otros líderes locales hemos acordado.\n\nRogamos al [ROOT.Char.GetFaith.PantheonTerm] que nos cuide a nosotros y a los recursos que estamos protegiendo,"
 oceania.0042.desc.land:0 "mientras nos reunimos bajo los árboles [ROOT.Char.GetCurrentLocation.Custom('GetRandomAppropriateTree')] cerca del pueblo. Cualquier recurso que se encuentre en el área afectada por el #italic sasi#!, incluyendo animales, plantas y minerales, quedará intocable para todos."
 oceania.0042.desc.water:0 "mientras nos reunimos junto a la orilla de [ROOT.Char.Custom('IndefiniteBodyOfWater')] cerca del pueblo. Desde peces y coral hasta otros animales acuáticos, plantas y minerales, a nadie se le permitirá recolectar estos recursos afectados por los términos del #italic sasi#!."
 oceania.0042.desc.conclusion:0 "\n\nLa ceremonia concluye con mucho baile y canto que acompañan a las oraciones, y los lugareños me agradecen mi apoyo."
 oceania.0042.a:0 "Nuestros recursos serán preservados durante mucho tiempo."
