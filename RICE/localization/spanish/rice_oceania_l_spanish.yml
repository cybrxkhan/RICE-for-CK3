 RICE_oceania_courtier_modifier_island_agriculture_desc: "$RICE_oceania_courtier_modifier_island_desc$ los métodos únicos de cultivo en estas islas."
 RICE_oceania_courtier_modifier_kava: "$RICE_oceania_courtier_modifier_island$ (Ceremonias de Kava)"
 RICE_oceania_courtier_modifier_kava_desc: "$RICE_oceania_courtier_modifier_island_desc$ la importancia ritual y espiritual de beber kava.\n\n#Emp Puede acceder a la [decision|E] de #V $RICE_stress_loss_drink_kava_decision$#! y posiblemente obtener el [GetTrait('RICE_kava_drinker').GetName( GetNullCharacter )|U] [trait|E] independientemente de la [heritage|E]#!"
 RICE_oceania_courtier_modifier_recruit_islanders: "$RICE_oceania_courtier_modifier_island$ (Guerra Insular)"
 RICE_oceania_courtier_modifier_recruit_islanders_desc: "$RICE_oceania_courtier_modifier_island_desc$ las tácticas utilizadas en la guerra en las islas del Pacífico.\n\n#Emp Puede reclutar [GetMaA('RICE_pacific_warriors').GetName] [men_at_arms|E] independientemente de la [heritage|E]#!"
 RICE_oceania_courtier_modifier_ancient_stories: "$RICE_oceania_courtier_modifier_island$ (Historias Antiguas)"
 RICE_oceania_courtier_modifier_ancient_stories_desc: "$RICE_oceania_courtier_modifier_island_desc$ sus leyendas y tradiciones, inculcándoles un mayor aprecio por la vida y la naturaleza."
 RICE_oceania_courtier_modifier_social_organization: "$RICE_oceania_courtier_modifier_island$ (Organización Social)"
 RICE_oceania_courtier_modifier_social_organization_desc: "$RICE_oceania_courtier_modifier_island_desc$ cómo funcionan sus comunidades, y cómo interactúan entre sí las personas de diferentes grupos.\n\n\n\n#Emp Obtienes [legitimacy_i|E] [legitimacy|E] adicional al tomar la [decision|E] de #V $RICE_oceania_meeting_houses_decision$#!, si se cumplen los demás requisitos para acceder a ella.#!"
