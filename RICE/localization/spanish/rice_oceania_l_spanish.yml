 oceania.0010.t:0 "Más Allá de los Confines de la Tierra"
 oceania.0010.desc:0 "El gran mar al este no es un páramo desolado de agua salada. Más allá de los confines de la tierra, hay islas y gente – y lo sabemos, porque esa gente ocasionalmente viene hacia el oeste.\n\nHaremos todo lo posible por difundir la noticia de que esos viajeros y aventureros de los mares orientales son bienvenidos en estas tierras, y que quienes deseen comerciar y compartir su conocimiento con nosotros encontrarán amigos en el [ROOT.Char.GetPrimaryTitle.GetBaseName]."
 oceania.0010.a:0 "¿Cuándo llegarán a nuestras costas, si es que lo hacen?"
