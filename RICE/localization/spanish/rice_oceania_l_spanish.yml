 RICE_oceania_courtier_modifier_political_leadership_desc: "$RICE_oceania_courtier_modifier_island_desc$ cómo se organizan políticamente sus comunidades y lo que consideran un buen liderazgo."
 RICE_oceania_courtier_modifier_spiritual_restrictions: "$RICE_oceania_courtier_modifier_island$ (Restricciones Espirituales)"
 RICE_oceania_courtier_modifier_spiritual_restrictions_desc: "$RICE_oceania_courtier_modifier_island_desc$ sus tabúes culturales y religiosos, así como otros tipos de prohibiciones y normas de comportamiento."
 RICE_oceania_courtier_modifier_consequential_feasts: "$RICE_oceania_courtier_modifier_island$ (Festines Trascendentales)"
 RICE_oceania_courtier_modifier_consequential_feasts_desc: "$RICE_oceania_courtier_modifier_island_desc$ la costumbre de sus líderes de utilizar grandes festines con fines rituales, espirituales y políticos."
 RICE_oceania_courtier_modifier_dance_ceremonies: "$RICE_oceania_courtier_modifier_island$ (Ceremonias de Danza)"
 RICE_oceania_courtier_modifier_dance_ceremonies_desc: "$RICE_oceania_courtier_modifier_island_desc$ sus tradiciones de danza, particularmente aquellas con importancia ritual."
 RICE_oceania_courtier_modifier_oceanic_cuisine: "$RICE_oceania_courtier_modifier_island$ (Cocina Oceánica)"
 RICE_oceania_courtier_modifier_oceanic_cuisine_desc: "$RICE_oceania_courtier_modifier_island_desc$ la cocina de estos pueblos, incluyendo sus métodos de cocción y los ingredientes que suelen utilizar."
 RICE_oceania_courtier_modifier_herbal_medicine: "$RICE_oceania_courtier_modifier_island$ (Medicina Herbolaria)"
 RICE_oceania_courtier_modifier_herbal_medicine_desc: "$RICE_oceania_courtier_modifier_island_desc$ las prácticas medicinales tradicionales de estos pueblos."
 RICE_oceania_courtier_modifier_oceanic_stargazing: "$RICE_oceania_courtier_modifier_island$ (Observación Estelar Oceánica)"
 RICE_oceania_courtier_modifier_oceanic_stargazing_desc: "$RICE_oceania_courtier_modifier_island_desc$ sus conocimientos astronómicos, que son útiles para navegar por las tierras y mares del Pacífico."
 RICE_oceania_courtier_modifier_artwork: "$RICE_oceania_courtier_modifier_island$ (Arte)"
