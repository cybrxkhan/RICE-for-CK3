 # Struggle Ending Decisions
 
 # Decisions
RICE_oceania_quarry_stone_money:0 "Extraer piedras de dinero"
RICE_oceania_quarry_stone_money_tooltip:0 "Las [Glossary( 'Rai stones', 'YAP_STONE_MONEY_GLOSS' )] son la forma de mostrar el valor y el estatus de uno en la sociedad."
RICE_oceania_quarry_stone_money_desc:0 "Las [Glossary( 'Rai stones', 'YAP_STONE_MONEY_GLOSS' )] utilizadas en nuestra sociedad se adquieren de islas o tierras específicas en expediciones marítimas. Su valor aumenta cuanto más peligroso y arriesgado fue el viaje."
RICE_oceania_quarry_stone_money_effect_tooltip_1:1 "Tienes un #V [GetPlayer.MakeScope.ScriptValue('RICE_oceania_stone_money_success_chance')|0]%#! de posibilidades de éxito, influenciado por tus [traits|E] y [skills|E], especialmente por la [diplomacy_i|E] [diplomacy|E] y la [stewardship_i|E] [stewardship|E]."
RICE_oceania_quarry_stone_money_effect_tooltip_2:1 "Podrías #N perder#! a algunos tripulantes, influenciado por tus [traits|E] y [skills|E], especialmente por la [martial_i|E] [martial|E] y el [learning_i|E] [learning|E]"
RICE_oceania_quarry_stone_money_effect_tooltip_3:1 "Al inicio de la expedición, puedes gastar [gold_i|E] [gold|E] adicional para aumentar las posibilidades de éxito y supervivencia de la tripulación."
RICE_oceania_quarry_stone_money_effect_tooltip_4:1 "Si tienes éxito, ganarás una cantidad aleatoria de [prestige_i|E|E] [prestige|E] (hasta #V [prestige_i|E] [GetPlayer.MakeScope.ScriptValue('RICE_oceania_stone_money_max_prestige_gain_value')|0]#!), [gold_i|E] [gold|E] (hasta #V [gold_i|E] [GetPlayer.MakeScope.ScriptValue('RICE_oceania_stone_money_max_gold_gain_display_value')|0]#!) y [trait_level_track_xp|E] en el [trait|E] [GetTrait('RICE_stone_money').GetName( GetNullCharacter )|U] (hasta #V [GetPlayer.MakeScope.ScriptValue('RICE_oceania_stone_money_large_trait_xp_gain_value')|0]#!)"
RICE_oceania_quarry_stone_money_effect_tooltip_5:1 "La cantidad de tripulantes que mueren influye en cuánto [gold_i|E] [gold|E], [prestige_i|E] [prestige|E] y [trait_level_track_xp|E] en el [trait|E] [GetTrait('RICE_stone_money').GetName( GetNullCharacter )|U] obtienes, al #N coste#! de [piety_i|E] [piety|E]"
RICE_oceania_quarry_stone_money_confirm:0 "Algunos pueden morir, ¡pero es un sacrificio que estamos dispuestos a hacer!"
RICE_oceania_quarry_stone_money_context_tooltip:0 "#emphasis Contexto Histórico:#! $YAP_STONE_MONEY_GLOSS$"
RICE_stress_loss_chew_betel_nuts_decision:0 "Masticar Nueces de Betel"
RICE_stress_loss_chew_betel_nuts_decision_tooltip:1 "Masticar nueces de betel es una forma de perder [stress_loss_i|E] [stress|E]...."
RICE_stress_loss_chew_betel_nuts_decision_desc:0 "Todo lo que necesito hacer es masticar algunas nueces de betel, y me sentiré con energía, eufórico y con una agradable sensación de calor. Solo tendré que tener cuidado con dónde escupo."
RICE_stress_loss_chew_betel_nuts_decision_effect_tooltip_1:1 "Hay una pequeña probabilidad de que obtengas el [trait|E] [GetTrait('betel_chewer').GetName( GetNullCharacter )|U]. Esta cantidad aumenta cada vez que tomas esta [decision|E]."
RICE_stress_loss_chew_betel_nuts_decision_confirm:0 "¡Hora de masticar betel!"
RICE_stress_loss_chew_betel_nuts_decision_context_tooltip:0 "#emphasis Contexto Histórico:#! La práctica de masticar nueces de betel, que tiene un efecto estimulante y narcótico, ha estado muy extendida en gran parte de Asia y Oceanía durante miles de años. Es conocida por su adictividad y sus peligrosos efectos para la salud, que van desde manchas rojas en los dientes (a menudo consideradas antihigiénicas en las regiones donde es popular) hasta diversas formas de cáncer."
RICE_stress_loss_drink_kava_decision:0 "Beber Kava"
RICE_stress_loss_drink_kava_decision_tooltip:1 "Beber kava es una excelente manera de perder [stress_loss_i|E] [stress|E] y socializar con los demás."
RICE_stress_loss_drink_kava_decision_desc:0 "El kava es una bebida maravillosa que estimula la mente y es muy respetada por muchos. Nosotros, los [ROOT.Char.GetCulture.GetCollectiveNoun], la hemos consumido durante generaciones."
RICE_stress_loss_drink_kava_decision_effect_tooltip_1:1 "Hay una pequeña probabilidad de que obtengas el [trait|E] [GetTrait('RICE_kava_drinker').GetName( GetNullCharacter )|U]. Esta cantidad aumenta cada vez que tomas esta [decision|E]."
RICE_stress_loss_drink_kava_decision_confirm:0 "¡Reunámonos y disfrutemos de un poco de kava!"
RICE_stress_loss_drink_kava_decision_context_tooltip:0 "#emphasis Contexto Histórico:#! El kava es una bebida psicoactiva tradicional de gran parte de Oceanía, particularmente de Polinesia, Micronesia y Melanesia, y ha tenido un importante papel social, político y religioso para muchos de estos pueblos, aunque su función varía de un grupo a otro." 
RICE_oceania_recruit_biak_adventurers:0 "Conectar con Aventureros Biak"
RICE_oceania_recruit_biak_adventurers_tooltip:0 "Trabajar con aventureros [RICE_biak|E] para beneficio mutuo"
RICE_oceania_recruit_biak_adventurers_desc:0 "Los [RICE_biaks|E] audaces a veces navegan hasta las costas e islas de [GetGeographicalRegion('RICE_eastern_southeast_asia_region').GetName] en busca de aventuras. Apoyar sus empresas y trabajar con ellos podría resultar ventajoso para ambas partes."
RICE_oceania_recruit_biak_adventurers_desc_biak:0 "Nosotros, los [RICE_biaks|E] audaces, a veces navegamos más allá de nuestras tierras natales en busca de aventuras. Encontrar amigos [RICE_biak|E] con ideas afines con los que trabajar podría resultar ventajoso para ambas partes."
RICE_oceania_recruit_biak_adventurers_effect_warriors_tooltip_1:1 "Obtienes el [modifier|E] [GetModifier('RICE_oceania_ties_with_biak_warriors').GetNameWithTooltip] y algunas [soldier_i] [special_troops|E] (dependiendo de cuánto [gold_i|E] [gold|E] adicional estés dispuesto a ofrecerles)"
RICE_oceania_recruit_biak_adventurers_effect_warriors_tooltip_2:1 "Mientras los [modifiers|E] estén activos, puedes recibir eventos aleatorios que otorgan diferentes bonificaciones como [gold_i|E] [gold|E], [soldier_i] [special_troops|E], [control_i|E] [control|E], [courtiers|E], ¡y más!"
RICE_oceania_recruit_biak_adventurers_effect_traders_tooltip_1:1 "Obtienes el [modifier|E] [GetModifier('RICE_oceania_ties_with_biak_traders').GetNameWithTooltip] y [legitimacy_i|E] [legitimacy|E], [barter_goods_i] [barter_goods|E], [provisions_i|E] [provisions|E] o [prestige_i|E] [prestige|E] (dependiendo de tu [government|E] y de cuánto [gold_i|E] [gold|E] adicional estés dispuesto a ofrecerles)"
RICE_oceania_recruit_biak_adventurers_effect_traders_tooltip_2:1 "Mientras los [modifiers|E] estén activos, puedes recibir eventos aleatorios que otorgan diferentes bonificaciones como [gold_i|E] [gold|E], [prestige_i|E] [prestige|E], [development_i|E] [development|E], [courtiers|E], ¡y más!"
RICE_oceania_recruit_biak_adventurers_effect_general_tooltip_1:1 "¡Los [RICE_biaks|E] pueden exigir [gold|E] adicional o incluso [titles|E] y reaccionar mal si las negociaciones fallan!"
RICE_oceania_recruit_biak_adventurers_confirm:0 "¡Contactar con estos aventureros!"
RICE_oceania_recruit_biak_adventurers_context_tooltip:0 "#emphasis Contexto Histórico:#! El pueblo Biak es originario de un archipiélago en el noroeste de Papúa. En la era moderna temprana, e incluso durante el período colonial holandés, desempeñaron un papel importante en la historia del este de Indonesia, y probablemente realizaron actividades similares durante la época medieval, si no antes. Los Biak eran grandes navegantes, que valoraban a aquellos capaces de navegar en busca de aventuras, ya sea para el comercio pacífico, el mantenimiento de vínculos diplomáticos con los sultanatos de las Molucas, incursiones despiadadas, el aprendizaje de nuevas ideas de otros, la colonización de islas lejanas, o todo esto."
RICE_oceania_recruit_biak_adventurers_type:0 "Elegir qué tipo de Aventureros [RICE_biak|E] reclutar"
RICE_oceania_recruit_biak_adventurers_type_gui:0 "$RICE_oceania_recruit_biak_adventurers_type$"
RICE_oceania_recruit_biak_adventurers_warriors_option:0 "#Bold Guerreros#!"
RICE_oceania_recruit_biak_adventurers_warriors_option_desc:0 "Invitar a aventureros militares"
RICE_oceania_recruit_biak_adventurers_warriors_option_tooltip:0 "#italic Navegando en sus veloces barcos [Glossary( 'wairon', 'WAIRON_GLOSS' )], los guerreros [RICE_biak|E] han infundido temor en los corazones de sus enemigos como piratas, cazadores de cabezas y feroces combatientes durante siglos. Sin embargo, algunos están dispuestos a trabajar para otros, ya sea por beneficio o por honor.#!"
RICE_oceania_recruit_biak_adventurers_traders_option:0 "#Bold Comerciantes#!"
RICE_oceania_recruit_biak_adventurers_traders_option_desc:0 "Invitar a aventureros militares"
RICE_oceania_recruit_biak_adventurers_traders_option_tooltip:0 "#italic Navegando en sus grandes barcos [Glossary( 'waimansusu', 'WAIMANSUSU_GLOSS' )], los comerciantes [RICE_biak|E] han transportado impresionantes cargas de mercancías a través de los mares durante siglos. Al hacerlo, han creado redes políticas y sociales, e incluso han establecido colonias en tierras lejanas.#!"
RICE_welcome_visitors_from_oceania:0 "Dar la Bienvenida a Visitantes de Oceanía"
RICE_welcome_visitors_from_oceania_tooltip:1 "Who might we encounter from the vast ocean to the east?"
RICE_welcome_visitors_from_oceania_desc:0 "Hay tierras e islas al este, a través de los vastos mares. Aunque lejanas, hay gente que vive allí. ¿Podrían ser útiles para nosotros su sabiduría y conocimiento?"
RICE_welcome_visitors_from_oceania_effect_tooltip_1:1 "Las posibilidades de que aparezcan [courtiers|E] [RICE_oceanic|E] aumentan mientras el [modifier|E] esté activo"
RICE_welcome_visitors_from_oceania_effect_tooltip_2:1 "Hay una pequeña probabilidad de garantizar un evento que genere un [courtier|E] [RICE_oceania|E]"
RICE_welcome_visitors_from_oceania_confirm:0 "¡Intentemos contactar con ellos!"
RICE_welcome_visitors_from_oceania_context_tooltip:0 "#emphasis Contexto Histórico:#! Existen algunas evidencias de contactos limitados entre los pueblos de Oceanía y el resto del Viejo Mundo antes del período colonial, como pruebas de comercio esporádico entre islas como Yap o Biak y el interior de Papúa y el resto de Indonesia. Incluso hay un creciente y prometedor conjunto de evidencias que sugieren contactos ocasionales entre algunos pueblos indígenas del norte de Australia y los indonesios, aunque el alcance de este contacto es objeto de debate en el ámbito académico." 
RICE_oceania_meeting_houses_decision:0 "Apoyar Casas de Reunión Comunales"
RICE_oceania_meeting_houses_decision_palauan:0 "Apoyar Clubes Jerarquizados"
RICE_oceania_meeting_houses_decision_tooltip:1 "Apoyemos los cimientos de nuestra sociedad."
RICE_oceania_meeting_houses_decision_desc:0 "Durante generaciones, los [GetPlayer.GetCulture.GetCollectiveNoun] han construido casas de reunión comunales cuya importancia ritual, social, económica y política las convierte en el centro de la vida de nuestro pueblo. Apoyar estas casas de reunión, y a quienes las utilizan, aumentará mi popularidad y autoridad como [GetPlayer.GetTitleAsNameNoTooltip]."
RICE_oceania_meeting_houses_decision_palauan_desc:0 "Durante generaciones, los [GetPlayer.GetCulture.GetCollectiveNoun] han organizado nuestras comunidades a través de [Glossary( 'cheldebechel', 'CHELDEBECHEL_GLOSS' )], o clubes jerarquizados. Apoyar estos clubes y sus actividades aumentará mi popularidad y autoridad como [GetPlayer.GetTitleAsNameNoTooltip]."
RICE_oceania_meeting_houses_decision_effect_tooltip_1:1 "Elegirás tu nivel de apoyo, que determinará cuánto [prestige_i|E] [prestige|E] y [legitimacy_i|E] [legitimacy|E] recibes, así como la duración del [character_modifier|E] que obtienes #weak (Coste mínimo: @gold_icon! #V [GetPlayer.MakeScope.ScriptValue('RICE_oceania_meeting_houses_cost_small')]#!)#!"
RICE_oceania_meeting_houses_decision_effect_tooltip_2:1 "Debido a que tienes la $tradition_RICE_palau_clubs_name$ [tradition|E], recibirás el máximo de [prestige_i|E] [prestige|E], [legitimacy_i|E] [legitimacy|E] y duración del [modifier|E] de esta [decision|E] en comparación con lo normal. También decidirás si apoyar a los [Glossary( 'cheldebechel', 'CHELDEBECHEL_GLOSS' )] masculinos o femeninos."
RICE_oceania_meeting_houses_decision_effect_tooltip_3:1 "El [ethos|E] de tu [culture_possessive|E] determina los efectos del [modifier|E] que obtienes"
RICE_oceania_meeting_houses_decision_confirm:0 "¡Somos un solo pueblo, una sola comunidad!"
RICE_oceania_meeting_houses_decision_context_tooltip:0 "#emphasis Contexto Histórico:#! En muchas culturas de habla austronesia, desde Indonesia y Polinesia, los salones de reunión comunales, aunque difieren en arquitectura y arte, desempeñan un papel importante en la vida tradicional como centro de las actividades e interacciones religiosas, rituales, sociales y políticas."

