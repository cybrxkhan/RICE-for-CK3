 oceania.0050.t:0 "Piedras Rai"
 oceania.0050.desc:0 "La posesión de [Glossary( 'rai stones', 'YAP_STONE_MONEY_GLOSS' )] es la forma en que los [yap_culture.GetCollectiveNoun] miden la riqueza y el valor de un [ROOT.Char.Custom('WomanManPossessive')]. Pero, ¿cómo se adquieren estas piedras, talladas en un tipo específico de piedra caliza?\n\nDe otras islas donde se puede encontrar dicha piedra caliza, por supuesto – particularmente de #italic Palaos#!. Ahora, estoy enviando una expedición al océano oriental para adquirir una de estas piedras para mí.\n\nLas expediciones para navegar hasta estas islas, obtener el permiso de los lugareños, adquirir estas piedras y regresar, han existido desde hace mucho tiempo. Son empresas arriesgadas, ya que la gente suele resultar herida o incluso muere. Sin embargo, el valor de una piedra no se debe únicamente a su tamaño, sino también a la historia que la acompaña, incluyendo el esfuerzo para adquirirla."
 oceania.0050.a:0 "Les deseo buena suerte a los miembros de la expedición."
 oceania.0050.b:0 "La expedición podría usar más recursos."
 oceania.0050.b.tooltip:0 "#bold Aumento menor#! #P de la cantidad#! de [gold_i|E] [gold|E] que podrías ganar y #bold reducción menor#! #V del número#! de tripulantes que probablemente morirían."
 oceania.0050.c:0 "La expedición podría usar #italic muchos#! más recursos."
 oceania.0050.c.tooltip:0 "#bold Aumento mayor#! #P de la cantidad#! de [gold_i|E] [gold|E] que podrías ganar y #bold reducción mayor#! #V del número#! de tripulantes que probablemente morirían."
 oceania.0051.t:0 "$oceania.0050.t$"
 oceania.0051.desc.success:0 "Mi expedición a los mares orientales para adquirir una [Glossary( 'rai stone', 'YAP_STONE_MONEY_GLOSS' )] ha regresado #P con éxito#!, ¡trayendo consigo una hermosa piedra grande, tallada y con forma de disco!\n\nCon el regreso de la tripulación, nos enteramos de su viaje y de las dificultades que experimentaron, desde navegar a través del océano hasta cómo negociaron con los lugareños para obtener la piedra.\n\n"
 oceania.0051.desc.failure:0 "Durante días, he sentido una sensación de inquietud con respecto a mi expedición a los mares orientales para adquirir una [Glossary( 'rai stone', 'YAP_STONE_MONEY_GLOSS' )] para mí. ¿Por qué no han regresado?\n\nHoy, he recibido un informe de que marineros locales han encontrado pruebas de que mi expedición #N nunca#! regresó.\n\n¡Qué desafortunado! Aunque nunca sabremos con certeza lo que sucedió en su viaje, al menos tenemos algún tipo de respuesta."
 oceania.0051.desc.low:0 "Las pérdidas fueron relativamente pequeñas, y la mayor parte de la tripulación regresó a salvo. Como esto hace que la historia sea menos interesante, la #italic piedra rai#! vale menos como resultado.\n\nNo obstante, todavía es posible que la #italic piedra rai#! aumente su valor con el tiempo, a medida que su historia oral crezca con relatos interesantes sobre sus propietarios."
 oceania.0051.desc.medium:0 "Hubo pérdidas moderadas entre la tripulación. Las muertes y lesiones no fueron demasiado excesivas, y estaban dentro del rango esperado para estas expediciones, y esto se ha tenido en cuenta en el valor de la #italic piedra rai#!.\n\nEn cualquier caso, el valor a largo plazo de la #italic piedra rai#! aún podría variar, a medida que su historia oral crezca con relatos interesantes sobre sus propietarios."
 oceania.0051.desc.high:0 "Las pérdidas entre la tripulación fueron inmensas. Fue un milagro que algunos incluso regresaran. Al menos esto significa que la #italic piedra rai#! vale mucho, gracias a la dramática historia de cómo fue adquirida.\n\nA pesar de esto, ¿quién sabe cuál será el valor a largo plazo de la #italic piedra rai#!? Comenzando con la dramática historia de cómo fue adquirida, tendremos que ver si la historia oral de sus propietarios es igual de fascinante."
 oceania.0051.a.failure:0 "Que [ROOT.Char.GetFaith.DeathDeityName] sea benévolo con sus espíritus…."
 oceania.0051.a.success:0 "¡Excelente trabajo! La tripulación fue realmente valiente y heroica."
