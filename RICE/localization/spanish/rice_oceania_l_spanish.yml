 RICE_oceania_meeting_house_communal: "Apoyó Casas de Reunión $ethos_communal_name$"
 RICE_oceania_turtle_hunter_modifier: "Cazador de Tortugas"
 RICE_oceania_turtle_hunter_modifier_desc: "Este personaje ha ganado un gran honor y estatus por cazar tortugas con éxito en las peligrosas aguas del mar."
 RICE_oceania_turtle_meat_and_shells: "Carne y Caparazones de Tortuga Marina"
 RICE_oceania_sago_pearls: "Disfrutando de Perlas de Sagú"
 RICE_oceania_sago_pearls_desc: "Últimamente, este personaje ha cogido gusto a comer platos en los que las [Glossary( 'sago pearls', 'SAGO_GLOSS' )] son el componente principal."
 RICE_oceania_sago_offerings: "Ofrendas de Sagú"
 RICE_oceania_sago_offerings_desc: "Se han dejado ofrendas de diversos alimentos, especialmente [Glossary( 'sago', 'SAGO_GLOSS' )], en varios lugares para conseguir la ayuda de espíritus benévolos."
 RICE_oceania_cockatoo_modifier: "Cacatúas Populares"
 RICE_oceania_cockatoo_modifier_desc: "Las aves cacatúa exportadas desde esta región son populares en otras regiones."
 RICE_oceania_supports_cockatoo_trade: "Apoya el Comercio de Cacatúas"
 RICE_oceania_harvesting_more_megapode_eggs: "Recolección Extensiva de Huevos de Megápodo"
 RICE_oceania_harvesting_more_megapode_eggs_desc: "Aquí ha habido un aumento en la recolección de huevos de [Glossary( 'megapode', 'MEGAPODE_GLOSS' )], a pesar de los rituales tradicionales que pretenden limitar cuántos huevos pueden recogerse."
 RICE_oceania_restrained_harvest_of_megapode_eggs: "Recolección Moderada de Huevos de Megápodo"
 RICE_oceania_restrained_harvest_of_megapode_eggs_desc: "A pesar de los llamamientos para aumentar la recolección de huevos de [Glossary( 'megapode', 'MEGAPODE_GLOSS' )] aquí, los líderes comunitarios han acordado seguir los rituales tradicionales que limitan cuántos huevos pueden recogerse."
 RICE_oceania_birds_of_paradise_modifier: "Exportaciones Lucrativas de Aves del Paraíso"
 RICE_oceania_ancestor_bonus_naval: "Bendiciones Ancestrales"
 RICE_oceania_ancestor_bonus_naval_desc: "Se cree que los antepasados de este personaje lo han bendecido con fuerza para luchar contra sus enemigos en la batalla."
 RICE_oceania_ancestor_bonus_mystical: "$RICE_oceania_ancestor_bonus_naval$"
 RICE_oceania_ancestor_bonus_mystical_desc: "Se cree que los antepasados de este personaje lo han bendecido para protegerlo de las intrigas enemigas."
 RICE_oceania_ancestor_bonus_prosperity: "$RICE_oceania_ancestor_bonus_naval$"
 RICE_oceania_ancestor_bonus_prosperity_desc: "Se cree que los antepasados de los gobernantes locales o líderes comunitarios han bendecido esta tierra con fertilidad y abundancia."
 
