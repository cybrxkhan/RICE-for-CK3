 # Custom Localization 

 # Game Concepts
game_concept_RICE_biaks:0 "Biaks"
game_concept_RICE_biak:0 "Biak"
game_concept_RICE_biak_desc:0 "[courtiers|E] of Biak [culture|E] may sometimes spawn on the southeast edge of the map. To represent the Biaks' historical adventures, there is a [decision|E] for [rulers|E] on the eastern edge of the map to #Bold $RICE_oceania_recruit_biak_adventurers$#! that allows characters on the eastern edge of the map to gain positive [modifiers|E] and other benefits from working with either Biak traders or warriors."
game_concept_RICE_papuans:0 "Papuans"
game_concept_RICE_papuan:0 "Papú"
game_concept_RICE_papua:0 "Papúa"
game_concept_RICE_papua_desc:0 "[courtiers|E] of Papuan origin may occasionally spawn on the southeast edge of the map. A number of Papuan groups historically had trade or diplomatic relations with Indonesian peoples to the west."
game_concept_RICE_micronesians:0 "Micronesios"
game_concept_RICE_micronesian:0 "Micronesio"
game_concept_RICE_micronesia:0 "Micronesia"
game_concept_RICE_micronesia_desc:0 "[courtiers|E] of Micronesian origin may occasionally spawn on the southeast edge of the map. Though sproadic, some Micronesian groups may have traded with or been in contact with communities in Indonesia and Papua."
game_concept_RICE_melanesians:0 "Melanesios"
game_concept_RICE_melanesian:0 "Melanesio"
game_concept_RICE_melanesia:0 "Melanesia"
game_concept_RICE_melanesia_desc:0 "[courtiers|E] of Melanesian origin may occasionally spawn on the southeast edge of the map. These diverse groups of peoples, living in both Papua and the islands of Melanesia, had contacts with a variety of peoples historically, including Polynesians, Micronesians, and Papuans."
game_concept_RICE_polynesians:0 "Polinesios"
game_concept_RICE_polynesian:0 "Polinesio"
game_concept_RICE_polynesia:0 "Polinesia"
game_concept_RICE_polynesia_desc:0 "An optional game rule allows for [courtiers|E] of Polynesian origin may very rarely spawn on the southeast edge of the map. During the medieval period, Polynesian communities had spread their influence across the Pacific, far into Melanesia and Polynesia, for instance, but not within the map's current borders."
game_concept_RICE_south_americans:0 "Sudamericanos"
game_concept_RICE_south_american:0 "Sudamericano"
game_concept_RICE_south_america:0 "Sudamérica"
game_concept_RICE_south_america_desc:0 "Through an optional game rule, [courtiers|E] of South American origin may very rarely spawn on the southeast edge of the map. Though there was no contact between South America and Indonesia and Papua in the Pre-Columbian period, there is a growing body of evidence suggesting potential contacts between Polynesians and South America."
game_concept_RICE_indigenous_australians:0 "Aborígenes Australianos"
game_concept_RICE_indigenous_australian:0 "Aborigen Australiano"
game_concept_RICE_australians:0 "Australianos"
game_concept_RICE_australian:0 "Australianos"
game_concept_RICE_australia:0 "Australia"
game_concept_RICE_australia_desc:0 "While Australia is off-map, [courtiers|E] of Indigenous Australian origin can very occasionally spawn on the southeast edge of the map. Historically, there is a growing body of evidence suggesting potential contacts between Indonesia and Australia before European colonization."
game_concept_RICE_oceanic:0 "Oceánico"
game_concept_RICE_oceania:0 "Oceanía"
game_concept_RICE_oceania_desc:0 "Oceanía abarca diversas masas terrestres e islas del Pacífico más allá del Sudeste Asiático marítimo.\n\nAunque la mayor parte está fuera del mapa en el juego, [courtiers|E] de diversas [cultures|E] y [faiths|E] oceánicas pueden aparecer en el borde sureste del mapa para representar los vínculos esporádicos que algunas de estas regiones tuvieron históricamente con el Sudeste Asiático. Estos eventos también te brindan la oportunidad de aprovechar el conocimiento de estos pueblos en forma de [modifiers|E] beneficiosos. La [decision|E] de #bold $RICE_welcome_visitors_from_oceania$#! aumenta las probabilidades de estos encuentros.\n\nPor defecto, los tipos de [courtiers|E] oceánicos que podrías ver dependen de tus reglas del juego, e incluyen:\n\n$EFFECT_LIST_BULLET$Ocasional: [RICE_papuan|E] occidental y [RICE_micronesian|E] occidental\n$EFFECT_LIST_BULLET$Raro: [RICE_papuan|E] central y [RICE_micronesian|E] central\n$EFFECT_LIST_BULLET$Muy Raro: [RICE_micronesian|E] oriental, [RICE_papuan|E] oriental, [RICE_indigenous_australian|E] y [RICE_melanesian|E] occidental\n$EFFECT_LIST_BULLET$Muy Raro con Regla del Juego: [RICE_polynesian|E] y [RICE_melanesian|E] oriental\n$EFFECT_LIST_BULLET$Extremadamente Raro con Regla del Juego: [RICE_south_american|E]"

 # Rules
rule_RICE_oceania_frequency:0 "Frecuencia de [courtiers|E] [RICE_oceanic|E] de RICE"
setting_RICE_oceania_frequency_rare:0 "Rara (Por Defecto)"
setting_RICE_oceania_frequency_rare_desc:0 "Los [courtiers|E] [RICE_oceanic|E] aparecen a la velocidad predeterminada en el borde sureste del mapa."
setting_RICE_oceania_frequency_uncommon:0 "#high Poco Común#!"
setting_RICE_oceania_frequency_uncommon_desc:0 "Los [courtiers|E] [RICE_oceanic|E] aparecen con mucha más frecuencia en el borde sureste del mapa, pero siguen siendo bastante poco comunes."
setting_RICE_oceania_frequency_common:0 "#high Común#!"
setting_RICE_oceania_frequency_common_desc:0 "Los [courtiers|E] [RICE_oceanic|E] aparecen con más frecuencia en el borde sureste del mapa, pero siguen siendo bastante poco comunes."
setting_RICE_oceania_frequency_off:0 "#high Desactivado#!"
setting_RICE_oceania_frequency_off_desc:0 "Los [courtiers|E] [RICE_oceanic|E] nunca aparecerán, ni siquiera aquellos que históricamente tendrían sentido. Esto anulará otras reglas del juego relacionadas."
rule_RICE_remote_oceania:0 "[courtiers|E] [RICE_oceanic|E] Remotos de RICE"
setting_RICE_remote_oceania_off:0 "Desactivado (Por Defecto)"
setting_RICE_remote_oceania_off_desc:0 "Los [courtiers|E] [RICE_polynesian|E] y [RICE_melanesian|E] orientales nunca aparecerán en el borde sureste del mapa."
setting_RICE_remote_oceania_on:0 "#high Activado#!"
setting_RICE_remote_oceania_on_desc:0 "Aunque son más raros que otros [courtiers|E] [RICE_oceanic|E], los [courtiers|E] [RICE_melanesian|E] orientales y [RICE_polynesian|E] pueden aparecer [Glossary( 'ahistorically', 'POLYNESIA_HISTORY_GLOSS' )] en el borde sureste del mapa."
rule_RICE_south_america:0 "[courtiers|E] [RICE_south_american|E] de RICE"
setting_RICE_south_america_off:0 "Desactivado (Por Defecto)"
setting_RICE_south_america_off_desc:0 "Los [courtiers|E] [RICE_south_american|E] nunca aparecerán en el borde sureste del mapa."
setting_RICE_south_america_on:0 "#high Activado#!"
setting_RICE_south_america_on_desc:0 "Aunque son más raros que los [courtiers|E] [RICE_oceanic|E], los [courtiers|E] [RICE_south_american|E] pueden aparecer [Glossary( 'ahistorically', 'SOUTH_AMERICA_HISTORY_GLOSS' )] en el borde sureste del mapa."
 
