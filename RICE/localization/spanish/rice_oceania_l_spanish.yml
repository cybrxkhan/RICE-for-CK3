 oceania.0045.t:0 "Abriendo el Sasi"
 oceania.0045.desc:0 "Hace algún tiempo, se aplicó un [Glossary( 'sasi', 'SASI_GLOSS' )] de agua en [sasi_open_county.GetNameNoTier], bajo la dirección de los líderes locales. Se prohibió a la gente explotar los recursos acuáticos afectados por el #italic sasi#! – hasta ahora.\n\nHoy, se celebró una ceremonia para indicar la apertura del #italic sasi#!. Esos recursos que permanecieron intactos se han repuesto en gran número durante ese tiempo."
 oceania.0045.a:0 "¡La paciencia ha resultado en una gran prosperidad para todos!"
 oceania.0046.t:0 "xxxxx"
 oceania.0046.desc:0 "xxxxx"
 oceania.0046.a:0 "xxxxx"
 oceania.0047.t:0 "$oceania.0045.t$"
 oceania.0047.desc:0 "Hace algún tiempo, se aplicó un [Glossary( 'sasi', 'SASI_GLOSS' )] de tierra en [sasi_open_county.GetNameNoTier], bajo la dirección de los líderes locales. Se prohibió a la gente explotar los recursos terrestres afectados por el #italic sasi#! – hasta ahora.\n\nHoy, se celebró una ceremonia para indicar la apertura del #italic sasi#!. Esos recursos que permanecieron intactos se han repuesto en gran número durante ese tiempo."
 oceania.0047.a:0 "$oceania.0045.a$"
