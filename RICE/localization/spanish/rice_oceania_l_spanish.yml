 # Activities
 activity_RICE_oceania_sasi_ceremony_host_an_a:0 "$host_activity_a$"
 activity_RICE_oceania_sasi_ceremony:0 "Ceremonia Sasi"
 activity_RICE_oceania_sasi_ceremony_desc:0 "Prohibiendo la recolección de recursos naturales en un área designada, podemos proteger nuestros recursos naturales. Quienes desobedezcan esta orden no solo pagarán una multa, sino que serán castigados por los espíritus enfurecidos de nuestros antepasados."
 activity_RICE_oceania_sasi_ceremony_selection_tooltip: "Iniciar la aplicación de un [Glossary( 'sasi', 'SASI_GLOSS' )] en un [county|E].\n\n$activity_RICE_oceania_sasi_ceremony_context_tooltip$"
 activity_RICE_oceania_sasi_ceremony_context_tooltip:0 "#emphasis Contexto Histórico:#! $SASI_GLOSS$"
 activity_RICE_oceania_sasi_ceremony_host_desc: "\n$BULLET_WITH_TAB$Ganas [piety_i] [piety|E]\n$BULLET_WITH_TAB$Ganas [prestige_i|E][prestige|E]\n$BULLET_WITH_TAB$Ganas [legitimacy_i|E][legitimacy|E] basado en el [development_i|E] [development|E] del [county|E]\n$BULLET_WITH_TAB$El [county|E] donde tiene lugar esta [activity|E] obtendrá el [modifier|E] [GetModifier('RICE_oceania_sasi_closed_modifier').GetNameWithTooltip], que será reemplazado tras #V 1-3#! años por el [modifier|E] [GetModifier('RICE_oceania_sasi_open_modifier').GetNameWithTooltip], más beneficioso, durante #V 10#! años" 
 activity_RICE_oceania_sasi_ceremony_guest_desc: "$activity_RICE_oceania_sasi_ceremony_host_desc$"
 activity_RICE_oceania_sasi_ceremony_province_desc: ""
 activity_RICE_oceania_sasi_ceremony_destination_selection: "$activity_RICE_oceania_sasi_ceremony_province_desc$"
 activity_RICE_oceania_sasi_ceremony_guest_help_text: "$activity_RICE_oceania_sasi_ceremony$"
 activity_RICE_oceania_sasi_ceremony_predicted_cost: "El coste de esta [activity|E] se basa principalmente en tus [income|E]."
 activity_RICE_oceania_sasi_ceremony_conclusion_desc: "La [GetActivityType( 'activity_RICE_oceania_sasi_ceremony' ).GetName] ha finalizado, y el Sasi ahora se está aplicando."
 RICE_oceania_sasi_ceremony_type: "Tipo de Ceremonia Sasi"
 RICE_oceania_sasi_ceremony_type_water: "Sasi de Agua"
 RICE_oceania_sasi_ceremony_type_water_desc: "Una vez que el [Glossary( 'sasi', 'SASI_GLOSS' )] se abre tras 1-3 años, el [ruler|E] del [county|E] afectado obtiene:\n\n$EFFECT_LIST_BULLET$Bonificación de [prestige_i|E|E] [prestige|E]\n$EFFECT_LIST_BULLET$El [modifier|E] [GetModifier('RICE_oceania_sasi_water_modifier').GetNameWithTooltip] en el [county|E]\n\n#weak Ya sea que el agua provenga del mar, de los ríos o de la lluvia, es lo que nutre la vida, por lo que debemos gestionar cuidadosamente cómo la utilizamos.#!"
 RICE_oceania_sasi_ceremony_type_land: "Sasi de Tierra"
 RICE_oceania_sasi_ceremony_type_land_desc: "Una vez que el [Glossary( 'sasi', 'SASI_GLOSS' )] se abre tras 1-3 años, el [ruler|E] del [county|E] afectado obtiene:\n\n$EFFECT_LIST_BULLET$Bonificación de [piety_i|E|E] [piety|E]\n$EFFECT_LIST_BULLET$El [modifier|E] [GetModifier('RICE_oceania_sasi_land_modifier').GetNameWithTooltip] en el [county|E]\n\n#weak Hacemos un gran uso de las plantas y animales de nuestras tierras para muchos fines, por lo que debemos tener cuidado con la cantidad de estos recursos que consumimos.#!"
 RICE_oceania_sasi_ceremony_prohibition_phase: "Prohibición"
 RICE_oceania_sasi_ceremony_prohibition_phase_desc: "La ceremonia del [Glossary( 'sasi', 'SASI_GLOSS' )] está en curso."
 RICE_oceania_sasi_ceremony_conservation_intent_header: "Conservación:"
 RICE_oceania_sasi_ceremony_conservation_intent: "Conservación"
 RICE_oceania_sasi_ceremony_conservation_intent_desc: "Enfatizar a todos los implicados la importancia de preservar nuestros recursos, bajo los auspicios de los espíritus. Obtienes [prestige_i|E] [prestige|E] adicional. Los personajes con [GetTrait('temperate').GetName( GetNullCharacter )|U], [GetTrait('patient').GetName( GetNullCharacter )|U] y [GetTrait('diligent').GetName( GetNullCharacter )] pierden [stress_loss_i|E] [stress|E] adicional."
 RICE_oceania_sasi_ceremony_ritual_intent_header: "Ritual:"
 RICE_oceania_sasi_ceremony_ritual_intent: "Ritual"
 RICE_oceania_sasi_ceremony_ritual_intent_desc: "Centrarse en mostrar respeto y concordia con los espíritus de la región a través de los rituales de esta ceremonia. Obtienes [piety_i|E] [piety|E] adicional. Los personajes con [GetTrait('zealous').GetName( GetNullCharacter )|U], [GetTrait('just').GetName( GetNullCharacter )|U] y [GetTrait('humble').GetName( GetNullCharacter )] pierden [stress_loss_i|E] [stress|E] adicional."
 RICE_oceania_sasi_ceremony_completed_log_title:0 "Ceremonia de Cierre del Sasi Completada"
 RICE_oceania_sasi_ceremony_completed_log:0 "[CHARACTER.GetShortUIName|U] finalizó la ceremonia de cierre del [Glossary( 'sasi', 'SASI_GLOSS' )]."
 TRAVEL_NAME_FOR_activity_RICE_oceania_sasi_ceremony:0 "[Character.GetFirstNamePossessiveNoTooltip] $activity_RICE_oceania_sasi_ceremony$"
 RICE_SASI_COUNTY_LABEL: "Aquí hay Restricciones Sasi"
 RICE_sasi_ceremony_story: "Cierre del Sasi"
 RICE_sasi_ceremony_story_desc: "Se ha aplicado un cierre de [Glossary( 'sasi', 'SASI_GLOSS' )]. Quienes exploten los recursos dentro del área restringida serán castigados, tanto en el mundo material como en el espiritual. Las restricciones se levantarán una vez que se celebre una ceremonia de Apertura del Sasi después de al menos un año."
 
 # Modifiers
 RICE_oceania_sasi_modifier:0 "Sasi"
 RICE_oceania_sasi_closed_modifier: "Sasi Cerrado"
 RICE_oceania_sasi_closed_modifier_desc: "Recientemente se celebró aquí una ceremonia de cierre del [Glossary( 'sasi', 'SASI_GLOSS' )]. El #italic Sasi#! está en vigor, y se prohíbe a la gente recolectar ciertos recursos."
 RICE_oceania_sasi_open_modifier: "Sasi Abierto"
 RICE_opinion_drank_kava_together: "Bebieron Kava Juntos"
 RICE_opinion_chewed_betel_nuts_together: "Masticaron Betel Juntos"
 RICE_oceania_sasi_water_modifier: "Ceremonia Sasi de Agua"
 RICE_oceania_sasi_water_modifier_desc: "Recientemente se celebró aquí una ceremonia de apertura de [Glossary( 'sasi', 'SASI_GLOSS' )] de agua. Debido a que se prohibió a la gente recolectar ciertos recursos acuáticos antes de que el #italic sasi#! se reabriera, los recursos se han repuesto durante ese tiempo."
 RICE_oceania_sasi_land_modifier: "Ceremonia Sasi de Tierra"
 RICE_oceania_sasi_land_modifier_desc: "Recientemente se celebró aquí una ceremonia de apertura de [Glossary( 'sasi', 'SASI_GLOSS' )] de tierra. Debido a que se prohibió a la gente recolectar ciertos recursos terrestres antes de que el #italic sasi#! se reabriera, los recursos se han repuesto durante ese tiempo."
 RICE_oceania_pacific_connections: "Vínculo Pacífico"
 RICE_oceania_pacific_connections_desc: "Este personaje tiene, o está tratando de mantener, un vínculo con los pueblos que habitan en Oceanía."
 RICE_oceania_palau_male_clubs_modifier: "Apoyó Clubes Masculinos Jerarquizados"
 RICE_oceania_palau_male_clubs_modifier_desc: "Este personaje ha proporcionado un apoyo significativo a los [Glossary( 'cheldebechel', 'CHELDEBECHEL_GLOSS' )] masculinos de su comunidad."
 RICE_oceania_palau_female_clubs_modifier: "Apoyó Clubes Femeninos Jerarquizados"
 RICE_oceania_palau_female_clubs_modifier_desc: "Este personaje ha proporcionado un apoyo significativo a los [Glossary( 'cheldebechel', 'CHELDEBECHEL_GLOSS' )] femeninos de su comunidad."
 RICE_oceania_ties_with_biak_warriors: "Vínculos con Guerreros Biak"
 RICE_oceania_ties_with_biak_warriors_desc: "Este personaje ha establecido conexiones con tribus Biak originarias de un archipiélago en el noroeste de Papúa, particularmente con los guerreros de estas tribus, que navegan para aterrorizar a sus enemigos en veloces barcos [Glossary( 'wairon', 'WAIRON_GLOSS' )]."
 RICE_oceania_ties_with_biak_traders: "Vínculos con Comerciantes Biak"
 RICE_oceania_ties_with_biak_traders_desc: "Este personaje ha establecido conexiones con tribus Biak originarias de un archipiélago en el noroeste de Papúa, particularmente con los comerciantes de estas tribus, que navegan para dedicarse al comercio y la diplomacia en grandes barcos [Glossary( 'waimansusu', 'WAIMANSUSU_GLOSS' )]."
 RICE_oceania_settled_biak_warriors: "Guerreros Biak Asentados"
 RICE_oceania_settled_biak_warriors_desc: "Esta región alberga una colonia de Biaks, originarios de un archipiélago en el noroeste de Papúa. Esta comunidad está dominada por temibles guerreros, que navegan para aterrorizar a sus enemigos en veloces barcos [Glossary( 'wairon', 'WAIRON_GLOSS' )]."
 RICE_oceania_settled_biak_traders: "Comerciantes Biak Asentados"
 RICE_oceania_settled_biak_traders_desc: "Esta región alberga una colonia de Biaks, originarios de un archipiélago en el noroeste de Papúa. Esta comunidad está dominada por intrépidos comerciantes, que navegan para dedicarse al comercio y la diplomacia en grandes barcos [Glossary( 'waimansusu', 'WAIMANSUSU_GLOSS' )]."
 RICE_oceania_biak_piracy_modifier: "Piratería Biak"
 RICE_oceania_biak_piracy_modifier_desc: "Esta región sufrió recientemente incursiones despiadadas por parte de piratas Biak, que llegaron desde su archipiélago natal en el noroeste de Papúa en veloces barcos [Glossary( 'wairon', 'WAIRON_GLOSS' )]."
