 oceania.0030.t:0 "El Viajero [courtier.GetCulture.GetNameNoTooltip]"
 oceania.0030.desc:0 "La llegada de un extranjero, que afirma haber viajado hasta aquí desde al otro lado de los océanos, ha causado cierto revuelo en [ROOT.Char.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTier].\n\nMe he reunido con esta sensacional figura, llamada [courtier.GetFirstName], que dice ser del pueblo [courtier.GetCulture.GetName]. Supuestamente, [courtier.GetHerHis] pueblo posee conocimientos, transmitidos por sus antepasados, que podrían ser de gran utilidad para nosotros…."
 oceania.0030.a:0 "Por favor, enséñanos lo que sabes."
 oceania.0030.b:0 "¿Quizás podrías trabajar para mí?"
 oceania.0030.c:0 "Un relato divertido, pero no me interesa."
