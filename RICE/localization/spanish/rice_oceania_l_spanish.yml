 oceania.0020.t:0 "Masticando Nueces de Betel"
 oceania.0020.desc:0 "¿Hay algo más placentero que masticar nueces de betel? Mastico, escupo y me siento relajado y a gusto…."
 oceania.0020.a:0 "Espero que mi boca no se ponga demasiado roja por esto."
 oceania.0021.t:0 "Adicto a la Nuez de Betel"
 oceania.0021.desc:0 "Dientes en descomposición manchados de rojo…. Daño en mis encías…. Y algo en mi cuerpo ya no se siente bien….\n\nAlgunos dicen que es porque mastico demasiadas nueces de betel. Pero no pueden tener razón, porque masticar nueces de betel me hace sentir mejor."
 oceania.0021.a:0 "¿Cómo puede ser malo?"
 oceania.0021.liege.message:0 "Un Nuevo Adicto al Betel"
 oceania.0022.t:0 "Bebiendo Kava"
 oceania.0022.desc:0 "Nos reunimos, como siempre lo hemos hecho nosotros y nuestros antepasados, sirviendo tazas llenas de kava para que todos disfruten. Bebemos por rondas, comenzando con aquellos de mayor estatus primero, y luego descendiendo hasta que todos hayan tenido su parte completa."
 oceania.0022.desc.ceremonial:0 "\n\nTodos entienden la importancia de ceremonias de kava como esta, que marcan ocasiones importantes. Hay una serie de rituales, gestos y procedimientos correctos que uno debe seguir, para honrar a nuestros antepasados y al [ROOT.Char.GetFaith.PantheonTerm]."
 oceania.0022.desc.medicinal:0 "\n\nNuestros antepasados conocían las propiedades curativas del kava, que nos han transmitido. Al beber kava juntos así, podemos aprovechar sus beneficios medicinales de forma colectiva."
 oceania.0022.desc.social:0 "\n\nMientras lo hacemos, hablamos de todo tipo de cosas, compartiendo unos con otros las alegrías y tristezas de la vida. ¡No hay nada que nos una más que el kava!"
 oceania.0022.a:0 "El kava es una cosa maravillosa."
 oceania.0023.t:0 "$oceania.0022.t$"
 oceania.0023.desc:0 "Me he hecho conocido por mi entusiasmo y apoyo a beber kava. ¡Es bueno saber que todos saben que valoro esta antigua bebida nuestra!"
 oceania.0023.a:0 "¡Ven! ¡Bebamos un poco de kava!"
 oceania.0023.liege.message:0 "Renombrado Bebedor de Kava"
 oceania.0024.t:0 "Casas de Reunión de los [ROOT.Char.GetCulture.GetNameNoTooltip]"
 oceania.0024.t.palauan:0 "Los Cheldebechel de los [ROOT.Char.GetCulture.GetNameNoTooltip]"
 oceania.0024.desc.intro:0 "Las casas de reunión comunales han desempeñado un papel clave en la sociedad de los [ROOT.Char.GetCulture.GetName] durante generaciones."
 oceania.0024.desc.normal:0 "\n\nComo [GetPlayer.GetTitleAsNameNoTooltip], es mi deber seguir apoyando estas casas de reunión de diversas maneras. Podría contribuir con recursos para reuniones religiosas rituales, para festines y otras ceremonias políticas, o para materiales para mantener y reconstruir la arquitectura y el arte de estas estructuras."
 oceania.0024.desc.palauan:0 "A menudo sirven como lugares de encuentro donde los miembros de los [Glossary( 'cheldebechel', 'CHELDEBECHEL_GLOSS' )] interactúan o realizan negocios.\n\nComo [GetPlayer.GetTitleAsNameNoTooltip], tengo los medios para apoyar a estos #italic cheldebechel#!. Tanto los clubes jerarquizados de hombres como los de mujeres desempeñan un papel clave en nuestras comunidades."
 oceania.0024.a:0 "Apoyar reuniones religiosas rituales"
 oceania.0024.b:0 "Apoyar festines y otras ceremonias políticas"
 oceania.0024.c:0 "Apoyar el mantenimiento y la construcción de estos salones"
 oceania.0024.d:0 "Apoyar los clubes de hombres"
 oceania.0024.e:0 "Apoyar los clubes de mujeres"
