 oceania.0080.t:0 "El Cazador de Tortugas"
 oceania.0080.desc:0 "Un joven [local_culture.GetName] [hunter.GetWomanMan] llamado [hunter.GetFirstName] se ha presentado ante mí, con una tortuga que [hunter.GetSheHe] mismo mató en un viaje reciente al mar.\n\nLos [local_culture.GetCollectiveNounNoTooltip] valoran estas majestuosas criaturas, y solo los valientes y dignos son capaces de abatirlas y compartir su carne y caparazones con todos.\n\nQue [hunter.GetFirstNameNoTooltip] me presente esto es un gran regalo, y está claro que [hunter.GetSheHe] busca reconocimiento por [hunter.GetHerHis] hazaña."
 oceania.0080.a:0 "Un buen regalo, pero cazar tortugas no merece reconocimiento."
 oceania.0080.b:0 "Gracias: ¡tu audaz valentía será ampliamente celebrada!"
 oceania.0080.c:0 "Necesito los servicios de [hunter.GetWomenMen] valientes como tú."
 oceania.0080.info:0 "#emphasis Contexto Histórico:#! La caza de tortugas se ha practicado tradicionalmente en todo el mundo, y a menudo conlleva importantes funciones rituales o sociales debido al desafío que supone cazar al animal y al hecho de que su carne suele considerarse un manjar. En muchas comunidades de Oceanía, por ejemplo, la caza de tortugas puede considerarse un signo de generosidad (al ofrecer la carne a otros) y una muestra de valentía y hombría."
 oceania.0081.t:0 "Cantar y Bailar o Morir"
 oceania.0081.desc:0 "Hay un viejo dicho entre nuestro pueblo, los [ROOT.Char.GetCulture.GetName]: \"Si no cantas y bailas, mueres\".\n\nNo en un sentido literal, por supuesto; más bien, realizar danzas y canciones, particularmente en ceremonias importantes – ¿no es esta la esencia de la humanidad? ¿De vivir en comunidad con otros?"
 oceania.0081.a:0 "Ciertamente. Así es."
 oceania.0081.b:0 "En su mayor parte sí, pero no siempre."
 oceania.0082.t:0 "Perlas de Sagú"
 oceania.0082.desc:0 "Mis sirvientes me han preparado un cuenco fresco de [Glossary( 'sago pearls', 'SAGO_GLOSS' )] mezclado con leche de coco y azúcar. ¡Un acompañamiento refrescante para mí durante el cálido día aquí en [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier]!"
 oceania.0082.a:0 "¡Ah! ¡Qué refrescante!"
 oceania.0083.t:0 "Ofrendas de Sagú"
 oceania.0083.desc:0 "Mi [chaplain.GetCouncilTitle], [chaplain.GetFirstName], me ha informado de un asunto importante relacionado con algunos espíritus locales. [chaplain.GetSheHe] ha discernido que hay varios espíritus en las partes boscosas y salvajes de [county.GetNameNoTier] que podrían ser aplacados si les ofrecemos [Glossary( 'sago', 'SAGO_GLOSS' )] junto con otros alimentos, de la manera tradicional [ROOT.Char.GetFaith.GetAdjective].\n\nSi están satisfechos con el #italic sagú#!, cree [chaplain.GetFirstNameNoTooltip], podrían incluso ayudarnos de diversas maneras invisibles."
 oceania.0083.a:0 "¡Buena idea! Hagámoslo."
 oceania.0083.b:0 "No necesitamos la ayuda de los espíritus."
 oceania.0084.t:0 "Aves Cacatúa"
 oceania.0084.desc:0 "Hace algún tiempo, para evaluar mejor las condiciones económicas de mi reino, solicité a los comerciantes que operaban en [county.GetNameNoTier] que me proporcionaran informes sobre sus actividades comerciales y qué bienes importaban o exportaban.\n\nCuriosamente, parece que las aves cacatúa son una exportación popular de [county.GetNameNoTierNoTooltip]. Investigué más sobre por qué era así, y los comerciantes dijeron que, a pesar del reducido número de cacatúas que se exportan, son muy populares entre las élites adineradas de otras tierras debido a su naturaleza afectuosa y su capacidad para imitar el habla humana."
 oceania.0084.a:0 "¡Qué fascinante! Me alegra oír eso."
 oceania.0084.b:0 "Deberían intentar capturar y vender más."
 oceania.0084.info:0 "#emphasis Contexto Histórico:#! Las cacatúas han sido exportadas y admiradas como aves exóticas durante muchos siglos fuera de sus tierras natales. Su representación más antigua en Europa se encuentra en el libro de cetrería #italic De arte venandi cum avibus#! del emperador del Sacro Imperio Romano Germánico Federico II en el siglo XIII; como otro ejemplo, en el Japón de la era moderna temprana, a veces se representaban en pinturas religiosas budistas."
 oceania.0085.t:0 "Ave del Paraíso"
 oceania.0085.desc:0 "Las plumas del ave del paraíso han sido una exportación lucrativa durante siglos, si no más tiempo. Recientemente, la calidad de las plumas de estas aves cazadas en [county.GetNameNoTier] ha ganado cierta fama, y se venden a precios más altos de lo normal."
 oceania.0085.a:0 "¡Excelentes noticias!"
 oceania.0085.info:0 "#emphasis Contexto Histórico:#! La caza del ave del paraíso por sus plumas tiene una larga historia. Aunque estas aves solo se encuentran en Nueva Guinea, las Molucas y Australia, sus plumas se comercializaban ampliamente en todo el Viejo Mundo, desde China hasta Oriente Medio y Europa. Por ejemplo, se tiene constancia de que los caballeros medievales europeos llevaban estas plumas en sus cascos."
 oceania.0086.t:0 "$travel_event_prefix$ Un Casuario"
 oceania.0086.desc:0 "“¡Cuidado ahí!” proclama [traveler.GetTitledFirstName]. “¡No te acerques demasiado a esa cosa!”\n\nNuestro viaje en [ROOT.Char.GetCurrentLocation.GetName] se detuvo cuando nos topamos con un ave no voladora de plumaje oscuro, cara colorida y mirada seria y acerada. Su tamaño, aproximadamente el de un humano pequeño, era evidente incluso desde la distancia.\n\n“Los casuarios son aves peligrosas”, dice [traveler.GetFirstNameNoTooltip], haciendo un gesto para que nos alejemos del animal. “Pueden arrancarte el cuello con esas garras. Deberíamos rodearlo”."
 oceania.0086.a:0 "No da tanto miedo, ¡y tenemos armas!"
 oceania.0086.b:0 "Más vale prevenir que curar. Rodeémoslo."
 oceania.0087.t:0 "Huevos de Megápodo"
 oceania.0087.desc:0 "Se pueden encontrar varios tipos de aves [Glossary( 'megapode', 'MEGAPODE_GLOSS' )] en toda [county.GetNameNoTier].\n\nDado que sus huevos son manjares y símbolos de estatus para los [county_culture.GetCollectiveNoun] locales, sus lugares de anidación están tradicionalmente protegidos; la gente solo puede recolectar sus huevos bajo ciertas condiciones rituales para garantizar un suministro constante y a largo plazo de huevos.\n\nSin embargo, recientemente ha habido disputas entre los lugareños sobre cuántos huevos #italic podrían#! recolectar. Algunos argumentan que deberían recolectarse más huevos como alimento y como obsequios para construir relaciones. Otros dicen que tal codicia es vergonzosa y va en contra de las costumbres rituales relacionadas con estos huevos."
 oceania.0087.a:0 "¡Recolectar más huevos!"
 oceania.0087.b:0 "No necesitamos más huevos."
