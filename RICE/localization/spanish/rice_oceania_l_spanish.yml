 # Buildings
 building_type_RICE_oceania_caves_of_fakfak:0 "Cuevas de Fakfak"
 building_type_RICE_oceania_caves_of_fakfak_desc:0 "Muchas cuevas y acantilados a lo largo de la costa de la región de Fakfak, en el extremo occidental de la península de Bomberai, están decorados con antiguos grabados rupestres de figuras animales y humanas y manos estampadas. Conocidas como pinturas de sangre debido a la pintura roja utilizada en estas obras de arte, los lugareños creen que son obra de sus antepasados lejanos, para marcar estos lugares como sitios de adoración a espíritus benévolos y para enterrar a sus muertos."
 building_RICE_oceania_caves_of_fakfak:0 "$building_type_RICE_oceania_caves_of_fakfak$"
 building_RICE_oceania_caves_of_fakfak_desc:0 "$building_type_RICE_oceania_caves_of_fakfak_desc$"
 building_type_RICE_oceania_kabui_bay:0 "Bahía de Kabui"
 building_type_RICE_oceania_kabui_bay_desc:0 "Las islas Raja Ampat albergan numerosos lugares de gran belleza visual, incluida la Bahía de Kabui, que está llena de impresionantes islas kársticas y separa las islas de Waigeo y Gam. Este sitio prístino, un tapiz de verdes y azules vibrantes, y coloridos follajes y corales, está asociado con leyendas populares y se dice que es el origen de la población local. En ocasiones, el entorno que rodea la bahía también se ha utilizado como refugio para entierros."
 building_RICE_oceania_kabui_bay:0 "$building_type_RICE_oceania_kabui_bay$"
 building_RICE_oceania_kabui_bay_desc:0 "$building_type_RICE_oceania_kabui_bay_desc$"
 
 # Traits
 trait_RICE_stone_money:0 "Propietario de Piedra Rai"
 trait_RICE_stone_money_desc:0 "Este personaje posee al menos un [Glossary( 'rai stone', 'YAP_STONE_MONEY_GLOSS' )] de valor modesto, según consta en la tradición oral."
 trait_RICE_stone_money_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] posee al menos un [Glossary( 'rai stone', 'YAP_STONE_MONEY_GLOSS' )] de valor modesto, según consta en la tradición oral."
 trait_RICE_stone_money_2:0 "Propietario de Piedra Rai"
 trait_RICE_stone_money_2_desc:0 "Este personaje posee [Glossary( 'rai stones', 'YAP_STONE_MONEY_GLOSS' )] de valor considerable, según consta en la tradición oral."
 trait_RICE_stone_money_2_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] posee [Glossary( 'rai stones', 'YAP_STONE_MONEY_GLOSS' )] de valor considerable, según consta en la tradición oral."
 trait_RICE_stone_money_3:0 "Magnate de Piedra Rai"
 trait_RICE_stone_money_3_desc:0 "Este personaje posee [Glossary( 'rai stones', 'YAP_STONE_MONEY_GLOSS' )] de valor notable y elevado, según consta en la tradición oral."
 trait_RICE_stone_money_3_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] posee [Glossary( 'rai stones', 'YAP_STONE_MONEY_GLOSS' )] de valor notable y elevado, según consta en la tradición oral."
 trait_RICE_stone_money_4:0 "Magnate de Piedra Rai"
 trait_RICE_stone_money_4_desc:0 "Este personaje ha acumulado una de las colecciones de [Glossary( 'rai stones', 'YAP_STONE_MONEY_GLOSS' )] más valiosas, si no la que más, de entre todos los vivos, según consta en la tradición oral."
 trait_RICE_stone_money_4_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] ha acumulado una de las colecciones de [Glossary( 'rai stones', 'YAP_STONE_MONEY_GLOSS' )] más valiosas, si no la que más, de entre todos los vivos, según consta en la tradición oral."
 trait_track_RICE_stone_money:0 "$trait_RICE_stone_money$"
 trait_track_RICE_stone_money_desc:0 "El valor de cada [Glossary( 'rai stone', 'YAP_STONE_MONEY_GLOSS' )] se basa no solo en el tamaño y la cantidad de la piedra, sino también en el estatus de su propietario, su historia, como los peligros que la gente corrió para adquirirla en primer lugar, y sus propietarios anteriores."
 trait_betel_chewer:0 "Masticador de Betel"
 trait_betel_chewer_desc:0 "Este personaje pasa una cantidad desmedida de tiempo sin hacer más que masticar nueces de betel, y sus dientes suelen estar manchados de rojo debido a su adicción."
 trait_betel_chewer_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] pasa una cantidad desmedida de tiempo sin hacer más que masticar nueces de betel, y [ROOT.GetCharacter.GetHerHis] dientes suelen estar manchados de rojo debido a [ROOT.GetCharacter.GetHerHis] adicción."
 trait_RICE_kava_drinker:0 "Bebedor de Kava"
 trait_RICE_kava_drinker_desc:0 "Este personaje es conocido por disfrutar del kava, sin importar la ocasión. Bebe hasta saciarse, ya sea con la familia, los amigos o los extraños."
 trait_RICE_kava_drinker_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] es conocido por disfrutar del kava, sin importar la ocasión. [ROOT.GetCharacter.GetSheHe|U] bebe hasta saciarse, ya sea con la familia, los amigos o los extraños."
 
