yaambism:0 "Ya'ambismo"
yaambism_adj:0 "Ya'ambista"
yaambism_adherent:0 "Ya'ambista"
yaambism_adherent_plural:0 "Ya'ambistas"
yaambism_desc:0 "El pueblo de la región del Sepik cree en los dos caminos —o Ya'amb de la vida. Uno que alberga las vidas de los hombres, y otro el de los espíritus. El pueblo de la región del Sepik cree que descienden de aldeas míticas, invisibles a simple vista, que residen en el camino del reino espiritual."

bis:0 "Bis"
bis_adj:0 "Bis"
bis_adherent:0 "Bisiano"
bis_adherent_plural:0 "Bisianos"
bis_desc:0 "Para los asmat, el reino espiritual y el reino físico están entrelazados, incluso en asuntos relacionados con la vida cotidiana —ya que los espíritus pueden ser aplacados o enfurecidos por medios terrenales. Los asmat creen que los espíritus residen en todas partes, no solo dentro de los límites de las aldeas, sino que se extienden a las montañas, los ríos y los mares. Este sistema de creencias creó un gran tema de reciprocidad y renovación predominante en las prácticas de las tribus asmat."

