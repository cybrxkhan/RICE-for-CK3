l_spanish:

CHELDEBECHEL_GLOSS: "Tradicionalmente en Palaos, los #bold Cheldebechel#! eran clubes formales que desempeñaban un importante papel social en la nación micronesia de Palaos. Estaban organizados por edad y género, y tenían diversas funciones, como educar a las generaciones más jóvenes sobre sus roles en la sociedad, recaudar mano de obra para proyectos de obras públicas, hacer cumplir las leyes y proteger los intereses económicos y militares de la comunidad, entre otras."
BITANG_ME_A_BITANG_GLOSS: "El principio de #bold bitang me a bitang#!, que significa \"mitad y mitad\" o \"este lado y ese lado\", es un concepto dualista de Palaos, donde cada entidad está conceptualmente equilibrada entre dos lados opuestos pero complementarios y conectados. Por ejemplo, una persona no se considera buena ni mala, sino ambas. En términos más prácticos, esto afectó a la cultura tradicional de Palaos de muchas maneras; los linajes de los clanes se dividían en dos grupos, los pueblos se dividían geográficamente en dos partes, y las interacciones políticas también se basaban en este principio."
KWARAAE_WARRIOR_GHOSTS_GLOSS: "Los Kwaraʼae, el grupo indígena más grande de la isla de Malaita en las islas Salomón, tradicionalmente tenían una gran reverencia por los fantasmas. Quienes seguían las reglas adecuadas de \"vivir para los fantasmas\" podían rezarles para obtener su apoyo. Los guerreros incluso podían invocar fantasmas guerreros (#italic akalo ramo'a#!), también conocidos como fantasmas de guerra (#italic akalo ni mae#!), que en su día fueron guerreros famosos, para que los apoyaran en sus disputas y conflictos contra comunidades o clanes rivales. Se creía que, mientras usaban estos poderes, los hombres debían evitar la presencia de mujeres, que podían neutralizar dichos poderes."
SASI_GLOSS: "En partes del este de Indonesia y Papúa, existe una costumbre tradicional de conservación de recursos conocida a menudo como #bold Sasi#! (aunque se conoce por varios nombres en diferentes idiomas, el término Sasi, que proviene de las islas Molucas, se utiliza a menudo por conveniencia). Un área determinada o un tipo de recurso se \"cierra\" durante un período de tiempo, como un año, y durante este tiempo, se prohíbe a la gente recolectar los recursos afectados por la prohibición. Por ejemplo, si se cierra un área de costa, se prohíbe la pesca; o se podría prohibir la recolección de ciertas plantas. Desafiar el Sasi tendría graves consecuencias, ya que se creía que enfadaba a los espíritus o a los antepasados. El Sasi se volvía a abrir en una ceremonia una vez transcurrido el tiempo."
MEGAPODE_GLOSS: "Los #bold megápodos#! son varias especies de aves emparentadas que se asemejan a gallinas silvestres y son nativas del Pacífico occidental, Australia, Nueva Guinea, el este de Indonesia y las islas Andamán y Nicobar. Tienen la costumbre de incubar sus huevos en pequeñas áreas de anidación concentradas. Para varios grupos indígenas de la región, los huevos de estas aves son una fuente importante de alimento, y a menudo se regalan como muestra de lealtad, amistad y respeto. Tradicionalmente, las convenciones rituales en estas áreas restringen la recolección de estos huevos."
YAP_STONE_MONEY_GLOSS: "Hasta bien entrado el siglo XX, los yapeses viajaban hasta la isla de Palaos para adquirir piedra caliza con forma de disco con un agujero en el centro. Debido al gran tamaño de estas #bold piedras rai#!, que podían medir desde unos pocos centímetros hasta varios metros de ancho, el viaje de regreso podía ser peligroso, y algunos perdían la vida en el trayecto. Las piedras se utilizaban como moneda, y su valor provenía no solo de su tamaño o forma, sino también de la historia oral asociada a la piedra, como quién la había poseído en el pasado o cuántas personas murieron tratando de transportarla de vuelta a Yap. Estas historias se transmitían de generación en generación y confirmaban su valor, por lo que era difícil robar la piedra, ya que todo el mundo sabía quién era el propietario de cada piedra."
