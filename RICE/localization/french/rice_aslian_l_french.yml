 aslian.0080.t:0 "Un cauchemar à propos d'inceste"
 aslian.0080.desc:0 "Un rêve terrifiant m'est venu la nuit dernière, bien que j'aie réussi à éviter le désastre.\n\nJ'étais chez moi avec m[relative.Custom('FR_OnA')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('relative'))] [relative.GetTitledFirstName], quand nous avons vu un énorme python surgir de nulle part ! J'ai crié de peur, mais heureusement [relative.GetFirstNameNoTooltip] a agi rapidement et l'a repoussé à mains nues. Au moment même où [relative.GetSheHe] l'a tué, je me suis réveillé[ROOT.Char.Custom('FR_E')] en sueur.\n\nLes anciens, versés dans le savoir [ROOT.Char.GetFaith.GetAdjective], disent souvent que les pythons, dans les rêves, représentent l'#italic âme de rêve#! de l'inceste. Si nous en rêvons d'un, nous devons le tuer immédiatement, car les rêves d'inceste comptent parmi les pires cauchemars que l'on puisse avoir, car ils sont un présage de désastre, peut-être même un signe annonciateur de la mort.\n\nHeureusement, j'ai évité tout cauchemar d'inceste avec m[relative.Custom('FR_OnA')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('relative'))] !"
 aslian.0080.a:0 "[relative.GetSheHe|U] et moi avons évité la catastrophe, pour l'instant."
 aslian.0080.info:0 "#emphasis Contexte historique :#! À partir des années 1960, certaines affirmations controversées ont été faites au sujet des pratiques culturelles et des croyances des peuples Senoi concernant les rêves et le rêve lucide en particulier, que certains chercheurs ont contestées comme étant le produit de l'imagination occidentale et d'une mauvaise interprétation des pratiques et croyances réelles des Senoi. Quoi qu'il en soit, les rêves occupent une place importante dans la culture Senoi ; les Halaaqs, à peu près l'équivalent des chamans, le deviennent après qu'un [Glossary( 'gunig', 'GUNIG_GLOSS' )] leur apparaît en rêve. Rêver de certaines choses comme l'inceste est considéré comme un signe de danger imminent, il est donc important d'empêcher de tels cauchemars de se produire, comme tuer le serpent \"porteur\" du cauchemar dans son propre rêve."
 aslian.0081.t:0 "Oiseaux moqueurs"
 aslian.0081.desc:0 "J'étais dehors avec [courtier.GetTitledFirstName], alors que le soleil brillait sur nous et que les oiseaux alentour chantaient joyeusement. Puis, j'entendis [courtier.GetFirstNameNoTooltip] se mettre à fredonner une mélodie de manière enjouée pour [courtier.GetHerselfHimself].\n\nJe me figeai sur place en réalisant que cela ressemblait terriblement aux chants des oiseaux.\n\n\"À quoi penses-tu ?\" lançai-je sèchement à [courtier.GetFirstNameNoTooltip]. Quand [courtier.GetSheHe] me regarda, déconcerté[courtier.Custom('FR_E')] par mon énervement, je lui rappelai : \"Ne connais-tu pas les récits [ROOT.Char.GetFaith.GetAdherentNamePlural] ? N'as-tu rien appris étant enfant ? On n'insulte pas les oiseaux. En tuer un est horrible, mais même imiter leur chant est dangereux - veux-tu inviter les esprits malveillants et [ROOT.Char.GetFaith.HighGodName] à nous punir ?\"\n\n \"Je n'imitais pas les oiseaux !\" proteste [courtier.GetFirstNameNoTooltip]. \"Je fredonnais juste une chanson au hasard !\""
 aslian.0081.a:0 "Vraiment ? Très bien. Si vous le dites."
 aslian.0081.b:0 "Vos mensonges vous mettront en danger."
 aslian.0081.info:0 "#emphasis Contexte historique :#! Chez les Semai, le plus grand groupe ethnique des [Glossary( 'Orang Asli', 'ORANG_ASLI_GLOSS' )], il est considéré comme tabou de blesser ou de se moquer de certains animaux, comme les oiseaux. Agir ainsi est censé attirer une grande calamité surnaturelle, voire la mort."
 aslian.0082.t:0 "Plus de violence ?"
 aslian.0082.desc:0 "Alors que je mangeais, j'étais distrait, et j'ai accidentellement mélangé une partie de la viande d'une assiette avec les champignons de l'autre assiette. Pris de panique, j'ai instinctivement séparé les deux.\n\nQue dois-je faire maintenant ? Nous autres [ROOT.Char.GetFaith.GetAdherentNamePlural] évitons de mélanger la viande avec la moindre trace de choses comme le poisson ou les champignons, car un tel acte est violent en soi, et pourrait attirer la calamité sur nous !"
 aslian.0082.a:0 "Manger la viande à la hâte, en espérant que personne n'a remarqué."
 aslian.0082.b:0 "S'en débarrasser et prier pour que les esprits me pardonnent."
 aslian.0082.info:0 "#emphasis Contexte historique :#! Chez de nombreux [Glossary( 'Orang Asli', 'ORANG_ASLI_GLOSS' )], il est considéré comme tabou de mélanger la viande avec certains aliments tels que le poisson ou les champignons. Faire cela est considéré comme une moquerie irrespectueuse envers l'animal mort, et, en un sens, une forme de violence humiliante supplémentaire infligée à celui-ci."
 aslian.0083.t:0 "Dispositifs en bambou"
 aslian.0083.desc:0 "Il y a eu une recrudescence d'animaux dangereux et nuisibles rôdant autour de ma résidence; des oiseaux, des serpents, et même de plus grands prédateurs ont été aperçus. Heureusement, nous autres [ROOT.Char.GetCulture.GetCollectiveNoun] avons une solution éprouvée pour de tels problèmes.\n\nJe sors donc aujourd'hui avec quelques autres pour planter des poteaux en bois, qui sont ensuite ornés de tubes de bambou creux. Le son retentissant du bambou frappant les poteaux fait généralement fuir la plupart des animaux."
 aslian.0083.a:0 "Dieu merci pour les leçons que nos ancêtres nous ont enseignées."
 aslian.0083.info:0 "#emphasis Contexte historique :#! Les [Glossary( 'Orang Asli', 'ORANG_ASLI_GLOSS' )] ont traditionnellement fait un usage extensif du bambou dans leur vie quotidienne. Des dispositifs pour effrayer les animaux aux instruments de musique, en passant par les sarbacanes, ils ont trouvé de nombreuses façons de l'utiliser."
 aslian.0084.t:0 "Guides de la jungle"
 aslian.0084.desc:0 "Il y a une partie de [county.GetNameNoTier] réputée pour les dangers auxquels les voyageurs font face en la traversant.\n\nCependant, j'ai entendu dire que certains des natifs locaux connaissent d'anciens sentiers qui permettraient de contourner ces dangers. Peut-être que si je paie bien, je pourrai convaincre certains des natifs de guider les gens à travers ces sentiers fiables. Marchands, soldats, mes messagers et serviteurs - beaucoup pourraient tirer parti de ces sentiers."
 aslian.0084.a:0 "Nous devrions trouver des guides volontaires."
 aslian.0084.b:0 "Nous n'avons ni le temps ni les ressources pour cela."
 aslian.0084.info:0 "#emphasis Contexte historique :#! Dans de nombreuses régions de l'intérieur de la Malaisie péninsulaire, les [Glossary( 'Orang Asli', 'ORANG_ASLI_GLOSS' )] autochtones ont fait un usage extensif de divers sentiers de jungle depuis des siècles, voire plus longtemps. Certains de ces sentiers longent des crêtes ou suivent des pistes laissées par des éléphants sauvages. Historiquement, et encore aujourd'hui, les Orang Asli étaient emmenés comme guides par tout étranger souhaitant traverser ces régions."
