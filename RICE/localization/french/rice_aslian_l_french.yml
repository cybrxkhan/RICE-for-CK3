 aslian.0002.t:0 "Le peuple [courtier.GetCulture.GetNameNoTooltip]"
 aslian.0002.desc:0 "Les [Glossary( 'peuples anciens', 'ORANG_ASLI_GLOSS' )] de [GetGeographicalRegion('world_asia_malaysia').GetName] vivent au cœur des jungles et des collines de cette région depuis des générations.\n\nLes dirigeants de la région ont sagement collaboré avec eux au fil des années, car leur connaissance de la terre et de ses ressources est inestimable, et aujourd'hui une telle opportunité s'est présentée à moi.\n\n[courtier.GetFirstName], un[courtier.Custom('FR_E')] membre éminent[courtier.Custom('FR_E')] du peuple [courtier.GetCulture.GetName], m'a approché, espérant que je sois ouvert[ROOT.Char.Custom('FR_E')] à l'idée de bâtir une relation productive avec les [courtier.GetCulture.GetCollectiveNounNoTooltip|l] vivant dans ou près de mes terres. Ensemble, nous pouvons protéger conjointement les sentiers locaux traversant mes terres, nous engager dans le commerce et renforcer nos liens politiques."
 aslian.0002.a:0 "$aslian.0005.a$"
 aslian.0002.b:0 "$aslian.0005.b$"
 aslian.0002.c:0 "$aslian.0005.c$"
