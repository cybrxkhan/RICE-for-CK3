 building_RICE_aslian_pahang_gold_mines_03:0 "Grande mine de Pahang"
 building_RICE_aslian_pahang_gold_mines_03_desc:0 "$building_rammelsberg_mines_03_desc$"
 building_RICE_aslian_pahang_gold_mines_04:0 "Complexe minier de Pahang"
 building_RICE_aslian_pahang_gold_mines_04_desc:0 "$building_rammelsberg_mines_04_desc$"
 building_type_RICE_aslian_gunung_mulu_caves:0 "Grottes de Gunung Mulu"
 building_type_RICE_aslian_gunung_mulu_caves_desc:0 "Les montagnes escarpées de cette région abritent de vastes réseaux de grottes, parmi les plus grands au monde, où une personne peut facilement se perdre à jamais. Entourées de formations calcaires et de jungles apparemment infinies, c'est un lieu d'une beauté naturelle inégalée."
 building_RICE_aslian_gunung_mulu_caves:0 "$building_type_RICE_aslian_gunung_mulu_caves$"
 building_RICE_aslian_gunung_mulu_caves_desc:0 "$building_type_RICE_aslian_gunung_mulu_caves_desc$"
 building_type_RICE_aslian_mount_kinabalu:0 "Moont Kinabalu"
 building_type_RICE_aslian_mount_kinabalu_desc:0 "Longtemps vénéré par les populations locales comme un lieu où les âmes des défunts demeurent après la mort, le mont Kinabalu est également la plus haute montagne de Bornéo, s'élevant à une hauteur impressionnante au-dessus des collines et des jungles de l'île."
 building_RICE_aslian_mount_kinabalu:0 "$building_type_RICE_aslian_mount_kinabalu$"
 building_RICE_aslian_mount_kinabalu_desc:0 "$building_type_RICE_aslian_mount_kinabalu_desc$"
 
 # Traits
 
 # Aspirations
 RICE_aslian_aspiration_bah_lud_desc:"\n\n#bold [historical_aspiration_main_objectives|E]#!\n$EFFECT_LIST_BULLET$Rester une [culture|E] #V Senoi#! ou #V Semang#! (ou une descendante d'une telle [culture|E])\n$EFFECT_LIST_BULLET$Rester de [faith|E] #V Aslienne#!\n$EFFECT_LIST_BULLET$Atteindre #V 100#! [trait_level_track_xp|E] du [trait|E] [GetTrait('lifestyle_mystic').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$Avoir au moins [gold_i|E] #V [EmptyScope.ScriptValue('RICE_aspiration_tiny_resource_bonus')]#! [gold|E]\n$EFFECT_LIST_BULLET$Avoir un [prestige_level|E] de [GetModifier( 'prestige_level_3' ).GetNameWithTooltip|L] ou plus OU un [piety_level|E] de [GetModifier( 'piety_level_3' ).GetNameWithTooltip|L] ou plus\n$EFFECT_LIST_BULLET$Compléter l'[activity|E] #bold $activity_RICE_aslian_siwang_ritual$#! au moins une fois\n\n#bold Récompenses#!\n$EFFECT_LIST_BULLET$Gagner @prestige_icon! #V [EmptyScope.ScriptValue('RICE_aspiration_medium_resource_bonus')]#! [prestige|E]\n$EFFECT_LIST_BULLET$Gagner @piety_icon! #V [EmptyScope.ScriptValue('RICE_aspiration_medium_resource_bonus')]#! [piety|E]\n$EFFECT_LIST_BULLET$Gagner @dynasty_prestige_icon! #V [EmptyScope.ScriptValue('RICE_aspiration_medium_resource_bonus')]#! [dynasty_prestige|E]\n$EFFECT_LIST_BULLET$Améliorer votre [education_trait|E]\n\n#bold [historical_aspiration_bonus_objectives|E]#!\n$EFFECT_LIST_BULLET$Prendre la [decision|E] de #bold $RICE_aslian_blood_sacrifice_decision$#! au moins une fois (Récompense : Gagner un [perk|E] de [intrigue_lifestyle|E])\n$EFFECT_LIST_BULLET$Prendre la [decision|E] de #bold $RICE_austroasiatic_tiger_god_decision$#! au moins une fois (Récompense : Gagner un [perk|E] de [martial_lifestyle|E])\n$EFFECT_LIST_BULLET$Compléter l'[activity|E] #bold $activity_RICE_aslian_siwang_ritual$#! au moins deux fois (Récompense : Gagner @legitimacy_icon! #V [EmptyScope.ScriptValue('medium_legitimacy_gain')]#! [legitimacy|E])\n$EFFECT_LIST_BULLET$Réussir l'[interaction|E] #bold $RICE_southeast_asian_tropical_goods_interaction$#! avec un autre [ruler|E] au moins une fois (Récompense : Gagner un [perk|E] de [stewardship_lifestyle|E])"
 RICE_aslian_historical_aspiration_action_bah_lud:"#italic Avec la guidance de mon [Glossary( 'gunig', 'GUNIG_GLOSS' )], je cherche à vaincre mes ennemis, aider les autres dans ma communauté, et devenir un héros de légende.#!$RICE_aslian_aspiration_bah_lud_desc$"
 RICE_aslian_historical_aspiration_modifier_desc_bah_lud: "[GetModifier('RICE_aslian_aspiration_become_semai_hero').GetNameWithTooltip]"

 # Aspiration Modifiers
 RICE_aslian_aspiration_become_semai_hero:"[RICE_aspiration|E] : Devenir un héros Semai légendaire"
 RICE_aslian_aspiration_become_semai_hero_desc:"#italic Avec les conseils de son [Glossary( 'gunig', 'GUNIG_GLOSS' )], Lud cherche à vaincre ses ennemis, à aider les autres membres de sa communauté et à devenir un héros de légende.#!$RICE_aslian_aspiration_bah_lud_desc$\n\n"
 
 # Memories
 
 # Activities
 activity_RICE_aslian_siwang_ritual_host_an_a:0 "un"
 activity_RICE_aslian_siwang_ritual:0 "Rituel Siwang"
 activity_RICE_aslian_siwang_ritual_desc:0 "Les Rituels Siwang peuvent nous aider à guérir et à nous débarrasser de nos maux, tant physiques que mentaux. Ils nécessitent l'aide des esprits [Glossary( 'gunig', 'GUNIG_GLOSS' )], qui, en raison de leur timidité, doivent être contactés la nuit."
 activity_RICE_aslian_siwang_ritual_selection_tooltip:"Organiser un rituel Siwang\n\n$RICE_aslian_siwang_ritual_context_tooltip$"
 RICE_aslian_siwang_ritual_context_tooltip:"#emphasis Contexte historique :#! Les Siwang ou Sewang sont divers types de rituels pratiqués dans la culture des Senoi, le plus grand groupe d'[Glossary( 'Orang Asli', 'ORANG_ASLI_GLOSS' )]. Généralement, lors du rituel, un #italic halaaq#! (également orthographié #italic halaa#! ou #italic halaa'#!), un spécialiste rituel, communique avec son [Glossary( 'gunig', 'GUNIG_GLOSS' )], ou esprit familier, pour aider les gens en les guérissant, en les protégeant du mal, en exorcisant les mauvais esprits, et ainsi de suite."
 activity_RICE_aslian_siwang_ritual_host_desc:"Original text\n$BULLET_WITH_TAB$Perte de [stress_loss_i|E] [stress|E] \n$BULLET_WITH_TAB$Gain de [prestige_i|E] [prestige|E]\n$BULLET_WITH_TAB$Gain de [piety_i|E] [piety|E]\n$BULLET_WITH_TAB$Recevez un [modifier|E] #P positif#!\n$BULLET_WITH_TAB$De l'[trait_level_track_xp|E] pour chaque participant ayant le [trait|E] [GetTrait('lifestyle_mystic').GetName(GetNullCharacter)]"
 activity_RICE_aslian_siwang_ritual_guest_desc: "$activity_RICE_aslian_siwang_ritual_host_desc$"
 activity_RICE_aslian_siwang_ritual_province_desc:"Le Rituel Siwang se tiendra ici."
 activity_RICE_aslian_siwang_ritual_destination_selection: "$activity_RICE_aslian_siwang_ritual_province_desc$"
 activity_RICE_aslian_siwang_ritual_guest_help_text: "$activity_RICE_aslian_siwang_ritual$"
 activity_RICE_aslian_siwang_ritual_predicted_cost:"Le coût de cette visite est principalement basé sur votre [income|E]."
 activity_RICE_aslian_siwang_ritual_conclusion_desc:"Le [GetActivityType( 'activity_RICE_aslian_siwang_ritual' ).GetName] est conclu. Nous sommes guéris et revigorés, grâce aux [Glossary( 'gunigs', 'GUNIG_GLOSS' )]."
 activity_RICE_aslian_siwang_ritual_type_type:"Type de rituel"
 RICE_aslian_siwang_ritual_type_healing:"Rituel de guérison"
 RICE_aslian_siwang_ritual_type_healing_desc:"$EFFECT_LIST_BULLET$ Obtenez le [character_modifier|E] [GetModifier('RICE_aslian_siwang_ritual_healing').GetNameWithTooltip]\n\n#weak Les [Glossary( 'gunigs', 'GUNIG_GLOSS' )] ont le pouvoir spirituel de nous aider avec nos maux médicaux.#!"
 RICE_aslian_siwang_ritual_type_welcoming:"Rituel d'accueil"
 RICE_aslian_siwang_ritual_type_welcoming_desc:"$EFFECT_LIST_BULLET$ Obtenez le [character_modifier|E] [GetModifier('RICE_aslian_siwang_ritual_welcoming').GetNameWithTooltip]\n\n#weak Les [Glossary( 'gunigs', 'GUNIG_GLOSS' )] nous aideront à encourager un esprit de coopération au sein de notre communauté.#!"
 RICE_aslian_siwang_ritual_type_summoning:"Rituel d'invocation"
 RICE_aslian_siwang_ritual_type_summoning_desc:"$EFFECT_LIST_BULLET$ Obtenez le [character_modifier|E] [GetModifier('RICE_aslian_siwang_ritual_summoning').GetNameWithTooltip]\n\n#weak Les [Glossary( 'gunigs', 'GUNIG_GLOSS' )] peuvent être invoqués pour nous assister dans les affaires temporelles et spirituelles.#!"
 RICE_aslian_siwang_ritual_type_exorcizing:"Rituel d'exorcisme"
 RICE_aslian_siwang_ritual_type_exorcizing_desc:"$EFFECT_LIST_BULLET$ Obtenez le [character_modifier|E] [GetModifier('RICE_aslian_siwang_ritual_exorcizing').GetNameWithTooltip]\n\n#weak Les [Glossary( 'gunigs', 'GUNIG_GLOSS' )] peuvent nous aider à résister aux méfaits des esprits malveillants.#!"
 RICE_aslian_siwang_ritual_healing_phase:"Cérémonie"
 RICE_aslian_siwang_ritual_healing_phase_desc:"Le $senoi_pagan_priest$ invoquera son [Glossary( 'gunig', 'GUNIG_GLOSS' )] pour nous guérir et nous revigorer."
 RICE_aslian_siwang_ritual_healing_intent_header: "Rituel :"
 RICE_aslian_siwang_ritual_healing_intent: "Rituel "
 RICE_aslian_siwang_ritual_healing_intent_desc: "C'est un moment pour nous de guérir, d'apprécier la vie et de prier les ancêtres et les bons esprits."
 RICE_aslian_siwang_ritual_completed_log_title:0 "A accompli le rituel Siwang"
 RICE_aslian_siwang_ritual_completed_log:0 "[CHARACTER.GetShortUIName|U] a accompli le rituel Siwang."
 TRAVEL_NAME_FOR_activity_RICE_aslian_siwang_ritual:0 "[Character.GetFirstNamePossessiveNoTooltip] $activity_RICE_aslian_siwang_ritual$"
 
 # Modifiers
 RICE_aslian_performed_siwaac_blood_sacrifice:0 "Sacrifice de Sang Siwaac"
 RICE_aslian_performed_siwaac_blood_sacrifice_desc:0 "Ce personnage a récemment effectué le Sacrifice de Sang Siwaac lors d'un orage pour apaiser la divinité du tonnerre."
 RICE_austroasiatic_wise_tiger_modifier:0 "Offrande faite aux Esprits du Tigre Sage"
 RICE_austroasiatic_majestic_tiger_modifier:0 "Offrande faite aux Esprits du Tigre Majestueux"
 RICE_austroasiatic_retributive_tiger_modifier:0 "Offrande faite aux Esprits du Tigre Vengeur"
 RICE_austroasiatic_savage_tiger_modifier:0 "Offrande faite aux Esprits du Tigre Sauvage"
 RICE_SEA_tropical_good_modifier:0 "Produits récoltés de la forêt tropicale"
 RICE_SEA_tropical_good_modifier_desc:0 "Ce personnage a rassemblé un certain nombre de biens rares que l'on ne trouve que dans les forêts tropicales d'Asie du Sud-Est, pour que sa communauté puisse les utiliser.\n\n#weak Débloque l'[interaction|E] pour #V Échanger des Denrées Tropicales Rares#! avec d'autres [rulers|E]#!"
 RICE_SEA_tropical_good_trade_modifier:0 "Marchandises de la Forêt Tropicale Acquises"
 RICE_SEA_tropical_good_trade_modifier_desc:0 "Ce personnage a acquis un certain nombre de biens rares que l'on ne trouve que dans les forêts tropicales d'Asie du Sud-Est, en commerçant avec les peuples qui vivent dans ces régions."
 RICE_opinion_southeast_asian_rare_goods_trade:0 "Commerce de produits de la forêt tropicale"
 RICE_southeast_asian_local_trade_networks:0 "Expansion des réseaux locaux d'Asie du Sud-Est"
 RICE_aslian_bah_lud:0 "Bah Lud"
 RICE_aslian_bah_lud_desc:0 "Bien que [Glossary( 'Bah', 'BAH_MALAYSIA_GLOSS' )] Lud ait l'apparence d'un homme physiquement frêle, la rumeur veut que ce ne soit qu'une tromperie, notamment pour dérouter ses ennemis. Certains murmurent même qu'il est aidé par de puissants esprits [Glossary( 'gunig', 'GUNIG_GLOSS' )]."
 RICE_aslian_siwang_ritual_healing:0 "A participé à un rituel de guérison Siwang"
 RICE_aslian_siwang_ritual_welcoming:0 "A participé à un rituel d'accueil du Siwang"
 RICE_aslian_siwang_ritual_summoning:0 "A participé à un rituel d'invocation du Siwang"
 RICE_aslian_siwang_ritual_exorcizing:0 "A participé à un rituel d'exorcisme du Siwang"
 RICE_aslian_siwang_ritual_halaa_modifier:0 "A participé au rituel Siwang en tant que Halaaq"
 RICE_SEA_sea_nomads_modifier:0 "Liens avec les Nomades de la Mer"
 RICE_SEA_sea_nomads_modifier_desc:0 "Ce personnage a des liens politiques et économiques avec d'éminents clans de Nomades de la Mer d'Asie du Sud-Est.\n\n#weak Débloque la [decision|E] pour #bold $RICE_SEA_manage_sea_lanes$#!"
 RICE_SEA_manage_sea_lanes_modifier:0 "Présence autorisée des nomades de la mer"
 RICE_SEA_manage_sea_lanes_modifier_desc:0 "Les dirigeants locaux emploient des clans de Nomades de la Mer pour encourager le commerce et décourager les attaques ennemies dans les zones côtières de cette région."
 RICE_aslian_escaped_incestuous_dream:0 "Échappé de justesse à un cauchemar incestueux"
 RICE_aslian_protected_from_wild_animals_by_bamboo_devices:0 "Protégé des animaux sauvages par des dispositifs en bambou"
 RICE_aslian_orang_asli_guides:0 "Guides indigènes de la jungle malaisienne"
 RICE_aslian_orang_asli_guides_desc:0 "Les dirigeants ont recruté les peuples indigènes de la Malaisie péninsulaire pour aider à guider les voyageurs à travers une partie dangereuse de cette région. Ces habitants connaissent des sentiers sûrs qui permettent de contourner une grande partie de ces dangers."
 
 # Struggle Ending Decisions
 
 # Decisions
 RICE_aslian_blood_sacrifice_decision:0 "Effectuer un sacrifice de sang Siwaac"
 RICE_aslian_blood_sacrifice_decision_tooltip:0 "Quand le tonnerre gronde, nous sommes tous emplis de crainte"
 RICE_aslian_blood_sacrifice_decision_desc:0 "L'arrivée du tonnerre indique que le dieu du tonnerre est en colère contre nous pour avoir enfreint des tabous ou adopté un comportement immoral, mais un simple sacrifice de mon propre sang suffira, espérons-le, à l'apaiser."
 RICE_aslian_blood_sacrifice_decision_effect_tooltip_1:1 "Cette [decision|E] réduit davantage le [stress_loss_i|E] [stress|E] et vous accorde plus de [piety_i|E] [piety|E] si vous êtes une #V femme#! adulte en âge de menstruer (jusqu'à #V 45#! ans)"
 RICE_aslian_blood_sacrifice_decision_confirm:0 "Allons-y !"
 RICE_aslian_blood_sacrifice_decision_context_tooltip:0 "#emphasis Contexte historique :#! Beaucoup d'[Glossary( 'Orang Asli', 'ORANG_ASLI_GLOSS' )] ont traditionnellement cru que les orages étaient causés par une divinité en colère qui voulait les punir pour des transgressions morales, et qui devait être apaisée par un petit sacrifice de sang. Fait intéressant, pour certains Orang Asli, la divinité du tonnerre est crainte mais aussi tournée en dérision - elle est vue comme un idiot à l'esprit lent qu'ils dupent avec ce rituel pour le convaincre qu'ils sont repentants."
 RICE_austroasiatic_tiger_god_decision:0 "Faire une offrande aux esprits du tigre"
 RICE_austroasiatic_tiger_god_decision_tooltip:0 "Le Tigre doit être respecté, quelle que soit la forme qu'il prend"
 RICE_austroasiatic_tiger_god_decision_desc:0 "Les Esprits du Tigre font partie intégrante du monde dans le [ROOT.Char.GetFaith.GetName]. Que nous le fassions par peur, par respect, par dévotion ou pour toute autre raison, il est pertinent de faire régulièrement des offrandes aux esprits du Tigre."
 RICE_austroasiatic_tiger_god_decision_effect_tooltip_1:1 "Le [character_modifier|E] que vous obtenez de cette [decision|E] dépend de la [doctrine|E] #V $rice_doctrine_austroasiatic_tiger_god_name$#! que possède votre [faith|E]"
 RICE_austroasiatic_tiger_god_decision_confirm:0 "Préparez les offrandes!"
 RICE_austroasiatic_tiger_god_decision_context_tooltip:0 "#emphasis Contexte historique :#! Bien que le culte du tigre ne soit pas rare à travers le monde, les tigres jouent un rôle clé dans de nombreuses croyances et pratiques traditionnelles des divers peuples [Glossary( 'Austroasiatiques', 'AUSTROASIATIC_GLOSS' )]. Il a été théorisé que des croyances similaires au sujet des tigres chez les peuples non austroasiatiques d'Asie du Sud-Est, comme les locuteurs taï ou austronésiens, proviendraient probablement d'une influence austroasiatique."
 RICE_SEA_harvest_rare_tropical_goods_decision:0 "Récolter des denrées tropicales rares"
 RICE_SEA_harvest_rare_tropical_goods_decision_tooltip:0 "Nous devrions collecter des marchandises rares pour les échanger avec les étrangers"
 RICE_SEA_harvest_rare_tropical_goods_decision_desc:0 "L'[GetGeographicalRegion('world_asia_southeast').GetName] regorge de denrées tropicales que nous et nos ancêtres avons utilisés depuis des générations. Nous pouvons les récolter de manière durable afin de profiter à nos propres communautés."
 RICE_SEA_harvest_rare_tropical_goods_decision_effect_tooltip_1:1 "Tant que le [modifier|E] [GetModifier('RICE_SEA_tropical_good_modifier').GetNameWithTooltip] est actif, vous aurez accès à une [interaction|E] pour #V Échanger des Denrées Tropicales Rares#! avec d'autres [rulers|E]"
 RICE_SEA_harvest_rare_tropical_goods_decision_confirm:0 "Récoltons ces denrées !"
 RICE_SEA_harvest_rare_tropical_goods_decision_context_tooltip:0 "#emphasis Contexte historique :#! Pendant des millénaires, l'Asie du Sud-Est fut la source de produits de luxe très convoités, tels que les épices, les bois aromatiques et les oiseaux de paradis. En de nombreux endroits, certains groupes ethniques se spécialisaient dans la collecte de ces ressources, qu'ils échangeaient ensuite avec les habitants d'États plus urbanisés, qui les exportaient alors vers les marchés étrangers. Par exemple, la minorité ethnique Samre, vivant le long de la frontière entre le Cambodge et la Thaïlande modernes, était historiquement experte dans la collecte de la cardamome depuis leurs hautes terres."
 RICE_SEA_manage_sea_lanes_sea_nomad:0 "Gérer les routes maritimes à proximité"
 RICE_SEA_manage_sea_lanes:0 "Ordonner aux Nomades de la Mer de Gérer les Routes Maritimes Voisines"
 RICE_SEA_manage_sea_lanes_tooltip:0 "Les Nomades de la Mer d'Asie du Sud-Est sont des maîtres des eaux comme peu d'autres."
 RICE_SEA_manage_sea_lanes_desc_sea_nomad:0 "Nous, les [Glossary( 'nomades de la mer', 'SEA_NOMADS_GLOSS' )] originaires de l'[GetGeographicalRegion('world_asia_southeast').GetName], vivons sur les eaux la majeure partie de notre vie. Renforcer le contrôle des routes maritimes avoisinantes est nécessaire pour maintenir la prospérité de nos territoires maritimes."
 RICE_SEA_manage_sea_lanes_desc:0 "Les [Glossary( 'nomades de la mer', 'SEA_NOMADS_GLOSS' )] originaires de [GetGeographicalRegion('world_asia_southeast').GetName] vivent sur les eaux pendant la majeure partie de leur vie. Nous pouvons tirer parti de nos liens avec eux pour maintenir la prospérité de nos territoires maritimes."
 RICE_SEA_manage_sea_lanes_effect_tooltip_1:1 "Le coût en [gold_i|E] [gold|E] de cette [decision|E] dépend du nombre de [counties|E] côtiers que vous possédez"
 RICE_SEA_manage_sea_lanes_confirm:0 "Récoltons ces denrées !"
 RICE_SEA_manage_sea_lanes_context_tooltip:0 "#emphasis Contexte historique :#! Bien qu'ils aient fait face à la discrimination et à la marginalisation à l'époque moderne, les [Glossary( 'nomades de la mer', 'SEA_NOMADS_GLOSS' )] d'Asie du Sud-Est étaient historiquement des acteurs majeurs de la politique et de l'économie de la région. Les dirigeants travaillaient consciemment avec divers Nomades de la mer pour protéger les routes commerciales et assister les marchands, ou les engageaient comme pirates et mercenaires, par exemple."
 
