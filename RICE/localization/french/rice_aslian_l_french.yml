 aslian.0005.t:0 "Les nomades de la mer [courtier.GetCulture.GetNameNoTooltip]"
 aslian.0005.desc:0 "Depuis aussi longtemps que quiconque s'en souvienne, les [Glossary( 'nomades de la mer', 'SEA_NOMADS_GLOSS' )] qui vivent en [GetGeographicalRegion('world_asia_southeast').GetName] ont fait passer même les marins les plus expérimentés du monde entier pour des novices terriens. Ils vivent et meurent par l'océan.\n\nLes dirigeants de la région ont sagement collaboré avec eux au fil des années. Aujourd'hui, une telle opportunité s'est présentée à moi.\n\n[courtier.GetFirstName], un[courtier.Custom('FR_E')] membre éminent[courtier.Custom('FR_E')] du peuple [courtier.GetCulture.GetName], m'a approché, espérant que je sois ouvert[ROOT.Char.Custom('FR_E')] à bâtir une relation productive avec les [courtier.GetCulture.GetCollectiveNounNoTooltip|l] qui voyagent à travers ou près de mes terres. Ensemble, nous pouvons protéger conjointement le territoire maritime, nous engager dans le commerce et renforcer nos liens politiques."
 aslian.0005.a:0 "J'accueille avec joie l'amitié avec votre peuple !"
 aslian.0005.b:0 "Restez à ma cour, afin que nous puissions travailler ensemble !"
 aslian.0005.c:0 "Votre engeance ne m'intéresse pas."
