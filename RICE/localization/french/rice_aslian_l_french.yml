 aslian.0010.t:0 "Un Héros en Devenir"
 aslian.0010.desc:0 "Tout au long de ma vie, les gens m'ont peut-être considéré comme un être faible. En effet, mon corps semble frêle, et mon apparence peut être celle d'un homme fragile et flasque.\n\nCe que certains ignorent, c'est que j'ai de puissants amis parmi les esprits [Glossary( 'gunig', 'GUNIG_GLOSS' )] qui m'ont béni de leur présence pendant de nombreuses années. Avec leur aide, j'ai dissimulé ma véritable force aux yeux des autres.\n\nSi un homme \"faible\" sauve une belle princesse comme [inak.GetFirstName] et reçoit sa main en mariage, est-il vraiment faible ? Si un homme \"faible\" a protégé de nombreuses personnes des fléaux des bandits, des pirates et des esprits maléfiques, est-il vraiment faible ?\n\nLes héros se présentent sous toutes les formes et toutes les tailles, et avec mes [Glossary( 'gunigs', 'GUNIG_GLOSS' )], je serai un héros dont le peuple [ROOT.Char.GetCulture.GetCollectiveNoun|l] se souviendra pendant des générations !"
 aslian.0010.a:0 "Les héros se forgent, ils ne naissent pas ainsi."
 aslian.0010.info:0 "#emphasis Contexte historique :#! Les Semai sont le plus grand groupe d'[Glossary( 'Orang Asli', 'ORANG_ASLI_GLOSS' )]. Un certain nombre de légendes semai concernent un personnage connu sous le nom de Lud ou Luj, qui apparaît comme un homme physiquement faible, mais ce n'est qu'un déguisement, car il possède des talents en de nombreux domaines et dispose de superpouvoirs spirituels grâce à son [Glossary( 'gunig', 'GUNIG_GLOSS' )], ou esprit familier. Dans l'une de ses aventures, il sauve la fille d'un roi malais d'un monstre et est récompensé par sa main en mariage."
 aslian.0011.t:0 "$RICE_historical_aspiration_fulfilled_title$"
 aslian.0011.desc:0 "Seuls les sots me méprisent désormais pour mon apparence \"faible\". À travers d'innombrables aventures, en aidant les communautés [ROOT.Char.GetCulture.GetCollectiveNoun] locales de bien des manières, je suis devenu un grand héros parmi mon peuple.\n\nOn raconte des récits de mes exploits, certains grandement exagérés - mais qui suis-je pour refuser aux gens une bonne histoire ?\n\nJe ne peux cependant oublier l'aide que j'ai reçue de mes esprits [Glossary( 'gunig', 'GUNIG_GLOSS' )], qui m'ont aidé à dissimuler mes pouvoirs surnaturels à mes ennemis, et m'ont donné la sagesse et la connaissance nécessaires pour triompher lors de nos nombreuses rencontres dans nos rêves. Je m'assurerai de les honorer et de leur témoigner ma gratitude pour le restant de mes jours."
 aslian.0011.a:0 "Ce n'est que le début de mes aventures !"
