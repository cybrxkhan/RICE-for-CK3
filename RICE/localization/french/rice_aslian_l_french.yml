 # Buildings
 building_type_RICE_aslian_pahang_gold_mines_01:0 "Mines de Pahang"
 building_type_RICE_aslian_pahang_gold_mines_01_desc:0 "La région autour de Pahang est une source importante d'or en Asie du Sud-Est depuis des générations. L'or extrait ici est généralement vendu sur les marchés de la Route de la Soie maritime."
 building_RICE_aslian_pahang_gold_mines_01:0 "Colonie minière de Pahang"
 building_RICE_aslian_pahang_gold_mines_01_desc:0 "$building_rammelsberg_mines_01_desc$"
 building_RICE_aslian_pahang_gold_mines_02:0 "Mine de Pahang"
