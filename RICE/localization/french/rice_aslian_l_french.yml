 aslian.0020.t:0 "Le Rituel Siwaac"
 aslian.0020.desc:0 "La pluie est arrivée vite, et forte - l'eau se déversant des cieux, le tonnerre faisant trembler le sol autour de nous. Nous savons tous pourquoi l'orage est venu : [ROOT.Char.GetFaith.HighGodName], le dieu du tonnerre, nous punit.\n\nL'un d'entre nous a brisé un tabou, s'est livré à des actes pécheurs sans remords, a forcé quelqu'un à faire quelque chose contre sa volonté, ou a commis un nombre quelconque d'actes immoraux.\n\nTandis que les autres crient et courent en tous sens dans la panique, plusieurs d'entre nous saisissent des éclats de bambou tranchants à proximité et pratiquent des entailles superficielles sur nos tibias. Alors que la pluie et le tonnerre continuent, nous recueillons hâtivement notre sang dans une louche et le jetons vers le ciel.\n\n\"Pardonnez-nous, [ROOT.Char.GetFaith.HighGodName] ! Nous ne voulions pas faire le mal !\" crions-nous, espérant avoir paru sincères durant notre rituel de #italic siwaac#!, afin que la divinité crédule soit convaincue et nous laisse en paix."
 aslian.0020.a:0 "Finalement, l'orage s'arrête, à notre grand soulagement."
 aslian.0021.t:0 "Les Esprits du Tigre"
 aslian.0021.desc:0 "Les légendes [ROOT.Char.GetFaith.GetAdjective] parlent d'esprits-tigres qui détiennent un grand pouvoir surnaturel et doivent être apaisés par de fréquentes offrandes. Que ce soit par sens de la justice, par un instinct tenace de s'en prendre à ceux qui brisent les tabous, ou pour toute autre raison, ces esprits puniraient ceux qui manquent à respecter les valeurs et les coutumes de notre communauté."
 aslian.0021.a:0 "Veuillez accepter ces offrandes, ô esprits tigres !"
