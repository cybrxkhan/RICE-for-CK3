 aslian.0040.t:0 "Préparatifs"
 aslian.0040.desc:0 "Nous allons bientôt tenir un rituel #italic Siwang#!, pour invoquer des esprits bienveillants afin de guérir notre communauté et nous aider à prospérer.\n\nAvant de commencer, il est important de décider qui sera le $senoi_pagan_priest$ [ROOT.Char.GetFaith.GetAdjective], l'adepte spirituel qui nous guidera à travers la cérémonie. Comme le veut la coutume, il ne sera pas autorisé à participer aux préparatifs du rituel."
 aslian.0040.a:0 "Je mènerai ce rituel en tant que $senoi_pagan_priest$"
 aslian.0040.a.tooltip:0 "En tant que $senoi_pagan_priest$ supervisant le rituel, vous gagnerez du [prestige_i|E] [prestige|E] et de la [piety_i|E] [piety|E] supplémentaires à la fin de l'[activity|E], ainsi que de l'[trait_level_track_xp|E] dans le [trait|E] [GetTrait('lifestyle_mystic').GetName(GetNullCharacter)] (si vous le possédez), mais vous gagnerez du [stress_gain_i|E] [stress|E] (au lieu d'en perdre)"
 aslian.0040.b:0 "[candidate.GetFirstNameNoTooltip] peut diriger ce rituel en tant que $senoi_pagan_priest$"
 aslian.0040.b.tooltip:0 "En tant que $senoi_pagan_priest$ supervisant le rituel, [candidate.GetFirstName] gagnera du [prestige_i|E] [prestige|E] et de la [piety_i|E] [piety|E] supplémentaires à la fin de l'[activity|E], ainsi que de l'[trait_level_track_xp|E] dans le [trait|E] [GetTrait('lifestyle_mystic').GetName(GetNullCharacter)] (s'il le possède), mais gagnera du [stress_gain_i|E] [stress|E] (au lieu d'en perdre)"
 aslian.0040.c:0 "Nous pouvons demander à un $senoi_pagan_priest$ local de diriger ce rituel"
 aslian.0041.t:0 "Danse et Chant"
 aslian.0041.desc:0 "Les ténèbres tombent, et nous nous rassemblons pour que le rituel #italic Siwang#! commence. Parce que les esprits peuvent être des êtres timides, fuyant la lumière, la cérémonie doit se dérouler pendant la nuit.\n\nAlors que nous nous réunissons, nous préparons nos instruments comme les tambours et les longues flûtes de roseau, et nous nous apprêtons à danser et à chanter des chants anciens. Nous guérirons nos maux, accueillerons nos invités, notre famille et nos amis, invoquerons les esprits bienveillants et exorciserons les esprits maléfiques..."
 aslian.0041.a:0 "Commençons !"
 aslian.0042.t:0 "Lever de soleil"
 aslian.0042.desc:0 "Le soleil commence à se lever sur [ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetLocation.GetName] alors que le rituel du #Italic Siwang#! touche à sa fin.\n\nNous sommes fatigués, mais revigorés et rajeunis, comme toujours après ces rituels, les esprits bienveillants étant venus nous aider, et les malveillants ayant été expulsés."
 aslian.0042.a:0 "Puissions-nous guérir et prospérer ensemble."
