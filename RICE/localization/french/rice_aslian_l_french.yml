 aslian.0030.t:0 "Marchandises Tropicales Rares"
 aslian.0030.desc:0 "Nous autres [ROOT.Char.GetCulture.GetCollectiveNoun] connaissons les forêts de ces terres mieux que quiconque ; nous savons où trouver les sortes de denrées rares que les étrangers auraient bien du mal à dénicher, des substances précieuses et plantes médicinales, aux bêtes prisées pour leur beauté.\n\nJ'ai envoyé des membres de la communauté à la recherche de certaines de ces denrées. Nombre de ces produits nous seront d'une grande utilité dans notre vie quotidienne, mais nous pouvons en mettre de côté pour les vendre à des marchands itinérants, car les étrangers convoitent souvent ces biens \"exotiques\"."
 aslian.0030.a:0 "Nous comprenons ces terres comme peu d'autres."
 aslian.0030.tooltip:0 "L'[interaction|E] pour #V $RICE_southeast_asian_tropical_goods_interaction$#! est désormais disponible tant que le [modifier|E] [GetModifier('RICE_SEA_tropical_good_modifier').GetNameWithTooltip] est actif"
 aslian.0031.t:0 "$aslian.0030.t$"
 aslian.0031.desc.actor:0 "[recipient.GetTitledFirstName] nous a contactés dans l'espoir de négocier une sorte d'accord commercial qui serait favorable aux deux parties, car nous autres [actor.GetCulture.GetName], sommes experts dans la collecte de denrées tropicales spéciales qu'ils peuvent revendre à prix élevé sur les marchés étrangers grâce à leurs relations avec des marchands proches et lointains.\n\nNous avons accepté de travailler avec eux pour le moment."
 aslian.0031.desc.recipient:0 "J'ai contacté les tribus [actor.GetCulture.GetName] voisines dans l'espoir de négocier une sorte d'accord commercial qui serait favorable aux deux parties, puisque ces gens sont experts dans la collecte de denrées tropicales spéciales que nous pouvons vendre à prix élevé sur les marchés étrangers grâce à nos relations avec des marchands proches et lointains.\n\nLeur chef, [actor.GetTitledFirstName], a gracieusement accepté de travailler avec nous pour le moment."
 aslian.0031.desc:0 "Ce faisant, nous renforcerons également nos liens politiques et personnels les uns avec les autres !"
 aslian.0031.a:0 "Nous en tirerons tous les deux un bénéfice mutuel !"
