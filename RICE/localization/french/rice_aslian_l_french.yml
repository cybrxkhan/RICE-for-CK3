 aslian.0050.t:0 "Travailler avec les Nomades de la Mer"
 aslian.0050.desc:0 "J'entretiens des liens solides et fructueux avec certains des [Glossary( 'nomades des mers', 'SEA_NOMADS_GLOSS' )] qui vivent dans les eaux que je gouverne ou les traversent. Récemment, j'ai rencontré certains de leurs chefs pour coordonner des stratégies visant à promouvoir nos intérêts économiques et politiques communs.\n\nComme à l'accoutumée, en échange de privilèges commerciaux et politiques, ces clans migrateurs feront de leur mieux pour défendre ces eaux contre nos ennemis, et assister les voyageurs et marchands passant sous ma protection."
 aslian.0050.a:0 "Je suis ravi[ROOT.Char.Custom('FR_E')] que nous ayons une relation si productive !"
