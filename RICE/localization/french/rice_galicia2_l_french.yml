 galicia2.0080.t:0 "Crémation en [county.GetNameNoTierNoTooltip]"
 galicia2.0080.desc:0 "J'ai reçu des nouvelles de [ROOT.Char.Custom('DefaultPriestTitlePlural')] [ROOT.Char.GetFaith.GetReligion.GetAdherentNamePlural|l]  préoccupés que dans de nombreuses colonies autour de [county.GetNameNoTier]. Dans certains villages, des [ROOT.Char.GetFaith.GetReligion.GetAdherentNamePluralNoTooltip] pratiquent encore l'ancienne coutume [GetReligionByKey('slavic_religion').GetName|l] de crémation lorsque quelqu'un meurt.\n\nMon [chaplain.GetCouncilTitle], [chaplain.GetTitledFirstName], insiste pour que quelque chose soit fait pour mettre un terme à cela. La coutume s'est éteinte progressivement en faveur de rites funéraires [ROOT.Char.GetFaith.GetReligion.GetAdjectiveNoTooltip|l] appropriés, mais [chaplain.GetSheHe] craint qu'elle ne disparaisse pas assez vite."
 galicia2.0080.a:0 "Je suis d'accord. Cette pratique païenne doit être arrêtée."
 galicia2.0080.b:0 "Cela ne vaut pas la peine de faire pression sur les paysans pour qu'ils changent."
 galicia2.0080.info:0 "#emphasis Contexte historique :#! Jusqu'à une époque plus récente, la crémation était perçue négativement par de nombreuses confessions chrétiennes, car elle était considérée comme un signe de manque de respect envers la création de Dieu, et qu'elle interférerait avec la résurrection physique du corps. Malgré cela, après leur christianisation, la crémation était encore pratiquée parmi de nombreux peuples slaves ; parfois, elle semble avoir été pratiquée parallèlement à des formes plus acceptées d'inhumation chrétienne. Par exemple, dans la région frontalière de [GetTitleByKey('d_mazovia').GetAdjectiveNoTooltip] et de la Rus, habitée par des Slaves occidentaux et orientaux, des preuves archéologiques attestent que la crémation et l'inhumation étaient toutes deux pratiquées jusque bien avant dans le XIIIe siècle. Dans cette région, l'augmentation des preuves d'inhumation est supposée être même liée à l'immigration de populations chrétiennes venues d'ailleurs."
 galicia2.0081.t:0 "L'architecture de [GetGeographicalRegion('RICE_galicia_volhynia_region').GetNameNoTooltip]"
 galicia2.0081.desc:0 "Le style architectural de [GetGeographicalRegion('RICE_galicia_volhynia_region').GetName] est, depuis longtemps, un mélange d'influences d'Europe centrale, d'Europe de l'Est et byzantines, en raison de la position géographique de la région.\n\nCertains de mes officiels sont récemment entrés en contact avec des artisans [culture.GetCollectiveNoun|l] de [county.GetNameNoTier], connus pour leurs compétences dans la construction de magnifiques monuments et bâtiments dans ce style architectural métissé. Ils souhaitent s'installer à [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier] et travailler sur divers projets de construction si je les rémunère généreusement.\n\nIl ne fait aucun doute qu'ils pourraient grandement contribuer à la grandeur architecturale de [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] !"
 galicia2.0081.a:0 "Souhaitez-leur la bienvenue à [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] !"
 galicia2.0081.b:0 "Non, je n'ai pas besoin de leur aide."
 galicia2.0081.info:0 "#emphasis Contexte historique :#! À partir des XIIe et XIIIe siècles environ, une forme unique d'architecture émergea en [GetGeographicalRegion('RICE_galicia_volhynia_region').GetName] qui mêlait à la fois les anciens styles architecturaux rus et le style roman qui dominait une grande partie de l'Europe aux XIe et XIIe siècles. On suppose que des architectes et artisans de Pologne, de Hongrie et de République tchèque furent patronnés par les élites locales et jouèrent un rôle majeur dans le développement de cette tradition. Par exemple, certains des premiers bâtiments connus de cette tradition sont l'église du Sauveur à 4 piliers (seconde moitié des années 1140) et la cathédrale de l'Assomption (vers le tournant des années 1140-1150) à [GetTitleByKey('c_halych').GetNameNoTier], dont la construction est possiblement attribuable à des artisans polonais."
 galicia2.0082.t:0 "Marchands de cochenille"
 galicia2.0082.desc:0 "Bien que la [Glossary( 'cochenille', 'COCHINEAL_GLOSS' )] soit l'une des exportations les plus rentables de mes territoires, il y a un problème : elle ne peut être produite que durant une certaine période de l'année, généralement dans un court laps de temps en été, lorsque les larves de l'insecte cochenille peuvent effectivement être récoltées. Il n'y a jamais de grandes quantités de cochenille disponibles, ce qui contribue à son prix élevé.\n\nL'envoyé étranger qui me rend visite aujourd'hui, cependant, ne comprend pas cela. Notre conversation avait dérivé sur le sujet de la cochenille, et bien que cet envoyé ne rejette pas la faute sur les gens qui la produisent, il s'est moqué des marchands qui commercent la cochenille, affirmant qu'ils sont des rusés à qui il faut accorder un traitement spécial en raison de la difficulté à obtenir de la bonne cochenille auprès d'eux."
 galicia2.0082.a:0 "Je devrais expliquer à l'envoyé comment fonctionne le commerce de la cochenille."
 galicia2.0082.b:0 "L'émissaire n'a pas tort : les marchands sont une bande de vauriens."
 galicia2.0083.t:0 "Récit d'un voyageur sur nos ancêtres"
 galicia2.0083.desc:0 "Aujourd'hui, j'ai entendu une histoire intéressante et amusante de la part d'un érudit cultivé. Apparemment, il est tombé sur les anciens écrits d'un voyageur étranger d'autrefois, qui traversa les terres habitées par les ancêtres de notre peuple, les [ROOT.Char.GetCulture.GetCollectiveNoun|l].\n\nLe voyageur, apparemment, dit de nos prédécesseurs : « Je n'ai jamais vu de spécimens physiques plus parfaits, grands comme des palmiers-dattiers, blonds et au teint vermeil. »\n\nD'un autre côté, le voyageur était aussi assez sectaire, affirmant que nos ancêtres étaient « les plus crasseux » des gens qu'il ait jamais rencontrés, qui étaient « comme des ânes sauvages » en raison de leur mauvaise hygiène et de leur propension à s'adonner aux rapports charnels de manière désinvolte et sans se laver."
 galicia2.0083.a:0 "Je suis sûr qu'il y a du vrai dans le bon comme dans le mauvais."
 galicia2.0083.b:0 "Quelles drôles d'histoires, manifestement inventées, sur nos ancêtres !"
 galicia2.0083.c:0 "Bah ! Ce « voyageur » est un idiot suffisant et plein de préjugés !"
 galicia2.0083.info:0 "#emphasis Contexte Historique :#! Ibn Fadlan était un explorateur arabe du Xe siècle qui a parcouru certaines parties de l'Europe de l'Est dans le cadre d'une ambassade envoyée par le califat abbasside au roi de la Bulgarie de la Volga. Les citations de cet événement sont tirées de son récit sur le peuple Rus. Dans une partie de ce récit, il décrit en détail les funérailles d'un chef rus dont il a été témoin, qui comprenaient l'incinération et le meurtre rituel de l'une des esclaves du chef. Pendant les funérailles, l'interprète rus d'Ibn Fadlan lui aurait dit en riant que « vous, les Arabes, êtes des imbéciles » , car « vous prenez les gens qui vous sont les plus chers et que vous honorez le plus et vous les mettez dans le sol où les insectes et les vers les dévorent. Nous, nous les brûlons en un instant, pour qu'ils entrent immédiatement au Paradis » ."
 galicia2.0084.t:0 "Soupe de berce"
 galicia2.0084.desc:0 "Alors que nous voyagions à [ROOT.Char.GetCurrentLocation.GetName], nous nous sommes reposés dans la maison d'humbles fermiers [culture.GetCollectiveNoun|l] pour la nuit. Ce n'était pas l'endroit le plus confortable pour dormir, mais c'était mieux que de dormir dehors, et nos hôtes étaient très hospitaliers.\n\nPlus tard le lendemain, on nous a servi une soupe préparée à partir de la #italic berce#! ou plus exactement, à partir des tiges, feuilles et ombelles marinées de cette plante. C'était peut-être un modeste repas de paysan, mais c'était très savoureux, d'une manière acidulée et piquante !"
 galicia2.0084.a:0 "Merci pour votre hospitalité et cette délicieuse soupe."
 galicia2.0084.b:0 "Bon sang... La bonne cuisine me manque vraiment..."
 galicia2.0084.info:0 "#emphasis Contexte historique :#! le #italic bortsch#! est un élément omniprésent des cuisines de plusieurs pays slaves, dont l'Ukraine, la Pologne et la Russie ; c'est une soupe préparée à base de betteraves rouges. Son prédécesseur historique était une soupe aigre à base de #italic berce#!. Après avoir découpé des parties de la plante de berce et les avoir laissées dans l'eau pour fermenter, les gens utilisaient le produit fermenté obtenu pour préparer la soupe."
