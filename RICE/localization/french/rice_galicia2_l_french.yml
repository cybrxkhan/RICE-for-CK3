 RICE_galicia2_oleg_negative_modifier:1 "Le fils de la sorcière"
 RICE_galicia2_oleg_negative_modifier_desc:1 "La mère d'Oleg, Anastasia, fut accusée par les boyards de Galicie d'être une sorcière et brûlée sur le bûcher pour avoir supposément envoûté le dirigeant de Galicie, Yaroslav aux Huit Esprits. Que cela soit vrai ou de la propagande politique de boyards assoiffés de pouvoir, cela a laissé une marque sombre sur Oleg.\n\n#EMP Ce [modifier|El] négatif sera supprimé si Oleg accomplit son [GetModifier('RICE_galicia2_aspiration_secure_rule_against_galician_boyars').GetNameWithTooltip].#!"
 RICE_galicia2_oleg_positive_modifier_1:1 "Le sinistre fils de la sorcière"
 RICE_galicia2_oleg_positive_modifier_1_desc:1 "La mère d'Oleg, Anastasia, fut accusée par les boyards de Galicie d'être une sorcière et brûlée sur le bûcher pour avoir prétendument envoûté le souverain de Galicie, Yaroslav l'Octuple-Esprit. Oleg a surmonté ses sombres origines pour devenir un souverain respecté ; bien qu'il n'ait pas effacé la stigmatisation d'être le fils de sa mère, beaucoup le craignent et certains le soupçonnent même d'avoir hérité des prétendus pouvoirs de sorcellerie de sa mère.#!"
 RICE_galicia2_oleg_positive_modifier_2:1 "Le fils bien-aimé de la sorcière"
 RICE_galicia2_oleg_positive_modifier_2_desc:1 "La mère d'Oleg, Anastasia, fut accusée par les boyards de Galicie d'être une sorcière et brûlée sur le bûcher pour avoir prétendument envoûté le souverain de Galicie, Iaroslav l'Octuple-Esprit. Oleg a surmonté ses sombres origines pour devenir un souverain respecté ; bien qu'il n'ait pas effacé la stigmatisation d'être le fils de sa mère, beaucoup de gens du peuple le voient comme un dirigeant sympathique, capable de contenir le pouvoir des nobles boyards.#!"
 RICE_galicia2_oleg_positive_modifier_3:1 "Le fils studieux de la sorcière"
 RICE_galicia2_oleg_positive_modifier_3_desc:1 "La mère d'Oleg, Anastasia, fut accusée par les boyards de Galicie d'être une sorcière et brûlée sur le bûcher pour avoir supposément envoûté le dirigeant de Galicie, Yaroslav l'Octuple-Esprit. Oleg a surmonté ses origines sombres pour devenir un dirigeant respecté ; bien qu'il n'ait pas effacé le stigmate d'être le fils de sa mère, beaucoup en sont venus à l'admirer à contrecœur pour avoir travaillé dur afin de se forger un nom.#!"
 RICE_portage_erect_stones_nonchristian_modifier:1 "Pierres de portage"
 RICE_portage_erect_stones_nonchristian_modifier_desc:1 "Ici, les dirigeants locaux ont récemment érigé de nouvelles pierres de voyage, ou restauré celles existantes, en particulier celles situées près des sites de portage le long d'importantes routes commerciales. Ces pierres aident les voyageurs à savoir où ils se trouvent et où ils vont."
 RICE_portage_erect_stones_christian_modifier:1 "Croix de portage"
 RICE_portage_erect_stones_christian_modifier_desc:1 "Ici, les dirigeants locaux ont récemment érigé de nouvelles croix de pierre pour les voyageurs, ou restauré celles existantes, en particulier celles situées près des sites de portage le long d'importantes routes commerciales. Ces pierres aident les voyageurs à savoir où ils se trouvent et où ils vont."
 RICE_portage_levy_boat_builders_modifier:1 "Constructeurs de bateaux réquisitionnés"
 RICE_portage_levy_boat_builders_modifier_desc:1 "Ce personnage a réquisitionné les paysans vivant dans les territoires qu'il gouverne dans la [GetGeographicalRegion('RICE_volga_dnieper_trade_region').GetName|l] pour construire et réparer des bateaux pour lui."
 RICE_portage_maintain_hauling_sites_modifier:1 "Sites de halage de portage entretenus"
 RICE_portage_maintain_hauling_sites_modifier_desc:1 "Les dirigeants locaux ont récemment pris des mesures pour améliorer l'infrastructure des routes de portage dans cette région."
 RICE_portage_promote_merchants_modifier:1 "Promotion du commerce dans la [GetGeographicalRegion('RICE_volga_dnieper_trade_region').GetNameNoTooltip|l]"
 RICE_portage_promote_merchants_modifier_desc:1 "Ce personnage a pris des mesures pour soutenir le commerce dans la [GetGeographicalRegion('RICE_volga_dnieper_trade_region').GetName|l]. Ce faisant, il développe également ses propres réseaux commerciaux personnels."
 RICE_portage_reinforce_river_forts_modifier:1 "Forts fluviaux renforcés"
 RICE_portage_reinforce_river_forts_modifier_desc:1 "Les dirigeants locaux ont récemment renforcé et réparé les forts existants, et en ont construit de nouveaux, le long de positions stratégiques, en particulier celles vitales pour le commerce dans la [GetGeographicalRegion('RICE_volga_dnieper_trade_region').GetName|l]."
 RICE_portage_encourage_settlement_modifier:1 "Colonisation encouragée"
 RICE_portage_encourage_settlement_modifier_desc:1 "Récemment, des colons venus de loin sont arrivés pour construire de nouveaux établissements ou accroître la population de ceux déjà existants. Ces établissements font partie de réseaux commerciaux dans la [GetGeographicalRegion('RICE_volga_dnieper_trade_region').GetName|l], et beaucoup se trouvent sur d'importantes routes de portage."
 RICE_volga_dnieper_trade_amber_modifier:1 "Commerce Volga-Dniepr : Ambre"
 RICE_volga_dnieper_trade_amber_modifier_desc:1 "Ce personnage soutient le commerce de l'ambre dans la [GetGeographicalRegion('RICE_volga_dnieper_trade_region').GetName|l]. Cette substance précieuse est récoltée principalement dans les régions baltes, et est utilisée à la fois en joaillerie et comme médicament."
 RICE_volga_dnieper_trade_honey_modifier:1 "Commerce Volga-Dniepr : miel et cire d'abeille"
 RICE_volga_dnieper_trade_honey_modifier_desc:1 "Ce personnage soutient le commerce du miel et de la cire d'abeille dans la [GetGeographicalRegion('RICE_volga_dnieper_trade_region').GetName|l]. Les produits de la ruche sont une exportation importante des terres fluviales d'Europe de l'Est."
 RICE_volga_dnieper_trade_slaves_modifier:1 "Commerce Volga-Dniepr : Esclaves"
 RICE_volga_dnieper_trade_slaves_modifier_desc:1 "Ce personnage soutient le commerce des esclaves dans la [GetGeographicalRegion('RICE_volga_dnieper_trade_region').GetName|l]. Les personnes capturées lors de raids à travers le nord et l'est de l'Europe, ainsi que les steppes occidentales, sont souvent vendues comme esclaves sur les marchés d'esclaves eurasiens."
 RICE_volga_dnieper_trade_furs_modifier:1 "Commerce Volga-Dniepr : Fourrures"
 RICE_volga_dnieper_trade_furs_modifier_desc:1 "Ce personnage soutient le commerce des fourrures dans la [GetGeographicalRegion('RICE_volga_dnieper_trade_region').GetName|l]. La plupart de ces fourrures proviennent de divers animaux originaires du nord de l'Europe, qui possèdent d'épaisses couches de fourrure pour survivre dans le froid."
 RICE_volga_dnieper_trade_weapons_modifier:1 "Commerce Volga-Dniepr : Armes"
 RICE_volga_dnieper_trade_weapons_modifier_desc:1 "Ce personnage soutient le commerce d'armes dans la [GetGeographicalRegion('RICE_volga_dnieper_trade_region').GetName|l]. Bien que le flux d'armes en fer finement forgées circule dans les deux sens le long de ces routes commerciales, beaucoup proviennent de Scandinavie."
 RICE_volga_dnieper_trade_ivory_modifier:1 "Commerce Volga-Dniepr : ivoire de morse"
 RICE_volga_dnieper_trade_ivory_modifier_desc:1 "Ce personnage soutient le commerce de l'ivoire de morse dans la [GetGeographicalRegion('RICE_volga_dnieper_trade_region').GetName|l]. Une grande partie de l'ivoire provient du [greenland|E], bien que la mer du Nord soit également une source moindre de cet ivoire."
 RICE_volga_dnieper_trade_textiles_modifier:1 "Commerce Volga-Dniepr : Textiles"
 RICE_volga_dnieper_trade_textiles_modifier_desc:1 "Ce personnage soutient le commerce des textiles dans la [GetGeographicalRegion('RICE_volga_dnieper_trade_region').GetName|l]. Ces textiles comprennent le lin et la laine, mais le type le plus rentable est la soie, qui est produite dans diverses régions de la Méditerranée, du Moyen-Orient et de la Chine."
 RICE_volga_dnieper_trade_coins_modifier:1 "Commerce Volga-Dniepr : Pièces"
 RICE_volga_dnieper_trade_coins_modifier_desc:1 "Ce personnage soutient le commerce de pièces d'argent et d'or dans la [GetGeographicalRegion('RICE_volga_dnieper_trade_region').GetName|l]. Bien qu'éloignées de leurs terres d'origine, ces pièces, telles que les dirhams en argent, circulent largement dans les économies locales."
 RICE_volga_dnieper_trade_spices_modifier:1 "Commerce Volga-Dniepr : Épices"
 RICE_volga_dnieper_trade_spices_modifier_desc:1 "Ce personnage soutient le commerce des épices dans la [GetGeographicalRegion('RICE_volga_dnieper_trade_region').GetName|l]. Les nombreuses épices disponibles sur le marché proviennent du monde entier, et tout le monde sait que c'est un commerce profitable."
 RICE_volga_dnieper_trade_wines_modifier:1 "Commerce Volga-Dniepr : Vin"
 RICE_volga_dnieper_trade_wines_modifier_desc:1 "Ce personnage soutient le commerce du vin dans la [GetGeographicalRegion('RICE_volga_dnieper_trade_region').GetName|l]. Le vin produit dans les régions méditerranéennes est très demandé en de nombreux endroits, comme l'Europe du Nord, en particulier parmi les classes élitistes."
 RICE_volga_dnieper_trade_art_modifier:1 "Commerce Volga-Dniepr : Art"
 RICE_volga_dnieper_trade_art_modifier_desc:1 "Ce personnage soutient le commerce d'art dans la [GetGeographicalRegion('RICE_volga_dnieper_trade_region').GetName|l]. Qu'il s'agisse d'icônes religieuses et de sculptures de Byzance, ou de décors ornés tels que la porcelaine du Moyen-Orient et d'Asie de l'Est, un tel art est un signe de raffinement et d'opulence pour ceux qui peuvent se le permettre."
 RICE_galicia2_found_fern_flower:1 "Trouver une fleur de fougère"
 RICE_galicia2_found_fern_flower_desc:1 "Ce personnage aurait trouvé une [Glossary( 'fleur de fougère', 'FERN_FLOWER_GLOSS' )] durant la Nuit de Kupala, la fête traditionnelle slave célébrant le solstice d'été, et l'on dit qu'il en aurait tiré des pouvoirs miraculeux."
 RICE_kupala_night_herbs_modifier:1 "Herbes récoltées durant la Nuit de Kupala"
 RICE_kupala_night_county_modifier:1 "Célébration de Kupala réussie"
 RICE_rus_founder_modifier:1 "Le Grand chef $russian$"
 RICE_rus_founder_modifier_desc:1 "Ce personnage a joué un rôle majeur dans l'essor du peuple $russian$ en Europe de l'Est."
 RICE_galicia2_cremation_crackdown:1 "Répression des pratiques païennes de crémation"
 RICE_galicia2_cremation_continued:1 "Tolérance des pratiques de crémation païennes"
 RICE_galicia2_cochineal_explainer:1 "Connaissance du commerce de la cochenille"
 RICE_galicia2_suspicious_of_cochineal_merchants:1 "Suspicion à l'égard des marchands de cochenille"
 RICE_galicia2_galicia_volhynia_architecture_modifier:1 "Épanouissement de l'architecture de Galicie-Volhynie"
 
 # Borrowed from Baptism of Rus
 bhakti_slavic_perun:0 "Perun honoré"
 bhakti_slavic_perun_desc:0 "Ce dirigeant a érigé une idole à Perun, le dieu suprême et maître des tempêtes, du tonnerre et des armes métalliques."
 bhakti_slavic_veles:0 "Vélès honoré"
 bhakti_slavic_veles_desc:0 "Ce souverain a érigé une idole à Vélès, le souverain du monde souterrain aquatique et dieu du bétail, de la poésie et de la sorcellerie."
 bhakti_slavic_stribog:0 "Stribog honoré"
 bhakti_slavic_stribog_desc:0 "Ce souverain a érigé une idole à Stribog, le dieu du vent qui répand la richesse."
 bhakti_slavic_mokosh:0 "Mokosh honorée"
 bhakti_slavic_mokosh_desc:0 "Ce dirigeant a érigé une idole à Mokosh la mère, protectrice des femmes et déesse du tissage, des moutons et de l'accouchement."
 bhakti_slavic_simargl:0 "Simargl honoré"
 bhakti_slavic_simargl_desc:0 "Ce dirigeant a érigé une idole à Simargl les chiens ailés, intermédiaires entre le ciel et la terre et protecteurs des graines, des pousses et des humains."
 bhakti_slavic_khors_dazhbog:0 "Khors Dazhbog honorés"
 bhakti_slavic_khors_dazhbog_desc:0 "Ce dirigeant a érigé une idole à Khors et Dazhbog, dieux du soleil et de la lune, de l'abondance et de la bonté."

