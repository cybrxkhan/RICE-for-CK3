 RICE_portage_encourage_settlement_effect_tooltip_1:"Il y a une très faible chance que les [counties|El] que vous possédez dans la [GetGeographicalRegion('RICE_volga_dnieper_trade_region').GetName] se convertissent à votre [culture|El] et [faith|El]"
 RICE_rus_culture_decision:0 "Établir la culture $russian$"
 RICE_rus_culture_decision_tooltip:1 "Un nouveau peuple émerge en Europe de l'Est !"
 RICE_rus_culture_decision_desc:0 "Au fil du temps, bien des [cultures|El] se sont mélangées et influencées mutuellement dans les terres fluviales d'Europe de l'Est. Peut-être que si ces tribus querelleuses étaient unies en une seule, elles pourraient contrôler les routes commerciales et devenir une force puissante et respectée avec laquelle il faudrait compter..."
 RICE_rus_culture_decision_effect_tooltip_1:1 "La [culture|El] [rus_culture.GetName]  obtiendra l'[heritage|El] de la [culture|El] dans votre [capital|El], [capital_culture.GetName], qui est actuellement [capital_culture.GetHeritage.GetName]"
 RICE_rus_culture_decision_effect_tooltip_2:1 "Vous choisirez si la [language|El] principale des [rus_culture.GetCollectiveNoun|l] sera la lingua franca existante [rus_culture.GetLanguage.GetName], ou votre [language|El] natale ou la [language|El] de la [culture|El] de votre [capital|El] (si elles sont différentes)"
 RICE_rus_culture_decision_effect_tooltip_3:1 "La [culture|El] [rus_culture.GetName] gagnera une à deux [traditions|El] valides aléatoires"
 RICE_rus_culture_decision_effect_tooltip_4:1 "Plusieurs de vos [counties|El] se convertiront aléatoirement à la [culture|El] [rus_culture.GetName]"
 RICE_rus_culture_decision_effect_tooltip_5:1 "Les [rulers|El] et les [counties|El] dans la [region|El] de la Rus, en particulier vos [vassals|El] et ceux le long des grands fleuves et des villes, pourraient se convertir à la [culture|El] [rus_culture.GetName]"
 RICE_rus_culture_decision_confirm:0 "Les $russian_collective_noun|l$ domineront ces terres !"
 RICE_rus_culture_decision_context_tooltip:0 "#emphasis Contexte historique :#! La nature exacte de l'ethnogenèse des Rus est encore débattue, mais on pense que les premiers Rus, sous influence scandinave, régnaient historiquement non seulement sur des peuples slaves, mais aussi sur d'autres comme les Finnois et les Baltes. À long terme, ces peuples ont fini par s'assimiler pour devenir des Slaves orientaux à mesure qu'ils se consolidaient sous le règne des princes Riourikides. Les Rus seraient finalement les ancêtres des peuples russes, ukrainiens et biélorusses modernes."

