 # Buildings
 building_type_RICE_kamianets_podilskyi_castle_01:0 "Fortifications de Kamianets-Podilskyi"
 building_type_RICE_kamianets_podilskyi_castle_01_desc:0 "Kamianets-Podilskyi est un petit mais important fort situé à un carrefour stratégique dans la région de Podilie. Le commerce, ainsi que les armées d'invasion, y passent fréquemment."
 building_RICE_kamianets_podilskyi_castle_01:0 "Fort de Kamianets-Podilskyi"
 building_RICE_kamianets_podilskyi_castle_01_desc:0 "$building_type_RICE_kamianets_podilskyi_castle_01_desc$"
 building_RICE_kamianets_podilskyi_castle_02:0 "Château de Kamianets-Podilskyi"
 building_RICE_kamianets_podilskyi_castle_02_desc:0 "Cette impressionnante forteresse se dresse à un carrefour stratégique dans la région de Podilie. Le commerce, ainsi que les armées d'invasion, passent fréquemment par ici. Des vagues successives de souverains ont ajouté leurs propres éléments uniques à l'architecture de ce château, qui peut facilement résister à la plupart des assaillants."
 building_type_RICE_galicia2_cochineal_industry_01:0 "Industrie de la cochenille"
 building_type_RICE_galicia2_cochineal_industry_01_desc:0 "La teinture rouge est produite dans des plantations qui récoltent les larves de l'insecte [Glossary( 'cochenille', 'COCHINEAL_GLOSS' )] que l'on trouve dans diverses [GetGeographicalRegion('RICE_european_cochineal_region').GetName|l]. Cette teinture se vend à des prix élevés sur les marchés internationaux."
 building_RICE_galicia2_cochineal_industry_01:0 "Petites Plantations de Cochenille"
 building_RICE_galicia2_cochineal_industry_01_desc:0 "En récoltant la [Glossary( 'cochenille', 'COCHINEAL_GLOSS' )] de manière plus organisée dans des plantations, la quantité de teinture rouge produite à partir de ces insectes est considérablement augmentée."
 building_RICE_galicia2_cochineal_industry_02:0 "Grandes plantations de cochenille"
 building_RICE_galicia2_cochineal_industry_02_desc:0 "Alors que les plantations de [Glossary( 'cochenille', 'COCHINEAL_GLOSS' )] de cette région étendent leurs opérations, elles ont tissé des liens plus solides avec les marchands étrangers, permettant aux teintures rouges produites à partir des insectes d'ici d'être vendues sur encore plus de marchés à l'international."
 building_RICE_galicia2_cochineal_industry_03:0 "Vastes plantations de cochenille"
 building_RICE_galicia2_cochineal_industry_03_desc:0 "Cette région possède certaines des plus grandes plantations de [Glossary( 'cochenille', 'COCHINEAL_GLOSS' )] d'Eurasie. Les teintures rouges produites ici à partir des larves de l'insecte cochenille se vendent à prix élevé sur de nombreux marchés internationaux."
 
 # Traits
 trait_RICE_volga_dnieper_merchant:0 "Marchand de la Volga-Dniepr"
 trait_RICE_volga_dnieper_merchant_desc:0 "Ce personnage est un marchand éminent le long des routes commerciales dans les bassins fluviaux de la Volga et du Dniepr et les régions environnantes. Il a de l'expérience dans les arts du commerce, du voyage et de la négociation."
 trait_RICE_volga_dnieper_merchant_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] est un marchand éminent le long des routes commerciales des bassins fluviaux de la Volga et du Dniepr et des régions environnantes. [ROOT.GetCharacter.GetSheHe|U] a de l'expérience dans les arts du commerce, du voyage et de la négociation."
 trait_RICE_volga_dnieper_merchant_2:0 "Marchand renommé de la Volga-Dniepr"
 trait_RICE_volga_dnieper_merchant_2_desc:0 "$trait_RICE_volga_dnieper_merchant_desc$"
 trait_RICE_volga_dnieper_merchant_2_character_desc:0 "$trait_RICE_volga_dnieper_merchant_character_desc$"
 trait_RICE_volga_dnieper_merchant_3:0 "Marchand légendaire de la Volga-Dniepr"
 trait_RICE_volga_dnieper_merchant_3_desc:0 "$trait_RICE_volga_dnieper_merchant_desc$"
 trait_RICE_volga_dnieper_merchant_3_character_desc:0 "$trait_RICE_volga_dnieper_merchant_character_desc$"
 trait_track_RICE_volga_dnieper_merchant:0 "$trait_RICE_volga_dnieper_merchant$"
 trait_track_RICE_volga_dnieper_merchant_desc:0 "Bien que considérée par les étrangers comme une terre rude et inhospitalière, les voies fluviales et les forêts d'Europe orientale offrent de nombreuses opportunités commerciales, notamment pour divers produits de luxe, qui sont vendus à travers le monde."
 
 # Aspirations
 RICE_galicia2_aspiration_roman_desc:"\n\n#bold [historical_aspiration_main_objectives|E]#!\n$EFFECT_LIST_BULLET$Être le [ruler|El] [independent|El] de [GetTitleByKey('k_galicia-volhynia').GetNameNoTier]\n$EFFECT_LIST_BULLET$[completely_control|E] [GetTitleByKey('d_halych').GetNameNoTier], [GetTitleByKey('d_volhynia').GetNameNoTier], et [GetTitleByKey('d_cherven_cities').GetNameNoTier]\n$EFFECT_LIST_BULLET$Avoir un [piety_level|El] de [GetModifier( 'piety_level_3' ).GetNameWithTooltip|L] ou plus\n$EFFECT_LIST_BULLET$Avoir un [prestige_level|El] de [GetModifier( 'prestige_level_3' ).GetNameWithTooltip|L] ou plus\n$EFFECT_LIST_BULLET$L'[GetTitleByKey('e_byzantium').GetNameNoTier] existe toujours\n$EFFECT_LIST_BULLET$Être de la même [religion|El] que le [ruler|El] de l'[GetTitleByKey('e_byzantium').GetNameNoTier]\n$EFFECT_LIST_BULLET$Ne pas être en [war|El] avec l'[GetTitleByKey('e_byzantium').GetNameNoTier]\n\n#bold Récompenses#!\n$EFFECT_LIST_BULLET$Gain de @legitimacy_icon! #V [EmptyScope.ScriptValue('medium_legitimacy_gain')]#! de [legitimacy|El]\n$EFFECT_LIST_BULLET$Gain d'un [perk|El] de [diplomacy_lifestyle|El]\n$EFFECT_LIST_BULLET$Recevez #V 1000#! [special_troops|El], dont des [men_at_arms|El]\n$EFFECT_LIST_BULLET$Obtenir un [marriage|El] avec une femme royale ou noble byzantine éligible si l'[GetTitleByKey('e_byzantium').GetNameNoTier] existe toujours pour davantage de @legitimacy_icon! [legitimacy|El] et de [prestige_i|El] [prestige|El] (vous devrez peut-être [divorce|El] tout [spouse|El] que vous avez)\n$EFFECT_LIST_BULLET$Gain d'une [alliance|El] avec le [ruler|El] de L'[GetTitleByKey('e_byzantium').GetNameNoTier] s'il existe toujours\n\n#bold [historical_aspiration_bonus_objectives|E]#!\n$EFFECT_LIST_BULLET$Contrôler le [county|El] de [GetTitleByKey('c_kiev').GetNameNoTier] (Récompense : Gain d'un [perk|El] de [martial_lifestyle|El])\n$EFFECT_LIST_BULLET$Avoir un [legitimacy_i|El] [legitimacy_level|El] de #V 5#! (Récompense : Recevez #V 1000#! [special_troops|El], dont des [men_at_arms|El])"
 RICE_galicia2_historical_aspiration_action_roman:"#italic Alors que les Rurikides se querellent entre eux, c'est l'occasion pour vous d'établir un nouveau centre de pouvoir en Europe de l'Est et de gagner le respect de la mère spirituelle de la Rus, l'[GetTitleByKey('e_byzantium').GetNameNoTier].#!$RICE_galicia2_aspiration_roman_desc$"
 RICE_galicia2_historical_aspiration_modifier_desc_roman: "[GetModifier('RICE_galicia2_aspiration_unify_galicia_and_volhynia').GetNameWithTooltip]"
 RICE_galicia2_aspiration_oleg_desc:"\n\n#bold [historical_aspiration_main_objectives|E]#!\n$EFFECT_LIST_BULLET$[completely_control|E] et détient le [title|El] de [GetTitleByKey('d_halych').GetNameNoTier] en tant que [ruler|El] [independent|El]\n$EFFECT_LIST_BULLET$Vladimir Yaroslavitch (votre demi-frère aîné) est mort\n$EFFECT_LIST_BULLET$Chaque [vassal|El] direct est soit [intimidated|El] soit [cowed|El] par vous, ou a au moins #P 25#! d'[opinion|El] envers vous\n\n#bold Récompenses#!\n$EFFECT_LIST_BULLET$Gain de @legitimacy_icon! #V [EmptyScope.ScriptValue('medium_legitimacy_gain')]#! de [legitimacy|El]\n$EFFECT_LIST_BULLET$Gain de @prestige_icon! #V [EmptyScope.ScriptValue('RICE_aspiration_large_resource_bonus')]#! de [prestige|El]\n$EFFECT_LIST_BULLET$Gain d'un [perk|El] de [intrigue_lifestyle|El]\n$EFFECT_LIST_BULLET$Perdez le [modifier|El] [GetModifier('RICE_galicia2_oleg_negative_modifier').GetNameWithTooltip] et gagnez une version #P bénéfique#! à la place\n\n#bold [historical_aspiration_bonus_objectives|E]#!\n$EFFECT_LIST_BULLET$Avoir un [piety_level|El] de [GetModifier( 'piety_level_3' ).GetNameWithTooltip|L] ou plus (Récompense : Gain d'un [perk|El] de [diplomacy_lifestyle|El])\n$EFFECT_LIST_BULLET$Avoir un [legitimacy_level|El] de [legitimacy_i|El] 5 (Récompense : Recevez #V 1000#! [special_troops|El], incluant des [men_at_arms|El])"
 RICE_galicia2_historical_aspiration_action_oleg:"#italic Même si vous héritez de [GetTitleByKey('d_halych').GetNameNoTier] comme votre père le désire, vous devez faire tout ce qui est en votre pouvoir pour freiner les boyards galiciens assoiffés de pouvoir, qui avaient même osé assassiner brutalement votre mère.#!$RICE_galicia2_aspiration_oleg_desc$"
 RICE_galicia2_historical_aspiration_modifier_desc_oleg: "[GetModifier('RICE_galicia2_aspiration_secure_rule_against_galician_boyars').GetNameWithTooltip]" 

 # Aspiration Modifiers
 RICE_galicia2_aspiration_unify_galicia_and_volhynia:"[RICE_aspiration|E] : Unifier $d_halych$ et $d_volhynia$"
 RICE_galicia2_aspiration_unify_galicia_and_volhynia_desc:"#italic Alors que les Riourikides se querellent entre eux, c'est une opportunité pour Roman d'établir un nouveau centre de pouvoir en Europe de l'Est et de gagner le respect de la mère spirituelle de la Rus, l'[GetTitleByKey('e_byzantium').GetNameNoTier].#!$RICE_galicia2_aspiration_roman_desc$\n\n"
 RICE_galicia2_aspiration_secure_rule_against_galician_boyars:"[RICE_aspiration|E] : Sécuriser le pouvoir contre les boyards galiciens"
 RICE_galicia2_aspiration_secure_rule_against_galician_boyars_desc:"#italic Même si Oleg hérite de [GetTitleByKey('d_halych').GetNameNoTier] comme son père le désire, il doit faire tout ce qu'il peut pour maîtriser les boyards galiciens avides de pouvoir, qui avaient même osé assassiner brutalement la mère d'Oleg.#!$RICE_galicia2_aspiration_oleg_desc$\n\n"
 
 # Memories
 
 # Activities
 activity_RICE_galicia2_kupala_night_host_an_a:0 "une"
 activity_RICE_galicia2_kupala_night:0 "Nuit de Kupala"
 activity_RICE_galicia2_kupala_night_desc:0 "Pour de nombreux peuples slaves, le solstice d'été est un temps d'importance rituelle et de grande festivité."
 activity_RICE_galicia2_kupala_night_selection_tooltip:"Célébrez la nuit de Kupala.\n\n$activity_RICE_galicia2_kupala_night_context_tooltip$"
 activity_RICE_galicia2_kupala_night_context_tooltip:0 "#emphasis Contexte Historique :#! Le Kupala est la fête traditionnelle du solstice d'été des peuples slaves, en particulier des Slaves de l'Ouest et de l'Est. Elle est attestée depuis l'époque médiévale, bien qu'il y ait eu des tentatives pour la supprimer au cours des siècles, les autorités chrétiennes la considérant comme une pratique païenne. La représentation de la nuit de Kupala avec cette activité est vaguement basée sur un amalgame de différentes pratiques modernes dans divers pays slaves, et peut donc ne pas refléter la célébration historique réelle de la période médiévale."
 activity_RICE_galicia2_kupala_night_host_desc:"\n$BULLET_WITH_TAB$#P Gain#! de [prestige_i|E][prestige|El]\n$BULLET_WITH_TAB$Perte de [stress_loss_i|E][stress|El]\n$BULLET_WITH_TAB$Possibilité de gagner des [character_modifiers|E] #P bénéfiques#!\n$BULLET_WITH_TAB$Possibilité pour les [counties|E] possédés de gagner des [county_modifiers|E] #P bénéfiques#!\n$BULLET_WITH_TAB$Vous #N perdrez#! de la [piety_i|E][piety|El] si vous suivez une [faith|El] non-païenne sans la [doctrine|El] [GetFaithDoctrine('doctrine_pluralism_pluralistic').GetBaseName] ou le [core_tenet|El] $tenet_unreformed_syncretism_name$"
 activity_RICE_galicia2_kupala_night_guest_desc: "$activity_RICE_galicia2_kupala_night_host_desc$"
 activity_RICE_galicia2_kupala_night_province_desc: ""
 activity_RICE_galicia2_kupala_night_destination_selection: "$activity_RICE_galicia2_kupala_night_province_desc$"
 activity_RICE_galicia2_kupala_night_guest_help_text: "$activity_RICE_galicia2_kupala_night$"
 activity_RICE_galicia2_kupala_night_predicted_cost:"Le coût de cette [activity|El] est principalement basé sur votre [income|El]."
 activity_RICE_galicia2_kupala_night_conclusion_desc:"[GetActivityType( 'activity_RICE_galicia2_kupala_night' ).GetName] est arrivé à sa fin, et l'été a commencé !"
 RICE_galicia2_kupala_night_celebration_phase: "Célébration"
 RICE_galicia2_kupala_night_celebration_phase_desc:"Le solstice d'été est arrivé !"
 RICE_galicia2_kupala_night_fun_intent_header: "Plaisir :"
 RICE_galicia2_kupala_night_fun_intent: "Plaisir"
 RICE_galicia2_kupala_night_fun_intent_desc:"Vous vous concentrez sur le fait de vous amuser avec tout le monde. Perdez du [stress_loss_i|El] [stress|El] supplémentaire, et perdez-en encore plus si vous êtes [GetTrait('gregarious').GetName( GetNullCharacter )] ou [GetTrait('lustful').GetName( GetNullCharacter )]."
 RICE_galicia2_kupala_night_lavation_intent_header:"Ablution :"
 RICE_galicia2_kupala_night_lavation_intent: "Ablution"
 RICE_galicia2_kupala_night_lavation_intent_desc:"Vous vous concentrez sur les rituels et sur votre purification. Gagnez plus de [piety_i|El] [piety|El] en tant que païen, ou de [prestige_i|El] [prestige|El] en tant que non-païen. Perdez plus de [stress_loss_i|El] [stress|El] si vous êtes [GetTrait('diligent').GetName( GetNullCharacter )] ou [GetTrait('paranoid').GetName( GetNullCharacter )]."
 RICE_galicia2_kupala_night_herb_gathering_intent_header:"Cueillette d'herbes :"
 RICE_galicia2_kupala_night_herb_gathering_intent:"Cueillette d'herbes"
 RICE_galicia2_kupala_night_herb_gathering_intent_desc:"Vous vous concentrez sur la cueillette de plantes. Vous êtes assuré d'obtenir un événement sur les herbes pour gagner un [modifier|El] #P bénéfique#! et d'augmenter vos chances de trouver une [Glossary( 'fleur de fougère', 'FERN_FLOWER_GLOSS' )]. Vous gagnerez aussi du [prestige_i|El] [prestige|El] grâce à cet événement (normalement vous n'en gagneriez pas). Perdez plus de [stress_loss_i|El] [stress|El] si vous êtes [GetTrait('patient').GetName( GetNullCharacter )] ou [GetTrait('humble').GetName( GetNullCharacter )]."
 RICE_galicia2_kupala_night_completed_log_title:0 "$activity_RICE_galicia2_kupala_night$ prend fin"
 RICE_galicia2_kupala_night_completed_log:0 "[CHARACTER.GetShortUIName|U] a fini de célébrer la $activity_RICE_galicia2_kupala_night$."
 TRAVEL_NAME_FOR_activity_RICE_galicia2_kupala_night:0 "[Character.GetFirstNamePossessiveNoTooltip] $activity_RICE_galicia2_kupala_night$"
 RICE_galicia2_kupala_night_found_searching_for_herbs_log_title:0 "Cueillette de plantes"
 RICE_galicia2_kupala_night_found_searching_for_herbs_log:0 "[CHARACTER.GetShortUIName|U] a passé du temps à cueillir diverses herbes, fleurs et plantes."
 RICE_galicia2_kupala_night_found_fern_flower_log_title:0 "Fleur de Fougère"
 RICE_galicia2_kupala_night_found_fern_flower_log:0 "[CHARACTER.GetShortUIName|U] aurait apparemment trouvé la légendaire [Glossary( 'fleur de fougère', 'FERN_FLOWER_GLOSS' )]."
 RICE_galicia2_kupala_night_amorous_encounter_log_title:0 "Rencontre amoureuse"
 RICE_galicia2_kupala_night_amorous_encounter_log:0 "[CHARACTER.GetShortUIName|U] a été aperçu[CHARACTER.Custom('FR_E')] revenant vers les feux de joie avec [lover.GetShortUIName|U], après avoir passé un temps plutôt long ensemble dans la nature."
 RICE_activity_result_kupala_night_county_modifier:0 "Un ou plusieurs [counties|El] de [host.GetTitledFirstNamePossessive] ont obtenu le [county_modifier|El] [GetModifier('RICE_kupala_night_county_modifier').GetNameWithTooltip]"
 
 # Modifiers
 RICE_galicia2_cochineal_modifier_1:1 "Investissements dans l'industrie de la cochenille (Niveau 1)"
 RICE_galicia2_cochineal_modifier_1_desc:1 "La teinture rouge produite dans les plantations locales provient des larves de l'insecte [Glossary( 'cochenille', 'COCHINEAL_GLOSS' )] et constitue une exportation lucrative. Les dirigeants locaux font tout leur possible pour soutenir la récolte et l'exportation de ces teintures.\n\n#EMP La puissance de ce [modifier|El] est basée sur le fait que le [duchy|El] de ce [county|El] possède le [duchy_building|El] $building_type_RICE_galicia2_cochineal_industry_01$ lorsque la [decision|El] de #V $RICE_galicia2_support_cochineal_industry$#! a été prise.#!"
 RICE_galicia2_cochineal_modifier_2:1 "Investissements dans l'industrie de la cochenille (Niveau 2)"
 RICE_galicia2_cochineal_modifier_2_desc:1 "$RICE_galicia2_cochineal_modifier_1_desc$"
