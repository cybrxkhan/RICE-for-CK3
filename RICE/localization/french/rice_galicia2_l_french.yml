 galicia2.0030.t:0 "Les héritiers du [yaroslav.GetTitledFirstNamePossessiveNoTooltip]"
 galicia2.0030.desc:0 "Je n'ai guère de doute quant à la raison pour laquelle mon père [yaroslav.GetTitledFirstName] m'a choisi comme héritier pour gouverner [GetTitleByKey('d_halych').GetNameNoTier]. Mon demi-frère [vladimir.GetFirstName] est peut-être plus âgé, et né d'une épouse légitime, mais c'est un crétin dissolu et prodigue, facilement manipulé par les boyards assoiffés de pouvoir. Bien que je sois à peine adulte, et un enfant illégitime, je fais grande figure en comparaison.\n\nPourtant, ces maudits boyards ! Ce sont eux qui ont déclaré que ma mère innocente, la maîtresse de mon père, était une sorcière. Et c'est ainsi qu'ils l'ont tuée il y a des années en la brûlant sur le bûcher.\n\nJe préférerais me débarrasser d'eux tous, mais le monde n'est pas parfait. Si j'hérite des titres de mon père, les boyards se montreront problématiques ; ils diront que je ne mérite pas de régner en tant que fils de la sorcière, et utiliseront [vladimir.GetFirstNameNoTooltip] pour obtenir davantage de pouvoir. Je dois être prudent, si je veux survivre."
 galicia2.0030.a:0 "Chère mère au ciel, protégez-moi de nos ennemis..."
 galicia2.0031.t:0 "$RICE_historical_aspiration_fulfilled_title$"
 galicia2.0031.desc:0 "Enfin. Enfin, après tant et tant d'attente.\n\nJe peux affirmer avec confiance que grâce à mes efforts, [GetTitleByKey('d_halych').GetNameNoTier] est sous mon contrôle absolu. Mère, j'espère que vous pouvez désormais reposer en paix au paradis. Mon dégénéré de demi-frère, [vladimir.GetFirstNameNoTooltip], est mort. Les boyards ne peuvent plus l'utiliser comme une marionnette pour résister à mon autorité.\n\nEt les boyards incapables eux-mêmes ? Ils ont appris soit à m'accepter comme leur suzerain, soit à accepter qu'ils ne sont pas les bienvenus ici. Ils n'iront plus à l'encontre des volontés de mon père - ni des miennes.\n\nCertains m'appellent encore le fils de la sorcière, mère, mais ils le font avec crainte et même respect. C'est #italic moi#! qui gouverne [GetTitleByKey('d_halych').GetNameNoTier] désormais. Personne d'autre."
 galicia2.0031.a:0 "On dit que je connais aussi la magie noire. Qu'ils me craignent !"
 galicia2.0031.b:0 "J'ai le soutien du peuple - #italic ça#! c'est le vrai pouvoir !"
 galicia2.0031.c:0 "Grâce à un dur labeur, je suis désormais respecté en tant que dirigeant."
 galicia2.0032.t:0 "Le Prince de [GetTitleByKey('d_volhynia').GetNameNoTierNoTooltip]"
 galicia2.0032.desc:0 "Les princes [ROOT.Char.GetDynasty.GetName] ne sont pas unis depuis des décennies. Les terres des [ROOT.Char.GetCulture.GetCollectiveNoun|l] ont été emportées dans de mesquines querelles entre les princes de notre dynastie, des seigneurs de guerre étrangers, et des boyards et roturiers ingrats et voraces.\n\nPar exemple, le peuple de [GetTitleByKey('d_novgorod').GetNameNoTier] m'a un jour invité à régner sur eux. Puis ils m'ont fermement invité à partir, malgré tout ce que j'ai accompli durant mon court mandat. Tels sont les temps.\n\nIl y a quelques années, j'ai succédé à mon père en tant que dirigeant de [GetTitleByKey('d_volhynia').GetNameNoTier]. Il est impératif que j'établisse une base de pouvoir ici, dans mon coin des terres [ROOT.Char.GetDynasty.GetNameNoTooltip|l]. Mais la force militaire, bien qu'importante, ne me mènera que jusqu'à un certain point. Je dois trouver de puissants alliés.\n\nBien que je sois lié par le sang aux dirigeants de [GetTitleByKey('k_poland').GetNameNoTier], je me méfie de leurs intentions. J'ai entendu dire que les dirigeants de l'[GetTitleByKey('e_byzantium').GetNameNoTier], la mère spirituelle des [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip|l], désirent un allié puissant sur lequel compter en ces temps troublés."
 galicia2.0032.a:0 "Peut-être puis-je prouver que je suis digne d'être l'allié des Romains...."
 galicia2.0033.t:0 "$RICE_historical_aspiration_fulfilled_title$"
 galicia2.0033.desc:0 "Il ne fait guère de doute que je suis devenu l'un des plus puissants des princes [ROOT.Char.GetDynasty.GetName] en vie, en contrôlant un royaume puissant forgé par ma propre volonté : [GetTitleByKey('k_galicia-volhynia').GetNameNoTier]. Même les autres princes querelleurs doivent accepter mon autorité, dans une certaine mesure.\n\nMême [emperor.GetTitledFirstName], souverain de l'[GetTitleByKey('e_byzantium').GetNameNoTier], connaît ma puissance, et a envoyé des émissaires pour chercher une alliance avec moi. Quelle gloire, d'être le défenseur inébranlable et l'ami des Romains !\n\n[emperor.GetFirstNameNoTooltip] m'a même offert la main de [wife.GetFirstName] [wife.GetDynasty.GetName] en mariage."
 galicia2.0033.desc.princess:0 "Proposer un mariage avec quelqu'un de sa propre famille n'est pas une mince affaire - [emperor.GetSheHe] désire désespérément une alliance."
 galicia2.0033.desc.noble:0 "[wife.GetSheHe|U] est issu[wife.Custom('FR_E')] d'une famille noble byzantine de renom, et [wife.GetSheHe] pourrait m'offrir des connexions utiles avec l'empire."
 galicia2.0033.a:0 "J'épouserai [wife.GetFirstNameNoTooltip] en signe de mon statut et de mes exploits !"
 galicia2.0033.b:0 "Ma vie conjugale actuelle me convient, mais cette alliance me sera utile."
 galicia2.0033.c:0 "Je n'ai pas besoin de ce mariage. Ils peuvent me faire confiance en tant qu'allié."
 galicia2.0034.t:0 "[roman.GetTitledFirstNameNoTooltip] : un allié potentiel ?"
 galicia2.0034.desc:0 "Dans les terres septentrionales des princes [roman.GetDynasty.GetName], un nouveau dirigeant puissant a émergé : [roman.GetTitledFirstName], qui a récemment consolidé son pouvoir sur [GetTitleByKey('k_galicia-volhynia').GetNameNoTier]. Fait intéressant, [roman.GetFirstName] a fait des ouvertures envers nous, et [roman.GetSheHe] est ouvert[roman.Custom('FR_E')] à une alliance avec moi. [roman.GetSheHe|U] pourrait s'avérer un[roman.Custom('FR_E')] allié[roman.Custom('FR_E')] utile, surtout si nous voulons sécuriser nos frontières septentrionales.\n\nBien que [roman.GetFirstNameNoTooltip] ne l'exige pas, offrir un mariage à une noble byzantine de haut rang pourrait renforcer une alliance en [roman.GetHerHim] liant à notre sphère d'influence. [noble.GetFullName] a été évoquée comme une bonne candidate pour cela."
 galicia2.0034.desc.princess:0 "Un mariage avec un membre de ma famille est également envisageable, mes conseillers ont dit que ma [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('princess'))] [princess.GetFirstName] pourrait être une candidate encore meilleure."
 galicia2.0034.a:0 "Offrir la main de [princess.GetFullNamePossessive] en mariage."
 galicia2.0034.b:0 "Offrir la main de [noble.GetFullNamePossessive] en mariage."
 galicia2.0034.c:0 "Un mariage ne sera pas nécessaire pour assurer cette alliance."
 galicia2.0034.tooltip:0 "Bien que [roman.GetFirstNameNoTooltip] puisse décliner l'offre de mariage (surtout si [roman.GetSheHe] est déjà marié[roman.Custom('FR_E')] et refuse le [divorce|El]), l'[alliance|El] aura tout de même lieu."
 galicia2.0035.t:0 "[roman.GetTitledFirstNameNoTooltip] : Un nouvel allié"
 galicia2.0035.desc:0 "J'ai reçu la nouvelle que [roman.GetFullName] a accepté une offre de mariage avec [wife.GetFirstName] [wife.GetDynasty.GetName] afin de consolider notre alliance. Puisse cette alliance bien servir les deux parties, et puisse [roman.GetFirstNameNoTooltip] nous aider à sécuriser nos frontières septentrionales !\n\nQui plus est, nous pouvons espérer que [wife.GetFirstNameNoTooltip] sera en mesure de répandre l'influence [GetTitleByKey('e_byzantium').GetAdjectiveNoTooltip] dans ces terres du nord grâce à cette alliance."
 galicia2.0035.a:0 "Je prie [ROOT.Char.GetFaith.HighGodName] pour que cette alliance dure longtemps."
 galicia2.0036.t:0 "$galicia2.0035.t$"
 galicia2.0036.desc:0 "J'ai appris que [roman.GetFullName] a décliné une offre de mariage avec [wife.GetFirstName]. Il semble qu'[roman.GetSheHe] estime qu'un tel mariage n'est pas nécessaire pour consolider notre alliance."
 galicia2.0036.desc.wife:0 "J'ai entendu dire que [roman.GetFirstNameNoTooltip] est satisfait[roman.Custom('FR_E')] de sa vie conjugale actuelle, que ce soit vrai ou non."
 galicia2.0036.desc.conclusion:0 "\n\nEn fin de compte, je ne suis pas sûr que ce soit une bonne ou une mauvaise chose, mais je suppose que nous devrons respecter sa décision, afin de ne pas insulter notre allié. Espérons que nous serons encore en mesure de répandre l'influence [GetTitleByKey('e_byzantium').GetAdjectiveNoTooltip] dans ces terres du nord."
 galicia2.0036.a:0 "$galicia2.0035.a$"
