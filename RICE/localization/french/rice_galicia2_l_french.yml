 galicia2.0050.t:0 "Préparations"
 galicia2.0050.desc:0 "Le solstice d'été est arrivé, et cela signifie qu'il est temps de célébrer la Nuit de Kupala ! Telle est notre tradition depuis aussi longtemps que quiconque puisse s'en souvenir.\n\nJe vais me rendre dans un village voisin pour prendre part aux festivités."
 galicia2.0050.desc.non_pagan:0 "Bien que certains [ROOT.Char.Custom('DefaultPriestTitlePlural')] [ROOT.Char.GetFaith.GetReligion.GetAdherentNamePlural] zélés désapprouvent cette pratique, affirmant que ceux qui participent aux festivités font le jeu de [ROOT.Char.GetFaith.DevilName] et s'adonnent au culte de forces obscures, beaucoup de gens ignorent leurs divagations."
 galicia2.0050.a:0 "Le solstice d'été approche bientôt !"
 galicia2.0051.t:0 "Purification de l'eau"
 galicia2.0051.desc:0 "C'est le jour de Kupala !\n\nLa purification a toujours été une part importante de cette journée : la purification par le feu et par l'eau. Les feux de joie devront attendre plus tard dans la nuit, bien sûr ; en attendant, nous devons nous concentrer sur notre purification par l'eau.\n\nLes gens participant aux festivités se sont rassemblés aux rivières, lacs, sources, et toutes les sources d'eau qu'il y a autour du village. Tandis que certains villageois sont partis chercher des herbes et des plantes dans le cadre des festivités, je prends le temps de me plonger dans les eaux, pour me guérir et me purifier."
 galicia2.0051.a:0 "Je me sens déjà tout à fait purifié."
 galicia2.0052.t:0 "Feux de joie"
 galicia2.0052.desc:0 "Alors que le soleil commence à se coucher, les feux de joie de Kupala offrent un spectacle magnifique. Les bûchers ont été dressés par de jeunes hommes et femmes, en particulier les célibataires, non seulement avec du bois, mais aussi de vieux vêtements et des objets cassés, ainsi que des couronnes de fleurs et d'herbes que certains villageois avaient cueillies plus tôt dans la journée. Le plus important de tout est une effigie de paille, jetée dans le feu en guise de rituel de purification.\n\nHommes et femmes portant des guirlandes dansent autour du feu, chantant rituellement des chansons parfois grivoises, tandis que certains des jeunes couples présents tentent de sauter par-dessus les flammes : ceux qui y parviennent sont réputés avoir chance et fortune."
 galicia2.0052.desc.lover:0 "Je vois [jumper.GetFirstName] me lancer des regards significatifs - peut-être pourrions-nous essayer de sauter par-dessus le feu de joie ensemble ?"
 galicia2.0052.a:0 "L'ambiance est plutôt festive."
 galicia2.0052.b:0 "Très bien, [jumper.GetFirstNameNoTooltip], sautons par-dessus le feu !"
 galicia2.0053.t:0 "À la recherche de plantes ?"
 galicia2.0053.desc:0 "Alors que la nuit avance, certains s'aventurent dans la nature à la recherche d'herbes et de plantes précieuses - comme ils l'ont déjà fait tout au long de la journée. Cependant, la nuit est un moment particulier, car on dit que c'est à ce moment-là que quelques chanceux pourraient être en mesure de trouver le trésor le plus célèbre et le plus insaisissable que les gens recherchent : la [Glossary( 'fleur de fougère', 'FERN_FLOWER_GLOSS' )].\n\nNormalement, les fougères n'ont pas de fleurs, de telles fleurs ne fleurissent que durant la Nuit de Kupala - du moins, c'est ce qu'on dit. Quiconque trouve une telle fleur, et parvient à échapper aux griffes des esprits dangereux qui gardent ces fleurs, obtiendrait, dit-on, des pouvoirs miraculeux."
 galicia2.0053.a:0 "Je préfère profiter de la compagnie ici."
 galicia2.0053.b:0 "Chercher la fleur de fougère semble amusant !"
 galicia2.0053.b.tooltip:0 "Vous recherchez et avez une petite chance de trouver l'insaisissable et légendaire [Glossary( 'fleur de fougère', 'FERN_FLOWER_GLOSS' )]."
 galicia2.0054.t:0 "Conclusion"
 galicia2.0054.desc:0 "De nombreuses heures se sont écoulées, et les feux de joie de Kupala commencent enfin à s'éteindre. Comme le veut la coutume, moi et tous les autres, nous sautons à tour de rôle par-dessus les braises mourantes pour porter chance.\n\nEh bien, ce fut assurément une expérience amusante - et purificatrice aussi, bien sûr, étant donné tous les rituels importants que nous avons dû accomplir. Désormais, l'été a véritablement commencé."
 galicia2.0054.a:0 "En effet, les mois d'été sont arrivés."
 galicia2.0055.t:0 "Cueillette de Plantes"
 galicia2.0055.desc:0 "La cueillette d'herbes, de fleurs et de diverses plantes est une coutume importante durant Kupala. Cette année, je me suis laissé entraîner à y participer durant Kupala.\n\nOn dit que c'est un moment idéal pour cueillir de telles plantes, car elles recevraient un grand pouvoir durant le solstice d'été. Peut-être parviendrai-je même à trouver une [Glossary( 'fleur de fougère', 'FERN_FLOWER_GLOSS' )] plus tard..."
 galicia2.0055.a:0 "Je vais y aller tranquillement et m'amuser en faisant cela."
 galicia2.0055.b:0 "Je dois me concentrer sur cette tâche importante !"
 galicia2.0055.b.tooltip:0 "La chance que vous trouviez une [Glossary( 'fleur de fougère', 'FERN_FLOWER_GLOSS' )] est légèrement #P augmentée#! si vous décidez de les chercher plus tard."
 galicia2.0056.t:0 "La fleur de fougère"
 galicia2.0056.desc:0 "Je... Je... Je n'arrive pas à y croire. Non, mes yeux ne peuvent pas me tromper.\n\nÇa y est. Ce doit être une [Glossary( 'fleur de fougère', 'FERN_FLOWER_GLOSS' )]. Oui, la fleur est rouge, tout comme le disent les légendes....\n\nJe dois la cueillir et la garder avec moi, avant que les esprits dangereux qui la protègent ne découvrent ma présence."
 galicia2.0056.a:0 "Oui ! Oui ! Loué soit [ROOT.Char.GetFaith.HighGodName] que j'aie trouvé ceci !"
 galicia2.0057.t:0 "Une rencontre amoureuse ?"
 galicia2.0057.desc:0 "Quelle drôle de coïncidence de te trouver ici, mon [ROOT.Char.Custom('RomanticComplimentAdjective')] [ROOT.Char.Custom('RomanticComplimentNoun')]..."\n\nJe me retourne et aperçois [lover.GetFirstName], avec un léger sourire sur son visage.\n\nJ'étais censé chercher et cueillir des fleurs, des herbes et d'autres plantes comme tout le monde lors de la Nuit de Kupala, en particulier la [Glossary( 'fleur de fougère', 'FERN_FLOWER_GLOSS' )]. Bien sûr, alors que chacun cherche dans la nature, il arrive que l'on croise d'autres personnes - et il n'est pas rare que des gens, surtout de jeunes couples, se livrent à des aventures amoureuses en « cherchant » ."
 galicia2.0057.a:0 "Drôle de coïncidence en effet. « Aidons »-nous mutuellement..."
 galicia2.0057.a.tooltip:0 "#weak Vous vous amusez ensemble en pleine nature.#!"
 galicia2.0057.b:0 "Vous tombez bien - pouvez-vous m'aider à trouver des plantes ?"
