 galicia2.0040.t:0 "Deux frères, un héritage"
 galicia2.0040.desc:0 "[yaroslav.GetTitledFirstName], mon père, est mort. Beaucoup l'ont célébré comme un grand souverain, lui valant le surnom de [yaroslav.GetNickname].\n\nPourtant, avec sa mort, le conflit avec mon frère est inévitable."
 galicia2.0040.desc.vladimir:0 "[oleg.GetFirstName], rejeton de cette sorcière [anastasia.GetFirstName], a hérité des titres de père qui devraient légitimement être les miens ! Père n'était pas un homme sage, mais un fou qui écoutait sa petite maîtresse morveuse, plutôt que ma mère, sa vraie épouse.\n\nIl y a de nombreux boyards qui ont promis de me soutenir, si je fais valoir mes revendications. Pourtant, je sais qu'on ne peut pas leur faire entièrement confiance ; il me faudra peut-être chercher des alliés ailleurs, comme parmi nos lointains parents [vladimir.GetDynasty.GetName], ou même des souverains étrangers. En fin de compte, je ferai tout ce qui est nécessaire pour continuer à profiter de mon style de vie luxueux - un style que je mérite assurément, et non [oleg.GetFirstNameNoTooltip] !"
 galicia2.0040.desc.oleg:0 "Ce [vladimir.GetFirstName] arrogant, bouffi d'orgueil et dégénéré  aurait normalement hérité des titres que mon père m'a accordés, étant donné qu'il est mon demi-frère aîné. Mon père a probablement pressenti que [vladimir.GetFirstNameNoTooltip] serait un dirigeant inefficace, facilement contrôlé par les mêmes boyards qui ont cruellement assassiné ma mère, [anastasia.GetFirstName].\n\nCes mêmes boyards feront tout ce qui est en leur pouvoir pour placer [vladimir.GetFirstNameNoTooltip] sur le trône. Il me faudra peut-être chercher des alliés ailleurs, comme parmi nos lointains parents [vladimir.GetDynasty.GetName], ou même des souverains étrangers, pour pacifier ces boyards turbulents, éliminer [vladimir.GetFirstNameNoTooltip], et survivre. Mon père savait que j'étais le meilleur héritier, et je ne le décevrai pas !"
 galicia2.0040.a:0 "Prends garde, « cher » frère - ton ambition #italic sera#! arrêtée !"
