 galicia2.0010.t:0 "Commerce dans la région de la Volga et du Dniepr"
 galicia2.0010.desc:0 "La [GetGeographicalRegion('RICE_volga_dnieper_trade_region').GetName|l] peut être difficile à traverser pour certains voyageurs, mais des marchands d'origines très diverses parcourent régulièrement ses rivières, forêts, collines et marais en quête de profit et d'aventure.\n\nJ'ai récemment fait la connaissance d'un tel marchand nommé [RICE_volga_dnieper_merchant_spawn.GetFirstName], d'origine [culture.GetName] et pratiquant le culte [faith.GetAdjective]. [RICE_volga_dnieper_merchant_spawn.GetSheHe|U] a l'expérience des routes commerciales de cette région, et se spécialise dans le commerce [GetPlayer.Custom('RICE_volga_dnieper_good_type_loc')] en particulier.\n\nÉtablir une relation professionnelle avec [RICE_volga_dnieper_merchant_spawn.GetFirstNameNoTooltip] pourrait jouer en ma faveur, en favorisant le commerce dans mon domaine. Je pourrais même lui demander de rejoindre ma cour."
 galicia2.0010.a:0 "[RICE_volga_dnieper_merchant_spawn.GetFirstNameNoTooltip], souhaitez-vous travailler pour moi ?"
 galicia2.0010.b:0 "Faisons quelques affaires, [RICE_volga_dnieper_merchant_spawn.GetFirstNameNoTooltip] !"
 galicia2.0010.c:0 "Je n'ai aucun intérêt à travailler avec ce colporteur."
