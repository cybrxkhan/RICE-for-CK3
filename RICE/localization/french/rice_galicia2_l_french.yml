 RICE_volga_dnieper_merchant_trait_gain_tooltip:0 "#weak Vous avez précédemment conclu #V [GetPlayer.MakeScope.Var('RICE_volga_dnieper_merchant_success_count').GetValue]#! accords commerciaux fructueux le long des routes commerciales reliées à la [GetGeographicalRegion('RICE_volga_dnieper_trade_region').GetName|l]. Plus vous concluez d'accords, plus vous avez de chances d'obtenir le [trait|El] [GetTrait('RICE_volga_dnieper_merchant').GetName( GetNullCharacter )].#!"
