 galicia2.0000.t:0 "$galicia2.0002.t$"
 galicia2.0000.desc:0 "Avec la montée des [rus_culture.GetCollectiveNoun|l] parmi les colonies et tribus d'Europe de l'Est, certains dans mon royaume s'identifient déjà à cette nouvelle identité.\n\nForger des liens plus étroits avec certains de mes voisins en adoptant les coutumes et pratiques des [rus_culture.GetCollectiveNounNoTooltip|l], y compris leur variété de la langue [rus_culture.GetLanguage.GetName], pourrait m'aider à étendre mon influence politique et économique."
 galicia2.0000.a:0 "xxxxx"
 galicia2.0001.t:0 "$galicia2.0002.t$"
 galicia2.0001.desc:0 "Au fil du temps, de nombreuses tribus et peuples différents se sont mêlés dans les forêts, les collines, les marais et les plaines fluviales d'Europe de l'Est. Avec la croissance du commerce et des divers établissements, ce n'était qu'une question de temps avant qu'une nouvelle identité n'émerge dans cette région : celle des [rus_culture.GetCollectiveNoun|l].\n\nJe suis désormais considéré comme l'un des plus puissants de ces seigneurs dits [rus_culture.GetCollectiveNoun|l]. Les tribus [rus_culture.GetHeritage.GetNameNoTooltip] forment le noyau de cette nouvelle identité, mais d'autres [rus_culture.GetCollectiveNounNoTooltip|l] ont des origines différentes.\n\nNous devrions encourager l'usage d'une seule langue afin de maintenir une certaine cohésion sociale. [old_rus_culture.GetLanguage.GetName] est la lingua franca de la région depuis de nombreuses années"
 galicia2.0001.desc.east_slavic:0 "et je ne vois aucune raison d'en changer, puisque beaucoup de gens le connaissent déjà."
 galicia2.0001.desc.non_east_slavic:0 "mais je vois la logique derrière la promotion de la langue [original_culture.GetLanguage.GetName] comme nouvelle lingua franca."
 galicia2.0001.a:0 "Laissons la langue [old_rus_culture.GetLanguage.GetNameNoTooltip|l] rester la lingua franca."
 galicia2.0001.b:0 "[original_culture.GetLanguage.GetNameNoTooltip] serait une meilleure lingua franca."
 galicia2.0002.t:0 "L'essor des [rus_culture.GetCollectiveNounNoTooltip|l]"
 galicia2.0002.desc:0 "Au fil des siècles, de nombreux peuples et tribus ont vécu le long des forêts, collines, marais et plaines fluviales d'Europe de l'Est. Avec l'essor du commerce et les changements politiques dans les colonies le long de fleuves comme la Volga, le Don et le Dniepr, un nouveau peuple émerge dans la soi-disant #italic Terre des Villes#!, aboutissement des processus d'influence mutuelle, d'échange et d'assimilation - les [rus_culture.GetCollectiveNoun|l].\n\n[rus_founder.GetTitledFirstName], d'origine [original_culture.GetName], est un exemple de cette nouvelle identité, car [rus_founder.GetSheHe] a utilisé son influence et sa puissance pour s'assurer que les [rus_culture.GetCollectiveNoun|l] du [ROOT.Char.GetPrimaryTitle.GetBaseName] - quelles que soient leurs racines ancestrales - sont devenus la puissance politique, culturelle et économique dominante de la région.\n\nLes anciennes tribus [rus_culture.GetHeritage.GetNameNoTooltip] forment le noyau culturel dominant de l'identité [rus_culture.GetName]."
 galicia2.0002.desc.east_slavic:0 "Leur langue [rus_culture.GetLanguage.GetName] a servi de lingua franca à la région pendant de nombreuses années, et la domination des [rus_culture.GetNameNoTooltip|l] garantira qu'il en reste ainsi dans un avenir prévisible."
 galicia2.0002.desc.non_east_slavic:0 "De plus, bien que [old_rus_culture.GetLanguage.GetName] ait été la lingua franca de la région, [rus_culture.GetLanguage.GetName] s'est imposé comme la nouvelle langue dominante à la suite de ces récents changements culturels et politiques."
 galicia2.0002.a:0 "Des développements intéressants au Pays des Villes !"
 galicia2.0003.t:0 "$galicia2.0002.t$"
 galicia2.0003.desc:0 "Avec la montée des [rus_culture.GetCollectiveNoun|l] parmi les colonies et les tribus d'Europe de l'Est, il y a déjà dans mon royaume des gens qui s'identifient à cette nouvelle identité.\n\nForger des liens plus étroits avec certains de mes voisins en adoptant les coutumes et les pratiques des [rus_culture.GetCollectiveNounNoTooltip|l], y compris leur variété de la langue [rus_culture.GetLanguage.GetName], pourrait m'aider à étendre mon influence politique et économique."
 galicia2.0003.a:0 "Nous sommes [rus_culture.GetNameNoTooltip|l] désormais."
 galicia2.0003.b:0 "Je serai toujours [ROOT.Char.GetCulture.GetNameNoTooltip] !"
