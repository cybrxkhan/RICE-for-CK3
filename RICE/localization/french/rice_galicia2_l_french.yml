 # Decisions
 RICE_galicia2_support_cochineal_industry:0 "Soutenir l'industrie de la cochenille"
 RICE_galicia2_support_cochineal_industry_tooltip:1 "La [Glossary( 'cochenille', 'COCHINEAL_GLOSS' )] est une exportation profitable !"
 RICE_galicia2_support_cochineal_industry_desc:0 "Certains de nos territoires se trouvent dans [GetGeographicalRegion('RICE_european_cochineal_region').GetName|l]. La teinture rouge produite par les insectes [Glossary( 'Cochenille', 'COCHINEAL_GLOSS' )] est un produit très rentable vendu dans le monde entier. Si nous soutenons cette industrie, les marchands pourront continuer à exporter ces teintures en grandes quantités aux quatre coins du monde."
 RICE_galicia2_support_cochineal_industry_effect_tooltip_1:1 "La puissance de ce [modifier|El] est augmentée pour les [counties|e] dans un [duchy|El] avec le [duchy_building|El] #V $building_type_RICE_galicia2_cochineal_industry_01$#!"
 RICE_galicia2_support_cochineal_industry_confirm:0 "Ces insectes nous apportent beaucoup de richesse !"
 RICE_galicia2_support_cochineal_industry_context_tooltip:0 "#emphasis Contexte historique :#! La cochenille polonaise (#italic Porphyrophora polonica#!) et la cochenille arménienne (#italic Porphyrophora hamelii#!) sont deux espèces d'insectes, originaires respectivement de certaines régions d'Europe de l'Est et des hauts plateaux arméniens, dont les larves ont été utilisées pour produire de la teinture rouge pendant des siècles. Cette teinture rouge était un bien de luxe rare et très recherché, et elle devint à un moment l'une des principales exportations de la République des Deux Nations, jusqu'à ce qu'elle soit supplantée par les teintures rouges fabriquées à partir de la cochenille américaine (#italic Dactylopius coccus#!) dans les années 1500."
 RICE_develop_portage_routes:0 "Développer les routes commerciales de la Volga et du Dniepr"
 RICE_develop_portage_routes_tooltip:1 "Améliorer les routes commerciales dans la [GetGeographicalRegion('RICE_volga_dnieper_trade_region').GetName|El]"
 RICE_develop_portage_routes_desc:0 "Le commerce a circulé à travers la [GetGeographicalRegion('RICE_volga_dnieper_trade_region').GetName] pendant de nombreuses années, et seul un [ruler|El] insensé ignorerait son impact sur l'économie de son [realm|El]. Je devrais consacrer des ressources à encourager le commerce dans mes territoires le long de ces routes commerciales."
 RICE_develop_portage_routes_effect_tooltip_1:1 "xxxxxxxxxxxxxxxxxxxxxxxxx"
 RICE_develop_portage_routes_confirm:0 "Le commerce affluera par ici !"
 RICE_develop_portage_routes_context_tooltip:0 "#emphasis Contexte historique :#! Le commerce a joué un rôle important dans l'histoire de l'Europe de l'Est médiévale. Les routes commerciales traversant cette région ont parfois été connues sous le nom de route des Varègues aux Grecs, bien qu'elles impliquaient souvent de nombreux peuples et régions différents, reliant des parties de l'Europe aux steppes eurasiennes, à Byzance et au Moyen-Orient. Une caractéristique notable de ces routes commerciales était l'utilisation extensive du portage - c'est-à-dire le transport de bateaux par voie terrestre durant les voyages."
 RICE_PORTAGE_PICK_ACTION_TYPE:0 "$RICE_develop_portage_routes_confirm$"
