 galicia2.0020.t:0 "Cochenille"
 galicia2.0020.desc:0 "Certains des territoires que je contrôle se trouvent dans les [GetGeographicalRegion('RICE_european_cochineal_region').GetName|l]. Les larves de l'insecte [Glossary( 'cochenille', 'COCHINEAL_GLOSS' )] peuvent être utilisées pour produire une magnifique teinture rouge qui se vend à des prix exorbitants sur les marchés étrangers.\n\nSeul un sot ne verrait pas l'importance de soutenir l'industrie de la cochenille, et c'est précisément ce que je fais. En investissant dans des plantations de cochenille dans ces régions, et en encourageant les marchands à acheter ce produit et à le vendre ailleurs, nous pouvons aider l'économie locale à croître - et encaisser de bons revenus en prélevant des taxes sur ce commerce également, bien entendu."
 galicia2.0020.a:0 "Ce colorant rouge nous rapportera beaucoup d'argent."
 galicia2.portage.decision.intro:0 "Parce que les routes commerciales de la [GetGeographicalRegion('RICE_volga_dnieper_trade_region').GetName|l] passent à travers mes territoires, je serais un imbécile de ne pas consacrer quelques ressources au développement de ces routes à leur plein potentiel.\n\n"
 galicia2.0021.t:0 "Pierres de Portage"
 galicia2.0021.desc:0 "$galicia2.portage.decision.intro$Les pierres de voyage sont une part importante de tout itinéraire - ces pierres soigneusement sculptées communiquent des informations sur un lieu ou des directions aux voyageurs, délimitent des frontières et symbolisent la présence des personnes au pouvoir en ces lieux.\n\nJ'ai donc ordonné que des ressources soient consacrées à l'entretien des pierres existantes de ce type dans mon royaume, et que de nouvelles soient sculptées là où c'est nécessaire. Les voyageurs, qu'ils soient marchands, pèlerins, aventuriers ou mes propres soldats, devraient savoir où ils se trouvent et où ils vont."
 galicia2.0021.a:0 "C'est bien de savoir où l'on va, n'est-ce pas ?"
 galicia2.0022.t:0 "Croix de portage"
 galicia2.0022.desc:0 "$galicia2.portage.decision.intro$Les croix de voyage sont une partie importante de tout itinéraire - ces croix soigneusement sculptées communiquent des informations sur un lieu ou des directions aux voyageurs, délimitent des frontières et symbolisent la présence des personnes au pouvoir en ces lieux.\n\nJ'ai donc ordonné que des ressources soient consacrées à l'entretien des croix existantes de ce type dans mon domaine, et que de nouvelles soient sculptées là où c'est nécessaire. Les voyageurs, qu'ils soient marchands, pèlerins, aventuriers ou mes propres soldats, devraient savoir où ils se trouvent et où ils vont."
 galicia2.0022.a:0 "$galicia2.0021.a$"
 galicia2.0023.t:0 "Réquisitionner les constructeurs de bateaux"
 galicia2.0023.desc:0 "$galicia2.portage.decision.intro$Depuis les temps anciens, dans cette région, il a été du droit de tout [ROOT.Char.GetTitleAsNameNoTooltip] tel que moi-même de réquisitionner les paysans locaux pour construire des bateaux à l'usage de leur suzerain. Ces bateaux seront particulièrement utiles pour voyager à travers les rivières et les routes de portage qui sillonnent ces terres.\n\nNous pourrions avoir besoin de ces bateaux pour le voyage, le commerce ou des raisons militaires, et c'est le devoir et l'obligation de ces paysans de faire le meilleur travail possible. Je ne peux qu'espérer que les bateaux que je demande seront de qualité convenable."
 galicia2.0023.a:0 "Nous pouvons naviguer, naviguer, naviguer au loin !"
 galicia2.0024.t:0 "Entretien des sites de halage"
 galicia2.0024.desc:0 "$galicia2.portage.decision.intro$Nombre de ces routes reposent sur le portage - c'est-à-dire la pratique consistant à transporter des bateaux par voie terrestre, que ce soit à la main ou à l'aide d'animaux de bât, afin de pouvoir voyager entre les innombrables rivières et lacs qui parsèment cette région.\n\nCertains sites tendent à être plus prisés pour le portage, et il serait avantageux pour nous d'envoyer des gens réparer ou construire des chemins de halage là où c'est possible, afin de faciliter le déplacement des bateaux, de dégager tout obstacle autour de ces sites, et de fournir d'autres commodités telles que des lieux pour entreposer les bateaux ou pour permettre aux voyageurs de camper."
 galicia2.0024.a:0 "Cela devrait faciliter le portage pour tout le monde."
 galicia2.0025.t:0 "Biens commerciaux"
 galicia2.0025.desc:0 "$galicia2.portage.decision.intro$Diverses marchandises transitent par cette région, certaines exportées depuis des terres lointaines et exotiques dont peu ont même entendu parler. Elles vont des produits de luxe convoités par les classes d'élite, aux biens du quotidien que nous utilisons tous dans nos vies ordinaires.\n\nJ'ai décidé de soutenir le commerce de ces marchandises, en facilitant les affaires des marchands. Une augmentation des biens circulant vers et depuis mes terres entraînera une plus grande prospérité ici."
 galicia2.0025.a:0 "Le commerce doit couler à flots !"
 galicia2.0026.t:0 "Renforcer les forts fluviaux"
 galicia2.0026.desc:0 "$galicia2.portage.decision.intro$De petits avant-postes et forts occupent des sites stratégiques le long de ces routes commerciales, en particulier les sites de portage - c'est-à-dire les endroits où les bateaux sont souvent transportés par voie terrestre.\n\nJ'ai ordonné que certains forts existants en de tels emplacements dans mes territoires soient renforcés et réparés là où c'est nécessaire, et que de nouveaux soient construits là où cela s'avère judicieux."
 galicia2.0026.a:0 "Ces routes seront sûres pour les voyageurs respectueux des lois !"
 galicia2.0027.t:0 "Encourager la colonisation"
 galicia2.0027.desc:0 "$galicia2.portage.decision.intro$Des colonies sont disséminées à travers des emplacements stratégiques sur ces routes commerciales, en particulier les sites de portage - c'est-à-dire les endroits où les bateaux sont souvent transportés par voie terrestre. Il n'est pas rare que ces lieux servent de points de rencontre entre différentes tribus et ethnies, cultures et religions.\n\nJ'ai ordonné à mes officiers de réinstaller des habitants venus d'ailleurs dans mon royaume pour bâtir de nouvelles colonies le long de ces routes, ou pour renforcer la population des colonies existantes. Cela favorisera la croissance de ces lieux, ainsi que la stimulation de l'économie locale."
 galicia2.0027.a:0 "Espérons que ces colonies prospéreront."
