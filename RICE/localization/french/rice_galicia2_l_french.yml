 RICE_cochineal_region_req:0 "Possède un [county|El] dans les [GetGeographicalRegion('RICE_european_cochineal_region').GetName]"
 RICE_volga_dnieper_geographical_req:0 "Possède un [county|E] dans des [GetGeographicalRegion('RICE_volga_dnieper_trade_region').GetName]"
 RICE_every_cochineal_region_county:0 "Chaque [county|El] que vous possédez dans les [GetGeographicalRegion('RICE_european_cochineal_region').GetName]"
 RICE_every_varangian_trade_region_county:0 "Chaque [county|El] que vous possédez dans les [GetGeographicalRegion('RICE_volga_dnieper_trade_region').GetName]"
 RICE_cochineal_industry_effect_desc_01:0 "Lorsque vous prenez la [decision|E] de #V $RICE_galicia2_support_cochineal_industry$#!, au lieu du [county_modifier|E] de base, ce [county|El] obtient le [modifier|E] [GetModifier('RICE_galicia2_cochineal_modifier_2').GetNameWithTooltip] amélioré."
 RICE_cochineal_industry_effect_desc_02:0 "Lorsque vous prenez la [decision|E] de #V $RICE_galicia2_support_cochineal_industry$#!, au lieu du [county_modifier|E] de base, ce [county|El] obtient le [modifier|E] [GetModifier('RICE_galicia2_cochineal_modifier_3').GetNameWithTooltip] amélioré."
 RICE_cochineal_industry_effect_desc_03:0 "Lorsque vous prenez la [decision|E] de #V $RICE_galicia2_support_cochineal_industry$#!, au lieu du [county_modifier|E] de base, ce [county|El] obtient le [modifier|E] [GetModifier('RICE_galicia2_cochineal_modifier_4').GetNameWithTooltip] amélioré."
 ghw_region_russia:0 "Rus"
 dynn_kormylchych:0 "Kormylchych"
 Yavolod:0 "Yavolod"
 RICE_nick_osmomysl:0 "Osmomysl"
 RICE_nick_osmomysl_desc:0 "En raison de sa sagesse renommée, [CHARACTER.GetShortUINameNoTooltipNoFormat] a mérité le sobriquet d'#italic Osmomysl#!, signifiant Huit-Esprits."
 RICE_volga_dnieper_merchants_option:0 "Marchands de la Volga-Dniepr"
 RICE_volga_dnieper_merchants_option_desc:0 "Bien que voyager avec une grande caravane de marchands puisse ralentir le voyage, il y a une sécurité dans le nombre. Ces commerçants sont expérimentés dans la traversée des routes de portage d'Europe de l'Est, et voyager avec eux pourrait offrir l'occasion d'une opportunité commerciale !"
 RICE_volga_dnieper_merchant_recruited_tt:0 "La caravane de [RICE_merchant.GetNamePossessive] a rejoint votre entourage"
 RICE_volga_dnieper_merchants_option_effect_1:0 "Chaque fois que vous entrez dans une [barony|El], il y a une chance de #V [GetPlayer.MakeScope.ScriptValue('RICE_volga_dnieper_merchant_travel_option_event_chance')]%#! de gagner une petite quantité d'[gold_i|El] [gold|El] grâce à un accord commercial, en fonction de votre [diplomacy|El] et de votre [stewardship|El]"
 RICE_galicia2_boyar_event_troops:0 "Forces des boyards"
 RICE_rival_galicia2_brotherly_competition:0 "[CHARACTER.GetShortUINamePossessive|U] et [TARGET_CHARACTER.GetShortUIName] se disputent [GetTitleByKey('d_halych').GetNameNoTier] après la mort de Iaroslav Osmomysl."
 dynn_bernatovich:0 "Bernatovich"
 slavic_religion_opinion:0 "Opinion $slavic_religion_adherent$"
 RICE_volga_dnieper_merchant_random_trait_gain_tt:0 "Gagne entre #V 1#! et #V 5#! [trait_level_track_xp|El] dans le [trait|El] [GetTrait('RICE_volga_dnieper_merchant').GetName(GetNullCharacter)]"
 
 # Game Concepts
 game_concept_volga_dnieper_merchants:0 "Marchands de la Volga-Dniepr"
 game_concept_volga_dnieper_merchant:0 "Marchand de la Volga-Dniepr"
 game_concept_volga_dnieper_merchant_desc:0 "Si vous possédez un territoire dans la [GetGeographicalRegion('RICE_volga_dnieper_trade_region').GetName], il y a une chance qu'un $game_concept_volga_dnieper_merchant|l$ avec un [trait|El] $trait_RICE_volga_dnieper_merchant$ apparaisse dans votre [court|El] de temps en temps. Vous pouvez choisir de tirer parti de ses connexions, ce qui vous accorde un [character_modifier|El] augmentant vos [income|El] ainsi que d'autres bonus, en fonction des marchandises dans lesquelles il se spécialise. Vous pouvez obtenir ces bonus même si vous ne l'invitez pas à votre cour.\n\nVous aurez également accès à une [decision|El] pour #V $RICE_develop_portage_routes$#!, avec diverses options liées au commerce dans cette région.\n\nVous pouvez également essayer d'obtenir le [trait|El] $trait_RICE_volga_dnieper_merchant$ en prenant l'[travel_option|El] $RICE_volga_dnieper_merchants_option$ lors de vos [traveling|El]. Cela déclenchera occasionnellement des événements vous permettant de travailler à l'obtention de ce [trait|El], ou d'augmenter votre [trait_level_track_xp|El] dans ce [trait|El]."
 
