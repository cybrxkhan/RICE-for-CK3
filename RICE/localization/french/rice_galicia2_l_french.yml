 galicia2.0012.t:0 "Honorer une Divinité"
 galicia2.0012.desc:0 "Il est de mon devoir en tant que souverain slave d'honorer les dieux du peuple, d'obtenir leurs bénédictions et de montrer à notre peuple et aux autres que nous jouissons véritablement de la prospérité. En choisissant une divinité particulière à honorer par une idole, j'obtiendrai sans nul doute la bénédiction de mon patron divin et montrerai au peuple quelles valeurs et priorités j'incarne en tant que souverain."
 galicia2.0012.perun:0 "Perun, le Tonnerre."
 galicia2.0012.perun.tt:0 "Perun, puissant maître des tempêtes, du tonnerre et des armes de métal, est le chef des dieux.\n\nHonorer Perun est le choix naturel pour un dirigeant noble et imposant.\n"
 galicia2.0012.veles:0 "Veles, Souverain du Monde Souterrain."
 galicia2.0012.veles.tt:0 "Veles, le pendant de Perun, règne sur le monde souterrain aquatique et est associé à la richesse en bétail, à la poésie et à la sorcellerie.\n\nIncarner les valeurs de Veles frappera assurément de terreur tous ceux qui s'opposent à moi.\n"
 galicia2.0012.stribog:0 "Stribog, le Vent qui se Répand."
 galicia2.0012.stribog.tt:0 "Stribog, le père des vents, représente le bond du printemps et la diffusion de la richesse.\n\nHonorer Stribog bénira nos marchands, fermiers et émissaires de vents favorables.\n"
 galicia2.0012.khors_dazhbog:0 "Khors Dazhbog, le Soleil et la Lune."
 galicia2.0012.khors_dazhbog.tt:0 "Khors et Dazhbog sont associés au soleil et à la lune, à l'abondance et à la bonté.\n\nHonorer Khors Dazhbog montrera au peuple mon engagement envers la prospérité et la justice.\n"
 galicia2.0012.mokosh:0 "Mokosh, la Déesse Mère."
 galicia2.0012.mokosh.tt:0 "Mokoch, une déesse mère, est la protectrice des femmes, associée aux moutons, au tissage et à l'accouchement.\n\nHonorer Mokoch assurera une récolte fertile et une communauté grandissante.\n"
 galicia2.0012.simargl:0 "Simargl, les Chiens Ailés."
 galicia2.0012.simargl.tt:0 "Simargl, les chiens ailés, sont les protecteurs des graines, des pousses et des humains, ainsi que les intermédiaires entre les dieux du ciel et de la terre.\n\nHonorer Simargl protégera la récolte et le peuple des éléments malveillants.\n"
 galicia2.0012.optout:0 "Ce n'est pas le bon moment."
 galicia2.0012.flavor:0 "$religious_decision.0101.flavor$"
