 RICE_portage_promote_merchants_effect_tooltip_1:"En fonction de votre [diplomacy_i|El] [diplomacy|El] et [stewardship_i|El] [stewardship|El], il y a une chance de #V [GetPlayer.MakeScope.ScriptValue('RICE_portage_decision_merchant_chance')|0]%#! qu'un [volga_dnieper_merchant|El] apparaisse à votre cour et vous propose une affaire commerciale dans les 5 prochaines années"
