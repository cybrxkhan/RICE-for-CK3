 # Darb Al-Arba'in Decision
 RICE_upper_egypt_reinforce_the_darb_al_arbain:0 "Renforcement du Darb Al-Arba'in"
 RICE_upper_egypt_reinforce_the_darb_al_arbain_tooltip:0 "Il s'agit d'un couloir important pour les voyages - veillons à ce qu'il soit sûr !"
 RICE_upper_egypt_reinforce_the_darb_al_arbain_desc:0 "Le [darb_al_arbain|El] est une importante route caravanière traversant le désert à l'ouest du Nil, reliant l'Égypte au reste de l'Afrique. Dans les territoires que je contrôle le long du [darb_al_arbain|El], il existe quelques petits forts et avant-postes éloignés destinés à sécuriser cette route ardue mais profitable ainsi que ses routes secondaires. J'ai reçu des rapports indiquant qu'ils pourraient avoir besoin de réparations."
 RICE_upper_egypt_reinforce_the_darb_al_arbain_effect_tooltip:0 "Le [county|El] que vous choisissez de renforcer recevra le [county_modifier|El] [GetModifier('RICE_upper_egypt_reinforced_darb_al_arbain').GetNameWithTooltip] pour #V 20#! ans"
 RICE_upper_egypt_reinforce_the_darb_al_arbain_confirm:0 "Allons-y !"
 RICE_upper_egypt_reinforce_the_darb_al_arbain_context_tooltip:0 "#emphasis Contexte historique :#! Le Darb Al-Arba'in, ou route des quarante jours, était une route commerciale entre Asyut en Égypte, d'une part, et Kobbei (ou Kubayh) au Darfour, d'autre part ; entre les deux, elle passait par diverses oasis comme Kharga, Selima et Dunqul. Des routes secondaires le reliaient également à divers points du Nil, comme Dongola et Sai en Nubie. Cette route ardue traversait un terrain difficile et peu arrosé, mais était utilisée depuis l'époque pharaonique pour le transport et le commerce de l'or, des esclaves, de l'ivoire et d'autres marchandises entre l'Égypte et le reste de l'Afrique. Elle a également été renforcée par des forts et des avant-postes par les États de la région, des Romains aux Ottomans, jusqu'au XIXe siècle."
 RICE_upper_egypt_darb_al_arbain_decision_choose_where_to_reinforce:0 "Choisir un endroit le long du Darb Al-Arba'in"
 RICE_upper_egypt_darb_al_arbain_decision:0 "Lieux le long de la [darb_al_arbain|El] ou de ses sous-routes que vous possédez"
 RICE_upper_egypt_darb_asyut_option:0 "#Bold #V Asyut#!#!"
 RICE_upper_egypt_darb_asyut_option_desc:0 "L'extrémité nord du Darb Al-Arba'in le long du Nil"
 RICE_upper_egypt_darb_asyut_option_tooltip:0 "$RICE_upper_egypt_darb_asyut_option_desc$"
 RICE_upper_egypt_darb_kharga_option:0 "#Bold #V Oasis de Kharga#!#!"
 RICE_upper_egypt_darb_kharga_option_desc:0 "L'oasis occidentale, porte d'entrée vers le reste de l'Afrique"
 RICE_upper_egypt_darb_kharga_option_tooltip:0 "$RICE_upper_egypt_darb_kharga_option_desc$"
 RICE_upper_egypt_darb_aswan_option:0 "#Bold #V Assouan#!#!"
 RICE_upper_egypt_darb_aswan_option_desc:0 "La première cataracte, frontière entre l'Égypte et la Nubie"
 RICE_upper_egypt_darb_aswan_option_tooltip:0 "$RICE_upper_egypt_darb_aswan_option_desc$"
 RICE_upper_egypt_darb_qasr_ibrim_option:0 "#Bold #V Qasr Ibrim#!#!"
 RICE_upper_egypt_darb_qasr_ibrim_option_desc:0 "La route menant au Wadi Allaqi dans le désert oriental"
 RICE_upper_egypt_darb_qasr_ibrim_option_tooltip:0 "$RICE_upper_egypt_darb_qasr_ibrim_option_desc$"
 RICE_upper_egypt_darb_sai_option:0 "#Bold #V Sai#!#!"
 RICE_upper_egypt_darb_sai_option_desc:0 "Le meilleur itinéraire pour se rendre à l'oasis de Selima, une importante oasis nubienne du Darb Al-Arba'in"
 RICE_upper_egypt_darb_sai_option_tooltip:0 "$RICE_upper_egypt_darb_sai_option_desc$"
