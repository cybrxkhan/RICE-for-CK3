 upper_egypt.0040.t:0 "À Assouan !"
 upper_egypt.0040.desc.intro:0 "Depuis des temps immémoriaux, la région autour de la ville de [aswan_county.GetNameNoTier] est considérée comme un lieu sacré par de nombreux fidèles des anciens dieux. La première cataracte du Nil, juste à côté de laquelle se trouve la ville, marque la frontière traditionnelle entre l'Égypte et la Nubie, mais des gens des deux côtés de la frontière se sont rendus à [aswan_county.GetNameNoTier] pour prier dans ses temples. Même de puissants rois venus de loin y envoyèrent d'impressionnantes délégations pour rendre hommage aux dieux. Moi aussi, je prévois d'entreprendre un tel voyage."
 upper_egypt.0040.desc.philae:0 "\n\nL'île de #V Philae#!, située juste sur la première cataracte, est un centre majeur de culte pour Isis, et par extension son frère-époux Osiris et leur fils Horus - tous trois comptent parmi les divinités les plus importantes qui soient. Le Temple de Philae, un monument dédié à cette famille divine, sera ma destination lors de ce voyage."
 upper_egypt.0040.desc.elephantine:0 "\n\nL'île d'#V Éléphantine#!, située en aval de la première cataracte, est depuis longtemps considérée comme la demeure de Khnoum, dieu de la source du Nil, et de son épouse Satet et de leur fille Anoukis. Les Temples d'Éléphantine, construits en l'honneur de ces protecteurs du Nil sacré, seront ma destination lors de ce voyage."
 upper_egypt.0040.desc.kalabsha:0 "\n\nL'île de #V Kalabsha#!, située un peu en amont de la première cataracte, est un important centre cultuel dédié à la divinité Mandoulis, un dieu solaire et lunaire, ainsi qu'à d'autres divinités mineures comme Imhotep et Toutou. Le Temple de Kalabsha, consacré à toutes ces diverses divinités, sera ma destination lors de ce voyage."
 upper_egypt.0040.a:0 "Il est temps de s'y rendre."
 upper_egypt.0041.t:0 "Le temple de Philae"
 upper_egypt.0041.desc:0 "Ensemble, avec ma délégation de dignitaires et de [ROOT.Char.Custom('DefaultPriestTitlePlural')], je suis arrivé au Temple de Philae près d'[aswan_county.GetNameNoTier] pour rendre hommage aux dieux. Après avoir gravé quelques inscriptions sur la pierre du temple pour commémorer cette occasion, nous avons été conduits à l'intérieur du temple.\n\nLà, nous avons participé à diverses cérémonies en l'honneur d'Isis, Osiris, Horus et d'autres divinités, notamment par des libations de lait. Le lait blanc et doux est versé sur les offrandes faites aux dieux, tandis que nous chantons des prières et consacrons nos esprits à l'adoration des dieux.\n\nAvant que ma visite ne s'achève, pour professer ma dévotion, je devrais faire une grande offrande à une divinité en particulier à Philae."
 upper_egypt.0041.a:0 "Isis, la déesse mère, dont le lait divin est source de vie"
 upper_egypt.0041.b:0 "Osiris, seigneur des morts, pour qui le lait rajeunit"
 upper_egypt.0041.c:0 "Horus, le roi faucon, purifié par le lait divin de sa mère"
 upper_egypt.0041.a.toast:0 "Isis, la déesse mère, vous bénit !"
 upper_egypt.0041.b.toast:0 "Osiris, seigneur des morts, te bénit !"
 upper_egypt.0041.c.toast:0 "Horus, le roi des faucons, te bénit !"
 upper_egypt.0042.t:0 "Les temples d'Éléphantine"
 upper_egypt.0042.desc:0 "Ensemble, avec ma délégation de dignitaires et de [ROOT.Char.Custom('DefaultPriestTitlePlural')], je suis arrivé sur l'île d'Éléphantine près d'[aswan_county.GetNameNoTier] pour rendre hommage aux dieux dans ses temples. Nous avons visité différents temples sur l'île, chacun dédié à une divinité spécifique.\n\nLà, nous avons participé à diverses cérémonies en l'honneur de la triade d'Éléphantine composée de Khnoum, son épouse Satet, et leur fille Anoukis. Ces trois divinités gardent le Nil et veillent à ce que sa crue survienne chaque année.\n\nAvant que ma visite ne s'achève, pour professer ma dévotion, je devrais faire une grande offrande à une divinité d'Éléphantine en particulier."
 upper_egypt.0042.a:0 "Khnoum, le potier divin, dieu de la source du Nil"
 upper_egypt.0042.b:0 "Satet, « celle qui tire », déesse de la crue du Nil"
 upper_egypt.0042.c:0 "Anoukis, l'embrasseuse, déesse des cataractes du Nil"
 upper_egypt.0042.a.toast:0 "Khnoum, le divin potier, vous bénit !"
 upper_egypt.0042.b.toast:0 "Satet, « celle qui tire », vous bénit !"
 upper_egypt.0042.c.toast:0 "Anoukis, l'embrasseuse, vous bénit !"
 upper_egypt.0043.t:0 "Le temple de Kalabsha"
 upper_egypt.0043.desc:0 "Ensemble, avec ma délégation de dignitaires et de [ROOT.Char.Custom('DefaultPriestTitlePlural')], je suis arrivé sur l'île de Kalabsha près d'[aswan_county.GetNameNoTier] pour rendre hommage aux dieux. Nous avons visité différents temples sur l'île, chacun dédié à une divinité spécifique. Le temple est divisé en nord et sud, chaque aile honorant différentes divinités.\n\nLà, nous avons participé à diverses cérémonies en l'honneur de Mandoulis - Mandoulis l'Ancien, son aspect solaire, et Mandoulis le Jeune, son aspect lunaire. Nous avons également honoré d'autres divinités mineures comme Imhotep, Toutou, et bien d'autres.\n\nAvant que ma visite ne s'achève, pour professer ma dévotion, je devrais faire une grande offrande à une divinité en particulier à Kalabsha."
 upper_egypt.0043.a:0 "Mandoulis, le roi de tout, qui est le tout-puissant Aion"
 upper_egypt.0043.b:0 "Imhotep, fils de Ptah, l'architecte et guérisseur demi-dieu"
 upper_egypt.0043.c:0 "Toutou, fils de Neith, maître des démons de Sekhmet"
 upper_egypt.0043.a.toast:0 "Mandulis, le roi de tous, vous bénit !"
 upper_egypt.0043.b.toast:0 "Imhotep, le fils de Ptah, vous bénit !"
 upper_egypt.0043.c.toast:0 "Tutu, fils de Neith, vous bénit !"
 upper_egypt.0044.t:0 "Fermeture officielle du temple de Philae"
 upper_egypt.0044.desc:0 "Pendant des années, le temple sur l'île de Philae près de [aswan_county.GetNameNoTier] a servi de lieu saint pour les païens de cette région. Même les dévots qui vivaient loin dans l'arrière-pays de Blemmyie et de Nubie faisaient le voyage pour prier Isis et d'autres divinités ici.\n\nMais désormais, l'enceinte du temple est silencieuse et déserte. Plus personne ne vient à Philae de nos jours, à l'exception de vagabonds occasionnels ou de quelques blasphémateurs présumés sympathisants d'Isis.\n\nIl est temps que nous fermions officiellement le Temple de Philae, et que nous démontrions la supériorité de la foi [ROOT.Char.GetFaith.GetAdjective]. La structure est trop imposante pour être détruite, nous la laisserons donc en l'état et interdirons tout culte hérétique d'y avoir lieu."
 upper_egypt.0044.a:0 "Les habitants pourraient peut-être même utiliser les pierres anciennes dans le cadre de projets de construction locaux !"
 upper_egypt.0045.t:0 "Philae est officiellement fermé"
 upper_egypt.0045.desc:0 "Le temple sur l'île de Philae près d'[aswan_county.GetNameNoTier] servait autrefois les dévots d'Isis venus d'aussi loin que l'arrière-pays de Blemmyia et de Nubie. Cependant, récemment, il a été effectivement abandonné par manque d'intérêt des habitants, qui ne suivent plus les anciens dieux comme Isis.\n\n[temple_ender.GetTitledFirstName] a ainsi récemment fermé le temple et interdit tout culte hérétique d'y avoir lieu, afin de démontrer la supériorité de la foi [temple_ender.GetFaith.GetAdjective]. Bien que la structure soit toujours debout, elle restera probablement inutilisée et déserte pour les années à venir."
 upper_egypt.0045.a:0 "Je vois...."
 upper_egypt.0046.t:0 "Fermeture officielle des temples d'Éléphantine"
 upper_egypt.0046.desc:0 "Pendant des années, les temples de l'île d'Éléphantine, près de [aswan_county.GetNameNoTier], ont servi de lieu saint pour les païens de cette région. Considérée comme la demeure du dieu du Nil, Khnoum, beaucoup croyaient que l'île était une terre sacrée.\n\nMais aujourd'hui, ces mêmes enceintes de temples sont silencieuses et désertes. Plus personne ne vient à Éléphantine de nos jours, à l'exception de quelques vagabonds occasionnels ou de quelques blasphémateurs présumés sympathisants de Khnoum.\n\nIl est temps que nous fermions officiellement les Temples d'Éléphantine, et que nous démontrions la supériorité de la foi [ROOT.Char.GetFaith.GetAdjective]. Les structures sont trop imposantes pour être détruites, nous les laisserons donc en l'état et interdirons tout culte hérétique en ces lieux."
 upper_egypt.0046.a:0 "Les habitants pourraient peut-être même utiliser les pierres anciennes dans le cadre de projets de construction locaux !"
 upper_egypt.0047.t:0 "Éléphantine est officiellement fermée"
 upper_egypt.0047.desc:0 "Les temples sur l'île d'Éléphantine près de [aswan_county.GetNameNoTier] servaient autrefois les païens souhaitant honorer Khnoum, le dieu du Nil. Cependant, récemment, ils ont été effectivement abandonnés par manque d'intérêt des habitants, qui ne suivent plus les anciens dieux comme Khnoum.\n\n[temple_ender.GetTitledFirstName] a ainsi récemment fermé les temples et interdit tout culte hérétique d'y avoir lieu, pour démontrer la supériorité de la foi [temple_ender.GetFaith.GetAdjective]. Bien que les structures soient toujours debout, elles resteront probablement inutilisées et désertes pour les années à venir."
 upper_egypt.0047.a:0 "Je vois...."
 upper_egypt.0048.t:0 "Fermeture officielle du temple de Kalabsha"
 upper_egypt.0048.desc:0 "Pendant des années, le temple sur l'île de Kalabsha près de [aswan_county.GetNameNoTier] a servi de lieu saint pour les païens de cette région. Il était populaire parmi ceux dévoués au dieu Mandulis, vénéré à travers la Nubie et l'Égypte.\n\nMais aujourd'hui, l'enceinte du temple est silencieuse et déserte. Plus personne ne se rend au temple de Kalabsha de nos jours, à l'exception de vagabonds occasionnels ou de quelques blasphémateurs présumés sympathisants de Mandulis.\n\nIl est temps que nous fermions officiellement le Temple de Kalabsha, et que nous démontrions la supériorité de la foi [ROOT.Char.GetFaith.GetAdjective]. La structure est trop imposante pour être détruite, nous la laisserons donc en l'état et interdirons tout culte hérétique d'y avoir lieu."
 upper_egypt.0048.a:0 "Les habitants pourraient peut-être même utiliser les pierres anciennes dans le cadre de projets de construction locaux !"
 upper_egypt.0049.t:0 "Kalabsha est officiellement fermé"
 upper_egypt.0049.desc:0 "Le temple sur l'île de Kalabsha près de [aswan_county.GetNameNoTier] servait autrefois les païens dévoués au dieu Mandoulis. Cependant, récemment, il a été effectivement abandonné par manque d'intérêt des habitants, qui ne suivent plus les anciens dieux comme Mandoulis.\n\n[temple_ender.GetTitledFirstName] a donc récemment fermé le temple et interdit tout culte hérétique d'y avoir lieu, afin de démontrer la supériorité de la foi [temple_ender.GetFaith.GetAdjective]. Bien que la structure soit toujours debout, elle restera probablement inutilisée et déserte pour les années à venir."
 upper_egypt.0049.a:0 "Je vois...."
 upper_egypt.0050.t:0 "Réouverture officielle du temple de Philae"
 upper_egypt.0050.desc:0 "Il y a des années, le temple sur l'île de Philae près de [aswan_county.GetNameNoTier] servait de lieu saint pour les païens de cette région. Même les dévots qui vivaient loin dans l'arrière-pays de Blemmyia et de Nubie faisaient le voyage pour prier Isis et d'autres divinités ici. À un moment donné, il fut abandonné et officiellement fermé, lorsque les habitants se détournèrent du culte d'Isis.\n\nCependant, un nouveau jour se lève désormais sur Philae, car le peuple se tourne à nouveau vers les anciennes traditions. Lors d'une grande cérémonie, j'ai officiellement pris des mesures pour restaurer et rouvrir le temple, et y faire venir des [ROOT.Char.Custom('DefaultPriestTitlePlural')] afin qu'il puisse à nouveau fonctionner comme un lieu de culte."
 upper_egypt.0050.a:0 "Gloire à Isis !"
 upper_egypt.0051.t:0 "Réouverture officielle du temple de Philae"
 upper_egypt.0051.desc:0 "Le grand temple sur l'île de Philae près de [aswan_county.GetNameNoTier] servait autrefois les dévots d'Isis venus d'aussi loin que l'arrière-pays de Blemmya et de Nubie. Il y a des années, il fut officiellement fermé et abandonné, mais cela est en train de changer grâce aux efforts de [temple_restorer.GetTitledFirstName].\n\nLe dévot [temple_restorer.GetFaith.GetAdherentName], [temple_restorer.GetFirstName] a entrepris des efforts pour restaurer le temple dans sa gloire passée et le rouvrir officiellement. Les dévots d'Isis et d'autres divinités reviennent en masse pour prier dans ce lieu de culte sacré."
 upper_egypt.0051.a:0 "Nouvelles intéressantes..."
 upper_egypt.0052.t:0 "Les temples d'Éléphantine rouvrent officiellement"
 upper_egypt.0052.desc:0 "Il y a des années, les temples sur l'île d'Éléphantine près de [aswan_county.GetNameNoTier] servaient de lieu saint pour les païens de cette région. Considérée comme la demeure du dieu du Nil, Khnoum, beaucoup croyaient que l'île était une terre sacrée. À un moment donné, les temples furent abandonnés et officiellement fermés, lorsque les habitants se détournèrent du culte de Khnoum.\n\nCependant, un nouveau jour se lève désormais sur Éléphantine, car le peuple se tourne à nouveau vers les anciennes traditions. Lors d'une grande cérémonie, j'ai officiellement pris des mesures pour restaurer et rouvrir les temples, et y installer des [ROOT.Char.Custom('DefaultPriestTitlePlural')] afin qu'ils puissent à nouveau fonctionner comme des lieux de culte."
 upper_egypt.0052.a:0 "Louez Khnum !"
 upper_egypt.0053.t:0 "Réouverture officielle des temples d'Éléphantine"
 upper_egypt.0053.desc:0 "Les grands temples sur l'île d'Éléphantine près de [aswan_county.GetNameNoTier] servaient autrefois les païens souhaitant honorer Khnoum, le dieu du Nil. Il y a des années, ils furent officiellement fermés et abandonnés, mais cela est en train de changer grâce aux efforts de [temple_restorer.GetTitledFirstName].\n\nLe dévot [temple_restorer.GetFaith.GetAdherentName], [temple_restorer.GetFirstName] a entrepris des efforts pour restaurer les temples dans leur gloire passée et les rouvrir officiellement. Les dévots de Khnoum et d'autres divinités reviennent en masse pour prier dans ces maisons de culte sacrées."
 upper_egypt.0053.a:0 "Nouvelles intéressantes..."
 upper_egypt.0054.t:0 "Réouverture officielle du temple de Kalabsha"
 upper_egypt.0054.desc:0 "Il y a des années, le temple sur l'île de Kalabsha près de [aswan_county.GetNameNoTier] servait de lieu saint pour les païens de cette région. Il était populaire parmi ceux dévoués au dieu Mandulis, vénéré à travers la Nubie et l'Égypte. À un moment donné, il fut abandonné et officiellement fermé, lorsque les habitants se détournèrent du culte de Mandulis.\n\nCependant, un nouveau jour se lève désormais sur Kalabsha, car le peuple se tourne à nouveau vers les anciennes traditions. Lors d'une grande cérémonie, j'ai officiellement pris des mesures pour restaurer et rouvrir le temple, et y faire venir des [ROOT.Char.Custom('DefaultPriestTitlePlural')] afin qu'il puisse à nouveau servir de lieu de culte."
 upper_egypt.0054.a:0 "Gloire à Mandulis !"
 upper_egypt.0055.t:0 "Le temple de Kalabsha rouvre officiellement"
 upper_egypt.0055.desc:0 "Le grand temple sur l'île de Kalabsha près d'[aswan_county.GetNameNoTier] servait autrefois les païens dévoués au dieu Mandoulis. Il y a des années, il fut officiellement fermé et abandonné, mais cela est en train de changer grâce aux efforts de [temple_restorer.GetTitledFirstName].\n\nLe dévot [temple_restorer.GetFaith.GetAdherentName], [temple_restorer.GetFirstName] s'est efforcé de restaurer le temple dans sa gloire d'antan et de le rouvrir officiellement. Les dévots de Mandoulis et d'autres divinités reviennent en masse pour prier dans ce lieu de culte sacré."
 upper_egypt.0055.a:0 "Nouvelles intéressantes..."
 upper_egypt.0056.t:0 "La première cataracte"
 upper_egypt.0056.desc.intro:0 "Je me trouve maintenant sur les lieux sacrés de la première cataracte du Nil, un endroit où le roturier et le pharaon se rendaient autrefois."
 upper_egypt.0056.desc.one:0 "Hélas, la région n'est plus que l'ombre d'elle-même, et il n'y a qu'un seul grand temple qui soit actuellement ouvert."
 upper_egypt.0056.desc.multiple:0 "Il y a plusieurs lieux sacrés où je pourrais prier, mais je devrais en choisir un sur lequel je me concentrerai pendant ma visite."
 upper_egypt.0056.desc.philae:0 "\n\nL'île de #V Philae#!, située juste sur la première cataracte, est un centre majeur de culte pour Isis, et par extension son frère-époux Osiris et leur fils Horus - tous trois comptent parmi les divinités les plus importantes qui soient."
 upper_egypt.0056.desc.elephantine:0 "\n\nL'île d'#V Éléphantine#!, située en aval de la première cataracte, est depuis longtemps considérée comme la demeure de Khnoum, dieu de la source du Nil, et de son épouse Satet et de leur fille Anoukis."
 upper_egypt.0056.desc.kalabsha:0 "\n\nL'île de #V Kalabsha#!, située un peu en amont de la première cataracte, est un important centre de culte pour la divinité Mandulis, un dieu solaire et lunaire, ainsi que d'autres dieux mineurs comme Imhotep et Tutu."
 upper_egypt.0056.a:0 "À Philae !"
 upper_egypt.0056.b:0 "À Éléphantine !"
 upper_egypt.0056.c:0 "À Kalabsha !"
 upper_egypt.0056.d:0 "Allons dans n'importe quel temple ouvert."
