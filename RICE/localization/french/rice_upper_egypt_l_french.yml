 upper_egypt.0010.t:0 "Darb al-Arba'in"
 upper_egypt.0010.desc:0 "Le Darb al-Arba'in est une importante route commerciale qui s'étend sur un territoire que je gouverne. De petites forteresses et des avant-postes jalonnent la piste, et j'ai décidé de consacrer des ressources au renforcement de ces installations sur une partie de la route, afin que les caravanes et les voyageurs puissent se déplacer sur cette autoroute du désert sans craindre les bandits ou la soif. Après tout, il est de mon devoir de veiller à ce que cette route soit sûre et fiable."
 upper_egypt.0010.a:0 "Cela devrait aussi être bon pour le commerce !"
 upper_egypt.0011.t:0 "Un nouveau Louxor"
 upper_egypt.0011.desc:0 "Quiconque visite Louxor ne peut nier la beauté et la grandeur du Temple de Louxor, qui se dresse à [qus_county.GetNameNoTier] depuis des siècles. Pourtant, malgré le fait que ce lieu constitue un parfait lieu de culte [ROOT.Char.GetFaith.GetAdherentName], les croyants de la foi [ROOT.Char.GetFaith.GetReligion.GetAdjective] n'y pratiquent pas leur culte - ou du moins, ils ne l'ont pas fait depuis très longtemps.\n\nCela change aujourd'hui.\n\nJ'ai fait venir un certain nombre de [ROOT.Char.Custom('DefaultPriestTitlePlural')] pour reconsacrer cet ancien site sacré, afin qu'il puisse désormais servir la communauté en tant que véritable lieu de culte [ROOT.Char.GetFaith.GetReligion.GetAdherentName]. Bientôt, les sons des prières [ROOT.Char.GetFaith.GetReligion.GetAdjectiveNoTooltip]s résonneront à nouveau dans ses halls !"
 upper_egypt.0011.a:0 "Bien, bien."
 upper_egypt.0012.t:0 "L'ancien gouverneur"
 upper_egypt.0012.desc:0 "J'ai eu une longue carrière en [GetTitleByKey('k_egypt').GetNameNoTier], et tout est désormais terminé. J'ai, par exemple, servi comme chef de la [Glossary( 'shurta', 'SHURTA_GLOSS' )] dans la province. J'ai maté des rébellions et strictement appliqué de nouveaux changements et restrictions au nom de la moralité et de l'ordre public. Les pécheurs et les infidèles n'ont pas apprécié et ont protesté bruyamment, si bien que j'ai été démis de mes fonctions.\n\nJ'ai eu une seconde chance de faire avancer ma carrière lorsque j'ai été nommé gouverneur de [GetTitleByKey('k_egypt').GetNameNoTierNoTooltip] par le gouvernement califal. Hélas, cela fut également de courte durée, car j'ai rapidement été remplacé par un soldat-esclave parvenu nommé [ibn_tulun.GetFirstName].\n\nPourtant, la perte de mon ancien poste pourrait être l'opportunité dont j'avais besoin pour commencer une nouvelle vie... si tant est que je le veuille. Mais d'abord - je devrais quitter l'atmosphère étouffante de [GetTitleByKey('c_cairo').GetNameNoTier] ; ce n'est pas comme si j'étais même populaire ici."
 upper_egypt.0012.a:0 "Se rendre aux ports de la mer Rouge"
 upper_egypt.0012.a.tooltip:0 "Peut-être est-il temps pour moi d'accomplir le Hajj, comme tous les bons [GetReligionByKey('islam_religion').GetAdherentNamePlural]..."
 upper_egypt.0012.b:0 "Se rendre dans les ports du Levant"
 upper_egypt.0012.b.tooltip:0 "Peut-être pourrais-je retourner au cœur du Califat, et voir si je peux y trouver un emploi..."
 upper_egypt.0012.info:0 "\n#emphasis Contexte historique :#! Azjur al-Turki fut le gouverneur d'Égypte pendant un an avant Ahmad ibn Tulun. Techniquement, son mandat prit fin en 868, mais le jeu de base a fait régner Ibn Tulun sur l'Égypte dès 867 pour s'assurer que les Tulunides commencent en tant que dirigeants. En ignorant cette légère divergence chronologique, il était néanmoins un fonctionnaire puritain et impopulaire avant même d'être nommé gouverneur. Les sources divergent quant à ce qu'il advint d'al-Turki après qu'Ibn Tulun eut pris son ancien poste : soit il entreprit le Hajj vers La Mecque, soit il retourna auprès du Calife où il fut chaleureusement accueilli et obtint un autre poste gouvernemental."
 upper_egypt.0013.t:0 "Le Levant"
 upper_egypt.0013.desc:0 "Je suis arrivé au port de [GetTitleByKey('b_acre').GetNameNoTier]. Les chantiers navals de la ville abritent une partie importante de la splendide marine du Califat, où marchands et pèlerins arrivent et partent en masse.\n\nAprès mon arrivée ici, j'ai entendu des nouvelles des récents développements politiques au cœur du Califat. La guerre et l'instabilité, semble-t-il, ont lourdement pesé sur la région. Cela pourrait être une opportunité pour un nouvel emploi en tant qu'administrateur ou commandant militaire, mais d'un autre côté, de nombreux dangers pourraient encore rôder.\n\nQuoi qu'il en soit, je pense qu'il serait préférable pour moi de me reposer à [GetTitleByKey('b_acre').GetNameNoTierNoTooltip] un moment, pendant que je décide de la marche à suivre."
 upper_egypt.0013.a:0 "Je devrais chercher quelque chose à faire ici..."
 upper_egypt.0014.t:0 "La mer Rouge"
 upper_egypt.0014.desc:0 "Après un voyage ardu à travers le désert oriental, je suis arrivé à [GetTitleByKey('b_qusayr').GetNameNoTier] au bord de la mer Rouge.\n\nAprès mon arrivée ici, j'ai entendu parler de la situation actuelle dans cette terre frontière de l'[GetReligionByKey('islam_religion').GetName]. Les habitants parlent des pillards infidèles et des seigneurs de guerre sanguinaires qui passent par ici, mais aussi de commerçants et de pèlerins dévoués et courageux. Peut-être devrais-je me rendre à [GetTitleByKey('b_makka').GetNameNoTier] et prendre part au pèlerinage du Hajj. D'un autre côté, peut-être devrais-je attendre pour voir s'il y a des opportunités ailleurs.\n\nQuoi qu'il en soit, je pense qu'il serait préférable pour moi de me reposer à [GetTitleByKey('b_qusayr').GetNameNoTierNoTooltip] un moment, le temps de décider quoi faire ensuite."
 upper_egypt.0014.a:0 "$upper_egypt.0013.a$"
