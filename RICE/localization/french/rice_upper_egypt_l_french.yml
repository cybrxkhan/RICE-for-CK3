 # Game Concepts
 game_concept_nile_flood:0 "Inondation du Nil"
 #game_concept_nile_flood_desc:0 "The flooding of the Nile has been a crucial part of life in Egypt since the days of the pharaohs. Every year, the Nile will flood a certain amount, and [counties|El] along [GetGeographicalRegion('RICE_nile_river_valley').GetName] will get a [county_modifier|El] depending on the result.\n\nMost of the time, the flood will be normal, and there will be no in-game effect. If the flood is better than usual, the [county_modifiers|El] will give various benefits; if it is poor, or the Nile overfloods, then the [county_modifiers|El] will give maluses.\n\nIf your [culture|El] has the #Bold $tradition_RICE_children_of_the_nile_name$#! [tradition|El], you'll have access to two special [activities|El] related to the flood. You can do the [GetActivityType('activity_RICE_upper_egypt_open_nile_canals').GetName] if the flood is good, and #bold $RICE_upper_egypt_pray_for_a_good_nile_flood$#! if it is poor.\n\nAdditionally, you gain access to a third [decision|El] is to #Bold $RICE_upper_egypt_renovate_local_nilometers$.#! This is an important [decision|El] as it will help you mitigate the effects of poor floods in the future."
 game_concept_temples_of_aswan:0 "Temples d'Assouan"
 game_concept_temple_in_aswan:0 "Temples à Assouan"
 game_concept_temples_of_aswan_city:0 "Assouan"
 game_concept_temples_of_aswan_desc:0 "Assouan est une ville majeure du sud de l'Égypte qui servait traditionnellement de frontière entre l'Égypte et la Nubie, et abritait historiquement un certain nombre de temples, car elle revêtait une grande importance religieuse pour les deux civilisations.\n\nSi vous êtes de certaines [faiths|El] païennes, vous pouvez effectuer une #V [GetActivityType( 'activity_RICE_upper_egypt_visit_aswan_temples' ).GetName]#!, un type de [local_pilgrimage|El], et choisir entre prier aux temples d'Éléphantine, de Philae et de Kalabsha. Chaque lieu vous permet à son tour de vous concentrer sur l'adoration de l'une des trois divinités, vous permettant potentiellement d'obtenir divers bienfaits.\n\nCependant, cette [activity|El] n'est pas toujours disponible, car les temples de ces trois lieux peuvent être #bold Officiellement fermés#! par un [ruler|El] qui n'est pas de ces [faiths|El], rendant leur accès impossible. Si les trois sont fermés, l'[activity|El] sera indisponible. En revanche, ils peuvent toujours être #bold Officiellement rouverts#! par quiconque d'une [faith|El] païenne appropriée et redevenir accessibles."
 game_concept_darb_al_arbain:0 "Darb Al-Arba'in"
 game_concept_darb_al_arbain_desc:0 "Le Darb Al-Arba'in (ou la Route des Quarante Jours) est une route caravanière majeure qui relie Assiout en Égypte au Darfour, au sud de la Nubie. Elle existe depuis l'époque pharaonique et était encore utilisée au XIXe siècle.\n\nLes [rulers|E] de huit [counties|El] connectés par cette route ont accès à une [decision|El] pour effectuer le #V $RICE_upper_egypt_reinforce_the_darb_al_arbain$#!. Elle vous permet d'obtenir le [county_modifier|El] [GetModifier('RICE_upper_egypt_reinforced_darb_al_arbain').GetNameWithTooltip] pendant #V 20#! ans dans #Bold un#! [county|El] le long du Darb Al-Arba'in.\n\nDu nord au sud, ces huit [counties|El] sont :\n\n$EFFECT_LIST_BULLET$Assiout, Kharga et Assouan en Égypte\n$EFFECT_LIST_BULLET$Qasr Ibrim et Saï en Nubie\n$EFFECT_LIST_BULLET$Dár al-Ríh, El-Fasher et Ayn Farah au Darfour"

