 # Other Decisions
 RICE_upper_egypt_reintroduce_faith_luxor_temple:0 "Reconsacrer le temple de Louxor"
 RICE_upper_egypt_reintroduce_faith_luxor_temple_tooltip:0 "Le principal édifice religieux de Louxor devrait être modifié pour refléter nos croyances."
 RICE_upper_egypt_reintroduce_faith_luxor_temple_desc:0 "Les croyants [ROOT.Char.GetFaith.GetReligion.GetAdherentNamePlural] sont de plus en plus nombreux en Haute-Égypte. Il est donc étrange que le temple de Louxor ne soit pas actuellement utilisé par nos [ROOT.Char.Custom('DefaultPriestTitlePlural')] pour les services religieux. Nous devrions entreprendre de rénover le lieu afin qu'il devienne un lieu [ROOT.Char.GetFaith.GetReligion.GetAdherentName] digne de ce nom."
 RICE_upper_egypt_reintroduce_faith_luxor_temple_effect_tooltip:0 "Prendre cette [decision|El] vous permettra d'utiliser le [special_building|El] en [qus_county.GetNameNoTier], car il est actuellement désactivé parce que vous suivez une [faith|El] incompatible"
 RICE_upper_egypt_reintroduce_faith_luxor_temple_confirm:0 "Prenons les choses en main !"
 RICE_upper_egypt_reintroduce_faith_luxor_temple_context_tooltip:0 "#emphasis Contexte Historique :#! Le temple de Louxor a été construit vers 1400 avant notre ère et constituait l'un des principaux temples égyptiens de la région, avec Karnak. Au fil des siècles, il a été utilisé et réutilisé par des personnes de différentes confessions ; à un moment donné, il y avait même une sorte de village sous le temple. Actuellement, une mosquée a été construite dans un coin du temple."
 RICE_upper_egypt_luxor_recently_changed_req:0 "Le Louxor n'a PAS été récemment dédié à une autre religion au cours des 20 dernières années."
 RICE_upper_egypt_luxor_qus_faith_req:0 "Le [county|El] de Qus suit votre [faith|El]"

 # Events

 upper_egypt.0001.t:0 "L'Égypte à la croisée des chemins"
 upper_egypt.0001.desc:0 "[ibn_tulun.GetTitledFirstName] a récemment été nommé pour gouverner les terres du Nil au nom de [GetTitleByKey('d_sunni').GetHolder.GetTitledFirstName]. [CharYouSheHe(ibn_tulun)|U] cherche à centraliser l'autorité en [ibn_tulun.GetPrimaryTitle.GetNameNoTier] pour le bien commun, mais les choses commencent mal. À l'ouest, des descendants rebelles du Calife Ali, [CharYouFirstName(al_tabataba)] et [CharYouFirstName(al_sufi)], continuent de menacer la paix et la stabilité. Le [ibn_tulun.GetGovernment.GetName|l] des [ibn_tulun.GetHouse.GetName] dispose de quelques officiels compétents sur lesquels s'appuyer, tels que [CharYouFirstName(al_kan)], [CharYouFirstName(al_madharai)], [CharYouFirstName(al_farghani)], et [CharMyHerHis(ibn_tulun)] premier-né [ibn_tulun_son.Custom('GetDaughterSon')] [ibn_tulun_son.GetFirstName], bien que des rumeurs circulent selon lesquelles les deux derniers nourriraient de cruelles ambitions personnelles.\n\nCependant, le principal problème de [ibn_tulun.GetFirstNamePossessiveNoTooltip] réside dans plusieurs officiels vétérans [rivals|El] qui servent en Égypte depuis des années. Il est difficile de dire si cela est dû à de véritables malentendus, ou à des intrigues et des ambitions contradictoires. Parmi les plus éminents se trouvent le maître des postes et officier de renseignement officieux d'Égypte, [shukayr.GetFullName] ; et l'administrateur en chef, [al_mudabbir.GetFullName], aussi célèbre pour [Select_CString( al_mudabbir.IsLocalPlayer, 'votre', 'sa')] poésie et [Select_CString( al_mudabbir.IsLocalPlayer, 'votre', 'son')] [friendship|El] avec les anciens [al_mudabbir.GetFaith.ReligiousHeadName]s [Select_CString( al_mudabbir.IsLocalPlayer, 'que vous êtes', 'qu\\'il est')] détesté pour de supposées cruautés et sa politique d'imposition draconienne. Pour l'instant, les deux camps jouent leur jeu d'intrigues à la cour du [ibn_tulun.GetFaith.ReligiousHeadTitleName|U], mais ce n'est qu'une question de temps avant que #italic quelque chose#! ne se produise."
 upper_egypt.0001.a:0 "Que réserve le destin aux terres du Nil ?"
 upper_egypt.0001.tooltip.ibn_tulun:0 "#emphasis Contexte historique :#! Ibn Tulun, qui était à l'origine un esclave turc, s'est révélé être un administrateur compétent au cours de son mandat de gouverneur de l'Égypte. Après que l'Égypte ait été gouvernée par une succession de suzerains romains et arabes, il a établi le premier État pratiquement indépendant en Égypte depuis l'époque des Ptolémées.\n\nAprès la mort d'Ibn Tulun en 884 de notre ère, la dynastie toulounide qu'il avait fondée n'a duré que deux décennies supplémentaires, jusqu'en 905. Il a néanmoins ouvert la voie en étant l'un des premiers des nombreux gouverneurs et seigneurs de guerre dont les ambitions allaient conduire à la désintégration de l'autorité centrale abbasside."
 upper_egypt.0001.tooltip.al_tabataba:0 "#emphasis Contexte historique :#! Bugha al-Asghar Ahmad ibn Muhammad Ibn al-Tabataba était un Alid, ou descendant du calife Ali, qui a déclenché une révolte près de Barca contre les Abbassides en 859 de notre ère. Il s'est proclamé calife, mais a finalement été vaincu par les forces toulounides et exécuté en Égypte en 869."
 upper_egypt.0001.tooltip.al_sufi:0 "#emphasis Contexte historique :#! Ibrahim ibn Muhammad ibn al-Sufi était un Alid, ou descendant du calife Ali, qui a incité plusieurs rébellions contre les Abbassides en Égypte dans les années 860 de notre ère, culminant dans un massacre des habitants d'Esna en 869.\n\nAprès avoir été vaincu par les forces toulounides, il se retire dans les Oasis occidentales, avant de tenter d'attaquer al-Umari, le seigneur de la guerre basé dans le désert oriental, en 872. Vaincu une nouvelle fois, il ravage Assouan sur le chemin du retour, avant de s'enfuir à La Mecque où il est capturé. Ibn Tulun l'emprisonne quelque temps avant de l'autoriser à se rendre à Médine.\n\nL'un des partisans d'al-Sufi, Abu Ruh Sukun, se révolte en 873-874. Il résiste avec succès pendant un certain temps avant d'accepter une trêve avec Ibn Tulun."
 upper_egypt.0001.tooltip.al_kan:0 "#emphasis Contexte historique :#! Abu Ja'far Muhammad ibn 'Abd al-Kan était un fonctionnaire talentueux sous Ibn Tulun, qui servait comme son chancelier. Il pourrait avoir été responsable de la création d'un important #italic diwan#! médiéval égyptien (un terme utilisé pour décrire un ministère gouvernemental important dans divers États islamiques) appelé le #italic diwan al-insha'#!, qui était une chancellerie gérant la correspondance du souverain, les pétitions et les décrets. Il est décédé en 891 de notre ère."
 upper_egypt.0001.tooltip.al_madharai:0 "#emphasis Contexte historique :#! Les Al-Madhara'i étaient une famille d'éminents bureaucrates en Égypte et en Syrie qui, à différentes époques, ont servi les dynasties toulounide, abbasside et ikhshidide. Le premier membre éminent de la famille fut Abu Bakr Ahmad ibn Ibrahim al-Madhara'i, qui fut nommé contrôleur des finances par Ibn Tulun en 879 de notre ère.\n\nAprès sa mort, ses fils Ali et al-Husayn lui succèdent respectivement en Égypte et en Syrie. Les propres fils d'Ali, Ahmad et Muhammad, atteindront également de hauts rangs plus tard, au début du Xe siècle. À la fin de leur vie, les membres de la famille sont impliqués dans des intrigues de cour entre les factions bureaucratiques de Bagdad, et ils rejoignent notamment l'opposition à la famille Banu'l-Furat, composée de fonctionnaires chiites."
 upper_egypt.0001.tooltip.ibn_tulun_son:0 "#emphasis Contexte historique:#! Al-Abbas était le fils aîné du fondateur de la dynastie toulounide, Ibn Touloun, qui était le premier héritier présomptif de son père. Ibn Tulun, cherchant à s'assurer un territoire en Syrie, laissa al-Abbas comme adjoint en Égypte en 879 de notre ère. Cependant, le crédule al-Abbas fut facilement manipulé par son entourage pour s'emparer du pouvoir.\n\nal-Abbas fut finalement capturé par ibn Tulun en 881 de notre ère. Par la suite, pour tester secrètement son caractère, Ibn Tulun demanda à son fils de crever les yeux et de couper les mains de ses conspirateurs, s'attendant à ce qu'il refuse. Lorsque al-Abbas s'exécuta sans hésitation, ibn Tulun aurait pleuré abondamment sur la cruauté et le manque de confiance de son fils et l'aurait emprisonné. L'autre fils et successeur d'Ibn Tulun, Khumarawayh, fit exécuter al-Abbas en 884."
 upper_egypt.0001.tooltip.shukayr:0 "#emphasis Contexte historique :#! Shukayr al-Khadim était le maître de poste en Égypte lorsqu'Ibn Tulun arriva pour commencer son mandat de gouverneur. En tant que chef du #italic barid#!, le service postal abbasside, il était responsable de la correspondance avec le Calife et une sorte de maître-espion en Égypte.\n\nLorsqu'Ibn Tulun arriva pour la première fois, Shukayr et un autre officiel, le détesté percepteur Ibn al-Mudabbir, l'accueillirent avec un cadeau de 10000 dinars. Ce cadeau étant destiné à garantir que lui et al-Mudabbir conserveraient leur pouvoir autonome, Ibn Tulun le refusa pour affirmer son autorité.\n\nPar la suite, il y eut de nombreuses intrigues tandis qu'Ibn Tulun et ces officiels tentaient de se surpasser mutuellement à la cour abbasside. Finalement, Ibn Tulun réussit à obtenir la destitution de Shukayr vers 872 de notre ère, et Shukayr mourut peu après."
 upper_egypt.0001.tooltip.al_mudabbir:0 "#emphasis Contexte historique :#! Ibn Mudabbir était un administrateur de haut rang du Califat abbasside, possiblement d'origine perse. Lui et son frère, Ibrahim, étaient des hommes de lettres distingués qui entretenaient des relations amicales avec plusieurs Califes. À la suite d'intrigues qui aboutirent à leur emprisonnement par leurs rivaux, Ibn Mudabbir fut nommé chef collecteur d'impôts en Égypte en 861 de notre ère. Il instaura un certain nombre de mesures draconiennes, dont beaucoup étaient considérées comme contraires au Coran, pour augmenter les revenus fiscaux, et fut exécré par une grande partie de la population.\n\nLorsque Ibn Tulun arriva pour la première fois, Ibn al-Mudabbir et un autre officiel, Shukayr, l'accueillirent avec un cadeau de 10000 dinars. Comme ce cadeau était censé être un geste pour s'assurer que lui et Ibn al-Mudabbir conserveraient leur pouvoir autonome, Ibn Tulun le refusa pour affirmer son autorité.\n\nPar la suite, de nombreuses intrigues eurent lieu alors qu'Ibn Tulun et ces officiels tentaient de se surpasser mutuellement à la cour abbasside. Finalement, Ibn Tulun parvint à sortir victorieux de son jeu d'intrigues, et emprisonna Ibn al-Mudabbir en 871 ; il fut libéré puis emprisonné à nouveau à quelques reprises, mourant finalement en prison en 883 ou 884 de notre ère. Le frère d'Ibn al-Mudabbir, Ibrahim, quant à lui, réussit une évasion audacieuse en perçant le mur de la prison, et se rendit à Bagdad où il servit comme bureaucrate jusqu'à sa propre mort en 893 de notre ère."
 upper_egypt.0001.tooltip.al_farghani:0 "#emphasis Contexte historique :#! Muhammad ibn al-Faraj al-Farghani était un gouverneur toulounide de Barca qui déclara une rébellion contre Ibn Tulun en 874 ou 875 de notre ère. Les forces toulounides menèrent un siège difficile contre Barca, recourant aux engins de siège pour prendre la ville d'assaut avec succès. Malgré tout, Ibn Tulun fit preuve d'une grande retenue dans la répression de la rébellion par la suite."
 #upper_egypt.0001.desc:0 "[ibn_tulun.GetTitledFirstName] has recently been appointed to govern the lands of the Nile in the name of the Caliph, and claims his chief goals are to centralize authority in Egypt for the greater good, yet things have gotten off to a rocky start. Though [ibn_tulun.GetFirstName] trusts his firstborn son, [ibn_tulun_son.GetFirstName], there are rumors the boy has cruel ambitions of his own. Meanwhile, [ibn_tulun.GetFirstName] and several veteran officials, who have served in Egypt for years, are already not on good terms, to say the least. It is hard to say whether this is due to genuine misunderstandings, or intrigue and conflicting ambitions.\n\nProminent among these veteran officials are postmaster and Egypt’s unofficial intelligence officer, [shukayr.GetFullName]; and the chief administrator, a Persian named [al_mudabbir.GetFullName], famed for his poetry and friendship with past Caliphs as he is loathed for his supposed cruelty and draconian tax policies.\n\nFor now, both sides play their game of intrigue in the court of the Caliph, but it is only a matter of time before #italic something#! happens."
 upper_egypt.0001.tooltip.no:0 "Vous continuerez à jouer en tant que [THIS.Char.GetTitledFirstNameNoTooltip]."
 #upper_egypt.0001.a:0 "My story is with [ROOT.Char.GetTitledFirstName], of course."
 upper_egypt.0001.b:0 "Mon histoire est avec [ibn_tulun_son.GetFirstName], l'héritier aîné des Tulunides."
 upper_egypt.0001.c:0 "Mon histoire concerne [shukayr.GetFirstName], le maître des postes d'Égypte."
 upper_egypt.0001.d:0 "Mon histoire est avec [al_mudabbir.GetFirstName], poète et impitoyable collecteur d'impôts."
 upper_egypt.0001.e:0 "Je suis heureux de reconnaître [ibn_tulun.GetFirstNameNoTooltip] comme gouverneur."
 upper_egypt.0001.f:0 "Le soi-disant 'gouverneur' [ibn_tulun.GetFirstNameNoTooltip] est un imbécile devant qui je ne m'inclinerai pas."
