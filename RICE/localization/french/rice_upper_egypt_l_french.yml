 RICE_upper_egypt_darb_el_fasher_option:0 "#Bold #V El-Fasher#!#!"
 RICE_upper_egypt_darb_el_fasher_option_desc:0 "L'extrémité sud du Darb Al-Arba'in, en regardant vers l'est en direction de la Nubie"
