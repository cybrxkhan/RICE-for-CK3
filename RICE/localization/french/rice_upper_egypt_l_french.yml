 upper_egypt.0021.t:0 "Nilomètres"
 upper_egypt.0021.desc:0 "Depuis l'époque des pharaons, les nilomètres sont un élément essentiel de la société le long de la [GetGeographicalRegion('RICE_nile_river_valley').GetName] depuis des siècles. Ces structures nous aident à mesurer la hauteur des crues du Nil, et cette connaissance pourrait faire la différence entre la prospérité d'une part, et le chaos d'autre part. C'est pourquoi j'ai ordonné la rénovation et la réparation de plusieurs nilomètres dans les territoires que je gouverne, afin qu'ils restent fiables et précis. D'autres pourront être construits si nécessaire."
 upper_egypt.0021.a:0 "J'espère que cela nous servira dans les années à venir."
 upper_egypt.0022.t:0 "La cérémonie"
 upper_egypt.0022.desc:0 "Chaque année, le Nil inonde ; la vie de tous ceux qui vivent en Égypte en dépend. Il en est ainsi depuis des temps immémoriaux.\n\nL'inondation du Nil a heureusement été bonne cette année, et les fermiers le long du Nil peuvent s'attendre au pire à une récolte adéquate. Bientôt, nous pourrons ouvrir les canaux à travers l'Égypte pour acheminer l'eau vers les terres agricoles bientôt fertiles par des fossés d'irrigation et des voies d'eau. C'est une tradition [ROOT.Char.GetCulture.GetName] que les officiels ouvrent ces canaux lors d'une cérémonie formelle, pleine de faste et de solennité.\n\nLes préparatifs sont déjà en cours."
 upper_egypt.0022.desc.normal:0 "J'ai prévu la cérémonie obligatoire pour l'ouverture de ces canaux. Célébrons notre bonne fortune !"
 upper_egypt.0022.desc.grand:0 "La cérémonie de cette année a fait l'objet de beaucoup de travail, car je souhaite organiser une cérémonie plus grandiose que d'habitude, pleine de spectacle et de liesse."
 upper_egypt.0022.a:0 "Célébrons la bonne crue du Nil de cette année !"
 upper_egypt.0023.t:0 "Les canaux du Nil sont ouverts"
 upper_egypt.0023.desc:0 "Aujourd'hui est le jour de la cérémonie officielle d'ouverture des canaux du Nil après une bonne crue du Nil.\n\nChevauchant un beau destrier, je me rends à la digue à l'embouchure du canal, tandis qu'une procession d'officiels, courtisans, soldats, nobles, [ROOT.Char.Custom('DefaultPriestTitlePlural')], et d'autres dignitaires me suit. Le long des rives du Nil, des gens de toutes conditions se pressent pour observer les événements.\n\nAprès que les [ROOT.Char.Custom('DefaultPriestTitlePlural')] ont dit leurs prières et que les autres rituels sont accomplis, on me remet une lance, que je projette dans la digue. Un groupe de personnes s'attaque alors à la digue, pour laisser l'eau inonder les canaux. Le premier bateau, rempli de sourds et de muets, est bientôt envoyé sur le canal (ils recevront plus tard ma charité, comme le veut la tradition, bien entendu).\n\nLa cérémonie terminée, une grande clameur s'élève de la foule, et les festivités commencent."
 upper_egypt.0023.a:0 "Il ne nous reste plus qu'à attendre quelques mois avant de commencer à planter."
 upper_egypt.0024.t:0 "Repentez-vous, repentez-vous !"
 upper_egypt.0024.desc:0 "Chaque année, le Nil déborde ; la vie de tous ceux qui vivent en Égypte en dépend. Il en est ainsi depuis des temps immémoriaux.\n\nCependant, il arrive des années où la calamité frappe, et il n'y a pas de crue. Cette année a été, à l'horreur de tous, l'une de ces années. Pour les [ROOT.Char.GetFaith.GetAdherentNamePlural] [ROOT.Char.GetCulture.GetCollectiveNoun|l] comme moi, les crues insuffisantes comme celle-ci sont généralement interprétées comme une punition de [ROOT.Char.GetFaith.PantheonTerm] pour nos péchés.\n\nÀ la lumière de cela, et pour apaiser une partie de la panique et de la frustration que tous dans mon royaume doivent ressentir, j'ai décidé d'organiser une grande cérémonie de prière, d'offrandes et de supplications à [ROOT.Char.GetFaith.PantheonTerm], pour demander pardon et miséricorde. Avec un peu de chance, [ROOT.Char.GetFaith.HighGodName] entendra nos démonstrations sincères de repentance, et nous connaîtrons une meilleure fortune dans les années à venir."
 upper_egypt.0024.a:0 "Nous #italic devons#! montrer notre repentance !"
 #upper_egypt.0024.a:0 "A modest amount - our thoughts and prayers should suffice!"
 #upper_egypt.0024.b:0 "A decent amount - let none doubt we regret our sins!"
 #upper_egypt.0024.c:0 "A huge amount - spare no cost, we must #italic show#! our repentance!"
 upper_egypt.0024.tooltip:0 "Plus vous dépensez d'[gold|El], plus la cérémonie sera grandiose, et plus il est probable que le repentir soit perçu comme sincère. Cependant, sachez que vos [virtues|El], [sins|El], [traits|El] et votre [piety_level|El] influencent également ces chances."
 upper_egypt.0025.t:0 "Repentance au bord du Nil"
 upper_egypt.0025.desc:0 "Moi et bien d'autres avons passé des jours à organiser notre grande cérémonie de repentance et de prière le long du Nil, et aujourd'hui, nos plans portent leurs fruits.\n\nUne grande multitude de gens issus de toutes les couches de la société - des mendiants les plus humbles aux aristocrates les plus puissants - se sont rassemblés à l'endroit convenu. Je suis là, aux côtés des [ROOT.Char.Custom('DefaultPriestTitlePlural')] [ROOT.Char.GetFaith.GetAdherentNamePlural], qui mènent la foule dans des séries de prières apparemment interminables.\n\nAlors que la journée s'étire, nous marchons même de long en large le long du Nil, tandis que les cris et les récitations deviennent de plus en plus forts. Nos voix se combinent en une symphonie de lamentation et de regret, demandant à [ROOT.Char.GetFaith.HighGodName] d'entendre nos suppliques et de nous inspirer la vertu et la sainteté, afin que les futures crues du Nil soient meilleures."
 upper_egypt.0025.a:0 "[ROOT.Char.GetFaith.HighGodName] reconnaîtra-t-il notre repentir sincère ?"
