 RICE_upper_egypt_aswan_temple_decision_choose_where_to_pray:0 "Choisir une île sacrée à Assouan"
 RICE_upper_egypt_temple_philae_option:0 "#Bold #V Philae#!#!\nPriez Isis, Osiris et Horus"
 RICE_upper_egypt_temple_philae_option_desc:0 "Prier Isis, Osiris et Horus"
 RICE_upper_egypt_temple_philae_option_tooltip:0 "#V Philae#! marque la frontière traditionnelle entre l'Égypte et la Nubie, et est un centre de culte pour la grande déesse #V Isis#!, ainsi que son frère-époux Osiris et leur fils Horus\n#weak Prier ici vous permettra de vous concentrer sur le gain d'expérience mensuel, l'opinion du comté et l'opinion des vassaux#!"
