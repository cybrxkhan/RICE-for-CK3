 RICE_upper_egypt_temple_kalabsha_option_tooltip:0 "#V Kalabsha#! est un site sacré majeur pour #V Mandulis#!, une divinité solaire et lunaire originaire de Nubie ; le temple y est également dédié à d'autres divinités, telles que le sage Imhotep et le protecteur Toutou\n#weak Prier ici vous permettra de vous concentrer sur la renommée, le coût de construction et la résistance aux complots hostiles#!"
