 activity_RICE_upper_egypt_open_nile_canals_host_an_a:0 "une"
 activity_RICE_upper_egypt_open_nile_canals:0 "Ouverture des canaux du Nil"
 activity_RICE_upper_egypt_open_nile_canals_desc:0 "Si l'[nile_flood|El] est bonne cette année en Égypte, nous devrions ouvrir les canaux d'irrigation pour exploiter la crue annuelle du fleuve et distribuer l'eau dans nos terres agricoles plus efficacement. L'ouverture des canaux est une cérémonie importante depuis l'époque des Pharaons."
 activity_RICE_upper_egypt_open_nile_canals_selection_tooltip:"Ouvrir les canaux du Nil pour célébrer une bonne [nile_flood|El].\n\n$RICE_upper_egypt_celebrate_nile_canal_opening_context_tooltip$"
 activity_RICE_upper_egypt_open_nile_canals_host_desc:"\n$BULLET_WITH_TAB$Gain de [piety_i|El][piety|El], [prestige_i|El][prestige|El], et un [character_modifier|El] #P bénéfique#!  selon la qualité de l'[nile_flood|El]"
 activity_RICE_upper_egypt_open_nile_canals_guest_desc: "$activity_RICE_upper_egypt_open_nile_canals_host_desc$"
 activity_RICE_upper_egypt_open_nile_canals_province_desc: "" # Fallback option
 activity_RICE_upper_egypt_open_nile_canals_destination_selection: ""
 activity_RICE_upper_egypt_open_nile_canals_guest_help_text: "$activity_RICE_upper_egypt_open_nile_canals$"
 activity_RICE_upper_egypt_open_nile_canals_predicted_cost:"Le coût de la cérémonie d'ouverture des canaux du Nil dépend des [activity_options|El] que vous sélectionnez."
 RICE_upper_egypt_pray_good_nile_flood_cost: "Taille de la cérémonie"
 activity_RICE_upper_egypt_open_nile_canals_conclusion_desc:"J'ai fait ma part en procédant formellement à l'[GetActivityType( 'activity_RICE_upper_egypt_open_nile_canals' ).GetName|l]. Puisse le Nil nous accorder une récolte abondante cette année !"
 RICE_upper_egypt_open_nile_canals_type_normal: "Cérémonie normale"
 RICE_upper_egypt_open_nile_canals_type_normal_desc:"$EFFECT_LIST_BULLET$Accomplir la cérémonie obligatoire dans le cadre de vos devoirs.\n$EFFECT_LIST_BULLET$La quantité de [prestige_i|El] [prestige|El] et de [piety_i|El] [piety|El] gagnée est inférieure à celle d'une #bold Grande Cérémonie#!\n\n#weak Depuis des temps immémoriaux, le Nil inonde chaque année - cette année ne fait pas exception.#!"
 RICE_upper_egypt_open_nile_canals_type_grand: "Grande cérémonie"
 RICE_upper_egypt_open_nile_canals_type_grand_desc:"$EFFECT_LIST_BULLET$Préparer une magnifique cérémonie pour l'ouverture du canal du Nil.\n$EFFECT_LIST_BULLET$ Gain de #V 50%#! de plus de [prestige_i|El] [prestige|El] et de [piety_i|El] [piety|El] par rapport à une #bold Cérémonie Normale#!\n$EFFECT_LIST_BULLET$Gain d'une petite quantité de [dynasty_prestige_i|El] [dynasty_prestige|El]\n\n#weak Avec une si bonne crue du Nil cette année, nous avons besoin d'une célébration plus extravagante que d'habitude !#!"
 RICE_upper_egypt_open_nile_canals_opening_phase:"Ouverture"
 RICE_upper_egypt_open_nile_canals_opening_phase_desc: "Nous ne prospérons que grâce aux eaux du grand fleuve Nil."
 RICE_upper_egypt_open_nile_canals_celebration_intent_header: "Célébration :"
 RICE_upper_egypt_open_nile_canals_celebration_intent: "Célébration"
 RICE_upper_egypt_open_nile_canals_celebration_intent_desc:"Une bonne [nile_flood|El] est quelque chose qui mérite d'être célébré !"
 RICE_upper_egypt_open_nile_canals_completed_log_title:0 "Ouverture des canaux du Nil terminée"
 RICE_upper_egypt_open_nile_canals_completed_log:0 "[CHARACTER.GetShortUIName|U] a terminé l'ouverture des canaux du Nil"
 TRAVEL_NAME_FOR_activity_RICE_upper_egypt_open_nile_canals:0 "[Character.GetFirstNamePossessiveNoTooltip] $activity_RICE_upper_egypt_open_nile_canals$"
 activity_RICE_upper_egypt_pray_good_nile_flood_host_an_a:0 "une"
 activity_RICE_upper_egypt_pray_good_nile_flood:0 "Cérémonie de repentance pour les inondations du Nil"
 activity_RICE_upper_egypt_pray_good_nile_flood_desc:0 "Parfois, l'[nile_flood|El] n'est pas idéale, lorsqu'elle n'atteint pas la quantité optimale nécessaire à une bonne récolte le long du Nil. Dans ce cas, nous devons implorer le pardon de nos péchés pour que cela ne se reproduise plus !"
 activity_RICE_upper_egypt_pray_good_nile_flood_selection_tooltip:"Prier pour une meilleure [nile_flood|El].\n\n$RICE_upper_egypt_pray_for_a_good_nile_flood_context_tooltip$"
 activity_RICE_upper_egypt_pray_good_nile_flood_host_desc:"\n$BULLET_WITH_TAB$Gain de [piety_i|E][piety|El]\n$BULLET_WITH_TAB$Gain de [prestige_i|E][prestige|El]\n$BULLET_WITH_TAB$Possibilité d'obtenir le [county_modifier|El] [GetModifier('RICE_nile_flood_repentance').GetNameWithTooltip] dans tous les [counties|El] que vous possédez le long de [GetGeographicalRegion('RICE_nile_river_valley').GetName] pour atténuer les effets négatifs d'une mauvaise [nile_flood|El]\n\nL'efficacité des récompenses dépend de vos [traits|El], [virtues|El], [sins|El], et [piety_level|El]"
 activity_RICE_upper_egypt_pray_good_nile_flood_guest_desc: ""
 activity_RICE_upper_egypt_pray_good_nile_flood_province_desc: "" # Fallback option
 activity_RICE_upper_egypt_pray_good_nile_flood_destination_selection: ""
 activity_RICE_upper_egypt_pray_good_nile_flood_guest_help_text: "$activity_RICE_upper_egypt_pray_good_nile_flood$"
 activity_RICE_upper_egypt_pray_good_nile_flood_predicted_cost:"Le coût de la Cérémonie de Repentance dépend des [activity_options|El] que vous sélectionnez."
 activity_RICE_upper_egypt_pray_good_nile_flood_cost:"Taille de la cérémonie"
 activity_RICE_upper_egypt_pray_good_nile_flood_conclusion_desc:"Nous avons accompli une [GetActivityType( 'activity_RICE_upper_egypt_pray_good_nile_flood' ).GetName|El]. Espérons que [GetPlayer.GetFaith.HighGodName] entende nos prières !"
 RICE_upper_egypt_pray_good_nile_flood_amount_type:"Taille de la cérémonie"
 RICE_upper_egypt_pray_good_nile_flood_amount_type_small: "Petite"
 RICE_upper_egypt_pray_good_nile_flood_amount_type_small_desc:"$EFFECT_LIST_BULLET$ Accomplir la cérémonie obligatoire pour prier pour une bonne [nile_flood|El] et se repentir d'une mauvaise.\n$EFFECT_LIST_BULLET$ Plus petite quantité de [piety_i|El][piety|El] et de [prestige_i|El][prestige|El] gagnée\n$EFFECT_LIST_BULLET$ Plus petite chance d'obtenir le [county_modifier|El] [GetModifier('RICE_nile_flood_repentance').GetNameWithTooltip] dans tous les [counties|El] que vous possédez le long de [GetGeographicalRegion('RICE_nile_river_valley').GetName]\n\n#weak Assurément, notre sincère désir de repentance sera suffisant, et [GetPlayer.GetFaith.HighGodName] entendra nos prières.#!"
 RICE_upper_egypt_pray_good_nile_flood_amount_type_medium: "Moyenne"
 RICE_upper_egypt_pray_good_nile_flood_amount_type_medium_desc:"$EFFECT_LIST_BULLET$ Accomplir la cérémonie obligatoire pour prier pour une bonne [nile_flood|El] et se repentir d'une mauvaise.\n$EFFECT_LIST_BULLET$ Quantité modérée de [piety_i|El][piety|El] et de [prestige_i|El][prestige|El] gagnée\n$EFFECT_LIST_BULLET$ Chance décente d'obtenir le [county_modifier|El] [GetModifier('RICE_nile_flood_repentance').GetNameWithTooltip] dans tous les [counties|El] que vous possédez le long de  [GetGeographicalRegion('RICE_nile_river_valley').GetName]\n\n#weak Quand la crue est mauvaise, nous devons faire ce que nous pouvons pour nous repentir et prier [GetPlayer.GetFaith.HighGodName] de nous sauver. Nous ne pouvons pas nous contenter du strict minimum.#!"
 RICE_upper_egypt_pray_good_nile_flood_amount_type_large: "Grande"
 RICE_upper_egypt_pray_good_nile_flood_amount_type_large_desc:"$EFFECT_LIST_BULLET$ Accomplir la cérémonie obligatoire pour prier pour une bonne [nile_flood|El] et se repentir d'une mauvaise.\n$EFFECT_LIST_BULLET$ Plus grande quantité de [piety_i|El][piety|El] et de [prestige_i|El][prestige|El] gagnée\n$EFFECT_LIST_BULLET$ Plus grande chance d'obtenir le [county_modifier|El] [GetModifier('RICE_nile_flood_repentance').GetNameWithTooltip] dans tous les [counties|El] que vous possédez le long de [GetGeographicalRegion('RICE_nile_river_valley').GetName]\n\n#weak Nos péchés sont terribles, menant à l'état actuel du Nil. Nous devons nous donner du mal pour prouver à [GetPlayer.GetFaith.HighGodName] que nous souhaitons véritablement, sincèrement, profondément nous repentir.#!"
 RICE_upper_egypt_pray_good_nile_flood_prayer_phase:"Prière"
 RICE_upper_egypt_pray_good_nile_flood_prayer_phase_desc:"Ô [GetPlayer.GetFaith.HighGodName], entends nos supplications pour ta miséricorde, et laisse le Nil couler comme il se doit une fois encore !"
 RICE_upper_egypt_pray_good_nile_flood_repentance_intent_header:"Repentance :"
 RICE_upper_egypt_pray_good_nile_flood_repentance_intent: "Repentance"
 RICE_upper_egypt_pray_good_nile_flood_repentance_intent_desc:"Une mauvaise [nile_flood|El] est causée par nos péchés. En tant que communauté, nous devons collectivement nous repentir pour cela."
 RICE_upper_egypt_pray_good_nile_flood_completed_log_title:0 "Cérémonie de repentance pour les inondations du Nil"
