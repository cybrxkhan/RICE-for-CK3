 upper_egypt.0060.t:0 "Attaque d'hippopotames"
 upper_egypt.0060.desc:0 "Les hippopotames peuvent être trouvés tout au long de [GetGeographicalRegion('RICE_nile_river_valley').GetName]. Bien que leur nombre ait diminué ces dernières années, les gens les rencontrent encore fréquemment, et ces bêtes sont souvent féroces et agressives. Il est toujours sage, dit-on, de se tenir à l'écart de ces hippopotames.\n\nHélas, un tel hippopotame s'est récemment déchaîné dans [county.GetNameNoTier]. Il a tué un grand nombre de personnes avant d'être finalement maîtrisé par de courageux chasseurs et gardes locaux."
 upper_egypt.0060.a:0 "Je vois.... C'est malheureux à entendre."
 upper_egypt.0060.b:0 "Faisons un don aux familles des victimes."
 upper_egypt.0061.t:0 "Inspections le long du Nil"
 upper_egypt.0061.desc:0 "Aujourd'hui, j'inspecte certains de mes territoires le long de [GetGeographicalRegion('RICE_nile_river_valley').GetName|l]. Plus précisément, je voyage pour voir une partie de la campagne rurale. L'agriculture, après tout, a été un élément majeur de la vie le long du Nil pendant des siècles, voire des millénaires, il est donc important que je m'assure que ces fermes seront en mesure de produire un approvisionnement alimentaire adéquat.\n\nQuoi qu'il en soit, je passe plusieurs heures à discuter avec des fermiers et des fonctionnaires locaux de l'état des réseaux d'irrigation locaux. Nous devons nous assurer que ceux-ci sont toujours en bon état afin de pouvoir pleinement tirer parti de la crue annuelle du Nil."
 upper_egypt.0061.a:0 "Un travail fastidieux mais nécessaire."
 upper_egypt.0062.t:0 "Khirs"
 upper_egypt.0062.desc:0 "Récemment, à [county.GetNameNoTier], un certain nombre de pasteurs nomades se sont installés pour tirer profit d'un type de terre connu sous le nom de #italic khirs#!. Il s'agit de zones le long du Nil qui ne sont pas adaptées à l'agriculture, en raison de la grande quantité de mauvaises herbes présentes et du manque d'entretien de la part des villageois locaux pour transformer ce territoire en terres arables.\n\nCela dit, ce n'est pas parce que ces villageois n'utilisent pas ces terres qu'ils accueilleraient volontiers quiconque comme voisin. Les tensions montent entre les villageois et les pasteurs, et je dois gérer la situation avec délicatesse."
 upper_egypt.0062.a:0 "Laissons les deux parties régler cela elles-mêmes, cela ne me concerne pas."
 upper_egypt.0062.b:0 "Tant que les éleveurs ne causent pas de problèmes, ils sont les bienvenus."
 upper_egypt.0062.c:0 "Les villageois ont le droit de chasser les nomades s'ils le souhaitent."
 upper_egypt.0062.d:0 "J'aiderai les deux parties à trouver un accord."
 upper_egypt.0063.t:0 "Le Don du Nil"
 upper_egypt.0063.desc:0 "J'assiste à un sermon d'un [ROOT.Char.Custom('DefaultPriestTitle')] [ROOT.Char.GetFaith.GetAdherentName] originaire de mes territoires le long de [GetGeographicalRegion('RICE_nile_river_valley').GetName|El].\n\nDans le sermon, le [ROOT.Char.Custom('DefaultPriestTitle')] parle de la façon dont [ROOT.Char.GetFaith.HighGodName] nous favorise, et cela explique pourquoi la crue du Nil se produit, et comment c'est grâce à la grâce de [ROOT.Char.GetFaith.HighGodName] que nous pouvons exploiter la générosité de l'Égypte. Quand nous honorons [ROOT.Char.GetFaith.HighGodName] et suivons la religion [ROOT.Char.GetFaith.GetAdjective], l'inondation du Nil est excellente ; quand nous décevons [ROOT.Char.GetFaith.HighGodName] et commettons des péchés, nous recevons une mauvaise inondation du Nil pour nous rappeler d'être humbles et d'éviter le péché. Et ainsi, sans [ROOT.Char.GetFaith.HighGodName], nous n'aurions aucune récolte à moissonner le long du Nil."
 upper_egypt.0063.a:0 "En vérité, il en est ainsi ! La nourriture que nous tirons du Nil, nous la devons à [ROOT.Char.GetFaith.HighGodName]."
 upper_egypt.0063.b:0 "C'est vrai, mais une bonne récolte est aussi le fruit du travail acharné de chacun."
 upper_egypt.0064.t:0 "Prier au bord du Nil"
 upper_egypt.0064.desc:0 "Je voyageais dans [county.GetNameNoTier], le long de [GetGeographicalRegion('RICE_nile_river_valley').GetName|l], quand je suis tombé sur plusieurs [ROOT.Char.Custom('DefaultPriestTitlePlural')] faisant face au Nil et priant. Quand je leur ai demandé ce qu'ils faisaient, ils m'ont expliqué qu'ils priaient [ROOT.Char.GetFaith.HighGodName] pour nous assurer une bonne inondation la prochaine fois que le Nil déborderait. Après tout, bien que la crue du Nil soit prévisible, les résultats de son inondation ne le sont pas."
 upper_egypt.0064.a:0 "Je dois y aller, mais je vous souhaite le meilleur."
 upper_egypt.0064.b:0 "Puis-je me joindre à vous dans vos prières ?"
 upper_egypt.0065.t:0 "Archives du Nilomètre"
 upper_egypt.0065.desc:0 "Il a été porté à mon attention qu'un érudit de ma connaissance a récemment compilé des informations concernant la crue du Nil. Grâce aux Nilomètres que l'on trouve partout dans [GetGeographicalRegion('RICE_nile_river_valley').GetName|l], nous disposons de relevés relativement précis sur la qualité de la crue du Nil, remontant à plusieurs siècles.\n\nJ'ai songé à prendre un peu de temps libre de mes devoirs quotidiens pour étudier ces relevés, et discuter des informations qu'ils contiennent avec d'autres érudits locaux. Peut-être que ce savoir pourra m'offrir quelques idées sur la meilleure façon de gérer mes territoires le long du Nil."
 upper_egypt.0065.a:0 "Oui, c'est une connaissance importante pour un dirigeant comme moi."
 upper_egypt.0065.b:0 "Je n'ai pas le temps. J'ai déjà des personnes qui me conseillent sur le Nil."
 upper_egypt.0066.t:0 "Reconvertir un temple"
 upper_egypt.0066.desc:0 "Les monuments anciens et les grandes structures bâties il y a des éons sont un spectacle courant le long [GetGeographicalRegion('RICE_nile_river_valley').GetName|l]. Certains sont suffisamment grands pour être réutilisés à diverses fins, même longtemps après avoir été abandonnés.\n\nQuoi qu'il en soit, selon un officiel local de [county.GetNameNoTier], les villageois ont montré un intérêt pour l'utilisation d'un tel bâtiment, qui semble être une sorte d'ancien complexe de temples. Ces villageois ont l'intention de construire des maisons, des échoppes et d'autres structures nécessaires à l'intérieur de ce temple pour agrandir leur village. L'idée est qu'il serait efficace d'utiliser les murs du temple, qui sont solides, robustes et ont tenu pendant des générations, au lieu de construire au hasard dans un autre endroit.\n\nCependant, bien que le village soit situé à un emplacement stratégique, ce n'est pas le plus riche des établissements, et il a besoin d'une certaine aide pour que cela se réalise."
 upper_egypt.0066.a:0 "Je n'hésite pas à le faire ! Je peux soutenir financièrement cette entreprise."
 upper_egypt.0066.b:0 "Je ne peux pas les aider pour le moment, mais je leur souhaite bonne chance."
 upper_egypt.0067.t:0 "Ful Medames"
 upper_egypt.0067.desc:0 "Alors que je visite une ville le long de [GetGeographicalRegion('RICE_nile_river_valley').GetName], je savoure un plat de [Glossary( 'ful medames', 'FUL_MEDAMES_GLOSS' )]. C'est un ragoût copieux de fèves mélangées à de l'huile d'olive et diverses épices et garnitures, populaire parmi de nombreuses personnes de cette région depuis des générations."
 upper_egypt.0067.a:0 "Délicieux !"
