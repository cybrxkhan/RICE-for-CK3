l_french:
 aslian_religion:0 "Aslianisme"
 aslian_religion_adj:0 "Aslienne"
 aslian_religion_adherent:0 "Aslianiste"
 aslian_religion_adherent_plural:0 "Aslianistes"
 aslian_religion_desc:0 "Dans la vision du monde des tribus Orang Asli de Malaisie, le monde est empli de ténèbres et d'esprits dangereux. Dans un univers aussi périlleux, imposer sa volonté à autrui, ou se moquer d'autres êtres, même des insectes, c'est inviter le malheur et le mal."

 senoi_pagan:0 "Jnaangisme"
 senoi_pagan_adj:0 "Jnaangiste"
 senoi_pagan_adherent:0 "Jnaangiste"
 senoi_pagan_adherent_plural:0 "Jnaangistes"
 senoi_pagan_desc:0 "La force primordiale sans fin, Jnaang, a créé le monde ainsi que tous les humains et les dieux qui s'y trouvent. Nous devons éviter d'offenser ou de nuire à quiconque ou à quoi que ce soit, en particulier aux nombreux esprits de ce monde, de peur d'attirer les représailles du dieu du tonnerre Nkuu, lent d'esprit mais destructeur, qui ne peut être apaisé que par de petits sacrifices de sang. Cependant, les esprits amicaux peuvent être transformés en [Glossary( 'gunigs', 'GUNIG_GLOSS' )], des esprits familiers serviables."

