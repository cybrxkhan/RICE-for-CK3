 semang_pagan_adherent:0 "Kareyiste"
 semang_pagan_adherent_plural:0 "Kareyistes"
 semang_pagan_desc:0 "Il existe de nombreux esprits et divinités dangereux, mais le plus puissant est Karey, dieu du tonnerre, cruel et terrifiant. Karey punit ceux qui violent les tabous ou agissent de manière immorale en envoyant la mort, les blessures, la maladie, ou même des orages et des inondations."

