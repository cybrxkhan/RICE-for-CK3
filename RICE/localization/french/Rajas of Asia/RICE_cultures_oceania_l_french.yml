l_french:
 
 # All Oceania cultures/faiths
 # Some cultures here borrwed from Rajas of Asia

 # Traditions
 culture_parameter_rice_rename_meeting_houses:0 "La [decision|El] de #V $RICE_oceania_meeting_houses_decision$#! est disponible indépendamment du [heritage|El] et est renommée en #V $RICE_oceania_meeting_houses_decision_palauan$#!"
 culture_parameter_rice_better_meeting_houses:0 "La [decision|El] de #V $RICE_oceania_meeting_houses_decision_palauan$#! donne de meilleurs résultats sans avoir à payer d'[gold_i|El] [gold|El] supplémentaire, et offre à la place différentes options pour soutenir les [Glossary( 'confréries hiérarchisées', 'CHELDEBECHEL_GLOSS' )] masculines ou féminines"
 culture_parameter_unlock_rice_biak_mechanics:0 "La [decision|El] #V Contacter les aventuriers Biak#! donne de meilleurs bonus et peut être prise n'importe où"
 culture_parameter_rice_kava_bonus_culture:0 "Le [trait|El] [GetTrait('RICE_kava_drinker').GetName( GetNullCharacter )] accorde des bonus supplémentaires"
 culture_parameter_unlock_rice_kava_decision:0 "Débloque la [decision|El] de #V Boire du Kava#! indépendamment du [heritage|El] ou de la [religion|El]"
 culture_parameter_rice_kava_decision_bonuses:0 "La [decision|El] de #V Boire du Kava#! donne de meilleurs bonus"
 culture_parameter_unlock_rice_pacific_navigation:0 "Débloque l'[innovation|El] $innovation_RICE_pacific_navigation$"
 culture_parameter_unlock_rice_yap_stone_money_mechanic:0 "Débloque la [decision|El] pour #V $RICE_oceania_quarry_stone_money$#! et le [trait|El] [GetTrait('RICE_stone_money').GetName( GetNullCharacter )]"
 tradition_RICE_kava_culture_name:0 "Cérémonies du kava"
 tradition_RICE_kava_culture_desc:0 "#F Le kava joue un rôle important dans cette culture et est perçu comme une expression de bonne volonté et de sociabilité. Il est fréquemment bu lors de rituels religieux, en socialisant avec d'autres ou en débattant de questions politiques, et même au cours des repas.#!"
 tradition_RICE_oceanic_voyagers_name:0 "Voyageurs du Pacifique"
 tradition_RICE_oceanic_voyagers_desc:0 "#F Cette culture a une histoire d'exploration de nouveaux mondes étranges, de recherche de nouvelles formes de vie et de nouvelles îles, et d'avancée audacieuse là où personne n'est allé auparavant à travers les vastes océans, la dernière frontière de l'humanité.#!"
 tradition_RICE_palau_clubs_name:0 "Confréries hiérarchisées"
 tradition_RICE_palau_clubs_desc:0 "Les membres de cette culture sont assignés à des clubs formels appelés [Glossary( 'cheldebechel', 'CHELDEBECHEL_GLOSS' )] en fonction du genre, de l'âge et du rang social, conformément au principe de [Glossary( 'bitang me a bitang', 'BITANG_ME_A_BITANG_GLOSS' )]. Ces clubs gèrent des tâches et activités importantes, éduquent leurs membres sur des compétences utiles, les traditions orales et leurs rôles dans la société, et régulent les relations au sein de la communauté. Ils se réunissent souvent au #italic Bai#!, une salle de réunion polyvalente."
 tradition_RICE_biak_adventurers_name:0 "Aventuriers papous"
 tradition_RICE_biak_adventurers_desc:0 "Beaucoup dans cette culture bravent la haute mer pour chercher nourriture, commerce, esclaves, ressources, alliés, le frisson du combat, des terres à coloniser, et des idées culturelles et technologiques venues de loin. Les aventuriers qui réussissent dans ces entreprises gagnent un grand prestige et un grand honneur."
 tradition_RICE_biak_songs_name:0 "Chanter et Danser ou Mourir"
 tradition_RICE_biak_songs_desc:0 "Le chant et la danse jouent un rôle si important dans les coutumes et la vision du monde de ce peuple qu'il existe un dicton populaire : « Si tu ne sais ni chanter ni danser, tu n'es pas vivant. » Chanter et danser, voilà ce que signifie être humain."
 tradition_RICE_yap_stone_money_name:0 "Monnaie de pierre"
 tradition_RICE_yap_stone_money_desc:0 "Dans cette culture, de [Glossary( 'larges pierres', 'YAP_STONE_MONEY_GLOSS' )] sculptées en forme de disque avec un trou au centre jouent un rôle important en tant que forme de monnaie. Naviguer à travers les mers pour acquérir ces pierres, malgré les dangers et le risque de mort, est hautement considéré."
 culture_parameter_unlock_rice_biak_mambri:0 "Peut recruter des [men_at_arms|El] [GetMaA('RICE_mambri').GetName]"
 culture_parameter_unlock_rice_kwaraae_ramo:0 "Peut recruter des [men_at_arms|El] [GetMaA('RICE_kwaraae_ramo').GetName]"
 tradition_RICE_living_for_ghosts_name:0 "Vivre pour les fantômes"
 tradition_RICE_living_for_ghosts_desc:0 "Cette culture croit que les esprits sont des êtres puissants, et il est impératif pour les vivants de mener une vie morale s'ils veulent entretenir une relation productive avec les esprits. Par la prière et un comportement vertueux, on peut même demander aux fantômes d'aider en toute chose, des tâches quotidiennes de la vie de tous les jours à l'invocation de terrifiants [Glossary( 'guerriers fantômes', 'KWARAAE_WARRIOR_GHOSTS_GLOSS' )] pour détruire ses ennemis."
 
