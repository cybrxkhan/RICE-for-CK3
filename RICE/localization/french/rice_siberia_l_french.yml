 RICE_siberia_ate_mammoth_meat_good:0 "A mangé la viande d'une étrange créature à défenses (Bon)"
 RICE_siberia_ate_mammoth_meat_bad:0 "A mangé la viande d'une étrange créature à défenses (mauvais)"
 RICE_siberia_studying_kurgan:0 "Des universitaires locaux étudient un kourgane"
 RICE_siberia_kurgan_decorations:0 "Décorations d'un kourgane"
