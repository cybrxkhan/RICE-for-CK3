 siberia.0040.t:0 "Restes de la bête à défenses"
 siberia.0040.desc:0 "Des chasseurs de la région ont récemment découvert les restes d'une créature gargantuesque à défenses. Les peuples sibériens ont traditionnellement cru qu'il s'agissait de cadavres d'animaux géants, semblables à des taupes, morts en essayant de creuser jusqu'à la surface, tandis que d'autres, venus de terres lointaines, croient parfois qu'il s'agit de cadavres de bêtes géantes primordiales. Quoi qu'il en soit, comme les restes ont été trouvés dans ma juridiction, c'est à moi de décider ce qu'il convient d'en faire, en particulier des défenses, qui sont lucratives."
 siberia.0040.a:0 "Vendre les défenses à tout marchand de passage."
 siberia.0040.b:0 "Vendre les défenses à des marchands et s'assurer d'en tirer un bon profit."
 siberia.0040.c:0 "Gardez les défenses pour les utiliser dans nos œuvres d'art traditionnelles."
 siberia.0040.d:0 "Peut-être que les défenses peuvent être utilisées pour sculpter un trône à mon intention ?"
 siberia.0040.e:0 "Pourrions-nous essayer de manger la viande ? Je me demande quel goût elle a."
 siberia.0040.e.good:0 "La viande étrange a bon goût"
 siberia.0040.e.bad:0 "La viande étrange a mauvais goût"
 siberia.0041.t:0 "Kourgane"
 siberia.0041.desc:0 "Des habitants de la région sont tombés sur un kourgane, ou un tumulus recouvrant une tombe, d'un ancien notable inconnu en Sibérie. Nous n'avons aucune idée de la date de construction de ce site funéraire, et personne ne reconnaît le style artistique utilisé pour décorer la tombe ni les divers objets qu'elle contient. Les [ROOT.Char.Custom('DefaultPriestTitlePlural')] disent que c'est une chance que des pilleurs de tombes n'aient pas vidé les lieux, et que je devrais honorer les esprits des morts avec des rites [ROOT.Char.GetFaith.GetAdherentNamePlural] et ne pas les déranger autrement."
 siberia.0041.a:0 "Sceller la zone et laisser [ROOT.Char.Custom('DefaultPriestTitlePlural')] prier pour les esprits."
 siberia.0041.b:0 "Nos [ROOT.Char.Custom('DefaultPriestTitlePlural')] et érudits peuvent étudier l'ancien tombeau."
 siberia.0041.c:0 "Piller des tombes ? Cela me donne une idée. Pillons et vendons les marchandises."
 siberia.0041.d:0 "Nous pouvons piller certains de ces biens pour en faire de jolies décorations pour ma maison."
 siberia.0042.t:0 "Attaque d'ours"
 siberia.0042.desc:0 "Bien que les ours bruns aient tendance à éviter les conflits avec les humains, les attaques ne sont pas rares dans la région sibérienne. Malheureusement, l'une d'entre elles s'est récemment produite près de chez moi, tuant quelques habitants."
 siberia.0042.a:0 "C'est triste, mais je ne peux rien y faire."
 siberia.0042.b:0 "Aider les familles endeuillées à surmonter la perte."
 siberia.0043.t:0 "Fourrures de Kolonok"
 siberia.0043.desc:0 "Les kolonoks sont un type de belette qui habitent la Sibérie, et certains chasseurs locaux m'ont apporté leurs fourrures de kolonok récemment chassées. Bien que considérées de qualité inférieure aux fourrures d'espèces animales plus prisées, elles restent néanmoins désirables, et sont parfois intentionnellement utilisées comme imitations de substitution de fourrures d'autres espèces. Attraper et tuer les kolonoks est toujours un processus ardu, car une fois pris dans des pièges, les bêtes émettent souvent des cris perçants qui peuvent rendre quiconque fou et sécrètent une odeur si âcre qu'il faut des semaines pour qu'elle disparaisse. Ainsi, les chasseurs ont déployé beaucoup d'efforts pour me les apporter."
 siberia.0043.a:0 "Je vous remercie pour vos cadeaux. J'en ferai bon usage."
 siberia.0043.b:0 "Peut-être pouvons-nous vendre ces fourrures pour un joli profit."
 siberia.0043.c:0 "Je n'ai nul besoin de ces cadeaux. Hors de ma vue, vous dis-je !"
 siberia.0044.t:0 "Monticule de Bois"
 siberia.0044.desc:0 "Alors que je me trouvais dans la nature aujourd'hui, je suis tombé sur ce qui semblait être les restes de bois de renne sur un petit monticule, pas plus grand qu'un enfant. Je me suis rapidement rendu compte qu'il s'agissait sans doute de l'endroit où quelqu'un avait été enterré, car il est de tradition dans ces régions de placer des bois de rennes sur l'endroit où l'on a enterré quelqu'un. Je regarde autour de moi et je ne vois pas de peaux ou de sabots de rennes accrochés aux arbres, une autre pratique funéraire traditionnelle dans la région. J'en conclus que la personne qui a été enterrée ici doit être décédée depuis longtemps."
 siberia.0044.a:0 "Faites quelques prières pour la personne qui est enterrée ici."
 siberia.0044.b:0 "Réfléchir à ceux qui nous ont précédés."
 siberia.0045.t:0 "Boulettes Congelées"
 siberia.0045.desc:0 "Aujourd'hui, j'étais en voyage dans les froides contrées sauvages de mon royaume. Pendant que mes compagnons et moi nous reposons pour le déjeuner, nous sortons nos sacs de boulettes, remplis de viande hachée et de champignons. Ces boulettes sont traditionnellement laissées à l'extérieur pour être congelées, ce qui permet de les conserver et d'en faire une excellente provision pour les longs voyages dans les régions froides de la taïga sibérienne. Quoi qu'il en soit, nous mettons les boulettes dans une casserole d'eau bouillante et attendons qu'elles aient fini de cuire."
 siberia.0045.a:0 "Un plat délicieux, malgré sa simplicité."
 siberia.0046.t:0 "Poisson rasé"
 siberia.0046.desc:0 "Aujourd'hui, j'ai des invités et nous mangeons du poisson effiloché, un plat traditionnellement populaire en Sibérie. Il s'agit de congeler du poisson et de le « râper » en fines lamelles de chair. Le poisson est ensuite consommé frais et cru, avec un peu de sel et de poivre, le cas échéant."
 siberia.0046.a:0 "Il se marie aussi très bien avec l'alcool !"
 siberia.0047.t:0 "Pierres à rennes"
 siberia.0047.desc:0 "Des habitants ont récemment localisé une autre pierre de renne dans mes territoires en Sibérie. Il s'agit de grandes dalles de granit ou de pierre verte, souvent orientées vers l'est, sur lesquelles sont gravées diverses images, allant de visages humains à des oiseaux, des tigres et des motifs géométriques, mais les plus courantes sont des représentations stylisées de rennes. Nombreux sont ceux qui pensent que ces pierres ont été utilisées par les habitants de la région il y a de nombreuses générations. En tout état de cause, nous pourrions réutiliser ces sites anciens si nous le souhaitions, même si les pierres sont trop grandes pour être déplacées habituellement."
 siberia.0047.a:0 "Laissons les pierres tranquilles - il vaut mieux ne pas déranger les anciens."
 siberia.0047.b:0 "Utilisez-le pour les sépultures des habitants les plus importants de la région."
 siberia.0047.c:0 "L'entretenir pour les sacrifices et autres cérémonies chamaniques."
 siberia.0048.t:0 "Graisse animale sibérienne"
 siberia.0048.desc:0 "Nous avons récemment reçu un cadeau de graisse de renne et d'élan de la part d'un groupe de locaux. C'est un produit considéré comme précieux ici dans le nord sibérien, et il peut être utilisé pour cuisiner une variété de plats."
 siberia.0048.a:0 "Cela semble délicieux."
 siberia.0049.t:0 "Thé d'Épilobe"
 siberia.0049.desc:0 "Dans les régions sibériennes, il est traditionnel de boire une tisane à base d'épilobe. On dit qu'elle aide à renforcer la constitution et le corps. Dernièrement, j'ai bu pas mal de cette tisane d'épilobe."
 siberia.0049.a:0 "J'espère que ce sera bon pour moi."
 siberia.0050.t:0 "Copeaux de bouleau"
 siberia.0050.desc:0 "Dans certaines parties de la Sibérie, les femmes récoltent souvent de jeunes pousses de bouleau et en tirent de nombreux sacs de fins copeaux. Ces copeaux peuvent être utilisés pour se nettoyer les mains et d'autres surfaces afin de maintenir l'hygiène. Les servantes de ma maisonnée ont récemment acquis une grande quantité de ces copeaux de bouleau."
 siberia.0050.a:0 "Bien, voilà une bonne nouvelle."
 siberia.0051.t:0 "Course de traîneaux à rennes"
 siberia.0051.desc:0 "Puisque les peuples de Sibérie élèvent et entretiennent des troupeaux de rennes depuis de nombreuses générations, et les utilisent pour tirer leurs traîneaux, il est courant que des courses de traîneaux à rennes aient lieu parmi les habitants. Aujourd'hui, une telle course se tient dans le village voisin, et j'ai l'occasion d'aller y assister."
 siberia.0051.a:0 "Voilà ce que j'appelle une course de traîneaux à rennes !"
 siberia.0051.b:0 "Je préférerais me détendre chez moi aujourd'hui."
