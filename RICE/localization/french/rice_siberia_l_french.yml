 siberia.0001.t:0 "Le vagabond de Sibérie"
 siberia.0001.desc:0 "Un voyageur nommé [scope_RICE_siberian.GetTitledFirstName] est arrivé des froides terres septentrionales des peuples [scope_RICE_siberian.GetCulture.GetCollectiveNoun|l] à ma cour pour offrir ses services."
 siberia.0001.desc.evenk:0 "Les Evenks sont un groupe de nombreuses tribus différentes qui vivent entre le lac Baïkal et le fleuve Amour, un mélange de pasteurs et de chasseurs-cueilleurs. Si de nombreux peuples sibériens ont domestiqué le renne, aucun n'a aussi bien réussi que les Evenks dans ce domaine."
 siberia.0001.desc.nivkh:0 "Les Nivkhs sont un ensemble de tribus vivant le long des côtes de Mandchourie et de Sakhaline. Peuple généralement pacifique et hospitalier, ils paient occasionnellement tribut à leurs voisins méridionaux plus puissants, mais vivent autrement principalement en autarcie."
 siberia.0001.desc.yakut:0 "Les Yakoutes sont des tribus pastorales turques qui, contrairement à leurs autres cousins turcs, ont migré vers le nord en Sibérie au fil des siècles. Bien qu'ils conservent la sagesse ancestrale du sud plus chaud, ils ont également appris à maîtriser les compétences nécessaires pour prospérer dans le nord gelé."
 siberia.0001.desc.yeniseian:0 "Les Yénisséens, qui vivent principalement le long de la rivière Yenisei, ont survécu aux conditions difficiles de la Sibérie pendant des générations. De temps à autre, les tribus yénisséennes ont été impliquées dans les affaires de leurs voisins nomades plus méridionaux."
 siberia.0001.desc.yukaghir:0 "Les Youkaghirs sont les anciennes tribus du nord de la Sibérie, qui vivaient autrefois au sud du lac Baïkal, mais qui, depuis des siècles, ont été repoussées vers l'est et le nord par d'autres peuples. Ils mènent une vie nomade, parcourant les régions subarctiques et arctiques inhospitalières à la recherche de nourriture et d'un abri."
 siberia.0001.a:0 "[scope_RICE_siberian.GetTitledFirstName] est [scope_RICE_siberian.GetHerHim] bienvenu[scope_RICE_siberian.Custom('FR_E')] à notre cour !"
 siberia.0001.b:0 "Bien que j'apprécie l'offre, je n'ai pas besoin de son aide pour le moment."
 siberia.0001.tooltip:0 "Si ce [siberian_character|El] rejoint votre cour, il y a une chance qu'il ou elle transmette ses diverses compétences - qu'il ou elle a apprises en survivant dans les terres hivernales de Sibérie - à vos courtisans ou même à vous ! Il ou elle pourrait également vous aider à établir un troupeau de rennes sur votre territoire."
 siberia.0001.courtier_effect.1:0 "[scope_RICE_siberian.GetTitledFirstName], en tant que [siberian_courtier|El], pourrait transmettre diverses compétences qu'[scope_RICE_siberian.GetSheHe] a acquises en vivant dans les terres hivernales de Sibérie à vous ou à vos courtisans."
 siberia.0001.courtier_effect.2:0 "[scope_RICE_siberian.GetTitledFirstName], en tant que [siberian_courtier|El], pourrait également vous aider à mieux développer d'importants troupeaux de rennes sur votre territoire si vous remplissez les conditions requises."
 siberia.0002.t:0 "xxxxx"
 siberia.0002.desc:0 "xxxxx"
 siberia.0002.a:0 "xxxxx"
 siberia.0003.t:0 "Leçons de traditions sibériennes"
 siberia.0003.desc:0 "[scope_RICE_siberian_teacher.GetTitledFirstName] a passé beaucoup de temps à m'enseigner les méthodes traditionnelles utilisées par ses ancêtres [scope_RICE_siberian_teacher.GetCulture.GetCollectiveNoun|l] pour"
 siberia.0003.desc.hunting:0 "traquer, capturer et tuer des animaux dans les étendues sauvages et glaciales de la Sibérie. Si ces méthodes sont principalement utilisées dans le cadre de la chasse, elles ont également d'autres applications, telles que la traque des troupes ennemies dans la nature ou la capacité à survivre seul dans la nature en cas de besoin."
 siberia.0003.desc.gathering:0 "Les hommes et les femmes qui vivent en Sibérie doivent cueillir et rechercher de la nourriture et des produits de première nécessité dans le froid impitoyable de ce pays. Savoir quelles baies ou quels champignons sont comestibles et non toxiques, être capable d'identifier les sources d'eau et les abris, voilà des compétences importantes qui peuvent sauver la vie."
 siberia.0003.desc.music:0 "communier avec le monde des esprits et mieux comprendre le cosmos et le monde grâce à la musique et au chant. Les légendes et les traditions du nord de la Sibérie peuvent nous en apprendre beaucoup sur la nature de la terre et les sociétés de cette vaste région."
 siberia.0003.desc.evenk:0 "d'élever leurs troupeaux de rennes. La maîtrise de la domestication du renne par les Evenki dépasse celle des autres peuples du Grand Nord, et ces informations sont utiles non seulement pour l'entretien des troupeaux de rennes en général, mais aussi pour d'autres questions telles que l'utilisation des terres et l'élevage d'autres animaux."
 siberia.0003.desc.nivkh:0 "pêchent et cuisinent le poisson des rivières froides et des côtes de Sibérie. Le poisson est un élément essentiel du régime alimentaire des Nivkh, et ces derniers, réputés pour leur hospitalité, offrent souvent aux autres - même aux étrangers - de grandes quantités de poisson. Ces leçons ne concernent donc pas seulement la pêche et la nourriture, mais aussi la générosité envers ses semblables."
 siberia.0003.desc.yakut:0 "élever des animaux tels que des chevaux, du bétail et des chiens dans les régions arctiques. À l'origine, les Yakoutes ont migré vers le nord à partir de régions méridionales plus tempérées. Au fur et à mesure de leur progression vers le nord, ils ont développé des stratégies astucieuses pour élever les animaux qu'ils avaient domestiqués afin qu'ils résistent au climat plus froid."
 siberia.0003.desc.yeniseian:0 "raconter et transmettre les histoires anciennes des peuples yénisséens. Comptant parmi les plus anciennes tribus de la région sibérienne, les Yénisséens se sont, pendant des siècles, compris eux-mêmes et l'univers à travers le folklore et les pratiques chamaniques."
 siberia.0003.desc.yukaghir:0 "parcourent le territoire à la recherche de nourriture, d'abris et de ressources. Un nomade n'erre pas au hasard : les Yukaghirs vivent en tant que nomades dans les forêts froides et les toundras du nord depuis des générations, et ils maîtrisent les techniques nécessaires pour savoir où aller et quand le faire."
 siberia.0003.desc.basic:0 "\n\nJ'ai ainsi acquis une compréhension de base de ce savoir traditionnel."
 siberia.0003.desc.master:0 "\n\nEn conséquence, je possède désormais un certain degré de maîtrise de ce savoir traditionnel."
 siberia.0003.desc.upgrade:0 "\n\nJ'ai déjà une certaine expérience en la matière et je maîtrise donc un peu ce savoir traditionnel."
 siberia.0003.a:0 "Excellent !"
