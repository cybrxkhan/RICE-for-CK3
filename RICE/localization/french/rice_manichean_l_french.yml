 manichean.0090.t:0 "Le disciple de [lin_deng.GetFirstNameNoTooltip]"
 manichean.0090.desc:0 "Plusieurs années se sont écoulées depuis que mon mentor, [lin_deng.GetFirstName], est décédé. Ses efforts pour diffuser les enseignements de la religion de la lumière et aider les autres ne seront jamais oubliés.\n\nFait intéressant, un miracle a été rapporté il n'y a pas si longtemps dans une cité [lin_deng.GetCulture.GetName] non loin d'ici : un grand incendie s'est déclaré aux portes de la ville, menaçant la vie de tous. Alors que tout espoir semblait perdu, les gens ont vu dans le ciel une figure vêtue de robes blanches, portant un éventail de fer ; il s'en servit pour éteindre les flammes. Puis il leur dit, avant de disparaître : « Je suis [lin_deng.GetFirstName] de Shangwan de Changxi. »\n\nDepuis lors, les [lin_deng.GetFaith.GetAdherentNamePlural], et même les fidèles d'autres cultes comme les [GetReligionByKey('buddhism_religion').GetAdherentNamePlural] et les [GetReligionByKey('taoism_religion').GetAdherentNamePlural], ont commencé à prier mon maître. Il est bon qu'il ait ravivé l'intérêt pour les doctrines sans pareilles de Mani, le Bouddha de Lumière ; pourtant, bien qu'il m'ait désigné comme son successeur, j'ai beaucoup à faire si je veux poursuivre l'œuvre de mon maître..."
 manichean.0090.a:0 "Pour la Pureté, la Lumière, la Puissance et la Sagesse."
 manichean.0090.info:0 "#emphasis Contexte historique :#! L'obscur chef manichéen chinois du XIe siècle nommé Chen Pingshan était un disciple du plus célèbre Lin Deng, un sage et sorcier qui a joué un rôle majeur en assurant la survie du manichéisme en Chine pour les siècles suivants en propageant le manichéisme au Fujian, dans le sud-est de la Chine. Lin Deng est vénéré par les habitants locaux à ce jour pour ses exploits légendaires.\n\nOn ne sait pas grand-chose de Chen Pingshan, mais les manuscrits rituels manichéens hérités par son descendant moderne, Chen Peishang, ont été d'une grande aide pour les chercheurs étudiant l'histoire du manichéisme chinois."
 manichean.0091.t:0 "$RICE_historical_aspiration_fulfilled_title$"
 manichean.0091.desc:0 "Pendant longtemps, j'ai œuvré dans l'ombre de mon maître, [lin_deng.GetDynasty.GetName] [lin_deng.GetFirstName.GetName], travaillant sans relâche pour poursuivre ses efforts visant à diffuser les enseignements de Mani, le Bouddha de Lumière. Le doute et l'inquiétude étaient mes compagnons habituels, car je craignais que nous n'y parvenions pas.\n\nLa prise de conscience est venue lentement, mais un jour, il m'est apparu que même si je ne suis pas mon Maître – car qui pourrait l'égaler en puissance spirituelle, lui qui était un grand sage et sorcier ? – j'ai réalisé que j'ai moi aussi fait la différence, et honoré son nom. Grâce à mes efforts, encore plus de gens ont ouvert leur esprit aux doctrines incomparables de Mani, et nous avons bâti une communauté efficace de la Religion de la Lumière à travers de nombreux villages et hameaux.\n\nBien qu'il reste beaucoup à faire, je peux me reposer un peu plus tranquillement en sachant que mes efforts ne sont pas vains."
 manichean.0091.a:0 "Pureté, lumière, puissance et sagesse !"
 manichean.0092.t:0 "Vénérer Maître Lin"
 manichean.0092.desc:0 "Il est de notre coutume de vénérer Lin Deng, le grand maître de la religion de la Lumière, qui a protégé les faibles et pourvu aux besoins des nécessiteux, même après sa mort.\n\nAujourd'hui, nous avons préparé un généreux sacrifice pour ce grand homme, dans l'espoir qu'il nous bénisse et nous guide comme il l'a fait auparavant. Nous nous sommes ainsi dûment rassemblés pour accomplir les rites et cérémonies appropriés qui nous ont été transmis au fil des années, tandis que nous méditons sur les exploits légendaires de Maître Lin et sur les enseignements profonds qu'il nous a tous dispensés il y a bien longtemps. Par-dessus tout, nous nous souvenons du mantra de Mani, le Bouddha de Lumière : pureté, lumière, puissance et sagesse."
 manichean.0092.desc.blessing:0 "\n\nLes [ROOT.Char.GetFaith.PriestNeuterPlural] [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] m'ont approché après la cérémonie, et ont même dit qu'ils croyaient que Lin Deng nous avait accordé de nombreuses bénédictions !"
 manichean.0092.a:0 "Pureté, lumière, puissance et sagesse !"
