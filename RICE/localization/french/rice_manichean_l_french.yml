 manichean.0019.title:0 "Déclin de l'Église de Mani"
 manichean.0019.tooltip:0 "Votre soutien envers les [Glossary( 'Élus', 'ELECT_GLOSS' )] prétendument corrompus, même s'il est nominal, a rendu certains sceptiques quant à votre leadership."
 manichean.0020.t:0 "Délivrer l'Humanité de la souffrance, éliminer le Mal"
 manichean.0020.desc:0 "[ROOT.Char.GetFaith.GetName] nous enseigne à préserver les véritables doctrines, à faire de bonnes actions et à éliminer le mal. Plaignez les habitants de mon monde ! Ils affrontent bien des épreuves !\n\nComment pouvons-nous accomplir de telles choses lorsque les corrompus, les avides et les puissants continuent d'infliger la souffrance à des multitudes d'êtres ? Comment pouvons-nous réaliser des actes héroïques pour aider les opprimés, alors que notre mouvement a été persécuté par tant de gens au fil des siècles ?\n\nÀ [GetPlayer.GetCapitalLocation.GetCounty.GetTitle.GetDeJureLiege.GetNameNoTier], j'ai réussi à recruter un certain nombre de fidèles partageant les mêmes idées au sein de la religion de la lumière, ou d'autres intéressés par nos enseignements, allant des paysans et érudits aux soldats, artisans, moines et bien d'autres encore. En tant que frères et sœurs, unis dans une cause commune, ils ont juré de me suivre pour délivrer le monde de la souffrance et du mal."
 manichean.0020.a:0 "Vers un avenir meilleur !"
 manichean.0021.t:0 "La confession hebdomadaire"
 manichean.0021.desc:0 "L'un des principes les plus importants du [ROOT.Char.GetFaith.GetName] est le rituel hebdomadaire de confession, chaque lundi. Le péché retarde le salut de la Lumière – et de nos âmes – hors de ce monde matériel, le monde des Ténèbres, aussi la cérémonie de confession nous fut-elle enseignée par le Prophète Mani afin que toujours plus de Lumière puisse être libérée.\n\nCette semaine, je me suis senti inspiré à me concentrer sur cette cérémonie, plus que jamais auparavant. Les [Glossary( 'Élus', 'ELECT_GLOSS' )] se sont réunis pour entendre les confessions de moi-même et des autres [Glossary( 'Auditeurs', 'HEARER_GLOSS' )].\n\nNous récitons une liturgie et des hymnes hautement formalisés qui nous exhortent à observer nos actes récents, en distinguant le bien du mal, et à nous discipliner pour devenir meilleurs encore. Et moins nous péchons, plus nous pouvons libérer de Lumière."
 manichean.0021.a:0 "Nos âmes – et toute la Lumière – seront libérées des Ténèbres !"
