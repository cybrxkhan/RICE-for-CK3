 manichean.0070.t:0 "Un amour des livres"
 manichean.0070.desc:0 "[ROOT.Char.GetFaith.GetName] est une religion enracinée dans un profond respect pour les livres ; après tout, notre Prophète Mani a fait l'éloge de l'écrit comme moyen de consigner fidèlement ses enseignements, ce que les Prophètes précédents n'avaient pas réussi à faire avant que leurs doctrines ne soient corrompues et mal comprises par les disciples ultérieurs.\n\nMême les païens qui nous méprisent louent souvent à contrecœur la beauté de nos livres, et notre dévouement à les préserver !\n\nJ'y ai réfléchi récemment. En ai-je fait assez pour soutenir les [Glossary( 'Élus', 'ELECT_GLOSS' )] dans leurs efforts pour créer et préserver des livres ? Peut-être pas ; peut-être devrais-je consacrer davantage de ressources à de telles entreprises."
 manichean.0070.a:0 "J'en fais déjà assez en tant que [ROOT.Char.GetTitleAsNameNoTooltip]."
 manichean.0070.b:0 "Réservons davantage d'argent pour les livres, oui."
 manichean.0070.info:0 "#emphasis Contexte historique :#! Les manichéens vénéraient hautement les livres, étant donné l'importance que Mani accordait à l'écrit comme moyen de consigner ses enseignements pour les générations futures – ce que, selon Mani, les Prophètes précédents avaient manqué de faire, entraînant la corruption de leurs religions. Même les récits polémiques contemporains émanant de fidèles d'autres confessions, par ailleurs critiques envers les manichéens, reconnaissaient l'importance que ces derniers accordaient aux livres, ainsi que la beauté de leurs manuscrits. L'écrivain islamique al-Jahiz (v. 776–868/869 EC) rapporta, par exemple, que son ami Ibrahim al-Sindi lui avait un jour confié : « Je voudrais que les [Glossary( 'zindiqs', 'ZINDIQ_GLOSS' )] ne fussent point si résolus à dépenser tant d'argent pour acheter du papier blanc et propre et user d'une encre noire éclatante, et qu'ils n'attachassent point tant d'importance à la beauté de l'écriture, ni à exciter le zèle de leurs scribes ; car en vérité, nul papier que j'aie vu n'est comparable au papier de leurs livres, et nulle belle écriture à celle qui y est employée. »"
 manichean.0071.t:0 "Mani le peintre"
 manichean.0071.desc:0 "Notre Prophète Mani, qui nous a enseigné les véritables enseignements que nous, [ROOT.Char.GetFaith.GetAdherentNamePlural], suivons encore aujourd'hui, a suscité l'intérêt des non-croyants au fil des siècles. Ils ont inventé toutes sortes de récits fantaisistes à son sujet, certains flatteurs, d'autres moins.\n\nPar exemple, Mani avait un talent artistique ; l'#italic Arzhang#!, le Livre des Images, l'un de nos livres sacrés, se compose même d'images dessinées par Mani lui-même. J'ai récemment entendu dire qu'à cause de cela, les adeptes du [GetReligionByKey('zoroastrianism_religion').GetName] et de l'[GetReligionByKey('islam_religion').GetName] parlent souvent de lui comme d'un « simple » grand peintre – quelques-uns le font en louange à Mani, reconnaissant la profondeur de ses sentiments esthétiques, mais beaucoup le font de manière dénigrante. Ils insinuent que nous sommes des sots trompés par un peintre qui, prétendument, voulait intentionnellement détruire la religion [GetReligionByKey('zoroastrianism_religion').GetAdjective] avec ses images et ses discours fantaisistes."
 manichean.0071.a:0 "Ceux qui médisent de Mani ne peuvent être tolérés."
 manichean.0071.b:0 "Ils sont égarés, mais il est de notre devoir de les éduquer."
 manichean.0072.t:0 "Service de l'Âme"
 manichean.0072.desc:0 "Des [Glossary( 'Élus', 'ELECT_GLOSS' )] [ROOT.Char.GetFaith.GetAdherentNamePlural] de passage se sont arrêtés à ma cour aujourd'hui au cours de leurs voyages.\n\nPlus tôt dans la journée, ils ont prononcé de sages sermons sur les enseignements de Mani. Maintenant que le soir est venu, ils se préparent pour leur repas sacré quotidien ; après tout, comme Mani nous l'a enseigné, les [Glossary( 'Élus', 'ELECT_GLOSS' )] ne peuvent se réunir que pour un seul repas par jour, durant lequel ils doivent s'adonner à la prière et aux hymnes afin de racheter la Lumière de sa servitude dans le monde de la matière, des ténèbres.\n\nHabituellement, en tant que forme de ce que l'on appelle le service de l'âme, les [Glossary( 'Auditeurs', 'HEARER_GLOSS' )] comme moi-même doivent fournir aux [Glossary( 'Élus', 'ELECT_GLOSS' )] des aumônes de nourriture végétarienne, en particulier des concombres et des melons, étant donné que ces aliments ont la plus haute concentration de Lumière pouvant être libérée."
 manichean.0072.a:0 "Fournir aux élus de la nourriture végétarienne pour leur repas."
 manichean.0072.b:0 "Faire de nombreuses aumônes de nourriture végétarienne aux élus – libérer la Lumière !"
 manichean.0072.c:0 "Pourquoi les élus devraient-ils profiter gratuitement d'une nourriture qui m'appartient ?"
 manichean.0073.t:0 "Par leurs rots"
 manichean.0073.desc:0 "Il n'est pas surprenant que [courtier.GetTitledFirstName], qui suit la religion [courtier.GetFaith.GetName], ne soit pas toujours d'accord avec les pratiques et coutumes spirituelles de [ROOT.Char.GetFaith.GetName].\n\nPar exemple, pas plus tard qu'aujourd'hui, un groupe d'[Glossary( 'Élus', 'ELECT_GLOSS' )] [ROOT.Char.GetFaith.GetAdherentNamePlural] est venu nous rendre visite et prêcher les sages enseignements de notre prophète Mani. Ensuite, ils ont pris leur repas rituel de nourriture végétarienne le soir, empli de prières, afin de libérer la Lumière contenue dans cette nourriture, Lumière qui autrement demeure prisonnière dans le monde de la matière.\n\nAprès que les élus eurent terminé leur repas, j'ai entendu [courtier.GetFirstNameNoTooltip] remarquer avec sarcasme : « Ces [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] prétendent purifier le monde par leurs rots ! »"
 manichean.0073.a:0 "Vous ne dénigrerez pas les élus !"
 manichean.0073.b:0 "Je vais faire comme si je n'avais rien entendu..."
 manichean.0073.info:0 "#emphasis Contexte historique :#! Cette citation est tirée presque mot pour mot des écrits de saint Augustin d'Hippone (354 - 430 apr. J.-C.), théologien et intellectuel chrétien d'Afrique du Nord, qui fut manichéen dans sa jeunesse. Malgré son reniement ultérieur du manichéisme, il demeure une source de première main précieuse sur les pratiques et croyances manichéennes, ayant lui-même cru en la religion de Mani."
 manichean.0074.t:0 "Les marchands [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip]"
 manichean.0074.desc:0 "Au fil des siècles, de nombreux marchands de la Route de la Soie ont suivi les enseignements de Mani, la religion de la Lumière. Il n'est donc pas surprenant que les marchands [ROOT.Char.GetFaith.GetAdherentNamePlural] de mes territoires aiment utiliser les bâtiments religieux [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] comme lieux de stockage pour leurs marchandises et leurs richesses, entre deux voyages.\n\nCertains de ces marchands me demandent de les aider dans cette entreprise, en usant de mon pouvoir et de mes ressources en tant que [ROOT.Char.GetTitleAsNameNoTooltip] pour protéger ces lieux saints des voleurs et des bandits."
 manichean.0074.a:0 "Oui, je les aiderai avec plaisir."
 manichean.0074.b:0 "Nous n’avons pas les ressources pour cela."
 manichean.0074.c:0 "Je vais plutôt confisquer leurs biens !"
 manichean.0074.info:0 "#emphasis Contexte historique :#! Le manichéisme était une religion populaire parmi les marchands de la Route de la Soie, en particulier les Sogdiens et les Ouïghours, qui utilisaient fréquemment les monastères et lieux de culte manichéens comme banques et centres de stockage. Lorsque la dynastie Tang de Chine persécuta les manichéens au IXe siècle, par exemple, elle confisqua non seulement les biens et les richesses appartenant aux institutions religieuses manichéennes, mais aussi ceux appartenant aux marchands manichéens qui entreposaient ces biens et richesses dans ces lieux."
 manichean.0075.t:0 "Ajouter de l'eau à l'eau"
 manichean.0075.desc:0 "Aujourd'hui, un [Glossary( 'Élus', 'ELECT_GLOSS' )] [ROOT.Char.GetFaith.GetAdherentName] local donne un sermon sur les enseignements de Mani. Un extrait des propres écrits de Mani me semble intrigant :\n\n#italic Les écrits, la sagesse, les révélations, les paraboles et les psaumes de toutes les religions précédentes ont été rassemblés en tout lieu. Ils sont parvenus à ma religion. Ils ont ajouté à la sagesse que j'ai révélée, comme l'eau peut s'ajouter à l'eau pour devenir de nombreuses eaux. De même, les livres anciens se sont ajoutés à mes écrits, et sont devenus une grande sagesse.#!\n\nCela me rappelle pourquoi il est important de comprendre les autres fois et d'embrasser leurs enseignements comme les nôtres, afin d'enrichir les enseignements de la religion de la Lumière."
 manichean.0075.a:0 "Nous devons apprendre des autres confessions avec enthousiasme !"
 manichean.0075.b:0 "Nous pouvons tirer des enseignements d'autres religions, mais avec beaucoup de prudence."
 manichean.0076.t:0 "La splendeur de Jésus"
 manichean.0076.desc:0 "L'Église [GetReligionByKey('christianity_religion').GetAdjective] revendique Jésus-Christ comme le sien, mais nous savons que nous, [ROOT.Char.GetFaith.GetAdherentNamePlural], possédons le véritable évangile.\n\nJ'y ai réfléchi ces derniers temps, et cela me met dans une grande colère de penser à la manière dont ces insensés soi-disant disciples du Christ ignorent les doctrines de Mani, l'Apôtre du Christ, qui nous a révélé les doctrines incorrompues de Jésus la Splendeur telles qu'il nous les a réellement enseignées, et non leur forme corrompue de la religion de Jésus..."
 manichean.0076.a:0 "Je ne peux pas être trop en colère – nous devons être patients avec eux."
 manichean.0076.b:0 "Ces chrétiens insensés sont de dangereux hérétiques."
 manichean.0076.info:0 "#emphasis Contexte Historique :#! Mani, le prophète du manichéisme, affirmait que les prophètes qui l’avaient précédé, tels que Jésus, Bouddha et Zoroastre, avaient transmis les mêmes enseignements que lui. Cependant, comme ces prophètes n’avaient pas consigné leurs enseignements par écrit (contrairement à Mani), leurs disciples ultérieurs ont mal compris et mal interprété leurs enseignements originaux. Mani, en particulier, semble avoir éprouvé une grande admiration pour Jésus, ce qui se reflète dans le manichéisme lui-même ; par la suite, les manichéens ont souvent comparé Mani à Jésus, allant jusqu’à qualifier le martyre de Mani de « Passion », à l’instar de celle de Jésus. Même des sources islamiques plus tardives, telles que celles du théologien persan ‘Abd al-Jabbar (935 – 1025 de notre ère), ont noté que les manichéens affirmaient être les « véritables » disciples du Christ, détenteurs du véritable Évangile."
 manichean.0077.t:0 "Copier les textes [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip]"
 manichean.0077.desc:0 "Je rencontre aujourd'hui les [Glossary( 'Élus', 'ELECT_GLOSS' )] [ROOT.Char.GetCulture.GetCollectiveNoun|l] locaux de foi [ROOT.Char.GetFaith.GetAdjective] pour discuter des problèmes auxquels ils sont confrontés, et de la manière dont je peux les soutenir dans leur travail de diffusion des enseignements du prophète Mani, nous guider spirituellement, et libérer la Lumière du monde de la matière. La réunion fut suffisamment productive, car nous avons abordé divers problèmes et solutions.\n\nAprès les discussions, j'engage une conversation plus légère avec les élus. Le sujet dérive vers la copie et l'écriture des livres. Comme Mani nous a instruits de chérir les textes comme un moyen fiable de transmettre ses enseignements, les élus ont le devoir de copier et recopier constamment les textes.\n\n« C'est épuisant ! Mes mains sont constamment fatiguées et endolories », réfléchit avec humour l'un des élus. « Mais c'est un travail important que nous faisons, afin que la religion de la Lumière ne s'éteigne jamais. »"
 manichean.0077.a:0 "Oui, elle ne s’éteindra jamais tant que les élus seront présents."
 manichean.0077.b:0 "Je suis heureux de ne pas avoir à accomplir un travail aussi éreintant."
 manichean.0078.t:0 "Œufs et poussins"
 manichean.0078.desc:0 "J'étudie certains des anciens textes [ROOT.Char.GetFaith.GetAdherentNamePlural], qui relatent quelques-uns des débats que notre prophète Mani a eus avec d'autres philosophes et penseurs de son époque.\n\nLes paroles du prophète de la Lumière sont éclairantes, comme toujours, mais certaines d'entre elles sont… ésotériques, c'est le moins qu'on puisse dire. Une phrase en particulier me trouble : « #EMP Si un poussin meurt à l'intérieur d'un œuf, comment son âme sort-elle de l'œuf ?#! »\n\nJ'étais si perplexe que j'ai même interrogé mon [chaplain.GetCouncilTitle], [chaplain.GetTitledFirstName], à ce sujet, mais [chaplain.GetSheHe] était tout aussi déconcerté[chaplain.Custom('FR_E')] que moi."
 manichean.0078.a:0 "Mani est parfois trop profond pour que nous puissions le comprendre !"
 manichean.0078.b:0 "Je me demande si c'était une erreur de transcription d'un scribe..."
 manichean.0078.info:0 "#emphasis Contexte historique :#! Il s'agit d'une phrase authentique tirée des Kephalaia de Dublin, un manuscrit découvert en Égypte, appartenant vraisemblablement à une communauté manichéenne égyptienne de l'Antiquité tardive. Les Kephalaia sont des textes manichéens qui développent les enseignements de Mani, s'inspirant souvent d'épisodes de sa vie, et sont ainsi analogues aux [Glossary( 'hadiths', 'HADITHS_GLOSS' )] islamiques. Le contenu des Kephalaia de Dublin, rédigé en langue copte, révèle une communauté connaissant les croyances et enjeux de différentes religions, ce qui indique qu'elle évoluait dans un milieu multiculturel et multireligieux. Fait intéressant, le manuscrit original en papyrus fut gravement endommagé après des siècles d'usure, d'enfouissement, d'immersion dans un liquide, de recouvrement par de la peinture, etc., à tel point qu'il fallut attendre 2007 pour que les chercheurs puissent utiliser les technologies modernes – principalement des techniques photographiques multispectrales et assistées par ordinateur – afin de traduire minutieusement le texte. Le manuscrit est actuellement conservé à la Chester Beatty Library de Dublin, en Irlande."
 manichean.0079.t:0 "Libérer les Esclaves, Libérer la Lumière"
 manichean.0079.desc:0 "[courtier.GetTitledFirstName] m'a soumis une proposition aujourd'hui.\n\n« En tant que fidèle disciple du prophète Mani, » explique-t-[courtier.GetSheHe], « vous vous souvenez peut-être des textes [ROOT.Char.GetFaith.GetAdherentNamePlural] qui nous enjoignent de racheter la liberté des esclaves, et de les confier aux soins des [Glossary( 'Élus', 'ELECT_GLOSS' )], afin qu'ils deviennent leurs élèves et leurs serviteurs. Un[ROOT.Char.Custom('FR_E')] grand[ROOT.Char.Custom('FR_E')] [ROOT.Char.GetTitleAsNameNoTooltip] te[ROOT.Char.Custom('FR_LLle')] que vous pourrait libérer de nombreux esclaves, qui pourraient devenir de futurs [Glossary( 'Élus', 'ELECT_GLOSS' )], et rendre un grand service à notre Église, car nous pourrions libérer encore plus de Lumière. »"
 manichean.0079.a:0 "Une sage proposition ! Libérons quelques esclaves, dans ce cas."
 manichean.0079.b:0 "Je comprends, mais je n’ai pas les fonds pour cela."
 manichean.0080.t:0 "Adorateurs de démons végétariens"
 manichean.0080.desc:0 "Il y a des [ROOT.Char.GetCulture.GetCollectiveNoun|l] qui ne comprennent pas nos croyances et nous dénigrent, nous, les fidèles du [ROOT.Char.GetFaith.GetName], en nous traitant de « végétariens adorateurs de démons ». Ils prétendent que nous trompons les masses en nous faisant passer pour une secte du [GetReligionByKey('buddhism_religion').GetName], qui les entraînerait vers l'adoration d'êtres maléfiques.\n\nComment peuvent-ils nous méconnaître à ce point ? Nous souhaitons simplement adorer et libérer la Lumière, et sauver l'humanité des souffrances du monde de la matière et des ténèbres. Nous sommes les fidèles vertueux de Mani, le Bouddha de Lumière !\n\nQuelle infortune, quelle infortune ! Il n'est guère étonnant que nombre de mes compagnons [ROOT.Char.GetFaith.GetAdherentNamePlural] soient prudents en présence d'autres [ROOT.Char.GetCulture.GetCollectiveNoun|l] qui ne partagent pas nos croyances."
 manichean.0080.a:0 "En ces temps de ténèbres, nous devons en effet être prudents."
 manichean.0080.b:0 "Nous devons nous protéger et résister à nos oppresseurs."
 manichean.0080.info:0 "#emphasis Contexte historique :#! En Chine, les manichéens étaient appelés « adorateurs de démons végétariens », en particulier sous la dynastie Song, peut-être en raison de l'accent mis par les manichéens sur le végétarisme comme moyen de libérer leur âme et la Lumière. Le terme était suffisamment répandu pour être utilisé afin de désigner d'autres cultes hétérodoxes qui ne se conformaient pas aux enseignements religieux plus orthodoxes tels que ceux du bouddhisme ou du confucianisme, au point que certains chercheurs se sont demandé si certaines sectes ou groupes rebelles prétendument manichéens de cette époque étaient réellement manichéens – il est possible qu'ils aient été qualifiés d'« adorateurs de démons végétariens » afin de les discréditer."
