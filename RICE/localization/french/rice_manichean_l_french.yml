 # WIP/placeholder text for the dev diary, this will 100% be changed/removed at some point and replaced with something else
 manichean.0050.t:0 "Commander un manuscrit [ROOT.Char.GetFaith.GetAdherentNameNoTooltip]"
 manichean.0050.desc:0 "Comme nous l'a enseigné le Prophète Mani, les livres sont essentiels à la préservation de la vraie religion. Les doctrines des autres Prophètes ont été consignées et déformées après leur mort, mais Mani était sage, et il nous a exhortés à consigner ses paroles — ainsi que toutes les paroles conformes à ses enseignements — autant que possible, afin de préserver sa doctrine.\n\nJe souhaite commander un livre de paraboles et de récits [ROOT.Char.GetCulture.GetCollectiveNoun|l]. Ces histoires populaires sont un moyen puissant d'instruire les fidèles sur les enseignements du [ROOT.Char.GetFaith.GetName].\n\nJe pourrais demander à quelqu'un d'autre de s'en charger, en particulier un membre des [Glossary( 'Élus', 'ELECT_GLOSS' )]... ou je pourrais même le faire moi-même, #italic si#! j'ai assez de talent dans l'art de l'écriture. Après tout, puisque les livres sont sacrés, écrire les textes saints exposant les profondes leçons de Mani est en soi un acte d'adoration."
 manichean.0050.a:0 "Je paierai des scribes pour travailler sur ce manuscrit."
 manichean.0050.b:0 "Je peux réaliser ce manuscrit moi-même !"
 manichean.0050.tooltip:0 "Le manuscrit prendra jusqu'à un an à achever, peut-être moins."
 manichean.0051.t:0 "Le manuscrit [ROOT.Char.GetFaith.GetAdherentNameNoTooltip]"
 manichean.0051.desc.self:0 "Après de nombreux jours et semaines de labeur apparemment sans fin, j'ai terminé mon travail sur le manuscrit [ROOT.Char.GetFaith.GetAdherentName] – un mélange de styles artistiques [ROOT.Char.GetCulture.GetCollectiveNoun|l] au service des enseignements profonds de Mani, le Prophète de la Lumière.\n\nMême si le manuscrit qui en résulte n'est pas le plus beau qui soit, comme Mani nous l'a enseigné, diffuser ses enseignements sans pareil auprès des peuples du monde, par tous les moyens possibles, est en soi un acte vertueux.\n\nCe manuscrit en particulier est"
 manichean.0051.desc.other:0 "Après de nombreux jours et semaines de dur labeur, les scribes que j'ai engagés pour travailler sur le manuscrit [ROOT.Char.GetFaith.GetAdherentName] ont achevé leur ouvrage – un mélange de styles artistiques [ROOT.Char.GetCulture.GetCollectiveNoun|l] au service des enseignements profonds de Mani, le Prophète de la Lumière.\n\nComme tous les manuscrits [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip], sa beauté témoigne du talent de nos érudits, de la beauté de nos artisans et de la vérité de nos croyances.\n\nCe manuscrit en particulier est"
 manichean.0051.desc:0 "l'un des #bold Sept Traités#!, les importantes écritures canoniques de [ROOT.Char.GetFaith.GetNameNoTooltip]. Ces traités contiennent les sages enseignements qui guideront l'Église de Mani jusqu'à la fin des temps."
 manichean.0051.a:0 "Puisse ce manuscrit contribuer à répandre les enseignements de Mani."
 manichean.0052.desc:0 "le #bold Shabuhragan#!, un résumé des enseignements de Mani qu’il a présenté au Shahanshah sassanide, Shapur Ier. C’est un excellent texte pour introduire ou rappeler les préceptes importants de notre foi."
 manichean.0053.desc:0 "l'#bold Arzhang#!, ou Livre des Images – recopier les images dessinées par Mani lui-même peut s'avérer plus difficile que de transcrire ses paroles, mais c'est une tâche nécessaire si nous voulons diffuser ses enseignements aux masses illettrées !"
 manichean.0054.desc:0 "une collection de #bold Kephalaia#!, des textes qui exposent les enseignements de Mani, souvent en s’appuyant sur des exemples tirés de la vie de Mani. Ces récits ne se contentent pas d’enseigner nos croyances, mais ont aussi de la valeur en tant qu’histoires et œuvres littéraires."
 manichean.0055.desc:0 "un #bold Livre de Cantiques#!, contenant des hymnes à chanter lors de diverses cérémonies, qu’elles soient religieuses, politiques ou plus ordinaires. Leur présence constante dans nos rituels quotidiens nous aide à nous souvenir des enseignements de Mani."
 manichean.0056.desc:0 "un #bold Texte Confessionnel#!, qui nous guide à travers le processus de confession de nos péchés, une pratique importante dans notre religion. Comme Mani nous l'a enseigné, c'est un moyen important d'aider à libérer la Lumière."
 manichean.0057.desc:0 "diverses #bold Paraboles et Contes#! [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip|l], racontés à travers le prisme des enseignements de Mani. Puissions-nous, grâce à ces récits divertissants, mieux comprendre ce que Mani nous a enseigné."
 manichean.0058.desc:0 "une copie modifiée d'une sainte écriture #bold [other_faith.GetAdjective]#!. Mani ne nous décourageait pas d'étudier les autres fois ; en fait, il nous encourageait à trouver sa vérité cachée dans les textes des autres religions, et à les réinterpréter correctement."
 manichean.0059.t:0 "Manuscrit décommissionné"
 manichean.0059.desc:0 "Il y a quelque temps, j'ai commandé un manuscrit dans le but de diffuser les enseignements du prétendu prophète Mani.\n\nJe crois désormais en [ROOT.Char.GetFaith.GetName], et non aux fausses doctrines de la soi-disant religion de la Lumière. C'est pourquoi je me suis assuré d'arrêter la production de ce manuscrit."
 manichean.0059.a:0 "J'ai trouvé une nouvelle voie religieuse, meilleure."
