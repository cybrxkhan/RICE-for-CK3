 # Legends
 RICE_manichean_reviver_legend_name:"Émanation de Mani"
 RICE_manichean_reviver_legend_desc:"Lorsque les fidèles de Mani – le Prophète final, l'Apôtre de Jésus-Christ, le Bouddha de Lumière – avaient perdu tout espoir face aux forces de [faith.DevilName], dont les sbires les persécutaient à travers le monde, [reviver.GetTitledFirstName] mena les croyants à reconquérir la [GetGeographicalRegion('world_mesopotamia').GetName], le foyer sacré de Mani, et à y réintroduire ses enseignements."
 RICE_manichean_reviver_legend_chapter_opening_new_title:"Il y eut des jours sombres, où [ROOT.Legend.GetProperty( 'faith' ).Faith.DevilName] semblait avoir vaincu les fidèles disciples de Mani à chaque tournant. L'oppression et la profanation de l'Église étaient monnaie courante, et même de nombreux membres de l'Église avaient sombré dans le péché et le désespoir."
 RICE_manichean_reviver_legend_chapter_motivation_new_title:"Mais tout n'avait pas joué contre l'Église, loué soit Mani ! L'Église avait perdu son chemin, mais avait gagné un nouveau champion en la personne [ROOT.Legend.GetProtagonist.Custom('FR_DuDela')] grand[ROOT.Legend.GetProtagonist.Custom('FR_E')] et puissant[ROOT.Legend.GetProtagonist.Custom('FR_E')] [ROOT.Legend.GetProtagonist.GetTitledFirstNameNoTooltip]. [ROOT.Legend.GetProtagonist.GetSheHe|U] avait vu à quel point la communauté manichéenne était devenue démunie et appauvrie, combien elle semblait faible face aux Ténèbres. Pourtant, [ROOT.Legend.GetProtagonist.GetSheHe] savait qu'ils devaient se battre avec acharnement pour défendre et libérer la Lumière."
 RICE_manichean_reviver_legend_chapter_famous_deed_new_title:"Rassemblant une force d'Élus et d'Auditeurs vertueux, [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] déferla sur les plaines fertiles du Croissant Fertile, la patrie de Mani, et repoussa les forces pécheresses et féroces de [ROOT.Legend.GetProperty( 'faith' ).Faith.DevilName]. Les fidèles de Mani reprirent le pouvoir entre le Tigre et l'Euphrate et, sous la direction de [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip], commencèrent à y reconstruire l'Église."
 RICE_manichean_reviver_legend_chapter_extra_deed_new_title:"Il est heureux que même l'#italic Archegos#!, chef de l'Église manichéenne, ait pu retourner sur son ancien siège à Babylone sous les auspices de [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]."
 RICE_manichean_reviver_legend_chapter_conclusion_new_title:"Le retour de l'Église de Mani dans le Croissant Fertile et son renouveau qui s'ensuit tiennent du miracle. Pourtant, un tel miracle n'a été rendu possible que grâce aux actes héroïques des Élus et des Auditeurs qui, sous la direction et l'autorité de [ROOT.Legend.GetProtagonist.GetTitledFirstNameNoTooltip], ont lutté avec acharnement contre le mal de [ROOT.Legend.GetProperty( 'faith' ).Faith.DevilName]. Il ne fait aucun doute que dans les siècles à venir, l'Église manichéenne continuera d'honorer son nom, et de [ROOT.Legend.GetProtagonist.GetHerHim] considérer comme l'égal[ROOT.Legend.GetProtagonist.Custom('FR_E')] des Apôtres de Mani en raison de ses efforts pour sauver et propager la Religion de la Lumière."
 
 # CB/Casus Belli

 # Interactions
 
 # Artifacts
 RICE_manichean_mani_sealstone_name:0 "Sceau de Mani"
 RICE_manichean_mani_sealstone_desc:0 "Il y a bien longtemps, on disait que le Prophète Mani, fondateur de l'Église [manichean_faith.GetAdjective], possédait un sceau en pierre de cristal le représentant flanqué de deux disciples. Des générations de fidèles [manichean_faith.GetAdherentNamePluralNoTooltip] le conservèrent comme relique après sa passion et son [Glossary( 'parinirvana', 'MANICHEAN_PARINIRVANA_GLOSS' )]. Il fut perdu à un moment donné, au cours des diverses persécutions subies par l'Église de Mani.\n\nLe sceau fut redécouvert de nombreuses années plus tard, grâce aux efforts de [discoverer.GetTitledFirstName]. Malgré son âge, il a survécu presque intact, et l'inscription en [syriac_culture.GetCollectiveNoun|l] qui y figure est encore en grande partie lisible : « Mani, Apôtre de Jésus-Christ »." # Many [manichean_faith.GetAdherentNamePluralNoTooltip] hope that this relic, once touched by their beloved teacher, will help them in their efforts to free the light from the evil world of the [manichean_faith.DevilName]!
 RICE_manichean_manuscript_creator_self_name:0 "[ROOT.Char.GetTitledFirstName]"
 RICE_manichean_manuscript_creator_others_name:0 "scribes parrainés par [ROOT.Char.GetTitledFirstName]"
 RICE_manichean_manuscript_opening_desc:0 "Rédigé en [ROOT.Char.GetCulture.GetLanguage.GetName] par [GetPlayer.Custom('RICE_manichean_manuscript_creator')], ce texte est un exemple de la qualité et de la beauté renommées des manuscrits [ROOT.Char.GetFaith.GetAdherentNamePlural]."
 RICE_random_manichean_canonical_scripture_01:0 "l'#bold Évangile de Mani#!, ou #bold L'Évangile Vivant#!, le texte le plus important de [ROOT.Char.GetFaith.GetNameNoTooltip], car il est l'unique et véritable évangile, corrompu par des malentendus, qui raconte la véritable histoire du Messie, Jésus la Splendeur."
 RICE_random_manichean_canonical_scripture_02:0 "le #bold Trésor de la Vie#!, qui contient les enseignements du Prophète Mani concernant la place de l'humanité dans l'univers, et quelles parties de nous proviennent du royaume de la Lumière, et lesquelles proviennent du royaume des Ténèbres."
 RICE_random_manichean_canonical_scripture_03:0 "#bold Les Épîtres#!, un recueil de lettres entre le prophète Mani et ses disciples directs. Elles exposent les doctrines [ROOT.Char.GetFaith.GetAdjectiveNoTooltip]s et expliquent pourquoi ces doctrines sont correctes."
 RICE_random_manichean_canonical_scripture_04:0 "les #bold Psaumes et Prières#!, un recueil de poèmes écrits par le Prophète Mani et ses disciples directs."
 RICE_random_manichean_canonical_scripture_05:0 "la #bold Pragmateia#!, un texte qui retrace l'histoire de l'humanité du point de vue [ROOT.Char.GetFaith.GetAdherentName]."
 RICE_random_manichean_canonical_scripture_06:0 "le #bold Livre des Géants#!, qui développe l'histoire abrahamique de la Genèse. Selon les enseignements [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip], avant le Déluge, les démons avaient établi un règne de terreur sur l'humanité et engendré une race de géants avec des femmes humaines, avant que les forces de la Lumière ne les vainquent et ne les emprisonnent."
 RICE_random_manichean_canonical_scripture_07:0 "le #bold Livre des Mystères#!, qui aborde divers sujets sur la nature de l'âme, critique les enseignements des faux Prophètes et défend la vérité de Mani, le dernier Prophète."
 RICE_manichean_artifact_seven_treatises_name:0 "Écritures canoniques [ROOT.Char.GetFaith.GetAdjectiveNoTooltip]s"
 RICE_manichean_artifact_seven_treatises_desc:0 "$RICE_manichean_manuscript_opening_desc$ [ROOT.Char.GetFaith.GetName] compte sept traités ou textes canoniques.\n\nCe manuscrit est, en particulier, [GetPlayer.Custom('RICE_random_manichean_canonical_scripture')]\n\n#EMP Équiper cet [artifact|El] réduit le coût en [gold_i|El] [gold|El] de la [decision|El] #V $RICE_manichean_confession_decision$#! et de l'[activity|El] [GetActivityType( 'activity_RICE_manichean_bema_festival' ).GetName].#!"
 RICE_manichean_artifact_shabuhragan_name:0 "Le Shabuhragan"
 RICE_manichean_artifact_shabuhragan_desc:0 "$RICE_manichean_manuscript_opening_desc$ Ce manuscrit est une copie du #bold Shabuhragan#!, écrit par Mani lui-même pour le Shahanshah sassanide Shapur Ier, afin de fournir un résumé de ses enseignements. C'est un excellent texte pour introduire ou rappeler les préceptes importants de [ROOT.Char.GetFaith.GetNameNoTooltip].\n\n#EMP Équiper cet [artifact|El] permet à son propriétaire de gagner du [prestige_i|El] [prestige|El] supplémentaire grâce à l'[activity|El] [GetActivityType( 'activity_RICE_manichean_bema_festival' ).GetName].#!"
 RICE_manichean_artifact_arzhang_name:0 "L'Arzhang"
 RICE_manichean_artifact_arzhang_desc:0 "$RICE_manichean_manuscript_opening_desc$ Ce manuscrit est une copie de l'#bold Arzhang#!, ou Livre des Images, qui se compose principalement d'illustrations réalisées par Mani lui-même, compte tenu de son talent artistique. Mani savait que de telles images aideraient à diffuser ses enseignements auprès des masses qui ne pouvaient lire ses autres écritures.\n\n#EMP Équiper cet [artifact|El] permet à son propriétaire d'obtenir un bonus d'[opinion|El] [opinion_i|El] de la part de chaque participant lorsqu'il organise l'[activity|El] [GetActivityType( 'activity_RICE_manichean_bema_festival' ).GetName].#!"
 RICE_manichean_artifact_kephalaia_name:0 "Les Kephalaia"
 RICE_manichean_artifact_kephalaia_desc:0 "$RICE_manichean_manuscript_opening_desc$ Ce manuscrit est une collection de #bold Kephalaia#!, des textes qui exposent les enseignements de Mani, souvent en s'appuyant sur des exemples tirés de la vie de Mani. Ces récits ne se contentent pas d'enseigner les croyances [ROOT.Char.GetFaith.GetAdjectiveNoTooltip]s, mais possèdent également une valeur en tant qu'histoires et œuvres littéraires.\n\n#EMP Équiper cet [artifact|El] permet à son propriétaire de gagner davantage de [piety_i|El] [piety|El] lors de l'[activity|El] [GetActivityType( 'activity_RICE_manichean_bema_festival' ).GetName].#!"
 RICE_manichean_artifact_hymn_book_name:0 "Livre d'hymnes [ROOT.Char.GetFaith.GetAdjectiveNoTooltip]"
 RICE_manichean_artifact_hymn_book_desc:0 "$RICE_manichean_manuscript_opening_desc$ Ce manuscrit contient des hymnes [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] à chanter lors de diverses cérémonies, qu'elles soient religieuses, politiques ou plus banales. Leur présence constante dans les rituels quotidiens aide à rappeler aux [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] les enseignements de Mani.\n\n#EMP Équiper cet [artifact|El] permet à son propriétaire de gagner un supplément de [legitimacy_i|El] [legitimacy|El] lorsqu'il organise l'[activity|El] [GetActivityType( 'activity_RICE_manichean_bema_festival' ).GetName].#!"
 RICE_manichean_artifact_confessional_texts_name:0 "Texte confessionnel [ROOT.Char.GetFaith.GetAdherentNameNoTooltip]"
 RICE_manichean_artifact_confessional_texts_desc:0 "$RICE_manichean_manuscript_opening_desc$ Ce manuscrit contient des textes confessionnels [ROOT.Char.GetFaith.GetAdherentNameNoTooltip]. Ils guident les [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] à travers le processus de confession de leurs péchés, une pratique importante pour les adeptes des enseignements de Mani, car elle est considérée comme un moyen essentiel de contribuer à libérer la Lumière.\n\n#EMP Équiper cet [artifact|El] permet à son propriétaire de perdre davantage de [stress|El] ([stress_loss_i|El]) grâce à la [decision|El] #V $RICE_manichean_confession_decision$#! et à l'[activity|El] [GetActivityType( 'activity_RICE_manichean_bema_festival' ).GetName].#!"
 RICE_manichean_artifact_parables_and_tales_name:0 "Paraboles et Contes [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip]"
 RICE_manichean_artifact_parables_and_tales_desc:0 "$RICE_manichean_manuscript_opening_desc$ Ce manuscrit contient diverses #bold Paraboles et Contes#! [ROOT.Char.GetCulture.GetAdherentNamePluralNoTooltip], racontés du point de vue des enseignements de Mani. L'intention de la réinterprétation de ces histoires divertissantes est de guider aussi bien les fidèles déjà dévoués à Mani que ceux qui sont réceptifs à ses enseignements, vers une meilleure compréhension de ses doctrines.\n\n#EMP Équiper cet [artifact|El] permet à son propriétaire de gagner de l'[lifestyle_experience|El] supplémentaire lors de l'[activity|El] [GetActivityType( 'activity_RICE_manichean_bema_festival' ).GetName].#!"
 RICE_manichean_artifact_other_religions_texts_name:0 "Interprétation [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] des Écritures [other_faith.GetAdjectiveNoTooltip]"
 RICE_manichean_artifact_other_religions_texts_desc:0 "$RICE_manichean_manuscript_opening_desc$ Ce manuscrit est une copie modifiée d'une écriture sainte #bold [other_faith.GetAdjective]#!. Le Prophète Mani ne décourageait pas ses fidèles d'étudier les autres fois ; au contraire, il les encourageait à trouver sa vérité cachée dans les textes des autres religions, et à les réinterpréter « correctement » pour mieux convenir à ses enseignements.\n\n#EMP Équiper cet [artifact|El] réduit le coût en [gold_i|El] [gold|El] de la [decision|El] Commander un manuscrit pour les [faiths|El] qui suivent les enseignements de Mani.#!"
 
 # Buildings
 
 # Traits
 trait_RICE_disciple_of_lin_deng_info:0 "\n\n#emphasis L'[trait_level_track_xp|El] pour ce [trait|El] est gagnée en complétant diverses [decisions|El] et [activities|El] liées aux [faiths|El] avec la [doctrine|El] $rice_light_purification_doctrine$ #!"
 trait_RICE_disciple_of_lin_deng:0 "Disciple de Lin Deng"
 trait_RICE_disciple_of_lin_deng_desc:0 "Ce personnage est un maître rituel descendant d'un disciple de Lin Deng, un légendaire chef, sage et sorcier manichéen du sud-est de la Chine qui est, encore aujourd'hui, vénéré par les habitants pour ses actes héroïques. Ce personnage est dévoué à perpétuer l'héritage de Lin Deng et à poursuivre cette lignée spirituelle, quelle que soit sa foi.\n\n#weak Ce [trait|El] est transmis aux [children|El] de ce personnage lorsqu'ils deviennent [adults|El].#!"
 trait_RICE_disciple_of_lin_deng_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] est un maître rituel descendant d'un disciple de Lin Deng, un légendaire chef, sage et sorcier manichéen du sud-est de la Chine, encore aujourd'hui vénéré par les habitants pour ses actes héroïques. [ROOT.GetCharacter.GetFirstNameNoTooltip] se consacre à perpétuer l'héritage de Lin Deng et à poursuivre cette lignée spirituelle, quelle que soit sa foi.\n\n#weak Ce [trait|El] est hérité par les [children|El] de ce personnage lorsqu'ils deviennent [adults|El].#!"
 trait_RICE_disciple_of_lin_deng_2:0 "Disciple Vénérable"
 trait_RICE_disciple_of_lin_deng_2_desc:0 "$trait_RICE_disciple_of_lin_deng_desc$"
 trait_RICE_disciple_of_lin_deng_2_character_desc:0 "$trait_RICE_disciple_of_lin_deng_character_desc$"
 trait_RICE_disciple_of_lin_deng_3:0 "Disciple légendaire"
 trait_RICE_disciple_of_lin_deng_3_desc:0 "$trait_RICE_disciple_of_lin_deng_desc$"
 trait_RICE_disciple_of_lin_deng_3_character_desc:0 "$trait_RICE_disciple_of_lin_deng_character_desc$"
 trait_track_RICE_disciple_of_lin_deng:0 "$trait_RICE_disciple_of_lin_deng$"
 trait_track_RICE_disciple_of_lin_deng_desc:0 "#italic La flamme sacrée ardente brûle mon corps flétri. La vie est lamentable, mais la mort est également douloureuse. Ce n'est qu'avec la lumière que nous pouvons faire le bien et exterminer le mal.#!" # 熊熊聖火，焚我殘軀。生亦何哀，死亦何苦？為善除惡，惟光明故。
 
 # Aspirations
 RICE_manichean_aspiration_chen_pingshan_desc:"\n\n#bold [historical_aspiration_main_objectives|E]#!\n$EFFECT_LIST_BULLET$Atteindre #V 100#! d'[trait_level_track_xp|El] du [trait|El] [GetTrait('RICE_disciple_of_lin_deng').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$Avoir au moins un enfant [adult|El] avec le [trait|El] [GetTrait('RICE_disciple_of_lin_deng').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$Avoir un [piety_level|El] de [GetModifier( 'piety_level_3' ).GetNameWithTooltip|L] ou plus\n$EFFECT_LIST_BULLET$Prendre la [decision|El] pour #V $RICE_manichean_lin_deng_decision$#! au moins une fois\n$EFFECT_LIST_BULLET$Rester dans une [faith|El] avec la [doctrine|El] $rice_light_purification_doctrine_name$\n\n#bold Récompenses#!\n$EFFECT_LIST_BULLET$Gain du [modifier|El] [GetModifier('RICE_manichean_lin_deng_spiritual_lineage_modifier').GetNameWithTooltip] pour votre [dynasty|El]\n$EFFECT_LIST_BULLET$Gain d'un [perk|El] du [learning_lifestyle|El]\n$EFFECT_LIST_BULLET$Gain de @piety_icon! #V [EmptyScope.ScriptValue('RICE_aspiration_large_resource_bonus')]#! de [piety|El]\n\n#bold [historical_aspiration_bonus_objectives|E]#!\n$EFFECT_LIST_BULLET$Avoir un [prestige_level|El] de [GetModifier( 'prestige_level_3' ).GetNameWithTooltip|L] ou plus (Récompense : Gain d'un [perk|El] du [diplomacy_lifestyle|El])\n$EFFECT_LIST_BULLET$Prendre la [decision|El] de #V $RICE_manichean_recruit_ming_cultists$#! au moins une fois (Récompense : Gain d'un [perk|El] du [martial_lifestyle|El])"
 RICE_manichean_historical_aspiration_action_chen_pingshan:"#italic Votre défunt maître, Lin Deng, vous a beaucoup enseigné sur la doctrine insurpassée de Mani, le Bouddha de Lumière, ainsi que divers rituels religieux pour aider autrui. Avec sa disparition, il est de votre devoir de maîtriser les enseignements de votre mentor et de préserver la communauté spirituelle et la lignée spirituelle qu'il a cultivées.#!$RICE_manichean_aspiration_chen_pingshan_desc$"
 RICE_manichean_historical_aspiration_modifier_desc_chen_pingshan: "[GetModifier('RICE_manichean_aspiration_continue_lin_dengs_legacy').GetNameWithTooltip]" 
 RICE_manichean_aspiration_bokut_desc:"\n\n#bold [historical_aspiration_main_objectives|E]#!\n$EFFECT_LIST_BULLET$Être de [culture|El] $uyghur$, ou d'une [culture|El] avec le [heritage|El] $heritage_turkic_name|l$ descendant des ouïghours\n$EFFECT_LIST_BULLET$Être un [king|El] ou [emperor|El] [independent|El]\n$EFFECT_LIST_BULLET$[Concept('completely_control', 'Contrôler complètement')|E] la [region|El] du [GetGeographicalRegion('RICE_greater_qocho_region').GetName]\n$EFFECT_LIST_BULLET$Participer au [GetActivityType( 'activity_RICE_tarim_basin_bezeklik_pilgrimage' ).GetName] au moins une fois\n$EFFECT_LIST_BULLET$Avoir un [piety_level|El] de [GetModifier( 'piety_level_3' ).GetNameWithTooltip|L] ou plus\n$EFFECT_LIST_BULLET$Avoir un [prestige_level|El] de [GetModifier( 'prestige_level_3' ).GetNameWithTooltip|L] ou plus\n\n#bold Récompenses#!\n$EFFECT_LIST_BULLET$Gain de @legitimacy_icon! #V [EmptyScope.ScriptValue('medium_legitimacy_gain')]#! de [legitimacy|El]\n$EFFECT_LIST_BULLET$Recevez #V 1000#! [special_troops|El], incluant des [men_at_arms|El]\n$EFFECT_LIST_BULLET$Gain de @prestige_icon! #V [EmptyScope.ScriptValue('RICE_aspiration_large_resource_bonus')]#! de [prestige|El]\n$EFFECT_LIST_BULLET$Chaque [county|El] du [GetGeographicalRegion('RICE_greater_qocho_region').GetName] gagne @development_icon! #V [EmptyScope.ScriptValue('RICE_red_sea_al_umari_aspiration_dev_bonus')]#! de [development|El]\n\n#bold [historical_aspiration_bonus_objectives|E]#!\n$EFFECT_LIST_BULLET$Être [allied|El] à, ou avoir comme tributaire ou [vassal|El], le [ruler|El] du [GetTitleByKey('k_khotan').GetNameNoTier], ou détruire ou détenir le [title|El] (Récompense : Recevez #V 1000#! [special_troops|El] $heritage_iranian_name$ et $heritage_turkic_name$, incluant des [men_at_arms|El])\n$EFFECT_LIST_BULLET$Être [allied|El] à, ou avoir comme tributaire ou [vassal|El], le [ruler|El] du [GetTitleByKey('k_hexi').GetNameNoTier], ou détruire ou détenir le [title|El] (Récompense : Recevez #V 1000#! [special_troops|El] $heritage_chinese_name$, incluant des [men_at_arms|El])\n$EFFECT_LIST_BULLET$Prendre la [decision|El] de #V $RICE_uyghur_manichean_church_decision$#! (Récompense : @dynasty_prestige_icon! #V [EmptyScope.ScriptValue('RICE_aspiration_large_resource_bonus')]#! de [dynasty_prestige|El])"
 RICE_manichean_historical_aspiration_action_bokut:"#italic En tant que dirigeant du plus grand État croupion de l'ancien khaganat ouïghour, vous faites face à des souverains rivaux énergiques et à une Église manichéenne en déclin, mais vous nourrissez de grandes ambitions pour restaurer un tant soit peu de l'ancienne influence politique, religieuse et économique de votre peuple dans la région.#!$RICE_manichean_aspiration_bokut_desc$"
 RICE_manichean_historical_aspiration_modifier_desc_bokut: "[GetModifier('RICE_manichean_aspiration_reclaim_uyghur_power_in_qocho').GetNameWithTooltip]" 

 # Aspiration Modifiers
 RICE_manichean_aspiration_continue_lin_dengs_legacy:"[RICE_aspiration|E] : Perpétuer l'héritage de Lin Deng"
 RICE_manichean_aspiration_continue_lin_dengs_legacy_desc:"#italic Le défunt maître de Chen Pingshan, Lin Deng, lui a beaucoup enseigné sur la doctrine incomparable de Mani, le Bouddha de Lumière, ainsi que divers rituels religieux pour aider autrui. Avec la disparition de Lin Deng, Chen Pingshan a le devoir de maîtriser les enseignements de Lin Deng, et de préserver la communauté spirituelle et la lignée spirituelle que son mentor a cultivées.#!$RICE_manichean_aspiration_chen_pingshan_desc$\n\n"
 RICE_manichean_aspiration_reclaim_uyghur_power_in_qocho:"[RICE_aspiration|E] : Faire revivre la puissance ouïghoure à Qocho"
 RICE_manichean_aspiration_reclaim_uyghur_power_in_qocho_desc:"#italic En tant que dirigeant du plus grand État croupion de l'ancien Khaganat ouïghour, Bokut fait face à des souverains rivaux énergiques et à une Église manichéenne en déclin, mais il nourrit de grandes ambitions pour restaurer un semblant de l'influence politique, religieuse et économique passée de son peuple dans la région.#!$RICE_manichean_aspiration_bokut_desc$\n\n"
 
