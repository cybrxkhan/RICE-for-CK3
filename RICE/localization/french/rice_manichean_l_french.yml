 # Activities
 activity_RICE_manichean_bema_festival_host_an_a:0 "une"
 activity_RICE_manichean_bema_festival:0 "Fête de Bêma"
 activity_RICE_manichean_bema_festival_desc:0 "À la fin de l'année religieuse, les disciples de Mani, le dernier prophète, commémorent sa passion, après laquelle il entra dans le [Glossary( 'parinirvana', 'MANICHEAN_PARINIRVANA_GLOSS' )]. Durant cette Fête du Bêma, on dit que Mani lui-même vient donner l'absolution, tandis que les fidèles accomplissent des rituels pour libérer la Lumière de sa prison de Matière."
 activity_RICE_manichean_bema_festival_selection_tooltip:"Participer à une Fête de Bêma.\n\n$activity_RICE_manichean_bema_festival_context_tooltip$"
 activity_RICE_manichean_bema_festival_context_tooltip:0 "#emphasis Historical Context:#! La Fête de Bêma marquait la fin de l'année religieuse pour les manichéens et commémorait le martyre du fondateur du manichéisme, Mani. Le nom du festival « Bêma » vient du mot grec désignant une plateforme, une scène ou le siège d'un juge, car le point central de l'événement était un trône vide où l'on croyait que Mani descendait pour absoudre les fidèles de leurs péchés."
 activity_RICE_manichean_bema_festival_host_desc:"\n$BULLET_WITH_TAB$Gain de [prestige_i|E][prestige|El]\n$BULLET_WITH_TAB$Gain de [piety_i|E][piety|El]\n$BULLET_WITH_TAB$Perte de [stress_loss_i|El][stress|El]\n$BULLET_WITH_TAB$Gain de [character_modifiers|El] #P positifs#!\n$BULLET_WITH_TAB$Très rarement, perte du trait [sinful|El] ou des [traits|El] négatifs" # \n\nThe bonuses you gain depend on how many times you have taken the [decision|El] to #bold $RICE_manichean_confession_decision$#! within the last #V 10#! years.
 activity_RICE_manichean_bema_festival_guest_desc: "$activity_RICE_manichean_bema_festival_host_desc$"
 activity_RICE_manichean_bema_festival_province_desc: ""
 activity_RICE_manichean_bema_festival_destination_selection: "$activity_RICE_manichean_bema_festival_province_desc$"
 activity_RICE_manichean_bema_festival_guest_help_text: "$activity_RICE_manichean_bema_festival$"
 activity_RICE_manichean_bema_festival_predicted_cost:"Le coût de cette [activity|El] dépend des [activity_options|El] que vous sélectionnez."
 activity_RICE_manichean_bema_festival_conclusion_desc:"La [GetActivityType( 'activity_RICE_manichean_bema_festival' ).GetName] de cette année touche à sa fin, et ceux qui sont justes et sincèrement repentants ont obtenu l'absolution de leurs péchés !"
 RICE_manichean_bema_festival_fasting_length_type:"Durée du jeûne"
 RICE_manichean_bema_festival_fasting_length_type_day: "Un jour"
 RICE_manichean_bema_festival_fasting_length_type_day_desc:"$BULLET_WITH_TAB$Très faible chance de perdre des [traits|El] négatifs\n$BULLET_WITH_TAB$Chance presque inexistante de gagner un [modifier|El] négatif affectant votre [health|El]\n$BULLET_WITH_TAB$Perte d'une quantité de base de [stress_loss_i|El] #V [EmptyScope.ScriptValue('miniscule_stress_impact_loss')]#! [stress|El]\n\n#weak Une journée de jeûne suffira comme préparation de la fête de Bêma, puisque je ne suis pas membre des [Glossary( 'Élus', 'ELECT_GLOSS' )].#!"
 RICE_manichean_bema_festival_fasting_length_type_week: "Une semaine"
 RICE_manichean_bema_festival_fasting_length_type_week_desc:"$BULLET_WITH_TAB$Faible chance de perdre des [traits|El] négatifs\n$BULLET_WITH_TAB$Très faible chance de gagner un [modifier|El] négatif affectant votre [health|El]\n$BULLET_WITH_TAB$Perte d'une quantité de base de [stress_loss_i|El] #V [EmptyScope.ScriptValue('minor_stress_impact_loss')]#! [stress|El]\n\n#weak Bien que je ne sois pas membre des [Glossary( 'Élus', 'ELECT_GLOSS' )], je devrais montrer ma dévotion à la doctrine de Mani en jeûnant convenablement avant la fête de Bêma.#!"
 RICE_manichean_bema_festival_fasting_length_type_month: "Un mois"
 RICE_manichean_bema_festival_fasting_length_type_month_desc:"$BULLET_WITH_TAB$Chance décente de perdre des [traits|El] négatifs\n$BULLET_WITH_TAB$Faible chance d'obtenir un [modifier|El] négatif affectant votre [health|El]\n$BULLET_WITH_TAB$Perte d'une quantité de base de [stress_loss_i|El] #V [EmptyScope.ScriptValue('medium_stress_impact_loss')]#! [stress|El]\n\n#weak Je ne suis peut-être pas membre des [Glossary( 'Élus', 'ELECT_GLOSS' )], mais il est de mon devoir en tant qu'adepte des enseignements de Mani de faire ce que je peux pour libérer la Lumière en jeûnant beaucoup avant la fête de Bema !#!"
 RICE_manichean_bema_festival_fruit_alms_type:"Aumône de fruits"
 RICE_manichean_bema_festival_fruit_alms_type_small:"Modeste aumône de fruits"
 RICE_manichean_bema_festival_fruit_alms_type_small_desc:"$BULLET_WITH_TAB$Gain d'un montant de base de [piety_i|El] #V [EmptyScope.ScriptValue('RICE_manichean_bema_festival_base_piety_small')]#! [piety|El]\n$BULLET_WITH_TAB$Gain d'un montant de base de [prestige_i|El] #V [EmptyScope.ScriptValue('RICE_manichean_bema_festival_base_prestige_small')]#! [prestige|El]\n\n#weak J'offrirai une quantité appropriée de fruits aux [Glossary( 'Élus', 'ELECT_GLOSS' )] afin qu'ils les mangent pour libérer la lumière.#!"
 RICE_manichean_bema_festival_fruit_alms_type_medium:"Aumônes conséquentes de fruits"
 RICE_manichean_bema_festival_fruit_alms_type_medium_desc:"$BULLET_WITH_TAB$Gain d'un montant de base de [piety_i|El] #V [EmptyScope.ScriptValue('RICE_manichean_bema_festival_base_piety_medium')]#! [piety|El]\n$BULLET_WITH_TAB$Gain d'un montant de base de [prestige_i|El] #V [EmptyScope.ScriptValue('RICE_manichean_bema_festival_base_prestige_medium')]#! [prestige|El]\n\n#weak J'offrirai une quantité généreuse de fruits aux [Glossary( 'Élus', 'ELECT_GLOSS' )] afin qu'ils puissent libérer beaucoup de lumière.#!"
 RICE_manichean_bema_festival_fruit_alms_type_large:"Aumônes généreuses de fruits"
 RICE_manichean_bema_festival_fruit_alms_type_large_desc:"$BULLET_WITH_TAB$Gain d'une quantité de base de [piety_i|El] #V [EmptyScope.ScriptValue('RICE_manichean_bema_festival_base_piety_large')]#! de [piety|El]\n$BULLET_WITH_TAB$Gain d'une quantité de base de [prestige_i|El] #V [EmptyScope.ScriptValue('RICE_manichean_bema_festival_base_prestige_large')]#! de [prestige|El]\n\n#weak J'offrirai autant de fruits que possible aux [Glossary( 'Élus', 'ELECT_GLOSS' )] afin qu'ils s'en nourrissent ; ce faisant, nous libérerons une quantité innombrable de lumière.#!"
 RICE_manichean_bema_festival_ceremony_phase: "Cérémonie"
 RICE_manichean_bema_festival_ceremony_phase_desc:"Mani vient à nous et nous accorde l'absolution, tandis que nous libérons la lumière."
 RICE_manichean_bema_festival_liberation_intent_header: "Purification :"
 RICE_manichean_bema_festival_liberation_intent: "Purification"
 RICE_manichean_bema_festival_liberation_intent_desc:"Concentrez-vous sur la bonne exécution des rituels pour libérer la Lumière. Gagnez davantage de [prestige_i|El] [prestige|El] en plus du montant de base. Tous les [vassals|El] et [courtiers|El] membres du clergé de votre [faith|El] gagnent [opinion_i|El] #P +10#! d'[opinion|El] envers vous. Perdez du [stress_i|El] [stress|El] supplémentaire si vous êtes [GetTrait('diligent').GetName( GetNullCharacter )|U] ou [GetTrait('ambitious').GetName( GetNullCharacter )]."
 RICE_manichean_bema_festival_spiritual_guidance_intent_header:"Guidance spirituelle :"
 RICE_manichean_bema_festival_spiritual_guidance_intent:"Guidance spirituelle"
 RICE_manichean_bema_festival_spiritual_guidance_intent_desc:"Concentrez-vous sur l'apprentissage à travers les sermons des [Glossary( 'Élus', 'ELECT_GLOSS' )]. Gagnez de l'[experience|El] dans votre [lifestyle|El] ainsi que de la [legitimacy_i|El] [legitimacy|El]. Perdez du [stress_i|El] [stress|El] supplémentaire si vous êtes [GetTrait('patient').GetName( GetNullCharacter )|U] ou [GetTrait('content').GetName( GetNullCharacter )]."
 RICE_manichean_bema_festival_confession_intent_header: "Confession :"
 RICE_manichean_bema_festival_confession_intent: "Confession"
 RICE_manichean_bema_festival_confession_intent_desc:"Concentrez-vous sur le repentir de vos péchés. Gagnez plus de [piety_i|El] [piety|El] en plus du montant de base. Augmente les chances de perdre des [traits|El] [sinful|El] ou négatifs. Perdez du [stress_i|El] [stress|El] supplémentaire si vous êtes [GetTrait('honest').GetName( GetNullCharacter )|U] ou [GetTrait('humble').GetName( GetNullCharacter )]."
 RICE_manichean_bema_festival_completed_log_title:0 "$activity_RICE_manichean_bema_festival$ Concludes"
 RICE_manichean_bema_festival_completed_log:0 "[CHARACTER.GetShortUIName|U] a terminé sa participation à la $activity_RICE_manichean_bema_festival$ de cette année."
 TRAVEL_NAME_FOR_activity_RICE_manichean_bema_festival:0 "[Character.GetFirstNamePossessiveNoTooltip] $activity_RICE_manichean_bema_festival$"
 RICE_manichean_bema_festival_lose_sin_log_title:0 "Confession efficace"
 RICE_manichean_bema_festival_lose_sin_log:0 "[CHARACTER.GetShortUIName|U] s'est amélioré après une confession sincère à Mani."
 RICE_manichean_fast_health_malus_effect_log_title:0 "Difficultés de jeûne"
 RICE_manichean_fast_health_malus_effect_log:0 "Le corps de [CHARACTER.GetShortUIName] n'a pas bien supporté la période de jeûne."
 
 # Modifiers
 RICE_manichean_uyghur_manicheism_decline:0 "Église $manichean_adj$ en déclin"
 RICE_manichean_uyghur_manicheism_decline_desc:0 "L'Église [GetFaithByKey('manichean').GetAdjective] a subi des revers dans cette région, et la corruption présumée de son clergé a provoqué une désillusion massive, entraînant un manque de soutien de la part des élites locales qui réaffectent de plus en plus les ressources de l'Église vers d'autres entreprises productives.\n\n#EMP Les [rulers|El] de ce [county|El] qui suivent une [faith|El] avec la [doctrine|El] $rice_light_purification_doctrine_name$ #N perdront#! périodiquement de petites quantités de [prestige_i|El] [prestige|El] et de [piety_i|El] [piety|El] tant qu'ils suivront une [faith|El] avec une telle [doctrine|El], et tant que ce [modifier|El] sera actif.\n#!"
 RICE_manichean_persecutor_of_zindiqs:0 "Persécuteur des Zindîqs"
 RICE_manichean_persecutor_of_zindiqs_desc:0 "Ce personnage, en tant que puissant dirigeant en [GetGeographicalRegion('world_mesopotamia').GetName], a initié une nouvelle ère de persécution contre les [Glossary( 'zindiqs', 'ZINDIQ_GLOSS' )] dans cette région, réduisant considérablement leur nombre et forçant leurs chefs religieux à fuir vers l'est."
 RICE_manichean_uyghur_manicheism_empowered_elect:0 "Élus renforcés"
 RICE_manichean_uyghur_manicheism_empowered_elect_desc:0 "L'Église [GetFaithByKey('manichean').GetAdjective] a subi des revers dans cette région, ce qui n'a pas été facilité par la prétendue corruption de son clergé. Les élites mnichéennes locales ont réaffirmé leur soutien aux [Glossary( 'Élus', 'ELECT_GLOSS' )], dénonçant toute rumeur de corruption comme une calomnie blasphématoire – cela a permis de revigorer le pouvoir et l'influence de l'Église.\n\n#EMP Les [rulers|El] de ce [county|El] qui suivent une [faith|El] avec la [doctrine|El] $rice_light_purification_doctrine_name$ obtiendront périodiquement des bonus aléatoires de [prestige|El] [prestige_i|El] en raison de leurs liens avec l'Église manichéenne et ses institutions tant que ce [modifier|El] est actif.\n#!"
 RICE_manichean_uyghur_manicheism_reformed_church:0 "Église $manichean_adj$ réformée"
 RICE_manichean_uyghur_manicheism_reformed_church_desc:0 "L'Église [GetFaithByKey('manichean').GetAdjective] a subi des revers dans cette région, ce qui n'est pas arrangé par la corruption présumée de son clergé. Les élites manichéennes locales ont joué un rôle influent dans la réforme des [Glossary('Élus', 'ELECT_GLOSS' )], dans l'espoir que cela revitalisera l'Église et restaurera la confiance en elle.\n\n#EMP Les [rulers|El] de ce [county|El] qui suivent une [faith|El] avec la [doctrine|El] $rice_light_purification_doctrine_name$ recevront périodiquement des bonus aléatoires de [piety_i|El] [piety|El] en raison de leur implication dans les réformes de l'Église manichéenne tant que ce [modifier|El] est actif.\n#!"
 RICE_manichean_uyghur_decision_support_character_modifier:0 "Soutient l'Église $manichean_adj$"
 RICE_manichean_uyghur_decision_support_character_modifier_desc:0 "Ce personnage joue un rôle majeur dans l'accroissement du soutien de certaines élites à l'Église [GetFaithByKey('manichean').GetAdjective] dans le [GetGeographicalRegion('RICE_greater_qocho_region').GetName]. Si certains fidèles dévoués de la religion de la Lumière s'en félicitent, d'autres, désabusés par la corruption perçue du clergé, le désapprouvent.\n\n#EMP Ce [modifier|El] sera retiré si ce personnage se convertit à une [faith|El] qui ne possède pas la [doctrine|El] $rice_light_purification_doctrine_name$.\n#!"
 RICE_manichean_uyghur_decision_reform_character_modifier:0 "Réformateur de l'Église $manichean_adj$"
 RICE_manichean_uyghur_decision_reform_character_modifier_desc:0 "Ce personnage joue un rôle majeur dans les récentes réformes au sein de l'Église [GetFaithByKey('manichean').GetAdjective] dans [GetGeographicalRegion('RICE_greater_qocho_region').GetName]. Les partisans de la ligne dure dénoncent cela comme une ingérence politique indue qui affaiblit la force des institutions spirituelles, mais d'autres, particulièrement ceux qui étaient devenus désillusionnés par la corruption perçue du clergé, approuvent chaleureusement.\n\n#EMP Ce [modifier|El] sera retiré si ce personnage se convertit à une [faith|El] qui ne possède pas la [doctrine|El] $rice_light_purification_doctrine_name$.\n#!"
 RICE_manichean_uyghur_decision_abandon_character_modifier:0 "A abandonné l'Église $manichean_adj$"
 RICE_manichean_uyghur_decision_abandon_character_modifier_desc:0 "Puisque ce personnage est ou a été un acteur politique majeur dans [GetGeographicalRegion('RICE_greater_qocho_region').GetName], sa désillusion publique envers la religion de la Lumière a affaibli le soutien à l'Église à tous les niveaux de la société, quelles que soient leurs croyances religieuses actuelles."
 RICE_manichean_lin_deng_spiritual_lineage_modifier:0 "Lignée spirituelle de Lin Deng"
 RICE_manichean_lin_deng_spiritual_lineage_modifier_desc:0 "Les membres de cette famille descendent de Chen Pingshan, le disciple orthodoxe du grand Lin Deng, un sage empreint de sagesse et de compassion qui était membre de la Religion de la Lumière."
