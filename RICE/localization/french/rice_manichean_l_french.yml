 manichean.0030.t:0 "Le jeûne commence"
 manichean.0030.desc:0 "Le festival de la #italic Bema#! approche, la célébration la plus importante de [ROOT.Char.GetFaith.GetName]. C'est le moment de l'année où nous commémorons le martyre de Mani, l'Apôtre de Jésus, qui viendra à nous sous forme spirituelle pour nous absoudre des péchés que nous confessons, alors que nous libérons la Lumière de ce monde matériel et ténébreux.\n\nAvant le festival de la Bema, cependant, les [Glossary( 'Auditeurs', 'HEARER_GLOSS' )] tels que moi doivent jeûner en préparation. Nous éviterons ce qui perpétue l'emprisonnement de la Lumière dans la Matière, comme consommer de la nourriture (surtout non végétarienne), ingérer des substances enivrantes et se livrer à des actes sexuels."
 manichean.0030.a:0 "Nous #italic allons#! nous purifier avant que le festival ne commence."
 manichean.0031.t:0 "Rassemblement"
 manichean.0031.desc:0 "Nous avons achevé notre jeûne en préparation du festival #italic Bema#!. Maintenant, nous pouvons commencer la célébration comme il se doit, nous étant purifiés.\n\nNous entrons tous dans la salle centrale, nous rassemblant avec les [Glossary( 'Élus', 'ELECT_GLOSS' )]. Au fond de la salle se dresse un trône vide, à l'exception d'un portrait de Mani, notre Prophète ; c'est ici qu'il descendra spirituellement et nous absoudra de nos péchés après la confession."
 manichean.0031.a:0 "Maintenant que tout le monde est là, nous pouvons commencer."
 manichean.0031.a.toast:0 "La période de jeûne a affecté votre santé"
 manichean.0032.t:0 "La confession"
 manichean.0032.desc.intro:0 "Au début, cela commence simplement. Le pouls d'une prière, chantée par l'un des [Glossary( 'Élus', 'ELECT_GLOSS' )]. Puis, soudain, une à une, d'autres voix se joignent, celles de tous les [Glossary( 'Élus', 'ELECT_GLOSS' )] et [Glossary( 'Auditeurs', 'HEARER_GLOSS' )] présents dans la pièce.\n\nNous nous réunissons, chantant ensemble les hymnes de notre foi. Nous nous réunissons, pleurant de chagrin en nous souvenant du [Glossary( 'parinirvana', 'MANICHEAN_PARINIRVANA_GLOSS' )] de Mani. Nous nous réunissons, pleurant de joie, alors que nous confessons nos péchés, et que Mani descend de la Lumière tout là-haut, et nous absout de ces péchés.\n\nPendant un instant, il n'y a plus rien autour de moi que le son de la Lumière, de la pureté, de la puissance, de la sagesse, et la vision du trône du #italic Bema#!, vide à l'exception du portrait de Mani."
 manichean.0032.desc.change:0 "\n\nJe suis entouré uniquement de sainteté et de pureté spirituelle, tandis que je médite sur mes péchés et les sens me quitter... Je suis un[ROOT.Char.Custom('FR_E')] [ROOT.Char.GetWomanMan] transformé[ROOT.Char.Custom('FR_E')] !"
 manichean.0032.a:0 "C'est une expérience glorieuse, non, miraculeuse !"
 manichean.0033.t:0 "Les Élus"
 manichean.0033.desc:0 "Après les émotions, les sons et les visions bouleversants de la cérémonie de confession, nous passons à la partie suivante du Festival du #italic Bema#! \n\nTout au long de l'année, les [Glossary( 'Élus', 'ELECT_GLOSS' )] observent un régime végétarien, car en consommant les plantes, ces saintes figures sont capables de libérer le plus de Lumière vers les cieux, libérant la Lumière du monde de la matière. Le Festival du #italic Bema#! est peut-être l'occasion la plus importante pour cela, et les [Glossary( 'Élus', 'ELECT_GLOSS' )] mangent noblement les plantes que nous avons cueillies pour eux, tout en priant pour le salut de la Lumière et de nos âmes.\n\nAprès cela, les [Glossary( 'Élus', 'ELECT_GLOSS' )] prononcent divers sermons pour prêcher les enseignements profonds de Mani, et nous exhortent à poursuivre nos bonnes actions pour l'année à venir."
 manichean.0033.a:0 "Que la Lumière soit libérée des Ténèbres."
 manichean.0034.t:0 "Conclusion"
 manichean.0034.desc:0 "Enfin, le festival #italic Bema#! de cette année touche à sa fin. Mani est venu nous absoudre des péchés que nous avons confessés, tandis que toujours plus de Lumière était libérée et rendue aux cieux. Un événement aussi puissant, grandiose et intense n'a lieu qu'une fois par an, mais nous serons prêts pour la prochaine occasion. D'ici là, nous devrions faire de notre mieux pour accomplir des actes vertueux afin de libérer la Lumière, et mépriser les Ténèbres partout où nous le pouvons."
 manichean.0034.a:0 "Nous louons la vérité de Mani, l'Illuminateur suprême !"
