 RICE_manichean_supports_books:0 "Soutient la production et la préservation des livres manichéens"
 RICE_manichean_dislikes_those_who_defame_mani:0 "Déteste farouchement les détracteurs de Mani"
 RICE_manichean_dislikes_those_who_defame_mani_desc:0 "Ce personnage a exprimé des opinions très tranchées à l'égard de ceux qui diffament Mani, le prophète de la Lumière."
 RICE_manichean_patient_with_anti_manicheans:0 "Patience envers les détracteurs de Mani"
 RICE_manichean_patient_with_anti_manicheans_desc:0 "Ce personnage estime que ceux qui diffament Mani, le prophète de la Lumière, sont simplement égarés et non malveillants en soi."
 RICE_manichean_denigrated_the_elect:0 "A dénigré les Élus"
 RICE_manichean_denigrated_the_elect_desc:0 "Ce personnage a l'habitude de faire des commentaires désobligeants sur les [Glossary( 'Élus', 'ELECT_GLOSS' )] manichéens."
 RICE_manichean_helping_manichean_merchants:0 "Aide les marchands manichéens"
 RICE_manichean_confiscated_manichean_merchants:0 "A confisqué les biens appartenant aux marchands manichéens"
 RICE_manichean_understanding_towards_christians:0 "Montre de la compréhension envers les chrétiens"
 RICE_manichean_dislikes_christians:0 "A exprimé des opinions très tranchées à l'égard des chrétiens"
 RICE_manichean_freed_slaves:0 "A affranchi des esclaves au nom du manichéisme"
 RICE_manichean_freed_slaves_desc:0 "Ce personnage a acheté la liberté d'un certain nombre d'esclaves, qui ont ensuite été confiés aux soins des [Glossary( 'Élus', 'ELECT_GLOSS' )] manichéens, comme le préconisent les enseignements manichéens."
 RICE_manichean_careful_mingjiao:0 "Disciple prudent de Mani"
 RICE_manichean_careful_mingjiao_desc:0 "Ce personnage estime que les disciples de Mani, le Bouddha de la Lumière, doivent faire preuve de prudence et ne pas éveiller les soupçons des autorités religieuses dites orthodoxes de la sphère sinoise, qui appartiennent à d'autres confessions et les dénigrent comme des « adorateurs de démons végétariens » afin de survivre à toute répression ou conflit."
 RICE_manichean_protect_mingjiao:0 "Disciple insurgé de Mani"
 RICE_manichean_protect_mingjiao_desc:0 "Ce personnage estime que les disciples de Mani, le Bouddha de la Lumière, doivent prendre des mesures proactives pour se défendre contre la tyrannie des autorités religieuses dites orthodoxes de la sphère chinoise, afin de survivre à toute répression."
 RICE_manichean_writing_manuscript:0 "Travaille sur un manuscrit manichéen"
 RICE_manichean_fast_health_malus_modifier:0 "Jeûne manichéen"
 RICE_manichean_fast_health_malus_modifier_desc:0 "Le corps de ce personnage n'a pas été capable de supporter les rigueurs du jeûne manichéen alors qu'il se préparait pour le Festival de la Béma."


 
 # Struggle Ending Decisions
 
 # Decisions
 RICE_uyghur_manichean_church_decision:0 "Influencer l'avenir des $uyghur_collective_noun|l$ [GetFaithByKey('manichean').GetAdherentNamePluralNoTooltip]"
 RICE_uyghur_manichean_church_decision_tooltip:1 "Nos prédécesseurs ont suivi avec constance la Religion de la Lumière, mais certains commencent à remettre en question ses institutions."
 RICE_uyghur_manichean_church_decision_desc:0 "L'Église [GetFaithByKey('manichean').GetAdjective] a décliné après l'effondrement du [GetTitleByKey('e_uyghur_khanate').GetNameNoTier] et les persécutions en Chine. Aujourd'hui, beaucoup prétendent que les [Glossary( 'Élus', 'ELECT_GLOSS' )] sont devenus corrompus et cupides. En tant que puissant[ROOT.Char.Custom('FR_E')] [Select_CString(ROOT.Char.IsFemale, ROOT.Char.GetCulture.GetName, 'ouïghour')] [ROOT.Char.Custom('FR_FaithGenderedAdj')], je devrais peut-être faire quelque chose pour remédier à cette situation..."
 RICE_uyghur_manichean_church_decision_effect_tooltip_1:1 "Mani"
 RICE_uyghur_manichean_church_decision_confirm:0 "Nous trouverons la vérité spirituelle"
 RICE_uyghur_manichean_church_decision_context_tooltip:0 "#emphasis Contexte historique :#! Le Khaganat ouïghour fut la seule grande puissance mondiale à soutenir le manichéisme à un moment de son histoire, après la conversion de son élite dirigeante à la fin du VIIIe siècle ; ainsi, l'effondrement du Khaganat vers 840 porta un coup dur à l'Église manichéenne. L'Église continua de survivre pendant un certain temps dans l'État croupion ouïghour du royaume de Qocho, mais son élite dirigeante se convertit progressivement au bouddhisme pour diverses raisons. Les manichéens ouïghours ont peut-être survécu jusqu'à l'époque mongole, mais la plupart des Ouïghours s'étaient convertis au bouddhisme dès le XIe siècle."
 RICE_manichean_uyghur_decision_PICK_TYPE: "$RICE_uyghur_manichean_church_decision_confirm$"
 RICE_manichean_uyghur_decision_select_text:"Que devrions-nous faire au sujet de la corruption présumée au sein de l'Église [GetFaithByKey('manichean').GetAdjective] ?\n$select_one_of_the_available_option_step_one_top_text$"
 RICE_manichean_uyghur_decision_support_name:"#Bold Soutenir les Élus#!"
 RICE_manichean_uyghur_decision_support_desc: "$RICE_manichean_uyghur_decision_support_name$"
 RICE_manichean_uyghur_decision_support_tooltip:"#italic Quiconque dénigre inutilement les [Glossary( 'Élus', 'ELECT_GLOSS' )] en les qualifiant de corrompus sert la volonté du $manicheanism_devil_name$ – nous devons soutenir l'Église, pour empêcher sa disparition !#!"
 RICE_manichean_uyghur_decision_reform_name:"#Bold Rectifier l'Église#!"
 RICE_manichean_uyghur_decision_reform_desc: "$RICE_manichean_uyghur_decision_reform_name$"
 RICE_manichean_uyghur_decision_reform_tooltip:"#italic Il n'y a pas si longtemps, nos prédécesseurs, appelés les [Glossary( 'dinavariya', 'DINAVARIYA_GLOSS' )], critiquaient nos frères en [GetGeographicalRegion('RICE_region_mesopotamia').GetName] pour leur trop grand laxisme. C'est maintenant à notre tour de réformer nos [Glossary( 'Élus', 'ELECT_GLOSS' )], avant qu'il ne soit trop tard !#!"
 RICE_manichean_uyghur_decision_abandon_name:"#Bold Abandonner la Religion de la Lumière#!"
 RICE_manichean_uyghur_decision_abandon_desc: "$RICE_manichean_uyghur_decision_abandon_name$"
 RICE_manichean_uyghur_decision_abandon_tooltip:"#italic Si les soi-disant [Glossary( 'Élus', 'ELECT_GLOSS' )] sont corrompus et manquent de vertu et de spiritualité, qu'est-ce que cela dit du [GetFaithByKey('manichean').GetNameNoTooltip] lui-même ? Je deviens moi aussi désillusionné, et je souhaite chercher une guidance spirituelle ailleurs...#!"
 RICE_manichean_uyghur_decision_abandon_effect_1:"Vous recevrez un événement pour vous convertir à une [faith|El] différente ayant des adeptes dans un [county|El] de votre [domain|El], s'il en existe une. Vous pouvez choisir de ne pas vous convertir pour l'instant, si vous préférez."
 RICE_manichean_uyghur_decision_abandon_effect_2:"Tous les [rulers|El] [GetFaithByKey('manichean').GetAdherentNamePlural] de le [GetGeographicalRegion('RICE_greater_qocho_region').GetName] (y compris vous-même) auront accès à une [decision|El] pour #V abandonner le [GetFaithByKey('manichean').GetNameNoTooltip]#! pendant #V 100#! ans."
 RICE_manichean_uyghur_decision_abandon_effect_3:"D'autres [rulers|El] [GetFaithByKey('manichean').GetAdherentNamePlural] dans la [region|El] pourraient, sans que cela soit garanti, prendre cette [decision|El] au fil du temps."
 RICE_manichean_manuscript_decision:0 "Commander un manuscrit [ROOT.Char.GetFaith.GetAdherentNameNoTooltip]"
 RICE_manichean_manuscript_decision_tooltip:1 "Commander un texte religieux pour diffuser les enseignements de Mani."
 RICE_manichean_manuscript_decision_desc:0 "Mani nous a enseigné à estimer les livres, car ce n'est que par l'écrit que les enseignements [ROOT.Char.GetFaith.GetAdherentNamePlural] peuvent être transmis avec cohérence et authenticité."
 RICE_manichean_manuscript_decision_effect_tooltip_1:1 "Gain de [piety_i|El] #V [GetPlayer.MakeScope.ScriptValue('medium_piety_gain')]#! de [piety|El] lorsque le manuscrit est achevé"
 RICE_manichean_manuscript_decision_effect_tooltip_2:1 "Si vous avez au moins #V [GetPlayer.MakeScope.ScriptValue('RICE_manichean_manuscript_learning_req_value')]#! d'[learning_i|El] [learning|El], vous pouvez choisir d'écrire le manuscrit vous-même pour gagner un supplément de [prestige_i|El] #V [GetPlayer.MakeScope.ScriptValue('medium_prestige_gain')]#! [prestige|El], mais vous aurez le [modificateur|El] [GetModifier('RICE_manichean_writing_manuscript').GetNameWithTooltip] pendant toute la durée de la rédaction"
 RICE_manichean_manuscript_decision_effect_tooltip_3:1 "Gain de #V [GetPlayer.MakeScope.ScriptValue('RICE_lin_deng_trait_xp_gain_value_medium')]#! dans la [trait_level_track_xp|El] du [trait|El] [GetTrait('RICE_disciple_of_lin_deng').GetName( GetNullCharacter )]"
 RICE_manichean_manuscript_decision_confirm:0 "Que les enseignements de Mani perdurent !"
 RICE_manichean_manuscript_decision_context_tooltip:0 "#emphasis Contexte historique :#! Mani insistait auprès de ses fidèles sur l'importance de l'écrit, car il estimait que les enseignements des prophètes précédents avaient été déformés au fil du temps parce qu'ils n'avaient pas été mis par écrit à l'origine. Il peignait même des illustrations de ses enseignements pour ceux qui ne savaient pas lire. C'est pourquoi les manuscrits manichéens n'étaient pas seulement vénérés parmi les manichéens, mais jouissaient d'une réputation de qualité ; dans les sources musulmanes, par exemple, même hostiles, la beauté des livres manichéens tenait presque de l'aphorisme."
 RICE_manichean_manuscript_decision_select_text:"Contrairement aux autres Prophètes, Mani nous a exhortés à consigner ses paroles,\nafin que ses enseignements demeurent purs et incorruptibles à jamais."
 RICE_MANICHEAN_MANUSCRIPT_PICK_TYPE: "$RICE_manichean_manuscript_decision_confirm$" # Mani taught us the importance of the written word in preserving the true doctrines of our [faith|El]. # select_one_of_the_available_option_step_one_top_text # The written word ensures that Mani's original teachings remain pure.\n\n$select_one_of_the_available_option_step_one_top_text$
 RICE_manichean_manuscript_seven_treatises_name:"#bold Sept Traités#!"
 RICE_manichean_manuscript_seven_treatises_desc: "$RICE_manichean_manuscript_seven_treatises_name$"
 RICE_manichean_manuscript_seven_treatises_tooltip:"#italic Le canon scripturaire manichéen est composé de sept livres personnellement écrits par Mani lui-même.#!\n\nUne fois équipé, cet [artifact|El] réduit le coût en [gold_i|El] [gold|El] de la [decision|El] #V $RICE_manichean_confession_decision$#! et de l'[activity|El] [GetActivityType( 'activity_RICE_manichean_bema_festival' ).GetName]."
 RICE_manichean_manuscript_shabuhragan_name: "#bold Shabuhragan#!"
 RICE_manichean_manuscript_shabuhragan_desc: "$RICE_manichean_manuscript_shabuhragan_name$"
 RICE_manichean_manuscript_shabuhragan_tooltip:"#italic Shabuhragan, signifiant « dédié à Shapur », est un résumé des enseignements manichéens écrit par Mani lui-même.#!\n\nUne fois équipé, cet [artifact|El] vous permet de gagner du [prestige_i|El] [prestige|El] supplémentaire lors de l'[activity|El] [GetActivityType( 'activity_RICE_manichean_bema_festival' ).GetName]."
 RICE_manichean_manuscript_arzhang_name: "#bold Arzhang#!"
 RICE_manichean_manuscript_arzhang_desc: "$RICE_manichean_manuscript_arzhang_name$"
 RICE_manichean_manuscript_arzhang_tooltip:"#italic L'Arzhang, ou le Livre des Images, est une collection d'images dessinées par le Prophète Mani lui-même, pour illustrer ses enseignements profonds, en particulier pour les illettrés.#!\n\nLorsqu'il est équipé, cet [artifact|El] vous permet de gagner de l'[opinion|El] [opinion_i|El] supplémentaire de la part de chaque participant lorsque vous organisez l'[activity|El] [GetActivityType( 'activity_RICE_manichean_bema_festival' ).GetName]."
 RICE_manichean_manuscript_kephalaia_name: "#bold Kephalaia#!"
 RICE_manichean_manuscript_kephalaia_desc: "$RICE_manichean_manuscript_kephalaia_name$"
 RICE_manichean_manuscript_kephalaia_tooltip:"#italic Bien que ne faisant pas partie du canon manichéen principal, les Kephalaia sont des œuvres littéraires qui exposent les enseignements de Mani ; beaucoup sont également des récits de la vie de Mani.#!\n\nLorsqu'il est équipé, cet [artifact|El] vous permet de gagner de la [piety_i|El] [piety|El] supplémentaire lors de l'[activity|El] [GetActivityType( 'activity_RICE_manichean_bema_festival' ).GetName]."
 RICE_manichean_manuscript_hymn_book_name:"#bold Livres d'hymnes#!"
 RICE_manichean_manuscript_hymn_book_desc: "$RICE_manichean_manuscript_hymn_book_name$"
 RICE_manichean_manuscript_hymn_book_tooltip:"#italic Divers hymnes manichéens ont été composés à des fins rituelles, et nombre d'entre eux sont utilisés lors de cérémonies politiques importantes et quotidiennes.#!\n\nUne fois équipé, cet [artifact|El] vous permet de gagner davantage de [legitimacy_i|El] [legitimacy|El] lorsque vous organisez l'[activity|El] [GetActivityType( 'activity_RICE_manichean_bema_festival' ).GetName]."
 RICE_manichean_manuscript_confessional_texts_name:"#bold Textes confessionnels#!"
 RICE_manichean_manuscript_confessional_texts_desc: "$RICE_manichean_manuscript_confessional_texts_name$"
 RICE_manichean_manuscript_confessional_texts_tooltip:"#italic Il est utile d'avoir des textes pour nous guider dans la confession de nos péchés, l'un des actes spirituels les plus importants que l'on puisse accomplir pour combattre les Ténèbres.#!\n\nUne fois équipé, cet [artifact|El] vous permet de perdre un supplément de [stress_loss_i|El] [stress|El] grâce à la [decision|El] #V $RICE_manichean_confession_decision$#! et à l'[activity|El] [GetActivityType( 'activity_RICE_manichean_bema_festival' ).GetName]."
 RICE_manichean_manuscript_parables_and_tales_name:"#bold Paraboles et récits#!"
 RICE_manichean_manuscript_parables_and_tales_desc: "$RICE_manichean_manuscript_parables_and_tales_name$"
 RICE_manichean_manuscript_parables_and_tales_tooltip:"#italic Les histoires sont un moyen d'enseigner et d'instruire les gens sur la meilleure façon de bien vivre selon Mani.#!\n\nLorsqu'il est équipé, cet [artifact|El] vous permet de gagner de l'[lifestyle_experience|El] supplémentaire lors de l'[activity|El] [GetActivityType( 'activity_RICE_manichean_bema_festival' ).GetName]."
 RICE_manichean_manuscript_other_religions_texts_name:"#Bold Textes des autres religions#!"
 RICE_manichean_manuscript_other_religions_texts_desc: "$RICE_manichean_manuscript_other_religions_texts_name$"
 RICE_manichean_manuscript_other_religions_texts_tooltip:"#italic Mani disait que l'un des devoirs de ses disciples était de rassembler les textes révélés des autres religions pour les adapter et les ajouter à la grande sagesse de Mani.#!\n\nLorsqu'il est équipé, cet [artifact|El] réduit le coût en [gold|El] [gold_i|El] de la [decision|El] pour #V Commander un manuscrit#! pour les [faiths|El] qui suivent les enseignements de Mani."
 RICE_manichean_confession_decision:0 "Effectuer une confession hebdomadaire des péchés"
 RICE_manichean_confession_decision_tooltip:1 "La confession hebdomadaire des péchés est une pratique importante dans votre [faith|El]."
 RICE_manichean_confession_decision_desc:0 "Afin de nous purifier, il est important de confesser fréquemment nos péchés en tant que [ROOT.Char.GetFaith.GetAdherentNamePlural]. Ceux qui ne font pas partie des [Glossary( 'Élus', 'ELECT_GLOSS' )] sont tenus de le faire au moins une fois par semaine."
 RICE_manichean_confession_decision_effect_tooltip_1:1 "Vous avez #V [GetPlayer.MakeScope.ScriptValue('RICE_manichean_confession_lose_sin_chance')]%#! de chances de perdre un [trait|El] #N négatif#! ou #N pécheur#!, et de gagner un [trait|El] #P positif#! en fonction de votre [piety_level|El] et de vos [traits|El]"
 RICE_manichean_confession_decision_effect_tooltip_2:1 "Gagne une quantité aléatoire comprise entre [piety_i|El] #V [GetPlayer.MakeScope.ScriptValue('RICE_manichean_confession_piety_gain_min')|0]#! [piety|El] et [piety_i|El] #V [GetPlayer.MakeScope.ScriptValue('RICE_manichean_confession_piety_gain_max')|0]#! [piety|El] selon votre [piety_level|El]"
 RICE_manichean_confession_decision_confirm:0 "Nos péchés retiennent la Lumière !"
 RICE_manichean_confession_decision_context_tooltip:0 "#emphasis Contexte historique :#! Une obligation importante des membres de la religion manichéenne était une cérémonie hebdomadaire, lors de laquelle les croyants laïcs et le clergé devaient se réunir pour confesser leurs péchés et expier de manière hautement ritualisée. Les sources divergent quant à savoir si ces rassemblements hebdomadaires avaient lieu le dimanche ou le lundi, bien qu'il y ait probablement eu des différences régionales concernant le déroulement de ces confessions ; par exemple, les cérémonies de confession manichéennes d'Asie centrale et de Chine ont pu être influencées par le bouddhisme."
 RICE_manichean_confession_lose_sin_effect_tooltip:0 "$RICE_manichean_confession_decision_effect_tooltip_1$"
 RICE_manichean_lin_deng_decision:0 "Vénérer Lin Deng"
 RICE_manichean_lin_deng_decision_tooltip:1 "Lin Deng a propagé les enseignements du Bouddha de Lumière, et veille encore aujourd'hui sur les justes et les vertueux."
 RICE_manichean_lin_deng_decision_desc:0 "Le grand sorcier Lin Deng est un héros sans égal, qui nous a transmis de profonds enseignements et rituels. Nous lui rendons donc un culte régulier afin que son esprit nous bénisse et nous protège, même après sa mort."
 RICE_manichean_lin_deng_decision_effect_tooltip_1:1 "Vous avez #V [GetPlayer.MakeScope.ScriptValue('RICE_manichean_lin_deng_decision_modifier_chance')]%#! de chances d'obtenir des [modifiers|El] #P positifs#! utiles, dont les probabilités dépendent de votre [piety_level|El], de vos [traits|El], et de votre [learning_i|El] [learning|El]"
 RICE_manichean_lin_deng_decision_confirm:0 "Puisse-t-il nous protéger et nous guider !"
 RICE_manichean_lin_deng_decision_context_tooltip:0 "#emphasis Contexte historique :#! Historiquement, la survie du manichéisme dans la région du Fujian, au sud-est de la Chine, jusqu'au XVIe siècle, doit beaucoup à un certain Lin Deng, un chef manichéen actif au Fujian jusqu'à sa mort en 1059. Les pouvoirs magiques de Lin Deng étaient légendaires, et il est vénéré par les habitants jusqu'à ce jour. Dans une légende, après sa mort, lorsqu'un incendie se déclara dans une ville, les gens virent un homme vêtu de robes blanches dans le ciel utilisant un éventail de fer pour éteindre le feu ; il dit ensuite aux habitants en contrebas qu'il n'était autre que Lin Deng. De nos jours, Chen Peishang, un prêtre et ritualiste local du Fujian descendant du disciple de Lin Deng, Chen Pingshan, possède des manuscrits d'origine manichéenne claire qui ont été cruciaux pour les érudits du manichéisme."
 RICE_gnostic_alms_decision:0 "Faire l'aumône aux [ROOT.Char.GetFaith.PriestNeuterPlural] [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip]"
 RICE_gnostic_alms_decision_mandaean:0 "Accomplir la Zidqa"
 RICE_gnostic_alms_decision_manichean:0 "Faire l'aumône aux Élus"
 RICE_gnostic_alms_decision_tooltip:1 "Le clergé qui possède la connaissance et prie pour le salut divin doit être aidé par tous les moyens possibles."
 RICE_gnostic_alms_decision_desc:0 "Les commandements de [ROOT.Char.GetFaith.GetName] nous ordonnent de faire l'aumône à nos saints hommes et femmes, qui usent de leur savoir pour œuvrer jour et nuit à prier et accomplir des rituels en vue du salut divin."
 RICE_gnostic_alms_decision_effect_tooltip_1:1 "Le coût en [gold_i|El] [gold|El] de cette [decision|El] dépend du nombre de [counties|El] que vous possédez de votre [faith|El]"
 RICE_gnostic_alms_decision_confirm:0 "Ils méritent notre aide !"
 RICE_gnostic_alms_decision_context_tooltip:0 "#emphasis Contexte historique :#! L'aumône au clergé est un élément important de nombreuses religions, y compris celles dites gnostiques. Cela était particulièrement important car, dans certaines religions gnostiques, il était déconseillé, voire interdit, au clergé d'exercer divers travaux ordinaires ; le manichéisme, par exemple, interdisait aux Élus, leur classe sacerdotale, de récolter de la nourriture et de cuire du pain, entre autres choses."
 RICE_persecute_manicheans_in_mesopotamia:0 "Persécuter les Zindiqs en [GetGeographicalRegion('world_mesopotamia').GetNameNoTooltip]"
 RICE_persecute_manicheans_in_mesopotamia_tooltip:1 "Les [Glossary( 'zindiqs', 'ZINDIQ_GLOSS' )] de [GetGeographicalRegion('world_mesopotamia').GetName] sont une engeance dangereuse !"
 RICE_persecute_manicheans_in_mesopotamia_desc:0 "Les [Glossary( 'zindiqs', 'ZINDIQ_GLOSS' )] de [GetGeographicalRegion('world_mesopotamia').GetName] qui croient au faux prophète Mani sont tolérés dans cette région depuis bien trop longtemps. Ils doivent être réprimés si complètement qu'ils ne puissent plus jamais tromper les autres et détruire notre société avec leurs mensonges et leurs coutumes répugnantes et macabres."
 RICE_persecute_manicheans_in_mesopotamia_effect_tooltip_1:1 "XXXXX"
 RICE_persecute_manicheans_in_mesopotamia_confirm:0 "Mille malédictions sur ces hérétiques sanguinaires !"
 RICE_persecute_manicheans_in_mesopotamia_context_tooltip:0 "#emphasis Contexte historique :#! Le manichéisme a subi de nombreuses persécutions au cours de son histoire, en tant que religion minoritaire dans de nombreuses régions du monde. Durant la période abbasside, les manichéens étaient considérés avec méfiance par les fidèles d'autres religions ; on pensait par exemple qu'ils pratiquaient des sacrifices humains, utilisant les têtes de leurs victimes lors de cérémonies divinatoires. La dernière grande persécution en Mésopotamie, la terre d'origine du manichéisme, eut lieu sous le règne d'al-Muqtadir (908–932 apr. J.-C.), lorsque les restes de la communauté manichéenne, y compris le chef de l'Église, l'Archégos, s'enfuirent vers l'est jusqu'à Samarcande."
 RICE_revive_manicheism_in_mesopotamia:0 "Raviver les enseignements de Mani en [GetGeographicalRegion('world_mesopotamia').GetNameNoTooltip]"
 RICE_revive_manicheism_in_mesopotamia_tooltip:1 "La [GetGeographicalRegion('world_mesopotamia').GetName], la patrie de notre prophète Mani, doit être libérée des Ténèbres."
 RICE_revive_manicheism_in_mesopotamia_desc:0 "La [GetGeographicalRegion('world_mesopotamia').GetName] était la patrie de notre Prophète Mani. Au fil des siècles, cette terre ancienne est tombée sous une sombre influence, et ses fidèles y ont été persécutés. La terre entre les deux fleuves doit être à nouveau illuminée par les enseignements de Mani !"
 RICE_revive_manicheism_in_mesopotamia_effect_tooltip_1:1 "Le [head_of_faith|El] [GetFaithByKey('manichean').GetAdjective] retourne à [GetTitleByKey('c_kufa').GetNameNoTier] s'il ne s'y trouve pas déjà."
 RICE_revive_manicheism_in_mesopotamia_effect_tooltip_2:1 "Le [head_of_faith|El] [GetFaithByKey('manichean').GetAdjective] est rétabli s'il n'a actuellement aucun [holder|El]"
 RICE_revive_manicheism_in_mesopotamia_effect_tooltip_3:1 "Empêche les [rulers|El] non-manichéens de pouvoir prendre la [decision|El] de #V $RICE_persecute_manicheans_in_mesopotamia$#!"
 RICE_revive_manicheism_in_mesopotamia_confirm:0 "Pour la Lumière ! Pour Mani !"
 RICE_revive_manicheism_in_mesopotamia_context_tooltip:0 "$RICE_persecute_manicheans_in_mesopotamia_context_tooltip$"
 RICE_manichean_convert_away_decision:0 "Se détourner de [ROOT.Char.GetFaith.GetNameNoTooltip]"
 RICE_manichean_convert_away_decision_tooltip:1 "Il existe peut-être de meilleures [faiths|El] ailleurs...."
 RICE_manichean_convert_away_decision_desc:0 "Depuis de nombreuses années, les héritiers du [GetTitleByKey('e_uyghur_khanate').GetNameNoTier] s'accrochent aux enseignements du prophète Mani. Pourtant, les accusations de corruption au sein de l'Église [ROOT.Char.GetFaith.GetAdjective] et son déclin en éloignent certains de la religion de la Lumière..."
 RICE_manichean_convert_away_decision_effect_tooltip_1:0 "Vous vous détournez de [GetPlayer.GetFaith.GetName] pour vous convertir à la [faith|El] que vous avez sélectionnée"
 RICE_manichean_convert_away_decision_confirm:0 "Trouvons une nouvelle foi !"
 RICE_manichean_convert_away_decision_context_tooltip:0 "$RICE_uyghur_manichean_church_decision_context_tooltip$"
 RICE_ADOPT_NEW_UYGHUR_FAITH_PICK_ACTION_TYPE: "$RICE_manichean_convert_away_decision_confirm$"
 RICE_manichean_convert_to_nangchos_name: "[GetFaithByKey('lamaism').GetName]"
 RICE_manichean_convert_to_nangchos_desc: "[GetFaithByKey('lamaism').GetNameNoTooltip]"
 RICE_manichean_convert_to_nangchos_tooltip:"Les moines [GetFaithByKey('lamaism').GetAdherentNamePlural] venus du [GetGeographicalRegion('world_tibet').GetName] ne sont pas une vision rare le long de la Route de la Soie. Leur manière de prêcher le Dharma [GetReligionByKey('buddhism_religion').GetAdherentName] n'est pas totalement différente de ce à quoi nous sommes habitués dans le [GetFaithByKey('manichean').GetName], et ils parlent de sauver tous les êtres sensibles... Mais ont-ils davantage de sens ?"
 RICE_manichean_convert_to_mahayana_name: "[GetFaithByKey('mahayana').GetName]"
 RICE_manichean_convert_to_mahayana_desc: "[GetFaithByKey('mahayana').GetNameNoTooltip]"
 RICE_manichean_convert_to_mahayana_tooltip:"La secte [GetFaithByKey('mahayana').GetAdjective] du [GetReligionByKey('buddhism_religion').GetName] est très présente le long de la Route de la soie, et ses moines prosélytes rappellent les anciens missionnaires [GetFaithByKey('manichean').GetAdherentNamePlural]. Peut-être font-ils preuve de plus de discipline et de vertu, puisqu'ils prêchent le salut de tous les êtres sensibles... Mais puis-je vraiment croire en leurs paroles ?"
 RICE_manichean_convert_to_vajrayana_name: "[GetFaithByKey('vajrayana').GetName]"
 RICE_manichean_convert_to_vajrayana_desc: "[GetFaithByKey('vajrayana').GetNameNoTooltip]"
 RICE_manichean_convert_to_vajrayana_tooltip:"Les rituels de la secte [GetFaithByKey('vajrayana').GetAdjective] du [GetReligionByKey('buddhism_religion').GetName] apportent non seulement l'illumination, mais rappellent également les cérémonies colorées et vibrantes du [GetFaithByKey('manichean').GetName]. Ils sont peut-être même plus séduisants, avec leur discours sur le nirvana et l'aide à tous les êtres sensibles... Mais est-ce suffisant pour être considéré comme la vérité ?"
 RICE_manichean_convert_to_zhengyi_name: "[GetFaithByKey('zhengyi').GetName]"
 RICE_manichean_convert_to_zhengyi_desc: "[GetFaithByKey('zhengyi').GetNameNoTooltip]"
 RICE_manichean_convert_to_zhengyi_tooltip:"Certains dans l'Empire du Milieu prétendent que le Prophète chinois, Laozi, était en réalité le prophète de la Lumière, Mani. Autrefois, c'étaient les missionnaires [GetFaithByKey('manichean').GetAdherentNamePlural] qui l'affirmaient, mais aujourd'hui certains pensent l'inverse. Se convertir au [GetFaithByKey('zhengyi').GetName] serait-il donc un si grand pas ?"
 RICE_manichean_convert_to_nestorian_name: "[GetFaithByKey('nestorian').GetName]"
 RICE_manichean_convert_to_nestorian_desc: "[GetFaithByKey('nestorian').GetNameNoTooltip]"
 RICE_manichean_convert_to_nestorian_tooltip:"L'Église [GetFaithByKey('nestorian').GetAdjective] s'est répandue à travers l'Asie centrale, même parmi les nomades. Un principe important du [GetFaithByKey('manichean').GetName] est que Mani était l'Apôtre de Jésus, et que les [GetReligionByKey('christianity_religion').GetAdherentNamePlural] sont égarés, suivant des enseignements corrompus. Mais et si c'était l'inverse ?"
 RICE_manichean_convert_to_maturidi_name: "[GetFaithByKey('maturidi').GetName]"
 RICE_manichean_convert_to_maturidi_desc: "[GetFaithByKey('maturidi').GetNameNoTooltip]"
 RICE_manichean_convert_to_maturidi_tooltip:"L'essor de l'[GetReligionByKey('islam_religion').GetName] a changé l'histoire du monde à jamais, et les discours de ses adeptes sur la justice et la charité sont séduisants, sans compter qu'ils revendiquent également un Prophète dont la doctrine est un renouveau d'enseignements auparavant corrompus. Se pourrait-il qu'ils détiennent le véritable message de salut, non corrompu ?"
 RICE_manichean_convert_to_khurmazta_name: "[GetFaithByKey('khurmazta').GetName]"
 RICE_manichean_convert_to_khurmazta_desc: "[GetFaithByKey('khurmazta').GetNameNoTooltip]"
 RICE_manichean_convert_to_khurmazta_tooltip:"Depuis des siècles, les communautés [GetFaithByKey('manichean').GetAdjectiveNoTooltip]s et [GetReligionByKey('zoroastrianism_religion').GetAdjectiveNoTooltip]s vivent côte à côte, et nous connaissons bien les variantes locales de cette dernière que l'on trouve tout au long de la Route de la Soie sous la forme du [GetFaithByKey('khurmazta').GetName]. La vérité se serait-elle cachée parmi nous, depuis tout ce temps ?"
 RICE_manichean_recruit_ming_cultists:0 "Recruter des cultistes du Mingjiao"
 RICE_manichean_recruit_ming_cultists_tooltip:1 "Ayez pitié des gens de ce monde ! Ils affrontent tant d'épreuves !" # 憐我世人，憂患實多！
 RICE_manichean_recruit_ming_cultists_desc:0 "Les fidèles [ROOT.Char.GetFaith.GetAdherentNamePlural] [ROOT.Char.GetCulture.GetCollectiveNoun|l] sont comme des frères et sœurs, opprimés par les forces du mal depuis des générations. Unissons-nous et prenons les armes, dans un esprit de solidarité, pour protéger le monde des corrompus et des cupides !" # 憐我世人，憂患實多！
 RICE_manichean_recruit_ming_cultists_effect_tooltip_1:1 "Le coût en [gold_i|El] [gold|El] et en [piety_i|El] [piety|El] pour prendre cette [decision|El] est basé respectivement sur votre [diplomacy_i|El] [diplomacy|El] et votre [learning_i|El] [learning|El]"
 RICE_manichean_recruit_ming_cultists_effect_tooltip_2:1 "Le temps de recharge de cette [decision|El] est basé sur votre [stewardship|El] [stewardship_i|El]"
 RICE_manichean_recruit_ming_cultists_effect_tooltip_3:1 "Vous obtiendrez #V [GetPlayer.MakeScope.ScriptValue('RICE_manichean_recruit_ming_cultists_levies_amount')]#! [levies|El] basés sur votre [martial_i|El] [martial|El] et votre [intrigue_i|El] [intrigue|El]"
 RICE_manichean_recruit_ming_cultists_effect_tooltip_4:1 "Vous obtiendrez une base de #V 300#! [men_at_arms|El], et #V 100#! [men_at_arms|El] supplémentaires (d'un type aléatoire) pour chacun des [traits|El] suivants :\n$EFFECT_LIST_BULLET$[GetTrait('lifestyle_mystic').GetName( GetNullCharacter )|U]\n$EFFECT_LIST_BULLET$[GetTrait('lifestyle_herbalist').GetName( GetNullCharacter )|U]\n$EFFECT_LIST_BULLET$[GetTrait('lifestyle_physician').GetName( GetNullCharacter )|U]\n$EFFECT_LIST_BULLET$[GetTrait('scholar').GetName( GetNullCharacter )|U]\n$EFFECT_LIST_BULLET$[GetTrait('peasant_leader').GetName( GetNullCharacter )|U]\n$EFFECT_LIST_BULLET$[GetTrait('heresiarch').GetName( GetNullCharacter )|U]"
 RICE_manichean_recruit_ming_cultists_confirm:0 "Délivrer le peuple de la souffrance, et éliminer le mal !"
 RICE_manichean_recruit_ming_cultists_context_tooltip:0 "#emphasis Contexte historique :#! Bien que les sources chinoises officielles de la période médiévale aient stéréotypé de nombreux groupes rebelles hétérodoxes comme des manichéens « végétariens adorateurs de démons », il y a une part de vérité dans le fait que le manichéisme chinois a pris un caractère plus martial que les autres communautés manichéennes, probablement pour se protéger des répressions répétées du gouvernement. Par exemple, beaucoup étaient réputés doués en arts martiaux, et les communautés manichéennes chinoises furent vraisemblablement impliquées dans plusieurs soulèvements paysans. En fait, le manichéisme chinois fut une grande inspiration pour le Culte Ming, une école d'arts martiaux fictive dans les romans #italic wuxia#! (fantasy historique d'arts martiaux) écrits par l'un des plus grands auteurs du genre, Jin Yong."
 
 # EVENTS




 manichean.0000.t:0 "xxxxx"
 manichean.0000.desc:0 "xxxxx"
 manichean.0000.a:0 "xxxxx"
 manichean.0001.t:0 "Les enseignements de Mani reviennent en [GetGeographicalRegion('RICE_region_mesopotamia').GetNameNoTooltip]"
 manichean.0001.desc:0 "Mani, l'Apôtre du Messie Jésus et le Prophète de la Lumière, est né en [GetGeographicalRegion('RICE_region_mesopotamia').GetName] et c'est là qu'il commença à prêcher sa doctrine, réputée être non seulement le point culminant de toutes les autres religions, mais aussi les surpasser en profondeur et en vérité.\n\nCes derniers temps, les disciples de Mani ont subi revers sur revers, faisant face à l'oppression, à la discrimination et à la violence des adeptes d'autres religions, en particulier dans sa terre natale.\n\nCela est en train de changer grâce à [manichean_reviver.GetTitledFirstName], un[manichean_reviver.Custom('FR_E')] puissant[manichean_reviver.Custom('FR_E')] protect[manichean_reviver.Custom('FR_EurRice')] de [manichean_reviver.GetFaith.GetName], qui règne sur une grande partie de la [GetGeographicalRegion('RICE_region_mesopotamia').GetNameNoTooltip] et a supervisé le renouveau des enseignements de Mani dans la région.\n\nEnfin, les fidèles de la religion de la Lumière connaissent la paix et la liberté auxquelles ils aspiraient et pour lesquelles ils priaient depuis si longtemps, sous un souverain dévot et bienveillant. Les villes du Croissant fertile produisent désormais d'innombrables et magnifiques manuscrits, peintures et œuvres d'art [manichean_reviver.GetFaith.GetAdjectiveNoTooltip]s ; leurs habitants chantent des hymnes à la gloire du Prophète Mani et de [manichean_reviver.GetFaith.HighGodName] ; et les [Glossary( 'Élus', 'ELECT_GLOSS' )] qui y vivent œuvrent sans relâche jour et nuit pour mener une vie parfaite et vertueuse, afin de libérer la Lumière dans la guerre sainte contre les forces des Ténèbres et de la Matière."
 manichean.0001.a:0 "C'est un nouveau chapitre dans l'histoire de l'Église de Mani."
 manichean.0002.t:0 "Une question de monachisme"
 manichean.0002.desc:0 "Nos récents succès dans la restauration de l'Église de Mani sur sa terre natale de [GetGeographicalRegion('RICE_region_mesopotamia').GetName] ont soulevé des questions sur la pratique du #bold Monachisme#! désormais courante parmi de nombreux [Glossary( 'Élus', 'ELECT_GLOSS' )] [manichean_reviver.GetFaith.GetAdjective].\n\nCertains ont commencé à remettre en question la nécessité du monachisme, arguant qu'il s'agit d'une pratique que l'Église a adoptée à tort d'autres religions, en particulier du [GetReligionByKey('buddhism_religion').GetName] ; ce n'est pas parce que nous adaptons les idées d'autres confessions, comme Mani nous l'a enseigné, pour diffuser nos véritables enseignements, que nous devons tout adapter #italic entièrement#!.\n\nD'autres soutiennent que, peu importe si le mode de vie monastique est venu à notre Église plus tard ou non, c'est une bonne pratique, car elle aide les [Glossary( 'Élus', 'ELECT_GLOSS' )] dans leurs activités spirituelles visant à libérer la Lumière en les isolant du mauvais Monde des Ténèbres."
 manichean.0002.a:0 "Il n'est pas nécessaire d'abandonner le monachisme."
 manichean.0002.a.tooltip:0 "La [doctrine|El] [GetFaithDoctrine('tenet_monasticism').GetBaseName] ne sera pas remplacée."
 manichean.0002.b:0 "Oui, profitons de cette occasion pour réformer [manichean_reviver.GetFaith.GetNameNoTooltip]."
 manichean.0002.b.tooltip:0 "Sur la base des suggestions de membres influents des [Glossary( 'Élus', 'ELECT_GLOSS' )], [manichean_reviver.GetFaith.GetNameNoTooltip] devrait adopter cette nouvelle [doctrine|El]."
 manichean.0003.t:0 "xxxxx"
 manichean.0003.desc:0 "xxxxx"
 manichean.0003.a:0 "xxxxx"
 manichean.0004.t:0 "La fin d'une ère pour le [GetFaithByKey('manichean').GetNameNoTooltip]"
 manichean.0004.desc:0 "De graves nouvelles se répandent parmi les communautés [GetFaithByKey('manichean').GetAdjectiveNoTooltip]s éparpillées à travers le monde : [persecutor.GetTitledFirstName] a inauguré une nouvelle ère de persécution des [GetFaithByKey('manichean').GetAdherentNamePluralNoTooltip] au Moyen-Orient. Il y a eu des persécutions menées par des souverains antérieurs, remontant jusqu'à l'époque du Prophète Mani lui-même, mais cette fois-ci est différente.\n\nLa répression est si sévère que même [archegos.GetTitledFirstName], le chef de l'Église [GetFaithByKey('manichean').GetAdjectiveNoTooltip], estime que la [GetGeographicalRegion('RICE_region_mesopotamia').GetName], le centre traditionnel et la patrie ancestrale du [GetFaithByKey('manichean').GetNameNoTooltip], n'est plus sûr pour ceux qui adorent la lumière.\n\nBien qu'[archegos.GetSheHe] ait été poussé à abdiquer et à se convertir à [persecutor.GetFaith.GetName], [archegos.GetFirstNameNoTooltip] a préféré fuir avec quelques fidèles dévoués vers l'est, le long de la Route de la Soie, en direction de la Chine, où subsistent d'anciennes communautés [GetFaithByKey('manichean').GetAdjectiveNoTooltip]s. Ils ont ainsi rétabli un nouveau foyer pour le [GetTitleByKey('d_manichean').GetNameNoTier] à [county.GetNameNoTier].\n\nSeul le temps dira si le [GetFaithByKey('manichean').GetNameNoTooltip], qui a subi crise après crise, survivra également à celle-ci."
 manichean.0004.a:0 "Les forces de [ROOT.Char.GetFaith.DevilName] deviennent toujours plus puissantes !"
 manichean.0004.b:0 "L'[GetTitleByKey('d_manichean').GetNameNoTierNoTooltip] devra-t-elle fuir à nouveau à l'avenir ?"
 manichean.0004.tooltip:0 "L'[GetTitleByKey('d_manichean').GetNameNoTierNoTooltip] déménage de [GetTitleByKey('c_kufa').GetNameNoTier] à [GetTitleByKey('c_samarkand').GetNameNoTier]"
 manichean.0005.t:0 "Purification gnostique"
 manichean.0005.desc:0 "Notre nouvelle vraie foi, [ROOT.Char.GetFaith.GetName], est enracinée dans la doctrine du [GetFaithDoctrine('tenet_gnosticism').GetBaseName], et dans la purification de nos âmes. Ainsi, nos [ROOT.Char.GetFaith.PriestNeuterPlural] débattent de la meilleure manière d'accomplir une telle purification dans nos pratiques religieuses quotidiennes."
 manichean.0005.a:0 "Baptême : nous immerger régulièrement dans l'eau sacrée"
 manichean.0005.b:0 "Alimentation : réduire voire éliminer notre consommation de viande"
 manichean.0005.c:0 "Amour : procréation sacrée avec nos âmes sœurs"
 manichean.0005.d:0 "Lumière : libération de la lumière telle que l'a enseignée le prophète Mani"
 manichean.0005.e:0 "Prière : par la dévotion et le rituel seuls"
 manichean.0006.t:0 "Le sceau de Mani"
 manichean.0006.desc:0 "Il y a des années, nos ennemis religieux en [GetGeographicalRegion('RICE_region_mesopotamia').GetNameNoTooltip] ont forcé les fidèles de Mani à profaner et détruire ses reliques. Nous pensions qu'elles étaient toutes perdues à jamais.\n\nToutes, semble-t-il, sauf une.\n\nJe n'y ai pas cru au début, mais la #bold Pierre-Sceau de Mani#! a été retrouvée d'une manière ou d'une autre par de dévots [ROOT.Char.GetFaith.GetAdherentNamePlural] dans les territoires que je gouverne, et son authenticité a été confirmée par les membres les plus sages et les plus érudits des [Glossary( 'Élus', 'ELECT_GLOSS' )] de mon royaume.\n\nLa relique, possiblement la dernière et unique relique survivante de Mani, a été placée sous ma protection, afin qu'elle ne soit plus jamais perdue ni menacée de destruction – dire que cette pierre-sceau fut jadis utilisée par l'Apôtre de Jésus lui-même !"
 manichean.0006.a:0 "La Lumière brille toujours plus fort."
 manichean.0007.t:0 "$manichean.0006.t$"
 manichean.0007.desc:0 "Une nouvelle réjouissante se répand à travers le monde pour ceux qui se considèrent comme des disciples de Mani, le Prophète de la Lumière et fondateur de l'Église manichéenne.\n\nLa #bold Pierre-sceau de Mani#! a été retrouvée et placée sous la protection directe de [discoverer.GetTitledFirstName], un[discoverer.Custom('FR_E')] adepte de la doctrine [discoverer.GetFaith.GetAdjective]. Son authenticité a été confirmée par des [Glossary( 'Élus', 'ELECT_GLOSS' )] [discoverer.GetFaith.GetAdjectiveNoTooltip], et une grande jubilation gagne les manichéens du monde entier, car cette pierre-sceau pourrait bien être la dernière relique survivante du prophète Mani, ses autres reliques ayant été détruites lors des persécutions antiques de la foi."
 manichean.0007.a:0 "C'est assurément une joyeuse occasion pour les fidèles de Mani."
 manichean.0008.t:0 "xxxxx"
 manichean.0008.desc:0 "xxxxx"
 manichean.0008.a:0 "xxxxx"
 manichean.0009.t:0 "xxxxx"
 manichean.0009.desc:0 "xxxxx"
 manichean.0009.a:0 "xxxxx"
 RICE_uyghur_manichean_decision_intro:0 "Après l'effondrement du [GetTitleByKey('e_uyghur_khanate').GetNameNoTier], jadis puissant défenseur de la religion de la Lumière, et les persécutions dans d'autres pays à travers le monde, l'Église de Mani a grandement souffert ces derniers temps. Pire encore, des accusations circulent selon lesquelles les [Glossary( 'Élus', 'ELECT_GLOSS' )] seraient devenus corrompus, vivant dans le luxe et ignorant les préceptes des enseignements de Mani.\n\nEn réponse à cette crise grandissante au sein de l'Église de Mani dans le [GetGeographicalRegion('RICE_greater_qocho_region').GetName], [uyghur_leader.GetTitledFirstName], un[uyghur_leader.Custom('FR_E')] puissant[uyghur_leader.Custom('FR_E')] souverain[uyghur_leader.Custom('FR_E')] de la région, a"
 RICE_uyghur_manichean_decision_conclusion:0 "\n\nQue cela soit né d'une ferveur et d'une vertu sincères, d'un opportunisme politique, ou des deux, le règne de [uyghur_leader.GetFirstNamePossessive] marque un tournant dans l'histoire de la religion de la Lumière. Seul le temps dira quels effets ses actions, ainsi que celles des autres croyants et non-croyants de la région, auront sur la trajectoire de la religion de Mani."
 manichean.0010.t:0 "Soutien renouvelé pour l'Église de Mani"
 manichean.0010.desc:0 "$RICE_uyghur_manichean_decision_intro$ a lancé une campagne visant à renforcer le soutien aux institutions [uyghur_leader.GetFaith.GetAdjectiveNoTooltip]s [uyghur_leader.GetCulture.GetNameNoTooltip]s par divers moyens, allant du soutien financier à l'octroi d'une plus grande influence politique. [uyghur_leader.GetSheHe|U] a également proclamé que ceux qui dénigrent les [Glossary( 'Élus', 'ELECT_GLOSS' )] par de fausses accusations de corruption ne valent pas mieux que les serviteurs de [uyghur_leader.GetFaith.DevilName] qui cherchent à détruire la Lumière.$RICE_uyghur_manichean_decision_conclusion$"
 manichean.0010.a:0 "Ce sont des temps turbulents dans le pays des [uyghur_leader.GetCulture.GetCollectiveNounNoTooltip|l]..."
 manichean.0011.t:0 "Réformes nécessaires au sein de l'Église de Mani"
 manichean.0011.desc:0 "$RICE_uyghur_manichean_decision_intro$ a entrepris une campagne de réforme des institutions [uyghur_leader.GetFaith.GetAdjectiveNoTooltip]s [uyghur_leader.GetCulture.GetNameNoTooltip]s par divers moyens. [uyghur_leader.GetSheHe|U] prend clairement au sérieux les accusations de corruption et d'avidité portées contre certains [Glossary( 'Élus', 'ELECT_GLOSS' )], mais croit qu'ils peuvent changer pour le mieux. Certes, certains [Glossary( 'Élus', 'ELECT_GLOSS' )] sont mécontents de ce qu'ils considèrent comme une ingérence politique, mais d'autres [uyghur_leader.GetFaith.GetAdherentNamePluralNoTooltip] pieux accueillent favorablement ces réformes très nécessaires pour revitaliser l'Église.$RICE_uyghur_manichean_decision_conclusion$"
 manichean.0011.a:0 "$manichean.0010.a$"
 manichean.0012.t:0 "Abandonner l'Église de Mani"
 manichean.0012.desc:0 "$RICE_uyghur_manichean_decision_intro$ a fait savoir publiquement qu'[uyghur_leader.GetSheHe] est insatisfait[uyghur_leader.Custom('FR_E')], voire désillusionné[uyghur_leader.Custom('FR_E')], par les institutions [uyghur_leader.GetFaith.GetAdjectiveNoTooltip]s [uyghur_leader.GetCulture.GetNameNoTooltip]s, et par ce qu'[uyghur_leader.GetSheHe] considère comme la corruption et l'avidité de l'Église de Mani. Le soutien envers les [Glossary( 'Élus', 'ELECT_GLOSS' )] s'est effondré, et des rumeurs circulent selon lesquelles [uyghur_leader.GetFirstNameNoTooltip] chercherait à patronner les fidèles d'autres religions, et à réaffecter les propriétés et possessions [uyghur_leader.GetFaith.GetAdjectiveNoTooltip]s à d'autres usages.$RICE_uyghur_manichean_decision_conclusion$"
 manichean.0012.a:0 "$manichean.0010.a$"
 manichean.0013.t:0 "Désillusion envers les institutions[ROOT.Char.GetFaith.GetNameNoTooltip]s [ROOT.Char.GetCulture.GetNameNoTooltip]s"
 manichean.0013.desc:0 "J'ai ouvertement et publiquement exprimé mon insatisfaction et ma désillusion envers les institutions [ROOT.Char.GetFaith.GetAdjectiveNoTooltip]s [ROOT.Char.GetCulture.GetNameNoTooltip]s. Cela a sans surprise suscité bien des controverses au sein de mon royaume.\n\n[new_faith.GetName], que l'on trouve sur mes terres, m'intéresse depuis peu, en tant que foi dont les adeptes semblent droits et estimables – bien loin de la corruption qui, je le crois, est devenue trop commune au sein de [ROOT.Char.GetFaith.GetName].\n\nMais se lasser de sa foi est une chose ; franchir le pas et embrasser une nouvelle doctrine en est une autre."
 manichean.0013.desc.chaplain:0 "Mon [chaplain.GetCouncilTitle], [chaplain.GetTitledFirstName], m'a supplié de reconsidérer ma décision après avoir entendu des rumeurs selon lesquelles je souhaite mettre fin à tout soutien envers les [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip]."
 manichean.0013.a:0 "J'ai pris ma décision : [new_faith.GetName] est la vraie religion !"
 manichean.0013.b:0 "Je suis désillusionné[ROOT.Char.Custom('FR_E')], mais me convertir serait aller trop loin."
 manichean.0013.b.tooltip:0 "Même si vous ne vous convertissez pas immédiatement, vous aurez toujours accès à une [decision|El] pour le faire durant les #V 100#! prochaines années"
 manichean.0014.t:0 "Le roi d'un État croupion"
 manichean.0014.desc:0 "Le [GetTitleByKey('e_uyghur_khanate').GetNameNoTier] se tenait autrefois aux côtés des puissants empires de Chine, du Tibet et des Arabes comme l'une des grandes puissances du monde, et le défenseur de l'Église [GetFaithByKey('manichean').GetAdjective]. Nos ancêtres pleureraient s'ils pouvaient voir notre état actuel !\n\nAprès l'effondrement de l'empire, nous nous sommes dispersés dans toutes les directions ; une branche des [ROOT.Char.GetCulture.GetCollectiveNoun|l] s'est enfuie dans la région de [GetTitleByKey('c_kara_khoja').GetNameNoTierNoTooltip] pour établir un État croupion du Khaganat, que je gouverne. Ici, nous, [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip|l], avons eu du mal à nous consolider ; nous sommes divisés ; nous faisons face à de nombreux ennemis, en particulier [GetTitleByKey('k_hexi').GetNameNoTier], et même l'Église [GetFaithByKey('manichean').GetAdjectiveNoTooltip] que nous avons soutenue si longtemps est assaillie par des accusations de corruption et d'inefficacité spirituelle.\n\nPourtant, c'est une époque de grandes opportunités, car nous ne sommes pas les seuls [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip|l] à subir notre part d'épreuves. Nos rivaux ont aussi leurs problèmes, et même une crise spirituelle pourrait être une impulsion vers d'importants changements religieux."
 manichean.0014.a:0 "Quoi qu’il arrive, je ferai de mon mieux pour mener mon peuple vers l’avenir !"
 manichean.0014.info:0 "#emphasis Contexte historique :#! Après la défaite du khaganat ouïghour face aux Kirghizes ascendants vers l'an 840 de notre ère, les vestiges des Ouïghours se dispersèrent à travers la région. Le plus puissant des États croupions ouïghours était le royaume de Qocho, centré sur le bassin de Dzoungarie et le nord du bassin du Tarim. Pendant plusieurs décennies au IXe siècle, Qocho rivalisa avec les dirigeants chinois du circuit de Guiyi (partie nominale de l'Empire Tang) pour la suprématie dans la région, les deux camps s'attaquant mutuellement à divers moments."
 manichean.0015.t:0 "$RICE_historical_aspiration_fulfilled_title$"
 manichean.0015.desc:0 "[GetTitleByKey('e_uyghur_khanate').GetNameNoTier] a jadis dominé les steppes ; même les puissants empires de Chine, du Tibet et des Arabes devaient traiter nos ancêtres en égaux. L'effondrement de l'empire fut un coup terrible pour notre peuple, et nous nous sommes dispersés aux quatre vents.\n\nJe ne peux prétendre que l'ancien empire soit véritablement restauré – du moins pas tel qu'il fut autrefois. Cependant, j'ai consolidé un [GetGeographicalRegion('RICE_greater_qocho_region').GetName] pour les [ROOT.Char.GetCulture.GetCollectiveNoun|l] par la diplomatie, la guerre, le soutien des institutions religieuses, et plus encore.\n\nLe [ROOT.Char.GetPrimaryTitle.GetName] n'est pas un État croupion de l'ancien Khaganat, mais un royaume puissant à part entière. Avec notre nouvelle patrie établie, nous pouvons de nouveau nous tenir fièrement comme les égaux des autres puissants royaumes."
 manichean.0015.a:0 "Notre avenir ne peut qu’être radieux."
 manichean.0016.t:0 "Une nouvelle foi"
 manichean.0016.desc:0 "L'Église de Mani a grandement décliné dans la [GetGeographicalRegion('RICE_former_uyghur_influence_region').GetName], en raison du manque de puissants mécènes, de la répression continue en terres étrangères, et des nombreuses accusations de corruption, de cupidité et de train de vie luxueux au sein des rangs des [Glossary( 'Élus', 'ELECT_GLOSS' )].\n\nAlors que de plus en plus de membres de l'élite retirent leur soutien ou rejettent purement et simplement les institutions [ROOT.Char.GetFaith.GetAdjectiveNoTooltip]s [ROOT.Char.GetCulture.GetNameNoTooltip]s, j'ai décidé de leur emboîter le pas.\n\nJe me suis désormais tourné[ROOT.Char.Custom('FR_E')] vers les doctrines plus séduisantes de [new_faith.GetName]. Ses adeptes se trouvaient déjà dans mon royaume, et ils sont ravis d'apprendre que je me tiens à leurs côtés, et non aux côtés des faux enseignements de Mani. Consacrons-nous à [new_faith.HighGodName], et soutenons les [new_faith.PriestNeuterPlural] [new_faith.GetAdherentNamePlural], plus vertueux et inspirants !"
 manichean.0016.a:0 "Gloire à [new_faith.HighGodNameAlternate]!"
