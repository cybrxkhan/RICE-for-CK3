 south_ethiopia.0080.t:0 "La récolte de l'enset"
 south_ethiopia.0080.desc:0 "Les habitants des hautes terres du [GetGeographicalRegion('RICE_south_ethiopia_region').GetName] cultivent #bold l'enset#! depuis des générations. C'est une culture très utile car elle résiste à la sécheresse et peut être récoltée à tout moment et à n'importe quel stade de sa vie.\n\nC'est pourquoi j'ai ordonné aux villages de mon domaine où l'enset est cultivé d'en récolter une partie dès maintenant afin de garantir nos réserves alimentaires pour un avenir proche.\n\nCertains pourraient grommeler à l'idée de devoir récolter maintenant, plutôt que plus tard, lorsque les plants sont plus matures. Cependant, on ne sait jamais quand la sécheresse, la famine ou d'autres calamités pourraient frapper."
 south_ethiopia.0080.a:0 "Il s'agit d'une précaution nécessaire."
 south_ethiopia.0081.t:0 "Entretien des bosquets sacrés"
 south_ethiopia.0081.desc:0 "Parmi les peuples [culture.GetCollectiveNoun|l], un[ROOT.Char.Custom('FR_E')] [ROOT.Char.GetWomanMan] qui entretient continuellement les arbres et bosquets sacrés hérités de ses ancêtres est quelqu'un qui gagne le respect de beaucoup.\n\nJ'ai mis de côté des ressources pour accomplir ces obligations d'entretien de nos arbres sacrés. Ce faisant, non seulement je me montre sous un meilleur jour aux yeux des autres, mais j'honore également mes ancêtres et notre grand clan [ROOT.Char.GetDynasty.GetName].\n\n"
 south_ethiopia.0081.desc.small:0 "Ces ressources seront consacrées à des projets d'entretien plus modestes de nos #italic mine'e ha'ara#!, ou bosquets domestiques. Ces arbres sont de petits bosquets entretenus par la famille proche."
 south_ethiopia.0081.desc.medium:0 "Cette fois, j'ai l'intention de consacrer les ressources à l'entretien des #italic songo harra#!. Ces bosquets sacrés sont collectivement entretenus par notre clan et d'autres clans apparentés de la région, et sont souvent utilisés pour des assemblées communautaires."
 south_ethiopia.0081.desc.large:0 "Je dirigerai un effort pour entretenir notre #italic gossa ha'ara#!, le plus sacré des bosquets qui abrite le corps du grand ancêtre commun à mon clan et à de nombreux autres clans depuis de très, très nombreuses générations. La communauté dans son ensemble participera, étant donné l'importance du site."
 south_ethiopia.0081.a:0 "Nous devons protéger et préserver ces arbres sacrés !"
