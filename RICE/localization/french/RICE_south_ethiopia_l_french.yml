 # Decisions
 RICE_south_ethiopia_enset_decision:0 "Récolter l'ensète pour atténuer l'insécurité alimentaire"
 RICE_south_ethiopia_enset_decision_tooltip:0 "L'ensète est une culture résistante à la sécheresse et à l'insécurité alimentaire."
 RICE_south_ethiopia_enset_decision_desc:0 "Depuis des générations, le peuple [ROOT.Char.GetCulture.GetName] cultive et récolte l'#V enset#!. Comme il est très résistant à la sécheresse et peut être récolté à tout moment et à n'importe quel stade de sa vie, il a maintes fois empêché la famine. Je devrais ordonner aux villages locaux d'en récolter dès maintenant pour améliorer notre sécurité alimentaire."
 RICE_south_ethiopia_enset_decision_effect_tooltip_1:0 "Le coût de cette [decision|El] dépend de votre [stewardship_i|El][stewardship|El] et du nombre de [counties|El] que vous possédez avec des [cultures|El] qui ont l'[innovation|El] #V $innovation_RICE_enset$#!"
 RICE_south_ethiopia_enset_decision_confirm:0 "Récoltez l'ensète !"
 RICE_south_ethiopia_enset_decision_context_tooltip:0 "#emphasis Contexte historique :#! L'enset, également connu sous le nom de faux bananier, est une culture de base pour des peuples comme les Welayta et les Sidama depuis des siècles. Il a de multiples usages en tant que source de nourriture, de matériaux de construction, de médicaments, etc. Parce qu'il est très résistant à la sécheresse et qu'il peut être récolté à tout moment et à n'importe quel stade de sa vie, il a traditionnellement joué un rôle crucial dans la prévention de la famine et de l'insécurité alimentaire dans la région pendant des siècles - ce qui se reflétera dans une décision débloquée par cette innovation."
 RICE_south_ethiopia_sidama_groves_decision:0 "Maintenir les bosquets sacrés ancestraux"
 RICE_south_ethiopia_sidama_groves_decision_tooltip:0 "Les bois sacrés sont notre héritage sacré"
 RICE_south_ethiopia_sidama_groves_decision_desc:0 "Parmi le peuple [ROOT.Char.GetCulture.GetName], les bosquets sacrés sont hérités de génération en génération, et des clans entiers entretiennent de tels grands bosquets pour des besoins politiques, sociaux et religieux. En tant que membre du clan [ROOT.Char.GetDynasty.GetName], je devrais faire ma part pour entretenir les bosquets sacrés que j'ai hérités."
 RICE_south_ethiopia_sidama_groves_decision_effect_tooltip_1:1 "Vous recevrez de la [piety_i|El] [piety|El], [dynasty_prestige_i|El] [dynasty_prestige|El], et un [character_modifier|El] pendant #V 10#! ans, dont le montant et les bonus dépendent des bosquets que vous décidez d'entretenir."
 RICE_south_ethiopia_sidama_groves_decision_effect_tooltip_2:1 ""
 RICE_south_ethiopia_sidama_groves_decision_confirm:0 "Honorons les arbres sacrés !"
 RICE_south_ethiopia_sidama_groves_decision_context_tooltip:0 "#emphasis Contexte historique :#! Le peuple Sidama a traditionnellement entretenu et vénéré des arbres ou bosquets sacrés, quelle que soit la religion. Ces arbres ou bosquets sont souvent possédés et transmis de génération en génération, donc l'entretien de ces arbres est considéré comme une responsabilité importante ; ce n'est pas seulement une question religieuse, mais aussi une question de « maintien » (pour ainsi dire) de son propre statut et de sa bonne réputation. Ceux qui entretiennent de grands arbres importants, par exemple, sont considérés comme des « grands hommes » dans la communauté."
 RICE_south_ethiopia_sidama_groves_decision_type:0 "Choisir le type de bosquets à entretenir"
 RICE_south_ethiopia_pick_grove_option:0 "$RICE_south_ethiopia_sidama_groves_decision_type$"
 RICE_south_ethiopia_sidama_groves_decision_small_option:0 "#Bold #V Mine'e Ha'ara#!#!\n$RICE_south_ethiopia_sidama_groves_decision_small_option_desc$"
 RICE_south_ethiopia_sidama_groves_decision_small_option_desc:0 "Bosquets sacrés domestiques"
 RICE_south_ethiopia_sidama_groves_decision_small_option_tooltip:0 "Coût : @gold_icon! #V #Bold [GetPlayer.MakeScope.ScriptValue('RICE_south_ethiopia_sidama_tree_decision_small_cost')]#!#!\n\nVous gagnerez :\n\n$EFFECT_LIST_BULLET$ [piety_i|El] #V [GetPlayer.MakeScope.ScriptValue('RICE_south_ethiopia_sidama_tree_piety_gain_small')]#! [piety|El]\n$EFFECT_LIST_BULLET$ [dynasty_prestige_i|El] #V [GetPlayer.MakeScope.ScriptValue('RICE_south_ethiopia_sidama_tree_dynasty_prestige_gain_small')]#! [dynasty_prestige|El]\n$EFFECT_LIST_BULLET$Le [character_modifier|El] [GetModifier('RICE_south_ethiopia_maintained_groves_small_modifier').GetNameWithTooltip] pour #V 10#! ans"
 RICE_south_ethiopia_sidama_groves_decision_medium_option:0 "#Bold #V Songo Harra#!#!\n$RICE_south_ethiopia_sidama_groves_decision_medium_option_desc$"
 RICE_south_ethiopia_sidama_groves_decision_medium_option_desc:0 "Bois sacrés en propriété collective"
 RICE_south_ethiopia_sidama_groves_decision_medium_option_tooltip:0 "Coût : @gold_icon! #V #Bold [GetPlayer.MakeScope.ScriptValue('RICE_south_ethiopia_sidama_tree_decision_medium_cost')]#!#!\n\nVous gagnerez :\n\n$EFFECT_LIST_BULLET$ [piety_i|El] #V [GetPlayer.MakeScope.ScriptValue('RICE_south_ethiopia_sidama_tree_piety_gain_medium')]#! [piety|El]\n$EFFECT_LIST_BULLET$ [dynasty_prestige_i|El] #V [GetPlayer.MakeScope.ScriptValue('RICE_south_ethiopia_sidama_tree_dynasty_prestige_gain_medium')]#! [dynasty_prestige|El]\n$EFFECT_LIST_BULLET$Le [character_modifier|El] [GetModifier('RICE_south_ethiopia_maintained_groves_medium_modifier').GetNameWithTooltip] pour #V 10#! ans"
 RICE_south_ethiopia_sidama_groves_decision_large_option:0 "#Bold #V Gossa Ha'ara#!#!\n$RICE_south_ethiopia_sidama_groves_decision_large_option_desc$"
 RICE_south_ethiopia_sidama_groves_decision_large_option_desc:0 "Les bosquets sacrés d'un ancêtre fondateur"
 RICE_south_ethiopia_sidama_groves_decision_large_option_tooltip:0 "Coût : @gold_icon! #V #Bold [GetPlayer.MakeScope.ScriptValue('RICE_south_ethiopia_sidama_tree_decision_large_cost')]#!#!\n\nVous gagnerez :\n\n$EFFECT_LIST_BULLET$ [piety_i|El] #V [GetPlayer.MakeScope.ScriptValue('RICE_south_ethiopia_sidama_tree_piety_gain_large')]#! [piety|El]\n$EFFECT_LIST_BULLET$ [dynasty_prestige_i|El] #V [GetPlayer.MakeScope.ScriptValue('RICE_south_ethiopia_sidama_tree_dynasty_prestige_gain_large')]#! [dynasty_prestige|El]\n$EFFECT_LIST_BULLET$Le [character_modifier|El] [GetModifier('RICE_south_ethiopia_maintained_groves_large_modifier').GetNameWithTooltip] pour #V 10#! ans"
 RICE_south_ethiopia_fandaanano_decision:0 "Cultiver la foi Fandaanano"
 RICE_south_ethiopia_fandaanano_decision_tooltip:0 "Un nouveau courant de croyances religieuses se développe sur les hauts plateaux de [GetGeographicalRegion('RICE_south_ethiopia_region').GetName]"
 RICE_south_ethiopia_fandaanano_decision_desc:0 "Les hautes terres du [GetGeographicalRegion('RICE_south_ethiopia_region').GetName] ont abrité de nombreuses [faiths|El]. Un nouveau système de croyances, [GetFaithByKey('fandaanano').GetAdjective], qui se considère comme l'égal des [faiths|El] abrahamiques, mais mêle les croyances traditionnelles [GetReligionByKey('sidamic_religion').GetAdjective] et [GetReligionByKey('islam_religion').GetAdjective|U], se développe ici, et je suis intrigué[ROOT.Char.Custom('FR_E')] par ses enseignements."
 RICE_south_ethiopia_fandaanano_decision_effect_tooltip_1:0 "Les [counties|El] et les [rulers|El] du  [GetGeographicalRegion('RICE_south_ethiopia_region').GetName], en particulier ceux qui suivent une [faith|El] [GetReligionByKey('sidamic_religion').GetAdjective] ou [GetReligionByKey('islam_religion').GetAdjective|U], pourraient se convertir à la foi [GetFaithByKey('fandaanano').GetName]"
 RICE_south_ethiopia_fandaanano_decision_effect_tooltip_2:0 "Il est désormais possible de se convertir à la foi [GetFaithByKey('fandaanano').GetName]."
 RICE_south_ethiopia_fandaanano_decision_confirm:0 "Adoptons les enseignements [GetFaithByKey('fandaanano').GetNameNoTooltip] !"
 RICE_south_ethiopia_fandaanano_decision_context_tooltip:0 "#emphasis Contexte historique :#! Le Fandaanano était une religion syncrétique mêlant l'islam et les croyances indigènes cushitiques. Elle était autrefois largement pratiquée par le peuple Hadiya, qui parle une langue sidamique, mais elle s'est également répandue à d'autres ethnies par l'intermédiaire des missionnaires. Le Fandaanano est apparu au XVe siècle dans le sud de l'Éthiopie, probablement à partir des communautés musulmanes des hauts plateaux qui étaient géographiquement isolées de l'islam principal à la suite de bouleversements politiques. Malgré leurs divergences avec l'islam, de nombreux adeptes du Fandaanano se considéraient comme musulmans. La tradition a aujourd'hui disparu, mais elle continue d'exercer une influence considérable sur les Hadiya modernes, quelle que soit leur appartenance religieuse."
 RICE_south_ethiopia_pray_to_a_sycamore_tree:0 "Prier un sycomore"
 RICE_south_ethiopia_pray_to_a_sycamore_tree_tooltip:1 "Notre peuple vénère les sycomores depuis longtemps."
 RICE_south_ethiopia_pray_to_a_sycamore_tree_desc:0 "Depuis des temps immémoriaux, les [ROOT.Char.GetCulture.GetCollectiveNoun] connaissent les grands pouvoirs spirituels du sycomore. Maintenant, je vais prier devant l'un d'eux, dans l'espoir que les [GetPlayer.Custom('RICE_mideast_spirit_plural')] qui habitent autour puissent utiliser leurs pouvoirs spirituels pour me guider et exaucer mes souhaits."
 RICE_south_ethiopia_pray_to_a_sycamore_tree_effect_tooltip_1:1 "Vous pourriez obtenir des [character_modifiers|El] #P bénéfiques#! qui améliorent vos [skills|El] entre autres avantages, en fonction de vos [traits|El] (en particulier les [virtues|El] et les [sins|El]) et de votre [piety_level|El]"
 RICE_south_ethiopia_pray_to_a_sycamore_tree_confirm:0 "Préparez les offrandes !"
 RICE_south_ethiopia_pray_to_a_sycamore_tree_context_tooltip:0 "#emphasis Contexte historique :#! Les figuiers sycomores sont considérés comme dotés d'immenses pouvoirs spirituels parmi plusieurs peuples d'Afrique de l'Est, principalement de langue couchitique. Même ceux qui sont musulmans ou chrétiens pratiquent encore d'anciens rituels liés à ces sycomores, comme les Bedjas, qui font des sacrifices ou des offrandes à certains sycomores."
 RICE_south_ethiopia_sycamore_tree_neutral:0 "Les [GetPlayer.Custom('RICE_mideast_spirit_plural')] vous ignorent"
 RICE_south_ethiopia_sycamore_tree_neutral_tooltip:0 "$RICE_south_ethiopia_sycamore_tree_neutral$"
 RICE_south_ethiopia_sycamore_tree_bad:0 "Les [GetPlayer.Custom('RICE_mideast_spirit_plural')] n'apprécient pas vos offrandes"
 RICE_south_ethiopia_sycamore_tree_bad_short:0 "#N Un mauvais résultat#!"
 RICE_south_ethiopia_sycamore_tree_good:0 "Les [GetPlayer.Custom('RICE_mideast_spirit_plural')] sont satisfaits de vos offrandes"
 RICE_south_ethiopia_sycamore_tree_good_short:0 "#P Un bon résultat#!"
 RICE_south_ethiopia_sycamore_tree_neutral_short:0 "#N Aucun résultat#!"


