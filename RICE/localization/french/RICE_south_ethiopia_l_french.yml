 south_ethiopia.0030.t:0 "La cérémonie de Gimuwa commence"
 south_ethiopia.0030.desc:0 "Pour cette cérémonie de comptage du bétail, j'ai précédemment désigné m[gimuwa.Custom('FR_OnA')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('gimuwa'))], [gimuwa.GetTitledFirstName], comme candidat[gimuwa.Custom('FR_E')] #italic gimuwa#! [gimuwa.GetSheHe|U] pourra ainsi partager ma gloire, et à juste titre, en tant que grand[gimuwa.Custom('FR_E')] [gimuwa.GetWomanMan] de notre communauté.\n\nLa cérémonie commence après que le comptage du bétail et le festin sont terminés, le week-end suivant la cérémonie de comptage du bétail, et ce jour est arrivé."
 south_ethiopia.0030.a:0 "[gimuwa.GetFirstNameNoTooltip], j'espère que tu es prêt[gimuwa.Custom('FR_E')] !"
 south_ethiopia.0031.t:0 "Fin de la cérémonie de Gimuwa"
 south_ethiopia.0031.desc:0 "Nous regardons tous avec fierté [gimuwa.GetFirstNameNoTooltip], vêtu[gimuwa.Custom('FR_E')] de vêtements spéciaux et avec une plume d'autruche sur la tête, chevaucher un cheval accompagné[gimuwa.Custom('FR_E')] d'autres cavaliers tels que ses proches et amis.\n\nAlors qu'[gimuwa.GetSheHe] entre sur le marché, tout comme je l'ai fait avant, [gimuwa.GetSheHe] se vante fièrement de ses grands exploits, ainsi que de ceux de ses proches, amis et ancêtres. Les spectateurs applaudissent lorsqu'[gimuwa.GetSheHe] termine son discours ; maintenant, [gimuwa.GetSheHe] doit briser un grand pot rempli de bière, ce qu'[gimuwa.GetSheHe] fait avec enthousiasme du haut de son cheval. Je prends alors le pot et le lui donne à boire, avant que tout le monde partage la boisson, tandis que [gimuwa.GetFirstNameNoTooltip] distribue un peu d'argent qu'[gimuwa.GetSheHe] a économisé pour donner à chacun, y compris aux pauvres."
 south_ethiopia.0031.a:0 "Splendide ! Rentrons à la maison pour festoyer en ton honneur."
