 RICE_south_ethiopia_gifaataa_gift_small_desc:"$EFFECT_LIST_BULLET$Gain d'un montant de base de [prestige_i|El] #V [EmptyScope.ScriptValue('RICE_south_ethiopia_gifaataa_gift_gain_small_base')]#! de [prestige|El] et [piety_i|El] #V [EmptyScope.ScriptValue('RICE_south_ethiopia_gifaataa_gift_gain_small_base')]#! [piety|El]\n$EFFECT_LIST_BULLET$Vous pourriez vous-même recevoir des cadeaux allant jusqu'à #V [gold_i|El][GetPlayer.MakeScope.ScriptValue('tiny_gold_value')]#!\n\n#weak Le Gifaataa est une occasion d'offrir des cadeaux aux membres de la communauté, dans un esprit de solidarité.#!"
 RICE_south_ethiopia_gifaataa_gift_medium: "Importants"
 RICE_south_ethiopia_gifaataa_gift_medium_desc:"$EFFECT_LIST_BULLET$Gain d'un montant de base de [prestige_i|El] #V [EmptyScope.ScriptValue('RICE_south_ethiopia_gifaataa_gift_gain_medium_base')]#! de [prestige|El] et [piety_i|El] #V [EmptyScope.ScriptValue('RICE_south_ethiopia_gifaataa_gift_gain_medium_base')]#! [piety|El]\n$EFFECT_LIST_BULLET$Vous pourriez vous-même recevoir des cadeaux allant jusqu'à #V [gold_i|El][GetPlayer.MakeScope.ScriptValue('minor_gold_value')]#!\n\n#weak Si je dois véritablement incarner les idéaux du Gifaataa, je devrais offrir des cadeaux généreux aux autres.#!"
 RICE_south_ethiopia_gifaataa_gift_large: "Énormes"
 RICE_south_ethiopia_gifaataa_gift_large_desc:"$EFFECT_LIST_BULLET$Gain d'un montant de base de [prestige_i|El] #V [EmptyScope.ScriptValue('RICE_south_ethiopia_gifaataa_gift_gain_large_base')]#! de [prestige|El] et [piety_i|El] #V [EmptyScope.ScriptValue('RICE_south_ethiopia_gifaataa_gift_gain_large_base')]#! [piety|El]\n$EFFECT_LIST_BULLET$Vous pourriez vous-même recevoir des cadeaux allant jusqu'à #V [gold_i|El][GetPlayer.MakeScope.ScriptValue('medium_gold_value')]#!\n\n#weak En tant que nouvelle année, Gifaataa est un moment pour vraiment faire la différence en favorisant la paix et l'harmonie à travers des cadeaux inoubliables pour toute la communauté.#!"

 activity_RICE_south_ethiopia_fichee_chambalaalla_festival_host_an_a:0 "un"
 activity_RICE_south_ethiopia_fichee_chambalaalla_festival:0 "Festival de Fichee-Chambalaalla"
 activity_RICE_south_ethiopia_fichee_chambalaalla_festival_desc:0 "Le Fichee-Chambalaalla marque le début de la nouvelle année. Les astronomes #italic ayyaanto#! peuvent déterminer une date appropriée pour ce grand festin et cette célébration de nouveaux commencements."
 activity_RICE_south_ethiopia_fichee_chambalaalla_festival_selection_tooltip: "Célébrez la nouvelle année avec d'autres personnes.\n\n$activity_RICE_south_ethiopia_fichee_chambalaalla_festival_context_tooltip$"
 activity_RICE_south_ethiopia_fichee_chambalaalla_festival_context_tooltip:0 "#emphasis Contexte historique :#! Le nouvel an Sidama est appelé Fichee-Chambalaalla. Sa date est déterminée par les Ayyaanto, les astronomes traditionnels du peuple Sidama. Selon la légende, la fête tire son origine de Ficho, une femme qui, après s'être mariée, rendait visite chaque année à ses parents et à leurs voisins en préparant un festin en leur honneur. Après sa mort, ses voisins ont donné son nom à la veille du Nouvel An."
 activity_RICE_south_ethiopia_fichee_chambalaalla_festival_host_desc:"\n$BULLET_WITH_TAB$Gain de [prestige_i|E][prestige|El]\n$BULLET_WITH_TAB$Gain de [piety_i|E][piety|El]\n$BULLET_WITH_TAB$Perte de [stress_loss_i|El][stress|El]\n$BULLET_WITH_TAB$Gain du [character_modifier|El] [GetModifier('RICE_south_ethiopia_fichee_chambalaalla_festival_modifier').GetNameWithTooltip]\n$BULLET_WITH_TAB$Possibilité d'obtenir un [character_modifier|El] #P positif#! si les gens apprécient vos conseils en tant que leader communautaire"
 activity_RICE_south_ethiopia_fichee_chambalaalla_festival_guest_desc:"\n$BULLET_WITH_TAB$Gain de [prestige_i|E][prestige|El]\n$BULLET_WITH_TAB$Gain de [piety_i|E][piety|El]\n$BULLET_WITH_TAB$Perte de [stress_loss_i|El][stress|El]"
