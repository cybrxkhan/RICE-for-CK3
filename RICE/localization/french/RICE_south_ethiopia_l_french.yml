 # Culture Stuff
 tradition_RICE_south_ethiopian_walls_name:0 "Murs Agricoles"
 tradition_RICE_south_ethiopian_walls_desc:0 "#F Cette culture construit fréquemment des murs de pierre pour retenir le sol contre l'érosion et à des fins d'irrigation. Les chefs les plus prévoyants de cette culture utilisent les techniques de construction de ces murs et les institutions sociales qui les sous-tendent pour défendre leurs frontières contre les raids et les invasions ennemies.#!"
 tradition_RICE_great_rift_valley_name:0 "Négociants de la vallée du Rift"
 tradition_RICE_great_rift_valley_desc:0 "#F Cette culture, dont les origines se situent dans le sud de l'Éthiopie, a historiquement joué un rôle d'intermédiaire entre les entités politiques de l'intérieur de l'Afrique de l'Est, les villes maritimes de la mer Indienne et de la mer Rouge et les royaumes du nord de l'Éthiopie. Les tribus et royaumes les plus puissants prélèvent souvent des tributs en biens précieux et en produits de luxe pour étendre leur influence commerciale.#!"
 innovation_RICE_enset:0 "Systèmes de culture de l'ensète"
 innovation_RICE_enset_desc:0 "#italic Enset#!, également connu sous le nom de « faux bananier », est une plante originaire du sud de l'Éthiopie. Grâce à des techniques et des méthodes ancestrales, il est possible de maximiser sa valeur en tant que plante-racine résistante à la sécheresse, qui a de nombreuses utilisations, notamment pour l'alimentation, les cordes, le tissage, les matériaux de construction, la médecine et bien d'autres encore."
 RICE_enset_decision_unlock:0 "Débloque la [decision|El] pour #V $RICE_south_ethiopia_enset_decision$#!"
 innovation_RICE_south_ethiopian_walls:0 "Murs agricoles des Hautes Terres"
 innovation_RICE_south_ethiopian_walls_desc:0 "Dans les montagnes et les vallées du sud de l'Éthiopie, les habitants construisent fréquemment des murs de pierre pour retenir le sol contre l'érosion et à des fins d'irrigation. Les dirigeants les plus prévoyants ont même utilisé ces techniques de construction de murs, et les institutions sociales qui les sous-tendent, pour défendre leurs frontières contre les raids et les invasions ennemies."
 tradition_RICE_cattle_counting_ceremonies_name:0 "Cérémonies de comptage du bétail"
 tradition_RICE_cattle_counting_ceremonies_desc:0 "#F Cette culture accorde une grande valeur économique et sociale au bétail, et ceux qui en accumulent beaucoup sont très respectés. Cette culture se caractérise par des cérémonies spéciales de comptage du bétail, telles que le #italic dala#!, #italic lika#!, et #italic gimuwa#! cérémonies, qui permettent aux membres de la communauté de prouver leur valeur et d'acquérir un statut et une renommée.#!"
 culture_parameter_unlock_rice_cattle_counting_trait:0 "Le [trait|El] Propriétaire de bétail fournit des bonus supplémentaires"
 culture_parameter_unlock_rice_cattle_counting_activity:0 "Débloque l'[activity|El] [GetActivityType( 'activity_RICE_south_ethiopia_cattle_counting_ceremony' ).GetName] pour obtenir ou améliorer les [traits|El] Propriétaire de bétail"
 culture_parameter_unlock_rice_sidama_maintain_trees:0 "Débloque la [decision|El] de #V $RICE_south_ethiopia_sidama_groves_decision$#!"
#  tradition_RICE_ayyaanto_name:0 "Ayyaanto"
#  tradition_RICE_ayyaanto_desc:0 "#F In this culture, astrologists called #italic ayyaanto#! play a major role in society through their ability to read the stars, perform various ritual divinations, and advise the elders and leaders on what to do.#!"
 tradition_RICE_halale_name:0 "Halale"
 tradition_RICE_halale_desc:0 "#F #italic Halale#!, ou vérité, est le nom du code moral au cœur des institutions religieuses, sociales et politiques de cette culture et de sa vision du monde. L'hommage aux ancêtres, la protection des arbres sacrés et les châtiments équitables ne sont que quelques aspects du #italic halale#!. Le code est interprété et appliqué par les anciens qui l'incarnent et qui méritent respect, crainte et reconnaissance.#!"
 tradition_RICE_gadaa_name:0 "Gadaa"
 tradition_RICE_gadaa_desc:0 "#F La société de cette culture est fondée sur le #italic Gadaa#!, un système d'organisation sociale reposant sur des groupes de pairs générationnels qui se succèdent tous les huit ans pour assumer les responsabilités politiques, religieuses et militaires. Ce système intègre des mécanismes de résolution des conflits, un entraînement militaire continu pour faire face à toute menace, et un encouragement à la justice.#!"
 innovation_RICE_cloth_currency:0 "Monnaie en tissu"
 innovation_RICE_cloth_currency_desc:0 "Dans de nombreuses sociétés africaines, le tissu ne sert pas seulement à rehausser le prestige et le statut d'une personne et à marquer son identité personnelle, il sert également de monnaie d'échange."
 innovation_RICE_iron_currency:0 "Monnaie de fer"
 innovation_RICE_iron_currency_desc:0 "Les barres de fer sont plus fiables comme monnaie que les blocs de sel #italic amoleh#! traditionnellement utilisés comme monnaie à travers l'Afrique de l'Est."
 culture_parameter_unlock_rice_iron_currency_innovation:0 "Cette tradition permet à une [culture|El] de débloquer l'[innovation|El] #V $innovation_RICE_iron_currency$#! à l'[era|El] $culture_era_early_medieval$"
 culture_parameter_unlock_rice_rift_valley_courtier_spawn:0 "Chances accrues de faire apparaître des [courtiers|El] de [cultures|El] est-africaines hors carte dans le [GetGeographicalRegion('RICE_south_ethiopia_region').GetName], et le [county_modifier|El] accordé pour les avoir acceptés dure deux fois plus longtemps"

 # Traits
 trait_RICE_cattle_owner_1:0 "Grand propriétaire de bétail"
 trait_RICE_cattle_owner_2:0 "Glorieux propriétaire de bétail"
 trait_RICE_cattle_owner_1_desc:0 "Ce personnage a accompli la cérémonie #italic Dala#! du comptage du bétail, prouvant qu'il possède plus d'une centaine de têtes de bétail. Il est ainsi considéré comme une personne digne et notable au sein de sa communauté."
 trait_RICE_cattle_owner_1_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] a accompli la cérémonie #italic Dala#! du Comptage du Bétail, prouvant qu'[ROOT.GetCharacter.GetSheHe] possède plus d'une centaine de têtes de bétail. [ROOT.GetCharacter.GetSheHe|U] est ainsi considéré[ROOT.GetCharacter.Custom('FR_E')] comme une personne digne et notable dans sa communauté."
 trait_RICE_cattle_owner_2_desc:0 "Ce personnage a accompli la cérémonie de comptage de bétail de #italic Lika#! qui prouve qu'il possède plus d'un millier de têtes de bétail. Avec un tel troupeau, il est l'une des personnes les plus respectées de la communauté."
 trait_RICE_cattle_owner_2_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] a accompli la cérémonie #italic Lika#! du comptage du bétail, prouvant qu'[ROOT.GetCharacter.GetSheHe] possède plus d'un millier de têtes de bétail. Avec un si grand troupeau, [ROOT.GetCharacter.GetSheHe] est l'une des personnes les plus respectées de la communauté."
#  trait_track_RICE_cattle_owner:0 "Great Cattle Owner"
#  trait_track_RICE_cattle_owner_desc:0 "To own cattle is to have power, status, and wealth. By proving the number cattle one has through cattle counting ceremonies, one can become a great person in society."
 trait_RICE_cattle_owner_spouse:0 "Parent d'un célèbre propriétaire de bétail"
 trait_RICE_cattle_owner_spouse_desc:0 "Ce personnage a accompli la cérémonie #italic Gimuwa#!. Un tel honneur est accordé à un parent d'un grand propriétaire de bétail ayant accompli les cérémonies de comptage de bétail #italic Dala#! ou #italic Lika#! pour prouver qu'il possède un troupeau de cent ou de mille têtes de bétail respectivement. Il ne lui est pas permis d'aller au marché pour acheter ou vendre des marchandises, et doit être assisté par des serviteurs dans toutes les tâches."
 trait_RICE_cattle_owner_spouse_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] a accompli la cérémonie #italic Gimuwa#!. Un tel honneur est accordé à un parent d'un grand propriétaire de bétail ayant accompli les cérémonies de comptage de bétail #italic Dala#! ou #italic Lika#! pour prouver qu'il possède un troupeau de cent ou de mille têtes de bétail respectivement. [ROOT.GetCharacter.GetSheHe|U] n'a pas le droit d'aller au marché pour acheter ou vendre des marchandises, et doit être assisté[ROOT.GetCharacter.Custom('FR_E')] par des serviteurs dans toutes les tâches."
 trait_RICE_cattle_owner:0 "$trait_RICE_cattle_owner_1$"
 trait_RICE_cattle_owner_desc:0 "$trait_RICE_cattle_owner_1_desc$"


 # Activities
 activity_RICE_south_ethiopia_cattle_counting_ceremony_host_an_a:0 "une"
 activity_RICE_south_ethiopia_cattle_counting_ceremony:0 "Cérémonie de comptage du bétail"
 activity_RICE_south_ethiopia_cattle_counting_ceremony_desc:0 "Les membres les plus méritants de la communauté sont ceux qui possèdent de grands troupeaux de bétail. La seule façon de prouver que l'on possède un tel troupeau est de procéder à une cérémonie de comptage du bétail."
 activity_RICE_south_ethiopia_cattle_counting_ceremony_selection_tooltip: "Obtenir ou améliorer le [GetTrait('RICE_cattle_owner_1').GetName( GetNullCharacter )] [trait|El]\n\n$activity_RICE_south_ethiopia_cattle_counting_ceremony_context_tooltip$"
 activity_RICE_south_ethiopia_cattle_counting_ceremony_context_tooltip:0 "#emphasis Contexte historique :#! Les Welayta, comme un certain nombre de cultures à travers le monde, accordent une grande valeur au bétail. Cela se reflète dans leurs cérémonies de comptage du bétail, qui constituent un moyen important pour les hommes welayta de se mettre en valeur et de gagner du prestige au sein de la communauté. Les principales cérémonies sont le #italic dala#!, pour le comptage d'au moins cent têtes de bétail, et le #italic lika#! qui suit, pour le comptage d'au moins mille têtes de bétail. Elles sont également associées à la cérémonie du #italic gimuwa#!, qui est tenue en l'honneur de l'épouse ou de la mère du candidat au #italic dala#! ou au #italic lika#!."
 activity_RICE_south_ethiopia_cattle_counting_ceremony_host_desc:"\n$BULLET_WITH_TAB$Gagne ou améliore le [trait|El] [GetTrait('RICE_cattle_owner_1').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$Gain de [prestige_i|E][prestige|El]\n$BULLET_WITH_TAB$Gain de [piety_i|E][piety|El]\n$BULLET_WITH_TAB$Gain de [dynasty_prestige_i|E][dynasty_prestige|El]\n$BULLET_WITH_TAB$Un [spouse|El] ou un membre de la [close_family|El] choisi du genre opposé peut gagner le [trait|El] [GetTrait('RICE_cattle_owner_spouse').GetName( GetNullCharacter )]"
 activity_RICE_south_ethiopia_cattle_counting_ceremony_guest_desc:"\n$BULLET_WITH_TAB$Gain de [prestige_i|El] [prestige|El]\n$BULLET_WITH_TAB$Gain de [piety_i|El] [piety|El]"
 activity_RICE_south_ethiopia_cattle_counting_ceremony_province_desc: ""
 activity_RICE_south_ethiopia_cattle_counting_ceremony_destination_selection: "$activity_RICE_south_ethiopia_cattle_counting_ceremony_province_desc$"
 activity_RICE_south_ethiopia_cattle_counting_ceremony_guest_help_text: "$activity_RICE_south_ethiopia_cattle_counting_ceremony$"
 activity_RICE_south_ethiopia_cattle_counting_ceremony_predicted_cost: "Le coût de cette [activity|El] dépend des [activity_options|El] que vous sélectionnez."
 activity_RICE_south_ethiopia_cattle_counting_ceremony_conclusion_desc: "Notre [GetActivityType( 'activity_RICE_south_ethiopia_cattle_counting_ceremony' ).GetName] est arrivé à son terme. Vous avez prouvé à tous la grandeur de vos troupeaux de bétail !"
 RICE_south_ethiopia_cattle_counting_ceremony_counting_phase: "Comptage"
 RICE_south_ethiopia_cattle_counting_ceremony_counting_phase_desc: "Combien y a-t-il de bovins ?"
 RICE_south_ethiopia_cattle_counting_ceremony_status_intent_header: "Statut :"
 RICE_south_ethiopia_cattle_counting_ceremony_status_intent: "Statut"
 RICE_south_ethiopia_cattle_counting_ceremony_status_intent_desc:"Vous souhaitez prouver votre valeur en tant que membre respecté de la communauté. Doublez la [dynasty_prestige_i|El] [dynasty_prestige|El] que vous gagnez grâce à votre discours pendant la cérémonie. Les personnages [GetTrait('ambitious').GetName( GetNullCharacter )|U] et [GetTrait('arrogant').GetName( GetNullCharacter )] perdront du [stress|El] supplémentaire."
 RICE_south_ethiopia_cattle_counting_ceremony_community_intent_header: "Communauté:"
 RICE_south_ethiopia_cattle_counting_ceremony_community_intent: "Communauté"
 RICE_south_ethiopia_cattle_counting_ceremony_community_intent_desc:"Vous souhaitez montrer votre générosité à tous, et pas seulement exhiber votre bétail. Gagnez #P +50%#! de [prestige_i|El] [prestige|El] et de [piety_i|El] [piety|El] de base du festin. Les personnages [GetTrait('generous').GetName( GetNullCharacter )|U] et [GetTrait('compassionate').GetName( GetNullCharacter )] perdront du [stress|El] supplémentaire."
 RICE_south_ethiopia_cattle_counting_ceremony_observation_intent_header: "Observation:"
 RICE_south_ethiopia_cattle_counting_ceremony_observation_intent: "Observation"
 RICE_south_ethiopia_cattle_counting_ceremony_observation_intent_desc: "Vous êtes ici pour observer la cérémonie de comptage du bétail."
 RICE_south_ethiopia_cattle_counting_ceremony_completed_log_title:0 "$activity_RICE_south_ethiopia_cattle_counting_ceremony$ terminée"
 RICE_south_ethiopia_cattle_counting_ceremony_completed_log:0 "[CHARACTER.GetShortUIName|U] a achevé sa Cérémonie de comptage du bétail"
 TRAVEL_NAME_FOR_activity_RICE_south_ethiopia_cattle_counting_ceremony:0 "[Character.GetFirstNamePossessiveNoTooltip] $activity_RICE_south_ethiopia_cattle_counting_ceremony$"
 RICE_special_guest_gimuwa:0 "Candidat Gimuwa"
 RICE_special_guest_gimuwa_for_host:0 "$RICE_special_guest_gimuwa$"
 RICE_special_guest_gimuwa_desc:0 "Un $RICE_special_guest_gimuwa$ est le #bold conjoint#! ou le #bold parent#! du genre opposé du propriétaire de bétail honoré lors d'un [GetActivityType( 'activity_RICE_south_ethiopia_cattle_counting_ceremony' ).GetName]. Cette personne est également honorée lors de sa propre cérémonie, le #italic Gimuwa#!. Son [opinion|El] envers l'hôte sera définitivement améliorée, et à la fin de l'[activity|El], elle recevra du [prestige_i|El] [prestige|El] ainsi que le [trait|El] [GetTrait('RICE_cattle_owner_spouse').GetName( GetNullCharacter )].\n\n#N Pour être éligible en tant que $RICE_special_guest_gimuwa$, l'invité doit être le conjoint sans terres ou le parent du genre opposé de l'hôte, et avoir au moins 30 ans.#!"
 RICE_special_guest_gimuwa_desc_for_host:0 "$RICE_special_guest_gimuwa_desc$"
 RICE_south_ethiopia_cattle_counting_ceremony_gimuwa_log_title:0 "Cérémonie de Gimuwa"
 RICE_south_ethiopia_cattle_counting_ceremony_gimuwa_log:0 "[CHARACTER.GetShortUIName|U] a obtenu le statut de #italic Gimuwa#! à la suite de la cérémonie #italic Gimuwa#!."
 RICE_south_ethiopia_cattle_counting_ceremony_speech_fair_log_title:0 "Discours"
 RICE_south_ethiopia_cattle_counting_ceremony_speech_fair_log:0 "[CHARACTER.GetShortUIName|U] a prononcé un discours acceptable vantant ses vertus et exploits, ainsi que ceux de ses ancêtres."
 RICE_south_ethiopia_cattle_counting_ceremony_speech_good_log_title:0 "Discours"
 RICE_south_ethiopia_cattle_counting_ceremony_speech_good_log:0 "[CHARACTER.GetShortUIName|U] a fait un grand discours vantant ses vertus et exploits, ainsi que ceux de ses ancêtres."
 RICE_south_ethiopia_cattle_counting_ceremony_speech_excellent_log_title:0 "Discours"
 RICE_south_ethiopia_cattle_counting_ceremony_speech_excellent_log:0 "[CHARACTER.GetShortUIName|U] a prononcé un magnifique discours vantant ses vertus et exploits, ainsi que ceux de ses ancêtres."

 RICE_south_ethiopia_cattle_counting_ceremony_dala: "Cérémonie de Dala"
 RICE_south_ethiopia_cattle_counting_ceremony_dala_desc:"$EFFECT_LIST_BULLET$ Vous obtiendrez le [trait|El] [GetTrait('RICE_cattle_owner_1').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$ Une fois la cérémonie Dala terminée, vous pourrez accomplir la Cérémonie #italic Lika#! pour obtenir le [trait|El] [GetTrait('RICE_cattle_owner_2').GetName( GetNullCharacter )] plus tard\n\n#weak En prouvant que vous possédez au moins cent têtes de bétail, vous ferez le premier pas pour devenir l'un des membres les plus éminents de la société [GetPlayer.GetCulture.GetName].#!"
 RICE_south_ethiopia_cattle_counting_ceremony_lika: "Cérémonie Lika"
 RICE_south_ethiopia_cattle_counting_ceremony_lika_desc:"$EFFECT_LIST_BULLET$ Vous obtiendrez le [trait|El] [GetTrait('RICE_cattle_owner_2').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$  Bonus accrus de [dynasty_prestige_i|El] [dynasty_prestige|El], [prestige_i|El] [prestige|El], et [piety_i|El] [piety|El] comparé à la cérémonie #italic Dala#!\n\n#weak Si vous parvenez à prouver que vous possédez au moins un millier de têtes de bétail, votre nom et celui de votre famille seront à jamais gravés dans les légendes des peuples [GetPlayer.GetCulture.GetCollectiveNoun|l].#!"
 RICE_south_ethiopia_cattle_counting_ceremony_feast_type: "Festin"
 RICE_south_ethiopia_cattle_counting_ceremony_feast_small: "Standard"
 RICE_south_ethiopia_cattle_counting_ceremony_feast_small_desc:"$EFFECT_LIST_BULLET$Gain d'un montant de base de [prestige_i|El] #V [EmptyScope.ScriptValue('RICE_south_ethiopia_cattle_counting_resource_gain_small_base')]#! [prestige|El] et [piety_i|El] #V [EmptyScope.ScriptValue('RICE_south_ethiopia_cattle_counting_resource_gain_small_base')]#! [piety|El]\n$EFFECT_LIST_BULLET$Gain de #P 5#! d'[opinion|El] de chaque [character|El] participant à cette [activity|El]\n\n#weak Il est de coutume que ceux qui assistent à la cérémonie du comptage du bétail se voient généreusement offrir un bon repas.#!"
 RICE_south_ethiopia_cattle_counting_ceremony_feast_medium: "Grand"
 RICE_south_ethiopia_cattle_counting_ceremony_feast_medium_desc:"$EFFECT_LIST_BULLET$Gain d'un montant de base de [prestige_i|El] #V [EmptyScope.ScriptValue('RICE_south_ethiopia_cattle_counting_resource_gain_medium_base')]#! [prestige|El] et [piety_i|El] #V [EmptyScope.ScriptValue('RICE_south_ethiopia_cattle_counting_resource_gain_medium_base')]#! [piety|El]\n$EFFECT_LIST_BULLET$Gain de #P 10#! d'[opinion|El] de chaque [character|El] participant à cette [activity|El]\n\n#weak C'est une occasion pour moi de mettre en valeur la communauté, donc le festin accompagnant la cérémonie de comptage du bétail doit être un festin dont on se souviendra !#!"
 RICE_south_ethiopia_cattle_counting_ceremony_feast_large: "Glorieux"
 RICE_south_ethiopia_cattle_counting_ceremony_feast_large_desc:"$EFFECT_LIST_BULLET$Gain d'un montant de base de [prestige_i|El] #V [EmptyScope.ScriptValue('RICE_south_ethiopia_cattle_counting_resource_gain_large_base')]#! [prestige|El] et [piety_i|El] #V [EmptyScope.ScriptValue('RICE_south_ethiopia_cattle_counting_resource_gain_large_base')]#! [piety|El]\n$EFFECT_LIST_BULLET$Gain de #P 15#! d'[opinion|El] de chaque [character|El] participant à cette [activity|El]\n\n#weak Tout le monde s'attend à ce que je fournisse un excellent festin après la cérémonie de comptage du bétail, mais je ne ferai pas cela. Au contraire, je dépasserai leurs attentes !#!"

 RICE_south_ethiopia_lika_ceremony: "Cérémonie Lika"
 RICE_south_ethiopia_cattle_counting_feast_amount: "Festin"

