 south_ethiopia.0090.t:0 "Les troupeaux de bétail de [courtier.GetFirstNamePossessiveNoTooltip]"
 south_ethiopia.0090.desc:0 "[courtier.GetFirstName] a récemment organisé et participé à une cérémonie traditionnelle de comptage de bétail [courtier.GetCulture.GetName], prouvant qu'[courtier.GetSheHe] possède un nombre considérable de têtes de bétail - bien plus que la moyenne pour un[courtier.Custom('FR_E')] [courtier.GetWomanMan] !\n\nCe faisant, [courtier.GetSheHe] a gagné un plus grand respect au sein de sa communauté. Même en tant que [courtier.GetFirstNamePossessiveNoTooltip] [ROOT.Char.GetTitleAsNameNoTooltip], je me dois de reconnaître ses hauts faits et son statut d'éleveu[courtier.Custom('FR_RSe')]  de bétail renommé[courtier.Custom('FR_E')] ."
 south_ethiopia.0090.a:0 "Félicitations pour cette belle réussite !"
 south_ethiopia.0090.b:0 "C'est bien, mais je suis toujours s[ROOT.Char.Custom('FR_OnA')] [ROOT.Char.GetTitleAsNameNoTooltip]."
 south_ethiopia.0090.c:0 "Vous et moi ne sommes pas très différents, n'est-ce pas ?"
 south_ethiopia.0091.t:0 "Variétés d'ensète"
 south_ethiopia.0091.desc:0 "L'ensète est une culture précieuse parmi les [ROOT.Char.GetCulture.GetCollectiveNoun|l]. Traditionnellement, nous distinguons plusieurs variétés.\n\nAujourd'hui, je rends visite à des agriculteurs locaux qui m'expliquent comment ils distinguent ces variétés. Généralement, il existe des variétés dites « mâles » et « femelles », selon qui les récolte stéréotypiquement - les hommes ou les femmes, respectivement.\n\nLes agriculteurs expliquent comment les variétés d'ensète « mâles » tendent à être plus anciennes et plus matures, plus résistantes aux maladies et aux dommages, tandis que les variétés d'ensète « femelles » tendent à être récoltées à un stade plus précoce de leur vie, et sont meilleures pour la cuisine et la consommation. Ainsi, les deux ont leurs usages pratiques."
 south_ethiopia.0091.a:0 "L'ensète « mâle » semble plus fiable à long terme."
 south_ethiopia.0091.b:0 "L'ensète « femelle » est importante pour nourrir tout le monde."
 south_ethiopia.0092.t:0 "Comité du mur [ROOT.Char.GetCulture.GetCollectiveNoun|l]"
 south_ethiopia.0092.desc:0 "Les murs [ROOT.Char.GetCulture.GetCollectiveNoun|l], autrefois utilisés uniquement à des fins agricoles, sont devenus un élément important de la stratégie défensive de mon royaume. Afin de faciliter le processus de construction des murs, nous avons traditionnellement eu recours à des comités d'anciens locaux pour organiser et gérer l'effort.\n\nQuoi qu'il en soit, aujourd'hui, je rencontre certains de ces comités locaux pour discuter de projets de construction de murs que nous entreprendrons dans un avenir proche. Quels que soient nos différends sur le processus, nous savons tous que ce travail - auquel chacun dans la communauté contribue d'une manière ou d'une autre - est absolument nécessaire."
 south_ethiopia.0092.a:0 "Passons aux choses sérieuses et discutons-en."
 south_ethiopia.0093.t:0 "Artisans impurs"
 south_ethiopia.0093.desc:0 "J'ai reçu des plaintes de la part d'habitants locaux selon lesquelles les potiers, les tanneurs et les forgerons de la région vivent trop près d'eux.\n\nDans la culture traditionnelle [ROOT.Char.GetCulture.GetName], ces gens sont impurs, car ils mangent la viande d'animaux sauvages qui ne sont pas rituellement purs et exercent des travaux qui les obligent à toucher des substances sales comme la boue, le minerai et l'obsidienne. Pour cette raison, les gens respectables et normaux doivent les éviter à tout prix.\n\nQuoi qu'il en soit, les habitants affirment que ces artisans doivent être relocalisés de force ailleurs dans la région afin de les empêcher d'empiéter sur la présence des autres."
 south_ethiopia.0093.a:0 "Très bien, délocalisez les artisans dans un autre endroit."
 south_ethiopia.0093.b:0 "Plaintes sans fondement - les artisans vivent déjà loin."
 south_ethiopia.0094.t:0 "Dannawu Baato"
 south_ethiopia.0094.desc:0 "Bien que nous, [ROOT.Char.GetCulture.GetCollectiveNoun|l], ayons traditionnellement permis et encouragé chaque personne de notre société à posséder sa propre terre, la communauté fournit également des terres communales. Appelées #italic dannawu baato#!, elles sont utilisées pour le pâturage collectif, et comme terres de réserve pour les jeunes couples ou les nouveaux venus qui n'auraient pas encore les ressources pour obtenir leur propre terre.\n\nParce que ces terres communales changent constamment, les chefs de communauté, comme moi-même, doivent se réunir en conseils de temps à autre - comme ce que je fais aujourd'hui - pour déterminer l'usage et la distribution de ces terres communales."
 south_ethiopia.0094.a:0 "Laisser les autres membres du conseil décider de ce qu'il convient de faire"
 south_ethiopia.0094.b:0 "Utiliser mon statut pour influencer les décisions des autres"
 south_ethiopia.0095.t:0 "Kocho"
 south_ethiopia.0095.desc:0 "Aujourd'hui, je savoure du #italic kocho#!, du pain préparé à partir d'enset cuit et fermenté. C'est un élément simple mais délicieux de notre cuisine [ROOT.Char.GetCulture.GetName] traditionnelle, et cela me rassasie bien, surtout accompagné de viande et d'épices."
 south_ethiopia.0095.a:0 "Un plat bon et nourrissant !"
 south_ethiopia.0096.t:0 "Planter des ensètes"
 south_ethiopia.0096.desc:0 "Récemment, certains de mes domestiques m'ont proposé de planter davantage d'ensètes autour de ma résidence. En plus d'être une bonne source de nourriture, leur capacité de survie et leur résistance à la sécheresse font d'eux des ombres fiables, des aliments de secours et un petit niveau de sécurité supplémentaire pour dissuader tout intrus potentiel."
 south_ethiopia.0096.a:0 "Bonne idée ! Allez planter des ensètes."
 south_ethiopia.0096.b:0 "Non, nous n'avons pas besoin de faire cela maintenant."
