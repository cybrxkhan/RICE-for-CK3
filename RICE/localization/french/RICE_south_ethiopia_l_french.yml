 south_ethiopia.0002.t:0 "Le mode de vie [GetFaithByKey('fandaanano').GetAdjectiveNoTooltip]"
 south_ethiopia.0002.desc:0 "Avec ses nombreuses montagnes et vallées, le [GetGeographicalRegion('RICE_south_ethiopia_region').GetName] a nourri de nombreuses communautés religieuses différentes au fil des années.\n\nCes derniers temps, l'une de ces communautés, les [GetFaithByKey('fandaanano').GetAdjective], ont émergé d'un mélange de croyances traditionnelles [GetReligionByKey('sidamic_religion').GetAdjective] et [GetReligionByKey('waaqism_religion').GetAdjective] et d'une forme d'[GetReligionByKey('islam_religion').GetName|U] pratiquée par des tribus isolées des hauts plateaux. Ils se considèrent comme semblables aux religions abrahamiques, car ils croient en un dieu suprême qu'ils appellent $fandaanano_high_god_name$, et désapprouvent ceux qu'ils appellent #italic ibge#!, ou païens.\n\nLa foi [GetFaithByKey('fandaanano').GetAdjectiveNoTooltip] naissante a trouvé un allié et un fidèle puissant en [fandaanano_creator.GetTitledFirstName]. Grâce à ses efforts, et aux prêtres [GetFaithByKey('fandaanano').GetAdjectiveNoTooltip], appelés les $fandaanano_priest_plural$, la foi commence à se répandre parmi certaines des tribus de la région."
 south_ethiopia.0002.a:0 "Louange à $fandaanano_high_god_name$ et aux bons esprits !"
 south_ethiopia.0002.b:0 "Je vois. Des nouvelles intéressantes."
 south_ethiopia.0002.c:0 "Ce nouveau mode de vie est très attrayant...."
 south_ethiopia.0003.t:0 "Le Sycomore"
 south_ethiopia.0003.desc:0 "Le figuier sycomore détient un grand pouvoir spirituel, et de grands et puissants [GetPlayer.Custom('RICE_mideast_spirit_plural')] vivraient souvent près de ces arbres. Avec des offrandes suffisantes et agréables, les [GetPlayer.Custom('RICE_mideast_spirit_plural')] qui adhèrent aux lois et coutumes [ROOT.Char.GetFaith.GetReligion.GetAdherentNamePlural|l] peuvent nous fournir des conseils en temps de besoin.\n\nAccompagné[ROOT.Char.Custom('FR_E')] par des [ROOT.Char.Custom('DefaultPriestTitlePlural')] [ROOT.Char.GetFaith.GetAdherentNamePlural|l], ma maisonnée et d'autres notables, j'ai apporté des offrandes sacrificielles à un sycomore voisin qui abriterait un [GetPlayer.Custom('RICE_mideast_spirit')] local et bienveillant. Après avoir prié [ROOT.Char.GetFaith.HighGodName], nous faisons le sacrifice, et j'implore le [GetPlayer.Custom('RICE_mideast_spirit')] de me donner conseil et aide concernant..."
 south_ethiopia.0003.a:0 "[diplomacy_i|E] L'honneur"
 south_ethiopia.0003.b:0 "[martial_i|El] La guerre"
 south_ethiopia.0003.c:0 "[stewardship_i|E] La richesse"
 south_ethiopia.0003.d:0 "[intrigue_i|E] Les relations"
