 south_ethiopia.0060.t:0 "Décider de la date"
 south_ethiopia.0060.desc:0 "Le temps est bientôt venu de célébrer #italic Fichee-Chambalaalla#!, le Nouvel An traditionnel [ROOT.Char.GetFaith.GetReligion.GetAdherentName]. Les #italic ayyaanto#!, nos astrologues les plus compétents, ont observé les mouvements de la lune et des cinq étoiles de la constellation #italic buusa#! pour déterminer la meilleure date pour la célébration de cette année.\n\nUne fois que les #italic ayyaanto#! ont décidé de la date choisie, moi-même et d'autres dirigeants et anciens importants de la communauté nous sommes réunis pour discuter de l'organisation de l'événement. Une fois que nous avons fini de discuter de la manière de procéder pour les festivités de cette année, nous nous rendons chacun au marché de nos établissements respectifs. Là, nous accrochons une peau de mouton à une longue lance, et proclamons la date du #italic Fichee-Chambalaalla#! de cette année à toute la communauté."
 south_ethiopia.0060.a:0 "Que tout le monde se prépare pour le #italic Fichee-Chambalaalla#!!"
 south_ethiopia.0061.t:0 "Jeûne"
 south_ethiopia.0061.desc:0 "#italic Fichee-Chambalaalla#! approche. Cependant, certains rituels doivent d'abord être observés.\n\nPendant une période de quinze jours avant #italic Fichee#!, le dernier jour de l'année, moi et les autres dirigeants et anciens devons jeûner pendant quinze jours. Le jeûne sera rompu neuf jours avant #italic Fichee#!, après quoi nous chanterons et danserons le #italic safote ketaala#!."
 south_ethiopia.0061.a:0 "Il est temps de commencer le jeûne."
 south_ethiopia.0062.t:0 "Huluuka"
 south_ethiopia.0062.desc:0 "Enfin, aujourd'hui est le jour où nous célébrons #italic Fichee#!! Cela commence par la cérémonie du #italic Huluuka#!, où nous érigeons une sorte d'arche faite d'arbres devant notre résidence. Tous les membres de ma maisonnée, et tout mon bétail, doivent passer dessous - en commençant par moi, bien sûr.\n\nAlors que nous accueillons la nouvelle année, nous nous rappelons de renoncer à toutes les mauvaises choses de l'année passée, et d'entrer dans la nouvelle année avec des pensées nouvelles et positives."
 south_ethiopia.0062.a:0 "Ayez des pensées positives !"
 south_ethiopia.0063.t:0 "Festin"
 south_ethiopia.0063.desc:0 "Le soir du #italic Fichee#!, ma maisonnée et moi nous rassemblons pour un grand festin. La pièce maîtresse du festin est un plat que nous appelons #italic buurisame#!, préparé à base d'enset, de lait et de beurre, et servi sur un plat en argile appelé #italic shaafeeta#!.\n\nEn tant que personne de haut rang, j'ai l'honneur de lancer le festin en prononçant des bénédictions tout en dispersant un peu de nourriture sur le sol. Ce faisant, nous rendons grâce à la terre pour une telle nourriture.\n\nUne fois que nous en avons mangé, nous nous rendons dans les maisons de nos proches, une par une, et partageons la nourriture."
 south_ethiopia.0063.a:0 "Puissions-nous tous vivre ainsi dans la paix et l'harmonie."
 south_ethiopia.0064.t:0 "Kawaalanka"
 south_ethiopia.0064.desc:0 "Le matin suivant le #italic Fichee#!, et le premier véritable jour de la nouvelle année, est appelé #italic Kawaalanka#!, et c'est en ce jour que nous tenons la grande cérémonie du #italic Chambalaalla#!.\n\nJe mène ma maisonnée pour nous laver à l'eau chaude et nous frotter de beurre. Alors que le soleil s'élève lentement dans le ciel, les enfants du village voisin se promènent, comme le veut la tradition, pour souhaiter joyeusement un bon anniversaire à tous, en disant : « #italic Ayidde Chambalaalla !#! »\n\nEn retour, nous répondons par des paroles positives, souhaitant aux enfants de longues années de vie, et leur offrant davantage de #italic buursame#!."
 south_ethiopia.0064.a:0 "Passons maintenant aux autres événements principaux."
 south_ethiopia.0065.t:0 "Conseils à la Communauté"
 south_ethiopia.0065.desc:0 "#italic Chambalaalla#!, et la semaine qui suit, sont remplis de nombreux événements. Il y a le rituel consistant à nourrir le bétail avec un sol salé appelé #italic boole#!, par exemple. Il y a aussi de nombreux types de danses qui sont exécutées, en particulier #italic Keetaala#!, qui servent d'occasion aux jeunes célibataires de se rencontrer et de trouver des époux potentiels.\n\nQuoi qu'il en soit, c'est pendant le chant et la danse du #italic Keetaala#!, lorsque tout le monde se rassemble dans le #italic gudumaale#!, l'espace de rassemblement public, pour s'asseoir et recevoir des bénédictions de ma part, le chef local. J'ai préparé de nombreux mots de conseil à adresser à la communauté cette année, sur la manière dont nous pouvons promouvoir les bonnes actions et nous empêcher de commettre de mauvaises actions."
 south_ethiopia.0065.a:0 "J'espère que tout le monde prendra mes conseils à cœur."
 south_ethiopia.0065.tooltip:0 "Si votre conseil est bien reçu, le [character_modifier|El] que vous recevrez sera influencé par vos [skills|El]."
 south_ethiopia.0065.a.bad.toast:0 "Conseil peu inspirant"
 south_ethiopia.0065.a.bad:0 "Votre conseil reçoit un accueil tiède."
 south_ethiopia.0065.a.good.toast:0 "Conseil inspirant"
 south_ethiopia.0065.a.good:0 "Vos conseils sont accueillis favorablement."
 south_ethiopia.0066.t:0 "Fichii-Fulo"
 south_ethiopia.0066.desc:0 "Hélas, toute bonne chose a une fin, et le #italic Fichee-Chambalaalla#! touche également à sa fin avec le #italic Shaashiga#!, un type spécial de danse #italic Keetala#!. Cela fait partie de la cérémonie de clôture spéciale, le #italic Fichii-fulo#!, où tout le monde se rassemble pour chanter et danser.\n\nEnfin, les anciens nous bénissent et concluent l'ensemble de l'événement en proclamant : « Longue vie au #italic Fichee#! »"
 south_ethiopia.0066.a:0 "Et ainsi commence la Nouvelle Année !"
