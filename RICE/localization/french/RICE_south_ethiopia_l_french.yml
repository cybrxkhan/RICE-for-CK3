 south_ethiopia.0010.t:0 "Le vagabond [courtier.GetCulture.GetNameNoTooltip]"
 south_ethiopia.0010.base:0 "Les terres de l'intérieur de l'Afrique de l'Est abritent de nombreuses tribus et royaumes liés par des liens d'ascendance et de commerce.\n\nUn[courtier.Custom('FR_E')] [courtier.GetWomanMan] d'extraction [courtier.GetCulture.GetName|l], nommé[courtier.Custom('FR_E')]  [courtier.GetFirstName], est arrivé[courtier.Custom('FR_E')]  dans mes terres en espérant que je l'accueillerai en tant que membre de ma cour. [courtier.GetSheHe|U] possède de précieux liens avec ses semblables restés dans sa patrie, ce qui pourrait s'avérer utile.\n\n"
 south_ethiopia.0010.desc:0 "$south_ethiopia.0010.base$Les [courtier.GetCulture.GetCollectiveNoun|l] sont un groupe de tribus divisées vivant dans les hauts plateaux près de la rivière Omo et au nord du lac Turkana. Ils sont nombreux et désunis, mais sont tout à fait capables en tant que guerriers, éleveurs et commerçants dans cette région - des compétences qui pourraient nous être grandement bénéfiques."
 south_ethiopia.0010.a:0 "Oui, vous êtes [courtier.Custom('FR_LeLa')] bienvenu[courtier.Custom('FR_E')] ici !"
 south_ethiopia.0010.b:0 "Non, nous n'y voyons aucun avantage."
 south_ethiopia.0011.t:0 "$south_ethiopia.0010.t$"
 south_ethiopia.0011.desc:0 "$south_ethiopia.0010.base$Les tribus [courtier.GetCulture.GetNameNoTooltip]s occupent une vaste étendue de territoire au sud du lac Turkana. Elles sont connues pour leurs compétences en art et en construction, et jouent un rôle important dans la facilitation des routes commerciales dans ces terres ; trouver des amis parmi elles pourrait grandement nous bénéficier."
 south_ethiopia.0011.a:0 "$south_ethiopia.0010.a$"
