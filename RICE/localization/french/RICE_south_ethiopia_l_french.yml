 south_ethiopia.0020.t:0 "Keeroo Gallasa"
 south_ethiopia.0020.desc.intro:0 "Dans les communautés [ROOT.Char.GetCulture.GetNameNoTooltip]s, ceux qui possèdent beaucoup de bétail sont estimés, mais seulement s'ils passent par les cérémonies appropriées de comptage du bétail.\n\n"
 south_ethiopia.0020.desc.dala:0 "Comme c'est la première fois que j'organise une cérémonie de comptage du bétail, il faut que ce soit une cérémonie #italic  dala#! pour prouver que j'ai au moins une centaine de bêtes. Même si j'en ai beaucoup plus, ce rituel doit être le premier."
 south_ethiopia.0020.desc.lika:0 "J'ai accompli la cérémonie du #italic dala#!, où j'ai prouvé que je possédais au moins une centaine de têtes de bétail. Maintenant, il est temps pour moi d'accomplir la cérémonie du #italic lika#!, pour prouver que je possède au moins un millier de têtes de bétail."
 south_ethiopia.0020.desc:0 "\n\nAujourd'hui est le #italic Keeroo Gallasa#!, ou jour du marquage, une fête qui sert de prélude à la cérémonie du comptage du bétail qui suivra. J'ai invité famille, amis, voisins, anciens estimés et d'autres personnalités importantes pour discuter de nos plans pour l'occasion, marquer toutes les propriétés pertinentes que je possède et décider d'une date. Certains de ceux qui ont été invités pour ce jour ont promis certaines ressources ou richesses pour m'aider lors de la cérémonie du comptage du bétail."
 south_ethiopia.0020.a:0 "Leur aide est très appréciée."
 south_ethiopia.0021.t:0 "Préparations"
 south_ethiopia.0021.desc.dala:0 "Aujourd'hui, c'est le jour de la #italic dala#! cérémonie, où je prouverai que je possède au moins une centaine de bovins !"
 south_ethiopia.0021.desc.lika:0 "La cérémonie du #italic lika#! commence aujourd'hui, et je prouverai à tous que je possède au moins un millier de têtes de bétail !"
 south_ethiopia.0021.desc:0 "J'enfile les vêtements blancs que la tradition m'impose de porter et je me prépare aux événements de la journée.\n\nMes bêtes sont amenées le long de la route principale du village, vers un enclos sacré. Même les bêtes que j'ai prêtées à d'autres sont rassemblées ici pour l'occasion, à l'exception des bêtes enceintes ou malades, qui sont représentées par des cordes spéciales.\n\nUne foule nombreuse s'y est rassemblée, ajoutant à l'agitation et à l'excitation, car tout le monde attend avec impatience le début de la cérémonie festive."
 south_ethiopia.0021.a:0 "Le compteur de bétail devrait arriver bientôt..."
 south_ethiopia.0022.t:0 "Le Molana arrive"
 south_ethiopia.0022.desc:0 "La personne qui compte le bétail est appelée le #italic Molana#!. Mon #italic Molana#! choisi, un[ROOT.Char.Custom('FR_E')] [ROOT.Char.GetWomanMan] âgé[ROOT.Char.Custom('FR_E')] local[ROOT.Char.Custom('FR_E')] estimé[ROOT.Char.Custom('FR_E')], est arrivé[ROOT.Char.Custom('FR_E')], portant un tissu spécial appelé #italic kole#!, et tenant une feuille qu'[ROOT.Char.GetSheHe] utilisera pour compter le bétail.\n\nNous regardons tous le #italic molana#! immerger la feuille dans un pot contenant un mélange de sang de mouton et de bœuf, de lait, de beurre et de miel, avant qu'[ROOT.Char.GetSheHe] ne rassemble le bétail dans l'enclos pour le comptage.  [ROOT.Char.GetSheHe|U] attache ensuite des morceaux de métal autour du cou d'une vache et d'un taureau appartenant à la première race de vache que j'aie jamais possédée."
 south_ethiopia.0022.a:0 "Bien, bien!"
 south_ethiopia.0023.t:0 "Préparation du discours"
 south_ethiopia.0023.desc:0 "Tandis que le #italic molana#! est occupé à compter le bétail, je me prépare pour la prochaine étape importante de la cérémonie du comptage du bétail. Des hommes et des femmes à cheval tournent autour de l'enclos en mon honneur, m'incitant à prononcer un grand discours, comme le veut la tradition. Ce discours sera le moment où je pourrai véritablement convaincre les autres de ma grandeur.\n\nPrenant une profonde inspiration, je me dresse sur mon cheval et regarde vers la foule."
 south_ethiopia.0023.a:0 "Très bien - faisons-le."
 south_ethiopia.0023.a.fair:0 "Votre discours est assez bien accueilli."
 south_ethiopia.0023.a.good:0 "Votre discours est bien accueilli."
 south_ethiopia.0023.a.excellent:0 "Votre discours a reçu un excellent accueil."
 south_ethiopia.0024.t:0 "Le Discours"
 south_ethiopia.0024.desc:0 "Alors que je me tiens debout sur un cheval, usant d'un langage stylisé pour exalter mes glorieux exploits et mes nombreuses vertus, ainsi que ceux de mes ancêtres, de ma famille, de mes amis qui m'ont soutenu. Peu peuvent m'égaler en sagesse, en richesse et en réalisations, proclamé-je, tandis que je fais de mon mieux pour prouver à la foule présente que je suis un héros vivant à imiter.\n\nPendant ce temps, en parallèle de mon discours, ma famille et mes amis prononcent leurs propres louanges à mon égard et des louanges à [ROOT.Char.GetFaith.HighGodName] à des moments stratégiques, pour renforcer davantage mon discours.\n\nÀ en juger par la réaction de la foule,"
 south_ethiopia.0024.desc.fair:0 "ils ont vu de meilleures vantardises lors de cérémonies de comptage de bétail. Malgré tout, même si certains trouvent cela fade, je ferai de mon mieux pour honorer ma personne, ma famille et mes amis !"
 south_ethiopia.0024.desc.good:0 "tout le monde apprécie mon discours et mes fanfaronnades. Ils applaudissent à tout rompre, et à chaque mot, je vois leur respect pour moi s'accroître."
 south_ethiopia.0024.desc.excellent:0 "Les gens sont très impressionnés et enthousiasmés par mes fanfaronnades. Avec des applaudissements nourris et des visages pleins d'admiration, ils me considèrent vraiment comme une sorte de héros !"
 south_ethiopia.0024.a:0 "Ma gloire sera connue de tous !"
 south_ethiopia.0025.t:0 "Huluko"
 south_ethiopia.0025.desc:0 "Contrairement à la cérémonie #italic dala#!, la cérémonie #italic lika#! comporte un événement supplémentaire et crucial appelé le rituel #italic huluko#!, qui se déroule après le comptage du bétail.\n\nPrès de l'enclos, de grands trous ont été creusés en forme de petit tunnel. Ce tunnel est rempli de lait, de beurre et de miel. Puis, tenant une lance, j'abats une vache et un mouton, et leur sang est ajouté dans les trous.\n\nEnsuite, je me déshabille jusqu'à mes sous-vêtements et nage à travers ce tunnel rempli de ces liquides, assisté par mes parents et amis. Une fois que j'en émerge, sous de grandes acclamations, je tiens la lance et parle une fois de plus de mes hauts faits."
 south_ethiopia.0025.a:0 "En faisant cela, ne suis-je pas comme les héros d'autrefois ?"
 south_ethiopia.0026.t:0 "Festin"
 south_ethiopia.0026.desc.dala:0 "Après que le #italic Molana#! a prouvé que je possède au moins une centaine de bovins, le #italic dala#!"
 south_ethiopia.0026.desc.lika:0 "Après que le #italic Molana#! a prouvé que je possède au moins un millier de têtes de bétail, le #italic lika#!"
 south_ethiopia.0026.desc:0 "la cérémonie se conclut par un festin ! Après tout, à quoi bon me vanter ou compter le bétail, si je ne peux pas montrer à quel point je suis riche et sage, en payant un festin pour tout le monde ?\n\nLe festin met en avant la viande de plusieurs des bovins qui viennent d'être comptés, fraîchement abattus et cuisinés. Il y a aussi de nombreux autres plats et boissons, comme du pain fait à partir d'ensète, la viande d'autres animaux, et bien plus encore.\n\nPendant le festin, sans surprise, tout le monde parle de moi, et la musique et la danse mettent tout le monde de bonne humeur, les encourageant à être tout aussi accomplis que moi."
 south_ethiopia.0026.a:0 "Puissiez-vous tous apprendre de mes actes et de mes vertus."
 south_ethiopia.0027.t:0 "Conclusion"
 south_ethiopia.0027.desc.dala:0 "La #italic dala#!"
 south_ethiopia.0027.desc.lika:0 "La cérémonie #italic lika#!"
 south_ethiopia.0027.desc:0 "est terminée. Bien qu'elle ne puisse avoir lieu qu'une seule fois dans ma vie, ce fut un honneur et une occasion excitante, et je suis sûr que mes ancêtres sourient en me regardant. De plus, il est agréable de savoir que je serai le sujet de conversation de la ville, en bien, pendant un certain temps."
 south_ethiopia.0027.a:0 "Quelle belle occasion !"
