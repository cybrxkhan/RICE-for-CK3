 south_ethiopia.0040.t:0 "Guliya-Gosha"
 south_ethiopia.0040.desc:0 "Les astronomes et les sages anciens nous ont récemment informés que, selon le calendrier lunaire [ROOT.Char.GetFaith.GetAdherentName], il est bientôt temps pour notre célébration traditionnelle du nouvel an, #italic #bold Gifaataa#!#!.\n\nLes préparatifs sont bien avancés, à commencer par la cérémonie du #italic guliya-gosha#! ou cérémonie de l'arbre lié. Parce que #italic Gifaataa#! est un temps de paix et de joie, chacun doit faire de son mieux pour chasser toute négativité persistante dans son cœur - moi y compris !\n\nTrès bientôt, toute la communauté se rassemblera pour cette occasion festive."
 south_ethiopia.0040.a:0 "Ce prochain #italic Gifaataa#! sera très amusant !"
 south_ethiopia.0041.t:0 "Shuha-Woga"
 south_ethiopia.0041.desc:0 "Aujourd'hui, c'est #italic Shuha-Woga#!, le premier jour de l'année, et #italic Gifaataa#! a commencé !\n\nTout le monde dans la communauté locale, même un[ROOT.Char.Custom('FR_E')] grand[ROOT.Char.Custom('FR_E')] [ROOT.Char.GetTitleAsNameNoTooltip] comme moi, s'est réuni pour cette célébration. Avec une nouvelle année vient un esprit renouvelé et un corps revigoré, car nous faisons tous de notre mieux pour avoir une bonne attitude et encourager la paix entre nous. Les mauvaises pensées, les mauvaises activités et les mauvaises relations appartiendront au passé.\n\nPour aider à cultiver cet esprit d'harmonie et de bonheur, on dit que de bons esprits visitent chaque foyer pendant cette période pour s'assurer que chaque famille a de la nourriture."
 south_ethiopia.0041.a:0 "Une nouvelle année, un nouveau moi ! Il est temps de rester positif !"
 south_ethiopia.0042.t:0 "Gollo-Igeta"
 south_ethiopia.0042.desc:0 "Le #italic Gifaataa#! de cette année s'est achevé avec la cérémonie du #italic Gollo-Igeta#!. À ce stade, les bons esprits qui ont rendu visite à chaque foyer devraient être partis ou partiront bientôt, car on dit qu'ils restent 35 jours, jusqu'à ce qu'ils soient satisfaits de savoir qu'une famille a suffisamment de nourriture.\n\nNous nous rassemblons tous pour la cérémonie d'adieu, au cours de laquelle nous allumons des torches et les lançons autour de nous en dansant joyeusement. Assurément, chacun ressent cette énergie positive, et nous pourrons la porter en nous pour le reste de l'année."
 south_ethiopia.0042.a:0 "Que la nouvelle année soit bonne pour tous."
 south_ethiopia.0043.t:0 "Échange de cadeaux"
 south_ethiopia.0043.desc:0 "Lors du festival #italic Gifaataa#!, on est censé offrir des cadeaux aux autres, allant de bijoux raffinés à de beaux vêtements et bien plus encore. J'ai déjà préparé mes cadeaux pour tout le monde, bien sûr, et je reçois mes propres cadeaux en retour.\n\nUne telle tradition, nous disent les anciens, est importante pour renforcer les relations existantes et en favoriser de nouvelles. Une société n'est rien sans des relations harmonieuses entre tous ceux qui la composent, après tout."
 south_ethiopia.0043.a:0 "Merci pour les cadeaux !"
 south_ethiopia.0044.t:0 "Nourriture et boisson"
 south_ethiopia.0044.desc:0 "#italic Gifaataa#! est toujours une bonne occasion de festoyer et de se réjouir, et cette fois ne fait pas exception !\n\nJe consomme des quantités copieuses de mets traditionnels servis lors de #italic Gifaataa#! comme le beurre, le miel, le bœuf, la pâte d'enset cuite, et l'#italic asho#!, une sorte de viande crue."
 south_ethiopia.0044.a:0 "Délicieux !"
 south_ethiopia.0045.t:0 "Réconciliation"
 south_ethiopia.0045.desc:0 "Durant le #italic Gifaataa#!, les gens sont encouragés à se réconcilier. En tant que [ROOT.Char.GetTitleAsNameNoTooltip], je profite de ce moment pour servir de médiateur entre deux habitants qui entretenaient depuis longtemps une rivalité notoire, faite de conflits et de haine.\n\nÀ présent, ils se sont réunis pour se réconcilier au nom de la paix et de l'harmonie. C'est difficile, mais je parviens à les aider à enterrer la hache de guerre."
 south_ethiopia.0045.a:0 "Voilà le véritable esprit du #italic Gifaataa#!."
 south_ethiopia.0046.t:0 "Chant et Danse"
 south_ethiopia.0046.desc:0 "De nombreuses personnes se rassemblent habituellement sur le terrain du #italic gaziyaa#! pour danser et chanter. Cet espace est dédié à de telles réjouissances durant le #italic Gifaataa#!, et tout le monde passe un merveilleux moment à jouer des instruments, chanter des chansons joyeuses et danser pour oublier leurs soucis."
 south_ethiopia.0046.a:0 "Je devrais y participer !"
 south_ethiopia.0046.b:0 "Je vais rester en arrière et observer."
 south_ethiopia.0047.t:0 "Discussions"
 south_ethiopia.0047.desc:0 "Lors du #italic Gifaataa#!, il est traditionnel que les jeunes de la région se rassemblent dans un champ connu sous le nom de #italic gaziyaa#!, des espaces de chants et de danses, pour non seulement chanter et danser, mais aussi pour discuter des importants problèmes sociaux et politiques du moment. Ce faisant, ils peuvent aborder les problèmes communs auxquels notre communauté est confrontée et les moyens de les résoudre, ainsi que la manière de régler les conflits en cours au sein de la communauté."
 south_ethiopia.0047.desc.youth:0 "\n\nÉtant moi-même un jeune, je suis également impliqué dans ces discussions, et je fais de mon mieux pour apprendre des autres et comprendre leurs points de vue, même si je ne suis pas d'accord. Quelles que soient nos opinions, c'est aussi une excellente occasion de tisser des liens."
 south_ethiopia.0047.a:0 "C'est un bon moyen d'améliorer notre communauté."
 south_ethiopia.0048.t:0 "Rembourser ses dettes"
 south_ethiopia.0048.desc:0 "Parce que #italic Gifaataa#! est un temps dédié à la paix, à l'harmonie et à la réconciliation, c'est aussi une période où beaucoup de gens essaient de rembourser leurs dettes.\n\nIl n'y a pas si longtemps, j'ai prêté de l'argent et des ressources à un roturier local, et aujourd'hui, il souhaite me les rembourser dans l'esprit de #italic Gifaataa#!."
 south_ethiopia.0048.a:0 "Merci de me rendre la pareille."
 south_ethiopia.0048.b:0 "S'il vous plaît, permettez-moi d'effacer votre dette."
 south_ethiopia.0049.t:0 "Se réformer soi-même"
 south_ethiopia.0049.desc:0 "#italic Gifaataa#! est un temps pour se tourner vers l'avenir avec optimisme et espoir, et pour cette raison, beaucoup de gens essaient de tourner une nouvelle page et de changer leurs mauvaises habitudes ou de se réformer.\n\nUn habitant local, connu pour ses manières terribles, affirme qu'il se réformera et deviendra une meilleure personne désormais. Il se consacrera à honorer les valeurs et la morale qui nous sont chères à tous, et à prêter attention à ce que [ROOT.Char.GetFaith.HighGodName] voudrait que nous fassions."
 south_ethiopia.0049.a:0 "Je suis sceptique quant à leur sincérité."
 south_ethiopia.0049.b:0 "Je suis sûr qu'ils réussiront dans leur entreprise !"
 south_ethiopia.0050.t:0 "Perspectives de mariage"
 south_ethiopia.0050.desc:0 "Il n'y a pas de meilleur moment pour chercher des partenaires potentiels pour le mariage que le #italic Gifaataa#!. Pendant cette période, j'ai remarqué que de nombreux jeunes et leurs familles se rencontrent pour socialiser, dans le but de trouver des maris et des épouses convenables et, en certaines occasions, même de commencer officiellement à arranger de tels mariages."
 south_ethiopia.0050.a:0 "Nos familles continueront à s'épanouir et à prospérer."
 south_ethiopia.0051.t:0 "La sagesse des anciens"
 south_ethiopia.0051.desc:0 "Nous ne serions pas là où nous en sommes sans nos anciens, et les anciens des générations précédentes. Des occasions comme #italic Gifaataa#! sont un moment important pour nous de rencontrer les anciens et d'apprendre d'eux.\n\nJe suis actuellement assis lors d'une telle réunion, où beaucoup d'entre nous se sont rassemblés autour de quelques anciens locaux. Ces vieux hommes et femmes sages nous transmettent leur savoir et leur sagesse, avec l'espoir que nous en ferons bon usage."
 south_ethiopia.0051.a:0 "Ils nous ont fourni de nombreuses informations précieuses."
