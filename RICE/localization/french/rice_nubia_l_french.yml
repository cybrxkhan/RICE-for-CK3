 nubia.0140.t:0 "Les Esclaves Évadés"
 nubia.0140.desc:0 "C'était une journée ordinaire alors que je traitais un flot interminable de paperasserie bureaucratique, gérant la frontière de Nubie et d'Égypte en tant qu'[Glossary( 'éparque de Nobatie', 'LORD_OF_THE_MOUNTAIN_GLOSS' )].\n\nLa monotonie fut interrompue par [teniellasi.GetTitledFirstName], qui m'approcha avec une affaire de la plus haute importance : deux de ses esclaves se sont enfuis, et [teniellasi.GetSheHe] a de bonnes raisons de soupçonner que ces fugitifs ont fui dans des territoires gérés par mon subordonné, [mena.GetFirstName].\n\n[teniellasi.GetFirstNameNoTooltip] me supplie de faire quelque chose ; non seulement cette perte de propriété lui nuit, mais cela me fait aussi mauvaise figure. En tant que principal officiel sur la frontière, il est de mon devoir de surveiller le trafic frontalier et d'appréhender les criminels et individus suspects. Si les esclaves s'échappent en Égypte et causent des troubles ou sont soupçonnés d'être des espions, cela pourrait aussi provoquer un incident diplomatique avec mon homologue, le [Glossary( 'Gouverneur d\\'Assouan', 'GOVERNOR_OF_ASWAN_GLOSS' )], [aswan_governor.GetFirstName]."
 nubia.0140.a:0 "Que mes scribes rédigent immédiatement une lettre à [mena.GetFirstName] !"
 nubia.0140.b:0 "Je n'ai pas les ressources pour gérer davantage de paperasse."
 nubia.0140.info:0 "#emphasis Contexte historique :#! De tous les offices que nous connaissons dans la Nubie médiévale, celui qui est le mieux attesté dans les sources documentaires après celui du roi makourite est peut-être celui des [Glossary( 'éparques de Nobatie', 'LORD_OF_THE_MOUNTAIN_GLOSS' )], qui géraient la frontière nord de la Nubie avec l'Égypte et le [RICE_baqt|El] du côté nubien. Marianos ou Marianou était l'Éparque de Nobatie possiblement à la fin des années 1000, attesté dans quelques documents.\n\nCette chaîne d'événements est une reconstitution spéculative d'un incident mentionné dans une lettre de Marianos qu'il envoya à son vice-éparque, Mena, par l'intermédiaire de son [Glossary( 'archinotarios', 'NOTARIOS_GLOSS' )] Angelosinkouda, pour localiser et capturer deux esclaves en fuite appartenant à un homme nommé Teniellasi. Nous ne savons pas ce qui s'est passé ensuite, ni grand-chose sur les personnes impliquées (bien qu'un autre document, portant les noms de plusieurs esclaves, puisse être lié à cette lettre).\n\nEn somme, cette lettre, malgré sa nature apparemment insignifiante, est une petite fenêtre sur la société nubienne médiévale, une société où l'esclavage était normal, où les documents écrits étaient couramment utilisés pour de nombreuses choses, et où les officiels avaient des devoirs bureaucratiques à accomplir."
 nubia.0141.t:0 "Qui sera le messager ?"
 nubia.0141.desc:0 "Mes scribes ont fini de rédiger une lettre à [mena.GetTitledFirstName] au sujet de ses esclaves en fuite. S'ils se trouvent quelque part en [GetTitleByKey('c_qurta').GetNameNoTier], j'espère que [mena.GetFirstNameNoTooltip] fera ses preuves et résoudra cette situation rapidement, avec discrétion, avant que les esclaves ne traversent la frontière et ne causent potentiellement des problèmes en [GetGeographicalRegion('ghw_region_egypt').GetName] également.\n\nMaintenant, je dois décider qui envoyer porter cette lettre à [mena.GetFirstNameNoTooltip]. Bien que je puisse envoyer un messager ordinaire, [angelosinkouda.GetTitledFirstName] a proposé de s'en charger. Envoyer quelqu'un qui #italic n'est pas#! un simple officier subalterne soulignerait à [mena.GetFirstNameNoTooltip] l'urgence de la situation… Si tant est que je croie même qu'elle soit urgente.\n\nAprès tout, j'ai #italic bien des#! priorités en tant qu'[Glossary( 'éparque de Nobatie', 'LORD_OF_THE_MOUNTAIN_GLOSS' )]."
 nubia.0141.a:0 "Envoyer un membre de mon personnel habituel pour gérer cela."
 nubia.0141.a.tooltip:0 "Vous enverrez un modeste messager en [target_province.GetName] pour remettre la lettre, #N réduisant#! les chances que [mena.GetFirstName] réussisse."
 nubia.0141.b:0 "[angelosinkouda.GetFirstNameNoTooltip], partez avec cette lettre - ne me décevez pas !"
 nubia.0141.b.tooltip:0 "[angelosinkouda.GetFirstName] va voyager en [target_province.GetName] pour remettre la lettre, #P augmentant#! les chances que [mena.GetFirstName] réussisse."
 nubia.0142.t:0 "Perdu dans la communication"
 nubia.0142.desc:0 "#italic Qu'est-ce que cela signifie ?#!\n\nJ'ai appris que la lettre que j'ai envoyée à [mena.GetFirstName] au sujet de ses esclaves en fuite n'est pas arrivée correctement pour une raison quelconque. Quel genre de personnel est-ce que j'emploie ? J'espère sincèrement ne pas avoir à perdre du temps à les contrôler.\n\nLa question la plus urgente, cependant, est d'informer [teniellasi.GetFirstNameNoTooltip] du fait que ses esclaves se sont définitivement enfuis à présent, en raison de notre lenteur à répondre à cette affaire. [teniellasi.GetSheHe|U] ne sera #italic pas#! satisfait[teniellasi.Custom('FR_E')] du tout."
 nubia.0142.a:0 "Hum…. Alors [teniellasi.GetFirstNameNoTooltip], à propos de vos esclaves…."
 nubia.0143.t:0 "xxxxx"
 nubia.0143.desc:0 "xxxxx"
 nubia.0143.a:0 "xxxxx"
 nubia.0144.t:0 "Un message de l'Éparque"
 nubia.0144.desc.courtier:0 "[angelosinkouda.GetFirstName], l'un de mes collègues officiels en [GetTitleByKey('d_nobatia').GetName],"
 nubia.0144.desc.messenger:0 "Un messager au service des officiels de [GetTitleByKey('d_nobatia').GetName],"
 nubia.0144.desc:0 "vient d'arriver portant une lettre de notre supérieur, le [Glossary( 'Seigneur de la Montagne et Éparque de Nobatie', 'LORD_OF_THE_MOUNTAIN_GLOSS' )], [marianos.GetFirstName].\n\nLa lettre, semble-t-il, concerne une affaire urgente que [marianos.GetFirstNameNoTooltip] veut que j'examine. J'ai d'autres devoirs à accomplir en tant que [ROOT.Char.GetTitleAsNameNoTooltip], mais si mon supérieur dit que c'est urgent, alors c'est urgent."
 nubia.0144.a:0 "Bon, de quoi s'agit-il au juste ?"
 nubia.0145.t:0 "Lettre de [marianos.GetFirstNamePossessiveNoTooltip]"
 nubia.0145.desc:0 "Je commence à lire la lettre, qui s'ouvre par :\n\n#italic Avec [marianos.GetFaith.HighGodName]. Je vous salue et vous informe : Attrapez les esclaves fugitifs de [teniellasi.GetFirstNameNoTooltip] et envoyez-lui ces esclaves triomphalement. Moi, l'[Glossary( 'archinotarios', 'NOTARIOS_GLOSS' )], salue et rends hommage à [mena.GetFirstNameNoTooltip], chaltularios.#!\n\nLa lettre contient également des informations supplémentaires sur l'apparence et les noms des esclaves pour m'aider dans mes recherches. Si je me souviens bien, ce [teniellasi.GetFirstNameNoTooltip] est un notable local en [GetTitleByKey('d_nobatia').GetName], sans compter que les esclaves évadés pourraient traverser en [GetGeographicalRegion('ghw_region_egypt').GetName] et causer des problèmes. Et pourtant, j'ai d'autres devoirs importants que je dois prioriser…."
 nubia.0145.a:0 "Je m'occuperai de ce problème… « un jour »."
 nubia.0145.a.tooltip:0 "Vous envoyez une lettre à [marianos.GetFirstNameNoTooltip], déclarant formellement que vous vous occuperez de cette affaire, mais il sera clair que vous la traiterez comme une priorité basse et ne la résoudrez probablement jamais."
 nubia.0145.b:0 "Il est temps de partir à la chasse à l'homme pour capturer des esclaves."
 nubia.0145.b.tooltip:0 "Vous envoyez une lettre à [marianos.GetFirstNameNoTooltip], déclarant formellement que vous vous occuperez de cette affaire, et soulignez que vous en ferez une haute priorité et que les esclaves #italic seront#! retrouvés."
 nubia.0146.opening:0 "Avec [mena.GetFaith.HighGodName], je vous salue et vous informe :"
 nubia.0146.desc:0 "J'ai bien reçu votre lettre. Je capturerai les esclaves fugitifs appartenant à [teniellasi.GetFirstName], mais mes ressources sont limitées. Il me faudra peut-être du temps pour y parvenir, car j'ai d'autres priorités en ce moment."
 nubia.0146.a:0 "Il n'y a... aucune chance qu'[mena.GetSheHe] rattrape un jour les esclaves, n'est-ce pas ?"
 nubia.0147.opening:0 "$nubia.0146.opening$"
 nubia.0147.desc:0 "J'ai reçu votre lettre. Je capturerai les esclaves fugitifs appartenant à [teniellasi.GetFirstName], et je consacrerai toutes les ressources possibles à cette affaire. J'en ferai une haute priorité."
 nubia.0147.a:0 "Bien. Ne me déçois pas, [mena.GetFirstNameNoTooltip]."
 nubia.0147.a.tooltip:0 "[mena.GetFirstNameNoTooltip] lancera la traque, et vous attendrez les bonnes nouvelles."
 nubia.0148.t:0 "Allocation des ressources"
 nubia.0148.desc:0 "Les officiels frontaliers comme moi-même gèrent des problèmes comme la capture de fugitifs en permanence, des simples esclaves tentant de fuir vers la liberté aux chefs de bandits et rebelles de plus haut profil.\n\nJ'ai promis à [marianos.GetFirstName] que je ferai de ses des esclaves en fuite ma priorité, mais qu'est-ce que cela signifiera concrètement en termes de ressources dont je dispose ?\n\nCe n'est pas comme si je pouvais réellement consacrer #italic toutes#! les ressources à ma disposition à la recherche de ces esclaves. J'ai encore d'autres tâches administratives à accomplir, certaines tout aussi urgentes."
 nubia.0148.a:0 "Consacrer une quantité raisonnable de ressources à cette affaire."
 nubia.0148.b:0 "Faisons tout ce qui est en notre pouvoir, quoi qu'il en coûte, pour retrouver ces esclaves !"
 nubia.0148.failure:0 "Vous échouez à localiser et capturer les esclaves"
 nubia.0148.success:0 "Vous parvenez à localiser et capturer les esclaves"
 nubia.0149.t:0 "Échec : les esclaves fugitifs se sont échappés"
 nubia.0149.desc:0 "Nous avons passé trop de temps à essayer de rechercher les esclaves de [teniellasi.GetTitledFirstNamePossessive], et j'en suis venu à contrecœur à la conclusion que ces esclaves sont probablement loin à présent.\n\n[marianos.GetFirstName] sera probablement mécontent de l'évasion réussie de ces esclaves, au mieux, car c'est son devoir en tant que [Glossary( 'Seigneur de la Montagne', 'LORD_OF_THE_MOUNTAIN_GLOSS' )] de surveiller notre frontière nord. Je n'ai d'autre choix que de l'informer de cet échec, mais je me demande si je suis à blâmer…"
 nubia.0149.a:0 "En tant que [mena.GetTitleAsNameNoTooltip], je dois prendre mes responsabilités."
 nubia.0149.b:0 "Mes subordonnés m'ont fait défaut et sont les seuls à blâmer !"
 nubia.0149.tooltip:0 "[mena.GetTitledFirstNameNoTooltip] sera informé[mena.Custom('FR_E')] de votre échec."
 nubia.0150.t:0 "$nubia.0149.t$"
 nubia.0150.desc.intro:0 "J'ai reçu une lettre de [mena.GetTitledFirstName] aujourd'hui concernant ses progrès au sujet des esclaves de [teniellasi.GetTitledFirstNamePossessive]."
 nubia.0150.desc:0 "Hélas, [mena.GetSheHe] rapporte que les esclaves n'ont pas pu être retrouvés, et qu'ils sont probablement hors de notre juridiction à présent.\n\n"
 nubia.0150.desc.blame_others:0 "[mena.GetFirstNameNoTooltip], fait intéressant, affirme que la faute revient principalement à ses subordonnés, et qu'ils n'ont pas fait un travail correct en essayant de localiser les esclaves. Je me demande si c'est vrai, ou si [mena.GetFirstNameNoTooltip] essaie de rejeter la faute sur autrui."
 nubia.0150.desc.blame_self:0 "[mena.GetFirstNameNoTooltip], fait intéressant, s'est entièrement blâmé[mena.Custom('FR_E')] [mena.Custom('FR_LuiElle')]-même pour cet échec, et non ses subordonnés. [mena.GetSheHe|U] dit que rétrospectivement, son incapacité à consacrer des ressources et à diriger l'effort correctement a mené à ce résultat. Je suppose que je dois lui reconnaître le mérite de son sens des responsabilités."
 nubia.0150.desc.conclusion:0 "\n\nCependant, aussi frustrant que cela soit pour moi, [teniellasi.GetFirstNameNoTooltip] sera sans doute encore plus contrarié[teniellasi.Custom('FR_E')] par cette nouvelle. Cela dit, bien que ce soit techniquement une affaire concernant sa propriété privée, j'ai envisagé de [teniellasi.GetHerHim] compenser financièrement pour cette perte afin de lui remonter le moral."
 nubia.0150.a:0 "Tant pis. Je ne suis pas une œuvre de charité."
 nubia.0150.b:0 "[teniellasi.GetHerHim] dédommager est le moins que je puisse faire."
 nubia.0151.t:0 "Retrouvé par miracle"
 nubia.0151.desc:0 "Excellente nouvelle !\n\nJ'ai appris qu'avant même que la lettre que j'ai envoyée à [mena.GetFirstName] au sujet de ses esclaves en fuite de ne l'atteigne, mes officiers ailleurs étaient sur le point de localiser et capturer les esclaves. J'ai rapidement rédigé une lettre à [mena.GetFirstNameNoTooltip] pour l'informer de ces nouveaux développements, et qu'[mena.GetSheHe] n'a plus besoin de dépenser des ressources à ce sujet."
 nubia.0151.a:0 "[teniellasi.GetFirstNameNoTooltip], j'ai de bonnes nouvelles à vous annoncer !"
 nubia.0152.t:0 "Réussite : Esclaves fugitifs capturés"
 nubia.0152.desc:0 "Enfin ! Mes officiers ont localisé et capturé les esclaves fugitifs appartenant à [teniellasi.GetFirstName], juste avant qu'ils ne puissent s'échapper au-delà de la frontière.\n\n[slave_1.GetFirstName] et [slave_2.GetFirstName] sont leurs noms, et ils correspondent aux informations que [marianos.GetTitledFirstName] a fournies dans sa lettre. Lorsqu'ils sont amenés devant moi, cependant, ils implorent comme on pouvait s'y attendre ma clémence, et tentent de faire appel à mon sens de la compassion. Mais la réalité est dure ; les esclaves sont des esclaves, et ils sont la propriété de [teniellasi.GetFirstNamePossessiveNoTooltip], sans compter que j'ai un travail à accomplir.\n\nMes subordonnés attendent mes ordres sur la marche à suivre, et les esclaves m'observent avec crainte, se demandant quelle sera ma décision quant à leur sort."
 nubia.0152.a:0 "Fuyez. Fuyez avant que je ne change d'avis. Ne revenez jamais !"
 nubia.0152.b:0 "Je rachèterai votre liberté, si vous vous installez ici."
 nubia.0152.c:0 "Mon travail est de vous ramener tous les deux à votre propriétaire."
 nubia.0153.t:0 "$nubia.0149.t$"
 nubia.0153.desc:0 "Étrangement, [mena.GetFirstNameNoTooltip] a réussi à capturer les esclaves, mais ils se sont à nouveau échappés et sont désormais hors de notre juridiction.\n\nC'est décevant, mais j'ai le sentiment que quelque chose ne colle pas tout à fait dans le rapport de [mena.GetFirstNamePossessive]. Les détails de l'évasion des esclaves semblent suspects, et certains de mes autres officiers ont indiqué que [mena.GetFirstNameNoTooltip] a peut-être été trop laxiste dans la surveillance des esclaves. Il est impossible qu'[mena.GetSheHe] ait volontairement facilité leur évasion… n'est-ce pas ?\n\nEh bien, je mettrai ces incohérences sur le compte d'une tentative de [mena.GetFirstNameNoTooltip] de minimiser son échec. Bien que je doive [mena.GetHerHim] réprimander plus tard, ma première préoccupation est d'informer [teniellasi.GetFirstNameNoTooltip] de ce qui s'est passé."
 nubia.0154.t:0 "Réussite... Plus ou moins ?"
 nubia.0154.desc:0 "[mena.GetFirstNameNoTooltip] a bien capturé les esclaves, mais l'histoire prend une tournure étrange quoique acceptable.\n\nPour une raison quelconque, [mena.GetFirstNameNoTooltip] a eu assez pitié de ces deux esclaves pour acheter leur liberté et les laisser s'installer sur ses terres. [teniellasi.GetFirstNameNoTooltip] a accepté cela à contrecœur, car [teniellasi.GetSheHe] est au moins compensé[teniellasi.Custom('FR_E')] pour la perte de propriété, et pourrait probablement acheter de meilleurs esclaves avec l'argent."
 nubia.0154.a:0 "Je suppose que tout est bien qui finit bien ?"
 nubia.0155.t:0 "$nubia.0152.t$"
 nubia.0155.desc:0 "Ma confiance en [mena.GetFirstNameNoTooltip] était bien placée, car les esclaves, liés et enchaînés, sont arrivés avec la lettre : [mena.GetSheHe] a réussi à les capturer, comme [mena.GetSheHe] l'avait promis.\n\nJe regarde avec satisfaction tandis que je convoque [teniellasi.GetFirstNameNoTooltip] pour lui transmettre la bonne nouvelle et lui restituer sa propriété.\n\nNotre travail ici en tant qu'officiels de la frontière est peut-être plein de frustrations et de revers, mais nous avons aussi de nombreux succès, comme aujourd'hui."
 nubia.0155.a:0 "Voilà qui est réglé !"
 nubia.0156.t:0 "xxxxx"
 nubia.0156.desc:0 "xxxxx"
 nubia.0156.a:0 "xxxxx"
