 RICE_baqt_frontier_report_name:"#Bold Envoyer un rapport aux supérieurs#!"
 RICE_baqt_frontier_report_desc: "$RICE_baqt_frontier_report_name$"
 RICE_baqt_frontier_report_tooltip:"#italic La frontière entre l'Égypte et la Nubie se trouve souvent loin des centres de pouvoir, il est donc crucial que les dirigeants de la capitale soient informés de ce qui se passe dans cette région afin qu'ils puissent déterminer des politiques géopolitiques efficaces.#!"
 RICE_baqt_frontier_report_success_1_tt:"#P Amélioration#! de l'[opinion_i|El] [opinion|El] de votre [liege|El] et possiblement même un don d'[gold_i|El] [gold|El] de sa part"
 RICE_baqt_frontier_report_success_2_tt:"Gain de [legitimacy_i|El] [legitimacy|El]"
