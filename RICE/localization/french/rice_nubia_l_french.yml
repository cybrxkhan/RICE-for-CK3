 RICE_nubia_keeper_of_granaries_1187:0 "Gardien des Greniers"
 RICE_nubia_keeper_of_granaries_1187_desc:0 "Ce personnage, à un moment de sa carrière, a acquis le titre de [Glossary( 'shoung', 'SHOUNG_GLOSS' )], le Gardien des Greniers, en Makurie."
 RICE_nubia_sunt_boats_character:0 "Bateaux Sunt"
 RICE_nubia_sunt_boats_character_desc:0 "Ce personnage a fait appel aux services de construction navale de villageois du Nil réputés pour la qualité de leurs navires fabriqués en bois de [Glossary( 'sunt', 'SUNT_GLOSS' )]. Cela facilitera le déplacement de leurs troupes le long du grand fleuve."
 RICE_nubia_sunt_boats_county:0 "Industrie navale de Sunt"
 RICE_nubia_sunt_boats_county_desc:0 "Les dirigeants locaux soutiennent les constructeurs de navires qui vivent dans cette partie du Nil, car ils sont réputés pour la qualité de leurs navires fabriqués en bois de [Glossary( 'sunt', 'SUNT_GLOSS' )]. Nombre de ces navires sont utilisés pour la pêche le long du Nil."
 RICE_nubia_scribes_studying_nubian:0 "Scribes étudiant le nubien"
 RICE_nubia_scribes_studying_coptic:0 "Scribes étudiant l'égyptien"
 RICE_nubia_scribes_studying_greek:0 "Scribes étudiant le grec"
 RICE_nubia_scribes_studying_arabic:0 "Scribes étudiant l'arabe"
 RICE_nubia_prefers_byzantine_clothing:0 "Préfère la mode byzantine"
 RICE_nubia_prefers_byzantine_clothing_desc:0 "Ce personnage nubien préfère la mode inspirée des styles qui étaient ou sont prédominants dans l'Empire byzantin, en raison de l'influence que les Byzantins ont eue sur la Nubie il y a longtemps."
 RICE_nubia_prefers_indigenous_clothing:0 "Préfère la mode nubienne autochtone"
 RICE_nubia_prefers_indigenous_clothing_desc:0 "Ce personnage nubien préfère une mode basée sur des styles plus indigènes, qui gagnent en popularité par contraste avec l'ancien style d'influence byzantine."
 RICE_nubia_similar_fashion_preferences:0 "Préférences vestimentaires similaires"
 RICE_nubia_dissimilar_fashion_preferences:0 "Préférences vestimentaires divergentes"
 RICE_nubia_encouraging_era_of_hegira:0 "Accepter l'usage de l'ère de l'Hégire par les scribes"
 RICE_nubia_encouraging_era_of_hegira_desc:0 "Ce dirigeant, qui n'est pas ou n'était pas musulman, accepte que certains de ses scribes utilisent l'[Glossary( 'Ère de l\\'Hégire', 'ERA_OF_THE_HEGIRA_GLOSS' )] pour le calcul des dates dans leurs documents."
 RICE_nubia_discouraging_era_of_hegira:0 "Décourager l'usage de l'ère de l'Hégire par les scribes"
 RICE_nubia_discouraging_era_of_hegira_desc:0 "Ce dirigeant décourage ses scribes non-musulmans d'utiliser l'[Glossary( 'Ère de l\\'Hégire', 'ERA_OF_THE_HEGIRA_GLOSS' )] pour le calcul des dates dans leurs documents."
 RICE_nubia_respects_local_spirits:0 "Respecte les esprits locaux"
 RICE_nubia_disrespects_local_spirits:0 "Provoque les esprits locaux"
 RICE_nubia_generous_to_commoners:0 "Généreux envers les roturiers"
 RICE_nubia_encouraging_monks_away_from_farming:0 "Encourager les moines à délaisser l'agriculture"
 RICE_nubia_encouraging_monks_away_from_farming_desc:0 "Ce personnage prend à cœur les paroles de [Glossary( 'Abba Poemen', 'ABBA_POEMEN_GLOSS' )] telles que trouvées dans les [Glossary( 'Sayings of the Desert Fathers', 'SAYINGS_OF_THE_DESERT_FATHERS_GLOSS' )], et encourage les moines chrétiens à délaisser l'agriculture et autres métiers matériels afin d'éviter la tentation et de se concentrer sur les affaires spirituelles."
 RICE_nubia_red_brick_mounds:0 "Anciennes buttes en briques rouges découvertes"
 RICE_nubia_raphael_inspiration_spiritual:0 "Inspiré spirituellement par Saint Raphaël"
 RICE_nubia_raphael_inspiration_enemies:0 "Inspiré par Saint Raphaël pour combattre les ennemis"
 RICE_nubia_cynical_ruler:0 "Montrant du scepticisme religieux"
 RICE_nubia_interested_in_foreign_art:0 "Intérêt pour l'art étranger"
 RICE_nubia_oikonomos_modifier:0 "Ancien oikonomos"
 RICE_nubia_oikonomos_modifier_desc:0 "Ce personnage avait à l'origine un passé en tant qu'[Glossary( 'oikonomos', 'OIKONOMOS_GLOSS' )] dans un monastère chrétien en Nubie."
 RICE_nubia_saint_epimachos_devotee:0 "Dévoué à Saint Epimachos"
 RICE_nubia_saint_epimachos_devotee_desc:0 "Ce personnage puise sa force dans son dévouement à [Glossary( 'Saint Epimachos', 'SAINT_EPIMACHOS_GLOSS' )], qui est largement vénéré en Nubie."
 RICE_nubia_freed_me:0 "M'a affranchi"
 RICE_nubia_kept_me_enslaved:0 "A refusé de m'affranchir"
 RICE_nubia_encouraged_my_religiosity:0 "A encouragé mes objectifs religieux"
 RICE_nubia_soulou_political:0 "Soulou : Affaires politiques"
 RICE_nubia_soulou_political_desc:0 "Ce personnage utilise le [Glossary( 'soulou', 'SOULOU_GLOSS' )] qu'il emploie pour traiter les messages politiquement sensibles."
 RICE_nubia_soulou_personal:0 "Soulou : Affaires personnelles"
 RICE_nubia_soulou_personal_desc:0 "Ce personnage utilise le [Glossary( 'soulou', 'SOULOU_GLOSS' )] qu'il emploie pour traiter les affaires personnelles avec plus de discrétion."
 RICE_nubia_soulou_correspondence:0 "Soulou : Correspondance efficace"
 RICE_nubia_soulou_correspondence_desc:0 "Ce personnage utilise le [Glossary( 'soulou', 'SOULOU_GLOSS' )] qu'il emploie pour correspondre et communiquer avec les autres plus rapidement et efficacement."
 RICE_nubia_hermits_in_ancient_tomb:0 "Ermites chrétiens ayant réutilisé une tombe ancienne"
 RICE_nubia_helped_christian_hermits:0 "A soutenu les ermites chrétiens"
 RICE_nubia_accused_of_being_slave:0 "Accusé d'être esclave"
 RICE_nubia_accused_of_being_slave_desc:0 "Ce personnage africain affirme qu'il est une personne libre qui a été kidnappée et réduite en esclavage par des esclavagistes en Égypte, mais il est difficile de dire si cette histoire est vraie ou s'il s'agit d'un esclave qui prétend l'être."
 RICE_nubia_inspired_by_saint_hilaria:0 "Inspirée par Sainte Hilaria"
 RICE_nubia_inspired_by_saint_hilaria_desc:0 "L'histoire de [Glossary( 'Saint Hilaria', 'SAINT_HILARIA_GLOSS' )] a grandement inspiré cette femme dans sa foi."
 RICE_nubia_enjoying_ful_medames:0 "Apprécie le Ful Medames"
 RICE_nubia_enjoying_ful_medames_desc:0 "Ce personnage a pris l'habitude de savourer chaque matin un délicieux bol de [Glossary( 'ful medames', 'FUL_MEDAMES_GLOSS' )]."
 RICE_nubia_ancient_pottery_workshops:0 "Soutien aux ateliers de poterie anciens"
 RICE_nubia_encountered_an_ablemba:0 "A rencontré un Ablemba"
 RICE_nubia_encountered_an_ablemba_desc:0 "Ce personnage affirme qu'il est récemment tombé sur un [Glossary( 'ablemba', 'ABLEMBA_GLOSS' )] près de vieilles ruines en Nubie. Une telle rencontre avec des esprits surnaturels maléfiques l'a laissé, au mieux, troublé."
 RICE_nubia_archers_emulating_ancestors:0 "Imitation des Frappeurs de Pupilles"
 RICE_nubia_archers_emulating_ancestors_desc:0 "Ce personnage encourage les archers à son service à imiter les exploits légendaires des générations précédentes d'archers nubien."
 RICE_nubia_archers_discourage_foreigners:0 "Histoires des redoutables Frappeurs de Pupilles"
 RICE_nubia_archers_discourage_foreigners_desc:0 "Ce personnage utilise des histoires sur les exploits légendaires des générations précédentes d'archers nubien pour dissuader les ennemis de piller ou d'attaquer leurs terres."
 RICE_nubia_respects_powerful_women:0 "Respecte les femmes puissantes"
 RICE_nubia_respects_powerful_women_desc:0 "Depuis aussi longtemps que l'on se souvienne, les chrétiens nubien comme ce personnage ont grandement vénéré les femmes, croyant qu'elles possèdent une sorte de sainteté semblable à celle de la Vierge Marie."
 RICE_nubia_protective_pots:0 "Pots protecteurs"
 RICE_nubia_protective_pots_desc:0 "Un certain nombre de pots dans le foyer de ce personnage portent les noms d'anges et de saints chrétiens tels que [Glossary( 'Raphael', 'ARCHANGEL_RAPHAEL_GLOSS' )] et [Glossary( 'Epimachos', 'SAINT_EPIMACHOS_GLOSS' )], car on croit que de telles mesures les protégeront du mal, tant mondain que surnaturel."
 RICE_nubia_very_protective_pots:0 "Pots très protecteurs"
 RICE_nubia_very_protective_pots_desc:0 "La plupart, sinon la totalité, des pots dans le foyer de ce personnage portent les noms d'anges et de saints chrétiens tels que [Glossary( 'Raphael', 'ARCHANGEL_RAPHAEL_GLOSS' )] et [Glossary( 'Epimachos', 'SAINT_EPIMACHOS_GLOSS' )], car on croit que de telles mesures les protégeront du mal, tant mondain que surnaturel."
 RICE_nubia_saqia_dispute_opinion:0 "Dispute au sujet d'une Saqia"
 RICE_nubia_investing_in_local_saqia:0 "Investissement dans les Saqias locales"
 RICE_nubia_investing_in_local_saqia_desc:0 "Ce personnage a investi des ressources dans une ou plusieurs [Glossary( 'saqias', 'SAQIA_GLOSS' )] locales."
 RICE_nubia_learning_about_nile_seasons:0 "Apprentissage des saisons du Nil"
 RICE_nubia_learning_about_nile_seasons_desc:0 "Ce personnage a récemment acquis des connaissances sur la manière dont les saisons influencent la vie sur le Nil, par exemple comment la [Glossary( 'saison froide', 'NUBIA_COLD_SEASON_2_GLOSS' )] peut affecter les routes commerciales le long du fleuve."
 RICE_nubia_sayings_of_the_desert_fathers_political:0 "Inspiré politiquement par les Paroles des Pères du Désert"
 RICE_nubia_sayings_of_the_desert_fathers_political_desc:0 "Ce personnage a récemment été inspiré en lisant les [Glossary( 'Paroles des Pères du Désert', 'SAYINGS_OF_THE_DESERT_FATHERS_GLOSS' )]. Il essaie d'appliquer ses leçons dans sa vie politique."
 RICE_nubia_sayings_of_the_desert_fathers_spiritual:0 "Inspiré spirituellement par les Paroles des Pères du Désert"
 RICE_nubia_sayings_of_the_desert_fathers_spiritual_desc:0 "Ce personnage a récemment été inspiré en lisant les [Glossary( 'Paroles des Pères du Désert', 'SAYINGS_OF_THE_DESERT_FATHERS_GLOSS' )]. Il essaie de s'améliorer spirituellement en conséquence."
 RICE_nubia_learning_about_gossi_grain_silos:0 "Apprentissage des silos à grains de Gossi"
 RICE_nubia_learning_about_gossi_grain_silos_desc:0 "Ce personnage a récemment acquis des connaissances sur les soi-disant $innovation_RICE_gossi_grain_silos$, comment ces silos en terre sont construits et comment ils peuvent améliorer l'agriculture et le stockage des aliments."
 RICE_nubia_fellow_raphael_devotee:0 "Camarade dévot de Saint Raphaël"
 RICE_nubia_enthusiastic_saint_raphael_devotee:0 "Dévot enthousiaste de Saint Raphaël"
 RICE_nubia_enthusiastic_saint_raphael_devotee_desc:0 "Ce personnage prie avec ferveur [Glossary( 'Saint Raphaël', 'ARCHANGEL_RAPHAEL_GLOSS' )], ce qu'il croit avoir amélioré sa santé de manière miraculeuse, ou, du moins, empêché sa santé de se détériorer davantage s'il n'est pas en bonne santé."
 RICE_nubia_casual_saint_raphael_devotee:0 "Dévot occasionnel de Saint Raphaël"
 RICE_nubia_casual_saint_raphael_devotee_desc:0 "Ce personnage prie plus que la plupart des gens [Glossary( 'Saint Raphaël', 'ARCHANGEL_RAPHAEL_GLOSS' )], mais pas au point d'en devenir obsédé. Il croit que cela a eu des effets positifs légers mais tangibles sur sa santé."
 RICE_nubia_buried_infant_under_servants_quarters:0 "Enterré un nourrisson sous les quartiers des serviteurs"
 RICE_nubia_buried_infant_under_servants_quarters_desc:0 "Lorsqu'un des bébés de leurs serviteurs est décédé, ce personnage a laissé le parent en deuil enterrer le bébé sous les quartiers des serviteurs, suivant une vieille coutume locale, car on croit que cela réconfortera l'esprit de l'enfant et augmentera les chances de conception des mères. Cependant, tout le monde n'est pas à l'aise avec cette idée."
 RICE_nubia_drinking_karkade:0 "Aime boire du Karkadé"
 RICE_nubia_drinking_karkade_desc:0 "Dernièrement, ce personnage s'assure toujours de boire un peu de [Glossary( 'karkade', 'KARKADE_GLOSS' )] la plupart des jours."
 RICE_nubia_enjoys_making_karkade:0 "Aime préparer du Karkadé"
 RICE_nubia_enjoys_making_karkade_desc:0 "Ce personnage aime rejoindre ses serviteurs pour préparer du [Glossary( 'karkade', 'KARKADE_GLOSS' )], que cela convienne ou non à quelqu'un de son rang, simplement parce qu'il apprécie tellement cette boisson."
 RICE_opinion_sibir_festival:0 "Grand festival de Sibir"
 RICE_nubia_drank_holy_texts:0 "A bu les Textes Sacrés"
 RICE_nubia_drank_holy_texts_desc:0 "Ce personnage a récemment participé à un rituel africain consistant à boire de l'encre utilisée pour écrire des versets de textes religieux."

 # Modifiers - Nile River
 RICE_nile_pastoralists_positive_modifier:0 "Relations améliorées avec les agro-pasteurs du Nil"
 RICE_nile_pastoralists_positive_modifier_desc:0 "Les communautés agraires locales le long de cette partie de la [RICE_nile_river|El] ont développé une attitude plus accueillante et amicale envers leurs voisins plus pastoraux dans cette région."
 RICE_nile_pastoralists_positive_modifier_enhanced:0 "Relations grandement améliorées avec les agro-pasteurs du Nil"
 RICE_nile_pastoralists_positive_modifier_enhanced_desc:0 "Les communautés agraires locales le long de cette partie de la [RICE_nile_river|El] ont développé une attitude sans précédent, plus accueillante et amicale envers leurs voisins plus pastoralistes de cette région, menant à une plus grande prospérité pour tous."
 RICE_nile_pastoralists_negative_modifier:0 "Relations tendues avec les agro-pasteurs du Nil"
 RICE_nile_pastoralists_negative_modifier_desc:0 "Les communautés agraires locales le long de cette partie de la [RICE_nile_river|El] ont adopté une attitude lasse, voire antagoniste, envers leurs voisins plus pastoraux dans cette région."
 RICE_nile_farmers_positive_modifier:0 "Relations améliorées avec les fermiers du Nil"
 RICE_nile_farmers_positive_modifier_desc:0 "Les communautés agro-pastorales locales le long de cette partie de la [RICE_nile_river|El] se sont consacrées à protéger et aider leurs voisins plus agraires dans cette région."
 RICE_nile_farmers_positive_modifier_enhanced:0 "Relations grandement améliorées avec les agro-cultivateurs du Nil"
 RICE_nile_farmers_positive_modifier_enhanced_desc:0 "Les communautés agro-pastorales locales le long de cette partie de la [RICE_nile_river|El] font preuve d'un niveau de dévouement sans précédent pour protéger et aider leurs voisins plus agraires dans cette région, ce qui mène à une plus grande prospérité pour tous."
 RICE_nile_farmers_negative_modifier:0 "Relations tendues avec les fermiers du Nil"
 RICE_nile_farmers_negative_modifier_desc:0 "Les communautés agro-pastorales locales le long de cette partie de la [RICE_nile_river|El] ont tendance à exploiter et piller leurs voisins plus agraires dans cette région."
 RICE_nubia_expanded_nile_irrigation_networks:0 "Développer les réseaux d'irrigation du Nil"
 RICE_nubia_expanded_nile_irrigation_networks_desc:0 "Les communautés locales emploient des technologies éprouvées typiquement utilisées en Nubie, telles que la [Glossary( 'saqia', 'SAQIA_GLOSS' )] et certaines méthodes de creusement de canaux d'irrigation, pour étendre la portée des eaux du Nil."
 RICE_nubia_maintained_hafirs:0 "Entretien des Hafirs"
 RICE_nubia_maintained_hafirs_desc:0 "Les communautés locales construisent de nouveaux [Glossary( 'hafirs', 'HAFIR_GLOSS' )], ou, plus probablement, agrandissent ceux déjà existants (dont certains sont très anciens) pour s'assurer qu'il y ait toujours un bon approvisionnement en eau dans cette région.\n\n#EMP $RICE_nubia_agriculture_decision_hafir_effect_tooltip_1$#!"
 RICE_nubia_imported_cattle:0 "Importation de bétail non nubien"
 RICE_nubia_imported_cattle_desc:0 "Les communautés locales importent des races étrangères de bétail afin d'offrir une plus grande variété de bovins dans cette région, contrastant avec les anciennes races de bétail nubiennes."
 RICE_nubia_bred_cattle:0 "Élevage de bétail nubien"
 RICE_nubia_bred_cattle_desc:0 "Les communautés locales consacrent des ressources à l'élevage de plus en plus important de leurs types de bétail existants, qui ont toujours occupé une place prépondérante dans la société nubienne."
 RICE_nubia_grew_pig_herds:0 "Élevage de troupeaux de porcs"
 RICE_nubia_grew_pig_herds_desc:0 "Les communautés locales augmentent le nombre de porcs dans leurs colonies, car ils constituent une source de nourriture populaire après le bétail, en particulier parmi les classes inférieures."

 # Modifiers - Baqt
 RICE_baqt_textiles_modifier:0 "Textiles"
 RICE_baqt_textiles_modifier_desc:0 "Ce personnage a reçu des textiles d'Égypte sous forme de lin, de vêtements de luxe, de tapis, etc., dans le cadre d'un accord selon les stipulations du [RICE_baqt|El]."
 RICE_baqt_foodstuffs_modifier:0 "Denrées alimentaires"
 RICE_baqt_foodstuffs_modifier_desc:0 "Ce personnage a reçu des denrées alimentaires d'Égypte telles que du blé, des lentilles et des légumes, dans le cadre d'un accord selon les stipulations du [RICE_baqt|El]."
 RICE_baqt_olive_oil_modifier:0 "Huile d'olive"
 RICE_baqt_olive_oil_modifier_desc:0 "Ce personnage a reçu de l'huile d'olive d'Égypte, qu'elle ait été produite là-bas ou ailleurs en Méditerranée, dans le cadre d'un accord selon les stipulations du [RICE_baqt|El]."
 RICE_baqt_wine_modifier:0 "Vin"
 RICE_baqt_wine_modifier_desc:0 "Ce personnage a reçu du vin d'Égypte, dont une grande partie importée de loin, dans le cadre d'un accord selon les stipulations du [RICE_baqt|El]."
 RICE_baqt_glass_modifier:0 "Verre"
 RICE_baqt_glass_modifier_desc:0 "Ce personnage a reçu du verre d'Égypte, qu'il y ait été fabriqué ou ailleurs, dans le cadre d'un accord selon les stipulations du [RICE_baqt|El]."
 RICE_baqt_horses_modifier:0 "Chevaux"
 RICE_baqt_horses_modifier_desc:0 "Ce personnage a reçu des chevaux d'Égypte dans le cadre d'un accord selon les stipulations du [RICE_baqt|El]."
 RICE_baqt_exotic_beasts_modifier:0 "Bêtes exotiques"
 RICE_baqt_exotic_beasts_modifier_desc:0 "Ce personnage a reçu des bêtes exotiques de Nubie, capturées principalement dans des terres plus au sud, au cœur de l'Afrique, dans le cadre d'un accord selon les stipulations du [RICE_baqt|El]."
 RICE_baqt_metals_modifier:0 "Métaux"
 RICE_baqt_metals_modifier_desc:0 "Ce personnage a reçu des métaux de Nubie, tels que de l'or, du minerai et des gemmes provenant des mines locales, dans le cadre d'un accord selon les stipulations du [RICE_baqt|El]."
 RICE_baqt_ebony_modifier:0 "Ébène"
 RICE_baqt_ebony_modifier_desc:0 "Ce personnage a reçu de l'ébène de Nubie, provenant des forêts plus au sud au cœur de l'Afrique, dans le cadre d'un accord selon les stipulations du [RICE_baqt|El]."
 RICE_baqt_slaves_modifier:0 "Esclaves"
 RICE_baqt_slaves_modifier_desc:0 "Ce personnage a reçu des esclaves de Nubie, capturés lors de raids et de guerres à travers l'Afrique, dans le cadre d'un accord selon les stipulations du [RICE_baqt|El]."
 RICE_baqt_ivory_modifier:0 "Ivoire"
 RICE_baqt_ivory_modifier_desc:0 "Ce personnage a reçu de l'ivoire de Nubie, prélevé sur des éléphants dans les terres plus au sud, au cœur de l'Afrique, dans le cadre d'un accord selon les stipulations du [RICE_baqt|El]."
 RICE_baqt_animal_skins_modifier:0 "Peaux d'animaux"
 RICE_baqt_animal_skins_modifier_desc:0 "Ce personnage a reçu des peaux d'animaux de Nubie, qu'elles aient été prélevées sur des animaux là-bas ou plus au sud en Afrique, dans le cadre d'un accord selon les stipulations du [RICE_baqt|El]."
 RICE_opinion_baqt_correspondence_good:0 "Bonne correspondance en tant que gouverneurs frontaliers"
 RICE_opinion_baqt_correspondence_bad:0 "Mauvaise correspondance en tant que gouverneurs frontaliers"
 RICE_opinion_baqt_land_sales_good:0 "Succès dans la collaboration sur les ventes de terres frontalières"
 RICE_opinion_baqt_land_sales_bad:0 "Problèmes lors de la collaboration sur les ventes de terres frontalières"
 
 # Struggle Ending Decisions
 
 # Decisions

 RICE_east_african_tattoo_decision:0 "Recevoir un tatouage apotropaïque"
 RICE_east_african_tattoo_decision_tooltip:0 "Ces tatouages religieux me protégeront du mal"
 RICE_east_african_tattoo_decision_desc:0 "Les [ROOT.Char.GetFaith.GetAdherentNamePlural] [ROOT.Char.GetCulture.GetName|l] se font couramment de petits tatouages protecteurs, souvent en forme de symboles sacrés, tels que la [ROOT.Char.GetFaith.ReligiousSymbol]. Je devrais me faire un tel tatouage."
 RICE_east_african_tattoo_decision_effect_tooltip_1:1 "xxxxx"
 RICE_east_african_tattoo_decision_confirm:0 "Il est temps de se faire tatouer !"
 RICE_east_african_tattoo_decision_context_tooltip:0 "#emphasis Contexte historique :#! Les tatouages religieux ont été importants dans de nombreuses régions du Nord-Est de l'Afrique depuis l'Antiquité, de l'Égypte ancienne à l'Éthiopie. Les archéologues ont trouvé des restes momifiés de Nubiens médiévaux portant des tatouages représentant le monogramme de Saint Michel ou la croix, par exemple. Même à des époques plus récentes, les chrétiens coptes se faisaient tatouer une petite croix, en partie pour renforcer leur identité en tant que minorité dans une société principalement musulmane. Historiquement, et même parmi certains groupes de nos jours, ces tatouages étaient considérés comme ayant un pouvoir spirituel protecteur."
 RICE_nubia_repaint_banganarti:0 "Repeindre les figures royales à Banganarti"
 RICE_nubia_repaint_banganarti_tooltip:0 "Représenter votre prédécesseur sur les murs du complexe ecclésial de Banganarti"
 RICE_nubia_repaint_banganarti_desc:0 "Depuis de nombreuses années, Banganarti, un important centre de pèlerinage près de [GetTitleByKey('b_old_dongola').GetNameNoTier], est associé à la royauté de la région. La coutume veut que les dirigeants remplacent les portraits de souverains morts depuis longtemps sur les murs de l'Église par ceux du précédent dirigeant récemment décédé."
 RICE_nubia_repaint_banganarti_effect_tooltip_1:1 "xxxxx"
 RICE_nubia_repaint_banganarti_confirm:0 "À mon tour de laisser ma marque sur Banganarti !"
 RICE_nubia_repaint_banganarti_context_tooltip:0 "#emphasis Contexte historique :#! xxxxx"
 RICE_nubia_repaint_banganarti_predecessor_req:0 "Le prédécesseur de votre [primary_title|El] est mort, et était d'une [faith|El] [GetReligionByKey('christianity_religion').GetAdjective] au moment de sa mort"
 RICE_nubia_agriculture_decision:0 "S'adonner aux pratiques agricoles nubiennes du Nil" # Engage in Nubian Agricultural Practices # [GetPlayer.GetCulture.GetNameNoTooltip] 
 RICE_nubia_agriculture_decision_tooltip:0 "Nous disposons de diverses méthodes traditionnelles pour améliorer la production agricole le long du Nil."
 RICE_nubia_agriculture_decision_desc:0 "Depuis que les [ROOT.Char.GetCulture.GetCollectiveNoun] et nos ancêtres vivent dans [GetGeographicalRegion('RICE_nile_river_valley').GetName], nous avons utilisé une variété de pratiques traditionnelles pour améliorer la production agricole le long du grand Nil."
 RICE_nubia_agriculture_decision_effect_tooltip_1:1 "xxxxx"
 RICE_nubia_agriculture_decision_hafir_effect_tooltip_1:1 "En prenant les [decisions|E] pour #V $RICE_nile_farmers_positive_decision$#! ou #V $RICE_nile_pastoralists_positive_decision$#!, les [county_modifiers|El] que vous obtenez ont des bonus accrus si le [county|El] possède le [modifier|El] [GetModifier('RICE_nubia_maintained_hafirs').GetNameWithTooltip]"
 RICE_nubia_agriculture_decision_confirm:0 "Rendons grâce à [ROOT.Char.GetFaith.HighGodName] pour le Nil !"
 RICE_nubia_agriculture_decision_context_tooltip:0 "#emphasis Contexte historique :#! Depuis l'Antiquité, comme leurs voisins égyptiens au nord, les peuples de Nubie ont utilisé une variété de méthodes pour tirer le meilleur parti de la crue du Nil au Soudan. Beaucoup de ces méthodes impliquaient la communauté entière, ou le soutien des élites locales."
 RICE_NUBIAN_AGRICULTURE_PICK_TYPE:0 "Le Nil est éternel"
 RICE_nubia_agriculture_decision_select_text:0 "Comment devrions-nous améliorer notre productivité agricole le long du [RICE_nile|El] ?\n$select_one_of_the_available_option_step_one_top_text$"
 RICE_nubia_agriculture_expand_irrigation_name:"#Bold Étendre les réseaux d'irrigation du Nil#!"
 RICE_nubia_agriculture_expand_irrigation_desc: "$RICE_nubia_agriculture_expand_irrigation_name$"
 RICE_nubia_agriculture_expand_irrigation_tooltip:"#italic Depuis l'Antiquité, nos ancêtres ont utilisé diverses méthodes pour étendre la portée des eaux du Nil et maximiser la fertilité de ces terres.#!" # \n\n$EFFECT_LIST_BULLET$Every [county|E] you own in [GetGeographicalRegion('RICE_nile_river_valley').GetName] gains the [GetModifier('RICE_nubia_expanded_nile_irrigation_networks').GetNameWithTooltip] [county_modifier|E]
 RICE_nubia_agriculture_construct_hafirs_name:"#Bold Entretenir les Hafirs#!"
 RICE_nubia_agriculture_construct_hafirs_desc: "$RICE_nubia_agriculture_construct_hafirs_name$"
 RICE_nubia_agriculture_construct_hafirs_tooltip:"#italic Les [Glossary( 'Hafirs', 'HAFIR_GLOSS' )] sont construits dans cette région depuis l'époque des [Glossary( 'pharaons', 'PHARAOH_GLOSS' )] égyptiens et des [Glossary( 'Qores', 'QORE_GLOSS' )] et [Glossary( 'Kandakes', 'KANDAKE_GLOSS' )] koushites. Fermiers et bergers font usage de ces réservoirs d'eau.#!" # \n\n$EFFECT_LIST_BULLET$Every [county|E] you own in [GetGeographicalRegion('RICE_nile_river_valley').GetName] gains the [GetModifier('RICE_nubia_maintained_hafirs').GetNameWithTooltip] [county_modifier|E]
 RICE_nubia_agriculture_grow_pigs_name:"#Bold Développer les troupeaux de porcs#!"
 RICE_nubia_agriculture_grow_pigs_desc: "$RICE_nubia_agriculture_grow_pigs_name$"
 RICE_nubia_agriculture_grow_pigs_tooltip:"#italic Bien que le bétail soit le cheptel le plus estimé parmi notre peuple, les porcs sont également très importants pour diverses communautés du Nil, en particulier pour les classes inférieures et les institutions religieuses.#!" # \n\n$EFFECT_LIST_BULLET$Every [county|E] you own in [GetGeographicalRegion('RICE_nile_river_valley').GetName] gains the [GetModifier('RICE_nubia_grew_pig_herds').GetNameWithTooltip] [county_modifier|E]
 RICE_nubia_agriculture_import_cattle_name:"#Bold Importer du bétail#!"
 RICE_nubia_agriculture_import_cattle_desc: "$RICE_nubia_agriculture_import_cattle_name$"
 RICE_nubia_agriculture_import_cattle_tooltip:"#italic Certaines communautés nubiennes profitent des routes commerciales à longue distance pour importer de nouveaux types de bétail possédant divers attributs bénéfiques.#!" # \n\n$EFFECT_LIST_BULLET$Every [county|E] you own in [GetGeographicalRegion('RICE_nile_river_valley').GetName] gains the [GetModifier('RICE_nubia_imported_cattle').GetNameWithTooltip] [county_modifier|E]
 RICE_nubia_agriculture_breed_cattle_name:"#Bold Élever du bétail#!"
 RICE_nubia_agriculture_breed_cattle_desc: "$RICE_nubia_agriculture_breed_cattle_name$"
 RICE_nubia_agriculture_breed_cattle_tooltip:"#italic Le bétail fait partie intégrante de la vie des Nubiens depuis l'Antiquité ; certaines races bovines anciennes sont encore élevées de nos jours et sont associées à des institutions religieuses.#!" # \n\n$EFFECT_LIST_BULLET$Every [county|E] you own in [GetGeographicalRegion('RICE_nile_river_valley').GetName] gains the [GetModifier('RICE_nubia_bred_cattle').GetNameWithTooltip] [county_modifier|E]
 RICE_nubia_rebuild_banganarti_church:0 "Reconstruire l'église de Banganarti"
 RICE_nubia_rebuild_banganarti_church_tooltip:0 "L'ancienne église de Banganarti tombe en ruines, et une nouvelle devrait être construite."
 RICE_nubia_rebuild_banganarti_church_desc:0 "L'église de Banganarti, proche de [GetTitleByKey('b_old_dongola').GetNameNoTier], est un site local de dévotion à l'[Glossary( 'archange Raphaël', 'ARCHANGEL_RAPHAEL_GLOSS' )]. Cependant, la structure de l'église tombe en ruines ; peut-être que si nous ne nous contentons pas de restaurer mais de reconstruire cette église, nous pourrons attirer encore plus de dévots [GetReligionByKey('christianity_religion').GetAdherentNamePlural|l] de près et de loin pour venir la visiter..."
 RICE_nubia_rebuild_banganarti_church_effect_tooltip_1:1 "L'[activity|El] [GetActivityType( 'activity_RICE_nubia_banganarti_pilgrimage' ).GetName] sera autorisé pour les [rulers|El] d'une zone géographique plus étendue près de [GetTitleByKey('b_old_dongola').GetNameNoTier]"
 RICE_nubia_rebuild_banganarti_church_effect_tooltip_2:1 "Les chances d'une #V incubation de rêve#! réussie au sanctuaire de l'[Glossary( 'archange Raphaël', 'ARCHANGEL_RAPHAEL_GLOSS' )] pendant l'[activity|El] [GetActivityType( 'activity_RICE_nubia_banganarti_pilgrimage' ).GetName] sont significativement augmentées"
 RICE_nubia_rebuild_banganarti_church_effect_tooltip_3:1 "Débloque l'[activity_option|El]  $RICE_nubia_banganarti_pilgrimage_dream_incubation_type_large$ pour l'[activity|El] de [GetActivityType( 'activity_RICE_nubia_banganarti_pilgrimage' ).GetName] afin d'augmenter davantage les chances d'une #V incubation de rêve#! réussie au sanctuaire de l'[Glossary( 'archange Raphaël', 'ARCHANGEL_RAPHAEL_GLOSS' )]"
 RICE_nubia_rebuild_banganarti_church_confirm:0 "Louons Saint Raphaël !"
 RICE_nubia_rebuild_banganarti_church_context_tooltip:0 "#emphasis Contexte historique :#! Banganarti, situé près de la capitale makurienne de Dongola, était un centre majeur de pèlerinage chrétien et de dévotion en Nubie, particulièrement à la fin de la période médiévale. Fortement patronné par la royauté makurienne, qui figure dans une grande partie de ses œuvres d'art, il était étroitement associé à saint Raphaël. Il était si célèbre que nous avons la preuve qu'un musulman aveugle et un homme parlant catalan venu de France s'y sont rendus à un moment donné."
 RICE_nubia_update_list_of_faras_bishops:0 "Mettre à jour la liste des évêques de la cathédrale de Faras"
 RICE_nubia_update_list_of_faras_bishops_tooltip:0 "La cathédrale de Faras conserve une liste de ses évêques sur ses murs."
 RICE_nubia_update_list_of_faras_bishops_desc:0 "La magnifique cathédrale de [GetTitleByKey('b_faras').GetNameNoTier], où le [GetReligionByKey('christianity_religion').GetName] est arrivé pour la première fois en [GetGeographicalRegion('RICE_greater_nubia_region').GetName], commémore ses évêques au fil des siècles à travers une liste de leurs noms, et des portraits, gravés dans les murs de la cathédrale. Nous devrions mettre à jour cette liste afin que les fidèles puissent continuer à la vénérer comme il se doit."
 RICE_nubia_update_list_of_faras_bishops_effect_tooltip_1:1 "xxxxx"
 RICE_nubia_update_list_of_faras_bishops_confirm:0 "Puisse cette cathédrale perdurer longtemps, très longtemps !"
 RICE_nubia_update_list_of_faras_bishops_context_tooltip:0 "#emphasis Contexte historique :#! Selon les récits traditionnels, le christianisme est arrivé pour la première fois en Nubie lorsque le royaume de Nobatie, dans le nord de la Nubie, s'est converti au christianisme en 543 de notre ère, bien qu'il soit probable que la christianisation ait été en cours depuis des décennies avant cela. La cathédrale principale de la capitale de la Nobatie, Faras, a servi de centre majeur du christianisme nubien pendant des siècles, même après l'absorption de la Nobatie par la Makurie. Une partie de la cathédrale maintenait une liste des évêques de la ville jusqu'au XIIIe siècle, qui a pu être utilisée comme forme de commémoration ou de pratique religieuse par les Nubiens."
 RICE_nubia_update_list_of_faras_bishops_req:0 "N'a pas encore pris cette [decision|El]"
 RICE_christian_commission_donor_portrait:0 "Commander un portrait"
 RICE_christian_commission_donor_portrait_tooltip:0 "Commandez un portrait de vous-même dans un édifice religieux [GetReligionByKey('christianity_religion').GetAdherentName] quelque part."
 RICE_christian_commission_donor_portrait_desc:0 "Depuis des siècles, de puissants mais pieux [GetReligionByKey('christianity_religion').GetAdherentNamePlural] ont démontré leur dévotion en commanditant des portraits d'eux-mêmes au sein d'œuvres d'art plus grandes, comme dans des églises et des cathédrales. Je souhaite commanditer une telle peinture de moi-même."
 RICE_christian_commission_donor_portrait_effect_tooltip_1:1 "Le montant de base de [piety_i|E] [piety|El], [prestige_i|El] [prestige|El], et [legitimacy_i|El] [legitimacy|El] que vous gagnez est basé sur votre [piety_level|El] et votre [rank|El]"
 RICE_christian_commission_donor_portrait_confirm:0 "Au nom [GetPlayer.GetFaith.HighGodNameAlternatePossessive] !"
 RICE_christian_commission_donor_portrait_context_tooltip:0 "#emphasis Contexte historique :#! Dans la chrétienté médiévale, de l'Angleterre à l'Éthiopie, les gens commandaient des œuvres d'art représentant des scènes ou des thèmes chrétiens qui incluaient leur propre portrait. Parfois c'était subtil ; par exemple, une scène de la Nativité pouvait montrer le donateur représenté comme un « simple » roturier sur le côté. D'autres fois, c'était plus explicite, comme en Nubie où les membres de la famille royale étaient souvent représentés dans de grandes peintures visibles et magnifiques sur les murs d'une église."
 RICE_christian_donor_portrait_PICK_TYPE:0 "$RICE_christian_commission_donor_portrait_confirm$"
 RICE_christian_commission_donor_portrait_select_text:0 "Quel devrait être le thème de ce portrait ?\n$select_one_of_the_available_option_step_one_top_text$"
 RICE_christian_donor_portrait_self_name: "#Bold Moi-même#!"
 RICE_christian_donor_portrait_self_desc: "$RICE_christian_donor_portrait_self_name$"
 RICE_christian_donor_portrait_self_tooltip:"#italic Le portrait sera de moi-même, démontrant ma dévotion religieuse.#!\n\n$EFFECT_LIST_BULLET$Gain d'un bonus de [legitimacy_i|El] #V [EmptyScope.ScriptValue('minor_legitimacy_gain')]#! [legitimacy|El] basé sur votre [rank|El]\n$EFFECT_LIST_BULLET$Gain d'n bonus de [prestige_i|El] [prestige|El] basé sur votre [rank|El]"
 RICE_christian_donor_portrait_family_name: "#Bold Famille proche#!"
 RICE_christian_donor_portrait_family_desc: "$RICE_christian_donor_portrait_family_name$"
 RICE_christian_donor_portrait_family_tooltip:"#italic Le portrait me représentera avec mes proches parents.#!\n\n$EFFECT_LIST_BULLET$[opinion_i|E] [opinion|E] augmentée de votre [close_family|El]\n$EFFECT_LIST_BULLET$Gain de [dynasty_prestige_i|E] [dynasty_prestige|El] bonus basé sur votre [rank|El]"
 RICE_christian_donor_portrait_clergy_name: "#Bold Clergé#!"
 RICE_christian_donor_portrait_clergy_desc: "$RICE_christian_donor_portrait_clergy_name$"
 RICE_christian_donor_portrait_clergy_tooltip:"#italic Le portrait me représentera aux côtés du [clergy|E] de ma [court|El].#!\n\n$EFFECT_LIST_BULLET$[opinion_i|E] [opinion|E] augmentée de la part de votre [court_chaplain|E] et de tous les [courtiers|E] et [vassals|El] qui sont [clergy|El]\n$EFFECT_LIST_BULLET$Gain de [piety_i|E] [piety|El] bonus basé sur votre [rank|El]"
 RICE_nile_pastoralists_positive_decision:0 "Accueillir les pasteurs du Nil"
 RICE_nile_pastoralists_positive_decision_tooltip:0 "Nous pouvons coopérer avec nos voisins pasteurs."
 RICE_nile_pastoralists_positive_decision_desc:0 "Les eaux fertiles de la [RICE_nile_river|El] ont attiré des éleveurs et autres agro-pasteurs pendant des siècles. Bien que nos relations avec eux n'aient pas toujours été pacifiques, il y a aussi eu des occasions de coopération, et nous devrions inviter ceux qui sont amicaux sur nos terres."
 RICE_nile_pastoralists_positive_decision_effect_tooltip_1:1 "#P Augmentation#! de l'[opinion|El] avec les [rulers|El] proches ayant un [government|El] [tribal|El] ou [nomadic|El]"
 RICE_nile_pastoralists_positive_decision_effect_tooltip_2:1 "Vous pouvez payer un montant aléatoire d'[gold|El] entre [gold_i|El] #V [GetPlayer.MakeScope.ScriptValue('RICE_pastoralist_decision_bonus_min')]#! et [gold_i|El] #V [GetPlayer.MakeScope.ScriptValue('RICE_pastoralist_decision_bonus_max')]#! pour obtenir des [special_troops|El] supplémentaires, y compris des [men_at_arms|El]"
 RICE_nile_pastoralists_positive_decision_effect_tooltip_3:1 "Les [counties|El] avec le [county_modifier|El] [GetModifier('RICE_nubia_maintained_hafirs').GetNameWithTooltip] obtiendront le [modifier|El] [GetModifier('RICE_nile_pastoralists_positive_modifier_enhanced').GetNameWithTooltip] à la place"
 RICE_nile_pastoralists_positive_decision_effect_tooltip_4:1 "Cette [decision|E] coûte #P moins#! d'[gold_i|El] [gold|El] si la [RICE_nile_river|El] connaît actuellement une [bad_nile_flood|El]"
 RICE_nile_pastoralists_positive_decision_confirm:0 "Ensemble, nous pouvons prospérer !"
 RICE_nile_pastoralists_positive_decision_context_tooltip:0 "#emphasis Contexte historique :#! Les communautés sédentaires aussi bien que pastorales ont coexisté le long du Nil pendant des millénaires, parfois en paix et en échanges commerciaux, et parfois dans des contextes plus hostiles. En réalité, la ligne séparant les deux pouvait être floue, car de nombreux pasteurs pratiquaient occasionnellement l'agriculture, et les dirigeants des parties plus urbanisées du Nil entretenaient parfois des liens politiques étroits avec les groupes pastoraux."
 RICE_nile_pastoralists_negative_decision:0 "Repousser les pasteurs du Nil"
 RICE_nile_pastoralists_negative_decision_tooltip:0 "Nous ne devrions pas faire naïvement confiance à nos voisins pasteurs."
 RICE_nile_pastoralists_negative_decision_desc:0 "Les eaux fertiles de la [RICE_nile_river|El] attirent des éleveurs et autres agro-pasteurs depuis des siècles. Bien que certains puissent être amicaux, beaucoup d'autres sont une nuisance, voire une menace pour nos colonies, et nous devons faire ce que nous pouvons pour les dissuader de venir sur nos terres."
 RICE_nile_pastoralists_negative_decision_effect_tooltip_1:1 "#N Diminution#! de l'[opinion|El] avec les [rulers|El] voisins qui ont un [government|El] [tribal|El] ou [nomadic|El]"
 RICE_nile_pastoralists_negative_decision_effect_tooltip_2:1 "Cette [decision|E] coûte #N plus#! d'[gold_i|El] [gold|El] si la [RICE_nile_river|El] connaît actuellement une [good_nile_flood|El]"
 RICE_nile_pastoralists_negative_decision_confirm:0 "Nous devons nous méfier d'eux !"
 RICE_nile_pastoralists_negative_decision_context_tooltip:0 "$RICE_nile_pastoralists_positive_decision_context_tooltip$"
 RICE_nile_farmers_positive_decision:0 "Protéger les fermiers du Nil"
 RICE_nile_farmers_positive_decision_tooltip:0 "Nos voisins agriculteurs sont mieux comme amis que comme victimes."
 RICE_nile_farmers_positive_decision_desc:0 "Certains de nos compagnons éleveurs et pasteurs voient les communautés plus sédentaires le long de la [RICE_nile_river|El] comme une ressource à piller et exploiter, mais les plus sages d'entre nous reconnaissent que si nous les soutenons, nous pouvons tous prospérer ensemble sur le long terme en tant que partenaires et alliés, plutôt qu'ennemis."
 RICE_nile_farmers_positive_decision_effect_tooltip_1:1 "#P Augmentation#! de l'[opinion|El] avec les [rulers|El] proches qui n'ont pas un [government|El] [tribal|El] ou [nomadic|El]"
 RICE_nile_farmers_positive_decision_effect_tooltip_2:1 "[counties|E] avec le [county_modifier|El] [GetModifier('RICE_nubia_maintained_hafirs').GetNameWithTooltip] obtiendront le [modifier|El] [GetModifier('RICE_nile_farmers_positive_modifier_enhanced').GetNameWithTooltip] à la place"
 RICE_nile_farmers_positive_decision_effect_tooltip_3:1 "Cette [decision|E] coûte #N moins#! d'[gold_i|El] [gold|El] si la [RICE_nile_river|El] connaît actuellement une [good_nile_flood|El]"
 RICE_nile_farmers_positive_decision_confirm:0 "Ensemble, nous pouvons prospérer !"
 RICE_nile_farmers_positive_decision_context_tooltip:0 "$RICE_nile_pastoralists_positive_decision_context_tooltip$"
 RICE_nile_farmers_negative_decision:0 "Piller les fermiers du Nil"
 RICE_nile_farmers_negative_decision_tooltip:0 "Nos voisins agraires sont des faibles que nous pouvons exploiter."
 RICE_nile_farmers_negative_decision_desc:0 "Les communautés sédentaires de la [RICE_nile_river|El] peuvent parfois entretenir des relations amicales avec nous, mais il y a ceux qui les considèrent à juste titre comme une ressource à piller et à exploiter. Ces communautés qui vivent sur mon territoire doivent bien nous payer, si elles veulent vivre en paix."
 RICE_nile_farmers_negative_decision_effect_tooltip_1:1 "#N Diminution#! de l'[opinion|El] avec les [rulers|El] proches qui n'ont pas un [government|El] [tribal|El] ou [nomadic|El]"
 RICE_nile_farmers_negative_decision_effect_tooltip_2:1 "Gain aléatoire d'[gold|El] entre [gold_i] #V [GetPlayer.MakeScope.ScriptValue('RICE_pastoralist_decision_bonus_min')]#! et [gold_i] #V [GetPlayer.MakeScope.ScriptValue('RICE_pastoralist_decision_bonus_max')]#!"
 RICE_nile_farmers_negative_decision_effect_tooltip_3:1 "Le maximum d'[gold|El] que vous pouvez possiblement obtenir est basé sur vos [skills|El], et sur le nombre de [counties|El] le long de la [RICE_nile_river|El] que vous possédez"
 RICE_nile_farmers_negative_decision_effect_tooltip_4:1 "Cette [decision|E] coûte #N plus#! d'[gold_i|El] [gold|El] si la [RICE_nile_river|El] subit actuellement une [bad_nile_flood|El]"
 RICE_nile_farmers_negative_decision_confirm:0 "Ils nous servent, pas l'inverse !"
 RICE_nile_farmers_negative_decision_context_tooltip:0 "$RICE_nile_pastoralists_positive_decision_context_tooltip$"
 RICE_eldad_ha_dani_decision:0 "Propager les récits sur les Danites"
 RICE_eldad_ha_dani_decision_tooltip:0 "Les communautés juives locales entendront les grandes histoires sur la Tribu de Dan et les aventures d'Eldad ha-Dani !"
 RICE_eldad_ha_dani_decision_desc:0 "Il est temps pour moi de me rendre auprès des communautés de foi [GetReligionByKey('judaism_religion').GetAdjective] locales de [GetPlayer.GetCapitalLocation.GetName] et de leur raconter mes aventures et les descendants de la Tribu Perdue de Dan. Dois-je les inspirer à de plus grands exploits avec des récits fantaisistes, ou vais-je leur fournir un commentaire plus éclairé sur notre [religion|El] ?"
 RICE_eldad_ha_dani_decision_effect_tooltip_1:1 "Cette [decision|El] ne peut pas être prise à [GetPlayer.GetCapitalLocation.GetName] pendant #V 5#! ans, que vous réussissiez ou échouiez"
 RICE_eldad_ha_dani_decision_effect_tooltip_2:1 "Le succès dépend de la #V Réception#! que la communauté juive locale réserve à vos récits, et de vos choix dans l'événement qui suit"
 RICE_eldad_ha_dani_decision_success:1 "#P Réussite#!"
