 RICE_baqt_frontier_scrutinize_name:"#Bold Surveiller les voyageurs#!"
 RICE_baqt_frontier_scrutinize_desc: "$RICE_baqt_frontier_scrutinize_name$"
 RICE_baqt_frontier_scrutinize_tooltip:"#italic Les déplacements à travers la frontière entre l'Égypte et la Nubie sont étroitement surveillés. Nous devons empêcher l'entrée de fauteurs de troubles et extrader tout criminel ou fugitif recherché de l'autre côté de la frontière.#!"
 RICE_baqt_frontier_scrutinize_effect_1_tt:"La réussite de cette tâche dépend de votre [skill|El] [intrigue_i|El] [intrigue|El]"
 RICE_baqt_frontier_scrutinize_effect_2_tt:"Vous pourriez trouver un [character|El] talentueux à recruter à votre [court|El] qui s'échappe de l'autre côté de la frontière"
