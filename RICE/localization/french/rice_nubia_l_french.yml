 trait_RICE_former_governor_of_aswan_name:0 "Ancien gouverneur d'Assouan"
 trait_RICE_governor_of_aswan_desc:0 "Ce personnage a de l'expérience en tant que [Glossary( 'Gouverneur d\\'Assouan', 'GOVERNOR_OF_ASWAN_GLOSS' )], traditionnellement le Gouverneur de Haute-Égypte qui avait juridiction sur Assouan, l'officiel chargé de maintenir la frontière entre l'Égypte et la Nubie et de superviser les transactions du [RICE_baqt|El] du côté égyptien.\n\n#weak Ce [trait|El] est accordé à quiconque détient le [county|El] de $c_aswan$.#!$TRAIT_FLAG_DESC_rice_lord_of_the_mountain_xp_gain$"
 trait_RICE_governor_of_aswan_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] a de l'expérience en tant que [Glossary( 'Gouverneur d\\'Assouan', 'GOVERNOR_OF_ASWAN_GLOSS' )], traditionnellement le Gouverneur de Haute-Égypte qui avait juridiction sur Assouan, le fonctionnaire chargé de maintenir la frontière entre l'Égypte et la Nubie et de superviser les transactions du [RICE_baqt|El] du côté égyptien.\n\n#weak Ce [trait|El] est accordé à quiconque détient le [county|El] de $c_aswan$.#! $TRAIT_FLAG_DESC_rice_governor_of_aswan_xp_gain$"
 trait_track_RICE_governor_of_aswan:0 "$trait_RICE_governor_of_aswan$"
