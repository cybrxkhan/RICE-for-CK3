 innovation_RICE_gossi_grain_silos:1 "Silos à grains de Gossi"
 innovation_RICE_gossi_grain_silos_desc:1 "Gossi, ou Gusee, est un type de silo en terre crue utilisé pour stocker les céréales, originaire des régions méridionales de la vallée du Nil. Ils sont efficaces pour conserver les récoltes sans altérer leurs propriétés physiques et chimiques, et pour prévenir les attaques de nuisibles."
 innovation_RICE_tetracycline:1 "Tétracycline"
 innovation_RICE_tetracycline_desc:1 "Bien que ses propriétés antibiotiques soient peu comprises, depuis des siècles, de nombreuses communautés des régions du Nil ont découvert que certains types de grains fermentés utilisés pour fabriquer de la bière ou du pain peuvent améliorer la santé et prévenir les maladies."
 innovation_RICE_state_sanctioned_treasure_hunting:1 "Chasse au trésor sanctionnée par l'État"
 innovation_RICE_state_sanctioned_treasure_hunting_desc:1 "Les anciennes civilisations du Nil abritent de nombreux vieux monuments enfouis sous les sables, regorgeant de trésors et de savoirs perdus. Les dirigeants avisés devraient parrainer et réglementer l'industrie de la chasse aux trésors afin que la société puisse tirer le meilleur parti de ces antiquités."
