 nubia.0260.t:0 "Bois de Sunt"
 nubia.0260.desc:0 "Tout au long de [GetGeographicalRegion('RICE_nile_river_valley').GetName], les populations utilisent traditionnellement le bois de [Glossary( 'sunt', 'SUNT_GLOSS' )] dans la construction de bateaux. Non seulement ce bois est réputé pour son imperméabilité relative par rapport à d'autres essences, mais ses propriétés permettent de construire rapidement de nombreux bateaux à la fois, même avec des quantités limitées.\n\n[councilor.GetTitledFirstName] a indiqué que dans le cadre de ses fonctions de [councilor.GetCouncilTitle], [councilor.GetSheHe] a récemment noué des contacts avec certains villages de [county.GetNameNoTier] réputés pour la qualité de leurs bateaux fabriqués en bois de #italic sunt#!.\n\n« Allouez des fonds et je ferai jouer mes relations, » proposa [councilor.GetFirstNameNoTooltip], « pour que nous puissions engager certains d'entre eux à fabriquer des bateaux de qualité pour nous sur demande, rapidement et à moindre coût. »"
 nubia.0260.a:0 "Une excellente idée. Allez-y."
 nubia.0260.b:0 "Encourageons-les plutôt à construire des bateaux de pêche."
 nubia.0260.c:0 "Nous n'avons pas d'argent pour ce genre de chose."
 nubia.0261.t:0 "Utiliser différentes langues"
 nubia.0261.desc:0 "Traditionnellement, nous [nubian.GetCollectiveNoun] utilisons trois langues dans nos écrits : [nubian.GetLanguage.GetName], [coptic.GetLanguage.GetName], et [greek.GetLanguage.GetName]. Dans une moindre mesure, nous faisons aussi usage de l'[arabic.GetLanguage.GetName], étant donné nos relations avec ceux qui suivent les préceptes de l'[GetReligionByKey('islam_religion').GetName].\n\nMes scribes doivent avoir une certaine maîtrise de toutes ces langues, car nous avons tendance à les utiliser dans des contextes différents - par exemple, [coptic.GetLanguage.GetNameNoTooltip] est couramment utilisé pour les textes religieux. Cependant, mon [chancellor.GetCouncilTitle], [chancellor.GetTitledFirstName], a exprimé des inquiétudes quant au fait que certains de mes scribes ne maîtrisent pas bien quelques-unes de ces langues.\n\n« Nous devrions mieux former les scribes, » recommande [chancellor.GetFirstNameNoTooltip], « afin que la qualité de nos documents ne soit pas déficiente. »"
 nubia.0261.a:0 "Se concentrer sur leur formation en langue [nubian.GetLanguage.GetNameNoTooltip]"
 nubia.0261.b:0 "Se concentrer sur leur formation en langue [coptic.GetLanguage.GetNameNoTooltip]"
 nubia.0261.c:0 "Se concentrer sur leur formation en langue [greek.GetLanguage.GetNameNoTooltip]"
 nubia.0261.d:0 "Se concentrer sur leur formation en langue [arabic.GetLanguage.GetNameNoTooltip]"
 nubia.0262.t:0 "Mode ancienne ou nouvelle ?"
 nubia.0262.desc:0 "Pendant des siècles, nous [ROOT.Char.GetCulture.GetCollectiveNoun|l] et nos ancêtres avons tiré une grande influence du prospère et puissant [GetTitleByKey('e_byzantium').GetNameNoTier]. Par exemple, nos tenues de cour et nos vêtements religieux portent une forte influence de leurs équivalents en [GetTitleByKey('e_byzantium').GetNameNoTierNoTooltip].\n\nMalgré cela, ces derniers temps, certains parmi nous ont montré un plus grand intérêt pour des formes vestimentaires plus indigènes, modifiant notre mode pour intégrer certains aspects de ces styles. Depuis un moment déjà, j'ai remarqué cela au sein de ma propre cour également ; certains préfèrent des vêtements de style « indigène », tandis que d'autres s'en tiennent à la mode plus ancienne et prestigieuse, d'influence [GetTitleByKey('e_byzantium').GetAdjectiveNoTooltip]."
 nubia.0262.tooltip:0 "La plupart de vos [courtiers|El] ont acquis le [character_modifier|El] [GetModifier('RICE_nubia_prefers_byzantine_clothing').GetNameWithTooltip] ou [GetModifier('RICE_nubia_prefers_indigenous_clothing').GetNameWithTooltip], reflétant leurs préférences vestimentaires."
 nubia.0262.a:0 "Je trouve nos styles vestimentaires traditionnels plus attrayants."
 nubia.0262.b:0 "Le style [GetTitleByKey('e_byzantium').GetAdjectiveNoTooltip] a perduré pour une bonne raison !"
 nubia.0263.t:0 "Les [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip|l] tyranniques ?"
 nubia.0263.desc:0 "Je reçois en audience plusieurs marchands [ROOT.Char.GetCulture.GetCollectiveNoun|l] originaires de [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier], récemment revenus d'un long voyage d'affaires. Ils me racontent dûment ce qu'ils ont vu et entendu dans ces terres étrangères, des informations qui pourraient m'être utiles, mais aussi des choses amusantes qu'ils ont entendues au cours de leurs voyages - certaines à notre sujet, nous les [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip|l], ou plutôt, ce que les gens #italic pensent#! de nous.\n\nPar exemple, il semblerait que certains murmurent le nom des [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip|l] avec appréhension, car ils croient que nous sommes un peuple cruel gouverné par des tyrans, puisque la loi dans nos terres veut que tout roi puisse instantanément réduire quiconque en esclavage sans aucune raison, et que tout le monde accepte cela sans se plaindre.\n\nAbsurde, mais amusant ! Tout le monde sait que les esclaves sont généralement des débiteurs, des criminels ou des prisonniers de guerre."
 nubia.0263.a:0 "Bien ! Les autres devraient nous regarder avec crainte et mystère."
 nubia.0263.b:0 "Ces étrangers ignorants ne savent clairement pas grand-chose de nous."
 nubia.0263.info:0 "#emphasis Contexte historique :#! Plusieurs sources musulmanes médiévales, dont le géographe Al-Qazwini (v. 1203 - 1283 ap. J.-C.) et le diplomate fatimide et missionnaire chiite Al-Aswani (v. Xe siècle ap. J.-C.), affirment que les souverains de Nubie étaient des monarques absolus qui, par coutume, avaient le droit de forcer immédiatement quiconque à devenir esclave. Bien que l'esclavage existât en Nubie chrétienne, les esclaves étaient souvent capturés lors de raids dans les terres voisines souvent païennes, ou étaient des Nubiens natifs privés de liberté pour diverses raisons comme les punitions légales. De plus, bien que les recherches soient incertaines quant à la nature exacte de l'administration nubienne médiévale, il est clair qu'une certaine forme d'appareil bureaucratique existait dans ces royaumes avec lequel les rois nubiens auraient dû composer, même s'ils étaient très puissants."
 nubia.0264.t:0 "Protecteurs de la Forêt"
 nubia.0264.desc:0 "Je prends place au bord de la cour alors que le soleil disparaît sous l'horizon et que la nuit s'installe.\n\nPlusieurs enfants de mes serviteurs et m[child.Custom('FR_OnA')] [child.Custom('GetDaughterSon')], [child.GetFirstName], courent en riant, essayant de s'arracher un os d'animal. Je me souviens vaguement avoir joué à un jeu comme celui-ci dans ma jeunesse, mais je n'en rappelle plus les règles, et je demande à mon [ROOT.Char.Custom('lowly_servant_type')], qui se tient non loin et dont l'enfant participe également au jeu, de quoi il s'agit.\n\n« Mon [ROOT.Char.GetLadyLord] », dit le serviteur respectueusement en s'inclinant, « c'est le jeu qu'ils appellent #italic Les Protecteurs de la Forêt#!. Vous remarquez que les enfants sont en deux équipes - les uns sont les lions, les autres sont les loups. Et vous voyez ces deux grands cercles qu'ils ont tracés au sol ? Chaque équipe essaie de ramener l'os dans son cercle. »"
 nubia.0264.a:0 "Hmph. C'est un jeu d'enfant stupide, je suppose."
 nubia.0264.b:0 "Ah ! Je me souviens maintenant... Quels heureux souvenirs."
 nubia.0264.info:0 "#emphasis Contexte historique :#! Cet événement est inspiré d'un jeu d'enfants encore populaire dans certaines régions du nord du Soudan, en particulier autour de Dongola, près de l'ancienne capitale du royaume nubien de Makurie. S'il est impossible de déterminer quand ce jeu a été inventé ou joué pour la première fois par des enfants, il n'est pas invraisemblable qu'il ait pu être pratiqué à l'époque prémoderne, étant donné qu'il ne nécessite que deux choses : un os et des enfants."
 nubia.0265.t:0 "Ère de l'Hégire"
 nubia.0265.desc:0 "Nous avons eu de nombreuses relations avec les peuples [arabic.GetHeritage.GetNameNoTooltip|l]s depuis qu'ils ont conquis et pris le contrôle de l'[GetGeographicalRegion('ghw_region_egypt').GetName|l] il y a longtemps. Depuis lors, certains de nos scribes ont appris à lire et écrire en [arabic.GetLanguage.GetName|l] ; certains de nos documents administratifs et religieux [ROOT.Char.GetFaith.GetAdherentNamePlural|l] sont même rédigés dans cette langue.\n\nL'influence de l'[arabic.GetLanguage.GetNameNoTooltip|l] sur ces documents est telle que certains de mes scribes ont pris l'habitude de compter les dates selon l'[Glossary( 'Ère de l\\'Hégire', 'ERA_OF_THE_HEGIRA_GLOSS' )], plutôt que notre traditionnelle [Glossary( 'Ère des Martyrs', 'ERA_OF_THE_MARTYRS_GLOSS' )].\n\n[zealot.GetTitledFirstName], qui est connu pour ses opinions tranchées sur l'[zealot.GetFaith.GetName|l], a protesté auprès de moi à propos de cette tendance parmi certains de mes scribes. « Adopter une autre langue est sensé et pragmatique, » me dit-[zealot.GetSheHe] un jour, « mais adopter le calendrier des infidèles [GetReligionByKey('islam_religion').GetAdherentNamePlural|l], surtout lorsqu'on écrit dans des langues autres que [arabic.GetLanguage.GetNameNoTooltip|l] ? Nos ancêtres auraient honte de voir avec quelle facilité nous jetons nos croyances et nos valeurs ! »"
 nubia.0265.a:0 "Vous savez que [liege.GetTitledFirstName] suit l'[GetReligionByKey('islam_religion').GetNameNoTooltip], n'est-ce pas ?"
 nubia.0265.b:0 "Cela m'importe peu tant que nos scribes font du bon travail."
 nubia.0265.c:0 "C'est vrai… Je découragerai l'usage de l'#italic Ère de l'Hégire#!"
 nubia.0265.info:0 "#emphasis Contexte historique :#! Traditionnellement, les documents chrétiens médiévaux d'Égypte et de Nubie utilisaient souvent l'[Glossary( 'Ère des Martyrs', 'ERA_OF_THE_MARTYRS_GLOSS' )] pour le calcul des dates, mais certains utilisaient notamment l'[Glossary( 'Ère de l\\'Hégire', 'ERA_OF_THE_HEGIRA_GLOSS' )] islamique. Cela résultait des intenses échanges économiques, politiques et culturels entre les musulmans égyptiens, les chrétiens égyptiens et les chrétiens nubiens durant la période médiévale. Fait intéressant, les documents chrétiens égyptiens qui l'utilisaient pouvaient calculer les dates de l'#italic Hégire#! avec une assez grande précision, tandis que les documents nubiens analogues tendent à être moins précis."
 nubia.0266.t:0 "Monticules de Briques Rouges"
 nubia.0266.desc:0 "En [GetGeographicalRegion('RICE_greater_nubia_region').GetName], on trouve souvent des monticules apparemment aléatoires de briques rouges enfouis quelque part le long du Nil. Certains peuvent être les vestiges d'anciens [ROOT.Char.GetFaith.HouseOfWorshipPlural] [ROOT.Char.GetFaith.GetAdherentNamePlural], par exemple, ou même des structures du quotidien construites à l'époque des [Glossary( 'Qores', 'QORE_GLOSS' )] et des [Glossary( 'Kandakes', 'KANDAKE_GLOSS' )].\n\nBien que de telles découvertes soient généralement isolées, plusieurs monticules de briques rouges ont récemment été localisés à [county.GetNameNoTier], en quantité suffisante pour être réutilisés dans de nombreuses constructions différentes. Cependant, il y a toujours des histoires selon lesquelles ces vieux monticules abriteraient toutes sortes d'esprits redoutables d'autrefois, qui seraient offensés si nous venions à les déranger, eux et leurs demeures…."
 nubia.0266.a:0 "Espérons que nous pourrons faire bon usage de ces briques !"
 nubia.0266.b:0 "Ne touchez pas aux briques - nous ne dérangerons pas les esprits."
 RICE_every_zealous_nubian_courtier_of_religion:0 "Chaque [courtier|El] de votre [religion|El] avec les [traits|El] [GetTrait('zealous').GetName( GetNullCharacter )], [GetTrait('humble').GetName( GetNullCharacter )], [GetTrait('paranoid').GetName( GetNullCharacter )], ou [GetTrait('craven').GetName( GetNullCharacter )]"
 nubia.0267.t:0 "$travel_event_prefix$ Repos à un Hafir"
 nubia.0267.desc:0 "Nous avons eu la grande chance de tomber sur un [Glossary( 'Hafir', 'HAFIR_GLOSS' )] intact et parfaitement entretenu à [ROOT.Char.GetCurrentLocation.GetName]. Notre groupe s'est assuré de se réapprovisionner en eau grâce à ce réservoir, une eau indubitablement plus propre et plus rafraîchissante que l'eau de qualité parfois douteuse qui provient du Nil.\n\nSur place, nous avons rencontré et discuté avec des bergers locaux qui faisaient également usage de l'eau du #italic hafir#!. L'un d'eux m'a dit : « Nous louons la clairvoyance de [ruler.GetTitledFirstName] qui consacre des ressources à l'entretien de ces #italic hafirs#!. »"
 nubia.0267.desc.self:0 "\n\nCurieusement, ils ne semblent pas me reconnaître !"
 nubia.0267.a:0 "Bien sûr je [ruler.GetHerHim|l] connais. C'est moi !"
 nubia.0267.b:0 "Ah, oui, j'ai entendu parler de ce [ruler.GetTitledFirstNameNoTooltip]..."
 nubia.0267.c:0 "J'espère que [ruler.GetFirstNameNoTooltip] continuera à pourvoir à vos besoins."
 nubia.0267.d:0 "[ruler.GetFirstNameNoTooltip] fait cela uniquement pour gagner vos faveurs."
 nubia.0268.t:0 "$travel_event_prefix$ Où est le bœuf ?"
 nubia.0268.desc:0 "Je m'excuse, mon [ROOT.Char.GetLadyLord], mais c'est le mieux que nous ayons," me dit l'ancien [culture.GetCollectiveNoun|l] avec regret, tandis que les villageois me présentent de pitoyables quantités de viande de chèvre et de mouton.\n\nMon entourage et moi faisions halte dans un village de [ROOT.Char.GetCurrentLocation.GetName] pour la nuit, et les villageois amicaux se montraient plutôt hospitaliers, nous offrant le peu de nourriture qu'ils avaient. C'est un village démuni sans aucun doute, dont les habitants semblaient fatigués et épuisés.\n\n"Nous ne pouvons malheureusement pas offrir à un[ROOT.Char.Custom('FR_E')] [ROOT.Char.GetWomanMan] grand[ROOT.Char.Custom('FR_E')] et puissant[ROOT.Char.Custom('FR_E')] comme vous du bœuf," poursuit l'ancien, "car nous avons très peu de bétail ici. J'... espère que cela ne posera pas de problème."
 nubia.0268.a:0 "Aucune ! La chèvre et le mouton sont délicieux."
 nubia.0268.b:0 "J'aurais préféré du bœuf, mais c'est ainsi."
 nubia.0268.c:0 "Pauvres villageois ! Prenez cet or pour vous aider."
 nubia.0268.info:0 "#emphasis Contexte historique :#! Dans la Nubie antique et médiévale, en raison du grand prestige et de la valeur du bétail, le bœuf était populaire parmi les classes élites et les citadins de Nubie. Les preuves archéologiques suggèrent qu'à l'inverse, dans les établissements ruraux plus pauvres, le mouton et la chèvre étaient plus largement consommés que le bœuf."
 nubia.0269.t:0 "Les Paroles d'Abba Poemen"
 nubia.0269.desc:0 "D'un ton ferme, [chaplain.GetTitledFirstName] réitère : « Les [Glossary( 'Apophtegmes des Pères du désert', 'SAYINGS_OF_THE_DESERT_FATHERS_GLOSS' )] sont très clairs sur la question. [Glossary( 'Abba Poemen', 'ABBA_POEMEN_GLOSS' )] nous dit que les moines [GetReligionByKey('christianity_religion').GetAdherentNamePlural] ne devraient pas prendre part à des activités agricoles comme planter et récolter, et encore moins posséder des terres cultivables, car c'est un travail communautaire qui peut les mener à la tentation, alors qu'ils devraient se retirer du monde. »\n\nEt c'est reparti. Ce n'est pas la première fois que [chaplain.GetFirstNameNoTooltip] me fait ce sermon.\n\n« En tant que votre [chaplain.GetCouncilTitle], » poursuit-[chaplain.GetSheHe], « je sais que nous ne pouvons pas interdire aux moines de faire cela. Trop de nos institutions religieuses possèdent des terres. Changer cela ruinerait notre économie, et j'admets que les moines ont besoin de ces fonds de temps en temps. Mais… c'est frustrant. Y a-t-il quoi que ce soit que nous puissions faire à ce sujet ? »"
 nubia.0269.a:0 "La réalité peut être décevante parfois, mais c'est nécessaire."
 nubia.0269.b:0 "Peut-être pouvons-nous encourager les moines à se concentrer sur les questions spirituelles."
 nubia.0270.t:0 "Les Épithètes de Saint Raphaël"
 nubia.0270.desc:0 "[chaplain.GetTitledFirstName] donne aujourd'hui un sermon sur l'[Glossary( 'Archange Raphaël', 'ARCHANGEL_RAPHAEL_GLOSS' )], largement vénéré par les [ROOT.Char.GetCulture.GetCollectiveNoun|l] [GetReligionByKey('christianity_religion').GetAdherentNamePlural], peut-être plus que tout autre peuple sur terre.\n\nAvec passion, [chaplain.GetFirstNameNoTooltip] énumère les nombreux épithètes que nous avons donnés à Saint Raphaël, tant dans notre langue vernaculaire [ROOT.Char.GetCulture.GetLanguage.GetName], que dans le [greek.GetLanguage.GetName] ecclésiastique formel, pour nous rappeler les nombreuses qualités de l'Archange : « un souverain des saints », « un sauveur », « un secours pour l'humanité tout entière », « #italic empsychos#! » (ce qui signifie ayant la vie en lui), « #italic amisthos#! » (signifiant guérir sans paiement), et « #italic archinous#! » (signifiant intellect suprême).\n\n« Écoutez ces noms ! » proclame [chaplain.GetFirstNameNoTooltip]. « Raphaël ne guide pas seulement l'Église, mais dompte les ennemis et les démons ! »"
 nubia.0270.a:0 "Raphaël nous guide spirituellement en ces temps difficiles."
 nubia.0270.b:0 "Je prie pour que Raphaël combatte et tue nos ennemis démoniaques."
 nubia.0270.c:0 "Raphaël fait-il vraiment encore tant que ça pour nous ?"
 nubia.0271.t:0 "Saint Raphaël est partout"
 nubia.0271.desc:0 "Un marchand itinérant visitant ma cour aujourd'hui est un [GetReligionByKey('christianity_religion').GetAdherentName] dévot venu d'une terre lointaine, et il est inspirant de voir une telle foi en [ROOT.Char.GetFaith.HighGodName] malgré la distance géographique et nos différences culturelles.\n\nAu cours de notre fascinante conversation, le marchand dit avoir remarqué une tendance intéressante en voyageant à travers mon royaume.\n\n« Je ne pense pas que ce soit une mauvaise chose du tout, mais j'ai remarqué que beaucoup des magnifiques œuvres d'art dans nombre des [ROOT.Char.GetFaith.HouseOfWorshipPlural] [ROOT.Char.GetCulture.GetNameNoTooltip]s semblent étrangement préoccupées par [Glossary( 'Saint Raphaël', 'ARCHANGEL_RAPHAEL_GLOSS' )] », fait remarquer le marchand. « Je trouve fascinant à quel point votre peuple lui est dévoué - non pas que ce soit une mauvaise chose ! Je vois peu d'autres archanges représentés avec autant d'amour et de fréquence que lui dans ces contrées. »"
 nubia.0271.a:0 "Je ne suis pas sûr de comment cela a commencé, mais nous sommes comme ça."
 nubia.0271.b:0 "Raphaël nous protège de bien des manières."
 nubia.0271.c:0 "Dites-moi, quels autres arts avez-vous vus au cours de vos voyages ?"
 nubia.0272.t:0 "$travel_event_prefix$ Groin, Groin !"
 nubia.0272.desc:0 "En m'arrêtant dans [faith.HouseOfWorship|l] [faith.GetAdjective|l] plutôt modeste à [ROOT.Char.GetCurrentLocation.GetName], j'ai été choqué par le nombre de porcs que les moines locaux y gardaient.\n\n« Beaucoup de pèlerins et de visiteurs viennent ici », explique l'un des moines, alors que nous sommes confortablement installés dans les quartiers d'habitation à l'intérieur tandis qu'ils nous accueillent. « Les porcs sont bon marché et pas si prestigieux comparés au bétail, donc traditionnellement pour nous, humbles gens [culture.GetName|l], le porc est une nourriture facile. »\n\nAprès qu'il a parlé, nous entendons beaucoup de grognements bruyants dehors. Le moine glousse : « On s'habitue aux sons des porcs après un moment. Ce n'est pas différent de vivre dans une ferme avec du bétail. Quoi qu'il en soit, aimeriez-vous déguster du porc ? »"
 nubia.0272.a:0 "En raison de mes croyances [ROOT.Char.GetFaith.GetAdjective|l]s, je me dois de décliner."
 nubia.0272.b:0 "Je suis honoré de visiter cette [faith.HouseOfWorship] et de partager du porc."
 nubia.0272.c:0 "Où est le bœuf ? Comment survivez-vous avec du porc ?"
 nubia.0272.info:0 "#emphasis Contexte historique :#! Dans le Soudan moderne, les porcs, et encore moins la consommation de porc, sont rares étant donné que le pays est majoritairement musulman. Cependant, dans l'ancienne Nubie, les porcs se sont de plus en plus répandus à la période médiévale (contrairement à la Nubie antique) lorsque la majeure partie de la région était chrétienne. Bien que les bovins restaient le bétail prédominant en Nubie à l'époque, en particulier parmi les élites, les porcs sont devenus une source importante de nourriture pour les classes inférieures et les institutions religieuses. Par exemple, nous avons des preuves archéologiques de monastères et d'églises possédant de grands troupeaux de porcs, et les pèlerins qui visitaient certains de ces lieux mangeaient probablement beaucoup de porc en conséquence."
 nubia.0273.t:0 "L'Oikonomos"
 nubia.0273.desc:0 "[chaplain.GetTitledFirstName] m'a informé d'un excellent candidat pour rejoindre mon administration.\n\n« Dans l'exercice de mes fonctions en tant que votre [chaplain.GetCouncilTitle] », [chaplain.GetSheHe] explique, « je n'ai cessé d'entendre parler de cet [Glossary( 'oikonomos', 'OIKONOMOS_GLOSS' )] de la part d'un certain nombre de [ROOT.Char.Custom('DefaultPriestTitlePlural')] [ROOT.Char.GetFaith.GetAdjective]. Son nom est [oikonomos.GetFirstName], et d'après ce que j'ai entendu, [oikonomos.GetSheHe] est très instruit[oikonomos.Custom('FR_E')] et spécialisé[oikonomos.Custom('FR_E')] dans les chiffres, ayant servi [ROOT.Char.GetFaith.HouseOfWorship] non loin. Ce serait une perte de ne pas recruter quelqu'un d'aussi talentueux. »"
 nubia.0273.a:0 "Intrigant. Voyons s'ils peuvent rejoindre ma cour."
 nubia.0273.b:0 "Il vaut mieux qu'ils aident [ROOT.Char.GetFaith.HouseOfWorship]."
 nubia.0274.t:0 "Dévot de Saint Épimaque"
 nubia.0274.desc:0 "L'un de mes $knight_culture_player_plural_no_tooltip_lowercase$, [knight.GetTitledFirstName], a démontré un degré appréciable de dévotion envers [knight.GetFaith.HighGodName] et la foi [knight.GetFaith.GetAdjective|l], encore et encore. [knight.GetSheHe|U] a récemment développé un grand zèle envers [Glossary( 'Saint Épimaque', 'SAINT_EPIMACHOS_GLOSS' )], attribuant au saint-guerrier le mérite de lui avoir sauvé la vie et de l'avoir guidé dans les arts de la guerre.\n\nCela ne devrait pas surprendre : parmi les [knight.GetCulture.GetCollectiveNoun|l], bien qu'Épimaque soit loin d'être aussi populaire que, disons, [Glossary( 'Saint Raphaël', 'ARCHANGEL_RAPHAEL_GLOSS' )], il reste très, très populaire."
 nubia.0274.a:0 "Qu'Epimachos vous guide, mon $knight_culture_player_no_tooltip_lowercase$ !"
 nubia.0274.b:0 "Peu m'importe qui vous priez, tant que vous combattez bien."
 nubia.0274.c:0 "Laissez-moi me consacrer à Épimaque en suivant votre exemple !"
 nubia.0275.t:0 "Soulou"
 nubia.0275.desc:0 "J'ai récemment pris à mon service quelques [ROOT.Char.GetCulture.GetName] [Glossary( 'soulou', 'SOULOU_GLOSS' )] supplémentaires, qui ont déjà démontré leur grande discrétion et leur professionnalisme dans leurs fonctions de transport de lettres sensibles, et en tant que messagers entre moi-même et mes subordonnés.\n\nJe devrais tirer parti de leur diligence, en concentrant leurs services sur des questions spécifiques où leur discrétion et leur efficacité seraient les plus utiles…."
 nubia.0275.a:0 "Se concentrer sur les affaires politiques délicates"
 nubia.0275.b:0 "Se concentrer sur les affaires personnelles et privées"
 nubia.0275.c:0 "Se concentrer sur une correspondance rapide"
 nubia.0276.t:0 "S'installer dans les Tombes Antiques"
 nubia.0276.desc:0 "J'ai reçu la nouvelle qu'un groupe d'ermites [faith.GetAdherentNamePlural] a découvert un ancien tombeau dans les terres sauvages de [county.GetNameNoTier], et s'est installé à l'intérieur de la structure.\n\nDe telles choses se produisent occasionnellement le long de [GetGeographicalRegion('RICE_nile_river_valley').GetName], étant donné la prépondérance d'anciens monuments construits il y a longtemps et qui sont encore en relativement bon état. Il y a quelque chose de profond dans l'idée de se retirer dans un lieu de paix spirituelle et de réconfort, au milieu de l'art et de l'architecture d'époques révolues."
 nubia.0276.a:0 "Je suis sûr que les ermites s'en sortiront bien là-bas."
 nubia.0276.b:0 "Je vais faire don de quelques ressources pour les aider."
 nubia.0276.info:0 "#emphasis Contexte historique :#! Bien que l'Égypte et le Soudan aient été christianisés au début de la période médiévale, les populations trouvaient encore une utilité aux monuments antiques de la région. Les tombes, par exemple, furent réaffectées en lieux de culte religieux et d'ascétisme par des ermites. De tels actes, tels que rapportés dans les textes médiévaux, n'étaient pas nécessairement accomplis pour démontrer ou afficher la suprématie du christianisme sur les anciennes religions païennes d'Égypte et du Soudan, car ces vieilles religions n'étaient plus pratiquées et ne constituaient pas des menaces institutionnelles pour le christianisme. Au contraire, les tombes étaient probablement occupées pour des raisons pragmatiques, car il s'agissait souvent de structures d'une durabilité fiable, isolées des zones habitées tout en restant relativement proches de celles-ci."
 nubia.0277.t:0 "Un[african.Custom('FR_E')] [african.GetWomanMan] libre, ou un[african.Custom('FR_E')] esclave ?"
 nubia.0277.desc:0 "« Je suis un[african.Custom('FR_E')] [african.GetWomanMan] libre - s'il vous plaît, je vous supplie d'agir avec un cœur juste et bon en tant que [ROOT.Char.GetTitleAsNameNoTooltip] vertueux, mon [ROOT.Char.GetLadyLord] ! » supplie [african.GetFirstName], concluant son histoire.\n\nJe l'observe attentivement, essayant de déceler la moindre trace de tromperie dans ses yeux, tandis que je réfléchis à la question qui se pose. C[african.Custom('FR_EEtte')]  [african.GetFirstNameNoTooltip] est-[african.GetSheHe] vraiment un[african.Custom('FR_E')] [african.GetWomanMan] libre de culture [african.GetCulture.GetName] qui voyageait à travers [county.GetNameNoTier], et a été injustement enlevé[african.Custom('FR_E')]  par de cruels esclavagistes, comme [african.GetSheHe] le prétend ? Ou est-ce un[african.Custom('FR_E')] esclave rusé[african.Custom('FR_E')], qui utilise cette histoire pour échapper à son maître ?\n\nIl n'y a pas de réponse claire ici, mais je dois prendre une décision."
 nubia.0277.a:0 "Renvoyez c[african.Custom('FR_EEtte')] esclave menteu[african.Custom('FR_RSe')] à son maître."
 nubia.0277.b:0 "Je vous crois et je garantirai votre liberté, [african.GetFirstNameNoTooltip]."
 nubia.0277.c:0 "Vous pouvez partir libre, mais je vais également dédommager votre ancien propriétaire."
 nubia.0277.d:0 "La liberté est vôtre, à une condition : devenez m[african.Custom('FR_OnA')] courtisan[african.Custom('FR_E')]."
 nubia.0277.info:0 "#emphasis Contexte historique :#! L'Égypte médiévale abritait une population substantielle d'origine subsaharienne, dont beaucoup étaient des esclaves, mais d'autres étaient des hommes et des femmes libres, tels que des marchands, des mercenaires, des pèlerins ou d'anciens esclaves. Les sources primaires rapportent des affaires juridiques concernant des cas où des Africains libres étaient possiblement kidnappés illégalement alors qu'ils se trouvaient en Égypte et réduits en esclavage. Par exemple, le [Glossary( 'Kitāb \\'ajā\\'ib al-Hind', 'KITAB_AJA_IB_AL_HIND_GLOSS' )], un recueil d'histoires du dixième siècle, note qu'un Africain noir voyageant le long du Nil sans compagnie ni protection était considéré comme une proie facile pour des esclavagistes rapaces."
 nubia.0278.t:0 "Sainte Hilaria : une inspiration pour les femmes"
 nubia.0278.desc:0 "[courtier.GetTitledFirstName] m'a raconté comment [courtier.GetSheHe] a récemment visité [courtier.GetFaith.HouseOfWorship] [courtier.GetFaith.GetAdjective|l] proche. Là, [courtier.GetSheHe] a lu un parchemin conservé dans sa bibliothèque, qui racontait l'histoire de [Glossary( 'Saint Hilaria', 'SAINT_HILARIA_GLOSS' )], la fille de l'empereur romain Zénon, qui admirait tant les moines de [GetTitleByKey('b_wadi_natrun').GetNameNoTier] qu'elle se déguisa en eunuque pour les rejoindre.\n\nBien qu'[courtier.GetSheHe] ait déjà entendu cette histoire auparavant, la lire ainsi [courtier.GetFaith.HouseOfWorship2], fut une expérience profondément émouvante et inspirante pour [courtier.Custom('FR_LuiElle')]. [courtier.GetSheHe|U] espère vivre une vie bonne et vertueuse, guidée par l'exemple de sainte Hilaria."
 nubia.0278.a:0 "Puissiez-vous réaliser votre aspiration à vivre vertueusement."
 nubia.0278.b:0 "Je doute des convictions de [courtier.GetFirstNameNoTooltip]."
 nubia.0278.c:0 "[courtier.GetFaith.GetReligion.GetName] est une religion insensée, à mon avis."
 nubia.0279.t:0 "Ful Medames"
 nubia.0279.desc:0 "Ah…. Il n'y a rien de mieux qu'un délicieux plat de [Glossary( 'ful medames', 'FUL_MEDAMES_GLOSS' )] pour bien commencer la matinée.\n\nPlus tôt, aux premières lueurs de l'aube, mes serviteurs et cuisiniers ont travaillé dur pour me préparer ce plat savoureux à en faire saliver, comme je l'avais demandé la veille au soir. Après avoir combiné des fèves avec de l'ail, de l'oignon, du cumin et d'autres épices, ils l'ont garni d'un œuf dur et d'une pointe de citron."
 nubia.0279.a:0 "Louons [ROOT.Char.GetFaith.HighGodName] - c'est un repas simple, mais c'est #italic bon#!"
 nubia.0280.t:0 "Les anciens ateliers de poterie"
 nubia.0280.desc:0 "[councilor.GetTitledFirstName], mon [councilor.GetCouncilTitle|l], a attiré mon attention sur le fait que les ateliers de poterie [culture.GetName] de [county.GetNameNoTier] se portent bien, mais qu'ils pourraient faire encore mieux.\n\n« Ces ateliers, comme beaucoup d'autres dans [GetGeographicalRegion('RICE_greater_nubia_region').GetName], sont actifs depuis de nombreuses années, vendant leurs marchandises au loin, grâce à notre soutien », me rappelle [councilor.GetFirstNameNoTooltip], « et ils fonctionnent depuis qui sait combien de temps - des siècles même. Cependant, pour en venir au fait, je pense que ceux d'ici pourraient bénéficier d'encore plus de soutien, car ils n'ont pas aussi bien vendu aux marchands étrangers. Renforcer l'économie locale nous aidera tous à prospérer. »"
 nubia.0280.a:0 "Une bonne idée ! Soutenons cette industrie."
 nubia.0280.b:0 "Je comprends, mais nous avons d'autres priorités."
 nubia.0280.info:0 "#emphasis Contexte historique :#! Durant son apogée, l'Empire kouchite (env. VIIIe siècle av. J.-C. - IVe siècle apr. J.-C.) abritait un certain nombre d'ateliers de poterie florissants. Même après l'effondrement final de l'Empire kouchite, ces ateliers, ou leurs successeurs, continuèrent à fonctionner pendant des siècles, produisant des styles de poterie similaires, en particulier en Alodie, ou Nubie méridionale, qui était le centre de la civilisation kouchite tardive. Ce n'est là qu'un élément de preuve parmi d'autres démontrant la remarquable continuité entre les anciens Kouchites et les Nubiens médiévaux, malgré les différences de religion, de langue et de contexte politique."
 nubia.0281.t:0 "Choses qui cognent dans la nuit"
 nubia.0281.desc:0 "Quand j'ai vu [courtier.GetTitledFirstName], [courtier.GetSheHe] avait l'air hagard[courtier.Custom('FR_E')] et agité[courtier.Custom('FR_E')]. Hagard[courtier.Custom('FR_E')], je pouvais comprendre - nous étions inquiets quand [courtier.GetSheHe] a disparu la nuit dernière, mais nous fûmes soulagés de découvrir qu'[courtier.GetSheHe] s'était simplement perdu[courtier.Custom('FR_E')] en rentrant d'une visite dans un village voisin. Mais agité[courtier.Custom('FR_E')] ? Cela semblait étrange.\n\n« Je me suis trop approché des anciennes ruines [culture.GetName] près du village », expliqua [courtier.GetFirstNameNoTooltip], « et j'ai vu une lumière au loin, vers laquelle je me suis dirigé pour être en sécurité. C'est comme ça que je me suis perdu. Ce devait être un [Glossary( 'ablemba', 'ABLEMBA_GLOSS' )]. Je jure que je pensais que la lumière avait la forme d'une femme, mais l'image s'est dissipée rapidement. De tels esprits [old_faith.GetReligion.GetAdherentNamePlural] maléfiques n'obéissent pas [courtier.GetFaith.ReligiousText2] [courtier.GetFaith.GetAdherentNamePlural], alors j'ai prié ardemment [courtier.GetFaith.HighGodName] de me protéger. »"
 nubia.0281.a:0 "[ROOT.Char.GetFaith.HighGodName] vous a bien protégé."
 nubia.0281.b:0 "Ce devait être des lumières quelconques provenant d'un autre village."
 nubia.0282.t:0 "Les limites de l'hospitalité"
 nubia.0282.desc:0 "Nous fûmes heureux d'arriver dans [faith.HouseOfWorship] [culture.GetName|l] de [ROOT.Char.GetCurrentLocation.GetName], car cela signifiait que nous aurions un endroit où nous reposer pour la nuit.\n\nLes [faith.AltPriestTermPlural] [faith.GetAdherentNamePlural|l] se montrèrent très accueillants, nous disant que nous pouvions rester pour manger et nous abriter pendant quelques jours. Alors que nous nous installions confortablement, nous vîmes cependant quelques autres voyageurs à l'air dépenaillé quitter les lieux.\n\n« Nous ne refusons jamais de visiteurs », me dit l'un des [faith.AltPriestTermPlural], quand je demande ce qu'il se passe, « mais il y a des limites à notre hospitalité. Comme le veut la coutume parmi notre peuple, les visiteurs peuvent rester dans les chambres près du portail pendant quelques jours, mais pas plus. Nous avons beaucoup de visiteurs de passage, et peu d'espace pour tous les accueillir. »"
 nubia.0282.a:0 "Malheureux mais compréhensible."
 nubia.0282.b:0 "Je paierai pour que les voyageurs restent plus longtemps."
 nubia.0283.t:0 "Les Frappeurs de Pupilles"
 nubia.0283.desc:0 "Il y a longtemps, nos ancêtres et ceux des peuples [arabic.GetHeritage.GetNameNoTooltip|l]s du nord se sont livré de nombreuses batailles ; nos ancêtres ont repoussé avec succès les envahisseurs et négocié le [RICE_baqt_treaty|El] avec eux, grâce en partie aux redoutables capacités de leurs archers.\n\nEncore aujourd'hui, les peuples [arabic.GetHeritage.GetNameNoTooltip|l]s nous appellent, nous les [nubian.GetCollectiveNoun|l], les « frappeurs de pupilles ». Il existe une légende selon laquelle, lors de ces batailles d'antan, nos ancêtres visaient délibérément les yeux des [arabic.GetHeritage.GetNameNoTooltip|l]s pour les aveugler.\n\nDe telles histoires m'intéressent énormément ces derniers temps. Je ne doute pas que nos archers d'aujourd'hui puissent égaler l'habileté de nos ancêtres, si la situation l'exigeait."
 nubia.0283.a:0 "Je devrais inspirer mes archers à être comme leurs ancêtres"
 nubia.0283.b:0 "Ces récits décourageront les étrangers de nous attaquer"
 nubia.0284.t:0 "Honorer les femmes"
 nubia.0284.desc:0 "Le sermon [chaplain.GetTitledFirstNamePossessive|l] aujourd'hui, en tant que [chaplain.GetCouncilTitle|l], porte sur la glorieuse Vierge Marie et son rôle important dans nos vies.\n\n« Nous, [nubian.GetCollectiveNoun|l], contrairement à ceux de bien d'autres nations, » proclame [chaplain.GetFirstNameNoTooltip], « n'oublions jamais d'honorer les femmes dans nos vies. Car c'est à travers elles que nous nous souvenons de la sainteté de Marie, et dans leur être même, en tant que femmes, elles portent aussi cette sainteté. »"
 nubia.0284.a:0 "En effet, il n'y a aucune honte à vénérer nos mères !"
 nubia.0284.b:0 "Je doute que toutes les femmes soient saintes à ce point…."
 nubia.0284.info:0 "#emphasis Contexte historique :#! Au fil des siècles, les femmes occupaient un statut élevé dans la société nubienne, même si les rôles et les droits des femmes changèrent de diverses manières au fil du temps. Par exemple, nous avons des preuves de l'existence de plusieurs reines nubiennes antiques, mais aucune preuve que les femmes pouvaient devenir reines régnantes à l'époque médiévale ; pourtant, malgré cela, les reines mères jouèrent un rôle clé dans la politique nubienne médiévale, et nous disposons de nombreux documents démontrant que les femmes dans la Nubie médiévale pouvaient posséder, acheter et vendre des terres et des biens de manière indépendante, ainsi qu'être d'importantes mécènes de monastères et d'églises chrétiennes. Durant la période médiévale, en particulier, la Vierge Marie et son rôle en tant que mère de Jésus-Christ furent utilisés comme justification du statut élevé des femmes. Même de nos jours, les Nubiens désormais généralement musulmans expliquent leurs coutumes montrant du respect envers les femmes comme étant influencées par leur ancienne vénération chrétienne pour la Vierge Marie."
 nubia.0285.t:0 "Pots protecteurs"
 nubia.0285.desc:0 "Plusieurs de mes serviteurs [nubian.GetCollectiveNoun|l] ont pris l'habitude de graver le nom d'anges et de saints tels que [Glossary( 'Raphaël', 'ARCHANGEL_RAPHAEL_GLOSS' )] et [Glossary( 'Épimaque', 'SAINT_EPIMACHOS_GLOSS' )] sur les poteries que je possède.\n\nCes serviteurs sont des [ROOT.Char.GetFaith.GetAdherentNamePlural] diligents et dévots, qui croient fermement que de telles mesures nous protégeront des forces maléfiques - mondaines ou surnaturelles. Cela dit, graver le nom sur autant de pots que possible est peut-être un peu excessif, d'autant plus que je dois utiliser certains de ces pots pour des festins et d'autres affaires importantes."
 nubia.0285.a:0 "Je l'apprécie ! Mieux vaut être spirituellement prudent que désolé."
 nubia.0285.b:0 "Je pense que #italic tous#! mes pots devraient avoir ces inscriptions !"
 nubia.0285.c:0 "Ils devraient cesser ces absurdités inefficaces."
 nubia.0285.info:0 "#emphasis Contexte historique :#! Dans la Nubie chrétienne médiévale, le culte des anges était immensément populaire. Il est attesté par le large corpus d'inscriptions trouvées dans les sites archéologiques de toute la région portant les noms de divers archanges et saints, comme sur les murs des bâtiments, les tatouages sur les momies humaines et les récipients en poterie. Les sources égyptiennes font également mention de telles coutumes nubiennes. Invoquer les noms de ces figures religieuses sur ces surfaces était considéré comme une arme puissante pour repousser les forces du mal."
 nubia.0286.t:0 "Le Nom de l'Archange Michel"
 nubia.0286.desc:0 "Alors que je me reposais dans un village de [ROOT.Char.GetCurrentLocation.GetName], les anciens du village, que ce soit parce qu'ils étaient honorés par la présence de quelqu'un comme moi, ou parce qu'ils étaient du genre sociable, nous ont fait visiter le village, expliquant leur mode de vie et comment les choses se passaient pour eux. Pendant la visite, j'ai remarqué plusieurs villageois gravant quelque chose sur leurs maisons.\n\n« Les garçons là-bas gravent le nom de l'Archange Michel sur les murs de ces maisons nouvellement construites », explique l'une des anciennes du village qui m'accompagne, avec un sourire ridé sur le visage, lorsqu'elle remarque ma curiosité. Nous, les villageois [culture.GetCollectiveNoun|l] ici, sommes pour la plupart des gens illettrés, mais nous sommes de bons [faith.GetAdherentNamePlural] qui prient [faith.HighGodName] avec ferveur et savons que les Archanges nous protégeront tant que nous invoquerons leurs noms. »"
 nubia.0286.a:0 "Intéressant. Je vous en prie, poursuivons la visite."
 nubia.0286.b:0 "Louange à l'Archange Michel ! Qu'il vous bénisse tous."
 nubia.0286.c:0 "[ROOT.Char.GetFaith.HighGodName] vous protégerait mieux, mais ce n'est ni ici ni là."
 nubia.0287.t:0 "Un litige de Saqia"
 nubia.0287.desc:0 "[courtier_1.GetTitledFirstName] et [courtier_2.GetTitledFirstName] se sont récemment disputés violemment au sujet d'une [Glossary( 'saqia', 'SAQIA_GLOSS' )] à [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier], et ils veulent que je tranche. Ils sont tous deux actionnaires de cette #italic saqia#!, ayant contribué à parts égales à sa construction et à son entretien, conformément aux coutumes et aux lois [ROOT.Char.GetCulture.GetNameNoTooltip]s.\n\nCependant, [courtier_1.GetFirstNameNoTooltip] affirme que [courtier_2.GetFirstNameNoTooltip] ne fait pas sa part dans le financement de ce que [courtier_1.GetFirstNameNoTooltip] considère comme des réparations mineures, telles que l'entretien des cordes maintenant l'engin ensemble. [courtier_2.GetFirstNameNoTooltip] conteste cela, disant que [courtier_1.GetFirstNameNoTooltip] est paresseux et s'attend à ce qu'[courtier_2.GetHerHim] s'occupe injustement de toutes les réparations."
 nubia.0287.a:0 "Ne m'importunez pas avec votre querelle mesquine au sujet d'une [Glossary( 'saqia', 'SAQIA_GLOSS' )] quelconque."
 nubia.0287.b:0 "[courtier_1.GetFirstNameNoTooltip] a raison : [courtier_2.GetFirstNameNoTooltip] se dérobe à ses devoirs."
 nubia.0287.c:0 "[courtier_2.GetFirstNameNoTooltip] a raison : [courtier_1.GetFirstNameNoTooltip] est un[courtier_1.Custom('FR_E')] profiteu[courtier_1.Custom('FR_RSe')]."
 nubia.0287.d:0 "Assurément, vous pouvez tous les deux trouver un accord sur cette question ?"
 nubia.0287.d.tooltip:0 "Essayer de les aider à résoudre leur différend"
 nubia.0287.d.bad:0 "Vous échouez à arbitrer leur différend"
 nubia.0287.d.good:0 "Vous réussissez à arbitrer leur différend"
 nubia.0288.t:0 "La Saison Froide du Nil"
 nubia.0288.desc:0 "La vie de marchand n'est pas toujours une aventure glamour. J'apprends ces vérités aujourd'hui de la bouche de marchands de passage qui visitent ma cour pour présenter leurs respects.\n\nCes hommes font commerce à la fois en [GetGeographicalRegion('ghw_region_egypt').GetName] et en [GetGeographicalRegion('RICE_greater_nubia_region').GetName], ce qui signifie qu'ils naviguent souvent sur des bateaux qu'ils possèdent en remontant et descendant le Nil. Cependant, cette année, pour diverses raisons, ils ont fait face à des retards dans le transport de leurs marchandises à cause de la [Glossary( 'saison froide', 'NUBIA_COLD_SEASON_2_GLOSS' )].\n\n« Grâce au vent #italic Marīsī#! », se lamente l'un des marchands, « je doute que nous puissions acheminer les marchandises là où elles doivent aller. C'est notre faute pour ne pas avoir planifié correctement, mais nous avons perdu beaucoup d'argent dans cette affaire ! Cela nous stresse tous. »"
 nubia.0288.a:0 "[ROOT.Char.GetFaith.HighGodNameAlternate] donne et [ROOT.Char.GetFaith.HighGodNameAlternate] reprend."
 nubia.0288.b:0 "Pouvez-vous m'expliquer davantage ces saisons froides et ces vents ?"
 nubia.0289.t:0 "Apophtegmes des Pères du Désert"
 nubia.0289.desc:0 "Récemment, j'ai passé du temps à lire les [Glossary( 'Apophtegmes des Pères du Désert', 'SAYINGS_OF_THE_DESERT_FATHERS_GLOSS' )], trouvant un grand réconfort dans les histoires des Pères du Désert qui ont tant contribué à la religion [ROOT.Char.GetFaith.GetReligion.GetAdjective].\n\nJe trouve qu'encore aujourd'hui, à notre époque, il y a beaucoup de sagesse à tirer des leçons que ces histoires nous transmettent - une sagesse que je peux utiliser dans ma vie quotidienne, comme d'autres [ROOT.Char.GetFaith.GetAdherentNamePlural] l'ont fait pendant des générations avant moi."
 nubia.0289.a:0 "Utiliser cette sagesse pour être un[ROOT.Char.Custom('FR_E')] meilleur[ROOT.Char.Custom('FR_E')] [ROOT.Char.GetTitleAsNameNoTooltip]"
 nubia.0289.b:0 "Utiliser cette sagesse pour m'améliorer spirituellement"
 nubia.0290.t:0 "Tatouage apotropaïque de [courtier.GetFirstNamePossessiveNoTooltip]"
 nubia.0290.desc:0 "Il y a quelques jours, [courtier.GetTitledFirstName] s'est rendu[courtier.Custom('FR_E')] [courtier.GetFaith.HouseOfWorship2] proche à [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier] pour se faire tatouer [courtier.GetFaith.ReligiousSymbol] sur [courtier.GetHerselfHimself]. C'est une vieille coutume parmi les [courtier.GetFaith.GetAdherentNamePlural] [courtier.GetCulture.GetCollectiveNoun|l], donc ce n'était pas inattendu.\n\n« J'espère que ça me protégera de la maladie et de la malchance ! » dit [courtier.GetFirstNameNoTooltip] en riant, alors qu'[courtier.GetSheHe] me montre le tatouage, quand j'ai demandé à le voir aujourd'hui."
 nubia.0290.a:0 "Je suis sûr que cela vous protégera du mal."
 nubia.0290.b:0 "C'est votre tatouage, mais nous verrons bien si cela fait quelque chose."
 nubia.0290.info:0 "$RICE_east_african_tattoo_decision_context_tooltip$"
 nubia.0291.t:0 "Silos de boue [ROOT.Char.GetCulture.GetNameNoTooltip|l]"
 nubia.0291.desc:0 "Aujourd'hui, j'observe certains de mes serviteurs tandis qu'ils travaillent à la construction de nouveaux #italic Gossi#! Des silos à grains pour ma résidence.\n\nJe connais cette méthode fiable et excellente de stockage de la nourriture, évidemment, puisque nous autres [ROOT.Char.GetCulture.GetCollectiveNoun|l] l'utilisons depuis un certain temps.\n\nMalgré tout, c'est agréable de voir ces gigantesques silos de boue être construits sous mes yeux. Je ne doute pas que ces nouveaux silos serviront bien ma maisonnée."
 nubia.0291.a:0 "Je suis simplement heureux que cela existe afin que je puisse continuer à bien manger."
 nubia.0291.b:0 "Je devrais demander à mes serviteurs comment cela fonctionne exactement."
 nubia.0292.t:0 "La Gloire de Saint Raphaël"
 nubia.0292.desc:0 "Dernièrement, [courtier.GetTitledFirstName] a fait savoir à son entourage que sa santé s'est considérablement améliorée, car [courtier.GetSheHe] a évité toute maladie grave, et se sent plus fort[courtier.Custom('FR_E')] et plus énergique que jamais.\n\nLe secret ? Des prières à [Glossary( 'Saint Raphaël', 'ARCHANGEL_RAPHAEL_GLOSS' )], affirme-t-[courtier.GetSheHe].\n\nParmi les [courtier.GetFaith.GetAdherentNamePlural] [courtier.GetCulture.GetCollectiveNoun|l], de telles histoires ne sont pas inédites, car le grand Archange est renommé parmi notre peuple pour ses pouvoirs de guérison.\n\n« Priez Raphaël, » m'exhorte [courtier.GetFirstNameNoTooltip]. « Priez-le avec ferveur, et vous aussi sentirez un changement dans votre être tout entier ! »"
 nubia.0292.a:0 "Je suis inspiré à prier davantage Saint Raphaël, moi aussi !"
 nubia.0292.a.nothing:0 "Vous ne ressentez pas vraiment de différence"
 nubia.0292.a.casual:0 "Vous vous sentez un peu en meilleure santé qu'avant"
 nubia.0292.a.enthusiastic:0 "Vous vous sentez miraculeusement en bien meilleure santé qu'avant"
 nubia.0292.b:0 "Nous prions déjà tous les jours, bien entendu."
 nubia.0293.t:0 "Enterrer un nourrisson"
 nubia.0293.desc:0 "Une servante a récemment eu un bébé il y a moins d'un an, qui est malheureusement décédé.\n\nSuivant une coutume répandue parmi les [ROOT.Char.GetCulture.GetCollectiveNoun|l], on m'a humblement demandé de la laisser enterrer le nourrisson dans une grande jarre sous le sol des quartiers des serviteurs. On dit que cela aiderait ses chances de concevoir d'autres enfants à l'avenir.\n\nEt, comme ma servante me le dit sombrement, en formulant sa requête : « Bien que j'aie accepté la mort de l'enfant, en tant que mère, je ne peux pas laisser le pauvre bébé seul dans un cimetière froid. »\n\nIl m'appartient encore d'autoriser cela ou non, car c'est ma maisonnée, et certains pourraient être mal à l'aise avec cette vieille coutume."
 nubia.0293.a:0 "Je comprends. Vous pouvez enterrer votre enfant là-bas."
 nubia.0293.b:0 "Désolé, mais vous devez enterrer l'enfant au cimetière."
 nubia.0293.info:0 "#emphasis Contexte historique :#! La pratique d'enterrer des nourrissons ou de jeunes enfants décédés dans de grandes jarres sous sa maison est attestée le long du Nil en Égypte et au Soudan depuis des millénaires et même jusqu'au 20e siècle, en raison de la croyance que cela aidait les mères à avoir plus d'enfants, ou parce qu'il était inconvenant de laisser un nourrisson mort seul dans un cimetière. Sur des sites archéologiques au Soudan datant de la période médiévale, par exemple, des nourrissons ont été trouvés enterrés à la fois dans des cimetières normaux et sous des maisons. Cette coutume était également pratiquée dans de nombreuses autres parties du monde à diverses époques, comme dans la Grèce antique."
 nubia.0294.t:0 "Karkadé"
 nubia.0294.desc:0 "Je passe devant la cuisine quand je vois plusieurs de mes serviteurs préparer [Glossary( 'karkadé', 'KARKADE_GLOSS' )] de style [ROOT.Char.GetCulture.GetCollectiveNoun], car j'avais développé un goût pour cette boisson ces derniers temps. Ils font tremper des pétales séchés de roselle dans l'eau, qu'ils feront ensuite bouillir, puis mélangeront avec quelques feuilles de menthe après refroidissement."
 nubia.0294.a:0 "Les rejoindre pour préparer le #italic karkadé#!"
 nubia.0294.b:0 "Les observer puis reprendre ma route"
