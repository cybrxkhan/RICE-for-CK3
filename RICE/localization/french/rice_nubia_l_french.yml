 nubia.0012.t:0 "Mort sur le Nil"
 nubia.0012.desc:0 "Le chaos éclate le long du Nil alors que la Reine Mère [rasad.GetFirstName] perd son emprise sur l'Égypte en tant que régente de facto. Des factions de l'armée fatimide s'affrontent ouvertement dans les villes et se livrent au pillage, le gouvernement central ne pouvant les payer, tandis que l'Égypte souffre de famine.\n\nDeux factions de l'armée fatimide ont émergé comme les plus puissantes. Les unités turques sont dominées par un petit noyau de cavaliers d'élite ; leur plus puissant commandant, l'impitoyable [nasir_al_dawla.GetNickname], ne reculera devant rien pour devenir le #italic de facto#! dictateur militaire de l'Égypte. La faction africaine, quant à elle, se compose principalement d'infanterie noire menée par [nahid_al_dawla.GetNickname]. [rasad.GetFirstNameNoTooltip], elle-même d'ascendance africaine, a lié son sort à celui de ses compatriotes, dans l'espoir qu'ils l'aideront à rester au pouvoir.\n\nAlors que ces deux groupes s'affrontent, d'autres attendent en coulisses, comme [badr_al_jamali.GetFirstName], le plus capable des commandants fatimides au Levant, et la famille [banu_kanz.GetDynastyName] de seigneurs de guerre qui gardent la frontière entre l'Égypte et la Nubie."
 nubia.0012.a:0 "C'est une période de grande calamité pour l'Égypte...."
 nubia.0012.tooltip.intro:0 "#emphasis Contexte historique :#! Les années 1060 et le début des années 1070 furent une période de grands bouleversements dans l'Égypte fatimide, connue plus tard sous le nom de #italic al-shidda al-'uzma#!, ou « grande calamité », bien que certaines recherches récentes aient émis l'hypothèse que les sources historiques (souvent plus tardives) l'ont exagérée jusqu'à des proportions apocalyptiques.\n\nDans les récits traditionnels, l'État fatimide était déchiré par une guerre civile entre diverses factions militaires, notamment les unités africaines noires et les unités turques, et la situation fut aggravée par des famines et de mauvaises crues du Nil. Finalement, l'ordre fut restauré lorsqu'un général d'ascendance arménienne, #bold Badr al-Jamali#!, élimina ses rivaux ; le calife fatimide #bold al-Mustansir#! fit de lui son vizir, et lui accorda des pouvoirs qui firent de lui un dictateur militaire #italic de facto#! à vie."
 nubia.0012.tooltip.al_mustansir:0 "$nubia.0012.tooltip.intro$\n\nLorsque le règne du calife al-Mustansir débuta en 1036, il fut initialement prospère et stable, bien que dès le début, il n'eût que peu de pouvoir. Dans ses premières années, sa régente de fait était sa mère, Rasad, une concubine esclave africaine de son père. Tout au long de son long règne, il fut impuissant à arrêter les luttes intestines entre les différentes factions à la cour et dans l'armée ; selon les sources, durant la guerre civile fatimide, ses richesses furent pillées par des troupes prédatrices, au point qu'il dut survivre grâce à des dons charitables.\n\nLorsqu'al-Mustansir mourut en 1094 de notre ère, les Fatimides subirent une lutte de succession entre ses deux fils, Nizar et al-Musta'li. À cette époque, la dynastie fatimide avait déjà perdu une grande partie de son pouvoir."
 nubia.0012.tooltip.rasad:0 "$nubia.0012.tooltip.intro$\n\nLorsque le règne du calife al-Mustansir débuta en 1036, il fut initialement prospère et stable, bien que même au début, il eût peu de pouvoir. Dans ses premières années, sa régente de facto était sa mère, Rasad, une concubine esclave africaine de son père.\n\nPlus tard, Rasad perdit beaucoup de pouvoir en raison de l'influence croissante des factions turques de l'armée fatimide. Elle tenta de contrebalancer cela en soutenant les unités africaines de l'armée fatimide, mais lorsque ces dernières perdirent la guerre civile qui s'ensuivit, elle dut fuir à Bagdad, et il existe peu de traces d'elle par la suite."
 nubia.0012.tooltip.nasir_al_dawla:0 "$nubia.0012.tooltip.intro$\n\n#bold Nasir al-Dawla#!, un commandant des unités turques, avait servi les Fatimides pendant un certain temps, ayant même été paralysé du bras au combat. Il n'était pas d'extraction turque, mais descendait plutôt de la dynastie arabe des Hamdanides qui contrôla une grande partie de la Syrie et de la Mésopotamie au Xe siècle.\n\nNasir al-Dawla mena les factions turques à la victoire sur les factions africaines durant la guerre civile fatimide, et devint le vizir d'al-Mustansir. Cependant, son règne impitoyable et tyrannique entraîna des divisions entre les unités turques, et lui et sa famille furent assassinés par des Turcs rivaux en 1073."
 nubia.0012.tooltip.badr_al_jamali:0 "$nubia.0012.tooltip.intro$\n\nContrairement aux autres généraux impliqués dans la guerre civile fatimide, Badr al-Jamali était à l'origine le seul commandant militaire majeur en dehors de l'Égypte proprement dite, maintenant les derniers territoires fatimides au Levant face à l'assaut seldjoukide.\n\nDurant son mandat de vizir, Badr al-Jamali mena des réformes administratives, parraina de nombreux projets de construction et repoussa de nouvelles attaques seldjoukides contre l'Égypte. Il sauva effectivement le régime fatimide, mais les Fatimides allaient devenir des marionnettes virtuelles de sa famille et d'autres généraux arméniens jusqu'en 1163, durant une nouvelle génération de luttes intestines qui mènerait finalement à l'ascension de Saladin et des Ayyoubides."
 nubia.0012.tooltip.nahid_al_dawla:0 "$nubia.0012.tooltip.intro$\n\n#bold Nahid al-Dawla#! était un général de premier plan des troupes africaines pendant la guerre civile fatimide. Bien que supérieures en nombre aux unités turques, les unités africaines étaient principalement (mais pas exclusivement) composées d'infanterie, et furent finalement vaincues ; la plupart s'enfuirent vers le sud, en Haute-Égypte, autour d'Assouan, où elles étaient alliées aux Banu Kanz qui gouvernaient les frontières méridionales de l'Égypte pour le compte des Fatimides.\n\nBien que les unités africaines furent finalement éliminées, des soldats africains, esclaves comme hommes libres, continuèrent à servir les Fatimides pendant des décennies."
 nubia.0012.tooltip.banu_kanz:0 "$nubia.0012.tooltip.intro$\n\nLes #bold Banu Kanz#! avaient gouverné les frontières méridionales de l'Égypte au nom des Fatimides pendant des décennies. Ils descendaient des Banu Hanifa, arrivés en Égypte dans les années 800, et devenus prospères en dominant les mines d'or de l'est de l'Égypte.\n\nAu fil du temps, ils se marièrent avec une tribu Beja, les Hadariba, et devinrent d'importants faiseurs de rois dans la région, notamment durant la guerre civile fatimide. Lorsque les Ayyoubides renversèrent les Fatimides, les Banu Kanz furent également vaincus, migrèrent vers le sud en Nubie et s'assimilèrent au mode de vie nubien."
 nubia.0012.tooltip.ildekuz:0 "$nubia.0012.tooltip.intro$\n\n#bold Ildekuz#! était un commandant des unités turques pendant la guerre civile fatimide, et un rival majeur de Nasir al-Dawla, qui mena la faction turque à la victoire mais fut finalement assassiné en 1073 lorsqu'il devint trop tyrannique en tant que vizir. Après que Badr al-Jamali eut restauré l'ordre en Égypte, il fit assassiner Ildekuz lors d'une purge des officiers turcs."
 nubia.0012.tooltip.yaldakush:0 "$nubia.0012.tooltip.intro$\n\n#bold Yaldakush#! était un commandant des unités turques durant la guerre civile fatimide, et un rival majeur de Nasir al-Dawla, qui mena la faction turque à la victoire mais fut finalement assassiné en 1073 lorsqu'il devint trop tyrannique en tant que vizir. Après que Badr al-Jamali eut restauré l'ordre en Égypte, il fit assassiner Yaldakush lors d'une purge des officiers turcs."
 nubia.0012.tooltip.kutama:0 "$nubia.0012.tooltip.intro$\n\nLes #bold Berbères Kutama#! formaient une faction de l'armée fatimide alliée au commandant turc Ildekuz durant la guerre civile fatimide. À l'origine, les Berbères constituaient un pilier de l'armée fatimide, car les Fatimides étaient originaires plus à l'ouest, au Maghreb."
 nubia.0012.tooltip.banu_sanin:0 "$nubia.0012.tooltip.intro$\n\nLes #bold Banu Sanin#! étaient une tribu arabe établie dans le delta du Nil en Égypte. Durant la guerre civile fatimide, ils étaient alliés au général Nasir al-Dawla, qui avait mené la faction turque à la victoire mais fut finalement assassiné en 1073 lorsqu'il devint trop tyrannique en tant que vizir. Auparavant, lorsqu'un commandant rival, Ildekuz, expulsa Nasir al-Dawla du Caire, celui-ci avait trouvé refuge auprès des Banu Sanin."
 nubia.0012.tooltip.lawata:0 "$nubia.0012.tooltip.intro$\n\nUn groupe de #bold Berbères Lawata#! basé sur la côte et le désert à l'ouest du Nil était une faction majeure durant la guerre civile fatimide. À l'origine, les Berbères étaient un pilier de l'armée fatimide, car les Fatimides étaient originaires plus à l'ouest, au Maghreb."
 nubia.0012.tooltip.taj_al_maluk:0 "$nubia.0012.tooltip.intro$\n\n#bold Taj al-Muluk#! était un allié du général fatimide Nasir al-Dawla, qui avait mené la faction turque à la victoire mais fut finalement assassiné en 1073 lorsqu'il devint trop tyrannique en tant que vizir. Avant cela, Nasir al-Dawla avait fait de Taj al-Muluk son adjoint dans la capitale fatimide, Le Caire."
 nubia.0013.t:0 "La Seconde Église de Banganarti"
 nubia.0013.desc:0 "Banganarti, près de [GetTitleByKey('b_old_dongola').GetNameNoTier], a servi de centre religieux local dédié à [Glossary( 'Saint Raphaël', 'ARCHANGEL_RAPHAEL_GLOSS' )] pendant de nombreuses années, attirant des pèlerins [GetReligionByKey('christianity_religion').GetAdherentNamePlural] des environs. Cependant, au fil du temps, l'église originelle de Banganarti, construite lorsque le [GetReligionByKey('christianity_religion').GetName] est arrivé pour la première fois en [GetGeographicalRegion('RICE_greater_nubia_region').GetName], est devenue décrépite, tombant en ruines faute d'entretien.\n\nConscient de ce triste état de fait, [rebuilder.GetTitledFirstName] a financé la construction d'une nouvelle église à Banganarti sur les ruines de l'ancienne. Elle est plus grande et plus belle, et dispose d'installations pouvant répondre aux besoins religieux des fidèles qui viennent y prier et guérir.\n\nLa nouvelle de la transformation de Banganarti se répand le long du Nil, et sa renommée grandit encore davantage. Sans aucun doute, cela attirera encore plus de pèlerins à long terme."
 nubia.0013.a:0 "Banganarti gagnera beaucoup de ce renouveau en quelque sorte."
 nubia.0014.t:0 "L'Essor des [culture.GetCollectiveNounNoTooltip]"
 nubia.0014.desc:0 "Pendant des siècles, les relations entre l'[GetGeographicalRegion('ghw_region_egypt').GetName] et la [GetGeographicalRegion('RICE_greater_nubia_region').GetName] étaient régulées par le [RICE_baqt_treaty|El], incluant la régulation du trafic entre ces deux régions, en théorie. En pratique, de larges populations ont fréquemment traversé la frontière, avec ou sans permission, depuis longtemps maintenant.\n\n"
 nubia.0014.desc.sudanese_arabic:0 "La [GetGeographicalRegion('RICE_greater_nubia_region').GetNameNoTooltip] est désormais témoin de l'aboutissement de cette tendance. Un nombre significatif de tribus $heritage_arabic_name$ habitent maintenant ces terres et, sous la direction de [sudanese_ruler.GetTitledFirstName], ont même développé une nouvelle identité unique, celle des [culture.GetCollectiveNoun].\n\nLa présence de ces locuteurs du [culture.GetLanguage.GetName] au sud de la première cataracte est déjà en train de changer le paysage politique, économique et culturel de la région - pour le meilleur ou pour le pire, seul le temps le dira."
 nubia.0014.desc.sudanese_nubian:0 "L'[GetGeographicalRegion('ghw_region_egypt').GetName] est désormais le théâtre de l'aboutissement de cette tendance. Un nombre significatif de tribus $heritage_east_african_name$ habitent désormais ces terres et, sous la direction de [sudanese_ruler.GetTitledFirstName], ont même développé une nouvelle identité unique, celle des [culture.GetCollectiveNoun].\n\nLa présence de ces locuteurs du [culture.GetLanguage.GetName] au nord de la première cataracte est déjà en train de changer le paysage politique, économique et culturel de la région - pour le meilleur ou pour le pire, seul le temps le dira."
 nubia.0014.a:0 "C'est une époque de grands changements le long du Nil."
 nubia.0015.t:0 "$nubia.0014.t$"
 nubia.0015.desc:0 "L'émergence d'une nouvelle identité [culture.GetName] est l'aboutissement d'années de présence majeure $heritage_east_african_name$ en [GetGeographicalRegion('ghw_region_egypt').GetName]. Même s'ils ne sont pas majoritaires, ils se sont imposés comme une force avec laquelle il faut compter.\n\nPeut-être est-il temps que nous aussi, nous nous considérions comme faisant partie de cette communauté grandissante...."
 nubia.0015.a:0 "Nous aussi, nous embrasserons cette nouvelle identité [culture.GetName] !"
 nubia.0015.b:0 "Nous nous considérons toujours comme [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip]."
 nubia.0016.t:0 "$nubia.0014.t$"
 nubia.0016.desc:0 "L'émergence d'une nouvelle identité [culture.GetName] est l'aboutissement d'années de présence majeure $heritage_arabic_name$ en [GetGeographicalRegion('ghw_region_egypt').GetName]. Même s'ils ne sont pas majoritaires, ils se sont imposés comme une force avec laquelle il faut compter.\n\nPeut-être est-il temps que nous aussi, nous nous considérions comme faisant partie de cette communauté grandissante..."
 nubia.0016.a:0 "$nubia.0015.a$"
 nubia.0016.b:0 "$nubia.0015.b$"
