 trait_RICE_lord_of_the_mountain_name:0 "Seigneur de la Montagne"
 trait_RICE_former_lord_of_the_mountain_name:0 "Ancien Seigneur de la Montagne"
 trait_RICE_lord_of_the_mountain_desc:0 "Ce personnage a de l'expérience en tant que [Glossary( 'Migin Soñoj', 'LORD_OF_THE_MOUNTAIN_GLOSS' )], traditionnellement l'[Glossary( 'Éparque de Nobatie', 'LORD_OF_THE_MOUNTAIN_GLOSS' )], le fonctionnaire chargé de maintenir la frontière entre l'Égypte et la Nubie et de superviser les transactions du [RICE_baqt|El] du côté nubien.\n\n#weak Ce [trait|El] est accordé à quiconque détient le [duchy|El] de $d_nobatia$.#! $TRAIT_FLAG_DESC_rice_lord_of_the_mountain_xp_gain$"
 trait_RICE_lord_of_the_mountain_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] a de l'expérience en tant que [Glossary( 'Migin Soñoj', 'LORD_OF_THE_MOUNTAIN_GLOSS' )], traditionnellement l'[Glossary( 'éparque de Nobatie', 'LORD_OF_THE_MOUNTAIN_GLOSS' )], le fonctionnaire chargé de maintenir la frontière entre l'Égypte et la Nubie et de superviser les transactions du [RICE_baqt|El] du côté nubien.\n\n#weak Ce [trait|El] est accordé à quiconque détient le [duchy|El] de $d_nobatia$.#!$TRAIT_FLAG_DESC_rice_lord_of_the_mountain_xp_gain$"
 trait_track_RICE_lord_of_the_mountain:0 "$trait_RICE_lord_of_the_mountain$"
 trait_track_RICE_lord_of_the_mountain_desc:0 "#italic La relation entre l'Égypte et la Nubie est régie par les stipulations du [RICE_baqt_treaty|El], dans lequel les gouverneurs frontaliers jouent un rôle important.#!"
 trait_RICE_lord_of_the_mountain_3_character_desc:"[ROOT.GetCharacter.GetFirstNameNoTooltip] est un administrateur et un arbitre exceptionnel, faisant [ROOT.GetCharacter.Custom('FR_DDe')] [ROOT.GetCharacter.GetSheHe] un choix parfait en tant que $trait_RICE_lord_of_the_mountain$."
 trait_RICE_lord_of_the_mountain_2_character_desc:"[ROOT.GetCharacter.GetFirstNameNoTooltip] possède une grande expérience dans l'administration des terres, notamment en tant qu'actue[ROOT.GetCharacter.Custom('FR_LLle')] ou ancien[ROOT.GetCharacter.Custom('FR_E')] $trait_RICE_lord_of_the_mountain$."
