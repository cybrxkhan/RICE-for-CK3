 # Custom Localization 
 RICE_saint_catherine_ashtiname_of_muhammad:0 "Ashtiname de Mahomet"
 RICE_saint_catherine_ashtiname_of_muhammad_desc:0 "L'#bold Ashtiname de Muhammad#!, ou Pacte de Muhammad, est une charte codifiant les protections et privilèges accordés aux moines chrétiens du monastère Sainte-Catherine par le prophète musulman Muhammad. Le document original est encore conservé au monastère pour sa sauvegarde jusqu'à ce jour."
 RICE_saint_catherine_bedouin_guards:0 "Gardes bédouins"
 RICE_saint_catherine_bedouin_guards_desc:0 "Malgré les différences religieuses, et malgré certaines tensions ou conflits au fil des années, le monastère Sainte-Catherine a été protégé par des #bold Gardes Bédouins#! au cours des siècles, qui le défendent contre toutes sortes de raids et d'attaques - y compris ceux d'autres tribus bédouines."
 RICE_saint_catherine_burning_bush:0 "Buisson ardent"
 RICE_saint_catherine_burning_bush_desc:0 "Le monastère Sainte-Catherine renferme un vieux buisson épineux qui serait le #bold Buisson Ardent#! où Moïse fut désigné par Dieu pour mener les Israélites hors de l'esclavage en Égypte, vers la liberté en Canaan."
 RICE_saint_catherine_collection_of_icons:0 "Icônes du monastère"
 RICE_saint_catherine_collection_of_icons_desc:0 "Au fil des siècles, le monastère Sainte-Catherine a rassemblé un certain nombre d'#bold icônes#!, dans plusieurs styles artistiques représentant diverses confessions chrétiennes, et reflétant différents thèmes et sujets chrétiens ou événements de la Bible."
 RICE_saint_catherine_monasterys_library:0 "Bibliothèque du monastère"
 RICE_saint_catherine_monasterys_library_desc:0 "La #bold bibliothèque#! du monastère Sainte-Catherine est vieille de plusieurs siècles et abrite une collection de manuscrits rédigés en diverses langues. Certains ont été offerts par des pèlerins et de fervents chrétiens venus de terres lointaines."
 RICE_saint_catherine_path_of_moses:0 "Chemin de Moïse"
 RICE_saint_catherine_path_of_moses_desc:0 "Le dit #bold Chemin de Moïse#! commence au monastère Sainte-Catherine, passe par deux arches, la Porte d'Étienne et la Porte de la Loi, et retrace les pas que Moïse a empruntés dans les montagnes voisines pour recevoir les Dix Commandements de Dieu."
 RICE_saint_catherine_relics_of_saint_catherine:0 "Reliques de sainte Catherine"
 RICE_saint_catherine_relics_of_saint_catherine_desc:0 "Le monastère Sainte-Catherine fut nommé ainsi il y a des siècles lorsque les #bold reliques de Sainte Catherine d'Alexandrie#!, la Grande Martyre, furent découvertes à proximité du monastère. Depuis lors, ces reliques sont conservées au monastère pour être protégées."
 RICE_saint_catherine_well_of_moses:0 "Puits de Moïse"
 RICE_saint_catherine_well_of_moses_desc:0 "Le monastère Sainte-Catherine renferme un puits qui serait le fameux #bold Puits de Moïse#!, où il rencontra sa future épouse, Séphora, lorsqu'il arriva au pays des Madianites. Aujourd'hui encore, le puits sert de source d'eau pour le monastère."
 RICE_nubia_dream_type_health:0 "un rêve de #V guérison#!, car il symbolisait les efforts de Saint Raphaël pour me guérir de diverses affections, qu'elles soient physiques, mentales ou spirituelles."
 RICE_nubia_dream_type_prophetic:0 "#V prophétique#! par nature, car il est clair que Saint Raphaël souhaite avertir de dangers à éviter, ou de bonnes opportunités ou bénédictions qui se présenteront à moi, dans le futur."
 RICE_nubia_dream_type_inspiring:0 "destiné à être #V inspirant#!, Saint Raphaël souhaitant m'insuffler un sens de la motivation et de la discipline pour accomplir mes objectifs vertueux."
 RICE_nubia_dream_type_advice:0 "une sorte de #V conseil#! de Saint Raphaël, me donnant de sages recommandations sur la manière de gérer diverses affaires de ma vie, en particulier celles qui m'ont causé beaucoup de tourments."
 RICE_nubia_baqt_real_document_excerpt_01:0 "Je remercie la noble, très glorieuse et munificente présence, le [ROOT.Char.Custom('RICE_nubia_egypt_border_official_gloss_type_loc')]; que Dieu établisse son bonheur, car [ROOT.Char.GetSheHe] a gracieusement [Glossary( 'libéré les bateaux', 'NUBIA_RELEASED_THE_BOATS_GLOSS' )]."
 RICE_nubia_baqt_real_document_excerpt_02:0 "Le [ROOT.Char.Custom('RICE_nubia_egypt_border_official_gloss_type_loc')], par conséquent, doit protéger mon peuple et prendre soin de lui conformément à ses droits, et d'autant plus qu'il appartient à ceux dont le droit à la protection est obligatoire et dont le service est une exigence impérative."
 RICE_nubia_baqt_real_document_excerpt_03:0 "Le [ROOT.Char.Custom('RICE_nubia_egypt_border_official_gloss_type_loc')] sait ce qui est requis en ce qui concerne la retenue de ses compagnons et l'imposition d'obligations à leur égard et la prévention de ceux qui s'opposent à lui par le mal et le dommage."
 RICE_nubia_baqt_real_document_excerpt_04:0 "M[random_different.Custom('FR_OnA')] b[random_different.Custom('FR_EauElle')]-[random_different.Custom('GetDaughterSon')], qui est appelé[random_different.Custom('FR_E')] [random_different.GetFirstNameNoTooltip], [random_different.GetHerHim]  marchand[random_different.Custom('FR_E')] , est venu à vous. [random_different.GetSheHe|U] a subi la perte d'une dette qui lui était due par des gens dépensiers connus sous le nom de fils de [random_different_2.GetFirstNameNoTooltip]..."
 RICE_nubia_baqt_real_document_excerpt_05:0 "Envoyé par celui qui est reconnaissant pour la munificence du [ROOT.Char.Custom('RICE_nubia_egypt_border_official_gloss_type_loc')], [random_same.GetFirstNameNoTooltip], le pèlerin."
 RICE_nubia_baqt_real_document_excerpt_06:0 "Je souhaiterais qu'une lettre soit envoyée à tous les administrateurs leur demandant de protéger les lieux de [random_different.GetFirstNameNoTooltip] et de ses esclaves, ainsi que mes lieux et mes esclaves. Vous savez qu'ils vous rendent tous de bons services."
 RICE_nubia_baqt_real_document_excerpt_07:0 "J'avais l'intention d'envoyer un messager à [ROOT.Char.GetLiege.GetTitledFirstName] avec les marchandises que j'ai achetées pour [ROOT.Char.GetLiege.GetSheHe] et le cheval que j'ai préparé pour [ROOT.Char.GetLiege.GetHerHim], ainsi que l'équipement qu'[ROOT.Char.GetLiege.GetSheHe] m'a demandé."
 RICE_nubia_baqt_real_document_excerpt_08:0 "Mon esclave [random_different_2.GetFirstNameNoTooltip] est arrivé humilié et lésé par [random_different.GetFirstNameNoTooltip]. J'avais informé votre [ROOT.Char.GetFaith.BishopNeuter] [random_same.GetFirstNameNoTooltip] de ma souffrance due au comportement choquant de [random_different.GetFirstNamePossessiveNoTooltip]. Veuillez m'écrire une réponse à cette lettre et lire ma lettre au [ROOT.Char.GetFaith.BishopNeuter], car il y a eu de bonnes relations entre nous. Car [random_different.GetFirstNameNoTooltip] est-il comme [Glossary( 'un roi', 'NUBIA_THE_KING_GLOSS' )] et nous ses esclaves et ses rampants ? [random_different.GetFirstNameNoTooltip] est celui qui est coupable d'avoir initié cela."
 RICE_nubia_baqt_real_document_excerpt_09:0 "Si vous aviez la bonté d'envoyer une lettre à [ROOT.Char.GetLiege.GetTitledFirstName], que [ROOT.Char.GetFaith.HighGodName] préserve sa vie, l'informant de tout ce que j'ai mentionné dans cette lettre et de mon souhait de venir dans son pays, alors je vous prie de le faire. Obtenez également pour moi [ROOT.Char.Custom('FR_DDe')] [ROOT.Char.GetHerHim] une lettre du [ROOT.Char.GetLiege.GetTitleAsNameNoTooltip] pour vous, le [ROOT.Char.Custom('RICE_nubia_egypt_border_official_gloss_type_loc')]...."
 RICE_nubia_baqt_real_document_excerpt_10:0 "Quant à ce que vous avez dit au sujet du service de [ROOT.Char.GetLiege.GetTitledFirstName], nous sommes tous ses serviteurs et esclaves de la couronne, ses sujets. Je suis le serviteur du [ROOT.Char.GetLiege.GetTitleAsNameNoTooltip] et vous, son député."
 RICE_nubia_baqt_real_document_excerpt_11:0 "[ROOT.Char.GetLiege.GetTitledFirstName] me doit deux chevaux. [ROOT.Char.GetLiege.GetSheHe|U] m'a envoyé deux vieilles esclaves bonnes à rien et six dīnārs."
 RICE_nubia_baqt_real_document_excerpt_12:0 "Quand votre esclave m'a informé que vous aviez besoin des marchandises, j'ai livré l'esclave au courtier et il l'a mis aux enchères et a obtenu une offre de cinq dīnārs. Je suis alors allé voir votre esclave et l'ai consulté concernant sa vente et l'ai vendu pour cinq dīnārs, au motif qu'il n'y a personne dans le pays et qu'aucun des gens n'a quoi que ce soit."
 RICE_nubia_baqt_real_document_excerpt_13:0 "La fille esclave fut inspectée et le prix payé pour elle était de dix dīnārs, mais ils découvrirent qu'elle était infirme et ils la rendirent. Je l'avais proposée à la vente à une femme pour douze dīnārs et sept dirhams dans une transaction privée."
 RICE_nubia_baqt_real_document_excerpt_14:0 "Quant à la situation de la cargaison commerciale, puisque votre honneur l'a demandé, lorsque j'ai atteint la terre, j'ai demandé au sujet des marchandises, mais n'en ai trouvé aucune. Je n'ai pas voulu négliger cela et j'ai donc envoyé quelqu'un vers le nord pour les acheter dans une autre ville."
 RICE_nubia_baqt_real_document_excerpt_15:0 "Si les marchandises deviennent plus chères, nous ne les vendrons pas à ceux qui se réfugient dans les maisons avec les femmes en raison de l'inflation. Il ne reste plus de marchandises au marché. Le prix de toutes les épices au marché que j'ai mentionnées a doublé."
 RICE_nubia_baqt_real_document_excerpt_16:0 "Je demande pardon. J'ai envoyé un morceau de vêtement rayé d'Irak en lieu et place d'un paiement en espèces. Veuillez me pardonner, encore une fois."
 RICE_nubia_baqt_real_document_excerpt_17:0 "[Glossary( 'Le froid sera bientôt sur nous', 'NUBIA_COLD_SEASON_GLOSS' )] et je ne serai pas en mesure de mener mes affaires et le vent #italic Marīsī#! ne me permettra pas d'arriver. Alors, dis-leur de se dépêcher d'exécuter mes demandes et de me livrer l'esclave."
 RICE_nubia_baqt_real_document_excerpt_18:0 "Quant à l'esclave femme susmentionnée, elle ne m'est pas parvenue afin que j'en prenne possession, ô [ROOT.Char.Custom('RICE_nubia_egypt_border_official_gloss_type_loc')], et je ne correspondrai pas avec vous, ni ne vous donnerai de cargaisons de tissu en cadeau tant que l'esclave que j'ai demandée ne sera pas à ma disposition, livrée par vos serviteurs."
 RICE_nubia_baqt_real_document_excerpt_19:0 "Quant à votre officiel, je lui ai rendu visite un jour et il m'a dit « Nous exécuterons vos requêtes », mais je ne l'ai pas revu depuis et ils ne me permettent pas de lui rendre visite. Il m'a ensuite dit « Quand une lettre viendra de mon maître, le [ROOT.Char.Custom('RICE_nubia_egypt_border_official_gloss_type_loc')], j'exécuterai vos requêtes. » Je vous écris donc cette lettre."
 RICE_nubia_baqt_real_document_excerpt_20:0 "Votre porteur s'est enfui avec ma propriété. Veuillez faire en sorte que votre ordre soit donné à certains de vos esclaves pour qu'ils lui extraient de force ce qui est approprié, si [random_different.GetFaith.HighGodName] le veut."
 RICE_nubia_baqt_real_document_excerpt_21:0 "Chaque année, un [Glossary( 'grand nombre de bateaux', 'NUBIA_RELEASED_THE_BOATS_GLOSS' )] se rendent sur votre terre et vos collègues les maltraitent gravement. Cette année, mon peuple a été entravé par vous, le [ROOT.Char.Custom('RICE_nubia_egypt_border_official_gloss_type_loc')], de deux manières. L'une d'elles est l'injustice qui leur a été faite par les gens du pays et l'autre est le manque de produits. J'ai envoyé deux bateaux et tout ce qu'ils contiennent m'appartient. J'aimerais que vous vous assuriez que personne ne les entrave."
 RICE_nubia_baqt_real_document_excerpt_22:0 "Je vous ai écrit au sujet de la condition de mes serviteurs, ô [ROOT.Char.Custom('RICE_nubia_egypt_border_official_gloss_type_loc')], mais vous n'avez pas répondu. Je vous ai écrit au sujet de la condition des deux esclaves qui doivent être envoyés à mon créancier, [random_different.GetFirstNameNoTooltip], mais vous ne me les avez pas envoyés et je ne sais pas si votre serviteur nous a donné une part. Où est ma réponse ?"
 RICE_nubia_baqt_real_document_excerpt_23:0 "Ce que je souhaite informer [ROOT.Char.Custom('RICE_nubia_egypt_border_official_gloss_type_loc')] est que mon esclave [random_different.GetFirstNameNoTooltip] est arrivé à la cour de [ROOT.Char.GetLiege.GetTitledFirstName], mais [ROOT.Char.GetLiege.GetTitleAsNameNoTooltip] a montré peu de gratitude pour ce que j'ai entrepris pour [ROOT.Char.GetLiege.Custom('FR_LuiElle')]. Ma relation avec vous a été gâchée depuis que [ROOT.Char.GetLiege.GetTitleAsNameNoTooltip] traite mon esclave d'une si mauvaise manière."
 RICE_nubia_baqt_real_document_excerpt_24:0 "J'informe le [ROOT.Char.Custom('RICE_nubia_egypt_border_official_gloss_type_loc')] - puisse [random_different.GetFaith.HighGodName] prolonger sa vie, et faire perdurer sa protection et son bien-être - que sa lettre à mon attention a fait référence à la condition des voyageurs des bateaux et d'autres. [ROOT.Char.GetSheHe|U] s'est efforcé[ROOT.Char.Custom('FR_E')] d'améliorer cette situation et a gracieusement [Glossary( 'libéré les bateaux', 'NUBIA_RELEASED_THE_BOATS_GLOSS' )], en connaissance de ce que le pays subit en ce qui concerne la [Glossary( 'hausse des prix', 'NUBIA_RISING_OF_PRICES_GLOSS' )], car les marchands ont souffert de grandes difficultés à cause de cela."
 RICE_nubia_baqt_real_document_excerpt_25:0 "Le [ROOT.Char.Custom('RICE_nubia_egypt_border_official_gloss_type_loc')] n'a-t-il besoin de rien ? Qu'[ROOT.Char.GetSheHe] donne ses instructions pour que cela soit accompli et je serais reconnaissant de l'occasion de rendre ce service, si [random_different.GetFaith.HighGodName] le veut."
 RICE_nubia_baqt_real_document_excerpt_26:0 "J'envoie à l'honorable [ROOT.Char.Custom('RICE_nubia_egypt_border_official_gloss_type_loc')] les salutations les plus chaleureuses, l'amour et le respect les plus purs, des vœux de prospérité future, si [ROOT.Char.GetFaith.HighGodName] le veut. Veuillez ne pas tarder à m'envoyer des lettres au sujet de vos nouvelles."
 RICE_nubia_baqt_real_document_excerpt_27:0 "[ROOT.Char.GetLiege.GetTitledFirstName] dit, si quelqu'un s'oppose et nie sa déclaration, que [Glossary( 'Saint Epimachos', 'SAINT_EPIMACHOS_GLOSS' )] les transperce de sa lance, et qu'ils meurent par la malédiction du [ROOT.Char.GetLiege.GetTitleAsNameNoTooltip]."
 RICE_nubia_baqt_real_document_excerpt_28:0 "Ce qu'ils, les témoins de la vente de terre, ont mangé et bu dans le bureau d'écriture est : 29 pains, 4 anati, 1 jarre de gide, 4 boisseaux de grain, que nous lui avons donnés, 1 anapiti, 4 pains, 1 palal de gide, pour le scribe 2 anapiti, 10 pains, 1 palal de gide."
 RICE_nubia_baqt_real_document_excerpt_29:0 "Quiconque parmi les scribes de [random_same.GetFirstNamePossessiveNoTooltip] me dénigrera en disant que je ne suis pas l'auteur de mon document, qu'il soit séparé de [ROOT.Char.GetFaith.HighGodName], et que ce qui se trouve dans le 7e sceau de l'Apocalypse se déchaîne contre eux."
 RICE_nubia_baqt_real_document_excerpt_30:0 "Je vous informe que votre lettre est arrivée dimanche. Quand vous l'apprendrez, ne soyez pas abattu, car je partirai. Restez ensemble, et ne perdez pas courage quand je partirai. Restez ensemble, car sinon je ne dormirai pas. [random_same.GetFirstNameNoTooltip] envoie ses salutations."
 RICE_nubia_baqt_real_document_excerpt_31:0 "Viens, accomplis tes devoirs, ô [ROOT.Char.Custom('RICE_nubia_egypt_border_official_gloss_type_loc')], afin que je puisse te montrer de l'affection. Qu'est-ce donc ? [ROOT.Char.GetLiege.GetTitledFirstName] te l'a ordonné. Pourquoi es-tu réticent à approcher la tâche ? Tes serviteurs ici sont réticents à agir pour toi, donc désormais le décompte du grain passe par moi."
 RICE_nubia_baqt_real_document_excerpt_32:0 "Je rends hommage à votre seigneurie. Je souhaite vous informer que [random_same.GetFirstNameNoTooltip] a dénoncé [random_same_2.GetFirstNameNoTooltip] auprès de [ROOT.Char.GetLiege.GetTitledFirstName]. [random_same.GetSheHe|U] a également dénoncé votre peuple, essayant de remplacer votre député dans le nord. Puisse [random_same.GetSheHe] craindre que je l'écrase !"
 RICE_nubia_baqt_real_document_excerpt_33:0 "Je vous salue. Je vous informe : j'ai pris ces 20 pièces d'or qui appartiennent à [random_same.GetFirstNamePossessiveNoTooltip]. [random_same.GetSheHe|U] les a divisées en deux. Donnez la part de cette division. Puissiez-vous venir et faire ce travail pour moi."
 RICE_nubia_baqt_real_document_excerpt_34:0 "Je rends hommage à votre [ROOT.Char.GetLadyLord]. Le fils de [random_same.GetFirstNamePossessiveNoTooltip] cherchait-il toutes ces choses par l'intermédiaire de [random_same_2.GetFirstNamePossessiveNoTooltip] ? S'ils ne les prennent pas, alors vraiment ils ne lui ont pas donné cette chose. Veuillez envoyer une lettre. Pourquoi hésitez-vous ?"
 RICE_nubia_baqt_real_document_excerpt_35:0 "Je vous salue. Réjouissez-vous, car mon seigneur fait en sorte que ces choses soient proches. Réjouissez-vous, car le [ROOT.Char.Custom('FR_LLa')] [ROOT.Char.GetWomanMan], étant en mesure d'entrer, les fait envoyer. Et moi, les prenant avec pugnacité, je n'ai fait de mal à personne. Réjouissez-vous, car c'est un document de joie. Libérez rapidement, envoyez tout rapidement."
 RICE_nubia_baqt_real_document_excerpt_36:0 "Car qu'a dit [random_same.GetFirstNameNoTooltip] de faire ? Hélas, [random_same.GetSheHe] dit du mal de vous et de votre peuple. Ceux qui sont proches s'efforcent ardemment que je ne continue pas à faire cela. J'étais dans le pays, subissant les malédictions des détracteurs. Si [ROOT.Char.GetFaith.HighGodName] le garde toujours en sécurité, c[random_same.Custom('FR_EtEtte')] [random_same.GetWomanMan] continuera à nous dénigrer."
 RICE_nubia_baqt_real_document_excerpt_37:0 "Si [random_same.GetFirstNameNoTooltip], qui est mauvais, voit cette affaire, j'en informerai [random_same_2.GetFirstNameNoTooltip]. Et je ne peux pas envoyer de lettre avec mon collègue, car ils sont en train de manger pendant que j'écris ceci."
 RICE_nubia_baqt_real_document_excerpt_38:0 "Vos esclaves se lèvent, car ils écoutent le bruit du hachage. Ils écoutent la préparation de la marmite. Ils écoutent la cuisson du grain. Car vous étiez comme un mendiant. Qu'ai-je fait à vos esclaves ?"
 RICE_nubia_baqt_real_document_excerpt_39:0 "Rappelez-vous ce que [ROOT.Char.GetLiege.GetTitledFirstName] dit : Jusqu'à ce que [random_same.GetFirstNameNoTooltip] reçoive l'autorisation de [ROOT.Char.GetFaith.HighGodName], personne ne doit s'exprimer en opposition ni proférer un démenti contre moi, car tous sont sous ma protection, et ils viennent proclamer le saint nom de [ROOT.Char.GetFaith.HighGodName]."
 RICE_nubia_baqt_real_document_excerpt_40:0 "1 terrain argileux dans [county.GetNameNoTier] : au sud la limite est la terre de [random_same.GetFirstNameNoTooltip], au nord la limite est la terre de [random_same_2.GetFirstNameNoTooltip]...."
 RICE_nubia_baqt_real_document_excerpt_41:0 "1 roue hydraulique à [county.GetNameNoTier] : au sud la limite est la terre de [ROOT.Char.GetFaith.HouseOfWorship], au nord la limite est la terre de [ROOT.Char.GetFaith.HouseOfWorship] du [ROOT.Char.Custom('DefaultPriestTitle')] [random_same.GetFirstNameNoTooltip]...."
 RICE_nubia_baqt_real_document_excerpt_42:0 "Premièrement : [random_same.GetFirstNamePossessiveNoTooltip] : 1 pièce d'or, 20 dirhems, du vin.\n\n[random_same_2.GetFirstNamePossessiveNoTooltip] (qui vient de [county.GetNameNoTier]) : 6 pièces d'or."
 RICE_nubia_baqt_real_document_excerpt_43:0 "Le destinataire était le [ROOT.Char.Custom('RICE_nubia_egypt_border_official_gloss_type_loc')]. [random_same.GetFirstNameNoTooltip] : 22 dirhems. La fille de [random_same.GetFirstNamePossessiveNoTooltip] : 12 dirhems. [random_same_2.GetFirstNameNoTooltip] : 16 dirhems. Le fils de [random_same_2.GetFirstNamePossessiveNoTooltip] : 4 dirhems. Le [ROOT.Char.Custom('DefaultPriestTitle')] de [ROOT.Char.GetFaith.HouseOfWorship] : 4 pièces d'or."
 RICE_nubia_baqt_real_document_excerpt_44:0 "Nous pouvons garder le nouveau grain et vendre 37 unités de l'ancien grain de [random_same.GetFirstNamePossessiveNoTooltip]. Et quant aux 12 autres unités de grain, après qu'[random_same.GetSheHe] les a fait nettoyer pour vous, si vous pouvez les vendre contre de l'or ou à leur valeur nominale, ce serait souhaitable."
 RICE_nubia_baqt_real_document_excerpt_45:0 "Nous avons traité les commandes de marchandises parfumées. Nous n'avons trouvé dans le pays aucune de ces denrées que les marchands estimaient être au prix du marché. De plus, nous n'avons pas trouvé les fonds suffisants pour ces marchandises."
 RICE_nubia_baqt_real_document_excerpt_46:0 "Le commandant a écrit qu'il arrivera et qu'il donnera des instructions pour votre bien et pour l'accomplissement de vos requêtes. Il mentionne également la nécessité de protéger les sujets et de protéger les marchands qui voyagent vers vous parmi la communauté marchande."
 RICE_nubia_baqt_real_document_excerpt_47:0 "Le [ROOT.Char.Custom('RICE_nubia_egypt_border_official_gloss_type_loc')] ne pense-t-il pas que ce qui me rapproche de vous [Glossary( 'en la présence de', 'NUBIA_IN_THE_PRESENCE_OF_GLOSS' )] [ROOT.Char.Custom('DefaultPriestTitle')] est que je leur fournis des provisions et que je reste au service du [ROOT.Char.GetLiege.GetTitleAsNameNoTooltip] et à la protection de vos compagnons ?"
 RICE_nubia_baqt_real_document_excerpt_48:0 "Quant à l'achat des marchandises que vous avez mentionnées dans votre lettre, vous pouvez allouer la dépense au marchand aîné [random_different.GetFirstNameNoTooltip]."
 RICE_nubia_baqt_real_document_excerpt_49:0 "Cet esclave de la haute, très glorieuse et munificente présence de [ROOT.Char.Custom('RICE_nubia_egypt_border_official_gloss_type_loc')] [Glossary('embrasse le sol', 'NUBIA_KISSES_THE_GROUND' )] devant [ROOT.Char.GetSheHe] et rapporte lui que votre lettre est arrivée et je l'ai lue et j'ai compris ce qu'elle contient."
 RICE_nubia_baqt_real_document_excerpt_50:0 "Quelle que soit votre requête, écrivez-moi, et je l'exécuterai et accomplirai mon devoir, que ce soit petit ou grand. Si vous avez un besoin, écrivez-moi et faites-le moi savoir, si [random_different.GetFaith.HighGodName] le veut."

 # Game Concepts
 game_concept_nile_flood_short:0 "Inondation"
 RICE_nile_situation_concepts_title:0 "Inspectez chaque icône pour mieux comprendre les\nsituations de la #V Vallée du Nil#!"
 game_concept_RICE_nile: "Nil"
 game_concept_RICE_nile_river: "Rivière du Nil"
 game_concept_RICE_nile_river_desc:"La $game_concept_RICE_nile_river$ est une [situation|El] qui représente la crue du Nil, un élément crucial de la vie en Égypte depuis l'époque des pharaons. Chaque année, le Nil connaîtra une crue plus ou moins importante (ou pas), représentée sous forme de [situation_phase|El].\n\nLa plupart du temps, la crue sera une [good_nile_flood_short|El], mais parfois il peut s'agir d'une [bad_nile_flood_short|El], donnant respectivement différents #P bonus #! et #N malus#!.\n\nBien que tout [ruler|El] possédant un territoire le long de la [GetGeographicalRegion('RICE_nile_river_valley').GetName] participera automatiquement à cette [situation|El], certaines [traditions|El] culturelles débloqueront des [decisions|El] ou [activities|El] supplémentaires qui octroient des bonus additionnels liés au Nil."
 game_concept_RICE_baqt_treaty:"Traité du Baqt"
 game_concept_RICE_baqt: "Baqt"
 game_concept_RICE_baqt_desc:"Le $game_concept_RICE_baqt$ est une [situation|El] qui dépeint la relation politique et économique entre les [RICE_baqt_egyptian_rulers|El] (généralement musulmans) et les [RICE_baqt_african_rulers|El] (généralement chrétiens) le long du Nil, basée sur le légendaire traité signé entre les deux parties au VIIe siècle, à la suite d'une tentative de conquête de la Nubie par le califat rachidun.\n\nLe $game_concept_RICE_baqt$ est divisé en deux régions, l'Égypte et la Nubie, représentant ces deux parties. La [situation|El] oscille entre différentes [situation_phase|El], représentant la manière dont chaque partie interprète et perçoit les stipulations du traité : les [situation_phases|El] d' [RICE_baqt_accord|El] et de [RICE_baqt_discord|El].\n\nLa caractéristique principale de cette [situation|El] sont trois [interactions|El] pour échanger, exiger ou offrir des [RICE_baqt_goods|El] entre les [RICE_baqt_egyptian_rulers|El] et les [RICE_baqt_african_rulers|El]. Si l'autre [ruler|El] accepte, les deux parties reçoivent une [truce|El] l'une envers l'autre. La probabilité que les [rulers|El] acceptent ces [interactions|El], ainsi que leurs bonus et coûts, varie en fonction de divers facteurs, y compris la [situation_phase|El] actuelle de chaque région."
 game_concept_RICE_baqt_good_short: "Marchandise"
 game_concept_RICE_baqt_goods_short: "Marchandises"
 game_concept_RICE_baqt_good: "Marchandise du Baqt"
 game_concept_RICE_baqt_goods: "Marchandises du Baqt"
 game_concept_RICE_baqt_goods_desc:"Les $game_concept_RICE_baqt_goods$ sont des [character_modifiers|El] bénéfiques que les [rulers|El] faisant partie de la [situation|El] du [RICE_baqt|El] peuvent acquérir via trois [interactions|El] différentes :\n\n$BULLET_WITH_TAB$#V $RICE_nubia_baqt_propose_exchange$#!\n$BULLET_WITH_TAB$#V $RICE_nubia_baqt_offer_gift$#!\n$BULLET_WITH_TAB$#V $RICE_nubia_baqt_demand_payment$#!\n\nLe type de marchandises, c'est-à-dire les [modifiers|El], qu'un [ruler|El] peut offrir dépend de laquelle des deux [situation_sub_regions|El] du [RICE_baqt|El], l'Égypte ou la Nubie, abrite sa [capital|El].\nCes [interactions|El] permettent également aux [rulers|El] d'obtenir une [truce|El] mutuelle, et les chances que d'autres [rulers|El] acceptent ces [interactions|El] dépendent de divers facteurs, notamment la [situation_phase|El] dans laquelle se trouve actuellement le [RICE_baqt|El].\n\nCes [interactions|El] ne peuvent se produire #V QUE#! entre les [RICE_baqt_egyptian_rulers|El] et les [RICE_baqt_african_rulers|El]."
 game_concept_good_nile_flood_short:"Bonne crue"
 game_concept_good_nile_flood:"Bonne crue du Nil"
 game_concept_good_nile_flood_desc:"La [RICE_nile_river|El] est considérée comme ayant une bonne crue si elle se trouve dans l'une des [situation_phases|El] suivantes :\n\n$BULLET_WITH_TAB$ @RICE_nile_flood_normal_icon! $nile_normal_flood$\n$BULLET_WITH_TAB$ @RICE_nile_flood_high_icon! $nile_high_flood$\n$BULLET_WITH_TAB$ @RICE_nile_flood_very_high_icon! $nile_very_high_flood$"
 game_concept_bad_nile_flood_short:"Mauvaise crue"
 game_concept_bad_nile_flood:"Mauvaise crue du Nil"
 game_concept_bad_nile_flood_desc:"La [RICE_nile_river|El] est considérée comme ayant une mauvaise crue si elle se trouve dans l'une des [situation_phases|El] suivantes :\n\n$BULLET_WITH_TAB$ @RICE_nile_flood_overflooding_icon! $nile_overflooding_flood$\n$BULLET_WITH_TAB$ @RICE_nile_flood_low_icon! $nile_low_flood$\n$BULLET_WITH_TAB$ @RICE_nile_flood_very_low_icon! $nile_very_low_flood$"
 game_concept_RICE_baqt_accord_phase:"Phase d'Accord"
 game_concept_RICE_baqt_accord: "Accord"
 game_concept_RICE_baqt_accord_desc:"La $game_concept_RICE_baqt_accord_phase$ représente une période dans la [situation|El] de [RICE_baqt|E] où les [rulers|El] égyptiens et nubiens sont plus disposés à s'engager dans des échanges diplomatiques et économiques, conformément aux stipulations du [RICE_baqt|El]. En conséquence, ils sont également moins susceptibles d'entrer en [war|El] et se traiteront mutuellement avec moins d'hostilité."
 game_concept_RICE_baqt_discord_phase: "Phase de désaccord"
 game_concept_RICE_baqt_discord: "Désaccord"
 game_concept_RICE_baqt_discord_desc:"La $game_concept_RICE_baqt_discord_phase$ représente une période dans la [situation|El] du [RICE_baqt|E] durant laquelle les [rulers|El] égyptiens et nubiens sont moins enclins à s'engager dans des échanges diplomatiques et économiques, selon les stipulations du [RICE_baqt|El]. En conséquence, ils sont également plus susceptibles de s'attaquer mutuellement en [war|El] et d'être plus hostiles les uns envers les autres."
 game_concept_RICE_baqt_gift_fulls: "Offrir des présents Baqt"
 game_concept_RICE_baqt_gift_full: "$RICE_nubia_baqt_offer_gift$"
 game_concept_RICE_baqt_gift: "Présent"
 game_concept_RICE_baqt_demand_fulls: "Exiger les paiements Baqt"
 game_concept_RICE_baqt_demand_full: "$RICE_nubia_baqt_demand_payment$"
 game_concept_RICE_baqt_demand:"Tribut"
 game_concept_RICE_baqt_equal_fulls: "Proposer des échanges Baqt"
 game_concept_RICE_baqt_equal_full: "$RICE_nubia_baqt_propose_exchange$"
 game_concept_RICE_baqt_equal: "Échange"
 game_concept_RICE_baqt_interaction:"Interaction du Baqt"
 game_concept_RICE_baqt_interactions: "Interactions du Baqt"
 game_concept_RICE_baqt_interactions_desc: "$game_concept_RICE_baqt_goods_desc$"
 game_concept_RICE_cattle_raid_intent:"Vol de bétail"
 game_concept_RICE_cattle_raid_intent_desc:"[cultures|E] avec la [tradition|El] #V $tradition_RICE_cattle_economy_name$#! ont accès à une [raid_intent|El] unique appelée #bold $RICE_cattle_raid_intent$#!. Elle vous accorde un peu de [legitimacy_i|El] [legitimacy|El] à la conclusion d'un [raid|El] réussi."
 game_concept_RICE_baqt_egyptian_ruler_short: "Égyptien"
 game_concept_RICE_baqt_egyptian_ruler: "Dirigeant égyptien"
 game_concept_RICE_baqt_egyptian_rulers: "Dirigeants égyptiens"
 game_concept_RICE_baqt_egyptian_rulers_desc:"Dans le contexte de la [situation|El] [RICE_baqt|E], les $game_concept_RICE_baqt_egyptian_rulers$ constituent un [situation_participant_group|El] qui se compose de [rulers|El] dont la [culture|El] n'est #bold #italic pas#!#! d'un [heritage|El] subsaharien, tel que $heritage_arabic_name$ ou $heritage_byzantine_name$ [heritage|El]. Ils ne peuvent échanger des [RICE_baqt_goods|El] qu'avec les [RICE_baqt_african_rulers|El]."
 game_concept_RICE_baqt_african_ruler_short: "Africain"
 game_concept_RICE_baqt_african_ruler: "Dirigeant africain"
 game_concept_RICE_baqt_african_rulers: "Dirigeants africains"
 game_concept_RICE_baqt_african_rulers_desc:"Dans le contexte de la [situation|El] [RICE_baqt|E], $game_concept_RICE_baqt_african_rulers$ comprennent un [situation_participant_group|El] qui se compose de [rulers|El] dont la [culture|El] #italic est#! d'un [heritage|El] subsaharien, tel que $heritage_east_african_name$ ou $heritage_somalian_name$ [heritage|El]. Ils ne peuvent échanger des [RICE_baqt_goods|El] qu'avec les [RICE_baqt_egyptian_rulers|El]."
 
 # Struggle/Situation (Baqt)
 situation_RICE_nubia_baqt_situation: "Baqt"
 situation_RICE_nubia_baqt_situation_desc: "[SITUATION.GetType.GetDesc]"
 situation_type_RICE_nubia_baqt_situation: "Baqt"
 situation_type_RICE_nubia_baqt_situation_desc:"Le [RICE_baqt_treaty|El] a été signé par les Nubiens chrétiens et les Arabes musulmans au VIIe siècle, sur la base d'accords antérieurs et précurseurs entre les Nubiens et les Romains ; le [RICE_baqt|El] a influencé la politique et la société de la région, même s'il n'est souvent pas strictement respecté."
 RICE_nubia_baqt_situation_sub_region_egypt: "Égypte"
 RICE_nubia_baqt_situation_sub_region_nubia: "Nubie"
 RICE_nubia_baqt_situation_participant_group_RICE_nubia_baqt_nubian_rulers: "Dirigeants africains"
 RICE_nubia_baqt_situation_participant_group_RICE_nubia_baqt_nubian_rulers_desc:"Les vaillants [RICE_baqt_african_rulers|El] dotés d'un grand talent diplomatique, originaires du Nil moyen, règnent sur des terres prospères, en tant qu'héritiers des anciens héritages de l'Égypte pharaonique, du royaume de Koush et des premiers Pères de l'Église."
 RICE_nubia_baqt_situation_RICE_nubia_baqt_nubian_rulers:"#weak (Dirigeants nubiens dans la région)#!"
 RICE_nubia_baqt_situation_participant_group_RICE_nubia_baqt_egyptian_rulers: "Dirigeants égyptiens"
 RICE_nubia_baqt_situation_participant_group_RICE_nubia_baqt_egyptian_rulers_desc: "Les [RICE_baqt_egyptian_rulers|El] originaires des régions septentrionales du Nil contrôlent une terre qui a vu de grandes civilisations se succéder au fil des siècles ; ils se trouvent au carrefour de la Méditerranée, de l'Afrique et du Moyen-Orient."
 RICE_nubia_baqt_situation_RICE_nubia_baqt_egyptian_rulers: "#weak (Dirigeants égyptiens dans la région)#!"
 baqt_accord: "Accord"
 baqt_accord_desc:"Durant cette [situation_phase|El], les [RICE_baqt_african_rulers|El] et les [RICE_baqt_egyptian_rulers|El] entretiennent généralement des relations plus cordiales entre eux et tentent d'éviter toute confrontation inutile. Ils sont plus disposés à suivre les stipulations du [RICE_baqt_treaty|El] sur un pied d'égalité, favorisant la croissance économique et culturelle."
 RICE_nubia_baqt_situation_baqt_accord_situation_phase: "$baqt_accord$"
 baqt_discord: "Désaccord"
 baqt_discord_desc:"Durant cette [situation_phase|E], les [RICE_baqt_african_rulers|El] et les [RICE_baqt_egyptian_rulers|El] entretiennent des relations tendues, voire parfois hostiles les uns envers les autres. Ils sont moins enclins à respecter les stipulations du [RICE_baqt_treaty|El], et certainement pas en tant qu'égaux, réduisant les bénéfices économiques et culturels du [RICE_baqt|El]."
 RICE_nubia_baqt_situation_baqt_discord_situation_phase: "$baqt_discord$"
 baqt_ascendancy:"Ascendance"
 RICE_nubia_baqt_situation_baqt_ascendancy_situation_phase: "$baqt_ascendancy$"
 RICE_nubia_baqt_situation_all: "[RICE_baqt|E]"


 # Struggle/Situation (Nile River)
 situation_RICE_nile_river_situation: "Rivière du Nil"
 situation_RICE_nile_river_situation_desc: "[SITUATION.GetType.GetDesc]"
 situation_type_RICE_nile_river_situation: "Rivière du Nil"
 situation_type_RICE_nile_river_situation_desc:"La [RICE_nile_river|E] a été une part cruciale de la vie en Égypte et en Nubie depuis l'époque des [Glossary( 'pharaons', 'PHARAOH_GLOSS' )] égyptiens et des [Glossary( 'Qores', 'QORE_GLOSS' )] et [Glossary( 'Kandakes', 'KANDAKE_GLOSS' )] koushites, car c'est le Nil qui donne la vie à ces terres."
 RICE_nile_river_situation_sub_region_RICE_nile_river_valley: "Vallée de la rivière du Nil"
 RICE_nile_river_situation_participant_group_RICE_nile_pastoralist_rulers:"Dirigeants agro-pastoraux"
 RICE_nile_river_situation_participant_group_RICE_nile_pastoralist_rulers_desc:"Bien que le [RICE_nile|El] ait souvent été associé aux peuples sédentaires, les pasteurs nomades, qui ont souvent une expérience sporadique de l'agriculture également, ont joué un rôle important dans l'histoire de ces terres fluviales."
 RICE_nile_river_situation_RICE_nile_pastoralist_rulers:"[RICE_nile_river|E] #weak (Dirigeants nomades dans la région)#!"
 RICE_nile_river_situation_participant_group_RICE_nile_agrarian_rulers:"Dirigeants agraires"
 RICE_nile_river_situation_participant_group_RICE_nile_agrarian_rulers_desc:"Quiconque vit le long du [RICE_nile|E] connaît l'importance de ce fleuve, car c'est lui qui rend l'agriculture, et donc la civilisation, possible."
 RICE_nile_river_situation_RICE_nile_agrarian_rulers:"[RICE_nile_river|E] #weak (Dirigeants agraires dans la région)#!"
 nile_normal_flood:"Crue normale"
 nile_normal_flood_desc: "Les eaux du Nil ont monté à seize coudées, une crue correcte qui signifie que la récolte sera acceptable en Égypte et en Nubie cette année."
 nile_high_flood:"Crue forte"
 nile_high_flood_desc: "Les eaux du Nil ont monté à dix-sept coudées, une crue optimale qui signifie que la récolte sera abondante en Égypte et en Nubie cette année."
 nile_very_high_flood:"Crue très forte"
 nile_very_high_flood_desc: "Les eaux du Nil ont monté à dix-huit coudées, une crue extraordinairement bonne qui signifie que la récolte sera extrêmement abondante en Égypte et en Nubie cette année."
 nile_low_flood: "Crue faible"
 nile_low_flood_desc: "Les eaux du Nil ont monté à quatorze ou quinze coudées, une crue inférieure à la moyenne qui signifie que la récolte sera maigre en Égypte et en Nubie cette année."
 nile_very_low_flood: "Crue très faible"
 nile_very_low_flood_desc:"Les eaux du Nil n'ont même pas pu atteindre quatorze coudées, une inondation dangereusement faible qui signifie que la récolte sera terrible ou inexistante en Égypte et en Nubie cette année."
 nile_overflooding_flood: "Crue extrême"
 nile_overflooding_flood_desc:"Les eaux du Nil ont atteint dix-neuf coudées ou plus, une inondation dangereusement élevée qui noiera probablement les terres agricoles et ruinera la récolte en Égypte et en Nubie cette année."
 RICE_nile_river_situation_nile_normal_flood_situation_phase: "$nile_normal_flood$"
 RICE_nile_river_situation_nile_high_flood_situation_phase: "$nile_high_flood$"
