 nubia.0102.a:0 "xxxxx"
 nubia.0103.t:0 "Les Récits d'Eldad ha-Dani"
 nubia.0103.desc:0 "Après avoir contacté les dirigeants de la communauté [GetReligionByKey('judaism_religion').GetAdjective] à [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier], la nouvelle de mon arrivée s'est répandue parmi la communauté juive d'ici. Alors qu'ils se rassemblent à la synagogue locale pour entendre ce que j'ai à dire, et tandis que je me prépare à leur raconter les merveilleux récits de mes aventures, et à expliquer mon lignage et mes traditions, je sais qu'ils pensent tous la même chose.\n\n#italic Ce [ROOT.Char.GetFirstNameNoTooltip] [ROOT.Char.GetDynasty.GetNameNoTooltip] pourrait-il vraiment être issu de #underline la#! Tribu Perdue de Dan ?#!\n\nJe devrais soigneusement décider de quoi parler en fonction de la réception de l'audience. En ce moment, je sens que cette communauté a une"
 nubia.0103.desc.reception.very_skeptical:0 "#N réception très sceptique#! à mon égardi. Ils supposent que je suis un imposteur qui invente des absurdités à propos de la Tribu de Dan."
 nubia.0103.desc.reception.somewhat_skeptical:0 "#N accueil quelque peu sceptique#! à mon égard, car ils ne sont pas certains que je sois vraiment un fils de la Tribu de Dan."
 nubia.0103.desc.reception.neutral:0 "#V réception neutre#! à mon égard - en général, ils semblent amusés et curieux, mais sans plus."
 nubia.0103.desc.reception.somewhat_enthusiastic:0 "#P accueil plutôt enthousiaste#! à mon égard, et ils semblent vouloir entendre ce que j'ai à dire en tant que fils de la Tribu de Dan."
 nubia.0103.desc.reception.very_enthusiastic:0 "#P accueil très enthousiaste#! à mon égard, sans doute impatients d'entendre ce que j'ai à dire sur mes voyages et ma tribu."
 nubia.0103.desc.reception.informative_commentary:0 "\n\nPeut-être devrais-je m'en tenir à des #V commentaires informatifs#! sur les coutumes et les lois de la Tribu de Dan pour apaiser leur scepticisme, bien que peut-être, si j'ai de la chance, ils seront aussi convaincus par mes #V récits fantaisistes#! de mes aventures."
 nubia.0103.desc.reception.fanciful_tales:0 "\n\nPeut-être devrais-je les divertir avec des #V contes fantaisistes#! de mes aventures, alors, mais peut-être que si j'ai de la chance, ils ne s'ennuieront pas si j'opte pour un #V commentaire informatif#! sur les coutumes et les lois de la Tribu de Dan."
 nubia.0103.desc.reception.both_types:0 "\n\nComme ils ne semblent ni particulièrement réceptifs ni réfractaires, tant les #V commentaires instructifs#! sur les coutumes et les lois de la Tribu de Dan que les #V récits fantaisistes#! de mes aventures semblent convenir à cet auditoire."
 nubia.0103.a:0 "Les régaler de récits fantaisistes de mes aventures"
 nubia.0103.b:0 "S'en tenir à des commentaires informatifs sur les coutumes et lois danites"
 nubia.0103.success:0 "Les Juifs locaux vous trouvent, vous et vos récits, très inspirants"
 nubia.0103.failure:0 "Les Juifs locaux soupçonnent que vous êtes un imposteur qui raconte des histoires inventées"
 nubia.0104.t:0 "Les récits d'Eldad : Succès"
 nubia.0104.desc.intro:0 "Heureusement, la communauté [GetReligionByKey('judaism_religion').GetAdjective] de [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier] s'est montrée #P réceptive#! quand je leur ai dit"
 nubia.0104.desc.informative_commentary:0 "un commentaire instructif sur les coutumes et les lois de la Tribu de Dan dont je suis originaire, en les comparant et les contrastant avec ce que je savais des coutumes et des lois des Juifs de [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]."
 nubia.0104.desc.fanciful_tales:0 "des récits fantaisistes sur mes aventures à travers des terres étrangères et des rivages lointains, et mes rencontres avec d'autres tribus [GetReligionByKey('judaism_religion').GetAdjectiveNoTooltip]s... même si j'ai exagéré plus qu'un peu ici ou là."
 nubia.0104.desc.conclusion:0 "\n\nLes dirigeants de la communauté m'ont dit que ma présence a été plutôt inspirante, et certains d'entre eux se sont cotisés pour me faire don de quelques fonds afin de m'aider. Pour eux, il est bon de savoir que la Tribu de Dan et les autres Juifs à travers le monde perdurent et prospèrent quelles que soient les épreuves auxquelles ils font face.\n\nIl ne fait guère de doute que grâce à mon succès ici, la nouvelle continuera de se répandre à mon sujet et au sujet de mes récits auprès d'autres communautés [GetReligionByKey('judaism_religion').GetAdjectiveNoTooltip]s à travers le monde."
 nubia.0104.a:0 "Je suis ravi d'avoir trouvé un public réceptif !"
 nubia.0105.t:0 "Les récits d'Eldad : Échec"
 nubia.0105.desc.intro:0 "Malheureusement, la communauté [GetReligionByKey('judaism_religion').GetAdjective] de [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier] n'a #N pas été réceptive#! quand je leur ai dit"
 nubia.0105.desc.informative_commentary:0 "$nubia.0104.desc.informative_commentary$"
 nubia.0105.desc.fanciful_tales:0 "$nubia.0104.desc.fanciful_tales$"
 nubia.0105.desc.conclusion:0 "\n\nLa réaction du public allait du désintérêt tiède au dédain évident, et je ne doute pas que beaucoup d'entre eux me voient comme un charlatan. Les dirigeants de la communauté n'ont pas été très hospitaliers envers moi par la suite, et je ne pense pas que je devrais rester ici trop longtemps à ce rythme.\n\nMalgré mon échec ici, je ne doute pas que la nouvelle se répandra encore à mon sujet auprès d'autres communautés [GetReligionByKey('judaism_religion').GetAdjectiveNoTooltip]s à travers le monde - la mauvaise publicité n'existe pas, comme on dit !"
 nubia.0105.a:0 "Un public peu réceptif n'a rien de nouveau pour moi !"
 nubia.0106.t:0 "$RICE_historical_aspiration_fulfilled_title$"
 nubia.0106.desc:0 "Je peux désormais regarder ma vie avec satisfaction, étant donné tout ce que j'ai appris et tout ce que j'ai enseigné aux autres. Grâce à mes efforts, la légende de la Tribu de Dan, autrefois considérée comme perdue, s'est répandue à travers les communautés [ROOT.Char.GetFaith.GetReligion.GetAdjective]s du monde.\n\n"
 nubia.0106.desc.serpent:0 "Nous, les Juifs, ne nous recroquevillerons plus de peur. Bien que nous n'affrontions pas toujours nos ennemis de front, je sais que mes histoires ont inspiré mes frères juifs à résister et à se battre, par tous les moyens, que ce soit ouvertement ou clandestinement.\n\nComme le dit notre Écriture : "#italic #V Dan sera un serpent sur le chemin, une vipère sur le sentier, qui mord les talons du cheval, de sorte que son cavalier tombe à la renverse.#!#!""
 nubia.0106.desc.justice:0 "Au fil du temps, en raison de la distance - tant physique que temporelle - les communautés juives du monde ont progressivement perdu le contact les unes avec les autres, beaucoup oubliant ce qui fait de nous de véritables Juifs. Mais à travers mes récits, j'ai aidé mes coreligionnaires juifs à se souvenir de leur histoire et de leurs traditions, afin que nous puissions en ressortir plus forts que jamais.\n\nComme le disent nos écritures : « #italic #V Dan jugera son peuple, comme l'une des tribus d'Israël.#!#! »"
 nubia.0106.a:0 "Puissiez-vous nous accorder la paix ainsi qu'à tout Israël, ô Seigneur."
