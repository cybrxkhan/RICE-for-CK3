 activity_RICE_nubia_sibir_festival_host_an_a:0 "un"
 activity_RICE_nubia_sibir_festival:0 "Sibir"
 activity_RICE_nubia_sibir_festival_desc:0 "Les sibirs englobent un large éventail de festivités originaires des monts Nouba. Ces cérémonies festives ont tendance à se dérouler au début des différentes saisons d'activités humaines, comme les saisons de récolte ou de culture, et elles sont souvent accompagnées de compétitions sportives palpitantes entre les jeunes de différents villages."
 activity_RICE_nubia_sibir_festival_selection_tooltip:"Participer à un Sibir.\n\n$activity_RICE_nubia_sibir_festival_context_tooltip$"
 activity_RICE_nubia_sibir_festival_context_tooltip:0 "#emphasis Contexte historique :#! Beaucoup des divers groupes ethniques des monts Nouba ont des célébrations régulières appelées #italic Sibirs#! qui marquent différentes parties de l'année. Par exemple, l'un des Sibirs les plus importants, le Sibir du Feu, était généralement organisé après les saisons de culture. Chaque groupe ethnique avait en outre son propre calendrier de Sibirs."
 activity_RICE_nubia_sibir_festival_host_desc:"\n$BULLET_WITH_TAB$Gain de [prestige_i|E][prestige|El]\n$BULLET_WITH_TAB$Perte de [stress_loss_i|E][stress|El]\n$BULLET_WITH_TAB$Possibilité d'obtenir des [character_modifiers|El] #P positifs#!  ou des [county_modifiers|El]\n$BULLET_WITH_TAB$Possibilité d'obtenir des [courtiers|El] avec une haute [prowess_i|E] [prowess|El]"
 activity_RICE_nubia_sibir_festival_guest_desc: "$activity_RICE_nubia_sibir_festival_host_desc$"
 activity_RICE_nubia_sibir_festival_province_desc: ""
 activity_RICE_nubia_sibir_festival_destination_selection: "$activity_RICE_nubia_sibir_festival_province_desc$"
 activity_RICE_nubia_sibir_festival_guest_help_text: "$activity_RICE_nubia_sibir_festival$"
 activity_RICE_nubia_sibir_festival_predicted_cost:"Le coût de cette [activity|El] dépend des [activity_options|El] que vous sélectionnez."
 activity_RICE_nubia_sibir_festival_conclusion_desc:"Les célébrations du [GetActivityType( 'activity_RICE_nubia_sibir_festival' ).GetName] sont terminées, et nous avons tous passé un moment spectaculaire !"
 RICE_nubia_sibir_festival_sports_competition_type:"Compétition sportive"
 RICE_nubia_sibir_festival_sports_competition_type_none: "Aucune"
 RICE_nubia_sibir_festival_sports_competition_type_none_desc:"$BULLET_WITH_TAB$Aucune chance d'obtenir des [character_modifiers|El], des [county_modifiers|El], ou un nouveau [courtier|El] avec une [prowess_i|El] [prowess|El] élevée\n\n#weak Bien que certains puissent être déçus, ce n'est pas comme si nous avions besoin de compétitions sportives officielles.#!"
 RICE_nubia_sibir_festival_sports_competition_type_wrestling:"Lutte"
 RICE_nubia_sibir_festival_sports_competition_type_wrestling_desc:"$BULLET_WITH_TAB$Plus grande chance d'obtenir des [character_modifiers|El] ou des [county_modifiers|El] #P positifs#!\n$BULLET_WITH_TAB$Moins de chance d'obtenir un nouveau [courtier|El] avec une haute [prowess_i|El] [prowess|El]\n\n#weak Les grandes compétitions de lutte de notre communauté aident à tisser des liens entre notre peuple, et permettent à nos braves jeunes de montrer leur forme physique et leur habileté.#!"
 RICE_nubia_sibir_festival_sports_competition_type_stick_fighting:"Combat au bâton"
 RICE_nubia_sibir_festival_sports_competition_type_stick_fighting_desc:"$BULLET_WITH_TAB$Plus grande chance d'obtenir un nouveau [courtier|El] avec une [prowess_i|El] [prowess|El] élevée\n$BULLET_WITH_TAB$Moins de chance d'obtenir des [character_modifiers|El] ou des [county_modifiers|El] #P positifs#!\n\n#weak Bien que nos compétitions de combat au bâton puissent être brutales, voire mortelles, elles démontrent la force de notre jeunesse.#!"
 RICE_nubia_sibir_festival_celebration_phase:"Célébration"
 RICE_nubia_sibir_festival_celebration_phase_desc:"Célébrons le changement des saisons, ainsi que l'unité et la force de notre peuple !"
 RICE_nubia_sibir_festival_fun_intent_header:"Plaisir :"
 RICE_nubia_sibir_festival_fun_intent: "Plaisir"
 RICE_nubia_sibir_festival_fun_intent_desc:"Passez du bon temps lors de ces festivités passionnantes. Perdez du [stress_i|El] [stress|El] supplémentaire, et perdez-en encore plus si vous êtes [GetTrait('gregarious').GetName( GetNullCharacter )|U] ou [GetTrait('lustful').GetName( GetNullCharacter )]."
 RICE_nubia_sibir_festival_community_intent_header: "Communauté:"
 RICE_nubia_sibir_festival_community_intent: "Communauté"
 RICE_nubia_sibir_festival_community_intent_desc:"Profitez de cette occasion pour tisser des liens entre les membres de la communauté. Tous les participants gagnent [opinion_i|El] #P +10#! d'[opinion|El] envers vous. Perdez du [stress_i|El] [stress|El] supplémentaire si vous êtes [GetTrait('diligent').GetName( GetNullCharacter )|U] ou [GetTrait('just').GetName( GetNullCharacter )]."
 RICE_nubia_sibir_festival_competition_intent_header: "Compétition:"
 RICE_nubia_sibir_festival_competition_intent: "Compétition"
 RICE_nubia_sibir_festival_competition_intent_desc:"Encourager la bravoure et la valeur parmi les jeunes de la communauté. Gagnez un bonus de [legitimacy_i|El] [legitimacy|El]. Perdez du [stress_i|El] [stress|El] supplémentaire si vous êtes [GetTrait('brave').GetName( GetNullCharacter )|U] ou [GetTrait('ambitious').GetName( GetNullCharacter )]."
