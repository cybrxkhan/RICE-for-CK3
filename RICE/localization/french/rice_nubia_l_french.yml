 RICE_nubia_baqt_propose_exchange_interaction_notification:0 "Je vous salue honorablement, car je souhaite m'engager dans un échange équitable de biens selon les termes du [RICE_baqt|El]. Je serais ravi de vous envoyer quelque chose de précieux, et si je peux recevoir quelque chose en retour, je vous serai reconnaissant de votre bonté."

 RICE_nubia_baqt_offer_gift_interaction_notification:0 "Je vous salue avec honneur, car je souhaite humblement vous offrir ces biens selon les termes du [RICE_baqt|El]. Je serais ravi que vous acceptiez ce présent dans un esprit d'harmonie et d'amitié."
 RICE_nubia_baqt_demand_payment_interaction_notification:0 "Je vous salue avec honneur, car je souhaite poliment demander quelques biens selon les termes du [RICE_baqt|El]. Je suis certain que vous accéderez sagement à ma simple et modeste requête, dans un esprit d'harmonie et d'amitié."
 
