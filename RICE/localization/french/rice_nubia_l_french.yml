 RICE_eldad_ha_dani_decision_confirm:0 "Et le Seigneur me pousse à parler !"
 RICE_eldad_ha_dani_decision_context_tooltip:0 "#emphasis Contexte historique :#! Eldad ha-Dani était un mystérieux voyageur juif du IXe siècle qui traversa la Mésopotamie, l'Afrique du Nord et l'Ibérie, affirmant avoir vécu diverses aventures à travers l'Afrique et l'Asie, comme avoir été capturé par des cannibales en Éthiopie, ou avoir vécu un temps avec la Tribu perdue d'Israël d'Issachar en Perse. Plus intrigant encore, il affirmait appartenir à la Tribu perdue de Dan, qui selon lui s'était installée au cœur de l'Afrique il y a longtemps près du fleuve Nil, c'est-à-dire quelque part en Nubie ou en Éthiopie. Même certains de ses contemporains soupçonnaient qu'il était un imposteur, et les chercheurs modernes sont moins certains quant à ses étranges affirmations ; certains ont suggéré qu'il pourrait être lié à la communauté juive yéménite."
 RICE_danite_decision_done_recently_req:0 "La [decision|El] de #V $RICE_eldad_ha_dani_decision$#! n'a pas été prise à [GetPlayer.GetCapitalLocation.GetName] au cours des #V 5#! dernières années"
 RICE_baqt_frontier_decision:0 "Effectuer les tâches administratives de la frontière du Nil"
 RICE_baqt_frontier_decision_tooltip:0 "Nous devons accomplir des tâches routinières en tant qu'officiels de la frontière."
 RICE_baqt_frontier_decision_desc:0 "En tant que [ROOT.Char.Custom('RICE_nubia_egypt_border_official_gloss_type_loc')] du [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetName], j'utilise mes compétences pour harmoniser les différentes fonctions de notre bureaucratie afin de maintenir la frontière entre l'Égypte et la Nubie, conformément aux termes du [RICE_baqt_treaty|El]."
 RICE_baqt_frontier_decision_desc_alt:0 "Border officials at the First Cataract constantly perform a variety of tasks to maintain the border between Egypt and Nubia, per the terms of the [RICE_baqt_treaty|E]."
 RICE_baqt_frontier_decision_effect_tooltip_1:1 "Une #P réussite#! dans cette tâche bureaucratique entraînera un catalyseur de [situation|El] pour la [RICE_baqt_accord|El] [situation_phase|El]. Un #N échec#! entraînera un catalyseur pour la [situation_phase|El] [RICE_baqt_discord|El]"
 RICE_baqt_frontier_decision_effect_tooltip_2:1 "Les chances de succès peuvent être augmentées en dépensant de l'[gold_i|El] [gold|El] supplémentaire pour la plupart des options"
 RICE_baqt_frontier_decision_confirm:0 "Il est temps de remplir encore de la paperasse...."
 RICE_baqt_frontier_decision_context_tooltip:0 "#emphasis Contexte historique :#! Depuis l'époque des Pharaons, la première cataracte autour d'Assouan servait de frontière traditionnelle entre l'Égypte et la Nubie. Après que les Arabes et les Nubiens se sont accordés sur le [RICE_baqt_treaty|El] au VIIe siècle, et ont réaffirmé le statut de cette frontière, les [Glossary( 'Gouverneurs d\\'Assouan', 'GOVERNOR_OF_ASWAN_GLOSS' )] et les [Glossary( 'Éparques de Nobatie', 'LORD_OF_THE_MOUNTAIN_GLOSS' )] sont devenus les officiels responsables de l'administration du Baqt et de la garde des frontières pour l'Égypte et la Nubie respectivement. Nous disposons d'un vaste corpus de documents que les archéologues ont découverts, attestant des activités de ces hommes, de leurs subordonnés et de ceux avec qui ils interagissaient. Ils vont des plaintes de marchands, à de ternes listes de fournitures, en passant par des documents juridiques pour des ventes de terres."
 RICE_baqt_frontier_decision_success: "Réussite"
 RICE_baqt_frontier_decision_failure: "Échec"
