 activity_RICE_nubia_nilotic_bovine_sacrifice_desc:0 "Le bétail est notre bien le plus précieux. Ainsi, sacrifier du bétail aux ancêtres et aux dieux est le plus grand sacrifice que quiconque puisse faire."
 activity_RICE_nubia_nilotic_bovine_sacrifice_selection_tooltip:"Sacrifier du bétail aux ancêtres et aux dieux.\n\n$activity_RICE_nubia_nilotic_bovine_sacrifice_context_tooltip$"
 activity_RICE_nubia_nilotic_bovine_sacrifice_context_tooltip:0 "#emphasis Contexte historique :#! Parmi divers peuples d'Afrique de l'Est, tels que les peuples de langue nilotique comme les Dinka et les Maasaï, le bétail était un marqueur de statut et de richesse. Ainsi, bien que la fréquence des sacrifices de bétail puisse varier d'un groupe ethnique à l'autre, il s'agissait généralement d'une affaire importante étant donné que le bétail était l'une des choses les plus précieuses qu'une personne puisse sacrifier."
 activity_RICE_nubia_nilotic_bovine_sacrifice_host_desc:"\n$BULLET_WITH_TAB$Montant aléatoire de [prestige_i|El] [prestige|El] et de [piety_i|El] [piety|El] entre #V 25#! et #V 200#! selon votre [intent|El]\n$BULLET_WITH_TAB$Perte de [stress_loss_i|El][stress|El]\n$BULLET_WITH_TAB$Possibilité d'obtenir un [character_modifier|El] #P positif#! selon vos [skills|El], [piety_level|El], [prestige_level|El] et [legitimacy|El]"
 activity_RICE_nubia_nilotic_bovine_sacrifice_guest_desc: "$activity_RICE_nubia_nilotic_bovine_sacrifice_host_desc$"
 activity_RICE_nubia_nilotic_bovine_sacrifice_province_desc: ""
 activity_RICE_nubia_nilotic_bovine_sacrifice_destination_selection: "$activity_RICE_nubia_nilotic_bovine_sacrifice_province_desc$"
 activity_RICE_nubia_nilotic_bovine_sacrifice_guest_help_text: "$activity_RICE_nubia_nilotic_bovine_sacrifice$"
 activity_RICE_nubia_nilotic_bovine_sacrifice_predicted_cost:"Le coût de ce sacrifice est basé sur votre [income|El]."
 activity_RICE_nubia_nilotic_bovine_sacrifice_conclusion_desc:"Notre [GetActivityType( 'activity_RICE_nubia_nilotic_bovine_sacrifice' ).GetName] s'est conclu. Que les ancêtres et les dieux continuent de nous guider !"
 RICE_nubia_nilotic_bovine_sacrifice_sacrifice_phase: "Sacrifice"
 RICE_nubia_nilotic_bovine_sacrifice_sacrifice_phase_desc:"Il est temps de sacrifier notre bétail."
 RICE_nubia_nilotic_bovine_sacrifice_honor_the_ancestors_intent_header:"Honorer les ancêtres :"
 RICE_nubia_nilotic_bovine_sacrifice_honor_the_ancestors_intent:"Honorer les ancêtres"
 RICE_nubia_nilotic_bovine_sacrifice_honor_the_ancestors_intent_desc:"Rendez hommage aux ancêtres et aux dieux à travers ce sacrifice. Gagnez de la [piety_i|El] [piety|El] à la fin. Perdez du [stress_loss_i|El][stress|El] supplémentaire si vous êtes [GetTrait('diligent').GetName( GetNullCharacter )], [GetTrait('humble').GetName( GetNullCharacter )], ou [GetTrait('zealous').GetName( GetNullCharacter )]."
 RICE_nubia_nilotic_bovine_sacrifice_communion_intent_header: "Communion :"
 RICE_nubia_nilotic_bovine_sacrifice_communion_intent: "Communion"
 RICE_nubia_nilotic_bovine_sacrifice_communion_intent_desc:"Renforcez l'alliance partagée que les membres de la communauté ont entre eux et avec le divin. Gagnez du [prestige_i|El] [prestige|El] à la fin. Perdez du [stress_loss_i|El][stress|El] supplémentaire si vous êtes [GetTrait('ambitious').GetName( GetNullCharacter )], [GetTrait('gregarious').GetName( GetNullCharacter )], ou [GetTrait('just').GetName( GetNullCharacter )]."
 RICE_nubia_nilotic_bovine_sacrifice_completed_log_title:0 "Sacrifice bovin accompli"
 RICE_nubia_nilotic_bovine_sacrifice_completed_log:0 "[CHARACTER.GetShortUIName|U] a terminé d'accomplir les rituels et cérémonies appropriés pour le sacrifice du bétail."
 RICE_nubia_nilotic_bovine_sacrifice_modifier_log_title:0 "Les Ancêtres et [CHARACTER.GetFaith.HighGodName] Répondent"
 RICE_nubia_nilotic_bovine_sacrifice_modifier_log:0 "[CHARACTER.GetShortUIName|U] a apparemment été béni par les réponses et les conseils des ancêtres et des êtres divins."
 TRAVEL_NAME_FOR_activity_RICE_nubia_nilotic_bovine_sacrifice:0 "[Character.GetFirstNamePossessiveNoTooltip] $activity_RICE_nubia_nilotic_bovine_sacrifice$"
 
