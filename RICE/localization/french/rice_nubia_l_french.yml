 RICE_saint_catherine_monastery_inspired_well_of_moses:0 "Inspiré par le puits de Moïse"
 RICE_saint_catherine_monastery_inspired_well_of_moses_desc:0 "$RICE_saint_catherine_monastery_inspired_base_desc$ le [Glossary( 'puits de Moïse', 'SAINT_CATHERINE_WELL_OF_MOSES' )]."
 RICE_coptic_saint_anthony_pilgrimage_garden_inspired:0 "Inspiré par les jardins de Saint Antoine"
 RICE_coptic_saint_anthony_pilgrimage_garden_inspired_desc:0 "Lors d'un pèlerinage au monastère de Saint-Antoine, ce personnage a passé du temps à étudier les célèbres jardins, apprenant beaucoup sur leur gestion. Les arbres fruitiers, les vignobles et les exploitations de ce jardin comptent parmi les plus grands de tous les monastères d'[GetGeographicalRegion('ghw_region_egypt').GetName]."
 RICE_coptic_saint_anthony_pilgrimage_mount_colzim_inspired:0 "Inspiré par le mont Colzim"
 RICE_coptic_saint_anthony_pilgrimage_mount_colzim_inspired_desc:0 "Au cours de son pèlerinage au monastère de Saint-Antoine, ce personnage a entrepris la difficile randonnée jusqu'aux grottes où Saint Antoine résida jadis, près du monastère, ainsi que la source voisine. Ce fut une expérience spirituellement émouvante, bien que physiquement éprouvante."
 RICE_coptic_saint_anthony_pilgrimage_ascetics_inspired:0 "Inspiré par les ascètes de Saint Antoine"
 RICE_coptic_saint_anthony_pilgrimage_ascetics_inspired_desc:0 "Le monastère de Saint-Antoine, que ce personnage a visité dans le cadre d'un pèlerinage, abrite une communauté soudée d'ascètes depuis des siècles. En les voyant, ce personnage a cherché à mieux comprendre ces ascètes et leur état d'esprit afin de s'améliorer."
 RICE_nubia_belly_of_stones:0 "Ventre de Pierres"
 RICE_nubia_belly_of_stones_desc:0 "Le Ventre de Pierres, ou #italic Batn al-Hajar#!, est une portion du Nil s'étendant vers le sud à partir de la deuxième cataracte. Il est réputé pour son paysage dangereux, aride et rocailleux ; peu de gens y vivent, bien que les exilés et les réfugiés tendent à s'y réfugier en temps de troubles. Au fil des siècles, des souverains avisés ont bâti de petits forts, des tours de guet et des postes de douane dans cette région pour contrôler le flux du trafic."
 RICE_nubia_daju_migrations_modifier:0 "Migrations Daju"
 RICE_nubia_daju_migrations_modifier_desc:0 "Des vagues de migrants Daju, ou de descendants des Daju, sont arrivées ici depuis la Nubie ces dernières années, transformant le paysage politique, économique et culturel de la région."
