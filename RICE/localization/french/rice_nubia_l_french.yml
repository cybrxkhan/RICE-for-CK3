 situation_parameter_rice_unlock_nile_pray_activity:"Les [rulers|El] dont la [culture|El] possède la [tradition|El] #V$tradition_RICE_children_of_the_nile_name$#! ont accès à l'[activity|El] [GetActivityType('activity_RICE_upper_egypt_pray_good_nile_flood').GetName]"
