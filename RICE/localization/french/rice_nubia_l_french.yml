 nubia.0090.t:0 "Accueillir les Pastoralistes"
 nubia.0090.desc:0 "[GetGeographicalRegion('RICE_nile_river_valley').GetName|U] abrite à la fois des communautés agraires et pastorales. Si nos relations avec les pasteurs ne sont pas toujours amicales, certains sont disposés à coopérer avec nous ; il existe des ressources et des services utiles que nous pouvons échanger les uns avec les autres, et leur présence peut dissuader des tribus plus hostiles. De plus, s'ils sont suffisamment soumis, ils peuvent nous fournir quelques taxes.\n\nJ'ai donc invité certains clans pastoraux vivant dans les déserts voisins à s'installer plus près de nous, afin que nous puissions travailler ensemble pour faire prospérer cette terre. Tant qu'ils ne causent aucun trouble, ils n'ont rien à craindre de nous."
 nubia.0090.a:0 "Nous apprécions leur amitié et leur industrie."
 nubia.0090.b:0 "Peut-être que certains peuvent même être convaincus de se battre pour nous."
 nubia.0091.t:0 "Repousser les pasteurs nomades"
 nubia.0091.desc:0 "[GetGeographicalRegion('RICE_nile_river_valley').GetName|U] abrite à la fois des communautés agraires et pastorales. Si nos relations avec les pasteurs sont parfois amicales, ils sont souvent une nuisance au mieux ; même s'ils ne se livrent pas à des raids à grande échelle contre nos colonies, ils entrent souvent en conflit avec les fermiers et les citadins locaux sur des questions telles que la propriété des terres, par exemple.\n\nAinsi, je n'ai guère d'autre choix que de dire à mes officiels et soldats de faire ce qu'ils peuvent pour dissuader les clans pastoraux du désert voisin de s'approcher trop près de nos villages et villes fluviales. Que ce soit par le refus de tout commerce ou échange, en empêchant leurs déplacements à travers nos terres, ou en augmentant les patrouilles et les attaques contre les clans hostiles, ils comprendront que nous n'apprécions pas leur présence."
 nubia.0091.a:0 "Il faut les tenir à distance."
 nubia.0092.t:0 "Protéger les fermiers"
 nubia.0092.desc:0 "[GetGeographicalRegion('RICE_nile_river_valley').GetName|U] abrite à la fois des communautés agraires et pastorales. Bien que certains d'entre nous, pasteurs, puissions voir ces colonies agricoles et ces citadins comme quelque chose à exploiter, sans parler de leur méfiance occasionnelle à notre égard, il y a un avantage à long terme à travailler avec eux et à les défendre contre nos ennemis communs.\n\nNous pouvons nous engager dans le commerce de biens et de services les uns avec les autres, partager des ressources et faire beaucoup pour aider nos communautés à prospérer. J'ai ainsi rassuré certaines communautés sédentaires locales que je les protégerai si elles sont disposées à travailler avec nous dans un esprit de coopération.\n\nTant qu'elles ne causent pas de problèmes, elles n'ont rien à craindre de nous."
 nubia.0092.a:0 "Nous devons être de bons voisins, pas des rivaux."
 nubia.0093.t:0 "Le pillage des fermiers"
 nubia.0093.desc:0 "[GetGeographicalRegion('RICE_nile_river_valley').GetName|U] abrite à la fois des communautés agraires et pastorales. Les fermiers et citadins avec lesquels nous partageons ces terres nous regardent souvent avec suspicion, et nous aimons les considérer comme des faibles à exploiter.\n\nJ'ai donné à mes subordonnés l'ordre de prendre ce que nous pouvons en biens et ressources à ces communautés sédentaires. Ils peuvent nous les donner volontairement et nous les laisserons tranquilles, mais la force et la violence peuvent être employées si nécessaire.\n\nIl y a un prix à payer pour la paix ; je suis sûr que ces fermiers et citadins le comprendront, que cela leur plaise ou non."
 nubia.0093.a:0 "Apportez les richesses !"
