 nubia.0080.t:0 "L'errant [courtier.GetCulture.GetCollectiveNoun|l]"
 nubia.0080.desc:0 "Les terres au-delà de la [GetGeographicalRegion('RICE_nubia_and_ethiopia').GetName] abritent des tribus avec lesquelles nous avons interagi au fil des années, que ce soit pacifiquement ou... moins pacifiquement.\n\nParfois, leurs gens finissent sur nos terres, et offrent même leurs services à un [ROOT.Char.GetTitleAsNameNoTooltip] réceptif comme moi, ou parviennent à un accord avec leur peuple.\n\nUne telle personne nommée [courtier.GetFirstName], originaire des tribus [courtier.GetCulture.GetCollectiveNoun|l] bien au-delà de nos frontières, est arrivée à ma cour aujourd'hui, cherchant à tisser des liens plus étroits avec notre [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip]. [courtier.GetSheHe|U] met en avant les compétences que son groupe possède en tant que [GetPlayer.Custom('RICE_nilotic_type_loc')]."
 nubia.0080.a:0 "Tissons des liens entre nos peuples !"
 nubia.0080.b:0 "Souhaitez-vous rester pour encourager ces liens ?"
 nubia.0080.c:0 "Nous n'avons aucun intérêt à traiter avec les gens de votre espèce."
