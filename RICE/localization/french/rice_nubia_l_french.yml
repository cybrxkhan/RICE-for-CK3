 nubia.0060.t:0 "Mort sur le Nil"
 nubia.0060.desc:0 "Étant jeune prince, j'ai voyagé à la cour [abbasid.GetHouse.GetName] pour renégocier les termes du [RICE_baqt|El] - un exploit dont mon père béni, [father.GetTitledFirstName], était fier.\n\nMaintenant je suis plus âgé et plus sage ; contrairement à ma jeunesse, j'aurais aimé que le monde ne soit pas si aventureux. Le cruel [umari.GetFaith.GetReligion.GetAdherentName] [umari.GetFullName] a été une épine dans le flanc de la Nubie et de l'Égypte depuis des années, par exemple. J'ai envoyé mon capable neveu, [niuty.GetFirstName], avec des soldats pour tuer ce seigneur de guerre - au lieu de cela, [niuty.GetSheHe] a accepté une « trêve » avec [umari.GetFirstNameNoTooltip] ! [niuty.GetFirstNameNoTooltip] dit qu'[niuty.GetSheHe] est innocent de trahison, et nous a obtenu la paix, mais il est clair qu'[niuty.GetSheHe] gagne du temps pour préparer sa rébellion afin d'usurper mon autorité sur [GetTitleByKey('k_nubia').GetNameNoTier].\n\n[niuty.GetFirstNameNoTooltip] complote clairement avec [umari.GetFirstNameNoTooltip] pour me saper, et bien qu'il soit possible qu'ils se retournent l'un contre l'autre comme des chiens enragés, il vaut mieux que je m'occupe de l'insurrection de [niuty.GetFirstNamePossessiveNoTooltip] immédiatement."
 nubia.0060.a:0 "Envoyez des troupes pour arrêter le traître [niuty.GetFirstNameNoTooltip] !"
 nubia.0060.a.umari:0 "Des espions rapportent que [umari.GetFirstNameNoTooltip] restera neutre pour l'instant. Peut-être a-t-il l'intention de soutenir la rébellion de [niuty.GetFirstNamePossessiveNoTooltip] plus tard, mais une occasion pourrait se présenter à l'avenir pour nous de convaincre un coupe-gorge sans honneur comme [umari.Custom('FR_LuiElle')] de rejoindre notre camp pour le bon prix."
 nubia.0060.b:0 "J'accepte cette « trêve » suspecte avec [umari.GetFirstNameNoTooltip] pour l'instant…."
 nubia.0060.info:0 "#emphasis Contexte historique :#! Bien que nous sachions peu de choses sur de nombreux rois nubiens médiévaux, un roi pour lequel nous disposons d'informations conséquentes est un certain roi Georgios de Makurie, qui régna au IXe siècle. Durant le règne de son père, Zacharias, il se rendit à Bagdad pour renégocier avec succès les termes du traité du Baqt avec les Abbassides. Plus tard, lorsque Georgios devint roi lui-même, il envoya son neveu Niuty avec une armée pour attaquer al-Umari, un seigneur de guerre arabe opérant dans le désert Oriental qui s'était fait des ennemis tant des Makuriens que des Toulounides en Égypte. Niuty, cependant, accepta une trêve avec al-Umari avant de se rebeller contre Georgios, mais al-Umari se retourna alors contre Niuty ; après la défaite de Niuty, Georgios décida d'attaquer al-Umari à nouveau, avec succès cette fois. al-Umari survécut, mais serait tué par ses propres hommes."
 nubia.0061.t:0 "$nubia.0060.t$"
 nubia.0061.desc:0 "Mon oncle [georgios.GetFirstName] se fait appeler [georgios.GetTitleAsNameNoTooltip], mais il est un vieil homme bien au-delà de ses meilleures années, tandis que notre royaume souffre de raids et d'attaques d'ennemis proches et lointains.\n\n[georgios.GetFirstNameNoTooltip] m'a envoyé avec une armée pour faire face au plus redoutable de ces ennemis, [umari.GetFullName], le seigneur de guerre bandit qui a été une épine dans le pied de l'Égypte comme de la Nubie. Cependant, j'en suis venu à une réalisation fatidique : si notre royaume doit survivre en ces temps, il doit être dirigé par quelqu'un d'ambitieux et de décisif. Cette personne, c'est moi.\n\nJ'ai donc accepté une trêve temporaire avec [umari.GetFirstNameNoTooltip], et levé mon étendard en rébellion contre mon oncle. Certains me qualifient d'imprudent, mais ils changeront d'avis quand j'aurai gagné et revitalisé la fortune de notre royaume. J'espère seulement que [umari.GetFirstNameNoTooltip] respectera notre trêve pendant que je renverse mon oncle ; je sais qu'on ne peut faire confiance à un serpent comme [umari.Custom('FR_LuiElle')] que pour un temps limité, si tant est qu'on le puisse."
 nubia.0061.a:0 "J'agirai avec détermination et deviendrai [georgios.GetTitleAsNameNoTooltip] !"
 nubia.0062.t:0 "Convaincre le bandit ?"
 nubia.0062.desc:0 "Plus ma guerre contre mon vieil oncle stupide [georgios.GetFirstName] s'éternise, plus il sera difficile de le renverser. Qui plus est, j'ai reçu des nouvelles alarmantes.\n\n[umari.GetTitledFirstName], le seigneur de guerre bandit que mon oncle m'avait initialement envoyé combattre avant que nous ne concluions une trêve, est jusqu'ici resté au-dessus de la mêlée. Pourtant, des indices suggèrent que [umari.GetFirstNameNoTooltip] pourrait être disposé à rompre notre trêve et à se ranger du côté de mon oncle pour le bon prix.\n\nPeut-être puis-je offrir de l'or à [umari.GetFirstNameNoTooltip] pour qu'il fournisse un soutien militaire direct en tant qu'allié de circonstance. Je dois cependant agir vite, de peur que les ouvertures de mon oncle envers [umari.GetFirstNameNoTooltip] ne portent leurs fruits, et que [umari.GetFirstNameNoTooltip] ne se retourne contre moi plus tôt que prévu."
 nubia.0062.a:0 "Pourquoi envoyer de l'or à un bandit qui joue sur les deux tableaux ?"
 nubia.0062.a.tooltip:0 "Cela n'a aucun effet sur les chances que [umari.GetFirstName] vous rejoigne dans la [war|El]."
 nubia.0062.b:0 "Envoyer de l'or à [umari.GetFirstNameNoTooltip] pour [umari.GetHerHim] gagner à votre cause"
 nubia.0062.b.tooltip:0 "Cela augmente quelque peu les chances que [umari.GetFirstName] vous rejoigne dans la [war|El]."
 nubia.0062.c:0 "Envoyer à [umari.GetFirstNameNoTooltip] #italic beaucoup#! d'or pour gagner ses faveurs"
 nubia.0062.c.tooltip:0 "Cela augmente considérablement les chances que [umari.GetFirstName] vous rejoigne dans la [war|El]."
 nubia.0063.t:0 "$nubia.0062.t$"
 nubia.0063.desc:0 "Plus la guerre contre mon traître de neveu [niuty.GetFirstName] s'éternise, plus il sera difficile de [niuty.GetHerHim] vaincre. Cependant, une opportunité s'est présentée.\n\n[umari.GetTitledFirstName], le seigneur de guerre bandit que j'avais initialement envoyé [niuty.GetFirstName] éliminer avant que les deux ne concluent une trêve, est jusqu'ici resté au-dessus de la mêlée. Pourtant, des indices suggèrent que [umari.GetFirstNameNoTooltip] pourrait être disposé à rompre sa trêve avec [niuty.GetFirstNameNoTooltip] pour le bon prix.\n\nPeut-être puis-je offrir de l'or à [umari.GetFirstNameNoTooltip] pour attaquer [niuty.GetFirstNameNoTooltip] en tant qu'allié de circonstance. Je dois cependant agir vite, car il est possible que [niuty.GetFirstNameNoTooltip] fasse des ouvertures envers [umari.GetFirstNameNoTooltip] également, et l'encourage à m'attaquer directement à nouveau."
 nubia.0063.a:0 "$nubia.0062.a$"
 nubia.0063.a.tooltip:0 "$nubia.0062.a.tooltip$"
 nubia.0063.b:0 "$nubia.0062.b$"
 nubia.0063.b.tooltip:0 "$nubia.0062.b.tooltip$"
 nubia.0063.c:0 "$nubia.0062.c$"
 nubia.0063.c.tooltip:0 "$nubia.0062.c.tooltip$"
 nubia.0064.t:0 "Un Choix Tentant"
 nubia.0064.desc:0 "Il n'y a pas si longtemps, mon vieil ennemi, [georgios.GetFirstName], a envoyé son neveu [niuty.GetFirstName] avec une armée pour m'attaquer. Au lieu de cela, le prince assoiffé de pouvoir a accepté une trêve avec moi et s'est retourné contre son oncle dans une tentative de [georgios.GetHerHim] renverser.\n\nJusqu'à présent, je suis resté au-dessus de la mêlée, jouant indirectement les deux camps l'un contre l'autre. Cependant, il pourrait m'être profitable d'intervenir dans cette guerre : si j'accentue la dévastation de la Nubie, elle sera une cible facile pour de futurs raids et exploitations."
 nubia.0064.desc.georgios:0 "\n\n[georgios.GetFirstNameNoTooltip] m'a envoyé un émissaire avec un présent en or, espérant me rallier à sa cause."
 nubia.0064.desc.niuty:0 "\n\n[niuty.GetFirstNameNoTooltip] m'a envoyé un émissaire avec un présent en or, espérant que non seulement je respecterai notre trêve, mais que je rejoindrai son camp."
 nubia.0064.desc.both:0 "\n\n[georgios.GetFirstNameNoTooltip] et [niuty.GetFirstNameNoTooltip] m'ont tous deux envoyé des émissaires avec des présents en or, espérant que j'intervienne directement dans la guerre à leurs côtés."
 nubia.0064.desc.neither:0 "\n\nNi [georgios.GetFirstNameNoTooltip] ni [niuty.GetFirstNameNoTooltip] ne m'ont fait d'ouvertures manifestes comme des cadeaux diplomatiques, mais il est clair que tous deux veulent que j'intervienne directement en leur faveur dans leur guerre."
 nubia.0064.desc.conclusion:0 "\n\nCela pourrait être une occasion en or pour moi de tirer davantage profit de la Nubie… mais est-ce que cela en vaut la peine ?"
 nubia.0064.a:0 "Je me rallierai au camp de [georgios.GetFirstNameNoTooltip]"
 nubia.0064.b:0 "Je me rallierai au camp de [niuty.GetFirstNameNoTooltip]"
 nubia.0064.c:0 "Je ne rejoindrai aucun camp dans cette guerre, pour l'instant…"
 nubia.0065.t:0 "Le bandit choisit un camp"
 nubia.0065.desc:0 "Des nouvelles sont arrivées de [umari.GetFullName] ! Il semblerait qu'[umari.GetSheHe] ait décidé de prendre parti dans la guerre entre moi-même et mon"
 nubia.0065.desc.niuty:0 "oncle stupide [georgios.GetFirstName].\n\nQu'il ait été convaincu par des offres de richesses, ou pour des considérations stratégiques, [umari.GetFirstNameNoTooltip] a décidé d'attaquer mon oncle, et de m'aider à renverser ce vieil [georgios.GetWomanMan] ! Je sais que [umari.GetFirstName] est un bâtard traître, et nous savons tous deux que nous nous utilisons mutuellement pour nos propres objectifs. Cependant, je suis convaincu qu'une fois mon oncle éliminé, je pourrai également m'occuper de ce chef de guerre bandit."
 nubia.0065.desc.georgios:0 "traître de neveu [niuty.GetFirstName].\n\nQu'il ait été convaincu par des offres de richesses, ou pour des considérations stratégiques, [umari.GetFirstNameNoTooltip] a décidé d'apporter son plein soutien à mon neveu pour me renverser ! Ce n'est guère une surprise, étant donné la « trêve » qu'ils ont signée. Au moins, je suis réconforté de savoir que les deux se retourneront probablement l'un contre l'autre à un moment donné - mais le plus tôt sera le mieux."
 nubia.0065.a:0 "La guerre continue malgré tout… et je #italic vais#! gagner !"
 nubia.0066.t:0 "$nubia.0065.t$"
 nubia.0066.desc:0 "$nubia.0065.desc$"
 nubia.0066.desc.niuty:0 "stupide oncle [georgios.GetFirstName].\n\nQu'il ait été influencé par des offres de richesses, ou pour des considérations stratégiques, [umari.GetFirstNameNoTooltip] a décidé de rompre notre trêve et de s'allier avec les forces de mon oncle ! Je savais déjà qu'il ne fallait pas trop faire confiance à ce bandit, bien qu'[umari.GetSheHe] m'ait trahi plus tôt que prévu. Au moins, je suis réconforté de savoir qu'[umari.GetSheHe] se retournera probablement contre mon oncle à un moment donné."
 nubia.0066.desc.georgios:0 "traître de neveu [niuty.GetFirstName].\n\nQu'il ait été convaincu par des offres de richesses, ou pour des considérations stratégiques, [umari.GetFirstName] a décidé de rompre sa trêve avec mon neveu, et de me soutenir directement ! Je sais que [umari.GetFirstNameNoTooltip] est un bâtard perfide, et nous savons tous deux que nous nous utilisons mutuellement pour nos propres objectifs. Cependant, je suis convaincu qu'une fois mon neveu éliminé, je pourrai également m'occuper de ce seigneur de guerre bandit."
 nubia.0066.a:0 "$nubia.0065.a$"
 nubia.0067.t:0 "$nubia.0065.t$"
 nubia.0067.desc:0 "Des nouvelles sont arrivées de [umari.GetFullName] ! Il semblerait qu'[umari.GetSheHe] ait décidé de prendre parti dans la guerre entre moi-même et mon"
 nubia.0067.desc.niuty:0 "stupide oncle [georgios.GetFirstName]."
 nubia.0067.desc.georgios:0 "traître de neveu [niuty.GetFirstName]."
 nubia.0067.desc.conclusion:0 "\n\nOu plutôt, [umari.GetSheHe] a décidé de #italic ne pas#! prendre parti.\n\nPour une raison quelconque - peut-être en raison de considérations stratégiques - [umari.GetFirstName] a clairement fait savoir aux deux camps qu'[umari.GetSheHe] n'interviendrait pas dans cette guerre pour l'instant. [umari.GetFirstNameNoTooltip] est un serpent perfide, donc [umari.GetSheHe] a probablement calculé que c'était le meilleur choix pour [umari.Custom('FR_LuiElle')] pour l'instant… Sans aucun doute, une fois cette guerre terminée, il faudra également s'occuper de [umari.GetFirstNameNoTooltip]."
 nubia.0067.a:0 "$nubia.0065.a$"
 nubia.0068.t:0 "$RICE_historical_aspiration_fulfilled_title$"
 nubia.0068.desc:0 "J'ai vécu une longue vie, d'abord en tant que prince, puis en tant que roi. Au cours de ces années, j'ai fait face à de nombreux défis ; en toute honnêteté, vaincre mon neveu rebelle [niuty.GetFirstName] et mettre fin à la pathétique révolte de ce traître, ainsi que neutraliser la menace du seigneur de guerre bandit [umari.GetFirstName], ne furent que quelques défis supplémentaires que j'ai surmontés.\n\nMais ce n'est pas seulement moi qui ai surmonté ces défis - c'est aussi le royaume de Makurie dans son ensemble. Je sais que ces guerres ont pesé lourdement sur la terre et son peuple.\n\nMaintenant que le royaume est à nouveau stable, il est temps pour moi de me concentrer sur la reconstruction de cette terre et d'apporter la prospérité à son peuple. Peut-être, cependant, trouverai-je le temps pour un repos bien mérité ; après tout, je ne rajeunis pas."
 nubia.0068.a:0 "Une nouvelle paix se lève en Makurie."
 nubia.0069.t:0 "$RICE_historical_aspiration_fulfilled_title$"
 nubia.0069.desc:0 "Mon oncle [georgios.GetFirstName] a vécu une longue vie, mais [georgios.GetSheHe] était devenu un vieil [georgios.GetWomanMan] inefficace qui n'avait ni l'énergie ni le tempérament pour faire face aux défis actuels de notre royaume, la Makurie, en particulier la menace posée par le seigneur de guerre bandit [umari.GetFullName].\n\nSeul moi, bien entendu, avais la ruse et l'ambition nécessaires pour voir ce qui devait être fait. Mon usurpation du trône de Makurie était nécessaire, bien entendu, et j'ai pu vaincre mon oncle et neutraliser [umari.GetFirstName].\n\nMaintenant que le royaume est de nouveau stable, il est temps pour moi de me concentrer sur la reconstruction de cette terre et d'apporter la prospérité à son peuple. Je ne doute pas que je serai un souverain encore plus grand que mon oncle ne l'a jamais été."
 nubia.0069.a:0 "$nubia.0068.a$"
