 nubia.0240.t:0 "Préparatifs"
 nubia.0240.desc:0 "Le temps est venu pour un autre festival #italic Sibir#! !\n\nMoi, en ma qualité de [culture.GetName] [ROOT.Char.GetHerHim] plus éminent[ROOT.Char.Custom('FR_E')] de la région, j'ai travaillé avec les anciens et les chefs locaux pour rassembler des gens de tous les villages alentour afin de célébrer ensemble nos succès, notre beauté et notre force, en tant que communauté.\n\n"
 nubia.0240.desc.competition:0 "J'ai également travaillé dur avec d'autres organisateurs pour planifier des compétitions passionnantes - quelque chose au-delà des événements amateurs que l'on voit lors de #italic Sibirs#! de moindre envergure. En particulier, nous avons travaillé dur pour préparer une grande"
 nubia.0240.desc.wrestling:0 "compétition de lutte, où de courageux jeunes gens représentant chaque village s'affronteront les uns les autres pour déterminer qui est le plus fort, le plus brave et le plus habile dans ce noble sport.\n\n"
 nubia.0240.desc.stick_fighting:0 "compétition de combat au bâton, où de braves jeunes gens représentant chaque village s'affronteront dans un concours bruyant mais brutal pour prouver leur courage et leur esprit.\n\n"
 nubia.0240.desc.conclusion:0 "Après des semaines de préparation, le jour approche enfin, et nous voyons désormais des centaines de personnes affluer des villages alentour. Les membres riches et influents de la communauté, comme moi-même, ont amené de nombreux bovins et chèvres pour être sacrifiés et consommés à cette occasion."
 nubia.0240.a:0 "C'est bruyant mais l'enthousiasme est palpable !"
 nubia.0241.t:0 "Le sacrifice animal"
 nubia.0241.desc:0 "Le #italic Sibir#! a enfin commencé, et nous pouvons célébrer le passage des saisons avec de nouveaux succès dans nos communautés.\n\nPlus tôt,"
 nubia.0241.desc.chaplain:0 "mon [chaplain.GetCouncilTitle], [chaplain.GetTitledFirstName], agissant en tant que [ROOT.Char.Custom('DefaultPriestTitle')] principal[chaplain.Custom('FR_E')] présent[chaplain.Custom('FR_E')]"
 nubia.0241.desc.no_chaplain:0 "le [ROOT.Char.Custom('DefaultPriestTitle')] [ROOT.Char.GetFaith.GetAdherentName] principal de l'un des villages locaux"
 nubia.0241.desc.conclusion:0 "ont fait le tour en accomplissant des cérémonies magiques et en marquant les chèvres et le bétail avec de la cendre blanche. Maintenant, nous nous rassemblons tous tandis que les animaux sont amenés pour être sacrifiés : avec enthousiasme, les animaux sont transpercés de lances, et le [ROOT.Char.Custom('DefaultPriestTitle')] principal asperge leur sang sur tous afin que nous puissions recevoir les bénédictions des dieux.\n\nUn grand sentiment de joie envahit les lieux, tandis que nous festoyons, buvons et nous réjouissons, et regardons les jeunes robustes et valeureux s'affronter dans des épreuves de force et de sport athlétique."
 nubia.0241.a:0 "Nous nous rassemblons en tant que communauté."
 nubia.0242.t:0 "Conclusion"
 nubia.0242.desc:0 "Il y eut abondance de nourriture, de boisson et de rencontres lors de ce #italic Sibir#! Festival - un grand et immense #italic Sibir#!, avec plus à faire que la plupart des #italic Sibirs#!, m'ont dit les autres. Il ne fait aucun doute que les dieux se sentent satisfaits, et que nous sommes tous plus proches que jamais grâce à nos liens et à la démonstration de la force et de la valeur de notre communauté.\n\nHélas, ce #italic Sibir#! est arrivé à sa fin, et chacun se prépare à rentrer chez soi reprendre sa vie ordinaire et banale.\n\nMais au fil des saisons, il y aura bien d'autres #italic Sibirs#! auxquels participer. Je suis certain que cela restera ainsi aussi longtemps que notre mode de vie survivra."
 nubia.0242.a:0 "Ce fut un bon festival."
 nubia.0243.t:0 "Compétition sportive"
 nubia.0243.desc:0 "Une grande acclamation retentit alors que les jeunes athlétiques et énergiques émergent au centre du terrain. Leur force se devine dans leurs muscles toniques, et leur beauté n'échappe pas à la plupart des spectateurs.\n\nChaque jeune présent à cette compétition sportive a été choisi par son village pour le représenter grâce à sa force et sa ruse dans la"
 nubia.0243.desc.wrestling:0 "compétition de lutte.\n\nBientôt, le concours commence, et nous assistons à un passionnant va-et-vient dans chaque match, alors que deux concurrents s'empoignent nus dans un effort pour plaquer l'autre au sol. Pendant ce temps, tout le monde encourage son concurrent favori, en particulier ceux qui viennent du même village - après tout, ils sont là pour montrer la puissance et la robustesse de leur village !"
 nubia.0243.desc.stick_fighting:0 "Compétition de combat au bâton.\n\nBientôt, le concours commence, et nous assistons à une action palpitante à chaque combat, où deux concurrents s'affrontent avec bouclier et bâton. Beaucoup enroulent d'épais tissus autour de leur corps, et mettent même de la boue sur leur tête, pour se protéger des coups de leur adversaire. Pendant ce temps, d'autres jeunes chantent sans cesse, louant leur combattant favori en le comparant à un animal puissant."
 nubia.0243.a:0 "Espérons que personne ne sera trop blessé aujourd'hui !"
 nubia.0244.t:0 "Un jeune prometteur"
 nubia.0244.desc.wrestling:0 "La compétition de lutte touche à sa fin : que nul ne doute du courage et de la forme de nos jeunes, qui se sont affrontés dans des combats exaltants.\n\n"
 nubia.0244.desc.stick_fighting:0 "La compétition de combat au bâton est terminée. Bien qu'elle ait été une affaire sanglante et brutale, comme ces concours tendent à l'être, les jeunes impliqués ont plus que prouvé leur valeur.\n\n"
 nubia.0244.desc:0 "En fait, un jeune en particulier, du nom de [youth.GetFirstName], s'est distingué[youth.Custom('FR_E')] parmi tous les autres comme le vainqueur de la compétition pour ce #italic Sibir#!. [youth.GetSheHe|U] est soit un[youth.Custom('FR_E')] jeune [youth.GetWomanMan] fort[youth.Custom('FR_E')], soit un[youth.Custom('FR_E')] jeune[youth.Custom('FR_E')] mali[youth.Custom('FR_NNne')], soit les deux, pour avoir remporté la victoire sur tant d'autres.\n\nAprès avoir démontré ses capacités, et appréciant mes louanges à son égard, [youth.GetFirstNameNoTooltip] a même juré de me servir."
 nubia.0244.a:0 "Excellent !"
 nubia.0244.b:0 "Son village en a plus besoin que moi."
 nubia.0245.t:0 "Inspirer la communauté"
 nubia.0245.desc:0 "Je peux voir comment ces jeunes ont inspiré les habitants qui assistent à ce #italic Sibir#!. Des acclamations et toutes sortes de louanges entourent les vainqueurs, et j'ai le sentiment profond que notre communauté a été revigorée par ces compétitions, alors que le peuple se rassemble dans un esprit de fierté et de joie."
 nubia.0245.a:0 "$nubia.0244.a$"
