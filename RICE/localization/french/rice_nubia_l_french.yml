 RICE_east_african_religious_tattoo:0 "Tatouage apotropaïque"
 RICE_east_african_religious_tattoo_desc:0 "Ce personnage s'est récemment fait un petit tatouage protecteur en forme de symbole religieux. Il le protégera assurément de la malchance et du danger !"
 RICE_nubia_recently_repainted_banganarti:0 "Repeinte de Banganarti"
 RICE_nubia_recently_repainted_banganarti_desc:0 "xxxxx"
 RICE_nubia_merki_modifier:0 "Officier agricole"
 RICE_nubia_merki_modifier_desc:0 "Ce personnage a de l'expérience dans la gestion des réseaux agricoles et des finances du Royaume de Makurie."
 RICE_nubia_merki_upgraded_modifier:0 "Officier agricole vétéran"
 RICE_nubia_merki_upgraded_modifier_desc:0 "Grâce à sa longue carrière bureaucratique, ce personnage possède une vaste expertise dans la gestion des réseaux agricoles et des finances du Royaume de Makurie - un type d'expertise difficile à acquérir."
 RICE_nubia_mariankuda_modifier:0 "Tétrarque makurien"
 RICE_nubia_mariankuda_modifier_desc:0 "Ce personnage détient ou a détenu le titre de Tétrarque au sein de l'administration du Royaume de Makurie."
 RICE_nubia_archbishop_georgios_modifier:0 "L'Archevêque Royal de Makurie"
 RICE_nubia_archbishop_georgios_modifier_desc:0 "En tant qu'archevêque de Makurie, le prince Georgios a fait beaucoup pour éloigner la Nubie de siècles d'influence byzantine et développer une forme indigène de christianisme nubien. Il prône la « nubianisation » en toute chose, de l'habillement et des systèmes d'héritage au plus grand respect envers les rois défunts de Nubie."
 RICE_nubia_updated_faras_bishops_list:0 "Mise à jour de la liste des évêques de Faras"
 RICE_nubia_update_list_of_faras_bishops_list_county:0 "Liste des évêques de la cathédrale de Faras récemment mise à jour"
 RICE_nubia_rebuild_banganarti_church_modifier:0 "A parrainé la reconstruction de l'église de Banganarti"
 RICE_nubia_nilotic_warriors:0 "Liens avec les guerriers nilotiques"
 RICE_nubia_nilotic_artisans:0 "Liens avec les artisans nilotiques"
 RICE_nubia_nilotic_blacksmiths:0 "Liens avec les forgerons nilotiques"
 RICE_nubia_nilotic_traders:0 "Liens avec les commerçants nilotiques"
 RICE_nubia_nilotic_ritualists:0 "Liens avec les ritualistes nilotiques"
 RICE_nubia_nilotic_builders:0 "Liens avec les bâtisseurs nilotiques"
 RICE_nubia_nilotic_herders:0 "Liens avec les éleveurs nilotiques"
 RICE_nubia_marianos_focused_on_other_work:0 "Réalignement des priorités administratives"
 RICE_nubia_marianos_focused_on_other_work_desc:0 "Ce personnage ne se dérobe pas à ses responsabilités, comme certains pourraient le penser : en tant que haut fonctionnaire, il préfère simplement recentrer stratégiquement ses efforts sur des tâches importantes afin d'augmenter l'efficacité de sa charge de travail."
 RICE_nubia_rasad_modifier:0 "La Reine Mère africaine"
 RICE_nubia_rasad_modifier_desc:0 "Rasad était à l'origine une concubine esclave du calife fatimide Ali az-Zahir. En tant que favorite de son époux, puis en tant que reine mère après sa mort, elle a utilisé ses compétences et ses relations pour devenir une actrice politique influente dans la région."
 RICE_banganarti_health_dream:0 "Incubation de rêve à Banganarti (Santé)"
 RICE_banganarti_health_dream_desc:0 "En effectuant un pèlerinage à Banganarti, ce personnage a eu la chance de faire un rêve impliquant l'[Glossary( 'archange Raphaël', 'ARCHANGEL_RAPHAEL_GLOSS' )] où Raphaël l'a guéri de ses maux."
 RICE_banganarti_prophetic_dream:0 "Incubation de rêve de Banganarti (Prophétie)"
 RICE_banganarti_prophetic_dream_desc:0 "En se rendant en pèlerinage à Banganarti, ce personnage a eu la chance de faire un rêve impliquant l'[Glossary( 'archange Raphaël', 'ARCHANGEL_RAPHAEL_GLOSS' )] où Raphaël a prédit des choses à venir dans son avenir."
 RICE_banganarti_inspiring_dream:0 "Incubation de rêve à Banganarti (Inspiration)"
 RICE_banganarti_inspiring_dream_desc:0 "En effectuant un pèlerinage à Banganarti, ce personnage a eu la chance de faire un rêve impliquant l'[Glossary( 'archange Raphaël', 'ARCHANGEL_RAPHAEL_GLOSS' )] où Raphaël a éveillé leur esprit et leur a donné des encouragements sur diverses choses."
 RICE_banganarti_advice_dream:0 "Incubation de rêve à Banganarti (Conseil)"
 RICE_banganarti_advice_dream_desc:0 "En effectuant un pèlerinage à Banganarti, ce personnage a eu la chance de faire un rêve impliquant l'[Glossary( 'archange Raphaël', 'ARCHANGEL_RAPHAEL_GLOSS' )] où Raphaël lui a prodigué de sages conseils sur diverses questions importantes de sa vie."
 RICE_nubia_crusader_states_connection:0 "Nubien en Terre sainte"
 RICE_nubia_crusader_states_connection_desc:0 "Ce personnage s'est intégré dans une certaine mesure aux réseaux d'élite des États croisés, malgré ses origines nubiennes. Ses connexions avec les chrétiens de la Méditerranée et de l'Europe, ainsi qu'avec ceux de Nubie, lui sont utiles de diverses manières."
 RICE_nubia_tebeldi_trees_maintained_recently:0 "Arbres Tebeldi entretenus récemment"
 RICE_saint_catherine_monastery_inspired_base_desc:0 "Après avoir effectué un pèlerinage au monastère de Sainte-Catherine dans le Sinaï, ce personnage a été grandement inspiré par ce qu'il y a vu, en particulier"
 RICE_saint_catherine_monastery_inspired_ashtiname_of_muhammad:0 "Inspiré par l'Ashtiname de Mahomet"
