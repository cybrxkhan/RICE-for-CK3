 TRAIT_FLAG_DESC_rice_the_danite_unlock_decision:0 "Débloque la [decision|El] pour #V $RICE_eldad_ha_dani_decision$#!"
 TRAIT_FLAG_DESC_rice_the_danite_unlock_legend:0 "Débloque la [legend|El] #V $RICE_the_tribe_of_dan_legend_name$#!"
 TRAIT_FLAG_DESC_rice_the_danite_xp_gain:0 "L'[trait_level_track_xp|El] est gagnée par cette [decision|El]; une expérience plus élevée influence également les chances de succès de cette [decision|El]" #  to #bold $RICE_eldad_ha_dani_decision$#!, and [trait_level_track_xp|E] in the [trait_level_track|E] influences success chances for this [decision|E]
 TRAIT_FLAG_DESC_rice_the_danite_upgrade:0 "Peut être amélioré en [trait|El] [GetTrait('RICE_the_danite_upgraded_serpent').GetName( GetNullCharacter )] ou [GetTrait('RICE_the_danite_upgraded_justice').GetName( GetNullCharacter )] après avoir complété la $RICE_nubia_aspiration_spread_stories_tribe_of_dan$"
 TRAIT_FLAG_DESC_rice_the_danite_removed:0 "Ce [trait|El] sera définitivement #N retiré#! si ce personnage se convertit à une [faith|El] en dehors du $judaism_religion$"
 TRAIT_FLAG_DESC_rice_the_danite_great_success:0 "Améliore significativement les chances de succès lors de la prise de la [decision|El] pour #V $RICE_eldad_ha_dani_decision$#!"
 trait_RICE_the_danite_upgraded_serpent:0 "Le Serpent Danite"
 trait_RICE_the_danite_upgraded_serpent_desc:0 "Ce personnage prétend être membre d'une ancienne tribu juive au cœur de l'Afrique, descendant de la Tribu de Dan. Ses récits fantastiques ont capturé l'imagination des Juifs à travers le monde, apportant l'espoir que les Danites mèneront les Juifs à vaincre habilement leurs ennemis tel un puissant serpent."
 trait_RICE_the_danite_upgraded_serpent_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] prétend être membre d'une ancienne tribu juive au cœur de l'Afrique, descendant de la Tribu de Dan. Ses récits fantastiques ont captivé l'imagination des Juifs à travers le monde, apportant l'espoir que les Danites mèneront les Juifs à vaincre habilement leurs ennemis tel un puissant serpent."
 trait_RICE_the_danite_upgraded_justice:0 "Le Juge Danite"
 trait_RICE_the_danite_upgraded_justice_desc:0 "Ce personnage prétend être un membre d'une ancienne tribu juive au cœur de l'Afrique, descendant de la Tribu de Dan. Ses récits éclairants ont captivé l'imagination des Juifs à travers le monde, fournissant des conseils à la communauté juive sur leurs coutumes et traditions comme le ferait un bon juge."
 trait_RICE_the_danite_upgraded_justice_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] prétend être membre d'une ancienne tribu juive au cœur de l'Afrique, descendante de la Tribu de Dan. Ses récits éclairants ont captivé l'imagination des Juifs à travers le monde, offrant des conseils à la communauté juive sur leurs coutumes et traditions comme le ferait un bon juge."
 
 # Aspirations
 RICE_nubia_aspiration_georgios_867_desc:"\n\n#bold [historical_aspiration_main_objectives|E]#!\n$EFFECT_LIST_BULLET$Être un [ruler|El] [independent|El] de [GetTitleByKey('k_nubia').GetNameNoTier]\n$EFFECT_LIST_BULLET$S'assurer que votre neveu Niuty n'est pas en [war|El] avec vous et est soit mort, ne détient aucun [titles|El], est [imprisoned|El], est votre [ally|El], ou est votre [vassal|El] qui est soit [intimidated|El] soit [cowed|El] par vous ou a au moins [opinion_i|El] #P 75#! d'[opinion|El] envers vous\n$EFFECT_LIST_BULLET$S'assurer qu'al-Umari n'est pas en [war|El] avec vous et est soit mort, ne détient aucun [titles|El], est [imprisoned|El], est votre [ally|El], ou est votre [vassal|El] qui est soit [intimidated|El] soit [cowed|El] par vous ou a au moins [opinion_i|El] #P 75#! d'[opinion|El] envers vous\n\n#bold Récompenses#!\n$EFFECT_LIST_BULLET$Gain de @prestige_icon! #V [EmptyScope.ScriptValue('RICE_aspiration_large_resource_bonus')]#! de [prestige|El]\n$EFFECT_LIST_BULLET$Gain d'un [perk|El] de [martial_lifestyle|El]\n$EFFECT_LIST_BULLET$Améliore votre [education_trait|El]\n$EFFECT_LIST_BULLET$Recevez #V 1000#! [special_troops|El], incluant des [men_at_arms|El]\n\n#bold [historical_aspiration_bonus_objectives|E]#!\n$EFFECT_LIST_BULLET$[completely_control|E] [GetTitleByKey('k_nubia').GetNameNoTier] (Récompense : Chaque [county|El] que vous contrôlez complètement en [GetGeographicalRegion('RICE_greater_nubia_region').GetName] gagne @development_icon! #V [EmptyScope.ScriptValue('RICE_red_sea_al_umari_aspiration_dev_bonus')]#! de [development|El])\n$EFFECT_LIST_BULLET$Prendre la [decision|El] de #V $RICE_nile_pastoralists_positive_decision$ #!et/ou #V $RICE_nile_pastoralists_negative_decision$ #! au moins une fois (Récompense : Gain d'un [perk|El] de [stewardship_lifestyle|El] et/ou un [perk|El] d'[intrigue_lifestyle|El] respectivement)"
 RICE_nubia_historical_aspiration_action_georgios_867:"#italic Vous avez envoyé votre neveu, Niuty, avec une armée pour vaincre le seigneur de guerre maraudeur al-Umari, mais le perfide Prince a levé son étendard en rébellion. Que ce soit par la ruse, la diplomatie ou la bataille, ces deux fauteurs de troubles - le traître et le bandit - doivent être ramenés à l'ordre, si l'on veut restaurer la paix en Makurie !#!$RICE_nubia_aspiration_georgios_867_desc$"
 RICE_nubia_historical_aspiration_modifier_desc_georgios_867: "[GetModifier('RICE_nubia_aspiration_defeat_the_traitor_and_the_bandit').GetNameWithTooltip]" 
 RICE_nubia_aspiration_niuty_desc:"\n\n#bold [historical_aspiration_main_objectives|E]#!\n$EFFECT_LIST_BULLET$Être un [ruler|El] [independent|El] de [GetTitleByKey('k_nubia').GetNameNoTier]\n$EFFECT_LIST_BULLET$S'assurer que votre oncle Georgios n'est pas en [war|El] avec vous et est soit mort, ne détient aucun [titles|El], est [imprisoned|El], est votre [ally|El], ou est votre [vassal|El] qui est soit [intimidated|El] soit [cowed|El] par vous ou a au moins [opinion_i|El] #P 75#! d'[opinion|El]  envers vous\n$EFFECT_LIST_BULLET$S'assurer qu'al-Umari n'est pas en [war|El] avec vous et est soit mort, ne détient aucun [titles|El], est [imprisoned|El], est votre [ally|El], ou est votre [vassal|El] qui est soit [intimidated|El] soit [cowed|El] par vous ou a au moins [opinion_i|El] #P 75#! d'[opinion|El] envers vous\n\n#bold Récompenses#!\n$EFFECT_LIST_BULLET$Gain de @prestige_icon! #V [EmptyScope.ScriptValue('RICE_aspiration_large_resource_bonus')]#! de [prestige|El]\n$EFFECT_LIST_BULLET$Gain d'un [perk|El] de [martial_lifestyle|El]\n$EFFECT_LIST_BULLET$Améliorez votre [education_trait|El]\n$EFFECT_LIST_BULLET$Recevez #V 1000#! [special_troops|El], dont quelques [men_at_arms|El]\n\n#bold [historical_aspiration_bonus_objectives|E]#!\n$EFFECT_LIST_BULLET$[completely_control|E] [GetTitleByKey('k_nubia').GetNameNoTier] (Récompense : Chaque [county|El] que vous contrôlez complètement dans [GetGeographicalRegion('RICE_greater_nubia_region').GetName] gagne @development_icon! #V [EmptyScope.ScriptValue('RICE_red_sea_al_umari_aspiration_dev_bonus')]#! de [development|El])\n$EFFECT_LIST_BULLET$Prendre la [decision|El] de #V $RICE_nile_pastoralists_positive_decision$#! ou #V $RICE_nile_pastoralists_negative_decision$#! au moins une fois (Récompense : Gagnez un [perk|El] de [stewardship_lifestyle|El] ou d'[intrigue_lifestyle|El] respectivement)"
 RICE_nubia_historical_aspiration_action_niuty:"#italic Votre oncle Georgios vous a envoyé avec une armée pour vaincre le seigneur de guerre maraudeur al-Umari, mais vous avez réalisé que votre oncle est un vieux roi indigne et gâteux. Le trône de Makurie appartient à un homme d'action rusé, et c'est vous qui triompherez d'al-Umari et apporterez un nouvel âge de splendeur à la Makurie !#!$RICE_nubia_aspiration_niuty_desc$"
 RICE_nubia_historical_aspiration_modifier_desc_niuty: "[GetModifier('RICE_nubia_aspiration_take_over_makuria').GetNameWithTooltip]" 
 RICE_nubia_aspiration_merki_desc:"\n\n#bold [historical_aspiration_main_objectives|E]#!\n$EFFECT_LIST_BULLET$Rester un [vassal|El] (ou [vassal|El] d'un [vassal|El]) du [ruler|El] de [GetTitleByKey('k_nubia').GetNameNoTier]\n$EFFECT_LIST_BULLET$Détenir au moins #V 3#! [counties|El] ou #V 1#! [duchy|El]\n$EFFECT_LIST_BULLET$Prendre la [decision|El] de #V $RICE_nubia_agriculture_decision$#! au moins une fois\n$EFFECT_LIST_BULLET$Avoir un [piety_level|El] de [GetModifier( 'piety_level_3' ).GetNameWithTooltip|L] ou plus, #italic OU#! un [prestige_level|El] de [GetModifier( 'prestige_level_3' ).GetNameWithTooltip|L] ou plus\n\n#bold Récompenses#!\n$EFFECT_LIST_BULLET$Gain de @dynasty_prestige_icon! #V [EmptyScope.ScriptValue('RICE_aspiration_medium_resource_bonus')]#! de [dynasty_prestige|El]\n$EFFECT_LIST_BULLET$Améliore votre [education_trait|El]\n$EFFECT_LIST_BULLET$Améliorer le [modifier|El] [GetModifier('RICE_nubia_merki_modifier').GetNameWithTooltip] en [modifier|El] [GetModifier('RICE_nubia_merki_upgraded_modifier').GetNameWithTooltip]\n$EFFECT_LIST_BULLET$Gain de @gold_icon! #V [EmptyScope.ScriptValue('RICE_aspiration_small_resource_bonus')]#! d'[gold|El]\n\n#bold [historical_aspiration_bonus_objectives|E]#!\n$EFFECT_LIST_BULLET$Être [friend|El] avec ou un [councillor|El] du [ruler|El] de [GetTitleByKey('k_nubia').GetNameNoTier], ou s'assurer qu'il ait au moins #P 75#! d'[opinion|El] [opinion_i|El] envers vous (Récompense : Gagner @gold_icon! #V [EmptyScope.ScriptValue('RICE_aspiration_small_resource_bonus')]#! d'[gold|El])\n$EFFECT_LIST_BULLET$Prendre la [decision|El] d'#V $RICE_nile_pastoralists_positive_decision$#! et/ou #V $RICE_nile_pastoralists_negative_decision$#! au moins une fois (Récompense : Gain d'un [perk|El] de [diplomacy_lifestyle|El] et/ou d'[intrigue_lifestyle|El] respectivement)\n$EFFECT_LIST_BULLET$Prendre la [decision|El] de #V $RICE_nubia_agriculture_decision$#! plus d'une fois (Récompense : Gain de @prestige_icon! #V [EmptyScope.ScriptValue('RICE_aspiration_tiny_resource_bonus')]#! de [prestige|El] pour chaque instance, jusqu'à un maximum de #V 5#! instances)"
 RICE_nubia_historical_aspiration_action_merki:"#italic Après avoir commencé comme un modeste fonctionnaire agricole à [GetTitleByKey('c_sai').GetNameNoTier], vous avez lentement gravi les échelons de l'administration de Makurie - grâce à vos compétences en agriculture et en finances, vous cherchez à grimper encore plus haut.#!$RICE_nubia_aspiration_merki_desc$"
 RICE_nubia_historical_aspiration_modifier_desc_merki: "[GetModifier('RICE_nubia_aspiration_ascend_bureaucracy_makuria').GetNameWithTooltip]" 
 RICE_nubia_aspiration_kusbur_desc:"\n\n#bold [historical_aspiration_main_objectives|E]#!\n$EFFECT_LIST_BULLET$Rester de [culture|El] #V Daju#!, ou d'une [culture|El] qui en descend\n$EFFECT_LIST_BULLET$Être un [ruler|El] [independent|El] de [GetTitleByKey('d_dar_daju').GetNameNoTier]\n$EFFECT_LIST_BULLET$Détenir au moins #V 4#! [counties|El] dans la [region|El] du [GetGeographicalRegion('RICE_greater_darfur').GetName]\n$EFFECT_LIST_BULLET$Prendre la [decision|El] de #V $RICE_nubia_tebeldi_trees_decision$#! au moins une fois\n$EFFECT_LIST_BULLET$Avoir un [piety_level|El] de [GetModifier( 'piety_level_3' ).GetNameWithTooltip|L] ou plus #italic OU#! un [prestige_level|El] de [GetModifier( 'prestige_level_3' ).GetNameWithTooltip|L] ou plus\n\n#bold Récompenses#!\n$EFFECT_LIST_BULLET$Gain de @dynasty_prestige_icon! #V [EmptyScope.ScriptValue('RICE_aspiration_large_resource_bonus')]#! de [dynasty_prestige|El]\n$EFFECT_LIST_BULLET$Chaque [county|El] de votre [realm|El] dans le [GetGeographicalRegion('RICE_greater_darfur').GetName] obtient le [modifier|El] [GetModifier('RICE_nubia_daju_migrations_modifier').GetNameWithTooltip] pour #V 50#! ans#!\n\n#bold [historical_aspiration_bonus_objectives|E]#!\n$EFFECT_LIST_BULLET$Avoir au moins un [direct_vassal|El] qui est de [rank|El] [count|El] et de [culture|El] #bold Tora#! ou d'une [culture|El] qui en descend (Récompense : Recevez #V 500#! [special_troops|El], dont des [men_at_arms|El])\n$EFFECT_LIST_BULLET$Avoir au moins un [direct_vassal|El] qui est de [rank|El] [count|El] et de [culture|El] #bold Daju#! ou d'une [culture|El] qui en descend (Récompense : Recevez #V 500#! [special_troops|El], dont des [men_at_arms|El])\n$EFFECT_LIST_BULLET$Prendre la [decision|El] de #V $RICE_nubia_lake_oracle_decision$#! au moins une fois (Récompense : Gain de @piety_icon! #V [EmptyScope.ScriptValue('RICE_aspiration_medium_resource_bonus')]#! de [piety|El])"
 RICE_nubia_historical_aspiration_action_kusbur:"#italic Sous votre commandement, les tribus Daju ont commencé à migrer vers l'ouest depuis la Nubie. Le moment venu, le Darfour deviendra la nouvelle patrie de votre peuple.#!$RICE_nubia_aspiration_kusbur_desc$"
 RICE_nubia_historical_aspiration_modifier_desc_kusbur: "[GetModifier('RICE_nubia_aspiration_daju_migration_into_darfur').GetNameWithTooltip]" 
 RICE_nubia_aspiration_moses_georgios_desc:"\n\n#bold [historical_aspiration_main_objectives|E]#!\n$EFFECT_LIST_BULLET$Rester un [ruler|El] [independent|El] de [GetTitleByKey('k_nubia').GetNameNoTier] et [GetTitleByKey('k_alodia').GetNameNoTier]\n$EFFECT_LIST_BULLET$[completely_control|E] [GetTitleByKey('k_nubia').GetNameNoTier] et [GetTitleByKey('k_alodia').GetNameNoTier]\n$EFFECT_LIST_BULLET$Le [ruler|El] de [GetTitleByKey('k_egypt').GetNameNoTier] n'est pas en [war|El] avec vous, et doit soit avoir une [truce|El] avec vous, être votre [vassal|El], [ally|El], ou [tributary|El], ou le [title|El] ne doit pas exister\n$EFFECT_LIST_BULLET$Avoir au moins @gold_icon! #V [EmptyScope.ScriptValue('RICE_aspiration_small_resource_bonus')]#! [gold|El]\n$EFFECT_LIST_BULLET$Prendre la [decision|El] de #V $RICE_nubia_agriculture_decision$#! au moins une fois\n$EFFECT_LIST_BULLET$Prendre la [decision|El] de #V $RICE_nile_pastoralists_positive_decision$#! et/ou #V $RICE_nile_pastoralists_negative_decision$#! au moins une fois\n\n#bold Récompenses#!\n$EFFECT_LIST_BULLET$Gain de @gold_icon! #V [EmptyScope.ScriptValue('RICE_aspiration_large_resource_bonus')]#! [gold|El]\n$EFFECT_LIST_BULLET$Gain de @prestige_icon! #V [EmptyScope.ScriptValue('RICE_aspiration_large_resource_bonus')]#! [prestige|El]\n$EFFECT_LIST_BULLET$Chaque [county|El] dans votre [realm|El] en [GetGeographicalRegion('RICE_greater_nubia_region').GetName] gagne @development_icon! #V [EmptyScope.ScriptValue('RICE_red_sea_al_umari_aspiration_dev_bonus')]#! [development|El]\n$EFFECT_LIST_BULLET$Recevez #V 1000#! [special_troops|El], dont quelques [men_at_arms|El]\n$EFFECT_LIST_BULLET$La [situation|El] du [RICE_baqt|E] dans la [region|El] de #V Nubie#! gagne un Catalyseur de [situation|El] majeur pour la faire basculer vers la [situation_phase|El] [RICE_baqt_accord|E] après la fin de la [situation_phase|El] actuelle\n\n#bold [historical_aspiration_bonus_objectives|E]#!\n$EFFECT_LIST_BULLET$Avoir un [piety_level|El] de [GetModifier( 'piety_level_3' ).GetNameWithTooltip|L] ou plus, OU un [prestige_level|El] de [GetModifier( 'prestige_level_3' ).GetNameWithTooltip|L] ou plus (Récompense : Gain de @dynasty_prestige_icon! #V [EmptyScope.ScriptValue('RICE_aspiration_large_resource_bonus')]#! [dynasty_prestige|El])\n$EFFECT_LIST_BULLET$Avoir au moins un [vassal|El] [GetReligionByKey('islam_religion').GetAdherentName] qui est votre [ally|El], [intimidated|El] ou [cowed|El] par vous, ou a au moins [opinion_i|El] #P 75#! d'[opinion|El] envers vous (Récompense : Gain de #V 500#! [special_troops|El], dont quelques [men_at_arms|El] moyen-orientaux)"
 RICE_nubia_historical_aspiration_action_moses_georgios:"#italic Votre royaume est dévasté par les récentes attaques de l'Égypte, et la Nubie est menacée par des ennemis extérieurs et intérieurs. Vous êtes parfaitement conscient que la Nubie doit se reconstruire et se préparer afin de pouvoir résister à sa prochaine crise.#!$RICE_nubia_aspiration_moses_georgios_desc$"
 RICE_nubia_historical_aspiration_modifier_desc_moses_georgios: "[GetModifier('RICE_nubia_aspiration_revive_nubia').GetNameWithTooltip]" 
 RICE_nubia_aspiration_eparch_adam_desc:"\n\n#bold [historical_aspiration_main_objectives|E]#!\n$EFFECT_LIST_BULLET$Rester un [vassal|El] de [GetTitleByKey('k_nubia').GetNameNoTier]\n$EFFECT_LIST_BULLET$Détenir le [title|El] de [GetTitleByKey('d_nobatia').GetNameNoTier]\n$EFFECT_LIST_BULLET$Vous ou votre [liege|El] [completely_control|El] [GetTitleByKey('d_nobatia').GetNameNoTier]\n$EFFECT_LIST_BULLET$Atteindre #V 100#! [trait_level_track_xp|El] du [trait|El] [GetTrait('RICE_lord_of_the_mountain').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$Avoir au moins @gold_icon! #V [EmptyScope.ScriptValue('RICE_aspiration_small_resource_bonus')]#! d'[gold|El]\n\n#bold Récompenses#!\n$EFFECT_LIST_BULLET$Gain de @gold_icon! #V [EmptyScope.ScriptValue('RICE_aspiration_large_resource_bonus')]#! d'[gold|El]\n$EFFECT_LIST_BULLET$Chaque [county|El] dans [GetGeographicalRegion('RICE_nubia_frontier').GetName|l] gagne @development_icon! #V [EmptyScope.ScriptValue('RICE_red_sea_al_umari_aspiration_dev_bonus')] #![development|El]\n$EFFECT_LIST_BULLET$Améliore votre [education_trait|El]\n$EFFECT_LIST_BULLET$Gain d'un [perk|El] de [diplomacy_lifestyle|El]\n\n#bold [historical_aspiration_bonus_objectives|E]#!\n$EFFECT_LIST_BULLET$Avoir une [truce|El] avec, ou être un [ally|El], d'au moins un [ruler|El] [GetReligionByKey('islam_religion').GetAdherentName] (Récompense : Gain de #V 500#! [special_troops|El], y compris des [men_at_arms|El] moyen-orientaux)\n$EFFECT_LIST_BULLET$Avoir un [prestige_level|El] de [GetModifier( 'prestige_level_3' ).GetNameWithTooltip|L] ou plus (Récompense : Gain d'un [perk|El] de [intrigue_lifestyle|El])" # 
 RICE_nubia_historical_aspiration_action_eparch_adam:"#italic L'effondrement des Fatimides et les récentes guerres entre l'Égypte et la Nubie ont affaibli nos frontières septentrionales. En tant qu'Éparque de Nobatie nouvellement nommé, votre devoir est de protéger les frontières nord de la Nubie et de renforcer les liens économiques et diplomatiques de la Nubie avec l'Égypte.#!$RICE_nubia_aspiration_eparch_adam_desc$"
 RICE_nubia_historical_aspiration_modifier_desc_eparch_adam: "[GetModifier('RICE_nubia_aspiration_look_after_nubia_frontier').GetNameWithTooltip]" 
 RICE_nubia_aspiration_eldad_desc:"\n\n#bold [historical_aspiration_main_objectives|E]#!\n$EFFECT_LIST_BULLET$Rester de [faith|El] [GetReligionByKey('judaism_religion').GetAdjective]\n$EFFECT_LIST_BULLET$Atteindre #V 100#! [trait_level_track_xp|El] dans n'importe quel [trait_level_track|El] du [trait|El] [GetTrait('RICE_the_danite').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$Avoir un [piety_level|El] de [GetModifier( 'piety_level_2' ).GetNameWithTooltip|L] ou plus\n$EFFECT_LIST_BULLET$Avoir un [prestige_level|El] de [GetModifier( 'prestige_level_2' ).GetNameWithTooltip|L] ou plus\n\n#bold Récompenses#!\n$EFFECT_LIST_BULLET$Améliore le [trait|El] [GetTrait('RICE_the_danite').GetName( GetNullCharacter )] en [traits|El] [GetTrait('RICE_the_danite_upgraded_serpent').GetName( GetNullCharacter )] ou [GetTrait('RICE_the_danite_upgraded_justice').GetName( GetNullCharacter )] selon que vous avez maximisé le [trait_level_track|El] $trait_track_RICE_the_danite_serpent$ ou $trait_track_RICE_the_danite_justice$ respectivement\n$EFFECT_LIST_BULLET$Chances de succès accrues en prenant la [decision|El] #V $RICE_eldad_ha_dani_decision$#!\n$EFFECT_LIST_BULLET$Débloquer la [legend_seed|El] #bold $RICE_the_tribe_of_dan_legend_name$#!\n$EFFECT_LIST_BULLET$Votre [faith|El] gagne #V 20#! de [fervor|El]\n$EFFECT_LIST_BULLET$Gain de @gold_icon! #V [EmptyScope.ScriptValue('RICE_aspiration_medium_resource_bonus')]#! d'[gold|El]\n$EFFECT_LIST_BULLET$Gain de @prestige_icon! #V [EmptyScope.ScriptValue('RICE_aspiration_medium_resource_bonus')]#! de [prestige|El] #italic OU#! @piety_icon! #V [EmptyScope.ScriptValue('RICE_aspiration_medium_resource_bonus')]#! de [piety|El], selon que vous avez maximisé le [trait_level_track|El] $trait_track_RICE_the_danite_serpent$ ou $trait_track_RICE_the_danite_justice$ respectivement\n\n#bold [historical_aspiration_bonus_objectives|E]#!\n$EFFECT_LIST_BULLET$Rester un [adventurer|El] (Récompense : Gain de @gold_icon! #V [EmptyScope.ScriptValue('RICE_aspiration_medium_resource_bonus')]#! d'[gold|El])\n$EFFECT_LIST_BULLET$Avoir un [piety_level|El] de [GetModifier( 'piety_level_4' ).GetNameWithTooltip|L] ou plus (Récompense : Gain de @dynasty_prestige_icon! #V [EmptyScope.ScriptValue('RICE_aspiration_medium_resource_bonus')]#! de [dynasty_prestige|El])\n$EFFECT_LIST_BULLET$Avoir un [prestige_level|El] de [GetModifier( 'prestige_level_4' ).GetNameWithTooltip|L] ou plus (Récompense : Gagnez un [perk|El] de [intrigue_lifestyle|El] ou de [learning_lifestyle|El], selon que vous avez maximisé le [trait_level_track|El] $trait_track_RICE_the_danite_serpent$ ou $trait_track_RICE_the_danite_justice$ respectivement)"
 # \n$EFFECT_LIST_BULLET$Spread the $RICE_the_tribe_of_dan_legend_name$ to at least #V [EmptyScope.ScriptValue('RICE_eldad_hadani_aspiration_province_req_value')]#! [provinces|E]
 # \n$EFFECT_LIST_BULLET$Every [GetReligionByKey('judaism_religion').GetAdjective] [faith|E] gains the #V Legends of the Danites#! [doctrine|E]
 RICE_nubia_historical_aspiration_action_eldad:"#italic Certains Juifs croient vos récits selon lesquels vous descendez de la Tribu de Dan qui s'est installée au cœur de l'Afrique, mais d'autres sont sceptiques et pensent que vous êtes un imposteur. Quoi qu'il en soit, vous espérez visiter de nombreuses communautés juives à travers le monde pour leur raconter vos histoires inspirantes.#!$RICE_nubia_aspiration_eldad_desc$"
 RICE_nubia_historical_aspiration_modifier_desc_eldad: "[GetModifier('RICE_nubia_aspiration_spread_stories_tribe_of_dan').GetNameWithTooltip]" 
 RICE_nubia_aspiration_fatimid_turks_desc:"\n$EFFECT_LIST_BULLET$Rester un [vassal|El] de [GetTitleByKey('k_egypt').GetNameNoTier]\n$EFFECT_LIST_BULLET$Être le [regent|El] de[GetTitleByKey('k_egypt').GetNameNoTier]\n$EFFECT_LIST_BULLET$Le [holder|El] de [GetTitleByKey('k_egypt').GetNameNoTier] doit contrôler complètement la [region|El] de l'[GetGeographicalRegion('custom_roman_aegyptus').GetName]\n\n#bold Récompenses#!\n$EFFECT_LIST_BULLET$Gain de @gold_icon! #V [EmptyScope.ScriptValue('RICE_aspiration_medium_resource_bonus')]#! [gold|El] d'or\n$EFFECT_LIST_BULLET$La [situation|El] du [RICE_baqt|El] de la [region|El] de l'#V Égypte#! est automatiquement avancée à la [situation_phase|El] [RICE_baqt_accord|El] si elle est dans la [situation_phase|El] [RICE_baqt_discord|El]\n$EFFECT_LIST_BULLET$Recevez #V 2000#! [special_troops|El], incluant des [men_at_arms|El]\n$EFFECT_LIST_BULLET$Gain d'un [perk|El] de [martial_lifestyle|El] et un [perk|El] d'[intrigue_lifestyle|El]\n\n#bold [historical_aspiration_bonus_objectives|E]#!\n$EFFECT_LIST_BULLET$Être le [entrenched_regent|El] de [GetTitleByKey('k_egypt').GetNameNoTier] (Récompense : Gain de @gold_icon! #V [EmptyScope.ScriptValue('RICE_aspiration_medium_resource_bonus')]#! [gold|El])\n$EFFECT_LIST_BULLET$Votre [liege|El] ait une [opinion_i|El] #P 75#! [opinion|El] de vous ou soit votre [friend|El] (Récompense : Gain de @legitimacy_icon! #V [EmptyScope.ScriptValue('medium_legitimacy_gain')]#! [legitimacy|El])\n$EFFECT_LIST_BULLET$Avoir une [alliance|El] avec un [ruler|El] étranger de [rank|El] [king|El] ou supérieur (Récompense : Gain de @prestige_icon! #V [EmptyScope.ScriptValue('RICE_aspiration_large_resource_bonus')]#! [prestige|El])"
 RICE_nubia_aspiration_nasir_al_dawla_desc:"\n\n#bold [historical_aspiration_main_objectives|E]#!\n$EFFECT_LIST_BULLET$Assurez-vous que #V Yaldakush#!, #V Ildekuz#!, #V Nahid al-Dawla#! et #V Badr al-Jamali#! soient morts, sont vos [vassals|El] ou [allies|El], ou ne possèdent aucun [titles|El]$RICE_nubia_aspiration_fatimid_turks_desc$"
 RICE_nubia_historical_aspiration_action_nasir_al_dawla:"#italic Le royaume fatimide s'effondre alors que des unités militaires et des factions rivales se disputent l'Égypte. Que vos motivations soient honorables ou non, en tant que commandant majeur des unités turques, vous ferez ce qu'il faut pour éliminer vos rivaux, restaurer l'ordre le long du Nil et devenir le régent tout-puissant des Califes.#!$RICE_nubia_aspiration_nasir_al_dawla_desc$"
 RICE_nubia_historical_aspiration_modifier_desc_nasir_al_dawla: "[GetModifier('RICE_nubia_aspiration_become_egypts_military_dictator_nasir_al_dawla').GetNameWithTooltip]" 
 RICE_nubia_aspiration_yaldakush_desc:"\n\n#bold [historical_aspiration_main_objectives|E]#!\n$EFFECT_LIST_BULLET$Assurez-vous que #V Nasir al-Dawla#!, #V Ildekuz#!, #V Nahid al-Dawla#! et #V Badr al-Jamali#! soient morts, sont vos [vassals|El] ou [allies|El], ou ne possèdent aucun [titles|El]$RICE_nubia_aspiration_fatimid_turks_desc$"
