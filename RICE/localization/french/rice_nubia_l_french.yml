 RICE_baqt_frontier_land_sales_tooltip:"#italic En raison du mélange de nombreux peuples différents, et de la nature lucrative des terres agricoles du Nil, il est important d'impliquer l'administration locale dans la certification des ventes de terres légitimes dans cette région.#!"
