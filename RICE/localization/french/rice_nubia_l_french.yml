 RICE_baqt_frontier_report_effect_1_tt:"La réussite de cette tâche dépend de votre [skill|El] d'[learning_i|El] [learning|El]"
 RICE_baqt_frontier_traffic_positive_name:"#Bold Encourager le trafic transfrontalier#!"
 RICE_baqt_frontier_traffic_positive_desc: "$RICE_baqt_frontier_traffic_positive_name$"
 RICE_baqt_frontier_traffic_positive_tooltip:"#italic En temps de paix et de prospérité, nous accueillons les marchands, les aventuriers, les migrants et toute autre personne venue de l'autre côté de la frontière dont la présence améliorera notre économie locale et enrichira nos communautés#!"
 RICE_baqt_frontier_traffic_negative_name:"#Bold Décourager le trafic transfrontalier#!"
 RICE_baqt_frontier_traffic_negative_desc: "$RICE_baqt_frontier_traffic_negative_name$"
 RICE_baqt_frontier_traffic_negative_tooltip:"#italic En temps de guerre et d'incertitude, nous devons réduire le trafic arrivant dans nos terres depuis l'autre côté de la frontière, de peur que leur présence ne cause davantage de troubles et de conflits.#!"
 RICE_nubia_bestow_kanz_al_dawla:0 "Octroyer le titre de Trésor de l'État"
 RICE_nubia_bestow_kanz_al_dawla_tooltip:0 "xxxxx"
 RICE_nubia_bestow_kanz_al_dawla_desc:0 "L'actuel [GetTrait('RICE_governor_of_aswan').GetName( GetNullCharacter )] m'a bien servi. Pour le récompenser, je souhaite lui conférer le titre de [Glossary( 'Kanz al-Dawla', 'KANZ_AL_DAWLA_GLOSS' )], afin d'honorer son loyal service, et son rôle croissant dans la gestion de la frontière égyptienne et nubienne et du [RICE_baqt_treaty|El] en tant que [GetTrait('RICE_the_danite_upgraded_serpent').GetName( GetNullCharacter )]."
 RICE_nubia_bestow_kanz_al_dawla_desc_self:0 "N'ai-je pas bien servi [ROOT.Char.GetLiege.GetTitledFirstName] en tant que [GetTrait('RICE_governor_of_aswan').GetName( GetNullCharacter )] ? C'est moi qui ai pris des responsabilités croissantes, gérant la frontière égyptienne et nubienne ainsi que le [RICE_baqt_treaty|El] pour le bien de l'État."
 RICE_nubia_bestow_kanz_al_dawla_effect_tooltip_1:1 "xxxxx"
 RICE_nubia_bestow_kanz_al_dawla_confirm:0 "Défendez notre frontière, faites-la prospérer !"
 RICE_nubia_bestow_kanz_al_dawla_context_tooltip:0 "#emphasis Contexte Historique : #! xxxxx"
 RICE_nubia_tebeldi_trees_decision:0 "Entretenir les arbres Tebeldi"
 RICE_nubia_tebeldi_trees_decision_tooltip:0 "Assurez-vous que les [Glossary( 'arbres tebeldi', 'TEBELDI_TREES_GLOSS' )] du [GetGeographicalRegion('RICE_greater_darfur').GetName] sont en bon état."
 RICE_nubia_tebeldi_trees_decision_desc:0 "Il est de mon devoir sacré d'entretenir les [Glossary( 'arbres tebeldi', 'TEBELDI_TREES_GLOSS' )] dans mes territoires de la [region|El] du [GetGeographicalRegion('RICE_greater_darfur').GetName], ainsi que les puits et les melons cultivés, afin de garantir à mes sujets une source d'eau fiable."
 RICE_nubia_tebeldi_trees_decision_effect_tooltip_1:1 "Le coût en [gold_i|El] [gold|El] et en [piety_i|El] [piety|El] que vous obtenez de cette [decision|El] dépend du nombre de [counties|El] que vous possédez dans la [region|El] du [GetGeographicalRegion('RICE_greater_darfur').GetName]"
 RICE_nubia_tebeldi_trees_decision_effect_tooltip_2:1 "Le montant de [prestige_i|E] [prestige|El] et [legitimacy_i|El] [legitimacy|El] que vous gagnez dépend du nombre de [counties|El] que vous possédez dans la [region|El] du [GetGeographicalRegion('RICE_greater_darfur').GetName]"
 RICE_nubia_tebeldi_trees_decision_confirm:0 "Tant que ces arbres survivront, nous survivrons tous"
 RICE_nubia_tebeldi_trees_decision_context_tooltip:0 "#emphasis Contexte Historique : #! $TEBELDI_TREES_GLOSS$"
 RICE_nubia_lake_oracle_decision:0 "Consulter les oracles du lac de montagne"
 RICE_nubia_lake_oracle_decision_tooltip:0 "Les eaux des lacs de montagne peuvent nous en dire beaucoup sur l'avenir."
 RICE_nubia_lake_oracle_decision_desc:0 "Traditionnellement, nous avons traité les lacs de montagne avec la plus grande révérence, car ils possèdent des pouvoirs spirituels et prophétiques. Je devrais envoyer un représentant à l'un de ces lacs pour interroger mon avenir."
 RICE_nubia_lake_oracle_decision_effect_tooltip_1:1 "Vous pourriez obtenir des [character_modifiers|El] #P bénéfiques#! ou #N négatifs#! qui vous informent sur le futur potentiel de votre [realm|El]"
 RICE_nubia_lake_oracle_decision_effect_tooltip_2:1 "Les chances d'obtenir un bon ou mauvais [modifier|El] dépendent de vos [virtues|El], [sins|El], [piety_level|El], [prestige_level|El], et [legitimacy_level|El]"
 RICE_nubia_lake_oracle_decision_effect_tooltip_3:1 "Vous pouvez augmenter davantage les chances d'obtenir un bon [modifier|El] en envoyant un [courtier|El], en particulier un membre du [clergy|El], bien que cela coûtera du [prestige_i|El] [prestige|El] supplémentaire"
 RICE_nubia_lake_oracle_decision_confirm:0 "Préparez-vous à envoyer quelqu'un aux lacs de montagne !"
 RICE_nubia_lake_oracle_decision_context_tooltip:0 "#emphasis Contexte historique :#! Chez certains peuples du Darfour, les lacs de montagne sont traditionnellement considérés comme possédant un pouvoir spirituel. Traditionnellement, les habitants ressentaient une grande crainte et une grande révérence envers ces lacs, refusaient de toucher les eaux, et les dirigeants envoyaient des représentants à ces lacs pour pratiquer la divination en ces lieux. Même à l'époque moderne, alors que le Darfour a été largement islamisé, il existe toujours une forte croyance selon laquelle de puissants esprits résident en ces lieux."
 RICE_nubia_lake_oracle_decision_recent_req:0 "Possède actuellement un [modifier|El] Oracle du Lac de Montagne"
 RICE_nubia_sudanese_culture_decision:0 "Former la culture soudanaise"
 RICE_nubia_sudanese_culture_decision_tooltip:0 "Un nouveau peuple soudanais naîtra parmi les terres du fleuve Nil."
 RICE_nubia_sudanese_culture_decision_east_african_desc:0 "Si de plus en plus de tribus Est-africaines continuent de s'installer dans les terres fertiles d'[GetGeographicalRegion('ghw_region_egypt').GetName], nous devrions cimenter leur présence en formant une nouvelle identité #V soudanaise#!."
 RICE_nubia_sudanese_culture_decision_arabic_desc:0 "Si de plus en plus de tribus Est-africaines continuent de s'installer dans les terres fertiles d'[GetGeographicalRegion('RICE_greater_nubia_region').GetName], nous devrions cimenter leur présence en formant une nouvelle identité #V soudanaise#!."
 RICE_nubia_sudanese_culture_decision_neutral_desc:0 "Au fil du temps, les tribus $heritage_arabic_name$ et $heritage_arabic_name$ pourraient migrer vers les terres fertiles d'[GetGeographicalRegion('ghw_region_egypt').GetName] et de [GetGeographicalRegion('RICE_greater_nubia_region').GetName] respectivement. Pourrions-nous jouer un rôle en influençant le développement de l'un ou l'autre groupe, en formant une nouvelle identité #V soudanaise#! ?"
 RICE_nubia_sudanese_culture_decision_effect_tooltip_1_arabic:1 "Les autres [rulers|El] en [GetGeographicalRegion('RICE_greater_nubia_region').GetName], en particulier ceux de [heritage|El] $heritage_arabic_name$, pourraient se convertir à la [culture|El] #V soudanaise#!"
 RICE_nubia_sudanese_culture_decision_effect_tooltip_1_east_african:1 "Les autres [rulers|El] en [GetGeographicalRegion('ghw_region_egypt').GetName], en particulier ceux du [heritage|El] $heritage_east_african_name$, peuvent se convertir à la [culture|El] #V soudanaise#!"
 RICE_nubia_sudanese_culture_decision_confirm:0 "Un nouveau peuple naîtra le long du fleuve Nil !"
 RICE_nubia_sudanese_culture_decision_context_tooltip:0 "#emphasis Contexte historique :#! Bien que le déclin historique des royaumes chrétiens de Nubie et l'émergence de l'identité arabe soudanaise moderne soient un sujet complexe et multifactoriel, la présence accrue de tribus arabes et l'arabisation et l'islamisation subséquentes d'une grande partie de la Nubie ont pu être un facteur de ce processus. Cela dit, bien que les Arabes soudanais constituent une large majorité de la population du Soudan, il existe encore une minorité significative de Nubiens au Soudan, ainsi que dans le sud de l'Égypte."
 RICE_nile_empire_decision:0 "Unir les Terres du Nil"
 RICE_nile_empire_decision_tooltip:0 "Formez un nouvel empire pour régner sur les rives du Nil."
 RICE_nile_empire_decision_desc:0 "Des marais septentrionaux du delta en [GetGeographicalRegion('ghw_region_egypt').GetName] aux savanes et collines des confins méridionaux de [GetGeographicalRegion('RICE_greater_nubia_region').GetName], toute [GetGeographicalRegion('RICE_nile_river_valley').GetName] sera unie par les [GetPlayer.GetFaith.GetAdherentNamePlural] [GetPlayer.GetCulture.GetCollectiveNoun] sous la [dynasty|El] [GetPlayer.GetDynasty.GetName] !"
 RICE_nile_empire_decision_effect_tooltip_1:1 "Vous pouvez optionnellement choisir de renommer l'[GetTitleByKey('e_RICE_nile').GetName] parmi plusieurs noms différents"
 RICE_nile_empire_decision_effect_tooltip_2:1 "Vous choisirez entre différentes [legend_seeds|El] pour proclamer votre [dynasty|El] comme descendant de l'une de plusieurs figures historiques ou légendaires du passé de l'Égypte ou de la Nubie"
 RICE_nile_empire_decision_confirm:0 "Le Nil, et notre empire, seront éternels !"
 RICE_nile_empire_decision_context_tooltip:0 "#emphasis Contexte historique :#! L'Égypte et la Nubie ont été unies sous un même empire à plusieurs reprises au cours de leur histoire. Par exemple, les Pharaons égyptiens ont contrôlé la Nubie à diverses périodes de l'histoire de l'Égypte antique, tandis que les rois nubiens ont conquis l'Égypte à leur tour pour établir la soi-disant 25e dynastie d'Égypte. Durant la fin de la période médiévale, les Mamelouks ont conquis ou vassalisé des parties de la Nubie."
 RICE_nubia_drink_holy_text:0 "Boire [ROOT.Char.GetFaith.ReligiousText]"
 RICE_nubia_drink_holy_text_tooltip:0 "Boire l'encre utilisée pour écrire [ROOT.Char.GetFaith.ReligiousText]"
 RICE_nubia_drink_holy_text_desc:0 "Parmi certains [ROOT.Char.GetFaith.GetAdherentNamePlural] [ROOT.Char.GetCulture.GetCollectiveNoun|l], il existe une coutume de boire l'encre utilisée pour écrire des versets [ROOT.Char.GetFaith.ReligiousText3]. On attribue à cette encre des qualités médicales et miraculeuses."
 RICE_nubia_drink_holy_text_confirm:0 "Les bénédictions de [ROOT.Char.GetFaith.HighGodName] prennent de nombreuses formes."
 RICE_nubia_drink_holy_text_context_tooltip:0 "#emphasis Contexte historique :#! Certains musulmans d'Afrique subsaharienne, en particulier en Afrique de l'Est comme au Soudan ou dans les régions swahilies, pratiquent la « boisson » du Coran. Des versets coraniques étaient écrits sur une surface propre avec de l'encre (comestible), puis lavés à l'eau ; ce mélange d'eau et d'encre était consommé comme médicament, pour des bénédictions spirituelles, ou dans la croyance que cela aiderait à l'étude."

