 nubia.0220.t:0 "Un nouvel Empire le long du Nil"
 nubia.0220.desc:0 "Ce n'est pas tous les jours que l'on parvient à unir l'ensemble de [GetGeographicalRegion('RICE_nile_river_valley').GetName] sous un seul royaume, et à établir une domination permanente sur la totalité de celle-ci.\n\nPourtant, c'est ce que je suis parvenu à accomplir.\n\nC'est une grande réalisation, et ma prochaine étape est désormais de choisir un nouveau nom pour cet empire. Ce doit être un bon nom : car même s'il ne durera peut-être pas éternellement, son nom continuera de vivre dans les cœurs et les esprits des générations futures."
 nubia.0220.a:0 "L'empire du #bold Nil#!"
 nubia.0220.b:0 "L'empire d'#bold $e_RICE_greater_egypt$#!"
 nubia.0220.c:0 "L'empire de #bold $e_RICE_greater_nubia$#!"
 nubia.0220.d:0 "L'empire de #bold $e_RICE_greater_kemet$#!"
 nubia.0220.e:0 "L'empire de #bold $e_RICE_greater_kush$#!"
 nubia.0220.tooltip:0 "Le [GetTitleByKey('e_RICE_nile').GetName] change de nom selon l'option que vous sélectionnez"
 nubia.0221.t:0 "$nubia.0220.t$"
 nubia.0221.desc:0 "Bien sûr, n'importe quel imbécile avec suffisamment de guerriers courageux peut conquérir quelques terres. Il faut quelqu'un de sang noble et au caractère vertueux et courageux pour se forger un grand destin.\n\nLes peuples du Nil sauront bien se souvenir de moi non seulement pour avoir été le premier souverain de ce nouvel empire, mais pour mon prestigieux lignage. Après tout, je ne suis pas un quelconque vulgaire seigneur de guerre crasseux et de basse extraction. Il y a une raison pour laquelle [ROOT.Char.GetFaith.WarGodName] m'a laissé devenir le puissant souverain que je suis : car je descends clairement d'une grande lignée qui m'a donné les outils et la force d'accomplir tout ce que j'ai accompli.\n\nCette lignée est une descendance de…"
 nubia.0221.a:0 "Les Abbassides"
 nubia.0221.b:0 "Alexandre le Grand"
 nubia.0221.c:0 "Candace, reine de Méroé"
 nubia.0221.d:0 "Cléopâtre la Savante"
 nubia.0221.e:0 "Cléopâtre la Séductrice"
 nubia.0221.f:0 "Hermes Trismegistus"
 nubia.0221.g:0 "Sesostris"
 nubia.0221.h:0 "Surid ibn Salhouk"
 nubia.0221.i:0 "Les Omeyyades"
 nubia.0222.t:0 "$nubia.0220.t$"
 nubia.0222.desc:0 "Le Nil est éternel, mais les royaumes qui le gouvernent ne le sont pas, car ils semblent s'élever et s'effondrer aussi rapidement que la crue du Nil.\n\nPourtant, de temps à autre, un grand empire émerge le long de [GetGeographicalRegion('RICE_nile_river_valley').GetName], un empire qui s'étend des marais septentrionaux d'[GetGeographicalRegion('ghw_region_egypt').GetName] jusqu'aux savanes et montagnes les plus méridionales de [GetGeographicalRegion('RICE_greater_nubia_region').GetName]. \n\n[nile_conqueror.GetTitledFirstName] est parvenu[nile_conqueror.Custom('FR_E')] à créer un tel empire, qu'[nile_conqueror.GetSheHe] appelle [GetTitleByKey('e_RICE_nile').GetName].\n\nDe plus, que ce soit parce qu'[nile_conqueror.GetSheHe] y croit sincèrement, ou pour des raisons politiques, [nile_conqueror.GetFirstName] a également revendiqué la descendance d'une grande lignée, dont [nile_conqueror.GetSheHe] jure de perpétuer l'héritage pour les années à venir : celle de"
 nubia.0222.desc.abbasids:0 "une branche éloignée des #bold Abbassides#!, les grands Califes."
 nubia.0222.desc.alexander:0 "#bold Alexandre#!, le plus grand conquérant des temps anciens."
 nubia.0222.desc.candace:0 "#bold Candace#!, reine de Méroé qui a résisté avec succès aux armées d'Alexandre."
 nubia.0222.desc.cleopatra_the_scholar:0 "#bold Cléopâtre#!, renommée en tant que reine savante au Moyen-Orient."
 nubia.0222.desc.cleopatra_the_seducer:0 "#bold Cléopâtre#!, la rusée séductrice qui était à la hauteur de la puissance de Rome."
 nubia.0222.desc.hermes_trismegistus:0 "#bold Hermès Trismégiste#!, le brillant philosophe légendaire."
 nubia.0222.desc.sesostris:0 "#bold Sesostris#!, l'un des plus grands pharaons guerriers d'Égypte."
 nubia.0222.desc.surid_ibn_salhouk:0 "#bold Surid ibn Salhouk#!, le roi antédiluvien qui aurait construit les pyramides."
 nubia.0222.desc.umayyads:0 "une branche des #bold Omeyyades#! qui s'est réfugiée à la frontière du Nil."
 nubia.0222.desc.backup:0 "puissants [Glossary( 'pharaons', 'PHARAOH_GLOSS' )] égyptiens et [Glossary( 'Qores', 'QORE_GLOSS' )] et [Glossary( 'Kandakes', 'KANDAKE_GLOSS' )] koushites qui vécurent il y a longtemps."
 nubia.0222.a:0 "Voici un nouveau chapitre dans l'histoire du Nil."
