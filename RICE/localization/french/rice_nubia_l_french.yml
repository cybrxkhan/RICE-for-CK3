 activity_RICE_nubia_banganarti_pilgrimage_desc:0 "Près de $b_old_dongola$ se trouve un lieu connu sous le nom de Banganarti. Les édifices religieux qui s'y trouvent sont un site de pèlerinage [GetReligionByKey('christianity_religion').GetAdherentName] fortement associé à [Glossary( 'Saint Raphael', 'ARCHANGEL_RAPHAEL_GLOSS' )] - de nombreux pèlerins s'y rendent même dans l'espoir de faire un rêve de l'Archange."
