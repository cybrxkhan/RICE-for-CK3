 nubia.0159.desc:0 "xxxxx"
 nubia.0159.a:0 "xxxxx"
 nubia.0160.t:0 "Un message au [receiver.Custom('RICE_nubia_egypt_border_official_type_loc')]"
 nubia.0160.desc:0 "En tant que [giver.Custom('RICE_nubia_egypt_border_official_gloss_type_loc')], il est de mon devoir de maintenir la frontière entre la Nubie et l'Égypte près de [GetTitleByKey('c_aswan').GetNameNoTier]. C'est une tâche peu enviable que je partage avec mon homologue de l'autre côté de la frontière, le [receiver.Custom('RICE_nubia_egypt_border_official_gloss_type_loc')], avec qui je travaille régulièrement.\n\nCela fait un moment que je n'ai pas directement correspondu avec l'actuel [receiver.Custom('RICE_nubia_egypt_border_official_type_loc')], [receiver.GetTitledFirstName]. La communication est nécessaire pour éviter les conflits et tensions inutiles, et pour assurer la circulation sûre des personnes et des marchandises à travers [GetTitleByKey('c_aswan').GetNameNoTierNoTooltip].\n\nJ'ai donc rédigé une lettre formelle à envoyer à [receiver.GetFirstNameNoTooltip], détaillant certaines affaires récentes liées à la frontière, et l'informant des dernières nouvelles en [realm_title.GetNameNoTier]. Peut-être devrais-je même lui envoyer un petit cadeau par la même occasion…."
 nubia.0160.a:0 "Envoyer la lettre formelle - ce ne sont que des affaires courantes."
 nubia.0160.b:0 "Envoyer la lettre et un cadeau en gage de bonne volonté."
 nubia.0160.success.tooltip:0 "#bold #P Réussite#!#!: Votre lettre paraît hospitalière, et il y a une plus grande chance que votre interlocuteur réponde positivement"
 nubia.0160.neutral.tooltip:0 "#bold Ni Réussite ni Échec#!#!: Votre lettre paraît formelle, voire guindée, et elle n'influencera pas la réponse positive ou négative de votre interlocuteur"
 nubia.0160.failure.tooltip:0 "#bold #N Échec#!#!: Votre lettre paraît condescendante, et il y a plus de chances que votre interlocuteur réagisse négativement"
 nubia.0161.t:0 "Un message du [giver.Custom('RICE_nubia_egypt_border_official_type_loc')]"
 nubia.0161.desc.intro:0 "Un messager est arrivé de la part de mon homologue de l'autre côté de la frontière entre la Nubie et l'Égypte, [giver.GetTitledFirstName], avec une lettre et un cadeau modeste mais approprié. La communication entre les deux parties est cruciale pour maintenir la paix entre nos terres, aussi j'ai lu la lettre rapidement, qui commence ainsi :\n\n"
 nubia.0161.desc.good_letter:0 "#italic J'informe m[receiver.Custom('FR_OnA')] [receiver.Custom('SisterBrother')|U], le [receiver.Custom('RICE_nubia_egypt_border_official_gloss_type_loc')], qu'il n'est pas de plus grande générosité accomplie par le [receiver.Custom('RICE_nubia_egypt_border_official_type_loc')] que ce qu'[receiver.GetSheHe] aura fait en matière de devoir de respect, de bonté et d'hospitalité courtoise.#!"
 nubia.0161.desc.neutral_letter:0 "#italic J'informe le [receiver.Custom('RICE_nubia_egypt_border_official_gloss_type_loc')] que le porteur de cette lettre est mon loyal et respectueux serviteur. Veuillez le traiter avec bienveillance et justesse et lui fournir ce dont il a besoin. Je vous adresse mes salutations de bons vœux et de gratitude.#!"
 nubia.0161.desc.bad_letter:0 "#italic J'informe le [receiver.Custom('RICE_nubia_egypt_border_official_gloss_type_loc')] qu'un compte rendu de tout ce que je dois vous dire concernant l'état de nos terres est joint à cette lettre, et j'espère une réponse. Écrivez-moi votre lettre afin que les requêtes de [top_liege.GetTitledFirstName] soient satisfaites par respect.#!"
 nubia.0161.desc.middle:0 "\n\nLa lettre se poursuit encore et encore avec les formalités attendues, et des discussions sur les affaires relatives à la frontière."
 nubia.0161.desc.good:0 "Le langage de la lettre semble #V hospitalier#!, indiquant le désir de [giver.GetFirstNamePossessiveNoTooltip] d'établir une relation productive."
 nubia.0161.desc.neutral:0 "Le langage de la lettre semble #V neutre#! et correct, bien que guindé et banal, manquant de substance - une formalité bureaucratique, semble-t-il."
 nubia.0161.desc.bad:0 "Le langage de la lettre semble #V condescendant#!. Que [giver.GetFirstNameNoTooltip] le veuille ou non, je ne peux m'empêcher d'être un peu offensé."
 nubia.0161.desc.gift:0 "[giver.GetFirstNameNoTooltip] nous a également envoyé un petit cadeau accompagnant la lettre."
 nubia.0161.a:0 "J'apprécie ses mots. Répondre poliment."
 nubia.0161.a.tooltip:0 "Vous envoyez une lettre amicale à [giver.GetTitledFirstName]."
 nubia.0161.a.tooltip.bad:0 "Vous envoyez une lettre amicale en retour à [giver.GetTitledFirstName]. Cependant, comme sa lettre était perçue comme condescendante, cela vous fera paraître faible et sans caractère."
 nubia.0161.a.tooltip.bad.giver:0 "[receiver.GetFirstName] vous a envoyé une lettre amicale en retour. Cependant, comme votre lettre semblait condescendante, cela donne l'impression qu'[receiver.GetSheHe] est faible et sans caractère."
 nubia.0161.b:0 "[receiver.GetSheHe|U] cherche clairement à nous insulter. Répondons fermement."
 nubia.0161.b.tooltip:0 "Vous envoyez une lettre au ton ferme à [giver.GetTitledFirstName]."
 nubia.0161.b.tooltip.bad:0 "Vous envoyez une lettre cinglante en retour à [giver.GetTitledFirstName]. Cependant, en raison de la nature amicale de sa lettre, cela vous fera paraître irrespectueux."
 nubia.0161.b.tooltip.bad.giver:0 "[receiver.GetFirstName] vous a renvoyé une lettre au ton cinglant. Cependant, en raison de la nature amicale de votre lettre, cela [receiver.GetHerHim] fait paraître irrespectueu[receiver.Custom('FR_XSse')]."
 nubia.0162.t:0 "Une réponse du [receiver.Custom('RICE_nubia_egypt_border_official_type_loc')]"
 nubia.0162.desc.intro:0 "Après avoir envoyé ma lettre à [receiver.GetTitledFirstName] en notre qualité de [giver.Custom('RICE_nubia_egypt_border_official_gloss_type_loc')] et [receiver.Custom('RICE_nubia_egypt_border_official_gloss_type_loc')] respectivement, j'ai reçu une réponse de circonstance de sa part.\n\n"
 nubia.0162.desc:0 "Il semble que [receiver.GetFirstNameNoTooltip] ait interprété ma lettre sous un jour #V positif#!, ou du moins prétend l'avoir fait, et m'a répondu de manière amicale et polie. La lettre que son messager porte m'informe de diverses affaires de son côté de la frontière, et qu'[receiver.GetSheHe] apprécie la communication ouverte entre nous deux."
 nubia.0162.a:0 "Je suis ravi d'avoir de ses nouvelles."
 nubia.0162.a.small_success:0 "La correspondance est un #V #P succès mineur#!#!"
 nubia.0162.a.large_success:0 "La correspondance est un #V #P succès majeur#!#!"
 nubia.0163.t:0 "$nubia.0162.t$"
 nubia.0163.desc:0 "Il semble que [receiver.GetFirstNameNoTooltip] ait interprété ma lettre sous un jour #N négatif#!, pour le meilleur ou pour le pire. Bien que la lettre que son messager transporte m'informe de diverses affaires de son côté de la frontière, [receiver.GetFirstNameNoTooltip] me reproche également mon arrogance supposée dans ma lettre originale, disant que je dois être moins irrespectueux dans nos communications."
 nubia.0163.a:0 "Quoi ? Je ne voulais pas l'insulter !"
 nubia.0163.a.small_failure:0 "La correspondance est un #V #N échec mineur#!#!"
 nubia.0163.a.large_failure:0 "La correspondance est un #V #N échec majeur#!#!"
 nubia.0164.t:0 "Fortifier la Frontière"
 nubia.0164.desc:0 "La [GetGeographicalRegion('RICE_egypt_and_nubia_frontier').GetName] est une région frontalière importante pour de nombreuses raisons - militaires, politiques et économiques. En tant que [ROOT.Char.Custom('RICE_nubia_egypt_border_official_gloss_type_loc')], il est de mon devoir de défendre contre toute armée ennemie voyageant le long de [GetGeographicalRegion('RICE_nile_river_valley').GetName].\n\nJ'ai donc mis de côté certaines ressources pour réparer les anciens forts et avant-postes, en construire de nouveaux si nécessaire, fournir un soutien aux messagers et patrouilles qui se rendent à ces emplacements et en reviennent, et pour que nos troupes débusquent tout bandit et tribu désertique menant des raids ici.\n\nCependant, parfois, la population locale ou les marchands de passage peuvent se méfier de tout effort visant à exercer notre autorité sur eux, et je pourrais donc devoir consacrer des ressources supplémentaires pour m'assurer que tout se passe bien."
 nubia.0164.a:0 "Les ressources dont nous disposons sont adéquates."
 nubia.0164.b:0 "Trouver des ressources supplémentaires où nous le pouvons."
 nubia.0164.success:0 "Vos efforts sont #P couronnés de succès#!"
 nubia.0164.failure:0 "Vos efforts sont #N infructueux#!"
 nubia.0164.mixed:0 "Vos efforts ont des #N résultats mitigés#!"
 nubia.0165.t:0 "Succès : $nubia.0164.t$"
 nubia.0165.desc:0 "J'ai reçu des nouvelles de mes subordonnés indiquant que nos efforts pour fortifier notre frontière le long de la [GetGeographicalRegion('RICE_egypt_and_nubia_frontier').GetName] se déroulent sans encombre. Nous avons maintenu nos défenses avec succès, soutenu nos messagers et patrouilles, et capturé ou tué un certain nombre de bandits et de pillards dans ces contrées.\n\n"
 nubia.0165.desc.major:0 "Il semble que mes subordonnés aient fait un excellent travail avec nos récentes entreprises. Les habitants et les marchands itinérants apprécient nos efforts, aidant là où ils le pouvaient, et comprenant qu'eux aussi peuvent jouer un rôle dans nos défenses."
 nubia.0165.desc.minor:0 "Dans l'ensemble, il semble que mes subordonnés aient fait un travail compétent concernant nos récents efforts. Même si certains habitants et marchands itinérants ont des sentiments mitigés, mes officiels disent qu'ils comprennent en fin de compte l'importance de maintenir nos défenses."
 nubia.0165.a:0 "Cela nous gardera bien défendus pour le moment."
 nubia.0166.t:0 "Résultats mitigés : $nubia.0164.t$"
 nubia.0166.desc:0 "J'ai reçu des nouvelles de mes subordonnés indiquant que nos efforts pour fortifier notre frontière le long de [GetGeographicalRegion('RICE_egypt_and_nubia_frontier').GetName] ne se sont pas bien déroulés. Bien que nous ayons fait de notre mieux pour maintenir nos défenses, soutenir nos messagers et patrouilles, et capturer ou tuer les bandits et pillards dans ces régions, nous avons connu de nombreux revers.\n\n"
 nubia.0166.desc.major:0 "Mes subordonnés ont techniquement atteint les objectifs généraux de ces efforts, mais il y a clairement une mauvaise gestion et des problèmes logistiques causant des incidents majeurs. De manière alarmante, les habitants et les marchands itinérants se sont montrés plutôt hostiles à nos entreprises, et certains pourraient même avoir collaboré avec des bandits et des pillards locaux - les gens qui les exploiteraient et les pilleraient - pour saboter nos efforts visant à les contrôler."
 nubia.0166.desc.minor:0 "Mes subordonnés ont pu atteindre les objectifs généraux de ces efforts, mais il existe des preuves de mauvaise gestion et de problèmes logistiques, et, plus important encore, les habitants et les marchands itinérants ont eu des sentiments mitigés concernant nos entreprises. Il y a même des rumeurs selon lesquelles certains auraient tenté de saboter indirectement nos efforts pour les contrôler."
 nubia.0166.a:0 "Au moins nos défenses ont été améliorées."
 nubia.0167.t:0 "Ventes de terres frontalières"
 nubia.0167.desc:0 "La vente et l'achat de terres privées ont lieu en de nombreux endroits, pas seulement à la [GetGeographicalRegion('RICE_egypt_and_nubia_frontier').GetName], bien sûr. Cependant, en raison des circonstances politiques de la frontière, où la validité de ces transactions est souvent remise en question, les officiels, tels que moi-même, le [ROOT.Char.Custom('RICE_nubia_egypt_border_official_gloss_type_loc')], doivent souvent être impliqués dans ces affaires.\n\nUne vente de terrain importante est sur le point d'avoir lieu dans les territoires que je gère le long de la frontière, et le vendeur a demandé que moi-même et [witness.GetTitledFirstName], en tant que l'un de mes subordonnés, servions de témoins lors de la signature du document de vente.\n\n[witness.GetFirstNameNoTooltip], à qui l'on a demandé d'être témoin car [witness.GetSheHe] a des liens avec certaines des parties impliquées, a suggéré que nous consacrions des ressources supplémentaires pour nous assurer que tout se passe bien, au cas où il y aurait des litiges juridiques ou d'autres complications."
 nubia.0167.a:0 "Allons, allons, ce n'est qu'une procédure de routine."
 nubia.0167.b:0 "Je me fierai au jugement de [witness.GetFirstNamePossessiveNoTooltip], alors."
 nubia.0168.t:0 "Réussite: $nubia.0167.t$"
 nubia.0168.desc:0 "Comme demandé, [witness.GetTitledFirstName] et moi avons servi de témoins de plus haut rang lors de la vente de terre majeure qui vient d'avoir lieu dans les terres que j'administre dans [GetGeographicalRegion('RICE_egypt_and_nubia_frontier').GetName]. Selon la procédure bureaucratique habituelle, les documents que nous avons signés mentionnaient d'abord [top_liege.GetTitledFirstName] comme autorité suprême de la terre, suivie des autres officiels par ordre de préséance.\n\n"
 nubia.0168.desc.major:0 "La procédure s'est très bien déroulée, et les notables locaux impliqués dans cette transaction nous ont grandement remerciés pour notre temps et notre soutien. Ils ont organisé un modeste banquet en notre honneur et nous ont offert quelques jolis bibelots en guise de cadeaux."
 nubia.0168.desc.minor:0 "Dans l'ensemble, la procédure s'est déroulée sans encombre et sans complications, et les notables locaux impliqués dans cette transaction nous ont remerciés pour notre temps avec un modeste banquet et quelques babioles obligatoires en guise de cadeaux. À vrai dire, tout cela était un peu ennuyeux."
 nubia.0168.a:0 "Cela rejaillira positivement sur moi en tant que [ROOT.Char.Custom('RICE_nubia_egypt_border_official_type_loc')] !"
 nubia.0169.t:0 "Échec : $nubia.0167.t$"
 nubia.0169.desc:0 "$nubia.0168.desc$Malheureusement, les choses se sont tendues pendant la procédure, car les parties impliquées se sont disputées au sujet d'un détail juridique technique ou d'une querelle personnelle ou - eh bien, pour être honnête, je ne me souviens même plus des détails exacts, car même [witness.GetFirstNameNoTooltip] et moi avons commencé à nous disputer à propos de quelque chose, nous aussi.\n\n"
 nubia.0169.desc.major:0 "Les parties impliquées ont finalement accepté une forme largement modifiée de la transaction, mais tout cet épisode a laissé un goût amer dans la bouche de chacun. J'étais honnêtement soulagé[ROOT.Char.Custom('FR_E')] que [witness.GetFirstNameNoTooltip] et moi n'ayons même pas reçu le modeste banquet et les petits cadeaux que les gens offrent habituellement lorsque nous sommes impliqués dans ces affaires."
 nubia.0169.desc.minor:0 "Bien que les parties impliquées aient fini par s'accorder sur une forme modifiée de la transaction, et qu'elles aient formellement remercié [witness.GetFirstNameNoTooltip] et moi-même par un modeste banquet et quelques présents symboliques, comme il est d'usage, l'atmosphère était plutôt pesante."
 nubia.0169.a:0 "Je voulais juste partir de là au plus vite !"
 nubia.0170.t:0 "Surveillance des voyageurs"
 nubia.0170.desc:0 "En tant que [ROOT.Char.Custom('RICE_nubia_egypt_border_official_gloss_type_loc')], je surveille le trafic transfrontalier entre l'Égypte et la Nubie. Certains de ces voyageurs ont des affaires légitimes, comme les marchands ou les envoyés diplomatiques, tandis que d'autres le sont moins, comme les bandits et les esclaves en fuite.\n\nJ'estime que nous devons consacrer davantage de ressources à la surveillance de ce trafic transfrontalier, à l'application de nos règlements concernant les visiteurs et les voyageurs, et à l'expulsion de ceux qui semblent dangereux. Ce faisant, mes subordonnés peuvent également recueillir des renseignements utiles, directement et indirectement.\n\nNous pourrions aussi consacrer une partie de ces ressources pour aider mon homologue, le [counterpart.Custom('RICE_nubia_egypt_border_official_gloss_type_loc')], [counterpart.GetTitledFirstName], à attraper les fugitifs criminels de leur côté de la frontière, comme conséquence souhaitable d'un examen plus approfondi des voyageurs."
 nubia.0170.a:0 "Nous devrions nous concentrer sur nos propres affaires."
 nubia.0170.b:0 "Aidons [counterpart.GetFirstNameNoTooltip] également."
 nubia.0171.t:0 "Succès : Surveillance des voyageurs"
 nubia.0171.desc:0 "Nos efforts pour contrôler plus rigoureusement les voyageurs allant et venant de notre côté de [GetGeographicalRegion('RICE_egypt_and_nubia_frontier').GetName] ont porté leurs fruits. Mes officiers ont rapporté qu'ils ont capturé bien plus de criminels et de bandits qu'auparavant, et que ceux voyageant légitimement se sont montrés plus ou moins coopératifs.\n\nGrâce à nos efforts,"
 nubia.0171.desc.major:0 "nous avons recueilli de nombreux renseignements militaires et politiques utiles, qui nous aideront à gérer la frontière pendant longtemps. Nous avons également capturé de nombreux fugitifs criminels fuyant de l'autre côté de la frontière, que nous avons rapatriés vers les territoires de la [counterpart.Custom('RICE_nubia_egypt_border_official_gloss_type_loc')], [counterpart.GetTitledFirstName], dans le cadre du [RICE_baqt_treaty|El] - [counterpart.GetSheHe] sera sans aucun doute impressionné[counterpart.Custom('FR_E')] !"
 nubia.0171.desc.minor:0 "nous avons aussi appris des renseignements militaires et politiques utiles. Nous avons même capturé quelques fugitifs criminels fuyant de l'autre côté de la frontière, que nous avons rapatriés vers les territoires de la [counterpart.Custom('RICE_nubia_egypt_border_official_gloss_type_loc')], [counterpart.GetTitledFirstName], dans le cadre du [RICE_baqt_treaty|El] - je suis sûr qu'[counterpart.GetSheHe] sera satisfait[counterpart.Custom('FR_E')]."
 nubia.0171.a:0 "Bon travail, et assurez-vous d'en informer [counterpart.GetFirstNameNoTooltip]."
 nubia.0172.t:0 "Échec : Examiner les voyageurs"
 nubia.0172.desc:0 "Nos efforts pour surveiller plus étroitement les voyageurs venant et partant de notre côté de [GetGeographicalRegion('RICE_egypt_and_nubia_frontier').GetName] n'ont pas été aussi fructueux que nous l'espérions. Mes fonctionnaires disent que non seulement nous n'avons pas réussi à attraper davantage de criminels et de bandits, mais ceux qui voyagent légitimement - comme les marchands - se méfient de nos intentions, ou sont même peu coopératifs, et par conséquent le trafic frontalier a diminué"
 nubia.0172.desc.major:0 "grandement.\n\nNos tentatives pour recueillir des renseignements utiles dans le cadre de ces efforts ont été vaines, car nos agents ont été gravement induits en erreur par de faux rapports et informations. De plus, il semble que de nombreux fugitifs criminels des territoires de la [counterpart.Custom('RICE_nubia_egypt_border_official_gloss_type_loc')], [counterpart.GetTitledFirstName], se soient échappés sans être remarqués, ce qui n'est pas bon, car le #italic Baqt#! nous oblige à nous entraider pour capturer de tels fugitifs."
 nubia.0172.desc.minor:0 "légèrement.\n\nNos tentatives de recueillir des renseignements utiles dans le cadre de ces efforts ont été vaines, car nous n'avons obtenu que des rapports et des informations inutiles. De plus, il semble que quelques fugitifs criminels des territoires de la [counterpart.Custom('RICE_nubia_egypt_border_official_gloss_type_loc')], [counterpart.GetTitledFirstName], se soient glissés sans être remarqués - [counterpart.GetSheHe] ne sera pas content[counterpart.Custom('FR_E')], car le #italic Baqt#! nous oblige à nous entraider pour capturer de tels fugitifs."
 nubia.0172.a:0 "J'espère que [counterpart.GetFirstNameNoTooltip] sera compréhensi[counterpart.Custom('FR_FVe')]..."
 nubia.0173.opening:0 "Au [counterpart.Custom('RICE_nubia_egypt_border_official_type_loc')] :"
 nubia.0173.desc:0 "Je souhaite vous informer des récents succès que nous avons obtenus dans l'amélioration de la sécurité de notre côté de la [GetGeographicalRegion('RICE_egypt_and_nubia_frontier').GetName]. En conséquence, nous avons capturé des fugitifs criminels provenant de vos terres, que nous vous rapatrions, conformément aux termes du #italic Baqt#!."
 nubia.0173.a:0 "Mon homologue fait un excellent travail !"
 nubia.0174.opening:0 "$nubia.0173.opening$"
 nubia.0174.desc:0 "Nous avons récemment tenté d'améliorer la sécurité de notre côté de la [GetGeographicalRegion('RICE_egypt_and_nubia_frontier').GetName], mais avons rencontré des revers. Nous avons appris que des fugitifs criminels de vos terres se sont enfuis de notre côté, mais nous n'avons pas été en mesure de les capturer et de les rapatrier conformément aux termes du #italic Baqt#! - il est probablement trop tard. Je m'excuse sincèrement pour tout désagrément."
 nubia.0174.a:0 "Mon idiot homologue a échoué dans son travail !"
 nubia.0175.t:0 "Rapport à [liege.GetTitledFirstNameNoTooltip]"
 nubia.0175.desc:0 "En tant que [ROOT.Char.Custom('RICE_nubia_egypt_border_official_gloss_type_loc')] chargé de maintenir la frontière entre l'Égypte et la Nubie au sein de notre [primary_title.GetTierAsNameNoTooltip], je dois périodiquement envoyer des rapports à mon supérieur, [liege.GetTitledFirstName]. De cette façon, [liege.GetSheHe] est au courant des derniers événements dans ces terres.\n\nJe suis actuellement en train de travailler sur un tel rapport, mais je ne peux pas y consacrer trop de temps, car j'ai d'autres responsabilités à assumer. D'un autre côté, je devrais prendre le temps de soigner ce rapport afin de pouvoir me présenter, moi et mes subordonnés, sous un jour favorable auprès de [liege.GetFirstNameNoTooltip], sans paraître trop insistant ni donner l'impression que nous dissimulons nos erreurs."
 nubia.0175.a:0 "Rédiger un rapport normal ; pas besoin d'extravagance."
 nubia.0175.b:0 "Prendre le temps de rédiger un rapport excellent et détaillé."
 nubia.0176.t:0 "Rapport du [reporter.Custom('RICE_nubia_egypt_border_official_type_loc')]"
 nubia.0176.desc.intro:0 "Un messager est arrivé de la part de [reporter.GetTitledFirstName], avec un rapport concernant les conditions actuelles sur la [GetGeographicalRegion('RICE_egypt_and_nubia_frontier').GetName]. En tant que [reporter.Custom('RICE_nubia_egypt_border_official_gloss_type_loc')], c'est son devoir de maintenir la frontière au sein de notre [primary_title.GetTierAsNameNoTooltip], et le rapport inclut également des informations sur ses récentes activités en cette qualité.\n\nJe prends le temps de lire attentivement le rapport. Apparemment,"
 nubia.0176.desc:0 "$nubia.0176.desc.intro$ tout se passe bien, ou aussi bien que possible, et le rapport de [reporter.GetFirstNamePossessiveNoTooltip] fournit tous les détails que j'ai besoin de connaître dans un ton respectueux et approprié.\n\n[reporter.GetFirstNameNoTooltip] est clairement au courant de la situation actuelle, tant le bon que le mauvais, et fait de son mieux pour accomplir son travail."
 nubia.0176.a:0 "Envoyer un message confirmant que j'ai bien reçu le rapport."
 nubia.0176.a.toast:0 "Succès mineur : le suzerain apprécie le rapport"
 nubia.0176.b:0 "[reporter.GetFirstNameNoTooltip] devrait être récompensé[reporter.Custom('FR_E')] pour ses services !"
 nubia.0176.b.toast:0 "Succès majeur : le suzerain apprécie grandement le rapport"
 nubia.0177.t:0 "$nubia.0176.t$"
 nubia.0177.desc:0 "$nubia.0176.desc.intro$ tout va bien, mais je peux deviner d'après le ton de la lettre, ainsi que ce que mes autres officiels et espions m'ont rapporté, que ce n'est pas le cas.\n\nJe soupçonne [reporter.GetFirstNameNoTooltip] de mal comprendre la situation actuelle à la frontière au mieux, ou de cacher délibérément ses erreurs au pire, ou d'essayer de me flatter pour une raison quelconque."
 nubia.0177.a:0 "Lui rappeler gentiment de remplir ses fonctions correctement."
 nubia.0177.a.toast:0 "Échec mineur : le suzerain désapprouve le rapport"
 nubia.0177.b:0 "[reporter.GetHerHim|U] réprimander pour ses erreurs."
 nubia.0177.b.toast:0 "Échec majeur : le suzerain désapprouve fortement le rapport"
 nubia.0178.t:0 "La vie de gratte-papier"
 nubia.0178.desc:0 "Les documents ne cessent jamais d'affluer en tant que [ROOT.Char.Custom('RICE_nubia_egypt_border_official_gloss_type_loc')] ! La frontière entre L'[GetGeographicalRegion('ghw_region_egypt').GetName] et la [GetGeographicalRegion('RICE_greater_nubia_region').GetName] est soigneusement surveillée des deux côtés, et moi et mon personnel devons traiter des documents dans toutes sortes de langues, des plaintes aux litiges juridiques, des requêtes aux formules excessivement polies, et des rapports de mes subordonnés. Hélas, #italic quelqu'un#! doit bien s'occuper de la paperasse.\n\nAvec un soupir, je continue à lire le document à mon bureau :\n\n#italic" # Sometimes a merchant complains about ill-treatment by an official; other times there’s disputes in land sales; maybe a noble is ranting at us to find their escaped slave; or perhaps a low-ranking envoy thinks too highly of themselves. It’s not all bad; some of the paperwork is just mundane routine, like accepting reports from my underlings posted elsewhere. But it is monotonous.
 nubia.0178.a:0 "Et maintenant, qu'est-ce que je vais faire à ce sujet...."
 nubia.0178.info:0 "#emphasis Contexte historique :#! Le texte d'ambiance de la lettre dans cet événement a été sélectionné aléatoirement parmi une grande liste d'extraits de documents réels de la Nubie ou de l'Égypte médiévales. Ils reflètent une variété de personnes avec lesquelles les officiels nubiens ou égyptiens auraient interagi, et diverses situations dans lesquelles ils auraient pu se retrouver impliqués, qu'ils l'aient voulu ou non."
 nubia.0179.t:0 "xxxxx"
 nubia.0179.desc:0 "xxxxx"
 nubia.0179.a:0 "xxxxx"
 nubia.0180.t:0 "Vers Banganarti"
 nubia.0180.desc:0 "Un peu au sud de [GetTitleByKey('b_old_dongola').GetNameNoTier], se trouve un village sur la rive est du Nil appelé Banganarti. C'est une humble colonie sans prétention, à l'exception d'une chose : elle abrite une grande église, un centre de culte [GetReligionByKey('christianity_religion').GetAdherentName] en [GetGeographicalRegion('RICE_greater_nubia_region').GetName] dédiée à [Glossary( 'Saint Raphaël', 'ARCHANGEL_RAPHAEL_GLOSS' )].\n\nDepuis des générations, des gens de près et de loin ont voyagé ici pour chercher la guérison et les miracles attribués à ce grand archange. Certains y sont même restés des semaines et des mois dans l'espoir de recevoir un rêve spirituel de sa part.\n\nBien que je puisse ou non recevoir un tel rêve moi-même, je recherche toujours les bénédictions de Raphaël, et commencerai donc bientôt mon pèlerinage vers Banganarti."
 nubia.0180.a:0 "À l'église de Banganarti !"
 nubia.0181.t:0 "Arrivée"
 nubia.0181.desc:0 "Nous sommes accueillis par les sons du bruissement de la brise du désert, et la vue du puissant Nil en contrebas, alors que nous atteignons le sommet de la colline et apercevons enfin Banganarti au loin.\n\nEnfin, nous sommes arrivés à notre destination ! C'est un spectacle bienvenu.\n\nIl est temps pour nous de trouver un logement dans l'un des [Glossary( 'xenodocheia', 'XENODOCHIUM_GLOSS' )] près de l'église et de nous reposer avant de consacrer du temps à la prière, la réflexion et la guérison dans l'église elle-même."
 nubia.0181.a:0 "Louange à [Glossary( 'Saint Raphaël', 'ARCHANGEL_RAPHAEL_GLOSS' )] !"
 nubia.0182.t:0 "Entrer dans l'Église"
 nubia.0182.desc:0 "Après avoir passé quelque temps au [Glossary( 'xenodocheia', 'XENODOCHIUM_GLOSS' )] à nous reposer, mon entourage et moi sommes revigorés, et prêts à entrer dans l'église de Banganarti pour rendre nos hommages à [Glossary( 'Saint Raphaël', 'ARCHANGEL_RAPHAEL_GLOSS' )] et adorer [faith.HighGodName].\n\nBien que je sache que l'église de Banganarti n'est pas nécessairement la plus grande ou la plus somptueuse église même en [GetGeographicalRegion('RICE_greater_nubia_region').GetName], elle n'est en aucun cas pitoyable, et je peux sentir sa longue histoire et les nombreux pèlerins qui m'ont précédé ici. Je le dis au sens littéral, bien sûr : en approchant et en entrant dans le bâtiment principal de l'église, nous voyons les centaines et centaines, voire milliers d'inscriptions que les pèlerins précédents ont laissées sur les murs de l'église, la plupart écrites en [greek.GetLanguage.GetName] ou en [nubian.GetLanguage.GetName].\n\nCertains pèlerins gravent même de tels graffitis sacrés sur les murs de l'église alors que je passe, montrant leur piété au monde entier pour la postérité. Peut-être laisserai-je ma propre inscription plus tard"
 nubia.0182.a:0 "Pour l'instant, nous entrons dans l'église."
 nubia.0183.t:0 "Prières"
 nubia.0183.desc:0 "Comme la plupart de ceux qui viennent ici, j'ai passé beaucoup de temps à prier et à adorer [Glossary( 'Saint Raphaël', 'ARCHANGEL_RAPHAEL_GLOSS' )] dans l'église de Banganarti, espérant qu'il me guérisse de mes maux physiques et spirituels, qu'il me guide pour accomplir de grandes et vertueuses choses en tant que [ROOT.Char.GetTitleAsNameNoTooltip]. Peut-être mes prières seront-elles entendues.\n\nEt si l'on veut que ses prières soient entendues à Banganarti, il y a des pèlerins qui restent ici des semaines, dans les [Glossary( 'xenodocheia', 'XENODOCHIUM_GLOSS' )] voisins, espérant recevoir un rêve de l'Archange."
 nubia.0183.desc.dreaming:0 "Heureusement, malgré mes devoirs, j'ai réservé du temps pour séjourner à Banganarti, dans l'espoir de faire un tel rêve. Pendant les prochaines semaines, je me rendrai dans cette église pour prier le jour, et dormir la nuit en espérant une visite de Saint Raphaël."
 nubia.0183.desc.no_dreaming:0 "Malheureusement, mes devoirs m'empêchent d'avoir suffisamment de temps pour rester à Banganarti dans l'espoir de faire un tel rêve. Quel fardeau ! Mais c'est ainsi, et j'espère que [ROOT.Char.GetFaith.HighGodNameAlternate] est satisfait que j'aie pu venir ici au moins."
 nubia.0183.a:0 "Il est temps de retourner dehors."
 nubia.0184.t:0 "Conclusion"
 nubia.0184.desc:0 "Mon pèlerinage à Banganarti touche à sa fin. Je contemple le Nil, debout devant l'église de Banganarti - que ce soit pour la dernière fois ou non, je l'ignore.\n\nJe ressens une immense gravité et une solennité profonde en sachant que je ne suis ni le premier ni le dernier pèlerin à venir ici ; ce site n'est peut-être pas aussi ancien que les lieux saints de [GetTitleByKey('b_jerusalem').GetNameNoTier] ou [GetTitleByKey('b_alexandria').GetNameNoTier], mais il est tout de même très ancien, et l'un des plus vénérés de [GetGeographicalRegion('RICE_greater_nubia_region').GetName]. Que nous, pèlerins, soyons bénis par un rêve de [Glossary( 'Saint Raphaël', 'ARCHANGEL_RAPHAEL_GLOSS' )] ou non, il ne fait guère de doute que beaucoup sont transformés, voire guéris, après avoir passé du temps ici.\n\nJe jette un dernier regard vers l'église, puis me dirige vers le [Glossary( 'xenodocheia', 'XENODOCHIUM_GLOSS' )] pour récupérer mes affaires."
 nubia.0184.a:0 "Il est temps de rentrer à la maison."
 nubia.0185.t:0 "Gîte"
 nubia.0185.desc:0 "Tout le monde n'a pas la chance de séjourner au [Glossary( 'xenodocheia', 'XENODOCHIUM_GLOSS' )] de Banganarti pendant des semaines et des semaines, avec l'espoir de recevoir un rêve de [Glossary( 'Saint Raphaël', 'ARCHANGEL_RAPHAEL_GLOSS' )]. De plus, ce n'est pas parce que l'on réside en ce lieu saint pendant longtemps que l'on sera réellement visité par l'Archange en rêve.\n\nCependant, j'espère sincèrement être une de ces âmes chanceuses, car je prévois de dormir à Banganarti pendant plusieurs semaines. Maintenant que les arrangements ont été faits, je n'aurai plus qu'à attendre et voir si je recevrai ces rêves miraculeux."
 nubia.0185.a:0 "Je suis sûr que je m'habituerai au lit ici en un rien de temps."
 nubia.0185.a.short_stay:0 "Vous restez à Banganarti pendant #V 1#! mois, après quoi l'[activity|El] se conclura, quel que soit le résultat."
 nubia.0185.a.long_stay:0 "Vous restez à Banganarti pendant #V 3#! mois, après quoi l'[activity|El] prendra fin, quel que soit le résultat."
 nubia.0186.t:0 "Dormir, rêver peut-être"
 nubia.0186.desc:0 "Après avoir passé tant de temps à Banganarti, me reposant au [Glossary( 'xenodocheia', 'XENODOCHIUM_GLOSS' )] nuit après nuit, espérant qu'un rêve de [Glossary( 'Saint Raphaël', 'ARCHANGEL_RAPHAEL_GLOSS' )] me parvienne, il est bientôt temps que ce pèlerinage prenne fin, car"
 nubia.0186.desc.no_success:0 "je suis resté ici trop longtemps sans recevoir le moindre rêve, de quelque nature que ce soit, qui puisse être relié à Saint Raphaël, même de la manière la plus ténue.\n\nIl est clair que je ne suis pas destiné à avoir un rêve de Saint Raphaël, du moins pas maintenant, et pas ici, à Banganarti. Il est décevant d'avoir passé tant de temps ici en vain, mais peut-être cela devait-il être ainsi."
 nubia.0186.desc.success:0 "j'ai reçu un tel rêve !\n\nJe me souviens que le rêve mettait en scène #Bold [ROOT.Char.Custom('RICE_tuareg_dream_subject')]#!, et que je #Bold [ROOT.Char.Custom('RICE_tuareg_dream_action')]#!. L'Archange Raphaël était également présent dans le rêve, bien sûr, observant les événements et me parlant. Quand j'ai interrogé les [ROOT.Char.Custom('DefaultPriestTitlePlural')] de Banganarti à ce sujet, ils ont suggéré que le rêve était [ROOT.Char.Custom('RICE_nubia_dream_type')]"
 nubia.0186.a:0 "Ainsi soit-il." # Time to start packing up, and prepare to go home. Fortunate, how most fortunate!
