 RICE_the_tribe_of_dan_legend_name:"La Tribu de Dan"
 RICE_the_tribe_of_dan_legend_desc:"Les descendants de la Tribu de Dan, l'une des Dix Tribus Perdues d'Israël, auraient survécu au fil des siècles quelque part au cœur de l'Afrique. [danite.GetTitledFirstName] est la preuve de leur existence continue."
 RICE_the_tribe_of_dan_legend_chapter_opening_new_title:"« Et l'Éternel les déracina de leur terre avec colère, avec fureur et avec une grande indignation. » Il y a très, très longtemps, lorsque le Royaume d'Israël fut détruit, dix des douze tribus d'Israël furent exilées de force, pour ne jamais revenir, supposément. L'une de ces Tribus Perdues était la Tribu de Dan, dont la localisation était inconnue du reste des [ROOT.Legend.GetProperty( 'religion' ).Religion.GetAdjectiveNoTooltip] du monde jusqu'à la venue de [ROOT.Legend.GetProtagonist.GetTitledFirstNameNoTooltip]."
 RICE_the_tribe_of_dan_legend_chapter_motivation_new_title:"[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip], qui prétendait être des Danites, avait un grand amour pour l'aventure et cherchait à voir davantage du monde. Pourtant, ses ambitions ne se limitaient pas à une simple soif de voyage. Au cours de ses voyages, [ROOT.Legend.GetProtagonist.GetSheHe] fut témoin des immenses souffrances des communautés [ROOT.Legend.GetProperty( 'religion' ).Religion.GetAdjectiveNoTooltip] à travers le monde. Elles avaient besoin d'espoir, elles avaient besoin d'inspiration."
 RICE_the_tribe_of_dan_legend_chapter_famous_deed_new_title:"La Tribu Perdue de Dan avait fui dans les profondeurs de Koush dans les temps anciens, et c'est de là que [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] émergea. Car comme le dit l'Écriture : « Ceux qui espèrent en le Seigneur renouvelleront leur force. Ils s'élèveront avec des ailes comme les aigles. Ils courront et ne se fatigueront point, ils marcheront et ne se lasseront point. » Et ainsi, [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] s'éleva comme un aigle, et courut et marcha à travers de nombreuses terres, pour inspirer, informer et régaler les Juifs à travers le monde avec des récits de ses aventures, et du sort de leurs frères Danites."
 RICE_the_tribe_of_dan_legend_chapter_extra_deed_new_title:"Il y avait ceux qui doutaient de la véracité de ses récits, car même [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] admettait qu'ils semblaient parfois tirés par les cheveux. Mais [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] persévéra, car grande était sa foi en Dieu, car [ROOT.Legend.GetProtagonist.GetSheHe] se souvenait bien de ce que le Livre des Proverbes disait : « Confie-toi au Seigneur dans tout ce que tu fais, et tes plans réussiront. »"
 RICE_the_tribe_of_dan_legend_chapter_conclusion_new_title:"Par son éloquence et sa force de volonté, et par sa foi dans le Seigneur et dans la sagesse et la détermination des communautés [ROOT.Legend.GetProperty( 'religion' ).Religion.GetAdjectiveNoTooltip] à travers le monde, qui accueillirent [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] et écoutèrent attentivement ce qu'[ROOT.Legend.GetProtagonist.GetSheHe] avait à dire, [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] réussit dans sa quête de mettre en lumière la survie de la Tribu Perdue de Dan, et de révéler également un nouvel espoir pour le peuple [ROOT.Legend.GetProperty( 'religion' ).Religion.GetAdjectiveNoTooltip]. Malgré toutes leurs souffrances, il y a encore de l'espoir pour un avenir meilleur, car le Seigneur est toujours avec eux."

 # Nile Empire legends base text for copypasta
 RICE_nile_legend_chapter_opening_new_title:"Le Nil est éternel, ses eaux montant et descendant selon un rythme ininterrompu depuis des siècles. De même, les royaumes et les dynasties s'élèvent et s'effondrent selon un rythme similaire le long des terres du Nil. Il faut cependant un héros du destin, né d'une grande lignée, pour unir les terres du Nil en un seul et puissant empire uni. [ROOT.Legend.GetProtagonist.GetTitledFirstNameNoTooltip] était un tel héros."
 RICE_nile_legend_chapter_motivation_new_title:"De nombreux rois et reines avaient tenté de conquérir l'ensemble de la vallée du Nil au fil des siècles, mais la plupart échouèrent. Unir des peuples de cultures, de religions et de modes de vie différents n'était pas une tâche simple. Là où d'autres échouèrent, cependant, [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] réussit, car [ROOT.Legend.GetProtagonist.GetSheHe] fut inspiré[ROOT.Legend.GetProtagonist.Custom('FR_E')] par"
 RICE_nile_legend_chapter_extra_deed_new_title:"[ROOT.Legend.GetProtagonist.GetSheHe|U] patronna les plus grands artisans et érudits du pays, faisant naître un nouvel âge de savoir et de raffinement comme on n'en avait pas vu depuis des lustres. [ROOT.Legend.GetProtagonist.GetSheHe] réforma les lois et veilla à ce que tous, du plus haut des hauts au plus bas des bas, soient traités équitablement, et [ROOT.Legend.GetProtagonist.GetSheHe] gagna l'admiration de beaucoup pour son mode de vie vertueux."
 RICE_nile_legend_chapter_conclusion_new_title:"Peut-être qu'un jour, l'empire que [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] a fondé s'effacera lui aussi dans la poussière de l'histoire. Les royaumes et les dynasties s'élèvent et s'effondrent tout comme les eaux du Nil montent et descendent sans faillir, bien sûr. Mais si et quand cela arrive, [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] sera sans aucun doute remémoré[ROOT.Legend.GetProtagonist.Custom('FR_E')] comme l'un[ROOT.Legend.GetProtagonist.Custom('FR_E')] des grands dirigeants de la région, quelqu'un qui a véritablement incarné la grandeur de"


 # Nile Empire Decision legends
 RICE_nile_abbasids_legend_name:"Le Sang des Abbassides"
 RICE_nile_abbasids_legend_desc:"En gloire et en puissance, tant spirituelle que temporelle, nul ne pouvait égaler les Abbassides à l'apogée de leur pouvoir, lorsqu'ils régnaient depuis la gloire cosmopolite de Bagdad. On raconte que des branches lointaines de leur famille se sont répandues au loin, jusque dans les profondeurs de l'Afrique, et que parmi leurs descendants se trouve [descendant.GetTitledFirstName]."
 RICE_nile_abbasids_legend_chapter_opening_new_title: "$RICE_nile_legend_chapter_opening_new_title$" 
 RICE_nile_abbasids_legend_chapter_motivation_new_title:"$RICE_nile_legend_chapter_motivation_new_title$ la prospérité et les accomplissements culturels de ses ancêtres abbassides. Le Nil serait le foyer non seulement d'un puissant empire, mais aussi d'un empire hautement développé et érudit."
 RICE_nile_abbasids_legend_chapter_famous_deed_new_title:"Il y a longtemps, les Abbassides bâtirent leur capitale, Bagdad, le long du Tigre et de l'Euphrate, où elle devint le joyau du monde. [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip], alors, en tant que lointain[ROOT.Legend.GetProtagonist.Custom('FR_E')] rejeton de la dynastie abbasside, rassembla des [ROOT.Legend.GetProperty( 'faith' ).Faith.GetAdjectiveNoTooltip] [ROOT.Legend.GetProperty( 'culture' ).Culture.GetCollectiveNounNoTooltip] venus de partout pour créer un nouveau joyau du monde, celui-ci le long d'un autre fleuve, le Nil. Tout comme le Tigre et l'Euphrate nourrirent les Abbassides d'antan, [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] savait que le Nil nourrirait de même les Abbassides des temps nouveaux."
 RICE_nile_abbasids_legend_chapter_extra_deed_new_title:"En émulant ses ancêtres, [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] apporta une ère de prospérité inégalée aux terres du Nil. $RICE_nile_legend_chapter_extra_deed_new_title$"
 RICE_nile_abbasids_legend_chapter_conclusion_new_title:"$RICE_nile_legend_chapter_conclusion_new_title$ ses ancêtres, les magnifiques Abbassides."
 RICE_nile_alexander_legend_name:"Sang d'Alexandre le Pharaon"
 RICE_nile_alexander_legend_desc:"Alexandre le Grand fut un conquérant si légendaire que les grands rois guerriers, de Rome à l'Inde, ont murmuré son nom avec admiration au fil des siècles. Le long du Nil, encore aujourd'hui, on raconte les histoires de ce grand roi, considéré comme un grand Pharaon. Son esprit aventureux perdure chez son descendant tout aussi illustre, [descendant.GetTitledFirstName]."
 RICE_nile_alexander_legend_chapter_opening_new_title: "$RICE_nile_legend_chapter_opening_new_title$" 
 RICE_nile_alexander_legend_chapter_motivation_new_title:"$RICE_nile_legend_chapter_motivation_new_title$ Alexandre le Grand, car comment pourrait-[ROOT.Legend.GetProtagonist.GetSheHe] en être autrement ? Après tout, monarques, généraux et seigneurs de guerre à travers le monde cherchent encore à l'imiter, et désirent devenir le prochain Alexandre. [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] ne faisait pas exception."
 RICE_nile_alexander_legend_chapter_famous_deed_new_title:"Des lignées royales à travers le monde revendiquent une descendance de cet illustre roi macédonien antique, mais aucune n'a eu la capacité d'atteindre ne serait-ce qu'une once de la gloire d'Alexandre - jusqu'à ce que [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] arrive. Contrairement aux autres, cependant, [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] se distinguait sur deux points. Premièrement, [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] descendait véritablement d'Alexandre. Deuxièmement, et plus important encore, [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] possédait la compétence, l'ambition et le génie véritables requis d'un[ROOT.Legend.GetProtagonist.Custom('FR_E')] grand[ROOT.Legend.GetProtagonist.Custom('FR_E')] conquérant[ROOT.Legend.GetProtagonist.Custom('FR_E')]. On ne conquiert pas un grand empire par le droit de naissance, mais par l'#italic effort#!."
 RICE_nile_alexander_legend_chapter_extra_deed_new_title:"[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] #italic devint#! le prochain Alexandre, mais d'une certaine manière, [ROOT.Legend.GetProtagonist.GetSheHe] surpassa même Alexandre. Car Alexandre mourut jeune, avant de pouvoir administrer l'empire qu'il avait conquis ; [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip], en revanche, vécut assez longtemps pour le faire croître, encore et encore, vers de plus grandes hauteurs. $RICE_nile_legend_chapter_extra_deed_new_title$"
 RICE_nile_alexander_legend_chapter_conclusion_new_title:"$RICE_nile_legend_chapter_conclusion_new_title$ son ancêtre : le conquérant des conquérants, Alexandre le Grand."
 RICE_nile_candace_legend_name:"Sang de Candace, Reine de Méroé"
 RICE_nile_candace_legend_desc:"Bien que perdue dans les brumes de la légende, ceux qui connaissent la légendaire [Glossary( 'Candace', 'KANDAKE_GLOSS' )] de Méroé, qui combattit vaillamment Alexandre le Grand et l'empêcha d'envahir avec succès les terres au sud de l'Égypte. Ses lointains descendants, comme [descendant.GetTitledFirstName], honorent son juste héritage."
 RICE_nile_candace_legend_chapter_opening_new_title: "$RICE_nile_legend_chapter_opening_new_title$" 
 RICE_nile_candace_legend_chapter_motivation_new_title:"$RICE_nile_legend_chapter_motivation_new_title$ Candace, et ses accomplissements. Après tout, peu pouvaient prétendre être l'égal militaire d'Alexandre, on ne peut donc qu'imaginer à quel point cette reine était remarquable. Une souveraine si magnifique serait le modèle dont [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] s'est inspiré[ROOT.Legend.GetProtagonist.Custom('FR_E')] et qu'[ROOT.Legend.GetProtagonist.GetSheHe] a cherché à imiter."
 RICE_nile_candace_legend_chapter_famous_deed_new_title:"Les peuples hautains des terres lointaines oublient parfois, ou même dénigrent, la grande histoire des peuples au sud de l'Égypte. Pourtant, Candace était une reine dont on se souvenait même dans les écritures abrahamiques, grâce à ce qu'elle accomplit. De même, [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] s'assura par ses accomplissements dans l'unification du Nil que son nom ne tomberait pas dans l'oubli."
 RICE_nile_candace_legend_chapter_extra_deed_new_title:"Comme Candace, [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] a démontré sa valeur en tant que souverain[ROOT.Legend.GetProtagonist.Custom('FR_E')], devenant [ROOT.Legend.GetProtagonist.GetHerHim] plus grand[ROOT.Legend.GetProtagonist.Custom('FR_E')] des monarques [ROOT.Legend.GetProperty( 'culture' ).Culture.GetNameNoTooltip] et un[ROOT.Legend.GetProtagonist.Custom('FR_E')] ardent[ROOT.Legend.GetProtagonist.Custom('FR_E')] protect[ROOT.Legend.GetProtagonist.Custom('FR_EurRice')] de la foi [ROOT.Legend.GetProperty( 'faith' ).Faith.GetNameNoTooltip]. $RICE_nile_legend_chapter_extra_deed_new_title$"
 RICE_nile_candace_legend_chapter_conclusion_new_title:"$RICE_nile_legend_chapter_conclusion_new_title$ son ancêtre, la distinguée reine de Méroé, Candace."
 RICE_nile_cleopatra_scholar_legend_name:"Sang de Cléopâtre la Savante"
 RICE_nile_cleopatra_scholar_legend_desc:"Les Romains et leurs descendants ont calomnié la reine Cléopâtre, la dépeignant comme une tyranesse luxurieuse, mais ici au Moyen-Orient, d'autres histoires sont racontées : celles d'une femme qui n'était pas seulement une reine sage et juste, mais aussi une brillante érudite et philosophe. Ses descendants, comme [descendant.GetTitledFirstName], se souviennent bien de ces histoires."
 RICE_nile_cleopatra_scholar_legend_chapter_opening_new_title: "$RICE_nile_legend_chapter_opening_new_title$" 
 RICE_nile_cleopatra_scholar_legend_chapter_motivation_new_title:"$RICE_nile_legend_chapter_motivation_new_title$ la gloire de Cléopâtre, dont le sang coulait dans ses veines : le retour de sa dynastie signifiait un nouveau jour et une nouvelle ère pour les terres du Nil, un nouvel espoir pour une société plus prospère et plus juste."
 RICE_nile_cleopatra_scholar_legend_chapter_famous_deed_new_title:"Les Romains ont dénigré la grande reine Cléopâtre en la traitant de courtisane, mais [ROOT.Legend.GetProtagonist.GetFirstNameNicknamedNoTooltip] et les [ROOT.Legend.GetProperty( 'culture' ).Culture.GetCollectiveNounNoTooltip] savaient mieux que cela. Ils savaient que le véritable héritage de Cléopâtre résidait dans son mécénat des arts, sa maîtrise des sciences et de la philosophie qui faisait d'elle l'égale des plus grands érudits de son temps, et sa sagesse et son ingéniosité sans pareilles qui faisaient l'envie des Romains : c'étaient #italic ces#! histoires de Cléopâtre, longtemps perdues dans les terres occidentales mais encore préservées ailleurs, que [ROOT.Legend.GetProtagonist.GetFirstNameNicknamedNoTooltip] cherchait à émuler dans son règne."
 RICE_nile_cleopatra_scholar_legend_chapter_extra_deed_new_title:"Par ses efforts pour d'abord unifier les fidèles [ROOT.Legend.GetProperty( 'faith' ).Faith.GetNameNoTooltip] et les clans [ROOT.Legend.GetProperty( 'culture' ).Culture.GetNameNoTooltip], puis pour unifier le reste de la vallée du Nil, [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] s'est efforcé d'incarner les idéaux de Cléopâtre. $RICE_nile_legend_chapter_extra_deed_new_title$"
 RICE_nile_cleopatra_scholar_legend_chapter_conclusion_new_title:"$RICE_nile_legend_chapter_conclusion_new_title$ son ancêtre, la reine-érudite Cléopâtre."
 RICE_nile_cleopatra_seducer_legend_name:"Sang de Cléopâtre la Séductrice"
 RICE_nile_cleopatra_seducer_legend_desc:"Pendant des siècles, on a réduit la reine Cléopâtre à une simple tyranne luxurieuse. Pourtant, il faut une intelligence extraordinaire pour qu'une femme comme elle survive et devienne une légende, et ses lointains descendants, comme [descendant.GetTitledFirstName], célèbrent sa ruse et son ingéniosité."
 RICE_nile_cleopatra_seducer_legend_chapter_opening_new_title: "$RICE_nile_legend_chapter_opening_new_title$" 
 RICE_nile_cleopatra_seducer_legend_chapter_motivation_new_title:"$RICE_nile_legend_chapter_motivation_new_title$ la gloire de Cléopâtre, dont le sang coulait dans ses veines. Comme elle, [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] comprenait que l'ambition, la force et l'amitié étaient bonnes et belles, mais que la victoire et le succès ultimes ne pouvaient être atteints que par un esprit rusé."
 RICE_nile_cleopatra_seducer_legend_chapter_famous_deed_new_title:"Les Romains dépeignaient la grande reine Cléopâtre comme une courtisane, mais [ROOT.Legend.GetProtagonist.GetFirstNameNicknamedNoTooltip] et les [ROOT.Legend.GetProperty( 'culture' ).Culture.GetCollectiveNounNoTooltip] savaient qu'il n'en était rien. Ce que les Romains considéraient comme péché et vice, [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] et ses fidèles [ROOT.Legend.GetProperty( 'faith' ).Faith.GetAdjectiveNoTooltip] et [ROOT.Legend.GetProperty( 'culture' ).Culture.GetNameNoTooltip] y voyaient une forme diligente de sagacité, une vision clairvoyante sur la manière de vaincre ses ennemis quelle que soit leur force, et un amour profond pour son peuple qui dépassait tout simple désir terrestre, le genre d'amour qu'une mère porte à ses enfants, l'amour du sacrifice pour le bien commun."
 RICE_nile_cleopatra_seducer_legend_chapter_extra_deed_new_title:"Et en effet, par le sacrifice et la ruse, tout comme son ancêtre Cléopâtre, [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] grava son nom dans les annales de l'histoire. Mais contrairement à Cléopâtre, [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] ne fut pas une figure tragique, mais une figure triomphante. Contrairement à elle, [ROOT.Legend.GetProtagonist.GetSheHe] vécut assez longtemps pour voir son empire atteindre des sommets toujours plus grands. $RICE_nile_legend_chapter_extra_deed_new_title$"
 RICE_nile_cleopatra_seducer_legend_chapter_conclusion_new_title:"$RICE_nile_legend_chapter_conclusion_new_title$ son ancêtre, la reine à la beauté et à l'esprit sans pareils, Cléopâtre."
 RICE_nile_hermes_legend_name:"Sang d'Hermès Trismégiste"
 RICE_nile_hermes_legend_desc:"De nombreux peuples d'ethnies et de croyances différentes ont vénéré le grand [Glossary( 'Hermes Trismegistus', 'HERMES_TRISMEGISTUS_GLOSS' )] pour ses contributions à la connaissance et à la sagesse humaines. Des murmures racontent que parmi sa descendance se trouve la lignée de [descendant.GetTitledFirstName]."
 RICE_nile_hermes_legend_chapter_opening_new_title: "$RICE_nile_legend_chapter_opening_new_title$" 
 RICE_nile_hermes_legend_chapter_motivation_new_title:"$RICE_nile_legend_chapter_motivation_new_title$ Hermès Trismégiste, dont l'héritage savant continue d'influencer les penseurs jusqu'à ce jour. Il y a bien assez de petits seigneurs de guerre et de monarques bouffis d'orgueil qui revendiquent la gloire ultime grâce à leurs conquêtes et leurs possessions matérielles. Mais la vraie gloire vient de la connaissance et de la sagesse, et [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] est devenu un[ROOT.Legend.GetProtagonist.Custom('FR_E')] conquérant[ROOT.Legend.GetProtagonist.Custom('FR_E')] du Nil grâce à ces qualités, et non simplement grâce à sa bravoure et sa puissance. [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] a profondément compris le savoir arcane de son ancêtre."
 RICE_nile_hermes_legend_chapter_famous_deed_new_title:"Les mystères de l'univers ne sont pas faits pour les esprits faibles ou les volontés chancelantes, et [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] dut travailler dur non seulement pour maîtriser ces mystères, mais aussi pour les utiliser afin d'unifier le Nil sous le règne de son peuple [ROOT.Legend.GetProperty( 'culture' ).Culture.GetName] et de la foi [ROOT.Legend.GetProperty( 'faith' ).Faith.GetAdjectiveNoTooltip]. Et au final, ces efforts furent vaillamment récompensés, car [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] devint connu de près et de loin comme un[ROOT.Legend.GetProtagonist.Custom('FR_E')] souverain[ROOT.Legend.GetProtagonist.Custom('FR_E')] sage, tel le second avènement d'Hermès Trismégiste."
 RICE_nile_hermes_legend_chapter_extra_deed_new_title:"En vérité, les exploits de [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] sont trop nombreux pour être tous énumérés ici, et pourtant ses exploits de conquête - des exploits dont seuls les hommes et les femmes de moindre envergure se soucieraient - pâlissent en comparaison de ses exploits en tant que sage-souverain[ROOT.Legend.GetProtagonist.Custom('FR_E')]. $RICE_nile_legend_chapter_extra_deed_new_title$"
 RICE_nile_hermes_legend_chapter_conclusion_new_title:"$RICE_nile_legend_chapter_conclusion_new_title$ son ancêtre, le sage des sages, le philosophe des philosophes, Hermès Trismégiste."
 RICE_nile_sesostris_legend_name:"Sang de Sésostris, le Pharaon Conquérant"
 RICE_nile_sesostris_legend_desc:"L'ancien historien Hérodote a écrit au sujet d'un [Glossary( 'pharaon', 'PHARAOH_GLOSS' )] nommé Sésostris, qui conquit une grande partie de la Méditerranée orientale. [descendant.GetTitledFirstName], s[descendant.Custom('FR_OnA')] descendant[descendant.Custom('FR_E')], a perpétué cette tradition en tant que puissant monarque de plein droit."
 RICE_nile_sesostris_legend_chapter_opening_new_title: "$RICE_nile_legend_chapter_opening_new_title$" 
 RICE_nile_sesostris_legend_chapter_motivation_new_title:"$RICE_nile_legend_chapter_motivation_new_title$ l'ancien roi-guerrier Sésostris. Comme son ancêtre Sésostris, [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] mena ses troupes alors qu'elles marchaient sans relâche à travers désert et plaine, montagne et rivière, au-delà et par-delà le Nil pour établir un puissant empire."
 RICE_nile_sesostris_legend_chapter_famous_deed_new_title:"Les mots qu'Hérodote écrivit jadis au sujet de Sésostris peuvent s'appliquer à [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] également. « Après être revenu en Égypte, il rassembla une grande armée et marcha à travers le continent, soumettant chaque nation sur son passage. Sésostris fut le seul roi égyptien à régner également sur l'Éthiopie. » En effet, tous les autres, même les plus puissants, contempleront les œuvres de [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip], et désespéreront !"
 RICE_nile_sesostris_legend_chapter_extra_deed_new_title:"Bien sûr, Sésostris était aussi un roi sage et industrieux, comme le rapporte Hérodote. [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip], de même, était resté[ROOT.Legend.GetProtagonist.Custom('FR_E')] dans les mémoires comme un[ROOT.Legend.GetProtagonist.Custom('FR_E')] te[ROOT.Legend.GetProtagonist.Custom('FR_LLle')] souverain[ROOT.Legend.GetProtagonist.Custom('FR_E')], en particulier parmi les [ROOT.Legend.GetProperty( 'faith' ).Faith.GetAdjectiveNoTooltip] [ROOT.Legend.GetProperty( 'culture' ).Culture.GetName] qui lui tiennent à cœur. $RICE_nile_legend_chapter_extra_deed_new_title$"
 RICE_nile_sesostris_legend_chapter_conclusion_new_title:"$RICE_nile_legend_chapter_conclusion_new_title$ son ancêtre, le plus grand des conquérants de l'Égypte antique, Sésostris."
 RICE_nile_surid_legend_name:"Sang de Surid ibn Salhouk"
 RICE_nile_surid_legend_desc:"Selon la légende [ROOT.Legend.GetProperty( 'faith' ).Faith.GetAdjectiveNoTooltip] [ROOT.Legend.GetProperty( 'culture' ).Culture.GetCollectiveNounNoTooltip], le roi Surid ibn Salhouk, qui vécut avant le Déluge biblique, fit construire les Pyramides non seulement pour servir de tombeau, mais aussi pour préserver charitablement tout le savoir de l'Égypte après le déluge. S[descendant.Custom('FR_OnA')] descendant[descendant.Custom('FR_E')], [descendant.GetTitledFirstName], perpétue son héritage à sa manière."
 RICE_nile_surid_legend_chapter_opening_new_title: "$RICE_nile_legend_chapter_opening_new_title$" 
 RICE_nile_surid_legend_chapter_motivation_new_title:"$RICE_nile_legend_chapter_motivation_new_title$ Le Roi Surid, le bâtisseur, le décideur, le préservateur. Il est facile de conquérir une nation comparé à en gouverner une, et encore moins de préserver sa civilisation pour la postérité. [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip], comme [ROOT.Legend.GetProtagonist.GetSheHe] l'avait bien compris, dans ses efforts pour créer un grand empire le long du Nil."
 RICE_nile_surid_legend_chapter_famous_deed_new_title:"Avant le Grand Déluge, l'humanité croyait vainement qu'elle durerait éternellement, et c'est uniquement grâce à des souverains clairvoyants comme Surid que la civilisation survécut ; après le Grand Déluge, [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] joua le même rôle pour l'humanité. [ROOT.Legend.GetProtagonist.GetSheHe|U] ne se contenta pas de régner sur de nombreuses terres, mais chercha également à rassembler tout le savoir du monde, et à bâtir les monuments les plus durables, pour la postérité, et pour que les générations futures puissent les contempler et les chérir."
 RICE_nile_surid_legend_chapter_extra_deed_new_title:"Tout comme Surid le fit en des temps antédiluviens, [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] accomplit de nombreuses choses pour mériter le titre de grand[ROOT.Legend.GetProtagonist.Custom('FR_E')] souverain[ROOT.Legend.GetProtagonist.Custom('FR_E')]. $RICE_nile_legend_chapter_extra_deed_new_title$"
 RICE_nile_surid_legend_chapter_conclusion_new_title:"$RICE_nile_legend_chapter_conclusion_new_title$ son ancêtre, le père des Pyramides."
 RICE_nile_umayyads_legend_name:"Sang des Omeyyades"
 RICE_nile_umayyads_legend_desc:"Pendant plusieurs générations, les Omeyyades étendirent la portée du Califat, mais comme tous les grands empires s'effondrèrent, leur dynastie connut le même sort, lorsque les Abbassides les renversèrent. Bien que de nombreux Omeyyades furent massacrés dans le chaos qui s'ensuivit, les Abbassides cherchant à éliminer chacun d'entre eux, quelques rares princes et princesses omeyyades eurent la chance de s'enfuir vers des terres lointaines, y compris le lointain ancêtre de [descendant.GetTitledFirstName]."
 RICE_nile_umayyads_legend_chapter_opening_new_title: "$RICE_nile_legend_chapter_opening_new_title$" 
 RICE_nile_umayyads_legend_chapter_motivation_new_title:"$RICE_nile_legend_chapter_motivation_new_title$ Omeyyades, qui régnèrent autrefois sur une si grande partie du monde, des rivages de l'Ibérie aux frontières de l'Inde et de la Chine. Les ancêtres de [ROOT.Legend.GetProtagonist.GetFirstNamePossessiveNoTooltip] perdirent tant au fil des générations, et pourtant cela, de manière fascinante, peut être le moteur de gloires futures, comme [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] le démontre. Ses efforts pour bâtir un nouvel empire est admirable non seulement en soi, mais parce qu'[ROOT.Legend.GetProtagonist.GetSheHe] restaura le nom, la renommée et l'éminence des Omeyyades à travers le monde une fois encore, et les racheta après leur déclin passé."
 RICE_nile_umayyads_legend_chapter_famous_deed_new_title:"On ne peut qu'imaginer la terreur ressentie par les ancêtres omeyyades de [ROOT.Legend.GetProtagonist.GetFirstNamePossessiveNoTooltip], alors qu'ils fuyaient aussi vite que possible le seul foyer qu'ils connaissaient, les cavaliers abbassides à leurs trousses, pourchassant sans relâche ces survivants pour les massacrer comme des animaux. Mais finalement, ils y parvinrent, arrivant sur les rives du Nil, où vivaient de nombreux [ROOT.Legend.GetProperty( 'culture' ).Culture.GetCollectiveNounNoTooltip] sympathisants et où ils pouvaient se cacher en sécurité. Et ici, leurs descendants se multiplièrent et prospérèrent, tant et si bien qu'ils purent former un nouvel empire."
 RICE_nile_umayyads_legend_chapter_extra_deed_new_title:"[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] ne se contenta pas de conquérir pour restaurer l'honneur de ses ancêtres, cependant. [ROOT.Legend.GetProtagonist.GetSheHe|U] veilla également à ce que l'empire qu'[ROOT.Legend.GetProtagonist.GetSheHe|l] bâtit soit digne de leur nom. $RICE_nile_legend_chapter_extra_deed_new_title$"
 RICE_nile_umayyads_legend_chapter_conclusion_new_title:"$RICE_nile_legend_chapter_conclusion_new_title$ ses ancêtres, les exemplaires Omeyyades."
 
