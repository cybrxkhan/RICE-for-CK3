 RICE_nubia_banganarti_pilgrimage_dream_incubation_type:"Réservations aux Xenodocheia"
 RICE_nubia_banganarti_pilgrimage_dream_incubation_type_none:"Pas de séjour prolongé"
 RICE_nubia_banganarti_pilgrimage_dream_incubation_type_none_desc:"$EFFECT_LIST_BULLET$ Aucune chance d'obtenir un [character_modifier|El] #P positif#! suite à une incubation de rêve réussie\n\n#weak Ma vie est suffisamment occupée, je n'ai donc pas le temps d'attendre au [Glossary( 'Xenodocheia', 'XENODOCHIUM_GLOSS' )] de Banganarti pour recevoir un bon rêve de [Glossary( 'Saint Raphaël', 'ARCHANGEL_RAPHAEL_GLOSS' )].#!"
 RICE_nubia_banganarti_pilgrimage_dream_incubation_type_small:"Court séjour"
 RICE_nubia_banganarti_pilgrimage_dream_incubation_type_small_desc:"$EFFECT_LIST_BULLET$ #V [GetPlayer.MakeScope.ScriptValue('RICE_banganarti_pilgrimage_dream_incubation_small_chance')]%#! de chance d'obtenir un [character_modifier|El] #P positif#! grâce à une incubation de rêve réussie\n$EFFECT_LIST_BULLET$ La chance de succès est basée sur le [piety_level|El] et vos [traits|El] de [virtue|El] et [sin|El]\n$EFFECT_LIST_BULLET$ Gain d'un bonus de [piety_i|El] #V [GetPlayer.MakeScope.ScriptValue('RICE_banganarti_pilgrimage_dream_incubation_small_piety_bonus')]#! [piety|El]\n$EFFECT_LIST_BULLET$ La durée de cette [activity|El] sera prolongée de #V 1#! mois\n\n#weak Je resterai au [Glossary( 'Xenodocheia', 'XENODOCHIUM_GLOSS' )] de Banganarti pendant un moment, mais pas trop longtemps, pour voir si je reçois un bon rêve de [Glossary( 'Saint Raphaël', 'ARCHANGEL_RAPHAEL_GLOSS' )].#!"
 RICE_nubia_banganarti_pilgrimage_dream_incubation_type_large:"Long séjour"
 RICE_nubia_banganarti_pilgrimage_dream_incubation_type_large_desc:"$EFFECT_LIST_BULLET$ #V [GetPlayer.MakeScope.ScriptValue('RICE_banganarti_pilgrimage_dream_incubation_large_chance')]%#! de chance d'obtenir un [character_modifier|El] #P positif#! grâce à une incubation de rêve réussie\n$EFFECT_LIST_BULLET$ La chance de succès est basée sur le [piety_level|El] et vos [traits|El] de [virtue|El] et [sin|El]\n$EFFECT_LIST_BULLET$ Gain d'un bonus de [piety_i|El] #V [GetPlayer.MakeScope.ScriptValue('RICE_banganarti_pilgrimage_dream_incubation_large_piety_bonus')]#! [piety|El]\n$EFFECT_LIST_BULLET$ La durée de cette [activity|El] sera prolongée de #V 3#! mois\n\n#weak Je resterai au [Glossary( 'Xenodocheia', 'XENODOCHIUM_GLOSS' )] de Banganarti pendant un long moment, et j'espère que ma dévotion m'aidera à obtenir un bon rêve de [Glossary( 'Saint Raphaël', 'ARCHANGEL_RAPHAEL_GLOSS' )].#!"
