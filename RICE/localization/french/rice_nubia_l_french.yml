 nubia.0200.t:0 "Au monastère de Saint-Antoine"
 nubia.0200.desc:0 "Il y a longtemps, aux premiers jours de l'Église, Saint Antoine est apparu comme l'une des plus grandes figures du monachisme [christian.GetAdherentName|l]. Nous lui devons beaucoup pour nous avoir inspirés dans notre foi, et c'est pourquoi le monastère de Saint-Antoine, construit près de l'endroit où il résidait en ermite, est devenu un site de pèlerinage populaire au fil des années.\n\nEn tant que pèlerin, j'entreprends maintenant mon ardu voyage vers le désert oriental pour accomplir ce pèlerinage."
 nubia.0200.a:0 "Que [ROOT.Char.GetFaith.HighGodNameAlternate] me protège durant mon voyage !"
 nubia.0201.t:0 "Arrivée"
 nubia.0201.desc:0 "Fatigués, assoiffés et en manque de sommeil, mes compagnons et moi arrivons au monastère de Saint-Antoine. Notre long voyage dans le désert est terminé, et bien que nous soyons soulagés de pouvoir enfin nous reposer, nous sommes encore plus exaltés d'être enfin #italic ici#!, dans l'un des plus grands monastères d'[GetGeographicalRegion('ghw_region_egypt').GetName], pour marcher dans les pas du grand Saint Antoine.\n\nNous trouverons un endroit où loger pendant notre séjour, et demain, nous pourrons commencer à véritablement apprécier ce lieu et sa spiritualité."
 nubia.0201.a:0 "Remercions [ROOT.Char.GetFaith.HighGodName], nous sommes enfin arrivés."
 nubia.0202.t:0 "Visions intéressantes"
 nubia.0202.desc:0 "Au cours des derniers jours, j'ai passé mon temps au monastère de Saint-Antoine en prière et en dévotion. N'est-il pas remarquable que cet endroit reculé ait résisté aux épreuves et tribulations du temps, depuis l'époque des disciples ascétiques de Saint Antoine, et ait survécu comme un rappel inébranlable et solide de la gloire de notre foi [GetReligionByKey('christianity_religion').GetAdjective] ?\n\nIl y a un certain nombre de curiosités ou de choses que je pourrais examiner pendant que je suis ici au monastère, maintenant que j'ai passé du temps en prière et en dévotion. Peut-être devrais-je m'y intéresser quand j'en aurai le temps ?"
 nubia.0202.a:0 "Les jardins du monastère semblent magnifiques et bien entretenus"
 nubia.0202.b:0 "Je devrais faire une randonnée jusqu'à la grotte de Saint Antoine au Mont Colzim"
 nubia.0202.c:0 "Les moines ascètes ici sont tout à fait fascinants"
 nubia.0202.d:0 "Davantage de prière et de dévotion seraient préférables"
 nubia.0203.t:0 "Conclusion"
 nubia.0203.desc:0 "Malheureusement, il est temps pour moi de quitter le monastère de Saint-Antoine. J'y ai séjourné un bon moment, mais je dois retourner à mes devoirs habituels chez moi.\n\nBien que je ne sache pas si et quand je reviendrai au monastère, j'ai néanmoins trouvé cette expérience spirituellement régénératrice. Louanges à Saint Antoine, dont l'exemple nous inspire encore à ce jour !"
 nubia.0203.a:0 "Il est temps de plier bagage et de se préparer à rentrer."
