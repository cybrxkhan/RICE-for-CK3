 nubia.0001.t:0 "Le Nil éternel"
 nubia.0001.desc.intro:0 "Le Nil est le cœur de l'Égypte et de la Nubie, la terre est son corps, et le peuple est son sang. Les eaux claires du précieux Nil regorgent de vie ; certaines années, il bénit le peuple d'abondance, d'autres années il le maudit par la famine. Il en est ainsi depuis l'époque des [Glossary( 'pharaons', 'PHARAOH_GLOSS' )] égyptiens et des [Glossary( 'Qores', 'QORE_GLOSS' )] et [Glossary( 'Kandakes', 'KANDAKE_GLOSS' )] koushites.\n\n"
 nubia.0001.desc.baqt:0 "Il y a des générations, les armées du califat des Rachidoun, qui venaient de conquérir l'Égypte, et la Nubie makurienne se sont affrontées à la frontière de ces deux terres ; finalement, les deux camps ont négocié un accord : le [RICE_baqt|El]. Cet accord a défini la politique et le commerce le long du Nil ancestral depuis lors, mais peut-il durer aussi longtemps que le Nil lui-même ?\n\n"
 nubia.0001.desc.conclusion:0 "Quoi que l'avenir réserve, une vérité demeure indéniable : tant que le Nil subsistera, son peuple perdurera."
 nubia.0001.a:0 "Nous vivons et mourons par le Nil."
 nubia.0002.t:0 "Le Baqt : [my_subregion.GetCurrentPhase.GetName]"
 nubia.0002.desc:0 "En raison de divers changements récents dans le paysage politique, économique et culturel, l'[GetGeographicalRegion('ghw_region_egypt').GetName] et la [GetGeographicalRegion('RICE_greater_nubia_region').GetName] approchent d'une période de #V [my_subregion.GetCurrentPhase.GetName]#!.\n\n"
 nubia.0002.desc.baqt_accord:0 "Les dirigeants des deux régions sont plus disposés à respecter les stipulations du [RICE_baqt_treaty|El] que les souverains d'Égypte et de Nubie ont conclu il y a longtemps, et à s'engager dans des échanges diplomatiques et économiques. L'espoir demeure que ces terres, nourries par les eaux vivifiantes du Nil, connaîtront une grande prospérité et la paix dans les années à venir."
 nubia.0002.desc.baqt_discord:0 "Les dirigeants des deux régions sont moins enclins à respecter les stipulations du [RICE_baqt_treaty|El] que les souverains d'Égypte et de Nubie ont accepté il y a longtemps. Les conflits et les désaccords sont de plus en plus probables, et l'on craint que même les eaux vivifiantes du Nil ne suffisent pas à nourrir la terre et son peuple en cas de difficultés."
 nubia.0002.desc.conclusion:0 "\n\nLes effets à long terme de ces tendances restent encore à observer. Le [RICE_baqt_treaty|El] a survécu aussi longtemps, et il continuera assurément à perdurer."
 nubia.0002.a:0 "Le Nil est éternel, mais ses peuples changent sans cesse."
