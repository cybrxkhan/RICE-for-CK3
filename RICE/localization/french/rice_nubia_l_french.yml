 trait_RICE_governor_of_aswan_3_character_desc:"[ROOT.GetCharacter.GetFirstNameNoTooltip] est un[ROOT.GetCharacter.Custom('FR_E')] administrat[ROOT.GetCharacter.Custom('FR_EurRice')] et un[ROOT.GetCharacter.Custom('FR_E')] arbitre exceptionne[ROOT.GetCharacter.Custom('FR_LLle')], faisant de [ROOT.GetCharacter.GetHerHim] un choix parfait en tant que $trait_RICE_governor_of_aswan$."
 trait_RICE_governor_of_aswan_2_character_desc:"[ROOT.GetCharacter.GetFirstNameNoTooltip] possède une grande expérience dans l'administration des terres, notamment en tant qu'actue[ROOT.GetCharacter.Custom('FR_LLle')] ou ancie[ROOT.GetCharacter.Custom('FR_NNne')] $trait_RICE_governor_of_aswan$."
 trait_RICE_governor_of_aswan_1_character_desc:"[ROOT.GetCharacter.GetFirstNameNoTooltip] a acquis de précieuses compétences dans son rôle de $trait_RICE_governor_of_aswan$."
 trait_RICE_the_danite:0 "Le Danite"
 trait_RICE_the_danite_desc:0 "Ce personnage prétend être un membre d'une ancienne tribu juive au cœur de l'Afrique, descendant de la Tribu de Dan. Les récits qu'il raconte sont crus par certains, mais pas par tous les Juifs."
