 nubia.0020.t:0 "Tatouages [ROOT.Char.GetFaith.GetAdjectiveNoTooltip]"
 nubia.0020.desc:0 "C'est une coutume parmi les [ROOT.Char.GetFaith.GetAdherentNamePlural] [ROOT.Char.GetCulture.GetName] de recevoir de petits tatouages en forme de symboles religieux importants, tels que la [ROOT.Char.GetFaith.ReligiousSymbol], pour nous protéger du malheur et du mal.\n\nAujourd'hui, je me rends dans un [ROOT.Char.GetFaith.HouseOfWorship] local à proximité pour recevoir un tel tatouage. Après avoir discuté avec le tatoueur des détails de ce tatouage, je suis plus que prêt à commencer."
 nubia.0020.a:0 "Puisse ce tatouage bien me protéger !"
 nubia.0021.t:0 "Le portrait du donateur [ROOT.Char.GetFaith.GetAdjectiveNoTooltip]"
 nubia.0021.desc:0 "J'ai approché des artisans [ROOT.Char.GetCulture.GetCollectiveNoun|l] et des [ROOT.Char.Custom('DefaultPriestTitlePlural')] [ROOT.Char.GetFaith.GetAdherentNamePlural|l] au sujet de la commande d'un portrait de donateur me représentant dans une œuvre d'art religieuse [ROOT.Char.GetFaith.GetReligion.GetAdjective|l] dans un [ROOT.Char.GetFaith.HouseOfWorship] local, peut-être une scène tirée de [ROOT.Char.GetFaith.ReligiousText].\n\nBien que l'objet principal de cette œuvre soit bien sûr l'aspect religieux, j'ai spécifié que l'objectif secondaire de ce portrait de donateur devrait être de représenter"
 nubia.0021.desc.self:0 "ma propre image. Ainsi, ce portrait me représentera de telle manière que mon zèle pour [ROOT.Char.GetFaith.HighGodName] sera évident et inspirant pour quiconque posera les yeux sur mon portrait."
 nubia.0021.desc.clergy:0 "moi-même accompagné du clergé de ma cour. La dévotion religieuse ne se limite pas à un[ROOT.Char.Custom('FR_E')] seul[ROOT.Char.Custom('FR_E')] [ROOT.Char.GetWomanMan] - je veux que les autres comprennent en contemplant cette œuvre que je suis le genre de [ROOT.Char.GetTitleAsNameNoTooltip] qui recherche la guidance spirituelle des sages."
 nubia.0021.desc.family:0 "moi-même et mes proches parents. J'espère que tous ceux qui verront cet art religieux apprécieront combien ma lignée est remplie de personnes aux qualités religieuses admirables. La famille [ROOT.Char.GetHouse.GetName] devrait à jamais être associée à une profonde dévotion envers [ROOT.Char.GetFaith.HighGodName]."
 nubia.0021.a:0 "Louons [ROOT.Char.GetFaith.HighGodNameAlternate] !"
 nubia.0022.t:0 "Les évêques de [GetTitleByKey('b_faras').GetNameNoTierNoTooltip]"
 nubia.0022.desc:0 "Au temps jadis, le [GetReligionByKey('christianity_religion').GetName|l] arriva pour la première fois en [GetGeographicalRegion('RICE_greater_nubia_region').GetName] par le royaume septentrional de Nobatie, centré autour de [GetTitleByKey('b_faras').GetNameNoTier]. La grande cathédrale de [GetTitleByKey('b_faras').GetNameNoTier] fut construite peu après comme centre de l'Église [GetReligionByKey('christianity_religion').GetAdjective] dans la région ; ainsi, ses évêques ont acquis un haut niveau de prestige et de respect depuis lors.\n\nLes murs de la cathédrale de [GetTitleByKey('b_faras').GetNameNoTier] ont méticuleusement consigné les noms de chaque évêque qui y résida. Nombre de fidèles qui viennent à la cathédrale le font pour contempler cette grande liste, et prier devant les peintures des anciens évêques représentés par celle-ci.\n\nRécemment,"
 nubia.0022.desc.not_updater:0 "[updater.GetTitledFirstName] a consacré des fonds non seulement pour restaurer la liste à sa qualité précédente, mais aussi pour la mettre à jour avec des informations plus récentes et des représentations artistiques de divers évêques. Son geste reflète bien sa dévotion religieuse, et l'importance de la cathédrale."
 nubia.0022.desc.updater:0 "J'ai consacré des fonds non seulement pour restaurer la liste à sa qualité d'antan, mais aussi pour la mettre à jour avec des informations plus récentes et des représentations artistiques de divers évêques. C'est un sentiment formidable de savoir que, grâce à mes contributions, je fais moi aussi partie de la longue histoire de la cathédrale."
 nubia.0022.a:0 "Cette cathédrale restera debout pour de nombreuses générations."
 nubia.0023.t:0 "Les arbres Tebeldi"
 nubia.0023.desc:0 "Les terres du [GetGeographicalRegion('RICE_greater_darfur').GetName] abritent de nombreux [Glossary( 'arbres tebeldi', 'TEBELDI_TREES_GLOSS' )]. Ces arbres merveilleux peuvent stocker une grande quantité d'eau dans leurs troncs et leurs branches, et les dirigeants locaux tels que moi-même sont non seulement censés entretenir ces arbres, mais aussi considérer cela comme un devoir sacré et solennel envers notre peuple.\n\nÀ ce titre, je viens de mettre de côté quelques ressources pour l'entretien continu de ces arbres, que ce soit pour creuser des arbres afin de créer de nouveaux sites de stockage d'eau, pour préserver et prendre soin de ceux qui existent déjà, ou pour encourager la croissance de nouveaux arbres."
 nubia.0023.a:0 "C'est une responsabilité qu'aucun [ROOT.Char.GetTitleAsNameNoTooltip] ne peut esquiver."
 nubia.0024.t:0 "Qui envoyer au Lac ?"
 nubia.0024.desc:0 "Les lacs de montagne sont des lieux d'une grande puissance spirituelle, et c'est notre tradition de rechercher ces lacs et de les consulter pour en apprendre davantage sur l'avenir de notre royaume. Un lac en [lake_oracle_province.GetName] a été identifié comme un bon candidat pour ce rituel.\n\nCependant, pour discerner ces prophéties des ancêtres et de [ROOT.Char.GetFaith.HighGodName], nous devons envoyer le bon représentant.\n\nEnvoyer un serviteur de confiance serait parfaitement acceptable, par exemple."
 nubia.0024.desc.courtier:0 "Entre-temps, [courtier.GetTitledFirstName] s'est porté volontaire pour y aller en mon nom, désireux de m'assister dans cette affaire. Cela pourrait être préférable étant donné qu'[courtier.GetSheHe] est plus estimé qu'un simple serviteur."
 nubia.0024.desc.clergy:0 "[clergy.GetTitledFirstName] a également proposé de se rendre à [lake_oracle_province.GetNameNoTooltip], estimant que son expérience religieuse lui sera utile."
 nubia.0024.a:0 "Envoyer un serviteur de confiance"
 nubia.0024.b:0 "Envoyer [courtier.GetFirstNameNoTooltip]"
 nubia.0024.b.tooltip:0 "[courtier.GetFirstNameNoTooltip] va voyager à [lake_oracle_province.GetName], augmentant légèrement les chances d'obtenir un [modifier|El] #P positif#! plutôt qu'un [modifier|El] #N négatif#!"
 nubia.0024.c:0 "Envoyer [clergy.GetFirstNameNoTooltip]"
 nubia.0024.c.tooltip:0 "[clergy.GetFirstNameNoTooltip] va voyager à [lake_oracle_province.GetName], augmentant grandement les chances d'obtenir un [modifier|El] #P positif#! plutôt qu'un [modifier|El] #N négatif#!"
 nubia.0025.t:0 "Que dit le Lac ?"
 nubia.0025.desc:0 "Mon représentant choisi, accompagné de sages [ROOT.Char.Custom('DefaultPriestTitlePlural')], est arrivé au lac de montagne en [lake_oracle_province.GetName], et a observé ses eaux sacrées toute la journée pour discerner l'avenir de notre royaume, et consulter le lac sur ce que nous devons faire. Tous les présents ont soigneusement évité les eaux de ce lac, car les toucher pourrait attirer le mal des démons impurs qui rôdent souvent autour de ces lacs.\n\nMon représentant a pris note des couleurs de l'eau le matin et le soir, ainsi que des ondulations à la surface lorsque le vent soufflait. Après quelques discussions entre eux, il a été déterminé que l'oracle du lac prédit"
 nubia.0025.desc.positive:0 "une #bold #P prophétie favorable#!#! pour notre royaume. De bonnes choses arriveront, si nous saisissons les opportunités qui nous sont offertes.\n\nQue le royaume prospère, ou que nous puissions endurer tous les défis qui se présenteront à nous (tant que nous suivons les conseils de l'oracle du lac) - voilà des nouvelles qui réjouissent mes oreilles."
 nubia.0025.desc.negative:0 "un #bold #N mauvais présage#!#! pour notre royaume. Des épreuves nous attendent, et mon représentant a soigneusement noté ce que le lac de montagne a dit que nous devions faire pour survivre aux défis qui nous attendent.\n\nJe ne suis guère satisfait d'entendre cette nouvelle. Cependant, ces oracles tendent à être fiables, aussi devons-nous tenir compte de son avertissement."
 nubia.0025.desc.nothing:0 "rien de particulier. En d'autres termes, mon représentant n'a pu discerner aucun message divin du lac, bon ou mauvais.\n\nJe suppose que je devrais être soulagé qu'il n'y ait pas de mauvais présage, mais l'absence d'une prophétie favorable est préoccupante. Peut-être que cette ambiguïté est en elle-même une sorte de message…."
 nubia.0025.a:0 "Ainsi soit-il, ainsi soit-il."
 nubia.0026.t:0 "xxxxx"
 nubia.0026.desc:0 "xxxxx"
 nubia.0026.a:0 "xxxxx"
 nubia.0027.t:0 "Boire le [ROOT.Char.GetFaith.ReligiousText]"
 nubia.0027.desc:0 "[ROOT.Char.GetFaith.ReligiousText|U] est une source de grande sagesse et de connaissance, imprégné d'un pouvoir miraculeux. Il existe une pratique bien établie parmi les [ROOT.Char.GetFaith.GetAdherentNamePlural] [ROOT.Char.GetCulture.GetCollectiveNoun|l] consistant à écrire des versets [ROOT.Char.GetFaith.ReligiousText3] sur une planche spéciale avec de l'encre faite de substances comestibles, puis à laver l'encre avec de l'eau et à boire le mélange liquide.\n\nJ'ai rendu visite à un [ROOT.Char.Custom('DefaultPriestTitle')] local, versé dans les questions de guérison et de religion, pour accomplir ce rituel pour moi aujourd'hui. « Bois bien ce liquide », me dit-on, « et intériorise le grand pouvoir spirituel manifeste dans [ROOT.Char.GetFaith.ReligiousText] que [ROOT.Char.GetFaith.HighGodName] nous a gracieusement donné. Son pouvoir vient de Sa volonté seule."
 nubia.0027.a:0 "Louons [ROOT.Char.GetFaith.HighGodName] pour ces bénédictions !"
 nubia.0028.t:0 "xxxxx"
 nubia.0028.desc:0 "xxxxx"
 nubia.0028.a:0 "xxxxx"
