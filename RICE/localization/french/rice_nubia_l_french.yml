 nubia.0190.t:0 "Vers le Sinaï"
 nubia.0190.desc:0 "La renommée du monastère de Sainte-Catherine s'est répandue dans le monde entier, pour de multiples raisons. Il n'est pas seulement le plus ancien monastère [christian.GetAdherentName] encore en activité, mais il abrite également de nombreux sites sacrés et des curiosités fascinantes, du Puits de Moïse et du Buisson Ardent aux reliques de Sainte Catherine.\n\nPeu étonnant qu'il soit resté un lieu de pèlerinage populaire jusqu'à ce jour.\n\nMoi aussi, j'aspire à être l'un de ces pèlerins, qui cherchent à être spirituellement inspirés par cette gloire spirituelle. Je braverai les déserts rudes et accidentés du Sinaï, et atteindrai ce grand monastère d'une manière ou d'une autre."
 nubia.0190.a:0 "Mon voyage commence aujourd'hui - quel voyage ce sera !"
 nubia.0191.t:0 "Arrivée"
 nubia.0191.desc:0 "Mon voyage à travers le Sinaï vers le monastère Sainte-Catherine m'a rappelé l'épisode du Livre de l'Exode, lorsque les Israélites, menés par Moïse, errèrent dans le Sinaï pendant quarante ans, subsistant uniquement de cailles et de manne que [ROOT.Char.GetFaith.HighGodName] leur fournissait.\n\nEn comparaison, les épreuves que j'ai affrontées durant mes récents voyages semblent bien dérisoires. Néanmoins, je suis heureux d'être enfin arrivé au monastère.\n\nRien qu'en y pensant, je sais que tant que je serai ici, il y aura beaucoup à faire, beaucoup à voir, et beaucoup de temps passé en prière."
 nubia.0191.a:0 "Mais d'abord, trouvons un endroit où nous reposer pour la nuit."
 nubia.0192.t:0 "Le Premier Jour"
 nubia.0192.desc:0 "Un nouveau jour se lève, et je me réveille au monastère Sainte-Catherine. Quel bonheur de se trouver en ce site sacré et ancien, comme des milliers d'autres pèlerins [ROOT.Char.GetFaith.GetReligion.GetAdherentNamePlural] dévoués au fil des siècles !\n\nIl y a tant de choses intéressantes à voir et à vivre en ce lieu saint, mais d'abord, je compte passer de nombreux jours en prière et en adoration de [ROOT.Char.GetFaith.HighGodName], ainsi qu'en réflexion spirituelle. Peut-être qu'ensuite, je pourrai consacrer du temps à explorer et mieux comprendre les nombreuses facettes de ce monastère."
 nubia.0192.a:0 "Je quitte le lit et me prépare pour mon premier jour complet ici."
 nubia.0193.t:0 "Inspiration"
 nubia.0193.desc:0 "J'ai passé beaucoup de temps au monastère Sainte-Catherine, priant et vénérant [ROOT.Char.GetFaith.HighGodName]. En séjournant au monastère, une chose en particulier a attiré mon attention et m'a grandement inspiré, plus que tout le reste : le #V [GetPlayer.Custom('RICE_saint_catherine_monastery_inspiration_loc')]#!.\n\n[GetPlayer.Custom('RICE_saint_catherine_monastery_inspiration_desc_loc')]\n\nVraiment, c'est un lieu ancien, imprégné de spiritualité et d'histoire - et cette histoire est antérieure même à celle du monastère."
 nubia.0193.a:0 "Cet endroit est véritablement profond à bien des égards."
 nubia.0194.t:0 "Conclusion"
 nubia.0194.desc:0 "Hélas, mon séjour ici au monastère Sainte-Catherine touche à sa fin, car je dois retourner à ma vie normale en tant que [ROOT.Char.GetTitleAsNameNoTooltip].\n\nCependant, j'ai vécu ici au monastère une expérience spirituelle des plus inspirantes et stimulantes. Qui aurait cru qu'un seul lieu isolé, au beau milieu du désert, puisse receler autant d'histoire et de traditions religieuses ?\n\nC'est une bonne chose que j'aie pu voyager ici tant que je suis encore en bonne santé et capable, et je méditerai sur tout ce que j'ai vu et fait en reprenant le chemin du retour."
 nubia.0194.a:0 "Peut-être qu'un jour, je pourrais même revenir."
