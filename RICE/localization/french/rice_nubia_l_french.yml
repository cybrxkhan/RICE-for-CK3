 nubia.0030.t:0 "Expansion des réseaux d'irrigation"
 nubia.0030.desc:0 "Le Nil est un fleuve ancien, dont les eaux nourrissent notre civilisation. Il serait toutefois insensé de simplement considérer cela comme acquis, et de ne rien faire pour maximiser les bienfaits que nous pouvons tirer de ces eaux.\n\nAu fil des années, nous les [ROOT.Char.GetCulture.GetCollectiveNoun|l] avons utilisé une variété de méthodes et de technologies, telles que la [Glossary( 'saqia', 'SAQIA_GLOSS' )] et diverses façons de creuser des fossés d'irrigation, pour étendre la portée des eaux du Nil et accroître la superficie de terres arables dont nous pouvons tirer parti. En soutenant ces stratégies traditionnelles [ROOT.Char.GetCulture.GetNameNoTooltip]s, en tant que [ROOT.Char.GetTitleAsNameNoTooltip], mon peuple bénéficiera d'une productivité agricole accrue pour de nombreuses années à venir."
 nubia.0030.a:0 "Le Nil est une ressource que nous devons utiliser avec sagesse."
 nubia.0031.t:0 "Entretien des Hafirs"
 nubia.0031.desc:0 "Nous, [ROOT.Char.GetCulture.GetCollectiveNoun|l], utilisons des [Glossary( 'hafirs', 'HAFIR_GLOSS' )] depuis aussi longtemps que quiconque s'en souvienne. Ces merveilleux réservoirs sont conçus pour s'adapter au paysage aride près du Nil, et sont d'une grande utilité tant pour les agriculteurs que pour les pasteurs.\n\nDe nos jours, il est plus courant d'entretenir les anciens #italic hafirs#! que nos prédécesseurs ont construits il y a longtemps, souvent près de ruines antiques, mais parfois nous en construisons aussi de nouveaux. Quoi qu'il en soit, j'ai donné des instructions à mes officiaux locaux dans mes territoires pour entretenir ou construire de nouveaux #italic hafirs#! selon les besoins des habitants."
 nubia.0031.a:0 "La sécurité de l'eau n'est pas un problème que nous pouvons négliger."
 nubia.0032.t:0 "Élevages porcins en expansion"
 nubia.0032.desc:0 "Bien que les bovins soient le bétail dominant parmi les [ROOT.Char.GetCulture.GetCollectiveNoun], possédant une importance économique et culturelle inégalée parmi notre peuple, les porcs sont, sans doute, les plus importants ensuite. J'ai entendu dire que même les classes inférieures mangent plus de porc que de bœuf.\n\nLe nombre de porcs dans nos communautés le long du Nil ne cesse de croître, en particulier dans les [ROOT.Char.GetFaith.HouseOfWorshipPlural] [ROOT.Char.GetFaith.GetAdherentNamePlural], puisque ces [ROOT.Char.Custom('DefaultPriestTitlePlural')] élèvent souvent des porcs pour nourrir les visiteurs et les pèlerins, ainsi qu'eux-mêmes. Soutenir l'expansion de ces élevages porcins ne peut que nous bénéficier économiquement à long terme."
 nubia.0032.a:0 "Ce ne sont pas des bovins, mais les cochons jouent tout de même un rôle clé ici."
 nubia.0033.t:0 "Importation de bétail"
 nubia.0033.desc.intro:0 "Depuis les temps anciens, le bétail est le cheptel le plus estimé parmi les [ROOT.Char.GetCulture.GetCollectiveNoun]. Tout [ROOT.Char.GetTitleAsNameNoTooltip] sait que la prospérité de son peuple dépend d'un nombre suffisant de bêtes paissant le long des terres fertiles près du Nil. Les puissantes [ROOT.Char.GetFaith.HouseOfWorshipPlural] [ROOT.Char.GetFaith.GetAdherentNamePlural|l] et les nobles aisés, par exemple, mesurent leur richesse à travers leurs troupeaux de bétail.\n\n"
 nubia.0033.desc:0 "$nubia.0033.desc.intro$Cependant, de nos jours, il existe des routes commerciales qui s'étendent au loin, nous permettant d'importer différentes races de bétail jusqu'ici absentes en Nubie dans les temps anciens. J'ai donc pris des mesures pour soutenir l'importation de ce bétail dans nos terres le long du Nil."
 nubia.0033.a:0 "Une telle diversité nous profite sur le long terme !"
 nubia.0034.t:0 "Élevage de bétail"
 nubia.0034.desc:0 "$nubia.0033.desc.intro$Il existe certaines races de bétail qui ont été élevées de manière fiable ici, sur nos terres le long du Nil, depuis des siècles. Soutenir la poursuite de leur élevage assurera leur pérennité, afin que notre peuple puisse continuer à bénéficier des mêmes types traditionnels de bétail que nos ancêtres."
 nubia.0034.a:0 "Que ferions-nous sans notre bétail ?"
