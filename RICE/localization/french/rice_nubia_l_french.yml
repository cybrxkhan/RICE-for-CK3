 # Buildings
 building_type_RICE_nubia_throne_hall_of_dongola:0 "Salle du Trône de Dongola"
 building_type_RICE_nubia_throne_hall_of_dongola_desc:0 "Une impressionnante structure à deux étages surplombant le Nil, la salle du trône de Dongola, qui accueille des visiteurs de haut rang venus de près et de loin, sert de rappel impressionnant du pouvoir détenu par les rois nubiens. La salle du trône elle-même se trouve au deuxième étage, où les délégations officielles ne peuvent accéder qu'après avoir gravi un grand escalier. La salle comme l'escalier sont ornés de magnifiques peintures."
 building_RICE_nubia_throne_hall_of_dongola:0 "$building_type_RICE_nubia_throne_hall_of_dongola$"
 building_RICE_nubia_throne_hall_of_dongola_desc:0 "$building_type_RICE_nubia_throne_hall_of_dongola_desc$"
 building_type_RICE_nubia_musawwarat_es_sufra:0 "Musawwarat es-Sufra"
 building_type_RICE_nubia_musawwarat_es_sufra_desc:0 "Autrefois un site majeur de culte pour les anciens païens koushites, les ruines du complexe de temples de Musawwarat es-Sufra restent un spectacle impressionnant. Le Grand Réservoir d'eau construit à côté du site, l'un des plus grands [Glossary( 'hafirs', 'HAFIR_GLOSS' )] jamais construits, est encore utilisé par les habitants et les pasteurs qui traversent la région."
 building_RICE_nubia_musawwarat_es_sufra:0 "$building_type_RICE_nubia_musawwarat_es_sufra$"
 building_RICE_nubia_musawwarat_es_sufra_desc:0 "$building_type_RICE_nubia_musawwarat_es_sufra_desc$"
 building_type_RICE_nubia_faras_cathedral:0 "Cathédrale de Faras"
 building_type_RICE_nubia_faras_cathedral_desc:0 "Le christianisme s'est d'abord implanté en Nubie au VIe siècle dans la région de Nobatie ; la cathédrale originelle de Faras fut construite à cette époque en tant que siège du diocèse copte de Faras. Au fil des siècles, elle a subi de nombreux changements et agrandissements, et elle est remarquable pour ses magnifiques peintures murales d'une grande valeur artistique, qui représentent des figures allant des saints aux rois et reines contemporains."
 building_RICE_nubia_faras_cathedral:0 "$building_type_RICE_nubia_faras_cathedral$"
 building_RICE_nubia_faras_cathedral_desc:0 "$building_type_RICE_nubia_faras_cathedral_desc$"
 building_type_RICE_nubia_pyramids_of_meroe:0 "Pyramides de Méroé"
 building_type_RICE_nubia_pyramids_of_meroe_desc:0 "Les cimetières royaux des rois koushites se trouvent près de leur ancienne capitale de Méroé. Les rois koushites ont construit de nombreuses pyramides, encore plus que leurs célèbres voisins égyptiens."
 building_RICE_nubia_pyramids_of_meroe:0 "$building_type_RICE_nubia_pyramids_of_meroe$"
 building_RICE_nubia_pyramids_of_meroe_desc:0 "$building_type_RICE_nubia_pyramids_of_meroe_desc$"
 building_type_RICE_nubia_nuba_mountain_mines_01:0 "Mines d'or des monts Nouba"
 building_type_RICE_nubia_nuba_mountain_mines_01_desc:0 "Depuis les temps anciens, la Nubie est une source célèbre d'or précieux ; les hautes terres des monts Nouba, connues sous le nom de #italic al-Ahdin#! par les Arabes, abritent un certain nombre de riches mines d'or pur et de fer."
 building_RICE_nubia_nuba_mountain_mines_01:0 "Colonie minière des monts Nouba"
 building_RICE_nubia_nuba_mountain_mines_01_desc:0 "$building_type_RICE_nubia_nuba_mountain_mines_01_desc$"
 building_RICE_nubia_nuba_mountain_mines_02:0 "Mine des monts Nouba"
 building_RICE_nubia_nuba_mountain_mines_02_desc:1 "$building_rammelsberg_mines_02_desc$"
 building_RICE_nubia_nuba_mountain_mines_03:0 "Grande mine des monts Nouba"
 building_RICE_nubia_nuba_mountain_mines_03_desc:0 "$building_rammelsberg_mines_03_desc$"
 building_RICE_nubia_nuba_mountain_mines_04:0 "Complexe minier des monts Nouba"
 building_RICE_nubia_nuba_mountain_mines_04_desc:0 "$building_rammelsberg_mines_04_desc$"
 building_type_RICE_nubia_soba_cathedral:0 "Cathédrale de Soba"
 building_type_RICE_nubia_soba_cathedral_desc:0 "Le complexe religieux de Soba est un témoignage de la gloire de la Chrétienté, et de la manière dont l'Évangile s'est répandu jusqu'aux savanes les plus méridionales d'Afrique. On dit que même les infidèles s'émerveillent devant ces vastes églises dorées, pleines de richesses et de jardins, d'une beauté inégalée."
 building_RICE_nubia_soba_cathedral:0 "$building_type_RICE_nubia_soba_cathedral$"
 building_RICE_nubia_soba_cathedral_desc:0 "$building_type_RICE_nubia_soba_cathedral_desc$"
 building_type_RICE_nubia_khawr_nubt:0 "Nécropole de $b_khawr_nubt$"
 building_type_RICE_nubia_khawr_nubt_desc:0 "$b_khawr_nubt$ a servi de centre régional de pouvoir pendant des siècles. Pendant des générations, des dirigeants et d'autres chefs estimés de diverses croyances et confessions ont été inhumés ici dans des tumuli de pierre, en particulier dans le style #italic akerataheil#!, attestant de la diversité religieuse et de la prospérité économique de la région."
 building_RICE_nubia_khawr_nubt:0 "$building_type_RICE_nubia_khawr_nubt$"
 building_RICE_nubia_khawr_nubt_desc:0 "$building_type_RICE_nubia_khawr_nubt_desc$"
 building_type_RICE_nubia_dar_wona:0 "Palais de pierre de Dar Wona"
 building_type_RICE_nubia_dar_wona_desc:0 "Dans le folklore local, le palais de Dar Wona, situé dans les montagnes du Darfour, aurait été construit il y a des générations par des souverains légendaires dont les noms sont à peine rappelés, voire pas du tout. Ses murs de pierre sont imposants et donnent l'impression d'une structure ancienne qui résistera à l'épreuve du temps."
 building_RICE_nubia_dar_wona:0 "$building_type_RICE_nubia_dar_wona$"
 building_RICE_nubia_dar_wona_desc:0 "$building_type_RICE_nubia_dar_wona_desc$"

