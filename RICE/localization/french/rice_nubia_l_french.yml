 nubia.0210.t:0 "Préparatifs"
 nubia.0210.desc:0 "Dans notre société, rien ne démontre davantage la valeur d'une personne que le bétail. Celui qui possède du bétail détient la richesse ; celui qui possède du bétail a un statut ; celui qui possède du bétail est un chef.\n\nAinsi, ceux qui recherchent le conseil et les bénédictions des ancêtres et de [ROOT.Char.GetFaith.HighGodName], souhaitent demander leur protection contre une calamité, ou même veulent simplement accomplir une cérémonie religieuse, doivent sacrifier leurs possessions les plus précieuses pour démontrer leur sincérité : leur bétail.\n\nSelon nos traditions, j'ai fait les préparatifs pour un sacrifice bovin, et me suis rassemblé avec les [ROOT.Char.Custom('DefaultPriestTitlePlural')] pour accomplir ce rite important. La seule question qui demeure est : que cherché-je auprès de mes ancêtres et de [ROOT.Char.GetFaith.HighGodName] ?"
 nubia.0210.a:0 "[diplomacy_i|E] L'harmonie les uns avec les autres"
 nubia.0210.a.tooltip:0 "Les chances d'obtenir un [character_modifier|E] #P positif#! sont basées sur votre [diplomacy_i|El] [diplomacy|El], [piety_level|El], [prestige_level|El], et [legitimacy_level|El]"
 nubia.0210.b:0 "[martial_i|E] La force de nous protéger nous-mêmes"
 nubia.0210.b.tooltip:0 "Les chances d'obtenir un [character_modifier|El] #P positif#! sont basées sur votre [martial_i|El] [martial|El], [piety_level|El], [prestige_level|El], et [legitimacy_level|El]"
 nubia.0210.c:0 "[stewardship_i|E] Prospérité et abondance"
 nubia.0210.c.tooltip:0 "Les chances d'obtenir un [character_modifier|El] #P positif#! sont basées sur votre [stewardship_i|El] [stewardship|El], [piety_level|El], [prestige_level|El], et [legitimacy_level|El]"
 nubia.0210.d:0 "[intrigue_i|E] La santé pour tous dans notre communauté"
 nubia.0210.d.tooltip:0 "Les chances d'obtenir un [character_modifier|E] #P positif#! sont basées sur votre [intrigue_i|El] [intrigue|El], [piety_level|El], [prestige_level|El], et [legitimacy_level|El]"
 nubia.0210.e:0 "[learning_i|E] Approbation et bénédictions des ancêtres"
 nubia.0210.e.tooltip:0 "Les chances d'obtenir un [character_modifier|El] #P positif#! sont basées sur votre [learning_i|El] [learning|El], [piety_level|El], [prestige_level|El], et [legitimacy_level|El]"
 nubia.0211.t:0 "Le rituel"
 nubia.0211.desc:0 "J'ai amené l'un de mes plus beaux bovins pour le sacrifice d'aujourd'hui : puissent les ancêtres et [ROOT.Char.GetFaith.HighGodName] être satisfaits de voir leur sang versé !\n\nAlors que nous saupoudrons de cendre la bête, les anciens et les [ROOT.Char.Custom('DefaultPriestTitlePlural')] mènent les prières. Puis, l'un d'entre eux a l'honneur de tuer rituellement l'animal en lui enfonçant une lance dans le cœur.\n\nAprès cela, et après d'autres prières, de la musique rituelle et des danses, nous partagerons la viande de la bête. Après la cérémonie de sacrifice,"
 nubia.0211.desc.bad:0 "malheureusement, les anciens et [ROOT.Char.Custom('DefaultPriestTitlePlural')] expriment des doutes quant à savoir si les ancêtres et [ROOT.Char.GetFaith.HighGodName] ont trouvé ce sacrifice satisfaisant, mais je suppose qu'il vaut mieux faire quelque sacrifice que pas de sacrifice du tout."
 nubia.0211.desc.good:0 "les anciens et [ROOT.Char.Custom('DefaultPriestTitlePlural')] m'ont dit qu'il semble que les ancêtres et [ROOT.Char.GetFaith.HighGodName] ont trouvé ce sacrifice satisfaisant, et qu'ils nous assisteront pour tous les problèmes que nous leur avons soumis."
 nubia.0211.a:0 "Puissent-ils continuer à veiller sur nous malgré tout."
