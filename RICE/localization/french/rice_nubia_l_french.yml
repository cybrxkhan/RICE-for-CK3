 RICE_baqt_frontier_process_desc: "$RICE_baqt_frontier_process_name$"
 RICE_baqt_frontier_process_tooltip:"#italic Les officiers frontaliers doivent constamment examiner les plaintes, requêtes et autres documents rédigés par les personnes qui traversent la frontière, ou qui possèdent des biens ou des relations des deux côtés. La paperasse finira-t-elle un jour ?#!"
 RICE_baqt_frontier_process_effect_1_tt:"Contrairement aux autres tâches, celle-ci n'a pas de résultat de succès ou d'échec ; à la place, vous gagnez #V plus#! d'[trait_level_track_xp|El] dans les [traits|El] pertinents que les autres options"
