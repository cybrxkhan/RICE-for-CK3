 RICE_nubia_aspiration_nahid_al_dawla_desc:"\n\n#bold [historical_aspiration_main_objectives|E]#!\n$EFFECT_LIST_BULLET$Assurez-vous que #V Nasir al-Dawla#!, #V Yaldakush#!, #V Ildekuz#! et #V Badr al-Jamali#! soient morts, sont vos [vassals|El] ou [allies|El], ou ne possèdent aucun [titles|El]\n$EFFECT_LIST_BULLET$Restez un [vassal|El] de [GetTitleByKey('k_egypt').GetNameNoTier]\n$EFFECT_LIST_BULLET$Assurez-vous que #V Rasad#!, la reine mère, ou vous êtes le [regent|El] de [GetTitleByKey('k_egypt').GetNameNoTier]\n$EFFECT_LIST_BULLET$Le [holder|El] de [GetTitleByKey('k_egypt').GetNameNoTier] doit contrôler complètement la [region|El] de l'[GetGeographicalRegion('custom_roman_aegyptus').GetName]\n\n#bold Récompenses#!\n$EFFECT_LIST_BULLET$Gain de @gold_icon! #V [EmptyScope.ScriptValue('RICE_aspiration_medium_resource_bonus')]#! d'[gold|El]\n$EFFECT_LIST_BULLET$La [situation|El] du [RICE_baqt|El] de la [region|El] de l'#V Égypte#! progresse automatiquement vers la [situation_phase|El] [RICE_baqt_accord|E] si elle est dans la [situation_phase|El] [RICE_baqt_discord|E]\n$EFFECT_LIST_BULLET$Recevez #V 2000#! [special_troops|El], dont quelques [men_at_arms|El]\n$EFFECT_LIST_BULLET$Gagnez un [perk|El] de [martial_lifestyle|El] et de [intrigue_lifestyle|El]\n\n#bold [historical_aspiration_bonus_objectives|E]#!\n$EFFECT_LIST_BULLET$Assurez-vous que vous ou la reine mère #V Rasad#! êtes le [entrenched_regent|El] de [GetTitleByKey('k_egypt').GetNameNoTier] (Récompense : Gain de @gold_icon! #V [EmptyScope.ScriptValue('RICE_aspiration_medium_resource_bonus')]#! d'[gold|El])\n$EFFECT_LIST_BULLET$Faites en sorte que votre [liege|El] ait au moins  [opinion_i|El] #P 75#! d'[opinion|El] envers vous ou soit votre [friend|El] (Récompense : Gain de @legitimacy_icon! #V [EmptyScope.ScriptValue('medium_legitimacy_gain')]#! de [legitimacy|El])\n$EFFECT_LIST_BULLET$Ayez une [alliance|El] avec un [ruler|El] étranger de [rank|El] [king|El] ou supérieur (Récompense : Gain de @prestige_icon! #V [EmptyScope.ScriptValue('RICE_aspiration_large_resource_bonus')]#! de [prestige|El])"
 RICE_nubia_historical_aspiration_action_nahid_al_dawla:"#italic Le royaume fatimide s'effondre alors que des unités militaires rivales et des factions se disputent l'Égypte. Que vos motivations soient honorables ou non, en tant que commandant majeur des unités africaines, vous ferez ce qu'il faut non seulement pour restaurer l'ordre le long du Nil, mais aussi pour éliminer toute menace envers les unités africaines et leur alliée, la reine mère Rasad.#!$RICE_nubia_aspiration_nahid_al_dawla_desc$"
 RICE_nubia_historical_aspiration_modifier_desc_nahid_al_dawla: "[GetModifier('RICE_nubia_aspiration_become_egypts_military_dictator_nahid_al_dawla').GetNameWithTooltip]" 
 RICE_nubia_aspiration_badr_al_jamali_desc:"\n\n#bold [historical_aspiration_main_objectives|E]#!\n$EFFECT_LIST_BULLET$Assurez-vous que #V Nasir al-Dawla#!, #V Yaldakush#!, #V Ildekuz#! et #V Nahid al-Dawla#! soient morts, sont vos [vassals|El] ou [allies|El], ou ne possèdent aucun [titles|El]$RICE_nubia_aspiration_fatimid_turks_desc$"
 RICE_nubia_historical_aspiration_action_badr_al_jamali:"#italic Le royaume fatimide s'effondre alors que des unités militaires rivales et des factions se disputent l'Égypte. Que vos motivations soient honorables ou non, en tant que commandant majeur au Levant, vous ferez ce qu'il faut pour éliminer vos rivaux, restaurer l'ordre le long du Nil et devenir le régent tout-puissant des Califes.#!$RICE_nubia_aspiration_badr_al_jamali_desc$"
 RICE_nubia_historical_aspiration_modifier_desc_badr_al_jamali: "[GetModifier('RICE_nubia_aspiration_become_egypts_military_dictator_badr_al_jamali').GetNameWithTooltip]" 

 # Aspiration Modifiers
 RICE_nubia_aspiration_defeat_the_traitor_and_the_bandit:"[RICE_aspiration|E] : Vaincre le Traître et le Bandit"
 RICE_nubia_aspiration_defeat_the_traitor_and_the_bandit_desc:"#italic Le roi Georgios envoya son neveu, Niuty, avec une armée pour vaincre le seigneur de guerre pillard al-Umari, mais le traître Prince a levé son étendard en rébellion. Que ce soit par la ruse, la diplomatie ou la bataille, ces deux fauteurs de troubles - le traître et le bandit - doivent être matés, si l'ordre doit être restauré en Makurie !#!$RICE_nubia_aspiration_georgios_867_desc$\n\n"
 RICE_nubia_aspiration_take_over_makuria:"[RICE_aspiration|E] : Prendre le contrôle de la Makurie et pacifier ses frontières"
 RICE_nubia_aspiration_take_over_makuria_desc:"#italic L'oncle de Niuty, Georgios, l'a envoyé avec une armée pour vaincre le seigneur de guerre pillard al-Umari, mais il a réalisé que son oncle est un vieux roi indigne et gâteux. Le trône de Makurie appartient à un homme d'action rusé, et c'est lui qui triomphera d'al-Umari et apportera un nouvel âge de splendeur à Makurie !#!$RICE_nubia_aspiration_niuty_desc$\n\n"
 RICE_nubia_aspiration_ascend_bureaucracy_makuria:"[RICE_aspiration|E] : Gravir l'échelle bureaucratique de Makurie"
 RICE_nubia_aspiration_ascend_bureaucracy_makuria_desc:"#italic Après avoir commencé comme modeste fonctionnaire agricole à [GetTitleByKey('c_sai').GetNameNoTier], Merki a lentement gravi les échelons de l'administration de Makurie - avec ses compétences en agriculture et en finances, il cherche à monter encore plus haut.#!$RICE_nubia_aspiration_merki_desc$\n\n"
 RICE_nubia_aspiration_daju_migration_into_darfur:"[RICE_aspiration|E] : Mener la migration Daju vers le Darfour"
 RICE_nubia_aspiration_daju_migration_into_darfur_desc:"#italic Sous votre direction, les tribus Daju ont commencé à migrer vers l'ouest depuis la Nubie. Le moment venu, le Darfour deviendra la nouvelle patrie de votre peuple.#!$RICE_nubia_aspiration_kusbur_desc$\n\n"
 RICE_nubia_aspiration_revive_nubia:"[RICE_aspiration|E] : Raviver la Nubie"
 RICE_nubia_aspiration_revive_nubia_desc:"#italic Le royaume de Moses Georgios est dévasté par les récentes attaques de l'Égypte, et la Nubie est menacée par des ennemis extérieurs et intérieurs. Il est parfaitement conscient que la Nubie doit se reconstruire et se préparer afin de pouvoir résister à sa prochaine crise.#!$RICE_nubia_aspiration_moses_georgios_desc$\n\n"
 RICE_nubia_aspiration_look_after_nubia_frontier:"[RICE_aspiration|E] : Veiller sur la frontière de Nubie"
 RICE_nubia_aspiration_look_after_nubia_frontier_desc:"#italic L'effondrement des Fatimides et les récentes guerres entre l'Égypte et la Nubie ont laissé les frontières septentrionales de cette dernière affaiblies. En tant qu'Éparque nouvellement nommé de Nobatie, le devoir d'Adam est de protéger les frontières nord de la Nubie et de renforcer les liens économiques et diplomatiques de la Nubie avec l'Égypte.#!$RICE_nubia_aspiration_eparch_adam_desc$\n\n"
 RICE_nubia_aspiration_spread_stories_tribe_of_dan:"[RICE_aspiration|E] : Répandre les légendes de la Tribu de Dan"
 RICE_nubia_aspiration_spread_stories_tribe_of_dan_desc:"#italic Certains Juifs croient les récits d'Eldad selon lesquels il descend de la Tribu de Dan qui s'est installée au cœur de l'Afrique, mais d'autres sont sceptiques et pensent qu'il est un imposteur. Quoi qu'il en soit, il espère visiter de nombreuses communautés juives à travers le monde pour leur raconter ses histoires inspirantes et fascinantes.#!$RICE_nubia_aspiration_eldad_desc$\n\n"
 RICE_nubia_aspiration_become_egypts_military_dictator_nasir_al_dawla:"[RICE_aspiration|E] : Devenir le dictateur militaire de l'Égypte"
 RICE_nubia_aspiration_become_egypts_military_dictator_nasir_al_dawla_desc:"#italic Le royaume fatimide s'effondre alors que des unités militaires et des factions rivales se disputent l'Égypte. Que Nasir al-Dawla ait des motivations honorables ou non, en tant que commandant majeur des unités turques, il fera tout ce qu'il faut pour éliminer ses rivaux, restaurer l'ordre le long du Nil et devenir le régent tout-puissant des Califes.#!$RICE_nubia_aspiration_nasir_al_dawla_desc$\n\n"
 RICE_nubia_aspiration_become_egypts_military_dictator_yaldakush:"[RICE_aspiration|E] : Devenir le dictateur militaire de l'Égypte"
 RICE_nubia_aspiration_become_egypts_military_dictator_yaldakush_desc:"#italic Le royaume fatimide s'effondre alors que des unités militaires et des factions rivales se disputent l'Égypte. Que Yaldakush ait des motivations honorables ou non, en tant que commandant majeur des unités turques, il fera tout ce qu'il faut pour éliminer ses rivaux, restaurer l'ordre le long du Nil et devenir le régent tout-puissant des Califes.#!$RICE_nubia_aspiration_yaldakush_desc$\n\n"
 RICE_nubia_aspiration_become_egypts_military_dictator_ildekuz:"[RICE_aspiration|E] : Devenir le dictateur militaire de l'Égypte"
 RICE_nubia_aspiration_become_egypts_military_dictator_ildekuz_desc:"#italic Le royaume fatimide s'effondre alors que des unités militaires et des factions rivales se disputent l'Égypte. Que les motivations d'Ildekuz soient honorables ou non, en tant que commandant majeur des unités turques, il fera ce qu'il faut pour éliminer ses rivaux, restaurer l'ordre le long du Nil et devenir le régent tout-puissant des Califes.#!$RICE_nubia_aspiration_ildekuz_desc$\n\n"
 RICE_nubia_aspiration_become_egypts_military_dictator_nahid_al_dawla:"[RICE_aspiration|E] : Préserver le pouvoir des unités africaines"
 RICE_nubia_aspiration_become_egypts_military_dictator_nahid_al_dawla_desc:"#italic Le royaume fatimide s'effondre tandis que des unités militaires et des factions rivales se battent pour l'Égypte. Que Nahid al-Dawla ait des motivations honorables ou non, en tant que commandant majeur des unités africaines, il fera ce qu'il faut non seulement pour restaurer l'ordre le long du Nil, mais aussi pour éliminer toute menace envers les unités africaines et leur alliée, la reine mère Rasad.#!$RICE_nubia_aspiration_nahid_al_dawla_desc$\n\n"
 RICE_nubia_aspiration_become_egypts_military_dictator_badr_al_jamali:"[RICE_aspiration|E] : Devenir le dictateur militaire de l'Égypte"
 RICE_nubia_aspiration_become_egypts_military_dictator_badr_al_jamali_desc:"#italic Le royaume fatimide s'effondre alors que des unités militaires et des factions rivales se disputent l'Égypte. Que Badr al-Jamali ait des motivations honorables ou non, en tant que commandant majeur au Levant, il fera tout ce qu'il faut pour éliminer ses rivaux, restaurer l'ordre le long du Nil et devenir le régent tout-puissant des Califes.#!$RICE_nubia_aspiration_badr_al_jamali_desc$\n\n"
 
