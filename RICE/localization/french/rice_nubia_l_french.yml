 nubia.0120.t:0 "Une promotion bureaucratique ordinaire"
 nubia.0120.desc:0 "Enfin, la fenêtre d'opportunité que j'attendais.\n\nAuparavant, je n'étais qu'un simple [Glossary( 'notarios', 'NOTARIOS_GLOSS' )], rien de plus qu'un scribe médiocre. Pourtant, grâce à mon travail acharné, et peut-être grâce à la reconnaissance de mes supérieurs pour mes compétences en matières agricoles et financières, j'ai désormais été promu à un poste plus élevé.\n\nPeut-être, cependant, puis-je gravir les échelons encore plus haut, peut-être même attirer l'attention du roi. Ai-je l'ambition, la compétence dans les aptitudes attendues d'un bureaucrate makurien ? Je pense que oui.\n\nRetenez bien mes mots - ceci n'est que le début de la carrière de [merki.GetFirstName], et je ferai ce que je peux pour m'assurer que lorsque je mourrai, dans de nombreuses années, mon épitaphe retracera la carrière d'un[merki.Custom('FR_E')] grand[merki.Custom('FR_E')] [merki.GetWomanMan], un officiel qui a laissé son empreinte sur cette terre bénie."
 nubia.0120.a:0 "Puisse [merki.GetFaith.HighGodName] m'aider à avancer dans ma carrière."
 nubia.0120.info:0 "#emphasis Contexte historique :#! Merki était un fonctionnaire civil peu connu de Makurie à la fin du IXe siècle, dont la remarquable carrière est attestée dans son épitaphe. Il s'éleva d'un modeste poste de fonctionnaire de village pour devenir un membre de l'entourage proche du roi, en charge des affaires financières et agricoles, bien que la nature exacte de ses différentes fonctions reste incertaine.\n\nLa vie de Merki pose une question intéressante aux chercheurs sur la nature du gouvernement makurien : sa trajectoire indique-t-elle un certain degré de mobilité sociale en Makurie, ou était-il un noble privilégié qui suivit l'équivalent du cursus honorum romain, une série prédéterminée de fonctions pour les aristocrates cherchant une carrière politique ?"
 nubia.0121.t:0 "$RICE_historical_aspiration_fulfilled_title$"
 nubia.0121.desc:0 "Quand je repense à ma carrière de bureaucrate dans le royaume de Makurie, je vois le parcours d'un jeune homme ambitieux et énergique qui s'est transformé d'un simple scribe en un puissant officiel, respecté de tous, y compris de notre roi, [makurian_king.GetFirstName]. Ce fut un parcours rempli de hauts et de bas, et d'innombrables jours et nuits de lutte, des défis de la paperasserie insipide aux maux de tête de la politique bureaucratique et courtisane.\n\nPourtant, ce fut un parcours qui en valait la peine. Regardez où je me trouve maintenant, tout ce succès !\n\nQuand j'étais plus jeune, je fantasmais sur la façon dont les gens se souviendraient de moi après ma mort. Maintenant, en vieillissant, et alors que la mort est toujours plus proche, je suis certain que mon épitaphe - quand elle sera gravée - consignera bien la carrière d'un[merki.Custom('FR_E')] grand[merki.Custom('FR_E')] [merki.GetWomanMan], un officiel qui a laissé son empreinte sur cette terre bénie."
 nubia.0121.a:0 "Louons [merki.GetFaith.HighGodName] pour m'avoir guidé dans ma carrière."
 nubia.0122.t:0 "La Migration [daju.GetNameNoTooltip]"
 nubia.0122.desc:0 "Il y a des années, notre ancien foyer en [GetGeographicalRegion('RICE_greater_nubia_region').GetName] ne ressemblait plus à un foyer, en raison de diverses calamités. Nous, les [daju.GetCollectiveNoun], avons dû partir et trouver un nouveau foyer.\n\nSous ma direction, nos clans ont migré vers l'ouest, loin des rives du Nil, et à travers de nombreuses montagnes et déserts jusqu'à ce que nous arrivions dans une terre de grande promesse. [GetTitleByKey('d_darfur').GetNameNoTier] est une terre rude, mais il y a des endroits où nous pouvons cultiver des récoltes, faire paître nos troupeaux et chasser du gibier.\n\nLes tribus locales [tora.GetName] se sont méfiées de nous depuis notre arrivée ici. Ce sont de grands bâtisseurs, qui construisent d'impressionnants palais et forts de pierre dans les montagnes, mais je sais que nous pouvons maîtriser et améliorer leurs méthodes. De plus, j'ai confiance en la force de nos guerriers, car si nous devons entrer en conflit avec ces [tora.GetCollectiveNoun], nous l'emporterons."
 nubia.0122.a:0 "Nous ferons de cette terre notre nouveau foyer."
 nubia.0122.info:0 "#emphasis Contexte historique :#! Il existe différentes légendes contradictoires que le peuple Daju raconte sur ses origines et sur la manière dont il est arrivé au Darfour. Dans une version, leur troisième roi était Zalaf ou Khalaf, un lieutenant d'Alexandre le Grand, d'origines orientales. Dans d'autres versions de la légende, ils auraient migré à un moment donné, il y a des siècles, vers le XIIe siècle, au Darfour depuis quelque part en Nubie, aux alentours de #italic Shendi#!, qui se trouve près de l'ancienne capitale koushite de Méroé. Dans une variante de cette légende, le souverain qui mena cette migration et devint le premier roi des Daju était un certain Kusbur."
 nubia.0123.t:0 "$RICE_historical_aspiration_fulfilled_title$"
 nubia.0123.desc:0 "Le voyage que nous avons entrepris depuis notre ancien foyer en [GetGeographicalRegion('RICE_greater_nubia_region').GetName] ne s'est pas terminé lorsque nous sommes arrivés dans les collines et montagnes promises du [GetTitleByKey('d_darfur').GetNameNoTier]. Créer un nouveau foyer et poser les fondations de l'avenir de notre tribu faisait aussi partie du voyage.\n\nJ'ai des raisons de croire que le voyage du peuple [daju.GetName] vers la découverte et l'établissement d'un nouveau foyer est enfin arrivé à son terme. Sous ma direction, nous nous sommes imposés comme le groupe le plus puissant de cette région, et les [tora.GetCollectiveNoun] qui dominaient autrefois ici reconnaissent ou craignent notre pouvoir, ou se sont retirés ailleurs.\n\nNous sommes les nouveaux maîtres de ces montagnes, et je suis le premier véritable roi de ces terres. Je ne doute pas que mes exploits héroïques seront rappelés pour les générations à venir dans les légendes de notre peuple !"
 nubia.0123.a:0 "Puissent nos descendants vivre ici pendant des générations !"
 nubia.0124.t:0 "Un bref répit"
 nubia.0124.desc.intro:0 "Seul un imbécile croit qu'un accord stipulant la paix entre deux royaumes durera longtemps. Le [RICE_baqt_treaty|El] entre l'Égypte et la Nubie en est un excellent exemple.\n\nPar exemple, peu importe qui a causé la guerre entre les Égyptiens, menés par [saladin.GetNickname], et nous autres Nubiens. Nos terres ont toutes deux été dévastées par le pillage et les raids - même notre capitale a souffert pendant un certain temps - malgré le fait que les deux camps étaient encore liés par le #italic Baqt#! signé par nos prédécesseurs il y a des siècles.\n\n"
 nubia.0124.desc:0 "$nubia.0124.desc.intro$La trêve que [saladin.GetNicknameNoTooltip] et moi avons fini par conclure il y a quelques années n'est, je le crains, qu'un simple répit, et la guerre pourrait de nouveau frapper ces terres un jour. Néanmoins, un bref répit reste un répit ; je suis [ROOT.Char.GetTitleAsNameNoTooltip] depuis de nombreuses années, et je sais par expérience que nous devons saisir chaque occasion qui se présente. Nous #italic devons#! reconstruire la Nubie après les récents tumultes, afin qu'elle puisse prospérer et s'épanouir pour les générations futures."
 nubia.0124.a:0 "Une tâche difficile, mais cela peut être fait. Cela #italic doit#! être fait."
 nubia.0124.info:0 "#emphasis Contexte historique :#! Moïse Georgios était un roi nubien attesté du milieu des années 1150 jusqu'aux environs de 1190. Sur la base de diverses preuves, la plupart des chercheurs pensent qu'il régnait à la fois sur la Makurie et l'Alodie, mais sont moins certains de la manière dont les deux royaumes se sont unifiés.\n\nUn événement majeur durant la vie de Moïse Georgios fut la guerre de la Nubie contre la dynastie ayyoubide d'Égypte, nouvellement ascendante sous Saladin. Le casus belli est incertain et pourrait être dû à des raids que chaque camp menait contre l'autre, ou au souhait des Nubiens d'aider les Fatimides que Saladin avait renversés. Supposément, Saladin envoya un émissaire à Moïse Georgios lui demandant de se convertir à l'islam, mais le roi s'en moqua et imprima de force une croix au fer rouge sur la main de l'émissaire.\n\nDes années de raids et d'attaques entraînèrent destructions et pertes des deux côtés, y compris un assaut sur Faras qui causa la mort de l'évêque de la ville. Bien que les Ayyoubides se soient finalement retirés après la mort de leur commandant kurde, Ibrahim al-Kurdi, lorsqu'il se noya en tentant de traverser le Nil, la guerre eut peut-être des répercussions à long terme, étant l'une des causes du déclin ultérieur de la Nubie aux XIIIe et XIVe siècles."
 nubia.0125.t:0 "$RICE_historical_aspiration_fulfilled_title$"
 nubia.0125.desc:0 "Certains en Nubie pensaient que des jours sombres nous attendaient lorsque nous avons affronté les redoutables armées des Égyptiens menées par [saladin.GetNickname]. Je ne les blâme pas. Pourtant, dans cette guerre, n'avons-nous pas aussi infligé grande douleur et terreur aux Égyptiens lors de nos raids et attaques ? N'est-ce pas [saladin.GetNicknameNoTooltip], qui avait brillamment vaincu les Croisés, qui chercha une paix blanche avec nous ? Nous étions forts alors, et nous sommes forts maintenant.\n\nLa guerre nous a dévastés, oui, mais ce fut aussi une opportunité de reconstruire la Nubie. Nous avons restauré nos cités et nos [ROOT.Char.GetFaith.HouseOfWorship], cultivé la générosité des récoltes du Nil, et revigoré notre armée et notre contrôle sur les tribus mineures qui avaient commencé à remettre en question notre autorité.\n\nSous ma direction, la Nubie n'a pas seulement survécu, mais s'est relevée. Des traités de paix comme le #italic Baqt#! ne pourront jamais nous apporter une paix durable, mais notre prospérité et notre puissance feront réfléchir à deux fois nos voisins avant de trahir leurs accords avec nous."
 nubia.0125.a:0 "La Nubie est plus forte que jamais !"
 nubia.0126.t:0 "$nubia.0124.t$"
 nubia.0126.desc:0 "$nubia.0124.desc.intro$Les deux camps savent bien que la trêve que [moses_georgios.GetTitledFirstName] et [saladin.GetNicknameNoTooltip] ont finalement conclue il y a quelques années n'est qu'un simple répit. J'ai été nommé [Glossary( 'éparque de Nobatie', 'LORD_OF_THE_MOUNTAIN_GLOSS' )] il n'y a pas si longtemps, et [moses_georgios.GetFirstNameNoTooltip] m'a accordé une grande confiance pour remplir mon devoir de défendre et reconstruire notre frontière nord avec l'Égypte, que les Égyptiens viennent à nous en paix ou non."
 nubia.0126.a:0 "Je ne faillirai pas à notre [moses_georgios.GetTitleAsNameNoTooltip] !"
 nubia.0126.info:0 "#emphasis Contexte historique :#! De toutes les fonctions que nous connaissons dans la Nubie médiévale, celle qui est la mieux attestée dans les sources documentaires après celle du roi makurite pourrait être celle des [Glossary( 'éparques de Nobatie', 'LORD_OF_THE_MOUNTAIN_GLOSS' )], qui géraient la frontière nord de la Nubie avec l'Égypte et le [RICE_baqt|El] du côté nubien. Adam était l'Éparque de Nobatie attesté dans les années 1180 et 1190 à travers un certain nombre de documents, comme l'achat de terre par sa fille Neuesi auprès d'une femme locale, Kapopi. La prépondérance de documents portant le nom d'Adam suggère qu'il était fortement impliqué dans les cercles d'élite de Nobatie."
 nubia.0127.t:0 "$RICE_historical_aspiration_fulfilled_title$"
 nubia.0127.desc:0 "Depuis que le [RICE_baqt_treaty|E] a vu le jour, et peut-être même avant, nous [Glossary( 'éparques de Nobatie', 'LORD_OF_THE_MOUNTAIN_GLOSS' )] avons monté la garde sur la frontière nord de la Nubie. Notre position était si prestigieuse que nous n'étions seconds en pouvoir qu'après les rois que nous servions.\n\nSi certains conçoivent la protection de la frontière en termes de défense contre les raids et les invasions, c'est bien plus que cela : c'est l'art de mener une diplomatie tendue mais bénéfique entre de puissants Nubiens et Égyptiens ; c'est le labeur d'encourager le commerce et de faire croître l'économie de notre royaume ; et c'est la monotonie parfois écrasante de traiter des documents jour après jour en tant que bureaucrate de haut rang.\n\nMes subordonnés et moi avons accompli ces devoirs du mieux que nous pouvions au fil des années, et nous voyons maintenant les fruits de notre labeur. La frontière nord de la Nubie reprend vie après toutes les guerres et les troubles, et je ne doute pas qu'elle continuera de prospérer pour les années à venir."
 nubia.0127.a:0 "Puissent les futurs éparques apprendre de mon exemple."
