 nubia.0041.baqt.intro:0 "Depuis des générations, les dirigeants d'Égypte et de Nubie ont périodiquement échangé des biens précieux en guise de gestes diplomatiques de bonne volonté, une coutume qui dérive de l'ancien [RICE_baqt_treaty|El]."
 nubia.0041.baqt.intro2:0 "À la suite d'échanges diplomatiques entre [other.GetTitledFirstName] et moi-même, nos représentants se sont rencontrés près de la première cataracte, un peu au sud de [GetTitleByKey('c_aswan').GetNameNoTier]. Quelles que soient les circonstances politiques actuelles, cette zone est considérée comme un no man's land où les échanges de #italic baqt#! peuvent avoir lieu.\n\n"
 nubia.0041.baqt.conclusion:0 "Et ainsi, la paix régnera entre nous. Je ne peux qu'espérer que ses intentions sont sincères, et que nos deux camps continuent de faire preuve de respect mutuel l'un envers l'autre."
 nubia.0041.t:0 "$nubia.0040.t$"
 nubia.0041.desc.actor:0 "Conformément aux termes du #italic baqt#!, nous avons convenu d'un échange équitable de biens après quelques négociations. Je lui donnerai [actor.Custom('RICE_nubia_baqt_good')], et [recipient.GetSheHe] me donnera [recipient.Custom('RICE_nubia_baqt_good')]."
 nubia.0041.desc.recipient:0 "Conformément aux termes du #italic baqt#!, nous avons convenu d'un échange équitable de biens après quelques négociations. Je lui donnerai [recipient.Custom('RICE_nubia_baqt_good')], et [actor.GetSheHe] me donnera [actor.Custom('RICE_nubia_baqt_good')]."
 nubia.0041.a:0 "Que [ROOT.Char.GetFaith.HighGodName] protège notre paix..."
 nubia.0042.t:0 "Un paiement du Baqt"
 nubia.0042.desc.actor:0 "Comme nous en avions convenu, selon les termes du #italic baqt#!, j'ai offert à [recipient.GetFirstNameNoTooltip] un cadeau de [actor.Custom('RICE_nubia_baqt_good')]."
 nubia.0042.desc.recipient:0 "Comme nous en avions convenu, selon les termes du #italic baqt#!, [actor.GetFirstNameNoTooltip] m'a fait don de [actor.Custom('RICE_nubia_baqt_good')]."
 nubia.0042.a:0 "$nubia.0041.a$"
 nubia.0043.t:0 "Un don du Baqt"
 nubia.0043.desc.actor:0 "Comme nous en avions convenu, selon les termes du #italic baqt#!, [recipient.GetFirstNameNoTooltip] a accédé à ma demande de me verser un paiement de [recipient.Custom('RICE_nubia_baqt_good')]."
