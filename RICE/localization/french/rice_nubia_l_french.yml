 nubia.0100.t:0 "Le mystérieux Danite"
 nubia.0100.desc:0 "Je suis [ROOT.Char.GetFirstName] [ROOT.Char.GetDynasty.GetName], descendant de membres de la tribu de Dan qui ont fui en Afrique il y a de nombreuses années, et qui a voyagé à travers le monde et vu beaucoup de choses - ou, du moins, c'est ce que je raconte aux autres Juifs, quand je les rencontre au cours de mes voyages.\n\nPeut-être mes histoires sont-elles exagérées ; peut-être contiennent-elles même quelques affabulations ici et là. Mais nous autres Juifs, n'avons-nous pas besoin de ce genre d'histoires pour nous inspirer ? Pour nous encourager ? Pour nous montrer qu'un plus grand destin nous attend ?\n\nPuis il y a la question de mes origines. Que les autres Juifs croient ou non mes histoires, vraies ou fausses, je sais que je suis originaire..."
 nubia.0100.a:0 "Du Yémen, qui a eu des liens avec l'Afrique"
 nubia.0100.b:0 "Des terres au sud de l'Égypte, près de l'Abyssinie"
 nubia.0101.t:0 "$nubia.0100.t$"
 nubia.0101.desc:0 "J'ai parcouru les terres de #italic Koush#! pendant de nombreuses années. J'ai survécu à des naufrages, des cannibales et des esclavagistes adorateurs du feu, qui m'ont amené ici sur les marchés de [ROOT.Char.GetCurrentLocation.GetName], où j'ai été racheté par un marchand juif de passage - un homme envers qui je suis éternellement reconnaissant.\n\nMaintenant, un homme moindre désirerait se retirer pour mener une vie tranquille après ces aventures, mais pas moi ! Je ne suis arrivé aussi loin que grâce à la bienveillance de [ROOT.Char.GetFaith.HighGodName], qui m'a béni, moi, descendant de la Tribu de Dan, à travers ces épreuves.\n\nJ'ai vu ce que [ROOT.Char.GetFaith.HighGodNameAlternate] veut que je fasse : raconter aux autres Juifs ce que j'ai vu et ce que je sais, afin que mes récits inspirent le peuple élu vers un plus grand destin."
 nubia.0101.a:0 "J'accomplirai ce destin, en poursuivant mes aventures."
 nubia.0101.info:0 "$RICE_eldad_ha_dani_decision_context_tooltip$"
