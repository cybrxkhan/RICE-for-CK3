 RICE_tarim_basin_dunhuang_economic_bonus_greater:0 "La cour Tang fournit une assistance commerciale"
 RICE_tarim_basin_dunhuang_economic_bonus_greater_desc:0 "L'auguste dynastie Tang, bien qu'assaillie par divers problèmes et défis, a gracieusement aidé les dirigeants du Circuit de Guiyi à travers un certain nombre de décrets impériaux visant à accroître la prospérité de la région, encourager le commerce, aider les pauvres, et ainsi de suite."
 RICE_tarim_basin_dunhuang_economic_bonus_lesser:0 "$RICE_tarim_basin_dunhuang_economic_bonus_greater$"
 RICE_tarim_basin_dunhuang_economic_bonus_lesser_desc:0 "$RICE_tarim_basin_dunhuang_economic_bonus_greater$"
 RICE_tarim_basin_dunhuang_military_bonus_greater:0 "La cour des Tang fournit une assistance militaire"
 RICE_tarim_basin_dunhuang_military_bonus_greater_desc:0 "Bien que la puissante dynastie Tang soit trop préoccupée par les menaces internes et externes pour fournir de nombreux soldats afin de défendre le Circuit Guiyi, elle a fourni une certaine forme d'aide militaire par le biais de décrets impériaux, comme l'envoi de généraux talentueux, de renseignements utiles sur les armées étrangères, d'équipement militaire, et ainsi de suite."
 RICE_tarim_basin_dunhuang_military_bonus_lesser:0 "$RICE_tarim_basin_dunhuang_military_bonus_greater$"
 RICE_tarim_basin_dunhuang_military_bonus_lesser_desc:0 "$RICE_tarim_basin_dunhuang_military_bonus_greater$"
 RICE_tarim_basin_dunhuang_political_bonus_greater:0 "La cour des Tang fournit une assistance politique"
 RICE_tarim_basin_dunhuang_political_bonus_greater_desc:0 "La glorieuse dynastie Tang doit faire face à de nombreuses difficultés et obstacles alors qu'elle s'enfonce dans le déclin, mais la cour Tang a généreusement accordé à ce personnage et à certains de ses fonctionnaires diverses nominations politiques pour honorer leurs services et, plus important encore, leur a donné des informations utiles sur la situation politique actuelle qui pourraient leur être d'un grand secours."
 RICE_tarim_basin_dunhuang_political_bonus_lesser:0 "$RICE_tarim_basin_dunhuang_political_bonus_greater$"
 RICE_tarim_basin_dunhuang_political_bonus_lesser_desc:0 "$RICE_tarim_basin_dunhuang_political_bonus_greater$"
 RICE_tarim_basin_wrote_first_turkic_dictionary:0 "Rédaction du premier dictionnaire turc"
 RICE_tarim_basin_wrote_first_turkic_dictionary_desc:0 "Ce personnage érudit, fier de son héritage turc, a travaillé dur et longtemps pour produire le premier dictionnaire des langues turques, appelé #bold Diwan Lughat al-Turk#!."
 RICE_tarim_basin_silk_road_entertainer_origin:0 "Artiste de la Route de la soie"
 RICE_tarim_basin_silk_road_entertainer_origin_desc:0 "Cette personne était autrefois un artiste célèbre - peut-être un musicien ou un chanteur - le long de la Route de la soie. Qu'il ait été à l'origine un esclave ou une personne libre (plus souvent le premier cas), il se produisait généralement pour le plaisir des élites, et l'une de ces élites a remarqué ses talents et l'a élevé à un statut plus élevé."
 RICE_tarim_basin_similar_opinions_entertainers:0 "Goûts similaires en divertissement"
 RICE_tarim_basin_honored_entertainer:0 "Honoré d'être remarqué"
 RICE_tarim_basin_allowed_me_marry:0 "Béni soit mon amour"
 RICE_tarim_basin_took_me_as_a_plaything_likes_guy:0 "Jouet involontaire"
 RICE_tarim_basin_protected_me_from_creep:0 "M'a protégé d'un importun"
 RICE_tarim_basin_took_me_as_a_plaything_didnt_like_guy:0 "$RICE_tarim_basin_took_me_as_a_plaything_likes_guy$"
 RICE_tarim_basin_took_away_my_beloved:0 "Vous avez pris ma moitié pour vous"
 RICE_tarim_basin_prevented_me_from_marrying_beloved:0 "M'a empêché d'être avec ma moitié"
 RICE_tarim_basin_unwilling_marriage:0 "Ne souhaitait pas devenir consort"
 RICE_tarim_basin_forced_to_be_consort:0 "M'a forcée à devenir le jouet d'un homme"
 RICE_tarim_basin_attended_ordam_mazar:0 "A récemment assisté à l'Ordam"
 RICE_tarim_basin_attended_ordam_mazar_desc:0 "Cette personne s'est récemment rendue à Kashgar pour rendre hommage au grand martyr de Kashgar dans leur mazar pendant le festival d'Ordam. C'est à la fois un moment de réflexion religieuse et de piété, mais aussi un moment d'excitation et de socialisation avec des personnes de tous horizons."
 RICE_tarim_basin_inspired_by_ali_arslan:0 "Inspiré par le Martyr de Kashgar"
 RICE_tarim_basin_inspired_by_ali_arslan_mom:0 "Inspiré par la Mère du Martyr de Kashgar"
 RICE_tarim_basin_ordam_sands:0 "Béni par les Sables du Grand Mazar de Kashgar"
 RICE_tarim_basin_khotan_monastic_refugee:0 "Monastique réfugié de Khotan"
 RICE_tarim_basin_khotan_monastic_refugee_desc:0 "Cette personne était à l'origine un monastique bouddhiste de Khotan. Cependant, la ville, qui était autrefois un centre d'apprentissage et de culture bouddhiste, a récemment connu des bouleversements et des changements politiques qui l'ont éloignée de son passé bouddhiste. C'est pourquoi ce monastique a décidé de fuir vers des terres plus sûres à cette époque."
 RICE_tarim_basin_khotan_noble_refugee:0 "Noble réfugié de Khotan"
 RICE_tarim_basin_khotan_noble_refugee_desc:0 "Cette personne était à l'origine un noble bouddhiste de Khotan. Cependant, la ville, qui servait autrefois de centre d'apprentissage et de culture bouddhistes, a récemment connu des bouleversements et des changements politiques qui ont entraîné la transformation de la ville, l'éloignant de son passé bouddhiste. En conséquence, ce noble a décidé de fuir vers des terres plus sûres à cette époque."
 RICE_tarim_basin_helped_khotan_monastic_refugees:0 "A aidé les moines réfugiés khotanais"
 RICE_tarim_basin_helped_khotan_monastic_refugees_desc:0 "Ce personnage a récemment accueilli des monastiques bouddhistes khotanais fuyant Khotan, qui était autrefois un centre de culture et d'érudition bouddhiste mais qui connaît désormais de nombreux bouleversements politiques."
 RICE_tarim_basin_helped_khotan_noble_refugees:0 "A aidé les nobles réfugiés khotanais"
 RICE_tarim_basin_helped_khotan_noble_refugees_desc:0 "Ce personnage a récemment accueilli des nobles bouddhistes khotanais fuyant Khotan, qui était autrefois un centre de culture et d'enseignement bouddhistes, mais qui connaît aujourd'hui un certain nombre de bouleversements politiques."
 RICE_tarim_basin_dunhuang_crescent_lake_visit:0 "A visité le lac du Croissant de Dunhuang"
 RICE_tarim_basin_dunhuang_irrigation_experts:0 "Anciens systèmes d'irrigation et de canaux chinois réparés"
 RICE_tarim_basin_dunhuang_irrigation_experts_desc:0 "Des experts chinois ont récemment été engagés pour venir dans cette région afin de réparer certains de ses anciens canaux et systèmes d'irrigation, qui existent depuis des siècles, si ce n'est plus."
 RICE_tarim_basin_gift_serindian_art:0 "Don d'art sérindien"
 RICE_tarim_basin_gift_serindian_art_desc:0 "Des marchands étrangers ont récemment offert à cette personne diverses œuvres d'art mineures, qui sont un mélange de styles que l'on trouve le long de la Route de la soie, comme ceux de la Chine, de l'Inde, du Tibet, de l'Iran et du Bassin du Tarim."
 RICE_tarim_basin_took_monk_inheritance:0 "Propriété injustement saisie d'un moine décédé"
 RICE_tarim_basin_enforcing_monastic_regulations:0 "Application des règlements monastiques"
 RICE_tarim_basin_enforcing_monastic_regulations_desc:0 "De nombreux cas de faux moines et nonnes bouddhistes ont été signalés dans cette région. Ces personnes prétendent être des monastiques sur le papier, mais vivent en réalité des vies normales avec des familles et des emplois. Quoi qu'il en soit, les autorités commencent à sévir contre cette forme d'évasion fiscale, provoquant un certain ressentiment parmi la population locale."
 RICE_tarim_basin_lax_monastic_regulations:0 "Règlements monastiques laxistes"
 RICE_tarim_basin_lax_monastic_regulations_desc:0 "De nombreux cas de faux moines et de fausses nonnes bouddhistes ont été signalés dans cette région. Ces personnes prétendent être des moines sur le papier, mais mènent en réalité une vie normale, avec une famille et un emploi. Quoi qu'il en soit, les autorités semblent réticentes à faire quoi que ce soit contre cette forme d'évasion fiscale, mais elle réduit les recettes fiscales potentielles."
 RICE_tarim_basin_juicy_dunhuang_melons:0 "Savourer les melons juteux de Dunhuang"
 RICE_tarim_basin_taking_rhubarb:0 "Prendre un remède à base de rhubarbe"
 RICE_tarim_basin_famous_silk_road_peddler_visits:0 "Un célèbre colporteur de la Route de la soie de passage"
 RICE_tarim_basin_rejected_by_entertainer:0 "Rejeté par un humble artiste"
 RICE_tarim_basin_considerate_feelings:0 "Prévenant envers mes sentiments"
 RICE_tarim_basin_considerate_towards_entertainers:0 "Prévenant envers les artistes"
 RICE_tarim_basin_gift_silk_road_deals_1:0 "Accord commercial mineur sur la Route de la soie"
 RICE_tarim_basin_gift_silk_road_deals_1_desc:0 "Ce personnage a récemment conclu un accord commercial avec une communauté locale d'origine étrangère le long de la Route de la soie."
 RICE_tarim_basin_gift_silk_road_deals_2:0 "Accord commercial majeur de la Route de la soie"
 RICE_tarim_basin_gift_silk_road_deals_2_desc:0 "$RICE_tarim_basin_gift_silk_road_deals_1_desc$"
 RICE_tarim_basin_gift_silk_road_deals_3:0 "Accord commercial important sur la Route de la soie"
 RICE_tarim_basin_gift_silk_road_deals_3_desc:0 "$RICE_tarim_basin_gift_silk_road_deals_1_desc$"
 RICE_tarim_basin_gift_silk_road_intel_1:0 "Renseignement mineur de la Route de la soie"
 RICE_tarim_basin_gift_silk_road_intel_1_desc:0 "Ce personnage a des alliés dans une communauté locale d'origine étrangère, qui ont récemment utilisé leurs réseaux à travers la Route de la soie pour fournir à ce personnage des informations utiles sur divers complots et plans en cours."
 RICE_tarim_basin_gift_silk_road_intel_2:0 "Renseignement majeur de la Route de la soie"
 RICE_tarim_basin_gift_silk_road_intel_2_desc:0 "$RICE_tarim_basin_gift_silk_road_intel_1_desc$"
 RICE_tarim_basin_gift_silk_road_intel_3:0 "Renseignements significatifs de la Route de la soie"
 RICE_tarim_basin_gift_silk_road_intel_3_desc:0 "$RICE_tarim_basin_gift_silk_road_intel_1_desc$"
 RICE_tarim_basin_gift_silk_road_medicine_1:0 "Petit cadeau de médecine de la Route de la soie"
 RICE_tarim_basin_gift_silk_road_medicine_1_desc:0 "Ce personnage a récemment reçu un cadeau de médecines traditionnelles d'une communauté locale d'origine étrangère de l'autre côté de la Route de la soie. Il est censé les aider à améliorer leur santé et à prévenir les maladies indésirables."
 RICE_tarim_basin_gift_silk_road_medicine_2:0 "Grand cadeau de médecine de la Route de la soie"
 RICE_tarim_basin_gift_silk_road_medicine_2_desc:0 "$RICE_tarim_basin_gift_silk_road_medicine_1_desc$"
 RICE_tarim_basin_gift_silk_road_medicine_3:0 "Cadeau important de médecine de la Route de la soie"
 RICE_tarim_basin_gift_silk_road_medicine_3_desc:0 "$RICE_tarim_basin_gift_silk_road_medicine_1_desc$"
 RICE_tarim_basin_gift_silk_road_infrastructure_1:0 "Aide infrastructurelle mineure de la Route de la soie"
 RICE_tarim_basin_gift_silk_road_infrastructure_1_desc:0 "Une communauté locale d'origine étrangère établie le long de la Route de la soie a mis en commun ses ressources pour aider les autorités dans divers projets visant à améliorer l'infrastructure de la région."
 RICE_tarim_basin_gift_silk_road_infrastructure_2:0 "Aide infrastructurelle majeure de la Route de la soie"
 RICE_tarim_basin_gift_silk_road_infrastructure_2_desc:0 "$RICE_tarim_basin_gift_silk_road_infrastructure_1_desc$"
 RICE_tarim_basin_gift_silk_road_infrastructure_3:0 "Aide infrastructurelle importante de la Route de la soie"
 RICE_tarim_basin_gift_silk_road_infrastructure_3_desc:0 "$RICE_tarim_basin_gift_silk_road_infrastructure_1_desc$"
 RICE_tarim_basin_gift_silk_road_bodyguards_1:0 "Petit contingent de gardes du corps de la Route de la soie"
 RICE_tarim_basin_gift_silk_road_bodyguards_1_desc:0 "Des membres d'une communauté locale d'origine étrangère établie le long de la Route de la soie, dont un certain nombre de vétérans militaires, se sont récemment engagés à servir de gardes du corps loyaux à ce personnage."
 RICE_tarim_basin_gift_silk_road_bodyguards_2:0 "Un contingent majeur de gardes du corps de la Route de la soie"
 RICE_tarim_basin_gift_silk_road_bodyguards_2_desc:0 "$RICE_tarim_basin_gift_silk_road_bodyguards_1_desc$"
 RICE_tarim_basin_gift_silk_road_bodyguards_3:0 "Un important contingent de gardes du corps de la Route de la soie"
 RICE_tarim_basin_gift_silk_road_bodyguards_3_desc:0 "$RICE_tarim_basin_gift_silk_road_bodyguards_1_desc$"
 RICE_tarim_basin_gift_silk_road_ideas_1:0 "Inspiration mineure de la civilisation de la Route de la soie"
 RICE_tarim_basin_gift_silk_road_ideas_1_desc:0 "Ce personnage a récemment engagé un dialogue productif avec des membres érudits et savants d'une communauté locale d'origine étrangère, venus de l'autre côté de la Route de la soie. Ces intellectuels ont finalement contribué à faire germer quelques idées pour ce personnage dans divers aspects de la vie."
 RICE_tarim_basin_gift_silk_road_ideas_2:0 "Inspiration majeure de la civilisation de la Route de la soie"
 RICE_tarim_basin_gift_silk_road_ideas_2_desc:0 "$RICE_tarim_basin_gift_silk_road_ideas_1_desc$"
 RICE_tarim_basin_gift_silk_road_ideas_3:0 "Inspiration significative de la civilisation de la Route de la soie"
 RICE_tarim_basin_gift_silk_road_ideas_3_desc:0 "$RICE_tarim_basin_gift_silk_road_ideas_1_desc$"
 RICE_tarim_basin_participated_in_khotan_procession:0 "Participation à la procession annuelle des images de Khotan"
 RICE_tarim_basin_ali_arslan_equivalent:0 "Craint par les infidèles du Bassin du Tarim"
 RICE_tarim_basin_ordam_mazar_recently_built:0 "Ordam Mazar récemment construit"
 RICE_tarim_basin_gift_silk_road_sea_travel_1:0 "Coopération nautique mineure le long de la Route maritime de la Soie"
 RICE_tarim_basin_gift_silk_road_sea_travel_1_desc:0 "Les membres d'une communauté locale d'origine étrangère établie le long de la Route maritime de la Soie aident ce personnage à assurer la sécurité et la rapidité des voyages en mer de ceux qui naviguent sous leur bannière."
 RICE_tarim_basin_gift_silk_road_sea_travel_2:0 "Coopération nautique majeure le long de la Route maritime de la Soie"
 RICE_tarim_basin_gift_silk_road_sea_travel_2_desc:0 "$RICE_tarim_basin_gift_silk_road_sea_travel_1_desc$"
 RICE_tarim_basin_gift_silk_road_sea_travel_3:0 "Une coopération nautique importante le long de la Route maritime de la Soie"
 RICE_tarim_basin_gift_silk_road_sea_travel_3_desc:0 "$RICE_tarim_basin_gift_silk_road_sea_travel_1_desc$"
 RICE_tarim_basin_gift_silk_road_trade_business_relationship:0 "Relations commerciales sur la Route de la soie"
 RICE_tarim_basin_gift_silk_road_trade_business_relationship_desc:0 "Ce personnage a récemment noué des liens étroits avec certains marchands venus d'ailleurs le long de la Route de la soie. Qu'ils parviennent ou non à conclure des affaires de temps à autre, cette relation est certainement bénéfique pour les deux parties, car elle leur fournit des relations et des ressources supplémentaires dont elles peuvent tirer profit."
 RICE_tarim_basin_aspiration_restore_order_guiyi: "[aspiration|E] : Pacifier le circuit de Guiyi"
 RICE_tarim_basin_aspiration_restore_order_guiyi_desc: "#italic Les clans d'élite de Dunhuang ne sont pas dignes de diriger le circuit de Guiyi. Pour rétablir l'ordre à la frontière anarchique des régions occidentales, Cao Yijin doit réaliser son ambition de régner sur Guiyi.#!$RICE_tarim_basin_aspiration_cao_yijin_desc$\n\n"
 RICE_tarim_basin_is_al_kashgari: "[RICE_aspiration|E] : Compiler le Diwan Lughat al-Turk"
 RICE_tarim_basin_is_al_kashgari_desc:"#italic Les Arabes et les Persans méprisent les Turcs, les considérant comme des barbares non civilisés. al-Kashgari espère compiler un grand dictionnaire du turc pour leur prouver le contraire, et que le turc est aussi une langue belle et élégante !#!$RICE_tarim_basin_aspiration_al_kashgari_desc$\n\n"
 RICE_tarim_basin_dunhuang_cave_pilgrimage_family_inspired: "$RICE_tarim_basin_dunhuang_cave_pilgrimage_family_log_title$"
 RICE_tarim_basin_dunhuang_cave_pilgrimage_family_inspired_desc: "Ce personnage a été spirituellement inspiré après avoir contemplé certaines des grottes représentant les dévots qui les ont creusées."
 RICE_tarim_basin_dunhuang_cave_pilgrimage_jataka_inspired: "$RICE_tarim_basin_dunhuang_cave_pilgrimage_jataka_log_title$"
 RICE_tarim_basin_dunhuang_cave_pilgrimage_jataka_inspired_desc: "Ce personnage a été spirituellement inspiré après avoir contemplé certaines des grottes représentant les récits [Glossary( 'jataka', 'JATAKA_GLOSS' )]."
 RICE_tarim_basin_dunhuang_cave_pilgrimage_deities_inspired: "$RICE_tarim_basin_dunhuang_cave_pilgrimage_deities_log_title$"
 RICE_tarim_basin_dunhuang_cave_pilgrimage_deities_inspired_desc: "Ce personnage a été spirituellement inspiré après avoir contemplé certaines des grottes de Mogao représentant divers Bouddhas, Bodhisattvas et autres divinités bienveillantes."
 RICE_tarim_basin_bezeklik_cave_pilgrimage_inspired: "Inspiré par les grottes de Bezeklik"
 RICE_tarim_basin_bezeklik_cave_pilgrimage_inspired_desc: "Ce personnage a été spirituellement inspiré après être venu en pèlerinage aux grottes de Bezeklik."

 # Decisions - Mogao Cave
 RICE_tarim_basin_patronize_a_mogao_cave:0 "Patronner une grotte de Mogao"
 RICE_tarim_basin_patronize_a_mogao_cave_tooltip:0 "Nous devons tisser des liens plus étroits avec ces groupes."
 RICE_tarim_basin_patronize_a_mogao_cave_desc:0 "Les [mogao_caves|El] se dressent près de Dunhuang depuis des siècles. Des générations de familles d'élite locales - et occasionnellement des mécènes aussi lointains que la Chine centrale et Khotan - ont financé ce réseau toujours croissant de grottes. Je devrais parrainer ma propre contribution à ce site religieux."
 RICE_tarim_basin_patronize_a_mogao_cave_effect_tooltip_1:0 "La grotte prendra environ un an à construire. Une fois terminée, vous gagnerez du [prestige|El], de la [piety|El], du [dynasty_prestige|El], et un [character_modifier|El] #P positif#! en fonction de la taille de la grotte et du thème artistique que vous choisissez. #X Cette décision ne peut être prise qu'une seule fois dans une vie !#!"
 RICE_tarim_basin_patronize_a_mogao_cave_effect_tooltip_2:0 "Ces bonus seront plus importants car votre [dynasty|El] a débloqué l'[dynasty_perk|El] [GetDynastyPerk('RICE_tarim_basin_silk_road_legacy_4').GetName]"
 RICE_tarim_basin_patronize_a_mogao_cave_effect_tooltip_3:0 "Les coûts de construction d'une [mogao_cave|El] sont réduits car votre [dynasty|El] a débloqué l'[dynasty_perk|El] [GetDynastyPerk('RICE_tarim_basin_silk_road_legacy_5').GetName]"
 RICE_tarim_basin_patronize_a_mogao_cave_confirm:0 "Pour les Trois Joyaux !"
 RICE_tarim_basin_patronize_a_mogao_cave_context_tooltip:0 "#emphasis Contexte historique :#! Les grottes de Mogao sont un ensemble de plus de 500 temples, sanctuaires et autres structures religieuses taillées dans les montagnes près de Dunhuang, datant du IVe au XIVe siècle. De nombreuses grottes ont été financées par plusieurs clans d'élite qui vivaient à Dunhuang depuis la dynastie Han, et elles représentent l'évolution de l'art bouddhiste à travers un millénaire. Leur redécouverte au XXe siècle a été une aubaine considérable pour les historiens étudiant la région, en raison de la vaste quantité d'œuvres d'art, d'artefacts matériels et de documents écrits qui y ont été trouvés."
 RICE_tarim_basin_patronize_a_mogao_cave_choose_type:0 "Choisir un thème pour la grotte"
 RICE_tarim_basin_mogao_cave_family_option:0 "#Bold #V Famille et Lignée#!#!\nMontrez la dévotion de votre clan envers le bouddhisme"
 RICE_tarim_basin_mogao_cave_family_option_desc:0 "Vous et votre clan aurez un rôle important dans les œuvres d'art de votre grotte."
 RICE_tarim_basin_mogao_cave_family_option_tooltip:0 "Le monde doit connaître la noblesse et la droiture de ma lignée et de mes proches, et comment nous avons grandement contribué à l'épanouissement de la voie véritable.\n#weak Ce type de grotte vous rapportera plus de prestige que de piété.#!"
 RICE_tarim_basin_mogao_cave_jataka_option:0 "#Bold #V Contes Jataka#!#!\nRaconter des fables pour enseigner la bonne morale"
 RICE_tarim_basin_mogao_cave_jataka_option_desc:0 "Une grande partie de votre grotte sera dédiée à raconter de merveilleuses fables bouddhistes."
 RICE_tarim_basin_mogao_cave_jataka_option_tooltip:0 "Les contes [Glossary( 'jataka', 'JATAKA_GLOSS' )] ont diverti les gens pendant des générations et sont encore populaires - ils sont un excellent moyen d'enseigner à tous la bonne conduite et les bonnes attitudes.\n#weak Ce type de grotte vous rapportera des quantités égales de prestige et de piété.#!"
 RICE_tarim_basin_mogao_cave_deities_option:0 "#Bold #V Êtres Éveillés#!#!\nVénérer les êtres supérieurs"
 RICE_tarim_basin_mogao_cave_deities_option_desc:0 "Votre grotte se concentrera sur la représentation de diverses divinités bouddhistes et d'êtres saints."
 RICE_tarim_basin_mogao_cave_deities_option_tooltip:0 "Il serait préférable d'honorer véritablement les Bouddhas, Bodhisattvas et autres divinités en se concentrant sur eux. Que ceux qui voient cette grotte soient inspirés !\n#weak Ce type de grotte vous rapportera plus de piété que de prestige.#!"

 # Decisions - Silk Road Communities
 RICE_reinforce_relations_silk_road_communities:0 "Renforcer les relations avec les communautés de la Route de la soie"
 RICE_reinforce_relations_silk_road_communities_tooltip:0 "Nous devons tisser des liens plus étroits avec ces groupes."
 RICE_reinforce_relations_silk_road_communities_desc:0 "La Route de la Soie abrite de nombreuses [silk_road_communities_short|El] ethniques différentes. Il serait sage de tendre la main aux dirigeants et aux élites de telles [silk_road_communities_short|El] dans mes territoires, afin que nous puissions nous entraider mutuellement."
 RICE_reinforce_relations_silk_road_communities_effect_tooltip_1:0 "Vous recevez un [character_modifier|El] pour dix ans, dont les bonus dépendent de la communauté que vous avez choisie"
 RICE_reinforce_relations_silk_road_communities_effect_tooltip_2:0 "La [silk_road_community_short|El] que vous choisirez pourrait vous soutenir à long terme à travers des événements aléatoires et en débloquant de nouvelles [decisions|El] pour vous"
 RICE_reinforce_relations_silk_road_communities_confirm:0 "Travaillons en réseau !"
 RICE_reinforce_relations_silk_road_communities_context_tooltip:0 "#emphasis Contexte historique :#! Les terres le long des « Routes de la soie » ont été le foyer d'un mélange de nombreuses ethnicités, religions et cultures, hier comme aujourd'hui. Dans divers centres urbains, des communautés diverses d'origines différentes ont souvent joué des rôles majeurs dans les affaires locales malgré leur origine « étrangère ». Par exemple, la ville de Dunhuang, dominée par les Chinois, comptait une importante minorité sogdienne, dont certains accédèrent à de hauts rangs, et elle abritait également de nombreuses autres ethnicités comme les Tibétains, les Juifs et les Tokhariens."
 RICE_silk_road_communities_done_already_req:0 "N'a pas déjà pris cette [decision|El]"
 RICE_no_current_silk_road_community_req:0 "Vous ne renforcez actuellement pas vos relations avec une [silk_road_community|El]"
 RICE_silk_road_communities_dynasty_perks_req:0 "La [dynasty|El] a débloqué les [dynasty_perks|El] [GetDynastyPerk('RICE_socotra_indian_ocean_legacy_2').GetName] ou [GetDynastyPerk('RICE_tarim_basin_silk_road_legacy_2').GetName]"
 RICE_silk_road_pick_a_community_type:0 "Choisir une communauté avec laquelle tisser des liens"
 RICE_community_east_asian_option:0 "#Bold #V Est-asiatique#!#!\nSimples érudits, respectés par beaucoup"
 RICE_community_east_asian_option_desc:0 "Les habitants de l'Est, érudits et justes, méritent notre soutien."
 RICE_community_east_asian_option_tooltip:0 "Les peuples des terres orientales sont réputés érudits et justes. Ils pourraient également avoir des liens avec l'Empire du Milieu lui-même - ne serait-il pas sage de rechercher leur aide et leur amitié ? Il est temps d'améliorer vos [GetModifier('RICE_tarim_basin_east_asian_contacts').GetNameWithTooltip] !\n\n#weak Cette option augmente le montant et les chances de recevoir des dons de [prestige|El] et de [dynasty_prestige|El] de la part des [silk_road_communities|El] locales, et débloque la [decision|El] #V $RICE_silk_road_community_east_asian_decision$#!#!"
 RICE_community_steppe_option:0 "#Bold #V Steppe#!#!\nDe féroces et braves guerriers des steppes"
 RICE_community_steppe_option_desc:0 "Les féroces et courageux guerriers nomades méritent notre soutien."
 RICE_community_steppe_option_tooltip:0 "Les peuples des steppes du nord sont querelleurs, mais bien qu'ils ne soient pas toujours les plus fiables, leurs compétences en tant que guerriers et aventuriers ne peuvent être ignorées si vous cherchez à renforcer votre armée. Il est temps d'améliorer vos [GetModifier('RICE_tarim_basin_steppe_contacts').GetNameWithTooltip] !\n\n#weak Les communautés des steppes sont présentes dans vos terres car votre capitale se trouve sur ou près des Routes de la soie terrestres\n\nCette option augmente la puissance et les chances de recevoir des dons de [special_troops|El] et de [character_modifiers|El] qui améliorent les [scheme_success_chance|El] et l'[advantage|El] dans les [battles|El] de la part des [silk_road_communities|El] locales, et débloque la [decision|El] #V $RICE_silk_road_community_steppe_decision$#!#!"
 RICE_community_middle_eastern_option:0 "#Bold #V Moyen-orientaux#!#!\nDes marchands qui dominent les Routes de la soie"
 RICE_community_middle_eastern_option_desc:0 "Les habitants du Moyen-Orient, habiles et prospères, méritent notre soutien."
 RICE_community_middle_eastern_option_tooltip:0 "Les marchands et voyageurs iraniens, arabes et juifs sont renommés pour leur perspicacité et leur ouverture au monde depuis des siècles. Avec leur richesse et leurs connexions, et votre statut et pouvoir, vous pourriez accomplir de grandes choses ensemble. Il est temps d'améliorer vos [GetModifier('RICE_tarim_basin_middle_eastern_contacts').GetNameWithTooltip] !\n\n#weak Cette option augmente la quantité et les chances de recevoir des cadeaux de [character_modifiers|El] qui améliorent les [gold|El] [income|El], ou les coûts de [county_modifiers|El] [building|El] et le [control|El] dans votre [realm_capital|El] de la part des [silk_road_communities|El] locales, et débloque la [decision|El] #V $RICE_silk_road_community_middle_eastern_decision$#!#!"
 RICE_community_himalayan_option:0 "#Bold #V Himalayen#!#!\nSurvivalistes du toit du monde"
 RICE_community_himalayan_option_desc:0 "Les survivalistes de l'Himalaya méritent notre soutien."
 RICE_community_himalayan_option_tooltip:0 "Les membres des tribus du Plateau himalayen sont réputés pour être des guerriers endurcis et capables, ainsi que des fidèles dévots de leur foi, capables de s'adapter à toute adversité. Ils pourraient s'avérer des alliés utiles. Il est temps d'améliorer vos [GetModifier('RICE_tarim_basin_himalayan_contacts').GetNameWithTooltip] !\n\n#weak Les communautés himalayennes sont présentes sur vos terres car votre capitale se trouve sur ou près des Routes de la Soie terrestres\n\nCette option augmente la quantité et les chances de recevoir des dons de [character_modifiers|El] qui améliorent la [scheme_resistance|El] et la [prowess|El], ou la [health|El], la [fertility|El], et la gestion du [stress|El] de la part des [silk_road_communities|El] locales, et débloque la [decision|El] #V $RICE_silk_road_community_himalayan_decision$#!#!"
 RICE_community_indian_option:0 "#Bold #V Indienne#!#!\nLeurs idées se répandent à travers le monde"
 RICE_community_indian_option_desc:0 "Les Indiens, sages et cultivés, méritent notre soutien."
 RICE_community_indian_option_tooltip:0 "Les moines, penseurs et marchands venus d'Inde ont certainement laissé une marque positive sur les cultures et sociétés de toutes les terres qu'ils traversent - et peut-être les vôtres aussi. Il est temps d'améliorer vos [GetModifier('RICE_tarim_basin_indian_contacts').GetNameWithTooltip] !\n\n#weak Cette option augmente la quantité et les chances de recevoir des dons de [piety|El], ou des [character_modifiers|El] qui améliorent l'[lifestyle_experience|El] des [silk_road_communities|El] locales, et débloque la [decision|El] #V $RICE_silk_road_community_indian_decision$#!#!"
 RICE_community_east_african_option:0 "#Bold #V Est-africain#!#!\nUn groupe diversifié venu de rivages lointains"
 RICE_community_east_african_option_desc:0 "Les divers Africains méritent notre soutien."
 RICE_community_east_african_option_tooltip:0 "Les peuples qui viennent ici d'Afrique de l'Est sont d'origines diverses, et comprennent des marchands, des aventuriers, des esclaves, et bien d'autres. Il est temps d'améliorer vos [GetModifier('RICE_tarim_basin_east_african_contacts').GetNameWithTooltip] !\n\n#weak Cette option augmente la quantité et les chances de recevoir des dons de [special_troops|El] et de [character_modifiers|El] qui améliorent la [scheme_resistance|El] et la [prowess|El] de la part des [silk_road_communities|El] locales, et débloque la [decision|El] #V $RICE_silk_road_community_east_african_decision$#!#!"
 RICE_community_southeast_asian_option:0 "#Bold #V Asie du Sud-Est#!#!\nMarins qui ont maîtrisé l'océan Indien"
 RICE_community_southeast_asian_option_desc:0 "Les Asiatiques du Sud-Est entreprenants et aventureux méritent notre soutien."
 RICE_community_southeast_asian_option_tooltip:0 "Les royaumes et cités d'Asie du Sud-Est sont importants dans les réseaux maritimes qui sillonnent l'océan Indien - nous intégrer dans les réseaux de leurs peuples pourrait s'avérer lucratif. Il est temps d'améliorer vos [GetModifier('RICE_tarim_basin_southeast_asian_contacts').GetNameWithTooltip] !\n\n#weak Cette option augmente la quantité, et les chances de recevoir, des cadeaux de [character_modifiers|El] qui améliorent la [travel_speed|El] et réduisent le [travel_danger|El] en [terrain|El] maritime, ou la [health|El], la [fertility|El], et la gestion du [stress|El] des [silk_road_communities|El] locales, et débloque la [decision|El] #V $RICE_silk_road_community_southeast_asian_decision$#!#!"
 RICE_silk_road_community_east_asian_decision:0 "Faire appel à des spécialistes de l'Asie de l'Est"
 RICE_silk_road_community_east_asian_decision_tooltip:0 "Leurs connaissances peuvent nous être d'un grand secours !"
 RICE_silk_road_community_east_asian_decision_desc:0 "Maintenant que j'ai tissé des liens avec les [silk_road_communities_short|El] est-asiatiques locales de mon royaume, je devrais leur demander de m'aider à trouver des personnes talentueuses de leurs contrées d'origine pour venir ici. Des érudits aux ingénieurs, des stratèges aux calligraphes, il y a tant de types d'experts venus de loin que je pourrais inciter à travailler pour moi !"
 RICE_silk_road_community_east_asian_decision_confirm:0 "Je suis à la recherche de personnes talentueuses."
 RICE_silk_road_community_steppe_decision:0 "Recruter des guerriers des steppes"
 RICE_silk_road_community_steppe_decision_tooltip:0 "Pourquoi les combattre alors que nous pouvons les recruter pour qu'ils se battent pour nous ?"
 RICE_silk_road_community_steppe_decision_desc:0 "Maintenant que j'ai tissé des liens avec les [silk_road_communities_short|El] steppiques locales dans mon royaume, je me demande si certains de leurs redoutables guerriers seraient disposés à combattre sous ma bannière. Leurs compétences en équitation, en tir à l'arc, en combat au corps à corps et en d'autres formes de combat, ainsi que leur connaissance approfondie de la stratégie, de la tactique et de la logistique pourraient m'aider dans mes guerres."
 RICE_silk_road_community_steppe_decision_confirm:0 "Mieux vaut qu'ils se battent pour moi que contre moi."
 RICE_silk_road_community_middle_eastern_decision:0 "Faire venir des marchands colons du Moyen-Orient"
 RICE_silk_road_community_middle_eastern_decision_tooltip:0 "Le commerce fait tourner le monde !"
 RICE_silk_road_community_middle_eastern_decision_desc:0 "Maintenant que j'ai tissé des liens avec les [silk_road_communities_short|El] moyen-orientales locales dans mon domaine, je me demande si elles seraient disposées à m'aider à attirer certains de leurs compatriotes, en particulier des marchands, à s'installer dans mon domaine et à continuer d'étendre les réseaux commerciaux existants afin que nous puissions tous prospérer et croître."
 RICE_silk_road_community_middle_eastern_decision_confirm:0 "Le commerce et les échanges vont prospérer !"
 RICE_silk_road_community_himalayan_decision:0 "Recruter des guerriers himalayens"
 RICE_silk_road_community_himalayan_decision_tooltip:0 "Je veux recruter ces robustes champions de la montagne..."
 RICE_silk_road_community_himalayan_decision_desc:0 "Maintenant que j'ai tissé des liens avec les [silk_road_communities_short|El] himalayennes de mon royaume, j'étudie la possibilité de recruter certains de leurs guerriers pour servir dans mes armées. Nombre d'entre eux sont originaires de l'indomptable plateau himalayen, et sont donc eux-mêmes indomptables dans l'âme."
 RICE_silk_road_community_himalayan_decision_confirm:0 "Leur force deviendra ma force."
 RICE_silk_road_community_indian_decision:0 "Faire venir des artisans indiens"
 RICE_silk_road_community_indian_decision_tooltip:0 "Leur art est connu dans le monde entier !"
 RICE_silk_road_community_indian_decision_desc:0 "Maintenant que j'ai tissé des liens avec les [silk_road_communities_short|El] indiennes locales dans mon domaine, il m'est venu à l'esprit que je pourrais utiliser mes nouvelles connexions pour embaucher des artisans indiens venus de loin afin qu'ils travaillent pour moi. Le style artistique du sous-continent indien a été une influence majeure sur de nombreuses civilisations, et l'utiliser rehaussera sans aucun doute mon prestige."
 RICE_silk_road_community_indian_decision_confirm:0 "Leur art magnifique trouvera un bon foyer ici."
 RICE_silk_road_community_east_african_decision:0 "Baisse des exportations d'or et d'ivoire"
 RICE_silk_road_community_east_african_decision_tooltip:0 "L'Afrique de l'Est est un important exportateur d'or, d'ivoire et d'autres produits de luxe."
 RICE_silk_road_community_east_african_decision_desc:0 "Grâce à mes connexions avec les [silk_road_communities_short|El] d'Afrique de l'Est dans mon domaine, en particulier les marchands originaires de là-bas ou qui font commerce avec ces régions, je pourrais vouloir en inciter certains à faire passer leur commerce à travers mes terres - tant que j'obtiens une part des profits, bien entendu."
 RICE_silk_road_community_east_african_decision_confirm:0 "Faites venir les marchands !"
 RICE_silk_road_community_southeast_asian_decision:0 "Embaucher des constructeurs navals d'Asie du Sud-Est"
 RICE_silk_road_community_southeast_asian_decision_tooltip:0 "De nombreux peuples d'Asie du Sud-Est vivent le long des côtes et des fleuves de cette région"
 RICE_silk_road_community_southeast_asian_decision_desc:0 "En développant mes réseaux avec les [silk_road_communities_short|El] locales d'Asie du Sud-Est dans mon domaine, j'ai pu entrer en contact avec un certain nombre de marchands, de marins, de charpentiers et d'autres artisans impliqués dans la production et la navigation de navires. Je devrais utiliser ces connexions pour améliorer les capacités commerciales et navales de mon domaine."
 RICE_silk_road_community_southeast_asian_decision_confirm:0 "Nous naviguerons dans le bleu de l'océan Indien !"

 # Decisions - Other
 RICE_iranian_sinicization:0 "Se siniser en tant qu'Asiatique de l'Ouest"
 RICE_iranian_sinicization_tooltip:0 "Nos racines sont ailleurs, mais notre foyer est ici parmi les Chinois..."
 RICE_iranian_sinicization_desc.867:0 "Les Chinois appellent souvent quiconque ayant des ancêtres des soi-disant Régions occidentales des barbares « Hu ». Pourtant, nombre d'entre nous, les « Hu », vivons sur des terres gouvernées par les Chinois depuis des générations, adoptant leurs coutumes, leur langue et leurs idées. Il est pertinent que nos amis chinois comprennent que nous sommes des gens cultivés tout comme eux, particulièrement à la lumière de la rébellion du général sogdien An Lushan il y a des années - nous ne ressemblons en rien à cette brute cruelle !"
 RICE_iranian_sinicization_desc:0 "Les Chinois qualifient souvent de barbares « Hu » tous ceux qui ont des ancêtres originaires des régions dites occidentales. Pourtant, nombre d'entre nous, les « Hu », vivent depuis des générations dans des pays gouvernés par les Chinois, dont ils ont adopté les coutumes, la langue et les idées. Il est important que nos amis chinois comprennent que nous sommes des personnes cultivées comme eux !"
 RICE_iranian_sinicization_effect_tooltip_1:0 "Vous pouvez adopter un nouveau nom chinois si vous le souhaitez"
 RICE_iranian_sinicization_confirm:0 "Nous sommes désormais Han !"
 RICE_iranian_sinicization_context_tooltip:0 "#emphasis Contexte historique :#! Les communautés iraniennes et tochariennes ont existé en grand nombre en Chine au cours de l'histoire, et comprenaient des marchands, des moines bouddhistes et des traducteurs, des esclaves, des soldats, des courtisanes et bien d'autres encore. Nombre d'entre eux se sont bien adaptés à la culture chinoise, certains accédant à des postes de premier plan dans la société chinoise, devenant généraux et fonctionnaires. Par exemple, le général An Lushan, qui a mené une grande rébellion et proclamé une éphémère dynastie Yan qui a marqué à jamais la Chine des Tang, pourrait être d'ascendance sogdienne et, après sa défaite, de nombreux Iraniens ont adopté des noms chinois pour cacher leurs origines. Autre exemple, plusieurs clans importants de la ville de Dunhuang, dominée par les Chinois, comme les familles Kang et An, étaient d'origine sogdienne mais ont été complètement sinisés."
 RICE_top_liege_or_capital_chinese_req:0 "Votre [top_liege|El] ou votre [realm_capital|El] est d'une [culture|El] qui a un [heritage|El] chinois"
 RICE_tarim_basin_stage_animal_fight:0 "Organiser des combats d'animaux pour prédire la récolte"
 RICE_tarim_basin_stage_animal_fight_tooltip:0 "Une nouvelle année arrivera bientôt !"
 RICE_tarim_basin_stage_animal_fight_desc:0 "Il est coutume parmi les [ROOT.Char.GetCulture.GetCollectiveNoun] d'organiser des combats d'animaux au début de chaque année dans le cadre des festivités du Nouvel An. Beaucoup croient que comprendre les résultats de ces combats permet de prédire avec précision les résultats des récoltes à venir ou la fertilité de ses troupeaux. Je souhaite organiser une grande compétition accueillant de nombreux combats de ce type !"
 RICE_tarim_basin_stage_animal_fight_desc.not_tocharian:0 "C'est une coutume parmi les peuples tokhariens, ou ceux qui en descendent, d'organiser des combats d'animaux au début de chaque année dans le cadre des festivités du Nouvel An. Beaucoup croient que comprendre les résultats de ces combats permet de prédire avec précision les résultats des récoltes à venir ou la fertilité de ses troupeaux. Je souhaite organiser une grande compétition accueillant de nombreux combats de ce type !"
 RICE_tarim_basin_stage_animal_fight_effect_tooltip_1:0 "Selon les résultats des combats, vous gagnerez du [prestige|El], et votre [realm_capital|El] #italic pourrait#! gagner un [county_modifier|El] #P positif#! ou vous #italic pourriez#! gagner un [character_modifier|El] #P positif#!"
 RICE_tarim_basin_stage_animal_fight_effect_tooltip_2:0 "Vous perdrez de la [piety|El] car vous suivez une [faith|El] qui possède le [core_tenet|El] [GetFaithDoctrine('tenet_pacifism').GetBaseName] ou [GetFaithDoctrine('tenet_dharmic_pacifism').GetBaseName]. Ainsi, certains [hoster.Custom('DefaultPriestTitlePlural')|U] désapprouvent ces superstitions violentes qui vont à l'encontre des enseignements de [hoster.GetFaith.HighGodNamePossessive]."
 RICE_tarim_basin_stage_animal_fight_confirm:0 "Il est temps de se préparer pour la nouvelle année !"
 RICE_tarim_basin_stage_animal_fight_context_tooltip:0 "#emphasis Contexte historique :#! Kucha était l'une des cités-États tochariennes les plus riches et les plus influentes, dont les traditions de musique, de danse et autres festivités étaient renommées. Chaque nouvel an, des combats étaient organisés entre divers animaux tels que des bovins, des chevaux, des chèvres et des chameaux à Kucha. Les résultats étaient utilisés pour prédire les récoltes futures et la fertilité des troupeaux."
 RICE_decision_stage_animal_fight_month_req:0 "Le mois est janvier, février ou mars"
 RICE_tarim_basin_khotan_procession:0 "Participer à la procession annuelle de Khotan"
 RICE_tarim_basin_khotan_procession_tooltip:0 "Hommage aux Trois Joyaux !"
 RICE_tarim_basin_khotan_procession_desc:0 "Il est temps de réaffirmer notre foi dans les Trois Joyaux en participant aux cérémonies processionnelles annuelles de Khotan. Depuis que Khotan est devenue [ROOT.Char.GetFaith.GetReligion.GetAdjective], la procession est célébrée sans interruption depuis des siècles. Tout le monde à Khotan est impliqué, des gens du peuple aux monastiques en passant par la royauté."
 RICE_tarim_basin_khotan_procession_effect_tooltip_1:0 "Vous recevrez un montant aléatoire de [piety|El]"
 RICE_tarim_basin_khotan_procession_effect_tooltip_2:0 "Il y a une chance que vous soyez perçu comme ayant reçu les #P bénédictions#! des [eight_protectors_of_khotan|El] et receviez un [character_modifier|El] dont la puissance dépend de votre [piety_level|El]"
 RICE_tarim_basin_khotan_procession_confirm:0 "J'attends avec impatience la procession de cette année !"
 RICE_tarim_basin_khotan_procession_context_tooltip:0 "#emphasis Contexte historique :#! À l'apogée de Khotan en tant que centre du bouddhisme, une cérémonie processionnelle annuelle qui durait deux semaines se tenait au printemps, impliquant tous les habitants de la ville, des gens du peuple à la famille royale. Des images bouddhistes sacrées étaient placées sur des chariots et amenées depuis les faubourgs de la ville chaque jour. La procession de chaque jour était organisée par l'un des principaux monastères de Khotan ; le monastère de Gomati, le plus important monastère khotanais, avait le privilège de défiler le premier jour."
 RICE_decision_khotan_procession_month_req:0 "Le mois est janvier, février, mars ou avril"
 RICE_decision_khotan_ruler_buddhist_req:0 "Le [ruler|El] de Khotan est bouddhiste"
 RICE_tarim_basin_attend_ordam_mazar_festival:0 "Assister au festival d'Ordam"
 RICE_tarim_basin_attend_ordam_mazar_festival_tooltip:0 "Rappelons-nous du martyr Ali Arslan Khan."
 RICE_tarim_basin_attend_ordam_mazar_festival_desc:0 "Il est temps que je me rende au #italic mazar#! ou tombeau d'Ali Arslan Khan et que je participe au Festival d'Ordam qui s'y tient. Il est important que j'affirme ma foi [ROOT.Char.GetFaith.GetReligion.GetAdjective] en l'honorant et en pleurant sa mort."
 RICE_tarim_basin_attend_ordam_mazar_festival_effect_tooltip_1:0 "Vous recevrez un montant aléatoire de [piety|El] et de [prestige|El] en fonction de votre [piety_level|El]"
 RICE_tarim_basin_attend_ordam_mazar_festival_effect_tooltip_2:0 "Il y aura également des opportunités de gagner de la [piety|El] et du [prestige|El] ou de perdre du [stress|El] lors de divers événements"
 RICE_tarim_basin_attend_ordam_mazar_festival_effect_tooltip_3:0 "Vous recevrez le [character_modifier|El] [GetModifier('RICE_tarim_basin_attended_ordam_mazar').GetNameWithTooltip] à la fin"
 RICE_tarim_basin_attend_ordam_mazar_festival_confirm:0 "Faites les préparatifs pour vous rendre au #italic mazar#!."
 RICE_tarim_basin_attend_ordam_mazar_festival_context_tooltip:0 "#emphasis Contexte historique :#! Les #italic mazars#! sont des tombeaux de saints musulmans, d'imams, de martyrs et d'autres personnes saintes. En Asie centrale, des festivals sont souvent célébrés auprès de ces tombeaux. Le plus grand de ces festivals dans le bassin du Tarim est le Festival d'Ordam, qui se tient au #italic mazar#! du martyr Ali Arslan Khan, un souverain de l'Empire karakhanide. Les légendes ouïghoures locales racontent ses exploits héroïques durant la longue guerre entre les Karakhanides musulmans et le royaume bouddhiste de Khotan."
 RICE_decision_tarim_sogdia_pamir_geographical_req:0 "Vous possédez un [county|El] dans le [GetGeographicalRegion('world_steppe_tarim').GetName], la [GetGeographicalRegion('RICE_sogdia').GetName], ou le [GetGeographicalRegion('RICE_greater_pamir_region').GetName]"
 RICE_tarim_basin_become_khan_and_sultan_of_china:0 "Devenir le Khan et Sultan de Chine"
 RICE_tarim_basin_become_khan_and_sultan_of_china_tooltip:0 "Les [ROOT.Char.GetDynasty.GetName] sont véritablement une grande dynastie !"
 RICE_tarim_basin_become_khan_and_sultan_of_china_desc:0 "Bien qu'étant une terre d'infidèles, la Chine est admirée par de nombreux musulmans comme l'un des empires les plus justes et cultivés du monde. Le bassin du Tarim était dominé par la Chine dans les temps anciens, donc selon cette logique, si je contrôle suffisamment le bassin du Tarim, je pourrais légitimement me considérer comme un dirigeant de « Chine ». Après tout, il n'est pas nécessaire de gouverner #italic toute#! la « Chine » pour être un dirigeant #italic en#! « Chine » ..."
 RICE_tarim_basin_become_khan_and_sultan_of_china_effect_tooltip_1:0 "Votre [dynasty|El] #X perdra#! ce [modifier|El] si aucun [ruler|El] [fake_china_claimer.GetFaith.GetReligion.GetAdherentName] de votre famille ne contrôle entièrement au moins un [county|El] dans l'[GetGeographicalRegion('RICE_former_tang_western_region').GetName]"
 RICE_tarim_basin_become_khan_and_sultan_of_china_confirm:0 "Bien sûr que je gouverne la Chine !"
 RICE_tarim_basin_become_khan_and_sultan_of_china_context_tooltip:0 "#emphasis Contexte historique :#! Dans le monde islamique médiéval, on croyait que la Chine se composait à l'origine de trois régions : Tagbach (sud de la Chine), Khitay (nord de la Chine) et Barkhan ou Kashgar (le bassin du Tarim). L'Empire chinois était considéré comme une société idéale, leurs produits étant si désirés qu'il existait une importante industrie de contrefaçons de produits chinois au Moyen-Orient. Ainsi, de nombreux souverains de la dynastie karakhanide, qui régnaient sur des parties du bassin du Tarim, adoptèrent les titres honorifiques de Malik, Sultan et/ou Khan de Chine pour renforcer leur prestige parmi les autres musulmans."
 RICE_tarim_basin_fake_china_geographical_req:0 "Au moins cinq [counties|El] de votre [realm|El] se trouvent dans le [GetGeographicalRegion('world_steppe_tarim').GetName]"
 RICE_tarim_basin_compile_the_turkic_dictionary:0 "Compiler le premier dictionnaire turcique"
 RICE_tarim_basin_compile_the_turkic_dictionary_tooltip:0 "Nous devrions être fiers de notre langue !"
 RICE_tarim_basin_compile_the_turkic_dictionary_desc:0 "Les Arabes et les Persans, avec leurs longues traditions de langue écrite, nous méprisent, nous les Turcs, nous considérant comme des rustres illettrés. Compiler le premier dictionnaire turc contribuera grandement à prouver la beauté de notre langue, et me vaudra l'immortalité en tant qu'érudit. Le livre devrait également inclure d'autres informations pertinentes telles que la géographie et l'histoire."
 RICE_tarim_basin_compile_the_turkic_dictionary_effect_tooltip_1:0 "Une fois que vous aurez terminé d'écrire le #bold Diwan Lughat al-Turk#!, vous obtiendrez un [artifact|El] livre spécial, ainsi que de la [piety|El] et du [prestige|El]"
 RICE_tarim_basin_compile_the_turkic_dictionary_effect_tooltip_2:0 "S'ils existent, votre [liege|El], [top_liege|El], et/ou votre [head_of_faith|El] recevront également des copies, améliorant leur [opinion|El] de vous"
 RICE_tarim_basin_compile_the_turkic_dictionary_effect_tooltip_3:0 "Le livre sera terminé dans environ un à trois ans ; si vous décédez avant, votre [heir|El] recevra une version de moindre qualité de l'[artifact|El]"
 RICE_tarim_basin_compile_the_turkic_dictionary_confirm:0 "Il est temps de commencer enfin cette grande entreprise !"
 RICE_tarim_basin_compile_the_turkic_dictionary_context_tooltip:0 "#emphasis Contexte historique :#! Le Diwan Lughat al-Turk, ou « Compendium des Langues des Turcs », est l'œuvre majeure de Mahmud al-Kashgari, un érudit karakhanide qui était possiblement lié de loin au clan régnant des Karakhanides. Rédigé en 1072-1074 de notre ère, il était destiné à l'usage des Califes de Bagdad qui étaient sous domination seldjoukide. Le livre n'était pas un simple dictionnaire, car il incluait également une carte du monde du Japon à l'Égypte, diverses notes sur l'histoire et la géographie, et des exemples de poésie turque ancienne. En tant que premier dictionnaire turc, c'est une ressource historique précieuse."
 RICE_tarim_basin_someone_working_on:0 "Aucun autre érudit ne travaille actuellement à la compilation du premier dictionnaire turcique"
 RICE_tarim_basin_visit_crescent_lake:0 "Visiter le Lac du Croissant de Dunhuang"
 RICE_tarim_basin_visit_crescent_lake_tooltip:0 "Vous visiterez le lac du Croissant à Dunhuang"
 RICE_tarim_basin_visit_crescent_lake_effect_tooltip:0 "Vous perdrez du [stress|El] et gagnerez du [prestige|El], de la [piety|El], et le [character_modifier|El] [GetModifier('RICE_tarim_basin_dunhuang_crescent_lake_visit').GetNameWithTooltip]"
 RICE_tarim_basin_visit_crescent_lake_desc:0 "L'un des principaux repères géographiques près de la ville de Dunhuang est le lac dit du Croissant. C'est un lac de taille considérable situé au milieu du désert, et il se trouve près des dunes de sable chantantes de Dunhuang, tout aussi célèbres. Je souhaite visiter cet endroit pour me détendre et profiter de la vie !"
 RICE_tarim_basin_visit_crescent_lake_confirm:0 "J'ai hâte d'y être !"
 RICE_tarim_basin_visit_crescent_lake_context_tooltip:0 "#emphasis Contexte historique :#! Il existe un lac à quelques miles au sud de Dunhuang appelé #italic Yuèyá Quán#!, ou lac du Croissant. C'était un site populaire pour les loisirs dès la dynastie Han ; à une époque, il était entouré de nombreux temples et pavillons. En raison de l'utilisation excessive des eaux souterraines, le lac a rétréci à un rythme alarmant au cours des dernières décennies, bien que cela ait été quelque peu atténué par des mesures d'urgence. Cependant, des mesures plus sérieuses devront être prises si le lac doit retrouver sa gloire d'antan."
 RICE_tarim_basin_reinhabit_gomati_monastery:0 "Restaurer le monastère de Gomati"
 RICE_tarim_basin_reinhabit_gomati_monastery_tooltip:0 "Même les tragédies sont impermanentes..."
 RICE_tarim_basin_reinhabit_gomati_monastery_desc:0 "Cela me peine en tant que [ROOT.Char.GetTitleAsNameNoTooltip] [ROOT.Char.GetFaith.GetReligion.GetAdherentName] de voir le grand monastère de Gomati en ruines. Quelles horreurs les hérétiques ont-ils déchaînées sur Khotan lorsqu'ils l'ont conquis ? Pour reconstruire sa communauté [ROOT.Char.GetFaith.GetReligion.GetAdjective], notre première étape est de restaurer Gomati à sa place légitime en tant que monastère prééminent de Khotan. Peut-être que les divins [eight_protectors|El] reviendront même protéger la cité !"
 RICE_tarim_basin_reinhabit_gomati_monastery_effect_tooltip_1:0 "Le [character_modifier|El] [GetModifier('RICE_tarim_basin_khotan_eight_protectors').GetNameWithTooltip] sera accordé aux [rulers|El] bouddhistes du [county|El] de Khotan une fois de plus"
 RICE_tarim_basin_reinhabit_gomati_monastery_effect_tooltip_2:0 "Les [rulers|El] bouddhistes de Khotan et d'autres [rulers|El] proches auront de nouveau accès à l'[activity|El] pour participer à la [GetActivityType( 'activity_RICE_tarim_basin_khotan_procession' ).GetName]."
 RICE_tarim_basin_reinhabit_gomati_monastery_confirm:0 "L'avenir de Gomati est entre nos mains !"
 RICE_tarim_basin_reinhabit_gomati_monastery_context_tooltip:0 "#emphasis Contexte historique :#! À l'apogée du Khotan en tant que centre du bouddhisme, le royaume était réputé regorger de monastères, dont la plupart suivaient la secte du bouddhisme mahayana. L'un des plus grands monastères, et une sorte de premier parmi ses pairs, était le monastère de Gomati, qui était fréquemment fréquenté par la famille royale de Khotan."
 RICE_tarim_basin_construct_ordam_mazar:0 "Construire l'Ordam Mazar"
 RICE_tarim_basin_construct_ordam_mazar_tooltip:0 "Nous devrions nous souvenir de ceux qui se sont battus à juste titre pour nos convictions."
 RICE_tarim_basin_construct_ordam_mazar_desc:0 "[ROOT.Char.GetFaith.GetReligion.GetName] ne s'est répandu dans le [GetGeographicalRegion('world_steppe_tarim').GetName] que grâce aux efforts de grands martyrs. Honorons celui qui a combattu bravement contre les sauvages et pervers infidèles dans cette partie du monde, et qui est actuellement enterré à Kashgar. Il mérite plus qu'une simple tombe."
 RICE_tarim_basin_construct_ordam_mazar_effect_tooltip_1:0 "La tombe de [ali_arslan.GetTitledFirstName] sera rénovée afin qu'un grand martyr comme [ali_arslan.Custom('FR_LuiElle')] ait un lieu de repos digne de ce nom"
 RICE_tarim_basin_construct_ordam_mazar_effect_tooltip_2:0 "Les [rulers|El] musulmans de la région pourront prendre la [decision|El] #V $RICE_tarim_basin_attend_ordam_mazar_festival$#!"
 RICE_tarim_basin_construct_ordam_mazar_confirm:0 "Un tombeau digne d'un martyr digne !"
 RICE_tarim_basin_construct_ordam_mazar_context_tooltip:0 "$RICE_tarim_basin_attend_ordam_mazar_festival_context_tooltip$" 


 # Events

 tarim_basin.0001.t:0 "Spécialistes d'Asie de l'Est"
 tarim_basin.0001.desc:0 "À l'époque actuelle, nombreux sont ceux le long de la Route de la Soie qui croient que les peuples de l'extrême orient sont experts en administration et habiles dans les beaux-arts et le savoir. Peut-être une telle évaluation est-elle une grande exagération, fondée sur des récits fantaisistes et des stéréotypes douteux, mais il ne fait aucun doute que de nombreuses personnes talentueuses vivent dans ces régions.\n\nQuoi qu'il en soit, grâce à mes connexions avec la communauté est-asiatique locale, je suis entré en contact avec des individus plutôt talentueux possédant des capacités dans une grande variété de domaines, allant de la poésie à l'hydraulique, l'histoire, l'agriculture, la logistique militaire, et bien plus encore. Un certain nombre ont accepté de travailler pour moi dans mon administration."
 tarim_basin.0001.a:0 "Leurs compétences m'aideront grandement à gérer mes territoires."
 tarim_basin.0002.t:0 "Guerriers des Steppes"
 tarim_basin.0002.desc:0 "Rares sont ceux qui douteront jamais de la férocité et de la puissance des guerriers des steppes, qui combinent de manière redoutable un courage impitoyable, des compétences en matière d'équitation et d'armes diverses, ainsi qu'une ruse astucieuse pour vaincre leurs ennemis. La simple évocation de leurs hordes galopantes suffit à semer l'effroi dans le cœur de nombreuses personnes sur la Route de la soie.\n\nJ'ai la chance que la communauté locale des steppes soit bienveillante à mon égard - en fait, j'ai réussi à convaincre un certain nombre d'entre eux de se porter volontaires pour servir dans mes armées."
 tarim_basin.0002.a:0 "Maintenant, mes ennemis trembleront devant moi !"
 tarim_basin.0003.t:0 "Colons marchands du Moyen-Orient"
 tarim_basin.0003.desc:0 "Quelle que soit leur origine ethnique ou religieuse, les marchands du Moyen-Orient sont présents tout au long de la Route de la soie, qu'ils soient arabes, iraniens, juifs ou autres. Ils ont été particulièrement prolifiques dans l'établissement de colonies dans les principaux centres commerciaux et carrefours afin d'élargir leurs réseaux commerciaux.\n\nJ'ai réussi à convaincre certains membres de la communauté locale du Moyen-Orient de m'aider à recruter des personnes de leur pays ou d'ailleurs, le long de leurs réseaux de la Route de la soie, pour qu'elles viennent s'installer sur mes terres. Ils peuvent ainsi étendre leurs réseaux, tout en m'aidant à apporter encore plus de prospérité à mes terres."
 tarim_basin.0003.a:0 "J'accueille les colons avec enthousiasme - tout le monde y gagne !"
 tarim_basin.0004.t:0 "Guerriers de l'Himalaya"
 tarim_basin.0004.desc:0 "Le plateau himalayen est une terre dangereuse et escarpée. Les gens qui peuvent endurer des conditions aussi rudes - du point de vue des étrangers, du moins - sont véritablement parmi les plus redoutables au monde, et leurs guerriers sont considérés comme courageux et capables par beaucoup.\n\nUn certain nombre de ces guerriers vivent dans la communauté himalayenne locale, et j'ai longtemps cherché à tirer parti de leurs talents. J'ai réussi à convaincre un certain nombre d'entre eux de se porter volontaires pour servir dans mes armées."
 tarim_basin.0004.a:0 "Un excellent complément à mon armée."
 tarim_basin.0005.t:0 "Artisans indiens"
 tarim_basin.0005.desc:0 "L'Inde est le berceau de nombreuses cultures et croyances qui ont influencé de nombreuses autres parties du monde. Il n'est donc pas surprenant que les styles artistiques indiens se soient répandus tout au long de la Route de la soie, à la fois par l'incorporation de leurs techniques et conventions artistiques et par l'immigration d'artisans indiens qualifiés dans d'autres régions.\n\nLa communauté indienne locale, par exemple, compte un certain nombre d'artisans qualifiés. Bien que cela ait demandé quelques efforts, j'ai réussi à les persuader de travailler pour moi, et j'ai en tête plusieurs projets pour lesquels je pense que leurs compétences seront les plus précieuses."
 tarim_basin.0005.a:0 "Quelle majesté, quelle splendeur et quelle divinité ces artisans peuvent-ils créer !"
 tarim_basin.0006.t:0 "Or et ivoire d'Afrique"
 tarim_basin.0006.desc:0 "Différents produits de luxe sont échangés le long de la Route de la Soie, donc il n'y a rien de particulièrement spécial à propos de l'or et de l'ivoire, en un sens. Cela dit, ils comptent parmi les exportations les plus lucratives et populaires d'Afrique de l'Est, traversant les routes commerciales terrestres et maritimes pour arriver dans des territoires lointains.\n\nJ'ai des relations avec des communautés qui, à leur tour, disposent de réseaux le long de la côte africaine. Qu'ils soient d'origine africaine ou étrangère, leurs marchands peuvent se procurer de grandes quantités d'or et d'ivoire, avec les bons investissements. J'ai pris des mesures pour inciter ces marchands à faire transiter leur commerce d'or et d'ivoire à travers mes terres, et aussi à me verser une part de leurs profits."
 tarim_basin.0006.a:0 "Laissez les échanges se faire."
 tarim_basin.0007.t:0 "Marins d'Asie du Sud-Est"
 tarim_basin.0007.desc:0 "Les peuples qui vivent sur les côtes, les îles et les rivières de l'Asie du Sud-Est jouent un rôle important dans les routes commerciales maritimes qui relient l'océan Indien à la Chine. Pendant des siècles, ils ont perfectionné leurs compétences en tant que voyageurs des mers.\n\nGrâce à mes connexions avec la communauté locale d'Asie du Sud-Est, j'ai recruté des marins, des constructeurs navals et des marchands maritimes pour m'assister avec ma marine, protéger mes côtes, encourager le commerce maritime, et me conseiller, moi et mon peuple, sur la meilleure façon de voyager le long des mers."
 tarim_basin.0007.a:0 "Leur expertise maritime nous sera bien utile."
 tarim_basin.0008.t:0 "xxxxx"
 tarim_basin.0008.desc:0 "xxxxx"
 tarim_basin.0008.a:0 "xxxxx"
 tarim_basin.0009.t:0 "xxxxx"
 tarim_basin.0009.desc:0 "xxxxx"
 tarim_basin.0009.a:0 "xxxxx"
 tarim_basin.0010.t:0 "Devenir Han"
 tarim_basin.0010.desc:0 "Les gens d'ascendance [old_culture.GetName] ont toujours vécu parmi les Chinois. Certains d'entre nous n'ont pas seulement adopté leurs coutumes, mais ont atteint un statut élevé dans leur société, comme moi-même. Nous dont les familles sont originaires des soi-disant Régions occidentales avons fait nos preuves en tant que généraux, érudits, bureaucrates, et bien plus encore.\n\nIl est inévitable que nous soyons devenus plus [ROOT.Char.GetCulture.GetCollectiveNoun|l] dans nos habitudes et notre vision du monde. J'ai donc ordonné que ma maisonnée et moi-même embrassions formellement leur culture, mais je prendrai également pour moi-même un nouveau nom [ROOT.Char.GetCulture.GetCollectiveNoun|l] convenable."
 tarim_basin.0010.desc.867:0 "\n\nÀ la lumière de la rébellion d'An Lushan, qui eut lieu durant les règnes des défunts Empereurs Xuanzong, Suzong et Daizong, nous avons honte que certains nous associent à ce traître en raison de ses origines sogdiennes. Choisir un nom [ROOT.Char.GetCulture.GetCollectiveNoun|l] serait un bon moyen de prouver que je suis [ROOT.Char.GetCulture.GetCollectiveNoun|l] de cœur !"
 tarim_basin.0010.a:0 "Oui... c'est un bon nom [ROOT.Char.GetCulture.GetCollectiveNoun|l]."
 tarim_basin.0010.b:0 "Un nouveau nom est inutile. Je sais qui je suis."
 tarim_basin.0011.t:0 "$travel_event_prefix$ Commerce de la Route de la soie"
 tarim_basin.0011.desc:0 "En voyageant avec [merchant.GetFirstName] et ses caravanes marchandes, j'ai découvert des opportunités commerciales que je n'aurais pas eues autrement.\n\nAlors que nous étions à [ROOT.Char.GetCurrentLocation.GetName], nous avons pu conclure un accord commercial favorable avec des marchands rencontrés là-bas. Je pourrais accepter l'accord tel quel, ou prendre le risque de négocier pour en tirer davantage des autres marchands, mais ils pourraient refuser et l'accord pourrait tomber à l'eau."
 tarim_basin.0011.a:0 "Nous devrions nous en tenir à l'accord initial."
 tarim_basin.0011.b:0 "Marchandons pour obtenir un accord encore meilleur !"
 tarim_basin.0011.b.failure:0 "Votre marchandage #N échoue#! !"
