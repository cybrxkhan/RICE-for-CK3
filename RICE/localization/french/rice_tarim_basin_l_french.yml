 tarim_basin.0172.t:0 "La fin du Khotan bouddhiste ?"
 tarim_basin.0172.desc:0 "Pendant des siècles, [khotan.GetNameNoTier] fut un grand centre d'apprentissage et de culture bouddhiste dans le bassin du Tarim, avec une myriade de monastères et de temples. La légende raconte que le Bouddha chargea plusieurs divinités, les fameux Huit Protecteurs, de veiller sur la cité tant que le peuple resterait fidèle à ses enseignements. Cependant, l'un des enseignements fondamentaux du bouddhisme est l'idée que toute chose est impermanente, et [khotan.GetNameNoTier] ne fait pas exception. Il est clair que les Huit Protecteurs ont abandonné la cité.\n\nIl y a de nouveaux dirigeants à [khotan.GetNameNoTier] désormais, en particulier [khotan_new_ruler.GetTitledFirstName]. Qu'il s'agisse d'un[khotan_new_ruler.Custom('FR_E')] conquérant[khotan_new_ruler.Custom('FR_E')] ayant déferlé sur le bassin du Tarim ou d'un[khotan_new_ruler.Custom('FR_E')] autochtone converti[khotan_new_ruler.Custom('FR_E')], [khotan_new_ruler.GetSheHe] croit que la vérité du monde réside dans [khotan_new_ruler.GetFaith.GetReligion.GetName]. En un clin d'œil, la terre et son peuple se sont transformés, et ils ont commencé à accepter, honorer et vénérer [khotan_new_ruler.GetFaith.HighGodName], et non le Bouddha. Néanmoins, des rapports indiquent que certains Khotanais encore fidèles à leur foi ancestrale, y compris un certain nombre de monastiques, ont fui ailleurs."
 tarim_basin.0172.a:0 "Une nouvelle ère se lève sur la région, peut-être."
 tarim_basin.0172.b:0 "Les Huit Protecteurs ont abandonné Khotan... un jour terrible !"
 tarim_basin.0172.tooltip.1:0 "De toute évidence, les [eight_protectors|El] ont abandonné Khotan. Ainsi, le [character_modifier|El]  [GetModifier('RICE_tarim_basin_khotan_eight_protectors').GetNameWithTooltip] ne sera plus accordé aux [rulers|El] bouddhistes du [county|El] de [khotan.GetNameNoTier]."
 tarim_basin.0172.tooltip.2:0 "Pendant les prochaines décennies, des réfugiés bouddhistes de Khotan, en particulier des monastiques, peuvent apparaître dans d'autres [realms|El] bouddhistes voisins (s'il y en a)"
 tarim_basin.0173.t:0 "[khotan_refugee.Custom('FR_LeLa')|U]  réfugié[khotan_refugee.Custom('FR_E')]  de Khotan"
 tarim_basin.0173.desc:0 "Aujourd'hui, un[khotan_refugee.Custom('FR_E')] réfugié[khotan_refugee.Custom('FR_E')] de [khotan.GetNameNoTier] est arrivé[khotan_refugee.Custom('FR_E')]  à ma cour, répondant au nom de [khotan_refugee.GetFullName]. Nous ne pouvons que pleurer et déplorer les nombreuses souffrances qu'[khotan_refugee.GetSheHe] a dû endurer pour arriver ici.\n\nIl n'y a pas si longtemps, l'autrefois grand bastion de [ROOT.Char.GetFaith.GetReligion.GetName], la cité de [khotan.GetNameNoTier], a été prise par l'ignoble [khotan_new_ruler.GetTitledFirstName] et transformée au-delà de toute reconnaissance ; en vérité, elle s'est détournée de son passé glorieux. Avec tous les récits de monastères abandonnés, pillés et détruits, et la persécution des justes et des dévots, une inquiétude grandissante plane sur l'avenir de la région. J'ai même entendu dire que des [ROOT.Char.Custom('DefaultPriestTitlePlural')] enterraient des écritures sacrées, des statues, des reliques et d'autres objets saints par précaution, de peur que les hérétiques ne viennent dans notre direction."
 tarim_basin.0173.desc.monastic:0 "\n\n[khotan_refugee.GetFirstName] espère que je puisse lui accorder, à [khotan_refugee.Custom('FR_LuiElle')] et à de nombreux autres [ROOT.Char.Custom('DefaultPriestTitlePlural')|U], refuge dans mes terres. À [khotan.GetNameNoTier], [khotan_refugee.GetSheHe] était un membre éminent de la communauté monastique [ROOT.Char.GetFaith.GetReligion.GetAdjective]. [khotan_refugee.GetSheHe|U] dit qu'[khotan_refugee.GetSheHe] a apporté avec [khotan_refugee.Custom('FR_LuiElle')] de nombreuses écritures précieuses et des artefacts religieux à mettre en sécurité."
 tarim_basin.0173.desc.noble:0 "\n\n[khotan_refugee.GetFirstName] espère que je pourrai lui accorder, à [khotan_refugee.Custom('FR_LuiElle')] et à quelques autres personnalités de [khotan.GetNameNoTier], refuge dans mes terres. À [khotan.GetNameNoTier], [khotan_refugee.GetSheHe] était un membre éminent de l'aristocratie [ROOT.Char.GetFaith.GetReligion.GetAdjective] locale. [khotan_refugee.GetSheHe|U] possède certaines compétences et pourrait également me servir en tant que courtisan[khotan_refugee.Custom('FR_E')]."
 tarim_basin.0173.a:0 "Ces temps sont difficiles pour les fidèles. Vous êtes [khotan_refugee.Custom('FR_LeLa')] bienvenu[khotan_refugee.Custom('FR_E')] à ma cour !"
 tarim_basin.0173.b:0 "Je ne peux pas vous aider beaucoup, mais n'hésitez pas à vous installer quelque part dans mon royaume."
 tarim_basin.0174.t:0 "Le retour des Huit Protecteurs"
 tarim_basin.0174.desc:0 "Les ténèbres qui recouvraient [khotan.GetNameNoTier] ne sont plus. La lumière de [ROOT.Char.GetFaith.GetReligion.GetName] est revenue dans la cité, et les terribles hérétiques qui ont failli mettre fin à sa glorieuse histoire [ROOT.Char.GetFaith.GetReligion.GetAdjectiveNoTooltip]s ont disparu.\n\nBien que leurs actes destructeurs soient répréhensibles, heureusement tout n'a pas été complètement détruit. Plus remarquable encore, se dressent toujours les ruines du monastère de Gomati, premier parmi ses pairs de tous les monastères de [khotan.GetNameNoTier] dans les temps anciens. J'ai travaillé avec les monastiques de mon royaume pour acquérir les ressources nécessaires à la restauration de Gomati dans sa gloire passée.\n\nAprès avoir accompli cela, j'ai entendu certains affirmer que les Huit Protecteurs sont heureux de voir que [khotan.GetNameNoTier] est revenue aux enseignements du Bouddha. Ces divinités, dit-on, sont de retour à [khotan.GetNameNoTier] pour défendre la cité une fois encore, tout comme le Bouddha leur a ordonné de le faire il y a tant de siècles."
 tarim_basin.0174.a:0 "Peut-être que les Huit Protecteurs sont bel et bien revenus."
 tarim_basin.0175.t:0 "Le retour des Huit Protecteurs"
 tarim_basin.0175.desc:0 "Il y a quelque temps, il semblait que la lumière de [khotan_buddhism_restorer.GetFaith.GetReligion.GetName] était sur le point de s'éteindre à [khotan.GetNameNoTier], lorsque les nouveaux dirigeants de la cité - qui suivaient un credo différent - prirent le pouvoir et établirent leur propre foi dans la région. La survie des enseignements du Bouddha semblait compromise pendant un temps.\n\nCela est en train de changer. Pour diverses raisons, [khotan_buddhism_restorer.GetFaith.GetReligion.GetName] fait son retour à [khotan.GetNameNoTier]. Sous la direction de [khotan_buddhism_restorer.GetTitledFirstName], des efforts ont été entrepris pour retrouver le passé religieux ancien de la cité. En particulier, [khotan_buddhism_restorer.GetSheHe] a contribué[khotan_buddhism_restorer.Custom('FR_E')] en fonds et en ressources à la restauration de Gomati, autrefois - et désormais à nouveau - le monastère le plus éminent de [khotan.GetNameNoTier].\n\nLa rumeur court même parmi les fidèles dévots des enseignements du Bouddha que les Huit Protecteurs, divinités nobles et puissantes qui défendent le Dharma, sont revenus à [khotan.GetNameNoTier] et le protègent désormais depuis les cieux."
 tarim_basin.0175.a:0 "Quelle joie, quelles bénédictions !"
 tarim_basin.0175.b:0 "Intéressant.... Nous verrons ce qui se passera ensuite."
