 # Buildings
 building_type_RICE_tarim_basin_mogao_caves:0 "Grottes de Mogao"
 building_type_RICE_tarim_basin_mogao_caves_desc:0 "Les grottes des mille bouddhas de Dunhuang sont un réseau de centaines de grottes qui servent de temples et de sanctuaires dédiés au culte bouddhiste, à la prière et à la méditation. Les plus anciennes grottes ont été creusées au IVe siècle et, depuis lors, des fidèles venus d'aussi loin que la Chine centrale et le Khotan ont parrainé la construction de diverses grottes. De nombreux clans d'élite locaux possèdent leurs propres grottes qu'ils entretiennent depuis des siècles."
 building_RICE_tarim_basin_mogao_caves:0 "$building_type_RICE_tarim_basin_mogao_caves$"
 building_RICE_tarim_basin_mogao_caves_desc:0 "$building_type_RICE_tarim_basin_mogao_caves_desc$"
 building_type_RICE_tarim_basin_bezeklik_caves:0 "Grottes de Bezeklik"
 building_type_RICE_tarim_basin_bezeklik_caves_desc:0 "Les grottes des mille bouddhas de Bezeklik sont un ensemble de grottes bouddhistes datant de plusieurs siècles. Le site n'a cependant pris de l'importance que récemment et est devenu un important lieu de culte et de pèlerinage pour les bouddhistes locaux."
 building_RICE_tarim_basin_bezeklik_caves:0 "$building_type_RICE_tarim_basin_bezeklik_caves$"
 building_RICE_tarim_basin_bezeklik_caves_desc:0 "$building_type_RICE_tarim_basin_bezeklik_caves_desc$"
 building_type_RICE_tarim_basin_kizil_caves:0 "Grottes de Kizil"
 building_type_RICE_tarim_basin_kizil_caves_desc:0 "Les grottes de Kizil aux mille bouddhas sont un ensemble de centaines de grottes bouddhistes datant de plusieurs siècles, qui servent de lieu saint local. Bien que les grottes soient de plus en plus abandonnées et que nombre d'entre elles soient tombées en ruine, elles sont toujours utilisées pour le culte et constituent les plus grandes grottes de ce type dans le bassin du Tarim. Elles ne sont dépassées en taille et en splendeur que par les grottes de Mogao en ce qui concerne les grottes bouddhistes de la région."
 building_RICE_tarim_basin_kizil_caves:0 "$building_type_RICE_tarim_basin_kizil_caves$"
 building_RICE_tarim_basin_kizil_caves_desc:0 "$building_type_RICE_tarim_basin_kizil_caves_desc$"
 building_type_RICE_tarim_basin_khotan_jade_deposits_01:0 "Gisements de jade khotanais"
 building_type_RICE_tarim_basin_khotan_jade_deposits_01_desc:0 "Depuis la préhistoire, le jade est l'un des principaux produits d'exportation de Khotan. Il est apprécié pour sa durabilité et sa beauté, en particulier en Extrême-Orient, où il est exporté en grand nombre. Dans la région de Khotan, le jade provient de deux sources principales : les montagnes Kunlun, situées à proximité, et les dépôts alluviaux de la rivière Yurungqash."
 building_RICE_tarim_basin_khotan_jade_deposits_01:0 "Colonie minière de Jade"
 building_RICE_tarim_basin_khotan_jade_deposits_01_desc:0 "Les habitants des petites localités proches de Khotan, disséminées dans les montagnes et les rivières adjacentes, travaillent dur pour extraire le précieux jade néphrite."
 building_RICE_tarim_basin_khotan_jade_deposits_02:0 "Mine de Jade"
 building_RICE_tarim_basin_khotan_jade_deposits_02_desc:1 "Le jade est extrait de la région de Khotan en plus grand nombre, dans des colonies de plus en plus nombreuses, ce qui accroît la richesse de Khotan."
 building_RICE_tarim_basin_khotan_jade_deposits_03:0 "Grande mine de jade"
 building_RICE_tarim_basin_khotan_jade_deposits_03_desc:0 "Les gisements de jade autour de Khotan sont systématiquement exploités, et ces efforts sont gérés par des marchands entreprenants et des fonctionnaires locaux, qui connaissent la valeur du jade pour les étrangers venus de l'est."
 building_RICE_tarim_basin_khotan_jade_deposits_04:0 "Complexe minier de Jade"
 building_RICE_tarim_basin_khotan_jade_deposits_04_desc:0 "L'industrie du jade de Khotan, l'une des rares régions d'Asie à posséder encore d'importants gisements de jade, est aujourd'hui mature et bien développée. C'est l'une des principales sources de revenus de la ville."
 building_type_RICE_tarim_basin_dafo_temple:0 "Temple Dafo"
 building_type_RICE_tarim_basin_dafo_temple_desc:0 "Le temple Dafo, ou temple du Grand Bouddha, abrite l'une des plus grandes statues de Bouddha couché au monde. On raconte qu'un moine bouddhiste entendit des sons célestes et vit des lumières provenant d'une colline ; lorsqu'il l'explora, il découvrit une magnifique statue de Bouddha couché. Il bâtit ce temple sur cette même colline en l'honneur de cette découverte de bon augure."
 building_RICE_tarim_basin_dafo_temple:0 "$building_type_RICE_tarim_basin_dafo_temple$"
 building_RICE_tarim_basin_dafo_temple_desc:0 "$building_type_RICE_tarim_basin_dafo_temple_desc$"
 


 # Modifiers
 RICE_tarim_basin_kuchean_music:0 "Musique koutchéenne"
 RICE_tarim_basin_kuchean_music_desc:0 "Kucha est renommée comme une cité de délices sans fin ; des hommes venus de loin rêvent de visiter ses nombreuses maisons de plaisir remplies de musiciens talentueux, de danseurs et de courtisanes. Ainsi, la musique kuchéenne est devenue extrêmement populaire à travers le monde, aussi loin que l'Empire du Milieu.\n\n#italic Tant que ce [county_modifier|El] est actif, les [rulers|El] du [county|El] de Kucha ont accès à une [character_interaction|El] spéciale pour #bold Présenter des [kuchean_entertainers|El] qualifiés#!, qui est une version plus puissante de #bold Présenter des [silk_road_entertainers|El] qualifiés#! et est également disponible à tout moment#!"
 RICE_tarim_basin_recently_sinicized:0 "Récemment sinisé"
 RICE_tarim_basin_zhang_clan:0 "Sang du clan Zhang"
 RICE_tarim_basin_zhang_clan_desc:0 "En tant que clan qui s'est débarrassé du joug de l'empire tibétain et qui a rendu le corridor du Gansu au contrôle chinois, le clan Zhang s'est attiré l'estime des autres clans de Dunhuang, du moins publiquement."
 RICE_tarim_basin_cao_clan:0 "Sang du clan Cao"
 RICE_tarim_basin_cao_clan_desc:0 "Les Cao de Dunhuang prétendent descendre du grand clan aristocratique des Cao en Chine. Si la revendication d'un héritage aussi prestigieux est contestée, leur talent, leur diligence et leur ambition ne le sont pas. La seule question qui se pose est de savoir quelles #italic sont#! exactement leurs ambitions."
 RICE_tarim_basin_suo_clan:0 "Le sang du clan Suo"
 RICE_tarim_basin_suo_clan_desc:0 "Les Suo vivent à Dunhuang depuis la dynastie Han et sont peut-être l'un des plus anciens clans de Dunhuang encore présents. Réputés pour leur savoir et leur culture, leur membre le plus célèbre est le calligraphe Suo Jing de la dynastie Jin."
 RICE_tarim_basin_li_clan:0 "Le sang des Longxi Li"
 RICE_tarim_basin_li_clan_desc:0 "Les Li de Dunhuang, également connus sous le nom de Longxi Li, prétendent être les descendants du général Han Li Guang et, par extension, du sage taoïste Laozi. Les empereurs Tang eux-mêmes descendent d'une branche des Longxi Li. Leur nom est donc extrêmement prestigieux et ils jouissent d'un grand respect dans la société de Dunhuang."
 RICE_tarim_basin_zhai_clan:0 "Le sang du clan Zhai"
 RICE_tarim_basin_zhai_clan_desc:0 "Connus pour leurs activités intellectuelles, religieuses et administratives, les Zhai n'ont pas toujours autant de pouvoir que les autres grands clans de Dunhuang, mais ils savent naviguer habilement et s'adapter à un climat politique en constante évolution, sachant avec qui et avec qui ne pas travailler."
 RICE_tarim_basin_yin_clan:0 "Le sang du clan Yin"
 RICE_tarim_basin_yin_clan_desc:0 "Les Yin sont un ancien clan noble de Dunhuang, dont l'ancêtre Yin Dan s'est réfugié dans cette ville après la chute de la dynastie Han. Ils sont connus pour leurs liens avec de nombreuses familles sogdiennes et étaient également de fervents partisans de l'impératrice Wu Zeitian à l'époque, car ils auraient été témoins de présages favorables légitimant son règne."
 RICE_tarim_basin_yan_clan:0 "Le sang du clan Yan"
 RICE_tarim_basin_yan_clan_desc:0 "Le clan Yan de Dunhuang a toujours su jouer le jeu de la politique et travailler pour les bons maîtres. Leur membre le plus célèbre, Yan Chao, a résisté héroïquement à l'invasion tibétaine de Dunhuang et a pu négocier une reddition favorable qui a épargné la ville."
 RICE_tarim_basin_guiyi_tang_distrust:0 "Méfiance de la Cour des Tang"
 RICE_tarim_basin_guiyi_tang_distrust_desc:0 "Bien que le Circuit de Guiyi revendique une allégeance nominale à la dynastie Tang, en raison d'un historique de tensions entre les deux parties, les Tang ne sont pas disposés à réciprociter et à fournir beaucoup d'aide à ces seigneurs de guerre de la frontière occidentale.\n\n#EMP Ce [character_modifier|El] est attribué à quiconque est [ruler|El] du Circuit de Guiyi jusqu'en 888 de notre ère."
 RICE_tarim_basin_is_zhang_yichao:0 "Libérateur de Dunhuang"
 RICE_tarim_basin_is_zhang_yichao_desc:0 "Le grand Zhang Yichao, digne héros de cette époque de conflits et de luttes, est né dans une famille de nobles estimés à Dunhuang. Il a conduit le peuple de sa patrie à chasser les souverains tibétains en 848 de notre ère et a habilement géré la région depuis lors."
 RICE_tarim_basin_built_mogao_cave_normal:0 "Patronage de la petite grotte de Mogao"
 RICE_tarim_basin_built_mogao_cave_normal_desc:0 "Ce personnage a récemment patronné la construction d'une grotte de Bouddha de taille modeste dans les [mogao_caves|El] près de Dunhuang. Cet acte leur apportera certainement un bon mérite karmique."
 RICE_tarim_basin_built_mogao_cave_big:0 "Patronage Moyen Grotte de Mogao"
 RICE_tarim_basin_built_mogao_cave_big_desc:0 "Ce personnage a récemment financé la construction d'une grotte de Bouddha de taille raisonnable dans les [mogao_caves|El] près de Dunhuang. La grotte est très belle, comme il sied à une grotte commandée par un membre de l'élite locale."
 RICE_tarim_basin_built_mogao_cave_bigger:0 "Grande grotte de Mogao patronnée"
 RICE_tarim_basin_built_mogao_cave_bigger_desc:0 "Ce personnage a récemment patronné la construction d'une grande grotte de Bouddha dans les [mogao_caves|El] près de Dunhuang. La grotte est l'une des plus splendides et des plus grandes construites depuis de nombreuses années, et a suscité l'éloge et l'admiration de beaucoup."
 RICE_tarim_basin_built_mogao_cave_biggest:0 "Patronage d'une immense grotte de Mogao"
 RICE_tarim_basin_built_mogao_cave_biggest_desc:0 "Ce personnage a récemment patronné la construction d'une nouvelle Grotte de Bouddha extrêmement grandiose dans les [mogao_caves|El] près de Dunhuang. La grotte est l'un des plus grands complexes de grottes de tout le site de Mogao, remplie de visuels éblouissants et d'un art à couper le souffle."
 RICE_tarim_basin_silk_road_entertainers:0 "Artistes exotiques de la Route de la soie"
 RICE_tarim_basin_silk_road_entertainers_desc:0 "Un autre dirigeant a récemment offert à ce personnage un groupe d'artistes talentueux venus de toute la Route de la soie, comprenant des musiciens, des acrobates, des danseurs, des courtisanes, de beaux esclaves, et bien plus encore. Ces nouveaux membres de la cour de ce personnage contribueront grandement à rehausser le statut de leur nouveau maître ou maîtresse."
 RICE_tarim_basin_kuchean_entertainers:0 "Les artistes exotiques koutchéens"
 RICE_tarim_basin_kuchean_entertainers_desc:0 "Un autre souverain a récemment offert à ce personnage un groupe d'artistes qualifiés dans la célèbre cité des plaisirs de Kucha, comprenant des musiciens, des acrobates, des danseurs, des courtisans, de magnifiques esclaves, et bien d'autres choses encore. Ces nouveaux membres de la cour de ce personnage contribueront grandement à améliorer le statut de leur nouveau maître ou de leur nouvelle maîtresse, surtout si l'on tient compte de la réputation de Kucha en matière de musique et de divertissements."
 RICE_tarim_basin_gifted_silk_road_entertainers:0 "A offert des artistes de la Route de la soie en cadeau"
 RICE_tarim_basin_gifted_kuchean_entertainers:0 "A offert des artistes koutchéens en cadeau"
 RICE_tarim_basin_east_asian_contacts:0 "Contacts avec les [silk_road_communities_short|El] est-asiatiques"
 RICE_tarim_basin_east_asian_contacts_desc:0 "Ce personnage a des connexions avec des personnes d'Asie orientale ou siniques d'origine étrangère vivant dans leur partie de la soi-disant Route de la soie, et ils entretiennent de bonnes relations avec les membres de l'élite de ces communautés.\n\n#EMP Augmente la quantité et les chances de recevoir des cadeaux de [prestige|El] et de [dynasty_prestige|El] de la part des [silk_road_communities|El] locales\nDébloque la [decision|El] de #V $RICE_silk_road_community_east_asian_decision$#!#!"
 RICE_tarim_basin_steppe_contacts:0 "Contacts avec les [silk_road_communities_short|El] des steppes"
 RICE_tarim_basin_steppe_contacts_desc:0 "Ce personnage a des connexions avec des peuples nomades des steppes d'origine étrangère vivant dans leur partie de la dite Route de la soie, et ils entretiennent de bonnes relations avec les membres de l'élite de ces communautés.\n\n#EMP Augmente la quantité et les chances de recevoir des dons de [special_troops|El] et de [character_modifiers|El] qui améliorent la [scheme_success_chance|El] et l'[advantage|El] dans les [battles|El]\nDébloque la [decision|El] pour #V $RICE_silk_road_community_steppe_decision$#!#!"
 RICE_tarim_basin_middle_eastern_contacts:0 "Contacts avec les [silk_road_communities_short|El] du Moyen-Orient"
 RICE_tarim_basin_middle_eastern_contacts_desc:0 "Ce personnage a des connexions avec des personnes arabes, iraniennes et juives d'origine étrangère vivant dans leur partie de la soi-disant Route de la soie, et il entretient de bonnes relations avec les membres de l'élite de ces communautés.\n\n#EMP Augmente la quantité et les chances de recevoir des cadeaux de [character_modifiers|El] qui améliorent le [gold|El] [income|El], ou les coûts de [county_modifiers|El] de [building|El] et le [control|El] dans votre [realm_capital|El] de la part des [silk_road_communities|El] locales\nDébloque la [decision|El] pour #V $RICE_silk_road_community_middle_eastern_decision$#!#!"
 RICE_tarim_basin_himalayan_contacts:0 "Contacts avec les [silk_road_communities_short|El] himalayennes"
 RICE_tarim_basin_himalayan_contacts_desc:0 "Ce personnage a des connexions avec des peuples himalayens d'origine étrangère vivant dans leur partie de la soi-disant Route de la soie, et ils entretiennent de bonnes relations avec les membres d'élite de ces communautés.\n\n#EMP Augmente la quantité et les chances de recevoir des cadeaux de [character_modifiers|El] qui améliorent la [scheme_resistance|El] et la [prowess|El], ou la [health|El], la [fertility|El], et la gestion du [stress|El] de la part des [silk_road_communities|El] locales\nDébloque la [decision|El] pour #V $RICE_silk_road_community_himalayan_decision$#!#!"
 RICE_tarim_basin_indian_contacts:0 "Contacts avec les [silk_road_communities_short|El] indiennes"
 RICE_tarim_basin_indian_contacts_desc:0 "Ce personnage a des connexions avec des personnes indiennes d'origine étrangère vivant dans leur partie de la soi-disant Route de la soie, et il entretient de bonnes relations avec les membres de l'élite de ces communautés.\n\n#EMP Augmente la quantité et les chances de recevoir des dons de [piety|El], ou de [character_modifiers|El] qui améliorent l'[lifestyle_experience|El]\nDébloque la [decision|El] pour #V $RICE_silk_road_community_indian_decision$#!#!"
 RICE_tarim_basin_east_african_contacts:0 "Contacts avec les [silk_road_communities_short|El] d'Afrique de l'Est"
 RICE_tarim_basin_east_african_contacts_desc:0 "Ce personnage a des contacts avec des personnes est-africaines d'origine étrangère vivant dans leur partie de la soi-disant Route de la soie, et il entretient de bonnes relations avec les membres de l'élite de ces communautés.\n\n#EMP Augmente la quantité et les chances de recevoir des dons de [special_troops|El] et de [character_modifiers|El] qui améliorent la [scheme_resistance|El] et la [prowess|El]\nDébloque la [decision|El] de #V $RICE_silk_road_community_east_african_decision$#!#!"
 RICE_tarim_basin_southeast_asian_contacts:0 "Contacts avec les [silk_road_communities_short|El] d'Asie du Sud-Est"
 RICE_tarim_basin_southeast_asian_contacts_desc:0 "Ce personnage a des connexions avec des peuples d'Asie du Sud-Est d'origine étrangère vivant dans leur partie de la soi-disant Route de la soie, et il entretient de bonnes relations avec les membres de l'élite de ces communautés.\n\n#EMP Augmente la quantité et les chances de recevoir des cadeaux de [character_modifiers|El] qui améliorent la [travel_speed|El] et réduisent le [travel_danger|El] en [terrain|El] maritime, ou la [health|El], la [fertility|El], et la gestion du [stress|El]\nDébloque la [decision|El] pour #V $RICE_silk_road_community_southeast_asian_decision$#!#!"
 RICE_tarim_basin_east_asian_specialists:0 "Spécialistes de l'Asie de l'Est"
 RICE_tarim_basin_east_asian_specialists_desc:0 "Plusieurs experts de l'Empire du Milieu ou d'autres pays voisins influencés par leur culture ont été recrutés pour travailler avec ce personnage. Ils possèdent des compétences variées dans les domaines de l'administration, du droit, des travaux publics, de la stratégie, etc."
 RICE_tarim_basin_merchant_settlers:0 "Marchands colons"
 RICE_tarim_basin_merchant_settlers_desc:0 "Plusieurs communautés de marchands arabes ou iraniens s'y sont installées récemment. En tant que gardiens de la « Route de la soie », leur présence stimulera l'économie locale."
 RICE_tarim_basin_indic_artisans:0 "Artisans indiens"
 RICE_tarim_basin_indic_artisans_desc:0 "L'art indien est influent dans de nombreuses régions du monde, c'est pourquoi ce personnage a récemment engagé un certain nombre de ces artisans. Ces compétences artistiques seront certainement d'une grande utilité."
 RICE_tarim_basin_african_contracts:0 "Importer de l'or et de l'ivoire"
 RICE_tarim_basin_african_contracts_desc:0 "Ce dirigeant a négocié avec des marchands opérant depuis l'Afrique de l'Est pour attirer davantage de leur commerce vers les terres qu'il gouverne, en particulier en ce qui concerne le lucratif commerce de l'or et de l'ivoire qui constitue l'essentiel des exportations est-africaines."
 RICE_tarim_basin_southeast_asian_shipbuilders:0 "Constructeurs navals d'Asie du Sud-Est"
 RICE_tarim_basin_southeast_asian_shipbuilders_desc:0 "Les divers royaumes, cités-états et tribus d'Asie du Sud-Est comptent de nombreuses personnes ayant de l'expérience et des connaissances en matière de voile, de construction navale, de navigation, de commerce maritime, etc. Ce personnage a fait appel à de nombreuses personnes pour le conseiller dans ces domaines."
 RICE_tarim_basin_lop_nur_dry_period:0 "Période sèche à Lop Nur"
 RICE_tarim_basin_lop_nur_dry_period_desc:0 "Que ce soit en raison de changements climatiques et de modifications des cours d'eau, ou en raison de l'activité humaine entraînant une désertification croissante, le lac autrefois imposant de Lop Nur s'est considérablement rétréci, transformant ce lac jadis luxuriant en terres arides, désolées et inhospitalières. Cela met à rude épreuve les colonies avoisinantes qui peinent à maintenir les niveaux agricoles antérieurs. Beaucoup fuient la région, et l'économie locale en souffre."
 RICE_tarim_basin_lop_nur_fluctuations:0 "Fluctuation du niveau des lacs à Lop Nur"
 RICE_tarim_basin_lop_nur_fluctuations_desc:0 "Il y a plusieurs générations, le lac Lop Nur, autrefois très étendu, a commencé à se réduire considérablement, que ce soit en raison de changements climatiques ou fluviaux, ou encore de l'activité humaine. Bien que cette longue « période sèche » soit maintenant terminée, le lac n'est plus que l'ombre de lui-même, son niveau continuant à fluctuer et à diminuer progressivement. L'économie locale est loin d'avoir connu son heure de gloire et les ruines d'anciennes colonies abandonnées sont éparpillées un peu partout."
 RICE_tarim_basin_fake_china_dynasty:0 "Khans et Sultans de Chine"
 RICE_tarim_basin_fake_china_dynasty_desc:0 "Les souverains de cette dynastie, régnant sur des parties du bassin du Tarim, s'octroient régulièrement des titres honorifiques liés à la Chine, tels que Malik al-Mashriq wa al-Sin ( « Roi de l'Est et de la Chine » ), Sultan al-Sharq wa al-Sin ( « Sultan de l'Est et de la Chine » ), et Tabgach Khan ( « Khan de Chine » ). De nombreux musulmans de l'époque actuelle voient la Chine comme une société exemplaire et idéale, gouvernée par des érudits vertueux et savants, et produisant des luxes raffinés. Contrôler le bassin du Tarim, autrefois un domaine de la Chine dans les temps anciens, signifie techniquement contrôler une partie de la Chine, non ?\n\n#EMP Ce [modifier|El] sera définitivement #N perdu#! si cette [dynasty|El] n'a plus aucun membre [ruler|El], ni si elle ne détient plus aucun territoire dans l'[GetGeographicalRegion('RICE_former_tang_western_region').GetName]#!"
 RICE_tarim_basin_is_al_kashgari_upgrade:0 "Le fier lexicographe turc"
 RICE_tarim_basin_is_al_kashgari_upgrade_desc:0 "Mahmud al-Kashgari n'est pas un érudit sans envergure : il a beaucoup voyagé, beaucoup vu et étudié de nombreux pays du monde. Travailleur acharné, il a atteint l'objectif qu'il s'était fixé dans sa vie : rédiger le premier dictionnaire complet des langues turques."
 RICE_tarim_basin_working_on_turkic_dictionary:0 "Travailler sur le premier dictionnaire turc"
 RICE_tarim_basin_working_on_turkic_dictionary_desc:0 "Ce personnage travaille actuellement à la rédaction du premier dictionnaire turc. Il prouvera bientôt au monde que les Turcs ont un héritage linguistique et littéraire aussi respectable que celui de n'importe quel autre peuple !"
 RICE_tarim_basin_eight_protectors_blessing_1:0 "$RICE_tarim_basin_eight_protectors_blessing_2$ mineure"
 RICE_tarim_basin_eight_protectors_blessing_1_desc:0 "On dit que ce personnage a reçu les bénédictions des [eight_protectors_of_khotan|El], après avoir participé à la procession religieuse annuelle de la ville. Selon la légende, le Bouddha a désigné huit divinités pour protéger Khotan, assurer sa souveraineté et défendre les enseignements bouddhistes. Ces huit divinités sont Aparajita, Samjnaya, Gaganasvara, Suvarnamala, Grhavatapta, Amgusa, Sthanavati et Vaisravana."
 RICE_tarim_basin_eight_protectors_blessing_2:0 "Bénédictions des Huit Protecteurs de Khotan"
 RICE_tarim_basin_eight_protectors_blessing_2_desc:0 "$RICE_tarim_basin_eight_protectors_blessing_1_desc$"
 RICE_tarim_basin_eight_protectors_blessing_3:0 "$RICE_tarim_basin_eight_protectors_blessing_2$ majeure"
 RICE_tarim_basin_eight_protectors_blessing_3_desc:0 "$RICE_tarim_basin_eight_protectors_blessing_1_desc$"
 RICE_tarim_basin_eight_protectors_blessing_4:0 "Grande $RICE_tarim_basin_eight_protectors_blessing_2|l$"
 RICE_tarim_basin_eight_protectors_blessing_4_desc:0 "$RICE_tarim_basin_eight_protectors_blessing_1_desc$"
 RICE_tarim_basin_khotan_eight_protectors:0 "Huit protecteurs"
 RICE_tarim_basin_khotan_eight_protectors_desc:0 "Avec sa myriade de monastères et de moines, Khotan est un centre du bouddhisme depuis des siècles. Diverses prophéties et écritures racontent comment le Bouddha a chargé [eight_protectors|El] de protéger Khotan : Aparajita, Samjnaya, Gaganasvara, Suvarnamala, Grhavatapta, Amgusa, Sthanavati et Vaisravana. Tant que le peuple de Khotan honorera les Trois Joyaux dans son cœur, ces grands êtres assureront sa survie et sa prospérité.\n\n#EMP Ce [character_modifier|El] est accordé au [ruler|El] du [county|El] de Khotan tant qu'il est #V bouddhiste#! et lui permet, ainsi qu'aux [rulers|El] bouddhistes voisins, d'accéder à une [activity|El] pour participer à une [GetActivityType( 'activity_RICE_tarim_basin_khotan_procession' ).GetName].\nCe [character_modifier|El] sera retiré si le [county|El] de Khotan est un jour dirigé par quelqu'un qui ne suit pas une [faith|El] bouddhiste, ou qui est hostile aux enseignements bouddhistes - si cela se produit, le modificateur ne pourra être restauré que par une [decision|El] de #V $RICE_tarim_basin_reinhabit_gomati_monastery$.#!#!"
 RICE_tarim_basin_studying_mogao_artifacts:0 "Étudier les artefacts et les parchemins de la grotte de Mogao"
 RICE_tarim_basin_fight_cattle_good_character:0 "Les combats d'animaux du Nouvel An prédisent de bonnes choses"
 RICE_tarim_basin_fight_cattle_good_character_desc:0 "Ce personnage a récemment organisé une série de combats d'animaux entre bovins comme forme de divination au début de l'année (une tradition dérivée de certains peuples du bassin du Tarim). Selon les résultats de ces combats, la prospérité suivra ce personnage et tout pays qu'il gouverne dans un avenir proche."
 RICE_tarim_basin_fight_horses_good_character:0 "Les combats d'animaux du Nouvel An prédisent de bonnes choses"
 RICE_tarim_basin_fight_horses_good_character_desc:0 "Ce personnage a récemment organisé une série de combats d'animaux entre chevaux comme forme de divination au début de l'année (une tradition dérivée de certains peuples du bassin du Tarim). Selon les résultats de ces combats, la prospérité accompagnera ce personnage et toute terre qu'il gouverne dans un avenir proche."
 RICE_tarim_basin_fight_camels_good_character:0 "Les combats d'animaux du Nouvel An prédisent de bonnes choses"
 RICE_tarim_basin_fight_camels_good_character_desc:0 "Ce personnage a récemment organisé une série de combats d'animaux entre chameaux comme forme de divination au début de l'année (une tradition dérivée de certains peuples du bassin du Tarim). Selon les résultats de ces combats, la prospérité suivra ce personnage et toute terre qu'il gouverne dans un avenir proche."
 RICE_tarim_basin_fight_goats_good_character:0 "Les combats d'animaux du Nouvel An prédisent de bonnes choses"
