 tarim_basin.0012.t:0 "Un cadeau d'artistes pour [recipient.GetFirstNameNoTooltip]"
 tarim_basin.0012.desc:0 "Quand un[actor.Custom('FR_E')] puissant[actor.Custom('FR_E')] [actor.GetTitleAsNameNoTooltip] comme moi veut faire grande impression sur un autre membre de l'élite, un simple cadeau de soie, d'or ou d'autres luxes ne suffira pas.\n\nÀ travers les terres prospères d'Eurasie et la fameuse Route de la Soie, les #italic personnes#! sont un cadeau plus mémorable que l'on puisse offrir. Ou, pour être plus précis, des artistes : comme des musiciens, des danseurs et des acrobates, ainsi que de beaux esclaves et courtisanes qui apportent des touches visuelles - et même plaisantes - au divertissement. Pourquoi offrir quelques misérables robes de soie ou bijoux, quand je peux véritablement montrer ma richesse, mon statut et mon autorité de cette manière ?\n\nJ'ai décidé de présenter à [recipient.GetTitledFirstName] une troupe d'artistes et d'esclaves talentueux de [actor.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]. Ils feront partie de sa cour, et [recipient.GetHerHim] serviront bien pour les années à venir."
 tarim_basin.0012.a:0 "Un geste de bonne volonté diplomatique envers [recipient.GetFirstName]..."
 tarim_basin.0013.t:0 "Un cadeau d'artistes de la part de [actor.GetFirstNameNoTooltip]"
 tarim_basin.0013.desc:0 "Un envoyé est arrivé de la part de [actor.GetTitledFirstName] aujourd'hui, accompagné d'une large suite. Il s'avère qu'[actor.GetSheHe] souhaite m'offrir une grande troupe d'artistes talentueux et d'esclaves de [actor.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]. Parmi eux se trouvent des musiciens, des danseurs, des acrobates, et même de magnifiques esclaves et courtisanes.\n\nLes dons de personnes talentueuses sont courants à travers les terres prospères d'Eurasie et de la soi-disant Route de la Soie, car ils démontrent la richesse, le statut et l'autorité d'un[actor.Custom('FR_E')] dirigeant[actor.Custom('FR_E')] comme [actor.GetTitledFirstName]. Je suis, bien entendu, flatté par un tel cadeau, et ces artistes deviendront une partie précieuse de ma cour, prêts à divertir mes courtisans et invités à tout moment."
 tarim_basin.0013.a:0 "Un[recipient.Custom('FR_E')] grand[recipient.Custom('FR_E')] [recipient .GetTitleAsNameNoTooltip] comme moi mérite un tel cadeau."
 tarim_basin.0014.t:0 "Artistes koutchéens"
 tarim_basin.0014.desc:0 "Quand un[actor.Custom('FR_E')] puissant[actor.Custom('FR_E')] [actor.GetTitleAsNameNoTooltip] comme moi veut faire forte impression sur un autre membre de l'élite, un simple cadeau de soie, d'or ou d'autres luxes ne suffira pas. Après tout, je règne sur [kucha.GetNameNoTier], une cité célèbre pour ses plaisirs et ses loisirs - il est un cadeau encore plus grand que je pourrais offrir.\n\nÀ travers les terres prospères d'Eurasie et la soi-disant Route de la Soie, il est courant pour les élites d'offrir des artistes comme des musiciens, des danseurs, des acrobates, et même de belles esclaves et courtisanes pour donner des dimensions visuelles - et même plaisantes - supplémentaires au divertissement. [kucha.GetNameNoTier], en particulier, est célèbre pour de tels divertissements à travers toute la Route de la Soie.\n\nJ'ai décidé de présenter à [recipient.GetTitledFirstName] une troupe d'artistes et d'esclaves talentueux de [kucha.GetNameNoTier]. Ils feront partie de sa cour, et [recipient.GetHerHim] serviront bien pour les années à venir."
 tarim_basin.0014.a:0 "Un geste de bonne volonté diplomatique envers [recipient.GetFirstName]..."
 tarim_basin.0015.t:0 "Un don d'artistes koutchéens de la part de [actor.GetFirstNameNoTooltip]"
 tarim_basin.0015.desc:0 "Un envoyé est arrivé de la part de [actor.GetTitledFirstName] aujourd'hui, accompagné d'une large suite. Il s'avère qu'[actor.GetSheHe] souhaite m'offrir une grande troupe d'artistes talentueux et d'esclaves de [kucha.GetNameNoTier]. Parmi eux se trouvent des musiciens, des danseurs, des acrobates, et même de magnifiques esclaves et courtisanes. [kucha.GetNameNoTier] est célèbre en tant que cité du plaisir et des loisirs, aussi personne ne peut douter du talent des artistes de cette suite !\n\nLes cadeaux de personnes talentueuses sont courants à travers les terres prospères d'Eurasie et de la soi-disant Route de la Soie, car ils démontrent la richesse, le statut et l'autorité d'un[actor.Custom('FR_E')] dirigeant[actor.Custom('FR_E')] comme [actor.GetTitledFirstName]. Je suis, bien entendu, flatté par un tel cadeau, et ces artistes koutchéens deviendront une part précieuse de ma cour, prêts à divertir mes courtisans et invités à tout moment."
 tarim_basin.0015.a:0 "Quel merveilleux et magnifique cadeau !"
 tarim_basin.0016.t:0 "xxxxx"
 tarim_basin.0016.desc:0 "xxxxx"
 tarim_basin.0016.a:0 "xxxxx"
 tarim_basin.0017.t:0 "Lac de Lop Nur"
 tarim_basin.0017.desc:0 "Il y a des siècles, le lac Lop Nur abritait le prospère royaume de Krorän, également connu sous le nom de Loulan et plus récemment Shanshan. On disait que malgré sa situation au milieu du désert, le lac était entouré de forêts et de terres agricoles fertiles.\n\nPourtant, il y a plus d'un siècle, quelque chose commença à changer lorsque les eaux du lac s'asséchèrent. Alors que la zone se désertifiait de plus en plus, les rendements agricoles s'effondrèrent, l'économie locale déclina, et les gens commencèrent à fuir le royaume en masse, laissant des villes fantômes dans leur sillage.\n\nMaintenant, cependant, il y a de l'espoir. Les eaux du lac ont commencé à monter - même si graduellement - pour la première fois depuis des décennies. Malheureusement, certains prédisent qu'un tel phénomène ne sera pas permanent, et que le niveau du lac fluctuera au fil du temps, rendant difficile pour la région de retrouver son ancien potentiel et sa prospérité."
 tarim_basin.0017.a:0 "Qu'adviendra-t-il de Lop Nur dans le futur ?"
