 tarim_basin.0280.t:0 "Sur la route poussiéreuse du pèlerinage"
 tarim_basin.0280.desc:0 "La route est poussiéreuse et le voyage est long, mais les grottes anciennes de [GetTitleByKey('b_bezeklik').GetNameNoTier] m'appellent !\n\nPendant des siècles, les peuples qui vivaient là ont creusé des grottes dans les montagnes de feu, honorant et rendant hommage à [ROOT.Char.GetFaith.HighGodName] et aux divinités locales, et bien d'autres ont parcouru les routes sinueuses de la Route de la Soie pour venir ici en pèlerins, afin de vénérer [ROOT.Char.GetFaith.PantheonTerm]."
 tarim_basin.0280.a:0 "Moi aussi, j'arriverai bientôt à ces anciennes grottes."
 tarim_basin.0281.t:0 "Arrivée"
 tarim_basin.0281.desc:0 "Je suis arrivé aux grottes de [GetTitleByKey('b_bezeklik').GetNameNoTier]. Il est clair que ce ne sont pas seulement les [ROOT.Char.GetFaith.GetAdherentNamePlural] qui sont arrivés ici : des fidèles de toutes les sectes sont venus dans ces grottes.\n\nMon entourage et moi nous reposerons pour la nuit dans la ville voisine, puis nous nous rendrons aux grottes demain."
 tarim_basin.0281.a:0 "Maintenant, où serait un bon endroit pour se reposer..."
 tarim_basin.0282.t:0 "Prière et Vénération"
 tarim_basin.0282.desc:0 "Aujourd'hui, je suis entré dans les grottes de [GetTitleByKey('b_bezeklik').GetNameNoTier], en particulier celles dédiées à [ROOT.Char.GetFaith.PantheonTerm].\n\nQuelle merveille, et quel délice ! Les œuvres d'art sur les parois des grottes sont anciennes, fissurées et écaillées, avec la peinture qui se détache, et pourtant je ne peux m'empêcher de contempler avec un grand sentiment de vénération. Parfois, on a presque l'impression qu'elles dansent sur la pierre, m'invitant à révérer [ROOT.Char.GetFaith.HighGodName] encore davantage.\n\nNous restons dans les grottes pendant un long moment, priant et accomplissant divers rites [ROOT.Char.GetFaith.GetAdherentNamePlural]."
 tarim_basin.0282.a:0 "Louange à [ROOT.Char.GetFaith.HighGodName] !"
 tarim_basin.0283.t:0 "Conclusion"
 tarim_basin.0283.desc:0 "Mon pèlerinage aux grottes de [GetTitleByKey('b_bezeklik').GetNameNoTier]. Ces grottes anciennes et vénérables étaient un spectacle remarquable, et je n'ai guère de doute qu'elles continueront d'attirer de dévoués visiteurs [ROOT.Char.GetFaith.GetAdherentNamePlural] tels que moi-même pour d'innombrables générations à venir."
 tarim_basin.0283.a:0 "Je suis heureu[ROOT.Char.Custom('FR_XSe')] d'avoir pu venir."
