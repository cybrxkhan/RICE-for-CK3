 activity_RICE_tarim_basin_crescent_lake_visit:0 "Visite au lac du Croissant"
 activity_RICE_tarim_basin_crescent_lake_visit_desc:0 "L'un des principaux repères géographiques près de la ville de Dunhuang est le soi-disant lac du Croissant. C'est un lac de taille considérable situé au milieu du désert, et se trouve à côté des célèbres dunes de sable chantantes de Dunhuang. Beaucoup de ceux qui vivent à proximité s'y rendent pour se détendre et profiter."
 activity_RICE_tarim_basin_crescent_lake_visit_selection_tooltip:"Se rendre au lac du Croissant à [GetTitleByKey('c_shazhou').GetNameNoTier]\n\n$RICE_tarim_basin_visit_crescent_lake_context_tooltip$"
 activity_RICE_tarim_basin_crescent_lake_visit_host_desc:"\n$BULLET_WITH_TAB$Perte de [stress_loss_i|El] [stress|El]\n$BULLET_WITH_TAB$Gain de [piety_i] [piety|El]\n$BULLET_WITH_TAB$Gain de [prestige_i] [prestige|El]\n$BULLET_WITH_TAB$Gain du [character_modifier|El] [GetModifier('RICE_tarim_basin_dunhuang_crescent_lake_visit').GetNameWithTooltip]"
 activity_RICE_tarim_basin_crescent_lake_visit_guest_desc:"Perdez du [stress_loss_i|El] [stress|El] et gagnez de la [piety_i] [piety|El], du [prestige_i] [prestige|El], et le [character_modifier|El] [GetModifier('RICE_tarim_basin_dunhuang_crescent_lake_visit').GetNameWithTooltip]"
