 tarim_basin.0056.a:0 "xxxxx"
 tarim_basin.0057.t:0 "Une délégation de la Cour impériale"
 tarim_basin.0057.desc:0 "Une délégation officielle de la cour des Tang est arrivée pour me voir aujourd'hui. Moi, ma famille, ainsi que plusieurs hauts fonctionnaires et généraux, nous accueillons l'envoyé et sa suite avec la plus grande hospitalité tandis que nous recevons la générosité de la cour des Tang.\n\n"
 tarim_basin.0057.desc.gold:0 "Cette fois, la cour des Tang nous a offert plusieurs grands coffres remplis de soie, d'or et d'autres objets de luxe précieux. Ceux-ci sont destinés à aider au paiement des fonctionnaires et des soldats, au financement de travaux publics et à l'envoi de cadeaux aux dirigeants étrangers pour maintenir la paix."
 tarim_basin.0057.desc.troops:0 "Cette fois, la cour des Tang a ordonné à un certain nombre de troupes stationnées ailleurs dans l'empire de venir ici et de nous aider à défendre et à surveiller nos frontières. La situation politique de cette région est toujours incertaine, aussi disposer de davantage de soldats en cas de guerre est toujours utile."
 tarim_basin.0057.desc.prestige:0 "Cette fois, la cour des Tang a décidé de m'accorder, ainsi qu'à certains de mes officiels et généraux, divers titres et charges. Bien que ceux-ci ne confèrent généralement que peu de responsabilités ou de pouvoir réels, ces gestes sont la manière dont la cour impériale reconnaît notre importance."
 tarim_basin.0057.desc.economic:0 "Cette fois, la cour Tang souhaite nous informer qu'elle a adopté un certain nombre de politiques économiques et monétaires concernant notre région. Nous espérons que ces politiques contribueront à la croissance de notre région et permettront à ses habitants de vivre dans la prospérité et le bonheur."
 tarim_basin.0057.desc.military:0 "Cette fois, la cour des Tang souhaite nous informer des récents succès militaires qu'elle a remportés en réprimant des rébellions ou en vainquant des ennemis étrangers. Nous avons reçu des renseignements militaires, des fournitures et des équipements militaires, ainsi que des conseils de divers stratèges chinois sur notre situation actuelle."
 tarim_basin.0057.desc.political:0 "Cette fois, la cour Tang souhaite nous informer de diverses nominations politiques d'officiels favorables à notre cause, ainsi que d'importants renseignements qu'elle a obtenus sur notre situation politique extérieure et intérieure. Ils espèrent que ces informations nous aideront dans les affaires locales."
 tarim_basin.0057.desc.conclusion:0 "\n\n« Ainsi l'Empereur en a décrété, » conclut l'envoyé, enroulant le parchemin sur lequel la déclaration officielle était inscrite. Bien que notre relation avec la cour des Tang ne soit pas des meilleures, et puisse être tendue, nous sommes heureux qu'ils soient disposés à collaborer avec nous et à nous aider dans nos objectifs communs de renforcer la frontière de la civilisation."
 tarim_basin.0057.a:0 "Nous sommes reconnaissants à la Cour impériale pour son aide."
 tarim_basin.0058.t:0 "Préparatifs pour l'excursion"
 tarim_basin.0058.desc:0 "J'en suis venu à la conclusion que c'est le bon moment pour rendre visite au Lac du Croissant près de Dunhuang. L'occasion de passer une journée là-bas à se détendre ne se présente pas tous les jours !\n\nQuoi qu'il en soit, j'ai fait mes préparatifs, et il est bientôt temps d'y aller."
 tarim_basin.0058.a:0 "J'ai hâte d'y être !"
 tarim_basin.0059.t:0 "Lac du Croissant"
 tarim_basin.0059.desc:0 "Aujourd'hui, enfin, je suis venu au Lac du Croissant de Dunhuang pour me détendre et profiter du moment. Il existe de nombreuses légendes sur la formation de ce lac - certains disent qu'un général chinois a creusé un puits pour ses troupes afin de créer le lac, et d'autres disent que [ROOT.Char.GetFaith.HighGodName] en était responsable, parmi bien d'autres variantes de ce récit. \n\nDéjà, je vois un bon nombre de personnes ici pour les mêmes raisons que moi. Autour d'un lac aussi grand que celui-ci, il y a de nombreuses activités que l'on peut faire. Je peux visiter les dunes de sable chantantes à proximité, par exemple, et écouter avec émerveillement la « musique » émanant du sable. Je pourrais aussi me rendre dans les [ROOT.Char.GetFaith.HouseOfWorshipPlural] proches et prier dans un cadre paisible. Et, bien sûr, je devrais passer du temps au lac lui-même, boire ses eaux fraîches, admirer les poissons et pique-niquer sur ses rives. Maintenant... par quoi commencer ?"
 tarim_basin.0059.a:0 "Allons visiter les dunes de sable chantantes !"
 tarim_basin.0059.b:0 "Direction les [ROOT.Char.GetFaith.HouseOfWorshipPlural] dans ce cas !"
 tarim_basin.0059.c:0 "J'aimerais d'abord me détendre au bord du lac !"
 tarim_basin.0060.t:0 "$RICE_historical_aspiration_fulfilled_title$"
 tarim_basin.0060.desc:0 "Pendant des années, [GetTitleByKey('k_hexi').GetNameNoTier] a souffert sous des dirigeants incompétents et les querelles mesquines et intrigues des soi-disant clans d'élite de Dunhuang.\n\nJ'ai donc dû prendre le contrôle du circuit de Guiyi, afin de garantir notre survie dans le paysage chaotique des Régions occidentales. Grâce à mon expérience et mes compétences, j'ai commencé à prendre des mesures pour stabiliser nos affaires internes, contrôler les turbulents clans de Dunhuang, renforcer les liens avec nos voisins amicaux et sécuriser nos frontières. Par mon leadership, nous servirons de rempart de la civilisation sur cette frontière turbulente.\n\nLa dynastie Tang ne peut plus nous guider. Il est maintenant temps pour nous de prendre notre destin en main !"
 tarim_basin.0060.a:0 "J'ai pacifié la région, mais notre travail continue."
