 tarim_basin.0040.t:0 "L'Amuseur"
 tarim_basin.0040.desc:0 "Tout le monde parle encore des nombreux artistes talentueux que [actor.GetTitledFirstName] m'a offerts il y a quelque temps. L'un[entertainer.Custom('FR_E')] d'entre eux, cependant, s'est particulièrement distingué : [entertainer.GetFirstName], qui est d'ascendance [entertainer.GetCulture.GetName].\n\n« [recipient.GetTitledFirstName], » me dit [praiser.GetFirstName] un jour, « je pense parler au nom de tous ici en disant que [entertainer.GetFirstName] est un[entertainer.Custom('FR_E')] artiste comme je n'en ai jamais vu sur toute la Route de la Soie. Ce serait du gâchis de [entertainer.GetHerHim] laisser languir comme un simple serviteur. Non, je dis qu'il serait convenable de l'élever au rang de membre régulier de cette cour, en récompense du merveilleux service qu'[entertainer.GetSheHe] nous a rendu. »\n\nC'est une suggestion quelque peu peu orthodoxe, mais pas inédite. Quand je demande à [entertainer.GetFirstName], agenouillé[entertainer.Custom('FR_E')], ce qu'[entertainer.GetSheHe] en pense, [entertainer.GetSheHe] répond humblement avec des mots soigneusement choisis : « Je souhaite seulement apporter de la joie à votre cour, quoi que vous exigiez de moi. »"
 tarim_basin.0040.a:0 "Tu mérites vraiment plus. Je ferai de vous un vrai courtisan."
 tarim_basin.0040.b:0 "Vos services sont appréciés, mais vous êtes très bien là où vous êtes."
 tarim_basin.0041.t:0 "xxxxx"
 tarim_basin.0041.desc:0 "xxxxx"
 tarim_basin.0041.a:0 "xxxxx"
 tarim_basin.0042.t:0 "Un artiste charmant"
 tarim_basin.0042.desc.intro:0 "Tout le monde parle encore des talentueux artistes que [actor.GetTitledFirstName] m'a offerts il y a quelque temps. Il y a même des rumeurs selon lesquelles [lover.GetTitledFirstName] serait désormais épris de l'une des artistes, une fille [crush.GetCulture.GetName] nommée [crush.GetFirstName].\n\nAujourd'hui, [lover.GetFirstName] m'aborde avec une requête intéressante. Il s'incline et dit nerveusement : « Ô gracieu[recipient.Custom('FR_XSe')] et sage [recipient.GetTitledFirstName], [crush.GetFirstName] n'est semblable à aucune autre femme, une véritable fleur qui mérite d'être plus qu'une simple servante. Je vous supplie humblement de me laisser la prendre comme consort afin que je puisse l'aimer pour le reste de nos vies. Je sais que c'est aussi ce qu'elle désire. »"
 tarim_basin.0042.desc.mutual:0 "\n\nJe jette un coup d'œil à [crush.GetFirstName] agenouillée, qui lui lance un regard furtif et sourit timidement tandis que ses joues rougissent. Veut-elle que je dise oui ? J'ai entendu d'autres personnes à ma cour dire qu'elle est réceptive à ses avances et qu'elle apprécie sa compagnie, bien qu'il soit difficile de dire si elle éprouve une véritable affection réciproque ou si elle a une arrière-pensée en tête. Ou peut-être est-elle simplement polie."
 tarim_basin.0042.desc.one_sided:0 "\n\nJe jette un coup d'œil à [crush.GetFirstName] agenouillée, qui me regarde avec des yeux suppliants et secoue légèrement la tête - assez pour que je le voie, mais pas assez pour que [lover.GetFirstName] le remarque. Ce n'est un secret pour personne à ma cour qu'elle n'apprécie pas ses attentions, il ment donc ou se fait des illusions sur ses désirs. Je ne veux pas le mettre en colère pour une simple servante, mais est-il juste de le laisser faire ce qu'il veut d'elle ?"
 tarim_basin.0042.desc.neutral:0 "\n\nJe jette un coup d'œil à [crush.GetFirstName] agenouillée, qui affiche une expression stoïque sur son visage. Quand je lui demande ce qu'elle en pense, elle dit d'un ton neutre : « J'accepterai tout ce que vous déciderez, m[recipient.Custom('FR_OnA')] [recipient.GetLadyLord]. » D'autres courtisans m'ont dit qu'elle a peu d'intérêt pour lui, mais ne le déteste pas non plus, donc même si ses paroles sont des mensonges (ou des illusions), devrais-je vraiment le mettre en colère ?"
 tarim_basin.0042.a:0 "Ce n'est pas grave ! Je vous donne ma bénédiction."
 tarim_basin.0042.b:0 "Très bien. J'accepte, mais vous me devez une faveur, compris ?"
 tarim_basin.0042.c:0 "Peut-être que cette merveilleuse dame préférerait #italic ma#! compagnie ?"
 tarim_basin.0042.d:0 "Vous ? Elle ? Un piètre parti. Ne m'importunez pas avec cela."
 tarim_basin.0042.e:0 "Respectons les souhaits de cette dame. Elle peut choisir elle-même."
 tarim_basin.0042.f:0 "Soyez raisonnable, je vous prie. Ce n'est qu'une passade."
 tarim_basin.0042.e.tooltip:0 "[crush.GetFirstNameNoTooltip] vous est reconnaissante de l'avoir laissée décider par elle-même"
 tarim_basin.0042.e.tooltip.yes:0 "Elle accepte la proposition de [lover.GetFirstNamePossessiveNoTooltip] - que ce soit par amour sincère, par arrière-pensée, ou parce qu'elle est sous la contrainte, qui sait"
 tarim_basin.0042.e.tooltip.no:0 "Elle décide de rejeter la proposition de [lover.GetFirstNamePossessiveNoTooltip], et il doit accepter l'embarras d'être rejeté par une simple servante"
 tarim_basin.0042.e.toast.no:0 "[crush.GetFirstNameNoTooltip] rejette [lover.GetFirstNameNoTooltip] !"
 tarim_basin.0042.e.toast.yes:0 "[crush.GetFirstNameNoTooltip] dit « oui » à [lover.GetFirstNameNoTooltip] !"
