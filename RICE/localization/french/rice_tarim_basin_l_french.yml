 tarim_basin.0249.a:0 "xxxxx"
 tarim_basin.0250.t:0 "Une visite de grotte routinière"
 tarim_basin.0250.desc:0 "Je visite l'une des grottes de Mogao près de [dunhuang.GetNameNoTier] pour rencontrer divers notables locaux et monastiques afin d'effectuer quelques prières et rituels religieux de routine.\n\nAprès la cérémonie, je prends le temps d'observer l'art dans la grotte elle-même. En particulier la fresque principale, qui représente toute la famille du patron originel de la grotte. Ils sont tous parés des plus beaux vêtements d'un style ancien, datant peut-être d'un siècle ou deux."
 tarim_basin.0250.a:0 "Imaginez ce que devait être la vie à cette époque !"
 tarim_basin.0250.b:0 "Ils étaient tous des gens normaux comme nous, n'est-ce pas ?"
 tarim_basin.0250.c:0 "Telle est l'impermanence ! Un jour, nous ne serons plus que des souvenirs."
 tarim_basin.0251.t:0 "Un aperçu fugace"
 tarim_basin.0251.desc:0 "Lors d'une excursion d'une journée aux grottes de Mogao, près de [dunhuang.GetNameNoTier], pour inspecter l'une des grottes de mes ancêtres, j'ai aperçu une personne séduisante en train de visiter l'une des autres grottes."
 tarim_basin.0251.a:0 "Ignorez-les. Je suis ici pour des raisons spirituelles !"
 tarim_basin.0251.b:0 "Les approcher pour une discussion amicale."
 tarim_basin.0252.t:0 "L'ancienne grande muraille"
 tarim_basin.0252.desc:0 "Je passe devant une section en ruines de l'ancienne Grande Muraille dans le [GetGeographicalRegion('RICE_dunhuang_region').GetName]. Les murs, les remparts et le donjon étaient autrefois des spectacles impressionnants il y a plusieurs siècles, lorsque les soldats de l'une des premières dynasties chinoises étaient stationnés ici. Désormais, il ne reste plus que de la pierre érodée, de la poussière et du sable."
 tarim_basin.0252.a:0 "Il s'agit d'un rappel de l'impermanence de toutes les choses."
 tarim_basin.0252.b:0 "Quel endroit glorieux cela a dû être à l'époque !"
 tarim_basin.0253.t:0 "Les canaux de Hexi"
 tarim_basin.0253.desc:0 "Dieu merci ! Quelques spécialistes sont récemment arrivés de Chine pour nous aider à entretenir les canaux d'irrigation de [ROOT.Char.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTier]. Beaucoup de canaux de la [GetGeographicalRegion('RICE_dunhuang_region').GetName] sont anciens, certains datant de l'époque de la dynastie Han, et nécessitent donc des réparations constantes."
 tarim_basin.0253.a:0 "Leur expertise est très appréciée."
 tarim_basin.0254.t:0 "Artistes étrangers de Sérinde"
 tarim_basin.0254.desc:0 "Un certain nombre d'artistes étrangers vivant dans la région se sont regroupés pour m'offrir des œuvres d'art, en signe de soutien. Les sculptures, peintures et parchemins qu'ils m'ont présentés utilisent un mélange de styles, y compris l'art indien, chinois, iranien et tibétain - rien d'inhabituel dans cette partie du monde, où les styles artistiques sont fréquemment syncrétisés et mélangés de la sorte."
 tarim_basin.0254.a:0 "C'est un merveilleux cadeau !"
 tarim_basin.0255.t:0 "L'héritage d'une nonne"
 tarim_basin.0255.desc:0 "Une nonne bouddhiste âgée et renommée vivant à proximité est récemment décédée. Elle était une de mes connaissances et, chose intéressante, dans son testament, elle m'a légué une partie de ses biens matériels, comme des robes en soie ou des rouleaux religieux.\n\nCependant, sa famille souhaite contester cela et porter l'affaire devant les autorités judiciaires. Bien que les juges soient probablement de mon côté, cette situation pourrait devenir compliquée."
 tarim_basin.0255.a:0 "Ces choses sont à moi ! Je refuse d'aller au tribunal !"
 tarim_basin.0255.b:0 "Ils peuvent avoir ces choses. Je n'en ai pas besoin."
 tarim_basin.0255.c:0 "Nous porterons cette affaire devant les tribunaux pour qu'elle soit réglée honorablement."
 tarim_basin.0255.d:0 "Peut-être pourrons-nous parvenir à un accord et à une compréhension."
 tarim_basin.0256.t:0 "Le testament du moine"
 tarim_basin.0256.desc:0 "Un vieux moine vivant dans un monastère voisin est récemment décédé. Il possédait des biens de valeur, mais son testament n'était pas clair, si bien que ses proches se disputent ses biens.\n\nC'est une situation courante dans de nombreux monastères bouddhistes d'ici. Cependant, comme ce moine appartient à un clan réputé, je me dois d'intervenir pour rétablir l'ordre, car les membres de sa famille sont eux-mêmes puissants. S'ils se battent, la communauté risque d'être très perturbée."
 tarim_basin.0256.a:0 "J'interviendrai et déciderai qui doit recevoir quoi."
 tarim_basin.0256.b:0 "Je ne devrais pas intervenir ; c'est une affaire privée."
 tarim_basin.0256.c:0 "Tous ses biens appartiennent désormais à l'État."
 tarim_basin.0257.t:0 "Moines en papier, nonnes en papier"
 tarim_basin.0257.desc:0 "Récemment, dans la région, il y a eu une tendance de personnes qui sont des moines et nonnes bouddhistes sur le papier, mais qui vivent des vies normales avec des emplois et des familles normales en pratique. Il est clair que beaucoup de gens font cela comme une forme d'évasion fiscale, car le clergé n'est pas imposé.\n\nMoi et beaucoup de mes fonctionnaires avons toujours été réticents à faire quoi que ce soit à ce sujet, de peur de contrarier les autorités religieuses. Pourtant, c'est un problème croissant, et je ne veux plus le laisser passer."
 tarim_basin.0257.a:0 "Ignorez leurs excuses ! Appliquez la loi et infligez des amendes aux contrevenants !"
 tarim_basin.0257.b:0 "Laissez-les faire. J'ai des problèmes plus importants à traiter."
 tarim_basin.0258.t:0 "Melons Juteux"
 tarim_basin.0258.desc:0 "Aujourd'hui, j'ai reçu un cadeau de melons juteux de la part de [dunhuang.GetNameNoTier], ou Dunhuang, grâce à quelques marchands locaux. Les melons de Dunhuang sont très réputés pour leur qualité et leur saveur, et sont appréciés de tous."
 tarim_basin.0258.a:0 "Merci beaucoup !"
 tarim_basin.0259.t:0 "La grotte perdue"
 tarim_basin.0259.desc:0 "Des nouvelles intéressantes des grottes de Mogao de [dunhuang.GetNameNoTier] ! Une grotte cachée et scellée a été découverte juste à côté d'une grotte appartenant à un monastère sous ma juridiction - en d'autres termes, ce monastère possède les droits sur cette grotte et la zone environnante, et j'ai donc également mon mot à dire sur ce qui s'y passe.\n\nBien que la grotte soit en grande partie dépourvue de tout objet de valeur, elle contient un certain nombre de belles salles décorées de diverses peintures et œuvres d'art, même si elle est dans un état quelque peu délabré. La direction du monastère suggère que j'utilise des fonds pour rénover la grotte, car cela me rapporterait beaucoup de mérite."
 tarim_basin.0259.a:0 "Nous pouvons lui redonner sa splendeur d'antan !"
 tarim_basin.0259.b:0 "Une nouvelle fascinante, mais je n'ai pas d'argent à dépenser."
 tarim_basin.0260.t:0 "Envoyés en route vers la Chine"
 tarim_basin.0260.desc:0 "Une caravane d'importants envoyés d'un royaume étranger passe par [ROOT.Char.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTier], car cette région est une étape majeure vers leur destination finale : la Chine, l'Empire du Milieu.\n\nParce que cette délégation est éminente et qu'il ne s'agit pas d'une caravane ordinaire, certains de mes courtisans suggèrent que je les accueille chaleureusement, au-delà d'une simple salutation - cela ne ferait pas de mal de tisser de bonnes relations et de faire bonne impression, non ?"
 tarim_basin.0260.a:0 "Organisez un festin pour eux et donnez-leur des provisions pour la route."
 tarim_basin.0260.b:0 "Laisser des étrangers traverser nos terres est une courtoisie suffisante."
 tarim_basin.0261.t:0 "Un différend typique de la Route de la soie"
 tarim_basin.0261.desc:0 "Deux hommes éminents de la communauté locale se présentent devant moi, aujourd'hui, me demandant de résoudre leur différend. L'un est un marchand de Sogdiane, et l'autre est un [ROOT.Char.Custom('DefaultPriestTitle')] de Khotan.\n\nLe marchand affirme que le [ROOT.Char.Custom('DefaultPriestTitle')] n'a pas payé l'intégralité de son achat. Le [ROOT.Char.Custom('DefaultPriestTitle')] affirme que le marchand l'a trompé. Qui est dans son droit ?"
 tarim_basin.0261.a:0 "Le marchand a présenté de meilleurs arguments."
 tarim_basin.0261.b:0 "Le [ROOT.Char.Custom('DefaultPriestTitle')] a clairement raison."
 tarim_basin.0261.c:0 "Cela ne me concerne pas. Hors de ma vue !"
 tarim_basin.0261.d:0 "Il s'agissait simplement d'un malentendu, car juridiquement parlant..."
 tarim_basin.0262.t:0 "Rhubarbe"
 tarim_basin.0262.desc:0 "J'ai récemment commencé à consommer de la rhubarbe provenant de [suzhou.GetNameNoTier]. Ce légume est connu pour aider à maintenir un bon système digestif, selon les conseils de quelques médecins qui me l'ont recommandé.\n\nLa rhubarbe a d'abord été cultivée à [suzhou.GetNameNoTier] dans le [GetGeographicalRegion('RICE_dunhuang_region').GetName]. La rhubarbe de là-bas est encore considérée comme l'une des meilleures qualités au monde. Ainsi, les marchands parcourant la Route de la Soie la vendent souvent sur les marchés locaux."
 tarim_basin.0262.a:0 "Une très bonne chose."
 tarim_basin.0263.t:0 "Une grande nouvelle grotte"
 tarim_basin.0263.desc:0 "Une grande grotte dans les grottes de Mogao près de [dunhuang.GetNameNoTier] a récemment été achevée, avec toute la sculpture, la décoration et la construction terminées. Ce fut un effort conjoint de plusieurs monastères et organisations de bouddhistes laïcs, et elle arbore plusieurs grandes statues d'argile de divers Bouddhas et Bodhisattvas.\n\nParce que plusieurs personnages importants ont participé au financement de sa construction, y compris certains monastiques de monastères sous ma juridiction, ces notables m'ont invité à assister à la grande inauguration de la grotte aux côtés de plusieurs autres, et ont même payé mes frais de voyage. Quand je suis venu inspecter la grotte moi-même, je dois admettre qu'elle était très impressionnante. Les statues et les peintures étaient réalistes, et inspiraient une grande admiration et piété chez de nombreux présents."
 tarim_basin.0263.a:0 "Félicitations pour cette grotte magnifique !"
 tarim_basin.0264.t:0 "Le Bouddha couché"
 tarim_basin.0264.desc:0 "En visitant l'une des grottes de Mogao près de Dunhuang, je tombe sur une grande et imposante figure d'un Bouddha couché. Considérant les couleurs vibrantes et la taille impressionnante de la statue, je ne peux que dire qu'elle est des plus impressionnantes et stupéfiantes. Je reste là, émerveillé pendant quelques instants, admirant l'œuvre d'art."
 tarim_basin.0264.a:0 "Comment ont-ils pu sculpter une telle chose ? C'est un chef-d'œuvre."
 tarim_basin.0264.b:0 "Je joindrai mes mains et prierai pendant quelques minutes."
 tarim_basin.0265.t:0 "De la soie en guise de cadeau de courtoisie"
 tarim_basin.0265.desc:0 "Étant donné que la Route de la Soie passe par [ROOT.Char.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTier], la soie est souvent un moyen de paiement courant ou un cadeau fréquent.\n\nUn conflit familial au sein d'un clan éminent s'est récemment produit sous ma juridiction, ce qui a entraîné un certain nombre de troubles et de menaces à l'ordre public. Même pour moi, l'affaire est devenue un énorme casse-tête alors que j'essayais de résoudre l'ensemble du problème.\n\nUne fois que tout s'est finalement calmé, la famille a accepté de me payer une amende pour avoir causé un tel tumulte. Après quelques négociations, ils ont accepté de payer l'amende sous forme de soie."
 tarim_basin.0265.a:0 "Merci pour votre coopération. S'il vous plaît, ne recommencez pas. #italic S'il vous plaît#!."
 tarim_basin.0266.t:0 "Le fameux colporteur de babioles"
 tarim_basin.0266.desc:0 "Aujourd'hui, la caravane d'un marchand bien connu est arrivée à [ROOT.Char.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTier]. On dit que ce commerçant est célèbre sur toute la Route de la Soie pour transporter toutes sortes de bibelots, de bonne qualité, venus des quatre coins du monde. La caravane fera commerce sur notre territoire pendant quelque temps, avant de reprendre sa route."
 tarim_basin.0266.a:0 "De telles affaires sont les bienvenues."
 tarim_basin.0266.b:0 "Peut-être puis-je acheter quelques babioles ?"
 tarim_basin.0267.t:0 "Pagode du Cheval Blanc"
 tarim_basin.0267.desc:0 "Aujourd'hui, j'ai rendu visite à la Pagode du Cheval Blanc au centre de Dunhuang, ou [dunhuang.GetNameNoTier]. Elle fut construite il y a des siècles par le moine bouddhiste Kumarajiva, qui malgré ses origines royales indiennes et koutchéennes, consacra sa vie à traduire des textes bouddhistes en chinois. La pagode commémore son fidèle cheval, Tianliu, qui mourut à Dunhuang lors de l'un des voyages de Kumarajiva."
 tarim_basin.0267.a:0 "Il est remarquable que ce monument soit encore debout aujourd'hui !"
 tarim_basin.0267.b:0 "En tant que [ROOT.Char.GetFaith.GetAdherentName], je ne peux m'empêcher de me sentir inspiré en voyant cela."
 tarim_basin.0267.c:0 "Bien que je sois d'une autre confession, cette histoire m'inspire."
 tarim_basin.0267.d:0 "C'est agréable mais cela signifie peu pour un [ROOT.Char.GetFaith.GetAdherentName] comme moi."
 tarim_basin.0268.t:0 "Voyage vers Mogao"
 tarim_basin.0268.desc:0 "Je rentrais chez moi après un court voyage à travers mes territoires dans la [GetGeographicalRegion('RICE_dunhuang_region').GetName] lorsque j'ai aperçu quelques personnes en prière devant un sanctuaire bouddhiste. Je leur ai demandé ce qu'ils faisaient, et ils m'ont répondu qu'ils formaient une caravane de pèlerins et de marchands, dont la destination finale étaient les grottes de Mogao à Dunhuang. Ils voulaient prier les êtres éveillés pour obtenir leur protection durant le voyage."
 tarim_basin.0268.a:0 "Ah ! je vois. Je vous souhaite bonne chance pour votre voyage !"
 tarim_basin.0268.b:0 "La prière ne suffit pas. Il faut aussi de la diligence et de la ruse."
 tarim_basin.0269.t:0 "Connexions chinoises"
 tarim_basin.0269.desc:0 "Une troupe d'acrobates et de danseurs nous rend visite depuis la Chine aujourd'hui. Bien que nous soyons à la frontière de la civilisation aux yeux des habitants de l'Empire du Milieu, nous maintenons toujours des liens commerciaux et culturels avec eux. La troupe a été envoyée par quelques gentilshommes aisés de Chine que je connais, et je suis ravi qu'ils aient pensé à moi.\n\nLa troupe nous a procuré, à moi et à ma cour, beaucoup de divertissement, et ensuite je leur ai offert des cadeaux de soie fine, d'épices et bien d'autres choses pour leur performance."
 tarim_basin.0269.a:0 "Une troupe des plus impressionnantes !"
 tarim_basin.0270.t:0 "Musique kuchéenne"
 tarim_basin.0270.desc:0 "La musique de [kucha.GetNameNoTier] est particulièrement populaire dans le [GetGeographicalRegion('world_steppe_tarim').GetName], et ce depuis des siècles.\n\nCe soir, alors que je me rends dans les rues, je tombe sur un certain nombre de musiciens itinérants venus d'autres parties du [GetGeographicalRegion('world_steppe_tarim').GetName], et qui sont clairement habiles à jouer des morceaux de [kucha.GetNameNoTier]. La musique est sublime, les danseurs qui les accompagnent sont agréables dans leurs mouvements, et l'atmosphère générale est des plus animées."
 tarim_basin.0270.a:0 "Quel plaisir !"
