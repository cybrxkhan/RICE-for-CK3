 tarim_basin.0240.t:0 "#italic Techniquement#! la Chine"
 tarim_basin.0240.desc:0 "De nombreux érudits [ROOT.Char.GetFaith.GetReligion.GetAdherentNamePlural] affirment que la Chine était autrefois composée de trois divisions : Tabgach au sud ; Khitay au nord ; et Barkhan ou Kashgar à l'ouest, dans le [GetGeographicalRegion('world_steppe_tarim').GetName], où je détiens désormais d'importants territoires. Je deviendrai le premier de ma famille à porter des titres honorifiques reconnaissant ma domination sur cette région autrefois dominée par l'Empire chinois, tels que #italic Malik al-Mashriq wa al-Sin#! (« Roi de l'Est et de la Chine »), #italic Sultan al-Sharq wa al-Sin#! (« Sultan de l'Est et de la Chine »), et #italic Tabgach Khan#! (« Khan de Chine »).\n\nIl y a une raison à cela, en fait. À l'époque actuelle, les peuples à travers le monde [ROOT.Char.GetFaith.GetReligion.GetAdherentName] considèrent la Chine comme l'incarnation de la société civilisée, une terre remplie de sages érudits, de fonctionnaires vertueux et d'artisans habiles. Il ne serait pas faux d'affirmer que notre grande dynastie gouverne #italic techniquement#! une partie du royaume chinois ; les peuples à travers le monde [ROOT.Char.GetFaith.GetReligion.GetAdherentName] devraient nous respecter pour cela, et nous devrions être fiers d'un accomplissement aussi prestigieux !"
 tarim_basin.0240.a:0 "Vous savez, je suis moi-même un peu un souverain de la Chine."
 tarim_basin.0241.t:0 "#italic Techniquement#! la Chine"
 tarim_basin.0241.desc:0 "Des nouvelles arrivent des territoires gouvernés par la dynastie [fake_china_claimer.GetDynasty.GetName]. L'un de leurs rejetons, [fake_china_claimer.GetTitledFirstName], est [fake_china_claimer.Custom('FR_LeLa')] premi[fake_china_claimer.Custom('FR_ErEre')]  de sa famille à se proclamer formellement souverain de Chine, et à utiliser divers titres honorifiques tels que #italic Malik al-Mashriq wa al-Sin#! (« Roi de l'Est et de la Chine »), #italic Sultan al-Sharq wa al-Sin#! (« Sultan de l'Est et de la Chine »), et #italic Tabgach Khan#! (« Khan de Chine »). Leur logique est qu'ils gouvernent une partie considérable du territoire dans le [GetGeographicalRegion('world_steppe_tarim').GetName], qui fut sous la domination de la Chine à une époque, donc ils gouvernent #italic techniquement#! en Chine.\n\nÀ l'époque actuelle, les gens à travers le monde [fake_china_claimer.GetFaith.GetReligion.GetAdherentName] considèrent la Chine comme l'incarnation de la société civilisée, une terre emplie de savants avisés, de fonctionnaires vertueux et d'artisans habiles. Il est clair que la dynastie [fake_china_claimer.GetDynasty.GetName] souhaite faire appel à ces idéaux et ces fantasmes afin de renforcer leur propre image et leur statut."
 tarim_basin.0241.a:0 "Pendant combien de temps revendiqueront-ils de tels titres ? Qui sait..."
 tarim_basin.0242.t:0 "xxxxx"
 tarim_basin.0242.desc:0 "xxxxx"
 tarim_basin.0242.a:0 "xxxxx"
 tarim_basin.0243.t:0 "Plus de Chine"
 tarim_basin.0243.desc:0 "Il y a longtemps, le clan [RICE_tarim_basin_fake_china_person.GetDynasty.GetName] prétendait être les dirigeants de la Chine... d'un certain point de vue. Ils se sentaient justifiés de le faire car ils régnaient sur des parties du [GetGeographicalRegion('world_steppe_tarim').GetName], que de nombreux musulmans de l'époque considéraient comme faisant partie des anciens domaines de la Chine. Peut-être est-il plus correct de dire qu'ils étaient des dirigeants #italic dans#! une partie de la Chine.\n\nDésormais, il ne reste plus rien pour soutenir la mascarade. Pour une raison ou une autre, les descendants du clan [RICE_tarim_basin_fake_china_person.GetDynasty.GetName] ont perdu le contrôle de leurs territoires dans le bassin du Tarim. Qu'ils soient considérés comme Sultans ou Khans de Chine est risible, et personne ne prendrait plus de telles revendications au sérieux."
 tarim_basin.0243.a:0 "Un jour sombre pour le clan [RICE_tarim_basin_fake_china_person.GetDynasty.GetName]."
 tarim_basin.0244.t:0 "Ordam Mazar"
 tarim_basin.0244.desc:0 "Il fut un temps où une grande partie du [GetGeographicalRegion('world_steppe_tarim').GetName] était gouvernée par des infidèles oppressifs et ignorants. Cela changea avec [ali_arslan.GetTitledFirstName], le premier dirigeant [ordam_builder.GetFaith.GetReligion.GetAdjective] de [khotan.GetNameNoTier]. Qu'[ali_arslan.GetSheHe] ait été un véritable croyant [ordam_builder.GetFaith.GetReligion.GetAdherentName] ou non, il est indéniable que de nombreux adeptes de [ordam_builder.GetFaith.GetReligion.GetName] [ali_arslan.Custom('FR_LeLa')] tiennent en haute estime, en partie grâce aux nombreuses légendes entourant sa vie et ses supposés accomplissements en tant que martyr. Par exemple, les légendes racontent comment [ali_arslan.GetSheHe] serait en réalité [ali_arslan.Custom('GetDaughterSon')] de Saint Gabriel. Certaines légendes sont même contradictoires - certaines affirment qu'[ali_arslan.GetSheHe] fut tué par les odieux infidèles de [khotan.GetNameNoTier], tandis que d'autres disent qu'[ali_arslan.GetSheHe] mourut plus paisiblement.\n\nLe mausolée [ali_arslan.GetNamePossessive] à [kashgar.GetNameNoTier] est récemment devenu un site de pèlerinage notable, et j'ai pris des mesures pour agrandir la tombe afin qu'elle devienne un véritable #italic mazar#!, où les fidèles peuvent rendre hommage à ce grand martyr et adorer [ordam_builder.GetFaith.HighGodName]."
 tarim_basin.0244.a:0 "Apparemment, cela a même inspiré un nouveau festival dans la ville."
 tarim_basin.0245.t:0 "Ordam Mazar"
 tarim_basin.0245.desc:0 "J'ai reçu la nouvelle que [ordam_builder.GetTitledFirstName] a récemment achevé l'expansion du #italic mazar#! de [ali_arslan.GetTitledFirstName] à [khotan.GetNameNoTier]. Indépendamment des véritables accomplissements de [ali_arslan.GetFirstNamePossessive] dans la vie, ou que [ali_arslan.GetSheHe] ait été un fervent adepte [ordam_builder.GetFaith.GetReligion.GetAdherentName] ou non, beaucoup en sont venus à l'admirer, croyant qu'[ali_arslan.GetSheHe] est un véritable grand martyr digne de vénération pour ses actes héroïques contre les infidèles autrefois dominants et cruels du [GetGeographicalRegion('world_steppe_tarim').GetName].\n\nAlors que la légende de [ali_arslan.GetTitledFirstName] continue de se répandre et de grandir, beaucoup affluent vers sa tombe pour rendre leurs hommages. J'ai même entendu dire qu'une nouvelle célébration, le soi-disant Festival de l'Ordam Mazar, est régulièrement organisée à [kashgar.GetNameNoTier] désormais pour honorer sa mémoire en tant que martyr de [ordam_builder.GetFaith.GetReligion.GetName]."
 tarim_basin.0245.a:0 "Je me rendrai peut-être un jour sur sa tombe pour lui rendre hommage."
 tarim_basin.0246.t:0 "Le fonctionnaire des Liao"
 tarim_basin.0246.desc:0 "Je ne me suis pas élevé dans les rangs de la bureaucratie du [GetTitleByKey('e_great_liao').GetNameNoTier] en étant indulgent et bienveillant. Je suis né dans la pauvreté, et je ne veux ni que moi ni mes descendants vivions jamais ainsi à nouveau. Contrairement à beaucoup d'autres nobles et officiels, nés avec une cuillère d'argent dans la bouche, j'ai dû me frayer un chemin vers le sommet par la cruauté et la pure force de volonté.\n\nEn ce moment, [daozong.GetTitledFirstName] me fait grandement confiance, écoutant toujours mes conseils et louant ce qu'il considère comme mes vertus. Si je joue bien mes cartes, je pourrais bientôt devenir le dirigeant #italic de facto#! de l'empire. Cependant, il y a un obstacle principal sur mon chemin vers l'accumulation de plus de pouvoir et de richesse : l'Impératrice, [guanyin.GetFullName].\n\nElle est elle-même très puissante, et grandement respectée pour sa prétendue vertu, son intellect et sa beauté. Bah ! Je trouverai un moyen de l'emporter, comme je l'ai toujours fait... mais je dois me débarrasser d'elle et de ses enfants d'une manière ou d'une autre."
 tarim_basin.0246.a:0 "Et si je retournais l'Empereur contre elle..."
 tarim_basin.0246.info:0 "#emphasis Contexte historique :#! Yelu Yixin était un officiel du XIe siècle de l'Empire Liao (ou Khitan) qui accéda au pouvoir durant le règne de l'Empereur Daozong. Il était apprécié de l'Empereur pour son éloquence et sa diligence, mais en tant que haut fonctionnaire, il devint corrompu à mesure qu'il étendait son contrôle sur le gouvernement.\n\nL'Impératrice de Daozong, Guanyin, et le Prince héritier Jun, étaient ses principaux rivaux politiques. Ainsi, en 1075, il fit accuser l'Impératrice d'adultère avec le musicien de cour Zhao Weiyi en la piégeant pour qu'elle écrive un poème d'amour qui était supposément adressé à Zhao Weiyi. L'Empereur fit ensuite exécuter l'Impératrice. Le Prince Jun fut rétrogradé et tué plus tard en 1077.\n\nLa chute de Yixin commença peu après qu'il tenta sans succès d'assassiner le petit-fils de Daozong et fils de Jun, le futur Empereur Tianzuo. Daozong prit conscience de la corruption de Yixin et l'emprisonna ; Yixin tenta ensuite de faire défection vers la Dynastie Song en 1083, mais fut capturé et exécuté lui-même. En 1102, sa famille et ses co-conspirateurs contre l'Impératrice Guanyin furent exécutés, et ses restes détruits."
 tarim_basin.0247.t:0 "$RICE_historical_aspiration_fulfilled_title$"
 tarim_basin.0247.desc:0 "Pourquoi être le dirigeant officiel d'un Empire, quand on peut le diriger depuis les ombres ?\n\nMon parcours pour régner sur le [GetTitleByKey('e_great_liao').GetNameNoTier] depuis les ombres ne fut pas facile, mais j'ai réussi à accumuler le pouvoir et la richesse dont je ne pouvais que rêver étant jeune homme. [daozong.GetTitledFirstName] est ma marionnette, qu'[daozong.GetSheHe] en soit conscient[daozong.Custom('FR_E')] ou non ; mon ancienne rivale, l'ancienne Impératrice, [guanyin.GetFirstName], est morte. Et ma famille possède suffisamment d'influence et d'or pour que nous ne manquions de rien pendant de nombreuses générations - nous n'aurons plus à languir dans la pauvreté, comme je l'ai fait toutes ces années !\n\nLes imbéciles louaient la défunte [guanyin.GetFirstNameNoTooltip] pour sa bonté et sa vertu ; où la bonté et la vertu l'ont-elles menée ? Ce n'est que par ma cruauté que j'ai réussi."
 tarim_basin.0247.a:0 "Tous me craignent et me respectent désormais !"
