 # History Intros (Jesus Christ these are long)
 RICE_dunhuang_start_intro.zhang:0 "#emphasis Contexte historique :#! Après le déclin de la dynastie Tang à la suite de la rébellion d'An Lushan au milieu du VIIIe siècle, l'empire tibétain a conquis une grande partie des anciennes dominations Tang en Asie centrale, y compris Dunhuang (ou Shazhou). Zhang Yichao, un Han originaire de Dunhuang, a mené une révolte victorieuse en 848 contre les Tibétains ; après des années de campagne, il a restauré la majeure partie du corridor de Hexi sous la domination des Tang.\n\nYichao entretenait des relations tendues avec les Tang et dut envoyer son frère Yitan en otage à la cour des Tang pour s'attirer leurs faveurs, car il avait besoin de toute l'aide possible pour défendre la frontière. Lorsque Yitan mourut, Yichao décida de le remplacer en tant qu'otage, laissant son neveu Huaishen en charge.\n\nLe règne de Huaishen fut plus tumultueux, car un certain nombre d'acquis de son oncle furent perdus et les relations du circuit de Guiyi avec les Tang ne s'améliorèrent guère. Huaishen finit par mourir dans des circonstances incertaines vers 890. Il a probablement été tué par l'un de ses parents et/ou par un fonctionnaire ambitieux tel que Suo Xun."
 RICE_dunhuang_start_intro.cao:0 "#emphasis Contexte historique :#! Bien que les Cao soient un clan bien établi à Dunhuang, il est possible que leur membre le plus célèbre, Cao Yijin, soit en fait d'origine sogdienne lointaine. Si c'est le cas, il a pu vouloir mettre en avant un lien avec le plus célèbre des Cao pour renforcer le prestige de sa famille proche.\n\nQuoi qu'il en soit, Yijin était à l'origine un haut fonctionnaire de Zhang Yichao, le libérateur de Dunhuang. Il a usurpé le pouvoir de la famille Zhang en 914, mais contrairement aux coups d'État des autres clans de Dunhuang, le sien a été plus réussi et plus permanent.\n\nYijin a hérité d'un Guiyi considérablement réduit en puissance et en taille. Néanmoins, c'était un souverain compétent : il a maintenu des alliances matrimoniales stratégiques avec le royaume de Khotan et les Ouïghours de Guazhou, s'est efforcé de gagner la confiance des clans de l'élite de Dunhuang, a développé l'agriculture, a parrainé de grands projets religieux bouddhistes, etc. Après sa mort en 935, sa famille restera au pouvoir jusqu'à la chute du circuit de Guiyi au profit des Xia occidentaux en 1036."
 RICE_dunhuang_start_intro.suo:0 "#emphasis Contexte historique :#! Les Suo étaient l'un des clans les plus anciens de Dunhuang, descendant d'un érudit et fonctionnaire de la dynastie Jin nommé Suo Jing (239-303), qui est l'une des figures les plus importantes de l'histoire de la calligraphie chinoise.\n\nAvec un pedigree aussi illustre, les Suo étaient considérés comme l'un des clans les plus influents de Dunhuang - une source contemporaine les classe au premier rang des grandes familles de Dunhuang, et nombre d'entre eux ont servi Zhang Yichao en tant que fonctionnaires ou généraux. L'un d'entre eux, Suo Zhongxin, était un proche collaborateur de Yichao ; un autre, Suo Xun, était son gendre.\n\nLe neveu et successeur de Yichao, Huaishen, meurt dans des circonstances inhabituelles en 890. L'une des principales théories concernant sa mort est qu'il a été assassiné par Suo Xun, peut-être avec Huaiding, le fils de Yichao, car les deux ont pu partager le pouvoir pendant un certain temps jusqu'à la mort de Huaiding. Xun a régné seul pendant quelques années encore, jusqu'à ce qu'il soit lui-même tué lors d'un contre-coup d'État en 894 par les fils de Li Mingzhen, un autre gendre de Yichao.\n\nNéanmoins, les Suo continuèrent à jouer un rôle dans la politique de Dunhuang. Par exemple, l'un de leurs membres, le fonctionnaire Suo Ziquan, a conduit une importante délégation auprès du roi de Khotan en 956."
 RICE_dunhuang_start_intro.li:0 "#emphasis Contexte historique :#! Les Longxi Li étaient une branche de la famille Li basée dans l'actuelle province du Gansu. Parmi leurs descendants figuraient le célèbre général de la dynastie Han, Li Guang, son petit-fils le tragique traître Li Ling, et la dynastie Tang elle-même. À Dunhuang, ils jouèrent un rôle majeur dans la politique de la région pendant des siècles. Par exemple, un ancêtre des empereurs Tang, Li Gao, fonda l'éphémère dynastie des Liang occidentaux qui régna sur Dunhuang de 400 à 421.\n\nLe clan Li était un fervent soutien de Zhang Yichao, le libérateur de Dunhuang, et de sa famille. À l'époque, leur représentant le plus éminent était Li Mingzhen, un gendre de Yichao. Il servit d'envoyé de Yichao à la cour des Tang à un moment donné, utilisant son ascendance supposément commune avec les empereurs Tang pour accroître sa crédibilité et les convaincre d'accorder à Yichao le titre convoité de #italic jiedushi#! ou gouverneur militaire.\n\nLes proches de Mingzhen occupaient également des rôles clés à Dunhuang : deux de ses frères détenaient des postes importants au sein de l'Armée Guiyi, dont l'un, Mingda, l'accompagna lors de son voyage à la cour des Tang. Par ailleurs, après la mort de Mingzhen en 890, ses quatre fils lancèrent un contre-coup d'État contre Suo Xun et restaurèrent la région sous le gouvernement des Zhang."
 RICE_dunhuang_start_intro.zhai:0 "#emphasis Contexte historique :#! Le clan Zhai était présent à Dunhuang dès le VIe siècle. Un certain Zhai Tong, appelé Siyuan, a parrainé la construction de la grotte 220 de Mogao en 642, au début de la dynastie Tang. Cette grotte est l'une des plus anciennes grottes connues de Mogao consacrée uniquement à un sanctuaire familial, et l'une des rares grottes dont la datation est relativement fiable. Au cours des trois cents dernières années, la grotte a fait l'objet de plusieurs reconstructions par les descendants de Siyuan.\n\nSous le règne de Zhang Yichao, un membre éminent du clan Zhai était Zhai Farong, un moine et médecin qui occupait le poste de chef de la communauté monastique bouddhiste dans toute la région de Hexi. Un de ses parents, Xin (ou Huaxin), servira plus tard la famille Zhang en tant que fonctionnaire mineur.\n\nLe fils de Xin était Fengda, un descendant de Siyuan de la neuvième génération qui allait devenir le plus célèbre descendant du clan Zhai. Important fonctionnaire de la dynastie Cao dans les années 900, il se distingue par ses activités intellectuelles, en particulier dans le domaine de l'astronomie."
 RICE_dunhuang_start_intro.yin:0 "#emphasis Contexte historique :#! Le clan Yin était actif à Dunhuang depuis au moins le 4e siècle. Sous l'ancienne dynastie Liang (320-376), ils ont suscité l'ire du fondateur de l'ancienne dynastie Liang, Zhang Gui, ce qui a entraîné la mort d'un membre éminent de la famille, Yin Jian. Le frère de Jian, Yin Dan, a également été gouverneur de Dunhuang à un moment donné.\n\nQuoi qu'il en soit, la famille Yin a continué à prospérer à Dunhuang au fil des siècles, s'impliquant dans la politique de la région. Par exemple, ils ont été de fervents partisans de l'impératrice Wu Zetian pendant son règne ; selon la légende, un rejeton de la famille Yin a rêvé de divers signes de bon augure affirmant la légitimité et la grandeur du règne de l'impératrice.\n\nÀ l'époque de Guiyi, ils ont également joué un rôle en aidant Zhang Yichao à reprendre Dunhuang aux Tibétains. Yin Wentong, un gendre de Yichao, était par exemple l'un de ses principaux généraux. Un autre membre de la famille, Jifeng, deviendra plus tard gouverneur de Liangzhou"
 RICE_dunhuang_start_intro.zhang_wenche:0 "#emphasis Contexte historique :#! Zhang Wenche était un poète et l'un des deux fonctionnaires envoyés pour mener un groupe d'émissaires auprès de la dynastie Tang en 887 de notre ère, au nom du dirigeant de Guiyi, Zhang Huaishen. L'autre était Song Runying.\n\nLa mission des émissaires était de demander aux Tang de conférer formellement à leur suzerain le titre important de #italic jiedushi#!, et de légitimer son règne face à la détérioration de la situation politique de la région. Lorsque la cour des Tang traîna des pieds pendant des semaines, les émissaires se disputèrent - Runying soutenait qu'il fallait être patient ; Wenche arguait que c'était inutile, et il insulta de surcroît Huaishen, le qualifiant de seigneur incompétent qui ne méritait pas le titre. Quoi qu'il en soit, le groupe revint les mains vides.\n\nIl existe une théorie selon laquelle Wenche aurait été celui qui ordonna réellement l'assassinat de Huaishen en 892, et non Suo Xun, qui usurpa le pouvoir par la suite. Wenche devint premier ministre pour un dirigeant ultérieur de Guiyi, Chengfeng, parent de Huaishen, et aida à persuader son suzerain de se proclamer Empereur en 910 après la chute des Tang. Cela échoua désastreusement lorsque les Ouïghours attaquèrent ; un Chengfeng humilié dut se rétrograder au rang de roi, avant d'être usurpé par Cao Yijin. À ce moment-là, Wenche était décédé."
 RICE_dunhuang_start_intro.song_runying:0 "#emphasis Contexte historique :#! Song Runying était un fonctionnaire de Guiyi qui fut l'un des deux fonctionnaires envoyés à la tête d'un groupe d'émissaires auprès de la dynastie Tang en 887 au nom du souverain de Guiyi, Zhang Huaishen. L'autre était Zhang Wenche\n\nLa mission des envoyés était de demander aux Tang de conférer officiellement à leur seigneur le titre important de #italic jiedushi#!, et de légitimer son règne à la lumière de la détérioration de la situation politique de la région. La cour des Tang ayant traîné les pieds pendant des semaines, les envoyés se sont disputés - Runying a soutenu qu'ils devaient être patients ; Wenche a soutenu que c'était inutile, et il a en outre insulté Huaishen comme un seigneur inepte qui ne méritait pas le titre. Quoi qu'il en soit, le groupe revint bredouille."
 RICE_dunhuang_start_intro.yan:0 "#emphasis Contexte historique :#! Comme de nombreux clans d'élite à Dunhuang, la famille Yan fut à la fois collaboratrice et résistante à l'Empire tibétain après que celui-ci eut conquis le corridor du Hexi aux Tang.\n\nCette relation paradoxale peut peut-être être perçue à travers la carrière du membre le plus célèbre de la famille, le général Yan Chao, qui organisa une résistance majeure à l'invasion tibétaine dans les années 770 et 780. L'aide du gouvernement Tang n'étant pas à venir, il se rendit aux Tibétains à la condition que Dunhuang soit épargnée de tout pillage et destruction. Les Tibétains restèrent probablement méfiants envers Yan Chao, car ils l'empoisonnèrent alors qu'il se rendait à Lhassa pour rendre officiellement hommage aux dirigeants tibétains.\n\nYan Yingda, le membre le plus éminent du clan dans le régime de Zhang Yichao, commença comme le plus haut fonctionnaire chinois sous les Tibétains au début du IXe siècle. Il finit cependant par contribuer au soulèvement de Zhang Yichao, et fut nommé préfet de Guazhou à un moment donné."
 RICE_dunhuang_start_intro.gao_jinda:0 "#emphasis Contexte historique :#! Gao Jinda était un commandant militaire servant sous Zhang Yichao durant son soulèvement contre les Tibétains. Après le succès de la rébellion, Yichao envoya Jinda rapporter la victoire à la cour des Tang. Le nombre exact de délégations envoyées par Yichao et leurs dates restent incertains, mais le groupe de Jinda fut probablement le premier.\n\nFait intéressant, Jinda n'était accompagné que d'une petite escorte de dix soldats seulement, malgré les dangers qu'ils affrontaient en chemin. Des parties du corridor du Hexi étaient encore contrôlées par des seigneurs de guerre tibétains se battant dans le sillage de l'effondrement de l'Empire tibétain, si bien que Jinda et son équipe durent emprunter un itinéraire détourné à travers le désert pour atteindre le territoire des Tang, un voyage qui dura deux ans.\n\nHélas, leur périple dut s'achever dans la déception, car la cour des Tang ne sembla guère enthousiasmée par la nouvelle, ne conférant à Zhang Yichao que le titre relativement insignifiant de « Défenseur de Shazhou », peut-être en guise de reconnaissance courtoise de ses accomplissements. Yichao ne recevrait le titre convoité de #italic jiedushi#! ou gouverneur militaire que lorsqu'il envoya une délégation ultérieure d'émissaires menée par son frère Yitan, le célèbre moine Wuzhen, et Li Mingzhen, un parent éloigné des empereurs Tang."
 RICE_dunhuang_start_intro.sogdian:0 "#emphasis Contexte historique :#! Les Sogdiens, peuple d'Iran oriental réputé pour ses compétences commerciales, étaient très présents à Dunhuang et dans le corridor du Hexi dans l'Antiquité et au Moyen Âge. Nombre d'entre eux sont devenus des membres éminents de l'élite de Dunhuang et ont joué un rôle dans le gouvernement et l'armée du circuit de Guiyi.\n\nAn Jingmin, par exemple, devait être un Sogdien d'une certaine importance puisqu'il a participé au soulèvement de Zhang Yichao et a été nommé vice-commissaire du circuit de Guiyi, et donc second de Yichao.\n\nLes Kang étaient une autre famille sogdienne importante à Dunhuang. Leurs principaux représentants dans le régime de Yichao comprenaient des fonctionnaires tels que Kang Tongxin, magistrat de plusieurs villes de l'est du corridor du Hexi, et Kang Shijun, qui fut préfet de Guazhou à un moment donné."
 RICE_dunhuang_start_intro.wenmo:0 "En tant que [ruler|El] des Wenmo, vous commencez avec quelques [special_troops|El].\n\n#emphasis Contexte historique :#! Les Wenmo, également connus sous le nom de Wamo ou Hunmo, ont des origines ambiguës mais sont probablement les descendants d'esclaves d'ascendance chinoise et d'autres ethnies sous domination tibétaine durant l'occupation tibétaine de la région du Gansu.\n\nLe développement de l'identité Wenmo a été décrit comme analogue à celui des Créoles ou des Marrons dans les Amériques. Les Wenmo étaient une épine dans le pied du Circuit de Guiyi, et établirent un régime indépendant à Liangzhou en 884.\n\nZhebu Yun ici est fictif, bien que les Zhebu aient été une tribu Wenmo majeure. Leur membre le plus important fut Zhebu Jiashi, qui devint le dirigeant de Liangzhou en 948-949. En 1004, un autre Zhebu, Zhebu Youlongbo, rendit Liangzhou aux Tangoutes en pleine ascension, prédécesseurs de l'État des Xia occidentaux."

 # Game Concepts
 game_concept_silk_road_entertainers:0 "Les artistes de la Route de la soie"
 game_concept_kuchean_entertainers:0 "Les artistes koutchéens"
 game_concept_present_silk_road_entertainers:0 "$RICE_tarim_basin_gift_entertainers$"
 game_concept_present_kuchean_entertainers:0 "$RICE_tarim_basin_gift_kuchean_entertainers$"
 game_concept_silk_road_entertainers_gift:0 "Cadeau spécial"
 game_concept_silk_road_entertainers_desc:0 "À travers la Route de la soie, présenter des personnes aux talents variés dans le domaine du divertissement est une manière courante de conduire la diplomatie et de mettre en valeur son statut, son pouvoir et sa richesse. Cela peut inclure des musiciens, des acrobates, des danseurs, des courtisanes, de beaux esclaves, et plus encore.\n\nCette [character_interaction|El] existe en deux variétés : une version standard pour #bold $RICE_tarim_basin_gift_entertainers$#!, et une plus puissante pour #bold $RICE_tarim_basin_gift_kuchean_entertainers$#! qui n'est disponible que pour celui qui possède le [county|El] de Kucha. La version standard est débloquée si vous avez l'[dynasty_perk|El] [GetDynastyPerk('RICE_tarim_basin_silk_road_legacy_2').GetName] ou [GetDynastyPerk('RICE_socotra_indian_ocean_legacy_2').GetName] ou si votre [culture|El] possède la [tradition|El] #V $tradition_RICE_silk_road_name$#!. La version spéciale koutchéenne est débloquée tant que Kucha possède le [county_modifier|El] [GetModifier('RICE_tarim_basin_kuchean_music').GetNameWithTooltip].\n\nCette interaction est distincte d'un simple [gift|El], car non seulement elle coûte plus d'[gold|El], mais elle ne peut être offerte qu'à d'autres [rulers|El], et donne également à tous les deux du [prestige|El], du [dynasty_prestige|El], et de la [grandeur|El] (si vous êtes un [king|El] ou un [emperor|El])."
 game_concept_silk_road_community_short:0 "Communauté"
 game_concept_silk_road_community:0 "Communauté de la Route de la soie"
 game_concept_silk_road_communities_short:0 "Communautés"
 game_concept_silk_road_communities:0 "Communautés de la Route de la soie"
 game_concept_silk_road_communities_desc:0 "La [decision|El] de #V $RICE_reinforce_relations_silk_road_communities$#! est disponible pour les [rulers|El] dans la [GetGeographicalRegion('RICE_silk_road_region').GetName|l]. Prendre la [decision|El] vous permet de choisir de travailler à améliorer votre relation avec l'un des groupes ethniques/culturels de votre royaume - Est-asiatique, Steppique, Moyen-oriental, Himalayen, Indien, Est-africain et Sud-est asiatique - chacun vous accordant un [character_modifier|El] distinct pendant 10 ans pouvant fournir des avantages supplémentaires.\n\nTant que le [modifier|El] est actif, vous avez une chance de recevoir divers bienfaits. Ceux-ci arrivent généralement via des événements narratifs et peuvent varier d'un peu d'[gold|El] ou de [piety|El] à des courtisans gratuits et des [special_troops|El], et différentes communautés offrent différents avantages. Chaque communauté débloque également une [decision|El] unique et simple qui offre des avantages supplémentaires contre un prix.\n\nNotez que cette [decision|El] ne peut être prise qu'une seule fois dans une vie, à moins que votre [dynasty|El] n'ait débloqué soit les [dynasty_perks|El] [GetDynastyPerk('RICE_socotra_indian_ocean_legacy_3').GetName] ou [GetDynastyPerk('RICE_tarim_basin_silk_road_legacy_3').GetName], ou que votre [culture|El] possède la [tradition|El] #V $tradition_RICE_silk_road_name$#!."
 game_concept_mogao_cave_short:0 "Grotte"
 game_concept_mogao_caves_short:0 "Grottes"
 game_concept_mogao_cave:0 "Grotte de Mogao"
 game_concept_mogao_caves:0 "Grottes de Mogao"
 game_concept_mogao_caves_desc:0 "La [decision|El] de #V $RICE_tarim_basin_patronize_a_mogao_cave$#! est disponible pour les [rulers|El] bouddhistes dans le [GetGeographicalRegion('RICE_dunhuang_region').GetName].\n\nLes grottes de Mogao sont un spectaculaire réseau de structures religieuses creusées autour de Dunhuang du IVe siècle au XIVe siècle - plus d'un millénaire - et comptent parmi les plus belles œuvres d'art bouddhistes médiévales au monde. Lorsque vous prenez la [decision|El], vous avez deux choix à faire. Premièrement, choisir sur quoi l'œuvre d'art de la grotte se concentrera : la famille, les contes Jataka ou les figures religieuses. Ceux-ci rapporteront respectivement plus de [prestige|El], plus de [piety|El], ou un équilibre entre les deux, une fois la chaîne d'événements terminée. Ensuite, choisir la taille de la grotte détermine l'importance des bonus que vous obtenez, ainsi que la puissance du [character_modifier|El] que vous recevez à la fin.\n\nDeux [dynasty_perks|El] aident avec cette [decision|El]. [GetDynastyPerk('RICE_tarim_basin_silk_road_legacy_4').GetName] augmente les bonus de la [decision|El], et [GetDynastyPerk('RICE_tarim_basin_silk_road_legacy_5').GetName] rend la décision moins coûteuse et permet à quiconque dans le bassin du Tarim d'y accéder également."
 game_concept_eight_protectors_of_khotan:0 "Huit Protecteurs du Khotan"
 game_concept_eight_protectors:0 "Huit protecteurs"
 game_concept_eight_protectors_desc:0 "Selon diverses légendes khotanaises, les $game_concept_eight_protectors$ étaient huit divinités que le Bouddha chargea de veiller sur et de défendre Khotan. Les [rulers|El] de Khotan qui suivent une [faith|El] #V bouddhiste#! se verront ainsi accorder le [character_modifier|El] [GetModifier('RICE_tarim_basin_khotan_eight_protectors').GetNameWithTooltip], et eux ainsi que les [rulers|El] à proximité auront accès à une [activity|El] pour participer à une [GetActivityType( 'activity_RICE_tarim_basin_khotan_procession' ).GetName].\n\nCependant, il est possible que ce [character_modifier|El] devienne définitivement inaccessible dans la partie, et ne soit plus jamais accordé à aucun autre [ruler|El] si Khotan est considéré comme n'étant plus dominé par les bouddhistes. Cela ne peut se produire que si le [county|El] de Khotan passe aux mains d'un [ruler|El] qui suit une [faith|El] ne remplissant aucun des critères suivants, et qui n'a aucun [liege|El] ou [top_liege|El] dont la [faith|El] ne les remplit pas non plus ces critères :\n\n$EFFECT_LIST_BULLET$ [religion|E] bouddhiste ou taoïste\n$EFFECT_LIST_BULLET$ Une autre foi appartenant aux [religious_families|El] orientale ou païenne et possédant la [doctrine|El] [GetFaithDoctrine('doctrine_pluralism_pluralistic').GetBaseName]\n$EFFECT_LIST_BULLET$ Possède le [core_tenet|El] [GetFaithDoctrine('tenet_eastern_syncretism').GetBaseName]\n$EFFECT_LIST_BULLET$ Possède la [doctrine|El] [GetFaithDoctrine('doctrine_pluralism_pluralistic').GetBaseName]\n$EFFECT_LIST_BULLET$ Possède la [doctrine|El] [GetFaithDoctrine('unreformed_faith_doctrine').GetBaseName]\n\nSi les bouddhistes souhaitent regagner les bénédictions des Huit Protecteurs, ils devront d'abord gouverner Khotan à nouveau, et prendre la [decision|El] de #V $RICE_tarim_basin_reinhabit_gomati_monastery$#!."
 
 # Aspirations 
 RICE_tarim_basin_aspiration_cao_yijin_desc:"\n\n#bold [historical_aspiration_main_objectives|E]#!\n$EFFECT_LIST_BULLET$[completely_control|E] [GetTitleByKey('d_guasha').GetNameNoTier] et [GetTitleByKey('d_gansu').GetNameNoTier]\n$EFFECT_LIST_BULLET$Être le [king|El] de [GetTitleByKey('k_hexi').GetNameNoTier] ou [GetTitleByKey('k_xia').GetNameNoTier]\n\n#bold Récompenses#!\n$EFFECT_LIST_BULLET$Gain de @prestige_icon! #V [EmptyScope.ScriptValue('RICE_aspiration_medium_resource_bonus')]#! de [prestige|El]\n$EFFECT_LIST_BULLET$Recevez #V 1000#! [special_troops|El]\n\n#bold [historical_aspiration_bonus_objectives|E]#!\n$EFFECT_LIST_BULLET$Prendre la [decision|El] de #V $RICE_tarim_basin_patronize_a_mogao_cave$#! (Récompense : @piety_icon! #V [EmptyScope.ScriptValue('RICE_aspiration_medium_resource_bonus')]#! de [piety|El])\n$EFFECT_LIST_BULLET$Avoir une [alliance|El] avec un [ruler|El] de [rank|El] [king|El] ou [emperor|El] (Récompense : @dynasty_prestige_icon! #V [EmptyScope.ScriptValue('RICE_aspiration_medium_resource_bonus')]#! de [dynasty_prestige|El])#!"
 RICE_tarim_basin_historical_aspiration_action_cao_yijin: "#italic Les clans d'élite de Dunhuang ne sont pas dignes de diriger le circuit de Guiyi. Pour rétablir l'ordre à la frontière anarchique des régions occidentales, vous devez réaliser vos ambitions de régner sur Guiyi.#!$RICE_tarim_basin_aspiration_cao_yijin_desc$"
 RICE_tarim_basin_historical_aspiration_modifier_desc_cao_yijin: "[GetModifier('RICE_tarim_basin_aspiration_restore_order_guiyi').GetNameWithTooltip]"
 RICE_tarim_basin_aspiration_al_kashgari_desc:"\n\n#bold [historical_aspiration_main_objectives|E]#!\n$EFFECT_LIST_BULLET$Prenez la [decision|El] de #V $RICE_tarim_basin_compile_the_turkic_dictionary$#! et complétez la chaîne d'événements\n\n#bold Récompenses#!\n$EFFECT_LIST_BULLET$Gain de @prestige_icon! #V [EmptyScope.ScriptValue('RICE_aspiration_medium_resource_bonus')]#! de [prestige|El]\n$EFFECT_LIST_BULLET$Gain du [modifier|El] [GetModifier('RICE_tarim_basin_is_al_kashgari_upgrade').GetNameWithTooltip]\n\n#bold [historical_aspiration_bonus_objectives|E]#!\n$EFFECT_LIST_BULLET$Apprenez au moins trois [languages|El] (Récompense : Gagnez #P 1#! point d'[perk|El] dans votre [lifestyle|El] actuel)\n$EFFECT_LIST_BULLET$Atteignez le [prestige_level|El] $PRESTIGE_LEVEL_LABEL_3$ (Récompense : Gain de [diplomacy_i|El] #V 1#! et [learning_i|El] #V 1#!)"
 RICE_tarim_basin_historical_aspiration_action_al_kashgari:"#italic Les Arabes et les Persans considèrent les Turcs comme des barbares non civilisés. J'espère compiler un grand dictionnaire du turc pour leur prouver le contraire, et que le turc est une langue belle et élégante, lui aussi !#!$RICE_tarim_basin_aspiration_al_kashgari_desc$"
 RICE_tarim_basin_historical_aspiration_modifier_desc_al_kashgari: "[GetModifier('RICE_tarim_basin_is_al_kashgari').GetNameWithTooltip]"
 RICE_tarim_basin_aspiration_yelu_yixin_desc:"\n\n#bold [historical_aspiration_main_objectives|E]#!\n$EFFECT_LIST_BULLET$Être un [direct_vassal|El] de [GetTitleByKey('e_great_liao').GetNameNoTier]\n$EFFECT_LIST_BULLET$Avoir au moins [gold_i|El] #V [EmptyScope.ScriptValue('RICE_aspiration_large_resource_bonus')]#! dans votre trésorerie\n$EFFECT_LIST_BULLET$Xiao Guanyin et tous ses [children|El] sont morts\n$EFFECT_LIST_BULLET$S'assurer que le [ruler|El] de [GetTitleByKey('e_great_liao').GetNameNoTier] a au moins #P 25#! d'[opinion|El] envers vous\n$EFFECT_LIST_BULLET$Avoir un [prestige_level|El] de [GetModifier( 'prestige_level_3' ).GetNameWithTooltip|L] ou plus\n\n#bold Récompenses#!\n$EFFECT_LIST_BULLET$Gain d'un [perk|El] de [diplomacy_lifestyle|El]\n$EFFECT_LIST_BULLET$Gain d'un [perk|El] de [intrigue_lifestyle|El]\n$EFFECT_LIST_BULLET$Gain de @prestige_icon! #V [EmptyScope.ScriptValue('RICE_aspiration_large_resource_bonus')]#! de [prestige|El]\n$EFFECT_LIST_BULLET$Améliore le [trait|El] [GetTrait('education_intrigue_4').GetName( GetNullCharacter )|U] en [trait|El] [GetTrait('education_intrigue_5').GetName( GetNullCharacter )|U]\n$EFFECT_LIST_BULLET$Gagne un [perpetual_hook|El] sur le [ruler|El] de [GetTitleByKey('e_great_liao').GetNameNoTier]\n\n#bold [historical_aspiration_bonus_objectives|E]#!\n$EFFECT_LIST_BULLET$Tuer directement Xiao Guanyin (Récompense : Gagne un [perk|El] de [intrigue_lifestyle|El])\n$EFFECT_LIST_BULLET$Avoir [dread_i|El] #V [EmptyScope.ScriptValue('high_dread')]#! de [dread|El] ou plus (Récompense : Recevez #V 1000#! [special_troops|El] $heritage_chinese_name$, dont des [men_at_arms|El])"
 RICE_tarim_basin_historical_aspiration_action_yelu_yixin:"#italic Bien que né dans la pauvreté, vous avez gravi les échelons les plus élevés de l'Empire Liao. C'est un monde impitoyable : ce que les naïfs appellent corruption, vous savez n'être que pragmatisme sans pitié, et vous ferez ce qu'il faut pour conserver votre pouvoir et votre richesse.#!$RICE_tarim_basin_aspiration_yelu_yixin_desc$"
 RICE_tarim_basin_historical_aspiration_modifier_desc_yelu_yixin: "[GetModifier('RICE_tarim_basin_aspiration_corrupt_liao_official').GetNameWithTooltip]" 

 # Aspiration Modifiers 
 RICE_tarim_basin_aspiration_corrupt_liao_official:"[RICE_aspiration|E] : Amasser pouvoir et richesse en tant que fonctionnaire des Liao"
 RICE_tarim_basin_aspiration_corrupt_liao_official_desc:"#italic Bien que né dans la pauvreté, Yelü Yixin s'est hissé jusqu'aux plus hauts échelons de l'Empire Liao. C'est un monde impitoyable : ce que les naïfs appellent corruption, il sait que ce n'est que du pragmatisme sans pitié, et il fera tout ce qu'il faut pour conserver son pouvoir et sa richesse.#!$RICE_tarim_basin_aspiration_yelu_yixin_desc$\n\n"


