 tarim_basin.0100.t:0 "Préparatifs pour la nouvelle année"
 tarim_basin.0100.desc:0 "Au début de chaque année, avant l'arrivée du printemps, il est de coutume parmi le peuple [culture_scope.GetCollectiveNoun|l] d'organiser une variété de combats et de jeux d'animaux pendant sept jours. Les résultats de ces concours sont utilisés pour prédire la fertilité de nos troupeaux et le rendement de nos récoltes dans un avenir proche.\n\nCette année, je souhaite organiser un grand événement de ce type. En général, certains animaux sont populaires pour ce genre de compétitions, et cette année, j'ai décidé de me concentrer sur les matchs entre un type d'animal en particulier :"
 tarim_basin.0100.a:0 "Bétail"
 tarim_basin.0100.a.tooltip:0 "Une prédiction #P positive#! pourrait vous aider dans les domaines liés à la fécondité et à la croissance"
 tarim_basin.0100.b:0 "Chevaux"
 tarim_basin.0100.b.tooltip:0 "Une prédiction #P positive#! pourrait vous aider dans les affaires liées au militaire et à votre statut"
 tarim_basin.0100.c:0 "Chameaux"
 tarim_basin.0100.c.tooltip:0 "Une prédiction #P positive#! pourrait vous aider dans les affaires liées au commerce et à la communication"
 tarim_basin.0100.d:0 "Chèvres"
 tarim_basin.0100.d.tooltip:0 "Une prédiction #P positive#! pourrait vous aider dans les affaires liées à la ténacité et à la défense"
 tarim_basin.0100.tooltip:0 "Vous commencerez à préparer les festivités, qui débuteront plus tôt que tard."
 tarim_basin.0101.t:0 "Il est temps de se battre !"
 tarim_basin.0101.desc.intro:0 "C'est le début de l'année, et avec l'arrivée du printemps, un esprit de célébration et de joie règne partout. Il y a, bien sûr, aussi les grands combats d'animaux et les jeux qui dureront sept jours. Plusieurs habitants versés dans les arts divinatoires traditionnels [culture_scope.GetCollectiveNoun|l] sont prêts à faire des prédictions sur la fertilité de nos récoltes et de nos troupeaux en fonction des résultats des compétitions."
 tarim_basin.0101.desc.cattle:0 "\n\nCette année, j'ai rassemblé les ressources nécessaires pour organiser un tournoi de compétitions entre #bold bovins#!. Pendant sept jours d'affilée, nous opposerons leurs taureaux les plus féroces et les plus robustes de la région les uns aux autres dans des combats sanglants - ce sera violent, brutal, et pas très joli, mais ce sera palpitant à voir !"
 tarim_basin.0101.desc.horses:0 "\n\nCette année, j'ai rassemblé les ressources nécessaires pour organiser un tournoi de compétitions entre #bold chevaux#!. Pendant sept jours d'affilée, ces magnifiques créatures - venues des quatre coins du royaume - participeront à des courses, exécuteront des exercices de gymnastique, et s'affronteront même dans des combats spectaculaires."
 tarim_basin.0101.desc.camels:0 "\n\nCette année, j'ai rassemblé les ressources nécessaires pour organiser un tournoi de compétitions entre #bold chameaux#!. Pendant sept jours d'affilée, des chameaux - des bêtes locales appartenant à des fermiers aux plus exotiques appartenant à des marchands étrangers - se réuniront pour s'affronter dans des courses et des combats palpitants et spectaculaires !"
 tarim_basin.0101.desc.goats:0 "\n\nCette année, j'ai rassemblé les ressources nécessaires pour organiser un tournoi de compétitions entre #bold chèvres#!. Pendant sept jours d'affilée, ces animaux tenaces et obstinés se rassembleront en grand nombre, afin que nous puissions tous les voir s'affronter dans des combats époustouflants et stupéfiants."
 tarim_basin.0101.desc.conclusion:0 "\n\nQuels seront les résultats de ces concours ? Il n'y a qu'une seule façon de le savoir...."
 tarim_basin.0101.a:0 "Que les chances soient toujours en notre faveur !"
 tarim_basin.0102.t:0 "Les combats prennent fin"
 tarim_basin.0102.desc.intro:0 "Comme le veut la coutume, après sept jours, les célébrations traditionnelles du début de l'année s'achèvent."
 tarim_basin.0102.desc.cattle:0 "\n\nLe clou des festivités fut, bien entendu, les nombreux combats d'animaux qui furent organisés, en particulier les nombreux combats et jeux entre #bold bétail#! que j'ai organisés cette année. Tout le monde s'accorde à dire qu'ils étaient très divertissants à regarder, mais la question demeure de savoir ce que les devins ont pensé des résultats de ces compétitions."
 tarim_basin.0102.desc.horses:0 "\n\nLe point central des festivités était, bien entendu, les nombreux combats d'animaux qui furent organisés, en particulier les nombreux combats et jeux entre #bold chevaux#! que j'ai organisés cette année. Tout le monde s'accorde à dire qu'ils étaient très divertissants à regarder, mais la question demeure de savoir ce que les devins ont pensé des résultats de ces compétitions."
 tarim_basin.0102.desc.camels:0 "\n\nLe point central des festivités était, bien entendu, les nombreux combats d'animaux qui furent organisés, en particulier les nombreux combats et jeux entre #bold chameaux#! que j'ai organisés cette année. Tout le monde s'accorde à dire qu'ils étaient fort divertissants à regarder, mais la question demeure de savoir ce que les devins ont pensé des résultats de ces compétitions."
 tarim_basin.0102.desc.goats:0 "\n\nLe point culminant des festivités était, bien entendu, les nombreux combats d'animaux qui furent organisés, en particulier les nombreux combats et jeux entre #bold chèvres#! que j'ai organisés cette année. Tout le monde s'accorde à dire qu'ils étaient très divertissants à regarder, mais la question demeure de savoir ce que les devins ont pensé des résultats de ces compétitions."
 tarim_basin.0102.desc.nothing:0 "\n\nSelon les habitants versés dans l'art de la divination, les résultats de ces compétitions sont... #bold mitigés#!, malheureusement. Il semble que nos champs ne fleuriront pas, et que nos troupeaux ne croîtront ni ne prospéreront. On ne peut qu'espérer que même s'ils ne s'en sortent pas bien, au moins ils ne s'en sortiront pas horriblement non plus."
 tarim_basin.0102.desc.good:0 "\n\nSelon les habitants versés dans l'art de la divination, les résultats de ces compétitions sont #bold bons#! ! Voilà qui est un soulagement pour tous, sans aucun doute ! Cela signifie que nos récoltes produiront des rendements appréciables, et que nos troupeaux continueront de croître à un rythme acceptable."
 tarim_basin.0102.desc.great:0 "\n\nSelon les habitants versés dans l'art de la divination, les résultats de ces compétitions sont #bold excellents#!! Si leurs interprétations sont correctes, nous serons bénis par une récolte abondante, et nos troupeaux croîtront considérablement - dans l'ensemble, de merveilleuses nouvelles pour le bien-être des gens et l'économie locale."
 tarim_basin.0102.a:0 "C'est ainsi qu'une nouvelle année commence...."
