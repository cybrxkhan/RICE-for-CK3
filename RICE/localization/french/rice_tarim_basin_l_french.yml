 tarim_basin.0209.desc:0 "xxxxx"
 tarim_basin.0209.a:0 "xxxxx"
 tarim_basin.0210.t:0 "Préparation de l'Ordam"
 tarim_basin.0210.desc:0 "Cette année, je souhaite assister à l'#italic Ordam#!, le plus grand festival de #italic mazar#! du [GetGeographicalRegion('world_steppe_tarim').GetName], qui se tient à [kashgar.GetNameNoTier] sur la tombe de [ali_arslan.GetTitledFirstName]. Ce noble [ali_arslan.GetLadyLord] a sacrifié sa vie pour combattre et vaincre les impitoyables infidèles bouddhistes de [khotan.GetNameNoTier], et il est juste que nous honorions la mémoire de cet homme et des autres martyrs qui sont morts dans les grandes et terribles guerres d'autrefois."
 tarim_basin.0210.a:0 "C'est une grande festivité à laquelle je #italic vais#! participer !"
 tarim_basin.0211.t:0 "L'Ordam commence"
 tarim_basin.0211.desc:0 "L'#italic Ordam#! est sur nous ! Avec mon entourage, moi et de nombreuses personnes venues de toute la région avons convergé vers un lieu particulier à [kashgar.GetNameNoTier] : le #italic mazar#!, ou tombeau, de [ali_arslan.GetTitledFirstName], pour rendre hommage à ce martyr tragique mais héroïque.\n\nJe vois un large éventail de personnes affluer lentement dans les limites de la ville, depuis d'humbles fermiers dépenaillés dans de vieilles charrettes branlantes tirées par des ânes, jusqu'à de splendides nobles chevauchant les plus fins destriers, en passant par d'opulents marchands dans d'éblouissants carrosses. Tous, cependant, sont venus ici pour cette festivité.\n\nCertains viennent réaffirmer leur foi dans la vraie religion qu'est [ROOT.Char.GetFaith.GetReligion.GetName] et réfléchir à l'héroïsme des martyrs passés ainsi qu'à la grandeur de [ROOT.Char.GetFaith.HighGodName]. D'autres viennent ici pour se mêler aux autres, socialiser et profiter d'une atmosphère d'énergie et d'excitation. La plupart, bien sûr, viennent faire les deux."
 tarim_basin.0211.a:0 "Évidemment, je suis surtout ici pour des raisons religieuses."
 tarim_basin.0211.b:0 "La religion est importante, mais la bonne compagnie l'est tout autant !"
 tarim_basin.0212.t:0 "Le Bol d'Or"
 tarim_basin.0212.desc:0 "Au cœur de l'#italic Ordam#!, l'un des événements les plus importants est un repas communautaire rituel auquel assistent de nombreuses personnes.\n\nDes gens de toutes conditions rassemblent diverses sortes de nourriture, comme du mouton frais, du riz et des légumes, et les présentent formellement aux notables et aux élites présents (moi y compris).\n\nLa nourriture est ensuite ajoutée dans un énorme pot appelé le bol doré, où elle est cuisinée ensemble et partagée avec tous les présents."
 tarim_basin.0212.a:0 "Malgré l'odeur forte de la nourriture, c'est un bon repas !"
 tarim_basin.0213.t:0 "Au tombeau"
 tarim_basin.0213.desc:0 "Voici venu le temps du point culminant et de l'événement principal de l'#italic Ordam#!, alors que de grands groupes de personnes portent des drapeaux colorés et se dirigent vers le #italic mazar#!, ou tombeau, de [ali_arslan.GetFirstName].\n\nNous traversons plusieurs dunes, comme le veut la tradition, avant d'atteindre le tombeau lui-même. Certains avancent lentement, mais beaucoup marchent vite, et quelques-uns - submergés par les élans de leur cœur et leur dévotion - courent à grande vitesse, comme s'ils dansaient sur le sable, tandis qu'ils nous exhortent à avancer, leurs voix emplis d'une émotion sans retenue.\n\nUne fois rassemblés autour du tombeau, les musiciens battent leurs tambours et jouent leurs chants, de plus en plus vite, montrant leurs talents à tous les présents. Puis les hommes et les tambourinaires pleurent tous à l'unisson, criant « Allah ! » et beaucoup se joignent à eux dans leurs lamentations, certains bruyamment et d'autres en silence, moi y compris."
 tarim_basin.0213.a:0 "Ô comme nous nous souvenons de toi, noble [ali_arslan.GetFirstName] !"
 tarim_basin.0214.t:0 "Fin de l'Ordam"
 tarim_basin.0214.desc:0 "Enfin, l'#italic Ordam#! touche à sa fin. Ce fut une expérience merveilleuse cette année - un mélange de prières solennelles et réfléchies et de deuil religieux, alors que nous honorions la mémoire de [ali_arslan.GetTitledFirstName], mais aussi un moment d'excitation et de plaisir, car de nombreuses personnes de tous horizons se sont rassemblées pour profiter de la compagnie les uns des autres. J'ai certainement passé un bon moment, et j'espère pouvoir refaire cela bientôt !"
 tarim_basin.0214.a:0 "Et nous reprenons tous notre vie normale...."
 tarim_basin.0215.t:0 "Chanteurs et Poètes"
 tarim_basin.0215.desc:0 "Il est courant pendant l'Ordam que des chanteurs et poètes itinérants se rassemblent en grand nombre à [kashgar.GetNameNoTier]. Ils envahissent les rues, beaucoup jouant de divers instruments tels que des luths ou des bâtons de percussion, récitant aussi bien des récits épiques de héros anciens que des ballades d'amour déchirantes et des contes religieux inspirants.\n\nCe qui ne serait autrement qu'une cacophonie de bruit pour certains est une merveilleuse symphonie de gaieté et de plaisir - malgré l'occasion solennelle - tandis que j'écoute les belles voix de ces grands talents."
 tarim_basin.0215.a:0 "C'est un peu écrasant de voir combien de personnes sont ici !"
 tarim_basin.0216.t:0 "Prier pour les enfants"
 tarim_basin.0216.desc:0 "Le centre d'attention principal de l'Ordam est, bien entendu, le tombeau de [ali_arslan.GetFirstName]. Je vois plusieurs jeunes femmes rassemblées près de la tombe du saint, priant avec ferveur. Je ne parviens à distinguer que quelques-uns de leurs mots, mais il est clair qu'elles prient pour avoir des enfants. Cela n'a rien d'inhabituel lors de ces festivités."
 tarim_basin.0216.a:0 "Que [ROOT.Char.GetFaith.HighGodName] exauce leurs vœux."
 tarim_basin.0217.t:0 "Danseurs âgés"
 tarim_basin.0217.desc:0 "Tout le monde, des plus jeunes aux plus âgés, est rassemblé ici à l'Ordam pour célébrer mais aussi honorer la mémoire de [ali_arslan.GetFirstName]. J'aperçois même plusieurs vieillards, qui semblent autrement avoir dépassé leur âge, danser avec une grande énergie. Contrairement aux plus jeunes, qui semblent d'humeur plus joyeuse, il est clair que ces messieurs plus âgés expriment, à leur manière, leur dévotion solennelle envers [ROOT.Char.GetFaith.HighGodName]."
 tarim_basin.0217.a:0 "C'est une chose profonde à observer."
 tarim_basin.0218.t:0 "Rencontrer les autres"
 tarim_basin.0218.desc:0 "L'Ordam est une occasion pour des gens de toutes sortes de se rassembler, et il est donc également bien connu comme une occasion pour les jeunes de se réunir et de se rencontrer dans une atmosphère plus décontractée et détendue. On dit que beaucoup y trouvent parfois leur futur mari ou leur future femme.\n\nTout le monde n'approuve pas cette coutume, cependant. Certains types plus zélés estiment que de telles choses sont inconvenantes - nous sommes ici pour honorer [ali_arslan.GetFirstName], après tout, pas pour nous livrer à une cour effrénée !"
 tarim_basin.0218.a:0 "Je suis d'accord ! Nous ne sommes pas ici pour perdre du temps en réjouissances futiles."
 tarim_basin.0218.b:0 "Allons, nous devrions laisser la jeunesse d'aujourd'hui s'amuser !"
 tarim_basin.0218.c:0 "Pour être honnête, ce n'est pas quelque chose qui me préoccupe beaucoup."
 tarim_basin.0219.t:0 "Légendes du martyr"
 tarim_basin.0219.desc:0 "Tout au long de cet Ordam, j'ai médité sur la vie héroïque de [ali_arslan.GetFirstName] et les batailles qu'[ali_arslan.GetSheHe] a dû mener contre les infidèles. Selon une version des légendes entourant sa mort, lorsqu'[ali_arslan.GetSheHe] fut tué au combat, nos odieux ennemis [ali_arslan.Custom('FR_LeLa')] décapitèrent et suspendirent sa tête aux murailles de [khotan.GetNameNoTier] pour frapper de terreur le cœur de tout passant [ROOT.Char.GetFaith.GetReligion.GetAdherentName].\n\nCependant, [ROOT.Char.GetFaith.HighGodName] est omniscient et miséricordieux, et la mort du martyr ne fit qu'inciter les survivants à combattre plus ardemment. Bientôt, les infidèles furent écrasés lors d'une bataille ultérieure, et totalement vaincus."
 tarim_basin.0219.a:0 "Son héroïsme nous inspire, encore aujourd'hui."
 tarim_basin.0220.t:0 "La mère du Martyr"
 tarim_basin.0220.desc:0 "Durant cet Ordam, je me surprends à méditer sur la vie remarquable de [ali_arslan.GetFirstName] et les légendes que j'ai entendues à son sujet. En fait, il existe même des histoires concernant sa mère également.\n\nOn raconte, par exemple, que sa mère était une princesse dévotement fidèle à [ROOT.Char.GetFaith.HighGodName]. Elle eut son fils, [ali_arslan.GetFirstName], avec nul autre que Saint Gabriel.\n\nPlus tard, cette femme courageuse partit elle-même au combat contre les infidèles, montrant que quiconque, qu'il soit homme ou femme, peut se battre au nom de la droiture et de la justice. Elle aussi fut martyrisée peu après son fils, et sa tombe - construite à l'endroit où elle serait morte - n'est pas très éloignée de celle de son fils."
 tarim_basin.0220.a:0 "Une femme formidable et inspirante dont nous pouvons tous nous inspirer."
 tarim_basin.0221.t:0 "Étals de nourriture"
 tarim_basin.0221.desc:0 "Ce ne serait pas l'Ordam si l'on ne voyait pas des rangées d'étals dans les rues de [kashgar.GetNameNoTier] vendant divers mets délicieux.\n\nPeut-être devrais-je essayer quelque chose pendant que je suis ici parmi ces étals de marché ? Il y a tant de choix, allant des nouilles #italic laghman#! au pilaf de riz, aux kebabs, au ragoût d'agneau et de poulet, et aux pâtisseries salées #italic samsa#!."
 tarim_basin.0221.a:0 "J'achèterai de quoi satisfaire mon appétit."
 tarim_basin.0221.b:0 "J'ai de meilleurs plats à déguster à la maison."
 tarim_basin.0222.t:0 "Divertissements pendant l'Ordam"
 tarim_basin.0222.desc:0 "Bien que l'Ordam soit une occasion solennelle, c'est aussi une opportunité de réjouissances comme tout autre festival.\n\nDans les rues de [kashgar.GetNameNoTier] le long des étals du marché, on peut assister à toutes sortes de spectacles et divertissements de rue, allant des combats de coqs à la lutte de chèvres, à la lutte et aux acrobaties.\n\nBien sûr, il y a toujours ceux qui désapprouvent ce genre de divertissements et n'y voient que péché, mais la plupart des gens ne seraient probablement pas d'accord. Quoi qu'il en soit, l'atmosphère ici est tout simplement si animée !"
 tarim_basin.0222.a:0 "Une telle atmosphère m'allège le cœur !"
 tarim_basin.0222.b:0 "Ce serait bien si l'atmosphère était plus solennelle..."
 tarim_basin.0223.t:0 "Deuil"
 tarim_basin.0223.desc:0 "Durant l'Ordam, je passe devant un groupe de plusieurs pèlerins, menés par un [ROOT.Char.Custom('DefaultPriestTitle')|U] à l'air digne. Ils sanglotent et pleurent, tout en chantant et récitant des prières à la louange de [ROOT.Char.GetFaith.HighGodName] et en se lamentant sur la mort d'[ali_arslan.GetFirstName]."
 tarim_basin.0223.a:0 "Une scène émouvante."
 tarim_basin.0224.t:0 "Colporteurs du Mazar"
 tarim_basin.0224.desc:0 "Je suis dans les rues de [kashgar.GetNameNoTier] en train de m'acheter de la nourriture en plein Ordam et j'entame une conversation avec un colporteur. Il dit que certains des colporteurs ou tenanciers d'étals, lui compris, dépendent en réalité du tombeau d'[ali_arslan.GetFirstName] pour leur subsistance.\n\n« Même quand l'Ordam n'a pas lieu, il y a toujours des pèlerins et des visiteurs venus de loin », explique-t-il. « Grâce à cela, j'ai toujours des clients à qui vendre mes marchandises. »"
 tarim_basin.0224.a:0 "Intéressant..."
 tarim_basin.0225.t:0 "Tournée sacrée du bassin du Tarim"
 tarim_basin.0225.desc:0 "Aujourd'hui, j'ai rencontré un groupe de personnes qui prétendent être en pèlerinage. C'est-à-dire qu'ils visitent divers #italic mazars#! de saints, de martyrs et d'autres personnes saintes à travers le [GetGeographicalRegion('world_steppe_tarim').GetName]. C'est une coutume parmi certains [ROOT.Char.GetFaith.GetReligion.GetAdherentNamePlural] dans cette région, et pour beaucoup de ceux qui accomplissent cet exploit, c'est presque aussi important que d'aller au Hajj à La Mecque.\n\nQuoi qu'il en soit, ces pèlerins me parlent des endroits où ils se sont rendus, et où ils prévoient d'aller. Cet Ordam à [kashgar.GetNameNoTier] n'est qu'une de leurs nombreuses étapes."
 tarim_basin.0225.a:0 "Je vous souhaite bonne chance pour la suite de votre voyage."
 tarim_basin.0226.t:0 "Sables bénis"
 tarim_basin.0226.desc:0 "Au #italic mazar#! de [ali_arslan.GetFirstName], il n'est pas rare de voir des gens s'enterrer dans le sable autour du mausolée. Pendant l'Ordam, le nombre de personnes qui font cela augmente de façon exponentielle.\n\nCe site est considéré comme une terre sacrée, bénie de pouvoirs de guérison. De nombreuses personnes, en particulier celles qui sont malades ou souffrantes, ou qui se croient proches de la mort, s'immergent dans le sable en conséquence."
 tarim_basin.0226.a:0 "Je n'aime pas le sable. Il est grossier, rugueux et irritant."
 tarim_basin.0226.b:0 "Que ces gens soient tous bénis par [ROOT.Char.GetFaith.HighGodName]."
 tarim_basin.0226.c:0 "Je devrais peut-être aussi essayer de m'immerger dans le sable."
