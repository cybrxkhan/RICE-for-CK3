 tarim_basin.0207.desc:0 "xxxxx"
 tarim_basin.0207.a:0 "xxxxx"
 tarim_basin.0208.t:0 "$RICE_historical_aspiration_fulfilled_title$"
 tarim_basin.0208.desc:0 "J'ai achevé mon magnum opus savant, le #italic Diwan Lughat al-Turk#!, il n'y a pas si longtemps. La nouvelle s'est répandue dans les cercles savants et même au-delà au sujet de mes accomplissements.\n\nMes voyages à travers le monde, et mes heures incessantes d'écriture et d'étude n'ont pas été vains. Désormais, tous connaissent la glorieuse langue et culture des peuples turcs, et mes efforts pour les élever aux yeux des autres."
 tarim_basin.0208.a:0 "La beauté du turc perdurera pendant des siècles !"
