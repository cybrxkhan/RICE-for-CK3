 activity_RICE_tocharian_animal_fight:0 "Combat d'animaux pour prédire l'avenir"
 activity_RICE_tocharian_animal_fight_desc:0 "Certains peuples ont pour coutume d'organiser des combats d'animaux au début de chaque année, dans le cadre des festivités du Nouvel An. Beaucoup pensent que la compréhension des résultats de ces combats permet de prédire avec précision les résultats des récoltes à venir ou la fertilité des troupeaux."
