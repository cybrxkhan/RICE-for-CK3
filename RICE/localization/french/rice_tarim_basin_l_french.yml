 tarim_basin.0200.t:0 "Al-Kashgari"
 tarim_basin.0200.desc:0 "#EMP Je suis l'un des plus élégants parmi les Turcs dans le langage, et le plus éloquent dans le discours ; l'un des plus éduqués, le plus profondément enraciné dans la lignée, et le plus pénétrant dans le lancer de la lance.#!\n\nUn jour, ces mots seront écrits dans les premières lignes de mon œuvre majeure, lorsque j'achèverai le premier dictionnaire des langues turciques. Je suis né rejeton de la grande dynastie turcique des Karakhanides qui règne désormais sur une grande partie de l'Asie centrale, les arrière-pays qui furent autrefois sous la domination de la Chine, mais je sais que mon destin se trouve ailleurs.\n\nJ'ai voyagé à travers de nombreuses terres, apprenant, comprenant, m'émerveillant. Pourtant, où que j'aille, les Arabes et les Persans riaient à l'idée que la langue [ROOT.Char.GetCulture.GetLanguage.GetName] soit l'égale de leurs langues en beauté et en éloquence !\n\nJe leur prouverai qu'ils ont tort. Je trouverai le temps, et l'énergie, et l'inspiration pour faire ce que je dois : prouver au monde que nous, les Turcs, sommes tout aussi cultivés et lettrés que les autres."
 tarim_basin.0200.a:0 "Ce sera la passion de ma vie, la mission de ma vie !"
 tarim_basin.0200.tooltip:0 "Vous pouvez prendre la [decision|El] de #V $RICE_tarim_basin_compile_the_turkic_dictionary$#! avant quiconque."
 tarim_basin.0200.info:0 "#emphasis Contexte historique :#! Mahmud al-Kashgari était un érudit du XIe siècle qui rédigea le premier dictionnaire turcique, le Diwan Lughat al-Turk, entre 1072 et 1074 de notre ère. La citation ci-dessus est tirée directement de l'introduction de son ouvrage.\n\nDans son œuvre, Kashgari fournit bien plus que de simples informations linguistiques - il aborde également l'histoire, la géographie, la religion, et ses opinions bien tranchées. Par exemple, il était fier de son héritage turcique et mettait en garde ses compatriotes turcs contre l'adoption d'un mode de vie sédentaire, car il estimait que leurs anciens modes de vie nomades étaient supérieurs. Il exprimait également une hostilité envers les croyances bouddhistes et païennes.\n\nQuoi qu'il en soit, Kashgari était supposément apparenté aux dirigeants de la dynastie karakhanide ; un tel lien n'est pas entièrement prouvé, mais il est plausible. S'il était d'ascendance karakhanide, son ancêtre aurait pu être un certain Hussayn ou Hasan, qui conquit la capitale samanide de Boukhara en 992 de notre ère. Kashgari mourut à la fin du XIe siècle ou au début du XIIe siècle, ayant laissé son empreinte en tant que figure importante de l'histoire culturelle et littéraire turcique."
 tarim_basin.0201.t:0 "Les langues des Turcs"
 tarim_basin.0201.desc:0 "Cela m'a peiné, pendant de nombreuses années, de voir notre patrimoine [culture_scope.GetHeritage.GetName] raillés par des peuples plus « civilisés » tels que les Iraniens et les Arabes. J'ai entendu nombre d'entre eux affirmer que #italic nos#! langues avaient peu de valeur esthétique ou intellectuelle. Si d'autres peuples peuvent certainement revendiquer un héritage littéraire et poétique à juste titre estimé, les différents Turcs peuvent également revendiquer un tel héritage !\n\nEn tant qu'érudit, je sens qu'il est de mon devoir d'apporter honneur et gloire aux langues des peuples [culture_scope.GetHeritage.GetNameNoTooltip]. Pendant des années, j'ai collecté des notes sur notre façon de parler et il est maintenant temps pour moi de mettre tout ce savoir à profit.\n\nAujourd'hui, je vais commencer à travailler sur un dictionnaire des langues [culture_scope.GetHeritage.GetNameNoTooltip]. J'ai également l'intention d'inclure divers détails sur notre histoire, nos coutumes, nos croyances, notre poésie, et bien plus encore, afin que le monde puisse connaître notre culture vibrante et magnifique. J'espère qu'à l'avenir, grâce à mes efforts, les autres ne considéreront plus les peuples [culture_scope.GetHeritage.GetNameNoTooltip] comme des sauvages grossiers."
 tarim_basin.0201.a:0 "Ce sera une grande entreprise, mais je la mènerai à bien !"
 tarim_basin.0202.t:0 "Le Compendium des langues turques"
 tarim_basin.0202.desc:0 "Enfin ! Des semaines, des mois et des années de labeur et d'efforts ont porté leurs fruits.\n\nJ'ai achevé la rédaction du premier dictionnaire des langues [culture_scope.GetHeritage.GetName], appelé le Compendium des Langues des Turcs, ou le #bold Diwan Lughat al-Turk#! en arabe. Bien qu'il s'agisse principalement d'un ouvrage de lexicographie, il inclut également de nombreux détails sur l'histoire, les coutumes, les croyances, la poésie et bien d'autres aspects des peuples [culture_scope.GetHeritage.GetNameNoTooltip].\n\nLorsque j'ai commencé ce projet, mon objectif était de montrer au monde que les peuples [culture_scope.GetHeritage.GetNameNoTooltip] sont tout aussi civilisés que n'importe quel autre peuple, et que nous avons aussi nos propres traditions littéraires dont être fiers. Un objectif aussi noble ne saurait être accompli avec un seul livre comme celui-ci, mais c'est néanmoins un pas important. Je distribuerai quelques copies à des personnes éminentes dans l'espoir qu'elles comprendront mes intentions, et c'est mon souhait sincère que mon œuvre inspire d'autres érudits et poètes [culture_scope.GetHeritage.GetNameNoTooltip]."
 tarim_basin.0202.a:0 "Et maintenant, je peux me reposer un peu."
 tarim_basin.0202.copy.liege:0 "Votre [liege|El], [liege.GetTitledFirstName], recevra une copie du livre."
 tarim_basin.0202.copy.top_liege:0 "Votre [top_liege|El], [top_liege.GetTitledFirstName], recevra une copie du livre."
 tarim_basin.0202.copy.religious_head:0 "Votre [head_of_faith|El], [religious_head.GetTitledFirstName], recevra une copie du livre."
 tarim_basin.0203.t:0 "Le Compendium des langues turques"
 tarim_basin.0203.desc:0 "Je viens d'apprendre que l'érudit [compiler.GetTitledFirstName] a achevé la rédaction du premier dictionnaire des langues [culture_scope.GetHeritage.GetName], appelé le Compendium des Langues des Turcs, ou le #bold Diwan Lughat al-Turk#! en arabe. Bien qu'il s'agisse principalement d'une œuvre de lexicographie, il comprend également de nombreux détails sur l'histoire, les coutumes, les croyances, la poésie et bien d'autres aspects des peuples [culture_scope.GetHeritage.GetNameNoTooltip].\n\nPendant des années, selon [compiler.GetHerHim], les peuples [culture_scope.GetHeritage.GetNameNoTooltip] ont été jugés injustement comme étant illettrés, inarticulés et frustes comparés à d'autres tels que les Arabes et les Iraniens. [compiler.GetSheHe|U] espère ainsi que ce dictionnaire prouvera une fois pour toutes que les peuples [culture_scope.GetHeritage.GetNameNoTooltip] ont également de quoi être fiers en termes de littérature et de culture. Reste à voir quel impact cette œuvre savante aura sur le reste du monde."
 tarim_basin.0203.desc.copy:0 "\n\nEn tant que personne d'importance pour [compiler.GetTitledFirstName], [compiler.GetSheHe] m'a fourni une copie du livre à conserver dans ma propre bibliothèque. Un cadeau attentionné, je dois dire !"
 tarim_basin.0203.a:0 "[compiler.GetSheHe|U] a dû travailler très dur pour cela."
 tarim_basin.0204.t:0 "xxxxx"
 tarim_basin.0204.desc:0 "xxxxx"
 tarim_basin.0204.a:0 "xxxxx"
 tarim_basin.0205.t:0 "Le Compendium des langues turques"
 tarim_basin.0205.desc:0 "Ce n'est un secret pour personne qu'avant que [compiler.GetSheHe] ne décède, m[compiler.Custom('FR_OnA')] [compiler.Custom2('RelationToMeShort', compiler_heir)], [compiler.GetTitledFirstName], avait passé beaucoup de temps à compiler un dictionnaire des langues [culture_scope.GetHeritage.GetName] appelé le Compendium des Langues des Turcs, ou le #bold Diwan Lughat al-Turk#! en arabe. En réalité, le travail avait commencé bien #italic avant#! qu'[compiler.GetSheHe] ne commence à écrire le livre, en raison de la quantité de notes et d'informations qu'[compiler.GetSheHe] devait acquérir auprès d'autres sources, que ce soit par ses observations directes ou en interrogeant d'autres personnes. C'était clairement son rêve de toute une vie de prouver au monde que les peuples [culture_scope.GetHeritage.GetName] sont tout aussi éloquents et cultivés que n'importe qui d'autre.\n\nHélas, mcompiler.Custom('FR_OnA')] [compiler.Custom2('RelationToMeShort', compiler_heir)] est décédé[compiler.Custom('FR_E')] avant qu'[compiler.GetSheHe] ne puisse achever le livre. Quelques érudits locaux qui ont examiné le manuscrit ont dit que, fort heureusement, une grande partie du livre est déjà terminée. J'ai donc décidé de distribuer quelques copies à des personnes éminentes, et j'espère que le travail que [compiler.GetFirstName] a consacré à ce livre pourra également inspirer d'autres érudits et poètes [culture_scope.GetHeritage.GetNameNoTooltip]."
 tarim_basin.0205.a:0 "Son œuvre ne sera pas vaine."
 tarim_basin.0206.t:0 "Le Compendium des langues turques"
 tarim_basin.0206.desc:0 "Je viens de recevoir la nouvelle que l'érudit [compiler.GetTitledFirstName] est récemment décédé[compiler.Custom('FR_E')] en tentant d'achever la rédaction du premier dictionnaire des langues [culture_scope.GetHeritage.GetName], appelé le Compendium des Langues des Turcs, ou le #bold Diwan Lughat al-Turk#! en arabe. Bien qu'inachevé, une grande partie est terminée selon [compiler.GetTitledFirstName], qui a découvert le manuscrit brouillon. C'est principalement une œuvre de lexicographie, mais elle inclut également de nombreux détails sur l'histoire, les coutumes, les croyances, la poésie, et bien plus des peuples [culture_scope.GetHeritage.GetNameNoTooltip].\n\nPendant des années, selon [compiler.Custom('FR_LuiElle')], les peuples [culture_scope.GetHeritage.GetNameNoTooltip] ont été jugés injustement comme illettrés, inarticulés et peu raffinés comparés à d'autres tels que les Arabes et les Iraniens. [compiler_heir.GetFirstName] espère que bien que [compiler.GetFirstName] soit décédé[compiler.Custom('FR_E')] avant qu'[compiler.GetSheHe] n'ait pu l'achever, ce dictionnaire prouvera une fois pour toutes que les peuples [culture_scope.GetHeritage.GetNameNoTooltip] ont également de quoi être fiers en termes de littérature et de culture. Il reste à voir quel impact cette œuvre savante aura sur le reste du monde."
 tarim_basin.0206.desc.copy:0 "\n\nEn tant que personne d'importance pour [compiler.GetTitledFirstName], [compiler_heir.GetFirstName] m'a fourni une copie du livre à conserver dans ma propre bibliothèque. Un cadeau attentionné, je dois dire !"
 tarim_basin.0206.a:0 "$tarim_basin.0203.a$"
