 tarim_basin.0020.t:0 "Communautés de la Route de la Soie"
 tarim_basin.0020.desc.intro:0 "Les terres et les mers de ce que l'on appelle la Route de la Soie ont été un creuset vibrant de différents peuples depuis des générations, peut-être même avant l'essor des grands empires des Han, de Rome ou de la Perse. Grâce à ces vastes réseaux, il existe des communautés florissantes aux origines venues de toute l'Eurasie, même dans mon royaume. Coopérer avec elles pourrait m'être utile si je veux réaliser mes ambitions."
 tarim_basin.0020.desc.east_asian:0 "\n\nEn particulier, j'ai décidé de renforcer les relations avec les communautés est-asiatiques de mon royaume. Beaucoup de ces gens viennent de terres lointaines, notamment l'Empire du Milieu, dont beaucoup affirment qu'il est une terre de justice et de savoir, sans égal parmi les royaumes du monde."
 tarim_basin.0020.desc.steppe:0 "\n\nEn particulier, j'ai décidé de renforcer les relations avec les communautés steppiques de mon royaume. Ces nomades du nord sont craints par certains et admirés par d'autres. Avec leurs arcs puissants qui ne manquent jamais leur cible et leurs chevaux qui tonnent à travers la steppe, rares sont ceux qui doutent de leurs capacités à la guerre."
 tarim_basin.0020.desc.middle_eastern:0 "\n\nEn particulier, j'ai décidé de renforcer les relations avec les communautés moyen-orientales de mon royaume. Les réseaux marchands d'origine iranienne, arabe et juive se trouvent tout au long de la Route de la Soie, partout où le commerce peut circuler ; quiconque cherche à encourager le commerce et le développement recherchera leur aide."
 tarim_basin.0020.desc.himalayan:0 "\n\nEn particulier, j'ai décidé de renforcer les relations avec les communautés himalayennes de mon royaume. Elles viennent du toit du monde, apparemment austère et glacé, mais même la civilisation, la richesse et la culture peuvent se trouver dans des montagnes reculées. Leur capacité à survivre, endurer et prospérer sont des qualités que quiconque peut apprécier."
 tarim_basin.0020.desc.indian:0 "\n\nEn particulier, j'ai décidé de renforcer les relations avec les communautés indiennes de mon royaume. Le sous-continent indien est renommé pour les nombreuses bonnes choses qui en proviennent, des croyances inspirantes suivies par beaucoup, aux styles artistiques complexes et habiles, en passant par de riches réseaux de marchands, et bien plus encore."
 tarim_basin.0020.desc.east_african:0 "\n\nEn particulier, j'ai décidé de renforcer les relations avec les communautés est-africaines de mon royaume. Les Est-Africains le long des routes commerciales qui sillonnent l'Eurasie et l'Afrique ont des origines variées, incluant des marchands, des aventuriers, des esclaves, et bien d'autres. N'importe lequel de ces types de personnes pourrait s'avérer utile à mes objectifs."
 tarim_basin.0020.desc.southeast_asian:0 "\n\nEn particulier, j'ai décidé de renforcer les relations avec les communautés d'Asie du Sud-Est dans mon royaume. Les terres et les mers d'Asie du Sud-Est abritent un certain nombre de royaumes et de cités bien intégrés dans la Route de la Soie maritime. Nous impliquer dans ces réseaux pourrait s'avérer lucratif."
 tarim_basin.0020.option.east_asian:0 "Leurs connaissances et leurs connexions avec l'est s'avéreront avantageuses."
 tarim_basin.0020.tooltip.east_asian:0 "Tant que vous possédez le [character_modifier|El] [GetModifier('RICE_tarim_basin_east_asian_contacts').GetNameWithTooltip], vous recevrez périodiquement divers cadeaux de la [silk_road_community_short|El] locale d'Asie de l'Est. Les cadeaux de [prestige|El] et de [dynasty_prestige|El] seront probablement meilleurs et plus fréquents par rapport aux autres [silk_road_communities|El]."
 tarim_basin.0020.option.steppe:0 "M'associer aux guerriers des steppes signifie que les autres me respecteront aussi !"
 tarim_basin.0020.tooltip.steppe:0 "Tant que vous possédez le [character_modifier|El] [GetModifier('RICE_tarim_basin_steppe_contacts').GetNameWithTooltip], vous recevrez périodiquement divers cadeaux de la [silk_road_community_short|El] locale des steppes. Les cadeaux de [special_troops|El] et de [character_modifiers|El] qui améliorent la [scheme_success_chance|El] et l'[advantage|El] dans les [battles|El] seront probablement meilleurs et surviendront plus souvent par rapport aux autres [silk_road_communities|El]."
 tarim_basin.0020.option.middle_eastern:0 "Si nous faisons de bonnes affaires avec eux, nous pourrons assurément tous prospérer et croître."
 tarim_basin.0020.tooltip.middle_eastern:0 "Tant que vous possédez le [character_modifier|El] [GetModifier('RICE_tarim_basin_middle_eastern_contacts').GetNameWithTooltip], vous recevrez périodiquement divers cadeaux de la [silk_road_community_short|El] moyen-orientale locale. Les cadeaux de [character_modifiers|El] qui améliorent les [income|El] d'[gold|El], ou les [county_modifiers|El] de coûts de [building|El] et de [control|El] dans votre [realm_capital|El], seront probablement meilleurs et plus fréquents par rapport aux autres [silk_road_communities|El]."
 tarim_basin.0020.option.himalayan:0 "Il est bon d'être en bons termes avec ces gens volontaires."
 tarim_basin.0020.tooltip.himalayan:0 "Tant que vous possédez le [character_modifier|El] [GetModifier('RICE_tarim_basin_himalayan_contacts').GetNameWithTooltip], vous recevrez périodiquement divers cadeaux de la [silk_road_community_short|El] himalayenne locale. Les cadeaux de [character_modifiers|El] qui améliorent la [scheme_resistance|El] et la [prowess|El], ou la [health|El], la [fertility|El], et la gestion du [stress|El], seront probablement meilleurs et plus fréquents par rapport aux autres [silk_road_communities|El].."
 tarim_basin.0020.option.indian:0 "Ces gens contribuent grandement à notre royaume, après tout."
 tarim_basin.0020.tooltip.indian:0 "Tant que vous possédez le [character_modifier|El] [GetModifier('RICE_tarim_basin_indian_contacts').GetNameWithTooltip], vous recevrez périodiquement divers cadeaux de la [silk_road_community_short|El] indienne locale. Les cadeaux de [piety|El], ou de [character_modifiers|El] qui améliorent l'[lifestyle_experience|El], seront probablement meilleurs et auront plus de chances d'apparaître par rapport aux autres [silk_road_communities|El]."
 tarim_basin.0020.option.east_african:0 "Ce sont des gens divers et habiles."
 tarim_basin.0020.tooltip.east_african:0 "Tant que vous possédez le [character_modifier|El] [GetModifier('RICE_tarim_basin_east_african_contacts').GetNameWithTooltip], vous recevrez périodiquement divers cadeaux de la [silk_road_community_short|El] est-africaine locale. Les cadeaux de [special_troops|El] et de [character_modifiers|El] qui améliorent la [scheme_resistance|El] et la [prowess|El], seront probablement meilleurs et plus fréquents par rapport aux autres [silk_road_communities|El]."
 tarim_basin.0020.option.southeast_asian:0 "Leur habileté en tant que marins et commerçants est admirable."
 tarim_basin.0020.tooltip.southeast_asian:0 "Tant que vous possédez le [character_modifier|El] [GetModifier('RICE_tarim_basin_southeast_asian_contacts').GetNameWithTooltip], vous recevrez périodiquement divers cadeaux de la [silk_road_community_short|El] locale d'Asie du Sud-Est. Les cadeaux de [character_modifiers|El] qui améliorent la [travel_speed|El] et réduisent le [travel_danger|El] en [terrain|El] maritime, ou la [health|El], la [fertility|El], et la gestion du [stress|El], seront probablement meilleurs et auront plus de chances de se produire par rapport aux autres [silk_road_communities|El]."
 RICE.silk_road_gift_quality.tooltip.east_asian:0 "Parce que vous renforcez actuellement vos relations avec la [silk_road_community_short|El] est-asiatique locale, la qualité de ce cadeau est probablement meilleure que si vous l'aviez obtenu d'autres [silk_road_communities|El]."
 RICE.silk_road_gift_quality.tooltip.steppe:0 "Parce que vous renforcez actuellement vos relations avec la [silk_road_community_short|El] steppique locale, la qualité de ce cadeau est probablement meilleure que si vous l'aviez obtenu d'autres [silk_road_communities|El]."
 RICE.silk_road_gift_quality.tooltip.middle_eastern:0 "Parce que vous renforcez actuellement vos relations avec la [silk_road_community_short|El] moyen-orientale locale, la qualité de ce cadeau est probablement meilleure que si vous l'aviez obtenu d'autres [silk_road_communities|El]."
 RICE.silk_road_gift_quality.tooltip.himalayan:0 "Parce que vous renforcez actuellement vos relations avec la [silk_road_community_short|El] himalayenne locale, la qualité de ce cadeau est probablement meilleure que si vous l'aviez obtenu d'autres [silk_road_communities|El]."
 RICE.silk_road_gift_quality.tooltip.indian:0 "Parce que vous renforcez actuellement vos relations avec la [silk_road_community_short|El] indienne locale, la qualité de ce cadeau est probablement meilleure que si vous l'aviez obtenu d'autres [silk_road_communities|El]."
 RICE.silk_road_gift_quality.tooltip.east_african:0 "Parce que vous renforcez actuellement vos relations avec la [silk_road_community_short|El] locale d'Afrique de l'Est, la qualité de ce cadeau est probablement meilleure que si vous l'aviez obtenu d'autres [silk_road_communities|El]."
 RICE.silk_road_gift_quality.tooltip.southeast_asian:0 "Parce que vous renforcez actuellement vos relations avec la [silk_road_community_short|El] locale d'Asie du Sud-Est, la qualité de ce cadeau est probablement meilleure que si vous l'aviez obtenu d'autres [silk_road_communities|El]."
 tarim_basin.0021.t:0 "Un don de biens précieux"
 tarim_basin.0021.desc.east_asian:0 "À la lumière de mes récents efforts pour nouer des liens et de meilleures relations avec la communauté locale d'Asie orientale, plusieurs familles d'élite d'origine orientale m'ont offert de l'or et d'autres objets de valeur, dont beaucoup ont été fabriqués dans le style traditionnel de leurs peuples."
 tarim_basin.0021.desc.steppe:0 "À la lumière de mes récents efforts pour établir des liens et de meilleures relations avec la communauté locale des steppes, plusieurs familles d'élite originaires des steppes m'ont offert de l'or et d'autres objets de valeur, dont beaucoup ont été fabriqués dans le style traditionnel de leurs peuples."
 tarim_basin.0021.desc.middle_eastern:0 "À la lumière de mes récents efforts pour nouer des liens et de meilleures relations avec la communauté locale du Moyen-Orient, plusieurs familles d'élite d'origine iranienne, arabe et juive m'ont offert de l'or et d'autres objets de valeur, dont beaucoup ont été fabriqués dans le style traditionnel de leurs peuples."
 tarim_basin.0021.desc.himalayan:0 "À la lumière de mes récents efforts pour établir des liens et de meilleures relations avec la communauté himalayenne locale, plusieurs familles d'élite d'origine himalayenne m'ont offert de l'or et d'autres objets de valeur, dont beaucoup ont été fabriqués dans le style traditionnel de leur peuple."
 tarim_basin.0021.desc.indian:0 "Compte tenu de mes récents efforts pour nouer des liens et de meilleures relations avec la communauté indienne locale, plusieurs familles d'élite d'origine indienne m'ont offert de l'or et d'autres objets de valeur, dont beaucoup ont été fabriqués dans le style traditionnel de leur peuple."
 tarim_basin.0021.desc.east_african:0 "À la lumière de mes récents efforts pour tisser des liens et améliorer les relations avec la communauté est-africaine locale, diverses familles d'élite d'origine est-africaine m'ont offert de l'or et d'autres objets de valeur, dont beaucoup sont façonnés dans les styles traditionnels de leur peuple."
 tarim_basin.0021.desc.southeast_asian:0 "À la lumière de mes récents efforts pour tisser des liens et améliorer les relations avec la communauté locale d'Asie du Sud-Est, diverses familles d'élite d'origine sud-est asiatique m'ont offert de l'or et d'autres objets de valeur, dont beaucoup sont fabriqués dans les styles traditionnels de leurs peuples."
 tarim_basin.0021.a:0 "Ces cadeaux sont très appréciés."
 tarim_basin.0022.t:0 "Affaires prometteuses"
 tarim_basin.0022.desc.east_asian:0 "Le travail que j'ai effectué pour établir des relations avec la communauté locale d'Asie de l'Est a porté ses fruits. Ils ont récemment accepté de s'associer à moi dans le cadre d'un certain nombre d'opérations commerciales avantageuses. Grâce à leurs réseaux sur la Route de la soie, nous allons sûrement réaliser ensemble de gros bénéfices !"
 tarim_basin.0022.desc.steppe:0 "Le travail que j'ai effectué pour établir des relations avec la communauté locale de la steppe a porté ses fruits. Ils ont récemment accepté de s'associer avec moi dans un certain nombre d'affaires avantageuses. Grâce à leurs réseaux sur la Route de la soie, nous allons sûrement faire de gros bénéfices ensemble !"
 tarim_basin.0022.desc.middle_eastern:0 "Le travail que j'ai effectué pour établir des relations avec la communauté locale du Moyen-Orient a porté ses fruits. Ils ont récemment accepté de s'associer à moi dans le cadre d'un certain nombre d'opérations commerciales avantageuses. Grâce à leurs réseaux sur la Route de la soie, nous allons sûrement réaliser ensemble de gros bénéfices !"
 tarim_basin.0022.desc.himalayan:0 "Le travail que j'ai accompli pour établir des relations avec la communauté himalayenne locale a porté ses fruits. Ils ont récemment accepté de s'associer avec moi dans plusieurs affaires commerciales avantageuses. Grâce à leurs réseaux sur la Route de la Soie, nous gagnerons assurément ensemble un grand profit !"
 tarim_basin.0022.desc.indian:0 "Le travail que j'ai effectué pour établir des relations avec la communauté indienne locale a porté ses fruits. Ils ont récemment accepté de s'associer à moi dans le cadre d'un certain nombre d'opérations commerciales avantageuses. Grâce à leurs réseaux sur la Route de la soie, nous allons sûrement faire de gros bénéfices ensemble !"
 tarim_basin.0022.desc.east_african:0 "Le travail que j'ai accompli pour établir des relations avec la communauté locale est-africaine a porté ses fruits. Ils ont récemment accepté de s'associer avec moi dans un certain nombre d'accords commerciaux avantageux. Grâce à leurs réseaux sur la Route de la Soie maritime, nous réaliserons assurément ensemble un grand profit !"
 tarim_basin.0022.desc.southeast_asian:0 "Le travail que j'ai accompli pour établir des relations avec la communauté locale d'Asie du Sud-Est a porté ses fruits. Ils ont récemment accepté de s'associer avec moi dans un certain nombre d'affaires commerciales avantageuses. Grâce à leurs réseaux sur la Route de la Soie maritime, nous réaliserons assurément ensemble un grand profit !"
 tarim_basin.0022.a:0 "La soie doit couler. Et les épices. Les esclaves aussi. Les chevaux. Toutes les marchandises, en fait."
 tarim_basin.0023.t:0 "Festoyer le long de la Route de la soie"
 tarim_basin.0023.desc.east_asian:0 "Les élites locales est-asiatiques ont été très reconnaissantes de mes efforts pour favoriser des relations plus étroites avec elles.\n\nPour célébrer un certain nombre de succès récents, quelques-uns de leurs clans les plus éminents se sont réunis et ont organisé un magnifique festin en mon nom. Ce fut un grand festin, et nous avons tous savouré leurs délicatesses traditionnelles renommées à travers la Route de la Soie, telles que l'agneau et le porc bouillis, des mélanges de noix et des pommes sauvages."
 tarim_basin.0023.desc.steppe:0 "Les élites locales des steppes ont beaucoup apprécié les efforts que j'ai déployés pour établir des relations plus étroites avec elles.\n\nPour célébrer un certain nombre de succès récents, quelques-uns de leurs clans les plus importants se sont réunis et ont organisé un magnifique festin en mon nom. Ce fut un grand festin, et nous nous sommes tous régalés de leurs mets traditionnels réputés sur la Route de la soie, tels que le mouton cuit, la saucisse de cheval salée et le lait de jument fermenté."
 tarim_basin.0023.desc.middle_eastern:0 "Les élites locales du Moyen-Orient ont beaucoup apprécié les efforts que j'ai déployés pour favoriser des relations plus étroites avec elles.\n\nPour célébrer un certain nombre de succès récents, quelques-uns de leurs clans les plus importants se sont réunis et ont organisé un magnifique festin en mon nom. Ce fut une grande fête, et nous nous sommes tous régalés de leurs délices traditionnels réputés sur la Route de la soie, tels que le vin de Ferghana, les pêches de Samarcande et divers plats comme le sangak."
 tarim_basin.0023.desc.himalayan:0 "Les élites locales de l'Himalaya ont beaucoup apprécié les efforts que j'ai déployés pour favoriser des relations plus étroites avec elles.\n\nPour célébrer un certain nombre de succès récents, quelques-uns de leurs clans les plus importants se sont réunis et ont organisé un magnifique festin en mon nom. Ce fut une grande fête, et nous nous sommes tous régalés de leurs délices traditionnels réputés sur la Route de la soie, tels que les boulettes momo farcies de légumes et de viande, la bouillie tsampa et le thé au beurre."
 tarim_basin.0023.desc.indian:0 "Les élites indiennes locales ont été très reconnaissantes de mes efforts pour favoriser des relations plus étroites avec elles.\n\nPour célébrer un certain nombre de succès récents, quelques-uns de leurs clans les plus éminents se sont réunis et ont organisé un magnifique festin en mon nom. Ce fut un grand festin, et nous nous sommes tous régalés de leurs délicatesses traditionnelles renommées à travers la Route de la Soie, telles que le pain plat paratha farci de légumes, les beignets aux cinq lentilles et les fruits mélangés au babeurre."
 tarim_basin.0023.desc.east_african:0 "Les élites locales d'Afrique de l'Est ont été très reconnaissantes de mes efforts pour favoriser des relations plus étroites avec elles.\n\nPour célébrer un certain nombre de succès récents, quelques-uns de leurs clans les plus éminents se sont réunis et ont organisé un magnifique festin en mon nom. Ce fut un grand festin, et nous nous sommes tous régalés de leurs mets traditionnels réputés le long de la Route de la Soie maritime, tels que de copieux ragoûts de viandes et de légumes et des riz parfumés agrémentés de nombreuses épices venues de tous les océans."
 tarim_basin.0023.desc.southeast_asian:0 "Les élites locales d'Asie du Sud-Est ont été très reconnaissantes de mes efforts pour favoriser des relations plus étroites avec elles.\n\nPour célébrer un certain nombre de succès récents, quelques-uns de leurs clans les plus éminents se sont réunis et ont organisé un magnifique festin en mon nom. Ce fut un grand festin, et nous avons tous savouré leurs délices traditionnels réputés à travers la Route de la Soie maritime, tels que des currys sucrés et salés mélangés à des ingrédients comme la noix de coco, et de nombreuses sortes de fruits de mer."
 tarim_basin.0023.a:0 "Une occasion merveilleuse et joyeuse !"
 tarim_basin.0024.t:0 "Gloire et renommée sur la Route de la soie"
 tarim_basin.0024.desc.east_asian:0 "Grâce à mes relations avec les élites d'Asie de l'Est de mon royaume, j'ai réussi à établir de bonnes relations au sein de leur communauté. Même les gens du peuple qui partagent la même origine ethnique que ces élites, ayant émigré ici depuis un autre endroit le long de la Route de la soie, ont une meilleure opinion de moi qu'auparavant. Je ne doute pas que les personnes qui vivent dans leurs pays d'origine en Extrême-Orient ont également entendu de bonnes choses sur moi et sur le règne de ma famille sur ces terres.\n\nÀ long terme, cela me sera certainement bénéfique sur le plan politique et financier, et ma dynastie en retirera beaucoup d'honneur et de reconnaissance."
 tarim_basin.0024.desc.steppe:0 "Grâce à mes relations avec les élites steppiques de mon royaume, j'ai réussi à établir de bons rapports au sein de leur communauté. Même les gens du commun qui partagent une origine ethnique similaire à ces élites, ayant migré ici depuis d'autres régions le long de la Route de la Soie, ont une meilleure opinion de moi qu'auparavant. Je ne doute pas que les gens vivant dans leurs terres d'origine dans les régions steppiques ont également entendu de bonnes choses sur moi et le règne de ma famille sur ces terres.\n\nÀ long terme, cela me sera assurément bénéfique sur les plans politique et financier, et apportera beaucoup d'honneur et de gloire à ma dynastie."
 tarim_basin.0024.desc.middle_eastern:0 "Grâce à mes relations avec les élites moyen-orientales de mon royaume, j'ai réussi à établir de bons rapports au sein de leur communauté. Même les roturiers qui partagent une origine ethnique similaire à celle de ces élites, ayant migré ici depuis d'autres points de la Route de la Soie, ont une meilleure opinion de moi qu'auparavant. Je ne doute pas que les gens qui vivent dans leurs terres d'origine au Moyen-Orient ont également entendu de bonnes choses sur moi et le règne de ma famille sur ces terres.\n\nÀ long terme, cela me sera assurément bénéfique sur les plans politique et financier, et apportera beaucoup d'honneur et de prestige à ma dynastie."
 tarim_basin.0024.desc.himalayan:0 "Grâce à mes relations avec les élites himalayennes de mon royaume, j'ai réussi à établir de bons rapports au sein de leur communauté. Même les roturiers partageant une origine ethnique similaire à ces élites, ayant migré ici depuis d'autres points de la Route de la Soie, ont une meilleure opinion de moi qu'auparavant. Je ne doute pas que les gens vivant dans leurs terres d'origine sur le plateau himalayen ont également entendu de bonnes choses sur moi et le règne de ma famille sur ces terres.\n\nÀ long terme, cela me bénéficiera assurément sur les plans politique et financier, et apportera beaucoup d'honneur et de gloire à ma dynastie."
 tarim_basin.0024.desc.indian:0 "Grâce à mes relations avec les élites indiennes de mon royaume, j'ai réussi à établir de bonnes relations au sein de leur communauté. Même les gens du peuple qui partagent la même origine ethnique que ces élites, ayant émigré d'ailleurs le long de la Route de la soie, ont une meilleure opinion de moi qu'auparavant. Je ne doute pas que les personnes qui vivent dans leurs pays d'origine en Asie du Sud ont également entendu de bonnes choses à mon sujet et au sujet du règne de ma famille sur ces terres.\n\nÀ long terme, cela me sera certainement bénéfique sur le plan politique et financier, et ma dynastie en retirera beaucoup d'honneur et de reconnaissance."
 tarim_basin.0024.desc.east_african:0 "Grâce à mes relations avec les élites est-africaines de mon royaume, j'ai réussi à établir de bonnes relations au sein de leur communauté. Même les roturiers qui partagent la même origine ethnique que ces élites, ayant migré ici depuis un autre endroit le long de la Route de la soie maritime, ont une meilleure opinion de moi qu'auparavant. Je ne doute pas que les personnes qui vivent dans leurs pays d'origine en Afrique de l'Est ont également entendu de bonnes choses sur moi et sur le règne de ma famille sur ces terres.\n\nÀ long terme, cela me sera certainement bénéfique sur le plan politique et financier, et ma dynastie en retirera beaucoup d'honneur et de reconnaissance."
 tarim_basin.0024.desc.southeast_asian:0 "Grâce à mes relations avec les élites d'Asie du Sud-Est dans mon domaine, j'ai réussi à établir de bons rapports au sein de leur communauté. Même les roturiers qui partagent une origine ethnique similaire à ces élites, ayant migré ici depuis ailleurs le long de la Route de la Soie maritime, ont une meilleure opinion de moi qu'auparavant. Je ne doute pas que les gens qui vivent dans leurs terres natales en Asie du Sud-Est aient également entendu de bonnes choses sur moi et le règne de ma famille sur ces terres.\n\nÀ long terme, cela me bénéficiera assurément sur les plans politique et financier, et apportera beaucoup d'honneur et de prestige à ma dynastie."
 tarim_basin.0024.a:0 "Espérons que cette période de bonne volonté durera un certain temps !"
 tarim_basin.0025.t:0 "Offrandes sacrées"
 tarim_basin.0025.desc.east_asian:0 "Les dirigeants de la communauté locale est-asiatique m'ont offert un cadeau des plus spectaculaires composé d'objets religieux [ROOT.Char.GetFaith.GetReligion.GetAdherentNamePlural], tels que des statues incrustées de pierres précieuses, des peintures colorées et d'autres objets similaires.\n\nBien que tous les membres de leur communauté ne partagent pas nécessairement les mêmes croyances, des gens de nombreuses confessions ont vécu les uns avec les autres le long de la Route de la Soie pendant des siècles - parfois pacifiquement, parfois en guerre les uns contre les autres - il n'est donc pas surprenant que ces notables sachent exactement quel type d'objets religieux m'offrir."
 tarim_basin.0025.desc.steppe:0 "Les chefs de la communauté steppique locale m'ont offert un cadeau des plus spectaculaires composé d'objets religieux [ROOT.Char.GetFaith.GetReligion.GetAdherentNamePlural], tels que des statues incrustées de pierres précieuses, des peintures colorées et d'autres objets similaires.\n\nBien que tous les membres de leur communauté ne partagent pas nécessairement les mêmes croyances, des gens de nombreuses confessions ont vécu les uns avec les autres le long de la Route de la Soie pendant des siècles - parfois en paix, parfois en guerre les uns contre les autres - il n'est donc pas surprenant que ces notables sachent exactement quel type d'artefacts religieux m'offrir."
 tarim_basin.0025.desc.middle_eastern:0 "Les dirigeants de la communauté moyen-orientale locale m'ont offert un cadeau des plus spectaculaires composé d'objets religieux [ROOT.Char.GetFaith.GetReligion.GetAdherentNamePlural], tels que des statues incrustées de pierres précieuses, des peintures colorées et d'autres objets similaires.\n\nBien que tous les membres de leur communauté ne partagent pas nécessairement les mêmes croyances, des gens de nombreuses confessions ont vécu les uns avec les autres le long de la Route de la Soie pendant des siècles - parfois pacifiquement, parfois en guerre les uns contre les autres - il n'est donc pas surprenant que ces notables sachent exactement quel type d'artefacts religieux me présenter."
 tarim_basin.0025.desc.himalayan:0 "Les dirigeants de la communauté himalayenne locale m'ont offert un cadeau des plus spectaculaires composé d'objets religieux [ROOT.Char.GetFaith.GetReligion.GetAdherentNamePlural], tels que des statues incrustées de pierres précieuses, des peintures colorées et d'autres objets similaires.\n\nBien que tous les membres de leur communauté ne partagent pas nécessairement les mêmes croyances, des gens de nombreuses confessions ont vécu les uns avec les autres le long de la Route de la Soie pendant des siècles - parfois pacifiquement, parfois en guerroyant les uns contre les autres - il n'est donc pas surprenant que ces notables sachent exactement quel type d'artefacts religieux me présenter."
 tarim_basin.0025.desc.indian:0 "Les dirigeants de la communauté indienne locale m'ont offert un cadeau des plus spectaculaires composé d'objets religieux [ROOT.Char.GetFaith.GetReligion.GetAdherentNamePlural], tels que des statues incrustées de pierres précieuses, des peintures colorées et d'autres objets similaires.\n\nBien que tous les membres de leur communauté ne partagent pas nécessairement les mêmes croyances, des gens de nombreuses confessions ont vécu les uns avec les autres le long de la Route de la Soie pendant des siècles - parfois en paix, parfois en guerre les uns contre les autres - il n'est donc pas surprenant que ces notables sachent exactement quel type d'artefacts religieux me présenter."
 tarim_basin.0025.desc.east_african:0 "Les dirigeants de la communauté est-africaine locale m'ont offert un cadeau des plus spectaculaires composé d'objets religieux [ROOT.Char.GetFaith.GetReligion.GetAdherentNamePlural], tels que des statues incrustées de pierres précieuses, des peintures colorées et d'autres objets similaires.\n\nBien que tous les membres de leur communauté ne partagent pas nécessairement les mêmes croyances, des gens de nombreuses confessions ont vécu les uns avec les autres le long de la Route de la Soie maritime pendant des siècles - parfois pacifiquement, parfois en guerre les uns contre les autres - il n'est donc pas surprenant que ces notables sachent exactement quel type d'artefacts religieux me présenter."
 tarim_basin.0025.desc.southeast_asian:0 "Les dirigeants de la communauté locale d'Asie du Sud-Est m'ont offert un cadeau des plus spectaculaires composé d'objets religieux [ROOT.Char.GetFaith.GetReligion.GetAdherentNamePlural], tels que des statues incrustées de pierres précieuses, des peintures colorées et d'autres objets similaires.\n\nBien que tous les membres de leur communauté ne partagent pas nécessairement les mêmes croyances, des gens de nombreuses confessions ont vécu les uns avec les autres le long de la Route de la Soie maritime pendant des siècles - parfois pacifiquement, parfois en guerre les uns contre les autres - il n'est donc pas surprenant que ces notables sachent exactement quel type d'artefacts religieux m'offrir."
 tarim_basin.0025.a:0 "Un cadeau très apprécié."
 tarim_basin.0026.t:0 "Décor littéraire"
 tarim_basin.0026.desc.east_asian:0 "Des membres éminents de la communauté locale d'Asie de l'Est m'ont offert aujourd'hui un cadeau des plus précieux : un manuscrit simple mais élégant, rempli de littérature écrite dans l'une de leurs langues. Ils pensent qu'un tel ouvrage de valeur littéraire et esthétique témoignera de leur appréciation des efforts que j'ai déployés récemment pour renforcer les relations avec eux."
 tarim_basin.0026.desc.steppe:0 "Des membres éminents de la communauté locale des steppes m'ont offert aujourd'hui un cadeau des plus précieux : un manuscrit simple mais élégant, rempli de littérature écrite dans l'une de leurs langues. Ils pensent qu'un tel ouvrage de valeur littéraire et esthétique témoignera de leur appréciation des efforts que j'ai déployés récemment pour renforcer les relations avec eux."
 tarim_basin.0026.desc.middle_eastern:0 "Des membres éminents de la communauté locale du Moyen-Orient m'ont offert aujourd'hui un cadeau des plus précieux : un manuscrit simple mais élégant, rempli de littérature écrite dans l'une de leurs langues. Ils pensent qu'un tel ouvrage de valeur littéraire et esthétique témoignera de leur appréciation des efforts que j'ai déployés récemment pour renforcer les relations avec eux."
 tarim_basin.0026.desc.himalayan:0 "Des membres éminents de la communauté himalayenne locale m'ont offert aujourd'hui un cadeau des plus précieux : un manuscrit simple mais élégant, rempli de littérature écrite dans l'une de leurs langues. Ils pensent qu'un tel ouvrage de valeur littéraire et esthétique témoignera de leur appréciation des efforts que j'ai déployés récemment pour renforcer les relations avec eux."
 tarim_basin.0026.desc.indian:0 "Des membres éminents de la communauté indienne locale m'ont présenté aujourd'hui un cadeau des plus précieux : un manuscrit simple mais élégant, rempli de littérature rédigée dans l'une de leurs langues. Ils estiment qu'une telle œuvre, d'une valeur littéraire et esthétique certaine, témoignera de leur reconnaissance pour mes récents efforts visant à renforcer les relations avec eux."
 tarim_basin.0026.desc.east_african:0 "Des membres éminents de la communauté est-africaine locale m'ont présenté aujourd'hui un cadeau des plus précieux : un manuscrit simple mais élégant, rempli de littérature rédigée dans l'une de leurs langues. Ils pensent qu'une telle œuvre de valeur littéraire et esthétique démontrera leur reconnaissance pour mes récents efforts visant à renforcer les relations avec eux."
 tarim_basin.0026.desc.southeast_asian:0 "Des membres éminents de la communauté locale d'Asie du Sud-Est m'ont présenté aujourd'hui un cadeau des plus précieux : un manuscrit simple mais élégant, rempli de littérature rédigée dans l'une de leurs langues. Ils estiment qu'une telle œuvre, d'une valeur littéraire et esthétique remarquable, démontrera leur reconnaissance pour mes récents efforts visant à renforcer les relations avec eux."
 tarim_basin.0026.a:0 "Ils n'ont pas tort ! Le cadeau est très apprécié."
 tarim_basin.0027.t:0 "Soldats loyaux d'origine étrangère"
 tarim_basin.0027.desc.east_asian:0 "Nos relations avec la communauté locale d'Asie de l'Est sont suffisamment bonnes pour qu'un certain nombre de leurs hommes me soient fidèles et proposent leurs services en tant que guerriers et gardes du corps. Nombre d'entre eux sont d'anciens mercenaires ou aventuriers qui ont parcouru la Route de la soie à la recherche de la gloire et de la fortune ; ils sont donc expérimentés et habiles au combat."
 tarim_basin.0027.desc.steppe:0 "Nos relations avec la communauté locale des steppes sont suffisamment bonnes pour qu'un certain nombre de leurs hommes me soient fidèles et proposent leurs services en tant que guerriers et gardes du corps. Nombre d'entre eux sont d'anciens mercenaires ou aventuriers qui ont parcouru la Route de la soie à la recherche de la gloire et de la fortune ; ils sont donc expérimentés et habiles au combat."
 tarim_basin.0027.desc.middle_eastern:0 "Nos relations avec la communauté locale du Moyen-Orient sont suffisamment bonnes pour qu'un certain nombre de leurs hommes me soient fidèles et proposent leurs services en tant que guerriers et gardes du corps. Nombre d'entre eux sont d'anciens mercenaires ou aventuriers qui ont parcouru la Route de la soie à la recherche de la gloire et de la fortune ; ils sont donc expérimentés et habiles au combat."
 tarim_basin.0027.desc.himalayan:0 "Nos relations avec la communauté himalayenne locale sont suffisamment bonnes pour qu'un certain nombre de leurs hommes me soient fidèles, offrant leurs services comme guerriers et gardes du corps. Nombre d'entre eux sont d'anciens mercenaires ou aventuriers qui ont parcouru la Route de la soie à la recherche de la gloire et de la fortune ; ils sont donc expérimentés et habiles au combat."
 tarim_basin.0027.desc.indian:0 "Nos relations avec la communauté indienne locale sont suffisamment bonnes pour qu'un certain nombre de leurs hommes me soient fidèles et proposent leurs services en tant que guerriers et gardes du corps. Nombre d'entre eux sont d'anciens mercenaires ou aventuriers qui ont parcouru la Route de la soie à la recherche de la gloire et de la fortune ; ils sont donc expérimentés et habiles au combat."
 tarim_basin.0027.desc.east_african:0 "Nos relations avec la communauté locale est-africaine se sont développées au point où j'ai pu acquérir un certain nombre de soldats esclaves originaires de ces régions. Ils sont supposément loyaux envers moi, et moi seul, et ont été amenés le long de la Route de la Soie maritime depuis des terres lointaines, mais sont expérimentés et compétents au combat."
 tarim_basin.0027.desc.southeast_asian:0 "Nos relations avec la communauté locale d'Asie du Sud-Est sont suffisamment bonnes pour qu'un certain nombre de leurs hommes m'aient juré fidélité, offrant leurs services en tant que guerriers et gardes du corps. Beaucoup sont d'anciens mercenaires ou aventuriers, qui ont voyagé le long de la Route de la Soie maritime en quête de gloire et de fortune, et sont donc expérimentés et habiles au combat."
 tarim_basin.0027.a:0 "Je leur suis très reconnaissant de leur soutien."
 tarim_basin.0028.t:0 "Un soutien précieux de la part de la communauté locale"
 tarim_basin.0028.desc.east_asian:0 "Les membres de la communauté locale d'Asie de l'Est sont très conscients des menaces extérieures mutuelles qui pèsent sur la poursuite de notre prospérité, et ils m'ont fourni des fournitures militaires et des renseignements en conséquence. Les fournitures et les informations proviennent de leurs divers contacts sur la Route de la soie, qui s'étend jusqu'aux terres de l'Extrême-Orient, comme l'Empire du Milieu.\n\nMes efforts pour renforcer les relations avec eux n'ont pas été vains, semble-t-il ! Si nous voulons rester ensemble, prospères, en tant que partenaires le long de la Route de la soie, nous devons nous faire confiance et travailler les uns avec les autres de cette manière."
 tarim_basin.0028.desc.steppe:0 "Les membres de la communauté steppique locale sont bien conscients des menaces extérieures mutuelles pesant sur notre prospérité continue, et ils m'ont fourni des approvisionnements militaires ainsi que des renseignements en conséquence. Tant les approvisionnements que les informations proviennent de leurs divers contacts le long de la Route de la Soie, s'étendant jusqu'aux confins les plus reculés des steppes d'Asie centrale et de la Sibérie.\n\nMes efforts pour renforcer les relations avec eux n'ont pas été vains, semble-t-il ! Si nous voulons rester unis, prospères, en tant que partenaires le long de la Route de la Soie, nous devons nous faire confiance et travailler ensemble de cette manière."
 tarim_basin.0028.desc.middle_eastern:0 "Les membres de la communauté moyen-orientale locale sont bien conscients des menaces extérieures mutuelles qui pèsent sur notre prospérité continue, et ils m'ont fourni des approvisionnements militaires et des renseignements en conséquence. Les approvisionnements comme les informations proviennent de leurs divers contacts le long de la Route de la Soie, qui s'étendent jusqu'aux rivages de la mer Rouge et de la mer Noire.\n\nMes efforts pour renforcer les relations avec eux n'ont pas été vains, semble-t-il ! Si nous voulons rester unis, prospères, en tant que partenaires le long de la Route de la Soie, nous devons nous faire confiance et travailler ensemble de cette manière."
 tarim_basin.0028.desc.himalayan:0 "Les membres de la communauté himalayenne locale sont bien conscients des menaces extérieures mutuelles pesant sur notre prospérité continue, et ils m'ont fourni des approvisionnements militaires ainsi que des renseignements en conséquence. Les fournitures comme les informations proviennent de leurs divers contacts le long de la Route de la Soie, s'étendant jusqu'au Plateau himalayen et ses régions comme le Tibet, le Ladakh, le Qinghai et le Népal.\n\nMes efforts pour renforcer les relations avec eux n'ont pas été vains, semble-t-il ! Si nous devons rester unis, prospères, en tant que partenaires le long de la Route de la Soie, nous devons nous faire confiance et travailler ensemble de cette manière."
 tarim_basin.0028.desc.indian:0 "Les membres de la communauté indienne locale sont bien conscients des menaces extérieures mutuelles pesant sur notre prospérité continue, et ils m'ont fourni des approvisionnements militaires ainsi que des renseignements en conséquence. Tant les approvisionnements que les informations proviennent de leurs divers contacts le long de la Route de la Soie, s'étendant jusqu'aux rivages et aux jungles du sous-continent indien.\n\nMes efforts pour renforcer les relations avec eux n'ont pas été vains, semble-t-il ! Si nous devons rester unis, prospères, en tant que partenaires le long de la Route de la Soie, nous devons nous faire confiance et travailler ensemble de cette manière."
 tarim_basin.0028.desc.east_african:0 "Les membres de la communauté est-africaine locale sont bien conscients des menaces extérieures mutuelles pesant sur notre prospérité continue, et ils m'ont fourni des provisions militaires et des renseignements en conséquence. Les provisions comme les informations proviennent de leurs divers contacts le long de la Route de la Soie maritime, s'étendant jusqu'aux cités portuaires et aux tribus et royaumes de l'intérieur de l'Afrique de l'Est.\n\nMes efforts pour renforcer les relations avec eux n'ont pas été vains, semble-t-il ! Si nous voulons rester unis, prospères, en tant que partenaires le long de la Route de la Soie, nous devons nous faire confiance et travailler ensemble de cette manière."
 tarim_basin.0028.desc.southeast_asian:0 "Les membres de la communauté locale d'Asie du Sud-Est sont bien conscients des menaces extérieures mutuelles pesant sur notre prospérité continue, et ils m'ont fourni des approvisionnements militaires et des renseignements en conséquence. Tant les approvisionnements que les informations proviennent de leurs divers contacts à travers la Route de la Soie maritime, s'étendant jusqu'aux îles, côtes et jungles d'Asie du Sud-Est.\n\nMes efforts pour renforcer les relations avec eux n'ont pas été vains, semble-t-il ! Si nous devons nous tenir ensemble, prospères, en tant que partenaires le long de la Route de la Soie, nous devons nous faire confiance et travailler ensemble de cette manière."
 tarim_basin.0028.a:0 "Je suis heureux que nous soyons du même côté."
 tarim_basin.0029.t:0 "L'autochtone"
 tarim_basin.0029.desc.east_asian:0 "Un[local.Custom('FR_E')] [local.GetWomanMan] de culture [local.GetCulture.GetName] prometteu[local.Custom('FR_RSe')] nommé[local.Custom('FR_E')] [local.GetFullName] de la communauté est-asiatique locale de mon royaume souhaite rejoindre ma cour.\n\nDepuis des générations, les peuples d'Asie de l'Est se sont enorgueillis d'être les plus savants et les plus cultivés au monde - une réputation que beaucoup d'autres le long de la Route de la Soie considèrent comme vraie. Indépendamment des ses capacités réelles, avoir un lien par l'intermédiaire de [local.GetFirstName] pourrait être utile."
 tarim_basin.0029.desc.steppe:0 "Un[local.Custom('FR_E')] [local.GetWomanMan] de culture [local.GetCulture.GetName] prometteu[local.Custom('FR_RSe')] nommé[local.Custom('FR_E')] [local.GetFullName] de la communauté steppique locale de mon royaume souhaite rejoindre ma cour.\n\nBien que considérés comme des barbares par certains, les peuples des steppes - nombre d'entre eux étant d'intrépides nomades - sont néanmoins craints comme guerriers et cavaliers à travers la Route de la Soie, et pour de bonnes raisons. Quelles que soient ses capacités réelles, avoir un lien à travers [local.GetFirstName] pourrait s'avérer utile."
 tarim_basin.0029.desc.middle_eastern:0 "Un[local.Custom('FR_E')] [local.GetWomanMan] de culture [local.GetCulture.GetName] prometteu[local.Custom('FR_RSe')] nommé[local.Custom('FR_E')] [local.GetFullName] de la communauté moyen-orientale locale de mon royaume souhaite rejoindre ma cour.\n\nLes peuples originaires du Moyen-Orient sont réputés dans de nombreuses contrées le long de la Route de la Soie pour leur sens des affaires, leur art et leur musique ravissants, et la beauté de leurs femmes. Indépendamment des ses capacités réelles, avoir un lien à travers [local.GetFirstName] pourrait être utile."
 tarim_basin.0029.desc.himalayan:0 "Un[local.Custom('FR_E')] [local.GetWomanMan] de culture [local.GetCulture.GetName] prometteu[local.Custom('FR_RSe')] nommé[local.Custom('FR_E')] [local.GetFullName] de la communauté himalayenne locale de mon royaume souhaite rejoindre ma cour.\n\nLes habitants du plateau tibétain sont un peuple robuste et endurant, et ils sont respectés à juste titre pour leur courage et leur force dans de nombreuses contrées le long de la Route de la Soie. Indépendamment des ses capacités réelles, avoir un lien à travers [local.GetFirstName] pourrait s'avérer utile."
 tarim_basin.0029.desc.indian:0 "Un[local.Custom('FR_E')] [local.GetWomanMan] de culture [local.GetCulture.GetName] prometteu[local.Custom('FR_RSe')] nommé[local.Custom('FR_E')] [local.GetFullName] de la communauté indienne locale dans mon royaume souhaite rejoindre ma cour.\n\nComme l'Inde est la patrie de plusieurs fois, ses habitants sont considérés comme sages par certains le long de la Route de la Soie, mais ils sont également bien estimés pour leurs connaissances en commerce, diplomatie et administration. Indépendamment des ses capacités réelles, avoir un lien par l'intermédiaire de [local.GetFirstName] pourrait être utile."
 tarim_basin.0029.desc.east_african:0 "Un[local.Custom('FR_E')] [local.GetWomanMan] de culture [local.GetCulture.GetName] prometteu[local.Custom('FR_RSe')] nommé[local.Custom('FR_E')] [local.GetFullName] de la communauté est-africaine locale de mon royaume souhaite rejoindre ma cour.\n\nL'Afrique de l'Est est une source précieuse d'or et d'ivoire, et les marchands de la région sont dispersés aux quatre coins du monde, créant des réseaux de communautés auxquels tout dirigeant serait avisé de s'associer. Indépendamment des ses capacités réelles, avoir une connexion à travers [local.GetFirstName] pourrait s'avérer utile."
 tarim_basin.0029.desc.southeast_asian:0 "Un[local.Custom('FR_E')] [local.GetWomanMan] de culture [local.GetCulture.GetName] prometteu[local.Custom('FR_RSe')] nommé[local.Custom('FR_E')] [local.GetFullName] de la communauté locale d'Asie du Sud-Est dans mon royaume souhaite rejoindre ma cour.\n\nL'Asie du Sud-Est abrite de nombreux peuples, dont certains sont bien connectés aux réseaux économiques, culturels et politiques de la Route de la Soie maritime. Indépendamment de ses capacités réelles, avoir une connexion par l'intermédiaire de [local.GetFirstName] pourrait être utile."
 tarim_basin.0029.a:0 "Splendide ! Vous êtes les bienvenus !"
 tarim_basin.0029.b:0 "C'est une belle offre, mais je ne suis pas intéressé[ROOT.Char.Custom('FR_E')]."
 tarim_basin.0030.t:0 "Herbes et Médecines de la Route de la Soie"
 tarim_basin.0030.desc.east_asian:0 "Plusieurs membres éminents de la communauté est-asiatique locale m'ont récemment fait don d'une quantité importante d'herbes et de médicaments traditionnels provenant des collines et des forêts de leur patrie ancestrale en Extrême-Orient. On m'a dit que ces herbes et concoctions ne se trouvent nulle part ailleurs et qu'elles m'aideront à préserver ma santé à long terme."
 tarim_basin.0030.desc.steppe:0 "Plusieurs membres éminents de la communauté locale des steppes m'ont récemment fait don d'une quantité importante d'herbes et de médicaments traditionnels provenant des steppes de leur patrie ancestrale en Asie centrale et en Sibérie. On m'a dit que ces herbes et concoctions ne se trouvent nulle part ailleurs et qu'elles m'aideront à rester en bonne santé à long terme."
 tarim_basin.0030.desc.middle_eastern:0 "Plusieurs membres éminents de la communauté locale du Moyen-Orient m'ont récemment fait don d'une quantité importante d'herbes et de médicaments traditionnels provenant des déserts et des vallées fluviales de la patrie de leurs ancêtres au Moyen-Orient. On m'a dit que ces herbes et concoctions ne se trouvent nulle part ailleurs et qu'elles m'aideront à préserver ma santé à long terme."
 tarim_basin.0030.desc.himalayan:0 "Plusieurs membres éminents de la communauté himalayenne locale m'ont récemment fait don d'une quantité importante d'herbes et de médicaments traditionnels provenant des puissantes montagnes de leur patrie ancestrale sur le plateau tibétain. On m'a dit que ces herbes et concoctions ne se trouvent nulle part ailleurs et qu'elles m'aideront à préserver ma santé à long terme."
 tarim_basin.0030.desc.indian:0 "Plusieurs membres éminents de la communauté indienne locale m'ont récemment fait don d'une quantité importante d'herbes et de médicaments traditionnels provenant des jungles de leur patrie ancestrale en Asie du Sud. On m'a dit que ces herbes et ces concoctions ne se trouvent nulle part ailleurs et qu'elles m'aideront à rester en bonne santé à long terme."
 tarim_basin.0030.desc.east_african:0 "Plusieurs membres éminents de la communauté locale est-africaine m'ont récemment offert une quantité considérable d'herbes et de médecines traditionnelles provenant des terres diverses de leur patrie ancestrale en Afrique de l'Est. On me dit que ces herbes et ces préparations ne se trouvent nulle part ailleurs, et m'aideront à maintenir ma santé sur le long terme."
 tarim_basin.0030.desc.southeast_asian:0 "Plusieurs membres éminents de la communauté locale d'Asie du Sud-Est m'ont récemment offert une quantité considérable d'herbes et de médecines traditionnelles provenant des côtes de leur patrie ancestrale en Asie du Sud-Est. On me dit que ces herbes et concoctions ne se trouvent nulle part ailleurs, et m'aideront à maintenir ma santé sur le long terme."
 tarim_basin.0030.a:0 "C'est incroyable ! Je suis ravi[ROOT.Char.Custom('FR_E')] de recevoir un tel cadeau."
 tarim_basin.0031.t:0 "Les collectivités locales encouragent la croissance urbaine"
 tarim_basin.0031.desc.east_asian:0 "Mes efforts pour améliorer mes relations avec la communauté est-asiatique locale portent leurs fruits. En écoutant leurs préoccupations et en travaillant ensemble pour améliorer les conditions locales, ils m'ont en retour aidé à trouver des moyens d'acheminer des ressources de près et de loin pour des projets d'infrastructure, et leurs dirigeants sont souvent prêts à me soutenir et à étouffer tout signe de mécontentement parmi leurs frères."
 tarim_basin.0031.desc.steppe:0 "Mes efforts pour améliorer mes relations avec la communauté steppique locale portent leurs fruits. En écoutant leurs préoccupations et en travaillant ensemble pour améliorer les conditions locales, ils m'ont en retour aidé à trouver des moyens d'acheminer des ressources de près et de loin pour des projets d'infrastructure, et leurs chefs sont souvent prêts à me soutenir et à réprimer tout signe de mécontentement parmi leurs frères."
 tarim_basin.0031.desc.middle_eastern:0 "Mes efforts pour améliorer mes relations avec la communauté moyen-orientale locale portent leurs fruits. En écoutant leurs préoccupations et en travaillant ensemble pour améliorer les conditions locales, ils m'ont en retour aidé à trouver des moyens d'acheminer des ressources de près et de loin pour des projets d'infrastructure, et leurs dirigeants sont souvent prêts à me soutenir et à étouffer tout signe de mécontentement parmi leurs frères."
 tarim_basin.0031.desc.himalayan:0 "Mes efforts pour améliorer mes relations avec la communauté himalayenne locale portent leurs fruits. En écoutant leurs préoccupations et en travaillant ensemble pour améliorer les conditions locales, ils m'ont en retour aidé à trouver des moyens d'acheminer des ressources de près et de loin pour des projets d'infrastructure, et leurs dirigeants sont souvent prêts à me soutenir et à étouffer tout signe de mécontentement parmi leurs frères."
 tarim_basin.0031.desc.indian:0 "Mes efforts pour améliorer mes relations avec la communauté indienne locale portent leurs fruits. En écoutant leurs préoccupations et en travaillant ensemble pour améliorer les conditions locales, ils m'ont en retour aidé à trouver des moyens d'acheminer des ressources de près et de loin pour des projets d'infrastructure, et leurs dirigeants sont souvent prêts à me soutenir et à étouffer tout signe de mécontentement parmi leurs frères."
 tarim_basin.0031.desc.east_african:0 "Mes efforts pour améliorer mes relations avec la communauté locale d'Afrique de l'Est portent leurs fruits. En écoutant leurs préoccupations et en travaillant ensemble pour améliorer les conditions locales, ils m'ont aidé en retour à trouver des moyens de faire venir des ressources d'ici et d'ailleurs pour des projets d'infrastructure, et leurs dirigeants sont souvent prêts à me soutenir et à étouffer tout signe de mécontentement de la part de leurs frères."
 tarim_basin.0031.desc.southeast_asian:0 "Mes efforts pour améliorer mes relations avec la communauté locale d'Asie du Sud-Est portent leurs fruits. En écoutant leurs préoccupations et en travaillant ensemble à l'amélioration des conditions locales, ils m'ont aidé en retour à trouver des moyens de faire venir des ressources d'ici et d'ailleurs pour des projets d'infrastructure, et leurs dirigeants sont souvent prêts à me soutenir et à étouffer tout signe de mécontentement de la part de leurs frères."
 tarim_basin.0031.a:0 "Ensemble, nous rendrons ce pays meilleur, plus fort et plus prospère."
 tarim_basin.0032.t:0 "Nouveaux gardes du corps"
 tarim_basin.0032.desc.east_asian:0 "Quelques jeunes robustes et vigoureux de la communauté est-asiatique locale ont proposé de devenir mes gardes du corps. Inspirés par mes efforts pour tendre la main à leur communauté, ils souhaitent me rendre la pareille en assurant ma sécurité.\n\nLes anciens de leur communauté se sont portés garants de leurs compétences et de leur expérience au combat - certains ont même servi comme mercenaires ailleurs sur la Route de la Soie pendant quelques années - et ont assuré qu'ils me protégeraient sans crainte et me serviraient avec la plus grande loyauté."
 tarim_basin.0032.desc.steppe:0 "Quelques jeunes robustes et vigoureux de la communauté steppique locale ont offert de devenir mes gardes du corps. Inspirés par mes efforts pour tendre la main à leur communauté, ils souhaitent me rendre la pareille en assurant ma sécurité.\n\nLes anciens de leur communauté se sont portés garants de leurs compétences et de leur expérience au combat - certains ont même servi comme mercenaires ailleurs sur la Route de la Soie pendant quelques années - et qu'ils me protégeraient sans peur et me serviraient avec la plus grande loyauté."
 tarim_basin.0032.desc.middle_eastern:0 "Quelques jeunes robustes et vigoureux de la communauté moyen-orientale locale ont offert de devenir mes gardes du corps. Inspirés par mes efforts pour tendre la main à leur communauté, ils souhaitent me rendre la pareille en assurant ma sécurité.\n\nLes anciens de leur communauté se sont portés garants de leurs compétences et de leur expérience au combat - certains ont même servi comme mercenaires ailleurs sur la Route de la Soie pendant quelques années - et qu'ils me protégeraient sans crainte et me serviraient avec la plus grande loyauté."
 tarim_basin.0032.desc.himalayan:0 "Quelques jeunes robustes et forts de la communauté himalayenne locale ont offert de devenir mes gardes du corps. Inspirés par mes efforts pour tendre la main à leur communauté, ils souhaitent me rendre la pareille en assurant ma sécurité.\n\nLes anciens de leur communauté se sont portés garants de leurs compétences et de leur expérience au combat - certains ont même servi comme mercenaires ailleurs sur la Route de la Soie pendant quelques années - et qu'ils me protégeraient sans crainte et me serviraient avec la plus grande loyauté."
 tarim_basin.0032.desc.indian:0 "Quelques jeunes gens robustes et forts de la communauté indienne locale ont proposé de devenir mes gardes du corps. Inspirés par mes efforts pour tendre la main à leur communauté, ils souhaitent me rendre la pareille en assurant ma sécurité.\n\nLes anciens de leur communauté se sont portés garants de leurs compétences et de leur expérience en matière de combat - certains ont même servi de mercenaires ailleurs sur la Route de la soie pendant quelques années - et m'ont assuré qu'ils me protégeraient sans crainte et me serviraient avec la plus grande loyauté."
 tarim_basin.0032.desc.east_african:0 "Des jeunes robustes et forts de la communauté est-africaine locale ont proposé de devenir mes gardes du corps. Inspirés par mes efforts pour tendre la main à leur communauté, ils souhaitent me rendre la pareille en assurant ma sécurité.\n\nLes anciens de leur communauté se sont portés garants de leurs compétences et de leur expérience au combat - certains ont même servi comme mercenaires ailleurs sur la Route de la Soie pendant quelques années - et qu'ils me protégeraient sans peur et me serviraient avec la plus grande loyauté."
 tarim_basin.0032.desc.southeast_asian:0 "Quelques jeunes gens robustes et forts de la communauté locale d'Asie du Sud-Est ont proposé de devenir mes gardes du corps. Inspirés par mes efforts de rapprochement avec leur communauté, ils souhaitent me rendre la pareille en assurant ma sécurité.\n\nLes anciens de leur communauté se sont portés garants de leurs compétences et de leur expérience en matière de combat - certains ont même servi de mercenaires ailleurs le long de la Route de la soie maritime pendant quelques années - et m'ont assuré qu'ils me protégeraient sans crainte et me serviraient avec la plus grande loyauté."
 tarim_basin.0032.a:0 "Je me sens déjà plus en sécurité !"
 tarim_basin.0033.t:0 "Échange d'idées"
 tarim_basin.0033.desc.east_asian:0 "Aujourd'hui, un certain nombre de personnes érudites de la communauté est-asiatique locale m'ont rendu visite afin d'offrir à ma cour une conférence intéressante sur certaines de leurs croyances traditionnelles, principes, coutumes, littérature et histoire. Sur la Route de la Soie, l'échange d'idées et de cultures n'a rien de nouveau, après tout.\n\nBien qu'une grande partie des informations m'ait échappé, j'ai appris certaines choses intéressantes, et j'espère que cette expérience pourra m'aider à mieux me rapprocher de ceux qui ont des ancêtres venus d'Extrême-Orient."
 tarim_basin.0033.desc.steppe:0 "Aujourd'hui, un certain nombre de personnes érudites de la communauté steppique locale m'ont rendu visite afin d'offrir à ma cour une conférence intéressante sur certaines de leurs croyances traditionnelles, leurs principes, leurs coutumes, leur littérature et leur histoire. Sur la Route de la Soie, l'échange d'idées et de cultures n'est après tout rien de nouveau.\n\nBien qu'une grande partie des informations m'ait échappé, j'ai appris certaines choses intéressantes, et j'espère que cette expérience pourra m'aider à mieux me rapprocher de ceux qui ont des ancêtres originaires des steppes d'Asie centrale et de Sibérie."
 tarim_basin.0033.desc.middle_eastern:0 "Aujourd'hui, un certain nombre de personnes érudites de la communauté locale du Moyen-Orient m'ont rendu visite afin de donner à ma cour une conférence intéressante sur certaines de leurs croyances traditionnelles, principes, coutumes, littérature et histoire. Sur la Route de la Soie, l'échange d'idées et de cultures n'a rien de nouveau, après tout.\n\nBien qu'une grande partie des informations m'ait échappé, j'ai appris des choses intéressantes, et j'espère que cette expérience pourra m'aider à mieux me rapprocher de ceux qui ont des ancêtres du Moyen-Orient."
 tarim_basin.0033.desc.himalayan:0 "Aujourd'hui, un certain nombre de personnes érudites de la communauté himalayenne locale m'ont rendu visite afin d'offrir à ma cour une conférence intéressante sur certaines de leurs croyances traditionnelles, principes, coutumes, littérature et histoire. Sur la Route de la Soie, l'échange d'idées et de cultures n'a rien de nouveau, après tout.\n\nBien qu'une grande partie des informations m'ait échappé, j'ai appris certaines choses intéressantes, et j'espère que cette expérience pourra m'aider à mieux me rapprocher de ceux qui ont des ancêtres originaires du plateau himalayen."
 tarim_basin.0033.desc.indian:0 "Aujourd'hui, un certain nombre de personnes érudites de la communauté indienne locale m'ont rendu visite afin de donner à ma cour une conférence intéressante sur certaines de leurs croyances traditionnelles, leurs principes, leurs coutumes, leur littérature et leur histoire. Sur la Route de la soie, l'échange d'idées et de cultures n'est pas nouveau, après tout.\n\nBien que la plupart des informations m'aient échappé, j'ai appris des choses intéressantes et j'espère que cette expérience m'aidera à nouer des liens avec les personnes dont les ancêtres sont originaires d'Asie du Sud."
 tarim_basin.0033.desc.east_african:0 "Aujourd'hui, un certain nombre de personnes érudites de la communauté est-africaine locale m'ont rendu visite afin de donner à ma cour une conférence intéressante sur certaines de leurs croyances traditionnelles, principes, coutumes, littérature et histoire. Sur la route maritime de la Soie, l'échange d'idées et de cultures n'a rien de nouveau, après tout.\n\nBien qu'une grande partie des informations m'ait échappé, j'ai appris des choses intéressantes, et j'espère que cette expérience pourra m'aider à mieux me rapprocher de ceux qui ont des ancêtres d'Afrique de l'Est."
 tarim_basin.0033.desc.southeast_asian:0 "Aujourd'hui, un certain nombre de personnes érudites de la communauté locale d'Asie du Sud-Est m'ont rendu visite afin de donner à ma cour une conférence intéressante sur certaines de leurs croyances traditionnelles, principes, coutumes, littérature et histoire. Sur la route maritime de la Soie, l'échange d'idées et de cultures n'est rien de nouveau, après tout.\n\nBien qu'une grande partie des informations m'ait échappé, j'ai appris certaines choses intéressantes, et j'espère que cette expérience pourra m'aider à mieux me rapprocher de ceux ayant des ancêtres d'Asie du Sud-Est."
 tarim_basin.0033.a:0 "La journée d'aujourd'hui a été productive, c'est certain."
 tarim_basin.0034.t:0 "Sécurité en haute mer"
 tarim_basin.0034.desc.east_asian:0 "Chaque jour, des navires naviguent vers et depuis l'océan Indien le long de la Route de la Soie maritime, en nombres apparemment infinis. Dernièrement, mes contacts dans la communauté est-asiatique locale m'ont dit qu'ils ont fait des efforts conscients pour contacter leurs frères dans d'autres ports d'escale afin de surveiller les navires naviguant sous la bannière [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip], et de travailler avec eux autant que possible lors de leurs voyages, comme naviguer ensemble pour se défendre.\n\nLes mers peuvent être dangereuses, mais grâce à une coopération comme celle-ci, des peuples proches et lointains peuvent se rassembler pour accomplir de grandes choses."
 tarim_basin.0034.desc.steppe:0 "Chaque jour, des navires naviguent vers et depuis l'océan Indien le long de la route maritime de la Soie, en nombre apparemment infini. Dernièrement, mes contacts dans la communauté steppique locale m'ont dit qu'ils ont fait des efforts conscients pour contacter leurs frères dans d'autres ports d'escale afin de surveiller les navires naviguant sous la bannière [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip], et de travailler avec eux autant que possible lors de leurs voyages, comme naviguer ensemble pour se défendre.\n\nLes mers peuvent être dangereuses, mais grâce à une coopération comme celle-ci, des peuples proches et lointains peuvent se rassembler pour accomplir de grandes choses."
 tarim_basin.0034.desc.middle_eastern:0 "Chaque jour, des navires naviguent vers et depuis l'océan Indien le long de la route maritime de la Soie, en nombre apparemment infini. Dernièrement, mes contacts dans la communauté locale moyen-orientale m'ont dit qu'ils ont fait des efforts conscients pour contacter leurs frères dans d'autres ports d'escale afin de surveiller les navires naviguant sous la bannière [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip], et de collaborer avec eux autant que possible lors de leurs voyages, comme naviguer ensemble pour se défendre.\n\nLes mers peuvent être dangereuses, mais grâce à une coopération comme celle-ci, des peuples proches et lointains peuvent s'unir pour accomplir de grandes choses."
 tarim_basin.0034.desc.himalayan:0 "Chaque jour, des navires naviguent vers et depuis l'océan Indien le long de la route maritime de la Soie, en nombre apparemment infini. Dernièrement, mes contacts dans la communauté himalayenne locale m'ont dit qu'ils ont fait des efforts conscients pour contacter leurs frères dans d'autres ports d'escale afin de surveiller les navires naviguant sous la bannière [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip], et de travailler avec eux autant que possible lors de leurs voyages, comme naviguer ensemble pour se défendre.\n\nLes mers sont peut-être dangereuses, mais grâce à une coopération comme celle-ci, des peuples proches et lointains peuvent se rassembler pour accomplir de grandes choses."
 tarim_basin.0034.desc.indian:0 "Chaque jour, des navires partent et arrivent de l'océan Indien le long de la route maritime de la Soie, en nombre apparemment infini. Dernièrement, mes contacts dans la communauté indienne locale m'ont dit qu'ils ont fait des efforts conscients pour contacter leurs frères dans d'autres ports d'escale afin de surveiller les navires naviguant sous la bannière [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip], et de travailler avec eux autant que possible lors de leurs voyages, comme naviguer ensemble pour se défendre.\n\nLes mers sont peut-être dangereuses, mais grâce à une telle coopération, des peuples proches et lointains peuvent s'unir pour accomplir de grandes choses."
 tarim_basin.0034.desc.east_african:0 "Chaque jour, des navires naviguent vers et depuis l'océan Indien le long de la route maritime de la Soie, en nombre apparemment infini. Dernièrement, mes contacts dans la communauté est-africaine locale m'ont dit qu'ils ont fait des efforts conscients pour contacter leurs frères dans d'autres ports d'escale afin de surveiller les navires naviguant sous la bannière [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip], et de travailler avec eux autant que possible lors de leurs voyages, comme naviguer ensemble pour se défendre.\n\nLes mers sont peut-être dangereuses, mais grâce à une coopération comme celle-ci, des peuples proches et lointains peuvent s'unir pour accomplir de grandes choses."
 tarim_basin.0034.desc.southeast_asian:0 "Chaque jour, des navires naviguent vers et depuis l'océan Indien le long de la Route de la Soie maritime, en nombre apparemment infini. Dernièrement, mes contacts dans la communauté locale d'Asie du Sud-Est m'ont informé qu'ils ont fait des efforts conscients pour contacter leurs frères dans d'autres ports d'escale afin de surveiller les navires naviguant sous la bannière [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip], et de collaborer avec eux autant que possible lors de leurs voyages, comme naviguer ensemble pour se défendre.\n\nLes mers sont peut-être dangereuses, mais grâce à une coopération comme celle-ci, des peuples proches et lointains peuvent se rassembler pour accomplir de grandes choses."
 tarim_basin.0034.a:0 "Très bien !"
 tarim_basin.0035.t:0 "Une relation d'affaires"
 tarim_basin.0035.desc.east_asian:0 "La communauté locale d'Asie orientale de mon royaume compte un certain nombre de marchands puissants qui ont voyagé jusqu'à ces terres depuis l'Extrême-Orient pour faire des affaires - les étrangers ne peuvent que rêver de la magnificence et de la prospérité de leurs patries."
 tarim_basin.0035.desc.steppe:0 "La communauté locale des steppes de mon royaume compte un certain nombre de marchands puissants. On pourrait croire que les habitants des steppes ne savent que se battre, mais il semble que certains d'entre eux possèdent des compétences en matière de perspicacité et de diplomatie."
 tarim_basin.0035.desc.middle_eastern:0 "La communauté du Moyen-Orient dans mon royaume compte un certain nombre de marchands puissants, ce qui ne devrait surprendre personne étant donné le rôle important qu'ils jouent dans nos réseaux commerciaux depuis des générations."
 tarim_basin.0035.desc.himalayan:0 "La communauté himalayenne de mon royaume compte un certain nombre de marchands puissants, qui font ce que peu d'autres peuvent faire en gérant et en organisant les relations marchandes à travers le formidable toit du monde."
 tarim_basin.0035.desc.indian:0 "La communauté indienne de mon royaume compte un certain nombre de marchands puissants, qui s'organisent efficacement pour participer au commerce terrestre et maritime à destination et en provenance des magnifiques villes de leur patrie."
 tarim_basin.0035.desc.east_african:0 "La communauté est-africaine de mon royaume compte un certain nombre de marchands puissants, qui voyagent loin à pied et à la voile pour faire du commerce, et qui constituent un lien essentiel entre nous et d'autres royaumes et villes légendaires situés à l'intérieur des terres de l'Afrique de l'Est."
 tarim_basin.0035.desc.southeast_asian:0 "La communauté d'Asie du Sud-Est de mon royaume compte un certain nombre de marchands puissants, maîtres des eaux de l'océan Indien, qui savent non seulement comment naviguer, mais aussi où naviguer, dans leur quête d'aventures et d'opportunités commerciales."
 tarim_basin.0035.desc:0 "\n\nQuoi qu'il en soit, je me suis récemment rapproché d'un membre de leur groupe, un[merchant.Custom('FR_E')] [merchant.GetWomanMan] du nom de [merchant.GetFullName], d'extraction [county_culture.GetName] et pratiquant la foi [county_faith.GetAdjective].\n\nPeut-être devrais-je tisser des liens plus étroits avec [merchant.GetFirstNameNoTooltip]. C'est une chose de faire affaire avec de parfaits inconnus, mais c'en est une autre d'avoir un contact personnel avec une communauté locale #italic et#! leurs compatriotes dans leur pays d'origine. Nous pourrions en bénéficier mutuellement."
 tarim_basin.0035.a:0 "[merchant.GetSheHe|U] peut faire beaucoup en tant que courtisan[merchant.Custom('FR_E')] et conseill[merchant.Custom('FR_ErEre')]!"
 tarim_basin.0035.b:0 "Utilisons-[merchant.GetHerHim] comme point de contact."
 tarim_basin.0035.c:0 "En y réfléchissant bien, je ne pense pas que cela fonctionnera."
