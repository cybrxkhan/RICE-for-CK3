 tarim_basin.0070.t:0 "Grottes de Mogao"
 tarim_basin.0070.desc.intro:0 "Les grottes de Mogao témoignent depuis des siècles de la vérité du Dharma enseigné par le Seigneur Bouddha. Aujourd'hui, j'ai l'occasion de gagner en mérite en parrainant la construction d'une nouvelle grotte à Mogao."
 tarim_basin.0070.desc.family:0 "\n\nJ'ai précisé aux artistes que j'ai engagés que je veux que la grotte se concentre principalement sur la dévotion de ma famille. Le monde doit connaître la droiture de ma lignée, et comment nous avons grandement contribué à l'épanouissement de la voie véritable."
 tarim_basin.0070.desc.jataka:0 "\n\nJ'ai précisé aux artistes que j'ai engagés que je veux que la grotte se concentre principalement sur la narration des fables bouddhistes issues des contes [Glossary( 'jataka', 'JATAKA_GLOSS' )]. Ces histoires ont diverti des générations entières, et sont un excellent moyen d'enseigner à tous la bonne conduite et la morale."
 tarim_basin.0070.desc.deities:0 "\n\nJ'ai précisé aux artistes que j'ai engagés que je souhaitais que la grotte soit principalement consacrée à la représentation d'êtres éclairés et de divinités. Quoi de mieux pour honorer directement les bouddhas, bodhisattvas et autres divinités que de leur commander de magnifiques visions ?"
 tarim_basin.0070.desc.conclusion:0 "\n\nOutre la direction artistique de la grotte, l'autre chose que je dois déterminer est le coût. Il dépendra de la taille que je veux donner à la grotte et du niveau de détail et de qualité que j'attends. J'ai déjà mis de côté des fonds pour ma grotte, mais si je veux quelque chose de plus grand et de plus grandiose, je devrai probablement dépenser davantage. Quelle sera la taille de cette grotte ?"
 tarim_basin.0070.a:0 "Une grotte modeste - dépenser un peu mais pas trop d'argent"
 tarim_basin.0070.b:0 "Une grotte de taille décente - utiliser une somme d'argent respectable"
 tarim_basin.0070.c:0 "Une grande grotte - la grotte sera coûteuse mais extraordinaire"
 tarim_basin.0070.tooltip:0 "Plus vous dépensez pour les [mogao_cave_short|El], plus les récompenses seront grandes à la fin, incluant la [piety|El], le [prestige|El], et des [character_modifiers|El] positifs"
 tarim_basin.0071.t:0 "Grotte de Mogao achevée"
 tarim_basin.0071.desc:0 "Enfin, après une longue attente, les hommes que j'ai mandatés ont terminé de creuser une nouvelle grotte dans les grottes de Mogao. Elle est magnifique et époustouflante, exactement comme je l'imaginais, et les images sculptées sur les fresques semblent si réalistes.\n\nCette grotte se dressera fièrement aux côtés des autres grottes ici pendant encore de nombreux siècles, un témoignage de la gloire des Trois Joyaux."
 tarim_basin.0071.a:0 "Un travail bien fait !"
 tarim_basin.0072.t:0 "$tarim_basin.0071.t$"
 tarim_basin.0072.desc:0 "Mon prédécesseur, [deceased_mogao.GetTitledFirstName], a chargé plusieurs hommes de creuser une nouvelle grotte à Mogao peu avant de décéder. Sa mort nous a rappelé à tous que tout en ce monde est impermanent - tel est le cycle de la vie et de la renaissance !\n\nCela dit, bien qu'[deceased_mogao.GetSheHe] ne soit plus là pour voir cela se concrétiser, sa bonne action lui vaudra beaucoup de mérite dans ses vies futures, mérite qui est assurément partagé avec le reste de la famille également !"
 tarim_basin.0072.a:0 "$tarim_basin.0071.a$"
 tarim_basin.0073.t:0 "Vision de bon augure"
 tarim_basin.0073.desc:0 "Alors que les travaux sur la grotte de Mogao que j'ai commandée étaient en cours, l'un des ouvriers a fait un rêve une nuit où il a reçu la visite d'un Bodhisattva inconnu. Cela peut être considéré comme un signe de bon augure."
 tarim_basin.0073.a:0 "Très bien!"
 tarim_basin.0074.t:0 "Tempêtes de sable à Mogao"
 tarim_basin.0074.desc:0 "La calamité a frappé pendant que mes hommes travaillaient sur la grotte de Mogao. Une petite tempête de sable a balayé la région et, bien qu'elle n'ait pas causé beaucoup de dégâts ni de pertes humaines, elle a réduit à néant les progrès réalisés sur ma grotte."
 tarim_basin.0074.a:0 "Malheur !"
 tarim_basin.0075.t:0 "Raid de bandits"
 tarim_basin.0075.desc:0 "Les caravanes transportant les marchandises et matériaux utilisés pour ma grotte de Mogao ont été attaquées par des bandits nomades. Bien que nous n'ayons pas perdu toutes les provisions, c'est un coup dur pour le projet.\n\nAssurément, ces hommes vils renaîtront dans le royaume infernal dans leur prochaine vie pour leurs actes maléfiques contre les Trois Joyaux !"
 tarim_basin.0075.a:0 "Pourtant, je vais devoir rattraper ces pertes."
 tarim_basin.0076.t:0 "Une aide pour la grotte ?"
 tarim_basin.0076.desc:0 "L'une des organisations laïques bouddhistes locales de Dunhuang a entendu parler de mon projet d'agrandir les grottes de Mogao avec la mienne. Ils sont impressionnés et offrent des fonds pour m'aider dans mon projet.\n\nEn échange, tout ce qu'ils demandent, c'est un peu de reconnaissance. Cela signifie que la grotte devra afficher leurs noms, et ils pourraient avoir leur mot à dire sur l'apparence de certaines parties de la grotte."
 tarim_basin.0076.a:0 "Ils seront représentés dans les fresques de la grotte et leurs idées seront prises en compte."
 tarim_basin.0076.b:0 "En guise de remerciement, je leur remettrai des dons à utiliser dans le cadre de leurs activités !"
 tarim_basin.0076.c:0 "Pour être honnête, je n'ai besoin du soutien d'aucun d'entre eux pour ce projet de grotte."
 tarim_basin.0076.a.tooltip:0 "Les donations nous permettront d'élargir la portée originale de la grotte et d'y ajouter de nouveaux éléments. #EMP (Cette option augmentera les bonus que vous recevrez de votre grotte de Mogao lorsqu'elle sera achevée.)#!"
 tarim_basin.0077.t:0 "La visite d'un moine"
 tarim_basin.0077.desc:0 "Un moine éminent de l'un des monastères de Dunhuang visite aujourd'hui le site de construction de ma grotte de Mogao. En raison de son excellente réputation au sein de la communauté locale, j'ai décidé de l'accompagner sur place et de lui faire visiter les lieux. Bien que la grotte soit inachevée et qu'il s'agisse encore d'un travail en cours, j'espère que ce qui s'y trouve déjà est suffisant.\n\nAprès lui avoir fait visiter le site, le moine a eu de bonnes choses à dire sur les travaux effectués, je suis donc soulagé !"
 tarim_basin.0077.a:0 "Je lui ai donné une aumône avant qu'il ne parte."
 tarim_basin.0078.t:0 "Conflits souterrains"
 tarim_basin.0078.desc:0 "Il y a eu quelques retards avec ma grotte à Mogao. Par coïncidence, ma grotte est creusée à côté d'une autre grotte en construction, qui est financée par une association de marchands.\n\nMalheureusement, il y a eu quelques conflits quant aux limites entre nos grottes, et même quelques échauffourées entre nos équipes de travail, bien qu'heureusement personne n'ait été gravement blessé. Les autorités juridiques ont statué en ma faveur, mais les marchands semblent toujours mécontents."
 tarim_basin.0078.a:0 "Reculons et cédons du terrain. Nous ne devrions pas nous battre."
 tarim_basin.0078.b:0 "Payez les marchands pour qu'ils reculent - cela devrait les apaiser."
 tarim_basin.0078.c:0 "Oubliez ces marchands imbéciles ! Cette glorieuse grotte est #italic mienne#!!"
 tarim_basin.0078.d:0 "Pourquoi ne pas combiner nos efforts et faire une grande grotte ?"
 tarim_basin.0078.d.tooltip:0 "Il est certain qu'avec une grotte massive, nous pouvons ensemble honorer le Bouddha, le Dharma et la Sangha encore plus que si nous travaillions séparément ! #EMP (Cette option augmentera les bonus que vous recevrez de votre grotte de Mogao lorsqu'elle sera terminée).#!"
 tarim_basin.0079.t:0 "Une plus grande, meilleure grotte"
 tarim_basin.0079.desc:0 "Les marchands furent surpris par mon geste, et acceptèrent mon offre de fusionner nos efforts pour créer une grande grotte au lieu de deux plus petites, en utilisant nos ouvriers et artisans pour combiner leurs talents artistiques.\n\nNous nous sommes tous pardonné nos transgressions mutuelles, et avons ri de la sottise de notre querelle. Le Bouddha nous a enseigné après tout à ne pas nous laisser égarer par nos émotions afflictives, car cela engendre un karma négatif.\n\nQuel bonheur qu'une bonne chose soit née de cette situation initialement hostile, et maintenant, la grotte sera encore plus grande et plus majestueuse qu'auparavant !"
 tarim_basin.0079.a:0 "Une fin heureuse."
 tarim_basin.0080.t:0 "Un nouvel ami marchand"
 tarim_basin.0080.desc:0 "Après avoir passé du temps avec l'association marchande pour régler les détails de notre nouvelle cave commune, l'un[merchant.Custom('FR_E')] d'entre eux a apparemment décidé d'offrir ses services à ma cour. [merchant.GetSheHe|U] est un[merchant.Custom('FR_E')] marchand[merchant.Custom('FR_E')] talentueu[merchant.Custom('FR_XSe')] du nom de [merchant.GetFullName].\n\nQuoi qu'il en soit, durant les négociations et discussions, [merchant.Custom('FR_LuiElle')] et moi nous sommes très bien entendus, donc cela ne me dérangerait pas d'avoir quelqu'un comme [merchant.Custom('FR_LuiElle')] à mes côtés pour m'aider."
 tarim_basin.0080.a:0 "Oui, bienvenue, mon ami du Dharma !"
 tarim_basin.0081.t:0 "La grotte des trésors perdus"
 tarim_basin.0081.desc:0 "En travaillant sur ma grotte de Mogao, les ouvriers ont trouvé une vieille pièce cachée. En l'explorant, ils ont découvert une grotte scellée perdue depuis des siècles ! Elle est remplie de parchemins inestimables et d'autres artefacts spirituels.\n\nDe telles découvertes ne sont pas rares lors de l'excavation de nouvelles grottes ici, et comme ces trésors ne sont associés à aucun clan actuel, c'est à moi de décider ce qu'il convient d'en faire."
 tarim_basin.0081.a:0 "Faire don de ces objets précieux à un monastère local."
 tarim_basin.0081.b:0 "De tels artefacts et parchemins iront bien dans ma grotte."
 tarim_basin.0081.c:0 "Je veux ramener tout cela chez moi pour l'étudier."
 tarim_basin.0081.d:0 "La vente de ces objets de valeur devrait me rapporter un joli bénéfice."
 tarim_basin.0082.t:0 "L'artisan étranger"
 tarim_basin.0082.desc:0 "L'un des principaux artisans en charge de ce projet de grotte est un[foreigner.Custom('FR_E')] étrang[foreigner.Custom('FR_ErEre')] venu[foreigner.Custom('FR_E')] de loin nommé[foreigner.Custom('FR_E')] [foreigner.GetFullName]. [foreigner.GetSheHe|U] est un[foreigner.Custom('FR_E')] artisan[foreigner.Custom('FR_E')] compétent[foreigner.Custom('FR_E')] , et apporte une influence étrangère unique à l'art de la grotte.\n\nCela dit, bien que [foreigner.GetFirstName] parle couramment la langue [ROOT.Char.GetCulture.GetLanguage.GetName] et comprenne nos coutumes [ROOT.Char.GetCulture.GetNameNoTooltip]s, [foreigner.GetSheHe] se comporte encore maladroitement et a parfois des difficultés à communiquer avec les autres en raison des différences culturelles, et il est clair que cela commence à affecter sa relation de travail avec les autres ouvriers."
 tarim_basin.0082.a:0 "Tant que [foreigner.GetFirstName] fait son travail, cela m'importe peu."
 tarim_basin.0082.b:0 "Je l'aiderai et me porterai garant pour [foreigner.Custom('FR_LuiElle')] s'il y a des malentendus."
 tarim_basin.0083.t:0 "L'artisan étranger"
 tarim_basin.0083.desc:0 "[foreigner.GetFirstName] m'a dit qu'[foreigner.GetSheHe] était reconnaissant de mon aide. De plus, [foreigner.GetSheHe] me dit que ma bienveillance l'a convaincu de rester ici de façon permanente une fois le projet terminé. Qui sait avec quoi d'autre [foreigner.GetSheHe] pourra m'aider ?"
 tarim_basin.0083.a:0 "Très bien !"
 tarim_basin.0084.t:0 "Inspection de la grotte"
 tarim_basin.0084.desc:0 "Aujourd'hui, j'ai inspecté le site de mon projet de grotte de Mogao. Les ouvriers semblent bien travailler, à l'exception d'un seul, qui travaille plus lentement que les autres. Les autres disent qu'il est fatigué, qu'il est tombé malade récemment et qu'il commence à peine à se rétablir, qu'il est habituellement un bon travailleur."
 tarim_basin.0084.a:0 "Renvoyez-le ! Il fait manifestement semblant."
 tarim_basin.0084.b:0 "Très bien. Poursuivez donc votre travail."
 tarim_basin.0084.c:0 "Je veillerai personnellement à ce qu'il ait de bons médicaments."
 tarim_basin.0085.t:0 "Services religieux"
 tarim_basin.0085.desc:0 "Un groupe de moines de l'un des monastères locaux près de Dunhuang est venu accomplir des cérémonies religieuses, des chants et des prières dans ma grotte de Mogao, qui est en cours de construction.\n\nBien que les moines ne demandent pas souvent des dons de manière explicite, il est d'usage de leur offrir quelque chose par la suite en signe d'appréciation et de bon mérite."
 tarim_basin.0085.a:0 "Pourquoi devrais-je le faire ? Les moines ne doivent pas être avides."
 tarim_basin.0085.b:0 "Bien sûr. Je leur ferai des dons."
 tarim_basin.0085.c:0 "C'est certainement d'un don important dont ils ont besoin !"
 tarim_basin.0086.t:0 "Festin végétarien à la Cave"
 tarim_basin.0086.desc:0 "Pour ceux qui suivent les enseignements du Bouddha, manger végétarien de temps en temps est un moyen sûr de montrer notre foi et d'acquérir du mérite. Lorsque vous vous rendez un jour sur le site de construction de votre grotte, il apparaît que les ouvriers et toutes les personnes impliquées ont organisé un festin végétarien en l'honneur de votre visite."
 tarim_basin.0086.a:0 "Je déteste la nourriture végétarienne. Je me contenterai d'observer."
 tarim_basin.0086.b:0 "Une idée réfléchie. Je mangerai ce qu'il faut."
 tarim_basin.0086.c:0 "La cuisine végétarienne est délicieuse ! Et vertueuse."
