 activity_RICE_tocharian_animal_fight_host_desc:"\n$BULLET_WITH_TAB$Gain de [prestige_i|E] [prestige|El]\n$BULLET_WITH_TAB$Possibilité que votre [realm_capital|El] obtienne un [county_modifier|El] #P positif#! ou que vous obteniez un [character_modifier|El] #P positif#!\n$BULLET_WITH_TAB$Perte de [piety_i] [piety|El] si vous suivez une [faith|El] qui a le [core_tenet|El] [GetFaithDoctrine('tenet_pacifism').GetBaseName] ou [GetFaithDoctrine('tenet_dharmic_pacifism').GetBaseName]"
