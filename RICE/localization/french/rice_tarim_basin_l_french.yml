 activity_RICE_tarim_basin_khotan_procession_host_an_a:0 "une"
 activity_RICE_tarim_basin_khotan_procession:0 "Procession annuelle à Khotan"
 activity_RICE_tarim_basin_khotan_procession_desc:0 "Il est temps de réaffirmer notre foi dans les Trois Joyaux en participant à la procession annuelle des images de Khotan. Depuis que [GetTitleByKey('c_khotan').GetNameNoTier] est devenue la terre du Bouddha, la procession est célébrée sans interruption depuis des siècles. Tout le monde à Khotan est impliqué, des gens du peuple aux monastiques en passant par la royauté."
 activity_RICE_tarim_basin_khotan_procession_selection_tooltip:"Participez à la procession annuelle de Khotan.\n\n$RICE_tarim_basin_khotan_procession_context_tooltip$"
 activity_RICE_tarim_basin_khotan_procession_host_desc:"\n$BULLET_WITH_TAB$Gain de [piety_i|E] [piety|El]\n$BULLET_WITH_TAB$Gain du [character_modifier|El] [GetModifier('RICE_tarim_basin_participated_in_khotan_procession').GetNameWithTooltip]\n$BULLET_WITH_TAB$Possibilité de recevoir les #P bénédictions#! des [eight_protectors_of_khotan|El] et un [character_modifier|El] dont la puissance dépend de votre [piety_level|El] et des [activity_options|El] que vous sélectionnez"
 activity_RICE_tarim_basin_khotan_procession_guest_desc: "\n$BULLET_WITH_TAB$Gain de [piety_i|E] [piety|El]\n$BULLET_WITH_TAB$Gain du [character_modifier|El] [GetModifier('RICE_tarim_basin_participated_in_khotan_procession').GetNameWithTooltip]"
 activity_RICE_tarim_basin_khotan_procession_province_desc:"La procession a lieu chaque année à [GetTitleByKey('b_khotan').GetNameNoTier] depuis aussi longtemps que quiconque s'en souvienne"
 activity_RICE_tarim_basin_khotan_procession_destination_selection: "$activity_RICE_tarim_basin_khotan_procession_province_desc$"
 activity_RICE_tarim_basin_khotan_procession_guest_help_text: "$activity_RICE_tarim_basin_khotan_procession$"
 activity_RICE_tarim_basin_khotan_procession_predicted_cost:"Le coût de cette [activity|El] est principalement basé sur vos [income|El] et les [activity_options|El] que vous sélectionnez."
 activity_RICE_tarim_basin_khotan_procession_conclusion_desc:"La [GetActivityType( 'activity_RICE_tarim_basin_khotan_procession' ).GetName] est terminée. Gloire aux Trois Joyaux : le Bouddha, le Dharma et le Sangha !"
 # Note to Chinese translators: in historical Chinese sources, the 14 monasteries of Khotan are called the 大僧伽藍
 RICE_tarim_basin_khotan_procession_monastery_type:"Patronner un monastère"
 RICE_tarim_basin_khotan_procession_monastery_type_none:"N'en patronner aucun"
 RICE_tarim_basin_khotan_procession_monastery_type_none_desc:"$EFFECT_LIST_BULLET$En préparation de la procession, vous ne ferez aucun don spécial à aucun des 14 grands monastères de Khotan.\n$EFFECT_LIST_BULLET$Aucun bonus supplémentaire par rapport aux autres options.\n\n#weak Il est important de soutenir les monastères, mais il n'est pas nécessaire de favoriser un monastère par rapport à un autre, particulièrement dans le contexte de la procession annuelle. Un don modeste distribué à l'ensemble des 14 grands monastères devrait suffire.#!"
 RICE_tarim_basin_khotan_procession_monastery_type_other:"En parrainer d'autres"
 RICE_tarim_basin_khotan_procession_monastery_type_other_desc:"$EFFECT_LIST_BULLET$En préparation de la procession, vous ferez un don à l'un des moins connus des 14 grands monastères de Khotan.\n$EFFECT_LIST_BULLET$Augmente le coût de cette [activity|El] de [gold_i|El]#V [GetPlayer.MakeScope.ScriptValue('RICE_tarim_basin_khotan_basic_donation_cost')]#!\n$EFFECT_LIST_BULLET$Gain de [prestige_i|El] #V 50#! à la fin de cette [activity|El].\n\n#weak Bien que les monastères de Gomati et de Mashe soient les plus célèbres de Khotan, d'autres monastères participent également à la procession annuelle. Ils ne sont pas aussi importants, mais ils restent essentiels, nous devrions donc soutenir l'un de ces monastères !#!"
 RICE_tarim_basin_khotan_procession_monastery_type_mashe:"Patronner Mashe"
 RICE_tarim_basin_khotan_procession_monastery_type_mashe_desc:"$EFFECT_LIST_BULLET$En préparation de la procession, vous ferez un don au monastère de Mashe, qui a des associations légendaires avec l'industrie de la soie de Khotan.\n$EFFECT_LIST_BULLET$Augmente le coût de cette [activity|El] de [gold_i|El]#V [GetPlayer.MakeScope.ScriptValue('RICE_tarim_basin_khotan_mashe_donation_cost')]#!\n$EFFECT_LIST_BULLET$Gain de [prestige_i|El] #V 100#! à la fin de cette [activity|El].\n\n#weak Selon la légende, la soie fut apportée à Khotan grâce à une princesse chinoise, et le monastère de Mashe fut construit sur le site où elle planta des mûriers. En tant que tel, le monastère est très respecté dans la région et mérite notre soutien.#!"
 RICE_tarim_basin_khotan_procession_monastery_type_gomati:"Parrainer Gomati"
 RICE_tarim_basin_khotan_procession_monastery_type_gomati_desc:"$EFFECT_LIST_BULLET$En préparation de la procession, vous ferez un don au grand monastère de Gomati, le centre du bouddhisme à Khotan.\n$EFFECT_LIST_BULLET$Augmente le coût de cette [activity|El] de [gold_i|El]#V [GetPlayer.MakeScope.ScriptValue('RICE_tarim_basin_khotan_gomati_donation_cost')]#!\n$EFFECT_LIST_BULLET$Gain de [prestige_i|El] #V 150#! à la fin de cette [activity|El]\n$EFFECT_LIST_BULLET$Gagnez entre #V 25#! [dynasty_prestige|El] à la fin de cette [activity|El] si vous êtes de [rank|El] [king|El] ou [emperor|El], ou si vous avez un [piety_level|El] $piety_level_3$\n\n#weak Parmi les 14 Grands Monastères de Khotan (que les bouddhistes chinois appellent Da Sengjialan), Gomati est sans aucun doute le plus grand. Tous connaissent sa splendeur, et son rôle dans la procession annuelle de Khotan est inégalé. Il est juste que nous le soutenions.#!"
 RICE_tarim_basin_khotan_procession_donation_type:"Taille du don"
 RICE_tarim_basin_khotan_procession_donation_type_small: "Modeste"
 RICE_tarim_basin_khotan_procession_donation_type_small_desc:"$BULLET_WITH_TAB$Gain de [piety_i|El] #V 50#! à la fin de cette [activity|El]\n$BULLET_WITH_TAB$Chance plus faible d'obtenir un [modifier|El] de bénédiction des [eight_protectors_of_khotan|El]\n\n#weak Nous consacrerons un montant approprié de fonds et de ressources en tant que donation aux monastères bouddhistes de Khotan.#!"
 RICE_tarim_basin_khotan_procession_donation_type_medium:"Ample"
 RICE_tarim_basin_khotan_procession_donation_type_medium_desc:"$BULLET_WITH_TAB$Gain de [piety_i|El] #V 100#! à la fin de cette [activity|El]\n$BULLET_WITH_TAB$Chance décente d'obtenir un [modifier|El] de bénédiction des [eight_protectors_of_khotan|El]\n\n#weak Les monastères bouddhistes de Khotan travaillent dur pour que cette procession ait lieu, il est donc normal que nous leur fassions don d'une bonne somme.#!"
 RICE_tarim_basin_khotan_procession_donation_type_large: "Grand"
 RICE_tarim_basin_khotan_procession_donation_type_large_desc:"$BULLET_WITH_TAB$Gain de [piety_i|El] #V 150#! à la fin de cette [activity|El]\n$BULLET_WITH_TAB$Plus grande chance d'obtenir un [modifier|El] de bénédiction des [eight_protectors_of_khotan|El]\n\n#weak Afin d'acquérir un grand mérite, nous devrions donner autant que possible aux monastères de Khotan en cette occasion importante.#!"
 RICE_tarim_basin_khotan_procession_procession_phase: "Procession"
 RICE_tarim_basin_khotan_procession_procession_phase_desc:"La procession annuelle des images est en cours."
