 activity_RICE_tarim_basin_bezeklik_pilgrimage:0 "Pèlerinage aux grottes de Bezeklik"
 activity_RICE_tarim_basin_bezeklik_pilgrimage_desc:0 "$b_bezeklik$ abrite un vaste réseau de grottes creusées dans les montagnes, utilisées pour le culte des Bouddhas et d'autres êtres saints. Des personnes spirituellement dévotes viennent de près et de loin au fil des siècles pour prier et méditer dans ces grottes anciennes."
 activity_RICE_tarim_basin_bezeklik_pilgrimage_selection_tooltip:"Partir en [local_pilgrimage|El] à [GetTitleByKey('b_bezeklik').GetNameNoTier].\n\n$activity_RICE_tarim_basin_bezeklik_pilgrimage_context_tooltip$"
 activity_RICE_tarim_basin_bezeklik_pilgrimage_context_tooltip:0 "#emphasis Contexte historique :#! Les grottes de Bezeklik sont un complexe de grottes principalement bouddhistes situées à proximité de l'ancienne ville de Turfan. Ces grottes taillées dans la roche, souvent ornées de fresques bouddhistes, sont fortement associées aux bouddhistes ouïghours en tant que centre majeur de culte et de pèlerinage, bien qu'il existe des preuves d'utilisation par les manichéens également. Il est en fait possible que les grottes originales aient été plus largement utilisées par les manichéens, avant d'être supplantées par les bouddhistes après que les Ouïghours se soient détournés du manichéisme."
