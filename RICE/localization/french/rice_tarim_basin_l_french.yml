 activity_RICE_tarim_basin_ordam_mazar_host_an_a:0 "un"
 activity_RICE_tarim_basin_ordam_mazar:0 "Festival d'Ordam"
 activity_RICE_tarim_basin_ordam_mazar_desc:0 "Le festival organisé auprès du tombeau connu sous le nom d'#italic Ordam Mazar#! est une célébration importante pour de nombreux musulmans du [GetGeographicalRegion('world_steppe_tarim').GetName], centré sur la vie, la mort et les exploits du grand martyr qui apporta l'islam dans la région."
 activity_RICE_tarim_basin_ordam_mazar_selection_tooltip:"Assister au Festival d'Ordam.\n\n$RICE_tarim_basin_attend_ordam_mazar_festival_context_tooltip$"
 activity_RICE_tarim_basin_ordam_mazar_host_desc:"\n$BULLET_WITH_TAB$Gain de [piety_i|E] [piety|El]\n$BULLET_WITH_TAB$Gain de [prestige_i|E] [prestige|El]\n$BULLET_WITH_TAB$Gain du [character_modifier|El] [GetModifier('RICE_tarim_basin_attended_ordam_mazar').GetNameWithTooltip]\n$BULLET_WITH_TAB$[stress_loss_i|E] Perte de [stress|El] en fonction de l'[intent|El] que vous sélectionnez"
 activity_RICE_tarim_basin_ordam_mazar_guest_desc: "$activity_RICE_tarim_basin_ordam_mazar_host_desc$"
 activity_RICE_tarim_basin_ordam_mazar_province_desc:"L'Ordam Mazar se trouve à [GetTitleByKey('b_kashgar').GetNameNoTier]"
 activity_RICE_tarim_basin_ordam_mazar_destination_selection: "$activity_RICE_tarim_basin_ordam_mazar_province_desc$"
 activity_RICE_tarim_basin_ordam_mazar_guest_help_text: "$activity_RICE_tarim_basin_ordam_mazar$"
 activity_RICE_tarim_basin_ordam_mazar_predicted_cost:"Le coût de cette visite est principalement basé sur votre [income|El]."
 activity_RICE_tarim_basin_ordam_mazar_conclusion_desc:"Le [GetActivityType( 'activity_RICE_tarim_basin_ordam_mazar' ).GetName] est arrivé à son terme. Puissions-nous ne jamais oublier ceux qui ont tant sacrifié au nom de [GetPlayer.GetFaith.HighGodName] !"
 RICE_tarim_basin_ordam_mazar_tomb_upkeep_type:"Entretien du tombeau"
 RICE_tarim_basin_ordam_mazar_tomb_upkeep_type_none:"Aucune aide financière"
 RICE_tarim_basin_ordam_mazar_tomb_upkeep_type_none_desc:"$BULLET_WITH_TAB$Gain de [piety_i|El] #V 50#! à la fin de cette [activity|El]\n\n#weak L'Ordam Mazar a été entretenu par la communauté locale pendant longtemps. Ils font un travail admirable pour cette tâche importante, nous n'avons donc pas besoin de consacrer des fonds supplémentaires pour les aider.#!"
 RICE_tarim_basin_ordam_mazar_tomb_upkeep_type_modest:"Aide modeste"
 RICE_tarim_basin_ordam_mazar_tomb_upkeep_type_modest_desc:"$BULLET_WITH_TAB$Gain de [piety_i|El] #V 100#! à la fin de cette [activity|El]\n\n#weak Nous ne pouvons pas être de simples visiteurs de l'Ordam Mazar. Nous devrions profiter de cette occasion pour aider la communauté locale à l'entretenir, afin d'honorer les martyrs qui ont tant sacrifié.#!"
 RICE_tarim_basin_ordam_mazar_tomb_upkeep_type_substantial:"Aide substantielle"
 RICE_tarim_basin_ordam_mazar_tomb_upkeep_type_substantial_desc:"$BULLET_WITH_TAB$Gain de [piety_i|El] #V 150#! à la fin de cette [activity|El]\n\n#weak Les musulmans du monde entier sont humblement inspirés par le sacrifice de nos martyrs, et il est donc juste que nous fassions tout notre possible pour aider financièrement la communauté locale à entretenir l'Ordam Mazar.#!"
 RICE_tarim_basin_ordam_mazar_golden_bowl_type:"Bol d'Or"
 RICE_tarim_basin_ordam_mazar_golden_bowl_type_small:"Petite contribution"
 RICE_tarim_basin_ordam_mazar_golden_bowl_type_small_desc:"$BULLET_WITH_TAB$Gain de [prestige_i|El] #V 50#! à la fin de cette [activity|El]\n\n#weak Chaque visiteur du festival d'Ordam est tenu d'apporter de la nourriture à faire cuire dans un énorme chaudron, le Bol d'Or, à partager entre tous. J'apporterai la quantité de nourriture de base requise.#!"
 RICE_tarim_basin_ordam_mazar_golden_bowl_type_medium:"Contribution moyenne"
 RICE_tarim_basin_ordam_mazar_golden_bowl_type_medium_desc:"$BULLET_WITH_TAB$Gain de [prestige_i|El] #V 100#! à la fin de cette [activity|El]\n\n#weak Le Bol d'Or, où nous partageons collectivement la nourriture pendant le festival d'Ordam, est un élément important de cette célébration. Je ferai volontiers ma part en apportant beaucoup de nourriture.#!"
 RICE_tarim_basin_ordam_mazar_golden_bowl_type_large:"Grande contribution"
 RICE_tarim_basin_ordam_mazar_golden_bowl_type_large_desc:"$BULLET_WITH_TAB$Gain de [prestige_i|El] #V 150#! à la fin de cette [activity|El]\n\n#weak Les musulmans de près et de loin se sont rassemblés pour célébrer le festival d'Ordam, et la plupart apportent de la nourriture à partager dans le Bol doré communal. Je serais négligent de ne pas fournir beaucoup de nourriture pour tout le monde !#!"
 RICE_tarim_basin_ordam_mazar_festival_phase: "Festival"
 RICE_tarim_basin_ordam_mazar_festival_phase_desc: "Le festival d'Ordam est en cours, rassemblant des musulmans de près et de loin à [GetTitleByKey('b_kashgar').GetNameNoTier]."
 RICE_tarim_basin_ordam_mazar_remembrance_intent_header: "Souvenir :"
 RICE_tarim_basin_ordam_mazar_remembrance_intent: "Souvenir"
 RICE_tarim_basin_ordam_mazar_remembrance_intent_desc: "Vous voulez consacrer votre temps au festival d'Ordam pour réfléchir à des questions spirituelles et vous rapprocher de [GetPlayer.GetFaith.HighGodName]. Les personnages [GetTrait('zealous').GetName( GetNullCharacter )|U], [GetTrait('calm').GetName( GetNullCharacter )], [GetTrait('humble').GetName( GetNullCharacter )] et [GetTrait('just').GetName( GetNullCharacter )] peuvent perdre du [stress|El]."
 RICE_tarim_basin_ordam_mazar_socialization_intent_header: "Socialisation :"
 RICE_tarim_basin_ordam_mazar_socialization_intent: "Socialisation"
 RICE_tarim_basin_ordam_mazar_socialization_intent_desc: "Le festival d'Ordam est une occasion de rencontrer et de réseauter avec d'autres personnes, et d'élever votre statut dans la communauté musulmane locale. Les personnages [GetTrait('gregarious').GetName( GetNullCharacter )|U], [GetTrait('ambitious').GetName( GetNullCharacter )], [GetTrait('gluttonous').GetName( GetNullCharacter )] et [GetTrait('lustful').GetName( GetNullCharacter )] peuvent perdre du [stress|El]."
