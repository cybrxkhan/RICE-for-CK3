 tarim_basin.0050.t:0 "La Mort de Yitan"
 tarim_basin.0050.desc:0 "Il y a des décennies, mon oncle [yichao.GetFullName] a mené le peuple de Dunhuang pour renverser nos suzerains tibétains et restaurer la domination chinoise dans la région. Hélas, la dynastie Tang considère notre juste cause avec une suspicion méprisante ; ils ont conféré à notre entité politique le titre décevant de #italic Circuit Guiyi#!, ou « Retour à la Droiture », qui était habituellement attribué aux régimes barbares. De plus, nous avons dû envoyer mon père, [yitan.GetFirstName], à la cour des Tang en tant qu'otage.\n\nMalgré tout, nous avons gardé la tête haute. Malgré l'instabilité interne de la dynastie Tang et leur mépris de nos préoccupations concernant la situation précaire à la frontière du Gansu, nous devons coopérer avec eux pour protéger la frontière occidentale de l'Empire du Milieu.\n\nÀ présent, nous avons appris que mon père est décédé. C'est un événement tragique, bien sûr ; outre la perte d'un membre précieux de notre clan, nous avons également perdu notre principal émissaire en Chine."
 tarim_basin.0050.a:0 "Est-il même sage de continuer à rendre hommage à la cour des Tang ?"
 tarim_basin.0051.t:0 "Le destin du Circuit de Guiyi"
 tarim_basin.0051.desc:0 "Mon oncle [yichao.GetFirstName] propose de remplacer feu mon père comme otage du Circuit de Guiyi à Chang'an tandis que moi, [huaishen.GetFirstName], je gère nos affaires ici, car sa présence démontrera nos intentions sincères à la cour des Tang. Il me juge capable, mais je ne suis pas certain que ce soit la meilleure marche à suivre. Mon oncle a dirigé le Circuit de Guiyi avec compétence pendant des années, servant de ciment à notre unité. Je ne sais pas si je peux maintenir la paix comme il le fait - que pourraient faire les clans intrigants de Dunhuang en son absence ?\n\nJ'ai suggéré d'y aller à sa place, mais il pense que les Tang se méfieraient encore plus de nous si nous faisions ainsi. J'ai également évoqué la possibilité de n'envoyer personne. La cour des Tang néglige souvent nos demandes constantes d'aide, et se montre réticente ou incapable de répondre aux menaces que nous signalons sur la frontière occidentale. Avons-nous seulement besoin de leur aide ?"
 tarim_basin.0051.a:0 "Hélas, mon oncle a raison. Il doit se rendre à Chang'an."
 tarim_basin.0051.a.tooltip:0 "[yichao.GetFullName] ira à Chang'an et « disparaîtra » du jeu. Jusqu'à ce qu'il décède en Chine, il y a chaque année une forte chance que la cour des Tang envoie de l'aide telle que des [special_troops|El], de l'[gold|El], des [modifiers|El] positifs, et plus encore. Cependant, chaque clan chinois majeur à Dunhuang obtiendra une [unpressed_claim|El] sur le Circuit de Guiyi."
 tarim_basin.0051.b:0 "Nous avons besoin de mon oncle ici. Je serai l'otage à sa place."
 tarim_basin.0051.b.tooltip:0 "[huaishen.GetFullName] ira à Chang'an et « disparaîtra » du jeu, et [yichao.GetFullName] reprendra le contrôle du Circuit de Guiyi. Jusqu'à son décès en Chine, il y a chaque année une chance que la cour des Tang envoie de l'aide telle que des [special_troops|El], de l'[gold|El], des [modifiers|El] positifs, et plus encore. Cependant, ces bonus sont plus faibles et moins fréquents que si [yichao.GetFirstName] y va à sa place."
 tarim_basin.0051.c:0 "Oubliez les Tang décrépis - nous nous en passerons bien !"
 tarim_basin.0051.c.tooltip:0 "Personne n'ira à Chang'an, et [yichao.GetFullName] reprendra le contrôle du circuit de Guiyi. Bien que les Tang ne puissent agir contre vous, cela donnera une mauvaise image du circuit de Guiyi."
 tarim_basin.0052.t:0 "Le Destin du Circuit de Guiyi"
 tarim_basin.0052.desc:0 "Après que [yichao.GetFullName] eut rejeté le joug de l'Empire tibétain et rendu le corridor du Gansu à la domination chinoise, ses efforts pour restaurer l'ordre, faire respecter la justice et apporter la prospérité à la région sont admirés par beaucoup. Pourtant, la cour des Tang le considère avec suspicion ; ils ont même osé l'offenser en nommant ses territoires Guiyi, ou « Retour à la Vertu », un nom typiquement réservé aux vassaux barbares.\n\nNéanmoins, [yichao.GetFirstName] a sagement ravalé sa fierté et a fait de son mieux pour gagner les faveurs des Tang. Il a envoyé son frère [yitan.GetFirstName] comme otage pour démontrer la sincérité de ses intentions. Cependant, [yitan.GetFirstName] est décédé."
 tarim_basin.0052.desc.yeet_yichao:0 "\n\nSachant que le destin du Circuit de Guiyi repose sur de bonnes relations continues avec la cour des Tang, [yichao.GetFirstName] décida de remplacer son défunt frère comme otage à Chang'an. Il laisse son neveu [huaishen.GetFirstName] gouverner à sa place, le croyant capable. Cependant, avec le départ de [yichao.GetFirstName], les grands clans de Dunhuang pourraient avoir d'autres plans, car il était le ciment qui les maintenait tous ensemble. Hélas, [yichao.GetFirstName] est un vieil homme, à qui il ne reste plus beaucoup d'années..."
 tarim_basin.0052.desc.yeet_huaishen:0 "\n\nSachant que le destin du Circuit de Guiyi repose sur le maintien de bonnes relations avec la cour des Tang, [yichao.GetFirstName] avait initialement prévu de remplacer son défunt frère comme otage à Chang'an, et de laisser son neveu [huaishen.GetFirstName] aux commandes. Cependant, il a été convaincu de changer d'avis ; travailler avec les Tang est important, mais pas au prix d'un dirigeant aussi important que lui, c'est pourquoi il a choisi d'envoyer [huaishen.GetFirstName] à sa place. Les Tang pourraient voir cela avec suspicion, mais [yichao.GetFirstName] est nécessaire à Dunhuang pour maintenir la paix entre ses clans intrigants. Hélas, [yichao.GetFirstName] est un vieil homme, à qui il ne reste plus beaucoup d'années..."
 tarim_basin.0052.desc.yeet_no_one:0 "\n\n[yichao.GetFirstName] avait initialement prévu de se rendre à Chang'an pour remplacer son défunt frère en tant qu'otage, et de laisser son neveu [huaishen.GetFirstName] aux commandes. Cependant, on l'a convaincu de changer d'avis ; les Tang les méprisent, ne les considérant guère mieux que des bandits glorifiés, et les Tang n'ont que peu de pouvoir pour imposer quoi que ce soit. Le Circuit de Guiyi devra trouver sa propre destinée. Seul un grand dirigeant comme [yichao.GetFirstName] peut unir ses clans querelleurs sous une même vision. Hélas, [yichao.GetFirstName] est un vieil homme, à qui il ne reste plus beaucoup d'années..."
 tarim_basin.0052.a:0 "Qu'adviendra-t-il du circuit de Guiyi après son départ ?"
 tarim_basin.0052.tooltip.yes_hostage:0 "Parce que la famille Zhang a décidé d'envoyer un otage à la cour des Tang, jusqu'à la mort de Zhang Yichao, il y a chaque année une chance que la cour des Tang envoie de l'aide telle que des [special_troops|El], de l'[gold|El], des [modifiers|El] positifs, et plus encore."
 tarim_basin.0053.t:0 "xxxxx"
 tarim_basin.0053.desc:0 "xxxxx"
 tarim_basin.0053.a:0 "xxxxx"
 tarim_basin.0054.t:0 "La mort de Zhang Yichao"
 tarim_basin.0054.desc:0 "Le leadership héroïque de [yichao.GetFullNamePossessive] restera dans les mémoires pour des générations - cependant, il est désormais passé dans l'au-delà. En véritable défenseur de la civilisation chinoise, il mena le peuple du Circuit de Guiyi pour renverser les tyrans tibétains et restaurer leurs terres au profit de la dynastie Tang il y a des décennies. Hélas, un vide de pouvoir règne dans la région de Dunhuang, car certains doutent de ses successeurs.\n\nBien que les clans d'élite de Dunhuang viennent présenter leurs respects aux funérailles du défunt patriarche du clan Zhang, qu'ils servaient fidèlement, des rumeurs circulent selon lesquelles certains de ces clans comploteraient pour s'emparer eux-mêmes du contrôle du Circuit de Guiyi. Sans un chef charismatique pour guider le peuple, la région succombera-t-elle à l'anarchie et au désordre, ou un autre grand héros tel que Zhang Yichao s'avancera-t-il sur la scène de l'histoire mondiale ?"
 tarim_basin.0054.a:0 "Nous vivons une époque intéressante, cela ne fait aucun doute."
 tarim_basin.0054.tooltip:0 "Sans un défenseur puissant pour Guiyi, et avec la situation de plus en plus instable en Chine, le [ruler|El] du [kingdom|El] de Guiyi ne recevra plus aucun don ni bienfait de la Cour des Tang."
 tarim_basin.0055.t:0 "$tarim_basin.0054.t$"
 tarim_basin.0055.desc:0 "Des nouvelles sont arrivées de Chine : le grand [yichao.GetFullName] est décédé !\n\nLe leadership héroïque de [yichao.GetFullNamePossessive] sera célébré pendant des générations, car en véritable défenseur de la civilisation chinoise, il mena le peuple du Circuit de Guiyi pour renverser les tyrans tibétains et restaurer leur terre au service de la dynastie Tang. Il sacrifia même son pouvoir et son autorité afin de se rendre lui-même en otage à la cour des Tang pour maintenir de bonnes relations avec eux. Hélas, un vide de pouvoir règne dans la région de Dunhuang, car certains sont sceptiques quant à ses successeurs.\n\nBien que les clans d'élite de Dunhuang viennent présenter leurs respects aux funérailles du défunt patriarche du clan Zhang, qu'ils servaient fidèlement, des rumeurs circulent selon lesquelles certains de ces clans comploteraient pour s'emparer eux-mêmes du contrôle du Circuit de Guiyi. Sans un chef charismatique pour guider le peuple, la région succombera-t-elle à l'anarchie et au désordre, ou un autre grand héros comme Zhang Yichao s'avancera-t-il sur la scène de l'histoire mondiale ?"
 tarim_basin.0055.a:0 "$tarim_basin.0054.a$"
