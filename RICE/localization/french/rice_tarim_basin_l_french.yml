 tarim_basin.0090.t:0 "Vers les grottes sacrées"
 tarim_basin.0090.desc:0 "Pendant des siècles, les grottes de [GetTitleByKey('b_mogao').GetNameNoTier] ont été un témoignage de la gloire et de la vérité des enseignements profonds du Bouddha.\n\nDes générations d'hommes et de femmes [GetReligionByKey('buddhism_religion').GetAdjectiveNoTooltip]s ont gravé et sculpté leur piété et leur dévotion dans les parois de ces grottes, pour le bénéfice des êtres sensibles, et encore plus d'hommes et de femmes sont venus les visiter pour prier, méditer et contempler la sagesse et la compassion des Bouddhas et des Bodhisattvas.\n\nÀ présent, le temps est venu pour moi de me rendre dans ces grottes pour prier et méditer à mon tour."
 tarim_basin.0090.a:0 "J'ai hâte de vivre cette expérience religieuse !"
 tarim_basin.0091.t:0 "Arrivée"
 tarim_basin.0091.desc:0 "Je suis arrivé aux grottes de [GetTitleByKey('b_mogao').GetNameNoTier]. Déjà, je ressens un sentiment d'émerveillement en voyant les trous dans les falaises et les nombreux [ROOT.Char.GetFaith.GetAdherentNamePlural] dévots s'affairant de-ci de-là comme des fourmis.\n\nJe sais qu'à l'intérieur de ces grottes se trouvent des merveilles encore plus grandes. Mais pour l'instant, nous devons nous reposer pour la nuit en ville avant de pouvoir pénétrer dans les grottes."
 tarim_basin.0091.a:0 "Au petit matin, nous irons dans les grottes."
 tarim_basin.0092.t:0 "Prière, dévotion et émerveillement"
 tarim_basin.0092.desc:0 "J'ai pénétré dans les grottes de [GetTitleByKey('b_mogao').GetNameNoTier], et tout ce à quoi je peux penser est - quelle gloire ; quelle gloire suprême ; quelle gloire insurpassable est le Seigneur Bouddha et ses enseignements !\n\nIl y a ici autant de grottes qu'il y a de gens, semble-t-il, et chacune est remplie de toutes sortes d'œuvres d'art merveilleusement ouvragées - des peintures anciennes et nouvelles sur les murs, des statues finement sculptées, et l'agréable odeur omniprésente d'encens et d'offrandes de nourriture, apportées tant par les monastiques locaux que par les visiteurs, et les pèlerins venus de plus loin.\n\nDans ces grottes, au milieu de cet art illuminant, je prie, je médite, et je réfléchis aux enseignements du Bouddha sur le samsara. Il y a de nombreuses grottes à visiter, et en particulier, je m'intéresse aux grottes qui représentent..."
 tarim_basin.0092.a:0 "Inspirant les dévots qui les ont sculptées il y a bien longtemps"
 tarim_basin.0092.b:0 "Les délicieux contes [Glossary( 'jataka', 'JATAKA_GLOSS' )] qui nous enseignent tant"
 tarim_basin.0092.c:0 "De plaisantes représentations des Bouddhas et des Bodhisattvas"
 tarim_basin.0093.t:0 "Visite de ma grotte"
 tarim_basin.0093.desc:0 "Pendant mon séjour ici, aux grottes de [GetTitleByKey('b_mogao').GetNameNoTier], j'ai également décidé de visiter la grotte que j'avais moi-même commanditée il y a bien longtemps.\n\nJe souris légèrement en revoyant la grotte. C'est un spectacle merveilleux, n'est-ce pas ? L'artisanat et la beauté exposés, tout en l'honneur du Bouddha, du Dharma et du Sangha, ne sont pas à dédaigner."
 tarim_basin.0093.a:0 "Que [ROOT.Char.GetFaith.HighGodName] continue de me guider."
 tarim_basin.0094.t:0 "Conclusion"
 tarim_basin.0094.desc:0 "Enfin, ma visite des grottes de [GetTitleByKey('b_mogao').GetNameNoTier] est arrivée à son terme. Ce fut un voyage inspirant, de contempler la beauté de ces grottes, et je suis reconnaissant d'avoir eu le bon karma de naître pour apprendre et apprécier les sublimes doctrines [ROOT.Char.GetFaith.GetAdjectiveNoTooltip]s au cours de cette vie. Les grottes ici sont, peut-être, l'un des plus grands reflets de telles doctrines que j'aie jamais vus."
 tarim_basin.0094.a:0 "Puissent mes actes ici bénéficier à tous les êtres sensibles."
