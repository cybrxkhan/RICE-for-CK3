 tarim_basin.0177.t:0 "L'Islam à Khotan"
 tarim_basin.0177.desc:0 "Pendant de nombreuses années, ceux qui croient en [ROOT.Char.GetFaith.GetReligion.GetName] ont regardé [khotan.GetNameNoTier] avec suspicion et dédain, car nombre des dirigeants infidèles de la cité se sont révélés être une épine majeure dans le pied des justes dirigeants [ali_arslan.GetFaith.GetReligion.GetAdherentNamePlural] de la région.\n\nMaintenant que [ali_arslan.GetTitledFirstName] est devenu le premier dirigeant [ali_arslan.GetFaith.GetReligion.GetAdherentName] de [khotan.GetNameNoTier], de nombreux fidèles dévots de [ali_arslan.GetFaith.GetReligion.GetName] en Asie centrale célèbrent cet accomplissement. Fait intéressant, des légendes ont déjà commencé à se répandre sur la façon dont [ali_arslan.GetSheHe] a combattu ou surpassé en ruse les redoutables et vicieux infidèles, ou sur la façon dont [ali_arslan.GetSheHe] a été guidé par nul autre que Saint Gabriel lui-même."
 tarim_basin.0177.a:0 "Telle est la volonté de [ROOT.Char.GetFaith.HighGodName]."
 tarim_basin.0177.tooltip:0 "Après le décès d'[ali_arslan.GetTitledFirstName], les [rulers|El] [ali_arslan.GetFaith.GetReligion.GetAdherentNamePlural] du [county|El] de [kashgar.GetNameNoTier] auront accès à une [decision|El] pour #V $RICE_tarim_basin_construct_ordam_mazar$#!, ce qui débloquera à son tour la [decision|El] pour les [rulers|El] [ali_arslan.GetFaith.GetReligion.GetAdherentNamePlural] voisins de #V $RICE_tarim_basin_attend_ordam_mazar_festival$.#!"
 tarim_basin.0178.t:0 "xxxxx"
 tarim_basin.0178.desc:0 "xxxxx"
 tarim_basin.0178.a:0 "xxxxx"
 tarim_basin.0179.t:0 "La mort d'un martyr légendaire"
 tarim_basin.0179.desc:0 "La mort récente de [ali_arslan.GetTitledFirstName] est pleurée par de nombreux fidèles de l'[islam_religion.GetName] en Asie centrale. Que [ali_arslan.GetFirstName] ait été un vrai croyant ou non, il ne fait aucun doute qu'en tant que premier dirigeant [islam_religion.GetAdherentName] de [khotan.GetNameNoTier] - du moins lorsqu'[ali_arslan.GetSheHe] est arrivé[ali_arslan.Custom('FR_E')] au pouvoir dans la ville - il a joué un rôle majeur dans l'histoire religieuse du bassin du Tarim.\n\nEn conséquence, de nombreux habitants [islam_religion.GetAdherentNamePlural] ont commencé à exagérer sa vie et ses accomplissements, affirmant qu'[ali_arslan.GetSheHe] était un grand martyr qui a vaincu de nombreux infidèles cruels au combat.\n\nPour diverses raisons, un petit mausolée dédié à [ali_arslan.GetFirstName] vient d'être construit dans la ville voisine de [kashgar.GetNameNoTier], et il devient rapidement un lieu de pèlerinage local. Peut-être qu'un dirigeant local ambitieux pourrait même agrandir cette tombe et en faire quelque chose de spécial."
 tarim_basin.0179.a:0 "Ainsi soit-il."
 tarim_basin.0179.tooltip:0 "Les [rulers|El] [islam_religion.GetAdherentNamePlural] du [county|El] de [kashgar.GetNameNoTier] auront accès à une [decision|El] pour #V $RICE_tarim_basin_construct_ordam_mazar$#!, qui à son tour débloque la [decision|El] pour les [rulers|El] [islam_religion.GetAdherentNamePlural] voisins de #V $RICE_tarim_basin_attend_ordam_mazar_festival$#!."
