 tarim_basin.0150.t:0 "Préparation de la procession"
 tarim_basin.0150.desc:0 "Depuis que le [ROOT.Char.GetFaith.GetReligion.GetName] est arrivé à [khotan.GetNameNoTier], les dévots [ROOT.Char.GetFaith.GetReligion.GetAdherentNamePlural] vivant dans la cité - sous la direction des monastères de la ville - organisent chaque année une procession d'images durant quatorze jours. Tous y participent, des plus grands souverains aux plus humbles des mendiants.\n\nLa légende raconte que lorsque le Bouddha se rendit sur le site actuel de [khotan.GetNameNoTier], il chargea huit êtres éveillés de veiller sur la cité. On dit qu'ils protégeraient la ville tant que son peuple resterait fidèle aux enseignements du Bouddha et les pratiquerait avec ferveur. Ainsi, les [ROOT.Char.GetFaith.GetAdherentNamePlural] de la région comme moi-même ont le devoir de prendre part à des cérémonies telles que la procession annuelle, afin de s'assurer que la lumière du [ROOT.Char.GetFaith.GetReligion.GetName] ne s'éteigne jamais en ces terres.\n\nCette année, j'ai formé le vœu de participer à ce grand événement, et de contempler la gloire qu'est [khotan.GetNameNoTier] [ROOT.Char.GetFaith.GetReligion.GetAdjective] !"
 tarim_basin.0150.a:0 "Il est temps de me préparer pour l'occasion."
 tarim_basin.0151.t:0 "Il est presque temps de commencer"
 tarim_basin.0151.desc.intro:0 "[khotan.GetNameNoTier] est en pleine effervescence ! Les gens s'affairent partout pour préparer la procession annuelle, car demain tout commencera."
 tarim_basin.0151.desc.not_khotan_ruler:0 "\n\nBien que je ne fasse pas partie de l'élite dirigeante de [khotan.GetNameNoTier], je suis tout de même reconnu comme une personne d'une certaine importance, aussi suis-je accueilli gracieusement avec les autres invités de marque par [khotan_ruler.GetTitledFirstName], le dirigeant de [khotan.GetNameNoTier]. Nous discutons tous brièvement du programme de l'événement du lendemain avant de nous retirer pour la nuit."
 tarim_basin.0151.desc.khotan_ruler:0 "\n\nEn tant que souverain de [khotan.GetNameNoTier], j'aurai d'importantes responsabilités durant la procession elle-même. En attendant, j'accueille quelques invités éminents venus de loin pour assister à l'occasion. Nous discutons brièvement du programme de l'événement du lendemain avant de nous retirer pour la nuit."
 tarim_basin.0151.a:0 "Demain sera un grand jour, n'en doutons pas."
 tarim_basin.0152.t:0 "La procession annuelle commence"
 tarim_basin.0152.desc.intro:0 "Le jour que nous attendions tous est enfin arrivé ! La procession annuelle des images a commencé à [khotan.GetNameNoTier]. Chaque jour, pendant les deux prochaines semaines, l'un des quatorze grands monastères de la région apportera des images sacrées du Bouddha et d'autres êtres éveillés dans la ville, au sommet de chars magnifiquement ornés."
 tarim_basin.0152.desc.not_khotan_ruler:0 "\n\nJe me tiens dehors devant les portes de la ville avec d'autres notables venus pour l'occasion, et j'observe la première procession, venue de Gomati, le plus grand et le plus estimé des monastères de [khotan.GetNameNoTier], qui arrive en grande pompe. À la tête de cette assemblée se trouve [khotan_ruler.GetTitledFirstName], qui, en tant que souverain[khotan_ruler.Custom('FR_E')] de [khotan.GetNameNoTier], doit formellement recevoir chaque procession comme le veut la tradition.\n\nUne fois que le chariot arrive à la porte, nous regardons [khotan_ruler.GetFirstName] s'avancer, pieds nus. [khotan_ruler.GetSheHe|U] retire sa couronne et se prosterne devant les images et fait des offrandes, avant que le reste d'entre nous ne fasse de même. Ensuite, les femmes de la maisonnée de [khotan_ruler.GetFirstNamePossessiveNoTooltip] se tiennent sur les portes de la ville pour couvrir les chariots de fleurs à leur entrée dans la ville - un spectacle céleste !"
 tarim_basin.0152.desc.khotan_ruler:0 "\n\nJe me tiens dehors devant les portes de la cité aux côtés de notables venus pour l'occasion, et j'observe la première procession, venue de Gomati, le plus grand et le plus estimé monastère de [khotan.GetNameNoTier], arriver en grande pompe. En tant que souverain[ROOT.Char.Custom('FR_E')] de [khotan.GetNameNoTier], il est de mon devoir de recevoir formellement chaque procession - telle est la tradition depuis aussi longtemps que quiconque s'en souvienne.\n\nUne fois que le chariot arrive à la porte, je m'avance, pieds nus. J'ôte ma couronne et me prosterne devant les images et fais des offrandes, avant que tous suivent mon exemple. Ensuite, les femmes de ma maisonnée se tiennent sur les portes de la cité pour couvrir les chariots de fleurs à leur entrée dans la ville - un spectacle céleste !"
 tarim_basin.0152.a:0 "Une belle entrée en matière pour cette occasion."
 tarim_basin.0153.t:0 "Fin de la procession annuelle"
 tarim_basin.0153.desc:0 "Ces quatorze derniers jours sont passés en un éclair, mais telle est la nature de l'impermanence enseignée par le Bouddha - rien ne peut durer éternellement. La vie normale reprend son cours à [khotan.GetNameNoTier], pour ainsi dire.\n\nLa dernière des processions est terminée, et l'effervescence à [khotan.GetNameNoTier] s'est apaisée. La célébration de cette année a été considérée comme un franc succès ; l'espoir, comme toujours, est que les mérites que nous avons acquis en organisant et en participant à ces cérémonies apporteront de nombreuses et grandes bénédictions, tant à [khotan.GetNameNoTier] elle-même qu'à tous ceux qui y ont participé."
 tarim_basin.0153.a:0 "Je suis heureu[ROOT.Char.Custom('FR_XSe')] d'avoir pu participer à la procession annuelle !"
 tarim_basin.0154.t:0 "Huit Protecteurs"
 tarim_basin.0154.desc:0 "Quiconque vit à [khotan.GetNameNoTier] ou y est passé, et suit les enseignements [ROOT.Char.GetFaith.GetReligion.GetAdherentNamePlural], a entendu parler des Huit Protecteurs ou des Huit Rois Gardiens de Khotan.\n\nAinsi ai-je entendu... Il y a très longtemps, lorsque le Seigneur Bouddha visita Khotan, il prophétisa qu'un jour s'y trouverait un royaume où le Dharma prospérerait. Pour s'assurer qu'il continuerait à perdurer et à prospérer en tant que grand royaume bouddhiste, le Bouddha demanda à huit divinités de le protéger. Leurs noms sont Aparajita, Samjnaya, Gaganasvara, Suvarnamala, Grhavatapta, Amgusa, Sthanavati et Vaisravana.\n\nLa présence de ces divinités se retrouve partout, et il n'en va pas autrement en ce temps où la procession annuelle a lieu. Des statues et fresques sur les murs des temples et monastères représentant ces Huit divinités, aux prières murmurées sur les lèvres de tous les pieux bouddhistes de la cité, je sens qu'ils veillent sur nous, même en cet instant."
 tarim_basin.0154.a:0 "D'une certaine manière, c'est une source d'inspiration."
 tarim_basin.0155.t:0 "Le cerf de l'illumination"
 tarim_basin.0155.desc:0 "En explorant le paysage religieux de [khotan.GetNameNoTier] (surtout durant la procession annuelle d'images de la ville comme celle-ci), j'ai l'occasion de visiter certains des beaux monastères de la ville. Le plus remarquable d'entre eux est #bold Gomati#!, le monastère royal de la ville, qui a la capacité d'héberger plusieurs milliers de moines et dont la fondation est enveloppée de légende.\n\nAinsi ai-je entendu... Il y a longtemps, il y avait un roi de Khotan nommé Vijaya Virya, qui vit un jour une lumière brillante venant de l'extérieur. Il voyagea dans les terres sauvages pour enquêter sur la source de la lumière, et découvrit que la lumière émanait d'un cerf. Celui-ci se transforma immédiatement en l'esprit #italic yaksha#! Samjnaya, l'un des Huit Protecteurs de Khotan, qui ordonna au roi de bâtir un monastère à cet endroit afin qu'il puisse recevoir un enseignement sur le #italic Dharma#! de la part de plusieurs #italic arhats#!.\n\nJe ne peux que soupirer d'émerveillement en songeant à toutes les choses miraculeuses qui se sont produites ici."
 tarim_basin.0155.a:0 "Une ville véritablement bénie."
 tarim_basin.0156.t:0 "Vimalaprabha"
 tarim_basin.0156.desc:0 "Lors de la procession annuelle des images de [khotan.GetNameNoTier], pour s'inspirer à accomplir de plus grands actes de mérite, beaucoup de gens racontent des histoires sur l'héritage de dirigeants pieux et vertueux de la cité, tels que certains rois ou moines. Bien que nombre d'entre eux soient des hommes, cela ne signifie pas qu'il n'y ait pas de femmes vertueuses à imiter - la plus connue est sans doute Vimalaprabha, dont le culte est populaire ici.\n\nAinsi ai-je entendu... Vimalaprabha est en fait un #italic Bodhisattva#! féminin et une divinité protectrice, qui souhaitait renaître encore et encore sous la forme de différentes femmes qui aideraient Khotan en temps de besoin. Plus célèbre encore, elle renaquit un jour sous les traits de la princesse khotanaise Praniyata, qui s'exila lorsque les Tibétains - ennemis du bouddhisme à l'époque - conquirent et saccagèrent Khotan. La princesse conduisit son peuple en sécurité malgré la lâcheté de son frère le roi, et aspira à ce que la Chine vienne en aide à Khotan.\n\nDe telles histoires nous enseignent clairement que, peu importe que l'on soit homme ou femme, chacun peut accomplir des actes méritoires et sauver autrui."
 tarim_basin.0156.a:0 "Vimalaprabha est une inspiration pour nous tous !"
 tarim_basin.0157.t:0 "Drainage du lac"
 tarim_basin.0157.desc:0 "La procession annuelle des images à [khotan.GetNameNoTier] m'offre l'occasion d'explorer les terres autour de la cité. C'est sans aucun doute une oasis du désert, mais cela n'a pas toujours été le cas, si l'on en croit les légendes.\n\nAinsi ai-je entendu... Quand Khotan n'avait pas encore été fondée, et que ce n'était encore qu'une étendue sauvage et vide, le Bouddha visita le site de la future cité, qui avait été béni par les Bouddhas des éons précédents. À l'époque, il n'y avait rien d'autre qu'un grand lac. Le Bouddha bénit la région, asséchant le lac et transformant le tout en la belle terre qui est aujourd'hui Khotan.\n\nJ'ai entendu plusieurs variantes de cette légende, mais les points essentiels demeurent. Que la légende soit vraie ou non, peu peuvent nier que la cité se trouve en un lieu propice !"
 tarim_basin.0157.a:0 "Après tout, c'est ainsi qu'elle est devenue un centre religieux."
 tarim_basin.0158.t:0 "Le fils d'Ashoka"
 tarim_basin.0158.desc:0 "Alors que la procession d'images se poursuit à [khotan.GetNameNoTier], je réfléchis à l'histoire et aux légendes bouddhistes de la ville.\n\nAinsi ai-je entendu... Il y a longtemps, la ville fut fondée par un certain Kustana, fils d'Ashoka, le grand empereur bouddhiste d'Inde. Lorsqu'une prophétie annonça que le garçon deviendrait roi du vivant de son père, Ashoka, craignant que son fils ne soit une menace, l'abandonna dans le bassin du Tarim. Le jeune enfant fut allaité par un sein de terre, puis adopté par un roi chinois qui avait prié la divinité Vaisravana, protecteur des enseignements bouddhistes, pour avoir un fils. Après une série d'événements, Khotan fut peuplée par des Indiens et des Chinois menés par Kustana.\n\nQuoi qu'il en soit, ce n'est là qu'une version de la légende sur la fondation de Khotan que j'ai entendue."
 tarim_basin.0158.a:0 "Qui sait si c'est vrai ou non ?"
 tarim_basin.0159.t:0 "La princesse de la soie"
 tarim_basin.0159.desc:0 "Je rends visite à l'un des nombreux grands monastères de [khotan.GetNameNoTier] durant la procession annuelle des images. Je remarque comment l'un d'eux dépeint une légende concernant la Princesse de la Soie et le monastère de Mashe, un autre grand monastère. La légende est populaire, et je l'ai vue représentée dans de nombreux monastères.\n\nAinsi ai-je entendu... Il y a des siècles, un roi khotanais voulait percer le secret de la fabrication de la soie, mais celui-ci était jalousement gardé par les autorités chinoises. Lorsqu'il épousa une princesse chinoise, il la convainquit de l'aider à atteindre cet objectif, et elle cacha des graines de mûrier et des œufs de vers à soie dans ses cheveux lorsqu'elle traversa la frontière. Avant d'arriver dans la ville de Khotan, elle déposa les graines et les œufs sur un site qui deviendrait plus tard le monastère de Mashe.\n\nQui sait si cette légende est vraie ! Mais c'est assurément une histoire que beaucoup de locaux trouvent intéressante."
 tarim_basin.0159.a:0 "C'est ce que j'ai entendu, c'est ce que j'ai entendu."
 tarim_basin.0160.t:0 "La colline de Gautośan"
 tarim_basin.0160.desc:0 "Passer du temps à [khotan.GetNameNoTier] durant la procession annuelle des images me permet de mieux apprécier l'histoire religieuse et les légendes de la cité. On dit que l'emplacement de la ville a été béni non seulement par le Bouddha, mais aussi par d'autres Bouddhas précédents, selon de nombreuses histoires.\n\nAinsi ai-je entendu... Dans le passé, un enfant se perdit près de Gomati, le plus grand monastère de la cité. Le roi, inquiet, mena de nombreuses personnes à la recherche de l'enfant dans les environs, et ils découvrirent par hasard une petite vallée près de la colline de Gautośan. Ils furent émerveillés de découvrir un #italic stûpa#! contenant des reliques de Kasyapa, le dernier Bouddha avant le Bouddha historique. Reconnaissant la nature sacrée du lieu, le roi ordonna la construction de ce qui est aujourd'hui connu sous le nom de monastère de Gautośan.\n\nEn tant que principaux monastères khotanais, Gomati et Gautośan seraient le lieu de nombreux signes célestes et miracles, il n'est donc guère surprenant qu'ils possèdent une histoire aussi merveilleuse."
 tarim_basin.0160.a:0 "C'est une bonne chose qu'ils soient encore là pour que nous puissions les visiter à notre époque."
 tarim_basin.0161.t:0 "Les miraculeuses statues volantes"
 tarim_basin.0161.desc:0 "Des histoires de statues miraculeuses et volantes se font entendre partout à [khotan.GetNameNoTier], au point que je ne sais plus lesquelles sont fausses et lesquelles sont authentiques.\n\nAinsi ai-je entendu... Parce que Khotan se trouve sur une terre propice, des statues miraculeuses de Bouddhas et d'autres divinités voleraient de l'Inde jusqu'à Khotan de temps à autre. L'une des plus remarquables était la statue dite d'Udayana. Le jeune roi Udayana était un fidèle disciple et contemporain du Bouddha, qui fit sculpter une statue du Bouddha en bois de santal. Cette statue acquit des capacités miraculeuses, comme s'incliner devant le Bouddha ou engager un dialogue avec lui. Elle finit par s'envoler vers un lieu proche de Khotan connu sous le nom de Pimo, et à ce jour, Pimo reste un lieu de pèlerinage populaire pour les habitants.\n\nJ'ai la chance d'avoir trouvé l'occasion de visiter rapidement Pimo même durant cette période."
 tarim_basin.0161.a:0 "Si seulement j'avais été en vie pour voir le Bouddha à l'époque."
