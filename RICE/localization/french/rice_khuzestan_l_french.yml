 activity_RICE_khuzestan_tomb_of_daniel_pilgrimage_desc:0 "Daniel est une figure religieuse importante pour ceux qui suivent les [faiths|El] abrahamiques. La [daniels_tomb|El] se trouverait à Šuš, c'est pourquoi de nombreuses personnes de la région s'y rendent pour lui rendre hommage."
