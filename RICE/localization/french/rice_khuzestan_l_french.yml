 # Legends
 RICE_khuzestan_legend_new_title_name: "La Renaissance du Khuzi"
 RICE_khuzestan_legend_new_title_desc:"Autrefois dénigrés, considérés comme de simples serviteurs de leurs supérieurs, les [culture.GetCollectiveNoun|l] ont repris confiance et ont formé un puissant royaume grâce à [founder.GetName]."
 RICE_khuzestan_legend_chapter_opening_new_title:"Il fut un temps où les [GetCultureByKey('khuzi').GetCollectiveNounNoTooltip|l] étaient considérés comme la plus vile des racailles, dignes seulement de servir leurs supérieurs. Il faudra les efforts de [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] pour élever les [GetCultureByKey('khuzi').GetCollectiveNounNoTooltip|l] et leur permettre d'accomplir leur destin en tant que maîtres du [ROOT.Legend.GetProperty( 'title' ).Title.GetBaseNameNoTooltip]."
 RICE_khuzestan_legend_chapter_motivation_new_title:"Issu de leur propre communauté, [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] comprenait véritablement les souffrances et les peines des [GetCultureByKey('khuzi').GetCollectiveNounNoTooltip|l]. Au plus profond de son cœur, [ROOT.Legend.GetProtagonist.GetSheHe] savait qu'[ROOT.Legend.GetProtagonist.GetSheHe] pouvait accomplir tant de choses, comme ses illustres ancêtres, les [ROOT.Legend.GetProperty('culture').Culture.GetCollectiveNounNoTooltip|l], avaient dû le faire il y a bien longtemps."
 RICE_khuzestan_legend_chapter_famous_deed_new_title:"Avec un cœur dévoué et un esprit inébranlable, et sans aucun doute les bénédictions de [ROOT.Legend.GetProtagonist.GetFaith.HighGodName], [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] chercha à élever la communauté [GetCultureByKey('khuzi').GetNameNoTooltip]. Par des exploits héroïques tels que l'élimination de bandits scélérats et de bêtes cruelles, et par des prouesses d'esprit et de ruse qui impressionnèrent les petits seigneurs de guerre qui parsemaient la région, [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] fut finalement proclamé[ROOT.Legend.GetProtagonist.Custom('FR_E')] souverain[ROOT.Legend.GetProtagonist.Custom('FR_E')] des [GetCultureByKey('khuzi').GetCollectiveNounNoTooltip|l]."
 RICE_khuzestan_legend_chapter_extra_deed_new_title:"Certains s'accrochaient encore à leurs anciens préjugés et se moquaient des [GetCultureByKey('khuzi').GetCollectiveNounNoTooltip|l] et de leur nouv[ROOT.Legend.GetProtagonist.Custom('FR_EauElle')] souverain[ROOT.Legend.GetProtagonist.Custom('FR_E')]. On raconte que quelqu'un dit à [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] qu'[ROOT.Legend.GetProtagonist.GetSheHe] avait simplement ramassé une couronne dans le caniveau. En réponse, [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] répondit : «J'ai trouvé ma couronne dans le caniveau, et [ROOT.Legend.GetProtagonist.GetFaith.HighGodName] l'a mise sur ma tête. »"
 RICE_khuzestan_legend_chapter_conclusion_new_title:"Les territoires du [ROOT.Legend.GetProperty( 'title' ).Title.GetBaseNameNoTooltip] que [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] dirigeait prospéreraient pendant des générations et des générations à venir. Quoi qu'il advienne des [GetCultureByKey('khuzi').GetCollectiveNounNoTooltip|l] et de leurs descendants, ils se souviendraient à jamais de [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] comme c[ROOT.Legend.GetProtagonist.Custom('FR_EluiElle')] qui les avait délivrés des ténèbres pour les mener vers la lumière."


 # Game Concepts
 game_concept_daniels_tomb:0 "Tombeau de Daniel"
 game_concept_pilgrimage_to_daniels_tomb:0 "Pèlerinage au tombeau de Daniel"
 game_concept_pilgrimage_to_the_tomb_of_daniel:0 "Pèlerinage au tombeau de Daniel"
 game_concept_tomb_of_daniel:0 "Tombeau de Daniel"
 game_concept_tomb_of_daniel_desc:0 "Plusieurs sites revendiquent d'abriter le tombeau du personnage biblique Daniel. La ville de Šuš, située dans le [county|El] de $c_tustar$ dans le jeu, est traditionnellement considérée comme ayant la revendication la plus forte.\n\nLes personnages juifs, chrétiens et musulmans proches de $c_tustar$ peuvent ainsi entreprendre un [GetActivityType( 'activity_RICE_khuzestan_tomb_of_daniel_pilgrimage' ).GetName]. Outre les bonus habituels d'un [local_pilgrimage|El], les pèlerins peuvent également obtenir un [character_modifier|El] bénéfique, [GetModifier('RICE_khuzestan_daniel_pilgrimage_done').GetNameWithTooltip].\n\nLe [ruler|El] de $c_tustar$ a également accès à une [decision|El] pour #V $RICE_khuzestan_rebury_daniel$#!. Prendre cette [decision|El] augmentera le bonus de [piety|El] fourni par le pèlerinage, et étendra la portée géographique des personnes pouvant l'entreprendre."
 game_concept_khila_ceremony:0 "Cérémonie de la Khil'a"
 game_concept_khila:0 "Khil'a"
 game_concept_tiraz:0 "Tiraz"
 game_concept_tiraz_desc:0 "Le tiraz est un style de tissu brodé très prisé dans les sociétés islamiques en raison de son importance politique et culturelle.\n\nLes [rulers|El] islamiques ont accès à une [character_interaction|El] pour #bold $RICE_khuzestan_gift_tiraz_robes$#! à d'autres musulmans, ce qui accorde divers bonus aux deux parties. Une particularité de cette [interaction|El] est qu'elle n'est initialement disponible que pour les califes (c.-à-d. les [heads_of_faith|El] islamiques), les [emperors|El] et les [kings|El] ; un [duke|El] peut y accéder une fois que sa culture est dans l'[era|El] du haut Moyen Âge, et les [counts|El] dans l'[era|El] du Moyen Âge central.\n\nPosséder un $building_type_RICE_tiraz_factories_01$ peut aider à réduire le coût de cette [interaction|El]."

