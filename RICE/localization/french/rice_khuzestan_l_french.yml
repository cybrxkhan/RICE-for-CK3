 khuzestan.0030.t:0 "Se préparer à Parwanaya"
 khuzestan.0030.desc:0 "Parwanaya est l'une des fêtes les plus importantes pour nous, les [mandean.GetAdherentNamePlural], car c'est un moment où les ténèbres n'ont aucune emprise sur la terre. Cette festivité est toujours célébrée durant les cinq jours qui ne sont associés à aucun autre mois, qui viennent après la fin de #italic Shumbulta#!, le huitième mois de notre calendrier religieux. À chacun de ces cinq jours, nous honorons [mandean.HighGodName] et les cinq jours de la création.\n\nCette année, j'espère organiser une célébration grandiose et splendide de cette fête ! Je vais donc devoir rassembler la communauté [mandean.GetAdjective] locale pour travailler ensemble afin que cela soit possible. Les [mandean.PriestNeuterPlural] m'ont dit que pour s'assurer que tout se déroule sans encombre, ils consulteront le #italic Rouleau de la Parwanaya#! et le #italic Rouleau des Ancêtres#!, deux de nos textes sacrés qui fournissent les instructions pour les rituels à accomplir durant Parwanaya."
 khuzestan.0030.a:0 "Ne perdons pas de temps !"
 khuzestan.0031.t:0 "Début du Parwanaya"
 khuzestan.0031.desc:0 "Parwanaya approche ! Je me suis rassemblé avec la communauté [mandean.GetAdjective] locale pour célébrer cette grande fête, traditionnellement l'une de nos plus importantes, car elle commémore les cinq jours durant lesquels la Première Lumière créa le monde.\n\nC'est un temps d'observance religieuse et de dévotion, et chacun est vêtu de blanc. C'est aussi un moment où nous ne mangeons pas de viande – à l'exception des moutons rituellement sacrifiés pour les morts – et où nous ne portons pas de peaux d'animaux morts aux pieds, si bien que certains d'entre nous portent des sandales, tandis que d'autres marchent pieds nus."
 khuzestan.0031.a:0 "J'irai pieds nus !"
 khuzestan.0031.b:0 "Je porterai des sandales."
 khuzestan.0032.t:0 "Parwanaya: premier jour"
 khuzestan.0032.desc:0 "Le premier jour de Parwanaya est dédié au Père de tous les Mondes, le Roi de Lumière, la Première Lumière, #italic Hayya Rabbi#!. C'est Lui qui a créé tous les anges, les hommes et le monde matériel.\n\nTandis que les [mandean.PriestNeuterPlural] nous aident à accomplir les divers rituels, comme les baptêmes, tout le monde est d'humeur optimiste. Ces cinq jours sont des commémorations de la lumière, et du bien qu'a fait la Première Lumière. Aucune ténèbre ni nuit ne s'y trouve."
 khuzestan.0032.a:0 "Un bon début !"
 khuzestan.0033.t:0 "Parwanaya: deuxième jour"
 khuzestan.0033.desc:0 "Le deuxième jour de Parwanaya est dédié au moment où la Première Lumière, le Seigneur de la Majesté Céleste, s'est créée elle-même."
 khuzestan.0033.a:0 "Louons la Première Lumière qui s'est créée elle-même !"
 khuzestan.0034.t:0 "Parwanaya: troisième jour"
 khuzestan.0034.desc:0 "Le troisième jour de Parwanaya est dédié au moment où la Première Lumière créa la Connaissance de la Vie ; en elle, Il se créa Lui-même."
 khuzestan.0034.a:0 "Louons la Connaissance de la Vie !"
 khuzestan.0035.t:0 "Parwanaya: quatrième jour"
 khuzestan.0035.desc:0 "Le quatrième jour de Parwanaya est dédié à la manifestation de la Première Lumière qui est Dmuth-Kusta ; en elle, Il se créa Lui-même."
 khuzestan.0035.a:0 "Louons la Première Lumière qui est Dmuth-Kusta !"
 khuzestan.0036.t:0 "Parwanaya: cinquième jour"
 khuzestan.0036.desc:0 "Le cinquième jour de Parwanaya est le jour des Commémorations, lorsque les ruisseaux furent distribués par la Première Lumière, car Lui, Diviseur des ruisseaux, se créa Lui-même en eux."
 khuzestan.0036.a:0 "Louons la Première Lumière, qui a divisé les ruisseaux !"
 khuzestan.0037.t:0 "Fin du Parwanaya"
 khuzestan.0037.desc:0 "Le Parwanaya s'est conclu pour cette année. Tous les présents ont participé aux rituels de ces cinq jours célébrant la création de l'univers par la Première Lumière. Les [mandean.PriestNeuterPlural] nous ont merveilleusement guidés à travers les divers rituels, comme les nombreux baptêmes qui ont eu lieu.\n\nC'est vraiment une joie que nous ayons tous, du plus haut au plus bas, pu nous rassembler pour une occasion importante comme celle-ci !"
 khuzestan.0037.a:0 "À la prochaine."
