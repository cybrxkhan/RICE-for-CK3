 RICE_khuzestan_gift_tiraz_robes_desc:0 "Offrir un [tiraz|El] à [recipient.GetShortUINamePossessiveNoTooltip] lors d'une [khila_ceremony|El]."
 RICE_khuzestan_gift_tiraz_robes_tooltip:0 "Le coût de cette [interaction|El], ainsi que le [prestige|El] (et la [piety|El]) que vous et [recipient.GetFirstNameNoTooltip] gagnez dépendent de vos [ranks|El] respectifs et selon que vous êtes son [head_of_faith|El] ou non"

 # Buildings
 building_type_RICE_khuzestan_shushtar_hydraulic_system:0 "Système hydraulique Shushtar"
 building_type_RICE_khuzestan_shushtar_hydraulic_system_desc:0 "La ville de Shushtar (ou Tustar) est entourée d'un réseau complexe de barrages, de canaux, de ponts et de moulins à eau qui forment ensemble l'un des systèmes d'irrigation les plus étendus au monde, permettant l'agriculture dans une vaste zone autour de Shushtar et apportant une grande prospérité à la région. Ce système a été construit au cours des siècles par les anciens Iraniens et il est toujours entretenu par les dirigeants locaux."
 building_RICE_khuzestan_shushtar_hydraulic_system:0 "$building_type_RICE_khuzestan_shushtar_hydraulic_system$"
 building_RICE_khuzestan_shushtar_hydraulic_system_desc:0 "$building_type_RICE_khuzestan_shushtar_hydraulic_system_desc$"
 building_type_RICE_tiraz_factories_01:0 "Centre de production de tiraz"
 building_type_RICE_tiraz_factories_01_desc:0 "Le [tiraz|El] est un style de tissu brodé précieux dans les sociétés islamiques en raison de son importance politique et culturelle. Qu'elles soient publiques ou privées, les installations produisant du [tiraz|El] sont essentielles à l'économie régionale."
 building_RICE_tiraz_factories_01:0 "Tisserands de Tiraz"
 building_RICE_tiraz_factories_01_desc:0 "Les autorités dirigeantes de cette région emploient un certain nombre d'artisans locaux pour produire les textiles [tiraz|El], coûteux et prestigieux.\n\n#EMP Ce [building|El] réduit le coût de l'[interaction|El] Offrir un [tiraz|El] de #P -10%#! pour le [ruler|El] de ce [county|El] et ses [lieges|El] (ce bonus ne se cumule pas)#!"
 building_RICE_tiraz_factories_02:0 "Ateliers de Tiraz"
 building_RICE_tiraz_factories_02_desc:0 "À mesure que l'industrie textile se développe dans cette région, les autorités ont agrandi les manufactures de [tiraz|El] existantes pour employer davantage de personnel et augmenter leurs niveaux de production.\n\n#EMP Ce [building|El] réduit le coût de l'[interaction|El] Offrir un [tiraz|El] de #P -30%#! pour le [ruler|El] de ce [county|El] et ses [lieges|El] (ce bonus ne se cumule pas)#!"
 building_RICE_tiraz_factories_03:0 "Fabriques de tiraz"
 building_RICE_tiraz_factories_03_desc:0 "Les fabriques de [tiraz|El] sont ici très étendues, et parmi les plus renommées au monde. Les textiles qu'elles produisent sont très demandés en de nombreux endroits.\n\n#EMP Ce [building|El] réduit le coût de l'[interaction|El] Offrir un [tiraz|El] de #P -50%#! pour le [ruler|El] de ce [county|El] et ses [lieges|El] (ce bonus ne se cumule pas)#!"

 # Modifiers
 RICE_khuzestan_daniel_pilgrimage_done:0 "A effectué un pèlerinage au Tombeau de Daniel à Šuš"
 RICE_khuzestan_shushtar_dams_repair:0 "Réparations récentes des barrages de Shushtar"
 RICE_khuzestan_shushtar_dams_renovation:0 "Rénovations récentes des barrages de Shushtar"
 RICE_khuzestan_shushtar_canals_repair:0 "Réparations récentes des canaux de Shushtar"
 RICE_khuzestan_shushtar_canals_renovation:0 "Rénovations récentes des canaux de Shushtar"
 RICE_khuzestan_shushtar_bridges_repair:0 "Récentes réparations des ponts de Shushtar"
 RICE_khuzestan_shushtar_bridges_renovation:0 "Rénovations récentes des ponts de Shushtar"
 RICE_khuzestan_shushtar_watermills_repair:0 "Réparations récentes des moulins à eau de Shushtar"
 RICE_khuzestan_shushtar_watermills_renovation:0 "Rénovations récentes des moulins à eau de Shushtar"
 RICE_khuzestan_recently_gifted_tiraz:0 "Tiraz offert à une personne importante"
 RICE_khuzestan_recently_gifted_tiraz_desc:0 "Ce personnage a récemment offert un [tiraz|El] lors d'une [khila_ceremony|El] à quelqu'un de haut statut. Ce geste rejaillit favorablement sur son propre prestige, bien entendu."
 RICE_khuzestan_received_tiraz_from_head_of_faith:0 "A reçu un tiraz du chef de la foi"
 RICE_khuzestan_received_tiraz_from_head_of_faith_desc:0 "Ce personnage a eu la chance de recevoir un [tiraz|El] lors d'une [khila_ceremony|El] de la part de leur [head_of_faith|El], ce qui lui a valu beaucoup d'estime aux yeux de ses coreligionnaires."
 RICE_khuzestan_gifted_tiraz:0 "M'a offert un tiraz"
 RICE_khuzestan_mandaean_connections:0 "Connexions mandéennes"
 RICE_khuzestan_mandaean_connections_desc:0 "Ce personnage a des liens étroits avec la communauté mandéenne du sud de la Mésopotamie et du Khuzestan, et en particulier avec les centres scribaux des Mandéens dans cette région."
 RICE_khuzestan_restored_elymais:0 "Renaissance khouzie : la résurgence élyméenne"
 RICE_khuzestan_restored_elymais_desc:0 "Depuis que les habitants du Khuzestan ont retrouvé le pouvoir dans leur pays, ils ont commencé à imiter ce qu'ils croient être les coutumes de leurs ancêtres immédiats, les Elymais. Les habitants d'Elymais, nom donné au royaume dans l'Antiquité, étaient réputés pour leur habileté au tir à l'arc et pour l'obstination avec laquelle ils maintenaient leur indépendance."
 RICE_khuzestan_restored_khuzi:0 "Renaissance khuzie : une communauté digne"
 RICE_khuzestan_restored_khuzi_desc:0 "Depuis que les habitants du Khuzestan ont retrouvé une position de pouvoir dans leur pays, ils se sont attachés à cultiver leur société et leur culture pour atteindre des sommets inégalés. Pendant trop longtemps, ils ont été associés à des postes de préposés aux toilettes, de nourrices et à d'autres rôles subalternes. Désormais, ils seront rois, philosophes et artistes !"
 RICE_khuzestan_restored_gulf:0 "Renaissance khouzie : marchands du Golfe"
 RICE_khuzestan_restored_gulf_desc:0 "Après que les habitants natifs du Khouzistan se soient rétablis en position de pouvoir dans leur patrie, ils ont tourné leur attention vers les routes commerciales animées du golfe Persique. La communauté revigorée cherche à tirer le meilleur parti de la prospérité agricole historique du Khouzistan et de ses liens commerciaux avec des terres lointaines pour bâtir une nouvelle civilisation."
 RICE_khuzestan_celebrated_parwanaya:0 "Parwanaya célébré"
 RICE_khuzestan_repaired_ancient_canal:0 "Réparation d'un ancien canal"
 RICE_khuzestan_repaired_ancient_canal_desc:0 "Le Khuzestan compte de nombreux canaux construits par les anciens Perses. Les autorités viennent de réparer l'un des plus grands de ces canaux, ce qui devrait contribuer à améliorer les rendements agricoles dans cette région pour les années à venir."
 RICE_khuzestan_sugar_sugar:0 "Sucre du Khouzistan"
 RICE_khuzestan_weavers:0 "Tisserands prospères"
 RICE_khuzestan_weavers_desc:0 "Le Khuzestan a toujours été réputé pour la qualité de son tissage. Récemment, les produits de tissage de cette région particulière du Khuzestan ont acquis une grande renommée dans le monde entier."
 RICE_khuzestan_engineering_study:0 "Étude des anciens systèmes hydrauliques du Khouzistan"
 RICE_khuzestan_engineering_study_desc:0 "Les anciens Perses sont à l'origine de nombreuses prouesses d'ingénierie au Khouzistan, sous forme de canaux, de barrages, de ponts et bien plus encore. Ce personnage s'est récemment intéressé à mieux connaître ces ouvrages."

 # Decisions
 RICE_khuzestan_tomb_of_daniel_decision:0 "Partie en pèlerinage au tombeau de Daniel"
 RICE_khuzestan_tomb_of_daniel_decision_tooltip:0 "Voyager jusqu'au [tomb_of_daniel|El] à Šuš"
 RICE_khuzestan_tomb_of_daniel_decision_desc:0 "Daniel est une figure religieuse importante pour les [ROOT.Char.GetFaith.GetAdherentNamePlural] comme moi. [daniels_tomb|El] se trouverait à Šuš, et nombreux sont ceux de la région qui s'y rendent pour lui rendre hommage – je devrais faire de même !"
 RICE_khuzestan_tomb_of_daniel_decision_effect_tooltip_1:1 "Vous voyagerez jusqu'au [tomb_of_daniel|El] à Šuš pour gagner une quantité aléatoire de [piety|El] et le [character_modifier|El] [GetModifier('RICE_khuzestan_daniel_pilgrimage_done').GetNameWithTooltip]"
 RICE_khuzestan_tomb_of_daniel_decision_confirm:0 "Préparons-nous à partir pour Šuš !"
 RICE_khuzestan_tomb_of_daniel_decision_context_tooltip:0 "#emphasis Contexte historique :#! Plusieurs villes prétendent abriter le tombeau du personnage biblique Daniel, mais Šuš (l'ancienne Suse) est la plus connue et constitue un site local de pèlerinage pour les Juifs et les Musulmans. Selon la légende, après que les habitants des deux rives du fleuve traversant Šuš se soient disputés sur l'emplacement où devait reposer le cercueil de Daniel, ils convinrent de le déplacer chaque année d'une rive à l'autre. On dit que le souverain seldjoukide Sanjar mit fin à cette pratique au XIIe siècle, la jugeant insultante envers Daniel ; il fit ainsi ériger un tombeau sur un pont. Quelle que soit la vérité, le tombeau d'origine fut détruit par une crue et l'actuel fut construit en 1870."
 RICE_khuzestan_rebury_daniel:0 "Déplacer le sépulcre de Daniel"
 RICE_khuzestan_rebury_daniel_tooltip:0 "Déplacer le [tomb_of_daniel|El] vers un site plus approprié"
 RICE_khuzestan_rebury_daniel_desc:0 "Šuš abrite le [tomb_of_daniel|El], une figure religieuse importante pour de nombreuses [faiths|El], dont [ROOT.Char.GetFaith.GetName]. Traditionnellement, les habitants alternent chaque année l'endroit où repose Daniel, déplaçant son sépulcre d'une rive à l'autre du fleuve qui traverse Šuš. Je trouve cette coutume irrespectueuse envers Daniel – trouvons-lui une demeure permanente !"
 RICE_khuzestan_rebury_daniel_effect_tooltip_1:1 "Le bonus de [piety|El] obtenu en effectuant un [GetActivityType( 'activity_RICE_khuzestan_tomb_of_daniel_pilgrimage' ).GetName] est augmenté, et l'[activity|El] peut désormais être entreprise depuis une aire géographique plus étendue"
 RICE_khuzestan_rebury_daniel_confirm:0 "Ce grand homme a besoin d'un lieu de repos digne de ce nom !"
 RICE_khuzestan_rebury_daniel_context_tooltip:0 "$RICE_khuzestan_tomb_of_daniel_decision_context_tooltip$"
 RICE_khuzestan_repair_shushtar_hydraulics:0 "Entretenir le système hydraulique de $c_tustar$"
 RICE_khuzestan_repair_shushtar_hydraulics_tooltip:0 "Le [GetBuilding('RICE_khuzestan_shushtar_hydraulic_system').GetName] aurait besoin de quelques réparations ou rénovations"
 RICE_khuzestan_repair_shushtar_hydraulics_desc:0 "Bien qu'une grande partie du système hydraulique de [GetTitleByKey('c_tustar').GetNameNoTier] ait été construite il y a des siècles, ses structures continuent de contribuer grandement à la prospérité de la région. Cela dit, en raison de leur âge, ces structures nécessitent souvent des travaux d'entretien pour garantir leur efficacité à long terme."
 RICE_khuzestan_repair_shushtar_hydraulics_effect_tooltip_1:1 "[GetTitleByKey('c_tustar').GetNameNoTier] recevra un [county_modifier|El] pendant #V 10#! ans, dont les bonus dépendent du type de travaux effectués"
 RICE_khuzestan_repair_shushtar_hydraulics_effect_tooltip_2:1 "Vous pouvez choisir entre effectuer des #bold réparations#! #weak (Coût : @gold_icon! [EmptyScope.ScriptValue('RICE_khuzestan_shushtar_repair_cost_value')|0]#!) ou des #bold rénovations#! #weak (Coût : @gold_icon! [EmptyScope.ScriptValue('RICE_khuzestan_shushtar_renovation_cost_value')|0]#!). Ces dernières coûtent plus cher mais ont des effets plus puissants."
 RICE_khuzestan_repair_shushtar_hydraulics_confirm:0 "Convoquez les ingénieurs !"
 RICE_khuzestan_repair_shushtar_hydraulics_context_tooltip:0 "#emphasis Contexte historique :#! Shushtar (ou Tustar) abrite un réseau complexe de barrages, ponts, canaux, moulins à eau et autres structures datant des époques achéménide et sassanide. Auparavant, on supposait que le système avait décliné après l'effondrement des Sassanides, mais des recherches récentes suggèrent que l'entretien et les extensions de ces ouvrages hydrauliques se sont poursuivis bien avant dans la période islamique. Parmi les structures les plus célèbres de Shushtar figurent le #italic Band-e Kaisar#!, un pont-barrage du IIIe siècle construit par des prisonniers de guerre romains, et le #italic canal de Gargar#!, qui fournit de l'eau encore aujourd'hui."
 RICE_khuzestan_pick_shushtar_hydraulics:0 "Choisir quoi réparer ou rénover"
 RICE_khuzestan_shushtar_dams_option:0 "#bold #V Barrages#!#!\n$RICE_khuzestan_shushtar_dams_option_desc$"
 RICE_khuzestan_shushtar_dams_option_desc:0 "Se concentrer sur la vitesse de [control|El]\net de construction des [buildings|El]"
 RICE_khuzestan_shushtar_dams_option_tooltip:0 "$EFFECT_LIST_BULLET$ Modificateur de réparation : [GetModifier('RICE_khuzestan_shushtar_dams_repair').GetNameWithTooltip]\n$EFFECT_LIST_BULLET$ Modificateur de rénovation : [GetModifier('RICE_khuzestan_shushtar_dams_renovation').GetNameWithTooltip]"
 RICE_khuzestan_shushtar_canals_option:0 "#bold #V Canaux#!#!\n$RICE_khuzestan_shushtar_canals_option_desc$"
 RICE_khuzestan_shushtar_canals_option_desc:0 "Se concentrer sur le [development|El]"
 RICE_khuzestan_shushtar_canals_option_tooltip:0 "$EFFECT_LIST_BULLET$ Modificateur de réparation : [GetModifier('RICE_khuzestan_shushtar_canals_repair').GetNameWithTooltip]\n$EFFECT_LIST_BULLET$ Modificateur de rénovation : [GetModifier('RICE_khuzestan_shushtar_canals_renovation').GetNameWithTooltip]"
 RICE_khuzestan_shushtar_bridges_option:0 "#bold #V Ponts#!#!\n$RICE_khuzestan_shushtar_bridges_option_desc$"
 RICE_khuzestan_shushtar_bridges_option_desc:0 "Se concentrer sur la [supply_limit|El]\net les coûts des [buildings|El]"
 RICE_khuzestan_shushtar_bridges_option_tooltip:0 "$EFFECT_LIST_BULLET$ Modificateur de réparation : [GetModifier('RICE_khuzestan_shushtar_bridges_repair').GetNameWithTooltip]\n$EFFECT_LIST_BULLET$ Modificateur de rénovation : [GetModifier('RICE_khuzestan_shushtar_bridges_renovation').GetNameWithTooltip]"
 RICE_khuzestan_shushtar_watermills_option:0 "#bold #V Moulins à eau#!#!\n$RICE_khuzestan_shushtar_watermills_option_desc$"
 RICE_khuzestan_shushtar_watermills_option_desc:0 "Se concentrer sur [county_opinion|El]"
 RICE_khuzestan_shushtar_watermills_option_tooltip:0 "$EFFECT_LIST_BULLET$ Modificateur de réparation : [GetModifier('RICE_khuzestan_shushtar_watermills_repair').GetNameWithTooltip]\n$EFFECT_LIST_BULLET$ Modificateur de rénovation : [GetModifier('RICE_khuzestan_shushtar_watermills_renovation').GetNameWithTooltip]"
 RICE_khuzestan_khuzi_status_decision:0 "Élever la communauté khuzie"
 RICE_khuzestan_khuzi_status_decision_tooltip:0 "Établir un [kingdom|El] au Khuzestan pour le peuple khuzi"
 RICE_khuzestan_khuzi_status_decision_desc:0 "Depuis bien trop longtemps, nous [ROOT.Char.GetCulture.GetCollectiveNoun|l] sommes opprimés et méprisés par nos voisins iraniens et arabes. En tant que [ROOT.Char.GetTitleAsNameNoTooltip] [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip|l], j'ai le pouvoir d'établir un nouveau royaume pour notre peuple, et de restaurer notre honneur et notre dignité."
 RICE_khuzestan_khuzi_status_decision_effect_tooltip_1:1 "L'[innovation|El] #V $innovation_RICE_khuzi$#! est #bold définitivement#! retirée de la [culture|El] [THIS.Char.GetCulture.GetName] et de toutes les autres [cultures|El] qui la possèdent"
 RICE_khuzestan_khuzi_status_decision_effect_tooltip_2:1 "La [tradition|El] #V $tradition_RICE_khuzi_name$#! est #bold améliorée#! pour offrir de meilleurs bonus aux [THIS.Char.GetCulture.GetCollectiveNoun|l] et à toutes les autres [cultures|El] la possédant, selon vos choix"
 RICE_khuzestan_khuzi_status_decision_confirm:0 "Un nouveau jour se lève pour notre peuple !"
 RICE_khuzestan_khuzi_status_decision_context_tooltip:0 "#emphasis Contexte historique :#! Les sources islamiques du haut Moyen Âge mentionnent l'existence d'un peuple dit khouzi, qui parlait une langue que les chercheurs modernes théorisent comme étant un vestige tardif de l'ancien élamite. Bien que le khouzi ait été parlé par la noblesse locale, cela pourrait être dû au fait qu'ils l'avaient appris de leurs domestiques (comme les nourrices, les préposés aux bains, etc.). Les Khouzis étaient par ailleurs considérés comme de bas statut ; par exemple, #italic « yā Xuz̄ı ! »#!, signifiant « Hé, toi le Khouzi ! » a été rapporté par le géographe arabe du Xe siècle Al-Maqdisi comme une insulte argotique courante dans la région. De ce fait, l'identité et la langue khouzies se sont probablement effacées à mesure que les Khouzis s'assimilaient aux populations arabes ou iraniennes."
 RICE_khuzestan_khuzi_status_decision_modifier_bonus_tt:1 "Vous pourrez sélectionner l'un des trois modificateurs suivants à appliquer à chaque [county|El] du [GetTitleByKey('d_khuzestan').GetNameNoTier] pendant #V 50#! ans :\n$EFFECT_LIST_BULLET$[GetModifier('RICE_khuzestan_restored_elymais').GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier('RICE_khuzestan_restored_khuzi').GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier('RICE_khuzestan_restored_gulf').GetNameWithTooltip|L]"
 RICE_khuzestan_parwanaya_festival:0 "Célébrer Parwanaya"
 RICE_khuzestan_parwanaya_festival_tooltip:0 "Célébration du festival de Parwanaya, un événement religieux important pour les Mandéens."
 RICE_khuzestan_parwanaya_festival_desc:0 "Pour de nombreux [ROOT.Char.GetFaith.GetAdherentNamePlural], le #italic Parwanaya#! (ou #italic Panja#!) est l'une des occasions les plus importantes de l'année. C'est un moment pour nous de célébrer la création des anges et de l'univers par [ROOT.Char.GetFaith.HighGodName]."
 RICE_khuzestan_parwanaya_festival_effect_tooltip_1:1 "Vous gagnerez de la [piety|El], du [prestige|El], et le [character_modifier|El] [GetModifier('RICE_khuzestan_celebrated_parwanaya').GetNameWithTooltip]"
 RICE_khuzestan_parwanaya_festival_confirm:0 "Préparons-nous !"
 RICE_khuzestan_parwanaya_festival_context_tooltip:0 "#emphasis Contexte historique :#! Le #italic Parwanaya#! (ou #italic Panja#!) est l'une des principales fêtes du groupe ethnoreligieux mandéen. Elle est célébrée durant les cinq jours supplémentaires du calendrier mandéen après le 8e mois de Šumbulta, et est considérée comme l'une des périodes les plus heureuses et les plus favorables de l'année."
 RICE_khuzestan_gnostic_baptism_rite:0 "Effectuer un baptême rituel"
 RICE_khuzestan_gnostic_baptism_rite_tooltip:0 "Effectuer une purification rituelle par le baptême"
 RICE_khuzestan_gnostic_baptism_rite_desc:0 "Les [ROOT.Char.GetFaith.GetAdherentNamePlural] croient en l'importance du baptême comme moyen de se purifier rituellement. Bien entendu, nous sommes censés accomplir ces rituels régulièrement, comme l'enseigne [ROOT.Char.GetFaith.ReligiousText]."
 RICE_khuzestan_gnostic_baptism_rite_effect_tooltip_1:1 "La quantité de [piety|El] que vous gagnez dépend de votre [piety_level|El]"
 RICE_khuzestan_gnostic_baptism_rite_confirm:0 "Trouver une rivière appropriée pour le rituel."
 RICE_khuzestan_gnostic_baptism_rite_context_tooltip:0 "#emphasis Contexte historique :#! Contrairement au baptême chrétien, qui est un rituel d'initiation généralement effectué une seule fois, la cérémonie de baptême mandéenne, le #italic masbuta#!, est pratiquée régulièrement comme rituel de purification. Elle fait également couramment partie de diverses autres festivités et cérémonies. Les Séthiens, une secte gnostique possiblement liée aux Mandéens, auraient eu leur propre rituel similaire, appelé les Cinq Sceaux."

 # Events

 khuzestan.0001.t:0 "xxxxx"
 khuzestan.0001.desc:0 "xxxxx"
 khuzestan.0001.a:0 "xxxxx"
 khuzestan.0002.t:0 "La cérémonie de baptême [gnostic_faith.GetAdjectiveNoTooltip]"
 khuzestan.0002.desc:0 "Aujourd'hui est le jour où je vais subir une cérémonie de baptême, comme tous les bons [gnostic_faith.GetAdherentNamePlural] sont tenus de le faire régulièrement.\n\nVêtu[ROOT.Char.Custom('FR_E')] de robes sacrées, je m'approche, avec de nombreux fidèles rassemblés pour subir également un baptême, du fleuve que nous avons choisi pour cette cérémonie. Après tout, selon [gnostic_faith.ReligiousText], une eau dite vivante est nécessaire.\n\nLes [gnostic_faith.PriestNeuterPlural] nous dirigent dans l'eau, où nous subissons une triple immersion complète – c'est glacial, pour le moins !\n\nAprès être revenu[ROOT.Char.Custom('FR_E')] sur la terre ferme, un [gnostic_faith.PriestNeuter] marque mon front d'huile de sésame sacrée, puis on me fait boire l'eau trois fois accompagnée de pain sacramentel. Enfin, alors que je frissonne encore, le [gnostic_faith.PriestNeuter] retire un anneau sacré et le pose sur mon front, avant que nous échangions une poignée de main."
 khuzestan.0002.a:0 "Je me sens spirituellement purifié[ROOT.Char.Custom('FR_E')] - et revigoré[ROOT.Char.Custom('FR_E')] !"
 khuzestan.0003.t:0 "xxxxx"
 khuzestan.0003.desc:0 "xxxxx"
 khuzestan.0003.a:0 "xxxxx"
 khuzestan.0004.t:0 "xxxxx"
 khuzestan.0004.desc:0 "xxxxx"
 khuzestan.0004.a:0 "xxxxx"
 khuzestan.0005.t:0 "La renaissance [khuzi_hero.GetCulture.GetNameNoTooltip]"
 khuzestan.0005.desc:0 "Nous, les anciens et originels habitants du [GetGeographicalRegion('RICE_khuzestan_region').GetName], avons grandement souffert sous le joug d'autres puissances, tels que les Arabes, les Iraniens, les Grecs et bien d'autres. Beaucoup d'entre nous ont occupé des rôles humiliants dans la société, comme préposés aux bains pour nos maîtres de l'élite. Ils utilisent notre nom comme une insulte !\n\nMais les temps changent. Sous ma direction, j'ai uni la région en un nouveau royaume, [khuzi_hero.GetPrimaryTitle.GetName]. Nous ne sommes plus opprimés. J'ai exhorté mes compatriotes [khuzi.GetCollectiveNounNoTooltip|l] à ne rejeter ni nos anciennes coutumes ni notre langue unique et ancienne – que les étrangers qualifient d'incompréhensible. Nous sommes devenus prospères et dignes de respect.\n\nDésormais, il m'appartient de déterminer dans quelle direction [khuzi_hero.GetPrimaryTitle.GetNameNoTierNoTooltip] se développera dans les années à venir."
 khuzestan.0005.a:0 "Retournez à notre glorieux passé, quand nous étions Elymais !"
 khuzestan.0005.b:0 "La croissance et le développement de notre société et de notre culture sont prioritaires."
 khuzestan.0005.c:0 "Établir des réseaux commerciaux à travers le golfe Persique."
 RICE_khuzestan_counties_elymaean_tooltip:0 "Toutes les [cultures|El] possédant l'[innovation|El] #V $innovation_RICE_khuzi$#! la perdent définitivement, tandis que la [tradition|El] #V $tradition_RICE_khuzi_name$#! est améliorée pour offrir des bonus militaires à toutes les [cultures|El] qui la possèdent."
 RICE_khuzestan_counties_community_tooltip:0 "Toutes les [cultures|El] possédant l'[innovation|El] #V $innovation_RICE_khuzi$#! la perdent définitivement, tandis que la [tradition|El] #V $tradition_RICE_khuzi_name$#! est améliorée pour accorder des bonus diplomatiques à toutes les [cultures|El] qui la possèdent."
 RICE_khuzestan_counties_traders_tooltip:0 "Toutes les [cultures|El] possédant l'[innovation|El] #V $innovation_RICE_khuzi$#! la perdent définitivement, tandis que la [tradition|El] #V $tradition_RICE_khuzi_name$#! est améliorée pour offrir des bonus économiques à toutes les [cultures|El] qui la possèdent."
 khuzestan.0006.t:0 "$khuzestan.0005.t$"
 khuzestan.0006.desc:0 "D'aussi loin qu'on s'en souvienne, les anciens habitants originels du [GetGeographicalRegion('RICE_khuzestan_region').GetName] ont énormément souffert sous le joug d'autres puissances, comme les Arabes, les Iraniens, les Grecs, et d'autres. Beaucoup de [khuzi.GetCollectiveNoun|l] furent relégués à des rôles humiliants dans la société, comme préposés aux latrines pour leurs maîtres de l'élite. Leur nom même, [khuzi.GetCollectiveNounNoTooltip|l], était utilisé comme insulte par les autres peuples.\n\nMais les temps changent. [khuzi_hero.GetTitledFirstName] a uni la région en un nouveau royaume, et a exhorté ses compatriotes [khuzi.GetCollectiveNounNoTooltip|l] à ne pas rejeter leurs anciennes coutumes ni leur incompréhensible langue ancienne.\n\n"
 khuzestan.0006.desc.elymais:0 "[khuzi_hero.GetFirstNameNoTooltip] cherche à imiter les prédécesseurs immédiats des [khuzi.GetCollectiveNounNoTooltip|l] dans l'Antiquité, les Élyméens. Le royaume d'Élymaïde était réputé pour ses archers et son indépendance obstinée, et [khuzi_hero.GetFirstNameNoTooltip] espère que ce passé glorieux pourra être retrouvé."
 khuzestan.0006.desc.community:0 "[khuzi_hero.GetFirstNameNoTooltip] estime qu'il est important pour les [khuzi.GetCollectiveNounNoTooltip|l] de se concentrer sur le développement de leur culture et de leur société. En acquérant une réputation dans les arts, la vie de cour et la majesté politique, les autres apprendront à les admirer."
 khuzestan.0006.desc.traders:0 "[khuzi_hero.GetFirstNameNoTooltip] cherche à utiliser la prospérité agricole et commerciale traditionnelle du Khouzistan pour intégrer les [khuzi.GetCollectiveNounNoTooltip|l] dans les réseaux commerciaux du golfe Persique, et inaugurer une nouvelle ère pour son peuple."
 khuzestan.0006.a:0 "Ils sont devenus prospères et dignes de respect, semble-t-il !"
 khuzestan.0007.t:0 "xxxxx"
 khuzestan.0007.desc:0 "xxxxx"
 khuzestan.0007.a:0 "xxxxx"
 khuzestan.0008.t:0 "xxxxx"
 khuzestan.0008.desc:0 "xxxxx"
 khuzestan.0008.a:0 "xxxxx"
 khuzestan.0009.t:0 "xxxxx"
 khuzestan.0009.desc:0 "xxxxx"
 khuzestan.0009.a:0 "xxxxx"
 khuzestan.0010.t:0 "Maintenance du système hydraulique"
 khuzestan.0010.desc:0 "Le système hydraulique de [tustar.GetNameNoTier] existe depuis des siècles et apporte toujours à la région richesse et prospérité. Cependant, les dirigeants tels que moi doivent régulièrement financer des travaux d'ingénierie pour entretenir ce réseau complexe de structures ; ainsi, nous pourrons tous continuer à en récolter les fruits à long terme.\n\n"
 khuzestan.0010.desc.dams:0 "Quoi qu'il en soit, j'ai décidé que des travaux d'entretien sont nécessaires pour les #bold barrages#!."
 khuzestan.0010.desc.canals:0 "En tout cas, les #bold canaux#! demandent une intervention urgente."
 khuzestan.0010.desc.bridges:0 "Après réflexion, les #bold ponts#! méritent une révision complète."
 khuzestan.0010.desc.watermills:0 "Il est décidé : les #bold moulins à eau#! seront rénovés."
 khuzestan.0010.desc.conclusion:0 "\n\nMes ingénieurs me demandent maintenant si nous devons procéder à des réparations ou à des rénovations. Les réparations renforceront ce que nous avons déjà, tandis que les rénovations leur permettront d'agrandir les structures selon les besoins afin d'accroître la vitalité du système."
 khuzestan.0010.a:0 "Effectuer des travaux de réparation sur ces structures"
 khuzestan.0010.b:0 "Réaliser des travaux de rénovation pour étendre le réseau hydraulique"
 khuzestan.0011.t:0 "Présentation du Tiraz"
 khuzestan.0011.desc:0 "En vertu de mon autorité en tant que [actor.GetTitleAsNameNoTooltip], j'ai décidé d'accorder à [recipient.GetTitledFirstName] un textile #italic tiraz#! lors d'une cérémonie #italic Khil’a#!. Il s'agit d'un magnifique #italic tiraz#! de grande qualité, bien supérieur aux #italic tiraz#! symboliques offerts lors des occasions officielles ordinaires."
 khuzestan.0011.desc.local:0 "Je suis certain que [recipient.GetFirstNameNoTooltip] est flatté de recevoir formellement ma faveur de cette manière !\n\n"
 khuzestan.0011.desc.foreign:0 "Bien qu'[recipient.GetSheHe] ne puisse être présent[recipient.Custom('FR_E')] pour le recevoir en personne, je suis sûr qu'[recipient.GetSheHe] sera ravi[recipient.Custom('FR_E')] de recevoir ce présent !\n\n"
 khuzestan.0011.desc.early:0 "Offrir à quelqu'un un magnifique textile #italic tiraz#! est un grand honneur, car seuls les puissants [actor.GetTitleAsNameNoTooltip] comme moi peuvent se permettre d'en offrir d'une telle qualité"
 khuzestan.0011.desc.middle:0 "Bien que l'octroi du #italic tiraz#! ne soit plus la prérogative des Califes ou des plus puissants souverains, cela reste quelque chose que fait généralement un puissant [actor.GetTitleAsNameNoTooltip] comme moi-même, donc recevoir un #italic tiraz#! de si grande qualité demeure un grand honneur."
 khuzestan.0011.desc.late:0 "Autrefois, seuls les Califes ou les dirigeants de très haut rang pouvaient conférer un #italic tiraz#! à quelqu'un ; de nos jours, il est courant que les membres des classes élitaires s'en offrent les uns aux autres. Néanmoins, recevoir un #italic tiraz#! de grande qualité d'un [actor.GetTitleAsNameNoTooltip] aussi puissant que moi demeure un grand honneur."
 khuzestan.0011.a:0 "J'espère que [recipient.GetFirstNameNoTooltip] appréciera cela !"
 khuzestan.0012.t:0 "$khuzestan.0011.t$"
 khuzestan.0012.desc:0 "Par son autorité en tant que [actor.GetTitleAsNameNoTooltip], [actor.GetTitledFirstName] a décidé de m'octroyer un textile #italic tiraz#! lors d'une cérémonie de #italic Khil’a#!. Il s'agit d'un magnifique #italic tiraz#! de grande qualité, bien au-delà du #italic tiraz#! symbolique remis lors des occasions officielles ordinaires."
 khuzestan.0012.desc.local:0 "[actor.GetSheHe|U] est certain[actor.Custom('FR_E')] que je suis flatté[ROOT.Char.Custom('FR_E')] de recevoir formellement sa faveur de cette manière !\n\n"
 khuzestan.0012.desc.foreign:0 "Bien que je ne puisse être présent pour le recevoir en personne, je suis tout de même ravi d'avoir reçu un tel présent ! Après tout, il s'agit d'un magnifique #italic tiraz#! de grande qualité, bien au-delà du simple #italic tiraz#! symbolique offert lors des occasions officielles ordinaires.\n\n"
 khuzestan.0012.desc.early:0 "Offrir à quelqu'un un magnifique textile #italic tiraz#! est un grand honneur, car la capacité de donner un #italic tiraz#! d'une telle qualité est quelque chose que seul un[actor.Custom('FR_E')] [actor.GetTitleAsNameNoTooltip] puissant[actor.Custom('FR_E')] comme [actor.GetFirstNameNoTooltip] peut faire."
 khuzestan.0012.desc.middle:0 "Bien que l'octroi du #italic tiraz#! ne soit plus l'apanage des Califes ou des plus puissants souverains, cela reste une pratique typique d'un[actor.Custom('FR_E')] puissant[actor.Custom('FR_E')] [actor.GetTitleAsNameNoTooltip] te[actor.Custom('FR_LLle')] que [actor.GetFirstNameNoTooltip], si bien que recevoir un #italic tiraz#! d'une telle qualité demeure un grand honneur."
 khuzestan.0012.desc.late:0 "Autrefois, seuls les Califes ou les dirigeants de très haut rang pouvaient offrir un #italic tiraz#! à quelqu'un ; de nos jours, il est courant que les personnes des classes élitaires s'en offrent mutuellement. Néanmoins, recevoir un #italic tiraz#! de grande qualité d'un[actor.Custom('FR_E')] puissant[actor.Custom('FR_E')] [actor.GetTitleAsNameNoTooltip] comme [actor.GetFirstNameNoTooltip] est un grand honneur."
 khuzestan.0012.a:0 "Je suis très honoré[ROOT.Char.Custom('FR_E')] de recevoir ce prix."
 khuzestan.0013.t:0 "Un[mandaean.Custom('FR_E')] courtisan[mandaean.Custom('FR_E')] [mandaean.GetFaith.GetAdherentNameNoTooltip] ?"
 khuzestan.0013.desc:0 "La Mésopotamie méridionale et le Khuzestan constituent le cœur historique des [mandaean.GetFaith.GetAdherentNamePlural], une secte gnostique qui a persisté et perduré sur ces terres depuis l'Antiquité, malgré les épreuves auxquelles elle a été confrontée au fil des siècles. Aujourd'hui, un[mandaean.Custom('FR_E')] membre de cette communauté du nom de [mandaean.GetFirstName] est arrivé[mandaean.Custom('FR_E')] à ma cour, offrant ses services.\n\nLes localités où abondent les [mandaean.GetFaith.GetAdherentNamePluralNoTooltip] sont réputées comme centres de scribes et de littérature, en raison de l'importance qu'ils accordent à la consignation et à la préservation de leur canon religieux. Il serait peut-être sage de tisser des liens mutuellement bénéfiques avec la communauté [mandaean.GetFaith.GetAdjectiveNoTooltip] par l'intermédiaire de [mandaean.GetFirstNameNoTooltip]."
 khuzestan.0013.a:0 "[mandaean.GetSheHe|U] sera [mandaean.GetHerHim] bienvenu[mandaean.Custom('FR_E')] ici !"
 khuzestan.0013.b:0 "Je n'ai pas besoin de ses services."
