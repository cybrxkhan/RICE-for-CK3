 khuzestan.0050.t:0 "Réparation des canaux"
 khuzestan.0050.desc:0 "Le [GetGeographicalRegion('RICE_khuzestan_region').GetName] est une grande région agricole depuis des années, voire des siècles. Les habitants y découvrent souvent les ruines d'anciens canaux, qui pourraient être réparés et réutilisés à des fins contemporaines.\n\nDes officiels de [county.GetNameNoTier] m'ont récemment informé qu'un tel grand canal a été découvert, datant probablement de l'époque des anciens Perses. Ils affirment qu'avec un financement adéquat, nous pourrions engager des ingénieurs et des ouvriers pour rénover ce canal et le rendre à nouveau utile. Cela permettrait d'augmenter considérablement la superficie des terres arables."
 khuzestan.0050.a:0 "Très bien ! Ils auront les fonds nécessaires."
 khuzestan.0050.b:0 "Je pense que nos ressources sont mieux utilisées ailleurs."
 khuzestan.0051.t:0 "Pays de la canne à sucre"
 khuzestan.0051.desc:0 "Le sucre du Khuzestan est réputé dans tout le Moyen-Orient pour sa qualité, et d'immenses quantités de ce sucre sont exportées vers d'autres régions. C'est d'ailleurs pour cela que certains surnomment le Khuzestan la « Terre de la canne à sucre ».\n\nPar chance, mes cuisiniers ont récemment obtenu une importante cargaison du meilleur sucre du Khuzestan. Ils sont convaincus que ce sucre nous sera d'une grande utilité dans un avenir proche, qu'ils l'utilisent pour préparer des sucreries et des pâtisseries dont je pourrai me régaler en collation, ou pour élaborer de délicieux mets lors des festins que je pourrais organiser !"
 khuzestan.0051.a:0 "J'ai hâte de manger les délices sucrés préparés par mes cuisiniers !"
 khuzestan.0052.t:0 "Tisserands du [GetGeographicalRegion('RICE_khuzestan_region').GetNameNoTooltip]"
 khuzestan.0052.desc:0 "Le [GetGeographicalRegion('RICE_khuzestan_region').GetName] est réputé pour son tissage depuis des siècles. Vêtements, robes, tapis, courtepointes et bien d'autres produits de cette région sont vendus sur les marchés du monde entier.\n\nRécemment, les tisserands de [county.GetNameNoTier] ont acquis une grande renommée, car leurs produits sont considérés comme parmi les plus beaux de la région."
 khuzestan.0052.a:0 "C'est excellent pour l'économie locale !"
 khuzestan.0053.t:0 "Apprendre des anciens"
 khuzestan.0053.desc:0 "Je me suis récemment rendu dans mes territoires du [GetGeographicalRegion('RICE_khuzestan_region').GetName] afin de mieux comprendre les problèmes locaux qui y sévissent. J'ai notamment remarqué les grandes structures d'ingénierie, dont beaucoup furent bâties il y a fort longtemps par les anciens Perses, et qui semblaient parsemer le paysage.\n\nDepuis mon retour, ces brillantes prouesses architecturales n'ont cessé d'occuper mes pensées. Dire que les anciens étaient capables de telles merveilles !\n\nIl m'est venu à l'esprit que je devrais peut-être envoyer quelques ingénieurs et érudits étudier ces structures. Ainsi, nous pourrions appliquer les méthodes d'ingénierie des anciens pour nous aider dans les divers projets de construction que nous menons à travers le royaume."
 khuzestan.0053.a:0 "Une bonne idée ! Faisons cela."
 khuzestan.0053.b:0 "Je devrais me consacrer à d'autres questions."
