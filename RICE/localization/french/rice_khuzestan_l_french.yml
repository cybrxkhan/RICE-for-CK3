 khuzestan.0020.t:0 "Préparatifs pour le voyage à Šuš"
 khuzestan.0020.desc:0 "Le personnage biblique Daniel est important pour les [ROOT.Char.GetFaith.GetAdherentNamePlural], en tant qu'homme juste profondément dévoué à [ROOT.Char.GetFaith.HighGodName]. Bien que plusieurs lieux prétendent abriter son tombeau, la ville de Šuš, également connue des anciens sous le nom de Suse, est considérée par beaucoup comme ayant la meilleure prétention. J'ai la chance de vivre près de ce site.\n\nLes habitants du coin se rendent constamment en pèlerinage au tombeau de Daniel, et j'ai bien l'intention d'en faire autant. Le voyage jusqu'à Šuš ne sera pas long, mais je dois néanmoins faire des préparatifs."
 khuzestan.0020.a:0 "Préparons-nous !"
 khuzestan.0021.t:0 "Voyage vers Šuš"
 khuzestan.0021.desc:0 "J'ai terminé les préparatifs pour un pèlerinage local au tombeau de Daniel. Je fais mes adieux à tous en quittant ma demeure pour entreprendre ce court voyage. La ville de Šuš nous attend, et j'ai hâte d'y arriver."
 khuzestan.0021.a:0 "Notre destination est Šuš !"
 khuzestan.0022.t:0 "Arrivée à Šuš"
 khuzestan.0022.desc:0 "Je suis arrivé au cœur de Šuš pour voir le tombeau de Daniel. Parmi les pèlerins se trouvent des fidèles du [judaism.GetName], du [christianity.GetName] et de l'[islam.GetName]. Malgré les différences entre ces trois religions, nous vénérons tous le grand Daniel, dont la piété continue de nous inspirer jusqu'à ce jour.\n\n"
 khuzestan.0022.desc.before:0 "Šuš est divisée par un grand fleuve, et l'emplacement du sépulcre de Daniel alterne chaque année entre les deux rives de ce fleuve. Autrement dit, les habitants transportent le corps de Daniel d'un côté à l'autre, aussi étrange que cela puisse paraître à certains.\n\nIl y a longtemps, dit-on, le sépulcre ne se trouvait que d'un seul côté du fleuve, qui devint la moitié la plus riche de la ville, que ce soit grâce aux bénédictions divines, à l'affluence des pèlerins, ou aux deux. La moitié la plus pauvre en conçut du ressentiment, et les deux rives se disputèrent l'emplacement du sépulcre, jusqu'à ce qu'un accord fût trouvé, menant à l'arrangement actuel, et ainsi les deux côtés devinrent prospères."
 khuzestan.0022.desc.after:0 "Šuš est divisée par un grand fleuve, et le sépulcre de Daniel se trouve dans une chapelle sur un pont. Ce bâtiment fut érigé par [sanjar.GetTitledFirstName] il y a quelque temps.\n\nAutrefois, chaque année, le sépulcre alternait entre les deux rives du fleuve. Cependant, [sanjar.GetFirstNameNoTooltip] estima que c'était une insulte au grand Daniel de déplacer ainsi son cercueil d'un côté à l'autre, alors [sanjar.GetSheHe] ordonna la construction de la chapelle actuelle, et l'immersion du cercueil dans le fleuve à cet endroit."
 khuzestan.0022.a:0 "Il est temps de se rendre au tombeau."
 khuzestan.0023.t:0 "Le tombeau de Daniel"
 khuzestan.0023.desc.before:0 "Je suis arrivé à l'emplacement actuel du sépulcre de Daniel."
 khuzestan.0023.desc.after:0 "Je suis arrivé à la chapelle du pont qui a été construite par [sanjar.GetTitledFirstName] en l'honneur de Daniel."
 khuzestan.0023.desc:0 "On dit que la zone autour du sépulcre est sacrée, et il est même interdit de déranger les poissons, en l'honneur de Daniel.\n\nQuoi qu'il en soit, je me joins aux autres présents pour une prière et une supplication [ROOT.Char.GetFaith.GetAdjective], avant de passer du temps à méditer sur la vie et les actes de Daniel. Dire que je suis en présence d'un homme si juste et si pieux !"
 khuzestan.0023.a:0 "[ROOT.Char.GetFaith.HighGodName] soit loué !"
 khuzestan.0024.t:0 "Retour de Šuš"
 khuzestan.0024.desc:0 "Après avoir passé un peu de temps au Tombeau de Daniel à Šuš, je suis rentré chez moi.\n\nDans l'ensemble, ce fut une expérience formidable de venir sur ce lieu saint local et de méditer sur une figure aussi importante pour la foi [ROOT.Char.GetFaith.GetReligion.GetAdjective]."
 khuzestan.0024.a:0 "Je suis heureu[ROOT.Char.Custom('FR_XSe')] d’avoir pu voyager jusqu’à Šuš."
 khuzestan.0025.t:0 "Déplacer le Sépulcre"
 khuzestan.0025.desc:0 "Plusieurs villes prétendent abriter le tombeau de Daniel, mais nombreux sont ceux qui croient que Šuš possède la revendication la plus solide. Ainsi, de nombreuses personnes des régions environnantes affluent à Šuš pour visiter le tombeau.\n\nCependant, les habitants ont une curieuse coutume : chaque année, ils déplacent son sépulcre de l'autre côté du fleuve qui divise Šuš, alternant ainsi l'endroit où Daniel repose. Bien que je comprenne que les gens des deux rives du fleuve souhaitent profiter également de sa présence, je trouve en fin de compte cette coutume irrespectueuse envers le grand Daniel.\n\nJ'ai donc ordonné qu'une chapelle permanente soit édifiée sur l'un des grands ponts enjambant la ville. Le cercueil sera ensuite immergé dans le fleuve près de la chapelle."
 khuzestan.0025.a:0 "Le sépulcre de Daniel a désormais une demeure permanente."
 khuzestan.0026.t:0 "$khuzestan.0025.t$"
 khuzestan.0026.desc:0 "Un certain nombre de villes prétendent abriter le tombeau de Daniel, mais beaucoup pensent que Šuš possède la revendication la plus solide. Ainsi, de nombreuses personnes des régions environnantes affluent à Šuš pour visiter le tombeau.\n\nCependant, les habitants ont une coutume curieuse : chaque année, ils déplacent son sépulcre de l'autre côté de la rivière qui divise Šuš, alternant ainsi l'endroit où repose Daniel. [sanjar.GetTitledFirstName], qui gouverne actuellement la région, a trouvé cette coutume plutôt irrespectueuse envers le grand Daniel.\n\nAinsi, [sanjar.GetSheHe] a ordonné qu'une chapelle permanente soit construite sur l'un des grands ponts qui traversent la ville. Le cercueil sera ensuite enterré dans la rivière près de la chapelle."
 khuzestan.0026.a:0 "$khuzestan.0025.a$"
