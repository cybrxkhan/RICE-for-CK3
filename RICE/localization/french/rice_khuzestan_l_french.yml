 activity_RICE_mandaean_parwanaya_desc:0 "Pour de nombreux Mandéens, le #italic Parwanaya#! (ou #italic Panja#!) est l'une des occasions les plus importantes de l'année. C'est un moment pour célébrer la création des anges et de l'univers par $mandeaism_high_god_name$."
