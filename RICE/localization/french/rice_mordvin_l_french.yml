 # Activities
 activity_mordvin_ine_ozks:0 "Ine Ozks"
 activity_mordvin_ine_ozks_name:0 "[ACTIVITY.GetOwner.GetNamePossessiveOrMy|U] Ine Ozks"
 activity_horse_sacrifice:0 "Sacrifice de cheval"
 activity_horse_sacrifice_name:0 "[ACTIVITY.GetOwner.GetNamePossessiveOrMy|U] Sacrifice de cheval"
 activity_RICE_mordvin_horse_sacrifice_host_an_a:0 "un"
 activity_RICE_mordvin_horse_sacrifice:0 "Sacrifice de cheval"
 activity_RICE_mordvin_horse_sacrifice_desc:0 "Depuis aussi longtemps que quiconque s'en souvienne, il est de coutume pour les gens de notre [faith|El] de sacrifier des chevaux aux dieux et aux ancêtres."
 activity_RICE_mordvin_horse_sacrifice_selection_tooltip: "$RICE_misc_sacrifice_horses_effect_tooltip_1$\n\n$RICE_misc_sacrifice_horses_context_tooltip$"
 activity_RICE_mordvin_horse_sacrifice_host_desc: "\n$BULLET_WITH_TAB$Gain de [piety_i] [piety|El]\n$BULLET_WITH_TAB$Gain de [prestige_i] [prestige|El]\n$BULLET_WITH_TAB$Gain de [character_modifiers|El] #P bénéfiques#!"
 activity_RICE_mordvin_horse_sacrifice_guest_desc: "Gain de [piety_i] [piety|El]"
 activity_RICE_mordvin_horse_sacrifice_province_desc:"C'est un site idéal pour sacrifier les chevaux."
 activity_RICE_mordvin_horse_sacrifice_destination_selection: "$activity_RICE_mordvin_horse_sacrifice_province_desc$"
 activity_RICE_mordvin_horse_sacrifice_guest_help_text: "$activity_RICE_mordvin_horse_sacrifice$"
 activity_RICE_mordvin_horse_sacrifice_predicted_cost:"Le coût d'un sacrifice de cheval dépend des [activity_options|El] que vous sélectionnez."
 activity_RICE_mordvin_horse_sacrifice_conclusion_desc:"Le [GetActivityType( 'activity_RICE_mordvin_horse_sacrifice' ).GetName] est terminé. Puisse [GetPlayer.GetFaith.PantheonTerm] être satisfait de ce sacrifice !"
 RICE_horse_sacrifice_number_of_horses_type:"Ampleur du sacrifice"
 RICE_horse_sacrifice_number_of_horses_type_small: "Mineur"
 RICE_horse_sacrifice_number_of_horses_type_small_desc:"Les récompenses augmentent avec le nombre de chevaux sacrifiés.\n\n#weak Nous rassemblerons un certain nombre de chevaux appropriés pour ce sacrifice.#!"
 RICE_horse_sacrifice_number_of_horses_type_medium:"Moyen"
 RICE_horse_sacrifice_number_of_horses_type_medium_desc:"Les récompenses augmentent avec le nombre de chevaux sacrifiés.\n\n#weak Offrir un nombre décent de chevaux [GetPlayer.GetFaith.PantheonTerm2] leur plaira certainement.#!"
 RICE_horse_sacrifice_number_of_horses_type_large:"Grand"
 RICE_horse_sacrifice_number_of_horses_type_large_desc:"Les récompenses augmentent avec le nombre de chevaux sacrifiés.\n\n#weak [GetPlayer.GetFaith.PantheonTerm|U] ne méritent rien de moins qu'un grand sacrifice de chevaux en leur honneur !#!"
 RICE_mordvin_horse_sacrifice_phase: "Cérémonie"
 RICE_mordvin_horse_sacrifice_phase_desc: "Nos chevaux seront offerts aux cieux dans le respect de nos traditions, afin que nous recevions de grandes bénédictions."
 RICE_mordvin_horse_sacrifice_sacrifice_intent_header: "Sacrifice :"
 RICE_mordvin_horse_sacrifice_sacrifice_intent: "Sacrifice"
 RICE_mordvin_horse_sacrifice_sacrifice_intent_desc: "Vous participerez aux différents rituels du sacrifice de cheval."
 RICE_mordvin_horse_sacrifice_completed_log_title:0 "Sacrifice de cheval terminé"
 RICE_mordvin_horse_sacrifice_completed_log:0 "[CHARACTER.GetShortUIName|U] a terminé son sacrifice de cheval"
 RICE_horse_sacrifice_number_of_horses_amount:0 "Nombre de chevaux à sacrifier"
 TRAVEL_NAME_FOR_activity_RICE_mordvin_horse_sacrifice:0 "[Character.GetFirstNamePossessiveNoTooltip] $activity_RICE_mordvin_horse_sacrifice$"
 activity_RICE_mordvin_ine_ozks_host_an_a:0 "un"
 activity_RICE_mordvin_ine_ozks:0 "Ine Ozks"
 activity_RICE_mordvin_ine_ozks_desc:0 "Il est temps pour nous de nous rassembler en tant que peuple pour une grande prière, une grande célébration, en l'honneur de nos ancêtres et des Dieux. Ce sera quelque chose qui va au-delà des cérémonies #italic Ozks#! habituelles que nous tenons : un Ine Ozks, ou Grande Prière."
 activity_RICE_mordvin_ine_ozks_selection_tooltip:"Organiser un Ine Ozks.\n\n$RICE_mordvin_major_ozks_festival_context_tooltip$"
 activity_RICE_mordvin_ine_ozks_host_desc:"\n$BULLET_WITH_TAB$Gain de [prestige_i|E][prestige|El]\n$BULLET_WITH_TAB$Gain de [piety_i|E][piety|El]\n$BULLET_WITH_TAB$Gain du [character_modifier|El] [GetModifier('RICE_mordvin_recently_celebrated_ine_ozks').GetNameWithTooltip]\n$BULLET_WITH_TAB$ Le [county|El] dans lequel l'[activity|El] est tenue obtient le [county_modifier|El] [GetModifier('RICE_mordvin_ine_ozks_recently_held').GetNameWithTooltip] s'il est de religion [GetPlayer.GetFaith.GetReligion.GetName]"
 activity_RICE_mordvin_ine_ozks_guest_desc: " \n$BULLET_WITH_TAB$Gain de [piety_i|El] [piety|El]"
 activity_RICE_mordvin_ine_ozks_province_desc: ""
 activity_RICE_mordvin_ine_ozks_destination_selection: "$activity_RICE_mordvin_ine_ozks_province_desc$"
 activity_RICE_mordvin_ine_ozks_guest_help_text: "$activity_RICE_mordvin_ine_ozks$"
 activity_RICE_mordvin_ine_ozks_predicted_cost: "Le coût de cette visite est principalement basé sur votre [income|El]."
 activity_RICE_mordvin_ine_ozks_conclusion_desc: "Le [GetActivityType( 'activity_RICE_mordvin_ine_ozks' ).GetName] est terminé. Quel événement glorieux et spectaculaire !"
 RICE_mordvin_ine_ozks_prayer_phase: "Prière"
 RICE_mordvin_ine_ozks_prayer_phase_desc: "Les gens se rassemblent de près ou de loin pour participer à une prière commune."
 RICE_mordvin_ine_ozks_pious_intent_header: "Pieux :"
 RICE_mordvin_ine_ozks_pious_intent: "Pieux"
 RICE_mordvin_ine_ozks_pious_intent_desc:"Vous avez l'intention de participer aux cérémonies religieuses avec une attitude dévote. Les [modifiers|El] que vous obtenez à la fin de l'[activity|El] durent deux fois plus longtemps. Vous perdrez [stress_loss_i|El] du [stress|El] si vous êtes [GetTrait('zealous').GetName( GetNullCharacter )], mais gagnerez [stress_gain_i|El] du [stress|El] si vous êtes [GetTrait('cynical').GetName( GetNullCharacter )]."
 RICE_mordvin_ine_ozks_community_intent_header: "Communauté :"
 RICE_mordvin_ine_ozks_community_intent: "Communauté"
 RICE_mordvin_ine_ozks_community_intent_desc:"Vous souhaitez socialiser avec les autres. Gagnez [prestige_i|El] #V 100#! à la fin de cette [activity|El] en plus du [prestige|El] que vous aurez déjà gagné. Vous perdrez du [stress_loss_i|El] [stress|El] si vous êtes [GetTrait('gregarious').GetName( GetNullCharacter )], mais gagnerez du [stress_gain_i|El] [stress|El] si vous êtes [GetTrait('shy').GetName( GetNullCharacter )]."
 RICE_mordvin_ine_ozks_enjoyment_intent_header:"Célébration :"
 RICE_mordvin_ine_ozks_enjoyment_intent: "Célébration"
 RICE_mordvin_ine_ozks_enjoyment_intent_desc:"C'est peut-être une occasion importante, mais cela ne veut pas dire que vous ne pouvez pas vous détendre et en profiter ! Vous êtes assuré de perdre du [stress_loss_i|El] [stress|El], et d'en perdre encore plus si vous êtes [GetTrait('lazy').GetName( GetNullCharacter )], [GetTrait('content').GetName( GetNullCharacter )], ou [GetTrait('gluttonous').GetName( GetNullCharacter )]."
 RICE_mordvin_ine_ozks_completed_log_title:0 "Ine Ozks terminé"
 RICE_mordvin_ine_ozks_completed_log:0 "[CHARACTER.GetShortUIName|U] a terminé son Ine Ozks"
 RICE_mordvin_ine_ozks_same_religion:0 "\n#P ++ Ce [county|El] suit la [religion|El] [GetPlayer.GetFaith.GetReligion.GetAdjective]"
 TRAVEL_NAME_FOR_activity_RICE_mordvin_ine_ozks:0 "[Character.GetFirstNamePossessiveNoTooltip] $activity_RICE_mordvin_ine_ozks$"

 # Decisions
 RICE_mordvin_major_ozks_festival:0 "Organiser un Ine Ozks"
 RICE_mordvin_major_ozks_festival_desc:0 "Il est temps pour nous de nous rassembler en tant que peuple pour une grande prière, une grande célébration, en l'honneur de nos ancêtres et [ROOT.Char.GetFaith.PantheonTerm3]. Ce sera quelque chose qui va au-delà des cérémonies #italic Ozks#! habituelles que nous tenons : un Ine Ozks, ou Grande Prière."
 RICE_mordvin_major_ozks_festival_tooltip:1 "Organisez une prière Ine Ozks avec votre peuple."
 RICE_mordvin_major_ozks_festival_effect_tooltip_1:1 "Vous organiserez un Ine Ozks, ou Grande Prière, et obtiendrez des bienfaits comme gagner de la [piety|El], du [prestige|El], ou divers [character_modifiers|El] bénéfiques, ou perdre du [stress|El]"
 RICE_mordvin_major_ozks_festival_effect_tooltip_2:1 "Si votre [capital|El] suit une [faith|El] [THIS.Char.GetFaith.GetReligion.GetAdjective], alors elle recevra le [modifier|El] [GetModifier('RICE_mordvin_ine_ozks_recently_held').GetNameWithTooltip] pour #V 5#! ans"
 RICE_mordvin_major_ozks_festival_confirm:0 "Préparez l'Ozks !"
 RICE_mordvin_major_ozks_festival_context_tooltip:0 "#emphasis Contexte historique :#! #italic Ozks#! est un terme utilisé pour désigner un type de prière publique, de cérémonie de culte et de fête religieuse parmi les peuples mordves. À l'époque moderne, la plus connue d'entre elles est le Rasken Ozks, dont la représentation ici s'inspire ; le Rasken Ozks a été interdit par les autorités tsaristes dans les années 1600, mais a été relancé en 1999."
 RICE_misc_sacrifice_horses:0 "Effectuer un sacrifice de chevaux"
 RICE_misc_sacrifice_horses_desc:0 "Depuis aussi longtemps que quiconque s'en souvienne, il est de coutume parmi les fidèles [ROOT.Char.GetFaith.GetAdherentNamePlural] de sacrifier des chevaux à nos ancêtres et [ROOT.Char.GetFaith.PantheonTerm2]."
 RICE_misc_sacrifice_horses_tooltip:1 "Vous sacrifierez quelques chevaux."
 RICE_misc_sacrifice_horses_effect_tooltip_1:1 "Vous sacrifierez un cheval, ce qui pourrait vous rapporter divers bienfaits comme de la [piety|El], du [prestige|El] et des [character_modifiers|El] bénéfiques selon le nombre de chevaux que vous êtes prêt à sacrifier"
 #RICE_misc_sacrifice_horses_effect_tooltip_2:1 "The chances of gaining a beneficial [character_modifier|El] depends on your [virtues|El], [sins|El], and [piety_level|El]"
 RICE_misc_sacrifice_horses_confirm:0 "Trouvez des chevaux appropriés à sacrifier !"
 RICE_misc_sacrifice_horses_context_tooltip:0 "#emphasis Contexte historique :#! Les sacrifices de chevaux étaient un rituel religieux courant dans diverses régions d'Eurasie, chez des peuples aussi différents que les Nordiques, les Mongols et les Mordves. Dans ces sociétés, les chevaux étaient généralement enterrés avec les morts. Au Moyen Âge et au début des temps modernes, cette pratique a décliné avec la propagation de diverses religions organisées, comme les religions abrahamiques et le bouddhisme."
 RICE_misc_sacrifice_horses_type:0 "Choisissez le nombre de chevaux à sacrifier"
 RICE_misc_sacrifice_horses_type_gui:0 "$RICE_misc_sacrifice_horses_type$"
 RICE_misc_horse_sacrifice_minor_option:0 "#Bold #V Sacrifice mineur#!#!\n$RICE_misc_horse_sacrifice_minor_option_desc$"
 RICE_misc_horse_sacrifice_minor_option_desc:0 "Sacrifier quelques chevaux"
 RICE_misc_horse_sacrifice_minor_option_tooltip:0 "#V #Bold Coût minimum : @gold_icon! [EmptyScope.ScriptValue('RICE_misc_horse_sacrifice_cost_minor')|0]#!#!\n\n$EFFECT_LIST_BULLET$Gagnez entre #V 0#! et #V 50#! de [piety|El] et de [prestige|El]\n$EFFECT_LIST_BULLET$Gagnez un [character_modifier|El] bénéfique avec un effet mineur aléatoire"
 RICE_misc_horse_sacrifice_major_option:0 "#Bold #V Sacrifice majeur#!#!\n$RICE_misc_horse_sacrifice_major_option_desc$"
 RICE_misc_horse_sacrifice_major_option_desc:0 "Sacrifier un nombre décent de chevaux"
 RICE_misc_horse_sacrifice_major_option_tooltip:0 "#V #Bold Coût minimum : @gold_icon! [EmptyScope.ScriptValue('RICE_misc_horse_sacrifice_cost_major')|0]#!#!\n\n$EFFECT_LIST_BULLET$Gagnez entre #V 25#! et #V 100#! de [piety|El] et de [prestige|El]\n$EFFECT_LIST_BULLET$Gagnez un [character_modifier|El] bénéfique avec un effet mineur #italic ou#! majeur aléatoire"
 RICE_misc_horse_sacrifice_great_option:0 "#Bold #V Grand Sacrifice#!#!\n$RICE_misc_horse_sacrifice_great_option_desc$"
 RICE_misc_horse_sacrifice_great_option_desc:0 "Sacrifier de nombreux chevaux"
