 mordvin.0030.t:0 "Préparation pour les Ozks"
 mordvin.0030.desc:0 "Pour nous les [ROOT.Char.GetFaith.GetAdherentNamePlural], les prières publiques, ou #italic ozks#!, font partie intégrante de la vie quotidienne. Cependant, pour les occasions importantes, la communauté peut se rassembler pour organiser un grand événement, avec des cérémonies somptueuses en l'honneur [ROOT.Char.GetFaith.PantheonTerm3] et des ancêtres, et de nombreuses occasions pour les gens de socialiser entre eux et de se reposer.\n\nJ'ai donné l'ordre à tous les habitants de [capital_province.GetName] de se préparer pour un tel #italic Ine Ozks#!, ou Grande Prière. Déjà, les [ROOT.Char.Custom('DefaultPriestTitlePlural')], avec le reste de la communauté, font les préparatifs pour cet événement."
 mordvin.0030.a:0 "Ce sera une grande et mémorable occasion !"
 mordvin.0031.t:0 "L'Ozks commence"
 mordvin.0031.desc:0 "Le jour de l'#italic Ine Ozks#! est arrivé ! Moi, ainsi que les [ROOT.Char.Custom('DefaultPriestTitlePlural')] et les membres éminents de la communauté locale, avons travaillé dur pour rendre ce jour possible.\n\nLes gens se sont rassemblés des villes et villages voisins de [capital_province.GetName], et nous commençons tous les festivités en invitant les âmes de nos ancêtres décédés à nous rejoindre. Chacun a apporté une poignée de terre de sa ville natale, qui est déposée sur un ancien tumulus servant de lieu central de prière. Le tumulus a, bien sûr, grandi au fil des années à mesure que ce genre de cérémonies sont organisées.\n\nAprès cela, un #italic shtatol#!, une énorme bougie faite de cire d'abeille, est érigé au centre du tumulus. Puis, les [ROOT.Char.Custom('DefaultPriestTitlePlural')] allument la bougie, et nous procédons ensuite à un certain nombre de sacrifices d'animaux pour gagner la faveur [ROOT.Char.GetFaith.PantheonTerm3], en particulier celui d'un taureau, dont la viande sera ensuite cuisinée pour que tous puissent manger."
 mordvin.0031.a:0 "Nous espérons que nos prières seront entendues !"
 mordvin.0032.t:0 "La fin des Ozks"
 mordvin.0032.desc:0 "Quel merveilleux #italic Ozks#! c'était !\n\nLes festivités prendront bientôt fin, et chacun rentrera chez soi, espérons-le en se sentant spirituellement épanoui et plus connecté les uns aux autres et [ROOT.Char.GetFaith.PantheonTerm2]. Quoi qu'il en soit, j'étais ravi de voir autant de personnes participer."
 mordvin.0032.a:0 "Nous devrions en organiser un autre dès que possible !"
 mordvin.0033.t:0 "Nos ancêtres"
 mordvin.0033.desc:0 "Dans le cadre des cérémonies de cet Ozks, il est important pour nous de rendre hommage à nos ancêtres. Au début de l'Ozks, nous avons invité nos ancêtres à se joindre à nous pour cette fête, mais il est également important de continuer à penser à eux et à les vénérer au fur et à mesure que la fête se poursuit. J'ai l'impression d'être maintenant plus proche de mes ancêtres qu'avant le début de l'Ozks."
 mordvin.0033.a:0 "Après tout, nos ancêtres nous ont tant donné."
 mordvin.0034.t:0 "Le temps en famille"
 mordvin.0034.desc:0 "Les grandes fêtes de l'ozks sont une excellente occasion pour les familles et les proches de se rencontrer et de renforcer les liens familiaux. J'ai donc profité des ozks pour passer du temps avec ma famille proche."
 mordvin.0034.a:0 "Nous ne sommes rien les uns sans les autres, après tout."
 mordvin.0035.t:0 "Prières pour la récolte"
 mordvin.0035.desc:0 "Dans le cadre de cet Ozks, nous faisons actuellement des invocations à [ROOT.Char.GetFaith.FertilityGodName] pour demander que la prochaine récolte soit bonne. Nous chantons avec ferveur, espérant qu'[ROOT.Char.GetFaith.FertilityGodSheHe|U] entendra nos prières pendant cet Ozks et accordera à notre communauté la bénédiction de connaître l'abondance et la prospérité à l'avenir."
 mordvin.0035.a:0 "Espérons que nos prières ont été entendues !"
 mordvin.0035.toast:0 "Les [ROOT.Char.Custom('DefaultPriestTitlePlural')] disent que la prochaine récolte sera bonne !"
 mordvin.0036.t:0 "Divine Protection"
 mordvin.0036.desc:0 "Dans le cadre de cet Ozks, nous faisons actuellement des invocations à [ROOT.Char.GetFaith.HighGodName] pour demander qu'[ROOT.Char.GetFaith.HighGodNameSheHe|U] nous protège, nous et nos terres, de tout ennemi qui se présenterait. Nos chants sont rigoureux et continus, alors que nous implorons que [ROOT.Char.GetFaith.HighGodNameSheHe|U] entende nos prières - nous pouvons et défendrons nos foyers, mais ce sera beaucoup plus facile avec l'aide divine !"
 mordvin.0036.a:0 "Notre communauté, notre peuple survivra !"
 mordvin.0036.toast:0 "Les [ROOT.Char.Custom('DefaultPriestTitlePlural')] disent que [ROOT.Char.GetFaith.HighGodName] nous protégera !"
 mordvin.0037.t:0 "Résoudre les problèmes"
 mordvin.0037.desc:0 "Les grandes fêtes d'ozks sont l'occasion pour les gens de se réunir pour résoudre des problèmes urgents, tels que des conflits entre eux ou divers problèmes locaux. Je rencontre diverses personnes pendant les ozks et, bien que leur vie mondaine ne me concerne pas nécessairement, j'apprends beaucoup en entendant parler de ces problèmes et de la manière dont les gens tentent de les résoudre."
 mordvin.0037.a:0 "C'est très instructif !"
 mordvin.0038.t:0 "Compétitions sportives"
 mordvin.0038.desc:0 "Lors des grandes fêtes, des compétitions sportives sont souvent organisées dans un esprit de fête et d'amusement. De la lutte au tir à l'arc, en passant par la course à pied et bien d'autres sports, le spectacle est magnifique. Il y a tant à voir, et je m'amuse beaucoup à encourager les compétiteurs."
 mordvin.0038.a:0 "Tout le monde passe un bon moment."
 mordvin.0039.t:0 "Gagnants du concours"
 mordvin.0039.desc:0 "Les compétitions sportives sont un élément commun de ces grandes fêtes d'ozks. En plus d'être divertissantes à regarder, elles constituent également une bonne occasion pour les guerriers - ou ceux qui pourraient être appelés aux armes - de pratiquer leurs compétences dans divers arts martiaux, de l'archerie au lancer de couteaux et plus encore. Traditionnellement, les vainqueurs de ces jeux étaient nommés #italic ushmandeys#!, c'est-à-dire des commandants militaires au sein de la communauté.\n\n"
 mordvin.0039.desc.winner_knight:0 "L'un des $knight_culture_player_plural_no_tooltip_lowercase$ de ma cour, [warrior.GetTitledFirstName], s'est distingué[warrior.Custom('FR_E')] lors de ces compétitions, remportant de nombreuses victoires. [warrior.GetSheHe|U] a ainsi reçu le titre de #italic ushmandey#! en récompense."
 mordvin.0039.desc.winner_local:0 "Je félicite les vainqueurs des diverses compétitions, et ils ont reçu le titre de #italic ushmandey#! pour leurs exploits."
 mordvin.0039.a:0 "Tous les concurrents se sont bien comportés, quoi qu'il en soit !"
 mordvin.0040.t:0 "Dansant"
 mordvin.0040.desc:0 "Comme pour toutes les bonnes fêtes, la danse joue un rôle important dans les grandes célébrations d'Ozks. Les participants à cette fête d'Ozks se sont rassemblés pour effectuer une danse en rond, s'amusant et se réunissant, unis, en tant que communauté. C'est grâce à ces rituels que nous nous rapprochons les uns des autres, de nos ancêtres et [ROOT.Char.GetFaith.PantheonTerm3]."
 mordvin.0040.a:0 "Et c'est amusant !"
 mordvin.0041.t:0 "Prières pour le ménage"
 mordvin.0041.desc:0 "Lors des Ozks, je vois certaines des femmes locales prier [ROOT.Char.GetFaith.HouseholdGodName] pour la santé et le bonheur de leurs familles. Tout le monde sait qu'en maintenant une bonne ambiance pendant les Ozks, nous pouvons attirer de bonnes énergies qui chassent le malheur de nos foyers."
 mordvin.0041.a:0 "Espérons que leurs prières seront exaucées."
 mordvin.0042.t:0 "Festin à l'Ozks"
 mordvin.0042.desc:0 "Aucune fête ne serait complète sans un grand banquet, et ce grand Ozks ne déroge pas à la règle ! Dans le cadre des festivités et des célébrations, un festin composé de toutes sortes de viandes, de pains, de légumes, de fruits, de champignons, de poissons et bien d'autres choses encore. Tout le monde s'amuse en mangeant à sa faim et en socialisant avec les autres."
 mordvin.0042.a:0 "Je me concentrerai sur la nourriture !"
 mordvin.0042.b:0 "Je veux rencontrer tout le monde."
 mordvin.0043.t:0 "La grande bougie #italic Shtatol#!"
 mordvin.0043.desc:0 "Selon l'ancienne coutume [ROOT.Char.GetFaith.GetAdjective], la gigantesque bougie #italic shtatol#! érigée sur le grand tertre au centre de cette fête d'Ozks a été réalisée grâce aux contributions en cire de toutes les familles impliquées, des plus pauvres aux plus riches.\n\nMoi, en tant que [ROOT.Char.GetTitleAsNameNoTooltip], j'ai évidemment contribué à la fabrication de cette bougie avec des quantités importantes de cire.\n\nQuoi qu'il en soit, la croyance traditionnelle veut que plus cette bougie est grande, plus nous sommes prospères et puissants en tant que communauté."
 mordvin.0043.a:0 "La #italic shtatol#! symbolise notre unité et notre force."
 mordvin.0044.t:0 "Soupe à la viande de taureau"
 mordvin.0044.desc:0 "Au début de cet Ozks, un taureau a été sacrifié [ROOT.Char.GetFaith.PantheonTerm2] dans le cadre de divers rites traditionnels [ROOT.Char.GetFaith.GetAdherentNamePlural]. Le taureau, bien sûr, symbolise la longévité et la santé.\n\nMaintenant que la fête bat son plein, le taureau sacrifié a été écorché par des hommes spécialement désignés, avant d'être cuisiné par des femmes chargées de cet honneur. Souvent, la viande du taureau est préparée en soupe avec divers légumes et herbes, comme cela a été le cas cette fois-ci.\n\nJe mange maintenant la soupe de viande de taureau, et je dois dire qu'elle est délicieuse !"
 mordvin.0044.a:0 "Il se marie également très bien avec du pain et du miel."
