 mordvin.0010.t:0 "Préparation du sacrifice de cheval"
 mordvin.0010.desc.intro:0 "Depuis aussi longtemps que quiconque s'en souvienne, le sacrifice de chevaux est une pratique religieuse importante parmi les [host.GetFaith.GetAdherentNamePlural] afin d'honorer [host.GetFaith.PantheonTerm]."
 mordvin.0010.desc.host:0 "Je l'ai fait."
 mordvin.0010.desc.not_host:0 "possède [host.GetTitledFirstName]"
 mordvin.0010.desc.minor:0 "A ordonné qu'un sacrifice mineur de cheval soit tenu à [location.GetName]."
 mordvin.0010.desc.major:0 "A ordonné qu'un sacrifice majeur de chevaux soit organisé à [location.GetName]."
 mordvin.0010.desc.great:0 "A ordonné qu'un grand sacrifice de chevaux soit organisé à [location.GetName]."
 mordvin.0010.desc.conclusion:0 "Les [host.Custom('DefaultPriestTitlePlural')] locaux font déjà les préparatifs nécessaires pour cette cérémonie.\n\nTout le monde espère que [host.GetFaith.PantheonTerm] seront satisfaits de ce sacrifice et accorderont à ce royaume de grandes bénédictions."
 mordvin.0010.a:0 "Il est temps de préparer le sacrifice !"
 mordvin.0011.t:0 "Le sacrifice du cheval"
 mordvin.0011.desc:0 "Le jour du sacrifice de chevaux est arrivé. Je me suis rendu [host.GetFaith.HouseOfWorship2] où un certain nombre de [host.Custom('DefaultPriestTitlePlural')] se sont rassemblés. Ils ont préparé un autel où les chevaux doivent être sacrifiés lors d'une cérémonie [host.GetFaith.GetAdjective].\n\nLes chevaux sont menés à l'autel, où ils sont dûment tués par les [host.Custom('DefaultPriestTitlePlural')]. Pendant ce temps, nous prions tous [host.GetFaith.PantheonTerm] et accomplissons divers rituels.\n\nUne fois la cérémonie terminée, nous remercions les [host.Custom('DefaultPriestTitlePlural')] de nous avoir aidés pour une cérémonie si importante. Espérons que [host.GetFaith.PantheonTerm] ont pris note de notre sacrifice !"
 mordvin.0011.a:0 "Je suis heureux d'y avoir participé."
