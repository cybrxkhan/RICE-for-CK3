l_french:
 # Misc
 RICE_every_volga_beekeeper_county:0 "Tous les [county|El] de votre [domain|El] qui est d'une [culture|El] qui a la [tradition|El] #V $tradition_RICE_volga_apiculture_name$#!"
 RICE_volga_river_region:0 "Bassin de la Volga"
 RICE_culture_in_volga_river_basin_desc:0 "La [culture|El] possède au moins #V 4#! [counties|El] dans le [GetGeographicalRegion('RICE_volga_river_region').GetName]"
 RICE_location_volga_apiculture_county_req:0 "La [culture|El] du [location|El] où est situé votre [domicile|El] a la [tradition|El] #V $tradition_RICE_volga_apiculture_name$#!"

 # Culture
 tradition_RICE_apiculture_name:0 "Apiculteurs"
 tradition_RICE_apiculture_desc:0 "#F Bien que l'apiculture et la chasse au miel soient pratiquées dans le monde entier, cette culture est considérée comme maîtresse de ces arts anciens. Qu'ils interagissent avec les abeilles par le biais d'une apiculture appropriée ou par des interactions plus rudimentaires avec des abeilles sauvages, ils récoltent de nombreux produits précieux des abeilles, en particulier le miel, mais aussi la cire d'abeille, la gelée royale, le pollen, et bien d'autres choses encore.#!"
 tradition_RICE_volga_apiculture_name:0 "Apiculteurs de la Volga"
 tradition_RICE_volga_apiculture_desc:0 "#F Si l'apiculture et la chasse au miel sont pratiquées dans le monde entier, les peuples de la région de la Volga sont réputés pour être des maîtres apiculteurs. Les produits apicoles de valeur, comme le miel et la cire d'abeille, issus de cette culture sont souvent expédiés vers les marchés étrangers ou offerts aux souverains locaux en guise de tribut.#!"
 culture_parameter_unlock_rice_volga_bee_tribute_decision:1 "Débloque la [decision|El] pour #V $RICE_mordvin_extract_beekeeper_tribute$#! pour ceux qui règnent sur des [counties|El] de cette [culture|El]"
 culture_parameter_unlock_rice_volga_bee_product_decision:1 "Débloque la [decision|El] pour #V $RICE_mordvin_acquire_volga_bee_products$#! et l'[interaction|El] pour #V $RICE_mordvin_give_bee_products$#! à d'autres [characters|El]"
 RICE_culture_in_volga_beekeeper_terrain_desc:0 "La [culture|El] n'est présente dans aucun [county|El] avec un [terrain|El] de Terres arables, Plaines inondables, Plaines, Forêts, Collines ou Marécages"
 tradition_RICE_finnic_sorcerers_name:0 "Sorciers du Nord"
 tradition_RICE_finnic_sorcerers_desc:0 "#F La magie est importante dans cette culture et elle est souvent perçue de manière positive ; ceux qui réussissent dans la vie sont souvent considérés comme de puissants sorciers. Dans les pays étrangers, les personnes de cette culture sont craintes et respectées pour leurs prétendues capacités en matière de sorcellerie.#!"

 # Modifiers
 RICE_mordvin_beekeeper_tribute_extracted:0 "Tribut extorqué des apiculteurs de la Volga"
 RICE_mordvin_beekeeper_tribute_extracted_desc:0 "Ce personnage a récemment exigé un tribut supplémentaire de miel, de cire d'abeille et d'autres produits apicoles de la part des villages locaux sous leur juridiction, connus pour leur industrie apicole."
 RICE_mordvin_beekeeper_tribute_extracted_county:0 "Tribut supplémentaire rendu par les apiculteurs de la Volga"
 RICE_mordvin_beekeeper_tribute_extracted_county_desc:0 "Bien que les apiculteurs de cette région paient régulièrement un tribut en produits apicoles tels que le miel et la cire d'abeille à ceux qui les gouvernent, les autorités ont récemment exigé qu'ils paient encore plus."
 RICE_mordvin_honey:0 "Miel des abeilles de la Volga"
 RICE_mordvin_beeswax:0 "Cire d'abeille des abeilles de la Volga"
 RICE_mordvin_honey_and_beeswax:0 "Miel et cire d'abeille des abeilles de Volga"
 RICE_mordvin_opinion_honey:0 "M'a offert du Miel"
 RICE_mordvin_opinion_beeswax:0 "M'a offert de la cire d'abeille"
 RICE_mordvin_opinion_honey_and_beeswax:0 "M'a offert du miel et de la cire d'abeille"
