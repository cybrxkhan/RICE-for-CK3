 RICE_mordvin_recently_celebrated_ine_ozks:0 "A récemment célébré un Ine Ozks"
 RICE_mordvin_ine_ozks_recently_held:0 "Ine Ozks récemment célébré"
 RICE_mordvin_opinion_family_ozks_time:0 "A passé du temps avec moi lors d'un Ozks"
 RICE_mordvin_ozks_fertility_blessing:0 "Bénédiction de la récolte par un Ozks"
 RICE_mordvin_ozks_defense_blessing:0 "Protection divine contre un Ozks"
 RICE_mordvin_ozks_ushmandey_winner:0 "Ushmandey"
 RICE_mordvin_ozks_ushmandey_winner_desc:0 "Ce personnage a obtenu le titre de #italic Ushmandey#! après avoir remporté plusieurs compétitions sportives lors d'un grand Ozks, une cérémonie de prière traditionnelle mordve, un festival et une fête. Traditionnellement, les vainqueurs de ces jeux étaient nommés #italic Ushmandey#!, ou commandants militaires au sein de la communauté."
 RICE_mordvin_ozks_bull_meat_soup:0 "A mangé une soupe faite à partir d'un taureau sacrifié lors d'un Ozks"
 RICE_mordvin_horses_cast_out_evil:0 "Les chevaux chassent le mal"
 RICE_mordvin_participated_in_water_ozks:0 "Participation à un Ozks pour une divinité de l'eau"
 RICE_mordvin_participated_in_birch_tree_ozks:0 "A participé à un Ozks pour les bouleaux"
 RICE_mordvin_encourages_silent_trade_with_foreigners:0 "Encourage le « commerce silencieux » avec les étrangers"
 RICE_mordvin_merely_tolerates_silent_trade_with_foreigners:0 "Se contente de tolérer le « commerce silencieux » avec les étrangers"
 RICE_mordvin_buzzing_beekeeper_industry:0 "Industrie apicole en plein essor"

 # Interactions
 RICE_mordvin_give_bee_products:0 "Offrir des produits apicoles de la Volga"
 RICE_mordvin_give_bee_products_desc:0 "Offrez du miel, de la cire d'abeille ou les deux, produits par les apiculteurs de la région de la Volga."
