 mordvin.0020.t:0 "Produits de la ruche"
 mordvin.0020.desc:0 "Depuis des siècles, l'apiculture est un élément important de l'économie et de la culture de la région de la Volga. Un certain nombre de localités de mon royaume maintiennent ces traditions apicoles et sont donc réputées pour la qualité de leurs produits apicoles.\n\n"
 mordvin.0020.desc.honey:0 "J'ai donc ordonné aux apiculteurs de mon royaume de préparer une grande quantité de miel à envoyer à [recipient.GetTitledFirstName]. Outre son importance en tant qu'édulcorant alimentaire, le miel possèderait de nombreuses propriétés médicinales."
 mordvin.0020.desc.beeswax:0 "J'ai donc ordonné aux apiculteurs de mon royaume de préparer un grand lot de cire d'abeille à envoyer à [recipient.GetTitledFirstName]. La cire d'abeille est encore plus lucrative que le miel, et possède une variété d'usages pratiques, comme la fabrication de bougies ou de cosmétiques."
 mordvin.0020.desc.honey_and_beeswax:0 "J'ai donc ordonné aux apiculteurs de mon royaume de préparer un grand lot de miel et de cire d'abeille à envoyer à [recipient.GetTitledFirstName]. Ces deux produits ont une variété d'applications, dont je suis sûr que [recipient.GetFirstNameNoTooltip] saura faire bon usage !"
 mordvin.0020.a:0 "J'espère qu'[recipient.GetSheHe] appréciera ce cadeau !"
 mordvin.0021.opening:0 "[actor.Custom2('AppropriateGreeting', recipient)]"
 mordvin.0021.desc.honey:0 "Je souhaite accompagner cette lettre d'un cadeau de miel de haute qualité provenant de mon royaume."
 mordvin.0021.desc.beeswax:0 "Je souhaite accompagner cette lettre d'un cadeau de cire d'abeille de haute qualité provenant de mon royaume."
 mordvin.0021.desc.honey_and_beeswax:0 "Je souhaite accompagner cette lettre d'un cadeau composé de miel et de cire d'abeille de haute qualité provenant de mon royaume."
 mordvin.0021.desc:0 "Je règne sur un certain nombre de colonies qui préservent les traditions apicoles renommées de la région de la Volga. J'aspire sincèrement à partager avec vous ces produits hautement désirables."
 mordvin.0021.a:0 "Un merveilleux cadeau !"
 mordvin.0022.t:0 "$mordvin.0020.t$"
 mordvin.0022.desc:0 "$mordvin.0020.desc$"
 mordvin.0022.desc.honey:0 "J'ai décidé d'acheter une grande quantité de miel aux apiculteurs locaux. Outre son importance en tant qu'édulcorant dans l'alimentation, on attribue au miel de nombreuses propriétés médicinales."
 mordvin.0022.desc.beeswax:0 "J'ai décidé d'acheter une grande quantité de cire d'abeille aux apiculteurs locaux. La cire d'abeille est encore plus lucrative que le miel et a de nombreuses utilisations pratiques, comme la fabrication de bougies ou de cosmétiques."
 mordvin.0022.desc.honey_and_beeswax:0 "J'ai décidé d'acheter une grande quantité de miel et de cire d'abeille auprès d'apiculteurs locaux. Ces deux produits ont de nombreuses applications, dont je suis sûre de pouvoir faire bon usage !"
 mordvin.0022.a:0 "Très bien."
 mordvin.0023.t:0 "Tribut supplémentaire des apiculteurs"
 mordvin.0023.desc:0 "Depuis des générations, l'apiculture est une partie importante de la vie des peuples originaires du bassin de la Volga. J'ai la chance que certaines colonies de mon royaume perpétuent ces traditions. Les produits de la ruche qu'ils fabriquent, comme le miel et la cire d'abeille, se vendent à prix élevé sur les marchés étrangers, nous apportant ainsi beaucoup de richesse et de revenus fiscaux.\n\nCependant, parfois, l'impôt que ces apiculteurs paient ne suffit pas. Parfois, nous avons besoin de plus.\n\nJ'ai donc ordonné aux apiculteurs de mon royaume de nous fournir cette année un tribut plus important que ce que je leur demande habituellement. Ils profitent déjà beaucoup du commerce et bénéficient de divers privilèges qui y sont associés - leur soutirer un peu plus de tribut ne leur fera sûrement pas de mal."
 mordvin.0023.a:0 "C'est une affaire vraiment #italic délicieuse#!... pour moi !"
