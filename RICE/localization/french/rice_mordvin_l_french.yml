 RICE_mordvin_extract_beekeeper_tribute:0 "Exiger un tribut supplémentaire des apiculteurs"
 RICE_mordvin_extract_beekeeper_tribute_desc:0 "Les peuples originaires du bassin de la Volga, comme ceux de mon royaume, sont renommés pour leurs talents en apiculture. Bien que nous prélevions déjà des taxes auprès de divers villages sous forme de produits apicoles tels que le miel, la cire d'abeille, et ainsi de suite, et si nous en extrayions encore #italic davantage#! ?"
 RICE_mordvin_extract_beekeeper_tribute_tooltip:1 "Acquérir de l'[gold|El] supplémentaire en exigeant davantage de tribut des apiculteurs locaux"
 RICE_mordvin_extract_beekeeper_tribute_effect_tooltip_1:1 "Vous recevrez un montant aléatoire entre #V [gold_i|El] [GetPlayer.MakeScope.ScriptValue('RICE_mordvin_beekeeper_extra_tribute_min_value')]#! et #V [gold_i|El] [GetPlayer.MakeScope.ScriptValue('RICE_mordvin_beekeeper_extra_tribute_max_value')]#! #bold maximum#! d'[gold|El]"
 RICE_mordvin_extract_beekeeper_tribute_effect_tooltip_2:1 "Ce montant dépend de votre [stewardship_skill|El] et du nombre de [counties|El] dans votre [domain|El] qui sont d'une [culture|El] avec la [tradition|El] #V $tradition_RICE_volga_apiculture_name$#!"
 RICE_mordvin_extract_beekeeper_tribute_confirm:0 "Prévenez immédiatement les apiculteurs du royaume !"
 RICE_mordvin_extract_beekeeper_tribute_context_tooltip:0 "#emphasis Contexte historique :#! Le long du bassin de la Volga, l'apiculture a toujours été une industrie très rentable, en particulier pour les peuples finno-ougriens et turcs tels que les Mordves, les Mari, les Oudmourtes, les Tchouvaches et les Tatars, entre autres. Le célèbre explorateur arabe du Xe siècle, ibn Fadlan, mentionne par exemple la quantité de miel commercialisée dans cette région. Plus tard, au début de la période moderne, les autorités tsaristes prélevaient un tribut sur ces peuples sous la forme de produits apicoles."
 RICE_mordvin_any_county_has_volga_apiculture_culture_req:0 "Posséder au moins un [county|El] qui est d'une [culture|El] qui possède la [tradition|El] #V $tradition_RICE_volga_apiculture_name$#!"
 RICE_mordvin_acquire_volga_bee_products:0 "Acquérir des produits apicoles de la Volga"
 RICE_mordvin_acquire_volga_bee_products_desc:0 "L'apiculture est une industrie majeure dans le bassin de la Volga depuis des siècles parmi divers peuples, tels que nous autres [ROOT.Char.GetCulture.GetCollectiveNoun|l]. Je devrais acheter quelques produits apicoles pour mon propre bénéfice."
 RICE_mordvin_acquire_volga_bee_products_tooltip:1 "Vous achèterez du miel, de la cire d'abeille, ou les deux pour vous-même."
 RICE_mordvin_acquire_volga_bee_products_effect_tooltip_1:1 "Vous obtiendrez un [character_modifier|El] positif en fonction de ce que vous choisissez d'acheter"
 RICE_mordvin_acquire_volga_bee_products_confirm:0 "Rendons visite aux apiculteurs locaux !"
 RICE_mordvin_acquire_volga_bee_products_context_tooltip:0 "$RICE_mordvin_extract_beekeeper_tribute_context_tooltip$"
