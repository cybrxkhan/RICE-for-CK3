 mordvin.0050.t:0 "Chevaux sacrés"
 mordvin.0050.desc:0 "Les chevaux sont grandement honorés par tous les [ROOT.Char.GetFaith.GetAdherentNamePlural] dévots, car on croit qu'ils chassent les forces maléfiques.\n\nLors d'occasions importantes, comme aujourd'hui, il est traditionnel de faire sortir les chevaux pour une chevauchée. On croit que cela chassera tout mal présent ici, car les chevaux briseraient les jambes de tout esprit malveillant.\n\nEspérons que ma maisonnée ne sera sujette à aucun malheur dans un avenir proche !"
 mordvin.0050.a:0 "Les chevaux sont véritablement un animal important et vénérable."
 mordvin.0051.t:0 "Un mariage [ROOT.Char.GetFaith.GetAdherentNameNoTooltip]"
 mordvin.0051.desc:0 "Hier, un mariage a été célébré à proximité entre deux jeunes gens appartenant à deux familles de petite noblesse [ROOT.Char.GetFaith.GetAdjective]. En tant que [ROOT.Char.GetTitleAsNameNoTooltip], j'étais l'invité le plus distingué présent.\n\nAujourd'hui, comme le veut la coutume [ROOT.Char.GetFaith.GetAdjectiveNoTooltip], nous participons à un #italic ozks#!, ou une cérémonie de prière publique, dédiée cette fois à [ROOT.Char.GetFaith.WaterGodName]. Durant cet #italic ozks#!, la mariée est conduite vers un point d'eau à proximité, car l'eau symbolise la fertilité. Ensuite, nous chantons de nombreuses chansons et les jeunes qui se sont rassemblés pour l'occasion dansent joyeusement, tandis que nous souhaitons au couple nouvellement marié une vie commune heureuse."
 mordvin.0051.a:0 "Ce fut une expérience amusante."
 mordvin.0052.t:0 "Ozks de l'Eau"
 mordvin.0052.desc:0 "Parmi les [ROOT.Char.GetFaith.GetAdherentNamePlural], les rituels de vénération de l'eau sont importants, car l'eau est symboliquement liée à la fertilité.\n\nAujourd'hui, je participe à un #italic ozks#! coutumier, ou cérémonie de prière publique, dédiée à notre divinité de l'eau, [ROOT.Char.GetFaith.WaterGodName]. Des membres de ma cour, ainsi qu'un certain nombre de [ROOT.Char.Custom('DefaultPriestTitlePlural')], se sont rassemblés près d'un point d'eau pour cette occasion.\n\nLes rituels que nous accomplissons, comme chanter des mélodies dédiées à [ROOT.Char.GetFaith.WaterGodName], ou « féconder » le point d'eau avec un phallus de paille, invoqueront assurément les bénédictions divines et assureront abondance et prospérité pour tous !"
 mordvin.0052.a:0 "Loué soit [ROOT.Char.GetFaith.WaterGodName]!"
 mordvin.0053.t:0 "Ozks de bouleau"
 mordvin.0053.desc:0 "Les arbres sont importants pour les [ROOT.Char.GetFaith.GetAdherentNamePlural], car on croit qu'ils possèdent diverses capacités de guérison et spirituelles, il est donc important que nous leur accordions le respect approprié et que nous les vénérions avec de véritables convictions. Parmi les différents types d'arbres, les bouleaux, ou #italic kelu#!, sont considérés comme l'un des plus sacrés.\n\nAujourd'hui, je participe à un petit #italic ozks#! ou cérémonie de prière adressée à plusieurs bouleaux non loin de chez moi. Tous les présents chantent des chants louant les #italic kelu#!."
 mordvin.0053.a:0 "Si les arbres sont forts, la terre et ses habitants le seront aussi !"
 mordvin.0054.t:0 "Les redoutables et féroces [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip|l]"
 mordvin.0054.desc:0 "J'ai entendu des histoires sur la façon dont les gens des terres étrangères disent que nous autres [ROOT.Char.GetCulture.GetCollectiveNoun|l] sommes stoïquement vicieux, au point que nous tuerions tout étranger qui poserait le pied sur nos terres, et refuserions de leur parler même lorsque nous commerçons avec eux. Il ne fait aucun doute que nous avons toute une réputation, qu'elle soit justifiée ou non !"
 mordvin.0054.a:0 "Il est normal que nos ennemis tremblent en entendant parler de nous !"
 mordvin.0054.b:0 "Ces histoires sont des exagérations de notre force et de notre bravoure."
 mordvin.0054.info:0 "\n#emphasis Contexte historique :#! Certaines sources islamiques médiévales, comme celle du voyageur et géographe du Xe siècle al-Istakhri, mentionnent un lieu appelé #italic al-arsanija#! dont les féroces habitants tuaient tout étranger qui mettait le pied sur leur terre.\n\nIl existe un certain nombre de théories concurrentes dans la recherche moderne sur l'emplacement d'#italic al-arsanija#! et sur l'identité de ses habitants, mais les ancêtres des peuples mordves - les Erzyas et les Mokshas - sont un candidat probable. Frère Julien, un moine et explorateur hongrois du XIIIe siècle, mentionna la supposée sauvagerie des Mordves, tandis qu'une autre source hongroise contemporaine affirme qu'« Aucun de ces Mordves n'ose mettre une sandale à ses pieds avant d'avoir tué au moins un homme. »\n\nQue de telles affirmations sur les Mordves médiévaux soient exagérées ou non, il est clair qu'ils étaient perçus comme un peuple redoutable par les étrangers."
 mordvin.0055.t:0 "Commerce silencieux"
 mordvin.0055.desc:0 "Un marchand éminent venu d'une terre lointaine visite mon royaume. Bien qu'il ne parle pas notre langue, il est considéré comme habile dans ce qu'on appelle le 'commerce silencieux' que de nombreux marchands étrangers utilisent lorsqu'ils nous rendent visite. Cette forme de communication, basée sur des gestes, a été développée il y a longtemps par des [ROOT.Char.GetCulture.GetCollectiveNoun|l] et des marchands qui commerçaient avec nous.\n\nQuoi qu'il en soit, ce marchand visite ma cour, et il est clair que malgré notre incapacité à communiquer verbalement l'un avec l'autre, il est heureux de me rencontrer, et reconnaissant que mon règne ait - selon lui - été bénéfique pour les marchands étrangers comme lui."
 mordvin.0055.a:0 "Les échanges peuvent se faire même si nous ne partageons pas la même langue !"
 mordvin.0055.b:0 "La coutume du commerce silencieux existe car nous ne faisons que tolérer les étrangers."
 mordvin.0055.info:0 "#emphasis Contexte historique :#! Quelques sources historiques de la période médiévale, comme celle d'Abu Hamid, un voyageur et explorateur andalou du XIIe siècle, mentionnent que les marchands non autochtones opérant dans la région de la Volga utilisaient parfois une sorte de langage des signes ou de « commerce silencieux » lorsqu'ils commerçaient avec les peuples finno-ougriens indigènes de la région."
 mordvin.0056.t:0 "Une industrie bourdonnante"
 mordvin.0056.desc:0 "Depuis un certain temps déjà, nous [ROOT.Char.GetCulture.GetCollectiveNoun|l] sommes réputés pour nos talents en apiculture. Récemment, pour diverses raisons, les apiculteurs de [county.GetNameNoTier] ont été encore plus productifs que d'habitude, générant de plus grands profits pour la région et stimulant l'économie locale."
 mordvin.0056.a:0 "Une terre de miel... et de profit !"
