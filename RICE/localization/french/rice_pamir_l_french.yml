 pamir.0020.t:0 "Le guerrier Burusho"
 pamir.0020.desc:0 "Un guerrier nommé [RICE_burusho_warrior_spawn.GetTitledFirstName], originaire d'un clan Burusho, est arrivé à ma cour pour m'offrir ses services. Les Burusho, également connus sous le nom de Hunza, vivent dans les vallées de nos territoires dans les montagnes du Pamir et du Karakoram et parlent une langue unique, différente de toute autre. Ce sont un peuple isolé qui vit principalement entre eux, mais ils sont connus comme des guerriers féroces bien que têtus."
 pamir.0020.a:0 "Il nous servira bien ! Souhaitons-lui la bienvenue."
 pamir.0020.b:0 "L'entêtement n'est pas une qualité. Nous déclinerons poliment."
 pamir.0021.t:0 "Les visiteurs Burusho"
 pamir.0021.desc:0 "Des membres d'un clan Burusho arrivent à ma cour pour m'offrir leurs services. Ils se nomment [RICE_burusho_courtier_spawn_1.GetTitledFirstName] et [RICE_burusho_courtier_spawn_2.GetTitledFirstName]. Les Burusho, également connus sous le nom de Hunza, vivent dans les vallées de nos territoires dans les montagnes du Pamir et du Karakoram et parlent une langue unique, différente de toute autre. C'est un peuple isolé qui vit principalement en retrait, mais qui est réputé pour être féroce et robuste."
 pamir.0021.a:0 "Accueillons-les à notre cour. Ils seront d'une grande aide !"
 pamir.0021.b:0 "Féroces et résistants ? Ça a l'air dangereux. Non merci."
 pamir.0022.t:0 "Le guerrier du Kafiristan"
 pamir.0022.desc:0 "Un guerrier païen nommé [RICE_kafir_warrior_spawn.GetTitledFirstName], originaire de l'une des tribus du soi-disant Kafiristan (la terre des infidèles), une région montagneuse située entre l'Afghanistan et le Cachemire, est arrivé à ma cour pour offrir ses services. Ces tribus qui habitent ces vallées et hauts plateaux préservés sont réputées pour leur résistance farouche contre toute influence ou occupation par les adeptes d'autres religions, qu'ils soient musulmans, bouddhistes, hindous, zoroastriens ou autres. Il pourrait être utile d'avoir un guerrier d'une telle tribu à mon service."
 pamir.0022.a:0 "Je suis ravi qu'il y en ait un qui veuille nous rejoindre plutôt que nous combattre !"
 pamir.0022.b:0 "Non merci - je n'ai pas besoin d'un homme aussi dangereux et violent."
 pamir.0023.t:0 "Les visiteurs du Kafiristan"
 pamir.0023.desc:0 "Quelques personnes appartenant à l'une des tribus du soi-disant Kafiristan (la terre des infidèles), la région montagneuse située entre l'Afghanistan et le Cachemire, sont arrivées à ma cour pour offrir leurs services. Leurs noms sont [RICE_kafir_courtier_spawn_1.GetTitledFirstName] et [RICE_kafir_courtier_spawn_2.GetTitledFirstName]. Ces tribus qui habitent ces vallées et hauts plateaux préservés sont réputées pour leur résistance farouche contre toute influence ou occupation par les adeptes d'autres religions, qu'ils soient musulmans, bouddhistes, hindous, zoroastriens ou autres. Il pourrait être utile d'avoir des contacts issus d'une telle tribu à mon service."
 pamir.0023.a:0 "Utile en effet ! Accueillez-les à ma cour."
 pamir.0023.b:0 "Je n'ai aucun intérêt à les garder dans les parages."
 pamir.0024.t:0 "Le guerrier brahoui"
 pamir.0024.desc:0 "Un guerrier nommé [RICE_brahui_warrior_spawn.GetTitledFirstName], originaire d'un clan Brahui, arrive à ma cour pour m'offrir ses services. Les Brahui sont un groupe de tribus principalement nomades ou semi-nomades qui auraient migré au Baloutchistan il y a des générations. Ils forment un groupe divisé et décentralisé, non unifié sous un seul chef, bien qu'ils interagissent parfois avec les peuples plus sédentaires autour d'eux. Il pourrait être utile d'avoir un guerrier d'une telle tribu à mon service."
 pamir.0024.a:0 "Je pense pouvoir faire bon usage de cet homme."
 pamir.0024.b:0 "Je n'ai nul besoin d'un nomade peu fiable."
 pamir.0025.t:0 "Les visiteurs brahuis"
 pamir.0025.desc:0 "Quelques membres de tribus issus d'un clan Brahui arrivent à ma cour pour m'offrir leurs services. Leurs noms sont [RICE_brahui_courtier_spawn_1.GetTitledFirstName] et [RICE_brahui_courtier_spawn_2.GetTitledFirstName]. Les Brahui sont un groupe de tribus principalement nomades ou semi-nomades qui auraient migré au Baloutchistan il y a des générations. Ils forment un groupe divisé et décentralisé, non unifié sous un quelconque chef, bien qu'ils interagissent parfois avec les peuples plus sédentaires autour d'eux. Il pourrait être utile d'avoir des contacts issus d'une telle tribu à mon service."
 pamir.0025.a:0 "Bienvenue ! Je peux toujours utiliser plus d'aide par ici."
 pamir.0025.b:0 "Des barbares divisés et décentralisés ? Ça ne m'intéresse pas."
