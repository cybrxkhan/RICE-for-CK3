 pamir.0111.t:0 "Arrivée des Brahui"
 pamir.0111.desc:0 "Depuis plusieurs générations, un grand nombre de tribus de langue dravidienne ont cheminé vers le nord depuis leurs terres d'origine en Inde centrale. Connus sous le nom de #V Brahui#!, ils se sont installés dans certaines parties du Baloutchistan en plusieurs vagues, ont absorbé certaines tribus locales et se sont récemment convertis à l'islam. Là, ils se sont trouvé une nouvelle patrie, où ils poursuivent leur mode de vie traditionnel de nomades et semi-nomades. Il reste à voir quelle sera la nature de leur relation avec les dirigeants locaux qui revendiquent la domination sur ces terres."
 pamir.0111.a:0 "Intéressant à savoir..."
 RICE_pamir_brahui_migrations_happened_text:0 "Les #V Brahui#! achèvent leur migration vers le Baloutchistan, et des [courtiers|El] brahui ont désormais une chance d'apparaître pour les [rulers|El] de la région"
 pamir.0112.t:0 "xxxxx"
 pamir.0112.desc:0 "xxxxx"
 pamir.0112.a:0 "xxxxx"
 pamir.0113.t:0 "Nasir Khusraw"
 pamir.0113.desc:0 "Pendant des années, j'ai entendu parler d'un saint homme musulman connu sous le nom de [nasir_khusraw.GetFullName], qui voyageait de royaume en royaume en quête de refuge. Bien que grand poète et érudit, célèbre dans tout le monde islamique pour ses accomplissements, il était la cible de dirigeants sectaires, et ne trouva jamais de véritable foyer - jusqu'à maintenant.\n\nJ'ai reçu des nouvelles qu'il est arrivé dans la région du Badakhshan, et s'y est établi dans les parties escarpées et isolées de [nasir_khusraw_county.GetNameNoTier] en particulier. Il semble qu'il se soit trouvé un ami et protecteur en la personne du vertueux et érudit [nasir_khusraw_buddy.GetTitledFirstName], qui apprécie les enseignements spirituels et philosophiques de [nasir_khusraw.GetFullName].\n\nImaginer qu'un personnage si célèbre honore désormais de sa présence cette partie reculée du monde ! À présent, [nasir_khusraw.GetFullName] souhaite y répandre la lumière de l'Islam - peut-il réussir ?"
 pamir.0113.a:0 "Intéressant à entendre."
 pamir.0113.tooltip:0 "[nasir_khusraw_buddy.GetTitledFirstName] sera-t-il en mesure d'assister son ami et mentor [nasir_khusraw|El] pour apporter la lumière de l'Islam au Badakhshan ? Seul le temps nous le dira."
 pamir.0114.t:0 "xxxxx"
 pamir.0114.desc:0 "xxxxx"
 pamir.0114.a:0 "xxxxx"
 pamir.0115.t:0 "Le prince féerique retourne aux cieux"
 pamir.0115.desc:0 "[azur_jamshid.GetTitledFirstName], le prince féerique et sauveur de [gilgit_county.GetNameNoTier], n'est plus, car il est récemment décédé. Il y a des années, il mena le peuple de [gilgit_county.GetNameNoTier] vers un avenir meilleur et plus radieux lorsqu'ils renversèrent et tuèrent le tyran cannibale, le roi [shri_badat.GetTitledFirstName]. Cependant, bien qu'il ne soit plus parmi nous, il est probable que les habitants continueront de célébrer son héritage pour les générations à venir."
 pamir.0115.a:0 "Intéressant..."
 pamir.0115.tooltip:0 "Avec la disparition d'[azur_jamshid|El], si ou une fois que le [county_modifier|El] [GetModifier('RICE_pamir_shri_badats_palace').GetNameWithTooltip] a été retiré via la [decision|El] de #V Raser le palais de Shri Badat#! également, les [rulers|El] dans les [duchies|El] du #V Pamir#! et du #V Ladakh#! peuvent prendre une [decision|El] pour #V Parrainer le festival de Tumshiling#!."
 pamir.0115.tooltip.evil_azur_jamshid:0 "Bien qu'[azur_jamshid|El] soit décédé, il a trahi le peuple qu'il avait initialement sauvé en perpétuant l'héritage des restes cruels de Badat. Il est lui-même devenu un tyran et a rénové le palais du précédent tyran, et il sera perçu négativement pour les générations à venir. Ainsi, les [rulers|El] dans les [duchies|El] du #V Pamir#! et du #V Ladakh#! n'auront jamais accès à la [decision|El] de #V Parrainer le Festival de Tumshiling#! comme ils le pourraient normalement."
 pamir.0115.tooltip.evil_not_azur_jamshid:0 "Bien qu'[azur_jamshid|El] soit décédé et qu'il puisse être rappelé dans le folklore local, l'héritage du cruel Shri Badat perdure. Non seulement son palais est toujours debout, mais il a été rénové, et les habitants vivent dans la peur. Ainsi, les [rulers|El] dans les [duchies|El] du #V Pamir#! et du #V Ladakh#! n'auront jamais accès à la [decision|El] de #V Parrainer le Festival de Tumshiling#! comme ils le feraient normalement."
 pamir.0115.desc.evil_azur_jamshid:0 "[azur_jamshid.GetTitledFirstName], le prince féerique et sauveur de [gilgit_county.GetNameNoTier], n'est plus. Il y a des années, il mena le peuple de [gilgit_county.GetNameNoTier] vers un avenir meilleur et plus radieux lorsqu'ils renversèrent et tuèrent le tyran cannibale, le roi [shri_badat.GetTitledFirstName]. Cependant, il embrassa les ténèbres dans son cœur et commença à imiter l'homme qu'il avait vaincu, se transformant lui-même en un oppresseur craint et haï. Qui sait ce qui l'a mené sur ce sombre chemin ?\n\nMaintenant, avec sa mort, peut-être le peuple de [gilgit_county.GetNameNoTier] obtiendra-t-il quelque répit. Peut-être pas. Quoi qu'il en soit, il ne sera pas rappelé avec tendresse dans le folklore de la région."
 pamir.0115.desc.evil_not_azur_jamshid:0 "[azur_jamshid.GetTitledFirstName], le prince féerique et sauveur de [gilgit_county.GetNameNoTier], n'est plus, car il est récemment décédé. Il y a des années, il mena le peuple de [gilgit_county.GetNameNoTier] vers un avenir meilleur et plus radieux lorsqu'ils renversèrent et tuèrent le tyran cannibale, le roi [shri_badat.GetTitledFirstName]. Malheureusement, un nouveau tyran apparut avant qu'[azur_jamshid.GetFirstName] ne puisse achever sa tâche de guérir la terre, et ce tyran perpétua le terrible héritage de [shri_badat.GetTitledFirstName]. Bien qu'on se souvienne de [azur_jamshid.GetTitledFirstName] avec affection, il s'effacera probablement de la mémoire des habitants."
 pamir.0116.t:0 "xxxxx"
 pamir.0116.desc:0 "xxxxx"
 pamir.0116.a:0 "xxxxx"
 pamir.0117.t:0 "L'essor des Khalaj"
 pamir.0117.desc:0 "L'arrière-pays du monde iranien oriental a vu de nombreux peuples aller et venir au cours des derniers siècles. C'est ici, dans ces montagnes escarpées, ces vallées et ces plaines que la richesse, la guerre et le culte se mêlent de plus d'une façon.\n\nAprès l'effondrement de l'empire hephthalite, les héritiers des [hephthalite.GetCollectiveNoun|l] ont établi un certain nombre d'États résiduels dans cette région. La présence de différents peuples, qu'ils soient natifs ou issus de diverses migrations, a transformé la composition politique, culturelle et ethnique de cet arrière-pays au fil du temps.\n\nDans des terres autrefois gouvernées par les puissants [hephthalite.GetCollectiveNounNoTooltip|l], un nouveau peuple, les [my_new_culture.GetCollectiveNoun|l], a émergé récemment. Leurs origines sont difficiles à distinguer, mais incluent certainement celles de nos compatriotes [old_culture.GetCollectiveNoun|l]. Ces nouvelles tribus sont principalement d'héritage $heritage_turkic_name$, mais possèdent également un fort patrimoine $heritage_iranian_name$."
 pamir.0117.a:0 "Nous faisons désormais partie des puissants [my_new_culture.GetCollectiveNoun|l] !"
 pamir.0117.b:0 "Non, nous nous identifions toujours comme les anciens [old_culture.GetCollectiveNounNoTooltip|l]."
