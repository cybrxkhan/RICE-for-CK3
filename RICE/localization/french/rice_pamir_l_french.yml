 pamir.0005.t:0 "Le Destin des Pamirs"
 pamir.0005.desc:0 "Avec le califat abbasside en déclin, les Pamirs sont un chaos de seigneurs de guerre locaux qui cherchent à exploiter les richesses trouvées ici, en particulier le lapis-lazuli, un produit lucratif des mines de Sar-i Sang. Bien que les Samanides gouvernent nominalement ces hautes terres, leur autorité est contestée par leurs puissants vassaux, les Banijurides, ainsi que par de petits chefs qui règnent ici depuis l'ère hephthalite."
 pamir.0005.a:0 "Mon destin ne se trouve auprès d'aucun de ces seigneurs de guerre."
 pamir.0005.b:0 "Notre histoire est celle des Banijurides..."
 pamir.0005.c:0 "Notre histoire est celle des rois Puteshan..."
 pamir.0005.d:0 "Notre histoire est celle des chefs du Wakhan..."
 pamir.0005.e:0 "Notre histoire est celle des chefs de Shughnan..."
 pamir.0005.f:0 "Notre histoire est celle des chefs de Karran..."
 pamir.0005.g:0 "Notre histoire est celle du prince féerique, Azur Jamshid..."
 pamir.0005.tooltip.no:0 "Vous continuerez à jouer en tant que [THIS.Char.GetTitledFirstNameNoTooltip]. Cependant, notez que les [counties|El] du [duchy|El] de [badakhshan_duchy.GetNameNoTier] seront toujours divisés entre divers petits chefs qui sont soit bouddhistes, soit païens."
 pamir.0005.tooltip:0 "Les [counties|El] du [duchy|El] [badakhshan_duchy.GetNameNoTier] ont été partagés entre divers petits chefs qui sont soit bouddhistes, soit païens. Si vous choisissez de jouer l'un d'entre eux, pourrez-vous survivre dans ces montagnes escarpées contre toute attente ?"
 pamir.0005.tooltip.banijurid:0 "Vous choisirez de jouer les Banijurides, qui possèdent désormais leurs territoires historiques à l'ouest des Pamirs."
 pamir.0005.tooltip.azur_jamshid:0 "Vous choisirez de jouer en tant que [azur_jamshid.GetTitledFirstName], le légendaire prince féerique et sauveur de Gilgit."
 pamir.0005.info.banijurid:0 "\n#emphasis Contexte historique :#! Les Banijurides étaient une dynastie iranienne qui régna sur Balkh de 847 à 948 en tant que vassaux des Samanides, et avaient également leur capitale à Hulbuk (ou Khuttal). Ils exerçaient peut-être un certain degré de pouvoir au sein du royaume samanide, car ils ne payaient apparemment aucun impôt aux Samanides et frappaient leur propre monnaie.\n\nLa bonne fortune des Banijurides ne dura pas, car ils soutinrent une rébellion contre les Samanides en 948, ce qui entraîna leur chute. Curieusement, cependant, ils semblent avoir survécu jusqu'au début du XIe siècle sous les Ghaznévides."
 pamir.0005.info.puteshan:0 "\n#emphasis Contexte historique :#! « Puteshan » était le nom du Badakhshan tel que translittéré par le moine et pèlerin coréen du VIIIe siècle Hyecho dans le récit de ses voyages. Il note qu'ils étaient de fervents bouddhistes mais sous la domination des Arabes."
 pamir.0005.info.wakhan:0 "\n#emphasis Contexte historique :#! Selon le moine et pèlerin coréen du VIIIe siècle Hyecho, le Wakhan était, à l'époque de ses voyages, un faible royaume bouddhiste sous la domination des Arabes."
 pamir.0005.info.shughnan:0 "\n#emphasis Contexte historique :#! Dans le récit de ses voyages, le moine et pèlerin coréen du VIIIe siècle Hyecho mentionne que le Shughnan, ou Shighnan, était divisé en neuf petits royaumes, représentés dans RICE par les chefs du Shughnan et du Karran.\n\nHyecho affirme également, curieusement, que le bouddhisme était inconnu au Shughnan à cette époque, suggérant peut-être qu'ils pratiquaient diverses croyances indigènes."
 pamir.0005.info.azur_jamshid:0 "\n#emphasis Contexte historique :#! Selon la légende, les dirigeants médiévaux et du début de l'époque moderne de Gilgit descendaient d'un prince féerique perse nommé Azur Jamshid. Il tua un roi cannibale tyrannique nommé Shri Badat avec l'aide de la fille du tyran, Nur Bakht. Après avoir régné en tant que nouveau roi pendant quelques années, il abdiqua en faveur de son épouse, qui abdiqua plus tard en faveur de leur fils, Garg.\n\nPlus tard, leurs descendants changèrent leur nom de famille de Kayani à Trakhan et diverses branches de la famille allèrent régner sur certaines des vallées voisines également."
 pamir.0006.t:0 "xxxxx"
 pamir.0006.desc:0 "xxxxx"
 pamir.0006.a:0 "xxxxx"
 pamir.0007.t:0 "Badakhshan, terre du Lapis-Lazuli"
 pamir.0007.desc.puteshan:0 "Mes ancêtres, les rois Puteshan, ont gouverné [badakhshan_duchy.GetNameNoTier] pendant des générations, et furent même mentionnés élogieusement par des voyageurs comme le pèlerin bouddhiste coréen Hyecho il y a un siècle. En effet, nous sommes surtout célèbres pour notre mécénat du bouddhisme. Avec le contrôle des mines de lapis-lazuli, cette région prospérera assurément, bien que nous devions nous méfier des étrangers, qu'ils soient iraniens, arabes, tibétains, turcs, chinois, ou quelque chose de tout autre.\n\n"
 pamir.0007.desc.non_puteshan:0 "Ma famille est l'un des derniers vestiges des autrefois puissants nomades Hephthalites. Parce que ma branche a dominé cette partie de [badakhshan_duchy.GetNameNoTier] depuis de nombreuses générations, les chefs et les anciens d'ici me considèrent comme le plus prestigieux d'entre eux et leur leader. En raison de notre position centrale sur la Route de la Soie, nous devons nous méfier des étrangers qui cherchent à nous exploiter, qu'ils soient Iraniens, Arabes, Tibétains, Turcs, Chinois, ou quelque chose de tout autre.\n\n"
 pamir.0007.desc:0 "Le retrait des forces chinoises et tibétaines de la région il y a un siècle a laissé un vide de pouvoir, mais dans les vallées reculées de [badakhshan_duchy.GetNameNoTier], nous restons relativement tranquilles tant que nous ne causons pas de troubles à nos suzerains musulmans. Hélas, il est difficile de dire combien de temps un tel état de fait peut durer, et la route à venir sera difficile. Depuis ma base de pouvoir dans ce coin reculé du monde, j'espère être à la hauteur de la tâche de le protéger !"
 pamir.0007.a:0 "Ainsi commence un nouveau chapitre dans l'histoire du Pamir..."
 pamir.0008.t:0 "Le Destin des Pamirs"
 pamir.0008.desc:0 "Les terres du Khorasan sont tombées sous la domination de deux puissantes dynasties turques, les Seldjoukides et les Ghaznévides. Cependant, leur autorité est faible dans les hauts plateaux du Pamir et des montagnes de l'Hindu Kush, où de féroces tribus indépendantes et des seigneurs de guerre demeurent parmi les vallées et les cols de montagne. Depuis des générations, cette région est un kaléidoscope de différentes croyances, cultures et langues.\n\nÀ [badakhshan_duchy.GetNameNoTier], j'ai entendu dire qu'y demeure un sage et vénéré saint homme musulman connu sous le nom de [nasir_khusraw.GetFullName]. Son patron et ami de longue date est le juste et érudit [ali_ibn_asad.GetTitledFirstName], qui partage des intérêts mutuels pour les questions spirituelles et philosophiques.\n\nQuoi qu'il en soit, qui sait ce que l'avenir réserve encore au Pamir ?"
 pamir.0008.a:0 "En tant que [ROOT.Char.GetTitledFirstName], j'ai un intérêt dans l'avenir de cette région."
 pamir.0008.b:0 "Mon histoire est avec l'intellectuel [ali_ibn_asad.GetTitledFirstName]..."
 pamir.0008.c:0 "En réalité, mon histoire se trouve auprès des Kayanis de [gilgit_county.GetNameNoTier]..."
 pamir.0008.tooltip.no:0 "Vous continuerez à jouer en tant que [THIS.Char.GetTitledFirstNameNoTooltip]. Cependant, notez que [badakhshan_duchy.GetNameNoTier] sera toujours possédé par [ali_ibn_asad.GetTitledFirstName]."
 pamir.0008.tooltip.yes:0 "Le [duchy|El] de [badakhshan_duchy.GetNameNoTier] est gouverné par l'érudit [ali_ibn_asad.GetTitledFirstName]. Si vous choisissez de le jouer, serez-vous capable d'assister votre ami et mentor [nasir_khusraw|El] pour apporter la lumière de l'Islam en ces terres ?"
 pamir.0008.tooltip.kayani:0 "Les territoires proches de [gilgit_county.GetNameNoTier] sont gouvernés par [nur_kayani.GetTitledFirstName], descendant du héros légendaire Azur Jamshid. Saura-t-il perpétuer l'héritage de ses ancêtres ?"
 pamir.0009.t:0 "Ali ibn Asad et Nasir Khusraw"
 pamir.0009.desc:0 "Je suis [ROOT.Char.GetTitledFirstName], souverain des montagnes reculées et des vallées de [badakhshan_duchy.GetNameNoTier], la frontière du #italic Dar al-Islam#! qui borde les terres #italic kafir#! de l'Hindustan et du Tibet. Beaucoup ici s'accrochent encore à leurs anciennes pratiques idolâtres. Pourtant, j'ai acquis une réputation de dirigeant intellectuel et ouvert d'esprit.\n\nPar exemple, mon ami [nasir_khusraw.GetFullName] a fait face à épreuve après épreuve dans les terres d'autres souverains musulmans, bien qu'il soit respecté tant par les roturiers chiites que sunnites en tant que saint homme vertueux ; ces seigneurs de guerre considèrent son credo [nasir_khusraw.GetFaith.GetAdherentName] comme une hérésie. J'ai vu les choses différemment, et je lui ai offert refuge dans mes terres.\n\nDepuis son arrivée, nous avons eu de merveilleux échanges intellectuels. Je sens qu'il est l'homme qui apportera la lumière de l'Islam à cette terre. À tel point, en fait, que je ne peux m'empêcher de me demander si mes croyances [ROOT.Char.GetFaith.GetAdjectiveNoTooltip]s actuelles sont justes. Peut-être que la vérité [nasir_khusraw.GetFaith.GetAdjective] est ce que j'ai cherché depuis le début."
 pamir.0009.a:0 "Je respecte mon ami, [nasir_khusraw.GetFullName], mais nos opinions sur la foi divergent."
 pamir.0009.b:0 "[nasir_khusraw.GetFullName] m'a montré la lumière ! Je dois changer mes habitudes."
 pamir.0009.info:0 "\n#emphasis Contexte historique :#! Nasir Khusraw, en tant qu'érudit, voyageur et saint homme, est plus connu que son ami, Ali ibn Asad, le souverain du Badakhshan au milieu des années 1000. Après avoir rédigé son dernier ouvrage, La Réconciliation de la philosophie et de la religion (#italic Jami al-Hikmatayn#!), à la demande d'Ali, Nasir Khusraw mourut aux alentours de 1070 ap. J.-C. ou après."
