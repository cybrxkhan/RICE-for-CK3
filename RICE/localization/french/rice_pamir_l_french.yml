 pamir.0180.t:0 "Préparatifs pour Tumshiling"
 pamir.0180.desc:0 "Bien que le festival de Tumshiling se tienne régulièrement au début de l'hiver chaque année, je crois qu'il est temps que je parraine officiellement l'une de ces célébrations dans un village voisin. Pour ceux qui vivent dans les hautes altitudes de la région du Pamir, en particulier près de [gilgit_county.GetNameNoTier], c'est un événement important pour commémorer la légende de l'héroïque [azur_jamshid.GetTitledFirstName], et comment il renversa le tyran cannibale [shri_badat.GetTitledFirstName] qui régna jadis et opprima le peuple de [gilgit_county.GetNameNoTier]."
 pamir.0180.a:0 "Préparons-nous !"
 pamir.0181.t:0 "Début du Tumshiling"
 pamir.0181.desc:0 "Le Festival de Tumshiling est presque là ! Plusieurs jours avant son début, les provisions de viande pour l'hiver ont été mises à sécher. Bien que le festival célèbre le triomphe de [azur_jamshid.GetTitledFirstName] sur [shri_badat.GetTitledFirstName] à [gilgit_county.GetNameNoTier], c'est aussi un rituel important pour s'assurer que les villageois locaux aient assez de nourriture pour survivre à l'hiver."
 pamir.0181.a:0 "J'espère que cet hiver ne sera pas trop rude pour nous."
 pamir.0182.t:0 "Le grand bûcher"
 pamir.0182.desc:0 "Enfin, aujourd'hui - ou plutôt ce soir - c'est le Festival de Tumshiling. Dès que le soleil se couche, de nombreux hommes sortent du village, portant des torches et jouant de la musique, et les jettent dans un grand feu de joie.\n\nSelon la légende, le cruel [shri_badat.GetTitledFirstName] avait un cœur fait de beurre, alors pour le vaincre, [azur_jamshid.GetTitledFirstName] et les habitants rassemblèrent de nombreuses torches et les empilèrent autour du palais où vivait [shri_badat.GetTitledFirstName] pour détruire son cœur. Certains disent que cela tua le tyran, mais beaucoup d'autres disent que cela ne fit que l'affaiblir, et qu'il se cache dans l'une de ces vallées, utilisant une magie impure pour maudire la population de temps à autre, c'est pourquoi il est nécessaire de reproduire cet événement."
 pamir.0182.a:0 "Qui sait s'il est encore là ?"
 pamir.0183.t:0 "Chants et célébrations"
 pamir.0183.desc:0 "Alors que nous observons tous avec satisfaction le grand bûcher brûler, les villageois commencent à chanter diverses chansons sur la victoire de [azur_jamshid.GetTitledFirstName] sur [shri_badat.GetTitledFirstName], dont certaines remonteraient supposément à cette époque. Par exemple, il y a une chanson qui aurait été chantée par un villageois lorsque lui et les autres roturiers furent chargés par [azur_jamshid.GetTitledFirstName] de détruire le palais de [shri_badat.GetTitledFirstName] :\n\n#italic « Ma nature est d'un métal dur », dit un jour Shri Badat.\nMais moi, Khoto, fils du paysan Dem Singh, seul suis robuste ;\navec cette bêche de fer je rase ton royal palais.\nRegarde maintenant, bien que tu sois de race maudite,\nmoi, fils de Dem Singh, suis d'un métal dur ;\ncar avec cette bêche de fer j'aplatis ton palais même ;\ngare à toi ! gare à toi !#!"
 pamir.0183.a:0 "Amusez-vous bien !"
