 activity_RICE_pamir_chinir_festival_predicted_cost:"Le coût du Festival de Chinir est basé sur votre [income|El] et les [activity_options|El] que vous sélectionnez."
 activity_RICE_pamir_chinir_festival_conclusion_desc:"Le [GetActivityType( 'activity_RICE_pamir_chinir_festival' ).GetName] de cette année s'est terminé. Célébrer la saison des récoltes est un moment si festif et excitant."
 RICE_pamir_chinir_festival_porridge_amount:"Quantité de bouillie"
 RICE_pamir_chinir_festival_porridge_amount_none: "Aucune"
 RICE_pamir_chinir_festival_porridge_amount_none_desc:"Vous ne gagnerez pas de [prestige_i|El] [prestige|El] supplémentaire à la conclusion du Festival de Chinir.\n\n#weak Je fais déjà beaucoup pour aider les habitants à préparer le festival de Chinir de cette année. Pourquoi devraient-ils s'attendre à ce que je fournisse encore plus sous la forme de ce porridge ?#!"
 RICE_pamir_chinir_festival_porridge_amount_small: "Petite"
 RICE_pamir_chinir_festival_porridge_amount_small_desc:"Vous gagnerez [prestige_i|El] #V 50#! supplémentaires lorsque le festival de Chinir se conclura.\n\n#weak Pendant le festival de Chinir, il est de coutume que les gens apportent des bols de bouillie de blé sucrée préparée dans leur foyer au festin de Chinir, accompagnés de pain et de viandes, pour les partager avec d'autres familles.#!"
 RICE_pamir_chinir_festival_porridge_amount_medium: "Moyenne"
 RICE_pamir_chinir_festival_porridge_amount_medium_desc:"Vous gagnerez [prestige_i|El] #V 100#! supplémentaires lorsque le Festival de Chinir se conclura.\n\n#weak En fournissant aux autres familles une quantité décente de porridge (ainsi que d'autres aliments) durant le festin de Chinir, je peux prouver que je suis un dirigeant généreux et attentionné.#!"
 RICE_pamir_chinir_festival_porridge_amount_large: "Grande"
 RICE_pamir_chinir_festival_porridge_amount_large_desc:"Vous gagnerez [prestige_i|El] #V 150#! supplémentaires lorsque le Festival de Chinir se conclura.\n\n#weak En tant que dirigeant de ces terres, ne suis-je pas obligé de pourvoir aux besoins de ceux sous mon autorité ? Nous ne préparerons qu'une quantité massive du plus fin porridge, et d'autres mets raffinés, à offrir à tous durant le festin de Chinir.#!"
 RICE_pamir_chinir_festival_harvest_phase:"Récolte"
 RICE_pamir_chinir_festival_harvest_phase_desc:"C'est la saison des récoltes !"
 RICE_pamir_chinir_festival_celebration_intent_header: "Célébration :"
 RICE_pamir_chinir_festival_celebration_intent: "Célébration"
 RICE_pamir_chinir_festival_celebration_intent_desc:"Quand la récolte est suffisamment abondante, il est tout à fait convenable que le festival de Chinir qui en résulte soit une occasion joyeuse et festive ! Vous êtes assuré de perdre du [stress_i|El] [stress|El], et d'en perdre encore plus si vous êtes [GetTrait('gregarious').GetName( GetNullCharacter )], [GetTrait('content').GetName( GetNullCharacter )], ou [GetTrait('gluttonous').GetName( GetNullCharacter )]."
 RICE_pamir_chinir_festival_community_intent_header: "Communauté :"
 RICE_pamir_chinir_festival_community_intent: "Communauté"
 RICE_pamir_chinir_festival_community_intent_desc:"Vous souhaitez vous concentrer sur vos devoirs envers la communauté, en veillant à ce que la récolte se déroule sans encombre et que les liens sociaux soient renforcés. Votre [capital|El] obtient le [county_modifier|El] [GetModifier('RICE_pamir_successful_chinir_festival').GetNameWithTooltip] pendant #V 5#! ans."
