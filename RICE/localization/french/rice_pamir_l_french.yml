 RICE_pamir_goat_sacrifice_completed_log:0 "[CHARACTER.GetShortUIName|U] a accompli son sacrifice de chèvre"
 RICE_goat_sacrifice_number_of_goats_amount:0 "Nombre de chèvres à sacrifier"
