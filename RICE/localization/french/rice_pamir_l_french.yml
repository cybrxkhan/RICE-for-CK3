 pamir.0101.t:0 "La mort de Nasir Khusraw"
 pamir.0101.desc:0 "J'ai reçu la nouvelle que le grand [nasir_khusraw.GetFullName] vient de s'éteindre. Il n'était pas seulement un poète éloquent et un brillant érudit, mais aussi un homme saint qui cherchait à répandre la lumière de l'Islam (et plus précisément celle de la secte [nasir_khusraw.GetFaith.GetAdjective]) dans les terres du [badakhshan_duchy.GetNameNoTier] dans l'est de l'Afghanistan. Pour cette raison, il était vénéré tant par les musulmans chiites que sunnites.\n\nComme [nasir_khusraw.GetFullName] a vécu en ermite non loin du hameau de Yamgan dans le [badakhshan_county.GetNameNoTier] pendant une grande partie de la fin de sa vie, ses disciples ont ramené son corps là-bas pour y être enterré. Ils érigent un petit sanctuaire en son honneur, et la nouvelle s'est déjà répandue au loin concernant les pèlerins qui souhaitent se rendre à Yamgan pour rendre hommage à ce saint homme bien-aimé."
 pamir.0101.a:0 "Certes, nous appartenons à Allah, et c'est vers Lui que nous retournerons tous."
 pamir.0101.tooltip:0 "Avec la disparition de [nasir_khusraw|El], le [ruler|El] du [county|El] de [badakhshan_county.GetNameNoTier] peut désormais [decide|El] d'#V Agrandir le sanctuaire de Nasir Khusraw#!. Une fois cela fait, cela débloquera la possibilité pour les musulmans vivant dans ou près de [badakhshan_duchy.GetName] de partir en [go_on_a_pilgrimage_to_nasir_khusraws_shrine|El]."
 pamir.0102.t:0 "Le sanctuaire de Nasir Khusraw"
 pamir.0102.desc:0 "Depuis que le grand [nasir_khusraw.GetFullName] est décédé, une petite mais dévouée cohorte de musulmans issus de toutes les sectes, tant chiites que sunnites, ont afflué vers sa tombe pour rendre hommage à ce poète, érudit et saint homme. Là, ces pèlerins trouvent l'inspiration pour se rapprocher d'Allah à travers son exemple. Sa tombe se trouve près du hameau de Yamgan, qui se situe dans mes territoires en [badakhshan_county.GetNameNoTier].\n\nC'est pourquoi j'ai décidé de consacrer quelques fonds à la construction d'un humble mais solide sanctuaire autour de sa tombe. Désormais, il disposera d'un lieu de repos digne de ce nom, et convenable pour quelqu'un comme lui. Cela devrait attirer encore plus de pèlerins dans la région et contribuer à stimuler l'économie locale, et, bien entendu, il n'est jamais inutile d'honorer ce saint homme."
 pamir.0102.a:0 "Je suis heureux d'avoir pu faire cela."
 RICE_pamir_enable_nasir_khusraw_pilgrimage_desc:0 "Les musulmans vivant dans ou près de [badakhshan_county.GetName] peuvent désormais partir en [go_on_a_pilgrimage_to_nasir_khusraws_shrine|El]."
 pamir.0103.t:0 "Le sanctuaire de Nasir Khusraw"
 pamir.0103.desc:0 "Depuis que le grand [nasir_khusraw.GetFullName] est décédé, une petite mais dévouée cohorte de musulmans issus de toutes les sectes, chiites comme sunnites, ont afflué vers sa tombe pour rendre hommage à ce poète, érudit et saint homme. Là, ces pèlerins trouvent l'inspiration pour se rapprocher d'Allah à travers son exemple. Sa tombe est située près du petit hameau de Yamgan qui se trouve à [badakhshan_county.GetNameNoTier], actuellement gouverné par [badakhshan_ruler.GetTitledFirstName].\n\nQue ce soit par admiration sincère pour Nasir Khusraw, ou comme un stratagème cynique, [badakhshan_ruler.GetTitledFirstName] a décidé de consacrer des fonds à la construction d'un humble mais solide sanctuaire autour de la tombe de Nasir Khusraw. Ainsi, il disposera d'un lieu de repos convenable, digne d'un saint homme vénéré comme lui."
 pamir.0103.a:0 "Des nouvelles intéressantes..."
 pamir.0104.t:0 "Comment réconcilier religion et philosophie ?"
 pamir.0104.desc:0 "Récemment, je ne cesse de penser à ce long poème que j'ai lu il y a longtemps. Écrit par un obscur intellectuel persan nommé Abu al-Haytham al-Jurjani, il pose une série de questions réfléchies et stimulantes sur la religion et la philosophie, et il me pousse à reconsidérer mes propres croyances. En particulier, bien que je me considère comme une personne éduquée, j'ai du mal à réconcilier les problèmes entre la religion et la philosophie classique que le poème aborde.\n\nJe décide d'approcher [nasir_khusraw.GetFullName] à ce sujet, car tout le monde sait qu'il est empli de sagesse et de brillantes intuitions. En fait, je lui ai dit que j'étais prêt à lui commander d'écrire une réponse au poème d'Al-Jurjani. À mon soulagement, il a dit qu'il était disposé à faire une telle chose."
 pamir.0104.a:0 "J'ai hâte de voir le résultat final !"
 pamir.0105.t:0 "xxxxx"
 pamir.0105.desc:0 "xxxxx"
 pamir.0105.a:0 "xxxxx"
 pamir.0106.opening:0 "À l'intellectuel [ROOT.Char.GetTitleAsNameNoTooltip] [ROOT.Char.GetFirstNameNoTooltip] :"
 pamir.0106.desc:0 "Il y a quelque temps, vous m'avez demandé de vous fournir un éclairage et des conseils concernant les questions soulevées par Abu al-Haytham al-Jurjani dans son poème pensif et stimulant. J'ai passé de nombreuses nuits à contempler les questions qu'il a posées, et à coucher mes réflexions par écrit.\n\nCette copie de mon manuscrit, que j'appelle #italic La Réconciliation de la Philosophie et de la Religion#!, contient mes réponses à ces questions. J'espère qu'à sa lecture, vos doutes seront effacés, votre esprit illuminé, et votre foi en Allah renforcée."
 pamir.0106.a:0 "C'est une véritable source d'inspiration - j'ai hâte de le lire en entier !"
 pamir.0107.t:0 "La dernière œuvre de Nasir Khusraw"
 pamir.0107.desc:0 "[nasir_khusraw.GetFullName] est décédé récemment, et nous avons tous été attristés d'apprendre la perte non seulement d'un homme d'une grande sagesse et piété, mais aussi d'un bon ami.\n\nIl n'y a pas si longtemps, je lui avais commandé d'écrire sur le poème déroutant composé par un certain Abu al-Haytham al-Jurjani, un poème qui m'avait fait remettre en question ma propre foi et ma place dans le monde. Une partie de moi se demandait si je trouverais véritablement les réponses que je cherchais, si [nasir_khusraw.GetFullName] n'était plus sur cette terre pour me guider.\n\nCependant, peut-être par quelque miracle, l'un de ses disciples a découvert un manuscrit sur lequel il travaillait avant de mourir. Il est intitulé #italic La Réconciliation de la Philosophie et de la Religion#!, et à ma grande joie, il répond parfaitement aux questions posées par le poème d'al-Jurjani. C'est comme si [nasir_khusraw.GetFullName] me parlait depuis les cieux !"
 pamir.0107.a:0 "Mashallah, mes doutes sont effacés, mon esprit éclairé, ma foi en Allah renforcée !"
