 # Buildings
 building_type_RICE_pamir_lapis_lazuli_mines_01:0 "Mines de lapis-lazuli de Sar-i Sang"
 building_type_RICE_pamir_lapis_lazuli_mines_01_desc:0 "Cette région abrite les célèbres mines de Sar-i Sang. Pendant des siècles, elle a produit l'écrasante majorité des lapis-lazuli du monde, une magnifique pierre bleue très appréciée par les cultures du monde entier depuis l'Antiquité."
 building_RICE_pamir_lapis_lazuli_mines_01:0 "Colonie minière de Lapis Lazuli"
 building_RICE_pamir_lapis_lazuli_mines_01_desc:0 "Quelques petits villages situés dans les vallées de Sar-i Sang abritent des mineurs qui travaillent jour et nuit dans cette mine, principale source de lapis-lazuli au monde."
 building_RICE_pamir_lapis_lazuli_mines_02:0 "Mine de Lapis Lazuli"
 building_RICE_pamir_lapis_lazuli_mines_02_desc:1 "Les opérations minières sont devenues plus sophistiquées et de plus grandes quantités de lapis-lazuli sont exportées. Des ingénieurs ont été recrutés pour améliorer la production de la mine et des marchands se sont installés pour accélérer le transport du lapis-lazuli."
 building_RICE_pamir_lapis_lazuli_mines_03:0 "Grande mine de Lapis Lazuli"
 building_RICE_pamir_lapis_lazuli_mines_03_desc:0 "Les villages de la région produisent une bonne quantité de lapis-lazuli pour les marchés mondiaux, ce qui apporte beaucoup de richesse à la région."
 building_RICE_pamir_lapis_lazuli_mines_04:0 "Complexe minier de Lapis Lazuli"
 building_RICE_pamir_lapis_lazuli_mines_04_desc:0 "Les colonies de cette région, d'une taille et d'une population sans précédent depuis l'époque des anciens pharaons et césars, extraient de grandes quantités de lapis-lazuli pour le monde entier."
 building_type_RICE_pamir_ruby_mines_01:0 "Mines de rubis de Kuh-i Lal"
 building_type_RICE_pamir_ruby_mines_01_desc:0 "Cette région abrite les mines de rubis de Kuh-i Lal, actives depuis plusieurs siècles."
 building_RICE_pamir_ruby_mines_01:0 "Colonie minière de rubis"
 building_RICE_pamir_ruby_mines_01_desc:0 "Quelques petits villages dans les vallées locales abritent des mineurs qui travaillent jour et nuit pour extraire des rubis."
 building_RICE_pamir_ruby_mines_02:0 "Mine de rubis"
 building_RICE_pamir_ruby_mines_02_desc:1 "Les opérations minières sont devenues plus sophistiquées et de plus grandes quantités de rubis sont exportées. Des ingénieurs ont été recrutés pour améliorer la production de la mine et des marchands se sont installés pour accélérer le transport des rubis."
 building_RICE_pamir_ruby_mines_03:0 "Grande mine de rubis"
 building_RICE_pamir_ruby_mines_03_desc:0 "Les villages de la région produisent une bonne quantité de rubis pour les marchés mondiaux, ce qui apporte beaucoup de richesse à la région."
 building_RICE_pamir_ruby_mines_04:0 "Complexe minier de rubis"
 building_RICE_pamir_ruby_mines_04_desc:0 "Les colonies importantes et prospères de cette région extraient de grandes quantités de rubis qui sont exportés vers les marchés du monde entier."
 building_type_RICE_pamir_khewra_salt_mines_01:0 "Mines de sel de Khewra"
 building_type_RICE_pamir_khewra_salt_mines_01_desc:0 "La mine de Khewra est une importante mine de sel située dans la chaîne saline du Pendjab. Elle est réputée pour sa production de sel rose, dit sel de l'Himalaya."
 building_RICE_pamir_khewra_salt_mines_01:0 "Colonie minière de sel"
 building_RICE_pamir_khewra_salt_mines_01_desc:0 "Un certain nombre de colonies existent à proximité des gisements de sel que l'on trouve ici. La quantité de sel extraite par les colons est relativement faible à l'heure actuelle."
 building_RICE_pamir_khewra_salt_mines_02:0 "Mine de sel"
 building_RICE_pamir_khewra_salt_mines_02_desc:1 "Les colonies d'exploitation du sel commencent à s'agrandir, et des quantités croissantes de sel sont produites. Un système d'exploitation minière approprié (bien que rudimentaire) avec des tunnels commence à prendre forme."
 building_RICE_pamir_khewra_salt_mines_03:0 "Grande mine de sel"
 building_RICE_pamir_khewra_salt_mines_03_desc:0 "Le développement de l'exploitation minière s'accompagne d'un besoin accru en infrastructures, en logements, etc. Les commerçants ont également commencé à étendre leurs activités ici."
 building_RICE_pamir_khewra_salt_mines_04:0 "Complexe minier de sel"
 building_RICE_pamir_khewra_salt_mines_04_desc:0 "Grâce à un vaste complexe minier bien organisé, de grandes quantités de sel sont achetées ici chaque jour. Des marchands du monde entier viennent échanger ce sel."
 
 # Modifiers
 RICE_pamir_land_of_the_kafirs:0 "Terre des Kafirs"
 RICE_pamir_land_of_the_kafirs_desc:0 "Depuis des générations, certaines des vallées et des cols de montagne de cette région sont habités par diverses tribus païennes qui ont farouchement résisté à toute soumission ou influence d'États bouddhistes, zoroastriens, hindous ou musulmans organisés. Elles sont si féroces qu'elles imposent souvent un tribut régulier à leurs voisins non païens. Les souverains sages les laissent généralement tranquilles, et leur mode de vie ancestral n'est donc pratiquement pas perturbé. Dans l'ensemble, ces hautes terres situées entre l'Afghanistan, le nord de l'Inde et le Tibet sont connues par dérision des musulmans sous le nom de « Kafiristan », le pays des infidèles."
 RICE_pamir_nasir_khusraw:0 "Nasir Khusraw"
 RICE_pamir_nasir_khusraw_desc:0 "Nasir Khusraw est largement considéré comme l'un des plus grands poètes vivants de la langue persane. Bien qu'il ait commencé par être un fonctionnaire seldjoukide menant un style de vie luxueux et décadent, il a fait un rêve qui a transformé sa vision de l'univers. Après quelques épreuves et tribulations, et plusieurs pèlerinages à La Mecque, il est devenu le saint homme sage et le missionnaire de l'islam qu'il est aujourd'hui."
 RICE_pamir_wakhan_watchposts_default:0 "Postes de surveillance du corridor de Wakhan"
 RICE_pamir_wakhan_watchposts_default_desc:0 "Le réseau de postes de surveillance du corridor de Wakhan a été utilisé par différentes puissances pendant des siècles, notamment par les dirigeants locaux et les empires tibétain et chinois. Ils montent la garde sur plusieurs cols et routes clés le long de la route de la soie afin d'assurer la sécurité et la prospérité de la région."
 RICE_pamir_karakoram_watchposts_default:0 "Postes de surveillance des montagnes du Karakoram"
 RICE_pamir_karakoram_watchposts_default_desc:0 "Le réseau de postes de surveillance des montagnes du Karakoram a été utilisé par différentes puissances pendant des siècles, notamment par les dirigeants locaux et les empires tibétain et chinois. Ils montent la garde sur plusieurs cols et routes clés le long de la route de la soie afin d'assurer la sécurité et la prospérité de la région."
 RICE_pamir_visited_bibi_fatima_fertility:0 "Amélioration de la fertilité grâce aux sources thermales de Bibi Fatima"
 RICE_pamir_visited_bibi_fatima_fertility_desc:0 "Ce personnage s'est récemment rendu aux sources chaudes de Bibi Fatima, dans les montagnes du Pamir. Il est supposé, comme le dit le folklore local, que le fait de se baigner dans ces eaux a amélioré la fertilité de cette personne."
 RICE_pamir_visited_bibi_fatima_fertility_muslim:0 "Amélioration de la fertilité grâce aux sources thermales de Bibi Fatima"
 RICE_pamir_visited_bibi_fatima_fertility_muslim_desc:0 "Ce musulman (ou ancien musulman) s'est récemment rendu aux sources chaudes de Bibi Fatima, dans les montagnes du Pamir. Il est supposé, comme le dit le folklore local, que le fait de se baigner dans ces eaux a amélioré la fertilité de cette personne."
 RICE_pamir_brahui_tribes:0 "Tribus Brahui"
 RICE_pamir_brahui_tribes_desc:0 "Les Brahui, un groupe de langue dravidienne composé de clans nomades et semi-nomades, ont migré dans cette région il y a de nombreuses générations. Ils ont leurs propres traditions et coutumes, et les dirigeants locaux les laissent généralement faire."
 RICE_pamir_wakhan_recently_repaired_small:0 "Réparations mineures récentes aux postes de surveillance du Wakhan"
 RICE_pamir_wakhan_recently_repaired_medium:0 "Réparations majeures récentes des postes de guet du Wakhan"
 RICE_pamir_wakhan_recently_repaired_large:0 "Les postes de surveillance du Wakhan ont récemment fait l'objet d'importantes réparations"
 RICE_pamir_karakoram_recently_repaired_small:0 "Réparations mineures récentes aux postes de surveillance du Karakoram"
 RICE_pamir_karakoram_recently_repaired_medium:0 "Réparations majeures récentes aux postes de surveillance du Karakoram"
 RICE_pamir_karakoram_recently_repaired_large:0 "Réparations significatives récentes des postes de guet du Karakoram"
 RICE_pamir_nasir_khusraw_shrine:0 "Sanctuaire de Nasir Khusraw"
 RICE_pamir_nasir_khusraw_shrine_desc:0 "Un important sanctuaire a été construit autour de la tombe de Nasir Khusraw, le célèbre saint homme, érudit et poète ismaélien. Les musulmans de toutes les confessions viennent ici en pèlerinage pour lui rendre hommage et réfléchir à leur propre cheminement spirituel."
 RICE_pamir_illuminated_by_nasir_khusraw:0 "Illuminé par Nasir Khusraw"
 RICE_pamir_illuminated_by_nasir_khusraw_desc:0 "Les doutes de ce personnage sur sa foi n'ont plus lieu d'être. Le grand poète, érudit et saint homme Nasir Khusraw a écrit à leur demande un texte intitulé « Réconciliation de la philosophie et de la religion » pour répondre à certaines questions difficiles qu'ils se posaient sur l'univers."
 RICE_pamir_nasir_khusraw_final_work:0 "Composition du travail final"
 RICE_pamir_nasir_khusraw_final_work_desc:0 "Après une vie de culte spirituel, de conseils et d'enseignement, le grand poète et érudit Nasir Khusraw travaille d'arrache-pied à l'écriture de ce qui pourrait être sa dernière œuvre littéraire."
 RICE_pamir_zun_blessing_small:0 "Bénédiction de Zun (mineure)"
 RICE_pamir_zun_blessing_small_desc:0 "On dit que ce personnage a reçu une bénédiction mineure de Zun, le donneur de justice !"
 RICE_pamir_zun_blessing_medium:0 "Bénédiction de Zun (majeure)"
 RICE_pamir_zun_blessing_medium_desc:0 "On dit que ce personnage a reçu une importante bénédiction de Zun, le donneur de justice !"
 RICE_pamir_zun_blessing_large:0 "Bénédiction de Zun (grande)"
 RICE_pamir_zun_blessing_large_desc:0 "On dit que ce personnage a reçu une grande bénédiction de Zun, le donneur de justice !"
 RICE_pamir_dezaw_blessing_small:0 "Bénédiction de Dezaw (mineure)"
 RICE_pamir_dezaw_blessing_small_desc:0 "On dit que ce personnage a reçu une petite bénédiction de Dezaw, le grand dieu créateur."
 RICE_pamir_dezaw_blessing_medium:0 "Bénédiction de Dezaw (majeure)"
 RICE_pamir_dezaw_blessing_medium_desc:0 "On dit que ce personnage a reçu une importante bénédiction de Dezaw, le grand dieu créateur."
 RICE_pamir_dezaw_blessing_large:0 "Bénédiction de Dezaw (grande)"
 RICE_pamir_dezaw_blessing_large_desc:0 "On dit que ce personnage a reçu une grande bénédiction de Dezaw, le grand dieu créateur."
 RICE_pamir_mahandeo_blessing_small:0 "Bénédiction de Mahandeo (mineure)"
 RICE_pamir_mahandeo_blessing_small_desc:0 "On dit que ce personnage a reçu une petite bénédiction de Mahandeo, le dieu de la guerre qui veille sur les récoltes."
 RICE_pamir_mahandeo_blessing_medium:0 "Bénédiction de Mahandeo (majeure)"
 RICE_pamir_mahandeo_blessing_medium_desc:0 "On dit que ce personnage a reçu une importante bénédiction de Mahandeo, le dieu de la guerre qui veille sur les récoltes."
 RICE_pamir_mahandeo_blessing_large:0 "Bénédiction de Mahandeo (grande)"
 RICE_pamir_mahandeo_blessing_large_desc:0 "On dit que ce personnage a reçu une grande bénédiction de Mahandeo, le dieu de la guerre qui veille sur les récoltes."
 RICE_pamir_indra_blessing_small:0 "Bénédiction d'Indra (mineure)"
 RICE_pamir_indra_blessing_small_desc:0 "On dit que ce personnage a reçu une petite bénédiction d'Indra, le puissant et redoutable seigneur divin du bétail, celui de l'arc-en-ciel."
 RICE_pamir_indra_blessing_medium:0 "Bénédiction d'Indra (majeure)"
 RICE_pamir_indra_blessing_medium_desc:0 "On dit que ce personnage a reçu une importante bénédiction d'Indra, le puissant et redoutable seigneur divin du bétail, celui de l'arc-en-ciel."
 RICE_pamir_indra_blessing_large:0 "Bénédiction d'Indra (grande)"
 RICE_pamir_indra_blessing_large_desc:0 "On dit que ce personnage a reçu une grande bénédiction d'Indra, le puissant et redoutable seigneur divin du bétail, celui de l'arc-en-ciel."
 RICE_pamir_dezalik_blessing_small:0 "Bénédiction de Dezalik (mineure)"
 RICE_pamir_dezalik_blessing_small_desc:0 "On dit que ce personnage a reçu une petite bénédiction de Dezalik, sœur de Dezaw et protectrice des femmes, des enfants et du foyer."
 RICE_pamir_dezalik_blessing_medium:0 "Bénédiction de Dezalik (majeure)"
 RICE_pamir_dezalik_blessing_medium_desc:0 "On dit que ce personnage a reçu une importante bénédiction de Dezalik, sœur de Dezaw et protectrice des femmes, des enfants et du foyer."
 RICE_pamir_dezalik_blessing_large:0 "Bénédiction de Dezalik (grande)"
 RICE_pamir_dezalik_blessing_large_desc:0 "On dit que ce personnage a reçu une grande bénédiction de Dezalik, sœur de Dezaw et protectrice des femmes, des enfants et du foyer."
 RICE_pamir_balumain_blessing_small:0 "Bénédiction de Balumain (mineure)"
 RICE_pamir_balumain_blessing_small_desc:0 "On dit que ce personnage a reçu une bénédiction mineure de Balumain, la divinité héroïque qui a enseigné aux humains comment vivre et comment vénérer."
 RICE_pamir_balumain_blessing_medium:0 "Bénédiction de Balumain (majeure)"
 RICE_pamir_balumain_blessing_medium_desc:0 "On dit que ce personnage a reçu une importante bénédiction de Balumain, la divinité héroïque qui a enseigné aux humains comment vivre et comment vénérer."
 RICE_pamir_balumain_blessing_large:0 "Bénédiction de Balumain (grande)"
 RICE_pamir_balumain_blessing_large_desc:0 "On dit que ce personnage a reçu une grande bénédiction de Balumain, la divinité héroïque qui a enseigné aux humains comment vivre et comment vénérer."
 RICE_pamir_jestak_blessing_small:0 "Bénédiction de Jestak (mineure)"
 RICE_pamir_jestak_blessing_small_desc:0 "On dit que ce personnage a reçu une petite bénédiction de Jestak, déesse de la famille, du mariage et de la vie domestique."
 RICE_pamir_jestak_blessing_medium:0 "Bénédiction de Jestak (majeure)"
 RICE_pamir_jestak_blessing_medium_desc:0 "On dit que ce personnage a reçu une importante bénédiction de Jestak, déesse de la famille, du mariage et de la vie domestique."
 RICE_pamir_jestak_blessing_large:0 "Bénédiction de Jestak (grande)"
 RICE_pamir_jestak_blessing_large_desc:0 "On dit que ce personnage a reçu une grande bénédiction de Jestak, déesse de la famille, du mariage et de la vie domestique."
 RICE_pamir_recently_attended_chinir:0 "A récemment assisté à la célébration d'un festival de Chinir"
 RICE_pamir_recently_attended_chinir_desc:0 "La saison des récoltes a été bonne !"
 RICE_pamir_recently_attended_chawmos:0 "Le festival de Chawmos a eu lieu récemment"
 RICE_pamir_nasir_khusraw_inspiration_diplomatic:0 "Spirituellement inspiré par Nasir Khusraw (diplomatique)"
 RICE_pamir_nasir_khusraw_inspiration_martial:0 "Spirituellement inspiré par Nasir Khusraw (martial)"
 RICE_pamir_nasir_khusraw_inspiration_stewardship:0 "Spirituellement inspiré par Nasir Khusraw (intendance)"
 RICE_pamir_nasir_khusraw_inspiration_intrigue:0 "Spirituellement inspiré par Nasir Khusraw (intrigue)"
 RICE_pamir_nasir_khusraw_inspiration_learning:0 "Spirituellement inspiré par Nasir Khusraw (savoir)"
 RICE_pamir_nasir_khusraw_pilgrimage_done:0 "A effectué un pèlerinage au sanctuaire de Nasir Khusraw"
 RICE_pamir_chailaksambaik:0 "Chailaksambaik"
 RICE_pamir_chailaksambaik_desc:0 "Cet enfant a récemment accompli le rituel de Chailaksambaik, une étape qui lui permettra d'être accueilli dans la communauté en tant qu'adulte."
 RICE_pamir_butsambaik:0 "Butsambaik"
 RICE_pamir_butsambaik_desc:0 "Cet enfant a récemment accompli le rituel de Butsambaik, une étape qui lui permettra d'être accueilli dans la communauté en tant qu'adulte."
 RICE_pamir_chawmos_fox_good:0 "Renard trouvé en train de remonter une pente"
 RICE_pamir_chawmos_fox_good_desc:0 "Lors d'un récent festival de Chawmos qui s'est tenu ici, un renard a été trouvé en train de monter une côte, ce qui signifie que la région va connaître la bonne fortune pendant un certain temps."
 RICE_pamir_chawmos_fox_bad:0 "Renard trouvé en train de dévaller une pente"
 RICE_pamir_chawmos_fox_bad_desc:0 "Lors d'un récent festival de Chawmos organisé ici, un renard a été trouvé en train de descendre, ce qui signifie que la région va connaître une mauvaise fortune pendant un certain temps."
 RICE_pamir_recently_organized_chawmos:0 "A récemment organisé un festival de Chawmos"
 RICE_pamir_zun_idol_is_restored:0 "Idole de Zun"
 RICE_pamir_zun_idol_is_restored_desc:0 "Les zunistes de la région ont construit une grande idole en or de Zun, dotée de magnifiques yeux en rubis provenant des mines de rubis du Badakhshan."
 RICE_pamir_restored_zun_idol:0 "A restauré l'idole de Zun"
 RICE_pamir_ali_ibn_asad_converted:0 "Protecteur de l'ismaélisme"
 RICE_pamir_ali_ibn_asad_converted_desc:0 "Ali ibn Asad, en tant que souverain, s'est efforcé de défendre les Ismaéliens contre les autres sectes islamiques. Il est devenu un fervent croyant et, grâce à sa vision intellectuelle, il est un important mécène pour les missionnaires et les penseurs ismaéliens tels que Nasir Khusraw."
 RICE_pamir_ali_ibn_asad_unconverted:0 "L'émir ouvert d'esprit"
 RICE_pamir_ali_ibn_asad_unconverted_desc:0 "Ali ibn Asad est considéré comme un dirigeant plutôt tolérant à une époque de conflits sectaires. En tant que souverain, il s'efforce de subvenir aux besoins de tout musulman, sunnite ou chiite, qui souhaite s'installer sur ses terres, et respecte les érudits d'origines différentes."
 RICE_pamir_purity_of_youth:0 "Pureté de la jeunesse"
 RICE_pamir_purity_of_youth_desc:0 "La prépuberté, pour les adeptes de la religion de cet enfant, est un symbole de pureté et donc de sacré. Quel émerveillement d'assister à l'incarnation vivante des forces bienveillantes du cosmos !"
 RICE_pamir_collected_juniper:0 "A collecté du genévrier"
 RICE_pamir_nomad_clans_good:0 "Des nomades ont récemment emménagé"
 RICE_pamir_nomad_clans_good_desc:0 "Quelques clans de nomades ont récemment migré dans cette partie des montagnes du Pamir. Ils s'entendent bien avec les habitants et contribuent à la vie de la communauté locale."
 RICE_pamir_nomad_clans_bad:0 "Des nomades ont récemment emménagé"
 RICE_pamir_nomad_clans_bad_desc:0 "Quelques clans de nomades ont récemment migré dans cette partie des montagnes du Pamir. Ils se disputent souvent avec la population locale, ce qui entraîne une instabilité au sein de la communauté locale."
 RICE_pamir_nomad_clans_training:0 "La milice nomade entraîne les troupes locales"
 RICE_pamir_burusho_feud:0 "Querelle Burusho"
 RICE_pamir_burusho_feud_desc:0 "Quelques clans locaux Burusho de cette région sont engagés dans une querelle massive."
 RICE_pamir_ate_baht_porridge:0 "A mangé du porridge Baht"
 RICE_pamir_fairy_advice:0 "A reçu des conseils d'un Peri"
 RICE_pamir_fairy_advice_desc:0 "Ce personnage aurait, avec l'aide d'un chaman local, reçu l'aide d'un Peri - le nom d'un type d'esprit féerique couramment trouvé dans le folklore et la mythologie des peuples pamiris et Burusho."
 RICE_pamir_ate_kurut_cheese:0 "A mangé du fromage Kurut"
 RICE_pamir_horny_bowls:0 "Grands bols en corne"
 RICE_pamir_horny_bowls_desc:0 "Ce personnage a récemment reçu en cadeau de grands bols fabriqués à partir des cornes de la race de moutons originaire de la région du Pamir. Là-bas, ils sont connus sous le nom de nakhjipar ou ramapoy."
 RICE_pamir_mulberry_jam_syrup:0 "A beaucoup de confiture et de sirop de mûres"
 RICE_pamir_mulberry_pikht:0 "A beaucoup de pikht de mûres (farine) pour faire du pain"
 RICE_pamir_admiring_buddhist_rock_art:0 "Admire l'art rupestre bouddhiste"
 RICE_pamir_accused_belas:0 "Accusée d'être un Belas"
 RICE_pamir_accused_belas_desc:0 "Cette femme a été accusée d'être un Belas, un type d'esprit vengeur dans le folklore de la région des montagnes du Pamir."
 RICE_pamir_opinion_saved_me_belas:0 "M'a sauvé"
 RICE_pamir_hephthalite_war_inspiration:0 "Inspiré par les anciens guerriers Hephthalites"
 RICE_pamir_hephthalite_peace_inspiration:0 "Inspiré par les anciens commerçants et explorateurs Hephthalites"
 RICE_pamir_ate_moch:0 "A mangé beaucoup de Moch"
 RICE_pamir_ate_moch_desc:0 "Le Moch est une soupe traditionnelle de la région du Pamir, préparée en mélangeant des caillés de fromage avec de l'eau et en les versant sur des légumes cuits. On pense qu'elle renforce particulièrement pendant les mois froids."
 RICE_pamir_chinir_minor_illness:0 "A attrapé une maladie mineure pendant le festival de Chinir"
 RICE_pamir_offering_to_zun_small:0 "A offert quelques trésors à Zun"
 RICE_pamir_offering_to_zun_medium:0 "A offert de nombreux trésors à Zun"
 RICE_pamir_offering_to_zun_large:0 "A offert d'innombrables trésors à Zun"
 RICE_pamir_zun_idol_is_restored_mount_aruna:0 "Idole de Zun sur le mont Aruna"
 RICE_pamir_zun_idol_is_restored_mount_aruna_desc:0 "Les Zunistes de la région ont repris le mont Aruna après des générations et y ont restauré leur idole en or de Zun. Comme celle de Zamindawar, elle est ornée de magnifiques yeux en rubis, provenant des mines de rubis du Badakhshan."
 RICE_pamir_restored_zun_mount_aruna_idol:0 "A restauré l'idole de Zun sur le mont Aruna"
 RICE_pamir_kafir_concessions:0 "Concessions aux Kafirs"
 RICE_pamir_kafir_concessions_desc:0 "La génération actuelle de "Kafirs" de cette région s'intègre de plus en plus et se montre amicale envers leurs voisins plus développés, compte tenu de leur culture et de leurs croyances communes."
 RICE_pamir_is_azur_jamshid:0 "Le prince féerique"
 RICE_pamir_is_azur_jamshid_desc:0 "La légende dit qu'il est le fils de fées descendues du ciel. Il a vaincu et libéré le peuple de Gilgit du règne tyrannique du roi cannibale, Shri Badat."
 RICE_pamir_shri_badats_palace:0 "Palais de Shri Badat"
 RICE_pamir_shri_badats_palace_desc:0 "Bien que le palais de Shri Badat ne soit plus occupé par son infâme roi cannibale (qui a été tué par le juste Azur Jamshid), sa résidence est toujours debout pour l'instant. Bien qu'il ne s'agisse que d'un bâtiment, il symbolise les terribles injustices qu'il a infligées aux habitants locaux et comment il a saigné la terre à blanc."
 RICE_pamir_dynasty_azur_jamshid:0 "Les enfants du prince féerique"
 RICE_pamir_sponsored_tumshiling:0 "A parrainé un festival de Tumshiling"
 RICE_pamir_dokhtar_i_noshirwan_refurbished:0 "Sanctuaire de Zun rénové à Dokhtar-i Noshirwan"
 RICE_pamir_dokhtar_i_noshirwan_refurbished_desc:0 "À Dokhtar-i Noshirwan, qui se trouve un peu au nord de Bamian, il y a un sanctuaire réputé avec l'une des plus grandes fresques de la région, représentant Oxus-Zun, une variante locale du dieu Zun liée à l'ancienne divinité iranienne orientale Oxus ou Wakhsh."
 RICE_pamir_shri_badats_palace_renovated:0 "Palais de Shri Badat rénové"
 RICE_pamir_shri_badats_palace_renovated_desc:0 "Un nouveau tyran s'est installé à Gilgit et le palais du vieux roi cannibale Shri Badat a été restauré. Cette structure sombre et inquiétante est toujours aussi terrifiante. Les habitants trouveront-ils un jour la paix ?"
 RICE_pamir_continuing_shri_badats_legacy:0 "Poursuite de l'héritage de Shri Badat"
 RICE_pamir_continuing_shri_badats_legacy_desc:0 "Ce personnage tente d'imiter Shri Badat, l'ancien tyran et roi cannibale de Gilgit. Peut-être ont-ils même surpassé Shri Badat en cruauté."
 RICE_pamir_continuing_shri_badats_legacy_azur_jamshid:0 "Le prince féerique sombre"
 RICE_pamir_continuing_shri_badats_legacy_azur_jamshid_desc:0 "« Tu étais le prince féerique ! Tu étais censé apporter l'équilibre à Gilgit, pas le laisser dans les ténèbres ! »"
 RICE_pamir_hephthalite_reclaimer_honors_zun:0 "Protecteur du peuple de Zun"
 RICE_pamir_hephthalite_reclaimer_honors_zun_desc:0 "Ce personnage, en ramenant les Hephthalites à leur terre natale, a honoré le nom de Zun, une grande divinité vénérée par un certain nombre d'Hephthalites depuis des générations. Désormais, le culte de Zun - le soleil lui-même - peut à nouveau être pratiqué dans les montagnes vierges où les Hephthalites ont jadis posé les fondations de leur grand empire."
 RICE_pamir_hephthalite_reclaimer_zun_chosen:0 "Empereur élu, au nom de Zun"
 RICE_pamir_hephthalite_reclaimer_zun_chosen_desc:0 "Ce personnage a dirigé les efforts pour restaurer l'Empire Hephthalite, et ce faisant, a apporté gloire à Zun, la grande divinité qui a été vénérée par un certain nombre d'Hephthalites pendant des générations. Que ce personnage y croie ou non, de nombreux dévots de Zun croient que ce souverain est l'Élu de Zun, et que grâce à leurs efforts, tous dans ce monde connaîtront Zun le puissant, Zun l'infaillible, Zun l'inattaquable !"
 RICE_pamir_hephthalite_focus_north:0 "Territoires hephthalites du Nord"
 RICE_pamir_hephthalite_focus_north_desc:0 "Ce personnage, qui a rétabli les Hephthalites dans leur cœur des Pamirs, se tourne maintenant vers le nord pour franchir la prochaine étape de leurs ambitions impériales. Bien qu'ils aient depuis adopté de nombreuses coutumes et compétences des peuples qu'ils ont conquis, les Hephthalites - autrefois appelés les Huns blancs par leurs ennemis - sont de redoutables guerriers dans l'âme, et ce personnage croit donc que leur destin réside dans les steppes et montagnes escarpées."
 RICE_pamir_hephthalite_focus_south:0 "Territoires hephthalites du Sud"
 RICE_pamir_hephthalite_focus_south_desc:0 "Ce personnage, qui a rétabli les Hephthalites dans leurs terres ancestrales des Pamirs, se tourne maintenant vers le sud pour franchir la prochaine étape de leurs ambitions impériales. Bien que beaucoup les aient appelés les Huns blancs, ces redoutables guerriers et raiders, les Hephthalites sont aussi des bâtisseurs, des artisans et des commerçants, et ce personnage pense que leur destin réside dans l'émulation des meilleures qualités des nombreux peuples qu'ils ont dominés pendant des générations."
 RICE_pamir_successful_chinir_festival:0 "Succès du festival de Chinir"
 RICE_pamir_aspiration_assert_zunbil_independence:"[RICE_aspiration|E] : Affirmer l'indépendance des Zunbil"
 RICE_pamir_aspiration_assert_zunbil_independence_desc:"#italic Firuz doit se montrer à la hauteur pour devenir un véritable champion de Zun le Dispensateur de Justice, et assurer la survie à long terme des Zunbils - et celle de l'ancien mode de vie de son peuple - contre toute attente.#!$RICE_pamir_aspiration_zunbil_desc$\n\n"

 # Decisions
 RICE_pamir_visit_bibi_fatima:0 "Visite des sources d'eau chaude de Bibi Fatima"
 RICE_pamir_visit_bibi_fatima_tooltip:0 "Vous visiterez les sources d'eau chaude de Bibi Fatima dans le Wakhan."
 RICE_pamir_visit_bibi_fatima_effect_tooltip:0 "Vous passerez du temps à visiter les sources chaudes de Bibi Fatima, perdant potentiellement du [stress|El], ou augmentant votre [fertility|El]"
 RICE_pamir_visit_bibi_fatima_effect_2_tooltip:0 "En tant que croyant[ROOT.Char.GetFaith.Custom('FR_E')] [ROOT.Char.GetFaith.GetAdherentName], vous pourriez également gagner de la [piety|El]"
 RICE_pamir_visit_bibi_fatima_desc:0 "Bien que de nombreuses personnes viennent de loin pour visiter ces sources, j'habite à proximité et je devrais donc profiter de cette occasion pour me détendre."
 RICE_pamir_visit_bibi_fatima_confirm:0 "Préparons-nous !"
 RICE_pamir_visit_bibi_fatima_context_tooltip:0 "#emphasis Contexte historique :#! Situées dans la vallée du Wakhan, dans l'actuel Tadjikistan, les sources d'eau chaude Bibi Fatima portent le nom de la fille du prophète Mahomet. Les sources sont réputées améliorer la fertilité des femmes."
 RICE_pamir_attend_chinir_festival:0 "Assister au festival de Chinir"
 RICE_pamir_attend_chinir_festival_tooltip:0 "Vous assisterez à un festival local de Chinir"
 RICE_pamir_attend_chinir_festival_effect_tooltip:0 "Vous assistez au festival de Chinir"
 RICE_pamir_attend_chinir_festival_desc:0 "Certains peuples iranophones des Pamirs célèbrent depuis longtemps une fête des récoltes appelée « festival de Chinir ». Il est temps que j'assiste à l'une de ces festivités !"
 RICE_pamir_attend_chinir_festival_confirm:0 "C'est bientôt la saison des récoltes !"
 RICE_pamir_attend_chinir_festival_context_tooltip:0 "#emphasis Contexte historique :#! Chinir est un festival traditionnel du peuple Wakhi, qui célèbre le début de la récolte. Les Wakhi, agriculteurs et pasteurs vivant principalement dans le corridor du Wakhan, sont l'un des nombreux groupes parlant une langue iranienne orientale dans la région du Pamir."
 RICE_pamir_nasir_khusraw_pilgrimage:0 "Partir en pèlerinage au sanctuaire de Nasir Khusraw"
 RICE_pamir_nasir_khusraw_pilgrimage_tooltip:0 "Vous allez partir en [go_on_a_pilgrimage_to_nasir_khusraws_shrine|El] au Badakhshan"
 RICE_pamir_nasir_khusraw_pilgrimage_effect_tooltip:0 "Vous partirez en [go_on_a_pilgrimage_to_nasir_khusraws_shrine|El], et potentiellement gagner divers avantages comme de la [piety|El] et du [prestige|El]"
 RICE_pamir_nasir_khusraw_pilgrimage_desc:0 "[nasir_khusraw|E] était vraiment un homme saint remarquable, il est donc tout à fait approprié que je lui rende hommage."
 RICE_pamir_nasir_khusraw_pilgrimage_confirm:0 "Préparons-nous pour le voyage."
 RICE_pamir_nasir_khusraw_pilgrimage_context_tooltip:0 "#emphasis Contexte historique :#! Le sanctuaire de Nasir Khusraw, où il a été enterré, dans la province du Badakhshan en Afghanistan, est un lieu de pèlerinage local populaire depuis des siècles. Bien qu'il ait été un prosélytiseur de la secte ismaélienne, les musulmans chiites et sunnites de la région le tiennent en haute estime."
 RICE_pamir_repair_watchposts_wakhan:0 "Réparer les postes de guet du corridor du Wakhan"
 RICE_pamir_repair_watchposts_wakhan_tooltip:0 "Vous allez [repair_the_pamir_watchposts|El] du corridor du Wakhan"
 RICE_pamir_repair_watchposts_wakhan_effect_tooltip:0 "Vous allez [repair_the_pamir_watchposts|El] dans le [county|El] de #V Wakhan#!"
 RICE_pamir_repair_watchposts_wakhan_desc:0 "Le réseau de postes de guet dans le corridor du Wakhan est dans un état détérioré. Si nous effectuons des [repair_singular_pamir_watchposts|El], nous protégerons les routes commerciales de la Route de la Soie qui traversent les vallées et les cols de la région, et renforcerons les défenses locales."
 RICE_pamir_repair_watchposts_wakhan_confirm:0 "Mettons-nous au travail."
 RICE_pamir_repair_watchposts_wakhan_context_tooltip:0 "#emphasis Contexte historique :#! Malgré son éloignement, le corridor de Wakhan a servi en quelque sorte d'autoroute pour le trafic le long de la route de la soie pendant des siècles. Différents États ont maintenu un réseau de postes de surveillance dans cette région, notamment les Chinois et les Tibétains, ainsi que les souverains locaux."
 RICE_pamir_wakhan_recently_repaired_req:0 "Les postes de guet du corridor du Wakhan n'ont pas été récemment [repair_past_tense_pamir_watchposts|El]"
 RICE_pamir_repair_watchposts_karakoram:0 "Réparer les postes de guet des montagnes du Karakoram"
 RICE_pamir_repair_watchposts_karakoram_tooltip:0 "Vous allez [repair_the_pamir_watchposts|El] des montagnes du Karakoram"
 RICE_pamir_repair_watchposts_karakoram_effect_tooltip:0 "Vous allez [repair_the_pamir_watchposts|El] dans le [county|El] de #V Gilgit#!"
 RICE_pamir_repair_watchposts_karakoram_desc:0 "Le réseau de postes de guet dans les montagnes du Karakoram est dans un état détérioré. Si nous effectuons des [repair_singular_pamir_watchposts|El], nous protégerons les routes commerciales de la Route de la Soie qui traversent les vallées et les cols de la région, et renforcerons les défenses locales."
 RICE_pamir_repair_watchposts_karakoram_confirm:0 "Mettons-nous au travail."
 RICE_pamir_repair_watchposts_karakoram_context_tooltip:0 "#emphasis Contexte historique :#! Malgré son emplacement reculé, les cols et vallées des montagnes du Karakoram ont servi de voie de passage pour le trafic le long de la Route de la Soie pendant des siècles. Divers États ont maintenu un réseau de postes de guet dans cette région, notamment les Chinois et les Tibétains, ainsi que des dirigeants locaux."
 RICE_pamir_karakoram_recently_repaired_req:0 "Les postes de guet des montagnes du Karakoram n'ont pas été récemment [repair_past_tense_pamir_watchposts|El]"
 RICE_pamir_watchpost_costs_tooltip:0 "L'efficacité et la longévité des réparations dépendent du financement accordé #weak (Coût minimum : @gold_icon! 80)#!"
 RICE_pamir_watchpost_costs_reduced_tooltip:0 "L'efficacité et la longévité des réparations dépendent du financement accordé #weak (Coût minimum : @gold_icon! 60)#!"
 RICE_pamir_expand_nasir_khusraws_shrine:0 "Agrandir le sanctuaire de Nasir Khusraw"
 RICE_pamir_expand_nasir_khusraws_shrine_tooltip:0 "Vous fournirez les fonds pour agrandir le lieu de repos actuellement humble [nasir_khusraw_s|El]"
 RICE_pamir_expand_nasir_khusraws_shrine_effect_tooltip:0 "Les #V musulmans#! vivant dans ou près du #V Badakhshan#! peuvent désormais partir en [go_on_a_pilgrimage_to_nasir_khusraws_shrine|El]"
 RICE_pamir_expand_nasir_khusraws_shrine_desc:0 "Feu [nasir_khusraw|El] est encore vénéré par les musulmans de toutes les sectes de la région, et les pèlerins commencent à affluer vers son lieu de sépulture. Nous devrions construire un sanctuaire digne de ce nom pour honorer la mémoire de ce saint homme, ainsi que des infrastructures pour soutenir les pèlerins qui viennent ici."
 RICE_pamir_expand_nasir_khusraws_shrine_confirm:0 "Que le travail commence !"
 RICE_pamir_expand_nasir_khusraws_shrine_context_tooltip:0 "#emphasis Contexte historique :#! Après sa mort, Nasir Khusraw fut enterré à Yamgan au Badakhshan, où un sanctuaire fut finalement érigé. Bien que Nasir Khusraw fût ismaélien, son sanctuaire est un lieu de pèlerinage populaire tant pour les pèlerins chiites que sunnites de la région."
 RICE_pamir_nasir_khusraw_passed_away:0 "[nasir_khusraw|E] est décédé"
 RICE_pamir_go_on_nasir_khusraw_pilgrimage:0 "Partir en pèlerinage au sanctuaire de Nasir Khusraw"
 RICE_pamir_go_on_nasir_khusraw_pilgrimage_tooltip:0 "Vous partez en [go_on_a_pilgrimage_to_nasir_khusraws_shrine|El]"
 RICE_pamir_go_on_nasir_khusraw_pilgrimage_effect_tooltip:0 "Vous voyagerez au Badakhshan, dans le cadre du [pilgrimage_to_nasir_khusraws_shrine|El]."
 RICE_pamir_go_on_nasir_khusraw_pilgrimage_desc:0 "De son vivant, [nasir_khusraw|El] inspira beaucoup en tant qu'homme saint érudit et brillant, mais humble et réfléchi, qui apporta la lumière de l'islam au Badakhshan. Peut-être que visiter son sanctuaire m'inspirera spirituellement."
 RICE_pamir_go_on_nasir_khusraw_pilgrimage_confirm:0 "Faisons les préparatifs !"
 RICE_pamir_go_on_nasir_khusraw_pilgrimage_context_tooltip:0 "#emphasis Contexte historique :#! Après sa mort, la tombe de Nasir Khusraw, située à Yamgan au Badakhshan, devint un lieu de pèlerinage local pour les musulmans chiites comme sunnites."
 RICE_pamir_nasir_khusraw_pilgrimage_distance_req:0 "Votre [capital|El] est proche du [county|El] de #V Badakhshan#!"
 RICE_pamir_in_jerm_req:0 "Votre [camp|El] est en [GetTitleByKey('b_jerm').GetNameNoTier]"
 RICE_pamir_in_zamindawar_req:0 "Votre [camp|El] est en [GetTitleByKey('b_zamindawar').GetNameNoTier]"
 RICE_pamir_in_kabul_req:0 "Votre [camp|El] est en [GetTitleByKey('b_kabul').GetNameNoTier]"
 RICE_pamir_comission_nasir_khusraw_work:0 "Commander une œuvre à Nasir Khusraw"
 RICE_pamir_comission_nasir_khusraw_work_tooltip:0 "Vous demanderez l'aide de [nasir_khusraw_s|El] concernant certaines questions philosophiques et spirituelles que vous avez."
 RICE_pamir_comission_nasir_khusraw_work_effect_tooltip:0 "Vous demanderez à [nasir_khusraw|El] de composer un texte répondant aux questions sur la relation entre philosophie et spiritualité."
 RICE_pamir_comission_nasir_khusraw_work_desc:0 "J'ai découvert un poème écrit par un érudit obscur nommé Abu al-Haytham al-Jurjani, qui pose une série de questions philosophiques et religieuses stimulantes. Il me déroute et m'intrigue à la fois. Peut-être que le célèbre saint homme Nasir Khusraw pourra m'éclairer et m'aider à trouver les réponses à ces questions."
 RICE_pamir_comission_nasir_khusraw_work_confirm:0 "Quelles sont les réponses à ces questions que j'ai ?"
 RICE_pamir_comission_nasir_khusraw_work_context_tooltip:0 "#emphasis Contexte historique :#! Bien que moins connu que ses écrits antérieurs, La Réconciliation de la philosophie et de la religion (#italic Jami al-Hikmatayn#!), fut la dernière œuvre de Nasir Khusraw, commanditée par l'Émir du Badakhshan, Ali ibn Asad, qui était lui-même un homme très intellectuel."
 RICE_pamir_nasir_khusraw_passed_away_req:0 "[nasir_khusraw|E] est décédé"
 RICE_pamir_nasir_khusraw_at_court_req:0 "[nasir_khusraw|E] est actuellement à votre [court|El]"
 RICE_pamir_attend_chawmos_festival:0 "Assister au festival de Chawmos"
 RICE_pamir_attend_chawmos_festival_tooltip:0 "Vous célébrerez le festival de Chawmos."
 RICE_pamir_attend_chawmos_festival_effect_tooltip:0 "Vous célébrez le festival de Chawmos"
 RICE_pamir_attend_chawmos_festival_desc:0 "Le solstice d'hiver est presque là ! C'est la célébration la plus importante de notre religion, avec des rituels qui réaffirment nos rôles dans nos communautés et rétablissent les domaines de la pureté et de l'impureté."
 RICE_pamir_attend_chawmos_festival_confirm:0 "Faisons les préparatifs !"
 RICE_pamir_attend_chawmos_festival_context_tooltip:0 "#emphasis Contexte historique :#! Chez les Kalash païens, Chawmos est le festival le plus important de l'année. L'appeler un festival, en fait, ne rend pas justice à son rôle en tant que plus grand événement du calendrier Kalash, et un événement qui revêt une grande signification rituelle."
 RICE_decision_chawmos_month_requirement:0 "Vous devez commencer les préparatifs entre septembre et novembre"
 RICE_pamir_sacrifice_goats:0 "Sacrifier des chèvres aux dieux"
 RICE_pamir_sacrifice_goats_tooltip:0 "Vous sacrifierez des chèvres aux cieux"
 RICE_pamir_sacrifice_goats_effect_tooltip:0 "Vous sacrifiez une chèvre à votre divinité choisie ou à un aspect d'une divinité"
 RICE_pamir_goat_sacrifice_costs_tooltip:0 "Les faveurs potentielles dépendent de la grandeur du sacrifice #weak (Coût minimum : @gold_icon! 50)#!"
 RICE_pamir_sacrifice_goats_desc:0 "Nous recherchons les bénédictions des dieux, et la façon de le faire est de sacrifier notre animal le plus sacré et le plus pur, les chèvres."
 RICE_pamir_sacrifice_goats_confirm:0 "Amenez-moi ces chèvres !"
 RICE_pamir_sacrifice_goats_context_tooltip:0 "#emphasis Contexte historique :#! Pour certains peuples païens et anciennement païens d'Afghanistan et du nord du Pakistan, comme les Kalash, les chèvres sont considérées comme sacrées, et sont ainsi jugées comme des animaux appropriés à sacrifier aux dieux."
 RICE_pamir_restore_the_idol_of_zun:0 "Restaurer l'idole de Zun au Zamindawar"
 RICE_pamir_restore_the_idol_of_zun_tooltip:0 "Vous allez [restore_the_idol_of_zun|El] à Zamindawar"
 RICE_pamir_restore_the_idol_of_zun_desc:0 "L'[idol_of_zun|El] se dressait autrefois fièrement à Zamindawar comme symbole de l'autorité divine du Dispensateur de Justice - recréons-la !"
 RICE_pamir_restore_the_idol_of_zun_confirm:0 "Faites venir les artisans !"
 RICE_pamir_restore_the_idol_of_zun_context_tooltip:0 "#emphasis Contexte historique :#! Plusieurs sources contemporaines, comme le moine bouddhiste et pèlerin Xuanzang au VIIe siècle, et l'historien musulman Al-Baladhuri au IXe siècle, décrivent une statue dorée de Zun (ou Zhun, Zhuna, Suna) dans un sanctuaire populaire sur le mont Zhunagir à Zamindawar, parrainée par l'État zunbil. Selon Al-Baladhuri, lorsque le commandant arabe 'Abd al-Rahman bin Samurah attaqua les Zunbils en 653-654 de notre ère, il aurait brisé la main de l'idole et arraché ses yeux de rubis, pour prouver aux habitants l'impuissance de leur divinité."
 RICE_pamir_conciliate_kafir_tribes:0 "Concilier les tribus kafires"
 RICE_pamir_conciliate_kafir_tribes_tooltip:0 "Vous faites des suppliques aux tribus kafires"
 RICE_pamir_conciliate_kafir_tribes_effect_tooltip:0 "Le [county_modifier|El] #V Pays des Kafirs#! sera retiré de l'un de vos [counties|El], et le [county_modifier|El] #V Concessions aux Kafirs#! sera temporairement ajoutées au [county|El] que vous avez choisi"
 RICE_pamir_conciliate_kafir_tribes_desc:0 "Les peuples tribaux connus sous le nom de Kafirs par les musulmans ont été une épine dans le pied des peuples sédentaires pendant des générations. En tant que [ruler|El] puissant et respecté suivant une [religion|El] similaire, peut-être puis-je négocier un accord avec ceux vivant sur mon territoire."
 RICE_pamir_conciliate_kafir_tribes_confirm:0 "Devons-nous entamer des négociations ?"
 RICE_pamir_conciliate_kafir_tribes_context_tooltip:0 "#emphasis Contexte historique :#! Pendant des siècles, les "Kafirs" du Pamir et de l'Hindu Kush ont résisté aux incursions des adeptes des religions organisées, des musulmans aux bouddhistes et aux hindous. Les Kafirs ont même lancé de nombreux raids à partir de leurs territoires jusqu'à l'époque victorienne."
 RICE_pamir_reclaim_mount_aruna:0 "Reprendre le Mont Aruna pour Zun"
 RICE_pamir_reclaim_mount_aruna_tooltip:0 "Vous restaurez la place légitime de Zun sur Aruna"
 RICE_pamir_reclaim_mount_aruna_desc:0 "Il y a longtemps, un peu au nord de Kaboul, le Mont Aruna abritait une autre grande [idol_of_zun|El], avant que nous ne soyons chassés par les adeptes brahmanistes de Surya. Maintenant, il est temps de [restore_the_idol_of_zun|El] ici, afin que Zun puisse être honoré ici une fois de plus !"
 RICE_pamir_reclaim_mount_aruna_confirm:0 "Faites appel aux artisans et aux prêtres !"
 RICE_pamir_reclaim_mount_aruna_context_tooltip:0 "#emphasis Contexte historique :#! Les sources chinoises mentionnent l'existence d'un Mont Aruna près de Kaboul ; selon une légende rapportée par le célèbre pèlerin bouddhiste Xuanzang, les divinités Zun et Surya se disputèrent pour savoir qui pourrait y résider, et finalement Zun dut se déplacer vers le sud, au Zabulistan. L'histoire pourrait être un récit mythologisé d'événements historiques : soit des adeptes de Zun tentèrent d'empiéter sur une montagne contrôlée par des adorateurs de Surya, soit (plus probablement) elle était à l'origine occupée par des Zunistes qui furent chassés par de nouveaux arrivants adorateurs de Surya."
 RICE_pamir_zun_restored_req:0 "L'[idol_of_zun|El] a été restaurée à Zamindawar"
 RICE_pamir_zun_restored_aruna_req:0 "L'[idol_of_zun|El] a été restaurée sur le Mont Aruna"
 RICE_pamir_offer_riches_to_zun:0 "Offrir des richesses à l'idole de Zun"
 RICE_pamir_offer_riches_to_zun_tooltip:0 "Vous rassemblez des trésors et des luxes à présenter à l'[idol_of_zun|El]"
 RICE_pamir_offer_riches_to_zun_desc:0 "C'est notre juste coutume d'offrir un tribut à Zun sous la forme de nos richesses terrestres, et il n'y a pas de meilleure façon de plaire à Zun qu'en présentant ces offrandes devant Son idole."
 RICE_pamir_offer_riches_to_zun_effect_tooltip:0 "[piety|El] et [prestige|El] gagnés sont aléatoires, mais influencés par la quantité de richesses offertes #weak (Coût minimum : @gold_icon! 100)#!"
 RICE_pamir_offer_riches_to_zun_confirm:0 "Je rendrai visite à l'Idole de Zun"
 RICE_pamir_offer_riches_to_zun_context_tooltip:0 "#emphasis Contexte historique :#! Plusieurs sources chinoises mentionnent l'immense quantité d'or et d'argent trouvée dans les sanctuaires dédiés à Zun. Par exemple, le #italic Livre des Sui#! mentionne que le sanctuaire de Zun sur le mont Congling (probablement le mont Aruna près de Kaboul) était couvert de plaques d'or et d'argent et avait des sols en argent. Xuanzang mentionne également que de nombreux animaux domestiques comme des moutons et des chevaux étaient offerts à Zun."
 RICE_pamir_zun_offer_riches_region_req:0 "[realm_capital|E] est proche ou près du cœur zuniste en Afghanistan"
 RICE_pamir_hold_tumshiling_festival:0 "Parrainer le festival de Tumshiling"
 RICE_pamir_hold_tumshiling_festival_tooltip:0 "Vous rassemblez les habitants pour célébrer la défaite de Shri Badat"
 RICE_pamir_hold_tumshiling_festival_desc:0 "Il y a longtemps, le roi cannibale de Gilgit, Shri Badat, fut vaincu par l'héroïque prince féerique [azur_jamshid|El]. Commémorons ce grand événement avec le Festival de Tumshiling !"
 RICE_pamir_hold_tumshiling_festival_effect_tooltip:0 "Vous parrainez une célébration locale de Tumshiling"
 RICE_pamir_hold_tumshiling_festival_confirm:0 "C'est parti !"
 RICE_pamir_hold_tumshiling_festival_context_tooltip:0 "#emphasis Contexte historique :#! Selon la légende, Gilgit était autrefois gouverné par un tyran cannibale, le bouddhiste Shri Badat, jusqu'à ce qu'il soit vaincu par sa fille Nur Bakht et son amant et mari, un prince fée venu de Perse nommé Azur Jamshid. Les habitants célèbrent cet événement chaque année lors d'un festival connu sous le nom de Tumshiling (ou Nasalo). L'histoire est probablement un mythe, étant donné la prévalence de célébrations similaires à travers l'Himalaya qui sont basées sur des légendes avec un récit également similaire, qui pourrait finalement être dérivé (ironiquement) des contes bouddhistes Jakata."
 RICE_decision_tumshiling_month_requirement:0 "Le mois doit être entre octobre et décembre"
 RICE_pamir_raze_shri_badats_palace:0 "Raser le palais de Shri Badat"
 RICE_pamir_raze_shri_badats_palace_tooltip:0 "Bon débarras !"
 RICE_pamir_raze_shri_badats_palace_desc:0 "Le cannibale Shri Badat n'est plus, ayant été justement tué par ses sujets opprimés, menés par le prince féerique [azur_jamshid|El], mais son grand palais, monument à sa cruauté, demeure toujours. Pour répudier la mémoire de ce tyran et de ses actes odieux, je devrais donner l'ordre de détruire ce palais."
 RICE_pamir_raze_shri_badats_palace_effect_tooltip:0 "Si ou une fois que [azur_jamshid|El] est décédé, les [rulers|El] dans les [duchies|El] de Pamir et Shigari, ou le [county|El] de Chitral, peuvent prendre une [decision|El] pour #V Parrainer le Festival de Tumshiling#!"
 RICE_pamir_raze_shri_badats_palace_confirm:0 "Démolissez-le !"
 RICE_pamir_raze_shri_badats_palace_context_tooltip:0 "#emphasis Contexte historique :#! Selon la légende, après qu'Azur Jamshid eut aidé les habitants de Gilgit à renverser et tuer Shri Badat et fut proclamé leur nouveau roi, il ordonna que le palais du tyran soit rasé jusqu'au sol."
 RICE_pamir_refurbish_dokhtar_i_noshirwan:0 "Restaurer la fresque de Dokhtar-i Noshirwan"
 RICE_pamir_refurbish_dokhtar_i_noshirwan_tooltip:0 "Cette représentation de Zun pourrait bénéficier d'une restauration"
 RICE_pamir_refurbish_dokhtar_i_noshirwan_desc:0 "Sur le site de Dokhtar-i Noshirwan, non loin de Bâmiyân, se trouve un ancien complexe taillé dans la roche contenant une fresque représentant notre grand dieu Zun. Comme il est tombé en ruine, nous devrions prendre des mesures pour lui rendre sa gloire d'antan."
 RICE_pamir_refurbish_dokhtar_i_noshirwan_confirm:0 "Trouvez des artisans pour ce travail !"
 RICE_pamir_refurbish_dokhtar_i_noshirwan_context_tooltip:0 "#emphasis Contexte historique :#! Dokhtar-i Noshirwan (également connu sous le nom de Nigar) est un site archéologique datant du début du VIIIe siècle qui contient l'une des plus grandes fresques préislamiques d'Afghanistan. La fresque contient des éléments visuels suggérant un mélange d'influences sogdiennes, hunniques/hephthalites et sud-afghanes. La fresque a peut-être été réalisée par des artistes sogdiens à la demande d'un dirigeant turc ou autochtone local, et pourrait être une représentation d'une variété bactrienne de la divinité Wakhsh, ou Oxus, qui était populaire dans le monde iranien oriental et pourrait avoir été connectée ou syncrétisée avec Zun sous le nom d'Oxus-Zun - tout cela, cependant, est hautement spéculatif."
 RICE_pamir_renovate_shri_badats_palace:0 "Rénover le palais de Shri Badat"
 RICE_pamir_renovate_shri_badats_palace_tooltip:0 "Pour être honnête, il avait quelques bons points..."
 RICE_pamir_renovate_shri_badats_palace_desc:0 "Le cannibale Shri Badat n'est plus, mais son palais, monument de sa cruauté, est toujours là. Quelque chose dans ce bâtiment et dans ses actes sombres m'inspire, et l'on murmure que son esprit enragé vit toujours. Je sais au plus profond de mon cœur ce que je dois faire : terminer ce qu'il a commencé !"
 RICE_pamir_renovate_shri_badats_palace_effect_tooltip:0 "#N Faire cela rendra impossible pour vous ou quiconque de prendre la [decision|El] de #V Parrainer le Festival de Tumshiling#! à l'avenir !#!"
 RICE_pamir_renovate_shri_badats_palace_effect_special_tooltip:0 "En tant qu'Azur Jamshid, vous étiez censé sauver Gilgit. Vous étiez censé sauver son peuple. Mais maintenant... Shri Badat pourrait bien l'emporter à la fin."
 RICE_pamir_renovate_shri_badats_palace_confirm:0 "Tous me craindront !"
 RICE_pamir_renovate_shri_badats_palace_context_tooltip:0 "$RICE_pamir_raze_shri_badats_palace_context_tooltip$"
 RICE_pamir_investigate_bibi_fatima:0 "Enquêter sur Bibi Fatima"
 RICE_pamir_investigate_bibi_fatima_tooltip:0 "J'ai entendu des rumeurs intéressantes..."
 RICE_pamir_investigate_bibi_fatima_desc:0 "J'ai entendu dire que les voyageurs islamiques arrivant dans la région du Pamir visitent souvent des sources chaudes qu'ils ont surnommées les sources chaudes « Bibi Fatima ». J'aimerais envoyer quelques officiels pour enquêter sur ces sources, et peut-être investir des fonds pour y construire des infrastructures de base."
 RICE_pamir_investigate_bibi_fatima_effect_tooltip:0 "Les [rulers|El] avec un territoire dans les [duchies|El] de [badakhshan_duchy.GetNameNoTier] et [pamir_duchy.GetNameNoTier] peuvent prendre la [decision|El] de #V Visiter les sources chaudes de Bibi Fatima#!"
 RICE_pamir_investigate_bibi_fatima_confirm:0 "Qu'est-ce qui le rend si unique ?"
 RICE_pamir_investigate_bibi_fatima_context_tooltip:0 "$RICE_pamir_visit_bibi_fatima_context_tooltip$"
 RICE_pamir_investigate_bibi_fatima_islam_req:0 "L'Islam a été fondé"
 RICE_pamir_investigate_prophet_passed_away_req:0 "Le Prophète Mahomet est décédé"
 RICE_pamir_investigate_bibi_fatima_date_req:0 "L'année est 650 ou plus tard"
 RICE_pamir_restore_hephthalite_empire:0 "Restaurer l'Empire hephthalite"
 RICE_pamir_restore_hephthalite_empire_tooltip:0 "Les Huns Blancs se relèveront une fois de plus !"
 RICE_pamir_restore_hephthalite_empire_desc:0 "Il y a des siècles, l'Empire hephthalite frappait de terreur les cœurs des peuples de Perse et d'Inde. Pourtant, nos ancêtres n'étaient pas des brutes sans cervelle - c'étaient aussi des penseurs et des artistes qui créèrent de magnifiques monuments, ainsi que des diplomates et des marchands qui entretenaient des relations avec la Chine et Rome. Il est temps non seulement d'honorer leur héritage, mais de rebâtir leur grand empire !"
 RICE_pamir_restore_hephthalite_empire_confirm:0 "Attaquons l'exercice, pour restaurer les Huns !"
 RICE_pamir_restore_hephthalite_empire_context_tooltip:0 "#emphasis Contexte historique :#! Les Hephthalites, parfois appelés les Huns blancs, furent une vague majeure d'envahisseurs tribaux « hunniques » en Perse et en Inde aux IVe et Ve siècles. Leur relation avec les groupes « hunniques » comme les Kidarites et les Xionites, les différences ethniques entre ces groupes (s'il y en a), et d'où ils venaient, font encore débat dans les cercles académiques - il y a trop de théories pour les lister ici, mais qu'il suffise de dire que l'influence iranienne et turque dans leurs origines est probable, et il est possible que le Pamir soit leur patrie. Une alliance perse et turque les a vaincus vers 560 de notre ère et l'Empire hephthalite s'est scindé en de nombreuses petites chefferies. Parmi ces États résiduels hephthalites, les plus importants furent les Turkshahis et leurs cousins, les Zunbils."
 RICE_pamir_reclaim_hephthalite_homeland:0 "Reconquérir le cœur de l'Hephthalite"
 RICE_pamir_reclaim_hephthalite_homeland_tooltip:0 "$RICE_pamir_restore_hephthalite_empire_tooltip$"
 RICE_pamir_reclaim_hephthalite_homeland_desc:0 "Les puissants Hephthalites d'autrefois sont dispersés comme le vent, réduits à des États résiduels dans les arrière-pays entre l'Inde et la Perse. Pour reconquérir notre gloire impériale, nous devons rétablir notre présence dans l'ancien cœur de l'Empire hephthalite : les montagnes impénétrables et indomptables du Pamir !"
 RICE_pamir_reclaim_hephthalite_homeland_confirm:0 "Le printemps reviendra pour les hephthalites."
 RICE_pamir_reclaim_hephthalite_homeland_context_tooltip:0 "$RICE_pamir_restore_hephthalite_empire_context_tooltip$"
 RICE_pamir_restore_hephthalite_restored_culture_conversion:0 "Chaque comté dans le #bold $k_hephthalite_restored$#! nouvellement rétabli"
 RICE_pamir_reclaim_hephthalite_homeland_effect_tooltip_1:0 "Débloque la [decision|El] pour #V $RICE_pamir_restore_hephthalite_empire$#!"
 
