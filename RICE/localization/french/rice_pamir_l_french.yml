 # Legends
 RICE_hephthalite_legend_new_title_name:"Retour des Hephthalites"
 RICE_hephthalite_legend_new_title_desc:"Il y a des générations, les [original_culture.GetCollectiveNoun|l] frappaient de terreur les mondes iranien et indien en tant que Huns blancs. Sous [founder.GetTitledFirstName], ils sont revenus, encore plus forts, plus riches et plus intimidants qu'auparavant."
 RICE_hephthalite_legend_chapter_opening_new_title:"Depuis les montagnes du Pamir, les [ROOT.Legend.GetProperty( 'original_culture' ).Culture.GetCollectiveNounNoTooltip|l] déferlèrent sur les terres agricoles fertiles et les cités opulentes des mondes iranien et indien. Connus sous de nombreux noms, tels que les Huns blancs, ils étaient craints par tous les peuples - même par les autres tribus nomades le long de la Route de la Soie. Mais toute chose a une fin, et l'ancie[ROOT.Legend.GetProtagonist.Custom('FR_NNne')] [ROOT.Legend.GetProperty( 'title' ).Title.GetBaseNameNoTooltip] subit la défaite et fut déchiré[ROOT.Legend.GetProtagonist.Custom('FR_E')] par ses ennemis."
 RICE_hephthalite_legend_chapter_motivation_new_title:"Des descendants dispersés des [ROOT.Legend.GetProperty( 'original_culture' ).Culture.GetCollectiveNounNoTooltip|l] survécurent en tant que petits États résiduels le long des terres agricoles, des cités et des montagnes de la Route de la Soie. Parmi eux se trouvait une tribu de [ROOT.Legend.GetProperty( 'culture' ).Culture.GetCollectiveNounNoTooltip|l], menée par [ROOT.Legend.GetProtagonist.Custom('FR_LeLa')|l] visionnaire [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]. [ROOT.Legend.GetProtagonist.GetSheHe|U] chercha à restaurer la gloire passée de son peuple, et à établir un nouvel Empire des [ROOT.Legend.GetProperty( 'original_culture' ).Culture.GetCollectiveNounNoTooltip|l]."
 RICE_hephthalite_legend_chapter_famous_deed_new_title:"Bien que les anciens [ROOT.Legend.GetProperty( 'original_culture' ).Culture.GetCollectiveNounNoTooltip|l] fussent des guerriers, ils étaient aussi des marchands, des bâtisseurs de cités et des artisans. [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] devait ainsi imiter ses illustres ancêtres en tant que dirigeant[ROOT.Legend.GetProtagonist.Custom('FR_E')] aux multiples talents. [ROOT.Legend.GetProtagonist.GetSheHe|U] encouragea le commerce, fonda de nouvelles colonies, patronna les arts, et construisit des [ROOT.Legend.GetProtagonist.GetFaith.HouseOfWorshipPlural] [ROOT.Legend.GetProtagonist.GetFaith.GetAdjectiveNoTooltip]s et de grands monuments à [ROOT.Legend.GetProtagonist.GetFaith.HighGodName]."
 RICE_hephthalite_legend_chapter_extra_deed_new_title:"Cependant, bien entendu, en tant que véritable enfant des [ROOT.Legend.GetProperty( 'original_culture' ).Culture.GetCollectiveNounNoTooltip|l], ses plus grandes réalisations furent de nature militaire. D'innombrables tribus, d'innombrables cités et d'innombrables soi-disant rois s'agenouillèrent devant [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] : certains en se rendant sagement, sachant qu'il était insensé de résister ; et d'autres après avoir subi la défaite aux mains de [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] et de ses redoutables guerriers."
 RICE_hephthalite_legend_chapter_conclusion_new_title:"Comme on dit, l'hiver ne dure pas éternellement, car le printemps arrive, et les neiges fondent. Les neiges fondent #italic toujours#! Comme les sommets des montagnes du Pamir d'où les [ROOT.Legend.GetProperty( 'original_culture' ).Culture.GetCollectiveNounNoTooltip|l] établirent à l'origine leur patrie, leurs descendants, les [ROOT.Legend.GetProperty( 'culture' ).Culture.GetCollectiveNounNoTooltip|l], sous [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip], se répandirent telle une avalanche depuis le Pamir. Pourtant, comme la neige fondue qui se transforme en eau vivifiante, le nouvellement formé [ROOT.Legend.GetProperty( 'title' ).Title.GetBaseNameNoTooltip] ne fut pas simplement une force destructrice. En ravivant l'ancien [ROOT.Legend.GetProperty( 'title' ).Title.GetBaseNameNoTooltip] ainsi que son héritage et ses traditions, [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] initia une nouvelle ère, plus prospère, le long de la Route de la Soie."

 # Traits
 trait_RICE_hephthalite_emperor_khan:0 "Khan des Huns blancs"
 trait_RICE_hephthalite_emperor_khan_desc:0 "Ce personnage est l'actuel Khan de l'Empire Hephthalite restauré. Il perpétue l'héritage des redoutables guerriers qui continuent de semer la terreur dans le cœur de nombreuses personnes sur la Route de la Soie."
 trait_RICE_hephthalite_emperor_khan_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] est l'actuel Khan de l'Empire hephthalite restauré, perpétuant l'héritage des guerriers redoutables qui continuent de frapper de terreur le cœur de nombreux peuples à travers la Route de la Soie."
 trait_RICE_hephthalite_emperor_shah:0 "Shah des Huns blancs"
 trait_RICE_hephthalite_emperor_shah_desc:0 "Ce personnage est l'actuel Shah de l'Empire hephthalite restauré, perpétuant l'héritage d'un royaume puissant et prospère qui excellait non seulement dans l'art de la guerre, mais aussi dans le commerce, la culture et la construction de cités."
 trait_RICE_hephthalite_emperor_shah_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] est l'actuel Shah de l'Empire hephthalite restauré, perpétuant l'héritage d'un royaume puissant et prospère qui excellait non seulement dans l'art de la guerre, mais aussi dans le commerce, la culture et la construction de cités."

 
 # Game Concepts
 game_concept_pilgrimage_to_nasir_khusraws_shrine:0 "Pèlerinage au sanctuaire de Nasir Khusraw"
 game_concept_go_on_a_pilgrimage_to_nasir_khusraws_shrine:0 "Pèlerinage au sanctuaire de Nasir Khusraw"
 game_concept_pilgrimage_to_nasir_khusraws_shrine_desc:0 "Les personnages musulmans peuvent entreprendre un [GetActivityType( 'activity_RICE_pamir_nasir_khusraw_pilgrimage' ).GetName] autour de la région du Badakhshan dans les Pamirs.\n\nInitialement, cette [activity|El] est indisponible car Nasir Khusraw est encore en vie. Une fois qu'il décède, cependant, le [county_modifier|El] [GetModifier('RICE_pamir_nasir_khusraw_shrine').GetNameWithTooltip] apparaîtra dans le [county|El] de Badakhshan et activera cette [decision|El].\n\nAu sanctuaire de Nasir Khusraw, vous pouvez recevoir diverses bénédictions, telles que des [character_modifiers|El] d'inspiration, mais les bénédictions sont encore plus grandes si vous suivez la [faith|El] #V ismaélienne#!."
 game_concept_repair_the_pamir_watchposts:0 "Réparer les miradors"
 game_concept_repair_singular_pamir_watchposts:0 "Réparation"
 game_concept_repair_past_tense_pamir_watchposts:0 "Réparation"
 game_concept_repair_the_pamir_watchposts_desc:0 "Les [counties|El] de #V Wakhan#! et #V Gilgit#!, situés dans les montagnes du Pamir, possèdent un [county_modifier|El] unique représentant le réseau de postes de guet disséminés à travers leur terrain accidenté et isolé. Si vous possédez l'un ou les deux de ces [counties|El], vous aurez accès à une [decision|El] pour #V $game_concept_repair_the_pamir_watchposts$#!, qui accordera un autre [county_modifier|El] spécial fournissant divers bonus militaires, ainsi que des bonus au [control|El] et au [development|El]."
 game_concept_nasir_khusraw:0 "Nasir Khusraw"
 game_concept_nasir_khusraw_s:0 "de Nasir Khusraw"
 game_concept_nasir_khusraw_desc:0 "$game_concept_nasir_khusraw$ est un [character|El] qui a historiquement vécu de 1004 à environ 1080 de notre ère. Il était un poète renommé, un homme saint et un missionnaire ismaélien à qui l'on attribue les bases de l'islamisation du Badakhshan. Bien que chiite, il est également vénéré par les sunnites.\n\nEn jeu, il est présent dans le signet de 1066, tandis que si vous commencez au signet de 867, il apparaîtra dans un royaume musulman du Badakhshan au cours des années 1000. S'il se trouve à la [court|El] d'un [ruler|El] musulman au Badakhshan, ce [ruler|El] peut [decide|El] de #V Commander La réconciliation de la Philosophie et de la Religion#! tant que Nasir Khusraw est encore en vie.\n\nUne fois que Nasir Khusraw décède, ce même dirigeant peut [decide|El] d'#V Agrandir le Sanctuaire de Nasir Khusraw#!. Ce faisant, une nouvelle [activity|El] pour partir en [GetActivityType( 'activity_RICE_pamir_nasir_khusraw_pilgrimage' ).GetName] devient disponible pour tous les musulmans au Badakhshan ou à proximité."
 game_concept_azur_jamshid:0 "Azur Jamshid"
 game_concept_azur_jamshid_s:0 "d'Azur Jamshid"
 game_concept_azur_jamshid_desc:0 "$game_concept_azur_jamshid$ était un [ruler|El] légendaire de #V Gilgit#! au Cachemire, un prince féerique venu du ciel qui tua le roi cannibale Shri Badat et établit la dynastie Kayani, plus tard appelée les Trakhans. Pour jouer en tant que lui au démarrage de 867, sélectionnez un [ruler|El] dans la région pour obtenir un événement contextuel. Il dispose de quelques caractéristiques.\n\nPremièrement, vous avez l'option de vous convertir au bouddhisme ou à l'islam au début de la partie, ou de rester zoroastrien. Dans la vie réelle, les Trakhans étaient peut-être turcs (ou des locaux turquifiés) et ne se sont convertis à l'islam qu'à la fin de la période médiévale.\n\nDeuxièmement, au début de la partie, le [county|El] de Gilgit possède un [county_modifier|El], le légendaire #V Palais de Shri Badat#!, qui donne un malus mineur. Tout comme dans la légende, en tant que $game_concept_azur_jamshid$ ou ses successeurs, vous devez prendre une [decision|El] pour le détruire.\n\nUne fois le palais détruit, et après que $game_concept_azur_jamshid$ soit décédé, tout [ruler|El] dans le [duchy|El] de Pamir obtient accès à l'[activity|El] [GetActivityType( 'activity_RICE_pamir_tumshiling_festival' ).GetName]."
 game_concept_idol_of_zun:0 "Idole de Zun"
 game_concept_idols_of_zun:0 "Idoles de Zun"
 game_concept_restore_the_idol_of_zun:0 "Restaurer l'idole de Zun"
 game_concept_idol_of_zun_desc:0 "Les sources historiques mentionnent l'existence d'une $game_concept_idol_of_zun$ au #V Zamindawar#!, qui était une grande statue dorée ornée d'yeux en rubis. Ici, le Culte de Zun rendait hommage à leur divinité suprême, dont les origines sont incertaines et contestées dans les cercles universitaires, avec diverses théories suggérant une origine hindoue, zoroastrienne, hunnique/hephthalite, et indigène indo-iranienne pour Zun (ou une combinaison de celles-ci). Il pourrait y avoir eu un autre site majeur de culte de Zun près de Kaboul sur le #V Mont Aruna#!.\n\nEn tant que [ruler|El] zuniste, vous avez la possibilité de prendre la [decision|El] de #V Restaurer l'idole de Zun#! au Zamindawar. Ce faisant, cela ajoute un [county_modifier|El] bénéfique au Zamindawar, et vous donne un [character_modifier|El] qui, entre autres choses, facilite la réforme d'une [faith|El] païenne. Cela permet également de prendre la [decision|El] pour restaurer l'idole sur le Mont Aruna à Kaboul également.\n\nUne fois les idoles restaurées, vous et les autres [rulers|El] zunistes proches avez accès à l'[activity|El] [GetActivityType( 'activity_RICE_pamir_offer_riches_to_zun' ).GetName]."

 # Aspirations 
 RICE_pamir_aspiration_zunbil_desc:"\n\n#bold [historical_aspiration_main_objectives|E]#!\n$EFFECT_LIST_BULLET$[completely_control|E] [GetTitleByKey('d_zabulistan').GetNameNoTier]\n$EFFECT_LIST_BULLET$Être un [ruler|El] indépendant de [rank|El] de [king|El] OU détenir au moins #V 12#! [counties|El]\n$EFFECT_LIST_BULLET$Rester païen zuniste\n\n#bold Récompenses#!\n$EFFECT_LIST_BULLET$Gain de @prestige_icon! #V [EmptyScope.ScriptValue('RICE_aspiration_medium_resource_bonus')]#! de [prestige|El]\n$EFFECT_LIST_BULLET$Recevez #V 500#! [special_troops|El] [GetMaA('RICE_pamir_tribesmen').GetName]\n$EFFECT_LIST_BULLET$Chaque [county|El] du [GetTitleByKey('d_zabulistan').GetNameNoTier] gagne @development_icon! #V [EmptyScope.ScriptValue('RICE_red_sea_al_umari_aspiration_dev_bonus')]#! de [development|El]\n\n#bold [historical_aspiration_bonus_objectives|E]#!\n$EFFECT_LIST_BULLET$Tuer directement au moins l'un des trois frères Saffarides, Ya'qub, Amr et Ali (Récompense : @dynasty_prestige_icon! #V [EmptyScope.ScriptValue('RICE_aspiration_small_resource_bonus')]#! de [dynasty_prestige|El] pour chaque tué)\n$EFFECT_LIST_BULLET$Prendre la [decision|El] de #V $RICE_pamir_restore_the_idol_of_zun$#! (Récompense : @piety_icon! #V [EmptyScope.ScriptValue('RICE_aspiration_medium_resource_bonus')]#! de [piety|El])#!"
 RICE_pamir_historical_aspiration_action_zunbil:"#italic Vous devez vous élever pour devenir un véritable champion de Zun le Dispensateur de Justice, et assurer la survie à long terme des Zunbils - et celle de l'ancien mode de vie de votre peuple - contre toute attente.#!$RICE_pamir_aspiration_zunbil_desc$"
 RICE_pamir_historical_aspiration_modifier_desc_zunbil: "[GetModifier('RICE_pamir_aspiration_assert_zunbil_independence').GetNameWithTooltip]"

