 pamir.0130.t:0 "Préparations"
 pamir.0130.desc:0 "J'ai commencé à faire des plans pour entreprendre un court pèlerinage local plus modeste vers le hameau de Yamgan dans [badakhshan_county.GetNameNoTier]. En vérité, je ne me dirige pas vers Yamgan même, mais plutôt vers un sanctuaire à proximité - le sanctuaire qui abrite le tombeau du célèbre [nasir_khusraw.GetFullName], le grand poète, érudit et saint homme. Au Badakhshan et dans de nombreuses régions autour du Pamir, bien qu'il fût un prosélyte de la secte ismaélienne de son vivant, il est encore vénéré par les musulmans chiites et sunnites de la région. Beaucoup ici saisissent l'occasion de visiter son sanctuaire, et j'ai l'intention de faire de même.\n\nJ'espère qu'en visitant le sanctuaire de ce grand homme, et en suivant son exemple, je pourrai renforcer ma foi et me rapprocher d'Allah."
 pamir.0130.a:0 "Ce sera une bonne occasion spirituelle pour moi."
 pamir.0131.t:0 "Vers Yamgan"
 #pamir.0131.desc:0 "I have finished preparing for my trip to the shrine of [nasir_khusraw.GetFullName]. I bid my household farewell, and begin the journey through the Pamir mountains.\n\nMy destination? Yamgan, in [badakhshan_county.GetNameNoTier].\n\nI hope that by visiting this great man’s shrine, and emulating his example, I can strengthen my faith and become closer to Allah."
 pamir.0131.a:0 "En avant !"
 pamir.0132.t:0 "Arrivée"
 pamir.0132.desc:0 "Après une longue marche quelque peu ardue, et après avoir traversé le village de Yamgan, je suis enfin arrivé à l'emplacement du sanctuaire. C'est un petit sanctuaire, c'est le moins que l'on puisse dire, de la taille d'une modeste maison au mieux, mais j'ai l'impression que cela correspond parfaitement à Nasir Khusraw - ici ne repose aucun débauché riche et décadent, mais un humble et bienveillant serviteur d'Allah.\n\nIl se fait tard, cependant, et je dois d'abord me reposer ; j'entrerai dans le sanctuaire demain. C'est dans cet esprit que je remonte le chemin de terre jusqu'à un autre bâtiment, un pavillon de pèlerins qui se trouve à côté d'une soupe populaire. Là, je ne serai pas différent des autres visiteurs, et mon rang, mon statut, ma richesse et même la secte musulmane à laquelle j'appartiens n'ont aucune importance, car les musulmans de toutes les sectes rendent depuis longtemps hommage à Nasir Khusraw."
 pamir.0132.a:0 "Nous sommes tous égaux aux yeux d'Allah."
 pamir.0133.t:0 "Entrée dans le sanctuaire"
 pamir.0133.desc:0 "Le matin est arrivé. Aujourd'hui, j'entre dans le sanctuaire de Nasir Khusraw. D'abord, cependant, je fais le tour du sanctuaire de nombreuses fois, récitant diverses prières.\n\nUne fois terminé, j'entre à l'intérieur et je vois qu'il y a plusieurs pièces, toutes aussi humbles d'apparence que les murs extérieurs. J'ai entendu dire par certains que ce bâtiment était, supposément, l'endroit où Nasir Khusraw vécut pendant de nombreuses années, écrivant de la poésie et autres. Je remarque également qu'il y a de nombreuses entailles et traces sur le mur, preuve des écrits que de dévots pèlerins ont griffonnés ici au fil des années.\n\nJ'entre enfin dans la pièce qui abrite le tombeau de Nasir Khusraw. Une fois encore, elle est relativement humble en apparence, et pourtant cela m'emplit étrangement de plus d'inspiration et de joie. Il n'y a que quelques autres pèlerins ici à l'intérieur, et ils m'ignorent pour la plupart tandis qu'ils prient."
 pamir.0133.a:0 "Je trouve un endroit vide dans la pièce."
 pamir.0134.t:0 "Prière"
 pamir.0134.desc:0 "Avant de commencer à prier, je regarde à nouveau autour de la pièce, m'imprégnant de l'expérience. Bien que son apparence soit humble, cela ne signifie pas qu'elle soit désagréable ou fade ; elle est tout de même joliment décorée, et je repère plusieurs objets sacrés. Il y a un brûleur d'encens et une lampe sur le sanctuaire, par exemple, et plus remarquablement, une copie du Coran que l'on dit avoir été écrite par Nasir Khusraw lui-même.\n\nJe me recentre et me rappelle que je ne suis pas venu ici pour admirer l'architecture, mais pour adorer Allah et méditer sur la vie sainte et les actes de Nasir Khusraw. Je ferme les yeux un instant, avant de commencer à réciter mes prières."
 pamir.0134.a:0 "Louange à Allah, le plus miséricordieux, le plus bienveillant..."
 pamir.0135.t:0 "Laisser une empreinte"
 pamir.0135.desc:0 "Avant de quitter le sanctuaire, il y a une dernière chose que je peux faire. La coutume veut que les pèlerins comme moi laissent des traces écrites sur les murs. Certains considèrent cela comme un graffiti sur un lieu sacré, mais beaucoup y voient une façon de commémorer leur visite, d'honorer Allah et Nasir Khusraw et, d'une certaine manière, de demander une dernière bénédiction. Au fil des ans, plusieurs types d'écrits typiques ont été griffonnés sur le mur. Si je souhaite écrire quelque chose sur ces murs, c'est le moment, alors je me dirige tranquillement vers un coin du bâtiment que je trouve attrayant et je me prépare à écrire...."
 pamir.0135.a:0 "Une copie de l'un des magnifiques poèmes écrits par Nasir Khusraw."
 pamir.0135.b:0 "Mon propre poème louant Allah, et espérant le triomphe du bien."
 pamir.0135.c:0 "Des prières et des conseils sur les affaires du monde qui me préoccupent."
 pamir.0135.d:0 "Des prières pour mes proches et amis, en particulier les défunts."
 pamir.0135.e:0 "Rien. C'est inutile. Je devrais plutôt prier davantage."
 pamir.0135.message:0 "Nasir Khusraw vous a inspiré spirituellement !"
 pamir.0136.t:0 "Aumône ?"
 pamir.0136.desc:0 "Je sors du sanctuaire, le corps revigoré et l'esprit en effervescence d'inspiration et de joie. Maintenant, je commence à me préparer à rentrer chez moi.\n\nCependant, je me souviens qu'il est de coutume que lorsque des mécènes riches ou puissants visitent le sanctuaire de Nasir Khusraw, ils font l'aumône et partagent de la nourriture avec d'autres pèlerins (en particulier ceux qui sont moins fortunés qu'eux) en l'honneur de leur visite avant de partir. En tant que [ROOT.Char.GetTitleAsNameNoTooltip], peut-être devrais-je profiter de cette occasion pour faire l'aumône avant de partir d'ici."
 pamir.0136.a:0 "Je ferai l'aumône et le partage obligatoires."
 pamir.0136.b:0 "Oui, je donnerai tout ce que je peux à tous ceux qui sont ici."
 pamir.0136.c:0 "Pourquoi devrais-je le faire ? J'ai déjà fait assez de charité."
 pamir.0137.t:0 "Retour à la maison"
 pamir.0137.desc:0 "Après avoir encore un peu parcouru la nature sauvage et accidentée des Pamirs, il est temps de revenir de mon pèlerinage au sanctuaire et au tombeau de [nasir_khusraw.GetFullName]. J'ai tant appris et vécu, et je n'oublierai certainement pas cette expérience de sitôt."
 pamir.0137.a:0 "Telle est la volonté d'Allah ! Cela en valait la peine."
