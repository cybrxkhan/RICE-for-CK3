 pamir.0150.t:0 "Préparatifs pour Chawmos"
 pamir.0150.desc:0 "Le solstice d'hiver approche, ce qui signifie qu'il est bientôt temps de célébrer le festival de Chawmos. En tant que dévot des dieux, à la manière [ROOT.Char.GetFaith.GetAdjective], il est important pour moi de participer à cet événement, car c'est une période sacrée de l'année, durant laquelle nous accomplissons les rituels nécessaires pour guider cette année vers la suivante, et pour délimiter correctement ce qui est pur et ce qui est impur.\n\nMoi-même et d'autres dirigeants de la communauté rassemblerons les habitants des villages voisins, et ensemble, nous travaillerons dur pour préparer un grand Chawmos cette année. En fin de compte, malgré le plaisir que nous pourrons et aurons, nous devons prendre tout cela au sérieux et faire de notre mieux pour garantir que l'événement soit un succès spirituel."
 pamir.0150.a:0 "Mettons-nous au travail."
 pamir.0151.t:0 "Bandek"
 pamir.0151.desc:0 "Les préparatifs du Chawmos de cette année sont en cours, mais comme le veut la coutume, moi-même et plusieurs autres notables locaux devons participer au rituel du #italic Bandek#!. Inévitablement, des gens meurent au cours de l'année, et le #italic Bandek#! est l'occasion pour nous d'inviter rituellement les proches des défunts à mettre fin à leur période de deuil et à rejoindre la communauté. Je vais devoir passer un certain temps à aller de porte en porte chez certains de ces habitants, et leur demander formellement de se joindre au Chawmos."
 pamir.0151.a:0 "Allons-y sans tarder ! C'est essentiel au succès du Chawmos."
 pamir.0151.b:0 "Je n'ai pas besoin de saluer des paysans - d'autres dirigeants locaux peuvent y aller à ma place."
 pamir.0152.t:0 "Sarazari"
 pamir.0152.desc:0 "Le Chawmos commence officiellement avec le rituel du #italic Sarazari#!, qui tourne autour du genévrier, la plante sacrée utilisée dans nombre de nos rituels de purification. Moi, ainsi que d'autres nobles, villageois, voyageurs, [ROOT.Char.Custom('DefaultPriestTitlePlural')] et d'autres encore, nous sommes rassemblés en un lieu désigné pour assister au #italic Sarazari#!. Durant ce rituel, jeunes garçons et jeunes filles se séparent en deux groupes selon le genre, et allument les branches de genévrier dans une compétition pour déterminer qui peut produire le plus de fumée, le tout étant dédié au dieu Balumain."
 pamir.0152.desc.boy:0 "\n\nCette année, il semble que les garçons aient gagné, car la fumée qu'ils ont produite est clairement plus abondante que celle des filles ! Une fois #italic Sarazari#! terminé, les [ROOT.Char.Custom('DefaultPriestTitlePlural')] tiennent des branches de genévrier et offrent des prières. Une fois cela fait, vient la dernière partie de #italic Sarazari#!, où les enfants courent avec excitation à travers le village avec des noix, et frappent à la porte de chaque maison avec ces noix, pour prier pour le bien-être de tous."
 pamir.0152.desc.girl:0 "\n\nCette année, il semble que les filles aient gagné, car la fumée qu'elles ont produite est clairement plus abondante que celle des garçons ! Une fois le #italic Sarazari#! terminé, les [ROOT.Char.Custom('DefaultPriestTitlePlural')] tiennent des branches de genévrier et offrent des prières. Une fois cela fait, vient la dernière partie du #italic Sarazari#!, où les enfants courent avec excitation à travers le village avec des noix, et frappent à la porte de chaque maison avec ces noix, pour prier pour le bien-être de tous."
 pamir.0152.a:0 "Très bien !"
 pamir.0153.t:0 "Kuta'mru"
 pamir.0153.desc:0 "Aujourd'hui c'est #italic Kuta'mru#!, un jour important où les royaumes de la nature sauvage et de la civilisation sont le plus connectés spirituellement.\n\nLe matin, les enfants se rassemblent autour du temple local pour le rituel du #italic Chutayak#!, où ils peignent les murs, les portes et les colonnes du temple avec des images de montagnes, d'étoiles, de divers animaux, et plus encore. Tout cela se fait dans un silence complet.\n\nL'après-midi, chacun se concentre sur la fabrication de sculptures en farine. Celles-ci seront cuites et exposées dans les pâturages tôt le lendemain matin pour symboliser leur migration vers les champs pour paître, avant d'être vendues aux non-croyants car il ne nous est pas permis de les manger. Généralement, les sculptures représentent des bergers ou divers animaux ; sur quoi devrais-je me concentrer pour la sculpture cette année ?"
 pamir.0153.a:0 "De nobles chiens de berger qui gardent notre bétail."
 pamir.0153.b:0 "Des cerfs sauvages qui vivent dans un terrain accidenté."
 pamir.0153.c:0 "Des vaches qui nous fournissent nourriture, lait et cuir."
 pamir.0153.d:0 "Nos humbles et travailleurs bergers."
 pamir.0153.e:0 "Les chèvres, car elles sont notre animal le plus sacré."
 pamir.0154.t:0 "Madahik"
 pamir.0154.desc:0 "Le rituel suivant du cycle de Chawmos est le #italic Madahik#!, le jour où nous commémorons nos ancêtres défunts. À l'extérieur du temple, nous préparons une forteresse miniature en bois appelée le #italic Chilikotik#!, où nous plaçons de nombreux aliments. Une fois cette tour de nourriture allumée, nous nous précipitons tous dans le temple, pour laisser aux ancêtres le temps et l'espace de nous rendre visite. À l'intérieur du temple, un ancien proclame : « Ô anciens, venez manger et boire, puis partez. »\n\nUne fois suffisamment de temps écoulé, nous sortons du temple. Dehors, le #italic Chilikotik#! et toute la nourriture sont entièrement réduits en cendres."
 pamir.0154.a:0 "Les ancêtres ont certainement été satisfaits cette année."
 pamir.0155.t:0 "Sawelik Hari"
 pamir.0155.desc:0 "C'est l'heure du rituel du #italic Sawelik Hari#!, où nous devons nous débarrasser de nos vieilles possessions inutiles et les remplacer par de nouvelles. Plus divertissant encore, c'est l'heure d'une représentation théâtrale qui satirise les événements récents de l'année précédente. Tout le monde rugit de rire tandis que divers membres de la communauté sont moqués (le tout avec bonne humeur, bien sûr). Plus tôt, lorsque nous organisions le festival de Chawmos, sur quoi nous étions-nous mis d'accord pour le thème de la représentation de cette année ?"
 pamir.0155.a:0 "Divers exploits (ou méfaits) que j'ai accomplis"
 pamir.0155.b:0 "Les choses insignifiantes qui se passent dans la vie des villageois locaux"
 pamir.0155.c:0 "Des nouvelles de grands événements qui se sont déroulés au loin"
 pamir.0156.t:0 "Goshnik"
 pamir.0156.desc:0 "Aujourd'hui est le #italic Goshnik#!, une partie cruciale du cycle de Chawmos, car aujourd'hui est le jour où nous accueillons formellement les enfants dans notre communauté, en tant que membres pratiquants de la foi [ROOT.Char.GetFaith.GetAdjective].\n\nLes garçons et les filles âgés d'environ sept ou huit ans passent par le #italic Chailaksambaik#!, où ils revêtent des tuniques traditionnelles et des animaux leur sont sacrifiés ; le sang de ces animaux est aspergé sur les garçons. Les garçons plus âgés, quant à eux, passent par un rituel similaire appelé le #italic Butsambaik#!."
 pamir.0156.desc.child:0 "\n\nParmi les enfants cette année se trouve ma propre progéniture ! Désormais, avec les autres enfants, ils ont tous été véritablement accueillis dans notre religion !"
 pamir.0156.a:0 "Il est bon de voir la nouvelle génération grandir."
 pamir.0157.t:0 "Ghona Chanja"
 pamir.0157.desc:0 "Ce soir est la nuit de #italic Ghona Chanja#!, où le dieu Balumain vient de [ROOT.Char.GetFaith.DivineRealm] sur sa monture céleste pour nous bénir. Bien qu'il ne soit pas le dieu suprême, il est notre protecteur divin qui nous a enseigné les rituels appropriés il y a des éons.\n\nÀ minuit, nous nous rendons sur un point élevé près du village où se dresse un autel spécial, l'#italic indraine#!. Là, nous offrons à Balumain de la nourriture et des sacrifices d'animaux, tandis que le [ROOT.Char.Custom('DefaultPriestTitle')] nous guide dans les prières. Que devrais-je demander à Balumain de m'aider à accomplir ?"
 pamir.0157.a:0 "J'espère que Balumain me bénira aussi."
 pamir.0158.t:0 "Lawak Bii'rik"
 pamir.0158.desc:0 "Après le #italic Ghona Chanja#!, la cérémonie suivante est le #italic Lawak Bii'rik#!, le jour du renard. Les renards sont des animaux rusés, responsables des fortunes et infortunes de l'année. Dans le cadre de ce rituel, de jeunes hommes commencent à parcourir les collines et forêts avoisinantes dès le petit matin à la recherche de renards, jouant des tambours bruyants et de la musique près des grottes où vivent les renards pour les inciter à sortir. Si le premier renard qu'ils aperçoivent court vers le haut de la colline, vers la demeure pure des montagnes, alors la bonne fortune s'abattra sur toute l'année suivante ; s'il court vers le bas, alors il y aura de l'infortune. Si aucun renard n'est trouvé... alors peut-être étaient-ils trop malins pour nous cette année."
 pamir.0158.a:0 "Que dit le renard ?"
 pamir.0158.toast.good:0 "Le renard a monté la colline !"
 pamir.0158.toast.neutral:0 "Aucun renard n'a été trouvé."
 pamir.0158.toast.bad:0 "Le renard a dévalé la pente !"
 pamir.0159.t:0 "La Dernière Danse"
 pamir.0159.desc:0 "Après que la chasse au renard est terminée, à midi, tout le monde retourne au village, où la célébration finale et la plus grande a lieu. Bien qu'il y ait de la nourriture et de la danse, il y a un spectacle qui occupe le devant de la scène.\n\nAu milieu de la place du village, de nombreuses personnes se sont couvert le visage. Non seulement cela, mais beaucoup d'entre elles, masquées ou non, sont vêtues comme le genre opposé : certains hommes sont habillés en femmes, et certaines femmes sont habillées en hommes. Pendant ce temps, les hommes ont été divisés en deux groupes ; les hommes « purs » chantent des chants solennels et honorés du passé, tandis que les hommes « impurs » chantent des mélodies obscènes aux rythmes sauvages. Ceci, véritablement, est le point culminant du Chawmos : quand les frontières des royaumes sont brisées avant d'être reconstruites."
 pamir.0159.a:0 "Merveilleux !"
 pamir.0160.t:0 "Fin du Chawmos"
 pamir.0160.desc:0 "Enfin, tous les rituels de Chawmos ont été accomplis et les semaines de festivités s'achèvent. Que de souvenirs nous avons tous accumulés ! La nouvelle année est à nos portes, et espérons qu'elle sera bonne."
 pamir.0160.a:0 "Jusqu'à la prochaine fois."
