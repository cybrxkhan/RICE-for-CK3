 pamir.0250.t:0 "Le Cœur Hephthalite, reconquis"
 pamir.0250.desc:0 "Ils nous craignaient autrefois, nous appelant les #bold Huns Blancs#!. Nous étions un peuple né d'origines mystérieuses mais uni dans une quête de gloire et de pouvoir. Mais nous n'étions pas de brutaux conquérants ; nous encouragions le commerce, bâtissions des cités, et intégrions les nombreux peuples que nous gouvernions dans un royaume cultivé et prospère. Pourtant, regardez ce qu'il reste des Hephthalites ! Nous sommes devenus de querelleurs petits chefs, accrochés aux terres sauvages des hauts plateaux comme des moutons terrifiés.\n\nMais c'en est fini. J'ai commencé à reconquérir notre splendeur et à renforcer notre identité en restaurant notre domination sur le cœur de l'ancien État hephthalite dans les Pamirs. Nous ne régnerons plus sur les ruines désolées de nos gloires passées !\n\nMais il reste encore beaucoup à faire. Nous devons nous concentrer sur l'expansion de l'influence hephthalite. La question, cependant, est : par où commencer ?"
 pamir.0250.a:0 "Au nord, dans les vastes steppes et montagnes, d'où nous venons."
 pamir.0250.a.tooltip:0 "Si vous ou un autre dirigeant parvenez à restaurer l'Empire hephthalite plus tard, vous recevrez des #P bonus#! liés à la guerre et au militaire. #bold #X Ce choix ne peut pas être modifié, choisissez avec soin !#!#!"
 pamir.0250.a.tooltip.zunist:0 "Si vous ou un autre dirigeant parvenez à restaurer l'Empire hephtalite plus tard, vous recevrez des #P bonus#! liés à la guerre et au militaire, et (si vous la suivez encore) [ROOT.Char.GetFaith.GetName] obtiendra également la [GetFaithDoctrine('rice_zun_hephthalite_warriors_doctrine').GetBaseName] [doctrine|El]. #bold #X Ce choix ne peut pas être modifié, choisissez avec soin !#!#!"
 pamir.0250.b:0 "Au sud, vers la Perse et l'Inde, où nous avons appris le commerce et la culture."
 pamir.0250.b.tooltip:0 "Si vous ou un autre dirigeant parvenez à restaurer l'Empire hephthalite plus tard, vous recevrez des #P bonus#! liés au commerce et à la culture. #bold #X Ce choix ne peut pas être modifié, choisissez avec soin !#!#!"
 pamir.0250.b.tooltip.zunist:0 "Si vous ou un autre souverain parvenez à restaurer l'Empire hephthalite plus tard, vous recevrez des #P bonus#! liés au commerce et à la culture, et (si vous la suivez encore) [ROOT.Char.GetFaith.GetName] obtiendra également la [GetFaithDoctrine('rice_zun_hephthalite_culture_doctrine').GetBaseName] [doctrine|El]. #bold #X Ce choix ne peut pas être modifié, choisissez avec soin !#!#!"
 pamir.0251.t:0 "Le Cœur Hephthalite, reconquis"
 pamir.0251.desc.intro:0 "Il y a des siècles, les Hephthalites frappaient de terreur les cœurs de nombreux peuples à travers l'Iran et l'Inde, gagnant le surnom de #bold Huns Blancs#!. Les temps changèrent, cependant, et ils se fragmentèrent en petites chefferies résiduelles, certaines loin de leur cœur historique dans les Pamirs."
 pamir.0251.desc.northern:0 "\n\nPourtant, les temps changent à nouveau. L'ingénieu[hephthalite_homeland_reclaimer.Custom('FR_XSe')] [hephthalite_homeland_reclaimer.GetTitledFirstName], prétendant hériter de l'héritage des Huns Blancs, a rétabli le contrôle hephthalite sur les Pamirs. [hephthalite_homeland_reclaimer.GetSheHe|U] a commencé à regarder vers le nord, vers les steppes, pour reconstruire la puissance hephthalite par la guerre et la force - la source de leur force originelle, croit-[hephthalite_homeland_reclaimer.GetSheHe]. Alors que certains disent qu'il ne s'agit que du dernier souffle de l'État hephthalite mourant, d'autres qui connaissent le peuple de ces montagnes enneigées savent mieux - ils s'inquiètent d'un renouveau hephthalite."
 pamir.0251.desc.southern:0 "\n\nPourtant, les temps changent à nouveau. L'ingénieu[hephthalite_homeland_reclaimer.Custom('FR_XSe')] [hephthalite_homeland_reclaimer.GetTitledFirstName], prétendant hériter de l'héritage des Huns Blancs, a rétabli le contrôle hephthalite sur les Pamirs. [hephthalite_homeland_reclaimer.GetSheHe|U] a commencé à regarder vers le sud, vers les peuples d'Iran et d'Inde, pour reconstruire la puissance hephthalite par le commerce, l'art et la diplomatie - la stabilité et la prospérité, pour ainsi dire. Si certains disent que ce n'est que le dernier souffle de l'État hephthalite mourant, d'autres qui connaissent le peuple de ces montagnes enneigées savent mieux - ils craignent un renouveau hephthalite."
 pamir.0251.desc.conclusion:0 "\n\nAprès tout, l'hiver ne dure pas éternellement. Le printemps arrive, les neiges fondent. Les neiges fondent #italic toujours#!."
 pamir.0251.a:0 "Serait-ce un nouveau printemps pour les Hephthalites ?"
 pamir.0252.t:0 "L'empire Hephthalite ressuscité"
 pamir.0252.desc.intro:0 "Ils nous connaissaient autrefois comme les #bold Huns Blancs#!. Comme des pillards. Des maraudeurs. Des destructeurs. Mais ils nous connaissaient aussi comme des marchands. Des artisans. Des diplomates. Et puis, comme ça, le grand Empire Hephthalite s'est évanoui, brisé, ne survivant plus que dans le folklore et les écrits des érudits.\n\nLe souvenir de notre passé glorieux ne s'est pas éteint, cependant. Nous avons survécu dans des montagnes et des vallées reculées en tant que petits États résiduels. De là, nous avons rebâti notre fortune et reconquis notre cœur historique dans les Pamirs. Et maintenant ?"
 pamir.0252.desc.northern:0 "\n\nL'Empire hephthalite est ressuscité, et j'ai été couronné son Khan. Nous ne sommes plus de vagues souvenirs. Le monde tremblera sous les sabots de notre cavalerie, et une fois encore, les peuples murmureront avec crainte le nom des Hephthalites à travers le monde."
 pamir.0252.desc.southern:0 "\n\nL'Empire hephthalite est ressuscité, et j'ai été couronné son Shah. Nous ne sommes plus de vagues souvenirs. Par le commerce, les arts et la splendeur de nos cités, une fois encore, les peuples du monde entier parleront des Hephthalites avec émerveillement."
 pamir.0252.a:0 "Nous renaissons des cendres de nos ancêtres !"
 pamir.0253.t:0 "L'empire Hephthalite ressuscité"
 pamir.0253.desc.intro:0 "Il y a des siècles, on les appelait les #bold Huns Blancs#! et beaucoup les craignaient. Et puis, comme ça, l'empire hephthalite disparut dans le folklore et les écrits des érudits, s'effondrant en une mosaïque de petits États résiduels.\n\nCependant, les Hephthalites ont perduré malgré une assimilation croissante avec les populations locales. Il n'y a pas si longtemps, ils ont reconquis leur cœur historique dans les Pamirs. Désormais, ils ont franchi une nouvelle étape vers la reconquête de leur gloire passée."
 pamir.0253.desc.northern:0 "\n\n[hephthalite_emperor.GetTitledFirstName] s'est couronné[hephthalite_emperor.Custom('FR_E')] [hephthalite_emperor.GetHerselfHimself] Khan de l'Empire Hephthalite restauré. La puissance et l'influence hephthalites s'étendent à nouveau, leurs armées et il est désormais clair qu'ils entendent embrasser leur héritage de guerriers redoutés."
 pamir.0253.desc.southern:0 "\n\n[hephthalite_emperor.GetTitledFirstName] s'est couronné[hephthalite_emperor.Custom('FR_E')] [hephthalite_emperor.GetHerselfHimself] Shah de l'Empire hephthalite restauré. Au fil des siècles, les Hephthalites ont appris à bâtir des cités prospères dans les vallées et les montagnes, et ils entendent désormais poser les fondations d'une prospérité future par le commerce et les arts."
 pamir.0253.desc.conclusion:0 "\n\nCeux qui vivent dans les montagnes enneigées comme le Pamir savent que l'hiver ne dure pas éternellement. Le printemps est arrivé, et les neiges ont fondu."
 pamir.0253.a:0 "Un nouveau printemps se lève pour les Hephthalites."
