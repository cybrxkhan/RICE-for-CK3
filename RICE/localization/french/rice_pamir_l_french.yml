 RICE_goat_sacrifice_number_of_goats_type_small: "Mineur"
 RICE_goat_sacrifice_number_of_goats_type_small_desc:"Sacrifier plus de chèvres augmentera les récompenses, ainsi que les chances d'obtenir un [character_modifier|El] #P bénéfique#!.\n\n#weak Bien que notre sacrifice soit modeste, il sera composé des chèvres les plus magnifiques que nous ayons à offrir.#!"
 RICE_goat_sacrifice_number_of_goats_type_medium: "Moyen"
 RICE_goat_sacrifice_number_of_goats_type_medium_desc:"Sacrifier plus de chèvres augmentera les récompenses, ainsi que les chances d'obtenir un [character_modifier|El] #P bénéfique#!.\n\n#weak [GetPlayer.GetFaith.PantheonTerm] sera sûrement satisfait de cette sélection considérable de chèvres.#!"
 RICE_goat_sacrifice_number_of_goats_type_large: "Conséquent"
 RICE_goat_sacrifice_number_of_goats_type_large_desc:"Sacrifier plus de chèvres augmentera les récompenses, ainsi que les chances d'obtenir un [character_modifier|El] #P bénéfique#!.\n\n#weak Pour [GetPlayer.GetFaith.PantheonTerm], notre sacrifice de chèvres sera tout simplement spectaculaire !#!"
 RICE_pamir_goat_sacrifice_phase: "Cérémonie"
 RICE_pamir_goat_sacrifice_phase_desc:"Nos chèvres seront sacrifiées à [GetPlayer.GetFaith.PantheonTerm] selon la manière traditionnelle que nous pratiquons depuis des générations."
 RICE_pamir_goat_sacrifice_worship_intent_header: "Adoration :"
 RICE_pamir_goat_sacrifice_worship_intent: "Adoration"
 RICE_pamir_goat_sacrifice_worship_intent_desc:"Vous vous concentrerez sur les dimensions religieuses du sacrifice de chèvre. Gain de [piety_i|El] #V 50#! supplémentaires quand l'[activity|El] est terminée. Perte de [stress_loss_i|El] [stress|El] supplémentaire si vous êtes [GetTrait('zealous').GetName( GetNullCharacter )] ou [GetTrait('humble').GetName( GetNullCharacter )]."
 RICE_pamir_goat_sacrifice_reputation_intent_header: "Réputation :"
 RICE_pamir_goat_sacrifice_reputation_intent: "Réputation"
 RICE_pamir_goat_sacrifice_reputation_intent_desc:"Vous voulez que tous connaissent votre dévotion à travers ce sacrifice de chèvre. Gain de [prestige_i|El] #V 50#! supplémentaires lorsque l'[activity|El] est terminée. Perte de [stress_loss_i|El] [stress|El] supplémentaire si vous êtes [GetTrait('ambitious').GetName( GetNullCharacter )] ou [GetTrait('arrogant').GetName( GetNullCharacter )]."
