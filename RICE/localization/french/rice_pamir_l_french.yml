 pamir.0013.t:0 "Le conte du prince féérique"
 pamir.0013.desc:0 "[gilgit_county.GetNameNoTier] est une terre d'une grande beauté et d'abondance, mais pendant de nombreuses années, elle fut ternie par les cruautés excessives de [shri_badat.GetTitledFirstName], connu sous le nom d'#italic Adam Khor#!, le Mangeur d'Hommes. Je n'étais qu'un parmi de nombreux aventuriers venus d'Iran, cherchant à fuir son passé et à trouver refuge loin de nos suzerains arabes ; finalement, j'arrivai au bon endroit et au bon moment, car qui peut résister au flot du destin ? D'une manière ou d'une autre, maintenant, je siège sur le trône de [gilgit_county.GetNameNoTier], ayant été proclamé son nouveau souverain."
 pamir.0013.a:0 "Comment me suis-je retrouvé mêlé à tout cela ?"
 pamir.0014.t:0 "Le conte du prince féérique"
 pamir.0014.desc:0 "Lorsque je suis arrivé pour la première fois à [gilgit_county.GetNameNoTier], j'ai essayé de vivre comme un humble ouvrier, bien loin de mes origines nobles. Mon passé était mon passé ; ici, je vivrais une vie nouvelle et simple. Mais le destin a ses voies.\n\n[nur_bakht.GetTitledFirstName], la fille de [shri_badat.GetTitledFirstName], est tombée amoureuse de moi, et je lui ai rendu ses sentiments. Contrairement à son père, elle est pure de cœur. Les gens ont fini par apprendre mes origines (et certains croient même que je suis un prince féerique venu du ciel !) et m'ont supplié de les délivrer de l'oppression de [shri_badat.GetTitledFirstName]. Même son propre ministre, [jataylotu.GetTitledFirstName], m'a approché !"
 pamir.0014.a:0 "En fin de compte, j'ai écouté leurs suppliques de salut."
 pamir.0015.t:0 "Le conte du prince féérique"
 pamir.0015.desc:0 "Bien que j'étais réticent à jouer les héros, nous avons tous travaillé ensemble pour tuer [shri_badat.GetTitledFirstName] et mettre fin à son règne de tyrannie une bonne fois pour toutes. Certains paysans superstitieux croient que leur ancien roi possède des pouvoirs de sorcier, et qu'il est vivant et caché, mais pour l'instant, un nouveau jour se lève sur [gilgit_county.GetNameNoTier]. Hélas, elle a grandement souffert de son précédent dirigeant, et ses infrastructures et son économie sont en ruines. Je confesse que c'est une terre et un peuple dont j'ai beaucoup à apprendre ; une fois l'euphorie initiale dissipée, je devrai gagner la confiance du peuple afin que nous puissions travailler ensemble pour restaurer [gilgit_county.GetNameNoTier] dans sa gloire passée."
 pamir.0015.a:0 "J'ai appris beaucoup de choses en Iran, et je m'en tiendrai aux enseignements de mes ancêtres."
 pamir.0015.b:0 "J'adopterai le type de bouddhisme qui était suivi par les précédents dirigeants de cette terre."
 pamir.0015.c:0 "Je m'adapterai aux croyances des gens du peuple ici, et adhérerai à leur culte de nombreuses divinités."
 pamir.0015.d:0 "Je cherche à comprendre cette nouvelle foi, l'Islam - peut-être nous apportera-t-elle des réponses !"
 pamir.0016.t:0 "Descendant du prince féérique"
 pamir.0016.desc:0 "Il y a des générations, mon ancêtre [azur_jamshid.GetTitledFirstName] a vaincu le cruel roi cannibale [shri_badat.GetTitledFirstName] et a établi une nouvelle dynastie régnante ici à [gilgit_county.GetNameNoTier]. Les gens estiment encore grandement mon ancêtre, car des célébrations sont régulièrement organisées pour commémorer son renversement du tyran. Les temps changent, cependant, avec l'arrivée de puissants nomades turcs venus de l'ouest du Pamir et des montagnes de l'Hindu Kush, tels que les Seldjoukides ou les Ghaznévides. Nous devons avancer prudemment si nous voulons survivre."
 pamir.0016.a:0 "Perpétuer les traditions de mes ancêtres, voilà ce qui nous donnera la force !"
 pamir.0016.b:0 "Je devrais adopter les croyances des paysans, pour me rapprocher d'eux."
 pamir.0016.c:0 "Il vaut mieux que nous nous adaptions et comprenions l'islam, en tant que nouvelle foi en pleine expansion."
 pamir.0017.t:0 "Les Derniers des Zunbils"
 pamir.0017.desc:0 "Face aux incursions musulmanes au Zabulistan pendant plus de deux siècles, les Zunbils restèrent indépendants, unissant des tribus autrefois querelleuses - des Hephthalites aux Turcs, Iraniens, et bien d'autres - pour résister farouchement... jusqu'à récemment. Les Zunbils trouvèrent leur égal en le redoutable seigneur de guerre [saffarid.GetTitledFirstName].\n\nAprès leur défaite, certains Zunbils, comme [RICE_zunbil_cousin.GetFirstName], acceptèrent de servir [saffarid.GetFirstName]. D'autres, comme [RICE_last_zunbil.GetFirstName], fils du dernier souverain Zunbil, faisaient encore confiance aux anciennes voies [RICE_last_zunbil.GetFaith.GetAdjectiveNoTooltip]s, défièrent l'autorité saffaride, et furent emprisonnés.\n\nDes rumeurs circulent selon lesquelles [RICE_last_zunbil.GetFirstName] se serait échappé de captivité, levant une grande force dans les terres ancestrales des Zunbils pour maintenir une indépendance nominale. D'autres rumeurs disent que [RICE_zunbil_cousin.GetFirstName] attend son heure, se préparant à se révolter maintenant que les Saffarides sont empêtrés dans un conflit avec les Tahirides. Il ne fait aucun doute que ces terres connaîtront de nouveau la guerre.\n\nEn fin de compte, on ne peut que se demander qui a commis la plus grave erreur : [RICE_zunbil_cousin.GetFirstName] pour s'être allié à ceux qui cherchent à conquérir les Zunbils, ou [RICE_last_zunbil.GetFirstName] pour avoir résisté futilement à l'inévitable. Serait-ce le dernier chapitre des grands Zunbils, les ultimes vestiges des anciens Huns Blancs ?"
 pamir.0017.a:0 "J'ai choisi mon camp. Le sort des Zunbils sera bientôt déterminé !"
 #pamir.0017.b:0 "I admit, I admire my cousin’s tenacity... If only I were like him..."
 pamir.0017.info:0 "\n#emphasis Contexte historique :#! Les diverses tentatives des Saffarides pour pacifier les terres autrefois dominées par les Zunbils au milieu du IXe siècle se heurtèrent à une forte résistance. Un descendant de la famille Zunbil, nommé gouverneur d'al-Rukhhaj (Kandahar) sous les Saffarides, se rebella en 867 de notre ère, par exemple. Quelques années plus tard, en 869, le dernier Zunbil, nommé Firuz ibn Kabk dans les sources arabes, s'échappa de sa captivité saffaride et rallia des partisans pour combattre les musulmans.\n\nLa dynastie Zunbil prit fin en 870 de notre ère lorsque Firuz fut vaincu par une force saffaride."
 pamir.0017.firuz.tooltip:0 "#bold [RICE_aspiration|E] de Firuz : Affirmer l'indépendance zunbil#!$RICE_pamir_aspiration_zunbil_desc$\n"
 pamir.0018.t:0 "$RICE_historical_aspiration_fulfilled_title$"
 pamir.0018.desc:0 "Je l'admets. Je ne pensais pas arriver aussi loin. Quand j'ai commencé notre résistance contre les Saffarides, mon objectif principal était simplement de sécuriser notre position face à leurs redoutables armées, et aux armées de ceux qui cherchaient à nous détruire.\n\nPourtant nous voici. Le royaume Zunbil, restauré. Nos ennemis, humiliés. Zun, triomphant.\n\nLe chemin à venir sera difficile. Nous sommes une terre aux origines et aux parcours multiples, un héritage de cultures anciennes et de dynasties depuis longtemps disparues. Cependant, nous avons réussi à rétablir notre royaume et posé les fondations d'un avenir prospère. Depuis ces montagnes escarpées et ces vallées fertiles, nous bâtirons une grande civilisation une fois encore."
 pamir.0018.a:0 "Louons le Soleil, celui qui rend la Justice !"
