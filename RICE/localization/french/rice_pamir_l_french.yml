 pamir.0030.t:0 "Une excursion aux sources chaudes"
 pamir.0030.desc:0 "Il existe de nombreuses sources chaudes dans les montagnes du Pamir, mais les sources chaudes dites de Bibi Fatima sont parmi les plus connues de la région.\n\nSituées dans la vallée du Wakhan, Bibi Fatima tire son nom de la fille du Prophète de l'Islam, Mahomet, car certains musulmans de la région lui associent des légendes, au point que même les non-musulmans la connaissent désormais sous ce nom. On croit notamment que ces sources possèdent non seulement des propriétés curatives, mais qu'elles améliorent également la fertilité.\n\nJ'ai décidé de rendre visite à ces sources pour me détendre."
 pamir.0030.a:0 "En route vers les sources !"
 pamir.0031.t:0 "Bibi Fatima"
 pamir.0031.desc:0 "J'arrive aux sources chaudes de Bibi Fatima. Les sources elles-mêmes sont assez petites et isolées, bien que quelques bâtiments existent à proximité pour accueillir les visiteurs comme moi. Selon la coutume locale, hommes et femmes se baignent séparément, je me rends donc à la partie appropriée des sources.\n\nUne fois à l'intérieur, je me trempe et me détends dans ces eaux riches en minéraux. Je me demande si les rumeurs selon lesquelles ces eaux augmentent la fertilité sont vraies ?\n\nQuoi qu'il en soit, une fois que j'ai terminé, je peux me rendre au village voisin pour me reposer."
 pamir.0031.a:0 "Il est temps de se détendre !"
 pamir.0031.toast.fertile:0 "Les sources améliorent (supposément) votre fertilité !"
 pamir.0031.toast.normal:0 "Les sources ne semblent pas améliorer votre fertilité !"
 pamir.0032.t:0 "Sources chaudes de Bibi Fatima"
 pamir.0032.desc:0 "Avec la montée récente de l'islam, des voyageurs, marchands et aventuriers musulmans se sont déjà frayé un chemin jusqu'aux montagnes du Pamir. Comme beaucoup de ceux qui ont vécu ou voyagé ici au fil des siècles, les musulmans ont également fait grand usage des nombreuses sources chaudes de la région.\n\nUn certain nombre de ces musulmans semblent particulièrement captivés par une source chaude en particulier, qu'ils appellent désormais les sources de Bibi Fatima. Des histoires circulent sur la façon dont une fille de leur Prophète, Mahomet, aurait traversé ces sources à un moment donné. On dit qu'à cause de cela, ces sources ont commencé à avoir non seulement des propriétés curatives et médicinales miraculeuses, mais qu'elles peuvent également améliorer la fertilité.\n\nEn conséquence, les sources gagnent en renommée même parmi les habitants non-musulmans, et commencent à attirer des visiteurs de près et de loin."
 pamir.0032.a:0 "J'envisagerai de m'y rendre un jour."
 pamir.0033.t:0 "Postes de guet du Wakhan"
 pamir.0033.desc:0 "Le corridor du Wakhan, qui chevauche les monts Pamir, relie de nombreuses parties de la Route de la Soie. Au fil des siècles, divers dirigeants - des rois locaux aux empires tibétain et chinois - ont entretenu un réseau de postes de garde défensifs le long des vallées étroites et allongées pour protéger les caravanes et guider les armées traversant la région. Bien qu'encore en usage, ces anciens postes de garde sont dans un état de délabrement et pourraient bénéficier de fonds pour les réparer et les renforcer."
 pamir.0033.a:0 "Dépenser une petite somme de fonds"
 pamir.0033.b:0 "Dépenser une quantité moyenne de fonds"
 pamir.0033.c:0 "Dépenser une grande somme de fonds"
 pamir.0034.t:0 "Postes de guet du Karakoram"
 pamir.0034.desc:0 "Les cols des montagnes du Karakoram, au sud des Pamirs, relient de nombreuses parties de la Route de la Soie. Au fil des siècles, divers souverains - des rois locaux aux empires tibétain et chinois - ont entretenu un réseau de postes de guet défensifs le long des vallées étroites et allongées pour protéger les caravanes et guider les armées traversant la région. Bien qu'encore utilisés, ces anciens postes de guet sont en état de délabrement et auraient besoin de fonds pour être réparés et renforcés."
 pamir.0034.a:0 "Dépenser une petite somme de fonds"
 pamir.0034.b:0 "Dépenser une quantité moyenne de fonds"
 pamir.0034.c:0 "Dépenser une grande somme de fonds"
 pamir.0035.t:0 "Préparation du Sacrifice"
 pamir.0035.desc:0 "Selon nos croyances traditionnelles [ROOT.Char.GetFaith.GetAdjectiveNoTooltip]s, les chèvres sont tenues en haute estime, sacrées même, car elles représentent la pureté. Sans parler de l'importance des chèvres pour notre survie et notre prospérité. Ainsi, sacrifier une chèvre aux cieux est peut-être le plus grand sacrifice que je puisse accomplir, même en tant que [ROOT.Char.GetTitleAsNameNoTooltip]."
 pamir.0035.a:0 "Préparons-nous au sacrifice."
 #  pamir.0035.a:0 "Sacrifice a few goats"
 #  pamir.0035.b:0 "Sacrifice several goats"
 #  pamir.0035.c:0 "Sacrifice many goats"
 pamir.0035.tooltip:0 "La quantité de chèvres que vous sacrifiez détermine la façon dont votre sacrifice est perçu par la communauté et, peut-être, la façon dont les divinités réagissent."
 pamir.0036.t:0 "Sacrifiez les chèvres !"
 pamir.0036.desc.zun:0 "En tant que [ROOT.Char.GetFaith.GetAdherentName], il y a une divinité principale à laquelle nous sacrifions : [ROOT.Char.GetFaith.HighGodName], bien sûr. Nous amènerons les chèvres à un sanctuaire local quelque part dans les vallées ou les montagnes les plus reculées, non souillées par la pollution des impuretés, où nous pourrons être plus proches de [ROOT.Char.GetFaith.HighGodName]."
 pamir.0036.desc.normal:0 "Dans cette optique, je dois maintenant choisir à quelle divinité offrir le sacrifice. Nous amènerons les chèvres à un sanctuaire local dédié à cette divinité - en particulier un sanctuaire situé dans les vallées ou montagnes les plus reculées, non souillé par la pollution des impuretés - et c'est là que nous répandrons le sang des chèvres."
 pamir.0036.a:0 "Puisse [ROOT.Char.GetFaith.HighGodName] accepter mon sacrifice !"
 pamir.0036.b:0 "Puisse [ROOT.Char.GetFaith.NightGodName] accepter mon sacrifice !"
 pamir.0036.c:0 "Puisse [ROOT.Char.GetFaith.WealthGodName] accepter mon sacrifice !"
 pamir.0036.d:0 "Puisse [ROOT.Char.GetFaith.HouseholdGodName] accepter mon sacrifice !"
 pamir.0036.e:0 "Puisse [ROOT.Char.GetFaith.KnowledgeGodName] accepter mon sacrifice !"
 pamir.0036.f:0 "Puisse [ROOT.Char.GetFaith.FertilityGodName] accepter mon sacrifice !"
 pamir.0036.nothing:0 "Votre sacrifice ne semble pas adéquat !"
 pamir.0036.nothing.tooltip:0 "Hélas, vous ne recevrez aucun bienfait pour votre sacrifice."
 pamir.0036.something:0 "Votre sacrifice pieux est dûment noté !"
 pamir.0037.t:0 "xxxxx"
 pamir.0037.desc:0 "xxxxx"
 pamir.0037.a:0 "xxxxx"
 pamir.0038.t:0 "L'Idole de Zun"
 pamir.0038.desc:0 "Au temps jadis, nos prédécesseurs entretenaient une magnifique idole de Zun à [zamindawar_county.GetNameNoTier], où les dévots du Dispensateur de Justice pouvaient Le louer et recevoir les bénédictions des prêtres qui y résidaient. Mais des jours sombres s'abattirent bientôt sur nous, quand nous, fidèles suivants de Zun, dûmes attendre dans l'ombre, espérant l'ère où Il pourrait être convenablement honoré à nouveau.\n\nAujourd'hui, cette ère est arrivée. Avec le renouveau du culte de Zun dans la région, j'ai mis de côté des fonds et organisé un effort pour reconstruire l'idole. Cette grande et imposante statue est forgée d'or pur et ornée d'yeux de rubis, extraits des mines de rubis reculées du Badakhshan. Elle a été placée sur le mont sacré Zhunagir comme autrefois, où elle se dresse fièrement."
 pamir.0038.a:0 "Louons Zun !"
 pamir.0038.tooltip:0 "Maintenant que l'[idol_of_zun|El] se dresse fièrement à Zamindawar une fois de plus, les [rulers|El] [zun_idol_restorer.GetFaith.GetAdherentNamePlural] locaux peuvent prendre une [decision|El] pour #V Offrir des Richesses à l'Idole de Zun#!, afin de recevoir des bienfaits de [piety|El], de [prestige|El] et de [dynasty_prestige|El]."
 pamir.0039.t:0 "Reconquérir le Mont Aruna"
 pamir.0039.desc:0 "Il y a des siècles, Zun résidait sur le Mont Aruna, qui n'est pas très loin de [kabul_county.GetNameNoTier]. Là-bas, nous avions un puissant sanctuaire dédié à Zun avec sa propre magnifique idole, mais hélas, des adeptes brahmanistes de Surya nous en ont chassés par la force.\n\nCependant, nous avons maintenant l'opportunité d'inverser cette tragédie. Le culte de Zun ne fait pas que se rétablir, il prospère dans cette partie du monde, et nous, les Zunistes, contrôlons à nouveau la région autour du Mont Aruna. Puisque nous avons déjà restauré la grande idole sur le Mont Zhunagir à Zamindawar, il est tout à fait approprié que je mette des fonds de côté et organise un effort pour faire de même sur le Mont Aruna. Comme l'idole de Zamindawar, celle-ci sera forgée en or et possédera de magnifiques yeux de rubis, extraits des mines de rubis reculées du Badakhshan."
 pamir.0039.a:0 "Louons Zun pour ce triomphe !"
 pamir.0039.tooltip:0 "Avec un nouvel [idol_of_zun|El] se dressant fièrement sur le Mont Aruna, les [rulers|El] [zun_mount_aruna_relcaimer.GetFaith.GetAdherentNamePlural] locaux peuvent prendre une [decision|El] pour #V Offrir des Richesses à l'Idole de Zun#! là aussi, afin de recevoir des bienfaits de [piety|El], [prestige|El], et [dynasty_prestige|El]. Les bonus diffèrent légèrement par rapport à ceux obtenus à Zamindawar."
 pamir.0040.t:0 "L'Idole de Zun restaurée"
 pamir.0040.desc:0 "Il y a des siècles, l'Idole de Zun se dressait fièrement à [zamindawar_county.GetNameNoTier] comme symbole de Zun, et de la dévotion et la piété de ses fidèles. Aujourd'hui, la grande statue dorée, ornée d'yeux de rubis du Badakhshan, a été ressuscitée grâce aux efforts de [zun_idol_restorer.GetTitledFirstName] - assurément un signe du renouveau des fortunes [zun_idol_restorer.GetFaith.GetAdjectiveNoTooltip]s !"
 pamir.0040.a:0 "Excellent !"
 pamir.0041.t:0 "Le Mont Aruna récupéré pour Zun"
 pamir.0041.desc:0 "Il y a bien longtemps, le Mont Aruna, situé près de [kabul_county.GetNameNoTier], était considéré comme la demeure du grand dieu Zun, le Dispensateur de Justice. Hélas, ses fidèles furent chassés de la montagne par les adeptes brahmanistes de Surya. Cependant, grâce aux efforts de [zun_mount_aruna_relcaimer.GetTitledFirstName], le Mont Aruna est désormais fermement sous contrôle [zun_mount_aruna_relcaimer.GetFaith.GetAdherentName] une fois de plus, et une nouvelle Idole de Zun y a été érigée."
 pamir.0041.a:0 "Merveilleux !"
 pamir.0042.t:0 "Suppliques aux « Kafirs »"
 pamir.0042.desc:0 "Depuis des générations et des générations, remontant à l'âge des mythes et des légendes, les féroces païens des hautes terres du Pamir et des montagnes de l'Hindu Kush - surnommés « Kafirs » par les musulmans - ont farouchement résisté aux incursions de leurs voisins plus développés, y compris ceux qui sont eux-mêmes païens.\n\nCependant, l'équilibre politique de la région est en train de changer, étant donné qu'il y a davantage de dirigeants comme moi qui suivent une foi similaire à la leur. En d'autres termes, compte tenu de nos coutumes et croyances communes, ces tribus kafires ne sont plus isolées et seules en ce monde - avec quelques efforts, je crois que nous pouvons bâtir une relation productive. Je souhaite négocier avec certains des « Kafirs » vivant sur le territoire que je gouverne nominalement, et peut-être trouver un moyen de les encourager à s'intégrer avec leurs voisins."
 pamir.0042.a:0 "Négocier avec les tribus de [munjan_county.GetNameNoTier]"
 pamir.0042.b:0 "Négocier avec les tribus de [chitral_county.GetNameNoTier]"
 pamir.0042.c:0 "Négocier avec les tribus de [yasin_county.GetNameNoTier]"
 pamir.0042.d:0 "Négocier avec les tribus de [gilgit_county.GetNameNoTier]"
 pamir.0042.e:0 "Négocier avec les tribus de [golaghmuli_county.GetNameNoTier]"
 pamir.0043.t:0 "La guérison commence"
 pamir.0043.desc.generic:0 "Bien que [shri_badat.GetTitledFirstName] ne soit plus, l'héritage de ce tyran cannibale et ignoble empoisonne encore la terre. Son palais, lieu de ses festins contre-nature et macabres, se dresse toujours à [gilgit_county.GetNameNoTier]. Mais c'en est fini !\n\nJ'ai rassemblé un certain nombre de paysans locaux et leur ai ordonné d'apporter des torches, des pelles, des marteaux et tous les instruments qu'ils pouvaient trouver. Une fois suffisamment rassemblés, avec un grand cri enthousiaste, nous avons marché vers le palais et l'avons promptement démoli avec nos outils."
 pamir.0043.desc.azur_jamshid:0 "Bien que j'aie tué avec justice [shri_badat.GetTitledFirstName], l'héritage de ce tyran cannibale et immonde empoisonne encore la terre. Son palais, lieu de ses festins contre-nature et macabres, se dresse toujours à [gilgit_county.GetNameNoTier]. Mais c'en est fini !\n\nJ'ai rassemblé un certain nombre de paysans locaux et leur ai ordonné d'apporter des torches, des pelles, des marteaux et tous les instruments qu'ils pourraient trouver. Une fois suffisamment rassemblés, avec un grand cri enthousiaste, nous avons marché vers le palais et l'avons promptement démoli avec nos outils.\n\nAvec ma chère épouse [nur_bakht.GetTitledFirstName], nous avons regardé le palais brûler. Bien que toute cette affaire l'attriste, car [shri_badat.GetTitledFirstName] était son père après tout, elle me dit qu'elle comprend que cela devait être fait."
 pamir.0043.a:0 "Maintenant, la terre peut commencer à guérir."
 pamir.0044.t:0 "Dokhtar-i Noshirwan"
 pamir.0044.desc:0 "Il y a des générations, des chefs locaux régnant non loin de [bamian_county.GetNameNoTier] ont commandité la création d'un complexe de sanctuaires taillés dans la roche dans une partie de la vallée de Kolm connue sous le nom de Dokhtar-i Noshirwan. Il était dédié à une version locale de [ROOT.Char.GetFaith.HighGodName] connue sous le nom d'Oxus-Zun ou Wakhsh-Zun, et comportait une magnifique fresque représentant le Dispensateur de Justice, l'une des plus grandes fresques réalisées dans cette région. Hélas, pendant de nombreuses années, ce centre de culte autrefois magnifique dédié à [ROOT.Char.GetFaith.HighGodName] est tombé en ruine.\n\nJ'ai pris sur moi de financer une rénovation, une restauration de ce sanctuaire autrefois grandiose, afin qu'il puisse être estimé à nouveau et servir de grand sanctuaire à [ROOT.Char.GetFaith.HighGodName]. Les artisans que j'ai engagés de près et de loin, en particulier ceux d'extraction iranienne, ont fait de leur mieux pour retrouver le style vibrant de l'original."
 pamir.0044.a:0 "Un effort magnifique, et je suis sûr que [ROOT.Char.GetFaith.HighGodName] l'appréciera."
 pamir.0045.t:0 "Préparer l'offrande"
 pamir.0045.desc:0 "J'ai décidé qu'il est temps que je montre ma dévotion envers [ROOT.Char.GetFaith.HighGodName], de la manière traditionnelle [ROOT.Char.GetFaith.GetAdjective], en offrant à l'idole du Dispensateur de Justice une certaine quantité d'objets inestimables. Je devrai préparer mon voyage vers l'idole - ce doit être une grande cérémonie, après tout, étant donné que je suis un [ROOT.Char.GetTitleAsNameNoTooltip]."
 pamir.0045.desc.choose:0 "\n\nÉtant donné qu'il existe deux grandes idoles, l'une à Zamindawar et l'autre sur le mont Aruna, je devrais également choisir laquelle des deux idoles je veux visiter et à laquelle je veux faire l'offrande."
 pamir.0045.a:0 "En route pour le Zamindawar !"
 pamir.0045.b:0 "En route pour le Mont Aruna !"
 pamir.0045.a.tooltip:0 "Bien que vous gagnerez de la [piety|El] et du [prestige|El] quoi qu'il arrive, faire des offrandes à l'idole de #V Zamindawar#! vous assurera d'avoir plus de chances de gagner encore plus de #Y piété#!."
 pamir.0045.b.tooltip:0 "Bien que vous gagnerez de la [piety|El] et du [prestige|El] quoi qu'il en soit, faire des offrandes à l'idole du #V Mont Aruna#! vous assurera d'avoir plus de chances de gagner encore plus de #Y prestige#!."
 pamir.0046.t:0 "Richesses"
 pamir.0046.desc:0 "Maintenant que j'ai commencé à faire des plans pour voyager vers l'Idole de Zun, je dois aussi déterminer combien de richesses j'offrirai à [ROOT.Char.GetFaith.HighGodName]. Plus j'offrirai, mieux cela rejaillira sur moi."
 pamir.0046.a:0 "Une somme conséquente mais modeste suffira."
 pamir.0046.b:0 "Une quantité substantielle de richesses."
 pamir.0046.c:0 "Un immense et grandiose trésor de richesses !"
 pamir.0046.tooltip:0 "La quantité de [piety|El] et de [prestige|El] que vous gagnez est aléatoire, mais influencée par la quantité d'[gold|El] que vous offrez (entre autres facteurs comme vos [traits|El])."
 pamir.0047.t:0 "L'Idole de Zun"
 pamir.0047.desc.zamindawar:0 "Enfin, j'ai atteint le sanctuaire abritant l'idole de [ROOT.Char.GetFaith.HighGodName] au Zamindawar. C'est un spectacle merveilleux et impressionnant, cette statue d'or aux yeux magnifiques faits de rubis trouvés au Badakhshan. Presque aussi impressionnants sont les grands monticules d'or et autres richesses qui entourent la statue, tous des présents et offrandes donnés par d'autres.\n\nJe fais signe à mes serviteurs de déposer les richesses que j'ai apportées devant l'idole. Je dis ma prière, et espère que [ROOT.Char.GetFaith.HighGodName] sera satisfait de mon offrande."
 pamir.0047.desc.mount_aruna:0 "Enfin, j'ai atteint le sanctuaire abritant l'idole de [ROOT.Char.GetFaith.HighGodName] sur le Mont Aruna. C'est un spectacle merveilleux et impressionnant, cette statue d'or aux yeux magnifiques faits de rubis trouvés au Badakhshan. Presque aussi impressionnants sont les grands monticules d'or et autres richesses qui entourent la statue, tous des présents et offrandes donnés par d'autres.\n\nJe fais signe à mes serviteurs de déposer les richesses que j'ai apportées devant l'idole. Je dis ma prière, et j'espère que [ROOT.Char.GetFaith.HighGodName] sera satisfait de mon offrande."
 pamir.0047.a:0 "Louange à [ROOT.Char.GetFaith.HighGodName], le Dispensateur de Justice !"
 pamir.0047.message:0 "Votre offrande montre votre dévotion envers [ROOT.Char.GetFaith.HighGodName] !"
 pamir.0048.t:0 "xxxxx"
 pamir.0048.desc:0 "xxxxx"
 pamir.0048.a:0 "xxxxx"
 pamir.0049.t:0 "L'héritage de Shri Badat"
 pamir.0049.desc:0 "Au début, je croyais aussi aux mensonges. Mais plus j'y réfléchissais, plus je réalisais que [shri_badat.GetFirstName] était un homme incompris. Il savait que la #X #bold puissance#!#! et la #X #bold peur#!#! sont ce qui compte dans ce monde, et que la force fait le droit. Le tuer n'a pas changé cette réalité.\n\nOn murmure que son esprit rôde encore ici. Certaines nuits, je rêve qu'il me chuchote à l'oreille, me disant comment je peux réussir en tant que [ROOT.Char.GetTitleAsNameNoTooltip] : je dois suivre son exemple et embrasser les ténèbres dans mon cœur.\n\nDans cette optique, j'ai ordonné la rénovation de son ancien palais, qui tient miraculeusement encore debout. Je frapperai de terreur le cœur des gens inférieurs, qui trembleront devant moi, car ils manquent de pouvoir. Ce n'est qu'avec la force et la peur que je pourrai remodeler cette terre pour la rendre grande."
 pamir.0049.a:0 "Que tous tremblent devant moi !"
 pamir.0049.tooltip:0 "#Weak Et pourtant... alors que j'embrasse les ténèbres, j'entends une faible voix... « [THIS.Char.GetFirstNameNoTooltip], [THIS.Char.GetFirstNameNoTooltip], non ! »#!"
 pamir.0050.t:0 "Préparations"
 pamir.0050.desc:0 "Le festival de Chinir est le festival traditionnellement célébré par de nombreux peuples vivant dans les régions montagneuses et accidentées des Pamirs pour saluer le début de la saison des récoltes. C'est un festival où l'interaction sociale et le partage de nourriture et de bonne humeur sont encouragés. Le jour de la fête sera bientôt là, et j'ai décidé de rencontrer les gens du peuple et de contribuer aux festivités cette année !"
 pamir.0050.a:0 "C'est bientôt la saison des moissons !"
 pamir.0051.t:0 "Saison des récoltes"
 pamir.0051.desc:0 "Le Festival de Chinir vient de commencer, et je suis arrivé dans une ville locale pour prendre part aux célébrations. Le Chinir est une occasion joyeuse, car il marque la fin des mois dits de la faim, lorsque les habitants doivent rationner des réserves de nourriture limitées avant la récolte, afin que chacun puisse manger et se réjouir !"
 pamir.0051.a:0 "C'est enfin la saison des récoltes !"
 pamir.0052.t:0 "Chinir"
 pamir.0052.desc:0 "En tant que chef de ma maisonnée, je sors dans les champs et prends une petite quantité d'orge récoltée que j'apporte au moulin local pour être transformée en farine. Je secoue ensuite rituellement cette farine sur les piliers de ma maison et attache ce qui reste de l'orge au pilier du #italic chikish#!, la cuisine.\n\nEnsuite, moi et toute ma maisonnée nous rassemblons autour d'un bol, le #italic chinir#! éponyme lui-même, qui est rempli de yaourt. Nous baissons la tête et récitons des prières [ROOT.Char.GetFaith.GetAdjectiveNoTooltip]s à [ROOT.Char.GetFaith.HighGodName]. Après cela, chacun mange un peu de yaourt."
 pamir.0052.a:0 "Un bon début !"
 pamir.0053.t:0 "Le grand festin"
 pamir.0053.desc:0 "La partie suivante du Chinir est un grand rassemblement entre personnes de mon sexe. En tant que [ROOT.Char.GetWomanMan], je rencontre plusieurs autres personnes du même sexe au sein de la communauté - allant des nobles éminents aux plus humbles des paysans - dans une grande salle de réunion pour participer à un grand festin."
 pamir.0053.a:0 "La nourriture sent bon !"
 pamir.0054.t:0 "Visitations"
 pamir.0054.desc:0 "Après la fête du chinir, il est de coutume qu'un[ROOT.Char.Custom('FR_E')] [ROOT.Char.GetWomanMan] comme moi rende visite aux membres de la communauté du même sexe, pour partager notre nourriture et prendre un peu de yaourt dans le bol de chinir de chaque maison. J'ai déjà visité plusieurs foyers et j'ai le temps d'en visiter un autre. Je décide de rendre visite à la maison d'un..."
 pamir.0054.a:0 "Humble et diligent fermier"
 pamir.0054.b:0 "Artisan travailleur"
 pamir.0054.c:0 "Sage et éloquent érudit"
 pamir.0054.d:0 "Puissant noble local"
 pamir.0055.t:0 "Récolter ou ne pas récolter ?"
 pamir.0055.desc:0 "À la fin du Festival de Chinir, il est de coutume d'aider symboliquement à la récolte, même si l'on n'est pas agriculteur. Après tout, il est important que chacun montre ses liens avec la communauté, même moi, un [ROOT.Char.GetTitleAsNameNoTooltip], devrais y participer. Ce n'est pas comme si je faisais un vrai travail agricole, de toute façon."
 pamir.0055.a:0 "Je ne suis pas un paysan besogneux ! Je ne ferai rien."
 pamir.0055.b:0 "Je ne peux pas faire ça ! C'est bien trop de travail."
 pamir.0055.c:0 "J'apporterai un peu d'aide si nécessaire, mais pas trop."
 pamir.0055.d:0 "Je veux aider autant que possible pour la journée."
 pamir.0056.t:0 "La coupe du grain"
 pamir.0056.desc:0 "Lors de la première session de récolte du Festival de Chinir, tout le monde - même les enfants - participe à la coupe des céréales, mais les rôles sont clairement définis. Les hommes utilisent de petites faux appelées #italic thutr#! pour couper le grain, tandis que les femmes lient les tiges en gerbes prêtes pour le battage. Je passerai quelques heures à faire cela, avant de retourner aux festivités."
 pamir.0056.a.male:0 "En tant qu'homme, c'est mon devoir d'aider à couper le grain."
 pamir.0056.a.female:0 "En tant que femme, j'aiderai à attacher les tiges."
 pamir.0057.t:0 "La saison des récoltes est terminée"
 pamir.0057.desc:0 "Enfin, le festival de Chinir est terminé. J'ai passé un bon moment, j'ai pu partager de la nourriture, avoir des discussions agréables et créer de joyeux souvenirs avec les autres participants. J'espère pouvoir refaire cela à l'avenir."
 pamir.0057.a:0 "C'est définitivement une bonne saison de récolte."
 pamir.0058.t:0 "xxxxx" # Blanker
 pamir.0058.desc:0 "xxxxx"
 pamir.0058.a:0 "xxxxx"
 pamir.0059.t:0 "La dernière bouchée"
 pamir.0059.desc:0 "Pendant le festin principal du Chinir, la nourriture est partagée dans des bols collectifs. Je suis sur le point d'attraper le dernier morceau de viande dans un bol, quand un autre convive s'apprête à faire de même. Nous nous regardons maladroitement, ne sachant que faire."
 pamir.0059.a:0 "Je vous en prie, profitez-en, mon ami."
 pamir.0059.b:0 "Cela m'appartient ! Je suis [ROOT.Char.Custom('FR_LeLa')] [ROOT.Char.GetTitleAsNameNoTooltip] !"
 pamir.0060.t:0 "Partage de nourriture"
 pamir.0060.desc:0 "Pendant le festival de Chinir, la coutume veut que les gens apportent au festin des bols de bouillie de blé sucrée préparée à la maison, ainsi que du pain et de la viande, pour les partager avec les autres familles. En tant que membre le plus haut placé de la communauté, il serait bon que je fasse preuve de générosité pendant la fête."
 pamir.0060.a:0 "Vraiment ? C'est à MOI qu'ils devraient donner de la nourriture !"
 pamir.0060.b:0 "Je ne suis venu qu'avec une modeste quantité de nourriture."
 pamir.0060.c:0 "J'ai apporté avec moi beaucoup de bonne nourriture pour tous !"
 pamir.0060.d:0 "J'ai tellement de nourriture sur moi que c'en est ridicule."
 pamir.0061.t:0 "Prières ou sociabilité ?"
 pamir.0061.desc:0 "Les membres les plus pieux de la communauté prononcent généralement de nombreuses prières sous leur souffle pendant la fête. Certains considèrent toutefois que cela va à l'encontre de l'esprit du festival, qui consiste à interagir et à partager avec les autres membres de la communauté."
 pamir.0061.a:0 "Je préfère réciter moi-même des prières [ROOT.Char.GetFaith.GetAdjectiveNoTooltip]s."
 pamir.0061.b:0 "Je pense qu'un équilibre entre prière et vie sociale est très bien."
 pamir.0061.c:0 "Socialiser est important ! Tout le monde sait que c'est vrai !"
 pamir.0062.t:0 "Partager, c'est se soucier des autres"
 pamir.0062.desc:0 "La raison d'être du principal festin du Chinir est d'encourager le partage entre les gens et de rappeler à chacun que la communauté ne peut survivre que si les gens dépendent les uns des autres. Les gens se réunissent pour établir des liens et célébrer les bonnes choses de la vie."
 pamir.0062.a:0 "Ce sont des leçons que je dois m'efforcer de retenir."
 pamir.0063.t:0 "Fromage Kurut"
 pamir.0063.desc:0 "#italic Kurut#!, une sorte de fromage caillé du Pamir, est un en-cas ou un accompagnement populaire tout au long de l'année, y compris lors du festival de Chinir. Il est de coutume avant le festival que les femmes âgées taquinent les hommes, en particulier les jeunes et les nouveaux mariés, pour qu'ils consomment beaucoup de #italic kurut#!, car on croit que cela augmente le désir d'intimité chez l'homme."
 pamir.0063.a:0 "Évidemment que je vais en manger !"
 pamir.0063.b:0 "Je ne suis pas d'humeur à grand-chose."
 pamir.0063.c:0 "Je vais me moquer des hommes à ce sujet."
 pamir.0064.t:0 "Moch"
 pamir.0064.desc:0 "L'un des plats populaires du festin de Chinir est le #italic moch#!, préparé en mélangeant du caillé de fromage avec de l'eau et en le versant sur des légumes cuits. Il est apprécié car on croit qu'il est bon pour réchauffer le corps et maintenir ses forces durant les mois plus froids de l'automne et de l'hiver."
 pamir.0064.a:0 "En manger me donne déjà chaud au cœur !"
 pamir.0065.t:0 "Belle demeure"
 pamir.0065.desc:0 "Tout en participant au festin de Chinir, j'observe la maison dans laquelle je me trouve. L'hôte, propriétaire de cette maison, l'a décorée de plusieurs brins de céréales, comme le veut la coutume, mais il l'a fait de manière à ce que ce soit extrêmement esthétique."
 pamir.0065.a:0 "Observez tranquillement avec émerveillement."
 pamir.0065.b:0 "Louez l'hôte devant tout le monde."
 pamir.0066.t:0 "Histoires de vie"
 pamir.0066.desc:0 "Durant le festin de Chinir, j'engage une conversation plutôt agréable avec l'un des convives. Nous apprenons beaucoup sur les expériences de l'autre, échangeant des récits et partageant nos réflexions sur la vie."
 pamir.0066.a:0 "Très intéressant, mon ami !"
 pamir.0067.t:0 "Aider les autres"
 pamir.0067.desc:0 "Bien que je profite de la Fête de Chinir, tout le monde ne peut pas venir. Ceux qui sont trop vieux et faibles, ou qui sont malades, ne peuvent souvent pas être présents pour des raisons évidentes. Il est donc coutumier que certaines personnes se portent volontaires pour apporter de la nourriture aux personnes âgées et aux malades pendant la fête. Cela peut être une tâche ardue, cependant, et je crains que si j'aide, je puisse attraper la maladie de quelqu'un."
 pamir.0067.a:0 "Espérons que quelqu'un aidera - mais pas moi."
 pamir.0067.b:0 "Je me porte volontaire ! Je dois montrer l'exemple."
 pamir.0067.toast:0 "J'ai attrapé une maladie bénigne !"
 pamir.0068.t:0 "Conversations"
 pamir.0068.desc:0 "Venir ici, rencontrer toutes ces personnes de tous horizons pour le Chinir, c'est vraiment une expérience. J'apprends beaucoup des conversations que j'ai pendant la fête et de celles que j'entends."
 pamir.0068.a:0 "Intéressant, intéressant."
 pamir.0069.t:0 "Nigan et Baat"
 pamir.0069.desc:0 "Je savoure du #italic nigan#! et du #italic baat#! - une bouillie de farine et du beurre liquide. C'est un repas simple, mais essentiel aux célébrations du chinir."
 pamir.0069.a:0 "Son goût est peut-être simple, mais il est vraiment copieux et délicieux !"
 pamir.0069.b:0 "Je n'aime pas la nourriture paysanne, mais je dois sauver les apparences."
 pamir.0070.t:0 "Khundah"
 pamir.0070.desc:0 "Durant la saison des récoltes du Festival de Chinir, les femmes et les enfants cueillent des fruits dans des paniers, et ceux-ci seront utilisés à de nombreuses fins. Une partie des fruits, par exemple, est transformée en #italic khundah#!, une sauce de fruits collante utilisée dans une variété de plats. L'une des femmes du village me donne du khundah à goûter, et c'est délicieux."
 pamir.0070.a:0 "C'est si doux."
 pamir.0071.t:0 "Viande de chèvre"
 pamir.0071.desc:0 "La tradition veut que pendant le festival de Chinir, lorsqu'une personne aide quelqu'un d'autre que son foyer à récolter, elle offre de la viande de mouton ou de chèvre. L'agriculteur que j'aide à faire les récoltes m'offre de la viande de mouton ou de chèvre."
 pamir.0071.a:0 "Merci !"
 pamir.0072.t:0 "Leçons d'agriculture"
 pamir.0072.desc:0 "En aidant les agriculteurs à récolter les céréales pendant le festival de Chinir, j'ai beaucoup appris sur le travail agricole et les différents aspects de la vie du village."
 pamir.0072.a:0 "C'est très instructif."
 pamir.0073.t:0 "Ramassage des feuilles"
 pamir.0073.desc:0 "Pendant la saison des récoltes, il est de coutume que les gens commencent à ramasser les feuilles et à les mettre dans des sacs. Plus tard, pendant l'hiver, elles seront utilisées comme fourrage pour les animaux. Cela peut commencer dès le festival de Chinir, et je me demande si je devrais aider ceux qui ont été assignés à cette tâche dans le village. C'est une chose importante, après tout, donc je devrais peut-être contribuer."
 pamir.0073.a:0 "Bien sûr, pourquoi pas ? Ça a l'air amusant."
 pamir.0073.b:0 "Je ne fais pas le travail des paysans."
 pamir.0074.t:0 "Vergers"
 pamir.0074.desc:0 "Dans le cadre de la récolte, les femmes et les enfants se rendent dans les vergers et ramassent des paniers remplis de fruits. J'en observe quelques-uns pendant qu'ils le font. Les abricots et les mûres dodus semblent particulièrement populaires, et c'est une partie plus détendue de la récolte, où les femmes et les enfants prennent leur temps pour socialiser."
 pamir.0074.a:0 "Je vais observer et profiter du paysage."
 pamir.0074.b:0 "Il est temps de les aider !"
 pamir.0074.c:0 "Les aider, même si je suis un homme."
 pamir.0075.t:0 "Abricots"
 pamir.0075.desc:0 "Pendant la récolte, après que les femmes et les enfants ont commencé à récolter les fruits dans les vergers et les bosquets, il est acceptable que les gens commencent à grignoter les fruits qui sont en train d'être cueillis dans la limite du raisonnable. Je vois un panier plein d'abricots et suis tenté d'en manger."
 pamir.0075.a:0 "J'ai faim - il est temps de se régaler !"
 pamir.0075.b:0 "Je me retiendrai et n'en mangerai qu'un seul."
