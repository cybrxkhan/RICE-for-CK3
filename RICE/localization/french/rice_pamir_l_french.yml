 activity_RICE_pamir_chinir_festival_host_an_a:0 "un"
 activity_RICE_pamir_chinir_festival:0 "Festival de Chinir"
 activity_RICE_pamir_chinir_festival_desc:0 "Certains peuples iranophones des Pamirs célèbrent depuis longtemps une fête des récoltes appelée « festival de Chinir ». Après tout, nous devrions nous réjouir d'une récolte abondante."
 activity_RICE_pamir_chinir_festival_selection_tooltip:"#italic C'est la saison des récoltes !#!\n\n$RICE_pamir_attend_chinir_festival_context_tooltip$"
 activity_RICE_pamir_chinir_festival_host_desc: "\n$BULLET_WITH_TAB$Gain de [prestige_i|El][prestige|El]\n$BULLET_WITH_TAB$Gain de [piety_i|El][piety|El]\n$BULLET_WITH_TAB$Gain du [character_modifier|El] [GetModifier('RICE_pamir_recently_attended_chinir').GetNameWithTooltip]"
