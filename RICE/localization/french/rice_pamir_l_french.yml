 activity_RICE_pamir_chawmos_festival_desc:0 "Le solstice d'hiver est presque à nos portes ! C'est la célébration la plus importante de notre religion, avec des rituels qui réaffirment nos rôles dans nos communautés et rétablissent les domaines de la pureté et de l'impureté."
