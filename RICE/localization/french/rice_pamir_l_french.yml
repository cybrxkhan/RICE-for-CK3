 pamir.0200.t:0 "Genévrier"
 pamir.0200.desc:0 "Mon entourage et moi-même nous sommes perdus dans une forêt lors d'un voyage dans les montagnes du Pamir et de l'Hindu Kush, dans mon royaume. Cependant, le bon côté des choses, c'est que nous sommes tombés sur un grand nombre de genévriers, qui poussent dans de nombreux endroits de cette région. J'ai décidé d'en ramasser pour l'utiliser à des fins religieuses et médicinales."
 pamir.0200.a:0 "D'une certaine manière, c'est une bonne chose que nous nous soyons perdus."
 pamir.0201.t:0 "Chasseurs"
 pamir.0201.desc:0 "Il y a des parties du plateau du Pamir qui sont si accidentées qu'elles n'ont pas d'habitants humains et ne sont visitées que par des chasseurs des villages locaux voisins. Deux chasseurs se sont récemment disputés dans l'une de ces régions reculées et affirment que l'autre a volé leur gibier. Cela a été porté à mon attention, et ils espèrent que je pourrai rendre un jugement sur la question."
 pamir.0201.a:0 "Le chasseur du nord a des arguments plus convaincants."
 pamir.0201.b:0 "Le chasseur du sud a des arguments plus convaincants."
 pamir.0201.c:0 "Ce sont tous les deux des imposteurs qui m'ont piégé pour des raisons malhonnêtes !"
 pamir.0201.d:0 "Je n'ai pas le temps de m'occuper des problèmes de ces gens du peuple."
 pamir.0202.t:0 "Lapis Lazuli"
 pamir.0202.desc:0 "Ah, le lapis-lazuli, la précieuse pierre bleue, appréciée depuis l'Antiquité ! La majeure partie de la production mondiale provient du Badakhshan, sur le plateau du Pamir. C'est pourquoi les habitants de la région m'offrent souvent des cadeaux sous forme de lapis-lazuli brut, comme c'est le cas aujourd'hui."
 pamir.0202.a:0 "Le cadeau est très apprécié."
 pamir.0203.t:0 "Sar-i Sang"
 pamir.0203.desc:0 "Aujourd'hui, j'inspecte les mines de lapis-lazuli de Sar-i Sang, source de grande richesse pour la région. Certains mineurs ont récemment déclaré que les maîtres d'œuvre étaient impitoyables et qu'ils les surmenaient, causant même parfois des blessures inutiles aux travailleurs. N'ayant nulle part où s'adresser, ils font appel à moi. Les deux parties présentent leurs arguments, mais les deux parties sont convaincantes, hélas."
 pamir.0203.a:0 "Je dis que les maîtres d'œuvre sont dans l'erreur. Il ne faut pas surcharger les gens."
 pamir.0203.b:0 "Il est clair que les mineurs ont tort. Ils sont paresseux et veulent moins de travail !"
 pamir.0203.c:0 "Aider les deux parties à négocier un accord avant qu'un conflit ne survienne."
 pamir.0204.t:0 "Kuh-i Lal"
 pamir.0204.desc:0 "Aujourd'hui, j'inspecte les mines de rubis de Kuh-i Lal, source de richesse pour la région. Certains mineurs ont récemment déclaré que les maîtres d'œuvre étaient impitoyables et qu'ils les surmenaient, causant même parfois des blessures inutiles aux travailleurs. N'ayant nulle part où s'adresser, ils font appel à moi. Les deux parties présentent leurs arguments, mais les deux parties sont convaincantes, hélas."
 pamir.0204.a:0 "Je dis que les maîtres d'œuvre sont dans l'erreur. Il ne faut pas surcharger les gens."
 pamir.0204.b:0 "Il est clair que les mineurs ont tort. Ils sont paresseux et veulent moins de travail !"
 pamir.0204.c:0 "Aider les deux parties à négocier un accord avant qu'un conflit ne survienne."
 pamir.0205.t:0 "Contrebandiers de Lapis-Lazuli"
 pamir.0205.desc:0 "Dans les mines de lapis-lazuli de Sar-i Sang, plusieurs mineurs sont accusés de faire passer secrètement les précieuses pierres bleues pour les vendre au marché noir. C'est à moi de décider ce qu'il faut faire de ces criminels."
 pamir.0205.a:0 "Ils voulaient juste nourrir leur famille. Laissez-les partir."
 pamir.0205.b:0 "L'emprisonnement serait une punition juste pour ce crime."
 pamir.0205.c:0 "Exécutez-les en guise d'avertissement à tous ceux qui oseraient le faire."
 pamir.0206.t:0 "Contrebandiers de rubis"
 pamir.0206.desc:0 "Dans les mines de rubis de Kuh-i Lal, plusieurs mineurs sont accusés de faire passer secrètement les pierres précieuses pour les vendre au marché noir. C'est à moi de décider ce qu'il faut faire de ces criminels."
 pamir.0206.a:0 "Ils voulaient juste nourrir leur famille. Laissez-les partir."
 pamir.0206.b:0 "L'emprisonnement serait une punition juste pour ce crime."
 pamir.0206.c:0 "Exécutez-les en guise d'avertissement à tous ceux qui oseraient le faire."
 pamir.0207.t:0 "Sources chaudes du Pamir"
 pamir.0207.desc:0 "Le plateau du Pamir abrite de nombreuses sources chaudes, et j'ai décidé d'en visiter une des moins connues aujourd'hui, qui n'est pas très fréquentée, même par les habitants, principalement pour pouvoir être tranquille. C'était vraiment relaxant, et cela m'a aidé à me changer les idées, ne serait-ce que pour un petit moment."
 pamir.0207.a:0 "Je suis content d'avoir fait le déplacement."
 pamir.0208.t:0 "Un lac magnifique"
 pamir.0208.desc:0 "Bien que certains aient du mal à l'imaginer, on peut trouver des lacs pittoresques dans les montagnes vierges du Pamir et de l'Hindu Kush. J'en ai découvert un aujourd'hui, alors que je me rendais dans les territoires de mon royaume, sur ces hauts plateaux. Le lac est de la couleur la plus bleue, comme le lapis-lazuli ou le ciel, et il est entouré d'une flore magnifique."
 pamir.0208.a:0 "Telles sont les merveilles de la nature !"
 pamir.0209.t:0 "Pétroglyphes"
 pamir.0209.desc:0 "Les pétroglyphes sont fréquents dans les montagnes du Pamir et de l'Hindu Kush. Les gens ont traversé cette région pendant des siècles, il n'est donc pas surprenant que j'en aie croisé un au cours de mes voyages. Celui-ci semble représenter des chasseurs, des animaux et divers aspects de la nature comme le soleil et les arbres. Malgré sa simplicité, il a un charme intemporel."
 pamir.0209.a:0 "Un témoignage de ceux qui nous ont précédés."
 pamir.0210.t:0 "Indéchiffrable"
 pamir.0210.desc:0 "Les pétroglyphes sont fréquents dans les montagnes du Pamir et de l'Hindu Kush. Les gens ont traversé cette région pendant des siècles, il n'est donc pas surprenant que j'en aie croisé un au cours de mes voyages. Celui-ci semble être plus récent et représente des gens vaquant à leurs occupations. Il comprend également quelques inscriptions dans une langue que nous ne reconnaissons pas."
 pamir.0210.a:0 "Le texte est effacé, il est donc difficile à lire de toute façon."
 pamir.0211.t:0 "Wakhan"
 pamir.0211.desc:0 "Le corridor du Wakhan est l'un des endroits les plus reculés et pourtant les plus impressionnants de cette terre, à ce qu'il semble. En le traversant aujourd'hui pour me rendre dans l'une des colonies de mon royaume, j'ai vu au-dessus de moi un ciel d'un bleu très pâle. Devant moi, une étendue infinie de plaine verte et fauve. À mes côtés, deux rangées imposantes et anciennes de montagnes qui flanquaient la vallée."
 pamir.0211.a:0 "Nombreux sont ceux qui sont passés par ici au cours des siècles...."
 pamir.0212.t:0 "Nomades dans le Pamir"
 pamir.0212.desc:0 "Plusieurs clans de nomades se sont récemment installés dans l'une des vallées de [nomad_county.GetNameNoTier]. Ce n'est pas un événement rare, car les pâturages d'été de la région sont souvent des destinations attrayantes pour ces nomades. Parfois, les habitants sédentaires s'en accommodent et peuvent même se lier d'amitié avec les nomades. D'autres fois, un conflit éclate entre les deux groupes."
 pamir.0212.a:0 "J'espère que les choses se passeront bien cette fois-ci."
 pamir.0212.toast.good:0 "Les nomades s'installent pacifiquement !"
 pamir.0212.toast.bad:0 "Les nomades s'installent, provoquant des tensions !"
 pamir.0213.t:0 "Les nomades offrent leurs services ?"
 pamir.0213.desc:0 "Un clan de nomades s'est installé dans une partie du plateau du Pamir sous ma juridiction, plus précisément à [nomad_county.GetNameNoTier]. Il y a de nombreux pâturages d'été qui attirent généralement ce genre de nomades. Bien que cela se produise fréquemment, ce clan de nomades est expérimenté dans la guerre et m'a offert ses services en tant que guerriers sous mon commandement. C'est une offre attrayante, même si elle pourrait être remise en question par les habitants sceptiques."
 pamir.0213.a:0 "Ils peuvent me servir en tant qu'unité auxiliaire dans mes forces."
 pamir.0213.b:0 "Il vaut mieux que ce soit une milice locale qui puisse former mes troupes."
 pamir.0213.c:0 "Je n'ai besoin d'aucun service de leur part pour l'instant."
 RICE_pamir_nomad_spawn_event_troops:0 "Auxiliaires nomades du Pamir"
 pamir.0214.t:0 "Bols en corne"
 pamir.0214.desc:0 "La race de moutons originaire de la région du Pamir, connue localement sous des noms tels que #italic nakhjipar#! ou #italic ramapoy#!, est réputée pour ses grandes cornes. Les bergers ici fabriquent souvent de grands bols simples mais magnifiques à partir de ces cornes. Les habitants m'en ont donné quelques-uns aujourd'hui, qui devraient être bien utilisés pour tout festin que je pourrais organiser."
 pamir.0214.a:0 "Ce sont de très beaux bols."
 pamir.0215.t:0 "Grandes cornes"
 pamir.0215.desc:0 "Je voyage à travers une partie de mon domaine dans les montagnes du Pamir, et je me repose un moment à la résidence de l'un des bergers locaux. Il me parle avec enthousiasme de son troupeau de la race locale de moutons, appelée #italic nakhjipar#! ou #italic ramapoy#! dans les langues locales, connue pour ses grandes cornes. Celles-ci sont si grandes que l'enclos qu'il utilise pour contenir son troupeau est fabriqué à partir de ces cornes !"
 pamir.0215.a:0 "Des informations fascinantes."
 pamir.0216.t:0 "Querelles Burusho"
 pamir.0216.desc:0 "Les Burusho - un petit mais puissant groupe de peuples du plateau du Pamir - sont réputés pour leur prouesse au combat. Malheureusement, deux clans Burusho dans mes territoires - plus précisément à [burusho_county.GetNameNoTier] - commencent à s'engager dans une querelle. Cela entraînera probablement beaucoup de désordre et de conflits inutiles entre les habitants si cela se propage."
 pamir.0216.a:0 "N'y a-t-il rien à faire ? S'il vous plaît, dites-leur d'arrêter."
 pamir.0216.b:0 "J'utiliserai mes compétences diplomatiques pour résoudre le conflit."
 pamir.0216.c:0 "J'utiliserai la ruse et la tromperie pour résoudre le conflit."
 pamir.0216.d:0 "J'utiliserai des menaces militaires pour résoudre le conflit."
 pamir.0216.toast.bad:0 "Nos tentatives pour résoudre la querelle échouent"
 pamir.0216.toast.good:0 "Nos tentatives pour résoudre la querelle réussissent"
 pamir.0217.t:0 "Diram Fitti"
 pamir.0217.desc:0 "Je suis passé par une vallée reculée du Pamir à [burusho_county.GetNameNoTier] habitée par le peuple burusho. Là, j'ai rencontré un pauvre paysan sur le chemin de terre, qui ressemblait à un fermier ou un éleveur. Il s'est prosterné devant moi et m'a offert la moitié de son pain, connu sous le nom de #italic diram fitti#!, le pain de blé traditionnel au goût sucré des Burusho, mélangé à un peu de beurre. C'était tout ce qu'il avait à part les vêtements sur son dos."
 pamir.0217.a:0 "Merci ! Vous êtes sans aucun doute un homme bon."
 pamir.0217.b:0 "Je ne peux pas accepter cela - tu as plus besoin de cette nourriture que moi."
 pamir.0217.c:0 "Comment osez-vous m'offrir un « cadeau » aussi pathétique ! Partez !"
 pamir.0217.d:0 "Je dois refuser. Prenez plutôt cet or pour nourrir votre famille."
 pamir.0218.t:0 "Cuisine burusho"
 pamir.0218.desc:0 "Je rends visite à un chef local dans un village burusho à [burusho_county.GetNameNoTier]. Les Burusho vivent dans les vallées reculées de la région du Pamir depuis des générations et des siècles, et il est important que j'établisse de bonnes relations avec ceux qui vivent dans mon territoire. Le chef m'offre quelques délicatesses burusho comme #italic mamtu#! (raviolis épicés farcis de mouton), #italic harissa#! (blé et viande bouillie), et du yaourt nature simple."
 pamir.0218.a:0 "Merci. Laissez-nous d'abord profiter de cette bonne nourriture !"
 pamir.0218.b:0 "Je ne suis pas d'humeur à manger - parlons affaires."
 pamir.0219.t:0 "Porridge de Baht"
 pamir.0219.desc:0 "J'ai soudainement envie de porridge #italic baht#!, une délicatesse traditionnelle des Iraniens du Pamir malgré sa nature simple. Il est préparé avec #italic rush-kakht#!, un type rare de blé rouge qui ne pousse que dans certaines parties des montagnes du Pamir. Il a un goût sucré, de manière subtile mais riche, mais en raison de la rareté de ce type de blé, il ne sera pas bon marché pour mes cuisiniers de le préparer."
 pamir.0219.a:0 "En y repensant, laissez tomber."
 pamir.0219.b:0 "Oui, j'ai besoin d'assouvir mes envies."
 pamir.0220.t:0 "Cuisiner avec des mûres"
 pamir.0220.desc:0 "Les mûres sont très appréciées des Iraniens du Pamiri et il arrive que les familles les plus pauvres s'en nourrissent entièrement pendant des semaines. Je viens de recevoir une grosse cargaison pour moi, et mes cuisiniers me demandent à quoi nous devrions en utiliser la majeure partie, car les mûres ont de nombreuses vertus que les étrangers ne connaissent peut-être pas."
 pamir.0220.a:0 "Nous devrions les manger frais dès que possible !"
 pamir.0220.b:0 "Les confitures et les sirops de fruits me semblent les plus savoureux !"
 pamir.0220.c:0 "Préparer du #italic pikht#!, de la farine de mûres séchées, pour l'utiliser dans les pains."
 pamir.0221.t:0 "Une nouvelle maison"
 pamir.0221.desc:0 "Un noble pamiri local s'apprête à commencer la construction de sa nouvelle résidence. Comme le veut la coutume parmi les Iraniens du Pamir, il doit planter un mûrier sur la propriété avant que la construction ne puisse commencer. Je suis là pour assister à la cérémonie, étant l'un de ses invités distingués."
 pamir.0221.a:0 "J'espère que tout se passera bien."
 pamir.0222.t:0 "Shiroghan"
 pamir.0222.desc:0 "Je visite l'un des villages iraniens pamiri de mon royaume. Les habitants sont pauvres mais accueillants et hospitaliers. Ils m'offrent plusieurs plats humbles, tels que l'osh, des nouilles préparées à partir de divers grains et haricots, ainsi que le célèbre #italic shiroghan#!, un plat de lait et de beurre considéré comme sacré en raison de son association avec une fable de cette région sur l'importance de la générosité et de l'humilité."
 pamir.0222.a:0 "J'accepte leur nourriture avec joie."
 pamir.0222.b:0 "Pourquoi ne puis-je pas avoir une nourriture plus savoureuse ?"
 pamir.0223.t:0 "Ostons"
 pamir.0223.desc:0 "Dans les parties de mon royaume situées dans les montagnes du Pamir, il est courant de voir ce que l'on appelle des #italic ostons#! (comme on les nomme dans la langue locale), des arbres solitaires considérés comme spirituellement puissants, et qui sont décorés de bandes de tissu ou de belles pierres. J'en ai croisé un au cours de mes voyages - peut-être serait-il sage de laisser quelque chose près de cet oston afin de recevoir des bénédictions de [ROOT.Char.GetFaith.HighGodName] ?"
 pamir.0223.a:0 "Passer à autre chose sans rien laisser"
 pamir.0223.b:0 "Laisser une bande de tissu derrière soi"
 pamir.0223.c:0 "Laisser derrière soi quelques pierres communes"
 pamir.0223.d:0 "Laisser derrière soi quelques pierres précieuses"
 pamir.0224.t:0 "Qadamgoh"
 pamir.0224.desc:0 "Alors que nous voyageons dans les régions de mon royaume dominées par les Iraniens pamiris, notre guide local nous arrête lorsque nous tombons sur un #italic qadamgoh#!. Ce sont des lieux où des saints locaux ou des personnes saintes auraient séjourné il y a des générations, et ils sont généralement indiqués par un marquage spécial sur un bosquet d'arbres ou un rocher. Notre guide se précipite vers l'endroit où se trouve le marquage et récite quelques prières à [ROOT.Char.GetFaith.HighGodName]."
 pamir.0224.a:0 "Attendre impatiemment que le guide ait terminé"
 pamir.0224.b:0 "Rejoindre le guide pour réciter quelques prières"
 pamir.0225.t:0 "Une gravure rupestre bouddhiste"
 pamir.0225.desc:0 "On dit qu'il y a de très nombreuses générations, les rois des montagnes du Pamir et de l'Hindu Kush étaient parmi les bouddhistes les plus dévots du pays, et des traces de leur influence peuvent encore être observées à ce jour. Je me rendais dans l'un des villages locaux dans les parties de mon royaume situées dans les montagnes du Pamir et de l'Hindu Kush, quand je passe devant une ancienne sculpture rupestre représentant un Bouddha."
 pamir.0225.a:0 "Prier un peu et continuer mon chemin."
 pamir.0225.b:0 "L'ignorer et continuer mon chemin."
 pamir.0225.c:0 "Blasphèmes infidèles ! Bah !"
 pamir.0225.d:0 "C'est une œuvre d'art fascinante !"
 pamir.0226.t:0 "Le Pari"
 pamir.0226.desc:0 "Je suis dans l'un des plus grands villages burusho de mon royaume dans les montagnes du Pamir. Les Burusho sont un peuple éloigné et distinct, mais ceux de mon royaume s'efforcent d'établir une bonne relation avec moi. Par exemple, je rends actuellement visite à l'un de leurs chamans, ou à un #italic dayal#!. Une fois en transe, il communique avec un #italic Pari#! (comme on appelle les fées dans cette région), et le #italic Pari#! dit qu'il veut me donner un conseil important de [ROOT.Char.GetFaith.HighGodName]."
 pamir.0226.a:0 "Je refuse poliment l'offre. Cela semble blasphématoire !"
 pamir.0226.b:0 "Très bien ! Dites-moi ce que je dois savoir."
 pamir.0227.t:0 "Est-elle une Belas ?"
 pamir.0227.desc:0 "Une fille des villages de mon royaume est amenée devant moi. Les habitants l'accusent d'être une #italic Belas#!, qui, selon le folklore des Pamirs, est l'esprit vengeur d'une femme vivante qui attaque la nuit les hommes et les femmes qu'elle déteste. La jeune fille jure qu'elle est innocente et qu'elle est victime d'un complot de ses rivaux. Son fiancé a rompu leurs fiançailles, et elle est ostracisée par le village, qui exige qu'elle soit punie."
 pamir.0227.a:0 "Cette superstition ne me concerne pas !"
 pamir.0227.b:0 "Elle doit être innocente. Laissez-la partir, ne la dérangez pas."
 pamir.0227.c:0 "C'est vraiment une #italic Belas#!! Emprisonnez-la pour cela !"
 pamir.0227.d:0 "La pauvre fille est en danger. Elle peut rester avec moi."
 pamir.0228.t:0 "Descendant d'un Pari ?"
 pamir.0228.desc:0 "Lors de ma visite dans l'un des villages sous mon règne dans les montagnes du Pamir et de l'Hindu Kush, le chef du village me raconte une histoire sur la façon dont son lointain ancêtre aurait rencontré et tombé amoureux d'un #italic Pari#!, le nom local d'un esprit féerique. Elle lui a donné plusieurs fils avant de disparaître. \n\n“Je ne suis pas sûr que l'histoire soit vraie,” dit le gentleman en riant, “mais j'aime à le penser !”"
 pamir.0228.a:0 "Cela explique pourquoi vous et votre famille êtes si charmants !"
 pamir.0228.b:0 "Il est vrai qu'il s'agit probablement d'une fantaisie."
 pamir.0229.t:0 "L'héritage des Hephthalites"
 pamir.0229.desc:0 "J'entends les anciens de la région me raconter des histoires sur les grands et puissants Hephthalites. Les hordes d'Hephthalites ont autrefois élu domicile dans les montagnes du Pamir et de l'Hindu Kush, mais elles ont aujourd'hui disparu, un peuple dont le nombre a diminué et qui a été absorbé par les autres cultures qui l'entourent."
 pamir.0229.a:0 "C'étaient des guerriers redoutés qui n'avaient que peu d'égaux."
 pamir.0229.b:0 "Ils étaient aussi des commerçants et des explorateurs."
 pamir.0230.t:0 "Le Huk d'un village"
 pamir.0230.desc:0 "“Chaque terre a son #italic huk#!, [ROOT.Char.GetTitleAsNameNoTooltip],” explique le doyen du village en me tapotant le bras.\n\nJe suis dans un village quelque part dans les hautes terres des montagnes du Pamir et de l'Hindu Kush pour affaires officielles. En ce moment, je fais une pause et bavarde avec un ancien local.\n\nIl continue, “Cela signifie l'esprit de la terre dans notre langue. Le #italic Huk#! peut provenir de l'eau ou du sol. Tout le monde dans le village, homme et femme, jeune et vieux, partage son #italic huk#!. Les différences de #italic huk#! expliquent pourquoi les habitants de notre village sont doux, intelligents et polis, tandis que ceux du village en aval sont grossiers, brusques et en colère.”"
 pamir.0230.a:0 "Une observation sage sur le #italic huk#!, cher ancien."
 pamir.0230.b:0 "J'ai visité l'autre village et ils ne sont pas comme ça !"
 pamir.0230.c:0 "Cela ressemble à une stupide superstition paysanne."
 pamir.0231.t:0 "Une magnifique vallée"
 pamir.0231.desc:0 "Bien que les montagnes du Pamir et de l'Hindu Kush puissent être froides et désolées, elles recèlent également des beautés cachées. Alors que vous voyagez un jour dans votre territoire, vous tombez sur une vallée où l'herbe est d'une couleur très verte, pleine de prairies fleuries, et où il y a quelques lacs dont l'eau est presque aussi bleue que le ciel. Vous êtes émerveillé par la vision du paradis qui s'offre à vous, le genre de choses que l'on ne peut voir que sur le toit du monde."
 pamir.0231.a:0 "Incroyable."
