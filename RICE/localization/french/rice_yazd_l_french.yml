 # Misc
 dynn_kharijite_bam:0 "Bami"
 dynn_sebuk_eri:0 "Sebükerid"
 dynn_abd_al_rahman_kharijite:0 "Karukhi"
 dynn_akhdarid_kharijite:0 "Akhdarid"
 dynn_uzayr_bin_al_sari:0 "al-Sari"
 Akhdar:0 "Akhdar"
 Uzayr:0 "'Uzayr"
 RICE_sebuk_eri:0 "Sebük-Eri"
 innovation_RICE_qanats:0 "Qanats"
 innovation_RICE_qanats_desc:0 "Dans une grande partie du Moyen-Orient et de l'Afrique du Nord, il existe des réseaux spéciaux de canaux et d'aqueducs souterrains conçus pour acheminer l'eau là où elle est le plus nécessaire. Connus sous le nom de qanats, foggaras, karizes, etc., ces ouvrages d'art existent depuis l'époque des anciens Perses."
 RICE_yazd_qanat_decision_unlock:0 "Peut prendre la décision [decision|El] de #V $RICE_yazd_build_a_new_qanat$#!"
 RICE_yazd_jays_al_sorat_spawn_event_troops:0 "Jayš al-Šorāt"
 RICE_qanat_region:0 "régions qui utilisent la technologie Qanat"
 RICE_every_persian_turkic_county:0 "Tout [county|El] que vous [completely_control|El] en [GetGeographicalRegion('world_middle_east_persia').GetName] qui a une [culture|El] de [heritage|El] $heritage_turkic_name$"
 RICE_dynn_ibn_rusta:0 "Ibn Rusta"
 RICE_dynn_yaqubi:0 "Yaqubi"
 innovation_RICE_yakhchals:0 "Yakhchals"
 innovation_RICE_yakhchals_desc:0 "Depuis l'Antiquité, les peuples du plateau iranien, en particulier ceux vivant dans les climats les plus arides, utilisent des glacières appelées [Glossary( 'Yakhchals', 'YAKHCHAL_GLOSS' )]. Elles sont ingénieusement conçues pour conserver la glace durant de longues périodes afin de préserver la nourriture, ou pour la préparation de mets rafraîchis comme le sorbet ou le vin frappé."
 RICE_yakhchals_decision_unlock:0 "Débloque la [decision|El] #V $RICE_yazd_purchase_yakhchal_ice$#! pour les [rulers|El] ayant une [capital|El] ou un [domicile|El] de cette [culture|El]"
 Auharmazd_dad:0 "Auharmazd-dad"
 Mardan_Farrukh:0 "Mardan-Farrukh"
 dynn_RICE_auharmazd_dad:0 "Auharmazd-dadid"
 
 # Game Concepts

 # Aspirations 
 RICE_yazd_aspiration_qawurd_desc:"\n\n#bold [historical_aspiration_main_objectives|E]#!\n$EFFECT_LIST_BULLET$Être le [ruler|El] de l'empire [GetTitleByKey('e_persia').GetNameNoTier]\n$EFFECT_LIST_BULLET$[completely_control|E] [GetTitleByKey('k_persia').GetNameNoTier] et [GetTitleByKey('k_mesopotamia').GetNameNoTier]\n$EFFECT_LIST_BULLET$Rester d'une [culture|El] d'[heritage|El] $heritage_turkic_name$\n\n#bold Récompenses#!\n$EFFECT_LIST_BULLET$Gain de @prestige_icon! #V [EmptyScope.ScriptValue('RICE_aspiration_medium_resource_bonus')]#! de [prestige|El]\n$EFFECT_LIST_BULLET$Vous recevez #V 500#! [special_troops|El] [GetMaA('horse_archers').GetName]\n$EFFECT_LIST_BULLET$Chaque [county|El] que vous dirigez en [GetGeographicalRegion('world_middle_east_persia').GetName] qui est d'une [culture|El] de [heritage|El] $heritage_turkic_name$ gagne @control_icon! #V [EmptyScope.ScriptValue('RICE_yazd_qawurd_aspiration_control_bonus')]#! de [control|El]\n\n#bold [historical_aspiration_bonus_objectives|E]#!\n$EFFECT_LIST_BULLET$Veillez à ce qu'Alp Arslan et son héritier principal Malik Shah soient morts (Récompense : @prestige_icon! #V [EmptyScope.ScriptValue('RICE_aspiration_medium_resource_bonus')]#! pour chacun, @prestige_icon! #V [EmptyScope.ScriptValue('RICE_aspiration_large_resource_bonus')]#! à la place si vous tuez directement l'un ou les deux vous-même)"
 RICE_yazd_historical_aspiration_action_qawurd:"#italic C'est une honte que vous ne régniez pas sur l'Empire seldjoukide, alors que vous êtes le prince le plus âgé de votre famille. Vous souhaitez ramener les Seldjoukides aux anciennes traditions et obtenir le trône qui vous revient de droit.#!$RICE_yazd_aspiration_qawurd_desc$"
 RICE_yazd_historical_aspiration_modifier_desc_qawurd: "[GetModifier('RICE_yazd_aspiration_claim_seljuk_throne').GetNameWithTooltip]"

 # Memories
 RICE_yazd_sadeh_festival_host_memory:0 "A célébré le [GetActivityType( 'activity_RICE_yazd_sadeh_festival' ).GetName]"
 RICE_yazd_sadeh_festival_host_memory_first_perspective:0 "J'ai célébré le [GetActivityType( 'activity_RICE_yazd_sadeh_festival' ).GetName]"
 RICE_yazd_sadeh_festival_host_memory_second_perspective:0 "Vous avez célébré le [GetActivityType( 'activity_RICE_yazd_sadeh_festival' ).GetName]"
 RICE_yazd_sadeh_festival_host_memory_third_perspective:0 "[owner.GetName] a célébré le [GetActivityType( 'activity_RICE_yazd_sadeh_festival' ).GetName]"
 RICE_yazd_sadeh_festival_guest_memory:0 "A célébré le [GetActivityType( 'activity_RICE_yazd_sadeh_festival' ).GetName] avec [host.GetTitledFirstName]"
 RICE_yazd_sadeh_festival_guest_memory_first_perspective:0 "J'ai célébré le [GetActivityType( 'activity_RICE_yazd_sadeh_festival' ).GetName] avec [host.GetTitledFirstName]"
 RICE_yazd_sadeh_festival_guest_memory_second_perspective:0 "Vous avez célébré le [GetActivityType( 'activity_RICE_yazd_sadeh_festival' ).GetName] avec [host.GetTitledFirstName]"
 RICE_yazd_sadeh_festival_guest_memory_third_perspective:0 "[owner.GetName] a célébré le [GetActivityType( 'activity_RICE_yazd_sadeh_festival' ).GetName] avec [host.GetTitledFirstName]"
 
 # Activities
 activity_RICE_yazd_sadeh_festival_host_an_a:0 "un"
 activity_yazd_sadeh_festival:0 "Festival de Sadeh"
 activity_yazd_sadeh_festival_name:0 "[ACTIVITY.GetOwner.GetNamePossessiveOrMy|U] festival de Sadeh"
 activity_yazd_sadeh_festival_chak_chak:0 "Festival de Sadeh à Chak-Chak"
 activity_yazd_sadeh_festival_chak_chak_name:0 "[ACTIVITY.GetOwner.GetNamePossessiveOrMy|U] festival de Sadeh à Chak-Chak"
 activity_RICE_yazd_sadeh_festival:0 "Festival de Sadeh"
 activity_RICE_yazd_sadeh_festival_desc:0 "Lorsque le froid de l'hiver s'abat sur le pays, c'est le moment de la fête de Sadeh, la célébration hivernale traditionnelle du monde iranien."
 activity_RICE_yazd_sadeh_festival_selection_tooltip:"Organisez une grande célébration de Sadeh dans votre [capital|El].\n\n$RICE_yazd_celebrate_sadeh_festival_context_tooltip$"
 activity_RICE_yazd_sadeh_festival_host_desc: "\n$BULLET_WITH_TAB$Gain de [prestige_i] [prestige|El]\n$BULLET_WITH_TAB$Gain de [piety_i] [piety|El]\n$BULLET_WITH_TAB$Perte de [stress_loss_i|El] [stress|El]\n$BULLET_WITH_TAB$Gain du [character_modifier|El] [GetModifier('RICE_yazd_recently_celebrated_sadeh').GetNameWithTooltip]"
 activity_RICE_yazd_sadeh_festival_guest_desc: "$activity_RICE_yazd_sadeh_festival_host_desc$"
 activity_RICE_yazd_sadeh_festival_province_desc: ""
 activity_RICE_yazd_sadeh_festival_destination_selection: "$activity_RICE_yazd_sadeh_festival_province_desc$"
 activity_RICE_yazd_sadeh_festival_guest_help_text: "$activity_RICE_yazd_sadeh_festival$"
 activity_RICE_yazd_sadeh_festival_predicted_cost: "Le coût de l'organisation du festival de Sadeh dépend des [activity_options|El] que vous sélectionnez."
 activity_RICE_yazd_sadeh_festival_conclusion_desc: "Le [GetActivityType( 'activity_RICE_yazd_sadeh_festival' ).GetName] est terminé. Ce fut une expérience amusante et relaxante !"
 RICE_yazd_sadeh_festival_type: "Type de festival"
 RICE_yazd_sadeh_festival_type_modest: "Célébration modeste"
 RICE_yazd_sadeh_festival_type_modest_desc:"$EFFECT_LIST_BULLET$ Votre [court|El] accueillera un Festival de Sadeh modeste et ordinaire.\n$EFFECT_LIST_BULLET$Gain d'un bonus supplémentaire de [prestige_i|El] #V 50#! en plus des autres avantages obtenus via d'autres événements\n\n#weak Sadeh est une période importante et festive de l'année, mais nous devrions faire attention à ne pas exagérer et rester frugaux lors de sa célébration.#!"
 RICE_yazd_sadeh_festival_type_grand: "Grande célébration"
 RICE_yazd_sadeh_festival_type_grand_desc:"$EFFECT_LIST_BULLET$ Votre [court|El] dépensera davantage de ressources pour le festival de Sadeh de cette année.\n$EFFECT_LIST_BULLET$Gain de [prestige_i|El] #V 150#! supplémentaire en plus des autres avantages obtenus par d'autres événements\n\n#weak Sadeh est la période la plus froide de l'année. Pour chasser le mal et les ténèbres, cette occasion se doit d'être véritablement festive !#!"
 RICE_yazd_sadeh_festival_type_chak_chak: "Célébrer à Chak-Chak"
 RICE_yazd_sadeh_festival_type_chak_chak_desc:"$EFFECT_LIST_BULLET$ Votre [court|El] accueillera le festival de Sadeh sur le site de Chak-Chak à [GetTitleByKey('c_yazd').GetName].\n$EFFECT_LIST_BULLET$Gain de [piety_i|El] #V 150#! supplémentaires en plus des autres bonus\n$EFFECT_LIST_BULLET$Gain du [modifier|El] [GetModifier('RICE_yazd_recently_celebrated_sadeh_chak_chak').GetNameWithTooltip] au lieu du [modifier|El] habituel\n$EFFECT_LIST_BULLET$ $yazd.0030.chak_chak.tooltip$\n\n#weak Des cérémonies [GetPlayer.GetFaith.GetReligion.GetAdjectiveNoTooltip]s spéciales sont célébrées à Chak-Chak durant Sadeh. Nous devrions y participer si nous le pouvons afin de prouver notre dévotion en tant que [GetPlayer.GetFaith.GetAdherentName].#!"
 RICE_yazd_sadeh_festival_festival_phase: "Festival"
 RICE_yazd_sadeh_festival_festival_phase_desc:"Le festival de Sadeh est en cours !"
 RICE_yazd_sadeh_festival_fun_intent_header: "Célébration :"
 RICE_yazd_sadeh_festival_fun_intent: "Célébration"
 RICE_yazd_sadeh_festival_fun_intent_desc: "Vous voulez passer un bon moment lors de Sadeh. Vous êtes garanti de perdre [stress|El], et d'en perdre encore plus si vous êtes [GetTrait('gregarious').GetName( GetNullCharacter )] ou [GetTrait('gluttonous').GetName( GetNullCharacter )]."
 RICE_yazd_sadeh_festival_spectacle_intent_header: "Spectacle :"
 RICE_yazd_sadeh_festival_spectacle_intent: "Spectacle"
 RICE_yazd_sadeh_festival_spectacle_intent_desc:"Vous voulez montrer la majesté et la puissance de votre cour à travers le Sadeh. Les personnages [GetTrait('ambitious').GetName( GetNullCharacter )|U], [GetTrait('diligent').GetName( GetNullCharacter )] ou [GetTrait('arrogant').GetName( GetNullCharacter )] peuvent perdre davantage de [stress|El]. Les personnages de [rank|El] [king|El] et [emperor|El] gagneront également une petite quantité de [grandeur|El]."
 RICE_yazd_sadeh_festival_poetry_intent_header: "Poésie :"
 RICE_yazd_sadeh_festival_poetry_intent: "Poésie"
 RICE_yazd_sadeh_festival_poetry_intent_desc:"Vous voulez être inspiré par la poésie ou en écrire pendant Sadeh. Vous obtiendrez à coup sûr un événement sur la poésie permettant de gagner un [modifier|El] bénéfique. Vous gagnerez également du [prestige|El] et de la [piety|El] grâce à cet événement (ce qui ne serait normalement pas le cas)."
 RICE_yazd_sadeh_festival_zoroastrian_intent_header: "Humata, Hukhta, Huvarshta:"
 RICE_yazd_sadeh_festival_zoroastrian_intent: "Humata, Hukhta, Huvarshta"
 RICE_yazd_sadeh_festival_zoroastrian_intent_desc:"Vous voulez vous concentrer sur les bonnes pensées, les bonnes paroles et les bonnes actions (#italic humata, hukhta, huvarshta#!) durant cette période importante de l'année. Les personnages [GetTrait('zealous').GetName( GetNullCharacter )|U], [GetTrait('just').GetName( GetNullCharacter )] ou [GetTrait('honest').GetName( GetNullCharacter )] peuvent perdre du [stress|El] supplémentaire. Vous gagnerez également [piety_i|El] #V 25#! en plus de toute [piety|El] que vous gagnez."
 RICE_yazd_sadeh_festival_completed_log_title:0 "A fini de participer au festival Sadeh"
 RICE_yazd_sadeh_festival_completed_log:0 "[CHARACTER.GetShortUIName|U] a terminé de participer au festival Sadeh"
 TRAVEL_NAME_FOR_activity_RICE_yazd_sadeh_festival:0 "[Character.GetFirstNamePossessiveNoTooltip] $activity_RICE_yazd_sadeh_festival$"
 RICE_yazd_sadeh_festival_grand_cost_amount:0 "Grand festival de Sadeh"
 RICE_yazd_sadeh_festival_chak_chak_cost_amount:0 "Festival de Sadeh à Chak-Chak"
 RICE_yazd_sadeh_festival_poetry_intent_req:0 "Vous devez avoir les [traits|El] [GetTrait('lifestyle_poet').GetName( GetNullCharacter )] ou [GetTrait('scholar').GetName( GetNullCharacter )], ou au moins #bold [EmptyScope.ScriptValue('medium_skill_rating')|0]#! en [diplomacy|El] ou [learning|El]"
 NOT_RICE_yazd_sadeh_festival_poetry_intent_req:0 "$RICE_yazd_sadeh_festival_poetry_intent_req$"

 # \n$BULLET_WITH_TAB$Option to celebrate at Chak-Chak for extra bonuses if the host owns [GetTitleByKey('c_yazd').GetName]
 
 # Buildings
 building_type_RICE_yazd_arg_e_bam_01:0 "Arg-e Bam"
 building_type_RICE_yazd_arg_e_bam_01_desc:0 "La citadelle de Bam est la plus grande demeure du monde et une forteresse imposante et imprenable qui existe depuis des siècles. Elle était la capitale de Haftvad de Kerman, l'ennemi légendaire d'Ardashir, le fondateur de la dynastie sassanide. La forteresse se compose de trois couches de murs et est entourée d'un grand fossé ; l'intérieur est une ville en soi, avec des magasins, des lieux de culte et des maisons."
 building_RICE_yazd_arg_e_bam_01:0 "$building_type_RICE_yazd_arg_e_bam_01$"
 building_RICE_yazd_arg_e_bam_01_desc:0 "$building_type_RICE_yazd_arg_e_bam_01_desc$"
 
 # Modifiers
 RICE_yazd_saffarid_yaqub:0 "Le Cuivrier"
 RICE_yazd_saffarid_yaqub_desc:0 "Ya'qub ibn al-Layth fut jadis chaudronnier avant de devenir un chef de guerre menant l'une des nombreuses bandes combattant les Kharijites en Iran. Ainsi, bien que des seigneurs de guerre et des princes d'origines plus élitistes puissent se moquer de ses humbles origines, il sait comment se rapprocher des gens ordinaires, et l'on dit qu'il vit encore assez frugalement et modestement.\n\nPeut prendre la [decision|El] pour enrôler des unités #EMP Jayš al-Šorāt#! peu importe où se trouve la capitale et même s'il n'y a pas de [counties|El] Azariqa dans son [domain|El]"
 RICE_yazd_saffarid_amr:0 "Le muletier et le tailleur de pierre"
 RICE_yazd_saffarid_amr_desc:0 "À l'instar de ses frères, Amr ibn al-Layth avait des origines modestes avant leur ascension au pouvoir, et est également connu pour son mode de vie frugal et modeste. On disait qu'il était muletier ou tailleur de pierre, selon les sources.\n\nPeut prendre la [decision|El] d'enrôler des unités #EMP Jayš al-Šorāt#! peu importe où se trouve la capitale et même s'il n'y a aucun [counties|El] Azariqa dans son [domain|El]"
 RICE_yazd_saffarid_ali:0 "Le modeste guerrier"
 RICE_yazd_saffarid_ali_desc:0 "Bien que moins renommé que son frère Ya'qub, Ali est largement respecté par de nombreux guerriers. Comme ses frères Ya'qub et Amr, il était lui aussi d'origine modeste avant leur ascension au pouvoir, et il mène également un mode de vie frugal et sobre.\n\nPeut prendre la [decision|El] d'enrôler des unités #EMP Jayš al-Šorāt#! peu importe où se trouve la capitale et même s'il n'y a aucun [counties|El] Azariqa dans son [domain|El]"
 RICE_yazd_saffarid_yaqub_reduce_fertility:0 "Ayyār des motivations incertaines"
 RICE_yazd_saffarid_yaqub_reduce_fertility_desc:0 "Certains disent que Ya'qub ibn al-Layth est un vrai croyant de la foi musulmane, qui la défendra coûte que coûte contre les hérétiques et les infidèles. D'autres disent qu'il est un chef de guerre opportuniste et cupide, comme beaucoup d'autres. D'autres encore disent qu'il est un kharijite secret ou un idolâtre, qui n'est inspiré que par l'hostilité envers les califes. Qui sait où se situe sa véritable loyauté ?"
 RICE_yazd_patrons_of_avicenna:0 "Les mécènes d'Avicenne"
 RICE_yazd_patrons_of_avicenna_desc:0 "Le grand émir kakuyide, Ala al-Dawla Muhammad, fut le dernier mécène d'Avicenne, un érudit islamique au génie et à l'influence sans égal, ce que même ses détracteurs reconnaissent. Avicenne fut traité avec grand respect et servit comme courtisan kakuyide jusqu'à sa mort en 1037 apr. J.-C. Les Kakuyides perpétuent cette tradition, cultivant la culture dans les territoires qu'ils gouvernent et parrainant érudits et artistes.\n\nPrendre la [decision|El] de #V Développer les commodités et infrastructures de Yazd#! accorde du [prestige|El] et du [dynasty_prestige|El] supplémentaires"
 RICE_yazd_sebuk_eri:0 "Esclave-soldat du Zabulistan"
 RICE_yazd_sebuk_eri_desc:0 "Sebük-Eri a été capturé comme esclave lors d'une des expéditions du seigneur de guerre saffaride Ya'qub ibn Layth dans le royaume de Zunbil. Depuis, il a prouvé qu'il était un commandant militaire compétent. Mais ses ambitions le conduiront peut-être à rechercher une plus grande gloire et un plus grand pouvoir..."
 RICE_yazd_abode_of_worship_ruler:0 "Régisseur de la maison d'adoration"
 RICE_yazd_abode_of_worship_ruler_desc:0 "Yazd est communément connue sous le nom de #italic dār al-'ibāda#!, ou la Demeure du Culte. Elle est réputée pour attirer de nombreux érudits, ainsi que pour la dévotion religieuse de ses habitants - qu'ils soient musulmans, zoroastriens ou d'une autre foi. En tant que dirigeant de Yazd, ce personnage bénéficie donc grandement de sa culture de foi et de savoir.\n\n#EMP Ce [character_modifier|El] est accordé à quiconque dirige actuellement Yazd#!"
 RICE_yazd_city_of_windcatchers:0 "Cité des tours à vent"
 RICE_yazd_city_of_windcatchers_desc:0 "En raison de la situation de Yazd en bordure du désert du #italic Dasht-e Kavir#!, les tours à vent - de hautes tours qui captent et canalisent l'air pour fournir une ventilation et un rafraîchissement naturels - sont omniprésentes dans la ville, ce qui lui a valu son surnom de « Cité des tours à vent ». La ville est également célèbre pour son vaste réseau de qanats, et ses bâtisseurs de qanats sont réputés parmi les plus habiles de tout l'Iran. Dans l'ensemble, les infrastructures de Yazd - incluant ses tours à vent, ses qanats, ses citernes ab anbar, ses glacières yakhchal, et bien d'autres - la rendent non seulement habitable, mais aussi confortable.\n\nLes coûts de construction d'un qanat pour le [ruler|El] de Yazd sont réduits lorsqu'il prend la [decision|El] de #V Financer la Construction d'un Qanat#!"
 RICE_funded_qanat_small:0 "Financement de la construction d'un petit Qanat"
 RICE_funded_qanat_small_desc:0 "Ce personnage a récemment donné des fonds pour que les habitants puissent construire un qanat, un canal souterrain omniprésent au Moyen-Orient et en Afrique du Nord."
 RICE_qanat_constructed_small:0 "Petit qanat récemment construit"
 RICE_qanat_constructed_small_desc:0 "Une élite locale a généreusement financé la construction d'un nouveau canal qanat dans cette région. Bien qu'elle soit de taille modeste, elle devrait bien répondre aux besoins de la communauté dans laquelle elle a été construite."
 RICE_funded_qanat_medium:0 "Financement de la construction d'un qanat moyen"
 RICE_funded_qanat_medium_desc:0 "$RICE_funded_qanat_small_desc$"
 RICE_qanat_constructed_medium:0 "Qanat moyen récemment construit"
 RICE_qanat_constructed_medium_desc:0 "Une élite locale a généreusement financé la construction d'un nouveau canal qanat dans cette région. Il est de taille convenable et fournira sans aucun doute de l'eau douce à la communauté dans laquelle il a été construit pendant des années."
 RICE_funded_qanat_large:0 "Financement de la construction d'un grand qanat"
 RICE_funded_qanat_large_desc:0 "$RICE_funded_qanat_small_desc$"
 RICE_qanat_constructed_large:0 "Grand qanat récemment construit"
 RICE_qanat_constructed_large_desc:0 "Une élite locale a généreusement parrainé la construction d'un nouveau canal qanat dans cette région. Ce qanat est assez grand et garantira un approvisionnement en eau fiable et de qualité à la communauté qui l'a construit pendant une longue période."
 RICE_funded_qanat_grand:0 "Financement de la construction d'un grand qanat"
 RICE_funded_qanat_grand_desc:0 "$RICE_funded_qanat_small_desc$"
 RICE_qanat_constructed_grand:0 "Immense qanat récemment construit"
 RICE_qanat_constructed_grand_desc:0 "Une élite locale a généreusement financé la construction d'un nouveau canal de qanat dans cette région. Peu de qanats peuvent atteindre la taille de celui-ci, et il ne fait aucun doute que la communauté locale est très satisfaite de ce projet de travaux publics."
 RICE_yazd_recently_celebrated_sadeh:0 "Sadeh récemment célébré"
 RICE_yazd_recently_celebrated_sadeh_chak_chak:0 "Chak Chak récemment visité pendant Sadeh"
 RICE_yazd_kakuyid_reconciled:0 "Réconciliés après des conflits antérieurs"
 RICE_yazd_shrine_of_the_twelve_imams_recently_constructed:0 "Davāzdah Imām récemment construit"
 RICE_yazd_shrine_of_the_twelve_imams_recently_constructed_desc:0 "Le Davāzdah Imām, ou sanctuaire des douze imams, est un mausolée situé à Yazd qui, en plus d'utiliser un certain nombre d'innovations architecturales iraniennes récentes, est d'une grande beauté et suscite l'admiration."
 RICE_yazd_constructed_shrine_of_the_twelve_imams:0 "Ordonne la construction du Davāzdah Imām"
 RICE_yazd_constructed_shrine_of_the_twelve_imams_desc:0 "$RICE_yazd_shrine_of_the_twelve_imams_recently_constructed_desc$"
 RICE_yazd_kerman_pistachios:0 "Fermes de pistaches de Kerman"
 RICE_yazd_kerman_pistachios_desc:0 "Les célèbres pistaches de Kerman, cultivées dans les terres agricoles proches de la ville, constituent l'une de ses principales exportations."
 RICE_yazd_qawurd_seljuk:0 "Le prince seldjoukide aîné"
 RICE_yazd_qawurd_seljuk_desc:0 "Fils aîné de Chagri Beg et frère aîné d'Alp Arslan, l'ambitieux Qawurd jouit d'un grand respect parmi les Seldjoukides. Considéré comme un chef juste et puissant, il a étendu la domination seldjoukide au-delà de la mer d'Arabie, jusqu'à Oman. Selon certaines rumeurs, il considère le trône seldjoukide comme son droit d'aînesse, car il est assez populaire parmi les commandants seldjoukides qui croient en l'idéal turc traditionnel de succession par ancienneté.\n\nCommence par une [unpressed_claim|El] sur l'Empire perse\nA une [opinion|El] moins bonne d'Alp Arslan et vice versa"
 RICE_yazd_alp_arslan_distrust_qawurd:0 "Méfiance à l'égard de l'ambitieux prince seldjoukide aîné"
 RICE_yazd_qawurd_resent_alp_arslan:0 "Ressentiment à l'égard de l'héritage seldjoukide"
 RICE_yazd_treasure_reports:0 "Des rapports sur les trésors légendaires de Yazd"
 RICE_yazd_qanat_makers_contracts:0 "Davantage de contrats pour les fabricants de qanats"
 RICE_yazd_qanat_makers_contracts_desc:0 "Les fabricants de qanats de Yazd ont toujours été considérés comme faisant partie des meilleurs d'Iran et, ces derniers temps, ils ont été sollicités pour effectuer encore plus de travaux que d'habitude dans toute la région."
 RICE_yazd_new_yazd_mosque:0 "Nouvelle maison d'adoration à Yazd"
 RICE_yazd_built_new_yazd_mosque:0 "Parrainage d'un nouveau lieu de culte à Yazd"
 RICE_yazd_new_yazd_mosque_muslim_opinion:0 "Construction d'un nouveau lieu de culte à Yazd"
 RICE_yazd_new_yazd_mosque_zoroastrian_opinion:0 "Temple zoroastrien remplacé à Yazd"
 RICE_yazd_built_house_of_worship:0 "Construction d'une maison de culte à Yazd"
 RICE_yazd_built_house_of_worship_desc:0 "Ce personnage a récemment financé la construction d'un nouveau petit lieu de culte à Yazd. Il répondra aux besoins spirituels des habitants de la ville, réputés pour leur piété."
 RICE_yazd_built_school:0 "Construction d'une école d'apprentissage à Yazd"
 RICE_yazd_built_school_desc:0 "Ce personnage a récemment financé la construction d'une nouvelle petite école à Yazd. Cette école formera la prochaine génération d'érudits qui font la renommée de la ville."
 RICE_yazd_built_shrine:0 "Mausolée construit à Yazd"
 RICE_yazd_built_shrine_desc:0 "Ce personnage a récemment fourni des fonds pour parrainer la construction d'un nouveau petit mausolée en l'honneur d'un saint personnage à Yazd. La vie et les actes de ce grand personnage inspireront les habitants de la ville pendant des années."
 RICE_yazd_silk_boom:0 "Demande accrue de soie de Yazdi"
 RICE_yazd_baklava:0 "Manger un Baklava de Yazd"
 RICE_yazd_sadeh_nature_poem:0 "Inspiré par le poème de Sadeh sur la nature"
 RICE_yazd_sadeh_good_evil_poem:0 "Inspiré du poème de Sadeh sur le bien contre le mal"
 RICE_yazd_sadeh_hero_poem:0 "Inspiré du poème de Sadeh sur les héros antiques"
 RICE_yazd_sadeh_burned_animals:0 "Mettre le feu à des animaux pendant Sadeh"
 RICE_yazd_sadeh_burned_animals_desc:0 "« La cruauté envers les animaux est très amusante ! »"
 RICE_yazd_sadeh_animal_cruelty_approve:0 "Mettre le feu à des animaux, c'est amusant"
 RICE_yazd_sadeh_animal_cruelty_disapprove:0 "Mettre le feu à des animaux est une pratique cruelle"
 RICE_yazd_aspiration_claim_seljuk_throne:"[RICE_aspiration|E] : Revendiquer le trône seldjoukide"
 RICE_yazd_aspiration_claim_seljuk_throne_desc:"#italic Il est indigne que Qawurd ne règne pas sur l'Empire seldjoukide, alors qu'il est le prince le plus âgé de sa famille. Il souhaite ramener les Seldjoukides aux anciennes traditions et obtenir le trône qui lui revient de droit.#!$RICE_yazd_aspiration_qawurd_desc$\n\n"
 RICE_yazd_yakhchal_adventurer_modifier:"Glace d'un Yakhchal"
 RICE_yazd_yakhchal_adventurer_modifier_desc:"Ce personnage a récemment acheté de la glace dans un [Glossary( 'Yakhchal', 'YAKHCHAL_GLOSS' )]."
 RICE_yazd_yakhchal_landed_modifier: "$RICE_yazd_yakhchal_adventurer_modifier$"
 RICE_yazd_yakhchal_landed_modifier_desc: "$RICE_yazd_yakhchal_adventurer_modifier_desc$"

 # Decisions
 RICE_yazd_change_xwedodah:0 "Résoudre la question du Xwedodah"
 RICE_yazd_change_xwedodah_zurvanite:0 "$RICE_yazd_change_xwedodah$"
 RICE_yazd_change_xwedodah_tooltip:0 "Se réunir avec d'autres pour résoudre les débats autour de cette pratique pour la [faith|El] [ROOT.Char.GetFaith.GetAdjective]"
 RICE_yazd_change_xwedodah_zurvanite_tooltip:0 "$RICE_yazd_change_xwedodah_tooltip$"
 RICE_yazd_change_xwedodah_desc:0 "#V Le Xwedodah#! est l'un des plus grands actes qu'un [ROOT.Char.GetFaith.GetAdherentName] puisse accomplir. Bien que cela soit notre croyance indiscutable depuis des siècles, des débats ont eu lieu sur sa signification. Fait-il vraiment référence au mariage entre proches parents ? Certains affirment qu'il devrait plutôt être défini comme le mariage entre cousins. Afin de résoudre ces débats une fois pour toutes, je souhaite réunir des érudits et des [ROOT.Char.Custom('DefaultPriestTitlePlural')]."
 RICE_yazd_change_xwedodah_effect_tooltip_1:0 "#V Réinterpréter#! [xwedodah_resolver.GetFaith.ReligiousText] pour changer la [doctrine|El] #bold $doctrine_consanguinity_name$#! de [xwedodah_resolver.GetFaith.GetName] afin de n'autoriser que le mariage entre cousins, ou #V renforcer#! la vision traditionnelle selon laquelle elle concerne le mariage entre proches parents - l'un ou l'autre choix sera #V permanent !#!"
 RICE_yazd_change_xwedodah_effect_tooltip_2:0 "Si cette [decision|El] n'est pas prise par un dirigeant [xwedodah_resolver.GetFaith.GetAdherentName] suffisamment puissant avant le XIVe ou XVe siècle, alors un changement #italic pourra#! être déclenché aléatoirement par événement à ce moment-là"
 RICE_yazd_change_xwedodah_effect_tooltip_3:0 "Le [core_tenet|El] [GetFaithDoctrine('tenet_divine_marriage').GetBaseName] de [xwedodah_resolver.GetFaith.GetName] est remplacé par [GetFaithDoctrine('tenet_communal_identity').GetBaseName]"
 RICE_yazd_change_xwedodah_confirm:0 "Pour la gloire [ROOT.Char.GetFaith.CreatorNamePossessive] !"
 RICE_yazd_change_xwedodah_zurvanite_confirm:0 "$RICE_yazd_change_xwedodah_confirm$"
 RICE_yazd_change_xwedodah_context_tooltip:0 "#emphasis Contexte historique :#! Le Xwedodah était pratiqué dans la Perse antique, au-delà de la seule royauté. Cela ne fait généralement pas débat parmi les spécialistes de l'histoire iranienne ; ce qui est débattu, c'est son ampleur, et la fréquence à laquelle de tels mariages étaient consommés. Quoi qu'il en soit, les zoroastriens modernes #italic #bold ne pratiquent pas#!#! les mariages entre proches parents, et les abhorrent comme la plupart des gens. L'interprétation du Xwedodah a changé au début de l'époque moderne, bien que les raisons de ce changement d'attitude demeurent incertaines. Cette décision est une représentation ahistorique et symbolique de ce changement."
 RICE_yazd_celebrate_sadeh_festival:0 "Célébrer le festival de Sadeh"
 RICE_yazd_celebrate_sadeh_festival_tooltip:0 "La période la plus froide de l'année arrive bientôt !"
 RICE_yazd_celebrate_sadeh_festival_desc:0 "Le froid de l'hiver balaie le pays, ce qui signifie que c'est le moment de la fête de Sadeh, la célébration traditionnelle de l'hiver originaire du monde iranien. Je devrais organiser une grande fête de Sadeh cette année !"
 RICE_yazd_celebrate_sadeh_festival_effect_tooltip_1:0 "Vous célébrez le festival de Sadeh et pouvez obtenir divers avantages tels que du [prestige|El] ou de la [piety|El], ou perdre du [stress|El]"
 RICE_yazd_celebrate_sadeh_festival_effect_tooltip_2:0 "Parce que vous contrôlez [yazd_county.GetNameNoTier] et suivez la [faith|El] [THIS.Char.GetFaith.GetName], vous pouvez choisir de payer @gold_icon! 25 supplémentaires pour visiter Chak-Chak et obtenir des bienfaits additionnels"
 RICE_yazd_celebrate_sadeh_festival_confirm:0 "J'attends ça avec impatience !"
 RICE_yazd_celebrate_sadeh_festival_context_tooltip:0 "#emphasis Contexte historique :#! Sadeh est la fête traditionnelle iranienne de l'hiver qui a lieu 50 jours avant Nowruz. Durant la période médiévale, elle était célébrée avec enthousiasme aussi bien par les musulmans que par les zoroastriens en Iran, y compris plusieurs monarques. L'allumage de grands feux de joie constitue un élément central des festivités, incluant (du moins à l'époque médiévale) l'étrange pratique consistant à pousser bêtes et oiseaux dans les flammes pour les enflammer. Quoi qu'il en soit, les textes islamiques anciens attribuent l'instauration de Sadeh au héros épique Hushang, qui découvrit le feu par accident et souhaita ensuite commémorer ce bienfait."
 RICE_decision_yazd_sadeh_month_req:0 "Le mois est Novembre, Décembre ou Janvier"
 RICE_yazd_build_a_new_qanat:0 "Financer la construction d'un Qanat"
 RICE_yazd_build_a_new_qanat_tooltip:0 "Les habitants ont toujours besoin d'une nouvelle source d'eau."
 RICE_yazd_build_a_new_qanat_desc:0 "Les qanats sont des systèmes de canaux souterrains qui ont été construits dans une grande partie du Moyen-Orient pendant des siècles pour assurer un approvisionnement fiable en eau à la population locale. En finançant la construction d'un tel système, je peux améliorer la qualité de vie des habitants."
 RICE_yazd_build_a_new_qanat_effect_tooltip_1:0 "Votre [county_capital|El] recevra un [county_modifier|El] d'une durée de 10 ans et vous recevrez un [character_modifier|El] correspondant ainsi qu'un peu de [prestige|El]"
 RICE_yazd_build_a_new_qanat_effect_tooltip_2:0 "La force de ces bonus dépend du montant du financement fourni #weak (Coût minimum : @gold_icon! 50)#!"
 RICE_yazd_build_a_new_qanat_effect_tooltip_3:0 "La force de ces bonus dépend du montant du financement fourni #weak (Coût minimum : @gold_icon! 40)#!"
 RICE_yazd_build_a_new_qanat_effect_tooltip_4:0 "Comme vous contrôlez [yazd_county.GetNameNoTier] et qu'il possède le [county_modifier|El] [GetModifier('RICE_yazd_city_of_windcatchers').GetNameWithTooltip], les coûts de financement d'un qanat sont réduits"
 RICE_yazd_build_a_new_qanat_effect_tooltip_5:0 "Si votre [culture|El] possède la [tradition|El] #bold $tradition_fp3_irrigation_experts_name$#!, vous gagnerez plus de [prestige_i|El] [prestige|El] et le [county_modifier|El] durera #V 15#! ans au lieu de 10"
 RICE_yazd_build_a_new_qanat_confirm:0 "Que la construction commence !"
 RICE_yazd_build_a_new_qanat_context_tooltip:0 "#emphasis Contexte historique :#! Un qanat - connu sous le nom de foggara en Afrique du Nord, karez en Asie centrale, falaj à Oman, et bien d'autres noms - est un système de canaux d'eau souterrains originaire du plateau iranien, qui s'est ensuite répandu dans une grande partie du Moyen-Orient, de l'Afrique du Nord et de l'Asie centrale. Pendant des siècles, et encore aujourd'hui, ils ont été utilisés comme source d'eau dans ces régions, que ce soit pour la boisson, l'irrigation, le refroidissement, etc. Ces projets peuvent être de très petite envergure, initiés par quelques paysans, ou de grands projets de travaux publics financés par les élites locales."
 RICE_yazd_decision_qanat_requirement:0 "La [county_capital|El] se trouve dans l'une des [region|El] suivantes : Moyen-Orient, Perse, Afrique du Nord, Sahara, Tarim, Ibérie ou Sicile"
 RICE_yazd_expand_infrastructure:0 "Développer les équipements et les infrastructures de Yazd"
 RICE_yazd_expand_infrastructure_tooltip:0 "La ville de Yazd est prospère, mais elle pourrait l'être encore plus !"
 RICE_yazd_expand_infrastructure_desc:0 "Yazd se développe rapidement et devient même un centre d'apprentissage et de foi réputé. Cependant, nous pourrions faire encore plus pour attirer des personnes érudites et talentueuses dans la ville si nous développions son infrastructure existante par le biais de grands projets de travaux publics, tels que des qanats, des écoles, des mausolées, des jardins et bien d'autres choses encore."
 RICE_yazd_expand_infrastructure_effect_tooltip_1:0 "Désormais, le [ruler|El] de [yazd_county.GetNameNoTier] aura toujours le [character_modifier|El] [GetModifier('RICE_yazd_abode_of_worship_ruler').GetNameWithTooltip]"
 RICE_yazd_expand_infrastructure_effect_tooltip_2:0 "En tant que membre de la dynastie #V Kakuyide#!, réputée pour ses intérêts intellectuels et infrastructurels à Yazd, vous recevez le double de [prestige|El] et de [dynasty_prestige|El] que vous n'en obtiendriez normalement en prenant cette [decision|El]"
 RICE_yazd_expand_infrastructure_confirm:0 "Envoyez des ingénieurs, des architectes et des artisans."
 RICE_yazd_expand_infrastructure_context_tooltip:0 "#emphasis Contexte historique :#! Bien qu'elle soit située dans le désert, Yazd est une vallée-oasis qui occupe une position stratégique le long de plusieurs routes commerciales. La période de domination kakuyide au XIe siècle vit la ville croître considérablement, avec la construction de nombreuses mosquées, madrasas, qanats, jardins et bien d'autres ouvrages, soit par les Kakuyides eux-mêmes, soit par d'autres dirigeants locaux. Dès lors, la ville attira de nombreux hommes éminents et érudits de toute la région."
 RICE_yazd_enlist_jays_al_sorat:0 "Enrôler une unité de Jayš al-Šorāt"
 RICE_yazd_enlist_jays_al_sorat_tooltip:0 "Invoquez une unité azraqite pour combattre à votre place."
 RICE_yazd_enlist_jays_al_sorat_desc:0 "Les Azraqites sont des gens assoiffés de sang, fanatiquement dévoués au massacre de tous ceux qui ne sont pas d'accord avec leur interprétation extrémiste du kharijisme, ne serait-ce qu'un peu. Ils n'en restent pas moins des personnes, et il est possible de raisonner et de persuader les gens. Il existe dans mon royaume des guerriers azraqites féroces et aguerris qui me respectent suffisamment pour être prêts à se battre pour moi en échange de leur clémence... et d'un bon salaire."
 RICE_yazd_enlist_jays_al_sorat_confirm:0 "Tout homme a son prix, même les fanatiques sanguinaires."
 RICE_yazd_enlist_jays_al_sorat_context_tooltip:0 "#emphasis Contexte historique :#! En tant que secte kharijite la plus fanatique, même les autres kharijites considéraient les Azraqites comme trop extrêmes. Ya‘qub ibn al-Layth, le fondateur de la dynastie saffaride, acquit gloire et puissance en les combattant en Iran. Cependant, il parvint à intégrer pacifiquement certains Azraqites dans son armée en tant qu'unité spéciale appelée le #italic Jayš al-Šorāt#!. Néanmoins, Ya‘qub et ses frères géraient leurs armées avec une discipline stricte, et les unités kharijites n'en étaient pas exemptées. Au fil du temps, les groupes kharijites militants déclinèrent dans la région, remplacés par des adeptes plus quiétistes, jusqu'à ce que ceux-ci disparaissent à leur tour."
 RICE_yazd_decision_persia_req:0 "La [county_capital|El] est dans la [region|El] de Perse"
 RICE_yazd_saffarid_founder_req:0 "Est soit le souverain fondateur des Saffarides, Ya'qub, ou l'un de ses frères"
 RICE_yazd_enlist_county_req:0 "Possède un [county|El] qui suit la [faith] #V azraqite#! et se trouve dans la [region|El] de Perse"
 RICE_yazd_construct_shrine_of_the_twelve_imams:0 "Construire le Davāzdah Imām"
 RICE_yazd_construct_shrine_of_the_twelve_imams_tooltip:0 "Yazd serait un bon endroit pour construire un mausolée chiite."
 RICE_yazd_construct_shrine_of_the_twelve_imams_desc:0 "La communauté chiite de Yazd nous a proposé de construire un mausolée dans la ville. Il s'appellera le #italic Davāzdah Imām#! ou le Sanctuaire des Douze Imams et utilisera les dernières innovations en matière d'art et d'architecture afin d'être un lieu de culte et de réflexion spirituelle digne de ce nom."
 RICE_yazd_construct_shrine_of_the_twelve_imams_effect_tooltip:0 "Les bonus de [piety|E] et de [prestige|El] sont doublés si vous suivez une [faith|El] #V chiite#!"
 RICE_yazd_construct_shrine_of_the_twelve_imams_confirm:0 "Ordonner la construction du mausolée."
 RICE_yazd_construct_shrine_of_the_twelve_imams_context_tooltip:0 "#emphasis Contexte historique :#! Le Davāzdah Imām, ou sanctuaire des douze imams, est un mausolée situé à Yazd et l'un des premiers mausolées carrés à coupole de l'histoire de l'islam. Sa construction a été ordonnée en 1038 de notre ère par deux officiers militaires chiites de la dynastie des Kakuyides. Il présente un certain nombre de caractéristiques architecturales novatrices, telles que l'utilisation de l'équerre trilobée (une caractéristique ultérieure de l'architecture iranienne médiévale) et une plus grande application de couleurs et de stucs peints par rapport à d'autres monuments similaires antérieurs."
 RICE_yazd_purchase_yakhchal_ice:0 "Acheter de la glace aux yakhchals locaux"
 RICE_yazd_purchase_yakhchal_ice_tooltip:0 "Les habitants de la [GetGeographicalRegion('world_middle_east_persia').GetName] utilisent des [Glossary( 'Yakhchals', 'YAKHCHAL_GLOSS' )] pour stocker de la glace depuis des siècles."
 RICE_yazd_purchase_yakhchal_ice_desc:0 "Je devrais renouveler ma réserve de glace auprès des [Glossary( 'Yakhchals', 'YAKHCHAL_GLOSS' )] locaux pour que mes vivres et mes boissons restent frais. Et puis, il est grand temps que je me régale d'un sorbet !"
 RICE_yazd_purchase_yakhchal_ice_effect_tooltip_1:0 "Les effets de cette [decision|El] varient selon que vous êtes un [adventurer|El] ou non."
 RICE_yazd_purchase_yakhchal_ice_confirm:0 "Visiter un Yakhchal local"
 RICE_yazd_purchase_yakhchal_ice_context_tooltip:0 "#emphasis Contexte historique :#! Les [Glossary( 'Yakhchals', 'YAKHCHAL_GLOSS' )] sont des bâtiments traditionnellement utilisés pour stocker la glace et la neige en [GetGeographicalRegion('world_middle_east_persia').GetName] depuis des siècles. Historiquement, voyageurs et habitants achetaient de la glace aux Yakhchals locaux pour conserver ou préparer des aliments et des boissons comme le sorbet et le vin frais."
 RICE_yazd_decision_yakhchal_landless_req:0 "Votre [domicile|El] se trouve dans un [county|El] dont la [culture|El] possède l'[innovation|El] #V $innovation_RICE_yakhchals$#!"
 RICE_yazd_decision_yakhchal_landed_req:0 "Votre [capital|El] se trouve dans un [county|El] dont la [culture|El] possède l'[innovation|El] #V $innovation_RICE_yakhchals$#!"

 # Events
 yazd.0000.t:0 "xxxxx"
 yazd.0000.desc:0 "xxxxx"
 yazd.0000.a:0 "xxxxx"
 yazd.0001.t:0 "xxxxx"
 yazd.0001.desc:0 "xxxxx"
 yazd.0001.a:0 "xxxxx"
 yazd.0002.t:0 "La Frontière orientale"
 yazd.0002.desc:0 "Dans la frontière dangereuse et en constante évolution du #italic dar al-Islam#! à l'est de l'Iran, plusieurs seigneurs de guerre se disputent le pouvoir - certains motivés par une véritable dévotion à leur foi et par la lutte contre l'injustice, d'autres n'étant guère plus que des bandits puissants et opportunistes.\n\nActuellement, les tensions ont atteint un point critique entre [tahirid_guy.GetTitledFirstName], le gouverneur nominal nommé par la cour abbasside, et [yaqub_saffarid.GetTitledFirstName], un chef saffaride populaire et pieux quoique controversé, qui s'est fait un nom en tant que meneur d'un des nombreux guerriers #italic ‘ayyar#! qui ont combattu la plus sanguinaire des sectes hérétiques kharijites, les [bammer_guy.GetFaith.GetAdjective]. Certains disent que [yaqub_saffarid.GetFirstName] est un apostat rapace profitant de l'incompétence tahiride. D'autres disent qu'il est un homme pieux et modeste, qui combat justement les infidèles, les hérétiques et les tyrans hypocrites, et qui a même renoncé aux tentations de la chair en signe de sa dévotion. Pendant ce temps, les vestiges [bammer_guy.GetFaith.GetAdjective], bien qu'affaiblis, se cachent dans les montagnes et les vallées de [bam_county.GetNameNoTier] et de [badghis_county.GetNameNoTier], attendant leur occasion de se relever."
 yazd.0002.a:0 "La bataille commence, pour déterminer qui règne en maître dans l'est de l'Iran..."
 #yazd.0002.a:0 "My story lies with [ROOT.Char.GetFirstName], of course."
 yazd.0002.b:0 "Mon histoire est celle des Saffarides."
 yazd.0002.c:0 "Mon histoire est liée aux derniers kharidjites."
 yazd.0002.tooltip.no:0 "Vous continuerez à jouer en tant que [THIS.Char.GetTitledFirstNameNoTooltip]."
 yazd.0002.tooltip.saffarids:0 "Vous choisirez d'incarner l'un des frères Saffarid ou leurs subordonnés."
 yazd.0002.tooltip.kharijites:0 "Vous choisirez de jouer comme l'un des derniers [bammer_guy.GetFaith.GetAdherentNamePlural] de la région"
 yazd.0003.t:0 "Les Saffarides"
 yazd.0003.desc:0 "Les maniaques [bammer_guy.GetFaith.GetAdherentNamePlural] qui ont jadis semé le chaos à travers l'Iran sont en déclin - bien que pas encore totalement éliminés - grâce aux efforts d'hommes comme [yaqub_saffarid.GetFirstName], qui les ont soit détruits, soit persuadés de se rendre. En revanche, le gouverneur abbasside du Khorasan, [tahirid_guy.GetFirstName], serait incompétent et négligent face à ces menaces, davantage intéressé par le péché et les loisirs. Nombreux sont donc ceux qui ont fait appel à [yaqub_saffarid.GetFirstName] pour rétablir l'ordre et s'opposer à [tahirid_guy.GetFirstName].\n\nCertains disent que [yaqub_saffarid.GetFirstName] est un apostat rapace qui profite de l'incompétence tahiride. D'autres affirment qu'il est un homme pieux et modeste, qui combat justement les infidèles, les hérétiques et les tyrans hypocrites, et qui a même renoncé aux tentations de la chair en signe de son dévouement. Quelle que soit la vérité, la bataille a commencé pour déterminer qui règnera en maître dans cette région, et mon histoire se trouve avec..."
 yazd.0003.a:0 "[yaqub_saffarid.GetFirstName] en personne, le chaudronnier devenu guerrier saint"
 yazd.0003.b:0 "[amr_saffarid.GetFirstName], le frère de [yaqub_saffarid.GetFirstName]"
 yazd.0003.c:0 "[ali_saffarid.GetFirstName], l'autre frère de [yaqub_saffarid.GetFirstName]"
 yazd.0003.d:0 "[sebuk_eri_guy.GetFirstName], l'esclave-soldat turc de [yaqub_saffarid.GetFirstName] avec ses propres ambitions"
 yazd.0003.e:0 "[uzayr_al_sari.GetFirstName], le fonctionnaire dévoué de [yaqub_saffarid.GetFirstName]"
 yazd.0003.a.info:0 "\n#emphasis Contexte historique :#! Ya‘qub ibn al-Layth, le fondateur de la dynastie saffaride, était chaudronnier à Zaranj (dans l'actuel est de l'Afghanistan) lorsqu'il rejoignit une bande d'#italic ‘ayyar#! pour combattre les Azraqites qui infestaient une grande partie de l'arrière-pays iranien oriental.\n\nRéputé pour son mode de vie ascétique, Ya‘qub acquit suffisamment de puissance pour vaincre les Tahirides en 873. Le calife abbasside Al-Mu‘tamid lui offrit divers gouvernorats en Iran par crainte de sa puissance croissante, mais Ya‘qub les refusa et marcha sur Bagdad, pour finalement être défait en 876. Bien que l'attaque de Ya‘qub ait traditionnellement été interprétée comme le signe d'une nature avide de pouvoir, voire irréligieuse, il est possible qu'en tant que guerrier saint, il ait considéré Al-Mu‘tamid comme indigne et ait cherché à le remplacer par un Abbasside plus méritant.\n\nYa‘qub mourut en 879 et bien que son statut de proto-nationaliste soit peut-être un peu exagéré, il ne fait aucun doute que sa carrière marqua les débuts de la désintégration de l'autorité abbasside en Iran, et l'ascension de divers potentats iraniens."
 yazd.0003.b.info:0 "\n#emphasis Contexte historique :#! Amr ibn al-Layth, un frère de Ya‘qub, fut le second souverain de la dynastie saffaride. À l‘instar de son frère, il avait lui aussi des origines modestes, ayant été tailleur de pierre et muletier avant de rejoindre les #italic ‘ayyar#!.\n\nYa‘qub, qui n‘eut apparemment jamais ni enfants ni épouse, préférait que son autre frère Ali lui succède ; cependant, grâce à quelques intrigues, ce fut Amr qui s‘imposa. Une grande partie du début de son règne fut consacrée à rétablir l‘ordre dans divers territoires qui avaient échappé à l‘autorité de Ya‘qub tandis que celui-ci était accaparé par l‘Ouest. Finalement, Amr et le calife Al-Mu‘tamid durent même mettre de côté leurs différends, face aux divers seigneurs de guerre iraniens qui menaçaient leurs intérêts mutuels.\n\nCe furent les Samanides qui causèrent la perte d‘Amr, en le vainquant en 900 apr. J.-C. Bien qu‘Amr fût techniquement le représentant du calife, ce dernier dut trouver opportune la défaite de son ancien allié ; les Samanides envoyèrent Amr enchaîné au calife, et il fut plus tard exécuté.\n\nBien que les descendants d‘Amr survécurent et régnèrent en tant que petits seigneurs pendant encore un siècle, ils ne retrouveraient jamais l‘apogée de leur puissance."
 yazd.0003.c.info:0 "\n#emphasis Contexte historique :#! Comme ses frères, Ali ibn al-Layth avait des origines modestes et avait combattu sous la bannière de son frère pendant de nombreuses années. Ali était censé être son successeur et non Amr lorsque ce dernier est décédé en 879 de l'ère chrétienne et était également préféré par l'armée safaride, mais l'astucieux Amr a pris le dessus. Les deux frères ne se réconcilièrent jamais et, alors qu'Amr emprisonnait Ali, ce dernier parvint à s'échapper pour se mettre au service d'autres chefs de guerre iraniens, ennemis d'Amr dans la région."
 yazd.0003.d.info:0 "\n#emphasis Contexte historique :#! Sebük-Eri était un soldat turc esclave capturé par les Saffarides lors de l'un de leurs nombreux raids en territoire zunbil. Il a servi Ya'qub puis Amr pendant quelques années et a été nommé gouverneur de Fars.\n\nAprès la chute et l'exécution d'Amr en 901 de notre ère, son successeur et petit-fils, Tahir, se retrouve sous la coupe de l'ambitieux Sebük-Eri. Tahir et son frère Ya'qub finissent par entrer en conflit avec Sebük-Eri, qui s'allie au Calife.\n\nBien que Tahir et Ya'qub aient été vaincus, la bonne fortune de Sebük-Eri n'a pas duré longtemps ; ses ambitions ont été anéanties lorsque le Calife a envoyé une expédition punitive contre lui. Il fut capturé et mourut prisonnier du calife en 917 ou 918 de notre ère."
 yazd.0003.e.info:0 "\n#emphasis Contexte historique :#! Après la défaite des Tahirides, Ya'qub aurait reproché au Tahiride au pouvoir, Muhammad, d'être un dirigeant inepte qui négligeait son peuple et la menace kharijite dans sa juridiction. Ya'qub démet Muhammad de ses fonctions et nomme son partisan 'Uzayr ibn al-Sari gouverneur de Nishapur (la capitale des Tahirides) pour le représenter dans cette ville."
 yazd.0004.t:0 "Les derniers kharijites"
 yazd.0004.desc:0 "[yaqub_saffarid.GetTitledFirstName] s'est révélé un ennemi rusé pour tous les [bammer_guy.GetFaith.GetAdherentNamePlural]. Nos effectifs ont été considérablement réduits grâce à ses efforts, et il ne reste plus que deux grands foyers kharijites dans la région : [bammer_guy.GetFirstName], qui dirige les rescapés kharijites à la Citadelle de [bam_county.GetNameNoTier], et [abd_al_rahman_kharijite.GetFirstName], calife kharijite autoproclamé à [badghis_county.GetNameNoTier]. Pourtant, [yaqub_saffarid.GetFirstName] ne s'est pas montré entièrement hostile. Certes, il a anéanti certains groupes [bammer_guy.GetFaith.GetAdherentNamePlural], mais d'autres ont pu négocier pour le servir, ce qu'il a accepté malgré notre réputation - pleinement méritée, et dont nous sommes fiers - de zélotes fanatiques et impénitents.\n\nUn conflit se profile à l'horizon entre l'ambitieux [yaqub_saffarid.GetFirstName] et le gouverneur abbasside du Khorasan, [tahirid_guy.GetFirstName]. Nous pourrions, comme certains de nos frères, trahir nos valeurs et jurer fidélité à [yaqub_saffarid.GetFirstName] ; ou nous pourrions, comme d'autres, résister à ces infidèles qui se prétendent musulmans, et espérer que [bammer_guy.GetFaith.HighGodName] nous délivre en cette heure de besoin."
 yazd.0004.a:0 "Nous devons faire preuve de prudence en ces temps incertains..."
 #yazd.0004.a:0 "[bammer_guy.GetFirstName], who leads Kharijite remnants at the Citadel of [bam_county.GetNameNoTier]"
 #yazd.0004.b:0 "[abd_al_rahman_kharijite.GetFirstName], self-proclaimed Kharijite Caliph in [badghis_county.GetNameNoTier]"
 yazd.0004.a.info:0 "\n#emphasis Contexte historique :#! Bam, fortement fortifiée, a servi de refuge à une communauté de Kharijites pendant une grande partie du VIIIe siècle et la première moitié du IXe siècle. Ils furent finalement anéantis par une attaque des Saffarides en 868 de notre ère. À cette époque, leur chef était un homme nommé Esma'il ibn Musa."
 yazd.0004.b.info:0 "\n#emphasis Contexte historique :#! Les terres proches d'Hérat, en particulier autour de régions comme Karukh, Badghis et Sabzevar, avaient été un foyer d'activité kharidjite pendant une grande partie des VIIIe et IXe siècles, et furent ainsi la cible d'une expédition saffaride en 870-871 apr. J.-C. À cette époque, le chef kharidjite de la région était Abd al-Rahman, qui s'était proclamé « Calife des Kharidjites » et y était actif depuis trois décennies.\n\nLes sources divergent sur le sort final d'Abd al-Rahman. Il aurait pu être tué par les Saffarides et sa tête envoyée au Calife à Bagdad, ou bien il aurait pu se soumettre et être ensuite nommé gouverneur local, pour finalement être tué par des Kharidjites mécontents menés par un certain Ibrahim ibn Akhdar. Si cette dernière version est vraie, alors les Saffarides firent ironiquement une offre similaire à Ibrahim et intégrèrent ses forces à leur armée."
 yazd.0005.t:0 "L'histoire de Faramurz"
 yazd.0005.desc:0 "Il y a des décennies, mon père [ala_al_dawla.GetTitledFirstName] était l'un des grands seigneurs de guerre du centre de l'Iran. Apparenté aux Bouyides par mariage, lui et ses guerriers [ROOT.Char.GetCulture.GetCollectiveNoun|l] contrôlaient initialement une grande partie de l'Iran dans le sillage du déclin bouyide, mais il dut plus tard opposer les puissants Ghaznévides et Seldjoukides les uns aux autres pour préserver l'autonomie de notre dynastie.\n\nJe vis, hélas, dans son ombre. Mon règne commença lorsque je dus mater mon frère rebelle [abu_harb.GetFirstName], bien que nous nous soyons depuis réconciliés. Plus tard, à l'instar de mon autre frère [garshasp.GetFirstName], je tentai une rébellion infructueuse contre le Seldjoukide [tughril_beg.GetTitledFirstName]. Excédé par mes intrigues, mais miséricordieux, il m'accorda un petit fief centré sur [yazd_county.GetNameNoTier] à ma propre demande. Je suis ici depuis lors."
 yazd.0005.a:0 "Tel était le destin de notre famille, par la volonté [ROOT.Char.GetFaith.CreatorNamePossessive]."
 yazd.0005.b:0 "Nous, les Kakouyides, sommes pleins de ressources et nous tirons le meilleur parti de la situation."
 yazd.0006.t:0 "Gouverner Yazd"
 yazd.0006.desc:0 "Malgré l'amertume de la défaite, la vieillesse a une façon de changer notre perspective. J'ai enterré la hache de guerre avec les Seldjoukides et je jouis d'un grand respect à leur cour. Même si je ne suis que l'ombre de mon père, j'ai hérité de son amour du savoir et de la culture - il fut, après tout, le mécène du grand Avicenne.\n\nDepuis mon arrivée à [yazd_county.GetNameNoTier], j'ai consacré mes énergies à en faire une cité digne des érudits et autres hommes cultivés. Mon propre fils, [kakuyid_son.GetFirstName], est également en vue dans les cercles seldjoukides et est lui aussi un grand amateur de poésie et d'érudition.\n\nDans l'ensemble, en tant qu'administrateur de Yazd, je suis particulièrement fier de mes efforts pour :"
 yazd.0006.a:0 "Se réconcilier avec les Seldjoukides et devenir en quelque sorte leur envoyé de confiance."
 yazd.0006.b:0 "Développer Yazd et en faire une grande ville prospère et paisible."
 yazd.0006.c:0 "Poursuivre l'héritage de mon père en parrainant l'apprentissage et les arts."
 yazd.0007.t:0 "Une vie s'est écoulée"
 yazd.0007.desc:0 "Au bout du compte, ce n'est peut-être pas une mauvaise chose que nous ne vivions pas en campagne militaire comme le faisait mon père autrefois.\n\nPeut-être était-ce la volonté [ROOT.Char.GetFaith.CreatorNamePossessive] que nous puissions gouverner cette ville raffinée, et cultiver les arts de la paix. Malgré mes défaites et revers initiaux, je ne peux pas dire que je n'ai pas eu une vie réussie. D'une certaine manière, alors que je sens la mort approcher, je réalise que je ne suis peut-être plus dans l'ombre de mon père.\n\nPeut-être ai-je aussi ma propre ombre."
 yazd.0007.a:0 "Mon histoire va bientôt se terminer pour qu'une nouvelle commence. Je le sens."
 yazd.0007.info:0 "#emphasis Contexte historique :#! Faramurz est mentionné pour la dernière fois dans les archives historiques en 1063 apr. J.-C. ; il est donc probablement décédé peu après. À cette époque, lui et ses héritiers s'étaient imposés comme des vassaux loyaux et respectés des Seldjoukides, malgré leurs débuts tumultueux. Par exemple, Ali, fils et successeur de Faramurz, épousa Arslan Khatun, la sœur d'Alp Arslan.\n\nLes Kakuyides ultérieurs se contentèrent de régner sur Yazd, la transformant en un centre culturel. Le dernier souverain connu de la dynastie fut un certain Garshasp, petit-fils de Faramurz, qui serait mort en 1141 apr. J.-C. lors de la bataille de Qarwan, quand les Kara-Khitans (ou Liao occidentaux) infligèrent une défaite retentissante aux Seldjoukides.\n\nYazd fut alors confiée au gendre de Garshasp, un commandant turc nommé Sam ibn Wardanruz, qui fonda la dynastie des Atabegs de Yazd. En tant que continuation des Kakuyides, ils perdurèrent jusqu'au XIVe siècle sous l'Ilkhanat."
 yazd.0008.t:0 "L'histoire de Qawurd"
 yazd.0008.desc:0 "Ensemble, mon père [chagri_beg.GetFirstName] et mon oncle [tughril_beg.GetFirstName] ont posé les fondations du succès de notre dynastie. De leur vivant, j'ai mené nos forces à la conquête du [kerman_duchy.GetNameNoTier], puis, par-delà la mer, jusqu'à [oman_duchy.GetNameNoTier]. Que nul ne dise que j'ai manqué de talent pour accroître la gloire de notre famille.\n\nAu fil des années, en tant que dirigeant du [kerman_duchy.GetNameNoTier] et de [oman_duchy.GetNameNoTier], j'ai accompli beaucoup. J'ai su équilibrer les intérêts concurrents de mes semblables, les Turcs pastoraux, et ceux des peuples sédentaires et agricoles que nous gouvernons. J'ai fait frapper monnaie et établi des routes sûres pour les voyageurs et les marchands.\n\nDe tous mes accomplissements, celui dont je suis le plus fier est :"
 yazd.0008.a:0 "Ma conquête d'Oman sur les blasphémateurs kharijites."
 yazd.0008.b:0 "Mes efforts pour assurer la paix entre les Turcs et les habitants locaux."
 yazd.0008.c:0 "Mon travail pour étendre les réseaux commerciaux et construire des routes sûres."
 yazd.0009.t:0 "Le droit de naissance du prince aîné"
 yazd.0009.desc:0 "En tant que fils aîné de mon père, et neveu aîné de mon oncle, je m'attendais à hériter de leur rôle de chef des Seldjoukides. Mais malgré tous mes efforts, lorsque mon oncle est décédé, il a confié la fortune de la famille à mon frère cadet [alp_arslan.GetFirstName]. J'avoue que j'ai été déçu, et je le suis encore.\n\nJ'ai décidé d'attendre mon tour. Si nous suivons la coutume traditionnelle [ROOT.Char.GetCulture.GetName], alors j'aurais la préséance sur mes neveux pour hériter du trône, et je sais que de nombreux officiers de nos armées sont d'accord avec cela.\n\nJe ne sais pas si je survivrai à mon frère. Mais si [ROOT.Char.GetFaith.HighGodName] le veut, alors peut-être viendra le jour où ma patience et mon travail acharné seront récompensés. En tant que prince seldjoukide le plus âgé, le grand empire seldjoukide sera à moi à gouverner !"
 yazd.0009.a:0 "Ce n'est que mon droit de naissance."
 yazd.0009.qawurd.tooltip:0 "#bold [RICE_aspiration|El] de Qawurd : Revendiquer le trône seldjoukide#!$RICE_yazd_aspiration_qawurd_desc$\n"
 yazd.0009.info:0 "#emphasis Contexte historique :#! Malgré leurs relations tendues, Qawurd n'a jamais tenté d'usurper son frère Alp Arslan du vivant de ce dernier.\n\nCependant, lorsqu'Alp Arslan fut tué de manière inattendue par un ennemi captif en 1072 apr. J.-C. et remplacé par son fils, le jeune Malik Shah, Qawurd y vit l'opportunité de s'emparer du trône seldjoukide, et il leva son étendard en rébellion. Bien que de nombreux Turkmènes des forces de Malik Shah aient fait défection au profit de Qawurd lors de la bataille décisive près de Hamadan, Malik Shah l'emporta, et Qawurd fut exécuté.\n\nMalgré cela, deux des fils de Qawurd, Sultan Shah et Turan Shah, restèrent à Kerman en tant que vassaux de Malik Shah. La branche de Kerman des Seldjoukides perdura jusqu'à la fin des années 1100."
 yazd.0010.t:0 "$RICE_historical_aspiration_fulfilled_title$"
 yazd.0010.desc:0 "Le rêve de toute ma vie s'est réalisé. #italic Moi#!, [qawurd.GetFirstName], je règne sur le puissant Empire seldjoukide. Mes parents cadets, moins méritants ? Ils sont aptes à combattre sous mes ordres et à me servir loyalement, mais en tant que prince aîné de notre dynastie, il m'appartenait de droit de siéger sur ce trône depuis le début. C'était mon #italic droit de naissance#!.\n\nLes guerriers et tribus turcs qui m'ont soutenu sont, bien sûr, tout aussi satisfaits. Ils se méfiaient de la façon dont certains de mes parents semblaient abandonner nos anciennes traditions, telles que la succession par ancienneté. Ils attendent désormais beaucoup de moi, et il serait sage de ma part d'apaiser leurs désirs en restant fidèle à nos racines.\n\nQuoi qu'il en soit, notre dynastie demeure forte. Avec moi aux rênes de cet empire, nous deviendrons encore plus puissants avec le temps."
 yazd.0010.a:0 "Que [ROOT.Char.GetFaith.HighGodName] apporte à moi et à mon empire de nombreuses gloires !"
