 yazd.0020.t:0 "Yazd s'étend et prospère"
 yazd.0020.desc:0 "Bien que [yazd_county.GetNameNoTier] soit située dans une région aride, les étrangers venus de loin pourraient être surpris de voir à quel point la ville est prospère. Outre le fait qu'elle est essentiellement située dans une oasis et géographiquement protégée, elle dispose également d'excellentes infrastructures et installations, telles que de vastes réseaux de qanats, des lieux de culte pour plusieurs confessions différentes, et bien plus encore. Cependant, il y a toujours matière à amélioration.\n\nJ'ai décidé de lancer plusieurs initiatives pour agrandir la ville et prévoir des bâtiments supplémentaires ainsi que des projets de travaux publics. Cela inclut de nouvelles extensions des qanats, plusieurs jardins luxuriants et verdoyants, des écoles d'apprentissage, et davantage. La ville a déjà une belle réputation d'attirer des colons érudits, instruits et compétents - rendons-la encore plus grande afin d'y attirer des talents encore plus remarquables !"
 yazd.0020.a:0 "Yazd est un véritable joyau du désert."
 yazd.0021.t:0 "Yazd s'étend et prospère"
 yazd.0021.desc:0 "Depuis un certain temps déjà, [yazd_county.GetNameNoTier] s'est forgé une réputation de centre du savoir et des arts. On pourrait trouver étrange, voire inexplicable, qu'une cité au milieu du désert ait pu acquérir une telle renommée. Il n'y a pourtant aucun secret à ce succès : elle bénéficie d'excellentes infrastructures, d'une communauté raffinée, et se trouve dans une position stratégique et défendable au sein d'une oasis.\n\nBien qu'[yazd_ruler.GetSheHe] ne soit pas [yazd_ruler.GetHerHim] premier[yazd_ruler.Custom('FR_ErEre')] dirigeant[yazd_county.Custom('FR_E')] de [yazd_county.GetNameNoTier] à le faire, [yazd_ruler.GetTitledFirstName] a récemment commencé à financer divers projets et initiatives de travaux publics d'une ampleur inédite. Jardins, lieux de culte, qanats, écoles et bien d'autres édifices seront construits pour améliorer encore la qualité de vie dans la cité. Désormais, savants et érudits venus de loin font l'éloge de la ville, et beaucoup souhaitent s'y établir, renforçant ainsi la réputation déjà prestigieuse de la cité."
 yazd.0021.a:0 "C'est bon pour [yazd_county.GetNameNoTier]."
 yazd.0022.t:0 "Qanats"
 yazd.0022.desc:0 "Depuis des siècles, les peuples du Moyen-Orient et d'Afrique du Nord ont construit et utilisé les canaux #italic qanat#! pour acheminer l'eau sur de grandes distances.\n\nIl est devenu coutumier pour les personnes de rang comme moi de parrainer la construction de tels ouvrages publics. J'ai décidé de faire de même, et une fois le qanat achevé, il fournira une source d'eau fiable à la communauté où il sera construit, que ce soit pour l'agriculture, la boisson, la lessive ou tout autre usage.\n\nJe dois maintenant réfléchir au montant du financement que je suis prêt à consacrer à cette entreprise, et à la taille du qanat que je souhaite parrainer."
 yazd.0022.a:0 "Un petit qanat"
 yazd.0022.b:0 "Un qanat de taille moyenne"
 yazd.0022.c:0 "Un grand qanat"
 yazd.0022.d:0 "Un immense qanat"
 yazd.0023.t:0 "La question du xwedodah [xwedodah_resolver.GetFaith.GetAdherentName]"
 yazd.0023.desc:0 "Tout [ROOT.Char.GetFaith.GetAdherentName] bien éduqué sait que le #italic Xwedodah#! est véritablement l'un des plus grands actes qu'une personne puisse accomplir. Certains affirment même que [ROOT.Char.GetFaith.DevilName] a ordonné à ses sbires d'éviter tout couple ayant accompli un acte de #italic Xwedodah#!, tant leur sainteté est puissante.\n\nDepuis longtemps déjà, un débat considérable existe sur ce que signifie exactement le #italic Xwedodah#!. Traditionnellement, beaucoup d'entre nous l'ont compris comme désignant le mariage entre proches parents - parent avec enfant, ou frère avec sœur. Certains, cependant, contestent cela et soutiennent que notre compréhension actuelle est erronée ; les enseignements véritables et originaux, disent-ils, faisaient référence aux mariages entre cousins.\n\nEn tant que l'un des plus puissants dirigeants [ROOT.Char.GetFaith.GetAdherentNamePlural] au monde, j'ai décidé de convoquer un conseil de divers érudits et [ROOT.Char.Custom('DefaultPriestTitlePlural')] pour discuter de cette question. Peut-être pourrons-nous résoudre ce débat une fois pour toutes, afin d'assurer l'unité parmi nous tous."
 yazd.0023.a:0 "Commençons par entendre les arguments des deux parties."
 yazd.0024.t:0 "La question du xwedodah [xwedodah_resolver.GetFaith.GetAdherentName]"
 yazd.0024.desc:0 "Depuis des générations, voire des siècles, les fidèles de la foi [xwedodah_resolver.GetFaith.GetAdjective] pratiquent le #italic Xwedodah#!, ou mariage entre proches parents, qu'ils considèrent comme un acte sacré et agréable à [xwedodah_resolver.GetFaith.HighGodName]. En effet, les adeptes de toutes les autres religions les ont raillés pour cela, se moquant d'eux ou les condamnant pour ces coutumes prétendument dégénérées.\n\nPourtant, tous les [xwedodah_resolver.GetFaith.GetAdherentNamePlural] ne sont pas à l'aise avec cette interprétation du #italic Xwedodah#!. Certains ont toujours soutenu qu'il désignait le mariage entre cousins. Ainsi, [xwedodah_resolver.GetTitledFirstName], un[xwedodah_resolver.Custom('FR_E')] souverain[xwedodah_resolver.Custom('FR_E')] [xwedodah_resolver.Custom('FR_FaithGenderedAdj')] réputé[XXX.Custom('FR_E')], a convoqué un conseil composé d'éminents érudits et [xwedodah_resolver.Custom('DefaultPriestTitlePlural')] afin de débattre pour savoir si le #italic Xwedodah#! implique le mariage entre proches parents ou entre cousins, et de régler cette question une bonne fois pour toutes."
 yazd.0024.a:0 "Ainsi soit-il."
 yazd.0025.t:0 "La décision sur le Xwedodah [ROOT.Char.GetFaith.GetAdherentName]"
 yazd.0025.desc:0 "Après d'excellentes discussions - qui se sont parfois échauffées - le conseil que j'ai convoqué pour examiner la question du #italic Xwedodah#! a formulé une décision sur la question posée : le #italic Xwedodah#! désigne-t-il le mariage entre proches parents, ou entre cousins ?\n\nBien que la décision ne soit pas unanime, elle a reçu le soutien de nombreux participants. Bien qu'il faudra du temps pour que la communauté [ROOT.Char.GetFaith.GetAdjective] du monde entier apprenne ce qui s'est passé ici, on espère que cela résoudra une fois pour toutes les débats sur le #italic Xwedodah#!, afin que nous puissions nous concentrer sur la promotion des bonnes pensées, des bonnes paroles et des bonnes actions.\n\n#Bold Par conséquent, qu'il soit connu que nous avons conclu que [ROOT.Char.GetFaith.HighGodName] a voulu que le #italic Xwedodah#! se fasse entre :#!"
 yazd.0025.a:0 "Cousins, alors que les intentions de [ROOT.Char.GetFaith.HighGodNamePossessive] ont été mal interprétées pendant des siècles"
 yazd.0025.b:0 "Proches parents, car [ROOT.Char.GetFaith.HighGodNamePossessive] souhaite que ce soit un moyen de guider l'humanité"
 RICE_yazd_change_xwedodah_warning_tooltip:0 "#X Cette décision de déterminer la [doctrine|El] #V $doctrine_consanguinity_name$#! de [xwedodah_resolver.GetFaith.GetNameNoTooltip] est #bold permanente#!, et ne peut être annulée !#!"
 RICE_yazd_keep_xwedodah_tooltip_1:0 "[GetFaithDoctrine('doctrine_consanguinity_unrestricted').GetBaseName] demeure la [doctrine|El] #V $doctrine_consanguinity_name$#! de [xwedodah_resolver.GetFaith.GetName]"
 RICE_yazd_keep_xwedodah_tooltip_2:0 "[GetFaithDoctrine('tenet_divine_marriage').GetBaseName] demeure un [core_tenet|El] de [xwedodah_resolver.GetFaith.GetName]"
 yazd.0026.t:0 "La décision sur le Xwedodah [ROOT.Char.GetFaith.GetAdherentName]"
 yazd.0026.desc.intro:0 "Récemment, [xwedodah_resolver.GetTitledFirstName] a convoqué un conseil d'érudits et de [xwedodah_resolver.Custom('DefaultPriestTitlePlural')] pour débattre de la question de savoir si la compréhension [xwedodah_resolver.GetFaith.GetAdjective] actuelle du #italic Xwedodah#! était correcte ou non. La question centrale de leur débat était de savoir s'il faisait référence à la pratique du mariage entre proches parents ou entre cousins. Les fidèles d'autres confessions dénoncent depuis longtemps les [xwedodah_resolver.GetFaith.GetAdherentNamePlural] pour cela, et c'était devenu un sujet de discorde au sein de leur propre communauté depuis un certain temps. Quoi qu'il en soit, le conseil finit par rendre son verdict."
 yazd.0026.desc.no_incest:0 "\n\nEn s'appuyant sur diverses preuves et raisonnements, ils soutiennent que le #italic Xwedodah#! désigne en réalité le mariage entre cousins. Ainsi, le mariage entre proches parents serait une corruption tardive et une mauvaise compréhension [xwedodah_resolver.GetFaith.ReligiousText3] et des pratiques de la communauté [xwedodah_resolver.GetFaith.GetAdjective] originelle des premiers temps."
 yazd.0026.desc.yes_incest:0 "\n\nSur la base de diverses preuves et raisonnements, ils soutiennent que le #italic Xwedodah#! désigne bien le mariage entre proches parents, comme entre parent et enfant ou entre frères et sœurs. Ainsi, la manière dont il est actuellement pratiqué est exacte et conforme aux enseignements présents dans [xwedodah_resolver.GetFaith.ReligiousText]."
 yazd.0026.desc.conclusion:0 "\n\nBien que cette décision ne soit ni nécessairement contraignante ni absolue, en raison de l'importance de ceux qui sont impliqués, elle sera probablement respectée par de nombreux [xwedodah_resolver.GetFaith.GetAdherentNamePlural]."
 yazd.0026.a:0 "Que va penser la communauté [xwedodah_resolver.GetFaith.GetAdjectiveNoTooltip] de cela ?"
 yazd.0026.tooltip:0 "Ce changement à la [doctrine|El] #V $doctrine_consanguinity_name$#! de [xwedodah_resolver.GetFaith.GetName] est #bold permanent#!, et ne peut être annulé."
 yazd.0027.t:0 "L'Imām Davāzdah"
 yazd.0027.desc.intro:0 "À la demande de la communauté chiite locale de [yazd_county.GetNameNoTier], j'ai réuni des fonds et engagé des artisans et architectes qualifiés pour construire un mausolée appelé le #italic Davāzdah Imām#!, ou le Sanctuaire des douze Imams. Bien qu'il ne soit pas le plus grand édifice de la ville, il constitue néanmoins une œuvre architecturale remarquable. À l'intérieur se trouvent plusieurs inscriptions, dont la plupart citent le Coran ; l'une d'entre elles porte toutefois le texte suivant :\n\n#italic Ainsi a ordonné la construction de ce dôme béni : l'illustre [ROOT.Char.GetTitledFirstNameNoTooltip], recherchant la satisfaction de Dieu et espérant sa récompense.#!"
 yazd.0027.desc.shiite:0 "\n\nJe suis heureu[ROOT.Char.Custom('FR_XSe')] d'avoir cette opportunité de soutenir mes amis de la communauté chiite. Nous devons travailler ensemble si nous voulons prospérer à [yazd_county.GetNameNoTier] et ailleurs dans le monde."
 yazd.0027.desc.not_shiite:0 "\n\nBien que je ne sois pas chiite, je ne vois aucune raison d'éviter d'entretenir de bonnes relations avec la communauté chiite de [yazd_county.GetNameNoTier]. J'espère qu'ils reconnaîtront mon geste de bonne volonté."
 yazd.0027.a:0 "Ce bâtiment ne manquera pas d'embellir notre ville."
 yazd.0028.t:0 "Visite du Yakhchal"
 yazd.0028.desc:0 "J'ai rendu visite au [Glossary( 'yakhchal', 'YAKHCHAL_GLOSS' )] local pour acheter une importante réserve de glace pour mon usage personnel.\n\nCette glace peut servir à conserver la nourriture à des températures plus fraîches, afin d'éviter qu'elle ne se gâte. Je pourrais également l'utiliser pour préparer de délicieux mets froids, comme des sorbets et des boissons rafraîchies.\n\nIl y a tant de choses que je pourrais faire avec cette glace - heureusement que les [culture.GetCollectiveNoun|l] du coin entretiennent ces #italic yakhchals#! ici !"
 yazd.0028.a:0 "Je prends cette glace, merci."
 yazd.0029.t:0 "xxxxx"
 yazd.0029.desc:0 "xxxxx"
 yazd.0029.a:0 "xxxxx" 
 yazd.0030.t:0 "Se préparer à Sadeh"
 yazd.0030.desc:0 "L'hiver est de retour, et une fraîcheur envahit l'air.\n\nCette année, je souhaite célébrer une grande fête de Sadeh, comme nos prédécesseurs en Iran l'ont fait depuis des générations et des générations. Le jour le plus froid de l'année, cinquante jours avant #italic Nowruz#!, nous observerons ainsi Sadeh en allumant des feux de joie."
 yazd.0030.desc.chak_chak:0 "\n\nEn tant que [ROOT.Char.Custom('FR_FaithGenderedAdj')] qui gouverne des territoires dans [yazd_county.GetNameNoTier], j'ai décidé de célébrer Sadeh à la grotte sacrée de Chak-Chak, située à proximité. On raconte que lorsque les Arabes conquirent l'Iran, Nikbanou, une fille du dernier empereur sassanide, s'enfuit à Chak-Chak. Grâce à l'intercession bienveillante de [ROOT.Char.GetFaith.HighGodName], la princesse put trouver refuge dans la grotte pour échapper aux envahisseurs.\n\nQuoi qu'il en soit, des cérémonies spéciales sont traditionnellement organisées à Chak-Chak pendant Sadeh. Visiter la grotte sera une grande opportunité spirituelle pour moi, même si cela demande une organisation supplémentaire."
 yazd.0030.a:0 "Je devrais commencer à préparer les célébrations de cette année."
 yazd.0030.b:0 "Je suis ravi de pouvoir célébrer Sadeh à Chak-Chak !"
 yazd.0030.c:0 "Je ne peux pas y assister cette année, car je suis occupé avec d’autres événements du Sadeh."
 yazd.0030.chak_chak.tooltip:0 "Se rendre à Chak-Chak pourrait déclencher des événements Sadeh supplémentaires potentiels, qui peuvent vous rapporter davantage de [piety|El] et d'autres avantages, mais cela diminuera les chances de vivre des événements Sadeh normaux."
 yazd.0031.t:0 "Sadeh commence"
 yazd.0031.desc:0 "C'est presque la nuit de la Fête de Sadeh. Bien que ce soit la période la plus froide de l'année, nous trouvons de la chaleur les uns dans les autres, ainsi que dans les feux que nous allumons. À travers le monde iranien, des feux de joie s'embrasent dans chaque ville et village, proches ou lointains - puissions-nous trouver la joie les uns dans les autres en attendant le retour du printemps !"
 yazd.0031.a:0 "Je suis heureu[ROOT.Char.Custom('FR_XSe')] qu'il soit enfin là ! Commençons."
 yazd.0032.t:0 "La fin de Sadeh"
 yazd.0032.desc:0 "C'est ainsi que Sadeh s'achève. Tout le monde s'est bien amusé, et les feux de joie que nous avons allumés un peu partout ont certainement aidé tout le monde à se réchauffer en cette période la plus froide de l'année. Le printemps ne tardera pas à pointer le bout de son nez."
 yazd.0032.desc.no_chak_chak:0 "\n\nHélas, une telle occasion ne se présente qu'une fois par an, aussi devons-nous conclure pour le moment. D'ici là, cependant, j'attends avec impatience le prochain Sadeh."
 yazd.0032.desc.chak_chak:0 "\n\nUne telle occasion ne se présente qu'une fois par an, et je dois bientôt quitter Chak-Chak. Je suis néanmoins heureu[ROOT.Char.Custom('FR_XSe')] d'avoir décidé de m'y rendre lors du Sadeh de cette année, afin d'assister aux cérémonies qui s'y déroulaient. Ce fut une belle expérience."
 yazd.0032.a:0 "À la prochaine"
 yazd.0033.t:0 "Feux de joie"
 yazd.0033.desc:0 "Dans le cadre des rituels du Sadeh, nous devons rassembler beaucoup de bois pour construire les feux de joie. Peu importe son statut, il est important que chacun fasse sa part, alors j'ai fait ce que je devais faire et j'ai aidé à ramasser le bois afin que nous puissions allumer de grands feux plus tard dans la nuit."
 yazd.0033.a:0 "J'ai apporté quelques branches. Je ne devrais pas avoir à travailler beaucoup."
 yazd.0033.b:0 "J'ai transporté une bonne quantité de bois de chauffage pour les feux de joie."
 yazd.0033.c:0 "J'ai travaillé dur pour ramasser autant de bois de chauffage que possible."
 yazd.0034.t:0 "Le feu au bord de l'eau"
 yazd.0034.desc:0 "Selon les anciennes traditions, il est important d'allumer des feux près d'une eau courante, ou au-dessus d'un qanat, l'un des anciens canaux souterrains. Cela vise à s'assurer que, avec l'aide de [ROOT.Char.GetFaith.FertilityGodName], les plantes ne soient pas trop froides ou gelées là-bas - ainsi, l'année prochaine, elles pousseront grandes et abondantes."
 yazd.0034.a:0 "C'est un élément important des cérémonies !"
 yazd.0034.b:0 "Je ne suis pas sûre que cela soit utile, mais je le fais quand même."
 yazd.0035.t:0 "Réflexions"
 yazd.0035.desc:0 "Alors que je me tiens près d'un feu, je réfléchis au fait que Sadeh se situe généralement une cinquantaine de jours avant Nowruz, la nouvelle année. J'ai hâte que la nouvelle année commence, bien sûr, mais elle semble si loin ! La nuit est froide, et qui sait ce que le prochain printemps apportera ?"
 yazd.0035.a:0 "Je me blottis plus près du feu."
 yazd.0036.t:0 "La légende de Hushang"
 yazd.0036.desc:0 "Il existe de nombreux récits contradictoires sur l'origine de Sadeh. L'une des histoires que j'ai entendues raconte qu'il fut célébré après un incident survenu alors que le héros antique du mythe iranien, Hushang, combattait un dragon. Il tenta de lui jeter une pierre, mais il manqua sa cible ; cependant, la pierre en heurta une autre, et comme toutes deux étaient de silex, cela déclencha un feu.\n\nHushang reconnut là l'œuvre de [ROOT.Char.GetFaith.HighGodName], qui lui révéla ainsi le secret du feu, et il voulut célébrer cet événement mémorable. C'est ainsi que naquit Sadeh."
 yazd.0036.a:0 "Je ne sais pas si cela s’est passé ainsi, mais c’est une belle histoire."
 yazd.0036.b:0 "Je crois que la légende dit une part de vérité."
 yazd.0037.t:0 "Poésie de Sadeh"
 yazd.0037.desc:0 "En tant que nuit la plus froide de l'hiver, Sadeh a souvent inspiré de nombreuses personnes à composer des poèmes pour décrire la gloire du feu. Je viens d'écouter trois roturiers réciter leur poésie inspirée par Sadeh.\n\nUn poème compare un feu de joie à une fleur exquise, ou à un arbre, ou à un jardin entier fleurissant dans un paysage hivernal. Le deuxième poème décrit l'événement comme un conflit entre les forces de [ROOT.Char.GetFaith.HighGodName] et de [ROOT.Char.GetFaith.DevilName]. Le dernier poème raconte les origines de Sadeh comme des célébrations de la manière dont des héros iraniens mythologiques des temps anciens, comme Hushang, ont terrassé des monstres redoutables tels que des dragons.\n\nLequel est, à mon avis, le meilleur ?"
 yazd.0037.a:0 "Un joli poème sur le feu et la nature"
 yazd.0037.b:0 "Le poème pieux sur le bien et le mal"
 yazd.0037.c:0 "Le poème épique sur les vieux héros vaillants"
 yazd.0038.t:0 "Festin de Sadeh"
 yazd.0038.desc:0 "Sadeh est souvent l'occasion de faire la fête. Après tout, c'est la période la plus froide de l'année et, outre les feux de joie, la nourriture et les repas pris en commun sont un excellent moyen de se réchauffer. Cette année, la fête de Sadeh est particulièrement succulente, avec des délices tels que de l'agneau et du bœuf rôtis."
 yazd.0038.a:0 "Délicieux!"
 yazd.0039.t:0 "Faire l'aumône aux nécessiteux"
 yazd.0039.desc:0 "Pendant Sadeh, la coutume veut que nous donnions de la nourriture aux moins fortunés le soir, avant que les feux de joie ne soient allumés. Bien sûr, j'ai fait une telle chose pour aider ceux qui étaient dans le besoin et qui avaient faim cette année..."
 yazd.0039.a:0 "En quelque sorte... Je n'en ai donné qu'un peu par courtoisie."
 yazd.0039.b:0 "Je leur ai donné une quantité respectable d'aumônes."
 yazd.0039.c:0 "J'ai été très généreu[ROOT.Char.Custom('FR_XSe')] et j'ai distribué beaucoup de nourriture."
 yazd.0040.t:0 "Un spectacle enflammé"
 yazd.0040.desc:0 "De nos jours, de nombreux rois et seigneurs à travers le plateau iranien ont pratiqué la coutume d'enflammer oiseaux et animaux durant Sadeh. C'est-à-dire que ces bêtes sauvages étaient poussées dans le feu, et les spectateurs mangeaient, buvaient et se réjouissaient en observant l'agitation (de préférence à une distance sécuritaire).\n\nDes érudits pieux et des saintes personnes de toutes les religions - y compris celle de l'Islam #italic et#! du zoroastrisme - ont condamné cette pratique comme cruelle et contraire aux enseignements de leur foi. Cependant... cela #italic pourrait#! être très amusant, si nous le faisions. Devrais-je ordonner qu'un tel spectacle soit organisé cette année ?"
 yazd.0040.a:0 "Si les [ROOT.Char.Custom('DefaultPriestTitlePlural')] disent que c'est cruel et contraire aux enseignements [ROOT.Char.GetFaith.GetAdherentNamePlural], alors renonçons-y."
 yazd.0040.b:0 "Allez, pourquoi ne pas s'amuser un peu ? Voyons des animaux brûler !"
 yazd.0040.info:0 "#emphasis Contexte historique :#! Au cours de la période médiévale, des sources telles que le grand érudit iranien du XIe siècle, al-Biruni, mentionnent que des animaux étaient essentiellement brûlés dans le cadre des célébrations du Sadeh. Certains, comme al-Biruni, ont condamné cette pratique comme étant cruelle et non islamique, et ses homologues zoroastriens semblent partager son point de vue. Néanmoins, il semble que cette coutume ait été populaire parmi les rois iraniens de l'époque. Il est possible que cette pratique ait été non seulement préislamique, mais aussi d'origine non zoroastrienne, mais si c'est le cas, on ne connaît pas son objectif initial."
 yazd.0041.t:0 "Danse"
 yazd.0041.desc:0 "Pendant Sadeh, nous allumons d'immenses feux de joie pour conjurer le froid. Mais nous ne restons pas là à admirer les flammes glorieuses - nous dansons aussi ! Nous formons de grands cercles autour des feux et nous dansons."
 yazd.0041.a:0 "Bien sûr, je me joins aussi à la danse - pourquoi ne le ferais-je pas ?"
 yazd.0041.b:0 "Je décide de m'asseoir et de profiter du bon moment que tout le monde passe."
 yazd.0042.t:0 "Chak-Chak"
 yazd.0042.desc:0 "Au lieu de célébrer Sadeh en ville au milieu des grands feux de joie comme beaucoup le font, j'ai l'occasion de faire quelque chose de plus spirituellement enrichissant pendant cette importante célébration. Comme le veut la coutume dans la région autour de [yazd_county.GetNameNoTier], je me rends à la grotte de Chak-Chak pour y observer Sadeh.\n\nAu moins, le trek n'est pas le pire qui soit. Même si nous devons traverser une partie du désert pour y arriver, ce n'est qu'à environ une journée de voyage.\n\nVoir les falaises de Chak-Chak apparaître à l'horizon est un soulagement pour les yeux fatigués, bien qu'il soit de coutume qu'une fois que l'on voit le temple là-bas, il faut continuer le voyage à pied. De plus, il semble que les villageois locaux se soient déjà préparés pour Sadeh."
 yazd.0042.a:0 "Il est temps de terminer le voyage à pied."
 yazd.0043.t:0 "Eaux bénites"
 yazd.0043.desc:0 "Lors de la célébration de Sadeh à Chak-Chak, de nombreux fidèles profitent de l'occasion pour boire l'eau de la source sacrée qui coule à flots. La légende veut que la source se soit formée à partir des larmes que la montagne a versées en souvenir de la princesse sassanide Nikbanou."
 yazd.0043.a:0 "C'est une bénédiction de siroter ces eaux."
 yazd.0044.t:0 "Le bâton de Nikbanou"
 yazd.0044.desc:0 "Près de la source sacrée de Chak-Chak se dresse un arbre ancien, que l'on dit avoir poussé du bâton de Nikbanou. C'est un spectacle impressionnant et majestueux, qui inspire une profonde révérence."
 yazd.0044.a:0 "Penser qu'il est toujours là après toutes ces années."
 yazd.0045.t:0 "Le feu éternel"
 yazd.0045.desc:0 "Le feu à l'intérieur de la grotte de Chak-Chak brûle depuis des lustres, témoignage non seulement de sa sainteté et de la gloire de [ROOT.Char.GetFaith.HighGodName], mais aussi des [ROOT.Char.Custom('DefaultPriestTitlePlural')] et autres laïcs qui travaillent d'arrache-pied jour et nuit pour s'assurer qu'il continue de brûler. Durant Sadeh, des cérémonies spéciales sont organisées autour de lui, comme celle qui se déroule en ce moment même."
 yazd.0045.a:0 "C'est grâce à eux que je peux voir le feu brûler ici, pendant le Sadeh."
 yazd.0046.t:0 "Bonnes pensées, bonnes paroles, bonnes actions"
 yazd.0046.desc:0 "Alors que je me tiens près du feu éternel de Chak-Chak, participant aux cérémonies du Sadeh, je me rappelle la véritable essence de la foi [ROOT.Char.GetFaith.GetAdjective] : bonnes pensées, bonnes paroles et bonnes actions. Tant que nous pratiquons tous cela, la droiture, la justice et le bonheur seront toujours présents dans ce monde, tout comme le feu devant moi brûlera toujours de manière éclatante."
 yazd.0046.a:0 "Je dois m'en souvenir."
 yazd.0047.t:0 "Dons"
 yazd.0047.desc:0 "Lors de ma visite au temple dans la grotte de Chak-Chak, je remarque les plateaux disposés pour recevoir les dons des pèlerins et des visiteurs comme moi. Ceux-ci sont nécessaires pour aider les [ROOT.Char.Custom('DefaultPriestTitlePlural')] à entretenir ce saint sanctuaire en ces temps incertains. Peut-être devrais-je faire un don pendant que je suis ici ?"
 yazd.0047.a:0 "J'aide déjà les [ROOT.Char.Custom('DefaultPriestTitlePlural')] tout au long de l'année - pourquoi donner davantage ?"
 yazd.0047.b:0 "Oui, je pense qu'une modeste offrande de quelques pièces devrait suffire à cette fin."
 yazd.0047.c:0 "Il serait bon que je fasse un don d'or décent à ce site."
 yazd.0047.d:0 "Gloire à [ROOT.Char.GetFaith.HighGodName] ! Je ferai un grand don."
 yazd.0048.t:0 "xxxxx"
 yazd.0048.desc:0 "xxxxx"
 yazd.0048.a:0 "xxxxx"
 yazd.0049.t:0 "xxxxx"
 yazd.0049.desc:0 "xxxxx"
 yazd.0049.a:0 "xxxxx"
 yazd.0050.t:0 "Trésors antiques de Yazd"
 yazd.0050.desc:0 "Les légendes sur des trésors perdus abondent à [yazd_county.GetNameNoTier], et elles circulent dans la région depuis des générations. S'il faut en croire ces récits, les trésors auraient été enfouis ou dissimulés par d'anciennes dynasties iraniennes au fil des siècles.\n\nBien entendu, rares sont les découvertes de ce type qui ont été confirmées par des personnes dignes de foi. Par exemple, on m'a récemment rapporté la découverte d'un tel trésor sur mes terres à [yazd_county.GetNameNoTier]. Il s'est avéré qu'il s'agissait d'un rapport trompeur."
 yazd.0050.a:0 "Peut-être qu'un jour nous trouverons l'un de ces légendaires trésors perdus."
 yazd.0050.b:0 "Ce folklore ridicule est une perte de temps, mais les gens continuent d'y croire !"
 yazd.0051.t:0 "Contrats de qanat"
 yazd.0051.desc:0 "Les constructeurs de qanats de [yazd_county.GetNameNoTier] sont réputés pour leur savoir-faire dans la construction de qanats depuis de nombreuses années, et ils sont considérés comme parmi les meilleurs du monde iranien. Récemment, un nombre important d'entre eux ont remporté des contrats pour construire des qanats dans d'autres régions. Cela ne fera qu'accroître davantage leur renommée."
 yazd.0051.a:0 "Je me réjouis de leur réussite."
 yazd.0052.t:0 "Érudits et jardiniers"
 yazd.0052.desc:0 "Alors que [yazd_county.GetNameNoTier] continue de croître et d'attirer davantage de personnes instruites et cultivées à s'y installer, beaucoup d'entre elles louent la beauté des jardins de la ville. Nombre des jardins les plus remarquables ont été édifiés en l'honneur de notables du passé qui y vécurent et firent don des fonds nécessaires à leur construction.\n\nAujourd'hui, j'ai visité l'un de ces jardins pour rencontrer quelques érudits locaux, comme il m'arrive parfois de le faire. Tandis que nous nous y détendions, nous avons eu une agréable conversation sur divers sujets."
 yazd.0052.a:0 "Ces érudits m'ont fourni des conseils très éclairants !"
 yazd.0052.b:0 "C’est une formalité ennuyeuse mais nécessaire pour maintenir mon statut."
 yazd.0052.c:0 "La sagesse que j'apprends d'eux me rapproche de [ROOT.Char.GetFaith.HighGodName]."
 yazd.0053.t:0 "Remplacer un temple ?"
 yazd.0053.desc:0 "[yazd_county.GetNameNoTier] fut jadis un centre du culte zoroastrien, aussi la ville compte-t-elle de nombreux temples que la communauté zoroastrienne utilise encore. Cependant, le nombre de [ROOT.Char.GetFaith.GetAdherentNamePlural] n'a cessé de croître à [yazd_county.GetNameNoTier] sous ma direction, et certains d'entre eux m'ont demandé de financer la construction d'un nouveau temple.\n\nPar le passé, il est arrivé que nous remplacions un temple zoroastrien à [yazd_county.GetNameNoTier] par un nouveau temple [ROOT.Char.GetFaith.GetAdherentName], afin de répondre aux besoins spirituels de la communauté [ROOT.Char.GetFaith.GetAdjective] grandissante. J'envisage d'ordonner qu'une telle chose soit faite dès maintenant, mais cela pourrait contrarier les zoroastriens locaux, avec qui nous entretenons une relation tendue mais fonctionnelle."
 yazd.0053.a:0 "Détruisons l'ancien temple en bâtir un nouveau, comme c'est notre droit."
 yazd.0053.b:0 "Nous avons assez de temples; nous devons nous entendre avec nos voisins."
 yazd.0054.t:0 "Un nouveau bâtiment ?"
 yazd.0054.desc:0 "En tant que célèbre #italic Demeure du Culte#!, [yazd_county.GetNameNoTier] est réputée pour la piété de ses habitants, quelle que soit leur religion, et peu importe que cette réputation soit fondée ou non. De nombreux notables qui vivent dans la ville ou y ont des attaches, comme moi-même, trouvent souvent des occasions de financer la construction de divers édifices sacrés.\n\nQuoi qu'il en soit, une telle occasion se présente actuellement à moi. Il y a une partie inoccupée de la ville qui pourrait accueillir un bel édifice répondant aux besoins de la communauté [ROOT.Char.GetFaith.GetAdjective]. Ce ne sera en aucun cas un vaste bâtiment, et il serait probablement assez modeste, mais si je faisais un don pour sa construction, cela pourrait rejaillir favorablement sur moi."
 yazd.0054.a:0 "Y construire [ROOT.Char.GetFaith.HouseOfWorship] pour que les habitants puissent y prier et se recueillir."
 yazd.0054.b:0 "Construisons-y une école afin que les jeunes générations puissent apprendre [ROOT.Char.GetFaith.ReligiousText]."
 yazd.0054.c:0 "Construire un mausolée en mémoire d'un [ROOT.Char.Custom('DefaultPriestTitle')] populaire pour inspirer la population locale."
 yazd.0054.d:0 "Je ne suis pas intéressé[ROOT.Char.Custom('FR_E')] par le parrainage de projets de construction pour le moment."
 yazd.0055.t:0 "Soie de Yazdi"
 yazd.0055.desc:0 "[yazd_county.GetNameNoTier] est, depuis longtemps, l'un des centres régionaux de production de soie en Iran. Bien que cette soie, appelée #italic yazdi#!, ne puisse rivaliser en qualité avec la soie chinoise, elle se vend tout de même à un prix correct et constitue l'une des exportations les plus populaires de la ville.\n\nRécemment, elle est devenue encore plus prisée, peut-être en raison de divers changements dans l'économie ou d'une demande accrue ailleurs. Quoi qu'il en soit, elle apporte aux marchands de la ville des profits encore plus importants."
 yazd.0055.a:0 "C'est une bonne chose ! C'est bon à entendre !"
 yazd.0056.t:0 "Sarv-e Abarkuh"
 yazd.0056.desc:0 "Aujourd'hui, je rends visite en [abarquh_barony.GetNameNoTier] qui n'est pas très loin de [yazd_county.GetNameNoTier]. Un point de repère notable que je croise est le #italic Sarv-e Abarkuh#!, ou le Cyprès d'Abarkuh. L'arbre est très ancien et majestueux, et les zoroastriens locaux affirment que l'arbre a été planté par Zoroastre lui-même il y a des éons."
 yazd.0056.a:0 "Je doute que Zoroastre l'ait planté lui-même, mais c'est un bel arbre."
 yazd.0056.b:0 "Bien que je sois un[ROOT.Char.Custom('FR_E')] [ROOT.Char.Custom('FR_FaithGenderedAdj')], je ressens moi aussi de la crainte en voyant l'arbre."
 yazd.0056.c:0 "C'est un privilège de voir un arbre aussi ancien ! Je vais me détendre un peu."
 yazd.0056.d:0 "En tant que [ROOT.Char.Custom('FR_FaithGenderedAdj')], je ne m'en soucie pas outre mesure."
 yazd.0056.e:0 "C'est un lieu sacré. Je devrais y prier un peu pendant que je suis ici."
 yazd.0057.t:0 "Joyau du désert"
 yazd.0057.desc:0 "J'accueille un dignitaire important à [yazd_county.GetNameNoTier] et lui fais découvrir les merveilles de la ville. Ce qui semble l'impressionner le plus, c'est le grand nombre de qanats et de tours à vent que compte la cité.\n\n« En vérité, [yazd_county.GetNameNoTier] est un joyau du désert », remarque l'homme, « tant elle possède de merveilleuses commodités. »"
 yazd.0057.a:0 "Je suis tout à fait d'accord avec vous. C'est un endroit vraiment charmant !"
 yazd.0057.b:0 "Cela ne serait pas possible sans le travail acharné des habitants. "
 yazd.0058.t:0 "Baklava de Yazd"
 yazd.0058.desc:0 "Depuis des siècles, [yazd_county.GetNameNoTier] est réputé pour fabriquer certains des meilleurs baklavas de tout l'Iran. Je viens d'avoir l'occasion de mettre la main sur des baklavas qui m'ont été offerts par des habitants sous mon règne. Le baklava fabriqué en Iran est un peu plus léger que les baklavas d'autres pays, et son aspect unique est que son sirop est fortement aromatisé à l'eau de rose et à la cardamome."
 yazd.0058.a:0 "Délicieux baklava... si, si délicieux."
 yazd.0059.t:0 "Voyage dans le désert"
 yazd.0059.desc:0 "Aujourd'hui, j'ai dû faire un rapide voyage jusqu'à un village pas trop éloigné de [yazd_county.GetNameNoTier]. Le trajet du retour, cependant, a été un peu rude - [yazd_county.GetNameNoTier] se trouve entre deux déserts, le #italic Dasht-e Kavir#! et le #italic Dasht-e Lut#!, si bien que les étendues sauvages qui entourent la cité sont souvent un lieu brûlant et aride. En sueur et épuisé, quel soulagement lorsque je pénètre enfin dans la ville ! Les jardins, les qanats et les tours à vent de [yazd_county.GetNameNoTier] donnent l'impression d'un véritable paradis revigorant après une longue journée de marche dans le désert."
 yazd.0059.a:0 "Je suis heureu[ROOT.Char.Custom('FR_XSe')] de l'avoir fait !"
