 # Memories
 
 # Activities
 activity_RICE_roman_kalends_host_an_a:0 "des"
 activity_RICE_roman_kalends:0 "Kalendes"
 activity_RICE_roman_kalends_desc:0 "Les Romains de l'Antiquité célébraient l'arrivée du mois de janvier comme le début de la nouvelle année. Cette célébration se poursuit dans de nombreuses communautés de la Méditerranée et du Moyen-Orient."
 activity_RICE_roman_kalends_selection_tooltip: "Célébrez les Kalendes.\n\n$activity_RICE_roman_kalends_context_tooltip$"
 activity_RICE_roman_kalends_context_tooltip:0 "#emphasis Contexte Historique :#! Les Kalendes de janvier étaient la fête traditionnelle du Nouvel An dans la Rome antique. Même après que le début de l'année se soit déplacé vers d'autres dates, cette fête a continué d'être célébrée dans les régions de la Méditerranée et du Moyen-Orient influencées par Byzance. À cette époque, la fête était simplement connue sous le nom de Kalendes, ou Kalandai en grec médiéval, car les autres Kalendes romaines, c'est-à-dire les débuts des autres mois, n'étaient plus célébrées. Alors que les autorités ecclésiastiques byzantines condamnaient les kalendes comme une pratique païenne hérétique, elles sont devenues un symbole de l'identité religieuse chrétienne pour les chrétiens orthodoxes en terre musulmane. Quoi qu'il en soit, d'après les sources byzantines et musulmanes, les kalendes semblent avoir perdu de leur popularité et avoir disparu au 13e ou au 14e siècle."
 activity_RICE_roman_kalends_host_desc:"\n$BULLET_WITH_TAB$#P Gain de #! [prestige_i|E][prestige|E]\n$BULLET_WITH_TAB$Perte de [stress_loss_i|E][stress|E]\n$BULLET_WITH_TAB$Augmentation de l'[opinions|E] des invités de l'organisateur\n$BULLET_WITH_TAB$La [capital|E] du [county|E] obtient le [county_modifier|E] [GetModifier('RICE_kalends_celebrated_modifier').GetNameWithTooltip] pendant #V 5#! ans\n$BULLET_WITH_TAB$#N Perte de #! [piety_i|E][piety|E] sauf si vous choisissez l'[intent|E] $RICE_roman_kalends_devotion_intent$  ou êtes de [faith|E][GetReligionByKey('hellenism_religion').GetAdjective]"
 activity_RICE_roman_kalends_guest_desc: "$activity_RICE_roman_kalends_host_desc$"
 activity_RICE_roman_kalends_province_desc: ""
 activity_RICE_roman_kalends_destination_selection: "$activity_RICE_roman_kalends_province_desc$"
 activity_RICE_roman_kalends_guest_help_text: "$activity_RICE_roman_kalends$"
 activity_RICE_roman_kalends_predicted_cost: "Le coût de cette [activity|E] est principalement basé sur votre [income|E]."
 activity_RICE_roman_kalends_conclusion_desc: "Notre [GetActivityType( 'activity_RICE_roman_kalends' ).GetName] est terminée. Quelle joyeuse occasion !"
 RICE_roman_kalends_celebration_phase: "Célébration"
 RICE_roman_kalends_celebration_phase_desc:"\"Quand les Kalendes arrivent,\" dit le proverbe local, \"restez au chaud et à l'intérieur.\""
 RICE_roman_kalends_festive_intent_header: "Festif :"
 RICE_roman_kalends_festive_intent: "Festif"
 RICE_roman_kalends_festive_intent_desc:"Vous vous lâchez et passez du bon temps. Perdez du [stress_loss_i|E] [stress|E] supplémentaire, et perdez-en encore plus si vous êtes [GetTrait('gregarious').GetName( GetNullCharacter )] ou [GetTrait('gluttonous').GetName( GetNullCharacter )]."
 RICE_roman_kalends_devotion_intent_header: "Dévotion:"
 RICE_roman_kalends_devotion_intent: "Dévotion"
 RICE_roman_kalends_devotion_intent_desc:"Vous renforcez votre identité religieuse. #P Gagnez#! de la [piety_i|E] [piety|E] au lieu d'en perdre. Ceci est #bold doublé#! si un [liege|E] au-dessus de vous suit une [religion|E] différente. Perdez plus de [stress_loss_i|E] [stress|E] si vous êtes [GetTrait('zealous').GetName( GetNullCharacter )] ou [GetTrait('diligent').GetName( GetNullCharacter )]."
 RICE_roman_kalends_generosity_intent_header: "Générosité:"
 RICE_roman_kalends_generosity_intent: "Générosité"
 RICE_roman_kalends_generosity_intent_desc:"Vous vous laissez vraiment porter par l'esprit des cadeaux. #P +100%#! de bonus d'[opinion|E] pour les cadeaux offerts. Perdez plus de [stress_loss_i|E] [stress|E] si vous êtes [GetTrait('generous').GetName( GetNullCharacter )] ou [GetTrait('compassionate').GetName( GetNullCharacter )]."
 RICE_roman_kalends_gift_type: "Cadeaux"
 RICE_roman_kalends_gift_small: "Modestes"
 RICE_roman_kalends_gift_small_desc:"$EFFECT_LIST_BULLET$Gain de [prestige_i|E] #V [EmptyScope.ScriptValue('RICE_roman_kalends_gift_gain_small_base')]#! [prestige|E] de base\n$EFFECT_LIST_BULLET$Chaque [character|E] participant à cette [activity|E] obtient #P 4#! [opinion|E] envers vous\n$EFFECT_LIST_BULLET$Vous-même #italic pourriez#! recevoir des cadeaux allant jusqu'à #V [gold_i|E][GetPlayer.MakeScope.ScriptValue('tiny_gold_value')]#!\n\n#weak Un petit échange de cadeaux suffira cette fois.#!"
 RICE_roman_kalends_gift_medium: "Moyens"
 RICE_roman_kalends_gift_medium_desc: "$EFFECT_LIST_BULLET$Gain de [prestige_i|E] #V [EmptyScope.ScriptValue('RICE_roman_kalends_gift_gain_medium_base')]#! [prestige|E] de base\n$EFFECT_LIST_BULLET$Chaque [character|E] participant à cette [activity|E] obtient #P 8#! [opinion|E] envers vous\n$EFFECT_LIST_BULLET$Vous-même #italic pourriez#! recevoir des cadeaux allant jusqu'à #V [gold_i|E][GetPlayer.MakeScope.ScriptValue('minor_gold_value')]#!\n\n#weak Une occasion festive exige des cadeaux festifs#!"
 RICE_roman_kalends_gift_large: "Importants"
 RICE_roman_kalends_gift_large_desc: "$EFFECT_LIST_BULLET$Gain de [prestige_i|E] #V [EmptyScope.ScriptValue('RICE_roman_kalends_gift_gain_large_base')]#! [prestige|E] de base\n$EFFECT_LIST_BULLET$Chaque [character|E] participant à cette [activity|E] obtient #P 12#! [opinion|E] envers vous\n$EFFECT_LIST_BULLET$Vous-même #italic pourriez#! recevoir des cadeaux allant jusqu'à #V [gold_i|E][GetPlayer.MakeScope.ScriptValue('medium_gold_value')]#!\n\n#weak Je vais vraiment embrasser l'esprit des Kalendes avec de grands cadeaux pour tous !#!"
 RICE_roman_kalends_gift_amount: "Taille des Cadeaux"
 RICE_roman_kalends_completed_log_title:0 "$activity_RICE_roman_kalends$ Fin de l'année"
 RICE_roman_kalends_completed_log:0 "[CHARACTER.GetShortUIName|U] a fini de célébrer les $activity_RICE_roman_kalends$."
 TRAVEL_NAME_FOR_activity_RICE_roman_kalends:0 "[Character.GetFirstNamePossessiveNoTooltip] $activity_RICE_roman_kalends$"
 RICE_decision_kalends_month_requirement:0 "Le mois doit être compris entre Octobre et Novembre"
 RICE_kalends_opinion:0 "Échange de cadeaux des Kalendes"
 activity_RICE_hot_springs_visit_lesbos_thermi_province_desc:0 "\n#P +++ Les [hot_springs|E] de Thermi sur [GetTitleByKey('c_lesbos').GetNameNoTier] sont des [hot_springs|E] uniques.#!\n\n#italic Cela vous permettra d'obtenir le [character_modifier|E] [GetModifier('RICE_lesbos_visit_thermi_normal').GetNameWithTooltip]. Si vous suivez une [faith|E] [GetReligionByKey('hellenism_religion').GetAdjective], vous obtiendrez le [modifier|E] [GetModifier('RICE_lesbos_visit_thermi_artemis').GetNameWithTooltip] à la place, et vous gagnerez également un bonus de [piety_i|E] [piety|E].#!"
 
 # Modifiers
 RICE_pirate_mediterranean_connections_modifier:0 "Connexions avec les pirates méditerranéens"
 RICE_pirate_mediterranean_connections_modifier_desc:0 "Ce personnage a des connexions avec certains groupes de pirates en Méditerranée.\n\n#EMP Débloque diverses options depuis la [decision|E] vers $RICE_pirate_mediterranean_decision$.#!"
 RICE_kalends_celebrated_modifier:0 "Célébration récente des Kalendes"
 RICE_lesbos_mediterranean_pirate_infestation:0 "Infestation de pirates"
 RICE_lesbos_mediterranean_infestation_desc:0 "Les dirigeants régionaux ont commencé à s'ouvrir aux pirates locaux pour coopérer en vue d'un gain mutuel en matière de raids et de commerce, en leur permettant d'établir une base permanente sur ces terres. Toutefois, il faudra un certain temps aux chefs pirates pour contrôler leurs compatriotes et les intégrer dans les communautés voisines et les structures de pouvoir locales."
 RICE_lesbos_recently_fortified_aegean:0 "Territoires Égéens récemment fortifiés"
 RICE_mediterranean_pirate_sales:0 "Marchés pirates méditerranéens"
 RICE_mediterranean_pirate_sales_desc:0 "Les dirigeants locaux ont permis aux pirates (ou du moins à ceux avec lesquels ils entretiennent une relation de travail) de vendre leurs marchandises, qu'elles soient mal acquises ou non, dans cette région. Après tout, de nombreux \" pirates \" sont aussi des marchands, ou, en d'autres termes, de nombreux marchands se livrent à la piraterie en parallèle."
 RICE_ransomed_pirate_prisoners:0 "Captifs pirates rançonnés"
 RICE_ransomed_pirate_prisoners_desc:0 "Les dirigeants locaux ont récemment utilisé leurs réseaux pour demander une rançon à un certain nombre de personnes vivant ici et qui avaient été capturées à la suite de divers actes de piraterie et de raids."
 RICE_kalends_dressed_up_as_animal:0 "Déguisé en animal durant les Kalendes"
 RICE_kalends_dressed_up_as_animal_desc:0 "Lors d'une récente célébration des #italic Kalendes#!, ce personnage a participé à une mascarade où il s'est déguisé en une sorte d'animal."
 RICE_kalends_crossdressed:0 "S'est travesti pendant les Kalendes"
 RICE_kalends_crossdressed_desc:0 "Lors d'une récente célébration des #italic Kalends#!, ce personnage s'est habillé avec les vêtements et le style du sexe opposé."
 RICE_lesbos_sick_from_kalends_feasting:0 "Excès de festin durant les Kalendes"
 RICE_lesbos_sick_from_kalends_feasting_desc:0 "Lors d'une récente célébration des #italic Kalendes#!, ce personnage a mangé et bien trop bu, ce qui l'a rendu malade."
 RICE_roman_kalends_modifier:0 "Kalendes célébrées"
 RICE_lesbos_thinking_about_hephaestus_legends:0 "Réflexion sur les légendes d'Héphaïstos"
 RICE_lesbos_wine_modifier:0 "Vin de Lesbos"
 RICE_lesbos_likes_sappho:0 "Inspiré[ROOT.Char.Custom('FR_E')] par Sappho"
 RICE_lesbos_likes_terpander:0 "Inspiré[ROOT.Char.Custom('FR_E')] par Terpander"
 RICE_lesbos_likes_alcaeus:0 "Inspiré[ROOT.Char.Custom('FR_E')] par Alcaeus"
 RICE_lesbos_sappho_duplication:0 "Théorie des deux Sappho"
 RICE_lesbos_sappho_duplication_desc:0 "Il y a controverse sur la véritable histoire de la célèbre poétesse Sappho de l'île de Lesbos, étant donné les légendes sur Sappho en tant que poétesse et Sappho en tant que prostituée. Ce personnage croit à la théorie qui réconcilie cette divergence en proposant qu'il y avait deux Sappho, l'une la poétesse et l'autre la prostituée ; selon cette logique, la poétesse devait être trop éloquente pour être une femme vulgaire."
 RICE_lesbos_sappho_narrativisation:0 "Théorie de l'Amélioration de Sappho"
 RICE_lesbos_sappho_narrativisation_desc:0 "Il existe une controverse sur l'histoire réelle derrière la célèbre poétesse Sappho de l'île de Lesbos, étant donné les légendes sur Sappho en tant que poétesse et Sappho en tant que prostituée. Ce personnage croit en la théorie qui réconcilie cette divergence en proposant que Sappho était à l'origine une femme vulgaire qui s'est améliorée au fil du temps pour devenir plus éloquente - cela fait au moins une meilleure histoire."
 RICE_lesbos_studying_aristotle_biology:0 "Révision des études d'Aristote sur la biologie"
 RICE_lesbos_visit_thermi_artemis:0 "A visité Thermi à Lesbos"
 RICE_lesbos_visit_thermi_artemis_desc:0 "Ce personnage s'est récemment rendu sur l'île de Lesbos pour visiter les sources d'eau chaude de Thermi et s'y détendre. Elles sont connues pour leurs vertus curatives et sont considérées comme un site sacré pour la déesse Artémis."
 RICE_lesbos_visit_thermi_normal:0 "$RICE_lesbos_visit_thermi_artemis$"
 RICE_lesbos_visit_thermi_normal_desc:0 "Ce personnage s'est récemment rendu sur l'île de Lesbos pour visiter et se détendre aux sources thermales de Thermi, connues pour leurs vertus curatives."
 RICE_indian_ocean_pirate_infestation_2:0 "$RICE_socotra_pirate_infestation$"
 RICE_indian_ocean_pirate_infestation_2_desc:0 "Les dirigeants locaux sont revenus sur les accords passés avec les pirates actifs dans cette région. Cette situation a provoqué un chaos à court terme, car il reste de nombreux pirates ou anciens pirates qui étaient auparavant intégrés dans les institutions commerciales et politiques locales."
 RICE_mediterranean_reneged_pirate_deals:0 "Accords rompus avec les pirates méditerranéens"
 RICE_mediterranean_reneged_pirate_deals_desc:0 "#EMP Empêche certaines [decisions|E] liées aux [mediterranean_pirates|E] d'être prises.#!"
 
 # Struggle Ending Decisions 
 
 # Decisions
 RICE_pirate_mediterranean_decision:0 "Contacter les pirates méditerranéens"
 RICE_pirate_mediterranean_decision_tooltip:0 "Les pirates ne sont pas toujours des ennemis - parfois, souvent, ils peuvent être des amis, ou du moins des outils utiles !"
 RICE_pirate_mediterranean_decision_desc:0 "La [GetGeographicalRegion('RICE_mediterranean_region').GetName] a toujours été le foyer de pirates. Les [rulers|E] habiles savent quand collaborer avec des pirates coopératifs pour un gain mutuel."
 RICE_pirate_mediterranean_decision_confirm:0 "Les pirates peuvent être un atout pour nous."
 RICE_pirate_mediterranean_decision_requirement_1:0 "Possède un [county|E] avec un #V Repaire de Pirates Méditerranéens#! ou avoir le [character_modifier|E] [GetModifier('RICE_pirate_mediterranean_connections_modifier').GetNameWithTooltip]"
 RICE_NOT_pirate_mediterranean_decision_requirement_1:0 "Vous ne possédez #bold pas#! de [county|E] avec un #V Repaire de Pirates#! ou n'avez pas le [character_modifier|E] [GetModifier('RICE_pirate_mediterranean_connections_modifier').GetNameWithTooltip]"
 RICE_pirate_mediterranean_decision_context_tooltip:0 "$RICE_socotra_collaborate_with_pirates_context_tooltip$"
 RICE_PIRATE_PICK_ACTION_TYPE:0 "Nous partageons certainement des intérêts communs..."
 RICE_pirate_establish_relations_name: "Établir des relations"
 RICE_pirate_establish_relations_desc: "$RICE_pirate_establish_relations_name$"
 RICE_pirate_establish_relations_tooltip: "#italic Si nous voulons nous associer aux pirates, nous devons d'abord être en communication régulière avec eux.#!"
 RICE_pirate_establish_relations_effect_tooltip_1:"Vous aurez désormais accès aux autres options de la [decision|E] pour $RICE_pirate_mediterranean_decision$"
 RICE_pirate_acquire_booty_name:"Acquérir du Butin"
 RICE_pirate_acquire_booty_desc: "$RICE_pirate_acquire_booty_name$"
 RICE_pirate_acquire_booty_tooltip: "#italic Nous avons droit à une partie du butin saisi par les pirates avec lesquels nous travaillons.#!"
 RICE_pirate_acquire_booty_effect_tooltip_1:"Vous recevrez un montant aléatoire d'[gold|E] entre #V [gold_i|E][GetPlayer.MakeScope.ScriptValue('RICE_pirate_booty_min_value')|0]#! et #V [gold_i|E][GetPlayer.MakeScope.ScriptValue('RICE_pirate_booty_max_value')|0]#!"
 RICE_pirate_acquire_booty_effect_tooltip_2:"Les montants minimum et maximum d'[gold_i|E] [gold|E] que vous pouvez obtenir sont influencés par votre [diplomacy_i|E] [diplomacy|E], votre [stewardship_i|E] [stewardship|E] et votre [intrigue_i|E] [intrigue|E]"
 RICE_pirate_authorize_sales_name:"Autoriser le recel"
 RICE_pirate_authorize_sales_desc: "$RICE_pirate_authorize_sales_name$"
 RICE_pirate_authorize_sales_tooltip: "#italic Les pirates avec lesquels nous travaillons devraient vendre leur butin pour stimuler l'économie locale.#!"
 #RICE_pirate_authorize_sales_effect_tooltip_1: "xxxxx"
 RICE_pirate_recruit_pirates_name: "Recruter des Corsaires"
 RICE_pirate_recruit_pirates_desc: "$RICE_pirate_recruit_pirates_name$"
 RICE_pirate_recruit_pirates_tooltip: "#italic Grâce à leur expérience du combat, les pirates avec lesquels nous travaillons pourraient faire d'excellents soldats.#!"
 RICE_pirate_recruit_pirates_effect_tooltip_1: "Vous recevrez un nombre aléatoire de #V 200#! à #V 500#! [special_troops|E], y compris quelques [men_at_arms|E]"
 RICE_pirate_ransom_prisoners_name:"Rançonner les Captifs"
 RICE_pirate_ransom_prisoners_desc: "$RICE_pirate_ransom_prisoners_name$"
 RICE_pirate_ransom_prisoners_tooltip: "#italic Nous pouvons utiliser notre réseau de pirates pour localiser et ramener chez eux nos sujets captifs d'autres pirates... moyennant un certain prix, bien sûr.#!"
