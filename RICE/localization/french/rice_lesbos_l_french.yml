 RICE_mediterranean_collaborate_with_pirates:0 "Collaborer avec les pirates méditerranéens"
 RICE_mediterranean_collaborate_with_pirates_tooltip:0 "Vous négociez avec [mediterranean_local_pirates|E] et les autorisez à maintenir une base d'opérations sur votre territoire en échange d'une part de ses profits et d'une promesse de ne pas persécuter les marchands sous votre protection."
 RICE_mediterranean_collaborate_with_pirates_desc:0 "Pourquoi combattre ces [mediterranean_pirates|E] quand vous pouvez travailler ensemble pour tirer profit de vos ennemis communs ?"
 RICE_mediterranean_collaborate_with_pirates_effect_tooltip_1:0 "$RICE_socotra_collaborate_with_pirates_effect_tooltip$"
 RICE_mediterranean_collaborate_with_pirates_effect_tooltip_2:0 "Les [rulers|E] qui possèdent des [counties|E] avec un #V Repaire de pirates#! ont un accès permanent à toutes les options de la [decision|E] Collaborer avec les pirates, selon lazone maritime dans laquelle ils se trouvent"
 RICE_mediterranean_collaborate_with_pirates_confirm:0 "Négocions pour notre bénéfice mutuel !"
 RICE_mediterranean_collaborate_with_pirates_requirement_1:0 "La capitale est côtière et en Méditerranée et n'a pas d'autres [special_buildings|E]"
 RICE_mediterranean_collaborate_with_pirates_requirement_2:0 "Votre [dynasty|E] a débloqué l'[dynasty_perk|E] [GetDynastyPerk('RICE_mediterranean_indian_ocean_legacy_3').GetName]"
 RICE_mediterranean_collaborate_with_pirates_requirement_3:0 "$RICE_socotra_collaborate_with_pirates_requirement_3$"
 RICE_mediterranean_collaborate_with_pirates_context_tooltip:0 "$RICE_socotra_collaborate_with_pirates_context_tooltip$"
 RICE_lesbos_fortify_aegean_decision:0 "Fortifier les territoires Égéens"
 RICE_lesbos_fortify_aegean_decision_tooltip:0 "La [GetGeographicalRegion('RICE_aegean_region').GetName] est un endroit dangereux !"
 RICE_lesbos_fortify_aegean_decision_desc:0 "Avec ses myriades d'îles, de criques et de péninsules, la [GetGeographicalRegion('RICE_aegean_region').GetName] est un endroit dangereux. En mettant de côté les dangers des tempêtes et des naufrages, la piraterie et les [raids|E] militaires sont toujours une menace. Pour neutraliser l'efficacité de telles attaques, nous devrions fortifier nos territoires dans cette région."
 RICE_lesbos_fortify_aegean_decision_effect_tooltip_1:0 "Le coût en [gold_i|E] [gold|E] et en [prestige_i|E] [prestige|E] de cette [decision|E] dépend du nombre de [counties|E] côtiers que vous possédez dans la région de la [GetGeographicalRegion('RICE_aegean_region').GetName]"
 RICE_lesbos_fortify_aegean_decision_confirm:0 "La [GetGeographicalRegion('RICE_aegean_region').GetNameNoTooltip] sera plus sûre !"
 RICE_lesbos_fortify_aegean_decision_context_tooltip:0 "#emphasis Contexte historique :#! Depuis l'Antiquité, la [GetGeographicalRegion('RICE_aegean_region').GetNameNoTooltip] a attiré une piraterie fréquente, des raids maritimes et des guerres navales en raison de sa position géographique stratégique. Par exemple, un jeune Jules César fut capturé par des pirates en mer Égée ; il leur promit \" en plaisantant \" qu'ils seraient crucifiés après le paiement de sa rançon, et il captura et tua effectivement ces pirates par la suite. Au fil des siècles, les peuples de la région développèrent différents moyens de se protéger contre de telles attaques."
 RICE_mediterranean_renege_on_pirate_collaboration:0 "Renier la collaboration des pirates méditerranéens"
 RICE_mediterranean_renege_on_pirate_collaboration_tooltip:0 "Vous annulerez les accords que vous avez avec les [mediterranean_local_pirates|E] et leur interdirez de maintenir toute base d'opérations sur votre territoire."
 RICE_mediterranean_renege_on_pirate_collaboration_desc:0 "Ces [mediterranean_local_pirates|E] causent plus de problèmes qu'ils n'en valent la peine. Beaucoup sont des marchands, beaucoup sont aussi des gens de mauvaise réputation, et il est temps que nous nous détachions de leur chaos."
 RICE_mediterranean_renege_on_pirate_collaboration_effect_tooltip_1:0 "Tous les [counties|E] que vous possédez avec le [special_building|E] #V $building_type_RICE_mediterranean_pirate_den_01$#! verront ces [buildings|E] supprimés"
 RICE_mediterranean_renege_on_pirate_collaboration_effect_tooltip_2:0 "Le coût en [gold_i|E] [gold|E] et en [prestige_i|E] [prestige|E] pour ce faire, ainsi que la [legitimacy_i|E] [legitimacy|E] que vous gagnez, dépendent du nombre de ces [buildings|E] dans les [counties|E] que vous possédez et de leur niveau, ainsi que de vos [skills|E] de [diplomacy_i|E] [diplomacy|E], de [martial_i|E] [martial|E] et d'[intrigue_i|E] [intrigue|E]"
 RICE_mediterranean_renege_on_pirate_collaboration_effect_tooltip_3:0 "@warning_icon! #X En raison des limitations du jeu, cela ne supprimera pas l'emplacement [special_building|E] de ces [buildings|E]#!"
 RICE_every_county_with_mediterranean_pirate_building_tt:0 "Chaque [county|E] avec un [special_building|E] #V $building_type_RICE_mediterranean_pirate_den_01$#!"
 RICE_mediterranean_renege_on_pirate_collaboration_confirm:0 "Ils n'apprécieront pas, mais nous devons le faire"
 RICE_mediterranean_renege_on_pirate_collaboration_req:0 "Posséder un [county|E] avec le [special_building|E] #V $building_type_RICE_mediterranean_pirate_den_01$#!"
