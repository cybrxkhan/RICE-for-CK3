 lesbos.0010.t:0 "Fortifier la [GetGeographicalRegion('RICE_aegean_region').GetNameNoTooltip]"
 lesbos.0010.desc:0 "La [GetGeographicalRegion('RICE_aegean_region').GetName] est située dans une région stratégique le long de la Méditerranée. En tant que telle, elle facilite les voyages à des fins commerciales, diplomatiques et de déplacement, mais aussi, malheureusement, les raids de nos ennemis et la piraterie de pirates avec lesquels nous ne sommes pas alliés.\n\nAfin de combattre de telles menaces maritimes, j'ai mis de côté certaines ressources pour renforcer les défenses de mes territoires dans la [GetGeographicalRegion('RICE_aegean_region').GetNameNoTooltip]. Cela impliquera une variété de tâches, comme la construction de nouvelles fortifications ou le renforcement de celles existantes, la construction de tours de guet pour signaler l'arrivée de navires, l'entraînement des habitants aux tactiques défensives, et le déplacement des colonies vulnérables vers des emplacements plus sûrs."
 lesbos.0010.a:0 "Nous défendrons ici nos terres côtières."
 lesbos.0011.t:0 "À Thermi !"
 lesbos.0011.desc:0 "Il existe de nombreuses sources chaudes dans la région de la [GetGeographicalRegion('RICE_aegean_region').GetName] connues depuis l'Antiquité, et l'une des plus remarquables se trouve dans la localité (au nom approprié) de Thermi sur [GetTitleByKey('c_lesbos').GetNameNoTier].\n\nOn raconte que les anciens avaient coutume de vénérer la déesse [GetReligionByKey('hellenism_religion').GetAdjective] Artémis ici également. Quoi qu'il en soit, encore de nos jours, ces sources chaudes jouissent d'une certaine renommée parmi les habitants locaux pour leurs propriétés curatives."
 lesbos.0011.a:0 "Ce sera une visite agréable et utile."
 lesbos.0012.t:0 "Les Sources Chaudes de Thermi"
 lesbos.0012.desc:0 "Je suis enfin arrivé aux sources chaudes de Thermi à [GetTitleByKey('c_lesbos').GetNameNoTier] ! Thermi est une ville relativement humble et endormie près de la côte, un lieu propice à un voyage relaxant aux sources chaudes.\n\nAlors que je me prélasse dans les eaux, j'ai remarqué quelques petites ruines anciennes sur le chemin - peut-être sont-elles les vestiges d'anciens sanctuaires."
 lesbos.0012.desc.hellenic_pagan:0 "\n\nBien sûr, je suis bien conscient[ROOT.Char.Custom('FR_E')] que cet endroit fut autrefois un centre de culte dédié à la déesse Artémis, étant donné que ces sources lui sont sacrées. En tant que fidèle [ROOT.Char.GetFaith.GetName], je ne peux qu'adresser une prière à #bold Artémis Thermia#!, elle qui nous protège en tant que chasseresse et nous guérit à travers ces sources."
 lesbos.0012.a:0 "Quoi qu'il en soit, je suis content[ROOT.Char.Custom('FR_E')] d'avoir pu venir ici !"
