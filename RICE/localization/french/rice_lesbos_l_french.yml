 lesbos.0020.t:0 "Préparations"
 lesbos.0020.desc:0 "Ce sera bientôt janvier, et cela signifie qu'il sera temps de célébrer les #italic Kalendes#! (ou #italic Kalendes de janvier#!, comme on les appelait à l'époque des anciens Romains. En ces temps-là, elles marquaient le début de la nouvelle année.\n\nCette fois, je ne manquerai pas de prendre part aux festivités moi aussi. Ce sera peut-être un tantinet agité, mais d'un autre côté, c'est aussi une saison de cadeaux et de partage de joie et de bonheur, surtout pendant les mois les plus froids."
 lesbos.0020.a:0 "Préparons-nous à une grande célébration !"
 lesbos.0021.t:0 "Les Festivités Commencent"
 lesbos.0021.desc:0 "Les #italic Kalendes#! sont arrivées !\n\nDurant les froids mois d'hiver, depuis l'époque des anciens Romains, tout le monde - riches et pauvres, hommes et femmes, jeunes et vieux - se rassemble ainsi pour festoyer, se régaler de mets délicieux et de boissons, et s'offrir des cadeaux. Ma résidence est emplie de la lueur des lumières, et même d'ici nous pouvons entendre les acclamations des fêtards alentour."
 lesbos.0021.a:0 "Venez, oui, faisons la fête !"
 lesbos.0022.t:0 "Les Festivités Prennent Fin"
 lesbos.0022.desc:0 "Les #italic Kalendes#! sont arrivées à leur fin, et tout le bruit tapageur et la liesse autour de nous s'estompent, tandis que la vie normale reprend ses droits.\n\nCe fut une joyeuse occasion, comme toujours, et on ne peut qu'espérer pouvoir la célébrer à nouveau dans un an."
 lesbos.0022.a:0 "Retour aux luttes de la vie quotidienne !"
 lesbos.0023.t:0 "Échange de présents"
 lesbos.0023.desc:0 "C'est une coutume bien établie que durant les #italic Kalendes#!, nous nous offrons mutuellement des cadeaux. Cet échange de présents est l'un des moments forts importants de la fête.\n\nJ'ai, bien entendu, fait ma part et obtenu quelques présents pour ma maisonnée et mes associés. Eux, en retour, ont fait de même pour moi."
 lesbos.0023.a:0 "Quels beaux cadeaux nous avons échangés cette année !"
 lesbos.0024.t:0 "xxxxx"
 lesbos.0024.desc:0 "xxxxx"
 lesbos.0024.a:0 "xxxxx"
 lesbos.0025.t:0 "Désapprobation [ROOT.Char.Custom('DefaultPriestTitlePlural')]"
 lesbos.0025.desc:0 "Bien que beaucoup trouvent les #italic Kalendes#! une occasion amusante et agréable, tout le monde ne partage pas cet avis.\n\n[ROOT.Char.GetFaith.GetAdjective] [ROOT.Char.Custom('DefaultPriestTitlePlural')], par exemple, ont traditionnellement été critiques de ce qu'ils considèrent comme une fête païenne, une relique du passé sombre dont nous devrions nous débarrasser, car elle obscurcit notre jugement et insulte [ROOT.Char.GetFaith.HighGodName].\n\nTout le monde ne prête pas attention à ces rabat-joie, mais [chaplain.GetCouncilTitle] [chaplain.GetTitledFirstName] s'est montré[chaplain.Custom('FR_E')] particulièrement virulent[chaplain.Custom('FR_E')] quant à sa désapprobation des festivités dernièrement."
 lesbos.0025.a:0 "Lui ordonner de ne pas prendre les choses si sérieusement"
 lesbos.0025.b:0 "Dites-lui que je me modérerai à l'avenir"
 lesbos.0026.t:0 "Sous le joug païen"
 lesbos.0026.desc:0 "Malgré la gaieté des #italic Kalendes#!, c'est aussi une occasion religieuse importante - du moins pour de dévots [ROOT.Char.GetFaith.GetAdherentNamePlural] comme nous vivant sous le règne d'un certain [liege.GetTitleAsNameNoTooltip] [liege.GetFaith.GetAdjective] comme [liege.GetFirstName], par exemple.\n\nC'est à travers cette occasion festive que nous pouvons renforcer notre dévouement envers nos croyances et coutumes ancestrales, et personne, pas même [liege.GetTitledFirstNameNoTooltip] ne peut nous arracher la fierté que nous ressentons lorsque nous célébrons les #italic Kalendes#!. Ainsi, j'ai pris le temps de me rendre dans une [ROOT.Char.GetFaith.HouseOfWorship] local pour offrir des prières à [ROOT.Char.GetFaith.HighGodName] aujourd'hui entre les festivités."
 lesbos.0026.a:0 "Nous sommes de fidèles [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip], même pendant les #italic Kalendes#!."
 lesbos.0027.t:0 "Festin et Boisson"
 lesbos.0027.desc:0 "Une grande partie des #italic Kalendes#! consiste en festins et boissons ! Cette année ne fait pas exception, et mes serviteurs ont préparé un splendide et fabuleux repas composé de toutes sortes de délices culinaires [ROOT.Char.GetCulture.GetName] !\n\nEn toute honnêteté, il arrive parfois que certains se réjouissent davantage du festin que du reste de cette fête."
 lesbos.0027.a:0 "Je ne les blâme pas ! Allez-y, tout le monde !"
 lesbos.0027.b:0 "Bien que ce soit un jour férié, je n'en ferai pas trop."
 lesbos.0028.t:0 "La Mascarade"
 lesbos.0028.desc:0 "Nous entendons un grand vacarme à l'extérieur et jetons un coup d'œil pour voir ce qui se passe. Il s'avère qu'il s'agit d'une foule de fêtards organisant une mascarade, avec des hommes déguisés en femmes, des femmes déguisées en hommes, et d'autres déguisés en animaux.\n\nTout le monde dans ce groupe ne semble pas être déguisé, mais ils ont l'air de bien s'amuser."
 lesbos.0028.a:0 "Pourquoi ne pas participer à leur petite parade ?"
 lesbos.0028.b:0 "Je veux me déguiser en quelque chose d'audacieux !"
 lesbos.0028.c:0 "Nous pouvons observer la mascarade d'ici."
 lesbos.0029.t:0 "Cantique des enfants"
 lesbos.0029.desc:0 "La voix des enfants chantant des cantiques dehors est impossible à confondre. "Kalendes ! Kalendes !" chantent-ils, comme une mélopée envoûtante.\n\nChaque fois que de tels enfants se présentent, il est important que nous leur donnions quelques sucreries ou un peu d'or, car telle est l'ancienne coutume durant les #italic Kalendes#!.\n\nMes serviteurs ouvrent la porte, et les voix mélodieuses des jeunes gens emplissent nos oreilles. Une fois le chant terminé, mes serviteurs se tournent vers moi pour que je leur donne la permission d'offrir aux enfants des sucreries et de l'argent."
 lesbos.0029.a:0 "N'hésitez pas à donner des bonbons aux plus petits."
 lesbos.0029.b:0 "Ces adorables enfants méritent un généreux cadeau !"
 lesbos.0029.c:0 "Nous ne faisons pas la charité ici - au revoir, les enfants !"
 lesbos.0030.t:0 "En faire trop"
 lesbos.0030.desc:0 "Il n'est pas inhabituel que des gens consomment un peu trop durant les #italic Kalendes#!.\n\n[eater.GetTitledFirstName], hélas, est tombé[eater.Custom('FR_E')] victime de ce problème. Durant le banquet de fête, [eater.GetSheHe] a mangé et bu bien trop.\n\nCependant, [eater.GetFirstNameNoTooltip] ne veut pas manquer le reste des célébrations !"
 lesbos.0030.a:0 "Vous devriez vous reposer, [eater.GetFirstNameNoTooltip]."
 lesbos.0031.t:0 "Contemplations"
 lesbos.0031.desc:0 "L'échange de cadeaux est une part importante des #italic Kalendes#!, mais cela signifie aussi qu'il y a beaucoup de discussions à ce sujet.\n\nC'est-à-dire que certains disent qu'il n'y a pas assez de cadeaux, et que cela gâche la fête. D'autres disent qu'il y a trop de cadeaux, et que cela ruine également la fête. D'autres encore s'inquiètent de savoir s'ils recevront des cadeaux adéquats de la part des autres."
 lesbos.0031.a:0 "Ce n'est pas le cadeau mais l'intention qui compte !"
 lesbos.0031.b:0 "Les gens doivent prendre plus au sérieux le fait d'offrir des cadeaux."
 lesbos.0032.t:0 "Faire la fête"
 lesbos.0032.desc:0 "Nous avons décidé d'aller en ville pendant les #italic Kalendes#!. Pourquoi ? Pour faire la fête, bien sûr !\n\nDe grandes foules se sont rassemblées pour se divertir, et l'air est plein d'excitation et d'énergie. Certes, les choses pourraient devenir un peu agitées, mais c'est pour le plaisir !"
 lesbos.0032.a:0 "Je ferais mieux de faire la fête avec tout le monde."
 lesbos.0032.b:0 "Je me contenterai d'observer à distance."
 lesbos.0033.t:0 "Mélange des Classes"
 lesbos.0033.desc:0 "Festoyer durant les #italic Kalendes#! est une évidence, mais une chose qui distingue ces festins des autres festins tenus durant l'année est que les serviteurs et les esclaves se joignent à leurs maîtres et maîtresses pour le festin, comme s'ils étaient leurs égaux.\n\nDîner avec ses inférieurs n'est pas l'expérience la plus désagréable pour certains, car ils apprennent à mieux connaître leurs serviteurs et esclaves dans un esprit de charité. D'autres en revanche n'apprécient guère une telle chose, ne souhaitant pas se mêler à des gens de si basse condition."
 lesbos.0033.a:0 "C'est une pratique amusante et réfléchie."
 lesbos.0033.b:0 "Je n'aime pas devoir dîner avec mes inférieurs."
 lesbos.0034.t:0 "Étrangers"
 lesbos.0034.desc:0 "Je connais quelques marchands et voyageurs étrangers séjournant à proximité. Bien que leur peuple ne célèbre pas traditionnellement les #italic Kalendes#!, il n'est pas rare que nous invitions ces étrangers à se joindre à nous pour nos célébrations.\n\nCertains étrangers voient cette fête comme une occasion offensante et vulgaire, avertissant les leurs de rester à l'écart de nos célébrations et réjouissances \" inappropriées \". D'autres, cependant, ne voient pas d'inconvénient à participer aux festivités.\n\nDevrais-je peut-être inviter les étrangers à se joindre à nous ?"
 lesbos.0034.a:0 "Bien entendu, plus on est nombreux, plus on rit ! Plus on est de fous, plus on rit !"
 lesbos.0034.b:0 "Ils ne seraient probablement pas intéressés."
