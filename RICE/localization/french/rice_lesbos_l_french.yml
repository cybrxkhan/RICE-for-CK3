l_french:


 # Misc
 dynn_RICE_pisa:0 "Pisa"
 dynn_RICE_seth:0 "Seth"
 Trapelicino:0 "Trapelicino"
 BOOKMARK_RELATION_FORMER_EMPLOYER:0 "(Ancien employeur)"
 innovation_RICE_dragomans:0 "Dragomans"
 innovation_RICE_dragomans_desc:0 "La Méditerranée est une arène où se côtoient des peuples, des cultures et des religions très différents. Les interprètes officiels qualifiés, appelés Dragomans, ne sont pas seulement de simples traducteurs ; ils utilisent leurs connaissances culturelles et leur réputation pour faciliter le commerce international et la politique."
 RICE_mediterranean_pirate_legitimacy_desc:0 "Diminue les pertes de [legitimacy_i|E] [legitimacy|E] et augmente les gains de [legitimacy_i|E] [legitimacy|E] lors de la prise de la [decision|E] de Contacter les [mediterranean_pirates|E]"
 RICE_indian_ocean_pirate_cooldown_desc:0 "Le temps d'attente pour pouvoir à nouveau prendre la [decision|E] de Contacter les [indian_ocean_pirates|E] est réduit de 5 à #V 4#! ans"
 RICE_aegean_region:0 "Mer Égée"
 RICE_every_coastal_county_in_aegean:0 "Chaque [county|E] côtier que vous possédez en [GetGeographicalRegion('RICE_aegean_region').GetName]"
 RICE_every_coastal_county_in_mediterranean:0 "Chaque [county|E] que vous possédez en [GetGeographicalRegion('RICE_mediterranean_region').GetName]"
 RICE_mediterranean_pirate_spawn_event_troops:0 "Pirates méditerranéens"
 RICE_aegean_region_geographical_req:0 "Possède un [county|E] dans la [region|E] [GetGeographicalRegion('RICE_aegean_region').GetName]"
 
 # Game Concepts
 game_concept_mediterranean_pirate:0 "Pirate Méditerranéen"
 game_concept_mediterranean_pirates:0 "Pirates Méditerranéens"
 game_concept_RICE_pirate:0 "Pirate"
 game_concept_RICE_pirates:0 "Pirates"
 game_concept_RICE_pirate_desc:0 "Les pirates sont représentés de plusieurs manières dans RICE, comme les [special_buildings|E] et les [decisions|E]. Les [rulers|E] en Méditerranée et dans l'océan Indien peuvent interagir avec les [mediterranean_pirates|E] et les [indian_ocean_pirates|E] respectivement si certaines conditions sont remplies."
 game_concept_mediterranean_local_pirate:0 "Pirate local"
 game_concept_mediterranean_local_pirates:0 "Pirates locaux"
 game_concept_mediterranean_pirate_desc:0 "Les [RICE_pirates|E] et corsaires de la Méditerranée sont représentés de plusieurs manières différentes dans le jeu. Premièrement, les dirigeants qui remplissent certaines conditions le long de la Méditerranée peuvent prendre une [decision|E] pour construire un [special_building|E] appelé $building_type_RICE_mediterranean_pirate_den_01$. Il offre un certain nombre de bonus militaires et économiques, et quelques [counties|E] possèdent même déjà ce bâtiment en place au début du jeu, généralement ceux qui étaient historiquement célèbres pour avoir hébergé des pirates ou travaillé avec eux, comme les Républiques italiennes.\n\nIl existe également une [decision|E] pour $RICE_pirate_mediterranean_decision$ avec plusieurs options. La plupart des options sont débloquées en possédant un $building_type_RICE_mediterranean_pirate_den_01$ sur votre territoire, ou le [modifier|E] $RICE_pirate_mediterranean_connections_modifier$, qui est obtenu grâce à l'option $RICE_pirate_establish_relations_name$ de la [decision|E] susmentionnée."
 
