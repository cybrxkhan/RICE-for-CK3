 lesbos.0050.t:0 "Pirates de la Méditerranée"
 lesbos.0050.desc:0 "Pendant des années, des pirates ont opéré depuis les côtes de [capital_province.GetName] pour s'en prendre aux navires marchands sillonnant la Méditerranée, mais il y a davantage à gagner si nous travaillons ensemble. Après tout, il n'est pas rare que des marchands ordinaires - comme ceux avec qui nous commerçons - se tournent vers la piraterie pour gagner quelques pièces supplémentaires, et il n'est pas non plus inouï que des pirates offrent leurs services à des seigneurs entreprenants. Mais auparavant, de telles choses se faisaient de manière improvisée et désorganisée au sein de notre royaume.\n\nDésormais, nous avons conclu un accord avec les pirates locaux. En échange de la permission d'établir une base officielle sur notre territoire, ils pilleront les côtes de nos ennemis en notre nom et nous fourniront une part du butin, tout en nous soutenant dans nos entreprises militaires. Il n'y a aucune honte à s'associer avec des pirates ; c'est simplement un outil de plus dans notre arsenal pour protéger nos intérêts économiques et politiques dans le monde toujours dynamique et dangereux de la Méditerranée."
 lesbos.0050.a:0 "Ils serviront bien nos intérêts."
 lesbos.0050.tooltip:0 "$RICE_mediterranean_collaborate_with_pirates_effect_tooltip_2$"
 lesbos.0051.t:0 "$lesbos.0050.t$"
 lesbos.0051.desc:0 "Nous avons toléré la présence de pirates dans mes territoires bien trop longtemps. Nos \" accords \" avec eux n'ont pas joué en notre faveur, et même si beaucoup sont aussi des marchands respectables, pouvons-nous vraiment leur faire confiance alors qu'ils ne sont pas moins avides que le charlatan et le bandit moyen ?\n\nJ'ai donc envoyé un ordre pour immédiatement renier tous nos accords avec les groupes de pirates en [GetGeographicalRegion('RICE_mediterranean_region').GetName]. Ils ne bénéficieront plus de protections légales ni de la possibilité d'établir leur base d'opérations dans mes territoires en travaillant avec nous, car ils ne travaillent plus #italic pour#! nous.\n\nJ'ai ordonné à mes troupes de s'assurer que ces pirates se conforment à nos commandements. Nous ne pouvons qu'espérer qu'ils partiront pacifiquement..."
 lesbos.0051.a:0 "J'espère que je n'ai pas fait d'erreur...."
