 lesbos.0080.t:0 "La Forge d'Héphaïstos"
 lesbos.0080.desc:0 "Dans l'Antiquité, Lemnos, une petite île proche de [GetTitleByKey('c_lesbos').GetNameNoTier], était réputée être l'emplacement de la grande forge d'Héphaïstos, le dieu [GetReligionByKey('hellenism_religion').GetAdjective] de la forge. L'île, selon les mythes, était sacrée pour Héphaïstos car c'est là que son père Zeus l'avait précipité sur terre alors qu'il n'était qu'un nourrisson.\n\nJ'ai entendu quelques contes populaires à propos de cet événement, et bien que je sois bien sûr un adepte de la voie [ROOT.Char.GetFaith.GetAdjective] et que je prie [ROOT.Char.GetFaith.HighGodName], et non Héphaïstos, je ne peux m'empêcher de trouver cette histoire intéressante. Qui sait quels autres types de récits abondent concernant les diverses îles de cette mer Égée ?"
 lesbos.0080.a:0 "Il doit y avoir beaucoup d'histoires de ce genre."
 lesbos.0081.t:0 "Le vin de Limnio"
 lesbos.0081.desc:0 "Les habitants locaux de [GetTitleByKey('c_lesbos').GetNameNoTier], sur lesquels je règne, m'ont offert du vin #italic Limnio#! Ce vin est reconnu comme la spécialité de l'île depuis l'Antiquité, mentionné par des sources classiques telles que celle d'Aristote. Même l'ancien médecin Galien considérait le vin de l'île comme l'un des meilleurs au monde !\n\nQuoi qu'il en soit, ce vin sera parfait pour un festin, ou même simplement pour en profiter seul !"
 lesbos.0081.a:0 "Un beau cadeau !"
 lesbos.0082.t:0 "La Plus Grande Poétesse Lesbienne ?"
 lesbos.0082.desc:0 "Dans les temps anciens, l'île de [GetTitleByKey('c_lesbos').GetNameNoTier] était surnommée l'#italic Île des Poètes#! car elle abritait plusieurs poètes célèbres. Dernièrement, j'ai pensé aux plus fameux d'entre eux.\n\n#bold Sappho#! était et est toujours considérée comme l'une des plus grandes poétesses ayant jamais vécu, dont la capacité à parler éloquemment de romance envers les hommes et les femmes est inégalée, bien que certains critiquent son supposé mode de vie débauché.\n\n#bold Terpandre#!, quant à lui, est considéré à juste titre comme l'une des figures fondatrices de la musique antique grâce à ses innovations dans les instruments de musique et les styles lyriques - et apparemment aussi un sacré fêtard.\n\n#bold Alcée#!, enfin, un contemporain de Sappho, était un autre innovateur reconnu et l'un des plus grands poètes lyriques ayant jamais vécu, bien que lui et ses frères se soient souvent retrouvés mêlés à des querelles politiques locales."
 lesbos.0082.a:0 "Sappho est ma préférée"
 lesbos.0082.b:0 "Terpandre est mon préféré"
 lesbos.0082.c:0 "Alcée est mon préféré"
 lesbos.0083.t:0 "La vraie histoire de Sappho"
 lesbos.0083.desc:0 "Sappho est l'une des personnes les plus célèbres de [GetTitleByKey('c_lesbos').GetNameNoTier]. Cependant, depuis l'Antiquité, elle est une figure controversée ; beaucoup la connaissent comme une poétesse éloquente, mais d'autres croient qu'elle était aussi une prostituée vulgaire qui couchait librement avec des hommes et des femmes. Au fil des années, les érudits ont proposé différentes solutions à cette contradiction.\n\nCertains croient qu'il y avait en réalité deux femmes célèbres nommées Sappho qui furent plus tard confondues. L'une était la célèbre poétesse, et l'autre était la courtisane immorale.\n\nD'autres encore estiment que cela complique inutilement les choses, et croient qu'il n'y avait qu'une seule Sappho. Au contraire, elle manquait à l'origine de vertu, mais, avec le temps, s'améliora et devint la célèbre poétesse."
 lesbos.0083.a:0 "Je pense qu'il y avait probablement deux Sapphos !"
 lesbos.0083.b:0 "Sappho a dû travailler dur pour s'améliorer."
 lesbos.0084.t:0 "La forêt prétrifiée de [GetTitleByKey('c_lesbos').GetNameNoTierNoTooltip]"
 lesbos.0084.desc:0 "Sur l'île de [GetTitleByKey('c_lesbos').GetNameNoTier], il existe un curieux repère géographique - une grande forêt pétrifiée, où les arbres ont été transformés en pierre. Personne ne sait comment elle est arrivée là.\n\nAujourd'hui, des dignitaires en visite se sont renseignés sur ce lieu remarquable, et nous avons été heureux de leur raconter ce que nous savions."
 lesbos.0084.a:0 "Le monde est plein de merveilles - notre île ne fait pas exception !"
 lesbos.0085.t:0 "Aristote et la Lagune"
 lesbos.0085.desc:0 "Un jour, mes courtisans et moi discutions de l'histoire de [GetTitleByKey('c_lesbos').GetNameNoTier] quand quelqu'un évoqua le fait que le grand Aristote avait vécu sur l'île pendant quelques années.\n\nDurant cette période, le philosophe passa du temps à étudier la lagune de Kallonis, afin de mieux comprendre sa faune et sa flore. Ce faisant, cela inspira nombre de ses idées et observations sur la biologie. Par exemple, il passa du temps à interroger les pêcheurs locaux sur ce qu'ils remarquaient chez les animaux et les plantes de la région, et en tira de nombreuses conclusions importantes que nous enseignons encore aujourd'hui."
 lesbos.0085.a:0 "Je devrais étudier davantage les œuvres d'Aristote...."
 lesbos.0085.b:0 "Il semble qu'Aristote ait travaillé dur."
