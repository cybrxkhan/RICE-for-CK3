 harran.0020.t:0 "Aider l'Académie de Harran"
 harran.0020.desc:0 "Les membres de l'Académie néoplatonicienne de Harran sont reconnaissants de mon soutien financier et moral, et espèrent que celui-ci leur permettra de continuer à transmettre les siècles de sagesse qu'ils possèdent à d'autres. En tant que membres d'une communauté ancienne mais déclinante, ils ont toujours besoin d'aide, peu importe d'où cette aide provient."
 harran.0020.a:0 "Très bien."
 harran.0021.t:0 "Le Philosophe"
 harran.0021.desc:0 "Dans mes rêves, quelqu'un d'apparence noble s'approche de moi, avec des cheveux légèrement argentés, et des yeux royaux et sages. D'un ton d'autorité bienveillante, [ancient_pagan_philosopher.GetSheHe] se présente comme [ancient_pagan_philosopher.GetFirstName], l'un[ancient_pagan_philosopher.Custom('FR_E')] des anciens philosophes païens, bien que dans mon rêve je ne perçois pas tout à fait l'importance de cela. Quoi qu'il en soit, [ancient_pagan_philosopher.GetSheHe] me remercie pour tout le soutien que j'ai apporté à l'Académie néoplatonicienne de Harran pour assurer sa survie."
 harran.0021.hellenic:0 "« Mille mercis éternels pour votre bonté, mon enfant. Que les dieux vous bénissent. »"
 harran.0021.nonhellenic:0 "« Bien que je ne suive pas votre credo [ROOT.Char.GetFaith.GetAdherentName], la vérité se manifeste de bien des façons. »"
 harran.0022.t:0 "Revitaliser l'Académie de Harran"
 harran.0022.desc:0 "J'ai rassemblé une grande quantité de fonds et de ressources, et réuni de nombreux hommes savants afin de revitaliser l'Académie néoplatonicienne de [harran_county.GetNameNoTier]. Nous avons trop longtemps laissé cette institution inestimable dépérir, et il nous revient désormais de lui rendre sa gloire d'antan. Notre objectif sera de rénover la structure physique du campus de l'Académie, ainsi que d'établir et de pérenniser une communauté dynamique et nombreuse d'érudits (principalement des païens, mais d'autres seront les bienvenus tant qu'ils ont l'esprit ouvert). Bien que cela prenne du temps, l'Académie perdurera !"
 harran.0022.a:0 "Il s'agit d'améliorer le sort de l'humanité."
 harran.0023.t:0 "Néoplatonisme revitalisé"
 harran.0023.desc:0 "Depuis des générations, l'Académie néoplatonicienne à [harran_county.GetNameNoTier] a été le dernier vestige d'un monde ancien. Située dans les collines escarpées du nord de la Mésopotamie, ses érudits pouvaient revendiquer une filiation intellectuelle avec les néoplatoniciens de l'Empire romain, qui eux-mêmes faisaient remonter leur lignée jusqu'à Platon lui-même. Hélas, pendant des années, l'Académie a souffert d'un déclin inévitable, la région étant dominée par des non-païens.\n\nCependant, la fortune sourit désormais à l'Académie. [harran_academy_reviver.Custom('FR_LeLa')|U] sage [harran_academy_reviver.GetTitledFirstName] a rassemblé des ressources pour revitaliser l'Académie en rénovant ses locaux et en attirant de nombreux érudits brillants pour y vivre. Bien qu'elle ne puisse jamais rivaliser avec la Maison de la Sagesse à Bagdad, ni se comparer à l'Académie platonicienne originelle, l'Académie de Harran a désormais un avenir garanti en tant que centre de savoir."
 harran.0023.a:0 "C'est ce qui était écrit dans les étoiles !"
 harran.0024.t:0 "La fin de l'Académie de Harran"
 harran.0024.desc:0 "Ces dernières années, l'Académie néoplatonicienne à [harran_county.GetNameNoTier] a été en déclin, reflétant le déclin des religions païennes dans certaines parties du monde. Hélas, peu souhaitaient investir le temps et les ressources nécessaires pour préserver cette plus vénérable des institutions. Désormais, avec la mort de son dernier véritable enseignant et érudit, elle est effectivement défunte, sans successeur pour transmettre son héritage."
 harran.0024.a:0 "Je vois..."
 harran.0025.t:0 "Fin du Néo-Platonisme"
 harran.0025.desc:0 "Toute chose doit dépérir, un jour ou l'autre. L'Académie néoplatonicienne de [harran_county.GetNameNoTier] fut autrefois une communauté vibrante d'érudits, les derniers vestiges de la civilisation hellénique de l'Antiquité. Pendant des siècles, les philosophes et mystiques de l'Académie transmirent leur fragile héritage de savoir à la génération suivante.\n\nMais plus maintenant.\n\nLe dernier enseignant de l'école s'est éteint, et sans aucun soutien financier et moral, l'Académie s'effacera dans les annales de l'histoire. La seule chose qui subsiste là où se trouvait autrefois une communauté intellectuelle vibrante n'est plus que l'encre pâlissante sur des parchemins anciens et les murmures d'une brillante histoire depuis longtemps révolue."
 harran.0025.a:0 "Il en est ainsi, il en sera ainsi."
 RICE_harran_neoplatonic_academy_dead_tooltip:0 "Les [harranian_characters|El] ne peuvent plus apparaître dans les [courts|El] du Moyen-Orient, et les [rulers|El] de cette région ne peuvent plus prendre la [decision|El] de #V Patronner l'[harran_neoplatonic_academy|E]#!"
 harran.0026.t:0 "Fin de l'Académie néoplatonicienne d'Athènes"
 harran.0026.desc:0 "Depuis des siècles, [athens_barony.GetNameNoTier] abrite des érudits qui enseignent à la soi-disant #bold Académie néoplatonicienne#! et revendiquent une filiation intellectuelle avec l'Académie platonicienne originelle des temps anciens. Malgré les différences religieuses, des dirigeants tels que moi-même les ont tolérés et ont même financé leur institution, supposant à tort qu'ils contribuaient à quelque chose pour notre société.\n\nCependant, les temps changent, et nous avons assez gaspillé nos fonds publics pour ces gens et leur école. J'ai décidé de cesser de financer l'Académie, malgré les supplications des érudits. Ces néoplatoniciens disent que cela les force effectivement à l'exil, étant donné qu'ils n'auront plus de foyer. À cela, je ne peux dire qu'une chose : c'est leur problème, pas le mien."
 harran.0026.a:0 "Leur sort ne me préoccupe guère."
 harran.0026.tooltip:0 "Les érudits néoplatoniciens erreront, cherchant un nouveau foyer. La rumeur veut qu'ils envisagent quelques endroits au Proche-Orient, comme [harran_county.GetNameNoTier], pour établir une nouvelle [harran_neoplatonic_academy|E], mais il reviendra aux dirigeants locaux de décider s'ils y sont les bienvenus ou non."
 harran.0027.t:0 "Fin de l'Académie néoplatonicienne d'Athènes"
 harran.0027.desc:0 "Pendant des siècles, [athens_barony.GetNameNoTier] a abrité l'#bold Académie néoplatonicienne#!, une lignée d'érudits qui prétendaient être les descendants intellectuels de l'ancienne Académie platonicienne originelle. Ils ont traversé des temps difficiles et de nombreux défis, et les autorités précédentes se contentaient de les soutenir financièrement même si elles étaient en désaccord avec eux sur des questions religieuses. Cependant, même leur chance a fini par tourner.\n\n[neoplatonic_academy_hater.GetTitledFirstName], [neoplatonic_academy_hater.Custom('FR_LeLa')] dirigeant[neoplatonic_academy_hater.Custom('FR_E')] actue[neoplatonic_academy_hater.Custom('FR_LLle')] de [athens_barony.GetNameNoTier], a décidé de cesser de financer l'Académie, et son message est clair : ces néoplatoniciens ne sont plus les bienvenus là-bas.\n\nPersonne, pas même les néoplatoniciens eux-mêmes, ne sait ce que l'avenir réserve à ces érudits. Beaucoup d'entre eux prévoient d'errer dans les terres de l'est, dont on dit qu'elles ont des dirigeants plus tolérants et clairvoyants."
 harran.0027.a:0 "Peut-être trouveront-ils un nouveau foyer, peut-être pas."
 harran.0027.b:0 "[harran_county.GetNameNoTier] pourrait être une bonne maison pour eux... viendront-ils ici ?"
 harran.0027.tooltip:0 "$harran.0026.tooltip$"
 harran.0028.t:0 "Les néoplatoniciens s'installent à Harran"
 harran.0028.desc:0 "L'Académie néoplatonicienne était autrefois une institution d'enseignement respectée à Athènes, remplie de savants païens renommés. Cependant, les autorités locales, qui différaient dans leurs convictions religieuses, ont fini par cesser de financer leur institution, les forçant à l'exil alors qu'ils cherchaient des dirigeants plus tolérants. Ils ont enfin trouvé leur mécène.\n\nJ'avais entendu parler du sort de ces savants, et de la durée de leur errance. Je ressentais non seulement de la pitié que leurs talents ne soient pas appréciés, mais aussi de l'enthousiasme face à l'opportunité qui se présentait. Quand j'ai appris que ces savants envisageaient de demander s'ils pouvaient se réfugier à [harran_county.GetNameNoTier], j'ai su que je devais les accueillir sur mes terres. La communauté païenne de [harran_county.GetNameNoTier] est elle aussi enthousiaste à propos du rétablissement de l'Académie néoplatonicienne ici."
 harran.0028.a:0 "Un nouveau jour s'est levé pour l'Académie néoplatonicienne."
 harran.0028.tooltip:0 "L'[harran_neoplatonic_academy|E] a trouvé un nouveau foyer, et les [rulers|El] au Moyen-Orient et en Asie Mineure peuvent désormais prendre la [decision|El] de #V Patronner l'Académie Néoplatonicienne#!. De plus, des [harranian_courtiers|El] apparaîtront occasionnellement dans cette région également."
 harran.0029.t:0 "Les néoplatoniciens s'installent à Harran"
 harran.0029.desc:0 "L'Académie néoplatonicienne était autrefois une institution d'enseignement respectée à Athènes, remplie de savants païens renommés. Cependant, les autorités locales, qui différaient dans leurs convictions religieuses, ont fini par cesser de financer leur institution, les forçant à l'exil à la recherche de dirigeants plus tolérants. Ils ont enfin trouvé leur mécène.\n\n[neoplatonic_academy_lover.GetTitledFirstName] a pris en pitié ces savants qui avaient erré si longtemps, et a conclu un accord avec eux, leur permettant de s'installer à [harran_county.GetNameNoTier]. La communauté païenne de la ville est ravie d'accueillir ces éminents savants dans leur nouveau foyer. C'est assurément le début d'un merveilleux nouveau chapitre dans l'histoire de la tradition néoplatonicienne."
 harran.0029.a:0 "Qui sait combien de temps ils vont supporter cette période ?"
 harran.0029.tooltip:0 "$harran.0026.tooltip$"
 harran.0030.t:0 "Un érudit harranien"
 harran.0030.desc:0 "Le peuple de [harran_county.GetNameNoTier] est depuis des siècles l'un des derniers bastions des anciennes croyances païennes. Beaucoup d'entre eux sont renommés dans toute la région pour leur savoir et leur sagesse.\n\nAujourd'hui, l'un de ces représentant [spawned_harranian_courtier.GetFullName] est arrivé à ma cour, cherchant mon patronage. Si je [spawned_harranian_courtier.GetHerHim] soutiens, [spawned_harranian_courtier.GetSheHe] et sa famille, [spawned_harranian_courtier.GetSheHe] fournira en échange ses services en tant qu'érudit[spawned_harranian_courtier.Custom('FR_E')] et penseu[spawned_harranian_courtier.Custom('FR_RSe')]. Les Harraniens sont célèbres dans toute la région pour leur immense savoir dans tous les domaines - mystique, spirituel et matériel - aussi en avoir un à ma cour serait un grand atout."
 harran.0030.a:0 "On dirait que c'est une bonne affaire ! Bienvenue à [spawned_harranian_courtier.Custom('FR_LuiElle')]."
 harran.0030.a.tooltip:0 "En tant que [harranian_courtier|El], [spawned_harranian_courtier.GetFullNameNoTooltip] pourrait contribuer au savoir de votre royaume en rédigeant des traités savants."
 harran.0030.b:0 "Je n'ai que faire d'une telle personne."
 harran.0031.t:0 "Un traité harranien"
 harran.0031.desc:0 "Le savant harranien à ma cour, [harranian_scholar.GetFullName], a achevé la rédaction d'un traité savant et m'en a présenté une copie. La connaissance ancienne des Harraniens doit être partagée avec le reste du monde, après tout. Quoi qu'il en soit, non seulement [harranian_scholar.GetTitledFirstName] gagnera le respect de ses collègues érudits dans la région, mais moi aussi, j'obtiendrai un certain prestige et une certaine renommée en soutenant un individu si talentueux."
 harran.0031.a:0 "Merveilleux ! Espérons que d'autres pourront s'inspirer de ce traité."
 harran.0032.t:0 "Le Savant néoplatonicien"
 harran.0032.desc:0 "Peu après avoir accueilli les érudits néoplatoniciens à [harran_county.GetNameNoTier], et leur avoir permis d'établir une nouvelle Académie, j'ai été approché par l'un de leurs éminents représentants, [spawned_harranian_courtier.GetTitledFirstName]. Inspiré par ce qu'il considère comme ma gouvernance juste et tolérante, il souhaite travailler en étroite collaboration avec moi à ma cour, et servir de liaison entre moi-même et l'Académie florissante de [harran_county.GetNameNoTier]. En effet, il pourrait être intéressant d'avoir un homme si érudit et talentueux à ma cour..."
 harran.0032.a:0 "Bien sûr ! Ce serait un honneur d'avoir un tel érudit à ma cour."
 harran.0032.b:0 "Il vaut mieux que vous restiez avec vos collègues érudits pour les aider à la place."
