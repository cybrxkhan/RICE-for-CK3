 harran.0080.t:0 "Sumatar Harabesi"
 harran.0080.desc:0 "Pendant de nombreux siècles, les païens de Harran se sont souvent rendus à l'oasis voisine de Sumatar Harabesi pour prier l'un de leurs dieux principaux, la divinité lunaire Sîn. Aujourd'hui encore, on y trouve de nombreuses idoles et autels. Les Harraniens s'y sont récemment rendus pour une cérémonie majeure, qui s'est déroulée sans incident."
 harran.0080.a:0 "Il en est ainsi."
 harran.0081.t:0 "Bons présages à Harran"
 harran.0081.desc:0 "Les païens de Harran sont des praticiens expérimentés des arts divinatoires. Ils sont habiles à lire les étoiles et à tracer le cours de l'avenir. De récentes lectures lunaires des astrologues harraniens prédisent que de bonnes choses arriveront bientôt au peuple de Harran, semble-t-il. Peut-être cela les inspirera-t-il à être encore plus productifs et compétents dans leurs entreprises."
 harran.0081.a:0 "Peut-être que oui !"
 harran.0082.t:0 "Mauvais présages à Harran"
 harran.0082.desc:0 "Les païens de Harran sont des praticiens expérimentés des arts divinatoires. Ils sont habiles à lire les étoiles et à tracer le cours de l'avenir. De récentes lectures lunaires des astrologues harraniens prédisent que de mauvaises choses arriveront bientôt au peuple de Harran, semble-t-il. Cela causera peut-être une certaine panique et détresse parmi eux pendant quelque temps."
 harran.0082.a:0 "Est-ce que ce sera vraiment si grave ?"
 harran.0083.t:0 "Bâtiments en ruches"
 harran.0083.desc:0 "Les habitants de Harran possèdent de nombreuses traditions distinctes qui les distinguent des autres. Par exemple, depuis des temps immémoriaux, ils vivent dans des maisons en forme de ruches. Aujourd'hui, alors que je rends visite aux dirigeants locaux de Harran, j'entre dans l'une de ces maisons appartenant à un noble harranien pour discuter de certaines affaires. C'est la plus grande de son genre, et elle tient davantage du manoir."
 harran.0083.a:0 "Des bâtiments fascinants ! Ils sont magnifiques."
 harran.0083.b:0 "Ils sont tout simplement ordinaires, qu'est-ce que ça peut bien faire ?"
 harran.0084.t:0 "Festival de Tammuz"
 harran.0084.desc:0 "Depuis des millénaires, l'un des principaux festivals célébrés par les païens de Harran est le festival de Tammuz, où ils pleurent leur divinité Tammuz - également identifiée au grec Adonis - qui meurt chaque année. Ils faisaient une démonstration publique de leur chagrin, pleurant et se lamentant. Le festival de cette année a été considéré comme inhabituellement réussi, inspirant les païens locaux à travailler dur et à vivre en paix et en harmonie."
 harran.0084.a:0 "Intéressant."
 harran.0084.b:0 "Des blasphèmes païens !"
 harran.0085.t:0 "Approfondir le savoir"
 harran.0085.desc:0 "L'Académie néoplatonicienne d'Harran continue de prouver son importance pour l'apprentissage et la science. Plusieurs érudits et philosophes harranais de renom ont récemment publié un certain nombre de textes traitant de divers sujets intellectuels, qui ont été applaudis dans toute la région pour leur sagesse clairvoyante et leur caractère éclairant."
 harran.0085.a:0 "Bonne nouvelle !"
 harran.0086.t:0 "Différents païens à Harran"
 harran.0086.desc:0 "Les étrangers ne font souvent pas la distinction entre les différents types de païens vivant dans la ville de Harran. Il y a les élites plus éduquées, associées à l'Académie néoplatonicienne, qui se considèrent comme les héritiers des anciens philosophes tels que Platon ou Plotin. Puis il y a les masses populaires, qui préfèrent vénérer les dieux comme Sîn, Tammouz et Hermès d'une manière que les élites considèrent comme superstitieuse.\n\nAujourd'hui, alors que nous recevons l'un des érudits de l'Académie pour un petit banquet, il déplore ce qu'il considère comme la nature ignorante et superstitieuse de certains paysans païens de Harran. Pour lui, ils donnent aux autres une mauvaise impression des païens, celle d'une religion arriérée, inapte à explorer les questions philosophiques et spirituelles de l'ère actuelle."
 harran.0086.a:0 "Au moins, vous et vos collègues luttez contre l'ignorance !"
 harran.0086.b:0 "Les masses paysannes sont des cervelles d'oiseaux, quelle que soit leur religion, non ?"
 harran.0086.c:0 "Pourquoi mépriser les autres ? L'orgueil ne sied pas à un sage érudit."
 harran.0087.t:0 "Connexions académiques"
 harran.0087.desc:0 "Plusieurs membres de l'Académie Néoplatonicienne d'Harran sont rentrés d'un séjour à l'étranger où ils ont échangé des connaissances avec d'autres érudits. Ils ont également ramené avec eux un certain nombre de contacts qui pourraient m'être utiles."
 harran.0087.a:0 "Cela fait plaisir à entendre. Bienvenue à la maison !"
 harran.0088.t:0 "Diversité païenne"
 harran.0088.desc:0 "Plus je règne sur Harran, plus je suis étonné par la diversité des païens qui y vivent. Ils ont survécu ensemble siècle après siècle, malgré leurs différences de culte et de mode de culte. On pourrait penser que cela aurait conduit à des conflits fréquents, mais étonnamment, ces groupes parviennent à s'entendre - même s'il y a parfois des tensions. Dans mes discussions avec leurs dirigeants, il prennent conscience que leur communauté unique est plus forte et qu'elle supportera mieux les épreuves si elle reste unie."
 harran.0088.a:0 "Une précieuse leçon à retenir pour nous."
 harran.0088.b:0 "Ce sont tout de même encore des païens égarés."
