 harran.0005.t:0 "Le Temple de la Lune"
 harran.0005.desc:0 "Il est sage de rendre hommage aux dieux de temps en temps, quelle que soit la forme qu'ils prennent.\n\nJ'ai décidé qu'il était temps de rendre hommage au grand Temple de la Lune à [harran_county.GetNameNoTier]. C'est un héritage du monde antique, orné d'idoles de diverses divinités, telles que Tammuz, également connu des Grecs sous le nom d'Adonis. Au centre du temple se dresse l'idole de la divinité lunaire, connue localement sous le nom de Sin. Bien que les murs soient usés et que le temple ait définitivement connu des jours meilleurs, les visiteurs disent qu'ils peuvent sentir les siècles d'histoire peser sur eux.\n\nQuoi qu'il en soit, j'ai offert aux prêtres une donation substantielle pour les offrandes et les sacrifices, afin de montrer ma dévotion aux dieux."
 harran.0005.a:0 "J'espère une faveur divine de la part des cieux !"
 harran.0005.b:0 "Que ces offrandes témoignent de ma dévotion !"
 harran.0006.t:0 "xxxxx"
 harran.0006.desc:0 "xxxxx"
 harran.0006.a:0 "xxxxx"
 harran.0007.t:0 "Le Temple n'est plus"
 harran.0007.desc:0 "J'ignore les protestations et les supplications des derniers blasphémateurs de [harran_county.GetNameNoTier], qui me pressent de ne pas mettre fin à cet accord que nous avions avec eux pour leur permettre de pratiquer leur culte comme bon leur semble. Mon esprit ne sera pas ébranlé.\n\nDepuis trop longtemps nous avons été cléments avec ces païens - le Temple de la Lune à Harran n'accueillera plus ces idolâtres. J'ai un certain nombre d'hommes à ma disposition, prêts à exécuter mes ordres. L'ère du paganisme à Harran est révolue."
 harran.0007.a:0 "Piller et brûler le temple jusqu'aux fondations !"
 harran.0007.tooltip:0 "Les [rulers|El] païens ne pourront plus prendre la [decision|El] de #V Vénérer au [harran_temple_of_the_moon|El]#! à [harran_county.GetNameNoTier]"
 harran.0008.t:0 "Destruction du temple de la lune"
 harran.0008.desc:0 "Le Temple de la Lune à [harran_county.GetNameNoTier] se dressait depuis des temps immémoriaux, un rare vestige d'une époque révolue. Il était aussi ancien que les Égyptiens, déjà vieux de plusieurs millénaires à l'époque où Alexandre le Grand et Jules César vivaient. Il survécut à calamité après calamité, survivant à des Empires comme les Achéménides, les Maurya et les Romains. Il continua d'endurer même après l'essor de la Croix et du Croissant. En une ère de guerre et de conflits, il était un refuge pour les adorateurs en déclin de divinités aussi diverses qu'Hermès, Tammouz et, bien sûr, Sîn, une ancienne divinité lunaire.\n\nCependant, il a finalement rencontré sa fin. Sur les ordres de [harran_temple_destructor.GetTitledFirstName], le temple a été rasé. Les derniers païens de Harran ont perdu leur temple, et leurs jours sont assurément comptés."
 harran.0008.a:0 "Je vois..."
 harran.0008.tooltip:0 "Les [rulers|El] païens ne pourront plus prendre la [decision|El] de #V Vénérer au [harran_temple_of_the_moon|El]#! à [harran_county.GetNameNoTier]"
 harran.0009.t:0 "Rédiger un traité"
 harran.0009.desc:0 "En tant qu'érudit harranien, il est temps que j'apporte ma contribution au monde intellectuel ! Les Harraniens peuvent s'enorgueillir d'une longue lignée qui remonte à l'Académie néoplatonicienne d'Athènes et, en fin de compte, aux sages penseurs de l'Antiquité comme Platon et Hermès. Je prépare mes instruments d'écriture, ainsi que divers livres et parchemins écrits par des experts que je pourrai consulter pour mes recherches."
 harran.0009.a:0 "J'ai hâte de commencer !"
 harran.0009.tooltip:0 "Vous commencez à rédiger votre traité sur un sujet savant."
 harran.0010.t:0 "Écriture terminée"
 harran.0010.desc:0 "J'ai terminé la rédaction d'un traité sur un sujet savant, qui sera, je l'espère, une autre digne contribution harranienne au savoir. J'espère que les connaissances que j'ai exposées dans mon œuvre seront bénéfiques pour l'humanité. À tout le moins, cela devrait m'apporter une certaine renommée et un certain prestige dans les cercles savants de la région."
 harran.0010.a:0 "Ce fut un travail difficile ! J'enverrai quelques copies à d'autres."
 harran.0010.b:0 "Peut-être puis-je promouvoir mon œuvre auprès des élites..."
 harran.0011.t:0 "xxxxx"
 harran.0011.desc:0 "xxxxx"
 harran.0011.a:0 "xxxxx"
 harran.0012.t:0 "L'agriculture nabatéenne"
 harran.0012.desc:0 "Ceux qui le connaissent considèrent [ibn_wahshiyya.GetTitledFirstName] [ibn_wahshiyya.GetDynasty.GetName] comme un érudit doué, bien qu'étrange. [ibn_wahshiyya.GetSheHe|U] est originaire des peuples natifs du sud de la [GetGeographicalRegion('RICE_region_mesopotamia').GetName], les [nabataean.GetCollectiveNoun|l], ou Nabatéens, à ne pas confondre avec les Nabatéens du Levant.\n\nPendant des années, ces [nabataean.GetCollectiveNounNoTooltip|l] furent raillés par beaucoup comme des bouseux de la campagne. Le savant [ibn_wahshiyya.GetDynasty.GetNameNoTooltip] a passé une grande partie de sa vie à voyager et à rassembler la sagesse du monde antique, en particulier celle de ses ancêtres, pour prouver qu'ils possèdent beaucoup de choses dont le monde pourrait s'inspirer.\n\nÀ présent, [ibn_wahshiyya.GetDynasty.GetNameNoTooltip] a compilé ce qu'[ibn_wahshiyya.GetSheHe] a appris dans un grand tome de savoir, appelé #V $RICE_nabataean_agriculture_book_name$#!. Ceux qui l'ont vu croient qu'il contient de nombreuses grandes perspectives non seulement dans le domaine de l'agriculture, son sujet principal, mais aussi dans ceux de la philosophie, de la magie, de l'astrologie, et des croyances [kasdanian.GetAdjective|l]s traditionnelles des [nabataean.GetCollectiveNounNoTooltip|l]."
 harran.0012.a:0 "C'est une grande contribution au savoir humain."
 harran.0013.t:0 "Le Nabatéen"
 harran.0013.desc:0 "Nous, les [nabati.GetCollectiveNoun|l], étions autrefois un peuple grand et puissant qui terrifiait et gagnait le respect des autres royaumes. En ces temps anciens, de puissants rois comme mon ancêtre, Sennachérib, conquéraient et régnaient glorieusement. Même notre langue, [nabati.GetLanguage.GetName], était la langue primordiale de la création !\n\nComme nous sommes tombés bas.... Ou du moins, c'est ce que les étrangers aiment penser, ceux qui nous dénigrent comme rien de mieux que d'ignorants paysans rustres. Pourtant, j'en sais davantage.\n\nCertes, beaucoup de [nabati.GetCollectiveNounNoTooltip|l] ne sont que de simples paysans qui vivent dans les parties rurales des marais d'Irak. C'est pourquoi il est de mon devoir, en tant que lettré érudit, de rassembler autant que possible de notre savoir ancien, de le méditer et de l'enseigner aux autres, afin qu'il soit préservé pour la postérité. J'espère qu'un jour, je pourrai compiler mes découvertes et mes réflexions en un grand volume."
 harran.0013.a:0 "Je ne peux pas faire moins pour mon héritage."
 harran.0013.tooltip:0 "Le [trait|El] [GetTrait('RICE_the_nabataean').GetName( GetNullCharacter )] peut être amélioré en choisissant différentes [travel_options|El] lorsque vous voyagez. Une fois que vous avez atteint le maximum d'[trait_level_track_xp|El] dans chaque voie, la [decision|El] #V $RICE_nabataean_ibn_wahshiyya_decision$#! peut être prise pour obtenir un puissant [artifact|El] livre."
 harran.0013.info:0 "\n#emphasis Contexte historique :#! Ibn Wahshiyya, comme il est connu, était un érudit d'Irak actif à la fin du IXe et au début du Xe siècle. Son magnum opus, l'#italic Agriculture nabatéenne#!, fut très estimé pendant des siècles pour son étude de l'agriculture, de l'astrologie et de la magie.\n\nAujourd'hui, pour les universitaires, l'#italic Agriculture nabatéenne#! est une source cruciale sur les Nabatéens d'Irak, un peuple peu connu du sud de l'Irak dont Ibn Wahshiyya était originaire, et qui est représenté dans RICE par la culture $nabati$. Ils ne sont pas les mêmes que les Arabes nabatéens du Levant qui ont construit Pétra, car ces Nabatéens étaient des locuteurs de l'araméen qui étaient considérés comme les héritiers de l'ancienne Mésopotamie, et beaucoup étaient encore païens durant la période abbasside primitive, préservant une évolution tardive de l'ancienne religion mésopotamienne, représentée dans RICE par la foi $south_mesopotamian_pagan$.\n\nDe nombreuses légendes circulaient à propos de ces Nabatéens, même parmi ceux qui ne les voyaient guère plus que comme d'humbles paysans, comme celle selon laquelle leur langue araméenne était la langue originelle de la création. Fait intéressant, Ibn Wahshiyya revendiquait une descendance du roi assyrien Sennachérib, qui, contrairement à sa représentation habituelle en tant que tyran, était révéré par les Nabatéens d'Irak comme un ancêtre illustre."
