 # Traits
 trait_RICE_the_nabataean:0 "Le Nabatéen"
 trait_RICE_the_nabataean_desc:0 "Ce personnage cherche à découvrir et comprendre l'héritage de ses ancêtres : la sagesse éternelle des anciens Mésopotamiens.\n\n#weak Ce trait peut être amélioré en sélectionnant les [travel_options|El] pertinentes lors des [traveling|El].#!"
 trait_RICE_the_nabataean_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] cherche à découvrir et comprendre l'héritage de ses ancêtres : la sagesse infinie des anciens Mésopotamiens.\n\n#weak Ce trait peut être amélioré en sélectionnant les [travel_options|El] pertinentes lors des [traveling|El].#!"
 trait_track_RICE_the_nabataean_agriculture:0 "Connaissances agricoles"
 trait_track_RICE_the_nabataean_agriculture_desc:0 "La terre peut prospérer, tant que nous savons comment en prendre soin."
 trait_track_RICE_the_nabataean_religion:0 "Connaissances religieuses"
 trait_track_RICE_the_nabataean_religion_desc:0 "Par le rituel et la compréhension, nous nous rapprochons des cieux."
 trait_track_RICE_the_nabataean_lore:0 "Connaissance du folklore"
 trait_track_RICE_the_nabataean_lore_desc:0 "Les histoires transmises de génération en génération continuent de nous inspirer."
 RICE_the_nabataean_progress_towards_trait_0_tt:0 "[THIS.Char.GetShortUINameNoFormat|U] peut adopter le [trait|El] [GetTrait('RICE_the_nabataean').GetName( GetNullCharacter )]"
 RICE_the_nabataean_progress_towards_trait_1_tt:0 "Augmente légèrement le [trait|El] [GetTrait('RICE_the_nabataean').GetName( GetNullCharacter )] de [THIS.Char.GetShortUINamePossessive]"
 RICE_the_nabataean_progress_towards_trait_2_tt:0 "Augmente le [trait|El] [GetTrait('RICE_the_nabataean').GetName( GetNullCharacter )] de [THIS.Char.GetShortUINamePossessive]"
 RICE_the_nabataean_progress_towards_trait_3_tt:0 "Augmente grandement le [trait|El] [GetTrait('RICE_the_nabataean').GetName( GetNullCharacter )] de [THIS.Char.GetShortUINamePossessive]"
 RICE_the_nabataean_xp_gain_message:0 "Expérience [GetTrait('RICE_the_nabataean').GetName( GetNullCharacter )]"

 # Travel Options  
 RICE_ibn_wahshiyya_agriculture_option:0 "Étudier l'agriculture"
 RICE_ibn_wahshiyya_agriculture_option_desc:0 "Vous prendrez le temps de consigner et d'analyser les méthodes agricoles en parcourant la campagne, du point de vue du savoir nabatéen."
 RICE_ibn_wahshiyya_agriculture_option_effect_1:0 "Chaque fois que vous entrez dans une [barony|El], vous pouvez gagner aléatoirement jusqu'à [provisions_i|El] #V [GetPlayer.MakeScope.ScriptValue('RICE_ibn_wahshiyya_provisions_gain')]#! [provisions|El] (si vous êtes un [adventurer|El]) ou [gold_i|El] #V [GetPlayer.MakeScope.ScriptValue('RICE_ibn_wahshiyya_gold_gain')]#! (si vous ne l'êtes pas) et #V [GetPlayer.MakeScope.ScriptValue('RICE_ibn_wahshiyya_travel_xp_gain')]#! [trait_level_track_xp|El] dans la voie #V $trait_track_RICE_the_nabataean_agriculture$#! du [trait|El] [GetTrait('RICE_the_nabataean').GetName( GetNullCharacter )]."
 RICE_ibn_wahshiyya_agriculture_option_effect_2:0 "La chance que cela se produise dans la plupart des comtés est de #V [GetPlayer.MakeScope.ScriptValue('RICE_ibn_wahshiyya_agriculture_option_bonus_chance')|0]%#!. Cette chance est augmentée à #V [GetPlayer.MakeScope.ScriptValue('RICE_ibn_wahshiyya_agriculture_option_bonus_chance_plus')|0]%#! si vous voyagez à travers un [county|El] qui est d'une [culture|El] ayant le [heritage|El] #V $heritage_syriac_name$#!, d'une [faith|El] [GetReligionByKey('semitic_religion').GetAdjective] ou [GetReligionByKey('hellenism_religion').GetAdjective], ou dans la [region|El] de la [GetGeographicalRegion('RICE_region_mesopotamia').GetName]."
 RICE_ibn_wahshiyya_religion_option:0 "Contemplation religieuse"
 RICE_ibn_wahshiyya_religion_option_desc:0 "Vous prendrez le temps de réfléchir à des questions de philosophie et de spiritualité du point de vue du savoir nabatéen."
 RICE_ibn_wahshiyya_religion_option_effect_1:0 "Chaque fois que vous entrez dans une [barony|El], vous pouvez aléatoirement gagner jusqu'à [piety_i|El] #V [GetPlayer.MakeScope.ScriptValue('RICE_ibn_wahshiyya_piety_gain')]#! de [piety|El] et #V [GetPlayer.MakeScope.ScriptValue('RICE_ibn_wahshiyya_travel_xp_gain')]#! [trait_level_track_xp|El] dans la voie #V $trait_track_RICE_the_nabataean_religion$#! du [trait|El] [GetTrait('RICE_the_nabataean').GetName( GetNullCharacter )]."
 RICE_ibn_wahshiyya_religion_option_effect_2:0 "La chance que cela se produise dans la plupart des comtés est de #V [GetPlayer.MakeScope.ScriptValue('RICE_ibn_wahshiyya_religion_option_bonus_chance')|0]%#!. Cette chance est augmentée à #V [GetPlayer.MakeScope.ScriptValue('RICE_ibn_wahshiyya_religion_option_bonus_chance_plus')|0]%#! si vous voyagez à travers un [county|El] qui est d'une [culture|El] ayant le [heritage|El] #V $heritage_syriac_name$#!, d'une [faith|El] [GetReligionByKey('semitic_religion').GetAdjective] ou [GetReligionByKey('hellenism_religion').GetAdjective], ou dans la [region|El] de la [GetGeographicalRegion('RICE_region_mesopotamia').GetName]."
 RICE_ibn_wahshiyya_lore_option:0 "Consigner le folklore"
 RICE_ibn_wahshiyya_lore_option_desc:0 "Vous interrogerez les gens du peuple sur leurs croyances en l'astrologie, la magie, l'histoire et bien d'autres sujets, du point de vue du savoir nabatéen."
 RICE_ibn_wahshiyya_lore_option_effect_1:0 "Chaque fois que vous entrez dans une [barony|El], vous pouvez obtenir aléatoirement jusqu'à [prestige_i|El] #V [GetPlayer.MakeScope.ScriptValue('RICE_ibn_wahshiyya_prestige_gain')]#! de [prestige|El] et #V [GetPlayer.MakeScope.ScriptValue('RICE_ibn_wahshiyya_travel_xp_gain')]#! [trait_level_track_xp|El] dans la voie #V $trait_track_RICE_the_nabataean_lore$#! du [trait|El] [GetTrait('RICE_the_nabataean').GetName( GetNullCharacter )]."
 RICE_ibn_wahshiyya_lore_option_effect_2:0 "La chance que cela se produise dans la plupart des comtés est de #V [GetPlayer.MakeScope.ScriptValue('RICE_ibn_wahshiyya_lore_option_bonus_chance')|0]%#!. Cette chance est augmentée à #V [GetPlayer.MakeScope.ScriptValue('RICE_ibn_wahshiyya_lore_option_bonus_chance_plus')|0]%#! si vous voyagez à travers un [county|El] qui est d'une [culture|El] ayant le [heritage|El] $heritage_syriac_name$, une [faith|El] [GetReligionByKey('semitic_religion').GetAdjective] ou [GetReligionByKey('hellenism_religion').GetAdjective], ou dans la [region|El] de la [GetGeographicalRegion('RICE_region_mesopotamia').GetName]."
 RICE_ibn_wahshiyya_travel.agriculture.toast.success:0 "Ibn Wahshiyya acquiert des connaissances agricoles nabatéennes !"
 RICE_ibn_wahshiyya_travel.religion.toast.success:0 "Ibn Wahshiyya acquiert des connaissances religieuses nabatéennes !"
 RICE_ibn_wahshiyya_travel.lore.toast.success:0 "Ibn Wahshiyya acquiert des connaissances sur le folklore nabatéen !"
 RICE_ibn_wahshiyya_travel.agriculture.foreign.toast.success:0 "Ibn Wahshiyya contemple le savoir agricole nabatéen !"
 RICE_ibn_wahshiyya_travel.religion.foreign.toast.success:0 "Ibn Wahshiyya contemple le savoir religieux nabatéen !"
 RICE_ibn_wahshiyya_travel.lore.foreign.toast.success:0 "Ibn Wahshiyya contemple les connaissances du folklore nabatéen !"

 # Game Concepts
 game_concept_harranian_courtier:0 "Courtisan harranien"
 game_concept_harranian_courtiers:0 "Courtisans Harraniens"
 game_concept_harranian_character:0 "Personnage harranien"
 game_concept_harranian_characters:0 "Personnages harraniens"
 game_concept_harranian_courtier_desc:0 "Parfois, des $game_concept_harranian_characters|l$ peuvent apparaître aléatoirement via un événement pour les [rulers|El] au Moyen-Orient. Ils suivent la religion [GetReligionFamily('rf_pagan').GetName|l] harranienne, une foi ancienne et syncrétique combinant des éléments mésopotamiens et helléniques qui a survécu pendant des siècles dans la ville de Harran, située dans le nord de la Mésopotamie.\n\nLes $game_concept_harranian_characters|l$ tendent à avoir une [learning_skill|El] élevée, et feraient de précieux [courtiers|El]. Parfois, votre $game_concept_harranian_courtier|l$ pourrait composer des traités académiques sur divers sujets. Ceux-ci vous octroient un [artifact|El] spécial.\n\nLes $game_concept_harranian_characters|l$ cesseront d'apparaître si l'[harran_neoplatonic_academy|E] décline."
 game_concept_harran_neoplatonic_academy:0 "Académie Néoplatonicienne"
 game_concept_harran_neoplatonic_academy_desc:0 "Aux dates de départ les plus anciennes, le [county|El] de Harran possède un [special_building|El] appelé l'#V $game_concept_harran_neoplatonic_academy$#!. Outre ses bonus habituels, il présente d'autres caractéristiques spéciales.\n\nPremièrement, son existence est nécessaire pour que des [harranian_courtiers|El] apparaissent dans les [courts|El] des [rulers|El] du Moyen-Orient. En effet, après un certain temps, l'Académie tombera en déclin et le [special_building|El] sera désactivé si un puissant [ruler|El] païen ne prend pas de [decision|El] pour revitaliser l'Académie néoplatonicienne.\n\nDeuxièmement, elle permet aux [rulers|El] proches de Harran et en Mésopotamie et au Levant ayant une [learning_skill|El] élevée de prendre une [decision|El] pour parrainer l'Académie, ce qui vous confère divers bonus, y compris un [character_modifier|El] temporaire. Cela augmente également les chances qu'un [harranian_character|El] apparaisse pour vous."
 game_concept_harran_temple_of_the_moon:0 "Temple de la Lune"
 game_concept_harran_temple_of_the_moon_desc:0 "Aux dates de départ les plus anciennes, la [barony|El] de Tall Mahra dans le [county|El] de Harran possède un [special_building|El] appelé le #V $game_concept_harran_temple_of_the_moon$#!. Il représente l'ancien temple dédié au dieu lunaire Sîn qui se dressa à Harran pendant des siècles, voire des millénaires.\n\nOutre ses bonus habituels, son existence permet également aux [rulers|El] païens proches de prendre une [decision|El] spéciale pour y pratiquer leur culte, ce qui peut leur accorder des bonus de [prestige|El] et de [piety|El]. Un [ruler|El] d'une [faith|El] non païenne peut cependant prendre une [decision|El] pour détruire définitivement le Temple. Une fois le temple détruit, les [rulers|El] païens ne pourront plus accéder à la [decision|El]."
 
 # Activities
 activity_semitic_praying_to_a_planet:0 "Prières aux Luminaires Sacrés"
 activity_semitic_praying_to_a_planet_name:0 "Prières de [ACTIVITY.GetOwner.GetNamePossessiveOrMy|U] aux Luminaires Sacrés"
 activity_harran_make_offerings_to_moon_temple:0 "Vénération du temple de la lune"
 activity_harran_make_offerings_to_moon_temple_name:0 "Vénération de [ACTIVITY.GetOwner.GetNamePossessiveOrMy|U] au Temple de la Lune"
 
 # Buildings
 building_type_RICE_harran_temple_of_the_moon:0 "Temple de Sin"
 building_type_RICE_harran_temple_of_the_moon_desc:0 "Le temple de la divinité lunaire Sin, à Harran, a traversé les siècles, témoin des allées et venues des Babyloniens, des Perses, des Grecs, des Romains et d'autres encore. Sin est vénéré dans cette région depuis l'époque des anciens rois mésopotamiens."
 building_RICE_harran_temple_of_the_moon:0 "$building_type_RICE_harran_temple_of_the_moon$"
 building_RICE_harran_temple_of_the_moon_desc:0 "$building_type_RICE_harran_temple_of_the_moon_desc$" 
 building_type_RICE_harran_baalbek_temple:0 "Temple de Jupiter héliopolitain"
 building_type_RICE_harran_baalbek_temple_desc:0 "Le temple de Jupiter à Baalbek était l'un des plus grands du monde romain antique. À Baalbek, Jupiter était identifié à la divinité sémitique Ba'al Hadad. Selon les sources anciennes, la statue idolâtre qui dominait le temple représentait un dieu doré imberbe dans la posture d'un char, un fouet brandi dans la main droite et un foudre et des tiges de céréales dans la main gauche."
 building_RICE_harran_baalbek_temple:0 "$building_type_RICE_harran_baalbek_temple$"
 building_RICE_harran_baalbek_temple_desc:0 "$building_type_RICE_harran_baalbek_temple_desc$" 
 building_type_RICE_harran_neoplatonic_academy:0 "Académie Néoplatonicienne"
 building_type_RICE_harran_neoplatonic_academy_desc:0 "Pendant de nombreux siècles, l'Académie de Harran a été le dernier vestige de l'ancienne philosophie connue sous le nom de néoplatonisme, qui découle d'une interprétation mystique des enseignements de Platon. Cette académie est un centre régional d'apprentissage et a fourni de nombreux érudits qui ont participé à la culture intellectuelle du Moyen-Orient."
 building_RICE_harran_neoplatonic_academy:0 "$building_type_RICE_harran_neoplatonic_academy$"
 building_RICE_harran_neoplatonic_academy_desc:0 "$building_type_RICE_harran_neoplatonic_academy_desc$"
 RICE_harran_moon_temple_destroyed_tooltip:0 "Le Temple de la Lune n'a pas encore été détruit par un souverain fanatique non païen."
 RICE_harran_neoplatonic_academy_declined_tooltip:0 "L'Académie néoplatonicienne n'est pas encore en déclin"
 building_type_RICE_harran_neoplatonic_academy_athens:0 "Académie néoplatonicienne"
 building_type_RICE_harran_neoplatonic_academy_athens_desc:0 "Athènes abrite actuellement un certain nombre d'érudits païens, qui revendiquent une filiation intellectuelle avec l'Académie platonicienne originelle. Cependant, leur défense acharnée de leur forme unique de paganisme pourrait contrarier les autorités non païennes..."
 
 # Modifiers
 RICE_harran_sun_blessing:0 "La bénédiction de Sol"
 RICE_harran_sun_blessing_desc:0 "On dit que l'une des sept planètes, le soleil, est favorable à ce personnage."
 RICE_harran_moon_blessing:0 "La bénédiction de Luna"
 RICE_harran_moon_blessing_desc:0 "On dit que l'une des sept planètes, la lune, est favorable à ce personnage."
 RICE_harran_mercury_blessing:0 "La bénédiction de Mercure"
 RICE_harran_mercury_blessing_desc:0 "On dit que l'une des sept planètes, Mercure, est favorable à ce personnage."
 RICE_harran_venus_blessing:0 "La bénédiction de Vénus"
 RICE_harran_venus_blessing_desc:0 "On dit que l'une des sept planètes, Vénus, est favorable à ce personnage."
 RICE_harran_mars_blessing:0 "La bénédiction de Mars"
 RICE_harran_mars_blessing_desc:0 "On dit que l'une des sept planètes, Mars, est favorable à ce personnage."
 RICE_harran_jupiter_blessing:0 "La bénédiction de Jupiter"
 RICE_harran_jupiter_blessing_desc:0 "On dit que l'une des sept planètes, Jupiter, est favorable à ce personnage."
 RICE_harran_saturn_blessing:0 "La bénédiction de Saturne"
 RICE_harran_saturn_blessing_desc:0 "On dit que l'une des sept planètes, Saturne, est favorable à ce personnage."
 RICE_harran_revitalized_neoplatonic_academy_leader:0 "Revitalisation de l'Académie néoplatonicienne à Harran"
 RICE_harran_revitalized_neoplatonic_academy_leader_desc:0 "Si un leader a fait le plus pour l'érudition païenne, c'est certainement ce personnage. Il est presque certain que ses efforts pour redonner à l'Académie néoplatonicienne la place qui lui revient dans le monde seront salués par les hommes et les femmes païens érudits pour les siècles à venir."
 RICE_harran_neoplatonic_academy_recently_revitalized:0 "L'Académie Néoplatonicienne récemment revitalisée"
 RICE_harran_neoplatonic_academy_recently_revitalized_desc:0 "L'Académie néoplatonicienne d'Harran a récemment été revitalisée avec l'aide d'un souverain avant-gardiste. En conséquence, les érudits affluent dans la région, qui devient un centre majeur de l'apprentissage et des arts."
 RICE_harran_patronized_neoplatonic_academy_hellenic:0 "Patron de l'Académie néoplatonicienne"
 RICE_harran_patronized_neoplatonic_academy_hellenic_desc:0 "Ce personnage a généreusement fait don d'une partie de ses biens à l'Académie Néoplatonicienne d'Harran, garantissant ainsi la pérennité de l'illustre lignée de penseurs et d'érudits païens."
 RICE_harran_patronized_neoplatonic_academy_pagan:0 "Patron de l'Académie néoplatonicienne"
 RICE_harran_patronized_neoplatonic_academy_pagan_desc:0 "Ce personnage a généreusement fait don d'une partie de ses biens à l'Académie Néoplatonicienne d'Harran, garantissant ainsi la pérennité de l'illustre lignée de penseurs et d'érudits païens."
 RICE_harran_patronized_neoplatonic_academy_nonpagan:0 "Patron de l'Académie néoplatonicienne"
 RICE_harran_patronized_neoplatonic_academy_nonpagan_desc:0 "Ce personnage a généreusement fait don d'une partie de ses biens à l'Académie Néoplatonicienne d'Harran, garantissant ainsi la pérennité de l'illustre lignée de penseurs et d'érudits païens."
 RICE_harran_moon_temple_destroyer:0 "A détruit le temple de la Lune à Harran"
 RICE_harran_moon_temple_recently_destroyed:0 "Temple de la Lune à Harran récemment détruit"
 RICE_harran_historical_last_of_the_harranians:0 "Le dernier des païens harraniens"
 RICE_harran_historical_last_of_the_harranians_desc:0 "Ce personnage est l'un des derniers adeptes d'une ancienne forme de paganisme pratiquée autrefois dans la ville de Harran en Mésopotamie, qui combinait des éléments du paganisme mésopotamien et hellénique, le paganisme néoplatonicien. Il est certain que cette illustre lignée de pensée intellectuelle païenne s'éteindra bientôt, à moins d'un miracle divin."
 RICE_harran_historical_thabit_ibn_qurra:0 "Le Grand Harranien"
 RICE_harran_historical_thabit_ibn_qurra_desc:0 "Thabit ibn Qurra a été reconnu par de nombreuses personnes au Moyen-Orient comme l'un des érudits les plus éminents de sa génération, inégalé dans une variété de sujets, y compris l'astronomie, les mathématiques, la traduction linguistique, et plus encore."
 RICE_harran_historical_ibn_nabhan:0 "Dernier héritier des païens harraniens"
 RICE_harran_historical_ibn_nabhan_desc:0 "Ibn Nabhan est né dans une famille d'érudits qui, jusqu'à il y a une ou deux générations, pratiquait une forme de paganisme de Harran, et ses ancêtres comptent des noms éminents comme Thabit ibn Qurra. Certains disent qu'il n'est pas sûr de lui lorsque d'autres remettent en question l'authenticité de la conversion de sa famille à l'islam ; d'autres supposent même qu'il est secrètement favorable aux croyances de ses ancêtres et qu'il éprouve une grande tristesse face au déclin des anciennes traditions de Harran, à moins d'un miracle divin....."
 RICE_harran_courtier_former_moneylender:0 "Ancien usurier à Harran"
 RICE_harran_courtier_former_moneylender_desc:0 "Bien qu'il soit aujourd'hui très impliqué dans le monde universitaire, ce Harranien était autrefois prêteur."
 RICE_harran_courtier_prominent_harranian:0 "Harranien éminent"
 RICE_harran_courtier_prominent_harranian_desc:0 "Ce Harranien était, et est toujours, un leader influent dans la communauté des païens de Harran."
 RICE_harran_courtier_neoplatonic_fanatic:0 "Fanatique Néoplatonicien"
 RICE_harran_courtier_neoplatonic_fanatic_desc:0 "Ce Harranien croit fermement aux idéaux néoplatoniciens tels qu'ils sont enseignés à l'Académie néoplatonicienne."
 RICE_harran_courtier_ostracized_harranian:0 "Harranien ostracisé"
 RICE_harran_courtier_ostracized_harranian_desc:0 "Ce Harranien possède un certain nombre de croyances et d'idées peu orthodoxes pour un païen harranien, et a eu de nombreux désaccords avec d'autres Harraniens érudits."
 RICE_harran_courtier_devout_planet_worshipper:0 "Adorateur dévoué des planètes"
 RICE_harran_courtier_devout_planet_worshipper_desc:0 "Ce Harranien est très attaché au culte des sept planètes, à la manière harranienne."
 RICE_harran_courtier_tammuz_devotee:0 "Dévot de Tammuz"
 RICE_harran_courtier_tammuz_devotee_desc:0 "Ce Harranien est voué au culte de l'ancienne divinité mésopotamienne de la fertilité, Tammuz, connue des Grecs sous le nom d'Adonis."
 RICE_harran_treatise_astronomy_wrote:0 "Rédaction d'un traité sur les tables d'étoiles"
 RICE_harran_treatise_astronomy_wrote_desc:0 "Cet érudit harranien a acquis une certaine notoriété en écrivant récemment un traité sur les questions astronomiques."
 RICE_harran_treatise_astronomy_wrote_self:0 "Rédaction d'un traité sur les tables d'étoiles"
 RICE_harran_treatise_astronomy_wrote_self_desc:0 "Cet érudit harranien a écrit un traité sur les questions astronomiques."
 RICE_harran_treatise_astronomy_copy:0 "Traité sur les tables d'étoiles"
 RICE_harran_treatise_astronomy_copy_desc:0 "Un érudit harranien à la cour de ce personnage a écrit un traité d'astronomie et en a fourni une copie à ce personnage."
 RICE_harran_treatise_geometry_wrote:0 "Rédaction d'un traité sur les mesures et les figures"
 RICE_harran_treatise_geometry_wrote_desc:0 "Cet érudit harranien a acquis une certaine notoriété en rédigeant récemment un traité de géométrie, qui aborde des sujets tels que les ratios et les mesures."
 RICE_harran_treatise_geometry_wrote_self:0 "Rédaction d'un traité sur les mesures et les figures"
 RICE_harran_treatise_geometry_wrote_self_desc:0 "Cet érudit harranien a écrit un traité de géométrie, couvrant des sujets tels que les rapports et les mesures."
 RICE_harran_treatise_geometry_copy:0 "Traité sur les mesures et les figures"
 RICE_harran_treatise_geometry_copy_desc:0 "Un érudit harranien à la cour de ce personnage a rédigé un traité de géométrie, couvrant des sujets tels que les proportions et les mesures, et en a fourni une copie à ce personnage."
 RICE_harran_treatise_algebra_wrote:0 "Rédaction d'un traité sur la résolution des problèmes mathématiques"
 RICE_harran_treatise_algebra_wrote_desc:0 "Cet érudit harranien a acquis une certaine notoriété en écrivant récemment un traité d'algèbre, qui aborde des sujets tels que la résolution d'équations."
 RICE_harran_treatise_algebra_wrote_self:0 "Rédaction d'un traité sur la résolution des problèmes mathématiques"
 RICE_harran_treatise_algebra_wrote_self_desc:0 "Cet érudit harranien a écrit un traité d'algèbre, couvrant des sujets tels que la résolution d'équations."
 RICE_harran_treatise_algebra_copy:0 "Traité de résolution de problèmes mathématiques"
 RICE_harran_treatise_algebra_copy_desc:0 "Un érudit harranien à la cour de ce personnage a écrit un traité d'algèbre, couvrant des sujets tels que la résolution d'équations, et en a fourni une copie à ce personnage."
 RICE_harran_treatise_greek_philosophy_wrote:0 "Rédaction d'un traité sur les philosophes grecs"
 RICE_harran_treatise_greek_philosophy_wrote_desc:0 "Cet érudit harranien a acquis une certaine notoriété en écrivant récemment un traité sur des penseurs anciens comme Platon et Plotin."
 RICE_harran_treatise_greek_philosophy_wrote_self:0 "Rédaction d'un traité sur les philosophes grecs"
 RICE_harran_treatise_greek_philosophy_wrote_self_desc:0 "Cet érudit harranien a écrit un traité sur les penseurs de l'Antiquité comme Platon et Plotin."
 RICE_harran_treatise_greek_philosophy_copy:0 "Traité sur les philosophes grecs"
 RICE_harran_treatise_greek_philosophy_copy_desc:0 "Un érudit harranien à la cour de ce personnage a écrit un traité sur des penseurs anciens comme Platon et Plotin, et en a fourni une copie à ce personnage."
 RICE_harran_treatise_harranian_history_wrote:0 "Rédaction d'un traité sur l'histoire de l'Harranie"
 RICE_harran_treatise_harranian_history_wrote_desc:0 "Cet érudit harranien a acquis une certaine notoriété en écrivant récemment un traité sur l'histoire des Harraniens, en particulier sur leurs coutumes païennes."
 RICE_harran_treatise_harranian_history_wrote_self:0 "Rédaction d'un traité sur l'histoire de l'Harranie"
 RICE_harran_treatise_harranian_history_wrote_self_desc:0 "Cet érudit harranien a écrit un traité sur l'histoire des Harraniens, en particulier sur leurs coutumes païennes."
 RICE_harran_treatise_harranian_history_copy:0 "Traité sur l'histoire harranienne"
 RICE_harran_treatise_harranian_history_copy_desc:0 "Un érudit harranien à la cour de ce personnage a écrit un traité sur l'histoire des Harraniens, en particulier sur leurs coutumes païennes, et en a fourni une copie à ce personnage."
 RICE_harran_treatise_mysticism_wrote:0 "Rédaction d'un traité sur les images et les visions"
 RICE_harran_treatise_mysticism_wrote_desc:0 "Cet érudit harranien a acquis une certaine notoriété en écrivant récemment un traité sur divers sujets ésotériques et sur le mysticisme."
 RICE_harran_treatise_mysticism_wrote_self:0 "Rédaction d'un traité sur les images et les visions"
 RICE_harran_treatise_mysticism_wrote_self_desc:0 "Cet érudit harranien a écrit un traité sur divers sujets ésotériques et sur le mysticisme."
 RICE_harran_treatise_mysticism_copy:0 "Traité sur les images et les visions"
 RICE_harran_treatise_mysticism_copy_desc:0 "Un érudit harranien à la cour de ce personnage a écrit un traité sur divers sujets ésotériques et sur le mysticisme, et en a fourni une copie à ce personnage."
 RICE_harran_treatise_medicine_wrote:0 "A rédigé un traité sur le Jardin de la Médecine"
 RICE_harran_treatise_medicine_wrote_desc:0 "Ce savant harranien s'est acquis une certaine renommée en rédigeant récemment un traité sur la médecine et les sciences biologiques."
 RICE_harran_treatise_medicine_wrote_self:0 "Rédaction d'un traité sur le jardin de la médecine"
 RICE_harran_treatise_medicine_wrote_self_desc:0 "Cet érudit harranien a écrit un traité sur la médecine et les sciences biologiques."
 RICE_harran_treatise_medicine_copy:0 "Traité sur le Jardin de la Médecine"
 RICE_harran_treatise_medicine_copy_desc:0 "Un érudit harranien à la cour de ce personnage a écrit un traité sur la médecine et les sciences biologiques, et en a fourni une copie à ce personnage."
 RICE_harran_ibn_nabhan_internal_conflict:0 "Conflit spirituel intérieur"
 RICE_harran_ibn_nabhan_internal_conflict_desc:0 "Ibn Nabhan est né dans une famille musulmane qui, il n'y a pas si longtemps, professait une forme ancienne de paganisme remontant à l'époque des Grecs et des Romains. Il ressent actuellement un grand conflit interne sur cet aspect de son identité, mais peut-être trouvera-t-il bientôt un moyen de résoudre son angoisse."
 RICE_harran_ibn_nabhan_studying_grandfathers_writings:0 "Étudier les écrits religieux de Grand-père"
 RICE_harran_good_divination:0 "Bonnes lectures des corps célestes"
 RICE_harran_good_divination_desc:0 "Les astrologues païens de Harran ont prédit que de bonnes choses arriveraient à Harran dans un avenir proche."
 RICE_harran_bad_divination:0 "Mauvaises lectures des corps célestes"
 RICE_harran_bad_divination_desc:0 "Les astrologues païens d'Harran ont prédit que de mauvaises choses allaient arriver à Harran dans un avenir proche."
 RICE_harran_tammuz_festival:0 "Grande fête de Tammuz"
 RICE_harran_tammuz_festival_desc:0 "Le festival de Tammuz est une tradition ancienne à Harran. Une itération récente de cet événement a connu un grand succès, inspirant les païens locaux."
 RICE_harran_scholars_publish_texts:0 "Des savants de l'Académie néoplatonicienne ont récemment écrit des textes importants"
 RICE_harran_scholars_foreign_contacts:0 "Contacts avec des érudits étrangers"
 RICE_harran_neoplatonic_academy_athens_modifier:0 "Académie néoplatonicienne d'Athènes"
 RICE_harran_neoplatonic_academy_athens_modifier_desc:0 "L'Académie néoplatonicienne d'Athènes abrite un certain nombre d'érudits païens, qui revendiquent une filiation intellectuelle avec l'Académie platonicienne originelle. Cependant, bien qu'ils reçoivent un financement régulier de l'État, leur défense acharnée de leur forme unique de paganisme pourrait attirer les foudres de toute autorité non païenne..."
 RICE_harran_welcomed_neoplatonist_exiles:0 "Accueil des érudits néoplatoniciens exilés"
 RICE_harran_aficionado_of_ancient_history:0 "Passionné d'Histoire antique"
 RICE_harran_aficionado_of_ancient_history_desc:0 "Ce personnage a une passion pour l'histoire de l'antiquité, dépassant de loin celle des autres érudits, et croit que la préservation des monuments et reliques antiques est le devoir solennel des dirigeants sages et justes."

 # Decisions
 RICE_harran_pray_to_a_planet:0 "Prier pour une planète"
 RICE_harran_pray_to_a_planet_tooltip:0 "Vous effectuerez les bons rituels pour prier l'une des sept planètes."
 RICE_harran_pray_to_a_planet_effect_tooltip:0 "Gain d'un [character_modifier|El] en fonction de la planète à laquelle vous priez"
 RICE_harran_pray_to_a_planet_desc:0 "Ce sont les étoiles qui déterminent le destin humain et nous guident dans les moments de ténèbres, en particulier les sept planètes. Je ferai des offrandes à l'un de ces sept astres sacrés de la manière traditionnelle [ROOT.Char.GetFaith.GetAdjective]."
 RICE_harran_pray_to_a_planet_confirm:0 "Préparez-vous aux rituels !"
 RICE_harran_pray_to_a_planet_context_tooltip:0 "#emphasis Contexte historique :#! Le culte des corps célestes, en particulier des sept planètes classiques, était courant au Levant et en Mésopotamie. Les musulmans du début de la période médiévale, par exemple, ont souvent stéréotypé les païens d'Harran comme possédant une grande connaissance du ciel pour cette raison."
 RICE_harran_patronize_the_neoplatonic_academy:0 "Patronner l'Académie néoplatonicienne"
 RICE_harran_patronize_the_neoplatonic_academy_tooltip:0 "Vous fournirez à l'[harran_neoplatonic_academy|E] d'Harran les fonds dont elle a tant besoin."
 RICE_harran_patronize_the_neoplatonic_academy_effect_tooltip:0 "Augmente les chances que des [harranian_characters|El] apparaissent"
 RICE_harran_patronize_the_neoplatonic_academy_desc:0 "En tant que dernier vestige de l'enseignement hellénique antique, l'[harran_neoplatonic_academy|E] à Harran a constamment besoin d'investissements de la part de dirigeants généreux, prêts à fermer les yeux sur ses croyances et enseignements inhabituels."
 RICE_harran_patronize_the_neoplatonic_academy_confirm:0 "Au nom du savoir !"
 RICE_harran_patronize_the_neoplatonic_academy_context_tooltip:0 "#emphasis Contexte historique :#! L'Académie de Harran est censée descendre intellectuellement de l'Académie néoplatonicienne basée à Athènes, qui elle-même prétendait descendre intellectuellement de l'Académie originelle créée par Platon. Que ce soit vrai ou non, les intellectuels harraniens ont joué un rôle majeur dans les cours abbassides en tant que scientifiques, astrologues, médecins, etc. Historiquement, il semble avoir décliné et disparu au XIe siècle, lorsque les païens harraniens restants se sont convertis à d'autres religions comme l'islam."
 RICE_harran_revitalize_the_neoplatonic_academy:0 "Revitaliser l'Académie néoplatonicienne"
 RICE_harran_revitalize_the_neoplatonic_academy_tooltip:0 "Vous vous assurerez que l'[harran_neoplatonic_academy|E] à Harran ne sombrera jamais dans l'obscurité"
 RICE_harran_revitalize_the_neoplatonic_academy_effect_tooltip:0 "Vous vous assurerez que l'[harran_neoplatonic_academy|E] reste un centre de savoir pour les générations à venir et ne déclinera pas"
 RICE_harran_revitalize_the_neoplatonic_academy_desc:0 "Pendant des siècles, l'[harran_neoplatonic_academy|E] a été au bord d'un déclin irréversible - bien qu'elle ait survécu jusqu'à présent, nous ne pouvons pas attendre, et devons agir pour inverser cette tendance, et restaurer l'école à sa place légitime en tant qu'héritière des philosophes antiques !"
 RICE_harran_revitalize_the_neoplatonic_academy_confirm:0 "Le monde ne peut pas tomber dans l'obscurité."
 RICE_harran_revitalize_the_neoplatonic_academy_context_tooltip:0 "#emphasis Contexte historique :#! L'Académie de Harran est censée descendre intellectuellement de l'Académie néoplatonicienne basée à Athènes, qui elle-même prétendait descendre intellectuellement de l'Académie originelle créée par Platon. Que ce soit vrai ou non, les intellectuels harraniens ont joué un rôle majeur dans les cours abbassides en tant que scientifiques, astrologues, médecins, etc. Historiquement, il semble avoir décliné et disparu au XIe siècle, lorsque les païens harraniens restants se sont convertis à d'autres religions comme l'islam."
 RICE_harran_make_offerings_moon_temple:0 "Faire des offrandes au temple de la Lune de Harran"
 RICE_harran_make_offerings_moon_temple_tooltip:0 "Vous prierez au [harran_temple_of_the_moon|El] à Harran"
 RICE_harran_make_offerings_moon_temple_effect_tooltip:0 "Vous recevrez soit une faveur de [prestige|El] soit de [piety|El] en priant au [harran_temple_of_the_moon|El]"
 RICE_harran_make_offerings_moon_temple_desc:0 "Contre toute attente, le temple du dieu de la lune Sin est resté debout à Harran avant même l'époque de l'Empire romain. Il est temps que je rende hommage à Sin en offrant quelques cadeaux au temple."
 RICE_harran_make_offerings_moon_temple_confirm:0 "Préparez les offrandes !"
 RICE_harran_make_offerings_moon_temple_context_tooltip:0 "#emphasis Contexte historique :#! Le culte de la divinité lunaire mésopotamienne Sin remonte à l'époque sumérienne et a été attesté à Harran au début de la période médiévale. Son sanctuaire à Harran s'appelait E-hul-hul, la maison des joies, et a été détruit au milieu du XIe siècle par des chefs musulmans hostiles."
 RICE_harran_destroy_the_moon_temple:0 "Détruire le temple de la Lune de Harran"
 RICE_harran_destroy_the_moon_temple_tooltip:0 "Le monument aux blasphèmes païens doit être détruit !"
 RICE_harran_destroy_the_moon_temple_effect_tooltip:0 "Les païens près de Harran ne peuvent plus prendre la [decision|El] de #V Faire des Offrandes au [harran_temple_of_the_moon|El]#!"
 RICE_harran_destroy_the_moon_temple_desc:0 "Depuis bien trop longtemps, nous avons permis au blasphématoire [harran_temple_of_the_moon|El] de Harran de subsister - son existence continue est une insulte envers [ROOT.Char.GetFaith.HighGodName]. Il est temps que nous le rasions jusqu'aux fondations !"
 RICE_harran_destroy_the_moon_temple_confirm:0 "Brûlez tout !"
 RICE_harran_destroy_the_moon_temple_context_tooltip:0 "#emphasis Contexte historique :#! Le temple païen de Harran, qui était dédié à l'ancienne divinité lunaire mésopotamienne Sîn, a survécu à des siècles de guerres, de troubles et bien plus encore. Il a finalement connu sa fin vers le milieu du XIe siècle, lorsqu'il fut détruit par des dirigeants musulmans locaux hostiles, bien que la date exacte de sa destruction reste incertaine."
 RICE_harran_study_grandfathers_writings:0 "Étudier les écrits de votre grand-père sur la religion"
 RICE_harran_study_grandfathers_writings_tooltip:0 "Vous y découvrirez les réflexions de votre grand-père sur la religion et pourrez peut-être résoudre votre propre conflit spirituel intérieur."
 RICE_harran_study_grandfathers_writings_effect_tooltip:0 "Vous entamez une chaîne d'événements qui peut vous amener à décider de revenir ou non aux croyances de vos ancêtres."
 RICE_harran_study_grandfathers_writings_desc:0 "Il y a des années, mon grand-père m'a dit que si je remettais un jour en question ma foi et les mystères de l'univers, de lire ces écrits sur les questions religieuses. Il est temps que je résolve le conflit que je ressens au plus profond de mon cœur... Je remarque une lettre qui m'est adressée - que pourrait-elle me révéler ?"
 RICE_harran_study_grandfathers_writings_confirm:0 "Je vais d'abord lire la lettre de mon grand-père..."
 RICE_harran_study_grandfathers_writings_context_tooltip:0 "#emphasis Contexte historique :#! Ibn Nabhan, un descendant de célèbres érudits harraniens comme Thabit ibn Qurra, défendit fermement la conversion de son grand-père du paganisme harranien à l'islam (qui eut lieu à un moment donné au début ou au milieu des années 1000). Il relata son histoire à une connaissance, Muhammad bin Nasr, qui à son tour la relata à son élève, le célèbre juriste et historien hanbalite Ibn al-Jawzi, qui la consigna pour la postérité. Bien qu'Ibn Nabhan ne fût pas un païen (même si certains de ses parents plus âgés ont pu le rester), cela n'exclut pas la possibilité spéculative qu'il ait pu avoir des sympathies pour les traditions de ses ancêtres."
 RICE_harran_is_ibn_nabhan:0 "Est Ibn Nabhan"
 RICE_harran_write_scholarly_treatise:0 "Rédiger un traité savant"
 RICE_harran_write_scholarly_treatise_tooltip:0 "Vous passerez du temps à rédiger un traité sur un sujet savant."
 RICE_harran_write_scholarly_treatise_effect_tooltip:0 "Vous travaillerez à la rédaction d'un traité couvrant un sujet spécifique, ce qui vous rapportera éventuellement un [artifact|El] livre spécial ainsi qu'un [character_modifier|El] correspondant"
 RICE_harran_write_scholarly_treatise_desc:0 "En tant qu'érudit harranien, il est de mon devoir de perpétuer notre tradition d'érudition inégalée et renommée."
 RICE_harran_write_scholarly_treatise_confirm:0 "Bon, où est ma plume ?"
 RICE_harran_write_scholarly_treatise_context_tooltip:0 "#emphasis Contexte historique :#! Les érudits d'origine harranienne étaient stéréotypés à travers le Moyen-Orient pour leur supposé savoir dérivé de leur héritage païen. Un certain nombre, comme Thabit ibn Qurra, étaient fortement impliqués dans le milieu intellectuel de la cour abbasside et de la Maison de la Sagesse."
 RICE_decision_currently_working_on_treatise_requirement:0 "Ne travaille pas actuellement sur un traité savant"
 #RICE_harran_venerate_the_triad:0 "Venerate the Triad"
 #RICE_harran_venerate_the_triad_tooltip:0 "You will honor a member of the Heliopolitan Triad."
 #RICE_harran_venerate_the_triad_effect_tooltip:0 "You will choose between one of three [character_modifiers|El] representing your dedication to one of the three members of the Heliopolitan Triad."
 #RICE_harran_venerate_the_triad_desc:0 "Jupiter, Venus, and Mercury have been the three key deities of the pantheon at Baalbek, or Heliopolis, since ancient times. It is time that I prepare a major offering to them."
 #RICE_harran_venerate_the_triad_confirm:0 "Ready the offerings!"
 #RICE_harran_venerate_the_triad_context_tooltip:0 "#emphasis Historical Context:#! At Baalbek, known to the Romans as Heliopolis, the triad of Jupiter, Venus, and Mercury were worshipped above all gods. It is hypothesized that Jupiter was seen as the chief deity, Venus his consort, and Mercury their child, but this is highly speculative."
 RICE_harran_stop_funding_the_neoplatonic_academy:0 "Cesser de financer l'Académie néoplatonicienne"
 RICE_harran_stop_funding_the_neoplatonic_academy_tooltip:0 "Les néoplatoniciens ne méritent pas notre soutien."
 RICE_harran_stop_funding_the_neoplatonic_academy_desc:0 "Pendant des siècles, des érudits païens ont élu domicile à l'[harran_neoplatonic_academy|E] d'Athènes. Bien qu'ils ne soient pas [ROOT.Char.GetFaith.GetAdherentNamePlural], nous avons toléré leur présence en raison de leurs travaux intellectuels. Cependant, ils sont devenus arrogants et représentent un gaspillage des fonds de l'État, et je souhaite mettre fin au soutien de leur institution."
 RICE_harran_stop_funding_the_neoplatonic_academy_effect_tooltip:0 "Les Néoplatoniciens chercheront un nouveau foyer sous un dirigeant plus tolérant."
 RICE_harran_stop_funding_the_neoplatonic_academy_confirm:0 "Je ne les expulse pas, je mets simplement fin à leur financement !"
 RICE_harran_stop_funding_the_neoplatonic_academy_context_tooltip:0 "#emphasis Contexte historique :#! L'Académie néoplatonicienne d'Athènes a perduré en tant qu'institution jusqu'en 529 de notre ère, lorsque l'empereur Justinien a mis fin à son financement (bien que d'autres anciennes écoles aient continué à exister ailleurs dans l'Empire romain). Sous la direction du dernier scholarque connu de l'Académie, Damascius, les restes de l'école s'enfuirent dans l'Empire sassanide. Bien que certains de ces érudits soient ensuite retournés dans l'Empire romain, une théorie, qui ne fait pas l'unanimité, veut que certains d'entre eux - peut-être menés par Simplicius, l'élève de Damascius - se soient installés à Harran, fondant la supposée Académie néoplatonicienne de Harran qui perdurera jusqu'à l'époque médiévale."
 RICE_harran_welcome_neoplatonists_to_harran:0 "Accueillir les néoplatoniciens à Harran"
 RICE_harran_welcome_neoplatonists_to_harran_tooltip:0 "Ces érudits pourraient avoir besoin d'un nouveau foyer."
 RICE_harran_welcome_neoplatonists_to_harran_desc:0 "L'[harran_neoplatonic_academy|E] d'Athènes a été le foyer de nombreux érudits païens pendant des générations, mais ils ont fui leur base en raison du manque de soutien des autorités locales hostiles. Errant depuis lors, ils souhaitent s'installer et croient que Harran, avec son climat intellectuel diversifié, pourrait être l'endroit idéal pour rétablir l'[harran_neoplatonic_academy|El]."
 RICE_harran_welcome_neoplatonists_to_harran_effect_tooltip_1:0 "Un [harranian_courtier|El] arrivera à votre [court|El]"
 RICE_harran_welcome_neoplatonists_to_harran_effect_tooltip_2:0 "Les [rulers|El] au Moyen-Orient et en Asie Mineure peuvent désormais prendre la [decision|El] de #V Patronner l'Académie néoplatonicienne#!"
 RICE_harran_welcome_neoplatonists_to_harran_effect_tooltip_3:0 "Des [harranian_courtiers|El] vont désormais commencer à apparaître dans certaines parties du Moyen-Orient"
 RICE_harran_welcome_neoplatonists_to_harran_confirm:0 "Leur sagesse ancestrale nous éclairera !"
 RICE_harran_welcome_neoplatonists_to_harran_context_tooltip:0 "$RICE_harran_stop_funding_the_neoplatonic_academy_context_tooltip$"
 RICE_nabataean_ibn_wahshiyya_decision:0 "Compiler l'Agriculture nabatéenne"
 RICE_nabataean_ibn_wahshiyya_decision_tooltip:0 "La sagesse de mes ancêtres doit être sauvée !"
 RICE_nabataean_ibn_wahshiyya_decision_desc:0 "Au fil des années, j'ai rassemblé des fragments de sagesse antique en traduisant d'anciens ouvrages, en interrogeant des informateurs locaux et en rédigeant mes propres commentaires sur ce corpus de connaissances. Désormais, j'ai accumulé suffisamment d'informations pour les compiler en un livre, que j'appellerai #italic L'Agriculture nabatéenne#! puisque la majeure partie de son contenu se rapporte à l'agriculture."
 RICE_nabataean_ibn_wahshiyya_decision_effect_tooltip_1:0 "Vous recevrez un puissant livre [artifact|El], #V L'Agriculture nabatéenne#!"
 RICE_nabataean_ibn_wahshiyya_decision_confirm:0 "Cette sagesse doit être préservée pour la postérité !"
 RICE_nabataean_ibn_wahshiyya_decision_context_tooltip:0 "#emphasis Contexte historique :#! Ibn Wahshiyya (mort vers 930 de notre ère) était un érudit musulman et agronome dont l'œuvre majeure, #italic L'Agriculture nabatéenne#!, est notre principale source sur les Nabatéens d'Irak, un groupe de païens araméophones du sud de la Mésopotamie (à ne pas confondre avec les célèbres Nabatéens arabes du Levant qui bâtirent Pétra). Nabatéen lui-même, il prétendait même descendre du roi assyrien Sennachérib, dont le souvenir est célébré avec affection dans le folklore araméen de cette période. Bien que centré sur l'agriculture, #italic L'Agriculture nabatéenne#! couvre également des sujets tels que la magie, l'astronomie, la religion et bien d'autres ; l'ouvrage était très estimé et référencé par des érudits ultérieurs tels que Maïmonide, Ibn Khaldoun et Thomas d'Aquin."

