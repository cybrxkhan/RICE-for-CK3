 harran.0040.t:0 "Le Destin de Harran"
 harran.0040.desc:0 "[harran_county.GetNameNoTier], qui se trouve dans les collines escarpées du nord de la Mésopotamie, est depuis des siècles une curieuse relique des temps anciens, car ses habitants sont pour la plupart païens. Bien qu'ils aient coexisté pacifiquement avec leurs voisins musulmans pendant des années, et soient largement respectés pour leur savoir, j'ai récemment entendu dire qu'ils exigeaient une plus grande autonomie et davantage de liberté. Certains disent qu'il serait sage d'accorder à quelqu'un issu d'une famille harranienne influente, tel que le célèbre érudit [thabit_ibn_qurra.GetFullName], un certain pouvoir et une certaine autorité sur Harran."
 harran.0040.a.caliph:0 "Je pense qu'il est préférable que nous ayons un contrôle plus direct sur Harran."
 harran.0040.a.non_caliph:0 "J'ai entendu dire que [caliph_dude.GetTitledFirstName] ignore ces recommandations."
 harran.0040.b.caliph:0 "Je suis d'accord, et je pense que [thabit_ibn_qurra.GetTitledFirstName] serait un bon dirigeant."
 harran.0040.b.non_caliph:0 "J'ai entendu dire que [caliph_dude.GetTitledFirstName] accordera à Harran une plus grande autonomie."
 harran.0040.no_thabit_ibn_qurra_sad:0 "Vous continuerez à jouer en tant que [THIS.Char.GetTitledFirstNameNoTooltip], et [thabit_ibn_qurra.GetFullNameNoTooltip] ne recevra pas la propriété de Harran, ce qui signifie qu'il n'y aura aucun [landed|El] [rulers|El] qui soit [thabit_ibn_qurra.GetFaith.GetAdjective] nulle part sur la carte, à l'exception de ceux créés via le concepteur de dirigeant personnalisé."
 harran.0041.t:0 "Retour au bercail"
 harran.0041.desc:0 "Bien des années se sont écoulées depuis que j'ai arpenté les rues de [harran_county.GetNameNoTier]. Les terres fertiles d'autrefois deviennent poussiéreuses ; les gens changent, grandissent, meurent ; et la vie continue, impermanente comme toujours. Mais les étoiles dans le ciel ? Elles demeurent, comme elles l'ont toujours fait, et le feront toujours. Ceux qui lisent les étoiles savent que le destin peut avoir une volonté propre.\n\nC'est un étrange caprice du destin que [caliph_dude.GetTitledFirstName] m'ait choisi pour être le nouveau dirigeant de Harran. J'avais autrefois été ostracisé d'ici, mais à présent j'y reviens en triomphe. Bien que j'aie autrefois pensé que je resterais à jamais un érudit au sein de la prestigieuse Maison de la Sagesse, côtoyant les plus grands esprits de toutes les confessions et me penchant sur d'anciens tomes de savoir jusqu'aux heures tardives du petit matin, les étoiles ont tracé un autre chemin pour ma vie."
 harran.0041.desc.landless:0 "Cela fait de nombreuses années que j'ai vécu à [harran_county.GetNameNoTier]. Des terres agricoles autrefois fertiles deviennent poussiéreuses ; les gens changent, grandissent, meurent ; et la vie continue, impermanente comme toujours. Mais les étoiles dans le ciel ? Elles demeurent, comme elles l'ont toujours fait, et le feront toujours. Ceux qui lisent les étoiles savent que le destin peut avoir une volonté propre.\n\nC'est un étrange coup du sort qui m'a mené à [GetTitleByKey('c_baghdad').GetNameNoTier] en tant qu'érudit au sein de la prestigieuse Maison de la Sagesse, rencontrant les plus grands esprits de toutes les confessions et me penchant sur d'anciens tomes de savoir jusqu'aux heures tardives du petit matin. Pourtant, chaque jour, je me demande ce que les étoiles me réservent."
 harran.0041.a:0 "Comment en suis-je arrivé là ? Qu'est-ce qui m'a mené ici ?"
 harran.0041.a.tooltip:0 "Vous traverserez plusieurs événements sous la forme d'un Livre dont vous êtes le héros sur la vie de Thabit ibn Qurra. Certains aspects seront aléatoires, mais d'autres pourront avoir des conséquences importantes sur votre situation de départ."
 harran.0041.b:0 "Mais le passé est le passé. Maintenant, tournons-nous vers l'avenir !"
 harran.0041.b.tooltip:0 "C'est l'option de démarrage rapide. Votre situation de départ sera choisie aléatoirement."
 harran.0042.t:0 "Naissance"
 harran.0042.desc:0 "Peu après ma naissance, mes parents m'emmenèrent chez un astrologue local. Nous autres Harraniens sommes fiers de notre connaissance des corps célestes, transmise de génération en génération depuis l'époque des Grecs et des Romains. Même lorsque j'étais érudit à la Maison de la Sagesse, une grande partie de mon travail portait sur l'astronomie.\n\nL'astrologue dit que je mènerais une vie intéressante, car j'étais né sous l'influence d'une certaine étoile. Selon cet astrologue, l'étoile m'avait doté non seulement de renommée et d'une grande intelligence, mais aussi..."
 harran.0042.a:0 "Beauté et charme"
 harran.0042.b:0 "Grande force et prestance"
 harran.0042.c:0 "Une bonne famille et la prospérité"
 harran.0042.d:0 "Une influence et une renommée immenses"
 harran.0043.t:0 "Enfance"
 harran.0043.desc:0 "Mon père et mon grand-père occupèrent un certain nombre de postes importants au sein de la direction locale harranienne. Ils étaient également de prospères propriétaires terriens et des érudits renommés, et nous étions ainsi très en vue à Harran. Bien que je sois issu d'une famille privilégiée, la vie ne fut pas toujours heureuse. Quand j'étais jeune, j'eus le malheur de vivre une expérience traumatisante qui changea à jamais ma vision de la vie :"
 harran.0043.a:0 "Des bandits ont saccagé et pillé le manoir de ma famille"
 harran.0043.a.tooltip:0 "Ils ont pris beaucoup de nos objets de valeur, mais heureusement nous nous en sommes sortis pour la plupart indemnes. Malgré mon jeune âge, j'ai été courageux et j'ai alerté la plupart de ma maisonnée avant qu'ils ne puissent nous faire du mal."
 harran.0043.b:0 "J'ai failli mourir d'une longue et douloureuse maladie, mais j'ai survécu contre toute attente"
 harran.0043.b.tooltip:0 "J'ai dépéri pendant un an et n'ai survécu que grâce aux efforts d'un physicien itinérant. J'ai appris à quel point la vie pouvait être éphémère. Le physicien m'a tout de même appris une ou deux choses sur la médecine."
 harran.0043.c:0 "Mon amie, mon premier amour, une fille merveilleuse, tous m'ont dit qu'elle était morte."
 harran.0043.c.tooltip:0 "J'aurais pu la sauver ! Mais tout était de ma faute, n'est-ce pas ? Si seulement.... Non, elle n'est plus là. Je ne peux plus rien faire, mais son souvenir reste à jamais gravé dans mon cœur."
 harran.0043.d:0 "Un fils de noble - la brute locale - et ses sbires m'ont agressé"
 harran.0043.d.tooltip:0 "Ils m'ont laissé des cicatrices et des déformations, mais ma détermination n'a jamais été aussi forte par la suite. Mais aujourd'hui encore, je déteste ce salaud. S'il est toujours à Harran... je ne sais pas ce que je ferais !"
 harran.0044.t:0 "Éducation"
 harran.0044.desc:0 "Ainsi, bien que né dans les échelons supérieurs de la société harranienne, ma vie n'a pas toujours été faite de plaisirs et de jeux. Issu d'une famille d'éminents érudits harraniens remontant à au moins deux ou trois siècles, beaucoup d'attentes pesaient sur moi.\n\nJ'ai eu la chance d'étudier à l'Académie néoplatonicienne de Harran, dont la lignée remonte aux anciens Grecs et qui se dresse encore fièrement aujourd'hui. Pour moi et les autres étudiants de l'Académie, c'était un fardeau immense d'essayer de perpétuer ce que beaucoup considèrent comme un héritage mourant. Néanmoins, mes professeurs louaient ma soif de connaissance, et outre la philosophie bien sûr, j'étais tout particulièrement intéressé par l'apprentissage de..."
 harran.0044.a:0 "Rhétorique et discours"
 harran.0044.b:0 "Commandement et guerre"
 harran.0044.c:0 "Astronomie et mathématiques"
 harran.0044.d:0 "Comportement humain"
 harran.0044.e:0 "Histoire et littérature"
 harran.0045.t:0 "Âge adulte"
 harran.0045.desc:0 "Ma renommée en tant qu'érudit grandit et je rejoignis bientôt la Maison de la Sagesse à Bagdad. J'acquis une grande influence au sein de cette prestigieuse institution. Certains pensaient qu'en tant que Harranien, j'avais une compréhension innée des mystères de l'univers. La rumeur voulait que ma lignée intellectuelle ait été transmise sans interruption depuis Platon jusqu'à moi !\n\nJe rencontrai et correspondis avec de nombreux autres érudits - non seulement des Harraniens, mais des Arabes, des Persans, des Assyriens, des Grecs, des Indiens, et même des Chinois ! Mon ami le plus proche, cependant, était un compatriote harranien, [thabit_ibn_qurra_friend.GetFullName]. Quoi qu'il en soit, ils avaient tous leurs raisons d'être là, mais en ce qui me concerne, je..."
 harran.0045.a:0 "J'avais le devoir de préserver l'héritage de mes ancêtres"
 harran.0045.b:0 "Voulait atteindre l'immortalité en tant que grand penseur"
 harran.0045.c:0 "Désireux de contribuer à la société et d'aider les autres"
 harran.0045.d:0 "Je m'ennuyais et je n'avais rien de mieux à faire"
 harran.0046.t:0 "Vie Domestique"
 harran.0046.desc:0 "C'est également à cette époque que j'ai trouvé une femme, comme ma famille l'espérait depuis des années. Ce n'était pas une inconnue sans valeur. En fait, c'était quelqu'un qui aurait été accepté par mes compatriotes harraniens, et elle a déjà donné naissance à un fils pour moi. C'était une :"
 harran.0046.a:0 "Amie d'enfance de Harran"
 harran.0046.a.tooltip:0 "Ses origines étaient modestes, mais ma famille a reconnu sa vertu et ses capacités. Nous nous aimons beaucoup et elle est ma muse."
 harran.0046.b:0 "Membre d'un clan harranien éminent"
 harran.0046.b.tooltip:0 "Elle était l'héritière d'une fortune. Le mariage était donc évidemment pratique, mais je pense qu'il y a eu beaucoup de mariages pires."
 harran.0046.c:0 "Fille d'un érudit étranger"
 harran.0046.c.tooltip:0 "J'ai rencontré son père grâce à mes contacts à Bagdad, et il a été l'un de mes mentors. Malheureusement, il est décédé récemment."
 harran.0046.d:0 "Une esclave intelligente que j'ai rencontrée il y a des années"
 harran.0046.d.tooltip:0 "C'était une fille brillante et belle qui appartenait à un vieil érudit avec lequel je travaillais. Lorsque nous sommes tombés amoureux, je lui ai promis d'acheter sa liberté et de l'épouser une fois que je me serais fait un nom."
 harran.0047.t:0 "Les derniers païens"
 harran.0047.desc:0 "Mais maintenant je suis chez moi, en tant que chef de tout Harran ! C'est un immense honneur, mais aussi une position peu enviable. Certains parmi nous disent qu'en cette ère de nouvelles fois, nos perspectives de survie en tant que communauté distincte sont minces. Je ne suis pas en désaccord. Le temps joue contre nous. Rares sont ceux qui pratiquent les voies anciennes de peuples comme les Égyptiens et les Grecs.\n\nAlors que le soleil commence à se coucher, je continue de marcher le long de la route, et je finis par arriver au grand temple de Harran. Sur sa porte sont gravés les mots de Platon, notre estimé ancêtre : « Celui qui connaît sa propre essence devient divin. »\n\nJe lis la citation quelques fois, avant de lever les yeux vers le ciel de plus en plus sombre. Je contemple les étoiles, feignant de pouvoir y lire notre destin, avant de retrouver le chemin de la maison."
 harran.0047.desc.landless:0 "Je pense encore à mon foyer, à [GetTitleByKey('c_harran').GetNameNoTier]. Être à [GetTitleByKey('c_baghdad').GetNameNoTier] est un immense honneur, mais il y a aussi des défis en tant que païen. Certains parmi nous disent qu'en cette ère de nouvelles fois, nos perspectives de survie en tant que communauté distincte sont faibles. Je ne suis pas en désaccord. Le temps joue contre nous. Rares sont ceux qui pratiquent encore les anciennes voies de peuples comme les Égyptiens et les Grecs.\n\nJe pense au vieux grand temple de Harran devant lequel je passais si souvent. Sur sa porte sont gravés les mots de Platon, notre estimé ancêtre : « Celui qui connaît sa propre essence devient divin. »\n\nJe murmure la citation quelques fois, alors que je me tiens dehors, regardant le ciel de plus en plus sombre. Je contemple les étoiles, faisant semblant de pouvoir lire notre destin, avant de rentrer à l'intérieur."
 harran.0047.a:0 "Je suis Thabit des Harraniens, nous qui sommes les derniers païens de cette terre."
 harran.0047.info:0 "#emphasis Contexte historique :#! Le païen Thabit ibn Qurra (826 ou 836 à 901 de notre ère) était un érudit basé à Bagdad durant l'Âge d'or islamique. Il contribua à de nombreux domaines, notamment les mathématiques, l'astronomie et la physique.\n\nThabit n'est pas connu pour avoir exercé un grand pouvoir politique en soi, et il a peut-être même été ostracisé de sa ville natale de Harran, de sorte que sa représentation ici en tant que personnage jouable est fictive (et principalement pour avoir un Harranien plausiblement jouable). Néanmoins, Thabit détenait un certain degré d'influence en tant qu'astronome de la cour et ami personnel du calife al-Mu'tadid.\n\nLes descendants de Thabit - tant païens que musulmans - continueraient à jouer des rôles importants dans les cercles intellectuels islamiques jusqu'au XIe siècle."
