 nick_RICE_the_chaldean_desc:0 "Ce personnage est fier de son peuple, les soi-disant Nabatéens d'Irak (à ne pas confondre avec les Nabatéens du Levant), qui sont les autochtones araméophones du sud de l'Irak, descendants des anciens Mésopotamiens. C'est pourquoi il est connu sous le nom de #italic $nick_RICE_the_chaldean$#!. Chose notable, il prétend même descendre de l'ancien roi assyrien Sennachérib."
