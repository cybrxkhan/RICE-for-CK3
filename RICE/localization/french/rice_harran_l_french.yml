 harran.0060.t:0 "Ibn Nabhan"
 harran.0060.desc:0 "Aujourd'hui, je rencontre personnellement un érudit nommé [ibn_nabhan.GetFullName]. Il est issu d'un clan illustre lié à [harran_county.GetNameNoTier], et descend de célèbres érudits païens harraniens comme le renommé [thabit_ibn_qurra.GetFullName] et son arrière-petit-fils [ibrahim_al_sabi.GetFullName]. Une grande partie de sa famille s'est convertie à l'islam il y a une ou deux générations, le plus célèbre étant son grand-père [hilal_al_sabi.GetFullName], et il a toujours affirmé que la conversion était sincère même si d'autres restent sceptiques."
 harran.0060.desc.caliph:0 "\n\nAlors que nous engageons une agréable conversation intellectuelle, je reviens sur mon offre. « Avez-vous réfléchi à ma proposition de vous nommer chef de Harran ? C'est la ville natale de votre famille, après tout. Êtes-vous toujours intéressé ? »"
 harran.0060.desc.non_caliph:0 "\n\nAlors que nous nous engageons dans une agréable conversation intellectuelle, je mentionne une rumeur que j'ai entendue récemment. « Est-il vrai que [caliph_dude.GetTitledFirstName] a proposé de vous nommer dirigeant de Harran ? J'imagine que ce serait un immense honneur étant donné que Harran est la ville natale de votre famille. »"
 harran.0060.a:0 "« Hélas, » il secoue la tête, « une telle offre devra être refusée. »"
 harran.0060.b:0 "« J'irai à Harran, oui, » répond-il. « C'est mon destin. »"
 harran.0060.no_ibn_nabhan_sad:0 "Vous continuerez à jouer en tant que [THIS.Char.GetTitledFirstNameNoTooltip], et [ibn_nabhan.GetFullNameNoTooltip] ne recevra pas la propriété de [harran_county.GetNameNoTier], ce qui signifie que même s'il n'est pas un [thabit_ibn_qurra.GetFaith.GetAdjective], il n'y aurait aucun [ruler|El] nulle part sur la carte avec un lien vers cette ancienne [faith|El], à l'exception de ceux créés via le créateur de dirigeant personnalisé."
 harran.0061.t:0 "Retour au bercail"
 harran.0061.desc:0 "Cela fait de nombreuses années que je n'ai pas arpenté les rues de [harran_county.GetNameNoTier]. Les terres fertiles d'autrefois deviennent poussiéreuses ; les gens changent, grandissent, meurent ; et la vie continue, impermanente comme toujours. Mais les étoiles dans le ciel ? Elles demeurent, comme elles l'ont toujours fait, et le feront toujours. Ceux qui lisent les étoiles savent que le destin peut avoir une volonté propre.\n\nC'est un étrange coup du sort que [caliph_dude.GetTitledFirstName] m'ait choisi pour être le nouveau dirigeant de Harran. La cité était en déclin, peut-être en corrélation avec le déclin de son ancienne communauté païenne et de ses érudits.\n\nJe passe devant les ruines de l'ancienne Académie néoplatonicienne, puis devant les ruines du Temple de la Lune. M'agenouillant au sol, je fouille dans les décombres et trouve ce qui reste de la porte du temple. Je peux encore distinguer les mots de Platon gravés dans son bois : « Celui qui connaît sa propre essence devient divin. »\n\nJe relis la citation plusieurs fois, avant de lever les yeux vers le ciel de plus en plus sombre. Je contemple les étoiles, prétendant pouvoir d'une manière ou d'une autre lire notre destin, avant de retrouver le chemin de ma demeure."
 harran.0061.desc.landless:0 "Cela fait de nombreuses années que j'ai arpenté les rues de [harran_county.GetNameNoTier]. Les terres fertiles d'autrefois deviennent poussiéreuses ; les gens changent, grandissent, meurent ; et la vie continue, impermanente comme toujours. Mais les étoiles dans le ciel ? Elles demeurent, comme elles l'ont toujours fait, et le feront toujours. Ceux qui lisent les étoiles savent que le destin peut avoir une volonté propre.\n\nC'est un étrange coup du sort que je sois de retour, témoin de [harran_county.GetNameNoTierNoTooltip] dans son état actuel. La cité était en déclin, peut-être en corrélation avec le déclin de son ancienne communauté païenne et de ses érudits.\n\nJe passe devant les ruines de l'ancienne Académie néoplatonicienne, puis devant les ruines du Temple de la Lune. Agenouillé sur le sol, je tamise un peu de gravats, et trouve ce qui reste de la porte du temple. Je peux encore distinguer les mots de Platon gravés dans son bois : « Celui qui connaît sa propre essence devient divin. »\n\nJe relis la citation quelques fois, avant de lever les yeux vers le ciel de plus en plus sombre. Je contemple les étoiles, prétendant pouvoir d'une manière ou d'une autre lire notre destin, avant de retrouver le chemin de ma demeure."
 harran.0061.a:0 "Je suis [ibn_nabhan.GetFirstNameNoTooltip], dernier descendant des anciens païens de Harran."
 harran.0061.info:0 "#emphasis Contexte historique :#! Ibn Nabhan (1020 ou 1024 à 1118 ap. J.-C.) était l'un des derniers descendants connus du célèbre érudit païen harranien du IXe siècle, Thabit ibn Qurra. Il est connu pour son récit de la conversion de son grand-père Hilal à l'islam plusieurs années avant sa naissance.\n\nLa chaîne d'événements de RICE pour Ibn Nabhan est un moyen semi-plausible mais en fin de compte fictif de se convertir au harranisme pour cette date de début tardive. En réalité, il était probablement un musulman dévot, ou du moins quelqu'un qui s'est donné la peine de souligner l'adhésion de sa famille à l'islam dans ses écrits, peut-être pour dissiper tout soupçon que leur conversion n'était pas sincère."
 harran.0062.t:0 "Le Visiteur"
 harran.0062.desc:0 "Je suis assis dans l'obscurité de ma bibliothèque, sirotant un thé à la menthe tandis que ma connaissance entre dans la pièce. C'est un érudit de la Maison de la Sagesse avec qui j'ai travaillé lorsque je vivais à Bagdad, et il sourit en me rejoignant. Je lui offre du thé, et nous discutons agréablement de divers sujets pour prendre des nouvelles.\n\nFinalement, notre conversation dérive vers le sujet de la religion. « J'ai entendu quelque chose d'intéressant au sujet de ton grand-père [hilal_al_sabi.GetFullName] l'autre jour, » me dit mon ami.\n\nEncore ça ? Je me tortille inconfortablement, mais ne dis rien pour l'instant, et continue de siroter mon thé."
 harran.0062.a:0 "Mon manque de piété n'est pas vraiment une nouvelle pour lui."
 harran.0063.t:0 "Le rêve de Hilal"
 harran.0063.desc:0 "« Vous avez dit pendant de nombreuses années que votre grand-père s'est converti à l'islam grâce à un rêve, un signe certain d'Allah lui-même. » Mon ami sourit. « L'un de mes mentors, un homme âgé, qui connaissait votre grand-père, a dit qu'il n'avait jamais entendu parler d'une telle chose, mais admet que peut-être sa mémoire n'est plus ce qu'elle était à cause de la vieillesse. Je ne doute pas de vous, mais cela me fait me demander si votre grand-père disait la vérité - sans vouloir lui manquer de respect. » \n\nJe me caresse le menton et regarde mon ami en silence. Beaucoup remettent en question l'histoire de mon grand-père. Je le sais.\n\nJe réfléchis à la façon de répondre."
 harran.0063.a:0 "L'histoire est vraie, mon ami ! Mon grand-père était un vrai croyant."
 harran.0063.a.tooltip:0 "Vous restez un véritable fidèle de la [faith|El] [THIS.Char.GetFaith.GetAdjective], et ne serez jamais tenté d'explorer les voies ancestrales de vos aïeux."
 harran.0063.b:0 "« Eh bien... Je pense que mon grand-père était un vrai croyant, mais... »"
 harran.0063.b.tooltip:0 "Vous admettez avoir quelques doutes intérieurs concernant la conversion de votre grand-père, qui s'est éloigné des croyances [thabit_ibn_qurra.GetFaith.GetAdjectiveNoTooltip|l]s de vos ancêtres. Peut-être pourriez-vous explorer ces croyances plus en profondeur à l'avenir...."
 harran.0064.t:0 "Un vrai croyant ?"
 harran.0064.desc:0 "« Peut-être que mon mentor s'est trompé à cause de son grand âge, » mon interlocuteur hausse les épaules. « Je ne veux pas remettre en question votre propre foi, bien sûr. Je pensais simplement que c'était quelque chose d'intéressant. Peu importe, je suis probablement en train de vous mettre mal à l'aise, alors je m'en excuse. »\n\n« Bien sûr, » dis-je poliment. Nous sirotions notre thé pendant quelques instants encore, savourant son goût, avant que je ne poursuive : « Maintenant, sans vouloir changer de sujet, avez-vous lu le nouveau traité écrit par... »"
 harran.0064.a:0 "Nous discutons pendant plusieurs heures avant que mon interlocuteur ne prenne congé."
 harran.0065.t:0 "Un vrai croyant ?"
 harran.0065.desc:0 "« Mais quoi ? » dit-il.\n\nJe fronce les sourcils.\n\n« Je ne veux pas insinuer qu'il était secrètement un apostat, mais... » Je choisis mes mots avec soin. « J'ai toujours senti qu'il avait de la sympathie pour sa religion de naissance. Je pouvais le voir à la façon dont il parlait avec tendresse de nos ancêtres. »\n\n« Les accomplissements savants des païens de Harran ne sont pas à prendre à la légère ! Votre ancêtre, [thabit_ibn_qurra.GetFullName], était un érudit rare de son époque. » Mon ami hoche la tête. « Mais si le cœur de votre grand-père est sincère, grâce à ce rêve, alors c'est tout ce qui compte. Certes, vous avez encore quelques parents égarés qui croient toujours en vos anciens dieux, et je sais que vous n'avez jamais été l'homme le plus pieux, mais au moins vous êtes aussi un croyant, n'est-ce pas ? »"
 harran.0065.a:0 "Je marque une nouvelle pause, avant de dire : « Bien sûr. »"
 harran.0065.tooltip:0 "Vous commencez à vous demander si la conversion de votre grand-père était authentique et, à votre tour, vous vous interrogez profondément sur votre propre [faith|El]. Vous serez d'humeur sombre pendant un certain temps, mais vous trouverez peut-être un moyen de résoudre ce problème à l'avenir...."
 harran.0066.t:0 "Introspection"
 harran.0066.desc:0 "Même si cela fait un moment, la conversation que j'ai eue avec mon ami érudit au sujet de mon grand-père [hilal_al_sabi.GetFullName] pèse encore lourdement sur mon esprit. Après tout, le rêve profond est un thème récurrent que j'entends dans d'autres histoires similaires de conversion religieuse.\n\nJe ne fais qu'argumenter avec véhémence en faveur de la sincérité de la conversion de mon grand-père, peut-être pour refouler mes propres doutes à ce sujet, et de ma propre foi.\n\nDepuis mon installation à Harran, j'ai à l'occasion consulté les archives de ma famille. Ce sont principalement des tomes poussiéreux de savoir, certains vieux d'un siècle ou deux, et quelques-uns provenant de l'Académie néoplatonicienne aujourd'hui disparue qui se trouvait autrefois à Harran. Aujourd'hui, cependant, je triais le bureau de mon grand-père quand je suis tombé sur un petit coffre verrouillé que je n'ai pas reconnu au premier abord."
 harran.0066.a:0 "Attendez un instant...."
 harran.0067.t:0 "Les Écrits de Grand-père"
 harran.0067.desc:0 "Je reconnais le coffre. Mon grand-père m'en a donné la clé, il y a de nombreuses années, juste avant de mourir, me disant de l'ouvrir si jamais je nourrissais des doutes quant à ma place dans l'univers. Je récupère la clé et, les mains tremblantes, déverrouille le coffre.\n\nEncore des papiers. Évidemment.\n\nJ'en parcours quelques-uns, et constate qu'il s'agit de lettres personnelles et de réflexions que mon grand-père avait sur divers sujets... principalement de nature religieuse. Ce sont des lamentations sur le déclin de la foi [thabit_ibn_qurra.GetFaith.GetAdjective], et la lutte intérieure de mon grand-père quant à savoir où se trouvaient ses loyautés, spirituellement."
 harran.0067.a:0 "Des écrits si sombres ! Je pourrai peut-être les examiner plus en détail plus tard"
 harran.0067.tooltip:0 "Vous avez désormais accès à une [decision|El] où vous pouvez tenter de résoudre le dilemme que vous, en tant qu'Ibn Nabhan, ressentez à propos de votre [faith|El]. Quel chemin spirituel choisirez-vous ? Comment honorerez-vous l'ancien héritage des Harraniens, au final ?"
 harran.0068.opening:0 "À mon petit-fils :"
 harran.0068.desc:0 "Si vous lisez ceci, alors je suis parti depuis longtemps. Vous êtes un homme intelligent et réfléchi, digne de nos ancêtres. Je vous en prie, comprenez l'angoisse spirituelle que j'ai ressentie quant à mon choix de religion - les nouvelles fois de nos amis et voisins, ou les traditions de nos aïeux ?\n\nJe crains que vous aussi, vous ayez des doutes un jour, c'est pourquoi j'ai préparé ces écrits, ainsi que mes commentaires sur divers textes, pour vous guider vers la bonne décision - quel que soit votre choix.\n\nTout d'abord, je vous suggère de consulter mon commentaire sur Platon, qui concerne son texte sur..."
 harran.0068.a:0 "Merci, grand-père. J'étudierai ces écrits."
 harran.0068.tooltip:0 "Vous passerez du temps à lire et à contempler les écrits de votre grand-père, à la recherche de réponses qui, vous l'espérez, répondront à votre trouble spirituel."
 harran.0069.t:0 "Le choix"
 harran.0069.desc:0 "Après avoir passé des semaines à étudier les écrits et commentaires sur divers textes que mon grand-père m'avait laissés, je comprends désormais mieux mon conflit intérieur, car c'était le même que celui qu'il ressentait. Mes estimés ancêtres ont acquis une grande influence grâce à leur statut d'érudits [hilal_al_sabi.GetFaith.GetAdherentNamePlural] éminents, mais leur lignée suscite moins d'intérêt de nos jours. Même l'Académie néoplatonicienne de Harran n'existe plus.\n\nJ'ai longuement médité sur cette question, et discuté de ma décision avec ma famille. Je sais qu'il pourrait y avoir des conséquences, mais j'ai décidé qu'au plus profond de mon cœur, je ressens un lien plus étroit envers..."
 harran.0069.a:0 "La vraie foi [ROOT.Char.GetFaith.GetAdjective], en laquelle je continuerai de croire comme je l'ai toujours fait."
 harran.0069.a.tooltip:0 "Les anciennes coutumes de Harran ne sont plus que des ombres effacées du passé. Vous continuerez d'être un croyant de la [faith|El] [THIS.Char.GetFaith.GetAdjective], pour l'instant."
 harran.0069.b:0 "Les anciennes croyances [thabit_ibn_qurra.GetFaith.GetAdjectiveNoTooltip]s de mes ancêtres, que je vais maintenant adopter."
 harran.0069.b.tooltip:0 "Bien que les païens de Harran soient peu nombreux, ils doivent être fiers et endurer ! Vous apprendrez tout ce que vous pourrez des textes spirituels et philosophiques [thabit_ibn_qurra.GetFaith.GetAdherentNamePlural], afin de pouvoir pratiquer leur authentique religion païenne, car c'est désormais votre religion également."
