 oceania.0080.t:0 "Le chasseur de tortues"
 oceania.0080.desc:0 "Un[hunter.Custom('FR_E')] jeune [hunter.GetWomanMan] de culture [local_culture.GetName] du nom de [hunter.GetFirstName] s'est présenté[hunter.Custom('FR_E')] devant moi, avec une tortue qu'[hunter.GetSheHe] a personnellement tué[hunter.Custom('FR_E')] lors d'une récente sortie en mer.\n\nLes [local_culture.GetCollectiveNounNoTooltip|l] prisent ces créatures majestueuses, et seuls les braves et les dignes sont capables de les abattre, et de partager leur viande et leurs carapaces avec tous.\n\nQue [hunter.GetFirstNameNoTooltip] me présente cela est un grand cadeau, et il est clair qu'[hunter.GetSheHe] souhaite être reconnu[hunter.Custom('FR_E')] pour son exploit."
 oceania.0080.a:0 "Un bon cadeau, mais chasser les tortues ne mérite pas de reconnaissance."
 oceania.0080.b:0 "Merci - votre courage audacieux sera largement célébré !"
 oceania.0080.c:0 "J'ai besoin des services de braves [hunter.GetWomenMen] comme vous."
 oceania.0080.info:0 "#emphasis Contexte historique :#! La chasse aux tortues est traditionnellement pratiquée à travers le monde, et revêt souvent d'importantes fonctions rituelles ou sociétales en raison de la difficulté de chasser cet animal et du fait que sa viande est souvent considérée comme un mets délicat. Dans de nombreuses communautés océaniennes, par exemple, chasser les tortues peut être considéré comme un signe de générosité (offrir la viande aux autres), et une démonstration de bravoure et de virilité."
 oceania.0081.t:0 "Chanter et danser, ou mourir"
 oceania.0081.desc:0 "Il existe un vieux dicton parmi notre peuple, les [ROOT.Char.GetCulture.GetCollectiveNoun|l] : « Si tu ne chantes pas et ne danses pas, tu meurs. »\n\nPas au sens littéral, bien sûr ; plutôt, exécuter des danses et des chants, en particulier lors de cérémonies importantes - n'est-ce pas là l'essence même de l'humanité ? De vivre en communauté avec les autres ?"
 oceania.0081.a:0 "En effet. En effet, c'est le cas."
 oceania.0081.b:0 "Pour la plupart oui, mais pas toujours."
 oceania.0082.t:0 "Perles de sagou"
 oceania.0082.desc:0 "Mes serviteurs m'ont préparé un bol frais de [Glossary( 'perles de sagou', 'SAGO_GLOSS' )] mélangé avec du lait de coco et du sucre. Un accompagnement rafraîchissant pour moi tout au long de cette chaude journée ici à [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier] !"
 oceania.0082.a:0 "Ah ! Si rafraîchissant !"
 oceania.0083.t:0 "Offrandes de sagou"
 oceania.0083.desc:0 "Mon [chaplain.GetCouncilTitle], [chaplain.GetFirstName], a porté à mon attention une affaire importante concernant des esprits locaux. [chaplain.GetSheHe] a discerné qu'il existe un certain nombre d'esprits dans les parties boisées et sauvages de [county.GetNameNoTier] qui pourraient être apaisés, si nous leur offrons du [Glossary( 'sagou', 'SAGO_GLOSS' )] ainsi que d'autres nourritures, selon la manière traditionnelle [ROOT.Char.GetFaith.GetAdjective].\n\nS'ils sont satisfaits du #italic sagou#!, croit [chaplain.GetFirstNameNoTooltip], ils pourraient même nous aider de diverses manières invisibles."
 oceania.0083.a:0 "Une bonne idée ! Faisons cela."
 oceania.0083.b:0 "Nous n'avons pas besoin de l'aide des esprits."
 oceania.0084.t:0 "Cacatoès"
 oceania.0084.desc:0 "Il y a quelque temps, afin de mieux évaluer les conditions économiques de mon royaume, j'ai demandé aux marchands opérant autour de [county.GetNameNoTier] de me fournir des rapports sur leurs activités commerciales, et sur les biens qu'ils importent ou exportent.\n\nCurieusement, il semble que les cacatoès soient une exportation populaire de [county.GetNameNoTierNoTooltip]. Je me suis renseigné[ROOT.Char.Custom('FR_E')] davantage sur les raisons de ce phénomène, et les marchands m'ont dit que malgré le petit nombre de cacatoès exportés, ils sont extrêmement populaires parmi les élites fortunées d'autres contrées en raison de leur nature affectueuse et de leur capacité à imiter la parole humaine."
 oceania.0084.a:0 "Comme c'est fascinant ! Voilà qui est bon à entendre."
 oceania.0084.b:0 "Ils devraient essayer d'en attraper et d'en vendre davantage."
 oceania.0084.info:0 "#emphasis Contexte historique :#! Les cacatoès ont été exportés et admirés comme oiseaux exotiques pendant de nombreux siècles en dehors de leurs terres natales. Leur plus ancienne représentation en Europe se trouve dans le livre de fauconnerie #italic De arte venandi cum avibus#! de l'empereur du Saint-Empire romain germanique Frédéric II au XIIIe siècle ; autre exemple, dans le Japon du début de l'époque moderne, ils étaient parfois représentés dans des peintures religieuses bouddhistes."
 oceania.0085.t:0 "Oiseau de paradis"
 oceania.0085.desc:0 "Les plumes d'oiseaux de paradis sont une exportation lucrative depuis des siècles, voire plus longtemps. Récemment, la qualité des plumes de ces oiseaux chassés dans [county.GetNameNoTier] a acquis une certaine renommée, et elles se vendent à des prix plus élevés que la normale."
 oceania.0085.a:0 "Excellente nouvelle !"
 oceania.0085.info:0 "#emphasis Contexte historique :#! La chasse aux oiseaux de paradis pour leurs plumes a une longue histoire. Bien que ces oiseaux ne se trouvent qu'en Nouvelle-Guinée, aux Moluques et en Australie, leurs plumes étaient largement commercialisées à travers l'Ancien Monde, de la Chine au Moyen-Orient et à l'Europe. Par exemple, il est attesté que les chevaliers européens médiévaux portaient ces plumes sur leurs casques."
 oceania.0086.t:0 "$travel_event_prefix$ Un casoar"
 oceania.0086.desc:0 "« Attention ! » proclame [traveler.GetTitledFirstName]. « Ne vous approchez pas trop de cette chose ! »\n\nNotre voyage à [ROOT.Char.GetCurrentLocation.GetName] s'est interrompu lorsque nous sommes tombés sur un oiseau incapable de voler, au plumage sombre, au visage coloré et au regard sérieux et acéré. Sa taille, comparable à celle d'un petit humain, était évidente même de loin.\n\n« Les casoars sont des oiseaux dangereux », dit [traveler.GetFirstNameNoTooltip], nous faisant signe de rester à distance de l'animal. « Ils peuvent vous arracher le cou d'un coup de griffes. Nous devrions le contourner. »"
 oceania.0086.a:0 "Il n'est pas si effrayant, et nous avons des armes !"
 oceania.0086.b:0 "Mieux vaut prévenir que guérir. Contournons-le."
 oceania.0087.t:0 "Œufs de mégapode"
 oceania.0087.desc:0 "Divers types d'oiseaux [Glossary( 'mégapodes', 'MEGAPODE_GLOSS' )] peuvent être trouvés dans tout [county.GetNameNoTier].\n\nComme leurs œufs sont des mets délicats et des symboles de statut pour les [county_culture.GetCollectiveNoun|l] locaux, leurs sites de nidification sont traditionnellement protégés ; les gens ne peuvent récolter leurs œufs que dans certaines conditions rituelles pour garantir un approvisionnement stable et à long terme en œufs.\n\nCependant, il y a eu récemment des disputes parmi les habitants sur le nombre d'œufs qu'ils #italic pourraient#! récolter. Certains soutiennent que plus d'œufs devraient être collectés comme nourriture et comme cadeaux pour établir des relations. D'autres disent qu'une telle avidité est honteuse et va à l'encontre des coutumes rituelles liées à ces œufs."
 oceania.0087.a:0 "Récoltons plus d'œufs !"
 oceania.0087.b:0 "Nous n'avons pas besoin de plus d'œufs."
