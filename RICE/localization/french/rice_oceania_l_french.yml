 oceania.0020.t:0 "Mâcher des noix de bétel"
 oceania.0020.desc:0 "Y a-t-il quelque chose de plus agréable que de mâcher des noix de bétel ? Je mâche, je crache, et je me sens détendu et serein..."
 oceania.0020.a:0 "J'espère que ma bouche ne deviendra pas trop rouge à cause de ça."
 oceania.0021.t:0 "Dépendance à la noix de bétel"
 oceania.0021.desc:0 "Des dents cariées tachées de rouge... Des dommages à mes gencives... Et quelque chose dans mon corps ne va tout simplement plus...\n\nCertains disent que c'est parce que je mâche trop de noix de bétel. Mais ils ne peuvent pas avoir raison, car mâcher des noix de bétel me fait me sentir mieux."
 oceania.0021.a:0 "Comment cela pourrait-il être mauvais ?"
 oceania.0021.liege.message:0 "Un nouvel adepte du bétel"
 oceania.0022.t:0 "Boire du kava"
 oceania.0022.desc:0 "Nous nous rassemblons, comme nous et nos ancêtres l'avons toujours fait, versant des coupes pleines de kava pour le plaisir de tous. Nous buvons par tournées, en commençant par ceux du statut le plus élevé, puis en descendant jusqu'à ce que chacun ait eu sa juste part."
 oceania.0022.desc.ceremonial:0 "\n\nTout le monde comprend l'importance des cérémonies du kava comme celle-ci, qui marquent les occasions importantes. Il y a une série de rituels, de gestes et de procédures appropriés que l'on doit suivre, pour honorer nos ancêtres et [ROOT.Char.GetFaith.PantheonTerm]."
 oceania.0022.desc.medicinal:0 "\n\nNos ancêtres connaissaient les propriétés curatives du kava, qu'ils nous ont transmises. En buvant ainsi le kava ensemble, nous pouvons exploiter collectivement ses bienfaits médicinaux."
 oceania.0022.desc.social:0 "\n\nCe faisant, nous parlons de toutes sortes de choses, partageant les uns avec les autres les joies et les peines de la vie. Il n'y a rien qui nous rassemble plus que le kava !"
 oceania.0022.a:0 "Le kava est une boisson merveilleuse."
 oceania.0023.t:0 "$oceania.0022.t$"
 oceania.0023.desc:0 "Je suis devenu célèbre pour mon enthousiasme et mon soutien à la consommation de kava. C'est bon de savoir que tout le monde sait que j'accorde de la valeur à cette ancienne boisson qui est la nôtre !"
 oceania.0023.a:0 "Venez ! Buvons du kava !"
 oceania.0023.liege.message:0 "Buveur de kava renommé"
 oceania.0024.t:0 "Maisons de réunion [ROOT.Char.GetCulture.GetNameNoTooltip]"
 oceania.0024.t.palauan:0 "Le Cheldebechel [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip|l]"
 oceania.0024.desc.intro:0 "Les maisons de réunion communautaires ont joué un rôle clé dans la société [ROOT.Char.GetCulture.GetName] depuis des générations."
 oceania.0024.desc.normal:0 "\n\nEn tant que [GetPlayer.GetTitleAsNameNoTooltip], il est de mon devoir de continuer à soutenir ces maisons de réunion de diverses manières. Je pourrais contribuer des ressources pour des rassemblements religieux rituels, pour des festins et autres cérémonies politiques, ou pour des matériaux afin d'entretenir et de reconstruire l'architecture et les œuvres d'art de ces structures."
 oceania.0024.desc.palauan:0 "Ils servent souvent de lieux de rencontre où les membres des [Glossary( 'cheldebechel', 'CHELDEBECHEL_GLOSS' )] interagissent ou mènent leurs affaires.\n\nEn tant que [GetPlayer.GetTitleAsNameNoTooltip], j'ai les moyens de soutenir ces #italic cheldebechel#!. Les clubs hiérarchisés, tant masculins que féminins, jouent un rôle clé dans nos communautés."
 oceania.0024.a:0 "Soutenir les rassemblements religieux rituels"
 oceania.0024.b:0 "Soutenir les festins et autres cérémonies politiques"
 oceania.0024.c:0 "Soutenir l'entretien et la construction de ces halls"
 oceania.0024.d:0 "Soutenir les clubs masculins"
 oceania.0024.e:0 "Soutenir les clubs de femmes"
