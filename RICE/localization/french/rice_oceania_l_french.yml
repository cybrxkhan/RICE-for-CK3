 RICE_oceania_settled_biak_warriors: "Guerriers Biaks installés"
 RICE_oceania_settled_biak_warriors_desc: "Cette région abrite une colonie de Biaks, originaires d'un archipel du nord-ouest de la Papouasie. Cette communauté est dominée par de redoutables guerriers, qui naviguent pour terrifier leurs ennemis dans de rapides embarcations [Glossary( 'wairon', 'WAIRON_GLOSS' )]."
 RICE_oceania_settled_biak_traders: "Commerçants Biaks installés"
 RICE_oceania_settled_biak_traders_desc: "Cette région abrite une colonie de Biaks, originaires d'un archipel du nord-ouest de la Papouasie. Cette communauté est dominée par des commerçants intrépides, qui naviguent pour s'engager dans le commerce et la diplomatie dans de grandes embarcations [Glossary( 'waimansusu', 'WAIMANSUSU_GLOSS' )]."
 RICE_oceania_biak_piracy_modifier: "Piraterie Biak"
 RICE_oceania_biak_piracy_modifier_desc: "Cette région a récemment souffert de raids impitoyables de pirates Biak, venus de leur archipel d'origine dans le nord-ouest de la Papouasie à bord de rapides embarcations [Glossary( 'wairon', 'WAIRON_GLOSS' )]."
