 oceania.0040.t:0 "Une autre cérémonie Sasi"
 oceania.0040.desc:0 "Le [Glossary( 'sasi', 'SASI_GLOSS' )] est notre tradition, en tant que [ROOT.Char.GetCulture.GetCollectiveNoun|l], de désigner périodiquement des ressources qui ne peuvent être récoltées pendant une période donnée, afin de préserver ces ressources pour un usage futur. Le #italic sasi#!, bien entendu, est accompagné de cérémonies [ROOT.Char.GetFaith.GetReligion.GetAdjectiveNoTooltip]s appropriées.\n\n"
 oceania.0040.desc.land:0 "Nous allons bientôt imposer un #italic sasi terrestre#! à [location.GetName], et je serai présent à la cérémonie de fermeture du #italic sasi#!. Par la suite, il sera interdit aux gens d'accéder et d'exploiter les ressources naturelles de cet endroit pendant un certain temps."
 oceania.0040.desc.water:0 "Nous allons bientôt imposer un #italic sasi aquatique#! à [location.GetName], et je serai présent à la cérémonie de fermeture du #italic sasi#!. Il sera interdit aux habitants d'accéder et d'exploiter les ressources de certaines étendues d'eau de la région pendant un certain temps."
 oceania.0040.a:0 "Allons-y !"
 oceania.0041.t:0 "Arrivée"
 oceania.0041.desc:0 "Après être arrivés au village de [location.GetName] où la cérémonie de clôture du [Glossary( 'sasi', 'SASI_GLOSS' )] aura lieu, les habitants nous ont accueillis avec beaucoup de faste et de joie.\n\nLa cérémonie aura lieu bientôt, dans les jours à venir. Cependant, peut-être puis-je me distraire avec quelque chose en attendant..."
 oceania.0041.a:0 "Passer du temps en prière à [ROOT.Char.GetFaith.HighGodName]"
 oceania.0041.b:0 "Discuter des problèmes locaux avec les chefs de la communauté"
 oceania.0041.c:0 "Se détendre et profiter des magnifiques paysages de la région"
 oceania.0042.t:0 "Clôture du Sasi"
 oceania.0042.desc:0 "Une fois la cérémonie d'aujourd'hui terminée, le [Glossary( 'sasi', 'SASI_GLOSS' )] sera fermé selon les termes sur lesquels moi et les autres dirigeants locaux nous sommes mis d'accord.\n\nNous prions [ROOT.Char.GetFaith.PantheonTerm] de veiller sur nous et les ressources que nous protégeons,"
 oceania.0042.desc.land:0 "alors que nous nous rassemblons sous un [ROOT.Char.GetCurrentLocation.Custom('GetRandomAppropriateTree')] près du village. Toutes les ressources trouvées dans la zone affectée par le #italic sasi#!, y compris les animaux, les plantes et les minéraux, seront intouchables pour tous."
 oceania.0042.desc.water:0 "alors que nous nous rassemblons au bord [ROOT.Char.Custom('IndefiniteBodyOfWater')] près du village. Des poissons et coraux aux autres animaux aquatiques, plantes et minéraux, personne ne sera autorisé à récolter ces ressources concernées par les termes du #italic sasi#!."
 oceania.0042.desc.conclusion:0 "\n\nLa cérémonie se conclut par de nombreuses danses et chants pour accompagner les prières, et les habitants me remercient de mon soutien."
 oceania.0042.a:0 "Nos ressources seront préservées pour longtemps."
 oceania.0043.t:0 "xxxxx"
 oceania.0043.desc:0 "xxxxx"
 oceania.0043.a:0 "xxxxx"
 oceania.0044.t:0 "xxxxx"
 oceania.0044.desc:0 "xxxxx"
