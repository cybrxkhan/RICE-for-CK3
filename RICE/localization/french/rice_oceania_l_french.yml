 oceania.0045.t:0 "Ouverture du Sasi"
 oceania.0045.desc:0 "Il y a quelque temps, un [Glossary( 'sasi', 'SASI_GLOSS' )] de l'eau a été imposé sur [sasi_open_county.GetNameNoTier], sous la direction des chefs locaux. Il était interdit d'exploiter les ressources aquatiques concernées par le #italic sasi#! - jusqu'à maintenant.\n\nAujourd'hui, une cérémonie a été organisée pour marquer l'ouverture du #italic sasi#!. Les ressources laissées intactes se sont reconstituées en grand nombre durant cette période."
 oceania.0045.a:0 "La patience a engendré une grande prospérité pour tous !"
 oceania.0046.t:0 "xxxxx"
 oceania.0046.desc:0 "xxxxx"
 oceania.0046.a:0 "xxxxx"
 oceania.0047.t:0 "$oceania.0045.t$"
 oceania.0047.desc:0 "Il y a quelque temps, un [Glossary( 'sasi', 'SASI_GLOSS' )] terrestre a été imposé sur [sasi_open_county.GetNameNoTier], sous la direction des chefs locaux. Il était interdit d'exploiter les ressources terrestres concernées par le #italic sasi#! - jusqu'à maintenant.\n\nAujourd'hui, une cérémonie a été organisée pour marquer l'ouverture du #italic sasi#!. Les ressources laissées intactes se sont reconstituées en grand nombre durant cette période."
 oceania.0047.a:0 "$oceania.0045.a$"
