 oceania.0061.t:0 "Les guerriers [biak_culture.GetCollectiveNounNoTooltip|l]"
 oceania.0061.desc.intro.peaceful:0 "Les guerriers [biak_culture.GetCollectiveNoun|l] sont arrivés dans des bateaux [Glossary( 'wairon', 'WAIRON_GLOSS' )] - d'apparence fine et élancée, mais arborant de redoutables visages sculptés dans leur bois, témoignage du courage aventureux de leurs propriétaires."
 oceania.0061.desc.intro.tense:0 "[biak_leader.GetFirstName] n'était pas trop avide, heureusement, et a accepté nos conditions renégociées.\n\nBien que nous ayons pris un départ difficile, et bien que nous ne puissions pas leur faire entièrement confiance, pour l'instant,"
 oceania.0061.desc.peaceful:0 "$oceania.0061.desc.intro.peaceful$\n\nHeureusement, les guerriers avec lesquels je suis entré en contact, menés par un certain [biak_leader.GetFirstName], sont amicaux et disposés à se battre pour des étrangers comme nous. En échange d'un paiement, ils apporteront gloire et honneur à leurs clans dans leur patrie."
 oceania.0061.desc.biak:0 "$oceania.0061.desc.intro.peaceful$\n\nEn tant que [biak_culture.GetCollectiveNoun|l], nous comprenons bien quel genre de force, de ruse et de bravoure un guerrier doit posséder pour réussir dans ses aventures. Les guerriers avec lesquels je suis entré en contact, menés par [biak_leader.GetFirstName], remplissent plus que largement ces conditions, et sont heureux de travailler avec moi tant qu'ils peuvent avoir leur part du butin."
 oceania.0061.desc.tense:0 "$oceania.0061.desc.intro.tense$ ils semblent satisfaits de combattre pour moi. En échange d'un paiement, ils apporteront gloire et honneur à leurs clans restés chez eux."
 oceania.0061.a:0 "Bien. Travaillons ensemble."
 oceania.0061.b:0 "Certains d'entre vous peuvent aussi s'installer sur nos terres."
 oceania.0061.c:0 "Pouvez-vous vous-même travailler avec nous également ?"
 oceania.0061.d:0 "Je pourrais utiliser quelqu'un comme vous en tant que compagnon."
 oceania.0062.t:0 "Les marchands [biak_culture.GetCollectiveNounNoTooltip]"
 oceania.0062.desc.intro.peaceful:0 "Les marchands [biak_culture.GetCollectiveNoun|l] sont arrivés dans des bateaux [Glossary( 'waimansusu', 'WAIMANSUSU_GLOSS' )] - grands, et possédant suffisamment de place pour contenir beaucoup de cargaison, un témoignage du sens intrépide des affaires de leurs propriétaires."
 oceania.0062.desc.intro.tense:0 "$oceania.0061.desc.intro.tense$"
 oceania.0062.desc.peaceful:0 "$oceania.0062.desc.intro.peaceful$\n\nLe groupe de marchands avec lequel je suis entré en contact était mené par un certain [biak_leader.GetFirstName], qui m'assure qu'avec mon soutien, ils peuvent commercer loin et partout, et ramener des richesses dans les ports sur lesquels j'ai autorité. Ce faisant, ils apporteront également gloire et honneur à leurs clans chez eux."
 oceania.0062.desc.biak:0 "$oceania.0062.desc.intro.peaceful$\n\nEn tant que [biak_culture.GetCollectiveNoun|l], nous comprenons bien que les aventures réussies ne se résument pas à éprouver sa valeur au combat. Les accomplissements dans le commerce et la diplomatie sont tout aussi impressionnants, et les marchands avec lesquels je suis entré en contact, menés par [biak_leader.GetFirstName], semblent expérimentés dans ces domaines. Ils sont heureux de travailler avec moi tant que nous nous entraidons."
 oceania.0062.desc.tense:0 "$oceania.0061.desc.intro.tense$ ils ont accepté de travailler avec nous pour profiter mutuellement du commerce. Ce faisant, ils apporteront également gloire et honneur à leurs clans dans leur pays d'origine."
 oceania.0062.a:0 "$oceania.0061.a$"
 oceania.0062.b:0 "$oceania.0061.b$"
 oceania.0062.c:0 "$oceania.0061.c$"
 oceania.0062.d:0 "$oceania.0061.d$"
 oceania.0063.t:0 "Les exigences [biak_culture.GetAdjectiveNoTooltip|l]"
 oceania.0063.desc.warriors:0 "$oceania.0061.desc.intro.peaceful$\n\nMalheureusement, nos tentatives de négocier avec eux pour qu'ils combattent sous ma bannière échouent. Ils exigent davantage d'or de ma part, et menacent de riposter par des raids sur mes terres si je ne m'exécute pas.\n\nHélas, ils #italic sont#! également connus pour leurs talents en piraterie, nous devons donc agir avec prudence..."
 oceania.0063.desc.traders:0 "$oceania.0062.desc.intro.peaceful$\n\nMalheureusement, nos tentatives de négocier avec eux pour travailler ensemble dans un intérêt mutuel échouent. Ils exigent davantage d'or de ma part, et menacent de riposter par des raids sur mes terres si je ne m'exécute pas.\n\nHélas, bien qu'ils soient de plus grands marchands et diplomates, la piraterie #italic est#! traditionnellement une autre forme de profit pour eux également, aussi devons-nous avancer prudemment..."
 oceania.0063.desc.fallback:0 "Nos tentatives de négociation avec les aventuriers [biak_culture.GetCollectiveNoun|l] ont échoué.\n\nIls menacent de nous piller si nous ne leur offrons pas davantage d'or."
 oceania.0063.a:0 "Très bien. Vous aurez votre paiement supplémentaire."
 oceania.0063.b:0 "Non. Vous #italic allez#! accepter notre proposition initiale."
 oceania.0063.b.failure:0 "Ils refusent et se livrent à la piraterie"
 oceania.0063.b.success:0 "Ils reculent et acceptent la proposition initiale"
 oceania.0064.t:0 "Les pirates [biak_culture.GetCollectiveNounNoTooltip|l]"
 oceania.0064.desc.original:0 "Nos tentatives de négociation avec la bande [biak_culture.GetName] menée par [biak_leader.GetFirstName] ont échoué.\n\n[biak_leader.GetFirstNameNoTooltip] et son peuple remontent désormais les voies navigables de [target_duchy.GetNameNoTier], attaquant et pillant tout ce qu'ils peuvent. Bien que les dégâts qu'ils sont capables de causer soient limités, leurs déprédations ne reflètent pas une bonne image de moi."
 oceania.0064.desc:0 "[original_negotiator.GetTitledFirstName] a récemment tenté de recruter les services d'aventuriers [biak_culture.GetCollectiveNoun|l] menés par un[biak_leader.Custom('FR_E')] certain[biak_leader.Custom('FR_E')] [biak_leader.GetFirstName].\n\nCependant, les négociations ont échoué, et en conséquence, [biak_leader.GetFirstNameNoTooltip] et son peuple remontent désormais les cours d'eau de [target_duchy.GetNameNoTier], attaquant et pillant tout ce qu'ils peuvent. Bien que les dégâts qu'ils sont capables d'infliger soient limités, mes territoires ont également été soumis à ces déprédations, alors que nous n'étions pas du tout impliqués à l'origine !"
 oceania.0064.a:0 "Oups..."
 oceania.0064.b:0 "[original_negotiator.GetFirstNameNoTooltip], espèce d'imbécile ! Qu'avez-vous fait ?!"
