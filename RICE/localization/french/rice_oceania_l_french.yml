 # Activities
 activity_RICE_oceania_sasi_ceremony_host_an_a:0 "une"
 activity_RICE_oceania_sasi_ceremony:0 "Cérémonie du Sasi"
 activity_RICE_oceania_sasi_ceremony_desc:0 "En interdisant la récolte des ressources naturelles dans une zone désignée, nous pouvons protéger nos ressources naturelles. Ceux qui défient cet ordre ne paieront pas seulement une amende, mais seront punis par les esprits courroucés de nos ancêtres."
 activity_RICE_oceania_sasi_ceremony_selection_tooltip:"Imposer le début d'un [Glossary( 'sasi', 'SASI_GLOSS' )] dans un [county|El].\n\n$activity_RICE_oceania_sasi_ceremony_context_tooltip$"
 activity_RICE_oceania_sasi_ceremony_context_tooltip:0 "#emphasis Contexte historique :#! $SASI_GLOSS$"
 activity_RICE_oceania_sasi_ceremony_host_desc:"\n$BULLET_WITH_TAB$Gain de [piety_i] [piety|El]\n$BULLET_WITH_TAB$Gain de [prestige_i|El][prestige|El]\n$BULLET_WITH_TAB$Gain de [legitimacy_i|El][legitimacy|El] en fonction du [development_i|El] [development|El] du [county|El]\n$BULLET_WITH_TAB$Le [county|El] dans lequel cette [activity|El] se déroule gagnera le [county_modifier|El] [GetModifier('RICE_oceania_sasi_closed_modifier').GetNameWithTooltip] qui sera remplacé après #V 1-3#! ans par le [county_modifier|El] plus bénéfique [GetModifier('RICE_oceania_sasi_open_modifier').GetNameWithTooltip] pour #V 10#! ans"
 activity_RICE_oceania_sasi_ceremony_guest_desc: "$activity_RICE_oceania_sasi_ceremony_host_desc$"
 activity_RICE_oceania_sasi_ceremony_province_desc: ""
 activity_RICE_oceania_sasi_ceremony_destination_selection: "$activity_RICE_oceania_sasi_ceremony_province_desc$"
 activity_RICE_oceania_sasi_ceremony_guest_help_text: "$activity_RICE_oceania_sasi_ceremony$"
 activity_RICE_oceania_sasi_ceremony_predicted_cost:"Le coût de cette [activity|El] est principalement basé sur votre [income|El]."
 activity_RICE_oceania_sasi_ceremony_conclusion_desc:"La [GetActivityType( 'activity_RICE_oceania_sasi_ceremony' ).GetName] est terminée, et le Sasi est désormais appliqué."
 RICE_oceania_sasi_ceremony_type:"Type de cérémonie Sasi"
 RICE_oceania_sasi_ceremony_type_water:"Sasi de l'eau"
 RICE_oceania_sasi_ceremony_type_water_desc:"Une fois le [Glossary( 'sasi', 'SASI_GLOSS' )] ouvert après 1 à 3 ans, le [ruler|El] du [county|El] concerné gagne :\n\n$EFFECT_LIST_BULLET$Bonus de [prestige_i|E|El] [prestige|El]\n$EFFECT_LIST_BULLET$Gain du [county_modifier|El] [GetModifier('RICE_oceania_sasi_water_modifier').GetNameWithTooltip] sur le [county|El]\n\n#weak Que l'eau provienne de la mer, des rivières ou des pluies, c'est elle qui nourrit la vie, nous devons donc gérer avec soin la manière dont nous l'utilisons.#!"
 RICE_oceania_sasi_ceremony_type_land:"Sasi terrestre"
 RICE_oceania_sasi_ceremony_type_land_desc:"Une fois le [Glossary( 'sasi', 'SASI_GLOSS' )] ouvert après 1 à 3 ans, le [ruler|El] du [county|El] affecté gagne :\n\n$EFFECT_LIST_BULLET$Bonus de [piety_i|E|El] [piety|El]\n$EFFECT_LIST_BULLET$Gain du [county_modifier|El] [GetModifier('RICE_oceania_sasi_land_modifier').GetNameWithTooltip] sur le [county|El]\n\n#weak Nous faisons grand usage des plantes et des animaux de nos terres à de nombreuses fins, nous devons donc être prudents quant à la quantité de ces ressources que nous consommons.#!"
 RICE_oceania_sasi_ceremony_prohibition_phase: "Prohibition"
 RICE_oceania_sasi_ceremony_prohibition_phase_desc:"La cérémonie du [Glossary( 'sasi', 'SASI_GLOSS' )] est en cours."
 RICE_oceania_sasi_ceremony_conservation_intent_header: "Conservation :"
 RICE_oceania_sasi_ceremony_conservation_intent: "Conservation"
 RICE_oceania_sasi_ceremony_conservation_intent_desc:"Souligner auprès de tous les participants l'importance de préserver nos ressources, sous les auspices des esprits. Gain de [prestige_i|El] [prestige|El] supplémentaire. Les personnages [GetTrait('temperate').GetName( GetNullCharacter )|U], [GetTrait('patient').GetName( GetNullCharacter )|U] et [GetTrait('diligent').GetName( GetNullCharacter )] perdent du [stress_loss_i|El] [stress|El] supplémentaire."
 RICE_oceania_sasi_ceremony_ritual_intent_header: "Rituel :"
 RICE_oceania_sasi_ceremony_ritual_intent: "Rituel"
 RICE_oceania_sasi_ceremony_ritual_intent_desc: "Se concentrer sur le respect et l'harmonie avec les esprits de la région à travers les rituels de cette cérémonie. Gain de [piety_i|El] [piety|El] supplémentaire. Les personnages [GetTrait('zealous').GetName( GetNullCharacter )|U], [GetTrait('just').GetName( GetNullCharacter )|U] et [GetTrait('humble').GetName( GetNullCharacter )] perdent du [stress_loss_i|El] [stress|El] supplémentaire."
 RICE_oceania_sasi_ceremony_completed_log_title:0 "Cérémonie de clôture du Sasi terminée"
 RICE_oceania_sasi_ceremony_completed_log:0 "[CHARACTER.GetShortUIName|U] a terminé de diriger la cérémonie de clôture du [Glossary( 'sasi', 'SASI_GLOSS' )]."
 TRAVEL_NAME_FOR_activity_RICE_oceania_sasi_ceremony:0 "[Character.GetFirstNamePossessiveNoTooltip] $activity_RICE_oceania_sasi_ceremony$"
 RICE_SASI_COUNTY_LABEL:"Les restrictions Sasi sont en vigueur ici"
 RICE_sasi_ceremony_story:"Clôture du Sasi"
 RICE_sasi_ceremony_story_desc:"Une clôture de [Glossary( 'sasi', 'SASI_GLOSS' )] a été imposée. Ceux qui exploitent les ressources dans la zone restreinte seront punis, tant dans le monde matériel que dans le monde spirituel. Les restrictions seront levées une fois qu'une cérémonie d'Ouverture du Sasi sera tenue après au moins un an."
 
 # Modifiers
 RICE_oceania_sasi_modifier:0 "Sasi"
 RICE_oceania_sasi_closed_modifier: "Sasi fermé"
 RICE_oceania_sasi_closed_modifier_desc:"Une cérémonie de clôture du [Glossary( 'sasi', 'SASI_GLOSS' )] a récemment été conduite ici. Le #italic Sasi#! est en vigueur, et il est interdit aux gens de récolter certaines ressources."
 RICE_oceania_sasi_open_modifier: "Sasi ouvert"
