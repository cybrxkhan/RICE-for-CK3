 # Struggle Ending Decisions
 
 # Decisions
 RICE_oceania_quarry_stone_money:0 "Extraire la pierre rai"
 RICE_oceania_quarry_stone_money_tooltip:0 "Les [Glossary( 'pierres Rai', 'YAP_STONE_MONEY_GLOSS' )] sont le moyen de montrer sa valeur et son statut dans la société."
 RICE_oceania_quarry_stone_money_desc:0 "Les [Glossary( 'pierres Rai', 'YAP_STONE_MONEY_GLOSS' )] utilisées dans notre société sont acquises sur des îles ou des terres spécifiques lors d'expéditions maritimes. Leur valeur augmente en fonction de la dangerosité et des périls du voyage."
 RICE_oceania_quarry_stone_money_effect_tooltip_1:1 "Vous avez #V [GetPlayer.MakeScope.ScriptValue('RICE_oceania_stone_money_success_chance')|0]%#! de chances de succès, ce qui est influencé par vos [traits|El] et [skills|El], en particulier la [diplomacy_i|El] [diplomacy|El] et l'[stewardship_i|El] [stewardship|El]."
 RICE_oceania_quarry_stone_money_effect_tooltip_2:1 "Vous pourriez #N perdre#! des membres d'équipage, influencé par vos [traits|El] et [skills|El], en particulier la [martial_i|El] [martial|El] et l'[learning_i|El] [learning|El]"
 RICE_oceania_quarry_stone_money_effect_tooltip_3:1 "Au début de l'expédition, vous pouvez dépenser de l'[gold_i|El] [gold|El] supplémentaire pour augmenter les chances de succès et de survie de l'équipage."
 RICE_oceania_quarry_stone_money_effect_tooltip_4:1 "En cas de succès, vous obtiendrez un montant aléatoire de [prestige_i|E|El] [prestige|El] (jusqu'à #V [prestige_i|El] [GetPlayer.MakeScope.ScriptValue('RICE_oceania_stone_money_max_prestige_gain_value')|0]#!), d'[gold_i|El] [gold|El] (jusqu'à #V [gold_i|El] [GetPlayer.MakeScope.ScriptValue('RICE_oceania_stone_money_max_gold_gain_display_value')|0]#!), et d'[trait_level_track_xp|El] dans le [trait|El] [GetTrait('RICE_stone_money').GetName( GetNullCharacter )|U] (jusqu'à #V [GetPlayer.MakeScope.ScriptValue('RICE_oceania_stone_money_large_trait_xp_gain_value')|0]#!)"
 RICE_oceania_quarry_stone_money_effect_tooltip_5:1 "Le nombre de membres d'équipage qui meurent influence la quantité d'[gold_i|El] [gold|El], de [prestige_i|El] [prestige|El] et d'[trait_level_track_xp|El] dans le [trait|El] [GetTrait('RICE_stone_money').GetName( GetNullCharacter )|U] que vous gagnez, au #N prix#! de [piety_i|El] [piety|El]"
 RICE_oceania_quarry_stone_money_confirm:0 "Certains pourraient mourir, mais c'est un sacrifice que nous sommes prêts à faire !"
 RICE_oceania_quarry_stone_money_context_tooltip:0 "#emphasis Contexte historique :#! $YAP_STONE_MONEY_GLOSS$"
 RICE_stress_loss_chew_betel_nuts_decision:0 "Mâcher des noix de bétel"
 RICE_stress_loss_chew_betel_nuts_decision_tooltip:1 "Mâcher des noix de bétel est un moyen de perdre [stress_loss_i|El] de [stress|El]..."
 RICE_stress_loss_chew_betel_nuts_decision_desc:0 "Il me suffit de mâcher quelques noix de bétel, et je me sentirai plein d'énergie, euphorique, avec une sensation réconfortante de chaleur. Je devrai juste faire attention à l'endroit où je crache."
 RICE_stress_loss_chew_betel_nuts_decision_effect_tooltip_1:1 "Il y a une petite chance que vous obteniez le [trait|El] [GetTrait('betel_chewer').GetName( GetNullCharacter )|U]. Cette chance augmente à chaque fois que vous prenez cette [decision|El]."
 RICE_stress_loss_chew_betel_nuts_decision_confirm:0 "Il est temps de mâcher du bétel !"
 RICE_stress_loss_chew_betel_nuts_decision_context_tooltip:0 "#emphasis Contexte historique :#! La pratique de mâcher des noix de bétel, qui a un effet stimulant et narcotique, est répandue dans une grande partie de l'Asie et de l'Océanie depuis des milliers d'années. Elle est connue pour son caractère addictif et ses effets dangereux sur la santé, allant des taches rouges sur les dents (souvent considérées comme peu hygiéniques dans les régions où elle est populaire) à diverses formes de cancer."
 RICE_stress_loss_drink_kava_decision:0 "Boire du kava"
 RICE_stress_loss_drink_kava_decision_tooltip:1 "Boire du kava est un excellent moyen de perdre du [stress_loss_i|El] [stress|El] et de socialiser avec les autres."
 RICE_stress_loss_drink_kava_decision_desc:0 "Le kava est une merveilleuse boisson qui stimule l'esprit et est grandement respectée par beaucoup. Nous, [ROOT.Char.GetCulture.GetCollectiveNoun|l], en consommons depuis des générations."
 RICE_stress_loss_drink_kava_decision_effect_tooltip_1:1 "Il y a une petite chance que vous obteniez le [trait|El] [GetTrait('RICE_kava_drinker').GetName( GetNullCharacter )|U]. Cette chance augmente à chaque fois que vous prenez cette [decision|El]."
 RICE_stress_loss_drink_kava_decision_confirm:0 "Rassemblons-nous et savourons un peu de kava !"
 RICE_stress_loss_drink_kava_decision_context_tooltip:0 "#emphasis Contexte historique :#! Le kava est une boisson psychoactive traditionnelle originaire d'une grande partie de l'Océanie, en particulier de la Polynésie, de la Micronésie et de la Mélanésie, et a joué un rôle social, politique et religieux important pour nombre de ces peuples, bien que son rôle varie d'un groupe à l'autre."
 RICE_oceania_recruit_biak_adventurers:0 "Entrer en contact avec des aventuriers biak"
 RICE_oceania_recruit_biak_adventurers_tooltip:0 "Travailler avec des aventuriers [RICE_biaks|El] pour un bénéfice mutuel"
 RICE_oceania_recruit_biak_adventurers_desc:0 "Des flibustiers [RICE_biaks|El] naviguent parfois vers les côtes et les îles d'[GetGeographicalRegion('RICE_eastern_southeast_asia_region').GetName] en quête d'aventure. Soutenir leurs entreprises et travailler avec eux pourrait s'avérer avantageux pour les deux parties."
 RICE_oceania_recruit_biak_adventurers_desc_biak:0 "Nous autres flibustiers [RICE_biaks|El] naviguons parfois bien au-delà de nos terres natales en quête d'aventure. Trouver des amis [RICE_biaks|El] partageant les mêmes idées avec qui travailler pourrait s'avérer avantageux pour les deux parties."
 RICE_oceania_recruit_biak_adventurers_effect_warriors_tooltip_1:1 "Gain du [modifier|El] [GetModifier('RICE_oceania_ties_with_biak_warriors').GetNameWithTooltip] et quelques [soldier_i] [special_troops|El] (en fonction de la quantité d'[gold_i|El] [gold|El] supplémentaire que vous êtes prêt à leur offrir)"
 RICE_oceania_recruit_biak_adventurers_effect_warriors_tooltip_2:1 "Tant que les [modifiers|El] sont actifs, vous pouvez recevoir des événements aléatoires octroyant différents bonus tels que de l'[gold_i|El] [gold|El], des [soldier_i] [special_troops|El], du [control_i|El] [control|El], des [courtiers|El], et plus encore !"
 RICE_oceania_recruit_biak_adventurers_effect_traders_tooltip_1:1 "Gain du [modifier|El] [GetModifier('RICE_oceania_ties_with_biak_traders').GetNameWithTooltip] et de [legitimacy_i|El] [legitimacy|El], des [barter_goods_i] [barter_goods|El], des [provisions_i|El] [provisions|El], ou du [prestige_i|El] [prestige|El] (selon votre [government|El] et la quantité d'[gold_i|El] [gold|El] supplémentaire que vous êtes prêt à leur offrir)"
 RICE_oceania_recruit_biak_adventurers_effect_traders_tooltip_2:1 "Tant que les [modifiers|El] sont actifs, vous pouvez recevoir des événements aléatoires octroyant différents bonus tels que de l'[gold_i|El] [gold|El], du [prestige_i|El] [prestige|El], du [development_i|El] [development|El], des [courtiers|El], et plus encore !"
 RICE_oceania_recruit_biak_adventurers_effect_general_tooltip_1:1 "Les [RICE_biaks|El] peuvent exiger de l'[gold|El] supplémentaire ou même des [titles|El] et mal réagir si les négociations échouent !"
 RICE_oceania_recruit_biak_adventurers_confirm:0 "Contacter ces aventuriers !"
 RICE_oceania_recruit_biak_adventurers_context_tooltip:0 "#emphasis Contexte historique :#! Le peuple Biak est originaire d’un archipel situé au nord-ouest de la Papouasie. Au début de l’ère moderne, et même pendant la période coloniale néerlandaise, il a joué un rôle important dans l’histoire de l’Indonésie orientale, et a probablement mené des activités similaires au Moyen Âge, voire avant. Les Biak étaient de grands navigateurs, qui tenaient en haute estime ceux qui étaient capables de prendre la mer à la recherche d’aventures, que ce soit pour le commerce pacifique, le maintien de relations diplomatiques avec les sultanats des Moluques, des raids impitoyables, l’apprentissage de nouvelles idées auprès d’autrui, la colonisation d’îles lointaines, ou tout cela à la fois."
 RICE_oceania_recruit_biak_adventurers_type:0 "Choisissez quel type d'aventuriers [RICE_biaks|El] recruter"
 RICE_oceania_recruit_biak_adventurers_type_gui:0 "$RICE_oceania_recruit_biak_adventurers_type$"
 RICE_oceania_recruit_biak_adventurers_warriors_option:0 "#Bold Guerriers#!"
 RICE_oceania_recruit_biak_adventurers_warriors_option_desc:0 "Inviter des aventuriers guerriers"
 RICE_oceania_recruit_biak_adventurers_warriors_option_tooltip:0 "#italic Naviguant depuis leurs rapides bateaux [Glossary( 'wairon', 'WAIRON_GLOSS' )], les guerriers [RICE_biaks|El] ont frappé de terreur le cœur de leurs ennemis en tant que pirates, chasseurs de têtes et combattants féroces pendant des siècles. Cependant, certains sont prêts à travailler pour d'autres, que ce soit pour le profit ou l'honneur.#!"
 RICE_oceania_recruit_biak_adventurers_traders_option:0 "#Bold Marchands#!"
 RICE_oceania_recruit_biak_adventurers_traders_option_desc:0 "Inviter des aventuriers marchands"
 RICE_oceania_recruit_biak_adventurers_traders_option_tooltip:0 "#italic Naviguant depuis leurs grands bateaux [Glossary( 'waimansusu', 'WAIMANSUSU_GLOSS' )], les marchands [RICE_biaks|El] ont transporté d'impressionnantes cargaisons commerciales à travers les mers pendant des siècles. Ce faisant, ils ont créé des réseaux politiques et sociaux, et ont même établi des colonies dans des terres lointaines.#!"
 RICE_welcome_visitors_from_oceania:0 "Accueillir des visiteurs d'Océanie"
 RICE_welcome_visitors_from_oceania_tooltip:1 "Qui pourrions-nous rencontrer venant du vaste océan à l'est ?"
 RICE_welcome_visitors_from_oceania_desc:0 "Il y a des terres et des îles à l'est, au-delà des vastes mers. Bien que distantes, des gens y vivent. Leur sagesse et leurs connaissances pourraient-elles nous être utiles ?"
 RICE_welcome_visitors_from_oceania_effect_tooltip_1:1 "Les chances d'apparition de [courtiers|El] d'[RICE_oceania|E] sont augmentées tant que le [modifier|El] est actif"
 RICE_welcome_visitors_from_oceania_effect_tooltip_2:1 "Il y a une faible chance de garantir un événement faisant apparaître un [courtier|El] d'[RICE_oceania|E]"
 RICE_welcome_visitors_from_oceania_confirm:0 "Essayons d'entrer en contact avec eux !"
 RICE_welcome_visitors_from_oceania_context_tooltip:0 "#emphasis Contexte historique :#! Il existe certaines preuves de contacts limités entre les peuples d'Océanie et le reste de l'Ancien Monde avant la période coloniale, comme des preuves de commerce sporadique entre des îles comme Yap ou Biak et l'intérieur de la Papouasie et le reste de l'Indonésie. Il existe même un ensemble de preuves de plus en plus prometteur suggérant des contacts occasionnels entre certains peuples autochtones du nord de l'Australie et des Indonésiens, bien que l'étendue de ces contacts fasse l'objet de débats dans le milieu académique."
 RICE_oceania_meeting_houses_decision:0 "Soutenir les maisons de réunion communautaires"
 RICE_oceania_meeting_houses_decision_palauan:0 "Soutenir les clubs hiérarchiques"
 RICE_oceania_meeting_houses_decision_tooltip:1 "Soutenons les fondements de notre société."
 RICE_oceania_meeting_houses_decision_desc:0 "Depuis des générations, les [GetPlayer.GetCulture.GetCollectiveNoun|l] construisent des maisons de réunion communautaires dont l'importance rituelle, sociale, économique et politique en fait le centre de la vie de notre peuple. Soutenir ces maisons de réunion, et ceux qui les utilisent, augmentera ma popularité et mon autorité en tant que [GetPlayer.GetTitleAsNameNoTooltip]."
 RICE_oceania_meeting_houses_decision_palauan_desc:0 "Depuis des générations, les [GetPlayer.GetCulture.GetCollectiveNoun|l] ont organisé nos communautés à travers les [Glossary( 'cheldebechel', 'CHELDEBECHEL_GLOSS' )], ou clubs hiérarchisés. Soutenir ces clubs et leurs activités augmentera ma popularité et mon autorité en tant que [GetPlayer.GetTitleAsNameNoTooltip]."
 RICE_oceania_meeting_houses_decision_effect_tooltip_1:1 "Vous choisirez votre niveau de soutien, qui déterminera combien de [prestige_i|El] [prestige|El] et de [legitimacy_i|El] [legitimacy|El] vous recevrez ainsi que la durée du [character_modifier|El] que vous obtenez #weak (Coût minimum : @gold_icon! #V [GetPlayer.MakeScope.ScriptValue('RICE_oceania_meeting_houses_cost_small')]#!)#!"
 RICE_oceania_meeting_houses_decision_effect_tooltip_2:1 "Parce que vous avez la [tradition|El] #V $tradition_RICE_palau_clubs_name$#!, vous recevrez le maximum de [prestige_i|El] [prestige|El], de [legitimacy_i|El] [legitimacy|El], et la durée maximale du [modifier|El] de cette [decision|El] par rapport à la normale. Vous déciderez également si vous soutenez le [Glossary( 'cheldebechel', 'CHELDEBECHEL_GLOSS' )] masculin ou féminin."
 RICE_oceania_meeting_houses_decision_effect_tooltip_3:1 "La [ethos|El] de votre [culture_possessive|El] détermine les effets du [modifier|El] que vous obtenez"
 RICE_oceania_meeting_houses_decision_confirm:0 "Nous sommes un seul peuple, une seule communauté !"
 RICE_oceania_meeting_houses_decision_context_tooltip:0 "#emphasis Contexte historique :#! Dans de nombreuses cultures austronésiennes, de l'Indonésie à la Polynésie, les maisons de réunion communautaires, bien qu'elles diffèrent par leur architecture et leur art, jouent un rôle important dans la vie traditionnelle en tant que centre des activités et interactions religieuses, rituelles, sociales et politiques."

