 oceania.0050.t:0 "Pierres Rai"
 oceania.0050.desc:0 "La possession de [Glossary( 'pierres rai', 'YAP_STONE_MONEY_GLOSS' )] est la manière dont les [yap_culture.GetCollectiveNoun|l] mesurent la richesse et la valeur [ROOT.Char.Custom('WomanManPossessive')]. Mais comment acquiert-on ces pierres, taillées dans un certain type de calcaire ?\n\nDepuis d'autres îles où l'on trouve un tel calcaire, bien sûr - en particulier #italic Palau#!. À présent, j'envoie une expédition vers l'océan oriental pour acquérir une telle pierre pour moi-même.\n\nLes expéditions pour naviguer vers ces îles, obtenir la permission des habitants, acquérir ces pierres et revenir, se poursuivent depuis des âges. Ce sont des entreprises risquées, car les gens sont souvent blessés, voire meurent. Cependant, la valeur d'une pierre ne tient pas uniquement à sa taille, mais aussi à l'histoire qui l'accompagne, y compris l'effort pour l'acquérir."
 oceania.0050.a:0 "Je souhaite bonne chance aux membres de l'expédition."
 oceania.0050.b:0 "L'expédition pourrait avoir besoin de plus de ressources."
 oceania.0050.b.tooltip:0 "#bold Légère#! #P augmentation#! du montant d'[gold_i|El] [gold|El] que vous pourriez gagner et #bold légère#! #V réduction#! du nombre de membres d'équipage susceptibles de mourir."
 oceania.0050.c:0 "L'expédition pourrait utiliser #italic beaucoup#! plus de ressources."
 oceania.0050.c.tooltip:0 "#P Augmentation#! #bold majeure#! de la quantité d'[gold_i|El] [gold|El] que vous pourriez gagner et #V réduction#! #bold majeure#! du nombre de membres d'équipage susceptibles de mourir."
 oceania.0051.t:0 "$oceania.0050.t$"
 oceania.0051.desc.success:0 "Mon expédition vers les mers orientales pour acquérir une [Glossary( 'pierre rai', 'YAP_STONE_MONEY_GLOSS' )] est revenue #P avec succès#!, rapportant avec eux une magnifique et grande pierre sculptée en forme de disque !\n\nAvec le retour de l'équipage, nous apprenons leur voyage et les difficultés qu'ils ont rencontrées, de la traversée de l'océan à la façon dont ils ont négocié avec les habitants locaux pour obtenir la pierre.\n\n"
 oceania.0051.desc.failure:0 "Depuis des jours, je ressens un malaise concernant mon expédition vers les mers orientales pour acquérir une [Glossary( 'pierre rai', 'YAP_STONE_MONEY_GLOSS' )] pour moi. Pourquoi ne sont-ils pas revenus ?\n\nAujourd'hui, j'ai reçu un rapport indiquant que des marins locaux ont trouvé des preuves que mon expédition n'est #N jamais#! revenue.\n\nQuel malheur ! Bien que nous ne saurons jamais avec certitude ce qui s'est passé durant leur voyage, au moins nous avons une sorte de réponse."
 oceania.0051.desc.low:0 "Les pertes furent relativement faibles, et la majeure partie de l'équipage est rentrée saine et sauve. Comme cela fait une histoire moins intéressante, la #italic pierre rai#! en vaut moins.\n\nNéanmoins, il est toujours possible que la #italic pierre rai#! prenne de la valeur avec le temps, à mesure que son histoire orale s'enrichit de récits intéressants sur ses propriétaires."
 oceania.0051.desc.medium:0 "Les pertes parmi l'équipage furent modérées. Les morts et les blessures n'étaient pas trop excessives, restant dans une fourchette attendue pour ces expéditions, et cela a été pris en compte dans la valeur de la #italic pierre rai#!.\n\nQuoi qu'il en soit, la valeur à long terme de la #italic pierre rai#! pourrait encore varier, à mesure que son histoire orale s'enrichit de récits intéressants sur ses propriétaires."
 oceania.0051.desc.high:0 "Les pertes parmi l'équipage furent immenses. C'est un miracle que certains aient même réussi à revenir. Au moins, cela signifie que la #italic pierre rai#! vaut beaucoup, grâce au récit dramatique de la façon dont elle a été acquise.\n\nMalgré cela, qui sait quelle sera la valeur à long terme de la #italic pierre rai#! ? En commençant par le récit dramatique de la façon dont elle a été acquise, il faudra voir si l'histoire orale de ses propriétaires est tout aussi fascinante."
 oceania.0051.a.failure:0 "Que [ROOT.Char.GetFaith.DeathDeityName] soit clément envers leurs esprits..."
 oceania.0051.a.success:0 "Excellent travail ! L'équipage a été véritablement brave et héroïque."
