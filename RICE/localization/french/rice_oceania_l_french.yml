 RICE_oceania_ties_with_biak_warriors: "Liens avec les guerriers Biaks"
 RICE_oceania_ties_with_biak_warriors_desc: "Ce personnage a établi des liens avec les tribus Biak originaires d'un archipel du nord-ouest de la Papouasie, en particulier les guerriers de ces tribus, qui naviguent pour terrifier leurs ennemis dans de rapides embarcations [Glossary( 'wairon', 'WAIRON_GLOSS' )]."
 RICE_oceania_ties_with_biak_traders: "Liens avec les commerçants Biaks"
