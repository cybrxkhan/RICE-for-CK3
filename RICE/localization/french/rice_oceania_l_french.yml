 RICE_kwaraae_ramo:0 "Ramo"
 RICE_kwaraae_ramo_flavor:0 "#F Choisi dès son plus jeune âge, le Ramo est un défenseur de sa communauté, qui a le pouvoir d'invoquer de terrifiants [Glossary( 'esprits guerriers', 'KWARAAE_WARRIOR_GHOSTS_GLOSS' )] pour l'aider dans les combats, les querelles et les raids.#!"
