 oceania.0010.t:0 "Au-delà des confins de la Terre"
 oceania.0010.desc:0 "La grande mer à l'est n'est pas un désert désolé d'eau salée. Au-delà des confins de la terre, il y a des îles et des peuples - et nous le savons, car ces peuples viennent parfois vers l'ouest.\n\nNous ferons de notre mieux pour faire savoir que ces voyageurs et aventuriers des mers orientales sont les bienvenus en ces terres, que ceux qui désirent commercer et partager leur savoir avec nous trouveront des amis au sein de [ROOT.Char.GetPrimaryTitle.GetBaseName] !"
 oceania.0010.a:0 "Quand arriveront-ils sur nos côtes, et le feront-ils seulement ?"
