 RICE_oceania_turtle_hunter_modifier_desc:"Ce personnage a gagné un grand honneur et un statut élevé pour avoir chassé avec succès des tortues dans les eaux dangereuses de la mer."
 RICE_oceania_turtle_meat_and_shells:"Viande et carapaces de tortue de mer"
 RICE_oceania_sago_pearls:"Savoure des perles de sagou"
 RICE_oceania_sago_pearls_desc:"Dernièrement, ce personnage a pris goût aux plats où les [Glossary( 'perles de sagou', 'SAGO_GLOSS' )] sont l'ingrédient principal."
 RICE_oceania_sago_offerings:"Offrandes de sagou"
 RICE_oceania_sago_offerings_desc:"Des offrandes de diverses nourritures, en particulier du [Glossary( 'sagou', 'SAGO_GLOSS' )], ont été déposées en divers endroits pour solliciter l'aide d'esprits bienveillants."
 RICE_oceania_cockatoo_modifier:"Cacatoès populaires"
 RICE_oceania_cockatoo_modifier_desc:"Les cacatoès exportés depuis cette région sont populaires dans d'autres régions."
