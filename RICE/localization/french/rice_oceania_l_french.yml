 RICE_pacific_warriors:0 "Guerriers du Pacifique"
 RICE_pacific_warriors_flavor:0 "#F Sur les îles du Pacifique, de courageux champions combattent pour l'honneur et la gloire, démontrant leur habileté au combat au corps à corps et leur connaissance d'une variété de terrains sur terre et en mer.#!"
