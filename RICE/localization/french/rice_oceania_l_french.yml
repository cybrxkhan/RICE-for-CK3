 # Buildings
 building_type_RICE_oceania_caves_of_fakfak:0 "Grottes de Fakfak"
 building_type_RICE_oceania_caves_of_fakfak_desc:0 "De nombreuses grottes et falaises le long du littoral de la région de Fakfak, à l'extrémité occidentale de la péninsule de Bomberai, sont ornées d'art rupestre ancien représentant des figures animales et humaines ainsi que des empreintes de mains. Connues sous le nom de peintures de sang en raison de la peinture rouge utilisée dans ces œuvres, les habitants croient qu'elles sont l'œuvre de leurs lointains ancêtres, destinées à marquer ces lieux pour le culte des esprits bienveillants et pour enterrer leurs morts."
 building_RICE_oceania_caves_of_fakfak:0 "$building_type_RICE_oceania_caves_of_fakfak$"
 building_RICE_oceania_caves_of_fakfak_desc:0 "$building_type_RICE_oceania_caves_of_fakfak_desc$"
 building_type_RICE_oceania_kabui_bay:0 "Baie de Kabui"
 building_type_RICE_oceania_kabui_bay_desc:0 "Les îles Raja Ampat abritent de nombreux sites visuellement époustouflants, dont la baie de Kabui, parsemée d'îles karstiques à couper le souffle et séparant les îles de Waigeo et de Gam. Ce site préservé, une mosaïque de verts éclatants, de bleus, de feuillages colorés et de coraux, est associé à des légendes populaires et serait le lieu d'origine des populations locales. Par moments, l'environnement entourant la baie a également été utilisé comme abris funéraires."
 building_RICE_oceania_kabui_bay:0 "$building_type_RICE_oceania_kabui_bay$"
 building_RICE_oceania_kabui_bay_desc:0 "$building_type_RICE_oceania_kabui_bay_desc$"
 
 # Traits
 trait_RICE_stone_money:0 "Détenteur de pierre Rai"
 trait_RICE_stone_money_desc:0 "Ce personnage est en possession d'au moins une [Glossary( 'pierre Rai', 'YAP_STONE_MONEY_GLOSS' )] de valeur modeste, telle qu'enregistrée dans la tradition orale."
 trait_RICE_stone_money_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] est en possession d'au moins une [Glossary( 'pierre Rai', 'YAP_STONE_MONEY_GLOSS' )] de valeur modeste, telle qu'enregistrée dans la tradition orale."
 trait_RICE_stone_money_2:0 "Propriétaire de pierre Rai"
 trait_RICE_stone_money_2_desc:0 "Ce personnage est en possession de [Glossary( 'pierre Rai', 'YAP_STONE_MONEY_GLOSS' )] de valeur décente, telle qu'enregistrée dans la tradition orale."
 trait_RICE_stone_money_2_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] est en possession de [Glossary( 'pierre Rai', 'YAP_STONE_MONEY_GLOSS' )] de valeur décente, telle qu'enregistrée dans la tradition orale."
 trait_RICE_stone_money_3:0 "Ponte des pierres Rai"
 trait_RICE_stone_money_3_desc:0 "Ce personnage est en possession de [Glossary( 'pierre Rai', 'YAP_STONE_MONEY_GLOSS' )] de valeur notable et importante, telle qu'enregistrée dans la tradition orale."
 trait_RICE_stone_money_3_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] est en possession de [Glossary( 'pierre Rai', 'YAP_STONE_MONEY_GLOSS' )] de valeur notable et importante, telle qu'enregistrée dans la tradition orale."
 trait_RICE_stone_money_4:0 "Magnat des pierres Rai"
 trait_RICE_stone_money_4_desc:0 "Ce personnage a accumulé l'une des collections les plus précieuses de [Glossary( 'pierre Rai', 'YAP_STONE_MONEY_GLOSS' )] de tous ceux qui sont encore en vie, telle qu'enregistrée dans la tradition orale."
 trait_RICE_stone_money_4_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] a accumulé l'une des collections les plus précieuses de [Glossary( 'pierre Rai', 'YAP_STONE_MONEY_GLOSS' )] de tous ceux qui sont encore en vie, telle qu'enregistrée dans la tradition orale."
 trait_track_RICE_stone_money:0 "$trait_RICE_stone_money$"
 trait_track_RICE_stone_money_desc:0 "La valeur de chaque [Glossary( 'pierre Rai', 'YAP_STONE_MONEY_GLOSS' )] dépend non seulement de la taille et de la quantité de la pierre, mais aussi du statut de son propriétaire et de son histoire, comme les dangers que les gens ont pris pour l'acquérir en premier lieu, et ses propriétaires précédents."
 trait_betel_chewer:0 "Mâcheur de bétel"
 trait_betel_chewer_desc:0 "Ce personnage passe un temps démesuré à ne rien faire d'autre que mâcher des noix de bétel, et ses dents sont fréquemment tachées de rouge en raison de son addiction."
 trait_betel_chewer_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] passe un temps démesuré à ne rien faire d'autre que mâcher des noix de bétel, et ses dents sont fréquemment tachées de rouge en raison de son addiction."
 trait_RICE_kava_drinker:0 "Buveur de kava"
 trait_RICE_kava_drinker_desc:0 "Ce personnage est connu pour apprécier le kava, quelle que soit l'occasion. Il boira sans retenue, que ce soit en famille, entre amis ou avec des inconnus."
 trait_RICE_kava_drinker_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] est connu[ROOT.GetCharacter.Custom('FR_E')] pour apprécier le kava, quelle que soit l'occasion. [ROOT.GetCharacter.GetSheHe|U] boira sans retenue, qu'[ROOT.GetCharacter.GetSheHe] soit en famille, entre amis ou parmi des inconnus."
 
