 # Custom Localization 

 # Game Concepts
 game_concept_RICE_biaks:0 "Biaks"
 game_concept_RICE_biak:0 "Biak"
 game_concept_RICE_biak_desc:0 "Les [courtiers|El] de [culture|El] Biak peuvent parfois apparaître sur le bord sud-est de la carte. Pour représenter les aventures historiques des Biaks, il existe une [decision|El] pour les [rulers|El] sur le bord est de la carte pour #V $RICE_oceania_recruit_biak_adventurers$#! qui permet aux personnages sur le bord est de la carte d'obtenir des [modifiers|El] positifs et d'autres avantages en travaillant avec des marchands ou des guerriers Biak."
 game_concept_RICE_papuans:0 "Papous"
 game_concept_RICE_papuan:0 "Papou"
 game_concept_RICE_papua:0 "Papouasie"
 game_concept_RICE_papua_desc:0 "Des [courtiers|El] d'origine papoue peuvent occasionnellement apparaître sur le bord sud-est de la carte. Un certain nombre de groupes papous entretenaient historiquement des relations commerciales ou diplomatiques avec les peuples indonésiens à l'ouest."
 game_concept_RICE_micronesians:0 "Micronésiens"
 game_concept_RICE_micronesian:0 "Micronésien"
 game_concept_RICE_micronesia:0 "Micronésie"
 game_concept_RICE_micronesia_desc:0 "Des [courtiers|El] d'origine micronésienne peuvent occasionnellement apparaître sur le bord sud-est de la carte. Bien que sporadiques, certains groupes micronésiens ont pu commercer ou être en contact avec des communautés en Indonésie et en Papouasie."
 game_concept_RICE_melanesians:0 "Mélanésiens"
 game_concept_RICE_melanesian:0 "Mélanésien"
 game_concept_RICE_melanesia:0 "Mélanésie"
 game_concept_RICE_melanesia_desc:0 "Des [courtiers|El] d'origine mélanésienne peuvent occasionnellement apparaître sur le bord sud-est de la carte. Ces divers groupes de peuples, vivant à la fois en Papouasie et sur les îles de la Mélanésie, ont historiquement eu des contacts avec une variété de peuples, y compris les Polynésiens, les Micronésiens et les Papous."
 game_concept_RICE_polynesians:0 "Polynésiens"
 game_concept_RICE_polynesian:0 "Polynésien"
 game_concept_RICE_polynesia:0 "Polynésie"
 game_concept_RICE_polynesia_desc:0 "Une règle de jeu optionnelle permet aux [courtiers|El] d'origine polynésienne d'apparaître très rarement sur le bord sud-est de la carte. Au cours de la période médiévale, les communautés polynésiennes avaient étendu leur influence à travers le Pacifique, jusqu'en Mélanésie et en Polynésie, par exemple, mais pas à l'intérieur des frontières actuelles de la carte."
 game_concept_RICE_south_americans:0 "Sud-Américains"
 game_concept_RICE_south_american:0 "Sud-Américain"
 game_concept_RICE_south_america:0 "Amérique du Sud"
 game_concept_RICE_south_america_desc:0 "Grâce à une règle de jeu optionnelle, des [courtiers|El] d'origine sud-américaine peuvent très rarement apparaître sur le bord sud-est de la carte. Bien qu'il n'y ait eu aucun contact entre l'Amérique du Sud et l'Indonésie et la Papouasie à la période précolombienne, un nombre croissant de preuves suggère des contacts potentiels entre les Polynésiens et l'Amérique du Sud."
 game_concept_RICE_indigenous_australians:0 "Australiens autochtones"
 game_concept_RICE_indigenous_australian:0 "Australien autochtone"
 game_concept_RICE_australians:0 "Australiens"
 game_concept_RICE_australian:0 "Australien"
 game_concept_RICE_australia:0 "Australie"
 game_concept_RICE_australia_desc:0 "Bien que l'Australie soit hors carte, des [courtiers|El] d'origine australienne autochtone peuvent très occasionnellement apparaître sur le bord sud-est de la carte. Historiquement, un nombre croissant de preuves suggère des contacts potentiels entre l'Indonésie et l'Australie avant la colonisation européenne."
 game_concept_RICE_oceanic:0 "Océanique"
 game_concept_RICE_oceania:0 "Océanie"
 game_concept_RICE_oceania_desc:0 "L'Océanie englobe diverses masses terrestres et îles du Pacifique au-delà de l'Asie du Sud-Est maritime.\n\nBien que la majeure partie soit hors de la carte en jeu, des [courtiers|El] de diverses [cultures|El] et [faiths|El] océaniennes peuvent apparaître sur le bord sud-est de la carte pour représenter les liens sporadiques que certaines de ces régions entretenaient historiquement avec l'Asie du Sud-Est. Ces événements vous donnent également l'opportunité de tirer parti des connaissances de ces peuples sous la forme de [modifiers|El] bénéfiques. La [decision|El] de #V $RICE_welcome_visitors_from_oceania$#! augmente les chances de ces rencontres.\n\nPar défaut, les types de [courtiers|El] océaniens que vous pourriez voir dépendent de vos règles de jeu, et incluent :\n\n$EFFECT_LIST_BULLET$Occasionnel : [RICE_papuan|El] de l'Ouest et [RICE_micronesian|El] de l'Ouest\n$EFFECT_LIST_BULLET$Rare : [RICE_papuan|El] du Centre et [RICE_micronesian|El] du Centre\n$EFFECT_LIST_BULLET$Très rare : [RICE_micronesian|El] de l'Est, [RICE_papuan|El] de l'Est, [RICE_indigenous_australian|El], et [RICE_melanesian|El] de l'Ouest\n$EFFECT_LIST_BULLET$Très rare avec règle de jeu : [RICE_polynesian|El] et [RICE_melanesian|El] de l'Est\n$EFFECT_LIST_BULLET$Extrêmement rare avec règle de jeu : [RICE_south_american|El]"

 # Rules
 rule_RICE_oceania_frequency:0 "RICE Fréquence des [courtiers|El] d'[RICE_oceania|E]"
 setting_RICE_oceania_frequency_rare:0 "Rare (Par défaut)"
 setting_RICE_oceania_frequency_rare_desc:0 "Les [courtiers|El] d'[RICE_oceania|E] apparaissent au taux par défaut sur le bord sud-est de la carte."
 setting_RICE_oceania_frequency_uncommon:0 "#high Peu fréquent#!"
 setting_RICE_oceania_frequency_uncommon_desc:0 "Les [courtiers|El] d'[RICE_oceania|E] apparaissent beaucoup plus fréquemment sur le bord sud-est de la carte, mais restent assez peu fréquents."
 setting_RICE_oceania_frequency_common:0 "#high Fréquent#!"
 setting_RICE_oceania_frequency_common_desc:0 "Les [courtiers|El] d'[RICE_oceania|E] apparaissent plus fréquemment sur le bord sud-est de la carte, mais restent encore assez peu fréquents."
 setting_RICE_oceania_frequency_off:0 "#high Désactivé#!"
 setting_RICE_oceania_frequency_off_desc:0 "Les [courtiers|El] d'[RICE_oceania|E] n'apparaîtront jamais, même ceux qui auraient historiquement du sens. Cela remplacera les autres règles de jeu connexes."
 rule_RICE_remote_oceania:0 "RICE [courtiers|El] d'[RICE_oceania|E] éloignés"
 setting_RICE_remote_oceania_off:0 "Désactivé (Par défaut)"
 setting_RICE_remote_oceania_off_desc:0 "Les [courtiers|El] [RICE_polynesian|El] et les [RICE_melanesian|El] de l'Est n'apparaîtront jamais sur le bord sud-est de la carte."
 setting_RICE_remote_oceania_on:0 "#high Activé#!"
 setting_RICE_remote_oceania_on_desc:0 "Bien que plus rares que les autres [courtiers|El] d'[RICE_oceania|E], les [RICE_melanesian|El] de l'Est et les [courtiers|El] [RICE_polynesian|El] peuvent apparaître de manière [Glossary( 'ahistorique', 'POLYNESIA_HISTORY_GLOSS' )] sur le bord sud-est de la carte."
 rule_RICE_south_america:0 "RICE [courtiers|El] [RICE_south_american|El]"
 setting_RICE_south_america_off:0 "Désactivé (Par défaut)"
 setting_RICE_south_america_off_desc:0 "Les [courtiers|El] d'[RICE_south_american|El] n'apparaîtront jamais sur le bord sud-est de la carte."
 setting_RICE_south_america_on:0 "#high Activé#!"
 setting_RICE_south_america_on_desc:0 "Bien que plus rares que les [courtiers|El] d'[RICE_oceanic|El], les [RICE_south_american|El] [courtiers|El] peuvent apparaître de manière [Glossary( 'ahistorique', 'SOUTH_AMERICA_HISTORY_GLOSS' )] sur le bord sud-est de la carte."
 
