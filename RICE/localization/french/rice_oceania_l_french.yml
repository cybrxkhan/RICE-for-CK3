 oceania.0030.t:0 "Le voyageur [courtier.GetCulture.GetCollectiveNounNoTooltip|l]"
 oceania.0030.desc:0 "L'arrivée d'un[courtier.Custom('FR_E')] étrang[courtier.Custom('FR_ErEre')], qui prétend avoir voyagé jusqu'ici en traversant les océans, a provoqué une certaine agitation à [ROOT.Char.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTier].\n\nJ'ai rencontré cette figure sensationnelle, nommée [courtier.GetFirstName], qui prétend appartenir au peuple [courtier.GetCulture.GetName]. Apparemment, son peuple possède des connaissances, transmises par ses ancêtres, qui pourraient nous être d'une grande utilité..."
 oceania.0030.a:0 "S'il vous plaît, enseignez-nous ce que vous savez !"
 oceania.0030.b:0 "Peut-être pouvez-vous travailler pour moi ?"
 oceania.0030.c:0 "Une histoire amusante, mais cela ne m'intéresse pas."
