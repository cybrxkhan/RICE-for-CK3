 RICE_oceania_harvesting_more_megapode_eggs:"Récolte extensive d'œufs de mégapodes"
 RICE_oceania_harvesting_more_megapode_eggs_desc:"Les récoltes d'œufs de [Glossary( 'mégapode', 'MEGAPODE_GLOSS' )] ont augmenté ici, malgré les rituels traditionnels visant à limiter le nombre d'œufs pouvant être collectés."
 RICE_oceania_restrained_harvest_of_megapode_eggs:"Récolte modérée d'œufs de mégapode"
 RICE_oceania_restrained_harvest_of_megapode_eggs_desc:"Malgré les appels à une augmentation de la récolte d'œufs de [Glossary( 'mégapode', 'MEGAPODE_GLOSS' )] ici, les chefs de la communauté ont accepté de suivre les rituels traditionnels qui limitent le nombre d'œufs pouvant être collectés."
 RICE_oceania_birds_of_paradise_modifier:"Exportations lucratives d'oiseaux de paradis"
 RICE_oceania_ancestor_bonus_naval:"Bénédictions ancestrales"
 RICE_oceania_ancestor_bonus_naval_desc:"Les ancêtres de ce personnage auraient béni celui-ci de la force nécessaire pour combattre ses ennemis au combat."
 RICE_oceania_ancestor_bonus_mystical: "$RICE_oceania_ancestor_bonus_naval$"
 RICE_oceania_ancestor_bonus_mystical_desc:"Les ancêtres de ce personnage auraient accordé leur bénédiction pour le protéger contre les intrigues ennemies."
