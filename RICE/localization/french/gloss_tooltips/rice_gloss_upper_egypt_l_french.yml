 SHURTA_GLOSS:"En arabe moderne, #bold shurta#! désigne généralement la police ou une forme d'autorité locale. Cependant, durant la période islamique primitive, bien que la shurta pouvait également désigner une sorte de force de sécurité ou de police, elle pouvait se voir confier d'autres tâches selon l'époque et le lieu, telles que l'espionnage, des fonctions judiciaires, la collecte des impôts, la collecte des ordures, servir de gardes du corps pour les gouverneurs, superviser les prisons et faire appliquer les lois morales."