l_french:

 LORD_OF_THE_MOUNTAIN_GLOSS:"Le #bold Seigneur de la Montagne#! (#italic Migin Soñoj#! en nubien médiéval) ou #bold Éparque de Nobatie#! était sans doute le plus haut fonctionnaire de Makurie, le royaume septentrional de la Nubie médiévale. Sa principale responsabilité était de gérer la frontière entre la Nubie et l'Égypte, et d'appliquer les dispositions du traité du Baqt du côté nubien en tant que pendant du gouverneur égyptien d'Assouan. Actuellement, les chercheurs ne savent pas si cette charge était héréditaire, attribuée par nomination, ou une combinaison des deux, ni si les Éparques avaient des liens avec les souverains de l'ancien royaume de Nobatie, qui fut absorbé par la Makurie à un moment donné avant le VIIe siècle."
 GOVERNOR_OF_ASWAN_GLOSS:"Historiquement, dans l'Égypte médiévale, les #bold Gouverneurs d'Assouan#! avaient une responsabilité majeure dans la gestion de la frontière entre la Nubie et l'Égypte, et dans l'application des dispositions du traité du Baqt du côté égyptien, en tant que contrepartie de l'Éparque nubien de Nobatie."
 PHARAOH_GLOSS:"Le terme #bold Pharaon#! désignait à l'origine le palais royal de l'Égypte antique, mais durant le Nouvel Empire (environ du XVIe au XIe siècle avant notre ère), le mot en vint à être utilisé par métonymie pour désigner les souverains d'Égypte. Il ne fut jamais utilisé comme titre officiel pour les monarques d'Égypte, et un tel usage provient de la Bible hébraïque. En réalité, les Pharaons recevaient généralement cinq noms à partir du Moyen Empire : le nom d'Horus, le nom de Nebty, le nom d'Horus d'or, le nomen et le prénomen."
 QORE_GLOSS:"#bold Qore#! ou #bold Kore#! était le titre des souverains du royaume de Koush, dans l'ancienne Nubie, particulièrement durant la période méroïtique (542 av. J.-C. - c. 350 apr. J.-C.) lorsque la capitale de Koush se trouvait à Méroé. Le titre pouvait être porté aussi bien par des souverains masculins que féminins."
 KANDAKE_GLOSS:"#bold Kandake#! ou #bold Candace#! était le titre des reines mères ou des reines régnantes du royaume de Koush, dans l'ancienne Nubie, particulièrement durant la période méroïtique (542 av. J.-C. - v. 350 apr. J.-C.) lorsque la capitale de Koush se trouvait à Méroé. Le terme a survécu dans la Bible pour désigner une supposée reine des soi-disant Éthiopiens, et dans les légendes médiévales d'Alexandre le Grand comme le nom d'une reine contre laquelle il combattit en Nubie. En conséquence, il a survécu de nos jours comme prénom courant en Occident."
 HAFIR_GLOSS:"#bold Les hafirs#! sont un type de réservoir d'eau construit artificiellement, édifié pour la première fois par le royaume de Koush dans l'ancienne Nubie, et encore utilisé de nos jours. Beaucoup des premiers hafirs ont été construits à proximité de temples koushites et pourraient avoir été associés à l'autorité et au pouvoir religieux et royal."
 ARCHANGEL_RAPHAEL_GLOSS:"#bold Saint Raphaël#! est l'un des archanges les plus vénérés dans le judaïsme, le christianisme et l'islam. Mentionné à l'origine dans le #italic Livre de Tobie#! et le #italic Livre d'Hénoch#!, Raphaël n'est pas nommé dans le Nouveau Testament ni dans le Coran. Cependant, la tradition chrétienne ultérieure l'a associé à la guérison, et dans l'islam, on croit qu'il est l'ange anonyme qui se tient éternellement avec une trompette aux lèvres, prêt à annoncer le Jour du Jugement."
 XENODOCHIUM_GLOSS:"Un #bold Xenodochium#! ou #bold Xenodocheion#! (pluriel #italic xenoocheia#!) était un hospice pour les voyageurs, en particulier les pèlerins, à l'époque médiévale. Le terme, d'origine grecque, est utilisé pour désigner de tels hospices provenant de l'Empire byzantin ou de régions chrétiennes influencées par celui-ci, comme la Nubie."
 SAINT_CATHERINE_ASHITINAME_OF_MUHAMMAD:"L'#bold Ashitiname de Mahomet#!, aussi connu sous le nom de Pacte ou Testament de Mahomet, est une charte accordant protection et autres privilèges aux moines chrétiens du monastère Sainte-Catherine dans le Sinaï. La version originale du document aurait été saisie par les Ottomans pour être conservée en lieu sûr lorsqu'ils conquirent l'Égypte, bien qu'une copie ait été remise aux moines du monastère Sainte-Catherine en compensation, et les Ottomans respectèrent néanmoins les dispositions de la charte."
 SAINT_CATHERINE_BEDOUIN_GUARDS:"Le monastère chrétien de Sainte-Catherine dans le Sinaï a historiquement compté sur des #bold gardes bédouins#! pour sa protection. Au fil des siècles, alors que le monastère était souvent pillé et saccagé par des forces musulmanes, certains des plus féroces gardiens du monastère étaient également musulmans."
 SAINT_CATHERINE_BURNING_BUSH:"Le #bold Buisson Ardent#! était, dans la tradition juive, chrétienne et musulmane, le lieu de la péninsule du Sinaï où Moïse fut désigné par Dieu pour mener les Israélites hors d'Égypte et vers la Terre Promise. Durant l'Antiquité tardive, le célèbre monastère de Sainte-Catherine fut construit autour d'un buisson qui serait prétendument le même que le buisson ardent biblique."
 SAINT_CATHERINE_LIBRARY:"La #bold bibliothèque#! du monastère Sainte-Catherine dans le Sinaï a été construite sous le règne de l'empereur byzantin Justinien, entre 527 et 565 de notre ère, et est reconnue comme l'une des plus anciennes bibliothèques en activité continue au monde. Au fil des siècles, elle a accumulé une vaste collection de manuscrits et de livres dans une grande variété de langues, incluant mais sans s'y limiter le grec, l'araméen, le syriaque, le latin, l'arabe, l'arménien, le guèze, le slavon d'église, le géorgien, l'hébreu et le copte."
 SAINT_CATHERINE_PATH_OF_MOSES:"À côté du monastère Sainte-Catherine dans le Sinaï se trouve un itinéraire connu sous le nom de #bold Chemin de Moïse#!, qui monte sur une montagne où l'on croit que le Moïse biblique reçut les Dix Commandements."
 SAINT_CATHERINE_RELICS:"Le monastère Sainte-Catherine dans le Sinaï est associé à sainte Catherine car ses prétendues #bold reliques#! furent découvertes à proximité du monastère et y furent apportées pour être conservées en sécurité, en faisant par conséquent un lieu de pèlerinage populaire. Dans l'hagiographie traditionnelle, c'était une jeune femme érudite qui convertit de nombreuses personnes au christianisme, avant d'être martyrisée vers 305 de notre ère."
 SAINT_CATHERINE_WELL_OF_MOSES:"Le monastère Sainte-Catherine dans le Sinaï renferme le prétendu #bold Puits de Moïse#!, où le Moïse biblique aurait rencontré sa future épouse, Séphora, la fille de Jéthro, le prêtre et prince de Madian. Encore de nos jours, le puits est la principale source d'eau du monastère."
 SAQIA_GLOSS:"#bold Saqia#! (également orthographié #bold Saqiya#! ou #bold Sakia#!) est un dispositif mécanique d'élévation de l'eau composé de seaux ou de jarres fixés à une roue verticale ou à une courroie de corde autour de la roue, laquelle est reliée par un arbre à une roue horizontale actionnée par des chevaux, des bœufs ou des ânes. Cette forme d'irrigation est utilisée au Moyen-Orient, en Inde et en Afrique du Nord depuis des siècles. En de nombreux endroits, les saqias sont soutenues par plusieurs actionnaires locaux différents, qui s'engagent à contribuer à parts égales aux matériaux nécessaires ou à effectuer les réparations sur la saqia, et en retour chaque actionnaire reçoit une période d'irrigation égale pour son propre champ."
 TEBELDI_TREES_GLOSS:"#bold Tebeldi#! est le nom utilisé dans certaines régions du Soudan pour désigner #italic Adansonia digitata#!, l'espèce la plus répandue de baobabs, originaire d'une grande partie de l'Afrique et de certaines régions du Yémen et d'Oman. Traditionnellement, il était apprécié comme source de nourriture, d'eau et de médicaments. Au Darfour, les dirigeants locaux avaient l'obligation sacrée de protéger ces arbres, car ils étaient considérés comme une source d'eau cruciale, les arbres étant utiles pour le stockage de l'eau."
 NOTARIOS_GLOSS:"Dans la Rome antique et à Byzance, #bold notarios#! était généralement un titre donné à des fonctionnaires de rang inférieur ou à des scribes chargés de tâches administratives ou de secrétariat. Le titre s'est répandu dans les régions influencées par Rome et Byzance, comme l'Europe occidentale et la Nubie, où le terme a conservé une signification similaire."
 SHOUNG_GLOSS:"Le #bold Gardien des Greniers#!, ou #bold Shoung#! en nubien médiéval, était un titre attesté pour certains hauts fonctionnaires makuriens dans la Nubie médiévale. Les érudits ne sont pas certains des devoirs ou des fonctions associés à ce titre, ni s'il s'agissait d'un titre cérémoniel. Fait curieux, un roi makurien de la fin du XIIe siècle, Basil, est attesté comme détenteur de ce titre, alors qu'il était #italic également#! roi, contrairement aux autres détenteurs de ce titre qui étaient des fonctionnaires non royaux."
 NUBIA_RELEASED_THE_BOATS_GLOSS:"Le trafic à destination et en provenance de la Nubie et de l'Égypte était soigneusement contrôlé par des fonctionnaires des deux côtés durant cette période. Cet extrait provient d'une lettre impliquant l'Éparque de Nobatie en Nubie, illustrant comment les navires marchands, par exemple, avaient besoin de sa permission pour opérer en Nubie et voyager dans les deux sens."
 NUBIA_THE_KING_GLOSS:"Cet extrait provient d'une lettre dans laquelle un marchand musulman, Lami' ibn Hasan al-Kanzi, se plaint auprès de l'Éparque de Nobatie que son jeune esclave, qu'il utilisait peut-être comme messager ou pour s'occuper d'affaires liées au roi makurien, a été entravé d'une manière ou d'une autre par un marchand musulman rival, Ibn al-'Asqalani. Les deux hommes semblent avoir eu des liens avec le roi makurien."
 NUBIA_COLD_SEASON_GLOSS:"Un moyen de transport courant pour les marchands voyageant le long du Nil à l'époque médiévale était le bateau. Par moments, la navigation sur le fleuve pouvait être entravée durant la saison froide à cause du vent, si bien que, comme le suggère cet extrait d'une lettre d'un marchand musulman à l'Éparque de Nobatie, ces marchands devaient planifier soigneusement leurs affaires en fonction de la période de l'année."
 NUBIA_COLD_SEASON_2_GLOSS:"Un moyen de transport courant pour les marchands voyageant le long du Nil durant l'ère médiévale était le bateau. Parfois, la navigation sur le fleuve pouvait être entravée durant la saison froide en raison du vent, si bien que les marchands devaient planifier soigneusement leurs affaires en fonction de la période de l'année."
 NUBIA_IN_THE_PRESENCE_OF_GLOSS:"Cet extrait provient d'une lettre d'une personne musulmane adressée à l'Éparque de Nobatie en Makurie. L'usage de « en présence de l'Évêque » (dans la version originale) vise à conférer une sanction légale à ce qui se passe, fondé sur la pratique des actes juridiques accomplis en présence de témoins ou d'un juge dans le droit islamique médiéval. De même, dans la Nubie médiévale, les documents juridiques étaient souvent signés en présence de divers officiels séculiers et ecclésiastiques. Ce passage suggère également que les obligations entre deux parties dans ce contexte frontalier pouvaient exister entre des parties individuelles, et ne se limitaient pas uniquement à deux gouvernements, c'est-à-dire les royaumes d'Égypte et de Makurie."
 NUBIA_KISSES_THE_GROUND:"Cet extrait provient d'une lettre d'une personne musulmane adressée à l'Éparque de Nobatie, et fait usage de la formule d'obéissance « l'esclave baise le sol » que l'on trouve couramment dans ce type de lettres envoyées à certains officiels ou dirigeants en Nubie et en Égypte. Cette formule ne signifie évidemment pas littéralement que l'auteur est un esclave du destinataire ; il s'agissait d'une marque de respect formulaire initialement introduite en Égypte, qui reflétait une évolution du protocole de la cour fatimide, où l'on baisait le sol en présence du calife fatimide."
 NUBIA_RISING_OF_PRICES_GLOSS:"Cet extrait provient d'une lettre faisant allusion à l'intervention apparente de l'Éparque de Nobatie dans une sorte de crise économique, en accordant la permission d'expédier des provisions."
 SUNT_GLOSS:"#bold Sunt#! est le mot arabe désignant l'espèce d'arbre à fleurs #italic Vachellia nilotica#! ou #italic Acacia nilotica#!, connu sous les noms vernaculaires de #italic gommier arabique#!, #italic babul#!, #italic mimosa épineux#!, #italic acacia d'Égypte#! et #italic acacia épineux#!. Il était traditionnellement utilisé pour construire des navires le long du Nil, grâce à l'imperméabilité relative de son bois, et à la facilité avec laquelle une coque de bateau pouvait être rapidement et aisément construite à partir de petites pièces de #italic sunt#!."
 ERA_OF_THE_HEGIRA_GLOSS:"L'#bold Ère de l'Hégire#! (en grec/latin) ou #bold Hijri#! (en arabe originel) est le calendrier utilisé pour l'enregistrement des dates dans le monde islamique. Il débute l'année où le Prophète Mahomet a migré de La Mecque à Médine lors d'un événement connu sous le nom d'Hégire, correspondant à l'an 622 de notre ère. Par moments, son usage s'est étendu à des communautés non musulmanes qui étaient gouvernées ou influencées par des États islamiques, ou qui entretenaient des liens économiques et culturels avec les musulmans."
 ERA_OF_THE_MARTYRS_GLOSS:"L'#bold Ère des Martyrs#!, également connue sous le nom d'#bold Ère dioclétienne#!, est l'ère calendaire utilisée pour enregistrer les dates par certains premiers chrétiens. Elle commence au règne de l'empereur romain Dioclétien en 284 de notre ère, qui initia la dernière grande persécution des chrétiens dans l'Empire romain. Bien qu'elle ait été abandonnée au profit de l'ère #italic Anno Domini#! dans une grande partie du monde chrétien au Moyen Âge, elle continua d'être utilisée par l'Église copte basée en Égypte jusqu'à nos jours."
 SAYINGS_OF_THE_DESERT_FATHERS_GLOSS:"Les #bold Apophtegmes des Pères du désert#!, datant d'environ le Ve siècle, sont diverses collections textuelles d'anecdotes et de paroles des Pères du désert d'Égypte, qui étaient un certain nombre d'ermites et d'ascètes influents ayant joué un rôle majeur dans le développement du christianisme. Ces collections étaient populaires parmi les moines coptes médiévaux en tant que source de guidance spirituelle."
 ABBA_POEMEN_GLOSS:"#bold Abba Poemen#! (v. 340-450 ap. J.-C.) était un moine chrétien, Père du désert et saint originaire d'Égypte. Il est l'Abba, ou Père, le plus cité dans les #italic Apophtegmes des Pères du désert#!, un recueil d'anecdotes et de paroles des Pères du désert."
 OIKONOMOS_GLOSS:"Le titre d'#bold oikonomos#! trouve son origine dans le monde grec antique et a évolué au fil des siècles pour prendre différentes significations, bien qu'il ait toujours été lié à l'administration de quelque chose – qu'il s'agisse d'une maison privée, d'un domaine, d'un temple, d'un État politique, etc. – dans un contexte méditerranéen. À la fin de l'Antiquité, en Méditerranée, il désignait généralement l'intendant d'une église ou d'un monastère. Le titre s'est même répandu jusqu'en Nubie, en raison de l'influence byzantine ; bien que la plupart des chercheurs ne soient pas certains des fonctions des divers titres administratifs nubiens, il est probable que l'oikonomos nubien était également une sorte d'intendant ecclésiastique."
 SAINT_EPIMACHOS_GLOSS:"Bien qu'il existe différents saints nommés #bold Épimaque#!, ou #bold Epimachus#!, celui qui était populairement vénéré dans la Nubie médiévale était Épimaque de Péluse, un tisserand qui fut, selon les récits hagiographiques, martyrisé à une date inconnue durant une période de persécution des chrétiens dans l'Égypte romaine. Bien que son histoire originale ait eu peu de liens avec le domaine militaire, en Nubie, il était représenté comme un saint-guerrier. On ignore s'il acquit cet aspect en raison de son nom contenant le mot grec pour bataille, #italic mákhē#!, ou à cause d'un miracle local qui nous est perdu. Le culte d'Épimaque, en tant que guerrier, était assez répandu dans la Nubie médiévale, reflétant peut-être des inquiétudes concernant les menaces militaires pesant sur la Nubie, ou l'instabilité politique."
 SOULOU_GLOSS:"La signification du mot #bold soulou#!, qui apparaît dans quelques documents nubiens médiévaux, a déconcerté les nubiologues pendant des années. C'est un excellent exemple de la difficulté à traduire nombre de ces textes dont nous n'avons souvent pas le contexte. Les #italic Soulou#! semblent avoir travaillé pour des officiels afin de transmettre des messages, mais on ignore s'il s'agissait d'un véritable titre de fonction, d'une classe sociale, d'un groupe ethnique employé à cette fin, ou d'autre chose. #italic Soulou#! pourrait correspondre au mot #italic sulu#! dans les langues nubiennes modernes, qui désigne des cordonniers qui sont des travailleurs itinérants. Cependant, un article académique récent de Petra Weschenfelder sur le terme #italic Soulou#! recommande qu'il est préférable de le laisser non traduit pour l'instant jusqu'à ce que de plus amples informations soient trouvées."
 KITAB_AJA_IB_AL_HIND_GLOSS:"Le #bold Kitāb \\'ajā\\'ib al-Hind#!, ou #italic « Le Livre des Merveilles de l'Inde » #!, est un recueil du dixième siècle de récits d'aventures de marchands, marins et voyageurs, écrit par Buzurg ibn Shahriyār, un capitaine de navire arabe. Il fut dédié à un gouverneur ikhshidide d'Égypte, Abu al-Misk Kafur (905 - 968 ap. J.-C.), qui était à l'origine un esclave africain au service des Ikhshidides mais gravit les échelons pour devenir le dirigeant #italic de facto#! de l'Égypte en tant que vizir avant de devenir seul souverain en 966."
 SAINT_HILARIA_GLOSS:"La #bold Légende de Sainte Hilaria#! était un texte copte qui raconte une légende sur la fille aînée de Zénon, un empereur du 5e siècle de l'Empire romain d'Orient. Selon la légende, Hilaria fut grandement inspirée par les moines de la vallée égyptienne de Scété (de nos jours $b_wadi_natrun$), et pour les rejoindre, elle se fit passer pour un eunuque nommé Hilarion. Plus tard, la sœur cadette d'Hilaria, Théopiste, tomba malade après avoir été possédée par un démon et se rendit en Égypte pour être soignée, où elle fut guérie par Hilaria, toujours déguisée. Lorsqu'Hilaria prit soin de sa sœur, les deux femmes partagèrent le même lit, et l'empereur Zénon, scandalisé qu'un « moine » dorme avec sa fille, exigea une explication, et Hilaria dut révéler sa véritable identité. Zénon, cependant, fut profondément touché par la dévotion spirituelle de sa fille aînée, et lui permit de retourner à Scété en tant que « moine ». Malgré l'historicité douteuse de la légende, Hilaria devint une sainte dans plusieurs églises orientales des siècles après sa mort supposée."
 FUL_MEDAMES_GLOSS:"#bold Ful Medames#!, ou simplement #bold Ful#!, est un ragoût à base de fèves mélangées à diverses épices et herbes, souvent consommé au petit-déjeuner, populaire en Égypte et au Soudan, où il est considéré comme un plat national. La consommation de fèves dans cette région remonte à l'Égypte pharaonique, ce qui pourrait conférer au plat des origines anciennes. Des témoignages moins douteux sur ce plat proviennent de la période médiévale ; au Caire médiéval, par exemple, la préparation du #italic ful#! était monopolisée par les habitants vivant près des Bains de la Princesse, un bain public, car ils profitaient des feux utilisés pour maintenir l'eau des bains au chaud. D'énormes chaudrons de #italic ful#! mijotaient jour et nuit près des bains publics afin de maintenir un approvisionnement continu en petit-déjeuner pour la population du Caire."
 HERMES_TRISMEGISTUS_GLOSS:"#bold Hermès Trismégiste#!, signifiant #italic Hermès le Trois fois Grand#!, est un érudit, magicien et enseignant légendaire qui est né de la syncrétisation du dieu grec Hermès et du dieu égyptien Thot. On dit qu'il aurait composé l'#italic Hermetica#!, un ensemble de textes qui ont posé les fondations de la tradition philosophique #italic hermétique#!, laquelle a profondément influencé la pensée hellénistique, chrétienne, juive et musulmane jusqu'au début de la période moderne."
 ABLEMBA_GLOSS:"Dans le folklore soudanais, #bold ablemba#! désigne des mirages surnaturels sous la forme de lumières ou de lampes nocturnes, qui attirent les gens loin de leurs foyers ou des routes sûres. Ils font partie d'un ensemble plus large de plusieurs types de phénomènes ou d'êtres surnaturels tels que des spectres féminins, des djinns et des serpents luminescents, que l'on croit fréquenter les environs des ruines nubiennes antiques ou médiévales. Ces esprits, que l'on croit d'origine chrétienne dans le Soudan moderne, sont perçus comme gardant les secrets de leurs domaines contre les voleurs et les intrus, reflétant la vision des habitants de leur patrimoine historique."
 KARKADE_GLOSS:"#bold Karkadé#!, également orthographié #italic karkadeh#! ou #italic karkadey#!, est une boisson du Moyen-Orient et d'Afrique du Nord préparée à partir des pétales séchés d'un type d'hibiscus appelé roselle (#italic Hibiscus sabdariffa#!). Elle est traditionnellement populaire en Égypte et au Soudan, particulièrement durant le Ramadan et lors d'occasions festives comme les mariages, car on prête à cette boisson des bienfaits pour la santé. Une façon typique de préparer cette boisson consiste à faire tremper les pétales de roselle séchés dans l'eau, puis à la faire bouillir, avant d'y ajouter d'autres saveurs selon les goûts."

