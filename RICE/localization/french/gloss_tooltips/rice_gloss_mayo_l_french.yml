 SCOTTI_GLOSS:"Les peuples de langue gaélique, y compris les ancêtres des Irlandais modernes, étaient appelés les #bold Scotti#! durant l'Antiquité tardive et le haut Moyen Âge. Durant cette période, l'Irlande était connue sous le nom de #italic Scotia Maior#!, tandis que l'Écosse était appelée #italic Scotia Minor#!. L'association du mot Scot avec l'Écosse, et non avec les Gaëls en général ou les Irlandais, serait un développement médiéval plus tardif."
 PERIPHYSEON_GLOSS:"Le #bold Periphyseon#!, appelé \"l'accomplissement ultime de la philosophie antique\", est considéré comme le magnum opus de Jean Scot Érigène, l'un des intellectuels chrétiens les plus brillants du IXe siècle. Il synthétise et développe les idées de nombreux courants de pensée antiques différents dans un contexte chrétien, au point d'avoir été condamné par certaines autorités théologiques chrétiennes ultérieures pour avoir promu des idéaux excessivement panthéistes et néoplatoniciens, bien qu'Érigène se considérât lui-même comme un opposant orthodoxe à l'hérésie. Le livre est également connu sous le nom de #italic De divisione naturae#!, un nom latin qui lui fut donné par l'antiquaire anglais du XVIIe siècle Thomas Gale, qui publia la première version imprimée du texte."
 PANTHEISM_GLOSS:"#bold Le panthéisme#! est une idée religieuse ou philosophique selon laquelle Dieu est identique à l'univers, et ne considère généralement pas Dieu comme une entité distincte, anthropomorphe ou autre."
 LORDS_OF_THE_WOOD_GLOSS:"Dans l'Irlande du haut Moyen Âge, vingt-huit arbres présents sur l'île étaient légalement divisés en quatre groupes de sept, selon leur importance économique et culturelle. Les #bold Seigneurs de la Forêt#! étaient considérés comme les sept plus importants de ces quatre groupes, et comprenaient le chêne, le noisetier, le houx, l'if, le frêne, le pin sylvestre et le pommier sauvage."
 NISI_FORTE_GLOSS:"#bold Nisi forte#! est une expression latine signifiant #italic « à moins que, peut-être »#!. Un usage célèbre de cette expression provient de l'homme d'État et avocat romain Cicéron : lors de sa défense du consul Lucius Licinius Murena, qui fut jugé après avoir été accusé de corruption électorale, Cicéron déclara dans son discours : #italic « Nemo enim fere saltat sobrius, #italic nisi forte#! insanit. »#! (#italic « Personne ne danse sobre, à moins peut-être qu'il ne soit fou. »#!)"
 SAINT_PATRICKS_CHAIR_GLOSS:"#bold La Chaise de Saint Patrick#!, ou la Pierre de Boheh, est une grande pierre située à proximité de l'ancien site montagneux et de pèlerinage de Croagh Patrick en Irlande, qui contient divers pétroglyphes et symboles gravés par l'homme. Elle pourrait avoir été sculptée durant l'ère néolithique, et constitue l'un des exemples les plus remarquables de monuments préhistoriques ou antiques parsemant le paysage autour de la montagne, prouvant l'importance spirituelle de la région bien avant la christianisation de l'Irlande. Deux fois par an, si l'on se tient près de la Chaise de Saint Patrick, le soleil, en se couchant, semble rouler le long de l'épaule de la montagne, ce qui pourrait expliquer pourquoi la pierre a été originellement sculptée ou placée à son emplacement actuel."
 SAINT_PATRICKS_BREASTPLATE_GLOSS:"#bold La Cuirasse de Saint Patrick#! est une prière irlandaise traditionnellement attribuée à saint Patrick, bien que sa première attestation date de plusieurs siècles après sa mort. Une partie célèbre de la prière est l'invocation répétée de Jésus-Christ :#italic \n\nLe Christ avec moi, le Christ devant moi,\nLe Christ derrière moi, le Christ en moi,\nLe Christ au-dessous de moi, le Christ au-dessus de moi,\nLe Christ à ma droite, le Christ à ma gauche.#!"