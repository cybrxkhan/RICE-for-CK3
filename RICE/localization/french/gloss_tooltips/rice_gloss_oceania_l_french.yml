 CHELDEBECHEL_GLOSS:"Traditionnellement aux Palaos, les #bold Cheldebechel#! étaient des clubs formels qui jouaient un rôle sociétal important dans la nation micronésienne des Palaos. Ils étaient organisés par âge et par genre, et avaient diverses fonctions, telles qu'éduquer les jeunes générations sur les rôles dans la société, mobiliser la main-d'œuvre pour des projets de travaux publics, faire respecter les lois et protéger les intérêts économiques et militaires de la communauté, et ainsi de suite."
 BITANG_ME_A_BITANG_GLOSS:"Le principe du #bold bitang me a bitang#!, signifiant « moitié et moitié » ou « ce côté et l'autre côté », est un concept palaosien de dualité, où chaque entité est conceptuellement équilibrée entre deux côtés opposés mais complémentaires et connectés. Par exemple, une personne n'est considérée ni bonne ni mauvaise, mais les deux à la fois. En termes plus pratiques, cela a affecté la culture traditionnelle des Palaos de nombreuses manières ; les lignées claniques étaient divisées en deux groupes, les villages étaient géographiquement divisés en deux parties, et les interactions politiques étaient également basées sur ce principe."
 KWARAAE_WARRIOR_GHOSTS_GLOSS:"Les Kwaraʼae, le plus grand groupe indigène de l'île de Malaita dans les îles Salomon, avaient traditionnellement une grande vénération pour les esprits. Ceux qui suivaient les règles appropriées de « vivre pour les esprits » pouvaient les prier pour obtenir leur soutien. Les guerriers pouvaient même invoquer des esprits guerriers (#italic akalo ramo'a#!), également connus sous le nom d'esprits de guerre (#italic akalo ni mae#!), qui furent autrefois de célèbres guerriers, pour les soutenir dans leurs querelles et conflits contre des communautés ou clans rivaux. On croyait que lors de l'utilisation de ces pouvoirs, les hommes devaient éviter la présence des femmes, qui pouvaient neutraliser de tels pouvoirs."
 SASI_GLOSS: "Dans certaines parties de l'est de l'Indonésie et de la Papouasie, il existe une coutume traditionnelle de conservation des ressources souvent connue sous le nom de #bold Sasi#! (bien qu'elle soit connue sous divers noms dans différentes langues, le terme Sasi, qui provient des îles Maluku, est souvent utilisé par commodité). Une certaine zone ou un type de ressource est « fermée » pendant une période de temps, comme un an, et pendant ce temps, il est interdit de récolter les ressources concernées par l'interdiction. Par exemple, si une zone de littoral est fermée, la pêche est interdite ; ou, il peut être interdit de cueillir certaines plantes. Défier le Sasi entraînerait de graves conséquences, car on croyait que cela mettait en colère les esprits ou les ancêtres. Le Sasi serait ensuite rouvert lors d'une cérémonie après l'expiration du délai."
 MEGAPODE_GLOSS:"#bold Les mégapodes#! sont plusieurs espèces d'oiseaux apparentés qui ressemblent à des poules sauvages et sont originaires du Pacifique occidental, d'Australie, de Nouvelle-Guinée, d'Indonésie orientale, ainsi que des îles Andaman et Nicobar. Ils ont pour habitude d'incuber leurs œufs dans de petites zones de nidification concentrées. Pour plusieurs groupes indigènes de la région, les œufs de ces oiseaux constituent une source majeure de nourriture, et sont souvent offerts en signe de loyauté, d'amitié et de respect. Traditionnellement, des conventions rituelles dans ces régions restreignent la récolte de ces œufs."
 YAP_STONE_MONEY_GLOSS:"Encore au XXe siècle, les Yapais voyageaient loin jusqu'à l'île de Palau pour acquérir du calcaire taillé en forme de disque avec un trou au centre. En raison de la grande taille de ces #bold pierres rai#!, qui pouvaient mesurer de quelques pouces à plusieurs pieds de large, le voyage de retour pouvait être périlleux, et certains y perdaient la vie. Les pierres servaient de monnaie, et leur valeur ne provenait pas seulement de leur taille ou de leur forme, mais aussi de l'histoire orale attachée à la pierre, comme qui l'avait possédée par le passé, ou combien de personnes étaient mortes en essayant de la ramener à Yap. De telles histoires se transmettaient de génération en génération et confirmaient sa valeur, de sorte qu'il était difficile de voler la pierre puisque tout le monde connaissait le propriétaire de chaque pierre."
 POLYNESIA_HISTORY_GLOSS:"Durant la période médiévale, les communautés polynésiennes avaient étendu leur influence à travers le Pacifique, jusque dans la Mélanésie et la Micronésie, par exemple, bien que cela ne soit pas représenté dans les frontières actuelles de la carte. Certaines entités politiques polynésiennes, comme les Samoa et les Tonga, ont atteint un grand pouvoir politique sur de vastes étendues du Pacifique, notamment sur des royaumes non polynésiens comme les Fidji."
 SOUTH_AMERICA_HISTORY_GLOSS:"Un nombre croissant de preuves démontre que les Polynésiens et certains peuples autochtones d'Amérique du Sud sont probablement entrés en contact à un moment donné de la période médiévale, bien que la nature de ce contact reste incertaine et qu'il n'existe pas de « preuve irréfutable » comme L'Anse aux Meadows l'a été pour le Vinland norrois (du moins pas encore). L'une des pistes les plus prometteuses est une preuve ADN indiquant un contact entre des populations polynésiennes et un groupe amérindien étroitement apparenté aux Zenú actuels de Colombie, aux alentours de 1200 de notre ère."