l_french:

 ELECT_GLOSS: "Les #bold Élus#! étaient des membres de l'Église manichéenne qui exerçaient la fonction de clergé, ayant prononcé des vœux stricts pour éviter les actes pécheurs et consacrer leur vie à la libération de la Lumière par la prière, le rituel et d'autres actions religieuses. Ils n'avaient pas le droit de récolter ou de préparer leur propre nourriture, et ne pouvaient prendre qu'un seul repas par jour ; ce repas constituait une cérémonie importante où, par l'acte de consommer des mets végétariens, ils pouvaient libérer la Lumière du monde obscur de la Matière. Bien que le manichéisme n'ait probablement pas eu de tradition monastique à l'origine, les membres manichéens des Élus dans les régions orientales comme l'Asie centrale et la Chine ont vraisemblablement adopté un mode de vie monastique sous l'influence du bouddhisme."
 HEARER_GLOSS: "Les #bold Auditeurs#! étaient les membres laïcs de l'Église manichéenne. Bien qu'ils n'aient pas à suivre les vœux stricts des Élus, le clergé manichéen, ils avaient tout de même leur propre ensemble de vœux à respecter pour éviter le péché. Ils devaient également observer divers jours de jeûne et participer à une cérémonie hebdomadaire pour confesser leurs péchés. De plus, ils étaient encouragés à accomplir un « service de l'âme » en soutenant les Élus par des aumônes et d'autres formes de dons."
 ZINDIQ_GLOSS: "Bien qu'utilisé plus tard pour désigner les hérétiques en général, les musulmans médiévaux employaient à l'origine le terme #bold Zindiq#! pour désigner les adeptes de la religion manichéenne."
 DINAVARIYA_GLOSS: "Le #bold dinavariya#! était un terme persan, dérivé du mot moyen-perse « denawar », initialement utilisé par les manichéens pour désigner les Élus, membres du clergé manichéen. Au fil du temps, cependant, les manichéens du monde iranien et d'Asie centrale ont commencé à utiliser ce mot pour s'auto-désigner, par opposition à leurs frères manichéens occidentaux. Il y eut même un schisme au sein de l'Église manichéenne aux VIe ou VIIe siècles, où les schismatiques de Transoxiane, appelés dinavariya, contestèrent l'autorité du leadership religieux manichéen à Babylone et critiquèrent les manichéens occidentaux pour leur laxisme religieux. Il serait toutefois incorrect de supposer que la dinavariya elle-même était une véritable hérésie, car le terme est probablement antérieur au schisme et a continué à être utilisé pendant de nombreux siècles encore.."
 MANICHEAN_PARINIRVANA_GLOSS: "Dans le manichéisme, le #bold Parinirvana#! a une signification différente de celle du bouddhisme, dont le terme est issu, en raison de la propension des manichéens à assimiler le vocabulaire d'autres religions pour diffuser leurs enseignements. Le parinirvana bouddhiste désigne le trépas final d'un Bouddha ou d'un autre être ayant atteint le nirvana, au terme duquel leur existence physique prend fin et ils se libèrent du cycle des naissances et des renaissances. Le parinirvana manichéen, quant à lui, désigne la mort et le martyre du prophète Mani, qui est également comparé à la Passion de Jésus."
