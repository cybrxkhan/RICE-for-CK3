 VIRAGO_GLOSS:"#bold Virago#! est un terme latin historiquement utilisé en Europe pour désigner une femme possédant des vertus masculines. Bien qu'il impliquait une transgression des normes culturelles de genre, il était historiquement appliqué aux femmes qui agissaient héroïquement et s'élevaient au-dessus de leur condition, comme celles qui combattaient bravement à la guerre (comme Jeanne d'Arc), ou une sainte femme renommée pour sa pratique religieuse et sa dévotion exemplaires. Cependant, il pouvait aussi avoir une connotation péjorative, pour désigner une femme autoritaire, par exemple ; de nos jours, le terme tend à être utilisé dans ce dernier sens."