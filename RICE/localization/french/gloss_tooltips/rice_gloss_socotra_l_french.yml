 SEVEN_SEAS_GLOSS: "Bien que populairement associées aux pirates stéréotypés de l'Âge d'Or de la Piraterie, les #bold Sept Mers#! en tant que terme figuratif désignant l'ensemble des océans du monde remontent à l'Antiquité. Durant les périodes antique et médiévale, la liste des « Sept Mers » variait selon l'interlocuteur. La littérature arabe médiévale, par exemple, définissait les Sept Mers comme le golfe Persique, la mer d'Arabie, le golfe du Bengale, le détroit de Malacca, le détroit de Singapour, le golfe de Thaïlande et la mer de Chine méridionale."
 ERYTHRAEAN_SEA_GLOSS:"Les Grecs anciens utilisaient le terme #Bold mer Érythrée#! pour décrire les eaux du golfe d'Aden (entre le Yémen et la Corne de l'Afrique), et parfois même au-delà, incluant la mer Rouge, le golfe Persique, la mer d'Arabie et des parties de l'océan Indien."