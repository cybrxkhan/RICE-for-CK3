l_french:

 LI_GLOSS: "#bold Lǐ#!, également connu sous le nom de mille chinois, est l'unité de distance traditionnelle en Chine qui aurait été instituée par l'Empereur Jaune, un souverain mythique de la civilisation chinoise ancienne. Bien qu'il ait varié au fil du temps, un #italic lǐ#! correspond approximativement à un tiers d'un mille anglais, soit un demi-kilomètre."
 JATAKA_GLOSS: "Les #bold Jataka#! sont un ensemble de contes bouddhistes originaires d'Inde qui relatent diverses histoires, principalement liées aux vies antérieures du Bouddha, où il pouvait être aussi bien un dieu puissant ou un roi qu'un humble animal comme un singe ou un insecte. Dans ces histoires, le précédent soi du Bouddha résout les problèmes auxquels font face les personnages pour apporter une fin heureuse, transmettant une sorte de leçon morale ou de fable liée à la doctrine bouddhiste, en particulier en ce qui concerne le karma, le cycle de la souffrance et la renaissance. Les histoires des jataka ont été des sujets populaires d'art et d'autres littératures à travers les siècles dans les sociétés bouddhistes."