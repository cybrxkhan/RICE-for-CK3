l_french:

 SEA_NOMADS_GLOSS:"#bold Nomade de la mer#! est un terme appliqué à divers groupes ethniques dans certaines parties de l'Asie du Sud-Est maritime, qui ont traditionnellement, à des degrés divers, vécu et voyagé sur des bateaux et dont les moyens de subsistance dépendent grandement de la mer. Ceux-ci incluent les Orang Laut de Malaisie et de Sumatra, les Moken à la frontière de la Thaïlande et de la Malaisie, et les peuples Sama-Bajau de l'est de l'Indonésie et du sud des Philippines. Tous ces peuples ne sont pas entièrement nomades ou basés en mer; certains vivent simplement près de la côte et en dépendent grandement. Quoi qu'il en soit, historiquement, ces peuples entretenaient des relations étroites avec les royaumes de la région; leurs compétences étaient très recherchées, si bien qu'ils servaient souvent comme mercenaires, pirates, marchands et guides de voyage."
 GUNIG_GLOSS:"Dans les croyances traditionnelles des peuples Senoi, une sous-catégorie des #italic Orang Asli#!, un terme collectif désignant les indigènes de la Malaisie péninsulaire, les #bold gunigs#! sont des esprits familiers qui aident les gens de diverses manières. Souvent, ils trouvent un #italic halaaq#! (également orthographié #italic halaa#! ou #italic halaa'#!), un spécialiste rituel quelque peu analogue à un chamane, auquel ils s'attachent à la suite d'un rêve. À travers cette relation, souvent perçue comme assez intime, le #italic gunig#! peut être invoqué pour protéger ou guérir les gens, donner des conseils et assister dans la vie quotidienne."
 BAH_MALAYSIA_GLOSS:"Parmi les locuteurs asliens de Malaisie, #bold Bah#! est généralement un titre d'adresse réservé aux hommes, souvent aux jeunes hommes. Du moins à l'époque moderne, il peut avoir une connotation légèrement péjorative, les jeunes hommes étant perçus comme irresponsables et manquant de maîtrise de soi."
 ORANG_ASLI_GLOSS:"#bold Orang Asli#! est un terme moderne donné aux 18 groupes ethniques indigènes de la péninsule malaise. Ces 18 groupes ethniques sont souvent subdivisés en trois sous-groupes :\n\n$BULLET_WITH_TAB$#bold Senoi :#! Principalement des agriculteurs sur brûlis et le plus grand des trois sous-groupes\n$BULLET_WITH_TAB$#bold Semang :#! Des nomades qui sont des \"Négritos\" (un terme utilisé pour désigner divers groupes ethniques en Asie du Sud-Est qui ressemblent superficiellement aux Africains)\n$BULLET_WITH_TAB$#bold Proto-Malais :#! Des agriculteurs sédentaires considérés comme similaires aux Malais proprement dits et qui pourraient descendre de vagues antérieures de migrants de langue austronésienne\n\nBien que ces regroupements et celui des Orang Asli en général soient nébuleux et posent certains problèmes, ces groupes partagent un certain nombre de traits, comme, de manière célèbre, une vision du monde pacifiste."
 AUSTROASIATIC_GLOSS:"Les langues #bold austroasiatiques#! constituent l'une des grandes familles linguistiques du monde. Elles sont parlées dans une grande partie de l'Asie du Sud-Est continentale, ainsi que dans certaines régions de Chine et d'Asie du Sud, et étaient historiquement probablement plus dominantes dans la région avant l'arrivée de vagues ultérieures de locuteurs austronésiens et taï. La plus grande langue austroasiatique, avec bien plus de locuteurs que toutes les autres langues austroasiatiques réunies, est le vietnamien, avec plus de 86 millions de locuteurs natifs en 2023. Parmi les autres grandes langues austroasiatiques dotées d'une tradition écrite étendue et d'archives historiques figurent le khmer (avec 19 millions de locuteurs natifs) et le môn (avec 1,1 million de locuteurs natifs). Le reste des langues austroasiatiques est parlé par divers groupes minoritaires de la région."
 GARUDA_GLOSS:"#bold Les Garudas#! sont des créatures mythiques souvent représentées comme des hommes à tête d'aigle, présentes dans les mythologies hindoue, bouddhiste et jaïne, ainsi que dans les mythologies des cultures influencées par ces religions."
 SLAMAD_GLOSS:"#bold Slamad#!, ou #bold Slamaad#!, est une valeur culturelle centrale parmi certains des peuples indigènes Senoi de la péninsule malaisienne. Le terme se traduit approximativement par paix, contentement et sécurité publique, et le fait d'agir de manière à ne pas frustrer ou contrecarrer les désirs d'autres personnes ou êtres (tels que les esprits)."
 ADE_GLOSS:"#bold "Ade"#! est un terme générique désignant un ensemble de lois non écrites qui régissent tous les aspects de la vie des différents peuples d'Asie du Sud-Est. Chaque culture a son propre nom pour ces modes de vie traditionnels. Cela va de coutumes détaillées comme la direction dans laquelle se tourner en versant une boisson, l'ordre de marche et de placement assis selon l'âge et le sexe, et le type de barbe que l'on est autorisé à porter, à des valeurs plus larges telles que le respect des aînés, le courage et une honnêteté sans faille. Enfreindre ce code entraîne l'ostracisme du contrevenant, ainsi que de quiconque maintient des liens avec lui. Bien qu'il soit souvent associé aux religions populaires traditionnelles, les gens ont continué à le suivre comme un code séculier même après leur conversion aux religions abrahamiques, où il est considéré comme un guide complémentaire sur la manière d'accéder au paradis."
 