 YAKHCHAL_GLOSS: "Les #bold Yakhchals#!, signifiant #italic fosse à glace#!, sont des bâtiments traditionnellement utilisés pour stocker la glace et la neige en [GetGeographicalRegion('world_middle_east_persia').GetName]. Bien que les Yakhchals les plus simples fussent des fosses de stockage creusées dans le sol, des variations plus complexes prenaient la forme de structures en dôme construites hors sol. Ils étaient conçus pour tirer parti de la physique du refroidissement évaporatif et du refroidissement radiatif afin de maintenir une basse température. Les Yakhchals étaient fréquemment utilisés par les Iraniens de toutes classes sociales, particulièrement dans les climats plus arides, jusque bien avant dans le XXe siècle, pour fournir des aliments et des boissons rafraîchis, tels que des sorbets et du vin frais. Par exemple, un voyageur allemand du XIXe siècle, Ernst Hoeltzer, mentionna comment même les pauvres utilisaient le Yakhchal pour stocker de l'eau, et les gens pouvaient acheter de la glace au bazar ou directement à un Yakhchal."