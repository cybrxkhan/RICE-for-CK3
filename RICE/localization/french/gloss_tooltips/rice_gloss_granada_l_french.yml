l_french:

 ATARAZANA_GLOSS:"#bold Atarazana#! est le terme ibérique désignant un chantier naval ou un arsenal maritime, emprunté à l'arabe. Durant la période médiévale, la réalité de l'instabilité politique et des opportunités économiques encouragea musulmans et chrétiens à subventionner l'industrie de la construction navale ici, ouvrant la voie à la future domination navale de l'Ibérie au début de l'ère moderne."
