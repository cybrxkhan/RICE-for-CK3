 # Struggle
 RICE_sri_lanka_struggle:0 "Sangha du Sri Lanka"
 RICE_sri_lanka_struggle_desc:0 "Mes goûts sont très singuliers. Vous ne comprendriez pas.\n\nMes goûts sont très singuliers. Vous ne comprendriez pas."
# struggle_RICE_sri_lanka_phase_reform:0 "Reform"
# struggle_RICE_sri_lanka_phase_reform_desc:0 "With the once-fractured [RICE_sangha_of_sri_lanka|El] now tentatively under one sect, it is up to the [RICE_sri_lanka_monasteries|El], with the assistance of secular leaders and laypeople, to reform themselves and determine the future trajectory of not only the Buddhist [RICE_sri_lanka_sangha|El] in Sri Lanka, but elsewhere across the world.\n\nHowever, there is still much work to be done. If [RICE_sri_lanka_s_sangha|El] is unable to complete the reformation process during this time, then a new $struggle_RICE_sri_lanka_phase_reform$ will begin, and there is no guarantee it will be under the same sect, either!"
 struggle_RICE_sri_lanka_phase_degeneration:0 "Dégénérescence"
 struggle_RICE_sri_lanka_phase_degeneration_desc:0 "Les enseignements du Bouddha - et la [RICE_sri_lanka_sangha|El] elle-même - sont en déclin au Sri Lanka. Peut-être que les tentatives de purger les [RICE_sri_lanka_monasteries|El] des monastiques immoraux et indisciplinés durant la [struggle_phase_sri_lanka_purification|El] ont échoué. Ou peut-être que la richesse et l'influence des [RICE_sri_lanka_monasteries|El] durant la [struggle_phase_sri_lanka_accumulation|El] ont attiré des raids militaires de la part de païens étrangers rapaces, ou la confiscation par des élites locales cupides et sans scrupules.\n\nCependant, comme le Bouddha l'a enseigné, les bonnes #italic et#! les mauvaises choses sont impermanentes. Des ténèbres de l'ère dégénérée, un avenir plus radieux pourrait éclore lors d'une [struggle_phase_sri_lanka_purification|El], alors que des monastiques vertueux, des érudits et des dirigeants purifient la [RICE_sri_lanka_sangha|El] de la corruption et des malfaiteurs. Alternativement, les élites locales pourraient rassembler suffisamment de ressources pour faire revivre les [RICE_sri_lanka_monasteries|El] lors de la [struggle_phase_sri_lanka_accumulation|El], inaugurant une nouvelle ère de prospérité sur l'île."
 struggle_RICE_sri_lanka_phase_accumulation:0 "Accumulation"
 struggle_RICE_sri_lanka_phase_accumulation_desc:0 "La [RICE_sri_lanka_struggle|El] accumule pouvoir et influence, grâce au soutien des élites comme des gens du commun, qui en retour accumulent de bons mérites. Peut-être que la [struggle_phase_sri_lanka_purification|El] a engendré un plus grand respect envers les [RICE_sri_lanka_monasteries|El] de la part des laïcs, ou peut-être que les conflits et le chaos de la [struggle_phase_sri_lanka_degeneration|El] ont encouragé les laïcs à soutenir les [RICE_sri_lanka_monasteries|El].\n\nLa croissance des [RICE_sri_lanka_monasteries|El], cependant, est une arme à double tranchant. Les monastiques pourraient devenir complaisants et paresseux, nécessitant une [struggle_phase_sri_lanka_purification|El] pour débarrasser le [RICE_sri_lanka_sangha|El] des idées hérétiques et de l'immoralité. Pire encore, l'île pourrait attirer des scélérats avides, aussi bien des païens étrangers que des dirigeants locaux, qui cherchent à piller les [RICE_sri_lanka_monasteries|El] et à détruire la [RICE_sri_lanka_sangha|El], et les monastiques sont trop corrompus pour inspirer le peuple, menant à la [struggle_phase_sri_lanka_degeneration|El]."
 struggle_RICE_sri_lanka_phase_purification:0 "Purification"
 struggle_RICE_sri_lanka_phase_purification_desc:0 "Que ce soit en raison d'un manque croissant de discipline et de morale à la suite d'une [struggle_phase_sri_lanka_accumulation|El], ou en raison de menaces extérieures et d'une détérioration interne durant une [struggle_phase_sri_lanka_degeneration|El], la [RICE_sri_lanka_struggle|El] n'est plus ce qu'elle était. C'est le temps de restaurer la [RICE_sri_lanka_sangha|El], et d'éliminer les éléments hérétiques et immoraux de ses anciens [RICE_sri_lanka_monasteries|El].\n\nSi ce processus se déroule bien, alors [RICE_sri_lanka_s_sangha|El] prospérera dans une [struggle_phase_sri_lanka_accumulation|El]. Si le processus échoue, cependant, le Sangha se détériorera probablement encore davantage, déclenchant la [struggle_phase_sri_lanka_degeneration|El]."

