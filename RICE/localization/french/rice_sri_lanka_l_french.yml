 activity_RICE_sri_lanka_relic_veneration_host_an_a:0 "une"
 activity_RICE_sri_lanka_relic_veneration:0 "Vénération des reliques du $k_lanka$"
 activity_RICE_sri_lanka_relic_veneration_desc:0 "En tant que terre sacrée du Dharma, le [GetGeographicalRegion('RICE_sri_lanka_alt_region').GetName] abrite un certain nombre de reliques bouddhistes importantes. Des cérémonies religieuses spéciales sont organisées pour honorer ces reliques, auxquelles je peux participer."
 activity_RICE_sri_lanka_relic_veneration_selection_tooltip:"Vénérez l'une des reliques bouddhistes conservées dans les grands [RICE_sri_lanka_monasteries|El] de [GetGeographicalRegion('RICE_sri_lanka_alt_region').GetName].\n\n$activity_RICE_sri_lanka_relic_veneration_context_tooltip$"
 activity_RICE_sri_lanka_relic_veneration_context_tooltip:"#emphasis Contexte historique :#! Le Sri Lanka abrite un certain nombre de reliques bouddhistes, dont la plus importante est la relique de la dent du Bouddha ; la contrôler était même considéré comme une sorte de droit divin pour les rois de l'île. De nos jours, la procession de la relique de la dent est sans doute le rituel et la célébration les plus célèbres du Sri Lanka, mais sa forme actuelle est en fait relativement récente, ayant subi de nombreuses modifications au cours des siècles. Ironiquement, à l'époque du jeu, la dent a d'abord été dédaignée par le Mahavihara qui est devenu le monastère dominant du Sri Lanka, car elle était fortement associée à leurs rivaux, les Abhayagiri, et le Mahavihara concentrait sa vénération sur d'autres reliques, en particulier l'arbre de la Bodhi à Anuradhapura."
 activity_RICE_sri_lanka_relic_veneration_host_desc:"\n$BULLET_WITH_TAB$Perte de [stress_loss_i|El] [stress|El]\n$BULLET_WITH_TAB$Gain de [piety_i|El] [piety|El]\n$BULLET_WITH_TAB$Gain de [prestige_i|El] [prestige|El]\n$BULLET_WITH_TAB$Gain de divers [character_modifiers|El] selon la relique\n$BULLET_WITH_TAB$Augmentation de la [RICE_sri_lanka_prominence|El] pour les [RICE_sri_lanka_monasteries|El] de l'île, en particulier ceux dont vous êtes le patron"
 activity_RICE_sri_lanka_relic_veneration_guest_desc: "$activity_RICE_sri_lanka_relic_veneration_host_desc$"
 RICE_sri_lanka_relic_veneration_bodhi_shrine_province:"Le [GetModifier('RICE_sri_lanka_relic_bodhi_shrine_modifier').GetNameWithTooltip] se trouve actuellement ici."
 RICE_sri_lanka_relic_veneration_tooth_shrine_province:"Le [GetModifier('RICE_sri_lanka_relic_tooth_shrine_modifier').GetNameWithTooltip] se trouve actuellement ici."
 RICE_sri_lanka_relic_veneration_dharmadhatu_shrine_province:"Le [GetModifier('RICE_sri_lanka_relic_dharmadhatu_shrine_modifier').GetNameWithTooltip] se trouve actuellement ici."
 activity_RICE_sri_lanka_relic_veneration_province_desc:"[GetGeographicalRegion('RICE_sri_lanka_alt_region').GetName] possède plusieurs sites sacrés abritant un certain nombre de reliques considérées comme sacrées par les bouddhistes."
 activity_RICE_sri_lanka_relic_veneration_destination_selection: ""
 activity_RICE_sri_lanka_relic_veneration_guest_help_text: "$activity_RICE_sri_lanka_relic_veneration$"
 activity_RICE_sri_lanka_relic_veneration_predicted_cost:"Le coût de la vénération des reliques en $k_lanka$ dépend des [activity_options|El] que vous sélectionnez."
 activity_RICE_sri_lanka_relic_veneration_conclusion_desc:"Notre cérémonie de [GetActivityType( 'activity_RICE_sri_lanka_relic_veneration' ).GetName] est terminée. Par cet acte méritoire, nous pouvons nous rappeler les enseignements du Bouddha, et nous efforcer de les suivre et de les comprendre du mieux que nous le pouvons."
 RICE_sri_lanka_relic_veneration_type: "Relique"
 RICE_sri_lanka_relic_veneration_type_tooth:"Dent de Bouddha"
 RICE_sri_lanka_relic_veneration_type_tooth_desc:"$EFFECT_LIST_BULLET$ [RICE_sri_lanka_prominence|E] accrue pour le [RICE_sri_lanka_monastery|El] [abhayagiri_i|El] [abhayagiri|E], surtout si vous êtes leur patron\n$EFFECT_LIST_BULLET$ [RICE_sri_lanka_prominence|E] diminuée pour les [RICE_sri_lanka_monasteries|El] [mahavihara_i|El] [mahavihara|E] et [jetavana_i|El] [jetavana|E]\n$EFFECT_LIST_BULLET$Gain du [modifier|El] [GetModifier('RICE_sri_lanka_relic_tooth_modifier').GetNameWithTooltip] si vous n'êtes pas un patron d'[abhayagiri|E]\n$EFFECT_LIST_BULLET$Gain du [modifier|El] [GetModifier('RICE_sri_lanka_relic_tooth_great_modifier').GetNameWithTooltip] si vous êtes un patron d'[abhayagiri|E], ou si la relique de la Dent a été enchâssée au [GetModifier('RICE_sri_lanka_relic_tooth_shrine_modifier').GetNameWithTooltip] après que la [RICE_sri_lanka_struggle|El] ait été unifiée\n\n#weak Après que le Seigneur Bouddha fut décédé et que son corps fut incinéré, sa canine gauche fut découverte dans les cendres par l'une de ses principales disciples féminines, Khema. Lorsque la guerre menaça les terres où elle était originellement conservée, des moines l'apportèrent au $k_lanka$.#!"
 RICE_sri_lanka_relic_veneration_type_bodhi:"Arbre sacré de la Bodhi"
 RICE_sri_lanka_relic_veneration_type_bodhi_desc:"$EFFECT_LIST_BULLET$ [RICE_sri_lanka_prominence|E] accrue pour le [RICE_sri_lanka_monastery|El] [mahavihara_i|El] [mahavihara|E], surtout si vous êtes leur patron\n$EFFECT_LIST_BULLET$ [RICE_sri_lanka_prominence|E] diminuée pour les [RICE_sri_lanka_monasteries|El] [abhayagiri_i|El] [abhayagiri|E] et [jetavana_i|El] [jetavana|E]\n$EFFECT_LIST_BULLET$Gain du [modifier|El] [GetModifier('RICE_sri_lanka_relic_bodhi_modifier').GetNameWithTooltip] si vous n'êtes pas un patron du [mahavihara|E]\n$EFFECT_LIST_BULLET$Gain du [modifier|El] [GetModifier('RICE_sri_lanka_relic_bodhi_great_modifier').GetNameWithTooltip] si vous êtes un patron du [mahavihara|E], ou si la relique du Bodhi a été enchâssée au [GetModifier('RICE_sri_lanka_relic_bodhi_shrine_modifier').GetNameWithTooltip] après que la [RICE_sri_lanka_struggle|El] a été unifiée\n\n#weak Lorsque la fille de l'empereur Ashoka, la grande nonne Sanghamitta, vint à $k_lanka$, elle apporta avec elle un morceau du Bodhi sacré de Magadha, le même arbre sous lequel le Seigneur Bouddha atteignit l'illumination.#!"
 RICE_sri_lanka_relic_veneration_type_dharmadhatu: "Dharmadhatu"
 RICE_sri_lanka_relic_veneration_type_dharmadhatu_desc:"$EFFECT_LIST_BULLET$ [RICE_sri_lanka_prominence|E] accrue pour le [RICE_sri_lanka_monastery|El] [jetavana_i|El] [jetavana|E], surtout si vous êtes leur patron\n$EFFECT_LIST_BULLET$ [RICE_sri_lanka_prominence|E] diminuée pour les [RICE_sri_lanka_monasteries|El] [mahavihara_i|El] [mahavihara|E] et [abhayagiri_i|El] [abhayagiri|E]\n$EFFECT_LIST_BULLET$Gain du [modifier|El] [GetModifier('RICE_sri_lanka_relic_dharmadhatu_modifier').GetNameWithTooltip] si vous n'êtes pas un patron du [jetavana|E]\n$EFFECT_LIST_BULLET$Gain du [modifier|El] [GetModifier('RICE_sri_lanka_relic_dharmadhatu_great_modifier').GetNameWithTooltip] si vous êtes un patron du [jetavana|E], ou si la relique du Dharmadhatu a été enchâssée au [GetModifier('RICE_sri_lanka_relic_dharmadhatu_shrine_modifier').GetNameWithTooltip] après que la [RICE_sri_lanka_struggle|El] a été unifiée\n\n#weak Le Dharmadhatu, une copie d'écritures sacrées et de commentaires religieux, a été offert au roi de l'époque de $k_lanka$ par un marchand dévot. Sa renommée a depuis grandi en tant que relique d'une grande puissance spirituelle.#!"
 RICE_sri_lanka_relic_veneration_veneration_phase: "Vénération"
 RICE_sri_lanka_relic_veneration_veneration_phase_desc: "Ces reliques doivent être vénérées correctement si nous voulons obtenir de grands mérites."
 RICE_sri_lanka_relic_veneration_worship_intent_header: "Adoration :"
 RICE_sri_lanka_relic_veneration_worship_intent: "Adoration"
 RICE_sri_lanka_relic_veneration_worship_intent_desc: "Vous vous concentrerez sur l'aspect religieux de ces cérémonies, en faisant de votre mieux pour vénérer sincèrement les reliques."
 RICE_sri_lanka_relic_veneration_completed_log_title:0 "Vénération de reliques achevée"
 RICE_sri_lanka_relic_veneration_completed_log:0 "[CHARACTER.GetShortUIName|U] a achevé sa vénération de relique au $k_lanka$."
 RICE_sri_lanka_relic_veneration_monastery_prominence_log_title:0 "Changements dans l'importance des monastères"
 RICE_sri_lanka_relic_veneration_monastery_prominence_log:0 "Parce que [CHARACTER.GetShortUIName|U] est un[CHARACTER.Custom('FR_E')] dirigeant[CHARACTER.Custom('FR_E')] important[CHARACTER.Custom('FR_E')], sa participation à ces cérémonies religieuses a affecté la [RICE_sri_lanka_prominence|El] d'un ou plusieurs [RICE_sri_lanka_monasteries|El]."
