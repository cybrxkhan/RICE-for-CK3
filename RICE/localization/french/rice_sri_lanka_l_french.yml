 game_concept_RICE_sri_lanka_struggle:1 "Sangha du Sri Lanka"
 game_concept_RICE_sri_lanka_struggle_desc:2 "La $game_concept_RICE_sri_lanka_struggle$ est une [struggle|El] qui affecte la [region|El] du [GetGeographicalRegion('RICE_sri_lanka_struggle_region').GetName]. Elle dépeint l'histoire parfois tumultueuse de la #bold Sangha#! - c'est-à-dire la communauté bouddhiste - sur l'île aujourd'hui connue sous son nom moderne de Sri Lanka, mais historiquement appelée Tambapanni durant la période couverte par le jeu.\n\nPendant des siècles, des sectes monastiques - en particulier trois appelées le [mahavihara_i|El][mahavihara|E], l'[abhayagiri_i|El][abhayagiri|E], et le [jetavana_i|El][jetavana|E] - se sont disputé la [RICE_sri_lanka_prominence|El] spirituelle et temporelle non seulement à Tambapanni, mais dans une grande partie de l'Asie du Sud et du Sud-Est. La [struggle|El] alterne entre des périodes d'[struggle_phase_sri_lanka_accumulation_simple|El] monastique d'influence et de richesse, de [struggle_phase_sri_lanka_purification_simple|El] des éléments déviants dans les institutions bouddhistes de l'île, et de [struggle_phase_sri_lanka_degeneration_simple|El] spirituelle et de déclin.\n\nLes [rulers|El] qui sont [struggle_involved|El] ou [struggle_interloper|El] dans cette [struggle|El], et même certains autres bouddhistes dans les régions voisines, ont accès à diverses [decisions|El] et autres mécaniques qui leur permettent d'augmenter ou de diminuer la [RICE_sri_lanka_prominence|El] des trois monastères, qui se reflète dans des valeurs globales allant de #V 0#! à #V 1000#!. Atteindre un niveau suffisamment élevé (ou suffisamment bas) est nécessaire pour mettre fin à la [struggle|El]."
