 RICE_sri_lanka_persecute_monastery_ransack_monasteries_option_tooltip:0 "$EFFECT_LIST_BULLET$Gain d'un montant aléatoire entre [gold_i|El] #V #Bold [GetPlayer.MakeScope.ScriptValue('RICE_sri_lanka_monumental_persecute_gold_gain_min')|0]#!#! et [gold_i|El] #V #Bold [GetPlayer.MakeScope.ScriptValue('RICE_sri_lanka_monumental_persecute_gold_gain_max')|0]#!#!\n$EFFECT_LIST_BULLET$Perte de [prestige_i|El] #V 500#!\n$EFFECT_LIST_BULLET$Gain d'un [modifier|El] qui augmente la [dread|El], réduit les [opinions|El] des bouddhistes, et soit diminue le [prestige_i|El] [prestige|El], diminue la [piety_i|El] [piety|El], ou augmente la [piety_i|El] [piety|El] selon que vous êtes bouddhiste ou non et la [struggle_phase|El] actuelle dans laquelle se trouve la [RICE_sri_lanka_struggle|El]\n$EFFECT_LIST_BULLET$Tous les [RICE_sri_lanka_monasteries|El] sur l'île perdent #V [GetPlayer.MakeScope.ScriptValue('RICE_sri_lanka_prominence_loss_monumental')|0]#! de [RICE_sri_lanka_prominence|El], sauf si vous en patronnez un, qui perd #V [GetPlayer.MakeScope.ScriptValue('RICE_sri_lanka_prominence_loss_massive')|0]#! de [RICE_sri_lanka_prominence|El] à la place\n$EFFECT_LIST_BULLET$Chaque [county|El] que vous possédez dans [GetGeographicalRegion('RICE_sri_lanka_struggle_region').GetName] gagne [control_i|El]#P [GetPlayer.MakeScope.ScriptValue('RICE_sri_lanka_persecute_control_gain_monumental')|0]#! de [control|El] et perd [development_i|El]#N [GetPlayer.MakeScope.ScriptValue('RICE_sri_lanka_persecute_development_loss_monumental')|0]#! de progrès de [development|El]\n\n@warning_icon!#X Cette option n'est disponible que pour ceux qui ne suivent PAS une [faith|El] bouddhiste#!"
 RICE_india_irrigation_tank_decision:0 "Construction de réservoirs d'irrigation"
 RICE_india_irrigation_tank_decision_tooltip:0 "Parrainer la construction de réservoirs d'irrigation."
 RICE_india_irrigation_tank_decision_desc:0 "Il y a plusieurs siècles, les habitants de l'[GetGeographicalRegion('world_india').GetName] sont passés maîtres dans l'art de construire des réservoirs et d'autres systèmes hydrauliques pour récolter et conserver l'eau de pluie. Ces réservoirs d'irrigation sont souvent associés à des institutions religieuses locales, et parrainer la construction de certains d'entre eux me donnerait une bonne image."
 RICE_india_irrigation_tank_decision_confirm:0 "Préparons des travaux de construction !"
 RICE_india_irrigation_tank_decision_effect_tooltip_1:0 "Votre [county_capital|El] recevra un [county_modifier|El] d'une durée de 10 ans et vous recevrez un [character_modifier|El] correspondant ainsi que du [prestige_i|El] [prestige|El] et de la [piety_i|El] [piety|El]"
 RICE_india_irrigation_tank_decision_effect_tooltip_2:0 "La puissance de ces bonus dépend du financement fourni"
 RICE_india_irrigation_tank_decision_effect_tooltip_3:0 "Votre [culture|El] a une [tradition|El] qui réduit les coûts de construction des réservoirs d'irrigation"
 RICE_india_irrigation_tank_decision_effect_tooltip_4:0 "Votre [culture|El] possède une [tradition|El] qui augmente le [prestige|El] et la [piety|El] gagnés en construisant des réservoirs d'irrigation"
 RICE_india_irrigation_tank_decision_effect_tooltip_5:0 "La [RICE_sri_lanka_prominence|El] de tout [RICE_sri_lanka_monastery|El] [RICE_sri_lankan|El] dont vous êtes un patron augmentera ; le montant dépend de la taille du réservoir d'irrigation"
 RICE_india_irrigation_tank_decision_context_tooltip:0 "#emphasis Contexte historique :#! Les réservoirs d'irrigation sont des réservoirs artificiels (de taille variable) qui ont été construits historiquement dans une grande partie du Sri Lanka et de l'Inde. Ils étaient souvent constitués de plusieurs réservoirs, de canaux et de digues en terre, et étaient conçus pour récolter et conserver l'eau de pluie. Certains étaient des projets des communautés locales, tandis que d'autres étaient parrainés par des organisations religieuses, des nobles et des rois. Les célèbres puits à paliers de l'Inde occidentale et les wewas du Sri Lanka sont des exemples de systèmes hydrauliques liés à la technologie des réservoirs d'irrigation."
 RICE_sri_lanka_enshrine_relic:0 "Réenchâsser la [GetPlayer.Custom('RICE_sri_lanka_unified_sangha_relic')]"
 RICE_sri_lanka_enshrine_relic_tooltip:0 "Il est temps de déplacer la relique la plus sacrée de [GetGeographicalRegion('RICE_sri_lanka_alt_region').GetName] vers un nouvel emplacement"
 RICE_sri_lanka_enshrine_relic_desc:0 "Après que la [RICE_sri_lanka_struggle|El] a été unifiée sous le [GetPlayer.Custom('RICE_sri_lanka_unified_monastery')], la [GetPlayer.Custom('RICE_sri_lanka_unified_sangha_relic')] est devenue grandement vénérée en tant que relique [GetPlayer.GetFaith.GetReligion.GetAdjective] la plus importante du [GetGeographicalRegion('RICE_sri_lanka_alt_region').GetName]. Cependant, je crois qu'elle mérite un nouveau foyer, et je souhaite la déplacer vers un autre lieu."
