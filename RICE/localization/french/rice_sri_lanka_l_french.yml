 sri_lanka.0005.t:0 "Unifier la Sangha du [GetGeographicalRegion('RICE_sri_lanka_alt_region').GetNameNoTooltip]"
 sri_lanka.0005.desc.intro:0 "Pendant des siècles, le Sangha [buddhism.GetAdjective] ou communauté monastique du [GetGeographicalRegion('RICE_sri_lanka_alt_region').GetName] avait été divisé par la rivalité entre ses trois principaux monastères : le Mahavihara, l'Abhayagiri et le Jetavana.\n\nBien que les trois monastères partageaient de nombreuses croyances, comme l'adhésion au [GetFaithDoctrine('rice_theravada_canon_doctrine').GetBaseName], ils différaient également en matière de doctrine, de rituels et d'autres sujets. Les élites, bouddhistes et non bouddhistes, ajoutaient de l'huile sur le feu en favorisant une secte ou une autre, transformant la lutte en une affaire politique.\n\n"
 sri_lanka.0005.desc:0 "$sri_lanka.0005.desc.intro$Récemment, [sri_lanka_struggle_ender.GetTitledFirstName] a utilisé son autorité pour convoquer un concile religieux afin de régler cette question une fois pour toutes, et d'unir la Sangha de l'île sous le #bold [sri_lanka_struggle_ender.Custom('RICE_sri_lanka_patronized_monastery')]#!. Tous les monastiques doivent désormais adhérer aux doctrines et pratiques du [sri_lanka_struggle_ender.Custom('RICE_sri_lanka_patronized_monastery')], ou être fustigés comme hérétiques. La #bold [GetPlayer.Custom('RICE_sri_lanka_unified_sangha_relic')] #!a également été affirmée comme la relique par excellence de l'île, symbole de son unité retrouvée.\n\n"
 sri_lanka.0005.desc.buddhist:0 "[sri_lanka_struggle_ender.GetFirstNameNoTooltip] affirme qu'[sri_lanka_struggle_ender.GetSheHe] a utilisé son autorité en tant que puissant[sri_lanka_struggle_ender.Custom('FR_E')] [sri_lanka_struggle_ender.GetTitleAsNameNoTooltip] [sri_lanka_struggle_ender.GetFaith.GetAdherentName] pour réformer le Sangha, mais en vérité, le [sri_lanka_struggle_ender.Custom('RICE_sri_lanka_patronized_monastery')] avait gagné en importance ces dernières années, ce n'était donc qu'une question de temps."
 sri_lanka.0005.desc.non_buddhist:0 "[sri_lanka_struggle_ender.GetFirstNameNoTooltip], bien que n'étant pas un[sri_lanka_struggle_ender.Custom('FR_E')] [sri_lanka_struggle_ender.GetTitleAsNameNoTooltip] [sri_lanka_struggle_ender.GetFaith.GetAdherentName], voit l'intérêt de travailler avec l'influent [sri_lanka_struggle_ender.Custom('RICE_sri_lanka_patronized_monastery')] pour réformer le Sangha."
 sri_lanka.0005.desc.conclusion:0 "Tout le monde n'est pas satisfait de ces vastes changements, mais leurs effets se feront sentir dans les communautés [buddhism.GetAdjective]s du monde entier."
 sri_lanka.0005.a:0 "Une nouvelle ère s'ouvre pour le [buddhism.GetNameNoTooltip] dans cette région."
 sri_lanka.0006.t:0 "Un symbole de la Sangha"
 sri_lanka.0006.desc:0 "Après des siècles de désunion et de conflit au sein de la communauté [buddhism.GetAdjective] du [GetGeographicalRegion('RICE_sri_lanka_alt_region').GetName], les divers monastères de l'île ont accepté de se réunir sous mes auspices et ceux du monastère de [GetPlayer.Custom('RICE_sri_lanka_patronized_monastery')] que je patronne.\n\nNous avons maintenant besoin d'un symbole autour duquel le Sangha puisse se rassembler. Certains dans la communauté monastique ont affirmé que l'une des reliques religieuses les plus vénérées de l'île était destinée à devenir un tel symbole. Les rituels religieux entourant cette relique devraient être glorifiés, disent-ils, pour honorer le Bouddha, illustrer le Dharma et inspirer le Sangha nouvellement uni.\n\nLa question, maintenant, est de savoir quelle relique était véritablement destinée à remplir un tel rôle ?"
 sri_lanka.0006.a:0 "L'arbre de la Bodhi"
 sri_lanka.0006.a.tooltip:0 "Désormais, effectuer une [GetActivityType( 'activity_RICE_sri_lanka_relic_veneration' ).GetName] pour l'#bold Arbre de la Bodhi#! fournira toujours le [modifier|El] [GetModifier('RICE_sri_lanka_relic_bodhi_great_modifier').GetNameWithTooltip] le plus puissant."
 sri_lanka.0006.b:0 "La dent de Bouddha"
 sri_lanka.0006.b.tooltip:0 "Désormais, effectuer une [GetActivityType( 'activity_RICE_sri_lanka_relic_veneration' ).GetName] pour la #bold dent du Bouddha#! fournira toujours le [modifier|El] [GetModifier('RICE_sri_lanka_relic_tooth_great_modifier').GetNameWithTooltip] plus puissant."
 sri_lanka.0006.c:0 "Le Dharmadhatu"
 sri_lanka.0006.c.tooltip:0 "Désormais, effectuer une [GetActivityType( 'activity_RICE_sri_lanka_relic_veneration' ).GetName] pour le #bold Dharmadhatu#! fournira toujours le [modifier|El] [GetModifier('RICE_sri_lanka_relic_dharmadhatu_great_modifier').GetNameWithTooltip] le plus puissant."
 sri_lanka.0006.enshrine_decision_tooltip:0 "Une [decision|El] pour #V Ré-enchâsser#! la relique choisie est désormais disponible pour quiconque contrôle le [county|El] contenant le [modifier|El] de relique."
 sri_lanka.0007.t:0 "Destruction de la Sangha du [GetGeographicalRegion('RICE_sri_lanka_alt_region').GetNameNoTooltip]"
 sri_lanka.0007.desc:0 "$sri_lanka.0005.desc.intro$En fin de compte, aucun des trois monastères n'a pu rassembler assez de prestige pour devenir la secte suprême de l'île. [sri_lanka_struggle_ender.GetFirstName], un[sri_lanka_struggle_ender.Custom('FR_E')] puissant[sri_lanka_struggle_ender.Custom('FR_E')] [sri_lanka_struggle_ender.GetTitleAsNameNoTooltip] [sri_lanka_struggle_ender.GetFaith.GetAdherentName], a impitoyablement utilisé son pouvoir pour opprimer les monastères [buddhism.GetAdjective]s de l'île en pillant leurs temples et leurs halls, détruisant leurs précieux trésors et écritures, punissant les monastiques qui n'acceptent pas ses exigences, et bien plus encore.\n\nBeaucoup à travers le monde [buddhism.GetAdjectiveNoTooltip] condamnent [sri_lanka_struggle_ender.GetFirstNameNoTooltip] comme un dirigeant[sri_lanka_struggle_ender.Custom('FR_E')] d'une vilenie sans égale, mais en vérité, les conflits, l'orgueil et l'attachement égoïste des monastères ont mené à leur déclin au fil des années. [sri_lanka_struggle_ender.GetFirstNameNoTooltip] n'a fait qu'achever la tâche, et s'est assuré qu'ils ne deviendraient jamais une institution majeure dans la société et la politique de l'île."
 sri_lanka.0007.a:0 "Seul le temps dira si la communauté [buddhism.GetAdjectiveNoTooltip] peut s'adapter."
 sri_lanka.0008.t:0 "Le Sangha [sri_lanka_struggle_ender.GetFaith.GetAdjectiveNoTooltip] restauré"
 sri_lanka.0008.desc:0 "$sri_lanka.0005.desc.intro$Il a fallu les efforts d'un[sri_lanka_struggle_ender.Custom('FR_E')] [sri_lanka_struggle_ender.GetTitleAsNameNoTooltip] [sri_lanka_struggle_ender.GetFaith.GetAdherentName] du nom de [sri_lanka_struggle_ender.GetFirstName], cependant, pour faire en sorte que les enseignements du Bouddha puissent fleurir à nouveau - non pas au [GetGeographicalRegion('RICE_sri_lanka_alt_region').GetName], mais en [sri_lanka_struggle_ender.GetPrimaryTitle.GetName].\n\n[sri_lanka_struggle_ender.GetFirstNameNoTooltip] y est parvenu[sri_lanka_struggle_ender.Custom('FR_E')] grâce à une puissante alliance avec le monastère le plus éminent de l'île, le #bold [sri_lanka_struggle_ender.Custom('RICE_sri_lanka_patronized_monastery')]#!, qu'[sri_lanka_struggle_ender.GetSheHe] a abondamment patronné. Avec le Sangha ravivé, il est clair que le centre du [buddhism.GetNameNoTooltip] - du moins parmi ceux qui suivent le [GetFaithDoctrine('rice_theravada_canon_doctrine').GetBaseNameNoTooltip] - a ainsi été rétabli ailleurs : [sri_lanka_struggle_ender.GetPrimaryTitle.GetNameNoTooltip], désormais, est une nouvelle terre sainte pour le [buddhism.GetNameNoTooltip]."
 sri_lanka.0008.a:0 "$sri_lanka.0005.a$"
 sri_lanka.0009.t:0 "$RICE_historical_aspiration_fulfilled_title$"
 sri_lanka.0009.desc:0 "J'ai passé des années dans les montagnes sauvages et les jungles du [GetGeographicalRegion('RICE_sri_lanka_alt_region').GetName], fuyant les armées Chola et échappant aux griffes de seigneurs de guerre Cingalais sans scrupules. L'île était déchirée, la Sangha [buddhism.GetAdjective] en déclin, alors que la guerre et la souffrance étaient le lot quotidien.\n\nC'est durant ces années, durant ma jeunesse, que je me suis fixé comme objectif de vie de devenir [ROOT.Char.Custom('FR_LeLa')] souverain[ROOT.Char.Custom('FR_E')] de cette île entière, afin de ramener la paix sur cette terre autrefois prospère et de faire revivre le [buddhism.GetNameNoTooltip]. Avec mon ascension au trône d'un nouveau royaume centré autour de Polonnaruwa, j'ai accompli exactement cela.\n\nPuisse ceci être le début d'une ère nouvelle et plus radieuse pour [GetGeographicalRegion('RICE_sri_lanka_alt_region').GetNameNoTooltip] et son peuple."
 sri_lanka.0009.a:0 "Notre île prospérera comme jamais auparavant !"
 sri_lanka.0010.t:0 "Concessions terrestres [religion.GetAdjectiveNoTooltip]"
 sri_lanka.0010.desc:0 "En tant que [ROOT.Char.GetTitleAsNameNoTooltip] en [GetGeographicalRegion('world_india').GetName], l'un des moyens de gagner du mérite est d'accorder des concessions de terres à des institutions religieuses telles que des temples et des monastères, même ceux d'une secte différente de la mienne. Ils aident ainsi des dirigeants comme moi en développant l'agriculture et en intégrant économiquement et politiquement ces régions frontalières sous notre autorité.\n\nJ'ai décidé d'accorder des terres à un certain nombre de temples et de monastères [religion.GetAdjective] dans mes territoires, pour le plus grand bonheur des fidèles [religion.GetAdjectiveNoTooltip] qui y vivent.\n\nBien que cela détourne les revenus de ces terres loin de moi, c'est pour une bonne cause. Au minimum, cela rejaillira positivement sur moi aux yeux de la communauté [religion.GetAdjectiveNoTooltip] de mon royaume."
 sri_lanka.0010.a:0 "Que cela m'apporte un grand mérite !"
