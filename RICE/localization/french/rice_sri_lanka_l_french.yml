 sri_lanka.0030.t:0 "Soutenir le [GetPlayer.Custom('RICE_sri_lanka_patronized_monastery')]"
 sri_lanka.0030.desc.buddhist:0 "En tant que patron du monastère [GetPlayer.Custom('RICE_sri_lanka_patronized_monastery')], je dois travailler avec eux pour faire avancer la cause du [buddhism.GetName] au [GetPlayer.Custom('RICE_sri_lanka_sangha_location')], et élever le Sangha de ces terres.\n\n"
 sri_lanka.0030.desc.non_buddhist:0 "Bien que je ne sois pas un[ROOT.Char.Custom('FR_E')] adepte du [buddhism.GetName], je suis tout de même un patron du monastère [GetPlayer.Custom('RICE_sri_lanka_patronized_monastery')]. Il est important pour moi de travailler avec eux pour développer mes terres au [GetPlayer.Custom('RICE_sri_lanka_sangha_location')].\n\n"
 sri_lanka.0030.desc.foreign:0 "Bien que je sois géographiquement éloigné du Sangha du [GetPlayer.Custom('RICE_sri_lanka_sangha_location')], je crois qu'il est de mon devoir en tant que patron du [GetPlayer.Custom('RICE_sri_lanka_patronized_monastery')] de renforcer mon autorité là-bas en soutenant sa communauté [buddhism.GetAdjective].\n\n"
 sri_lanka.0030.desc.almsgiving:0 "Faire l'aumône aux moines est une pratique régulière pour beaucoup de ceux qui suivent les enseignements [buddhism.GetAdjective]s et même pour ceux qui ne les suivent pas, du plus humble paysan à un[ROOT.Char.Custom('FR_E')] puissant[ROOT.Char.Custom('FR_E')] [ROOT.Char.GetTitleAsNameNoTooltip] tel que moi-même. On dit que l'on acquiert un grand mérite en le faisant. Bien que j'aie donné ma juste part d'aumônes, je souhaite faire un grand don de nourriture aux moines du [GetPlayer.Custom('RICE_sri_lanka_sangha_location')], bien plus important que d'habitude."
 sri_lanka.0030.desc.gavu_pillars:0 "J'ai ordonné la construction de nouveaux piliers #italic gavu#!, ou #italic gavukanu#!, ainsi que la réparation de ceux déjà existants dans mes territoires du [GetPlayer.Custom('RICE_sri_lanka_sangha_location')]. Ces piliers de pierre jalonnent les routes à intervalles réguliers, et aident les voyageurs à effectuer un trajet sûr et rapide, en particulier les pèlerins qui cherchent à se rendre aux nombreux sites religieux de l'île. Les monastères que je patronne et moi-même pouvons également y graver des messages politiques et religieux, afin de nous apporter gloire et reconnaissance."
 sri_lanka.0030.desc.ritual_deposits:0 "Les dépôts rituels comme celui que je prévois sont une pratique [buddhism.GetAdjectiveNoTooltip] courante au [GetPlayer.Custom('RICE_sri_lanka_sangha_location')], et fortement associée aux puissants monastères d'ici comme le [GetPlayer.Custom('RICE_sri_lanka_patronized_monastery')]. En enterrant des objets tels que des textes sacrés, des objets saints et bien d'autres au monastère ou au temple que j'ai choisi, beaucoup croient que l'on peut renforcer le pouvoir spirituel de ce lieu, et gagner beaucoup de mérite."
 sri_lanka.0030.desc.ambalamas:0 "J'ai ordonné la construction de plusieurs nouveaux #italic ambalamas#! dans mes territoires au [GetPlayer.Custom('RICE_sri_lanka_sangha_location')], ainsi que la rénovation de ceux déjà existants. Ces maisons de repos, d'apparence trompeusement simple, sont utilisées depuis des siècles par les voyageurs et sont fortement associées aux pèlerins qui cherchent à se rendre sur l'un des nombreux sites religieux de l'île. Grâce à cela, les routes seront plus sûres pour ceux qui souhaitent honorer le Bouddha, pratiquer le Dharma et élever le Sangha."
 sri_lanka.0030.desc.ordination_ceremonies:0 "Les communautés monastiques du [GetPlayer.Custom('RICE_sri_lanka_sangha_location')] accueillent toujours de nouveaux moines et nonnes novices qui aspirent à utiliser leur vie humaine pour pratiquer les enseignements du Bouddha et œuvrer vers l'illumination. Je cherche à parrainer les cérémonies d'ordination de certains moines et nonnes au [GetPlayer.Custom('RICE_sri_lanka_sangha_location')]. En avoir davantage autour de nous ne peut être que bénéfique."
 sri_lanka.0030.desc.pali_literature:0 "Certains des monastères du [GetPlayer.Custom('RICE_sri_lanka_sangha_location')] regorgent de moines travaillant assidûment à la composition de divers textes religieux, allant de denses commentaires sur les enseignements du Bouddha à de la poésie sentimentale en sanskrit, dans le style littéraire #italic kavya#! pour inspirer les gens à des actes et des pensées méritoires. En patronnant la rédaction de certains de ces textes, j'espère, moi aussi, acquérir quelque mérite."
 sri_lanka.0030.desc.frontier_monks:0 "Certaines régions frontalières de mes territoires au [GetPlayer.Custom('RICE_sri_lanka_sangha_location')] manquent d'une présence importante de moines. Je prévois de financer des monastiques pour s'installer dans ces zones, afin d'étendre mon autorité et celle du [GetPlayer.Custom('RICE_sri_lanka_patronized_monastery')]. J'ai également l'intention de soutenir les #italic araññavasi#!, ou moines forestiers ascétiques, car ils peuvent nous assister dans nos efforts étant donné qu'ils sont grandement respectés par les habitants."
 sri_lanka.0030.desc.parivena_schools:0 "Le [GetPlayer.Custom('RICE_sri_lanka_patronized_monastery')], comme tous les grands monastères du [GetPlayer.Custom('RICE_sri_lanka_sangha_location')], entretient un réseau de #italic pariveṇas#! ou écoles. Ces réseaux de #italic pariveṇas#! jouent un rôle majeur dans le renforcement de l'influence du [GetPlayer.Custom('RICE_sri_lanka_patronized_monastery')] dans ces terres, et j'ai décidé d'étendre davantage cette influence en construisant un autre #italic pariveṇa#!."
 sri_lanka.0030.desc.senior_guides:0 "Ici à [ROOT.Char.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip], j'estime que nous ne disposons pas d'assez de maîtres sages et érudits capables de guider notre communauté [buddhism.GetAdjective]. En nous tournant vers le Sangha du $k_lanka$, respecté par les disciples de l'enseignement du Bouddha en de nombreuses contrées, nous avons pu faire venir un certain nombre de leurs moines et nonnes ici pour enseigner aux nôtres, et pour répandre le Dharma parmi notre propre peuple."
 sri_lanka.0030.a.buddhist:0 "Au nom des trois joyaux !"
 sri_lanka.0030.a.non_buddhist:0 "Mes sujets bouddhistes en seront ravis !"
 sri_lanka.0031.t.buddhist:0 "Purifier la Sangha"
 sri_lanka.0031.t.non_buddhist:0 "Persécution de la Sangha"
 sri_lanka.0031.desc:0 "J'ai ordonné à mes officiels dans mes territoires au [GetPlayer.Custom('RICE_sri_lanka_sangha_location')]"
 sri_lanka.0031.desc.burn_books:0 "de localiser tous les livres encourageant les idées vulgaires et l'immoralité qui se trouvent actuellement dans les monastères [buddhism.GetAdjective]s de l'île.\n\nCertains moines de ces monastères ont insidieusement justifié la rédaction et la diffusion de ces textes impies sur des bases religieuses pendant bien trop longtemps. Cela prend fin maintenant. Mes fonctionnaires confisqueront et brûleront tous les livres hérétiques qu'ils trouveront."
 sri_lanka.0031.desc.defrock_heretics_buddhist:0 "d'enquêter sur la moralité des nombreux moines [buddhism.GetAdjective]s, et punir ceux qui manquent à leurs vœux monastiques.\n\nDernièrement, les monastères se sont remplis de moines qui vivent comme de vulgaires roturiers, se livrant à des actes obscènes. Est-ce une façon de se comporter ? Cela pousse le peuple à mépriser les moines en retour ! Les moines fautifs seront contraints de retourner à la vie laïque, ou de recommencer comme moines novices s'ils veulent une autre chance."
 sri_lanka.0031.desc.defrock_heretics_non_buddhist:0 "d'enquêter sur la moralité des nombreux moines [buddhism.GetAdjective]s, et punir ceux qui manquent à leurs vœux monastiques.\n\nDernièrement, les monastères se sont remplis de moines qui vivent comme de vulgaires roturiers, se livrant à des actes obscènes. Je suis peut-être un [ROOT.Char.GetFaith.GetAdherentName], mais des moines aussi turbulents causent le désordre et les conflits dans mes terres. Les monastères seront sévèrement punis pour leurs manquements ; les moines fautifs seront contraints de retourner à la vie laïque, et leurs biens confisqués."
 sri_lanka.0031.desc.plunder_wealth_buddhist:0 "d'exiger des monastères [buddhism.GetAdjective]s de remettre un pourcentage de leurs richesses. Si un monastère refuse, mes soldats ont ma permission de le piller librement.\n\nLes monastères ont avidement accumulé des richesses sous forme d'or, de trésors et d'autres objets précieux. Ces moines doivent se séparer de ces possessions matérielles pour leur propre bien."
 sri_lanka.0031.desc.plunder_wealth_non_buddhist:0 "d'exiger que les monastères [buddhism.GetAdjective] remettent un pourcentage de leurs objets de valeur. Si un monastère refuse, mes soldats ont la permission de le piller librement.\n\nLes monastères ont avidement accumulé des richesses sous forme d'or, de trésors et d'autres objets précieux. De toute évidence, cela montre pourquoi [ROOT.Char.GetFaith.GetName] est la voie spirituelle supérieure, mais quoi qu'il en soit, c'est une bonne excuse pour nous emparer de ces richesses. Nous en ferons bien meilleur usage."
 sri_lanka.0031.desc.seize_land:0 "d'envoyer des soldats saisir les terres possédées par certains monastères [buddhism.GetAdjective]s là-bas. Paysans, esclaves, bâtiments, #italic wewa#! réservoirs, et ainsi de suite rattachés à ces propriétés nous appartiennent désormais.\n\nLes dirigeants précédents avaient distribué une grande partie de ces terres pour aider les monastères dans leur œuvre spirituelle. Certains monastères sont devenus pires que des marchands rapaces et des seigneurs de guerre, vivant en parasites de ces terres. Ils ne méritent pas de posséder autant."
 sri_lanka.0031.desc.ransack_monastery:0 "d'envoyer des soldats pour détruire un certain nombre de monastères choisis là-bas. Ils devront dégrader leurs bâtiments, prendre tous les objets de valeur qu'ils trouveront et punir ceux qui résistent.\n\nDepuis bien trop longtemps, ces arrogants et turbulents monastères [buddhism.GetAdjective]s ont encouragé les conflits et le désordre dans ces terres. Des mesures fortes et sévères remettront ces moines et leurs fidèles à leur place. De plus, cela renfloue grandement mes coffres."
 sri_lanka.0031.desc.buddhist:0 "\n\nCertains disent que je fais cela par cupidité, d'autres pour des raisons politiques, d'autres encore me croient quand je dis vouloir purifier la [RICE_sri_lanka_sangha|El] du [GetPlayer.Custom('RICE_sri_lanka_sangha_location')] en éliminant les hérétiques et en défendant les vrais enseignements. Moi seul connais la vérité, bien entendu."
 sri_lanka.0031.desc.non_buddhist:0 "\n\nLa [RICE_sri_lanka_sangha|El] [buddhism.GetAdjective] n'appréciera peut-être pas mes actions, mais je suis un [ROOT.Char.GetFaith.GetAdherentName]. S'ils espèrent vivre sous le règne des [ROOT.Char.GetDynasty.GetName], alors ils doivent apprendre à ne pas m'entraver, moi ou mon autorité."
 sri_lanka.0031.a:0 "Poursuivre le plan."
 sri_lanka.0032.t:0 "Littérature pāli"
 sri_lanka.0032.desc:0 "Il y a quelque temps, j'ai parrainé la rédaction de textes en littérature pali. À mon agréable surprise, cela a porté de grands fruits. Bien que mon mécénat fût destiné à aider la communauté [buddhism.GetAdjective] dans son ensemble, les moines de l'ordre [ROOT.Char.Custom('RICE_sri_lanka_patronized_monastery')] m'ont fourni une magnifique copie du texte qu'ils ont composé.\n\nEn particulier, ils ont écrit"
 sri_lanka.0032.desc.kavya_legends:0 "#bold la poésie kavya#! qui cherche à inspirer son audience vers une plus grande dévotion envers le [buddhism.GetNameNoTooltip].\n\nCe style de poésie de cour provient à l'origine des cours de monarques indiens non [buddhism.GetAdjectiveNoTooltip] et était écrit en sanskrit, et il est controversé en raison de son style sensuel. Cependant, beaucoup estiment que lorsqu'il est utilisé avec habileté et centré sur des thèmes religieux, ce genre peut transcender son vernis superficiellement mondain et aider les autres à apprécier les enseignements du Bouddha, montrer du respect envers les monastiques, s'engager dans la pratique spirituelle et être encouragés sur le chemin de l'éveil."
 sri_lanka.0032.desc.grammatical_aid:0 "un #bold manuel de grammaire#!, destiné à aider ceux qui souhaitent apprendre l'une des langues fréquemment utilisées dans les textes [buddhism.GetAdjectiveNoTooltip].\n\nEn général, deux langues sont liées à la littérature pālie. La plus importante est le pāli lui-même, la langue liturgique de ceux qui adhèrent au Canon pāli. De moindre importance est le sanskrit, utilisé dans les textes sacrés d'autres sectes bouddhistes, mais aussi dans la littérature religieuse et séculière, même parmi ceux qui suivent le Canon pāli. Maîtriser ces langues, c'est maîtriser ces vénérables textes."
 sri_lanka.0032.desc.doctrinal_manual:0 "un #bold manuel doctrinal#!, qui traite de divers sujets de théologie, de philosophie ou du code monastique [buddhism.GetAdjectiveNoTooltip].\n\nIl n'y a aucune honte à admettre son ignorance concernant la voie [buddhism.GetAdjectiveNoTooltip], tant que l'on cherche de l'aide auprès de sources faisant autorité. Ces textes sont donc destinés à aider ceux qui désirent être aidés. Après avoir étudié ces textes, on peut alors aborder des commentaires plus complexes et denses, ainsi que les écritures [buddhism.GetAdjectiveNoTooltip]s originales."
 sri_lanka.0032.desc.historical_chronicle:0 "un #bold vamsa#! - c'est-à-dire une chronique historique - qui concerne l'histoire de personnages célèbres, d'événements, et ainsi de suite en rapport avec les pays [buddhism.GetAdjectiveNoTooltip]s.\n\nBien entendu, le texte est rédigé dans le but d'instruire les autres au sujet des grands héros [buddhism.GetAdjectiveNoTooltip]s qui défendirent le Bouddha, le Dharma et le Sangha, et en retirèrent un grand mérite, ainsi que des vilains et hérétiques qui souffrirent parce qu'ils ne purent se défaire des trois poisons que sont l'illusion, le désir et la colère. Ceux qui liront ce texte seront inspirés vers la vertu et les actes méritoires !"
 sri_lanka.0032.desc.sub_commentaries:0 "un #bold tika#!, c'est-à-dire un sous-commentaire, qui développe davantage un ou plusieurs commentaires célèbres existants sur la pensée [buddhism.GetAdjectiveNoTooltip].\n\nCe n'est un secret pour personne que les commentaires [buddhism.GetAdjectiveNoTooltip]s peuvent, parfois, être tout aussi denses et difficiles à maîtriser que les écritures originales qu'ils abordent. Ainsi, ces #italic tikas#! sont toujours un atout précieux pour ceux qui cherchent à interpréter et comprendre ces commentaires, et, en fin de compte, les enseignements du Bouddha."
 sri_lanka.0032.a:0 "Un travail vraiment inspirant !"
 sri_lanka.0032.tooltip.pali_literature:0 "Vous recevrez une œuvre de littérature pāli sous la forme d'un [artifact|El]. #weak Les chances que cela se produise dépendent de votre [learning|El] et dans une moindre mesure de la [diplomacy|El].#!"
