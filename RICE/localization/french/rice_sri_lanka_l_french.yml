 RICE_sri_lanka_persecute_monastery_tooltip:0 "Persécuter les éléments déviants de la [RICE_sri_lanka_sangha|El], que ce soit pour des raisons religieuses ou matérielles"
 RICE_sri_lanka_persecute_monastery_desc_purify:0 "Il y a des monastiques corrompus et immoraux au sein du [RICE_sri_lanka_sangha|El] [ROOT.Char.GetFaith.GetReligion.GetAdjective] du [GetPlayer.Custom('RICE_sri_lanka_sangha_location')]. Pour réduire leur influence, nous devrions cibler les institutions bouddhistes qui encouragent leurs vices et leurs idées hérétiques, même si certains prétendent que seuls des [rulers|El] avides et assoiffés de pouvoir feraient une telle chose."
 RICE_sri_lanka_persecute_monastery_desc_persecute:0 "Les moines bouddhistes perturbateurs de [RICE_sri_lanka_s_sangha|El] sèment souvent le trouble et répandent des idées dangereuses parmi notre peuple. Si nous persécutons directement leurs institutions, nous pouvons réduire leur influence et remplir nos coffres, bien que les bouddhistes de notre [realm|El] ne seront pas satisfaits."
 RICE_sri_lanka_persecute_monastery_confirm:0 "Nous devons le faire !"
 RICE_sri_lanka_persecute_monastery_effect_tooltip_1:0 "Vous choisirez le niveau de persécution que vous infligerez aux monastères du [RICE_sri_lanka_short|El] et gagnerez de l'[gold|El]"
 RICE_sri_lanka_persecute_monastery_effect_tooltip_2:0 "Cela va #N diminuer#! la [RICE_sri_lanka_prominence|El] de tous les [RICE_sri_lanka_monasteries|El] [RICE_sri_lankan|El], bien que celui dont vous êtes le patron sera moins impacté"
