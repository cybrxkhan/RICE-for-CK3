 # Legends
 RICE_sri_lanka_ender_name:"Réforme de la Sangha du $k_lanka$"
 RICE_sri_lanka_ender_desc:"Le Sangha [GetReligionByKey('buddhism_religion').GetAdjective] du $k_lanka$ avait été divisé par des monastères querelleurs, jusqu'à la venue de [struggle_ender.GetFirstName]. Sous sa guidance, les monastères se réformèrent et purent à nouveau guider correctement la population de dévots [GetReligionByKey('buddhism_religion').GetAdherentNamePluralNoTooltip] de l'île."
 RICE_sri_lanka_legend_chapter_opening_struggle:"Pendant des années, la [ROOT.Legend.GetProperty( 'sangha' ).GetFlagName], c'est-à-dire la communauté [GetReligionByKey('buddhism_religion').GetAdjectiveNoTooltip] du $k_lanka$, avait été dominée par différents monastères, chacun prétendant suivre les véritables enseignements du Seigneur Bouddha. L'île étant divisée, son peuple perdit son chemin, et la terre sombra dans le déclin. Tel était l'état des choses jusqu'à l'arrivée de [ROOT.Legend.GetProtagonist.GetNameNoTooltip] sur la scène."
 RICE_sri_lanka_legend_chapter_motivation_struggle:"[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] déplorait le fait que tant de monastiques [GetReligionByKey('buddhism_religion').GetAdherentNamePluralNoTooltip] du $k_lanka$ manquaient de l'éducation appropriée et même de la moralité nécessaire pour guider le peuple non seulement de l'île, mais aussi ceux qui suivaient le [GetReligionByKey('buddhism_religion').GetNameNoTooltip] dans des terres lointaines, et qui recherchaient habituellement la sagesse des monastiques du $k_lanka$."
 RICE_sri_lanka_legend_chapter_famous_deed_generic:"Bien que [ROOT.Legend.GetProtagonist.GetSheHe] ne fût pas nécessairement des plus versé[ROOT.Legend.GetProtagonist.Custom('FR_E')] dans la doctrine [GetReligionByKey('buddhism_religion').GetAdjectiveNoTooltip], [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] savait que cet état de fait ne pouvait durer."
 RICE_sri_lanka_legend_chapter_extra_deed_struggle:"Utilisant son autorité, sa droiture morale et ses talents diplomatiques, [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] rassembla la communauté monastique [GetReligionByKey('buddhism_religion').GetAdjectiveNoTooltip] non seulement du $k_lanka$ mais aussi d'autres terres, dans un effort pour réformer la [ROOT.Legend.GetProperty( 'sangha' ).GetFlagName]. Les idées hérétiques et néfastes furent dénoncées, et les monastiques indignes furent défroqués, tandis que la pensée juste fut promue, et les monastiques vertueux récompensés et instruits dans la manière de guider une nouvelle génération de chefs religieux."
 RICE_sri_lanka_legend_chapter_conclusion_ended_struggle:"Bien que le Bouddha ait enseigné que toutes choses sont impermanentes, et que même ses enseignements déclineraient et disparaîtraient du monde un jour, ce jour n'est pas encore arrivé, grâce à [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]. Nombreux sont ceux dans la communauté [GetReligionByKey('buddhism_religion').GetAdjectiveNoTooltip] qui ne doutent guère que dans une vie passée, [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] a fait le vœu d'être un[ROOT.Legend.GetProtagonist.Custom('FR_E')] protect[ROOT.Legend.GetProtagonist.Custom('FR_EurRice')] des Trois Joyaux du [GetReligionByKey('buddhism_religion').GetNameNoTooltip]. Si [ROOT.Legend.GetProtagonist.GetSheHe] l'a fait, [ROOT.Legend.GetProtagonist.GetSheHe] a clairement réussi."

