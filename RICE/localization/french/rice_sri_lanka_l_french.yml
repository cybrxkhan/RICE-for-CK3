 RICE_sri_lanka_sangha_uniter_modifier:"Sangha du Sri Lanka unifié"
 RICE_sri_lanka_sangha_uniter_modifier_desc:"Cette dynastie a joué un rôle majeur dans l'unification des factions rivales au sein de la [RICE_sri_lanka_struggle|El], ou de sa communauté bouddhiste. Qu'ils soient encore bouddhistes ou non, leurs actes méritoires leur ont valu la gratitude éternelle des bouddhistes de la région."
 RICE_sri_lanka_sangha_destroyer_modifier:"A détruit la Sangha du Sri Lanka"
 RICE_sri_lanka_sangha_destroyer_modifier_desc:"Cette dynastie a joué un rôle majeur dans la destruction de la [RICE_sri_lanka_struggle|El], constamment en proie aux querelles, ou de sa communauté bouddhiste. Même s'ils sont devenus bouddhistes, leurs actes odieux leur ont valu le mépris éternel des bouddhistes de la région, s'il en reste."
 RICE_sri_lanka_sangha_reviver_modifier: "La renaissance de la Sangha bouddhiste"
 RICE_sri_lanka_sangha_reviver_modifier_desc: "Cette dynastie a joué un rôle majeur dans la renaissance du Sangha bouddhiste après le déclin de la [RICE_sri_lanka_struggle|El], ou de sa communauté bouddhiste. Un nouveau centre d'apprentissage et de foi bouddhiste a été établi dans les territoires contrôlés par cette dynastie."
