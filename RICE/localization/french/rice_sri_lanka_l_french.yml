 RICE_sri_lanka_relic_dharmadhatu_modifier:"Vénération mineure du Dharmadhatu"
 RICE_sri_lanka_relic_bodhi_great_modifier:"Vénération majeure de l'arbre de la Bodhi"
 RICE_sri_lanka_relic_tooth_great_modifier: "Vénération majeure de la Dent du Bouddha"
 RICE_sri_lanka_relic_dharmadhatu_great_modifier: "Vénération majeure du Dharmadhatu"
 RICE_sri_lanka_relic_bodhi_shrine_modifier: "Temple de l'arbre de la Bodhi"
 RICE_sri_lanka_relic_bodhi_shrine_modifier_desc:"L'arbre de la Bodhi, une branche de l'arbre du Magadha où le Seigneur Bouddha a atteint l'illumination, est vénéré dans un temple ici. Suite à l'unification de la [RICE_sri_lanka_struggle|El], il est devenu un lieu majeur de culte et de vénération parmi les bouddhistes du [GetGeographicalRegion('RICE_sri_lanka_alt_region').GetName] et au-delà."
 RICE_sri_lanka_relic_tooth_shrine_modifier: "Temple de la Dent du Bouddha"
 RICE_sri_lanka_relic_tooth_shrine_modifier_desc: "La relique de la Dent du Bouddha, prélevée sur ses cendres après la crémation, est vénérée dans un temple ici. Suite à l'unification de la [RICE_sri_lanka_struggle|El], il est devenu un lieu majeur de culte et de vénération parmi les bouddhistes du [GetGeographicalRegion('RICE_sri_lanka_alt_region').GetName] et au-delà."
 RICE_sri_lanka_relic_dharmadhatu_shrine_modifier: "Temple du Dharmadhatu"
 RICE_sri_lanka_relic_dharmadhatu_shrine_modifier_desc: "La relique du Dharmadhatu, une copie de divers textes et écrits bouddhistes, est vénérée dans un temple ici. Suite à l'unification de la [RICE_sri_lanka_struggle|El], il est devenu un lieu majeur de culte et de vénération parmi les bouddhistes du [GetGeographicalRegion('RICE_sri_lanka_alt_region').GetName] et au-delà."
 RICE_sri_lanka_frontier_monks_wilderness: "Les moines de la nature sauvage"
 RICE_sri_lanka_frontier_monks_non_wilderness: "Expansion monastique frontalière"
 RICE_sri_lanka_sri_lankan_monk_advisors: "Conseillers monastiques du Sri Lanka"
 RICE_sri_lanka_sri_lankan_monks: "Moines du Sri Lanka"
 RICE_sri_lanka_gavu_pillars: "Piliers Gavu"
 RICE_sri_lanka_gavu_pillars_desc: "Les dirigeants locaux, avec le soutien des monastères bouddhistes, ont récemment construit ou réparé certains des #italic piliers gavu#! dans cette région. Ces piliers en pierre sont des éléments courants sur les routes du [GetGeographicalRegion('RICE_sri_lanka_alt_region').GetName], conçus pour aider les voyageurs dans leurs déplacements, en particulier ceux se rendant en pèlerinage dans l'un des nombreux sites religieux de l'île."
 RICE_sri_lanka_ambalamas: "Ambalamas"
 RICE_sri_lanka_ambalamas_desc: "Les dirigeants locaux, avec le soutien des monastères bouddhistes, ont récemment construit ou rénové certains des #italic ambalamas#! dans cette région. Ces structures en bois, malgré leur style apparemment simple, jouent un rôle important en tant que type traditionnel de maisons de repos pour les pèlerins et les voyageurs que l'on trouve au [GetGeographicalRegion('RICE_sri_lanka_alt_region').GetName]."
 RICE_sri_lanka_book_burnings_buddhist:"Autodafés"
 RICE_sri_lanka_book_burnings_buddhist_desc: "Ce souverain a récemment ordonné que certains textes bouddhistes trouvés sur son territoire soient confisqués par ses fonctionnaires et, dans certains cas, brûlés. Qu'ils aient raison ou tort, ils estimaient que ces textes diffusaient des idées hérétiques qui interprétaient mal le Bouddha, encourageaient des interprétations erronées du Dharma et semaient la discorde au sein de la Sangha."
 RICE_sri_lanka_book_burnings_buddhist_purification: "$RICE_sri_lanka_book_burnings_buddhist$"
 RICE_sri_lanka_book_burnings_buddhist_purification_desc: "$RICE_sri_lanka_book_burnings_buddhist_desc$"
 RICE_sri_lanka_book_burnings_non_buddhist: "$RICE_sri_lanka_book_burnings_buddhist$"
 RICE_sri_lanka_book_burnings_non_buddhist_desc:"Ce dirigeant a récemment ordonné que certains textes bouddhistes trouvés dans ses territoires soient confisqués par ses fonctionnaires, et dans certains cas brûlés. Il estimait que le Sangha bouddhiste encourageait des idées dangereuses et hérétiques à travers ces textes, peut-être celles qui menaçaient son autorité."
 RICE_sri_lanka_defrock_heretics_buddhist:"Hérétiques défroqués"
 RICE_sri_lanka_defrock_heretics_buddhist_desc: "Ce souverain a récemment ordonné que les moines corrompus et hérétiques soient défroqués sur son territoire. Ceux qui étaient considérés comme ne respectant pas leurs vœux monastiques en se livrant à des actes immoraux et en encourageant des opinions erronées devaient voir leurs biens confisqués afin qu'ils puissent soit retourner à la vie laïque, soit renouveler leurs vœux monastiques sous l'égide d'autorités monastiques approuvées par ce souverain."
 RICE_sri_lanka_defrock_heretics_buddhist_purification: "$RICE_sri_lanka_defrock_heretics_buddhist$"
 RICE_sri_lanka_defrock_heretics_buddhist_purification_desc: "$RICE_sri_lanka_defrock_heretics_buddhist_desc$"
 RICE_sri_lanka_defrock_heretics_non_buddhist: "$RICE_sri_lanka_defrock_heretics_buddhist$"
 RICE_sri_lanka_defrock_heretics_non_buddhist_desc: "Ce souverain a récemment ordonné que les moines corrompus et hérétiques soient défroqués sur leur territoire. Que ce soit à tort ou à raison, ce souverain considérait certains de ces moines comme rebelles et encourageant la défiance à l'égard de son autorité en tant que non-bouddhiste. Ces moines se sont vu confisquer leurs biens afin qu'ils puissent soit retourner à la vie laïque, soit renouveler leurs vœux monastiques sous l'égide d'autorités monastiques approuvées par ce souverain."
 RICE_sri_lanka_plunder_wealth_buddhist:"Richesses pillées des monastères"
 RICE_sri_lanka_plunder_wealth_buddhist_desc: "Ce souverain a récemment ordonné à certains monastères bouddhistes de son territoire de lui remettre certains de leurs objets les plus précieux, tels que des statues, des écritures, des ornements et d'autres objets de valeur. Apparemment, il a agi ainsi parce qu'il estimait que ces monastères étaient trop avides en accumulant ces objets, mais d'autres pensent que ce souverain était simplement lui-même avide, ou qu'il voulait au mieux affaiblir ses rivaux politiques."
 RICE_sri_lanka_plunder_wealth_buddhist_purification: "$RICE_sri_lanka_plunder_wealth_buddhist$"
 RICE_sri_lanka_plunder_wealth_buddhist_purification_desc: "$RICE_sri_lanka_plunder_wealth_buddhist_desc$"
 RICE_sri_lanka_plunder_wealth_non_buddhist: "$RICE_sri_lanka_plunder_wealth_buddhist$"
 RICE_sri_lanka_plunder_wealth_non_buddhist_desc: "Ce souverain a récemment ordonné que certains monastères bouddhistes situés sur son territoire lui remettent certains de leurs objets les plus précieux, tels que des statues, des écritures, des ornements et d'autres objets de valeur. En tant que non-bouddhiste, il a peut-être considéré les monastères comme des parasites qui amassent des richesses qui devraient appartenir à d'autres, ou il a peut-être voulu affaiblir ses rivaux politiques."
 RICE_sri_lanka_seize_land_buddhist:"Terres monastiques saisies"
 RICE_sri_lanka_seize_land_buddhist_desc: "Ce souverain a récemment ordonné la saisie de terres appartenant à des monastères bouddhistes sur leur territoire. Certains disent que c'est parce que ce souverain estimait que ces monastères s'étaient écartés de la voie sacrée en ayant à gérer des affaires mondaines, mais d'autres disent que c'est pour des raisons politiques ou par pure cupidité."
 RICE_sri_lanka_seize_land_buddhist_purification: "$RICE_sri_lanka_seize_land_buddhist$"
 RICE_sri_lanka_seize_land_buddhist_purification_desc: "$RICE_sri_lanka_seize_land_buddhist_desc$"
 RICE_sri_lanka_seize_land_non_buddhist: "$RICE_sri_lanka_seize_land_buddhist$"
 RICE_sri_lanka_seize_land_non_buddhist_desc:"Ce dirigeant a récemment ordonné la saisie de certaines terres appartenant à des monastères bouddhistes dans ses territoires. Peut-être, en tant que non-bouddhiste, se sentait-il menacé par l'influence de ces monastères ; ou, alternativement, peut-être était-il simplement avide."
 RICE_sri_lanka_ransack_monasteries_buddhist:"Monastères bouddhistes saccagés"
 RICE_sri_lanka_ransack_monasteries_buddhist_desc: "Ce souverain a récemment ordonné que plusieurs monastères bouddhistes situés sur son territoire soient complètement saccagés, détruits et que leurs objets de valeur soient emportés. Bien qu'il soit théoriquement bouddhiste (du moins à l'époque où il a agi ainsi), il est clair que ce souverain ne se soucie pas du karma négatif qu'il a accumulé ou, au mieux, qu'il souhaite affaiblir les groupes monastiques de la Sangha qu'il considère comme immoraux et corrompus."
 RICE_sri_lanka_ransack_monasteries_buddhist_purification: "$RICE_sri_lanka_ransack_monasteries_buddhist$"
 RICE_sri_lanka_ransack_monasteries_buddhist_purification_desc: "$RICE_sri_lanka_ransack_monasteries_buddhist_desc$"
 RICE_sri_lanka_ransack_monasteries_non_buddhist: "$RICE_sri_lanka_ransack_monasteries_buddhist$"
 RICE_sri_lanka_ransack_monasteries_non_buddhist_desc: "Ce souverain a récemment ordonné que plusieurs monastères bouddhistes situés sur son territoire soient complètement saccagés, détruits et que leurs objets de valeur soient emportés. Bien qu'il ne soit pas bouddhiste (du moins à l'époque où il a agi ainsi), cette décision ne sera certainement pas bien perçue par ses sujets bouddhistes ni par les souverains bouddhistes étrangers, et on se souviendra certainement de sa cupidité et de son impitoyabilité."
 RICE_sri_lanka_budal_dynasty_privileges:"Privilèges pour Budal et ses descendants"
 RICE_sri_lanka_budal_dynasty_privileges_desc: "Lorsque le futur roi Vijayabahu n'était encore qu'un jeune garçon, un prince égaré qui survivait dans la nature sauvage pour échapper aux ravages des armées envahissantes des Chola, son protecteur et guide le plus dévoué et le plus vaillant fut Budal, l'ancêtre de cette dynastie. En remerciement du courage et de la vertu incomparables de Budal, ainsi que du rôle qu'il a joué pour assurer la victoire future de Vijayabahu, de grands privilèges lui ont été accordés, ainsi qu'à ses descendants."
 RICE_funded_irrigation_tank_small:0 "Construction financée d'un petit réservoir d'irrigation"
 RICE_funded_irrigation_tank_small_desc:0 "Ce personnage a récemment donné des fonds pour travailler avec les élites locales et les institutions religieuses à la construction de réservoirs d'irrigation dans leur royaume. Ces systèmes de réservoirs artificiels soigneusement conçus, que l'on trouve dans toute l'Inde, jouent un rôle important dans la vie communale, car ils permettent de récolter et de conserver l'eau de pluie."
 RICE_irrigation_tank_constructed_small:0 "Petit réservoir d'irrigation récemment construit"
 RICE_irrigation_tank_constructed_small_desc:0 "Les dirigeants de cette région, en collaboration avec les élites locales et les institutions religieuses, ont récemment parrainé la construction d'un nouveau réservoir d'irrigation de taille modeste dans cette région. Les réservoirs d'irrigation, que l'on trouve dans toute l'Inde, constituent une source d'eau fiable pour l'agriculture, la boisson, le bain et les rituels religieux."
 RICE_funded_irrigation_tank_medium:0 "Construction financée d'un réservoir d'irrigation moyen"
 RICE_funded_irrigation_tank_medium_desc:0 "$RICE_funded_irrigation_tank_small_desc$"
 RICE_irrigation_tank_constructed_medium:0 "Réservoir d'irrigation moyen récemment construit"
 RICE_irrigation_tank_constructed_medium_desc:0 "Les dirigeants de cette région, en collaboration avec les élites locales et les institutions religieuses, ont récemment parrainé la construction d'un nouveau réservoir d'irrigation de taille décente dans cette région. Les réservoirs d'irrigation, que l'on trouve dans toute l'Inde, constituent une source d'eau fiable pour l'agriculture, la boisson, le bain et les rituels religieux."
 RICE_funded_irrigation_tank_large:0 "Financement de la construction d'un grand réservoir d'irrigation"
 RICE_funded_irrigation_tank_large_desc:0 "$RICE_funded_irrigation_tank_small_desc$"
 RICE_irrigation_tank_constructed_large:0 "Grand réservoir d'irrigation récemment construit"
 RICE_irrigation_tank_constructed_large_desc:0 "Les dirigeants de cette région, travaillant de concert avec les élites locales et les institutions religieuses, ont récemment parrainé la construction d'un nouveau réservoir d'irrigation de grande taille dans cette région. Les réservoirs d'irrigation, que l'on trouve partout en Inde, fournissent une source d'eau fiable pour l'agriculture, la boisson, les bains et les rituels religieux."
 RICE_funded_irrigation_tank_grand:0 "Construction financée d'un immense réservoir d'irrigation"
 RICE_funded_irrigation_tank_grand_desc:0 "$RICE_funded_irrigation_tank_small_desc$"
 RICE_irrigation_tank_constructed_grand:0 "Immense réservoir d'irrigation récemment construit"
 RICE_irrigation_tank_constructed_grand_desc:0 "Les dirigeants de cette région, en collaboration avec les élites locales et les institutions religieuses, ont récemment parrainé la construction d'un nouveau réservoir d'irrigation d'une taille immense dans cette région. Les réservoirs d'irrigation, que l'on trouve dans toute l'Inde, constituent une source d'eau fiable pour l'agriculture, la boisson, le bain et les rituels religieux."
 RICE_sri_lanka_decline_of_anuradhapura:0 "Déclin d'Anuradhapura"
 RICE_sri_lanka_decline_of_anuradhapura_desc:0 "Autrefois le fier joyau du $k_lanka$, et un centre de commerce, de religion et de savoir, Anuradhapura fut mise à sac lors des invasions Chola de la fin des années 900 et du début des années 1000 de notre ère. Suite à son déclin économique, politique et culturel, elle n'est plus que l'ombre d'elle-même."
 RICE_sri_lanka_polonnaruwa_capital_modifier:0 "Royaume de Polonnaruwa"
 RICE_sri_lanka_polonnaruwa_capital_modifier_desc:0 "Après la destruction d'Anuradhapura, l'ancienne capitale du $k_lanka$, et la fin de l'invasion Chola, les dirigeants de l'île décidèrent de déplacer la capitale vers un nouvel emplacement plus défendable, Polonnaruwa. Elle sert désormais de centre de commerce, de religion et de savoir pour l'île, tout comme Anuradhapura le faisait autrefois."
 RICE_sri_lanka_sri_pada_abrahamic_modifier:0 "Pèlerinage au Pic d'Adam (abrahamique)"
 RICE_sri_lanka_sri_pada_buddhist_modifier:0 "Pèlerinage à Sri Pada (bouddhiste)"
 RICE_sri_lanka_sri_pada_hindu_modifier:0 "Pèlerinage au Sri Pada (hindou)"
 RICE_sri_lanka_sri_pada_other_eastern_modifier:0 "Pèlerinage à Sri Pada (oriental)"
 RICE_sri_lanka_sri_pada_pagan_modifier:0 "Pèlerinage au Sri Pada (Autre)"
 RICE_sri_lanka_ramasetu_inspiration_desc:0 "En effectuant un pèlerinage à Ramasetu, le pont terrestre reliant l'Inde et le Sri Lanka, ce personnage a été inspiré par les récits du #italic Ramayana#! liés à Ramasetu. En particulier, il a été inspiré par"
 RICE_sri_lanka_ramasetu_inspiration_ravana_war:0 "Inspiré par la guerre contre Ravana"
 RICE_sri_lanka_ramasetu_inspiration_ravana_war_desc:0 "$RICE_sri_lanka_ramasetu_inspiration_desc$ les épisodes de la grande guerre que le prince divin Rama a menée contre l'infâme roi démon Ravana, afin de sauver son épouse Sita."
 RICE_sri_lanka_ramasetu_inspiration_nala_nila:0 "Inspiré par Nala et Nila"
 RICE_sri_lanka_ramasetu_inspiration_nala_nila_desc:0 "$RICE_sri_lanka_ramasetu_inspiration_desc$ Nala et Nila, deux singes jumeaux divins, aident le héros Rama en construisant un pont sur l'océan afin que Rama puisse se rendre à Lanka, l'île où réside son ennemi juré, le roi démon Ravana."
 RICE_sri_lanka_ramasetu_inspiration_vibhishana:0 "Inspiré par Vibhishana"
 RICE_sri_lanka_ramasetu_inspiration_vibhishana_desc:0 "$RICE_sri_lanka_ramasetu_inspiration_desc$ Vibhishana, le frère cadet du roi démon Ravana. Bien qu'il soit le parent de Ravana, il est juste et vertueux, contrairement à ce dernier, et décide d'aider Rama dans sa guerre contre Ravana ; il est ensuite désigné par Rama comme le successeur de Ravana."
 RICE_sri_lanka_ramasetu_inspiration_sita:0 "Inspiré par Sita"
 RICE_sri_lanka_ramasetu_inspiration_sita_desc:0 "$RICE_sri_lanka_ramasetu_inspiration_desc$ Sita, la partenaire courageuse, vertueuse et pure de l'héroïque Rama. Elle est la fille, l'épouse et la mère idéale. Elle est enlevée par le roi démon Ravana et souffre de sa captivité, mais elle est finalement sauvée par Rama."
 RICE_sri_lanka_ramasetu_inspiration_rama:0 "Inspiré par Rama"
 RICE_sri_lanka_ramasetu_inspiration_rama_desc:0 "$RICE_sri_lanka_ramasetu_inspiration_desc$ Rama, le protagoniste titulaire du #italic Ramayana#! et le septième avatar du dieu Vishnu. Il subit de nombreuses épreuves, notamment la capture de sa femme Sita par le roi démon Ravana, bien qu'il finisse par la sauver. Sa vertu, son intelligence et sa force font de lui un modèle pour tous."
 RICE_sri_lanka_ramasetu_inspiration_hanuman:0 "Inspiré par Hanuman"
 RICE_sri_lanka_ramasetu_inspiration_hanuman_desc:0 "$RICE_sri_lanka_ramasetu_inspiration_desc$ Hanuman, un singe divin qui est un disciple dévoué de Rama. Il est capable de nombreux exploits magiques, mais il les utilise pour le bien et pour montrer sa dévotion à Rama."
 RICE_sri_lanka_new_center_of_buddhism:0 "Nouveau centre du Bouddhisme"
 RICE_sri_lanka_new_center_of_buddhism_desc:0 "Suite au déclin de la [RICE_sri_lanka_struggle|El], cette région, ainsi que d'autres zones voisines, est devenue le principal centre d'apprentissage et de foi bouddhistes."
 RICE_sri_lanka_upulvan:0 "A vénéré Upulvan/Perumal"
 RICE_sri_lanka_kataragama:0 "A vénéré Kataragama/Murugan"
 RICE_sri_lanka_saman:0 "A vénéré Saman"
 RICE_sri_lanka_pattini:0 "A vénéré Pattini/Kannaki Amman"
 RICE_sri_lanka_natha:0 "A vénéré Natha"
 RICE_sri_pada_different_faiths_respect:0 "Différentes fois au Sri Pada/Pic d'Adam"
 RICE_sri_pada_different_faiths_respect_desc:0 "Lors d'un récent pèlerinage à Sri Pada, ou Pic d'Adam, au Sri Lanka, ce personnage a été intrigué par le fait que des personnes de toutes les confessions se rendaient sur ce lieu saint. Bien que la situation ait été parfois tendue, les différents groupes ont généralement accepté la présence des uns et des autres, ce qui a amené ce personnage à réfléchir à la manière dont des personnes de croyances différentes peuvent s'entendre."
 RICE_sri_pada_avoided_meat:0 "A évité la viande au Sri Pada/Pic d'Adam"
 RICE_vedda_county_modifier:0 "Collaboration avec la communauté Vedda"
 RICE_vedda_county_modifier_desc:0 "Les Veddas entretiennent des relations fructueuses avec les autorités locales. Ils encouragent le commerce local et aident les autres à réaliser divers projets de construction, ainsi qu'à traquer et à combattre les bandits, les rebelles et les armées ennemies."
 RICE_sayabiga_easter_egg_modifier:0 "Descendant des Sayabiga"
 RICE_sayabiga_easter_egg_modifier_desc:0 "Ce personnage descend des #italic Sayabiga#! (comme les Arabes les appellent), des immigrants marins venus d'Indonésie qui, aux côtés des #italic Zutts#! indiens (ou Jats), furent invités par les Sassanides et les premiers musulmans à s'installer en Mésopotamie. Certains furent plus tard capturés par les Byzantins et réinstallés en Anatolie. Les Sayabiga et les Zutt sont souvent employés comme soldats, et se spécialisent dans l'utilisation de troupeaux de buffles, qu'ils ont introduits dans la région, pour assister dans l'agriculture et la logistique militaire."
 RICE_sri_lanka_rodi_noble_modifier:0 "Crimes odieux"
 RICE_sri_lanka_pattini_team_wins_ankeliya:0 "L'équipe de Pattini a remporté l'Ankeliya"
 RICE_sri_lanka_pattini_team_wins_porakeliya:0 "L'équipe de Pattini a remporté le Porakeliya"
 RICE_sri_lanka_milk_mothers_ceremony_modifier:0 "Cérémonie des mères de lait"
 RICE_sri_lanka_good_relationship_with_veddas:0 "Bonnes relations avec les Veddas"
 RICE_sri_lanka_good_relationship_with_veddas_desc:0 "Les Veddas, les peuples indigènes du Sri Lanka, entretiennent actuellement d'excellentes relations avec leurs voisins non Veddas dans cette région. Ils encouragent le commerce et d'autres formes de coopération entre ces communautés, ce qui contribue à une plus grande prospérité pour tous."
 RICE_sri_lanka_pirit_ceremony:0 "Cérémonie de Pirit"
 RICE_sri_lanka_respects_other_buddhist_sects:0 "Respecte les autres sectes bouddhistes"
 RICE_sri_lanka_respects_other_buddhist_sects_desc:0 "Ce personnage est quelqu'un qui respecte les autres sectes bouddhistes, même celles qui suivent d'autres points de vue, ou du moins c'est quelqu'un qui veut être perçu comme tel."
 RICE_sri_lanka_avoids_heretical_buddhist_sects:0 "Évite les sectes bouddhistes hérétiques"
 RICE_sri_lanka_avoids_heretical_buddhist_sects_desc:0 "Ce personnage est quelqu'un qui évite de soutenir ou de s'associer à des sectes bouddhistes qui ont des points de vue divergents, ou du moins c'est quelqu'un qui veut être perçu ainsi."
 RICE_sri_lanka_gammaduva_ceremony_modifier:0 "Cérémonie du Gammaduva"
 RICE_sri_lanka_waterproof_jars:0 "Jarres étanches d'Iran et de Mésopotamie"
 RICE_sri_lanka_precious_gems:0 "Pierres précieuses d'Afghanistan"
 RICE_sri_lanka_glazed_ceramics:0 "Céramiques émaillées de Chine"
 RICE_sri_lanka_generous_to_villagers:0 "Généreux envers les villageois"
 RICE_sri_lanka_aspiration_rule_sri_lanka:"[RICE_aspiration|E] : Établir le royaume de Polonnaruwa"
 RICE_sri_lanka_aspiration_rule_sri_lanka_desc:"#italic Vijayabahu cherche à restaurer l'ordre et à ramener la paix sur l'île du $k_lanka$, qui a été disputée entre seigneurs de guerre cinghalais et armées Chola pendant des décennies, et à établir un nouveau royaume.#!$RICE_sri_lanka_aspiration_vijayabahu_desc$\n\n"
 RICE_sri_lanka_bappa_beary: "Bâtisseur de Bappanad"
 RICE_sri_lanka_bappa_beary_desc: "Bien que d'origine musulmane, ce marchand est célèbre dans le sud de l'Inde pour avoir construit un temple à la déesse hindoue Durga, appelé Bappanad. On dit qu'il a fait cela par gratitude envers Durga lorsqu'il a fait naufrage et qu'elle s'est manifestée devant lui pour le sauver de la ruine."

 # Struggle Ending Decisions
 RICE_sri_lanka_struggle_ending_unite_sangha_decision:0 "Unifier la Sangha"
 RICE_sri_lanka_struggle_ending_unite_sangha_decision_tooltip:0 "Les trois [RICE_sri_lanka_monasteries|El] seront réunis en un seul"
 RICE_sri_lanka_struggle_ending_unite_sangha_decision_desc:0 "La [RICE_sri_lanka_struggle|El] est divisée depuis trop longtemps. Avec notre aide, l'un des principaux [RICE_sri_lanka_monasteries|El] bouddhistes de l'île - que ce soit le [mahavihara|E], l'[abhayagiri|E] ou le [jetavana|E] - doit restaurer la discipline monastique, renforcer les vues et pratiques appropriées, et réformer la [RICE_sri_lanka_sangha|El] de l'île."
 RICE_sri_lanka_struggle_ending_uniter_pali_canon_doctrine_effect_tt:1 "Les [faiths|El] bouddhistes avec la [doctrine|El] [GetFaithDoctrine('rice_theravada_canon_doctrine').GetBaseName] obtiendront une [doctrine|El] spéciale selon le [RICE_sri_lanka_monastery|El] que vous patronnez :\n$EFFECT_LIST_BULLET$[mahavihara_i|E] [mahavihara|E] : [GetFaithDoctrine('rice_theravada_canon_mahavihara_doctrine').GetBaseName]\n$EFFECT_LIST_BULLET$[abhayagiri_i|E] [abhayagiri|E] : [GetFaithDoctrine('rice_theravada_canon_abhayagiri_doctrine').GetBaseName]\n$EFFECT_LIST_BULLET$[jetavana_i|E] [jetavana|E] : [GetFaithDoctrine('rice_theravada_canon_jetavana_doctrine').GetBaseName]"
 RICE_sri_lanka_struggle_ending_uniter_phase_doctrine_effect_tt:1 "Les [faiths|El] bouddhistes avec la [doctrine|El] [GetFaithDoctrine('rice_theravada_canon_doctrine').GetBaseName] obtiennent une [doctrine|El] spéciale en fonction de la [struggle_phase|El] dans laquelle la [struggle|El] se termine :\n$EFFECT_LIST_BULLET$[struggle_phase_sri_lanka_degeneration_simple|E] : [GetFaithDoctrine('rice_theravada_degeneration_doctrine').GetBaseName]\n$EFFECT_LIST_BULLET$[struggle_phase_sri_lanka_accumulation_simple|E] : [GetFaithDoctrine('rice_theravada_accumulation_doctrine').GetBaseName]\n$EFFECT_LIST_BULLET$[struggle_phase_sri_lanka_purification_simple|E] : [GetFaithDoctrine('rice_theravada_purification_doctrine').GetBaseName]"
 RICE_sri_lanka_struggle_ending_uniter_relic_effect_tt:0 "Vous choisirez l'une des trois reliques majeures de l'[activity|El] [GetActivityType( 'activity_RICE_sri_lanka_relic_veneration' ).GetName] pour qu'elle devienne plus vénérée que les autres, la rendant définitivement plus puissante lors de cette [activity|El]"
 RICE_sri_lanka_struggle_ending_unite_decision_mahavihara_tt:0 "[mahavihara_i|E] La [RICE_sri_lanka_prominence|El] [mahavihara|E] est d'au moins #V 900#!"
 RICE_sri_lanka_struggle_ending_unite_decision_abhayagiri_tt:0 "[abhayagiri_i|E] La [RICE_sri_lanka_prominence|El] [abhayagiri|E] est d'au moins #V 900#!"
 RICE_sri_lanka_struggle_ending_unite_decision_jetavana_tt:0 "[jetavana_i|E] La [RICE_sri_lanka_prominence|El] [jetavana|E] est d'au moins #V 900#!"
 RICE_sri_lanka_struggle_ending_unite_sangha_decision_confirm:0 "Unir les $RICE_sri_lanka_struggle$"

 RICE_sri_lanka_struggle_ending_destroy_sangha_decision:0 "Détruire la Sangha"
 RICE_sri_lanka_struggle_ending_destroy_sangha_decision_tooltip:0 "Les institutions bouddhistes de cette île seront dépouillées de tout pouvoir et de toute influence."
 RICE_sri_lanka_struggle_ending_destroy_sangha_decision_desc:0 "La [RICE_sri_lanka_struggle|El] a été une épine dans notre pied, car leurs grands [RICE_sri_lanka_monasteries|El] - en particulier le [mahavihara|El], l'[abhayagiri|El], et le [jetavana|El] - encouragent les conflits et le désordre par leurs querelles, rendant difficile pour nous d'établir la domination des [ROOT.Char.GetDynasty.GetName] sur le [GetGeographicalRegion('RICE_sri_lanka_alt_region').GetName]. Nous devons complètement anéantir l'influence et le pouvoir qu'ils exercent sur cette île."
 RICE_sri_lanka_struggle_ending_uniter_destroyer_doctrine_effect:1 "Les [faiths|El] bouddhistes avec la [doctrine|El] [GetFaithDoctrine('rice_theravada_canon_doctrine').GetBaseName] obtiennent la [doctrine|El] spéciale [GetFaithDoctrine('rice_theravada_destruction_of_sangha_doctrine').GetBaseName]"
 RICE_sri_lanka_struggle_ending_destroy_sangha_decision_confirm:0 "Détruire la $RICE_sri_lanka_struggle$"
 RICE_sri_lanka_struggle_ending_destroy_decision_mahavihara_tt:0 "[mahavihara_i|E] La [RICE_sri_lanka_prominence|El] [mahavihara|E] est inférieure à #V 100#!"
 RICE_sri_lanka_struggle_ending_destroy_decision_abhayagiri_tt:0 "[abhayagiri_i|E] La [RICE_sri_lanka_prominence|El] [abhayagiri|E] est inférieure à #V 100#!"
 RICE_sri_lanka_struggle_ending_destroy_decision_jetavana_tt:0 "[jetavana_i|E] La [RICE_sri_lanka_prominence|El] [jetavana|E] est inférieure à #V 100#!"

 RICE_sri_lanka_struggle_ending_foreign_sangha_decision:0 "Raviver la Sangha [GetPlayer.GetFaith.GetAdjectiveNoTooltip]"
 RICE_sri_lanka_struggle_ending_foreign_sangha_decision_tooltip:0 "Il est temps pour nous d'établir une nouvelle terre sainte du bouddhisme"
 RICE_sri_lanka_struggle_ending_foreign_sangha_decision_desc:0 "La [RICE_sri_lanka_struggle|El] a lutté pour s'unifier sous l'un de ses trois grands [RICE_sri_lanka_monasteries|El], que ce soit le [mahavihara|E], l'[abhayagiri|El] ou le [jetavana|El]. De toute évidence, le [GetGeographicalRegion('RICE_sri_lanka_alt_region').GetName] n'est pas destiné à être le centre du bouddhisme. Au lieu de cela, [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip] devrait montrer la voie en ravivant la [RICE_sri_lanka_sangha|El] bouddhiste."
 RICE_sri_lanka_struggle_ending_everywhere_unlock_effect:1 "Les mécaniques liées à la [RICE_sri_lanka_struggle|El] qui étaient auparavant restreintes à [GetGeographicalRegion('RICE_sri_lanka_struggle_region').GetName] sont désormais disponibles, quel que soit l'emplacement, pour les [rulers|El] de toute [faiths|El] bouddhiste avec la [doctrine|El] [GetFaithDoctrine('rice_theravada_canon_doctrine').GetBaseName]"
 RICE_sri_lanka_struggle_ending_county_bonus_effect:1 "Chaque [county|El] de [GetPlayer.GetCapitalLocation.GetCounty.GetTitle.GetDeJureLiege.GetName] obtient le [county_modifier|El] [GetModifier('RICE_sri_lanka_new_center_of_buddhism').GetNameWithTooltip]"
 RICE_sri_lanka_struggle_ending_uniter_outsider_doctrine_effect_tt:1 "Les [faiths|El] bouddhistes avec la [doctrine|El] [GetFaithDoctrine('rice_theravada_canon_doctrine').GetBaseName] obtiennent la [doctrine|El] [GetFaithDoctrine('rice_theravada_outsider_doctrine').GetBaseName]"
 RICE_sri_lanka_struggle_ending_foreign_sangha_decision_confirm:0 "Raviver la $RICE_sri_lanka_struggle$"
 RICE_sri_lanka_not_in_sri_lanka_req:0 "Vous ne possédez #N pas#! de [county|El] dans [GetGeographicalRegion('RICE_sri_lanka_struggle_region').GetName]"
 RICE_sri_lanka_struggle_not_involved:0 "Vous n'êtes #N pas#! [struggle_involved|El] dans la [RICE_sri_lanka_struggle|El]"
 RICE_sri_lanka_struggle_no_kings_req:0 "Aucun autre [rulers|El] qui sont [struggle_involved|El] ou un [struggle_interloper|El] dans la [RICE_sri_lanka_struggle|El] ne sont de [rank|El] [king|El] ou [emperor|El]"

 # Decisions
 RICE_sri_lanka_choose_monastic_sect:0 "S'aligner sur un monastère sri-lankais"
 RICE_sri_lanka_choose_monastic_sect_united:0 "S'aligner avec un [GetPlayer.Custom('RICE_sri_lanka_unified_monastery')]"
 RICE_sri_lanka_choose_monastic_sect_tooltip:0 "Choisissez de soutenir officiellement l'un des trois principaux [RICE_sri_lanka_monasteries|El] au [GetPlayer.Custom('RICE_sri_lanka_sangha_location')]."
 RICE_sri_lanka_choose_monastic_sect_desc:0 "La [RICE_sri_lanka_sangha|El] au [GetPlayer.Custom('RICE_sri_lanka_sangha_location')] est divisée en de nombreux monastères. Les trois plus importants - le [mahavihara|El], l'[abhayagiri|El] et le [jetavana|El] - exercent un pouvoir séculier et religieux considérable. Il pourrait être mutuellement bénéfique que je soutienne ouvertement l'un d'entre eux, augmentant ainsi sa [RICE_sri_lanka_prominence|El]."
 RICE_sri_lanka_choose_monastic_sect_united_desc:0 "La [RICE_sri_lanka_sangha|El] au [GetPlayer.Custom('RICE_sri_lanka_sangha_location')] est dominée par le monastère [GetPlayer.Custom('RICE_sri_lanka_unified_monastery_game_concept')], qui détient un grand pouvoir séculier et religieux. Il pourrait être mutuellement bénéfique que je le soutienne ouvertement, augmentant ainsi sa [RICE_sri_lanka_prominence|El]."
 RICE_sri_lanka_choose_monastic_sect_confirm:0 "Il est temps de soutenir un monastère !"
 RICE_sri_lanka_choose_monastic_sect_effect_tooltip_1:0 "Vous choisirez quel [trait|El] obtenir entre [GetTrait('RICE_mahavihara_trait').GetName( GetNullCharacter )], [GetTrait('RICE_abhayagiri_trait').GetName( GetNullCharacter )], et [GetTrait('RICE_jetavana_trait').GetName( GetNullCharacter )]"
 RICE_sri_lanka_choose_monastic_sect_effect_tooltip_2:0 "Vous pourrez accéder aux [decisions|El] pour soutenir votre [RICE_sri_lanka_monastery|El] choisi, et augmenter sa [RICE_sri_lanka_prominence|El], ce qui est important si vous souhaitez résoudre les conflits au sein de la [RICE_sri_lanka_struggle|El]"
 RICE_sri_lanka_choose_monastic_sect_context_tooltip:0 "#emphasis Contexte historique :#! Durant l'Antiquité tardive et la période médiévale, la communauté monastique bouddhiste du Sri Lanka, le #italic Sangha#!, était dominée par trois monastères et sectes : le Mahavihara, l'Abhayagiri et le Jetavana. Ces trois institutions rivalisèrent pour obtenir le patronage des royaux et d'autres élites pendant des siècles, jusqu'à ce qu'elles soient unifiées sous le Mahavihara en 1165 dans le cadre de réformes religieuses soutenues par le roi Parakramabahu Ier. La mesure dans laquelle il s'agissait réellement d'une victoire éclatante pour le Mahavihara, ou d'une continuation plus subtile de tendances graduelles, reste débattue."
 RICE_sri_lanka_change_monastic_sect:0 "S'aligner sur un autre monastère sri-lankais"
 RICE_sri_lanka_change_monastic_sect_united:0 "S'aligner avec un autre [GetPlayer.Custom('RICE_sri_lanka_unified_monastery')]"
 RICE_sri_lanka_change_monastic_sect_tooltip:0 "$RICE_sri_lanka_choose_monastic_sect_tooltip$"
 RICE_sri_lanka_change_monastic_sect_desc:0 "La [RICE_sri_lanka_sangha|El] au [GetPlayer.Custom('RICE_sri_lanka_sangha_location')] est divisée en de nombreux [RICE_sri_lanka_monasteries|El], les trois plus importants étant le [mahavihara|El], l'[abhayagiri|El] et le [jetavana|El]. Je patronne actuellement [GetPlayer.Custom('RICE_sri_lanka_patronized_monastery')], mais je souhaite transférer mon patronage à un autre monastère."
 RICE_sri_lanka_change_monastic_sect_united_desc:0 "La [RICE_sri_lanka_sangha|El] au [GetPlayer.Custom('RICE_sri_lanka_sangha_location')] est formellement uni sous la direction du monastère [GetPlayer.Custom('RICE_sri_lanka_unified_monastery_game_concept')]. Il serait sage de changer mon allégeance religieuse officielle et de les patronner."
 RICE_sri_lanka_change_monastic_sect_confirm:0 "Mon appartenance religieuse doit changer !"
 RICE_sri_lanka_change_monastic_sect_effect_tooltip_1:0 "Vous choisirez le [trait|El] [GetTrait('RICE_abhayagiri_trait').GetName( GetNullCharacter )] ou [GetTrait('RICE_jetavana_trait').GetName( GetNullCharacter )]"
 RICE_sri_lanka_change_monastic_sect_effect_tooltip_2:0 "Vous choisirez le [trait|El] [GetTrait('RICE_mahavihara_trait').GetName( GetNullCharacter )] ou [GetTrait('RICE_jetavana_trait').GetName( GetNullCharacter )]"
 RICE_sri_lanka_change_monastic_sect_effect_tooltip_3:0 "Vous choisirez le [trait|El] [GetTrait('RICE_mahavihara_trait').GetName( GetNullCharacter )] ou [GetTrait('RICE_abhayagiri_trait').GetName( GetNullCharacter )]"
 RICE_sri_lanka_change_monastic_sect_effect_tooltip_4:0 "$RICE_sri_lanka_choose_monastic_sect_effect_tooltip_2$"
 RICE_sri_lanka_change_monastic_sect_effect_tooltip_5:0 "@warning_icon!#X Vous perdrez toute l'[trait_level_track_xp|El] pour le [trait|El] de [RICE_sri_lanka_monastery|El] que vous possédez actuellement !#!"
 RICE_sri_lanka_change_monastic_sect_context_tooltip:0 "$RICE_sri_lanka_choose_monastic_sect_context_tooltip$"
 RICE_india_land_grant_decision:0 "Accorder des terres aux temples et monastères"
 RICE_india_land_grant_decision_tooltip:0 "Accorder des [RICE_grants|El] exempts de revenus à des institutions religieuses $buddhism_religion_adj$, $hinduism_religion_adj$ ou $jainism_religion_adj$"
 RICE_india_land_grant_decision_desc:0 "Je souhaite faire don de certaines terres que je possède à des temples et monastères locaux au [GetGeographicalRegion('world_india').GetName], qu'ils soient [ROOT.Char.GetFaith.GetReligion.GetAdherentNamePlural] ou non, car ils jouent un rôle important dans la mise en valeur des territoires non développés de nos frontières. Désormais, dans le cadre de cette [RICE_land_grant|El], ces terres et leurs revenus leur appartiendront."
 RICE_india_land_grant_decision_confirm:0 "Préparez l'octroi de terres !"
 RICE_india_land_grant_decision_effect_tooltip_1:0 "Vous choisirez de concéder des terres à des institutions d'une [religion|El] dharmique dans votre [domain|El]"
 RICE_india_land_grant_decision_effect_tooltip_2:0 "Chaque [county|El] que vous possédez directement reçoit un [county_modifier|El] réduisant les [tax|El] mais augmentant le [development_growth|El], avec un effet plus fort dans les [counties|El] possédant au moins une [church_holding|El]"
 RICE_india_land_grant_decision_effect_tooltip_3:0 "Si vous suivez une [faith|El] de la [religion|El] dharmique que vous avez choisie, le [modifier|El] accorde un bonus d'[county_opinion|El] ; si vous ne suivez pas la même [religion|El], il accorde un bonus de [development_growth|El] à la place"
 RICE_india_land_grant_decision_effect_tooltip_4:0 "Il y a une très faible chance que vos [counties|El] se convertissent à une [faith|El] aléatoire de la [religion|El] que vous avez choisie"
 RICE_india_land_grant_decision_effect_tooltip_5:0 "Vous gagnerez jusqu'à un maximum de #V 300#! [piety_i|El] [piety|El] et [prestige_i|El] [prestige|El], en fonction du nombre de [counties|El] affectés et du nombre ayant des [church_holdings|El]"
 RICE_india_land_grant_decision_context_tooltip:0 "#emphasis Contexte historique :#! Les concessions de terres aux institutions religieuses étaient une pratique importante et récurrente dans l'histoire indienne durant l'Antiquité tardive et la période médiévale. Celles-ci pouvaient aller de parcelles de terres individuelles à des villages entiers. Les souverains parrainaient de nombreuses sectes différentes, et ces concessions étaient perçues comme un outil pour étendre leur influence - ainsi que celle des institutions religieuses - dans des terres frontalières qui n'étaient auparavant que faiblement contrôlées, voire pas du tout."
 RICE_india_land_grant_type:0 "Choisir les personnes à qui accorder des terres"
 RICE_india_land_grant_type_gui:0 "Choisissez qui recevra la [RICE_land_grant|El]"
 RICE_india_land_grant_buddhism_option:0 "#Bold $buddhism_religion_adherent_plural|U$#!"
 RICE_india_land_grant_buddhism_option_desc:0 "$RICE_india_land_grant_buddhism_option$"
 RICE_india_land_grant_buddhism_option_tooltip:0 "$EFFECT_LIST_BULLET$Gain du [character_modifier|El] [GetModifier('RICE_india_land_grant_buddhist_character_modifier').GetNameWithTooltip] pour #V 10#! ans\n$EFFECT_LIST_BULLET$Chaque [county|El] $buddhism_religion_adj$ gagne un [county_modifier|El] réduisant les [tax|El] mais augmentant la [development_growth|El]\n$EFFECT_LIST_BULLET$Si vous ne suivez pas une [faith|El] $buddhism_religion_adj$, le [modifier|El] accorde de la [development_growth|El] supplémentaire. Si c'est le cas, il accorde de l'[county_opinion|El] supplémentaire."
 RICE_india_land_grant_hinduism_option:0 "#Bold $hinduism_religion_adherent_plural|U$#!"
 RICE_india_land_grant_hinduism_option_desc:0 "$RICE_india_land_grant_hinduism_option$"
 RICE_india_land_grant_hinduism_option_tooltip:0 "$EFFECT_LIST_BULLET$Gain du [character_modifier|El] [GetModifier('RICE_india_land_grant_hindu_character_modifier').GetNameWithTooltip] pour #V 10#! ans\n$EFFECT_LIST_BULLET$Chaque [county|El] $hinduism_religion_adj$ gagne un [county_modifier|El] réduisant les [tax|El] mais augmentant la [development_growth|El]\n$EFFECT_LIST_BULLET$Si vous ne suivez pas une [faith|El] $hinduism_religion_adj$, le [modifier|El] accorde de la [development_growth|El] supplémentaire. Si c'est le cas, il accorde de l'[county_opinion|El] supplémentaire."
 RICE_india_land_grant_jainism_option:0 "#Bold $jainism_religion_adherent_plural|U$#!"
 RICE_india_land_grant_jainism_option_desc:0 "$RICE_india_land_grant_jainism_option$"
 RICE_india_land_grant_jainism_option_tooltip:0 "$EFFECT_LIST_BULLET$Gain du [character_modifier|El] [GetModifier('RICE_india_land_grant_jain_character_modifier').GetNameWithTooltip] pour #V 10#! ans\n$EFFECT_LIST_BULLET$Chaque [county|El] $jainism_religion_adj$ gagne un [county_modifier|El] réduisant les [tax|El] mais augmentant la [development_growth|El]\n$EFFECT_LIST_BULLET$Si vous ne suivez pas une [faith|El] $jainism_religion_adj$, le [modifier|El] accorde de la [development_growth|El] supplémentaire. Si c'est le cas, il accorde de l'[county_opinion|El] supplémentaire."
 RICE_sri_lanka_support_monastery:0 "Soutenir la Sangha de Sri Lanka"
 RICE_sri_lanka_support_monastery_all:0 "Soutenir la Sangha [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip|U]"
 RICE_sri_lanka_support_monastery_tooltip:0 "Soutenir [RICE_sri_lanka_s_sangha|El] par divers moyens"
 RICE_sri_lanka_support_monastery_desc:0 "[GetPlayer.Custom('RICE_sri_lanka_sangha_location')] abrite peut-être plusieurs puissants [RICE_sri_lanka_monasteries|El] bouddhistes, mais nous avons lié notre sort au [ROOT.Char.Custom('RICE_sri_lanka_patronized_monastery_game_concept')]. Il serait sage de notre part de soutenir cette secte afin qu'elle reste influente au sein de la [RICE_sri_lanka_sangha|El]."
 RICE_sri_lanka_support_monastery_desc_no_monastery:0 "[GetPlayer.Custom('RICE_sri_lanka_sangha_location')] abrite plusieurs puissants [RICE_sri_lanka_monasteries|El] bouddhistes. Si nous décidions de soutenir l'un d'entre eux, nous serions en mesure de les appuyer afin d'accroître notre influence au sein de la [RICE_sri_lanka_sangha|El] bouddhiste."
 RICE_sri_lanka_support_monastery_confirm:0 "Puisse cela m'apporter un grand mérite !"
 RICE_sri_lanka_support_monastery_effect_tooltip_1:0 "Vous choisirez comment soutenir les monastères au [RICE_sri_lanka_short|El] et obtiendrez divers bienfaits ; en particulier, cela #P augmentera#! la [RICE_sri_lanka_prominence|El] du [RICE_sri_lanka_monastery|El] que vous patronnez"
 RICE_sri_lanka_support_monastery_context_tooltip:0 "$RICE_sri_lanka_choose_monastic_sect_context_tooltip$"
 RICE_sri_lanka_support_monastery_type:0 "Choisissez le type de soutien"
 RICE_sri_lanka_support_monastery_gui:0 "Choisissez comment vous soutiendrez [RICE_sri_lanka_s_sangha|El]"
 RICE_sri_lanka_support_monastery_almsgiving_option:0 "#Bold Aumône#!"
 RICE_sri_lanka_support_monastery_almsgiving_option_desc:0 "$RICE_sri_lanka_support_monastery_almsgiving_option$"
 RICE_sri_lanka_support_monastery_almsgiving_option_tooltip:0 "Coût : @gold_icon! #V #Bold [GetPlayer.MakeScope.ScriptValue('RICE_sri_lanka_support_small_cost')|0]#!#!\n\n$EFFECT_LIST_BULLET$Gain de [piety_i|El] #V 75#!\n$EFFECT_LIST_BULLET$Gain de [prestige_i|El] #V 25#!\n$EFFECT_LIST_BULLET$Gain de #V [GetPlayer.MakeScope.ScriptValue('RICE_sri_lanka_patron_trait_gain_minor')|0]#! [trait_level_track_xp|El] dans votre [trait|El] de [RICE_sri_lanka_monastery|El]\n$EFFECT_LIST_BULLET$Votre [RICE_sri_lanka_monastery|El] patronné gagne #V [GetPlayer.MakeScope.ScriptValue('RICE_sri_lanka_prominence_gain_minor')|0]#! [RICE_sri_lanka_prominence|El]\n$EFFECT_LIST_BULLET$Gain de [prestige_i|El] #V 25#! pour chaque niveau de [piety_level|El] que vous avez"
 RICE_sri_lanka_support_monastery_gavu_pillars_option:0 "#Bold Piliers Gavu#!"
 RICE_sri_lanka_support_monastery_gavu_pillars_option_desc:0 "$RICE_sri_lanka_support_monastery_gavu_pillars_option$"
