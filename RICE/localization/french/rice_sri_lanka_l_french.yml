 RICE_sri_lanka_worship_local_deities_saman_option:0 "#Bold [GetPlayer.Custom('RICE_saman')]#!\n$RICE_sri_lanka_worship_local_deities_saman_option_desc$"
 RICE_sri_lanka_worship_local_deities_saman_option_desc:0 "Le dieu qui habite la montagne sacrée Sri Pada"
 RICE_sri_lanka_worship_local_deities_saman_option_tooltip:0 "$EFFECT_LIST_BULLET$Gain du [character_modifier|El] [GetModifier('RICE_sri_lanka_saman').GetNameWithTooltip]"
 RICE_sri_lanka_worship_local_deities_pattini_option:0 "#Bold [GetPlayer.Custom('RICE_pattini')]#!\n$RICE_sri_lanka_worship_local_deities_pattini_option_desc$"
 RICE_sri_lanka_worship_local_deities_pattini_option_desc:0 "La déesse guérisseuse qui défend les faibles"
 RICE_sri_lanka_worship_local_deities_pattini_option_tooltip:0 "$EFFECT_LIST_BULLET$Gain du [character_modifier|El] [GetModifier('RICE_sri_lanka_pattini').GetNameWithTooltip]"
 RICE_sri_lanka_worship_local_deities_natha_option:0 "#Bold [GetPlayer.Custom('RICE_natha')]#!\n$RICE_sri_lanka_worship_local_deities_natha_option_desc$"
 RICE_sri_lanka_worship_local_deities_natha_option_desc:0 "Le dieu des cieux qui veut sauver tout le monde"
 RICE_sri_lanka_worship_local_deities_natha_option_tooltip:0 "$EFFECT_LIST_BULLET$Gain du [character_modifier|El] [GetModifier('RICE_sri_lanka_natha').GetNameWithTooltip]"
 RICE_sri_lanka_make_culture_or_faith_involved_in_sri_lanka:0 "Attirer davantage de monastiques [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip|l] [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip]"
 RICE_sri_lanka_make_culture_or_faith_involved_in_sri_lanka_tooltip:0 "Nous avons besoin de plus de monastiques dans la [RICE_sri_lanka_struggle|El] auxquels mon peuple et moi pouvons nous identifier"
 RICE_sri_lanka_make_culture_or_faith_involved_in_sri_lanka_desc:0 "[GetGeographicalRegion('RICE_sri_lanka_alt_region').GetName] manque de monastiques [ROOT.Char.GetFaith.GetAdherentNamePlural] d'origine [ROOT.Char.GetCulture.GetName]. Si nous avions davantage de monastiques bouddhistes qui nous comprennent sur l'île, nous pourrions améliorer nos relations et devenir plus [struggle_involved|El], dans la [RICE_sri_lanka_struggle|El]."
 RICE_sri_lanka_make_culture_or_faith_involved_in_sri_lanka_confirm:0 "La #italic Sangha#! de l'île prospérera !"
 RICE_sri_lanka_make_culture_or_faith_involved_in_sri_lanka_effect_tooltip_1:0 "La [holding|El] de [GetTitleByKey('b_polonnaruwa').GetNameNoTier] obtient instantanément une [GetBuilding('generic_university').GetName] si aucun autre [special_building|El] ne s'y trouve actuellement"
 RICE_sri_lanka_make_culture_or_faith_involved_in_sri_lanka_effect_tooltip_2:0 "Vous choisirez de renommer ou non la capitale en #bold Vijayarajapura#!"
 RICE_sri_lanka_make_culture_or_faith_involved_in_sri_lanka_context_tooltip:0 "#emphasis Contexte historique :#! Bien que le Sri Lanka soit souvent présenté comme un bastion de la forme cinghalaise et theravada du bouddhisme, historiquement, les bouddhistes de l'île ont été influencés par d'autres bouddhistes de la région. Il existe des preuves de pratiques Mahayana et Vajrayana dans la période ancienne et médiévale, et les monastères de l'île interagissaient avec d'autres institutions bouddhistes dans des pays tels que la Birmanie et l'Indonésie. Selon la légende, par exemple, après la réunification du Sri Lanka au XIe siècle, le roi Vijayabahu Ier a dû inviter des moines birmans au Sri Lanka pour l'aider à reconstruire sa communauté bouddhiste."

