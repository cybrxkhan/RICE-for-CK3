 sri_lanka.0040.t:0 "Prières et chants cérémoniels"
 sri_lanka.0040.desc:0 "J'ai décidé d'organiser une cérémonie de prière [ROOT.Char.GetFaith.GetAdjective] pour demander l'aide divine. Le chant des hymnes cérémoniels emplit tout [ROOT.Char.GetFaith.HouseOfWorship] alors que nous vénérons l'une des grandes divinités gardiennes du [GetGeographicalRegion('RICE_sri_lanka_alt_region').GetName] :"
 sri_lanka.0040.desc.upulvan:0 "#bold [GetPlayer.Custom('RICE_upulvan')]#!.\n\n#italic Portant le bel arc doré,\nDont la lumière glorieuse rayonne alentour,\nAvec l'aura divine bleutée aux langues de feu,\nÔ [GetPlayer.Custom('RICE_upulvan')] ! daignez nous honorer de votre présence en ce bosquet fleuri.\n\nPortant la couronne dorée, les ornements divins et le vêtement teinté de bleu,\nAvec l'arc doré dans votre main puissante,\nEt portant la guirlande de gemmes dorées dans la main droite,\nÔ puissant [GetPlayer.Custom('RICE_upulvan')], montez sur votre oiseau garuda et honorez-nous de votre présence.#!"
 sri_lanka.0040.desc.kataragama:0 "#bold [GetPlayer.Custom('RICE_kataragama')]#!.\n\n#italic Le puissant dieu [GetPlayer.Custom('RICE_kataragama')] a six visages,\nVictorieux, il possède par ses efforts passés la gloire de la lune brillante.\nDe sa main droite, il a montré de grands pouvoirs,\nLe dieu aux yeux célestes de Ruhuna, honorez-nous de votre présence sur ce siège floral.\n\nIl arrive avec son étendard de forme Asura,\nEt assis sur son Paon, il contemple les offrandes florales,\nIl traverse les districts solidement gardés et déverse des pluies de bénédictions.\nEt ici nous offrons au dieu des fleurs, des parfums et des feuilles de bétel.#!"
 sri_lanka.0040.desc.saman:0 "#bold [GetPlayer.Custom('RICE_saman')]#!.\n\n#italic Le Dieu qui demeure toujours au sommet de Sri Pada,\nEt vénère avec adoration l'empreinte sacrée qui s'y trouve\nLe maître de la prospérité, le divin Roi [GetPlayer.Custom('RICE_saman')] dont l'autorité incontestée\nSe plaît toujours à vous protéger du mal.\n\nParé d'armes dorées, d'arcs et de flèches dorés,\nEt entouré d'un siège doré et d'un parasol de perles,\nAu son de musiques raffinées, de tambours et de conques\nIci nous préparons le siège de gemmes de fleurs en offrande pour lui.#!"
 sri_lanka.0040.desc.pattini:0 "#bold [GetPlayer.Custom('RICE_pattini')]#!.\n\n#italic Quand elle frappa, la cité s'embrasa,\nEt les bouches de ceux qui ne la croyaient pas se mirent à brûler,\nLe pouvoir de [GetPlayer.Custom('RICE_pattini')] a été démontré ici,\nLe palais brûla et ne fut plus qu'un tas de cendres.\n\nLes dieux de la forêt se rassemblèrent dans leur gloire,\nEt une lente averse de pluie ils firent tomber,\nLa déesse de la Terre tel un torrent rugissant porta témoignage,\nEt c'est ainsi que le feu de la cité de Madura fut éteint.#!"
 sri_lanka.0040.desc.natha:0 "#bold [GetPlayer.Custom('RICE_natha')]#!.\n\n#italic Il porte dans sa main droite le pot orné de gemmes,\nObservant les signes du ciel de Tusita\nÉmergeant comme une lune à travers un nuage,\nDepuis la porte du Sud il arrive à l'arche florale.\n\nÉtant en charge de la cité inférieure de Kelaniya à Lanka,\nSoumettant les esprits maléfiques par ses pouvoirs glorieux,\nAyant obtenu la permission de devenir un Bouddha dans l'âge futur,\nLe grand Joyau [GetPlayer.Custom('RICE_natha')] dieu arrive du ciel.#!"
 sri_lanka.0040.a:0 "Puissent nos prières être exaucées !"
 sri_lanka.0040.upulvan.tooltip:0 "\n#emphasis Contexte historique :#! Le texte de l'événement présente un extrait d'un chant religieux enregistré par l'érudit et écrivain cinghalais W.A. de Silva en 1920 au sujet de la divinité Upulvan, qui, de nos jours, est souvent associée au dieu hindou Vishnu, ou Perumal, comme l'appellent les Tamouls. On dit qu'il est de couleur bleue et que le Bouddha l'a chargé de protéger le Sri Lanka.\n\nL'histoire d'Upulvan fait l'objet d'un vif débat parmi les érudits ; certains pensent qu'il était à l'origine associé au bodhisattva bouddhiste Avalokiteshvara, aux figures védiques Varuna ou Rama, ou même au dieu zoroastrien Ahura Mazda, ou soutiennent qu'il est d'origine indigène sri-lankaise. Par souci de simplicité, Upulvan est ici associé à Vishnu.\n"
 sri_lanka.0040.kataragama.tooltip:0 "\n#emphasis Contexte historique :#! Le texte de l'événement présente un extrait d'un chant religieux enregistré par le savant et écrivain cingalais W.A. de Silva en 1920 à propos de la divinité Kataragama, tel qu'il est connu en cingalais, ou Murugan, tel qu'il est connu en tamoul. C'est un dieu de la guerre, dit avoir six visages et souvent représenté chevauchant un paon.\n\nUn temple dédié à Kataragama dans le sud du Sri Lanka est un lieu de pèlerinage notable fréquenté par des dévots de multiples confessions, dont des hindous, des bouddhistes, des Veddas, des musulmans, et d'autres encore, mais il est devenu de plus en plus dominé par les bouddhistes au cours des dernières décennies, soulevant des questions et des débats sur le culte de Kataragama/Murugan à l'époque actuelle.\n"
 sri_lanka.0040.saman.tooltip:0 "\n#emphasis Contexte historique :#! Le texte de l'événement présente un extrait d'un chant religieux enregistré par le savant et écrivain cingalais W.A. de Silva en 1920 à propos de la divinité Saman, qui est considérée comme la divinité protectrice de Sri Pada, une montagne du centre du Sri Lanka considérée comme sacrée par plusieurs religions.\n\nSelon la légende bouddhiste, lorsque le Bouddha visita le Sri Lanka, il laissa une empreinte de pied à Sri Pada à la demande de Saman, afin que les gens aient quelque chose à vénérer en l'absence du Bouddha. En revanche, les hindous croient que la célèbre empreinte de pied dans la roche a été faite par Shiva, tandis que les chrétiens et les musulmans croient qu'elle a été faite par Adam.\n"
 sri_lanka.0040.pattini.tooltip:0 "\n#emphasis Contexte historique :#! Le texte de l'événement présente un extrait d'un chant religieux enregistré par le savant et écrivain cingalais W.A. de Silva en 1920 à propos de la déité Pattini, équivalente à la déesse tamoule Kannaki Amman. Elle est la divinité féminine la plus importante du Sri Lanka, et peut-être l'une des divinités les plus aimées de l'île dans son ensemble.\n\nLa légende raconte qu'elle fut autrefois une femme mortelle qui souffrit d'avoir un mari faible et infidèle, qui dilapida tout leur argent auprès d'une courtisane ; lorsqu'il tenta de se racheter, il fut injustement exécuté par le roi de la cité de Madura. Elle se transforma alors en déesse courroucée et, de rage, arracha l'un de ses seins et le lança sur la cité, la faisant s'embraser. Malgré cet incident violent, elle finit par se rendre au Sri Lanka où elle devient une déesse de la guérison et la protectrice des faibles et des malades.\n"
 sri_lanka.0040.natha.tooltip:0 "\n#emphasis Contexte historique :#! Le texte de l'événement présente un extrait d'un chant religieux enregistré par l'érudit et écrivain cingalais W.A. de Silva en 1920 à propos de la divinité Natha. Il est la version sri-lankaise d'Avalokitesvara, l'un des Bodhisattvas ou divinités bouddhistes les plus populaires, qui prend de nombreuses formes et variations, comme la « Déesse de la Miséricorde » chinoise Guanyin.\n\nMalgré ses origines en tant que version régionale d'Avalokitesvara, Natha est désormais souvent associé à Maitreya, qui serait le prochain Bouddha à venir.\n"
