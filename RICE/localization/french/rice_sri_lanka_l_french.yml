 RICE_sri_lanka_vijayabahu_reward_budal:0 "Accorder des privilèges à Budal"
 RICE_sri_lanka_vijayabahu_reward_budal_tooltip:0 "Nous n'aurions pas pu survivre sans les efforts vaillants de Budal."
 RICE_sri_lanka_vijayabahu_reward_budal_desc:0 "Jeune prince, je n'étais qu'un enfant contraint de survivre dans la nature et de fuir les envahisseurs Chola. Budal a été mon protecteur et mon guide pendant ces périodes difficiles. Il est juste que je lui accorde, ainsi qu'à ses descendants, l'exemption de toute forme de punition et de représailles."
 RICE_sri_lanka_vijayabahu_reward_budal_confirm:0 "Je lui en suis éternellement reconnaissant[ROOT.Char.Custom('FR_E')] !"
 RICE_sri_lanka_vijayabahu_reward_budal_effect_tooltip_1:0 "Budal recevra un [artifact|El] spécial, la plaque de cuivre de Panakaduwa, un document incarnant cet ordre extraordinaire"
 RICE_sri_lanka_vijayabahu_reward_budal_effect_tooltip_2:0 "Budal obtiendra un [perpetual_hook|El] sur vous"
 RICE_sri_lanka_vijayabahu_reward_budal_context_tooltip:0 "#emphasis Contexte historique :#! Après leur conquête du Sri Lanka en 1017 de notre ère, les Cholas luttent pour affirmer leur autorité sur l'île. Durant cette période chaotique, le jeune Vijayabahu, cousin éloigné de l'ancienne famille royale, était constamment en fuite devant les armées Chola. Le guerrier et général Budal fut l'un des premiers soutiens et protecteurs de Vijayabahu. Après la victoire de Vijayabahu sur les Cholas en 1070, il accorda à Budal et à ses descendants de nombreux privilèges légaux en 1082 ou 1083. Ces privilèges ont été consignés sur la plaque de cuivre dite de Panakaduwa, découverte en 1948."
 RICE_sri_lanka_is_vijayabahu_req:0 "Est Vijayabahu"
 RICE_sri_lanka_is_vijayabahu_dead_req:0 "Vijayabahu est mort"
 RICE_sri_lanka_is_vijayabahu_dynasty_req:0 "Appartient à la même [dynasty|El] que Vijayabahu"
 RICE_sri_lanka_is_budal_dead_req:0 "Budal est vivant"
 RICE_sri_lanka_polonnaruwa_capital:0 "Déplacement de la capitale à Polonnaruwa"
 RICE_sri_lanka_polonnaruwa_capital_tooltip:0 "Une nouvelle capitale doit être établie pour $k_lanka$"
 RICE_sri_lanka_polonnaruwa_capital_desc:0 "[GetTitleByKey('b_anuradhapura').GetNameNoTier], l'ancienne capitale du [GetGeographicalRegion('RICE_sri_lanka_alt_region').GetName], est en ruines. Des années de guerres et d'instabilité politique ont laissé leurs traces. Désormais, avec la réunification de l'île, nous ne pouvons nous attarder sur les décombres de gloires passées : [GetTitleByKey('b_polonnaruwa').GetNameNoTier] ferait une bien meilleure capitale, plus facile à défendre."
 RICE_sri_lanka_polonnaruwa_capital_confirm:0 "Préparez-vous au grand mouvement !"
 RICE_sri_lanka_polonnaruwa_capital_effect_tooltip_1:0 "La [holding|El] de [GetTitleByKey('b_polonnaruwa').GetNameNoTier] obtient instantanément une [GetBuilding('generic_university').GetName] si aucun autre [special_building|El] ne s'y trouve actuellement"
 RICE_sri_lanka_polonnaruwa_capital_effect_tooltip_2:0 "Vous choisirez de renommer la capitale en #bold Vijayarajapura#!"
 RICE_sri_lanka_polonnaruwa_capital_context_tooltip:0 "#emphasis Contexte historique :#! Bien que les preuves archéologiques suggèrent que la conquête du Sri Lanka par les Chola au XIe siècle n'a pas causé une destruction aussi massive de l'ancienne capitale de l'île, Anuradhapura, que le prétendent les histoires des monastères bouddhistes, il est clair que la ville a connu un déclin considérable à la suite des invasions. Les Cholas ont fait de Polonnaruwa le centre politique, économique et religieux de l'île. Après que Vijayabahu eut expulsé les Cholas du Sri Lanka, il fit de Polonnaruwa, plus défendable, sa capitale, plutôt que de retourner à Anuradhapura."
 RICE_sri_lanka_worship_local_deities:0 "Prier les divinités gardiennes du Sri Lanka"
 RICE_sri_lanka_worship_local_deities_tooltip:0 "Prier l'une des principales divinités gardiennes du $k_lanka$"
 RICE_sri_lanka_worship_local_deities_desc:0 "De nombreuses divinités sont vénérées au [GetGeographicalRegion('RICE_sri_lanka_alt_region').GetName], par les [ROOT.Char.GetFaith.GetAdherentNamePlural] ainsi que par ceux qui suivent d'autres [religions|El]. Les plus puissantes d'entre elles sont vénérées comme divinités gardiennes de l'île, et je devrais chercher leur aide."
 RICE_sri_lanka_worship_local_deities_confirm:0 "Préparez des offrandes de riz au lait !"
 RICE_sri_lanka_worship_local_deities_effect_tooltip_1:0 "Vous choisirez l'une des nombreuses divinités gardiennes et recevrez un [character_modifier|El] correspondant pour #V 10#! ans"
 RICE_sri_lanka_worship_local_deities_effect_tooltip_2:0 "La [RICE_sri_lanka_prominence|El] des [RICE_sri_lanka_monasteries|El] [RICE_sri_lanka_s|El] diminuera de #V [GetPlayer.MakeScope.ScriptValue('RICE_sri_lanka_prominence_loss_minor')|0]#!"
 RICE_sri_lanka_worship_local_deities_context_tooltip:0 "#emphasis Contexte historique :#! Pendant des siècles, les habitants du Sri Lanka ont vénéré diverses divinités communes, qu'ils soient bouddhistes ou hindous, cinghalais, tamouls ou véddas. Nombre de ces divinités étaient des formes syncrétisées de figures religieuses hindoues, bouddhistes et indigènes, connues sous des noms différents selon les communautés et souvent vénérées d'une manière distincte de celle de l'Inde continentale. Certains étaient même des personnages historiques sri-lankais, comme des rois, transformés en divinités. Pour les bouddhistes de l'île, si le Bouddha est considéré comme supérieur à ces divinités « inférieures », ces dernières sont souvent invoquées pour des préoccupations plus mondaines."
 RICE_sri_lanka_worship_local_deities_type:0 "Choisir une divinité à prier"
 RICE_sri_lanka_worship_local_deities_gui:0 "Choisir la divinité à prier"
 RICE_sri_lanka_worship_local_deities_upulvan_option:0 "#Bold [GetPlayer.Custom('RICE_upulvan')]#!\n$RICE_sri_lanka_worship_local_deities_upulvan_option_desc$"
 RICE_sri_lanka_worship_local_deities_upulvan_option_desc:0 "Le dieu à la peau bleue qui protège $k_lanka$"
 RICE_sri_lanka_worship_local_deities_upulvan_option_tooltip:0 "$EFFECT_LIST_BULLET$Gain du [character_modifier|El] [GetModifier('RICE_sri_lanka_upulvan').GetNameWithTooltip]"
 RICE_sri_lanka_worship_local_deities_kataragama_option:0 "#Bold [GetPlayer.Custom('RICE_kataragama')]#!\n$RICE_sri_lanka_worship_local_deities_kataragama_option_desc$"
 RICE_sri_lanka_worship_local_deities_kataragama_option_desc:0 "Le puissant dieu de la guerre qui repousse les ennemis"
