 sri_lanka.0014.t:0 "Récompenser [budal.GetTitledFirstNameNoTooltip]"
 sri_lanka.0014.desc.not_vijayabahu_intro:0 "Il y a des années, quand [vijayabahu.GetTitledFirstName] n'était qu'un jeune enfant, son avenir était des plus incertains, avec les envahisseurs Chola et les seigneurs de guerre locaux constituant une menace permanente pour sa sécurité. Durant ces années critiques, la plus grande des vaillantes personnes qui le protégèrent fut [budal.GetTitledFirstName].\n\nC'est grâce à l'aide de [budal.GetFirstNamePossessiveNoTooltip] que le [GetGeographicalRegion('RICE_sri_lanka_alt_region').GetName] put être réunifié."
 sri_lanka.0014.desc.not_budal_reward:0 "[budal.Custom('FR_LuiElle')] et ses descendants jouissent de privilèges juridiques et politiques extraordinaires à perpétuité.\n\nCes privilèges ont été inscrits sur une plaque de cuivre et formellement envoyés à [budal.GetFirstNameNoTooltip], afin que nul ne puisse les contester."
 sri_lanka.0014.desc.vijayabahu:0 "Il y a des années, quand je n'étais qu'un simple Prince et un jeune enfant, mon avenir était des plus incertains, les envahisseurs Chola et les seigneurs de guerre locaux représentant une menace constante pour ma sécurité. Durant ces années critiques, la plus grande des personnes valeureuses qui m'ont protégé était [budal.GetTitledFirstName].\n\nSans l'aide de [budal.GetFirstNamePossessiveNoTooltip], je n'aurais pas survécu pour réunifier le [GetGeographicalRegion('RICE_sri_lanka_alt_region').GetName] et en devenir le roi. Aujourd'hui, en raison de ma grande dette envers [budal.GetFirstNameNoTooltip], et pour honorer ses immenses contributions, j'ai accordé $sri_lanka.0014.desc.not_budal_reward$"
 sri_lanka.0014.desc.vijayabahu_equivalent:0 "$sri_lanka.0014.desc.not_vijayabahu_intro$ Bien que je ne sois pas [vijayabahu.GetFirstNameNoTooltip], je souhaite tout de même reconnaître les accomplissements de [budal.GetFirstNamePossessiveNoTooltip] pour avoir apporté la paix et la stabilité à ces terres. Ainsi, j'ai accordé $sri_lanka.0014.desc.not_budal_reward$"
 sri_lanka.0014.desc.budal:0 "Il y a des années, quand [vijayabahu.GetTitledFirstName] n'était qu'un Prince, un jeune enfant, son avenir était des plus incertains, les envahisseurs Chola et les seigneurs de guerre locaux représentant une menace constante pour sa sécurité. Durant ces années critiques, j'ai fait tout mon possible pour [vijayabahu.GetHerHim] protéger de nos ennemis.\n\nJ'ai reçu la nouvelle que grâce à mes accomplissements pour apporter la paix et la stabilité à ces terres, [vijayabahu_equivalent.GetTitledFirstName] m'accorde, à moi et à mes descendants, des privilèges juridiques et politiques extraordinaires à perpétuité.\n\nCes privilèges ont été gravés sur une plaque de cuivre et m'ont été formellement envoyés, afin que nul ne puisse les contester."
 sri_lanka.0014.desc.other:0 "$sri_lanka.0014.desc.not_vijayabahu_intro$ Afin de reconnaître les grands accomplissements de [budal.GetFirstNamePossessiveNoTooltip], et, peut-être par sens du devoir, [vijayabahu_equivalent.GetTitledFirstNameNoTooltip] a accordé $sri_lanka.0014.desc.not_budal_reward$"
 sri_lanka.0014.a.not_budal:0 "Un[budal.Custom('FR_E')] grand[budal.Custom('FR_E')] [budal.GetWomanMan] mérite une grande récompense pour de grands exploits."
 sri_lanka.0014.a.budal:0 "Je suis honoré[budal.Custom('FR_E')] de recevoir une si belle récompense !"
 sri_lanka.0015.t:0 "Réservoirs d'irrigation"
 sri_lanka.0015.desc:0 "Les réservoirs d'irrigation sont des systèmes soigneusement conçus de bassins artificiels en [GetGeographicalRegion('world_india').GetName] qui ont fourni une source fiable d'eau pendant des siècles.\n\nJe souhaite travailler avec les institutions religieuses locales et d'autres membres éminents de la communauté pour construire un tel réservoir d'irrigation. Il pourvoira aux besoins des habitants, notamment l'agriculture, les bains, les rituels religieux, et bien plus encore. Le réservoir d'irrigation sera, bien entendu, également orné d'œuvres d'art glorifiant [ROOT.Char.GetFaith.HighGodName] et les mécènes, dont moi-même.\n\nMaintenant, quelle taille ce réservoir d'irrigation devrait-il avoir ?"
 sri_lanka.0015.a:0 "Petit"
 sri_lanka.0015.b:0 "Moyen"
 sri_lanka.0015.c:0 "Grand"
 sri_lanka.0015.d:0 "Immense"
 sri_lanka.0016.t:0 "Une nouvelle capitale"
 sri_lanka.0016.desc.vijayabahu:0 "Il est difficile d'imaginer comment, simple enfant il y a des années, j'ai dû endurer de nombreuses épreuves dans les contrées sauvages du [GetGeographicalRegion('RICE_sri_lanka_alt_region').GetName] alors que j'échappais aux redoutables armées Chola. Désormais, j'ai accompli l'objectif de toute une vie : rejeter le joug des Cholas, pacifier les seigneurs de guerre locaux et établir un nouveau royaume sur cette île."
 sri_lanka.0016.desc.not_vijayabahu:0 "Il est difficile d'imaginer que le chaos qui a suivi la chute de [GetTitleByKey('b_anuradhapura').GetNameNoTier] aux mains des armées Chola, lorsque des seigneurs de guerre locaux et des rois Chola se battaient pour le pouvoir, est terminé. Nous avons établi un nouveau royaume au [GetGeographicalRegion('RICE_sri_lanka_alt_region').GetName] sous mon autorité."
 sri_lanka.0016.desc:0 "\n\nHélas, l'ancienne capitale de [GetTitleByKey('b_anuradhapura').GetNameNoTier] est en grande partie en ruines. Bien que certains souhaitent que je la restaure dans sa gloire passée, elle n'est plus la cité magnifique qu'elle était autrefois. Même si c'était le cas, je crains de futures attaques de nos ennemis du sud de l'Inde, ou de seigneurs de guerre locaux rebelles. J'ai besoin d'une capitale que je puisse défendre.\n\n[GetTitleByKey('b_polonnaruwa').GetNameNoTier] fera donc une bien meilleure capitale. Les Cholas l'ont développée pour en faire le nouveau centre économique, culturel et politique de l'île, et elle est plus facile à défendre. Désormais, notre avenir repose sur [GetTitleByKey('b_polonnaruwa').GetNameNoTierNoTooltip] !"
 sri_lanka.0016.a:0 "Une nouvelle capitale mérite un nouveau nom : #bold Vijayarajapura#!!"
 sri_lanka.0016.b:0 "La ville et son nom sont excellents tels quels."
 sri_lanka.0016.c:0 "C'est un nouveau jour pour le [GetGeographicalRegion('RICE_sri_lanka_alt_region').GetNameNoTooltip]."
 sri_lanka.0016.d:0 "$sri_lanka.0016.c$"
 sri_lanka.0017.t:0 "Les [vedda.GetCollectiveNounNoTooltip|l] de [county.GetNameNoTierNoTooltip]"
 sri_lanka.0017.desc:0 "Les [vedda.GetCollectiveNoun|l] vivent au [GetGeographicalRegion('RICE_sri_lanka_alt_region').GetName] depuis très longtemps, peut-être avant tout autre peuple. De temps à autre, les [vedda.GetCollectiveNounNoTooltip|l] assistent de puissants dirigeants tels que moi-même pour diverses raisons.\n\nRécemment, j'ai cultivé des relations avec un chef [vedda.GetCollectiveNoun|l] à [county.GetNameNoTier], [courtier.GetFirstName]. Si je fais un effort pour améliorer les relations avec les [vedda.GetCollectiveNounNoTooltip|l] locaux par son intermédiaire, mes territoires pourraient prospérer alors qu'eux et mon peuple s'engagent dans le commerce, travaillent ensemble sur des projets de construction, et m'assistent même dans la lutte contre les bandits ou les rebelles qui osent attaquer mes territoires."
 sri_lanka.0017.a:0 "Travaillons avec les [vedda.GetCollectiveNounNoTooltip|l] de [county.GetNameNoTierNoTooltip] !"
 sri_lanka.0017.b:0 "Peut-être que [courtier.GetFirstNameNoTooltip] pourrait rester à ma cour, également."
 sri_lanka.0017.b.tooltip:0 "Le [county_modifier|El] durera plus longtemps si vous choisissez cette option"
 sri_lanka.0017.c:0 "Je n'ai pas de temps à consacrer à ces gens sauvages et étranges."
 sri_lanka.0018.t:0 "xxxxx"
 sri_lanka.0018.desc:0 "xxxxx"
 sri_lanka.0018.a:0 "xxxxx"
 sri_lanka.0019.t:0 "Attirer des monastiques [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip|l]"
 sri_lanka.0019.desc:0 "J'ai activement fait ma part pour soutenir la #italic Sangha#! [ROOT.Char.GetFaith.GetReligion.GetAdjective] du [GetGeographicalRegion('RICE_sri_lanka_alt_region').GetName]. Cependant, le nombre relativement faible de monastiques [ROOT.Char.GetFaith.GetAdherentNamePlural] [ROOT.Char.GetCulture.GetCollectiveNoun|l] sur l'île a été un obstacle au développement de ma relation avec l'établissement religieux de l'île, en particulier le [GetPlayer.Custom('RICE_sri_lanka_patronized_monastery')] que je patronne.\n\nJe travaille avec le [GetPlayer.Custom('RICE_sri_lanka_patronized_monastery')] pour avoir davantage de monastiques [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip|l] au [GetGeographicalRegion('RICE_sri_lanka_alt_region').GetName], que nous ordonnions des [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip|l] vivant ici qui désirent devenir des monastiques [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip], que nous fassions venir de tels monastiques de l'étranger, ou les deux. Ce faisant, j'espère que nous pourrons être encore plus impliqués dans la #italic Sangha#! de l'île.\n\nBien qu'il y aura sans doute quelques tensions au début, à mesure que ces nouveaux monastiques seront intégrés dans la communauté existante, je suis certain[ROOT.Char.Custom('FR_E')] qu'à long terme, cela ne fera que renforcer les fondations du [ROOT.Char.GetFaith.GetReligion.GetNameNoTooltip] au [GetGeographicalRegion('RICE_sri_lanka_alt_region').GetNameNoTooltip]."
 sri_lanka.0019.a:0 "Puisse le #italic Sangha#! croître et perdurer."
 sri_lanka.0020.t:0 "Les trois monastères"
 ## \n\nThe #bold Mahavihara#! are the oldest of the three monastic sects. They are [theravada.GetAdjective] traditionalists who are skeptical of newer ideas from India.\n\nThe #bold Abhayagiri#! are more innovative. They happily integrate Mahayana and Vajrayana concepts and practices into their [theravada.GetAdjective] beliefs.\n\nThe #bold Jetavana#!, lastly, are the newest sect, and also open to Mahayana and Vajrayana ideas."
 sri_lanka.0020.desc.sri_lankan:0 "Il est temps que je me range derrière l'un des principaux monastères [buddhism.GetAdherentNamePlural] en compétition pour l'influence au [GetPlayer.Custom('RICE_sri_lanka_sangha_location')]. Cela aura des ramifications politiques, je dois donc choisir avec soin."
 sri_lanka.0020.desc.non_sri_lankan:0 "[GetPlayer.Custom('RICE_sri_lanka_sangha_location')] abrite de puissants monastères [buddhism.GetAdherentNamePlural], et quelles que soient mes opinions personnelles, il pourrait être sage de me ranger du côté de l'un d'entre eux."
 sri_lanka.0020.desc:0 "\n\nLe #bold Mahavihara#!, la secte la plus ancienne, est composé de traditionalistes qui rejettent ce qu'ils considèrent comme des idées non orthodoxes venues d'Inde. L'#bold Abhayagiri#! mêle Mahayana et Vajrayana dans son approche innovante du [theravada.GetNameNoTooltip]. Le #bold Jetavana#!, enfin, est la secte la plus récente, et également ouverte aux croyances Mahayana et Vajrayana."
 sri_lanka.0020.a:0 "Soutenir le Mahavihara"
 sri_lanka.0020.a.tooltip:0 "Désormais, diverses [decisions|El] et actions que vous entreprendrez pourront augmenter ou diminuer la [RICE_sri_lanka_prominence|El] des [RICE_sri_lanka_monasteries|El] [RICE_sri_lanka_s|El], #italic en particulier#! la [RICE_sri_lanka_prominence|El] [mahavihara_i|El] [mahavihara|El]."
 sri_lanka.0020.b:0 "Soutenir l'Abhayagiri"
 sri_lanka.0020.b.tooltip:0 "Désormais, diverses [decisions|El] et actions que vous entreprendrez pourront augmenter ou diminuer la [RICE_sri_lanka_prominence|El] des [RICE_sri_lanka_monasteries|El] [RICE_sri_lanka_s|El], #italic en particulier#! la [RICE_sri_lanka_prominence|El] [abhayagiri_i|El] [abhayagiri|El]."
 sri_lanka.0020.c:0 "Soutenir le Jetavana"
 sri_lanka.0020.c.tooltip:0 "Désormais, diverses [decisions|El] et actions que vous entreprendrez pourront augmenter ou diminuer la [RICE_sri_lanka_prominence|El] des [RICE_sri_lanka_monasteries|El] [RICE_sri_lanka_s|El], #italic en particulier#! la [RICE_sri_lanka_prominence|El] [jetavana_i|El] [jetavana|El]."
 sri_lanka.0020.non_sri_lankan.tooltip:0 "Comme vous n'êtes pas [struggle_involved|El] dans la [RICE_sri_lanka_struggle|El], vous ne pourrez pas débloquer toutes les mécaniques disponibles pour la [RICE_sri_lanka_struggle|El], malgré votre soutien à ce [RICE_sri_lanka_monastery|El]."
 sri_lanka.0021.t:0 "Les trois monastères"
 sri_lanka.0021.desc:0 "Pour diverses raisons, qu'elles soient politiques, spirituelles ou personnelles, j'en suis venu à la conclusion que je devrais soutenir une secte monastique différente au [GetPlayer.Custom('RICE_sri_lanka_sangha_location')]. Je ne pense pas que le [GetPlayer.Custom('RICE_sri_lanka_patronized_monastery')], que je soutiens actuellement, ait ce qu'il faut pour diriger la [RICE_sri_lanka_sangha|El], et je suis de plus en plus sceptique quant à savoir si leur interprétation du [buddhism.GetName] est correcte, et si leurs pratiques religieuses sont appropriées."
 sri_lanka.0021.a:0 "Soutenir le Mahavihara"
 sri_lanka.0021.mahavihara.tooltip:0 "Le [mahavihara|El] perd [mahavihara_i|El] [EmptyScope.ScriptValue('RICE_misc_horse_sacrifice_cost_minor')|0] [RICE_sri_lanka_prominence|El]."
