 # Activities
 activity_RICE_sri_lanka_sri_pada_pilgrimage_host_an_a:0 "un"
 activity_RICE_sri_lanka_sri_pada_pilgrimage:0 "Pèlerinage à [GetPlayer.Custom('RICE_sri_pada')]"
 activity_RICE_sri_lanka_sri_pada_pilgrimage_desc:0 "[GetPlayer.Custom('RICE_sri_pada')] est l'un des sommets les plus sacrés de [GetGeographicalRegion('RICE_sri_lanka_alt_region').GetName], vénéré par des personnes de nombreuses croyances différentes. Il est surtout célèbre pour une marque en forme d'empreinte de pied à son sommet ; quelle figure religieuse a laissé cette empreinte dépend de la [faith|El] de la personne à qui vous posez la question."
 activity_RICE_sri_lanka_sri_pada_pilgrimage_selection_tooltip:"Partez en [local_pilgrimage|El] vers la montagne de [GetPlayer.Custom('RICE_sri_pada')] en [GetTitleByKey('c_kandy').GetNameNoTier].\n\n$activity_RICE_sri_lanka_sri_pada_pilgrimage_context_tooltip$"
 activity_RICE_sri_lanka_sri_pada_pilgrimage_context_tooltip:0 "#emphasis Contexte historique :#! Sri Pada (pour les bouddhistes et les hindous) ou Pic d'Adam (pour les chrétiens et les musulmans) est une montagne sacrée remarquable du centre du Sri Lanka, surtout connue pour la marque en forme d'empreinte de pied à son sommet. Les bouddhistes disent qu'elle a été laissée par le Bouddha, et qu'il y a prêché à un moment donné. Les hindous croient que l'empreinte a été laissée par Shiva, tandis que les chrétiens et les musulmans croient qu'elle a été laissée par Adam. Quoi qu'il en soit, la montagne est un lieu de pèlerinage depuis des siècles, et a été mentionnée par des voyageurs célèbres comme Faxian, Marco Polo et Ibn Battûta, ce dernier l'ayant escaladée."
 activity_RICE_sri_lanka_sri_pada_pilgrimage_host_desc:"$activity_RICE_local_pilgrimage_host_desc$\n$BULLET_WITH_TAB$Gain d'un [modifier|El] selon votre [religion|El] ou [religious_family|El] :\n$TAB$$BULLET_WITH_TAB$ Abrahamique : [GetModifier('RICE_sri_lanka_sri_pada_abrahamic_modifier').GetNameWithTooltip]\n$TAB$$BULLET_WITH_TAB$ Bouddhiste : [GetModifier('RICE_sri_lanka_sri_pada_buddhist_modifier').GetNameWithTooltip]\n$TAB$$BULLET_WITH_TAB$ Hindou : [GetModifier('RICE_sri_lanka_sri_pada_hindu_modifier').GetNameWithTooltip]\n$TAB$$BULLET_WITH_TAB$ Autre oriental : [GetModifier('RICE_sri_lanka_sri_pada_other_eastern_modifier').GetNameWithTooltip]\n$TAB$$BULLET_WITH_TAB$ Autre non-oriental : [GetModifier('RICE_sri_lanka_sri_pada_pagan_modifier').GetNameWithTooltip]"
 activity_RICE_sri_lanka_sri_pada_pilgrimage_guest_desc: "$activity_RICE_sri_lanka_sri_pada_pilgrimage_host_desc$"
 activity_RICE_sri_lanka_sri_pada_pilgrimage_province_desc:"[GetPlayer.Custom('RICE_sri_pada')] se trouve dans le centre du Sri Lanka."
 activity_RICE_sri_lanka_sri_pada_pilgrimage_destination_selection: "$activity_RICE_sri_lanka_sri_pada_pilgrimage_province_desc$"
