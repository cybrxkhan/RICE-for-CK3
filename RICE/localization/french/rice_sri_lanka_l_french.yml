 RICE_sri_lanka_persecute_monastery_seize_land_option_tooltip:0 "$EFFECT_LIST_BULLET$Gain d'un montant aléatoire entre [gold_i|El] #V #Bold [GetPlayer.MakeScope.ScriptValue('RICE_sri_lanka_massive_persecute_gold_gain_min')|0]#!#! et [gold_i|El] #V #Bold [GetPlayer.MakeScope.ScriptValue('RICE_sri_lanka_massive_persecute_gold_gain_max')|0]#!#!\n$EFFECT_LIST_BULLET$Perte de [prestige_i|El] #V 400#!, et [piety_i|El] #V 800#! supplémentaires si vous êtes d'une [faith|El] bouddhiste\n$EFFECT_LIST_BULLET$Gain d'un [modifier|El] qui augmente la [dread|El], réduit les [opinions|El] des bouddhistes, et soit diminue le [prestige_i|El] [prestige|El], diminue la [piety_i|El] [piety|El], ou augmente la [piety_i|El] [piety|El] selon que vous êtes bouddhiste ou non et la [struggle_phase|El] actuelle dans laquelle se trouve la [RICE_sri_lanka_struggle|El]\n$EFFECT_LIST_BULLET$Tous les [RICE_sri_lanka_monasteries|El] sur l'île perdent #V [GetPlayer.MakeScope.ScriptValue('RICE_sri_lanka_prominence_loss_massive')|0]#! de [RICE_sri_lanka_prominence|El], sauf si vous en patronnez un, qui perd #V [GetPlayer.MakeScope.ScriptValue('RICE_sri_lanka_prominence_loss_major')|0]#! de [RICE_sri_lanka_prominence|El] à la place\n$EFFECT_LIST_BULLET$Chaque [county|El] que vous possédez dans [GetGeographicalRegion('RICE_sri_lanka_struggle_region').GetName] gagne [control_i|El]#P [GetPlayer.MakeScope.ScriptValue('RICE_sri_lanka_persecute_control_gain_massive')|0]#! de [control|El] et perd [development_i|El]#N [GetPlayer.MakeScope.ScriptValue('RICE_sri_lanka_persecute_development_loss_massive')|0]#! de progression de [development|El]"
