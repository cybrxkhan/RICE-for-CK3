 innovation_RICE_irrigation_tanks:0 "Réservoirs d'irrigation"
 innovation_RICE_irrigation_tanks_desc:0 "Dans tout le sous-continent indien, certains types de grands puits et de réservoirs artificiels sont construits pour tirer parti de la topographie locale afin de récolter et de conserver l'eau de pluie. Ces réservoirs peuvent être utilisés pour l'agriculture, la boisson, le bain et les rituels religieux."
