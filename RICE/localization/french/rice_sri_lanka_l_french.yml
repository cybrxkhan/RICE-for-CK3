 innovation_RICE_velakkara_guards:0 "Gardes de Velakkara"
 innovation_RICE_velakkara_guards_desc:0 "Les Velakkara ou Velaikkarar sont des guildes de soldats du sud de l'Inde qui, bien que souvent d'origine tamoule, sont affiliées à diverses castes et communautés. S'organisant sur une base corporative, ils règlent leurs propres affaires par le biais de grandes assemblées. Leur efficacité en tant que soldats a conduit certains rois et nobles à employer des régiments entiers d'entre eux comme gardes royaux ou protecteurs de sites sacrés."
 RICE_velakkara:0 "Velakkara"
 RICE_velakkara_flavor:0 "#F Les Velakkara ou Velaikkarar sont des guildes de soldats très efficaces au combat, souvent déployés comme gardes royaux ou protecteurs de sites sacrés.#!"
 RICE_bantu_warriors:0 "Guerriers bantous"
 RICE_bantu_warriors_flavor:0 "#F Expérimentés dans les combats défensifs et offensifs, ces guerriers ont le courage et la bravoure de faire ce qu'il faut pour le plus grand bien de leur peuple.#!"
