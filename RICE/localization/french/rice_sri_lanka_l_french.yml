 sri_lanka.0080.t:0 "Nombreuses fois, une seule montagne"
 sri_lanka.0080.desc:0 "L'une des choses les plus fascinantes à propos du [GetPlayer.Custom('RICE_sri_pada')] que je remarque de plus en plus, maintenant que je suis ici, est que le site est honoré par les adeptes de nombreuses croyances différentes, pas seulement les [ROOT.Char.GetFaith.GetAdherentNamePlural].\n\nPar exemple, il y a des adeptes d'autres fois qui appellent la montagne [GetPlayer.Custom('RICE_sri_pada_opp')], au lieu de [GetPlayer.Custom('RICE_sri_pada')] comme nous le faisons. Tout le monde ne croit pas non plus que [GetPlayer.Custom('RICE_sri_pada_footprint_person')] a laissé l'empreinte au sommet de la montagne.\n\nMalgré cela, et malgré le fait qu'il y ait encore beaucoup de tensions entre les différents groupes ici, il est fascinant, voire inspirant pour certains, de voir tant de personnes de croyances diverses, y compris celles qui seraient normalement en conflit les unes avec les autres, partager cet espace sacré."
 sri_lanka.0080.a:0 "C'est un sujet de réflexion pendant que je suis ici."
 sri_lanka.0081.t:0 "Éviter la viande"
 sri_lanka.0081.desc:0 "Aux alentours de [GetPlayer.Custom('RICE_sri_pada')], et sur [GetPlayer.Custom('RICE_sri_pada')] même, il est courant que les gens évitent de manger de la viande animale, ou du moins beaucoup de ceux qui sont adeptes de diverses sectes [buddhism.GetAdjective]s et [hinduism.GetAdjective]s le font. Même ceux qui ne le font pas réduisent leur consommation de viande, car il est dit que cela permet de mieux se concentrer sur le pèlerinage et la vénération de [ROOT.Char.GetFaith.HighGodName]."
 sri_lanka.0081.a:0 "Je devrais éviter la viande tant que je suis ici."
 sri_lanka.0081.b:0 "Je n'ai pas besoin d'éviter de manger de la viande ici."
