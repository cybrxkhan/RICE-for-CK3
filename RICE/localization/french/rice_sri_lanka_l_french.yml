 game_concept_mahavihara_i:0 "@RICE_mahavihara_icon!"
 game_concept_mahavihara:0 "Mahavihara"
 game_concept_mahavihara_desc:0 "Le Mahavihara, aux côtés de l'[abhayagiri|E] et du [jetavana|E], est l'un des trois grands [RICE_sri_lanka_monasteries|El] dans la [RICE_sri_lanka_struggle|El], ou sa communauté bouddhiste. En jeu, le Mahavihara est représenté par une icône orange : @RICE_mahavihara_icon!.\n\nVous pouvez augmenter ou diminuer la [RICE_sri_lanka_prominence|El] du Mahavihara par différentes [decisions|El], [activities|El], et ainsi de suite, surtout si vous possédez le [trait|El] [GetTrait('RICE_mahavihara_trait').GetName( GetNullCharacter )], qui peut être obtenu en prenant la [decision|El] #V $RICE_sri_lanka_choose_monastic_sect$#!. Gardez cela à l'esprit si vous souhaitez mettre fin à la [struggle|El] au [RICE_sri_lanka_short|E].\n\nHistoriquement, le Mahavihara était le monastère ou la secte plus « traditionaliste » du bouddhisme sri-lankais ancien et médiéval. Ils étaient généralement sceptiques ou dédaigneux envers ce qu'ils considéraient comme des idées hétérodoxes venues d'Inde. Selon les chroniques traditionnelles, ce sont eux qui ont « gagné » à la fin contre les autres monastères."
 game_concept_abhayagiri_i:0 "@RICE_abhayagiri_icon!"
 game_concept_abhayagiri:0 "Abhayagiri"
 game_concept_abhayagiri_desc:0 "Les Abhayagiri, aux côtés du [mahavihara|E] et du [jetavana|E], sont l'un des trois grands [RICE_sri_lanka_monasteries|El] du [RICE_sri_lanka_struggle|El], ou sa communauté bouddhiste. En jeu, les Abhayagiri sont représentés par une icône jaune : @RICE_abhayagiri_icon!.\n\nVous pouvez augmenter ou diminuer la [RICE_sri_lanka_prominence|El] des Abhayagiri grâce à différentes [decisions|El], [activities|El], et ainsi de suite, surtout si vous possédez le [trait|El] [GetTrait('RICE_abhayagiri_trait').GetName( GetNullCharacter )], qui peut être obtenu en prenant la [decision|El] #V $RICE_sri_lanka_choose_monastic_sect$#!. Gardez cela à l'esprit si vous souhaitez mettre fin à la [struggle|El] au [RICE_sri_lanka_short|E].\n\nHistoriquement, les Abhayagiri étaient le monastère ou la secte la plus innovante du bouddhisme sri-lankais ancien et médiéval. Ils incorporaient souvent des idées des variétés Mahayana et Vajrayana du bouddhisme dans la forme Theravada du bouddhisme pratiquée au Sri Lanka. À un moment donné, ils étaient le plus grand monastère majeur de l'île."
 game_concept_jetavana_i:0 "@RICE_jetavana_icon!"
 game_concept_jetavana:0 "Jetavana"
 game_concept_jetavana_desc:0 "Les Jetavana, aux côtés du [mahavihara|E] et de l'[abhayagiri|E], sont l'une des trois grandes [RICE_sri_lanka_monasteries|El] dans la [RICE_sri_lanka_struggle|El], ou sa communauté bouddhiste. En jeu, les Jetavana sont représentés par une icône rouge : @RICE_jetavana_icon!.\n\nVous pouvez augmenter ou diminuer la [RICE_sri_lanka_prominence|El] des Jetavana par différentes [decisions|El], [activities|El], et ainsi de suite, surtout si vous possédez le [trait|El] [GetTrait('RICE_jetavana_trait').GetName( GetNullCharacter )], qui peut être obtenu en prenant la [decision|El] #V $RICE_sri_lanka_choose_monastic_sect$#!. Gardez cela à l'esprit si vous souhaitez mettre fin à la [struggle|El] au [RICE_sri_lanka_short|E].\n\nHistoriquement, les Jetavana étaient ouverts aux idées du bouddhisme Mahayana et Vajrayana, de manière similaire à l'[abhayagiri|E]. Ils étaient la plus petite et généralement la moins influente des trois sectes. Cependant, le stupa principal sur le site de leur monastère principal abrite un grand stupa, un monument bouddhiste souvent en forme de dôme, appelé le #italic Jetavanaramaya#!, qui fut à un moment donné le plus haut bâtiment du monde après les pyramides."
 game_concept_RICE_sri_lanka_prominence:0 "Prééminence"
 game_concept_RICE_sri_lanka_prominence_desc:0 "La Prééminence représente trois valeurs globales reflétant l'influence et le prestige des trois plus puissants [RICE_sri_lanka_monasteries|El] dans le [RICE_sri_lanka_struggle|El], ou communauté bouddhiste, à savoir le [mahavihara_i|El] [mahavihara|E], l'[abhayagiri_i|El] [abhayagiri|E], et le [jetavana_i|El] [jetavana|E].\n\nCes valeurs jouent un rôle important dans la [struggle|El] au [RICE_sri_lanka_short|E], car atteindre un certain montant est nécessaire pour mettre fin à la [struggle|El]. La Prééminence peut être augmentée ou diminuée par diverses [decisions|El], [activities|El], événements, et plus encore ; souvent, cet impact est plus important si vous possédez le [trait|El] de patron de l'un des trois monastères. Ce [trait|El] peut être acquis en prenant la [decision|El] #V $RICE_sri_lanka_choose_monastic_sect$#!.\n\nUn autre avantage de maintenir la prééminence de votre monastère patronné à un niveau élevé est que cela vous donne une petite quantité aléatoire de [piety_i|El] [piety|El] et de [prestige_i|El] [prestige|El] chaque année ; le montant dépend du niveau de prééminence de votre monastère."
 game_concept_RICE_grant:0 "Concession"
 game_concept_RICE_grants:0 "Concessions"
 game_concept_RICE_land_grant:0 "Concession de terre"
 game_concept_RICE_land_grants:0 "Concessions de terres"
 game_concept_RICE_land_grants_desc:0 "Les [rulers|El] qui suivent des [faiths|El] $buddhism_religion_adj$, $hinduism_religion_adj$ ou $jainism_religion_adj$ peuvent [decide|El] de #V $RICE_india_land_grant_decision$#!.\n\nLorsque vous prenez cette [decision|El], vous devez choisir d'accorder des terres à l'une des trois [religions|El]. Cela signifie qu'il est possible d'accorder des terres à une [religion|El] que vous ne suivez pas.\n\nCe faisant, vous obtenez un [character_modifier|El] améliorant l'[opinion|El] des adeptes de cette [religion|El] et ajoute des [county_modifiers|El] à vos [counties|El] avec plusieurs avantages. Le [county_modifier|El] réduit les [tax|El] mais augmente la [development_growth|El]. Si vous suivez une [faith|El] de la [religion|El] que vous avez choisie, le [modifier|El] améliore également l'[county_opinion|El], tandis que dans le cas contraire, le [modifier|El] améliore encore davantage la [development_growth|El] à la place. Les [counties|El] éligibles avec une [church_holding|El] reçoivent une version plus puissante du [modifier|El] que vous obtenez.\n\nDe plus, la [decision|El] a une petite chance de convertir les [counties|El] affectés vers une [faith|El] aléatoire de la [religion|El] que vous avez choisie."

 # Aspirations 
 RICE_sri_lanka_aspiration_vijayabahu_desc:"\n\n#bold [historical_aspiration_main_objectives|E]#!\n$EFFECT_LIST_BULLET$Être le [king|El] du [GetTitleByKey('k_lanka').GetNameNoTier]\n$EFFECT_LIST_BULLET$Prendre la [decision|El] de #V $RICE_sri_lanka_polonnaruwa_capital$#!\n$EFFECT_LIST_BULLET$Rester bouddhiste\n\n#bold Récompenses#!\n$EFFECT_LIST_BULLET$Gain de @prestige_icon! #V [EmptyScope.ScriptValue('RICE_aspiration_medium_resource_bonus')]#! de [prestige|El]\n$EFFECT_LIST_BULLET$Recevez #V 500#! [GetMaA('RICE_velakkara').GetName] [special_troops|El]\n$EFFECT_LIST_BULLET$Chaque [county|El] au [GetGeographicalRegion('RICE_sri_lanka_alt_region').GetName] gagne @development_icon! #V [EmptyScope.ScriptValue('RICE_red_sea_al_umari_aspiration_dev_bonus')]#! de [development|El]\n\n#bold [historical_aspiration_bonus_objectives|E]#!\n$EFFECT_LIST_BULLET$Prendre la [decision|El] de #V $RICE_india_irrigation_tank_decision$#! au moins une fois (Récompense : @prestige_icon! #V [EmptyScope.ScriptValue('RICE_aspiration_medium_resource_bonus')]#! de [prestige|El])\n$EFFECT_LIST_BULLET$Prendre la [decision|El] de #V $RICE_sri_lanka_support_monastery$#! au moins une fois (Récompense : @piety_icon! #V [EmptyScope.ScriptValue('RICE_aspiration_medium_resource_bonus')]#! de [piety|El])"
 RICE_sri_lanka_historical_aspiration_action_vijayabahu:"#italic Vous cherchez à restaurer l'ordre et à ramener la paix sur l'île du $k_lanka$, qui a été disputée entre des seigneurs de guerre cinghalais et des armées Chola pendant des décennies, et à établir un nouveau royaume.#!$RICE_sri_lanka_aspiration_vijayabahu_desc$"
 RICE_sri_lanka_historical_aspiration_modifier_desc_vijayabahu: "[GetModifier('RICE_sri_lanka_aspiration_rule_sri_lanka').GetNameWithTooltip]"

