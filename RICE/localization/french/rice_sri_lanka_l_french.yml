 sri_lanka.0100.t:0 "$RICEmisc.0011.t$"
 sri_lanka.0100.desc:0 "Je me rends maintenant à [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetName] pour vénérer le sacré"
 sri_lanka.0100.desc.bodhi:0 "#bold arbre de la Bodhi#!."
 sri_lanka.0100.desc.tooth:0 "#bold reliquaire de la dent#! du Seigneur Bouddha."
 sri_lanka.0100.desc.dharmadhatu:0 "texte #bold Dharmadhatu#! enterré là-bas."
 sri_lanka.0100.desc.conclusion:0 "\n\nLes dévots [buddhism.GetAdherentNamePlural] de tout le [GetGeographicalRegion('RICE_sri_lanka_alt_region').GetName] viennent dans cet espace sacré pour vénérer cette relique comme un moyen d'honorer les Trois Joyaux : le Bouddha, le Dharma et le Sangha. En tant que [faith.GetAdherentName], ce sera sans aucun doute une merveilleuse expérience spirituelle."
 sri_lanka.0100.a:0 "Que les Trois Joyaux nous protègent durant notre voyage."
 sri_lanka.0101.t:0 "Arrivée à [ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetLocation.GetNameNoTooltip]"
 sri_lanka.0101.desc:0 "Enfin, je suis arrivé[ROOT.Char.Custom('FR_E')] à [ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetLocation.GetName], pour vénérer le sacré"
 sri_lanka.0101.desc.bodhi:0 "Arbre de la Bodhi.\n\nCet arbre fut planté il y a de nombreuses années, lorsque Sanghamitta, fille du grand empereur Ashoka, vint au [GetGeographicalRegion('RICE_sri_lanka_alt_region').GetName] pour répandre le Dharma parmi les habitants. Elle apporta une branche de l'arbre original sous lequel le Seigneur Bouddha se serait assis lorsqu'il atteignit l'illumination ; cette branche est à l'origine de l'arbre de la Bodhi ici.\n\nDepuis lors, beaucoup sont venus honorer l'arbre en participant à des cérémonies pour le baigner, en prendre soin et lui faire des offrandes. J'aspire à faire de même maintenant que je suis ici."
 sri_lanka.0101.desc.tooth:0 "Reliquaire de la dent du Bouddha.\n\nLorsque le Bouddha mourut et fut incinéré, l'une de ses principales disciples, la nonne Khema, trouva sa dent et la présenta à un roi indien pour qu'il la garde en sécurité. Lorsque la guerre menaça le temple où la relique se trouvait, les moines qui la protégeaient l'emmenèrent au [GetGeographicalRegion('RICE_sri_lanka_alt_region').GetName], où elle est restée depuis.\n\nL'une des festivités les plus remarquables de l'île est la procession de cette relique dentaire. C'est une occasion importante d'honorer et de vénérer le Bouddha, et j'observerai la procession afin de faire exactement cela."
 sri_lanka.0101.desc.dharmadhatu:0 "Texte du Dharmadhatu enterré là-bas.\n\nCe traité religieux, qui expose divers sujets théologiques et philosophiques, a été apporté au [GetGeographicalRegion('RICE_sri_lanka_alt_region').GetName] depuis l'Inde il y a des années. Depuis lors, les bouddhistes de l'île ont vénéré ce texte profond et inspirant, car beaucoup croient qu'il possède de grandes propriétés spirituelles et curatives, et il a par la suite été enchâssé dans un stupa.\n\nDe nos jours, une cérémonie importante est régulièrement organisée pour le Dharmadhatu : un festival centré sur une procession de cette relique. Je cherche à participer à cet événement afin de bénéficier de ses bénédictions."
 sri_lanka.0101.a:0 "Reposons-nous et préparons-nous d'abord à cela."
 sri_lanka.0102.t.bodhi:0 "L'Arbre de la Bodhi"
 sri_lanka.0102.t.tooth:0 "La dent du Bouddha"
 sri_lanka.0102.t.dharmadhatu:0 "Le Dharmadhatu"
 sri_lanka.0102.desc.bodhi:0 "Les temples bouddhistes du [GetGeographicalRegion('RICE_sri_lanka_alt_region').GetName] possèdent souvent des arbres de la Bodhi, et les cérémonies de #italic Bodhi Puja#! pour vénérer ces arbres sont un spectacle courant.\n\nL'arbre à [ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetLocation.GetName], cependant, n'est pas un arbre ordinaire. C'est le grand arbre Bodhi originel : une silhouette imposante, magnifique dans sa manière ancienne et vénérable, entourée de nombreux dévots.\n\nComme les autres dévots rassemblés ici, je prends part à divers rituels, de la prière à la circumambulation autour de l'arbre, en passant par les offrandes de lampes à huile de coco et d'autres objets de bon augure comme des fleurs, des fruits, de l'encens, des pièces lavées dans de l'eau safranée, et bien plus encore. J'accroche également des drapeaux aux branches de l'arbre, dans l'espoir que mes vœux seront exaucés."
 sri_lanka.0102.desc.tooth:0 "La procession de la relique de la dent du Bouddha est une cérémonie grandiose et colorée, et je suis ici pour en être témoin dans toute sa splendeur.\n\nLa cérémonie, qui dure plusieurs jours, commence par la coupe rituelle d'un jeune jacquier sanctifié, effectuée en secret par des monastiques. Le tronc de l'arbre est fendu en quatre, et placé dans les temples voisins des quatre divinités gardiennes du [GetGeographicalRegion('RICE_sri_lanka_alt_region').GetName] : Natha, Vishnu, Katharagama et la grande déesse Pattini.\n\nPendant cinq jours, ces temples tiennent alors diverses cérémonies remplies de musique, de chants et de tambours. Une fois cela accompli, la procession peut ensuite commencer."
 sri_lanka.0102.desc.dharmadhatu:0 "À travers le [GetGeographicalRegion('RICE_sri_lanka_alt_region').GetName], enterrer ou enfermer des objets sacrés dans des sites saints [buddhism.GetAdjective]s est une pratique religieuse importante. Les objets considérés comme possédant une importance ou un pouvoir sacré sont alors vénérés afin de nous rappeler le Bouddha et ses enseignements.\n\nLe Dharmadhatu est l'un des exemples les plus révérés de cette pratique. Il est placé dans une maison spéciale à côté d'un grand stupa, une structure impressionnante de pierre, entourée d'herbe et d'arbres. De très nombreux dévots, y compris des laïcs et des monastiques, en font le tour quotidiennement.\n\nQuoi qu'il en soit, je suis ici pour prendre part aux cérémonies rituelles du Dharmadhatu établies il y a longtemps."
 sri_lanka.0102.a.bodhi:0 "Le bain de l'arbre est cependant le rituel le plus important."
 sri_lanka.0102.a.tooth:0 "J'ai hâte de le voir !"
 sri_lanka.0102.a.dharmadhatu:0 "J'espère que nous pourrons commencer bientôt."
 sri_lanka.0103.t.bodhi:0 "$sri_lanka.0102.t.bodhi$"
 sri_lanka.0103.t.tooth:0 "$sri_lanka.0102.t.tooth$"
 sri_lanka.0103.t.dharmadhatu:0 "$sri_lanka.0102.t.dharmadhatu$"
 sri_lanka.0103.desc.bodhi:0 "L'arbre Bodhi dispose d'un personnel de moines et de laïcs dévoués qui arrosent l'arbre et le nettoient quotidiennement, afin d'accumuler de grands mérites. Cela, cependant, diffère de la cérémonie de bain que moi et les autres dévots accomplissons à présent.\n\nAvec de l'eau parfumée, nous lavons l'arbre avec amour comme s'il était le Seigneur Bouddha lui-même. Après tout, nous ne vénérons pas l'arbre en lui-même, mais nous l'honorons en tant que symbole du Bouddha.\n\nAlors que nous achevons la cérémonie, nous effectuons une nouvelle circumambulation autour de l'arbre, récitant diverses prières. Je décide de réciter une strophe de prière courante :\n\n#italic Je rends hommage à cet arbre Bodhi, sous lequel le maître s'est assis, atteignant l'omniscience en triomphant de tous ses ennemis. Je fais également des offrandes à ce grand arbre Bodhi qui fut honoré par le guide du monde. Je te rends hommage, Roi Bodhi.#!"
 sri_lanka.0103.desc.tooth:0 "Enfin, le moment est venu pour la procession de la relique de la dent elle-même. Tous peuvent voir le reliquaire, placé sur un grand éléphant, qui mène la procession. L'éléphant est suivi par des artistes de toutes sortes, des chanteurs et acrobates aux tambours, danseurs et porte-drapeaux - c'est tout un spectacle et un régal pour les yeux !\n\nLes processions des quatre autres temples convergent pour rejoindre la procession principale, chacune portant les insignes de leur temple, leurs danses reflétant leurs diverses divinités.\n\nQuoi qu'il en soit, la procession se termine par une cérémonie de l'eau dans la rivière voisine. Ici, un moine en chef désigné utilise une épée pour trancher l'eau, et séparer le pur de l'impur."
 sri_lanka.0103.desc.dharmadhatu:0 "Les chants de prières résonnent dans l'air, accompagnés de la marche des gens et des éléphants, alors que la procession et la cérémonie de culte commencent.\n\nNous prions pour nous rappeler l'importance des Trois Joyaux - le Bouddha, le Dharma et le Sangha - tandis que nous faisons des offrandes là où repose le Dharmadhatu. Je médite sur le Dharmadhatu en accomplissant ces gestes.\n\nLe texte lui-même expose le #italic Trikaya#! ou « trois corps », un enseignement sur la nature de la réalité et de la bouddhéité, que l'on trouve dans le [GetFaithDoctrine('rice_mahayana_canon_doctrine').GetBaseName]. Certains détracteurs critiquent les enseignements du Dharmadhatu comme étant hétérodoxes, voire hérétiques, mais d'autres croient que ses idées spirituelles peuvent aider et guider tous les êtres, et qu'il est donc digne de vénération."
 sri_lanka.0103.a.bodhi:0 "En vérité, c'est comme si le Seigneur Bouddha était là !"
 sri_lanka.0103.a.tooth:0 "Que tous soient bénis par le Bouddha !"
 sri_lanka.0103.a.dharmadhatu:0 "Une cérémonie exaltante, à n'en pas douter !"
 sri_lanka.0104.t:0 "Il est temps de rentrer à la maison"
 sri_lanka.0104.desc:0 "Ma visite à [ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetLocation.GetName] pour me consacrer à la vénération des reliques est arrivée à son terme. Quelle joie, quel accomplissement, quelle paix, quel contentement !\n\nCependant, comme le Bouddha l'a enseigné, toute chose est impermanente, y compris ce voyage. Il est temps de rentrer chez soi et de méditer sur tout ce qui s'est passé."
 sri_lanka.0104.a:0 "Je suis heureu[ROOT.Char.Custom('FR_XSe')] d'avoir trouvé le temps pour cela, tout compte fait."
