 sri_lanka.0150.pattini_games_intro:0 "Au [GetGeographicalRegion('RICE_sri_lanka_alt_region').GetName], il est de coutume traditionnelle pour les villages d'organiser des jeux rituels en l'honneur de la déesse [GetPlayer.Custom('RICE_pattini')] lors d'occasions spéciales.\n\nLes deux équipes de ces jeux sont généralement masculines, et ce sont de grandes occasions pour les hommes de se mettre en valeur. Une équipe représente la déesse, tandis qu'une autre équipe représente son époux, ou quelque divinité masculine. Si l'équipe de la déesse l'emporte, cela assure certainement une bonne fertilité agricole et la prospérité pour l'année, mais les deux équipes doivent jouer sérieusement pour que le rituel soit considéré comme légitime.\n\n"
 sri_lanka.0150.t:0 "Ankeliya"
 sri_lanka.0150.desc:0 "$sri_lanka.0150.pattini_games_intro$J'ai entendu dire que le jeu de la corne, #italic ankeliya#!, a récemment été joué dans un village important de [county.GetNameNoTier]. Les deux équipes ont une corne attachée à un arbre et doivent utiliser une corde pour essayer de la briser. L'équipe qui y parvient en premier est, bien sûr, la gagnante."
 sri_lanka.0150.a:0 "Je me demande quelle équipe a gagné cette fois-ci?"
 sri_lanka.0150.a.failure:0 "L'équipe de Pattini perd le match"
 sri_lanka.0150.a.success:0 "L'équipe de Pattini gagne le match"
 sri_lanka.0151.t:0 "Porakeliya"
 sri_lanka.0151.desc:0 "$sri_lanka.0150.pattini_games_intro$J'ai entendu dire que le jeu de la noix de coco, #italic porakeliya#!, a récemment été joué dans un village important de [county.GetNameNoTier]. Les deux équipes font s'affronter leurs membres individuellement, et les deux joueurs se lancent des noix de coco en même temps, essayant de briser la noix de coco de l'adversaire. L'équipe qui brise le plus de noix de coco de l'équipe adverse gagne. C'est un jeu dangereux mais passionnant !"
 sri_lanka.0151.a:0 "$sri_lanka.0150.a$"
 sri_lanka.0151.a.failure:0 "$sri_lanka.0150.a.failure$"
 sri_lanka.0151.a.success:0 "$sri_lanka.0150.a.success$"
 sri_lanka.0152.t:0 "Mères de lait"
 sri_lanka.0152.desc:0 "J'ai récemment assisté à une cérémonie d'offrandes aux mères nourricières locales. Cet événement traditionnel [ROOT.Char.GetCulture.GetCollectiveNoun|l] implique sept femmes locales qui endossent le rôle de la déesse [GetPlayer.Custom('RICE_pattini')] durant la cérémonie. Elles sont choisies selon certains critères, comme être vertueuses et avoir une bonne moralité.\n\nDurant la cérémonie, les femmes reçoivent une nourriture riche en lait, et sont ainsi transformées en « mères nourricières ». On dit que vénérer [GetPlayer.Custom('RICE_pattini')] de cette manière aide à résoudre tout problème lié à la fertilité et aux enfants, ainsi qu'à la vie en général."
 sri_lanka.0152.a:0 "Puisse Pattini nous protéger."
 sri_lanka.0152.info:0 "#emphasis Contexte historique :#! Inviter des mères de lait pour une cérémonie précédant l'aube afin de vénérer Pattini, la seule divinité féminine majeure adorée au Sri Lanka, est une pratique courante encore de nos jours sur l'île. De telles cérémonies impliquent souvent de nombreuses personnes, les femmes choisies pour être mères de lait participant elles-mêmes à la préparation de la nourriture utilisée lors de la cérémonie.\n\nEn tant que forme de religion populaire dominée par les femmes au Sri Lanka, ces cérémonies sont des affaires privées différentes de celles organisées par les institutions bouddhistes plus officielles, mais il existe des similitudes. Par exemple, la récitation de chants bouddhistes en pāli est importante pour les deux, et les sermons religieux sont généralement prononcés par la mère de lait en chef, tout comme le ferait un moine."
 sri_lanka.0153.t:0 "Un[noble.Custom('FR_E')] crimine[noble.Custom('FR_LLle')] odieu[noble.Custom('FR_XSe')]"
 sri_lanka.0153.desc:0 "[noble.GetFullName], un[noble.Custom('FR_E')] noble [noble.GetCulture.GetCollectiveNoun|l] local, a récemment commis un crime si grave, selon nos lois et croyances, qu'[noble.GetSheHe] méritait un châtiment pire que la mort. J'ai donc dûment condamné ce[noble.Custom('FR_EtEtte')] misérable à être exilé[noble.Custom('FR_E')] dans la caste des #italic Rodi#! .\n\nLes #italic Rodi#! sont l'un des groupes les plus méprisés du [GetGeographicalRegion('RICE_sri_lanka_alt_region').GetName], et il est courant de punir les pires criminels en les forçant à rejoindre les #italic Rodi#!. On dit que les premiers #italic Rodi#! descendent d'un cannibale puni par un ancien roi. Certaines légendes racontent que la fille du roi eut une liaison amoureuse avec ce cannibale, et qu'elle aussi fut exilée pour devenir une #italic Rodi#!.\n\nQuoi qu'il en soit, [noble.GetFirstNameNoTooltip] implore la clémence, disant qu'[noble.GetSheHe] préférerait être torturé[noble.Custom('FR_E')] et exécuté[noble.Custom('FR_E')] de la manière la plus douloureuse possible, plutôt que de devenir un[noble.Custom('FR_E')] #italic Rodi#!."
 sri_lanka.0153.a:0 "Votre destin est scellé. Gardes, emmenez cette vermine !"
 sri_lanka.0153.b:0 "Très bien ! Si vous le souhaitez. La torture et l'exécution, c'est ça !"
 sri_lanka.0153.c:0 "Je vous pardonne, mais vous avez une grande dette envers moi."
 sri_lanka.0153.info:0 "#emphasis Contexte historique :#! Les sources remontent très loin concernant l'histoire et le folklore entourant la caste des #italic Rodi#!, ou #italic Rodiya#!, et leur origine. Par exemple, Robert Knox, un capitaine de marine anglais qui visita Sri Lanka, parla des #italic Rodi#! lorsqu'il publia un récit de ses voyages en 1681. Il mentionna que lorsque des femmes nobles recevaient une punition du roi en étant exilées chez les #italic Rodi#!, il était coutume de les remettre aux #italic Rodi#! au bord de la rivière, en guise de geste de miséricorde. Cela était considéré comme miséricordieux car les femmes avaient la possibilité de se noyer dans la rivière, si elles souhaitaient échapper à leur sort."
 sri_lanka.0154.t:0 "Se reposer dans un Ambalama"
 sri_lanka.0154.desc:0 "Aujourd'hui, je suis parti[ROOT.Char.Custom('FR_E')] en petite excursion dans la campagne près de ma résidence à [ROOT.Char.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip].\n\nNous nous sommes arrêtés à un #italic ambalama#!, l'une des structures en bois typiques construites le long des routes du [GetGeographicalRegion('RICE_sri_lanka_alt_region').GetName], destinées à offrir un abri aux voyageurs, en particulier aux pèlerins.\n\nC'était une journée calme et paisible, et le paysage près de l'#italic ambalama#! était absolument à couper le souffle. J'ai décidé de rester un peu plus longtemps que prévu, simplement pour admirer la vue et profiter de la nature autour de moi."
 sri_lanka.0154.a:0 "Heureusement que j'ai décidé[ROOT.Char.Custom('FR_E')] de m'y rendre aujourd'hui."
 sri_lanka.0155.t:0 "Harmonie avec les [vedda.GetCollectiveNounNoTooltip|l]"
 sri_lanka.0155.desc:0 "Les [vedda.GetCollectiveNoun|l], les anciens habitants du [GetGeographicalRegion('RICE_sri_lanka_alt_region').GetName], sont des chasseurs et des cueilleurs habiles, et échangent souvent les animaux ou la nourriture qu'ils attrapent avec les villages locaux. Ainsi, il n'est pas rare que les [vedda.GetCollectiveNounNoTooltip|l] et leurs voisins entretiennent des relations relativement harmonieuses les uns avec les autres.\n\nQuoi qu'il en soit, la relation entre les [vedda.GetCollectiveNoun|l] locaux et les [county.GetProvince.GetCounty.GetCulture.GetCollectiveNoun|l] de [county.GetNameNoTier] a été très productive ces derniers temps, encore plus que d'habitude. Cela stimule l'économie locale, ce qui, bien entendu, ne peut être qu'une bonne chose."
 sri_lanka.0155.a:0 "Espérons que ces bons moments se poursuivent !"
 sri_lanka.0156.t:0 "Cérémonie de Pirit"
 sri_lanka.0156.desc:0 "Aujourd'hui, je participe à une cérémonie de #italic pirit#!, qui est populaire parmi les laïcs et les monastiques [ROOT.Char.GetFaith.GetReligion.GetAdherentNamePlural] au [GetGeographicalRegion('RICE_sri_lanka_alt_region').GetName] depuis des générations.\n\nLa cérémonie de #italic pirit#! varie en taille et en complexité, mais j'ai coordonné avec les temples et monastères locaux éminents pour en organiser une grande et massive cette fois-ci, d'une durée d'une semaine. Un pavillon spécial, le #italic pirit mandapaya#!, a été construit dans ma résidence, et une table ronde couverte d'un tissu blanc y a été placée pour que les monastiques nous assistent dans la cérémonie.\n\nLa cérémonie elle-même consiste en la récitation publique de prières tirées des écritures canoniques, et commence lorsque les moines aînés nous disent de réciter après eux :\n\n« #italic Veuillez réciter le noble #italic pirit#! pour éviter tout malheur, pour atteindre tout succès, et pour la destruction de toute souffrance.#! »"
 sri_lanka.0156.a:0 "Que toute souffrance soit anéantie, en effet !"
 sri_lanka.0157.t:0 "Offrandes de fleurs au Bouddha"
 sri_lanka.0157.desc:0 "Il existe un certain nombre de rituels traditionnels auxquels les [ROOT.Char.GetFaith.GetAdherentNamePlural] du [GetGeographicalRegion('RICE_sri_lanka_alt_region').GetName] participent. Dernièrement, celui auquel j'ai consacré beaucoup de temps est l'offrande de fleurs au Bouddha. Je trouve cela apaisant et relaxant, et cela m'encourage à être plus dévoué et à agir vertueusement.\n\nJ'ai bien mémorisé les paroles, prononcées dans la langue sacrée du #italic pali#!, que je dois réciter chaque fois que je fais cela :\n\n#italic Cette masse de fleurs dotée de couleur, de parfum et de qualité, je l'offre aux pieds semblables au lotus du Roi des Sages. J'honore le Bouddha avec ces fleurs : par le mérite de cet acte, puissé-je atteindre le Nirvana. Tout comme ces fleurs se fanent, ainsi mon corps vient à la destruction.#!"
 sri_lanka.0157.a:0 "En effet, par le mérite de ceci, puis-je atteindre le Nirvana !"
 sri_lanka.0158.t:0 "Des monastères hérétiques ?"
 sri_lanka.0158.desc:0 "Bien que je sois un partisan du monastère [ROOT.Char.Custom('RICE_sri_lanka_patronized_monastery')], je dois encore remplir mes devoirs en tant que [ROOT.Char.GetTitleAsNameNoTooltip] et parfois parrainer ou travailler avec d'autres grands monastères et sectes [ROOT.Char.GetFaith.GetReligion.GetAdjective]s dans mes territoires sur l'île du [GetGeographicalRegion('RICE_sri_lanka_alt_region').GetName].\n\nCependant, il y a des monastiques [ROOT.Char.Custom('RICE_sri_lanka_patronized_monastery')] convaincus qui affirment que s'associer avec ceux qu'ils considèrent comme des hérétiques est au mieux mal avisé, et au pire équivalent à se complaire soi-même dans l'hérésie. Ces partisans de la ligne dure disent que je devrais éviter toute association avec les autres monastères aussi souvent que possible."
 sri_lanka.0158.a:0 "Ce sont toujours des disciples du Bouddha, même s'ils sont égarés."
 sri_lanka.0158.b:0 "Peut-être #italic devrais#!-je moins interagir avec les monastères hérétiques."
 sri_lanka.0159.t:0 "Cérémonie de Gammaduva"
 sri_lanka.0159.desc:0 "Aujourd'hui, je parraine une cérémonie de #italic Gammaduva#!\n\nCertaines des autorités [ROOT.Char.GetFaith.GetReligion.GetAdjective]s les plus érudites et orthodoxes pourraient désapprouver, mais les habitants du [GetGeographicalRegion('RICE_sri_lanka_alt_region').GetName] pratiquent ce rituel depuis de nombreuses années. C'est pourtant à travers cette cérémonie que nous pouvons demander aux cieux de nous aider à repousser les maladies, et assurer la bonne fortune ainsi que la fertilité personnelle et agricole. Qu'y a-t-il de mal à cela ?\n\nQuoi qu'il en soit, l'occasion est vibrante, avec de nombreuses danses et une musique festive accompagnée de tambours. Des offrandes de nourriture et, surtout, des statues en terre cuite de plantes, d'animaux et de personnes sont placées sur un autel où nous prions. Nous les brisons ensuite en morceaux et en fragments au fur et à mesure que la cérémonie se poursuit."
 sri_lanka.0159.a:0 "Espérons que nos offrandes plairont aux cieux."
 sri_lanka.0159.info:0 "#emphasis Contexte historique :#! Il existe des preuves de la cérémonie Gammaduva dès les premiers siècles du premier millénaire de notre ère à Anuradhapura, le principal centre de l'île à cette époque. Les travaux archéologiques y ont mis au jour des fragments de figurines en terre cuite qui correspondent étroitement aux types habituellement utilisés de nos jours pour la cérémonie Gammaduva. Cette cérémonie est un exemple de divers rituels au Sri Lanka qui ne correspondent pas nécessairement aux pratiques bouddhistes ou hindoues orthodoxes, mais qui n'en restent pas moins importants pour la culture religieuse locale."
 sri_lanka.0160.t:0 "Marchandises exotiques d'au-delà du [GetGeographicalRegion('RICE_sri_lanka_alt_region').GetNameNoTooltip]"
 sri_lanka.0160.desc:0 "[GetGeographicalRegion('RICE_sri_lanka_alt_region').GetName] est un important centre de commerce dans l'océan Indien depuis de nombreux siècles, car il se trouve le long de nombreuses routes commerciales maritimes. Les puissants[ROOT.Char.Custom('FR_E')] [ROOT.Char.GetWomenMen] qui gouvernent cette île, comme moi-même, ont accès à de nombreux produits de luxe apportés ici de contrées lointaines.\n\nEn ce moment, j'ai l'opportunité d'acheter des objets de valeur à un marchand de passage dans la région. Je pourrais acquérir de magnifiques jarres décorées provenant des terres d'Iran et de Mésopotamie, enduites de bitume pour être imperméables. Ou peut-être devrais-je acheter des pierres précieuses comme le lapis-lazuli d'Afghanistan ? Ou des céramiques vernissées de Chine ? Il y a tant de choix !"
 sri_lanka.0160.a:0 "En y réfléchissant bien, je vais économiser mon argent."
 sri_lanka.0160.b:0 "Je pense que je vais acheter ces pots étanches."
 sri_lanka.0160.c:0 "Puis-je obtenir quelques-unes de ces pierres précieuses ?"
 sri_lanka.0160.d:0 "Laissez-moi acheter ces jolies céramiques émaillées."
 sri_lanka.0161.t:0 "Un trésor de pièces de monnaie anciennes"
 sri_lanka.0161.desc:0 "Des villageois ont récemment découvert un important trésor de pièces anciennes à [county.GetNameNoTier], avec des motifs inhabituels et étranges. De telles découvertes ne sont pas inédites et reflètent comment l'île du [GetGeographicalRegion('RICE_sri_lanka_alt_region').GetName] a connu de nombreux échanges commerciaux au fil des siècles. Qui sait quels marchands anciens ont apporté ces pièces ici ?\n\nQuoi qu'il en soit, les villageois se sont montrés plutôt honnêtes et m'ont apporté les pièces, car ils ne se sentaient pas à l'aise de les garder pour eux. Maintenant, je dois décider quoi faire de ces pièces."
 sri_lanka.0161.a:0 "Des villageois si honnêtes devraient garder les pièces."
 sri_lanka.0161.b:0 "Ces pièces iront dans mon trésor."
 sri_lanka.0161.c:0 "Je veux partager les pièces avec les villageois."
 sri_lanka.0161.info:0 "#emphasis Contexte historique :#! En raison de son emplacement stratégique le long de la route maritime de la soie, de vieilles pièces de monnaie ont été trouvées sur l'île, datant de différentes époques et origines, notamment des pièces romaines antiques. Cosmas Indicopleustes (« Cosmas qui navigua vers l'Inde »), un marchand égyptien du VIe siècle, raconte une anecdote intéressante à ce sujet dans son livre sur les terres étrangères, #italic Topographie chrétienne#!.\n\nDans l'anecdote de Cosmas, un Romain et un Perse - peut-être des dignitaires ou des marchands de haut rang - arrivèrent à la cour du roi du Sri Lanka. Parce que Rome et la Perse étaient de puissants empires rivaux, le roi demanda aux hommes lequel de leurs rois était le plus grand. Le Perse fit d'abord des déclarations extravagantes sur la puissance du Shah de Perse. Le Romain dit alors que les rois romain et perse étaient déjà là, à côté d'eux, et que le roi sri-lankais pouvait en juger par lui-même. Confus, le roi sri-lankais demanda comment cela était possible.\n\nLe Romain demanda alors qu'on lui donne deux pièces, une romaine, une perse, chacune portant le visage de leur roi. La pièce romaine, en or, paraissait plus splendide que la pièce perse en argent. Et ainsi, le roi sri-lankais, impressionné par l'esprit du Romain et la beauté de ses pièces, accorda de grandes récompenses au Romain, tandis que le Perse repartit dans la honte.\n\nBien qu'il s'agisse probablement d'un récit fantaisiste, cette histoire suggère quelques éléments. Premièrement, les pièces de monnaie circulaient largement dans l'océan Indien. Deuxièmement, les contacts entre les différentes régions d'Eurasie étaient suffisamment fréquents."
