 sri_lanka.0001.t:0 "La $RICE_sri_lanka_struggle$"
 sri_lanka.0001.desc:0 "Depuis l'époque d'Ashoka, [GetGeographicalRegion('RICE_sri_lanka_alt_region').GetName] est renommée comme une île sainte [buddhism.GetAdjective] estimée par les bouddhistes du monde entier. Cependant, au fil des siècles, la #italic Sangha#! de l'île, ou communauté bouddhiste, a été divisée en raison de conflits entre les trois grands monastères de l'île - le [mahavihara|El], l'[abhayagiri|El] et le [jetavana|El] - qui rivalisent pour obtenir des fidèles, du prestige, des terres et le patronage royal.\n\n"
 sri_lanka.0001.desc.buddhist:0 "Sous la direction de la Maison [ROOT.Char.GetHouse.GetNameNoTooltip], nous discernerons le vrai du faux, protégerons les justes et punirons les hérétiques, et peut-être même unirons la #italic Sangha#! du [GetGeographicalRegion('RICE_sri_lanka_alt_region').GetName] un jour !"
 sri_lanka.0001.desc.non_buddhist:0 "Nous, non-bouddhistes, travaillons souvent avec la #italic Sangha#! bouddhiste et la patronnons même. Les aiderons-nous à s'unir pour mieux servir la Maison [ROOT.Char.GetHouse.GetNameNoTooltip], ou nous débarrasserons-nous plutôt de ces monastiques gênants ?"
 sri_lanka.0001.a:0 "Le #italic karma#! de tant d'êtres, désormais entrelacé..."
 sri_lanka.0001.b:0 "Quel sera le sort de cette île ?"
 sri_lanka.0001.vijayabahu.tooltip:0 "#bold [RICE_aspiration|El] de Vijayabahu : Établir le royaume de Polonnaruwa#!$RICE_sri_lanka_aspiration_vijayabahu_desc$\n"
