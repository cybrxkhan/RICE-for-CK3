 RICE_muallim_option:0 "Navigateurs Mu'allim"
 RICE_muallim_option_desc:0 "Dans l'océan Indien, le terme arabe #italic mu'allim#! désigne les maîtres navigateurs. Ils possèdent des connaissances expertes en arithmétique, géométrie, géographie, météorologie et bien d'autres domaines, acquises tant par la lecture de tomes anciens que par l'expérience pratique. Ils sont indispensables, voire essentiels, lors des voyages en haute mer."
 RICE_nakhudas_option:0 "Armateurs de Nakhuda"
 RICE_nakhudas_option_desc:0 "Les #italic Nakhudas#! ou #italic Nauvittakas#! sont une classe de marchands d'origines culturelles et religieuses diverses, présents le long des côtes de l'Inde. Leurs connexions aideront tout voyageur cherchant à aller loin de manière sûre et rapide."
