 activity_RICE_sri_lanka_ramasetu_pilgrimage_host_an_a:0 "un"
 activity_RICE_sri_lanka_ramasetu_pilgrimage:0 "Pèlerinage à Ramasetu"
 activity_RICE_sri_lanka_ramasetu_pilgrimage_desc:0 "Ramasetu, ou le Pont d'Adam, est une mince bande de terre reliant le [GetGeographicalRegion('RICE_sri_lanka_alt_region').GetName] à l'Inde continentale. C'est un lieu de pèlerinage pour les dévots de certaines sectes hindoues, et il est associé au #italic Ramayana#!, la grande épopée sanskrite."
 activity_RICE_sri_lanka_ramasetu_pilgrimage_selection_tooltip:"Partez en [local_pilgrimage|El] vers Ramasetu, ou le Pont d'Adam, en [GetTitleByKey('c_madurai').GetNameNoTier].\n\n$activity_RICE_sri_lanka_ramasetu_pilgrimage_context_tooltip$"
 activity_RICE_sri_lanka_ramasetu_pilgrimage_context_tooltip:0 "#emphasis Contexte historique :#! Ramasetu, connu internationalement sous le nom de Pont d'Adam, est de nos jours une série de hauts-fonds et d'îles au large de la côte nord-ouest du Sri Lanka. Historiquement, il s'agissait d'un pont terrestre, mais il a pris sa forme actuelle en 1480 à la suite de tempêtes. Quoi qu'il en soit, la région a été associée à un épisode de l'ancienne épopée sanskrite, le #italic Ramayana#!, lorsque le dieu Rama construisit un pont avec l'aide de singes pour atteindre l'île de Lanka et sauver son épouse Sita du roi-démon Ravana. Ce lieu est resté un site religieux important pour différentes croyances pendant des siècles."
 activity_RICE_sri_lanka_ramasetu_pilgrimage_host_desc:"$activity_RICE_local_pilgrimage_host_desc$\n$BULLET_WITH_TAB$Possibilité d'obtenir des [character_modifiers|El] en fonction de votre [piety_level|El]"
