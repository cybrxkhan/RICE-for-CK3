 activity_RICE_sri_lanka_ramasetu_pilgrimage_province_desc: "Ramasetu se trouve dans le centre du Sri Lanka."
 activity_RICE_sri_lanka_ramasetu_pilgrimage_destination_selection: "$activity_RICE_sri_lanka_ramasetu_pilgrimage_province_desc$"
