 sri_lanka.0070.t:0 "Vers [GetPlayer.Custom('RICE_sri_pada')] !"
 sri_lanka.0070.desc:0 "Aujourd'hui, je commence mon voyage vers [GetPlayer.Custom('RICE_sri_pada')]. Ce sera un voyage ardu, traversant des kilomètres et des kilomètres de nature sauvage, sans parler de la montagne elle-même qui sera très difficile à escalader. Cependant, cela en vaudra largement la peine.\n\n[GetPlayer.Custom('RICE_sri_pada')] est la montagne la plus sacrée du [GetGeographicalRegion('RICE_sri_lanka_alt_region').GetName]. En fait, elle est si sacrée que des gens de toutes les religions, pas seulement les [ROOT.Char.GetFaith.GetAdherentNamePlural], y vont en pèlerinage.\n\nL'attraction principale du site est une grande empreinte de pied au sommet, qui aurait été laissée par [GetPlayer.Custom('RICE_sri_pada_footprint_person')] selon les [ROOT.Char.Custom('DefaultPriestTitlePlural')] [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip]. La visiter est assurément un excellent moyen de montrer ma dévotion envers [ROOT.Char.GetFaith.HighGodName] !"
 sri_lanka.0070.a:0 "Il est temps de se rendre à la montagne !"
 sri_lanka.0071.t:0 "Arrivée"
 sri_lanka.0071.desc:0 "Enfin, j'ai atteint [GetPlayer.Custom('RICE_sri_pada')]. La montagne elle-même se dresse bien au-dessus de moi au loin, entourée d'une canopée apparemment infinie d'arbres d'un vert éclatant. Elle semble intimidante, et pourtant j'ai déjà marché tout ce chemin. Il n'est plus question de faire demi-tour !\n\nPour l'instant, cependant, mon entourage et moi devrons récupérer nos forces. Le chemin vers le sommet sera difficile, nous devons donc avoir le corps et l'esprit bien reposés si nous voulons atteindre le pic.\n\nNous nous frayons un chemin à travers des foules de pèlerins - certains étant des [ROOT.Char.GetFaith.GetAdherentNamePlural] comme nous, d'autres des adeptes d'autres croyances - tandis que nous nous préparons à nous reposer pour la nuit. Il est remarquable de voir comment des gens de toutes confessions vénèrent cette montagne, et encore plus remarquable qu'ils maintiennent une paix relative entre eux."
 sri_lanka.0071.a:0 "Vous voyez cette montagne ? Je #italic vais#! la grimper !"
 sri_lanka.0071.info:0 "#emphasis Contexte historique :#! La représentation du pèlerinage dans cette [activity|El] est basée sur le récit détaillé d'Ibn Battûta, un célèbre explorateur musulman marocain du XIVe siècle, qui voyagea dans des contrées aussi lointaines que le Mali, la Chine, l'Espagne et, bien sûr, le Sri Lanka.\n\nIbn Battûta effectua son voyage au Sri Lanka en 1344 de notre ère. Il fut chaleureusement accueilli par le roi de Jaffna, Martanda Cinkaiariyan, qui soutint généreusement ses voyages sur l'île. Lorsqu'Ibn Battûta entreprit lui-même le pèlerinage vers Sri Pada, le roi lui fournit un palanquin porté par les propres esclaves du roi, et dans l'entourage de l'explorateur se trouvaient plusieurs brahmanes hindous.\n\nQuoi qu'il en soit, comme Sri Pada est encore de nos jours un site de pèlerinage majeur, la représentation dans cette [activity|El] et cette chaîne d'événements diffère probablement des conditions actuelles en raison des changements survenus sur le site, ainsi que des personnes qui s'y sont rendues, au fil des siècles."
 sri_lanka.0072.t:0 "En haut de la montagne"
 sri_lanka.0072.desc:0 "Nous avons commencé notre ascension du [GetPlayer.Custom('RICE_sri_pada')]. Il y a deux routes principales menant au pic principal.\n\nL'une, que certains appellent la piste #italic Mama#!, est une marche relativement facile et douce, si bien que quiconque gravit la montagne par ce chemin n'est pas considéré comme un vrai pèlerin. L'autre route, appelée la piste #italic Baba#!, est bien plus difficile, et c'est celle que nous empruntons actuellement.\n\nLe long du parcours, il y a un certain nombre de chaînes le long des escaliers, pour aider les pèlerins à gravir les marches. Je n'en suis même pas à la moitié, et je me sens déjà épuisé[ROOT.Char.Custom('FR_E')] !"
 sri_lanka.0072.a:0 "Je prendrai mon temps pour ne pas me surmener."
 sri_lanka.0072.b:0 "C'est une lutte, mais j'y arriverai."
 sri_lanka.0073.t:0 "Au sommet"
 sri_lanka.0073.desc:0 "Enfin, j'ai atteint le sommet du [GetPlayer.Custom('RICE_sri_pada')] - et quelle vue magnifique ! Contre le ciel d'un bleu pur, on voit surtout des nuages d'un blanc pur entourant la montagne lorsqu'on regarde vers le bas, entrecoupés par la canopée toujours verte des arbres, le tout masquant la base.\n\nMais je ne suis pas ici pour admirer le paysage. Je me hâte de traverser le sommet jusqu'à l'endroit où la plupart des autres pèlerins se rassemblent : une empreinte de pied d'une longueur miraculeusement grande sur un rocher noir élevé.\n\nEnfin, devant mes yeux, se trouve l'empreinte même que [GetPlayer.Custom('RICE_sri_pada_footprint_person')] a laissée il y a si longtemps. Nous passerons quelques jours en prière avant de repartir, mais avant cela, il est de coutume pour les [ROOT.Char.GetFaith.GetAdherentNamePlural] comme moi de faire don d'or et d'objets précieux"
 sri_lanka.0073.desc.abrahamic:0 "à nos guides qui nous ont menés jusqu'à ce lieu saint."
 sri_lanka.0073.desc.non_abrahamic:0 "à laisser dans les neuf trous creusés dans le pied, en guise d'offrande."
 sri_lanka.0073.a:0 "Je ferai don de quelques babioles."
 sri_lanka.0073.b:0 "Je ferai un don considérable !"
 sri_lanka.0074.t:0 "Préparatifs de départ"
 sri_lanka.0074.desc:0 "Après avoir passé des jours en prière, nous commençons à redescendre par le sentier #italic Mama#! du [GetPlayer.Custom('RICE_sri_pada')]. Cette route était peut-être plus facile que celle de la montée, mais c'est tout de même une randonnée éprouvante vers le bas, et lorsque nous atteignons le pied de la montagne, mon entourage et moi sommes épuisés.\n\nAlors que nous reprenons notre souffle, je remarque le célèbre arbre ancien au pied de la montagne. On dit que cet arbre possède des qualités surnaturelles, car ses feuilles ne tombent jamais, et certains ermites affirment même que manger ses feuilles leur rend leur jeunesse. Quelle que soit la vérité, c'est un arbre magnifique, manifestement ancien et sage, et un merveilleux spectacle pour conclure notre voyage."
 sri_lanka.0074.a:0 "Vous voyez cette montagne ? Je l'#italic ai#! bel et bien grimpée !"
