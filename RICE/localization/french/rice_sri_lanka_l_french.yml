 sri_lanka.0050.t:0 "Arrivée à Ramasetu"
 sri_lanka.0050.desc:0 "Enfin, je suis arrivé[ROOT.Char.Custom('FR_E')] sur le site de #bold Ramasetu#!, ou le Pont de Rama.\n\nBien que tous ne soient pas d'accord, beaucoup croient que cette bande de terre reliant l'[GetGeographicalRegion('world_india').GetName] au [GetGeographicalRegion('RICE_sri_lanka_alt_region').GetName] est le pont même, mentionné dans la grande épopée #italic Ramayana#!, que le seigneur Rama construisit avec l'aide des singes pour atteindre l'île de Lanka et secourir son épouse, Sita, des griffes du roi démon Ravana.\n\nC'est pourquoi cette région est depuis de nombreuses années une destination majeure pour les pèlerins. À présent, je me retrouve entouré[ROOT.Char.Custom('FR_E')] par des foules de dévots se dirigeant dans la même direction que moi : le temple de Ramanathaswamy, le centre du lieu de pèlerinage dédié à Shiva."
 sri_lanka.0050.a:0 "Après un peu de repos, nous nous rendons au temple."
 sri_lanka.0051.t:0 "Temple de Ramanathaswamy"
 sri_lanka.0051.desc:0 "Aujourd'hui, je pénètre dans le temple de Ramanathaswamy. Il est inspirant de parcourir ces grands corridors que certains prétendent être les plus longs de tous les temples de [GetGeographicalRegion('world_india').GetName].\n\nQuoi qu'il en soit, je me rends devant les principaux #italic lingams#! du temple, qui servent de symboles sacrés du dieu Shiva. En particulier, je me dirige vers celui connu sous le nom de #italic Vishvalingam#!. On dit que Hanuman, le singe divin et disciple de Rama, l'apporta ici depuis le Kailash, et que Rama ordonna que ce lingam devait être vénéré en premier.\n\nAprès avoir pris part à quelques prières et rituels, je vais ensuite prier devant le lingam suivant, le #italic Ramalingam#!, que Rama et Sita construisirent à partir de sable."
 sri_lanka.0051.a:0 "C'est un endroit merveilleux."
 sri_lanka.0052.t:0 "Les Tirthas"
 sri_lanka.0052.desc:0 "Je me prépare maintenant à visiter quelques-uns des #italic tirthas#!, ou plans d'eau sacrés, liés au temple de Ramanathaswamy. Ce sont souvent des sites prisés des pèlerins visitant Ramasetu, car s'y baigner procurerait de nombreux bienfaits spirituels et médicinaux, y compris l'absolution de ses péchés.\n\nCertains des tirthas se trouvent à l'extérieur du temple, comme Agni Tirtham, qui est une plage à l'est. D'autres tirthas se trouvent dans l'enceinte du temple.\n\nQuoi qu'il en soit, tandis que je me baigne dans ces tirthas, je devrais me souvenir de me concentrer sur les questions spirituelles et d'offrir mon culte au Seigneur Shiva."
 sri_lanka.0052.a:0 "Il est temps de faire pénitence."
 sri_lanka.0051.a.tooltip:0 "L'expérience vous inspire spirituellement"
 sri_lanka.0053.t:0 "Quitter Ramasetu"
 sri_lanka.0053.desc:0 "Ma visite au temple de Ramanathaswamy, et par extension à Ramasetu, est arrivée à son terme. Ce fut une grande expérience spirituelle, de visiter ce lieu qui occupe une place si importante dans le #italic Ramayana#!, et de méditer sur l'héroïsme et la vertu de Rama, Sita, Hanuman, et bien d'autres, tout en ayant la possibilité de me consacrer au Seigneur Shiva.\n\nEn somme, ma visite à Ramasetu est une expérience que je n'oublierai pas de sitôt."
 sri_lanka.0053.a:0 "Il est temps de commencer le voyage de retour."
