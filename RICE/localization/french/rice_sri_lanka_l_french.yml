 # Artifacts
 RICE_sri_lanka_panakaduwa_copper_plate_name:0 "Plaque de cuivre de Panakaduwa"
 RICE_sri_lanka_panakaduwa_copper_plate_desc:0 "Cette plaque de cuivre a été réalisée à la demande de [vijayabahu_equivalent.GetTitledFirstName] afin non seulement de commémorer les exploits de [budal.GetTitledFirstName], mais aussi d'enregistrer officiellement les privilèges juridiques et politiques extraordinaires que [vijayabahu_equivalent.GetFirstNameNoTooltip] accorda à [budal.GetFirstNameNoTooltip] et à ses descendants. Lorsque [vijayabahu.GetFirstNameNoTooltip] n'était qu'un jeune prince, pas encore même adulte et en fuite devant les armées d'invasion des Cholas, survivant désespérément dans les terres sauvages, [budal.GetFirstNameNoTooltip] fut le protecteur indéfectible de [vijayabahu.GetFirstNamePossessiveNoTooltip]. À ce titre, peu contesteraient le rôle essentiel de [budal.GetFirstNamePossessiveNoTooltip] dans la victoire sur les Cholas et la réunification du [GetGeographicalRegion('RICE_sri_lanka_alt_region').GetName]."
 RICE_sri_lanka_pali_literature_basic:0 "Cet ouvrage de littérature pāli a été écrit par des moines ou un moine de l'ordre [ROOT.Char.Custom('RICE_sri_lanka_patronized_monastery')]. Il a été commandé par [ROOT.Char.GetTitledFirstName].\n\n"
 RICE_sri_lanka_pali_literature_kavya_legends_name:0 "Littérature pāli (poésie #italic Kavya#!)"
 RICE_sri_lanka_pali_literature_kavya_legends_desc:0 "$RICE_sri_lanka_pali_literature_basic$Ce texte est un #italic kavya#!, une forme de poésie courtoise sanskrite originaire du continent indien, mais adaptée à la langue pāli. Malgré son style sensuel, ce poème utilise une telle esthétique mondaine pour inspirer son auditoire bouddhiste à une plus grande dévotion religieuse, par exemple en expliquant les mérites de la pratique spirituelle ou d'une vie vertueuse, ou en racontant une légende bouddhiste d'une figure célèbre comme le Bouddha, un Bodhisattva ou un être éveillé, ou un moine historique."
 RICE_sri_lanka_pali_literature_grammatical_aid_name:0 "Littérature pāli (Manuel de grammaire)"
 RICE_sri_lanka_pali_literature_grammatical_aid_desc:0 "$RICE_sri_lanka_pali_literature_basic$ Ce texte est un traité destiné à aider le lecteur à apprendre et à maîtriser la grammaire de langues très estimées et largement utilisées dans certaines sectes bouddhistes, en particulier le pāli ou le sanskrit. Selon ce texte, la maîtrise de ces langues n'est pas seulement une question intellectuelle, mais aussi une question de développement spirituel, car elle permet de comprendre l'arrière-plan religieux et philosophique des textes sacrés et des commentaires écrits dans ces langues."
 RICE_sri_lanka_pali_literature_doctrinal_manual_name:0 "Littérature pāli (manuel doctrinal)"
 RICE_sri_lanka_pali_literature_doctrinal_manual_desc:0 "$RICE_sri_lanka_pali_literature_basic$ Ce texte est un résumé de diverses questions relatives à la théologie, à la philosophie et/ou au code monastique bouddhiste. En tant que recueil et exposé d'idées importantes, parfois complexes, il aidera certainement tous ceux qui souhaitent comprendre la Voie du Milieu du Bouddha."
 RICE_sri_lanka_pali_literature_historical_chronicle_name:0 "Littérature pāli (#italic Vamsa#!)"
 RICE_sri_lanka_pali_literature_historical_chronicle_desc:0 "$RICE_sri_lanka_pali_literature_basic$Ce texte est un #italic vamsa#!, une chronique historique sur la vie et l'époque de divers rois, moines, généraux, fonctionnaires et autres figures importantes liées à l'histoire des terres bouddhistes. Il montre les exploits de héros bouddhistes vertueux et éminents du passé, ainsi que les souffrances que les vilains et les hérétiques endurent en raison de leur incapacité à abandonner les trois poisons que sont l'illusion, le désir et la colère."
 RICE_sri_lanka_pali_literature_sub_commentaries_name:0 "Littérature pāli (#italic Tika#!)"
 RICE_sri_lanka_pali_literature_sub_commentaries_desc:0 "$RICE_sri_lanka_pali_literature_basic$Ce texte est une #italic tika#!, un sous-commentaire des commentaires du Canon pāli du bouddhisme. Il développe davantage un commentaire notable écrit il y a longtemps, qui traitait de questions de théologie bouddhiste, de philosophie et de pratique religieuse. De tels commentaires peuvent être denses, c'est pourquoi ce sous-commentaire aide les lecteurs à développer une compréhension du sens et de l'objectif du texte original."

 # Buildings
 building_type_RICE_sri_lanka_ruins_of_anuradhapura:0 "Ruines d'Anuradhapura"
 building_type_RICE_sri_lanka_ruins_of_anuradhapura_desc:0 "Anuradhapura fut autrefois la capitale resplendissante du [GetGeographicalRegion('RICE_sri_lanka_alt_region').GetName], un centre d'apprentissage bouddhiste et de commerce maritime. Cependant, à la suite d'invasions et de bouleversements politiques, elle a perdu sa prééminence et une grande partie de la ville est abandonnée. Les habitants restants vivent au milieu de ruines imposantes qui rappellent les jours de gloire passés de la cité."
 building_RICE_sri_lanka_ruins_of_anuradhapura:0 "$building_type_RICE_sri_lanka_ruins_of_anuradhapura$"
 building_RICE_sri_lanka_ruins_of_anuradhapura_desc:0 "$building_type_RICE_sri_lanka_ruins_of_anuradhapura_desc$"

