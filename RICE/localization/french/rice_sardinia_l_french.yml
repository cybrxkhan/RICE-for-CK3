 RICE_sardinia_palio_ruler_won_log:0 "Le cheval qui a gagné la [palio_race|E] appartenait à la [house|E] [CHARACTER.GetHouse.GetBaseName]."
 RICE_sardinia_palio_mercato_log_title:0 "Shopping au Mercato"
 RICE_sardinia_palio_mercato_log:0 "[CHARACTER.GetShortUIName|U] est allé faire du shopping au #italic mercato#! après la fin du [palio|E]."
 RICE_sardinia_palio_race_religious_province_desc:0 "\n#P ++ Il existe une célèbre tradition religieuse de [palio_race|E] dans ce [county|E].#!\n\n#italic Cela vous permettra d'obtenir des bonus supplémentaires par rapport à d'autres lieux potentiels SI un [palio|E] #V religieux#! est organisé.#!"
 RICE_sardinia_palio_race_civic_province_desc:0 "\n#P ++ Il existe une célèbre tradition civique de [palio_race|E] dans ce [county|E].#!\n\n#italic Cela permettra d'obtenir des bonus supplémentaires par rapport à d'autres lieux potentiels Si un [palio|E] #V civique#! est organisé.#!"
 RICE_sardinia_palio_race_dynastic_province_desc:0 "\n#P ++ Il existe une célèbre tradition dynastique de [palio_race|E] dans ce [county|E].#!\n\n#italic Cela permettra d'obtenir des bonus supplémentaires par rapport aux autres lieux potentiels SI un [palio|E] #V dynastique#! est organisé.#!"

 # Modifiers
 RICE_sardinia_palio_race_religious_modifier:0 "Tradition religieuse du Palio"
 RICE_sardinia_palio_race_religious_modifier_desc:0 "Cette région abrite un palio célèbre qui honore un saint local ou une personne sainte. Cette tradition du palio attire des spectateurs de près et de loin, et renforce la renommée de la localité, en particulier en ce qui concerne sa réputation spirituelle.\n\n#EMP Lorsqu'une [GetActivityType( 'activity_RICE_sardinia_palio_race' ).GetName] est organisée dans ce [county|E], l'[host|E] et les participants recevront #P +50%#! aux récompenses de base en [prestige_i|E][prestige|E] et [piety_i|E][piety|E] si l'[activity_option|E] #bold Religieuse#! est choisie.#!"
 RICE_sardinia_palio_race_civic_modifier:0 "Tradition civique du Palio"
 RICE_sardinia_palio_race_civic_modifier_desc:0 "Cette région abrite un célèbre palio qui célèbre les liens communautaires de la région. Cette tradition du palio attire des spectateurs de près et de loin, renforce la renommée du lieu, et est connue pour ses opportunités sociales et la fierté civique des participants.\n\n#EMP Lorsqu'une [GetActivityType( 'activity_RICE_sardinia_palio_race' ).GetName] est organisée dans ce [county|E], l'[host|E] et les participants recevront #P +50%#! aux récompenses de base en [prestige_i|E][prestige|E] et [piety_i|E][piety|E] si l'[activity_option|E] #bold Civique#! est choisie.#!"
 RICE_sardinia_palio_race_dynastic_modifier:0 "Tradition Dynastique du Palio"
 RICE_sardinia_palio_race_dynastic_modifier_desc:0 "Cette région abrite un palio célèbre qui célèbre les légendes et le prestige des anciens dirigeants de la région. Cette tradition du palio attire des spectateurs de près et de loin, et renforce la renommée du lieu, ainsi que la connaissance de son histoire et de sa mythologie.\n\n#EMP Lorsqu'une [GetActivityType( 'activity_RICE_sardinia_palio_race' ).GetName] est organisée dans ce [county|E], l'[host|E] et les participants recevront #P +50%#! aux récompenses de base en [prestige_i|E][prestige|E] et [piety_i|E][piety|E] si l'[activity_option|E] #bold Dynastique#! est choisie.#!"
 RICE_sardinia_north_african_settlement_modifier:0 "Sardaniya"
 RICE_sardinia_north_african_settlement_modifier_desc:0 "Cette région d'Afrique du Nord abrite une ville fondée par des migrants chrétiens sardes, appelée Sardaniya d'après leur patrie. Elle est connue pour ses fruits et entretient une alliance solide avec les tribus locales, malgré les différences culturelles ou religieuses qui peuvent exister.\n\n#EMP Les [courtiers|E] chrétiens sardes ont une faible chance d'apparaître à la [court|E] des [rulers|E] qui possèdent ce [county|E] ou se trouvent à proximité.#!"
 RICE_is_ali_ibn_mujahid:0 "Fils de Muyahid"
 RICE_is_ali_ibn_mujahid_desc:0 "Le père d'Ali, Muyahid, envahit l'île de Sardaigne en 1015 de notre ère. Il est vaincu par les républiques de Pise et de Gênes, qui capturent le jeune Ali et l'emmènent à la cour du Saint Empereur romain, où il est élevé dans la foi chrétienne. Ali, érudit et vertueux, s'est reconverti à l'islam, mais conserve des sympathies pour les chrétiens.\n\nCommence avec une [unpressed_claim|E] sur [GetTitleByKey('d_sardinia').GetNameNoTier] et ses [counties|E]"
 RICE_sardinia_malaria_modifier:0 "Épidémie de paludisme en Sardaigne"
 RICE_sardinia_malaria_modifier_desc:0 "Depuis l'Antiquité, la Sardaigne est réputée pour être un foyer de paludisme. Actuellement, cette région souffre d'une épidémie de cette maladie."
 RICE_sardinia_latin_monks:0 "Moines latins en Sardaigne"
 RICE_sardinia_opinion_pope_catholic_decision:0 "Église catholique soutenue en Sardaigne"
 RICE_sardinia_byzantine_administration:0 "Administration byzantine revitalisée en Sardaigne"
 RICE_sardinia_opinion_roman_emperor_decision:0 "Administration de la Sardaigne revitalisée"
 RICE_sardinia_north_african_networks:0 "Extension des réseaux nord-africains en Sardaigne"
 RICE_sardinia_north_african_option_piracy:0 "Augmentation de la piraterie en Sardaigne"
 RICE_sardinia_north_african_option_piracy_desc:0 "L'importance économique de la Sardaigne, qui relie l'Afrique du Nord et l'Europe occidentale, ne cesse de croître, ce qui attire l'attention des pirates des deux côtés de la Méditerranée. De petits repaires et bases de pirates sont disséminés dans la région, s'attaquant à la population locale et aux navires de commerce qui passent par là."
 RICE_sardinia_none_fortifications:0 "Fortifications sardes"
 RICE_sardinia_north_african_decision_opinion_lesser:0 "Liens mineurs entre la Sardaigne et l'Afrique du Nord"
 RICE_sardinia_north_african_decision_opinion_greater:0 "Liens majeurs entre la Sardaigne et l'Afrique du Nord"
 RICE_sardinia_cagliari_salt_modifier:0 "Salines de Cagliari"
 RICE_sardinia_cagliari_salt_modifier_desc:0 "Plusieurs marais salants sont situés près de la ville sarde de Cagliari. Elles sont exploitées depuis l'époque romaine et rapportent beaucoup à ceux qui ont la chance de les contrôler."
 RICE_sardinia_condaghe_modifier:0 "Dossiers Condaghe de la famille réorganisée"
 RICE_sardinia_palio_horse_investment_small_modifier:0 "Investissement mineur dans les chevaux de course du Palio"
 RICE_sardinia_palio_horse_investment_small_modifier_desc:0 "#EMP Augmente de manière infime les chances de gagner les [palio_races|E].#!"
 RICE_sardinia_palio_horse_investment_medium_modifier:0 "Investissement majeur dans les chevaux de course du Palio"
 RICE_sardinia_palio_horse_investment_medium_modifier_desc:0 "#EMP Augmente légèrement les chances de gagner les [palio_races|E].#!"
 RICE_sardinia_palio_horse_investment_large_modifier:0 "Excellent investissement dans les chevaux de course du Palio"
 RICE_sardinia_palio_horse_investment_large_modifier_desc:0 "#EMP Augmente modérément les chances de gagner les [palio_races|E]#!"
 RICE_sardinia_palio_victory_minor:0 "Bannière du Palio"
 RICE_sardinia_palio_victory_minor_desc:0 "Cette [house|E] a récemment remporté une [palio_race|E] locale. En récompense de la victoire de son cheval, elle a gagné une bannière standard du [palio|E]."
 RICE_sardinia_palio_victory_major:0 "Grande bannière du Palio"
 RICE_sardinia_palio_victory_major_desc:0 "Cette [house|E] a récemment remporté une [palio_race|E] de renom. En récompense de la victoire de leur cheval, ils ont gagné une bannière du [palio|E] d'un grand raffinement et d'une belle apparence."
 RICE_sardinia_palio_victory_great:0 "Magnifique bannière du Palio"
 RICE_sardinia_palio_victory_great_desc:0 "Cette [house|E] a récemment remporté une importante [palio_race|E]. En récompense de la victoire de leur cheval, ils ont gagné une bannière du [palio|E] d'une beauté inégalée."
 RICE_sardinia_mercato_trinkets:0 "Bibelots d'un marché"
 RICE_sardinia_mercato_trinkets_desc:0 "Ce personnage a récemment acheté un certain nombre d'articles de luxe, comme des bijoux et des draperies, dans un #italic mercato#! ou marché public, organisé par les guildes locales après une [palio_race|E]."
 RICE_sardinia_palio_modifier_gold_small:0 "Palio mineur"
 RICE_sardinia_palio_modifier_gold_small_desc:0 "Un palio local palpitant s'est récemment tenu ici. La compétition intense entre les chevaux et la splendeur de la bannière du palio remise à la maison gagnante, en plus de tous les autres événements amusants, ont fait de cet événement un moment inoubliable qui a inspiré les habitants de la région."
 RICE_sardinia_palio_modifier_development_small:0 "$RICE_sardinia_palio_modifier_gold_small$"
 RICE_sardinia_palio_modifier_development_small_desc:0 "$RICE_sardinia_palio_modifier_gold_small_desc$"
 RICE_sardinia_palio_modifier_building_small:0 "$RICE_sardinia_palio_modifier_gold_small$"
 RICE_sardinia_palio_modifier_building_small_desc:0 "$RICE_sardinia_palio_modifier_gold_small_desc$"
 RICE_sardinia_palio_modifier_gold_medium:0 "Palio majeur"
 RICE_sardinia_palio_modifier_gold_medium_desc:0 "Un palio de grande envergure s'est récemment déroulé ici. La compétition intense entre les chevaux et la splendeur de la bannière du palio remise à la maison gagnante, en plus de tous les autres événements amusants, ont fait de cet événement un moment inoubliable qui a inspiré les habitants de la région."
 RICE_sardinia_palio_modifier_development_medium:0 "$RICE_sardinia_palio_modifier_gold_medium$"
 RICE_sardinia_palio_modifier_development_medium_desc:0 "$RICE_sardinia_palio_modifier_gold_medium_desc$"
 RICE_sardinia_palio_modifier_building_medium:0 "$RICE_sardinia_palio_modifier_gold_medium$"
 RICE_sardinia_palio_modifier_building_medium_desc:0 "$RICE_sardinia_palio_modifier_gold_medium_desc$"
 RICE_sardinia_palio_modifier_gold_large:0 "Grand Palio"
 RICE_sardinia_palio_modifier_gold_large_desc:0 "Un magnifique palio s'est récemment déroulé ici. La compétition intense entre les chevaux et la splendeur de la bannière du palio remise à la maison gagnante, en plus de tous les autres événements amusants, ont fait de cet événement un moment inoubliable qui a inspiré les habitants de la région."
 RICE_sardinia_palio_modifier_development_large:0 "$RICE_sardinia_palio_modifier_gold_large$"
 RICE_sardinia_palio_modifier_development_large_desc:0 "$RICE_sardinia_palio_modifier_gold_large_desc$"
 RICE_sardinia_palio_modifier_building_large:0 "$RICE_sardinia_palio_modifier_gold_large$"
 RICE_sardinia_palio_modifier_building_large_desc:0 "$RICE_sardinia_palio_modifier_gold_large_desc$"
 opinion_attended_palio_guest:0 "M'a invité au Palio"
 opinion_attended_palio_host:0 "A assisté à Mon Palio"
 RICE_sardinia_alghero_modifier:0 "Communauté algheroise"
 RICE_sardinia_alghero_modifier_desc:0 "La ville d'Alghero abrite une importante communauté issue des colons ibériques, qui parle l'algherese, un dialecte d'une langue ibérique. En raison des liens de la communauté avec l'Ibérie, la ville est devenue un centre important pour le commerce et le trafic maritime."
 RICE_sardinia_bad_casu_marzu:0 "Les problèmes digestifs du Casu Marzu"
 RICE_sardinia_seadas:0 "Manger de savoureuses seadas sardes"
 RICE_sardinia_bidemortos_marked:0 "Avertissement inquiétant d'un Bidemortos"
 RICE_sardinia_bidemortos_marked_desc:0 "Un #italic bidemortos#!, une personne qui, selon le folklore sarde, a la capacité de voir les défunts, aurait vu ce personnage dans un cortège de morts. Cela signifierait que ce personnage va mourir - bientôt."
 RICE_sardinia_aradia_bad_dream:0 "Puni par Aradia dans un rêve"
 RICE_sardinia_aradia_bad_dream_desc:0 "Aradia, une figure du folklore sarde, a rendu visite à cette femme dans un rêve. Elle l'a punie parce qu'elle était supposée être paresseuse dans son travail de filage et de tissage."
 RICE_sardinia_aradia_good_dream:0 "Récompensé par Aradia dans un rêve"
 RICE_sardinia_aradia_good_dream_desc:0 "Aradia, figure du folklore sarde, a rendu visite à cette femme dans un rêve. Elle l'a récompensée pour son prétendu travail acharné de filage et de tissage."
 RICE_sardinia_public_prayers_to_saint_saturninus:0 "Prières publiques à Saint Saturnin"
 RICE_sardinia_transformed_nuraghe:0 "Nuraghe transformé en maison de culte"
 RICE_sardinia_shepherds_paths:0 "Exploration de quelques sentiers de bergers en Sardaigne"

 # Decisions
 RICE_sardinia_decide_sardinia_orientation:0 "Déterminer l'orientation de la Sardaigne"
 RICE_sardinia_decide_sardinia_orientation_tooltip:0 "L'Occident latin et l'Orient grec se disputent depuis longtemps l'influence de la [GetGeographicalRegion('RICE_sardinia_region').GetName] ; l'île doit déterminer où se situe son allégeance."
 RICE_sardinia_decide_sardinia_orientation_desc:0 "Depuis des générations, la [GetGeographicalRegion('RICE_sardinia_region').GetName] se trouve maladroitement à cheval entre les mondes de l'Occident latin et de l'Orient grec, comme une périphérie au centre de la Méditerranée. Il est temps pour les #italic judicati#!, ou juges de l'île de déterminer vers qui ils se tournent pour obtenir des conseils et du soutien."
 RICE_sardinia_decide_sardinia_orientation_confirm:0 "Le destin attend la Sardaigne !"
 RICE_sardinia_decide_sardinia_orientation_effect_tooltip.catholic.1:0 "Toutes les [cultures|E] ayant la [tradition|E] $tradition_RICE_judicati_name$ deviennent #bold [heritage|E] $heritage_latin_name$#! si ce n'est pas déjà le cas"
 RICE_sardinia_decide_sardinia_orientation_effect_tooltip.catholic.2:0 "La [decision|E] de #bold $RICE_sardinia_catholic_decision$#! est débloquée pour les [rulers|E] en [GetGeographicalRegion('RICE_sardinia_region').GetName]"
 RICE_sardinia_decide_sardinia_orientation_effect_tooltip.orthodox.1:0 "Toutes les [cultures|E] ayant la [tradition|E] $tradition_RICE_judicati_name$ deviennent #bold [heritage|E] $heritage_byzantine_name$#! si ce n'est pas déjà le cas"
 RICE_sardinia_decide_sardinia_orientation_effect_tooltip.orthodox.2:0 "La [decision|E] de #bold $RICE_sardinia_orthodox_decision$#! est débloquée pour les [rulers|E] en [GetGeographicalRegion('RICE_sardinia_region').GetName]"
 RICE_sardinia_decide_sardinia_orientation_effect_tooltip.north_african.1:0 "Toutes les [cultures|E] ayant la [tradition|E] $tradition_RICE_judicati_name$ deviennent #bold [heritage|E] $heritage_berber_name$#! si ce n'est pas déjà le cas."
 RICE_sardinia_decide_sardinia_orientation_effect_tooltip.north_african.2:0 "La [decision|E] de #bold $RICE_sardinia_north_african_decision$#! est débloquée pour les [rulers|E] en [GetGeographicalRegion('RICE_sardinia_region').GetName]"
 RICE_sardinia_decide_sardinia_orientation_effect_tooltip.none.1:0 "Toutes les [cultures|E] avec la [tradition|E] $tradition_RICE_judicati_name$ peuvent changer pour être d'[heritage|E] #bold $heritage_latin_name$#!, #bold $heritage_byzantine_name$#!, ou #bold $heritage_berber_name$#! si vous le souhaitez"
 RICE_sardinia_decide_sardinia_orientation_effect_tooltip.none.2:0 "La [decision|E] de #bold $RICE_sardinia_none_decision$#! est débloquée pour les [rulers|E] de [GetGeographicalRegion('RICE_sardinia_region').GetName]"
 RICE_sardinia_decide_sardinia_orientation_context_tooltip:0 "#emphasis Contexte Historique :#! Bien que la Sardaigne fasse aujourd'hui partie de l'Italie, elle était liée à de nombreuses autres parties de la Méditerranée dans l'Antiquité et au Moyen Âge. Au fil des siècles, elle a subi l'influence des sociétés punique, grecque, romaine, vandale, byzantine, arabe et berbère, italienne et ibérique, ou a eu des interactions avec elles."
 CHOOSE_SARDINIA_ORIENTATION:0 "$RICE_sardinia_decide_sardinia_orientation_confirm$"
 choose_catholic_name: "Occident Latin"
 choose_catholic_desc: "$choose_catholic_name$"
 choose_catholic_tooltip:"[GetTitleByKey('b_roma').GetNameNoTier] est plus proche de la [GetGeographicalRegion('RICE_sardinia_region').GetName] que [GetTitleByKey('b_constantinople').GetNameNoTier], qui a négligé l'île depuis trop longtemps. En soutenant les efforts de l'Église [GetFaithByKey('catholic').GetAdjective] pour étendre son influence sur l'île, nous pouvons améliorer nos liens avec l'Occident latin et trouver un nouvel espoir pour l'avenir."
 choose_orthodox_name:"Grec oriental"
 choose_orthodox_desc: "$choose_orthodox_name$"
 choose_orthodox_tooltip: "Après la perte de l'Afrique du Nord au profit de l'[GetReligionByKey('islam_religion').GetName], la [GetGeographicalRegion('RICE_sardinia_region').GetName] est devenu un important avant-poste de l'[GetTitleByKey('e_byzantium').GetNameNoTier], malgré la distance physique qui sépare l'île de [GetTitleByKey('b_constantinople').GetNameNoTier]. Nous devons renforcer les liens de l'île avec l'Orient grec si nous voulons qu'elle prospère."
 choose_north_african_name: "Afrique du Nord"
 choose_north_african_desc: "$choose_north_african_name$"
 choose_north_african_tooltip: "Bien que nous ayons subi des raids d'[GetGeographicalRegion('world_africa_north').GetName], les dirigeants vaniteux à deux visages de [GetTitleByKey('b_roma').GetNameNoTier] et de [GetTitleByKey('b_constantinople').GetNameNoTier] sont-ils différents ? Nous partageons des liens économiques, culturels et politiques avec l'Afrique depuis de nombreuses années, et nous devrions plutôt cultiver cette relation."
 choose_none_name: "Aucun"
 choose_none_desc: "$choose_none_name$"
 choose_none_tooltip:"L'[GetTitleByKey('e_byzantium').GetNameNoTier] a effectivement jeté la [GetGeographicalRegion('RICE_sardinia_region').GetName] aux loups en se repliant vers leurs terres d'origine. Pourtant, nous ne pouvons faire confiance aux intentions de la [GetTitleByKey('k_papal_state').GetDefinitiveName] et de ses laquais cupides, ni aux seigneurs de guerre voraces d'[GetGeographicalRegion('world_africa_north').GetName]. Nous devons réorienter l'île pour qu'elle forge sa propre voie, spirituellement et politiquement."
 RICE_sardinia_inaugurate_major_palio:0 "Inauguration d'un palio majeur"
 RICE_sardinia_inaugurate_major_palio_tooltip:0 "Instaurons une grande tradition dans nos terres !"
 RICE_sardinia_inaugurate_major_palio_desc:0 "Dans les centres urbains [GetPlayer.GetCulture.GetName], la tradition d'organiser des [palio_races|E] gagne en popularité. [GetPlayer.GetCapitalLocation.GetCounty.GetTitle.GetName] devrait accueillir un [palio|E] annuel si grandiose, si magnifique, si palpitant, qu'il sera considéré comme un exemple de [palios|E] dans toute la région."
 RICE_sardinia_inaugurate_major_palio_confirm:0 "Allons-y !"
 RICE_sardinia_inaugurate_major_palio_effect_tooltip_1:0 "Pour les futures [activities|E] [GetActivityType( 'activity_RICE_sardinia_palio_race' ).GetName] tenues à [GetPlayer.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTier], l'[host|E] et les participants recevront #P +50%#! aux récompenses de base en [prestige_i|E][prestige|E] et [piety_i|E][piety|E] lorsque l'[activity_option|E] #V Religieuse#! est choisie"
 RICE_sardinia_inaugurate_major_palio_effect_tooltip_2:0 "Pour les futures [activities|E] [GetActivityType( 'activity_RICE_sardinia_palio_race' ).GetName] tenues à [GetPlayer.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTier], l'[host|E] et les participants recevront #P +50%#! aux récompenses de base en [prestige_i|E][prestige|E] et [piety_i|E][piety|E] lorsque l'[activity_option|E] #V Civique#! est choisie"
 RICE_sardinia_inaugurate_major_palio_effect_tooltip_3:0 "Pour les futures [activities|E] [GetActivityType( 'activity_RICE_sardinia_palio_race' ).GetName] tenues à [GetPlayer.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTier], l'[host|E] et les participants recevront #P +50%#! aux récompenses de base en [prestige_i|E][prestige|E] et [piety_i|E][piety|E] lorsque l'[activity_option|E] #V Dynastique#! est choisie"
 RICE_sardinia_inaugurate_major_palio_effect_tooltip_4:0 "@warning_icon! #X Il ne peut y avoir qu'#V un seul#! palio majeur par [duchy|E] [de_jure|E]#!"
 RICE_sardinia_inaugurate_major_palio_context_tooltip:0 "#emphasis Contexte Historique :#! $activity_RICE_sardinia_palio_race_context_tooltip$"
 CHOOSE_MAJOR_PALIO_TYPE:0 "Notre palio sera le plus grand de tous les temps !"
 choose_religious_name: "Fête religieuse"
 choose_religious_desc: "$choose_religious_name$"
 choose_religious_tooltip:"Le célèbre [palio|E] de [GetPlayer.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTier] se tiendra dans le cadre d'un festival honorant un saint ou une personne sainte locale. [GetPlayer.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip] deviendra renommée pour notre dévotion spirituelle envers notre [faith|E] à travers ces festivités."
 choose_civic_name: "Commémoration civique"
 choose_civic_desc: "$choose_civic_name$"
 choose_civic_tooltip:"Le célèbre [palio|E] de [GetPlayer.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTier] commémorera un événement majeur de l'histoire de la région. En honorant notre passé et en bâtissant un sentiment de communauté à [GetPlayer.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip] sans précédent dans la région, les gens seront inspirés à accomplir de grands exploits."
 choose_dynastic_name: "Célébration dynastique"
 choose_dynastic_desc: "$choose_dynastic_name$"
 choose_dynastic_tooltip:"Le célèbre [palio|E] de [GetPlayer.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTier] célébrera les accomplissements et les triomphes des [rulers|E] locaux. Ce faisant, les habitants de [GetPlayer.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip] pourront mieux apprécier ceux qui portent le fardeau de régner sur eux."
 RICE_saridinia_sardaniya_decision:0 "Bienvenue aux migrants chrétiens sardes"
 RICE_saridinia_sardaniya_decision_tooltip:0 "Certains chrétiens de Sardaigne souhaitent s'installer en [GetGeographicalRegion('RICE_ifriqiya_region').GetName]"
 RICE_saridinia_sardaniya_decision_desc:0 "Le [GetReligionByKey('christianity_religion').GetName] est présent en [GetGeographicalRegion('RICE_ifriqiya_region').GetName] depuis de nombreux siècles. Pour renforcer les effectifs de la communauté, certains migrants [GetReligionByKey('christianity_religion').GetAdjectiveNoTooltip] venus de [GetGeographicalRegion('RICE_sardinia_region').GetName] souhaitent s'installer quelque part en [GetGeographicalRegion('RICE_ifriqiya_region').GetName]. Certains descendent même de Nord-Africains qui sont partis il y a des générations."
 RICE_saridinia_sardaniya_decision_confirm:0 "Peut-être pouvons-nous conclure un accord favorable ?"
 RICE_saridinia_sardaniya_decision_effect_tooltip_1:0 "Les [courtiers|E] chrétiens sardes ont une petite chance de se retrouver à la [court|E] des [rulers|E] qui possèdent ou sont proches du [county|E] dans lequel les Sardes finissent par s'installer"
 RICE_saridinia_sardaniya_decision_effect_tooltip_2:0 "Un [county|E] aléatoire de votre [domain|E] obtiendra le [modifier|E] [GetModifier('RICE_sardinia_north_african_settlement_modifier').GetNameWithTooltip] de façon permanente et une légère augmentation de [development|E] [development_i|E]"
 RICE_saridinia_sardaniya_decision_context_tooltip:0 "#emphasis Contexte Historique :#! Les sources musulmanes médiévales parlent d'une ville nommée Sardaniya, fondée par un groupe de Sardes médiévaux. Elle se trouvait non loin de Kairouan, en Afrique du Nord, et a survécu pendant quelques siècles. Il se peut qu'il s'agisse de descendants de chrétiens nord-africains ayant fui vers la Sardaigne plusieurs générations auparavant."
 RICE_ifriqiya_region_geographical_req:0 "Posséder au moins un [county|E] en [GetGeographicalRegion('RICE_ifriqiya_region').GetName]"
 RICE_sardinia_catholic_decision:0 "Renforcer l'église latine en Sardaigne"
 RICE_sardinia_catholic_decision_tooltip:0 "La [GetGeographicalRegion('RICE_sardinia_region').GetName] a un besoin urgent de moines latins instruits"
 RICE_sardinia_catholic_decision_desc:0 "Depuis que la [GetGeographicalRegion('RICE_sardinia_region').GetName] a changé son orientation vers l'Occident latin, les [rulers|E] de l'île, comme moi-même, ont fait des efforts constants pour réformer l'église [GetPlayer.GetFaith.GetReligion.GetAdjective] ici. Un bon moyen d'y parvenir est de travailler avec le Saint-Siège pour faire venir les autorités ecclésiastiques et reconstruire les édifices religieux."
 RICE_sardinia_catholic_decision_confirm:0 "L'Église de Sardaigne va prospérer !"
 RICE_sardinia_catholic_decision_effect_tooltip_1:0 "Il y a une petite chance qu'un [ruler|E] [GetReligionByKey('christianity_religion').GetAdjective] voisin en dehors de la [GetGeographicalRegion('RICE_sardinia_region').GetName] obtienne une [unpressed_claim|E] sur l'un de vos [counties|E] sur l'île."
 RICE_sardinia_catholic_decision_effect_tooltip_2:0 "Il y a une petite chance qu'un [GetFaithByKey('catholic').PriestMale] [GetFaithByKey('catholic').GetAdjective] apparaisse en tant que [courtier|E]"
 RICE_sardinia_catholic_decision_effect_tooltip_3:0 "Le montant de [piety|E] que vous gagnez dépend de si votre [faith|E] est [GetFaithByKey('catholic').GetName], possède la [doctrine|E] [GetFaithDoctrine('special_doctrine_ecumenical_christian').GetBaseName], ou est une autre [faith|E] [GetReligionByKey('christianity_religion').GetAdjective]"
 RICE_sardinia_catholic_decision_context_tooltip:0 "#emphasis Contexte historique :#! Jusqu'au XIe siècle, l'Église sarde était dans l'orbite du christianisme byzantin. Avec le déclin de l'autorité byzantine et dans le contexte du Grand Schisme de 1054, le Saint-Siège a renoué les relations avec la Sardaigne à la fin du XIe siècle, tentant d'exercer son autorité sur le clergé local et de réformer l'infrastructure religieuse de la Sardaigne pour la rendre plus conforme au reste de l'Église catholique, avec des résultats mitigés dans un premier temps. La République de Pise et, dans une moindre mesure, d'autres royaumes chrétiens voisins comme Gênes, se sont fortement impliqués dans cet effort, en partie pour atteindre leurs objectifs d'étendre leur influence sur l'île."
 RICE_sardinia_orthodox_decision:0 "Revitaliser l'administration byzantine en Sardaigne"
 RICE_sardinia_orthodox_decision_tooltip:0 "La [GetGeographicalRegion('RICE_sardinia_region').GetName] nécessite des améliorations juridiques et bureaucratiques"
 RICE_sardinia_orthodox_decision_desc:0 "Depuis que la [GetGeographicalRegion('RICE_sardinia_region').GetName] s'est réorientée vers l'Orient grec, les [rulers|E] de l'île, comme moi-même, n'ont cessé de s'efforcer de reconstruire l'infrastructure administrative perdue au fil des siècles à cause des guerres, des conflits et de la négligence. L'île va prospérer grâce à de nouvelles lois, chartes, nominations officielles et procédures gouvernementales."
 RICE_sardinia_orthodox_decision_confirm:0 "L'héritage de Rome se perpétue."
 RICE_sardinia_orthodox_decision_effect_tooltip_1:0 "Il y a une faible chance que le [ruler|E] de L' [GetTitleByKey('e_byzantium').GetNameNoTier] ou [GetTitleByKey('h_roman_empire').GetNameNoTier], ou l'un de leurs [vassals|E], obtienne une [hook_i|E][hook|E] sur vous (forte ou faible)"
 RICE_sardinia_orthodox_decision_effect_tooltip_2:0 "Il y a une petite chance qu'un administrateur byzantin apparaisse sous la forme d'un [courtier|E]"
 RICE_sardinia_orthodox_decision_effect_tooltip_3:0 "Le [prestige|E] que vous gagnez dépend de l'[opinion|E] que le [ruler|E] de l'[GetTitleByKey('e_byzantium').GetNameNoTier] ou de l'[GetTitleByKey('e_roman_empire').GetNameNoTier] a de vous"
 RICE_sardinia_orthodox_decision_context_tooltip:0 "#emphasis Contexte historique :#! L'Empire romain a perdu la Sardaigne aux mains des Vandales en 456 de notre ère, mais l'île a été reconquise par Justinien en 534. Au cours des siècles suivants, elle a servi de frontière occidentale à la domination romaine, en particulier après la conquête arabe de l'Afrique du Nord au VIIe siècle. Dans les années 1000, cependant, elle ne faisait plus partie de la sphère d'influence byzantine ; les raisons de cette situation sont vivement débattues par les spécialistes. Malgré cela, l'influence byzantine sur la religion, le droit et la culture sardes est indéniable."
 RICE_sardinia_north_african_decision:0 "Développer les réseaux nord-africains de la Sardaigne"
 RICE_sardinia_north_african_decision_tooltip:0 "La [GetGeographicalRegion('RICE_sardinia_region').GetName] et l'[GetGeographicalRegion('RICE_ifriqiya_region').GetName] doivent se rapprocher"
 RICE_sardinia_north_african_decision_desc:0 "Depuis que la [GetGeographicalRegion('RICE_sardinia_region').GetName] s'est orientée vers l'[GetGeographicalRegion('RICE_ifriqiya_region').GetName], les [rulers|E] de l'île, comme moi-même, ont exploré différents moyens de renforcer nos liens politiques, économiques et culturels avec la région. L'Afrique du Nord, ancien grenier à blé de l'Empire romain, a beaucoup à nous offrir."
 RICE_sardinia_north_african_decision_confirm:0 "La Sardaigne reliera la Méditerranée."
 RICE_sardinia_north_african_decision_effect_tooltip_1:0 "Il y a une chance que vous et un [ruler|E] aléatoire en [GetGeographicalRegion('RICE_ifriqiya_region').GetName] ayez une meilleure [opinion|E] l'un envers l'autre, ou même que vous deveniez [friends|E]"
 RICE_sardinia_north_african_decision_effect_tooltip_2:0 "Il y a une petite chance que chaque [county|E] que vous possédez en [GetGeographicalRegion('RICE_sardinia_region').GetName] reçoive le [modifier|E] [GetModifier('RICE_sardinia_north_african_option_piracy').GetNameWithTooltip]"
 RICE_sardinia_north_african_decision_effect_tooltip_3:0 "Il y a une petite chance qu'un marchand nord-africain apparaisse en tant que [courtier|E]"
 RICE_sardinia_north_african_decision_effect_tooltip_4:0 "Le [prestige|E] et la [piety|E] que vous gagnez dépendent de votre [rank|E]"
 RICE_sardinia_north_african_decision_context_tooltip:0 "#emphasis Contexte Historique :#! La Sardaigne est associée à l'Afrique du Nord depuis l'Antiquité, notamment lorsque les Carthaginois ont colonisé certaines parties de l'île. Autre exemple, pendant la période de domination vandale, de 456 à 534 de notre ère, les Vandales ont déporté un certain nombre de Berbères sur l'île. Les sources grecques et romaines ont souvent considéré que les Sardes étaient originaires d'Afrique du Nord, un trope qui a également été repris dans les sources médiévales, comme dans les travaux du géographe et érudit andalou du XIIe siècle, al-Idrisi."
 RICE_saridnia_north_african_decision_effect.message:0 "Pirates repérés en [pirate_county.GetNameNoTierNoTooltip] !"
 RICE_sardinia_none_decision:0 "Fortifier la Sardaigne"
 RICE_sardinia_none_decision_tooltip:0 "La [GetGeographicalRegion('RICE_sardinia_region').GetName] doit être défendue de toutes parts"
 RICE_sardinia_none_decision_desc:0 "Depuis que la [GetGeographicalRegion('RICE_sardinia_region').GetName] a modifié son orientation vers une plus grande indépendance, les [rulers|E] de l'île, comme moi-même, ont pris grand soin de protéger notre île bien-aimée des menaces externes et internes."
 RICE_sardinia_none_decision_confirm:0 "L'île doit se protéger elle-même."
 RICE_sardinia_none_decision_effect_tooltip_1:0 "Il y a une chance qu'un local talentueux avec un [education_trait|E] élevé apparaisse en tant que [courtier|E]"
 RICE_sardinia_none_decision_effect_tooltip_2:0 "Le [prestige|E] et la [piety|E] que vous gagnez dépendent de votre [rank|E]"
 RICE_sardinia_none_decision_context_tooltip:0 "#emphasis Contexte Historique :#! Pendant une grande partie de son histoire, la Sardaigne a occupé une position paradoxale dans la Méditerranée : une île qui se trouve en plein centre de la grande mer, mais qui est aussi, à d'autres égards, une périphérie habitée par des gens qui, quelles que soient leurs origines, étaient considérés comme des barbares par les étrangers. Des sources romaines comme celle de Cicéron, par exemple, considéraient les Sardes comme des voleurs indisciplinés. Des siècles plus tard, Al-Idrisi, géographe et érudit andalou du XIIe siècle, décrivait lui aussi les Sardes comme des gens têtus et barbares. Même si les Sardes médiévaux, qui ont subi une certaine influence romaine et nord-africaine, n'étaient pas les mêmes que les Sardes antiques et préromains, les sources au fil des siècles semblent utiliser des tropes similaires pour la Sardaigne, indépendamment des personnes qui y ont réellement vécu."
 RICE_saridnia_none_decision_effect.message:0 "Pirates aperçus en [GetGeographicalRegion('RICE_sardinia_region').GetNameNoTooltip] !"
 RICE_sardinia_condaghe_decision:0 "Recompiler les Condaghes de la Famille"
 RICE_sardinia_condaghe_decision_tooltip:0 "Cela fait un moment que nous n'avons pas réorganisé nos #italic condaghes#!"
 RICE_sardinia_condaghe_decision_desc:0 "Les #italic condaghes#! sont des documents administratifs [GetPlayer.GetCulture.GetName] liés aux propriétés et institutions religieuses. Nous devrions vérifier si les #italic condaghes#! de la [dynasty|E] [GetPlayer.GetDynasty.GetBaseName] sont en ordre, au cas où nous en aurions besoin pour des litiges juridiques, ou pour référencer les possessions et les donations religieuses de notre famille."
 RICE_sardinia_condaghe_decision_confirm:0 "Collecter les #italic condaghes#!!"
 RICE_sardinia_condaghe_decision_effect_tooltip_1:0 "Vous obtiendrez une quantité aléatoire de [prestige|E] entre #V [EmptyScope.ScriptValue('RICE_sardinia_condaghe_prestige_gain_min')] [prestige_i|E]#! et #V [EmptyScope.ScriptValue('RICE_sardinia_condaghe_prestige_gain_max')] [prestige_i|E]#!"
 RICE_sardinia_condaghe_decision_effect_tooltip_2:0 "#V [GetPlayer.MakeScope.ScriptValue('RICE_sardinia_condaghe_chance')]%#! de chance d'obtenir un [artifact|E] #V Condaghe#! basé sur votre [stewardship|E] et votre [learning|E]"
 RICE_sardinia_condaghe_decision_context_tooltip:0 "#emphasis Contexte Historique :#! Les condaghes étaient un type de document administratif utilisé dans les judicatures de la Sardaigne médiévale, souvent dans le cadre d'actes financiers et juridiques liés à des institutions religieuses telles que des églises ou des monastères. Ils ont même été utilisés dans des affaires judiciaires des siècles après leur production. Bien qu'il en reste peu de nos jours, ils constituent une ressource inestimable pour les chercheurs qui cherchent à comprendre l'histoire médiévale de la Sardaigne et les étapes antérieures de la langue sarde."
 RICE_sardinia_invest_in_palio_horses:0 "Investir dans les chevaux de course du Palio"
 RICE_sardinia_invest_in_palio_horses_tooltip:0 "[GetPlayer.GetHouse.GetNameNoTooltip] peut gagner les [palio_races|E] si nous investissons dans les bons chevaux."
 RICE_sardinia_invest_in_palio_horses_desc:0 "Les [houses|E] [GetPlayer.GetCulture.GetName] comme les [GetPlayer.GetHouse.GetName] possèdent généralement plus de quelques chevaux élevés spécifiquement pour la course, en signe de notre statut. Si nous voulons bien nous en sortir dans les [palio_races|E] auxquelles nous participons, nous devons nous assurer que nos jockeys disposent des meilleurs chevaux de course."
 RICE_sardinia_invest_in_palio_horses_confirm:0 "Réserver des fonds pour les chevaux"
 RICE_sardinia_invest_in_palio_horses_effect_tooltip_1:0 "Vous obtiendrez une quantité aléatoire de [prestige|E] [prestige_i|E] et de [dynasty_prestige|E] [dynasty_prestige_i|E] en fonction de la quantité d'[gold|E] [gold_i|E] investie."
 RICE_sardinia_invest_in_palio_horses_effect_tooltip_2:0 "\nLa [house|E] [GetPlayer.GetHouse.GetName] obtiendra un [modifier|E] durant aléatoirement entre #V 5#! et #V 15#! ans. Plus vous investissez de [gold_i|E] [gold|E], plus le [modifier|E] sera puissant, ce qui :\n$EFFECT_LIST_BULLET$Augmente le gain mensuel de [prestige_i|E][prestige|E]\n$EFFECT_LIST_BULLET$Réduit les coûts d'entretien des [men_at_arms|E] de type cavalerie\n$EFFECT_LIST_BULLET$Augmente les chances de remporter une [GetActivityType( 'activity_RICE_sardinia_palio_race' ).GetName]\n"
 RICE_sardinia_invest_in_palio_horses_context_tooltip:0 "#emphasis Contexte Historique :#! Dans l'Italie de la fin du Moyen Âge et de la Renaissance, les puissantes dynasties étaient d'importants propriétaires de chevaux de course, afin de rivaliser avec les dynasties rivales, notamment dans les courses du Palio. Au XVe siècle, les #italic barberi#! d'Afrique du Nord étaient la race habituelle des chevaux utilisés dans les courses du Palio en Italie, mais d'autres races n'étaient pas inconnues, comme les #italic turchi#! de l'Empire ottoman. Par exemple, la famille Gonzague de Mantoue, célèbre dans l'Italie de la Renaissance pour la qualité de ses chevaux de course, en importait beaucoup des Ottomans, avec lesquels elle entretenait des relations diplomatiques étroites."
 RICE_sardinia_invest_in_palio_horses_type:0 "Choisir le montant à investir"
 RICE_sardinia_invest_in_palio_horses_gui:0 "Choisir le montant à investir dans les chevaux de course du [palio|E]"
 RICE_sardinia_invest_in_palio_horses_small_option:0 "#Bold Investissement mineur#!"
 RICE_sardinia_invest_in_palio_horses_small_option_desc:0 "$RICE_sardinia_invest_in_palio_horses_small_option$"
 RICE_sardinia_invest_in_palio_horses_small_option_tooltip:0 "Coût : @gold_icon! #V #Bold [GetPlayer.MakeScope.ScriptValue('RICE_sardinia_palio_horse_investment_small_cost')]#!#!\n\n$EFFECT_LIST_BULLET$ Recevez entre [prestige_i|E] #V [GetPlayer.MakeScope.ScriptValue('RICE_sardinia_palio_horse_investment_prestige_gain_small_min')]#! et [prestige_i|E] #V [GetPlayer.MakeScope.ScriptValue('RICE_sardinia_palio_horse_investment_prestige_gain_small_max')]#! [prestige|E]\n$EFFECT_LIST_BULLET$ La [dynasty|E] [GetPlayer.GetDynasty.GetName] reçoit entre [dynasty_prestige_i|E] #V [GetPlayer.MakeScope.ScriptValue('RICE_sardinia_palio_horse_investment_dynasty_prestige_gain_small_min')]#! et [dynasty_prestige_i|E] #V [GetPlayer.MakeScope.ScriptValue('RICE_sardinia_palio_horse_investment_dynasty_prestige_gain_small_max')]#! [dynasty_prestige|E]\n$EFFECT_LIST_BULLET$La [house|E] [GetPlayer.GetHouse.GetName] reçoit le [modifier|E] [GetModifier('RICE_sardinia_palio_horse_investment_small_modifier').GetNameWithTooltip] pour une durée entre #V 5#! et #V 15#! ans"
 RICE_sardinia_invest_in_palio_horses_medium_option:0 "#Bold Investissement majeur#!"
 RICE_sardinia_invest_in_palio_horses_medium_option_desc:0 "$RICE_sardinia_invest_in_palio_horses_medium_option$"
 RICE_sardinia_invest_in_palio_horses_medium_option_tooltip:0 "Coût : #V #Bold [GetPlayer.MakeScope.ScriptValue('RICE_sardinia_palio_horse_investment_medium_cost')] @gold_icon!#!#!\n\n$EFFECT_LIST_BULLET$ Recevez entre #V [GetPlayer.MakeScope.ScriptValue('RICE_sardinia_palio_horse_investment_prestige_gain_medium_min')] [prestige_i|E]#! et #V [GetPlayer.MakeScope.ScriptValue('RICE_sardinia_palio_horse_investment_prestige_gain_medium_max')] [prestige_i|E]#! de [prestige|E]\n$EFFECT_LIST_BULLET$ La [dynasty|E] [GetPlayer.GetDynasty.GetName] reçoit entre #V [GetPlayer.MakeScope.ScriptValue('RICE_sardinia_palio_horse_investment_dynasty_prestige_gain_medium_min')] [dynasty_prestige_i|E]#! et #V [GetPlayer.MakeScope.ScriptValue('RICE_sardinia_palio_horse_investment_dynasty_prestige_gain_medium_max')] [dynasty_prestige_i|E]#! de [dynasty_prestige|E]\n$EFFECT_LIST_BULLET$ La [house|E] [GetPlayer.GetHouse.GetName] reçoit [modifier|E] [GetModifier('RICE_sardinia_palio_horse_investment_medium_modifier').GetNameWithTooltip] pour une durée comprise entre #V 5#! et #V 15#! ans"
 RICE_sardinia_invest_in_palio_horses_large_option:0 "#Bold Immense investissement#!"
 RICE_sardinia_invest_in_palio_horses_large_option_desc:0 "$RICE_sardinia_invest_in_palio_horses_large_option$"
 RICE_sardinia_invest_in_palio_horses_large_option_tooltip:0 "Coût : @gold_icon! #V #Bold [GetPlayer.MakeScope.ScriptValue('RICE_sardinia_palio_horse_investment_large_cost')]#!#!\n\n$EFFECT_LIST_BULLET$ Recevez entre [prestige_i|E] #V [GetPlayer.MakeScope.ScriptValue('RICE_sardinia_palio_horse_investment_prestige_gain_large_min')]#! et [prestige_i|E] #V [GetPlayer.MakeScope.ScriptValue('RICE_sardinia_palio_horse_investment_prestige_gain_large_max')]#! [prestige|E]\n$EFFECT_LIST_BULLET$ La [dynasty|E] [GetPlayer.GetDynasty.GetName] reçoit entre [dynasty_prestige_i|E] #V [GetPlayer.MakeScope.ScriptValue('RICE_sardinia_palio_horse_investment_dynasty_prestige_gain_large_min')]#! et [dynasty_prestige_i|E] #V [GetPlayer.MakeScope.ScriptValue('RICE_sardinia_palio_horse_investment_dynasty_prestige_gain_large_max')]#! [dynasty_prestige|E]\n$EFFECT_LIST_BULLET$La [house|E] [GetPlayer.GetHouse.GetName] reçoit le [modifier|E] [GetModifier('RICE_sardinia_palio_horse_investment_large_modifier').GetNameWithTooltip] pour une durée entre #V 5#! et #V 15#! ans"
 RICE_sardinia_palio_horses_recent_req:0 "Votre [house|E] ne possède actuellement pas de [modifier|E] de cheval de course du [palio|E]"
 RICE_saridinia_algherese_decision:0 "Envoyer des colons [GetPlayer.GetCulture.GetNameNoTooltip] à Alghero"
 RICE_saridinia_algherese_decision_tooltip:0 "Nous devrions faire venir des colons [GetPlayer.GetCulture.GetNameNoTooltip] en [GetGeographicalRegion('RICE_sardinia_region').GetName]"
 RICE_saridinia_algherese_decision_desc:0 "Maintenant qu'il y a une présence $heritage_iberian_name$ accrue en [GetGeographicalRegion('RICE_sardinia_region').GetName], nous avons eu du mal à [control|E] les habitants indisciplinés de l'île. Nous devrons faire venir des colons [GetPlayer.GetCulture.GetName] pour remédier à la situation, et la ville portuaire de [GetTitleByKey('b_alghero').GetNameNoTier] est un site parfait pour cela."
 RICE_saridinia_algherese_decision_effect_tooltip_1:0 "Le bâtiment du port de commerce sera ajouté à [GetTitleByKey('b_alghero').GetNameNoTier], ou amélioré s'il existe déjà, même s'il n'y a plus d'emplacements de [building|E]."
 RICE_saridinia_algherese_decision_confirm:0 "Invitez les colons [GetPlayer.GetCulture.GetNameNoTooltip] !"
 RICE_saridinia_algherese_decision_context_tooltip:0 "#emphasis Contexte historique :#! La ville moderne d'Alghero, fondée en 1102 de notre ère, a été pendant de nombreuses années un port stratégique de la Méditerranée. Le royaume d'Aragon a conquis la Sardaigne au XIVe siècle ; à la suite de quelques insurrections dans la région, les Aragonais ont expulsé la population locale de la ville et ont fait venir des colons catalans, transformant Alghero en un centre de domination aragonaise. L'algherese, le dialecte de la langue catalane parlé par les descendants des colons, est aujourd'hui officiellement reconnu comme une langue minoritaire en Italie."

