l_french:
 # Misc
 RICE_sardinia_region:0 "$d_sardinia$"
 RICE_every_owned_sardinia_county:0 "Chaque [county|E] en [GetGeographicalRegion('RICE_sardinia_region').GetName] que vous possédez"
 RICE_every_sardinia_county:0 "Chaque [county|E] en [GetGeographicalRegion('RICE_sardinia_region').GetName]"
 RICE_fervor_gain_sardinia_fervor: "L'allégeance sarde"
 innovation_RICE_condaghes:0 "Condaghes"
 innovation_RICE_condaghes_desc:0 "Les #italic condaghes#! sont un type unique de document administratif sarde qui enregistre les héritages, les achats, les donations, les litiges et d'autres actes financiers et juridiques dans le contexte des institutions religieuses. Ils représentent une évolution des pratiques bureaucratiques que l'île a héritées de l'Empire byzantin."
 innovation_RICE_palio_races:0 "Courses du Palio"
 innovation_RICE_palio_races_desc:0 "À mesure que l'Italie s'urbanise, certaines villes ont inauguré leurs propres traditions de courses de chevaux festives et éblouissantes, appelées #italic Palio#!, pour des occasions profanes et surtout religieuses. Ces courses sont devenues un élément célèbre de la culture locale et une source de fierté civique pour tous ceux qui y participent, quelle que soit leur classe sociale ou leur position."
 RICE_palio_activity_unlock:0 "Débloque l'[activity|E] [GetActivityType( 'activity_RICE_sardinia_palio_race' ).GetName]"
 RICE_palio_decision_unlock:0 "Débloque les [decisions|E] pour #V $RICE_sardinia_inaugurate_major_palio$#! et #V $RICE_sardinia_invest_in_palio_horses$#!"
 RICE_roman_africa_region:0 "Afrique Romaine"
 RICE_ifriqiya_region:0 "Ifriqiya"
 RICE_sardinia_region_req:0 "La [capital|E] est en [GetGeographicalRegion('RICE_sardinia_region').GetName]"
 RICE_sardinia_byzantine_admin_weak_hook:0 "Liaisons avec la Sardaigne"
 RICE_sardinia_byzantine_admin_strong_hook:0 "$RICE_sardinia_byzantine_admin_weak_hook$"
 RICE_sardinia_ties_reason_placeholder:0 "[CHARACTER.GetShortUIName|U] et [TARGET_CHARACTER.GetShortUIName] ont travaillé ensemble pour établir des liens entre la [GetGeographicalRegion('RICE_sardinia_region').GetName] et l'[GetGeographicalRegion('world_africa_north').GetName]."
 RICE_condaghe_decision_unlock:0 "Débloque la [decision|E] #V $RICE_sardinia_condaghe_decision$#!"
 RICE_sardinia_none_ending_catholic_loc:0 "$heritage_latin_name$"
 RICE_sardinia_none_ending_orthodox_loc:0 "$heritage_byzantine_name$"
 RICE_sardinia_none_ending_north_african_loc:0 "$heritage_berber_name$"
 RICE_culture_head_req:0 "[culture_head|E] de votre [culture|E]"
 RICE_not_has_major_palio_req:0 "Aucun [county|E] du [duchy|E] de votre [capital|E] ne possède le [county_modifier|E] [GetModifier('RICE_sardinia_palio_race_religious_modifier').GetNameWithTooltip], [GetModifier('RICE_sardinia_palio_race_civic_modifier').GetNameWithTooltip], ou [GetModifier('RICE_sardinia_palio_race_dynastic_modifier').GetNameWithTooltip]"
 RICE_capital_coastal_county:0 "Votre capitale est un [county|E] côtier"

 # Artifacts
 RICE_sardinia_condaghe_artifact_name:0 "Condaghe de [condaghe_person.GetTitledFirstNameNoTooltip]"
 RICE_sardinia_condaghe_artifact_desc:0 "Ce #italic condaghe#! a été créé ou découvert à la demande de [condaghe_person.GetTitledFirstName] pour sa famille, la [dynasty|E] [condaghe_person.GetDynasty.GetName]. Comme d'autres #italic condaghes#! originaires de Sardaigne, il s'agit d'un document administratif reflétant les diverses activités financières et juridiques de la famille liées aux institutions religieuses et à la propriété."

 # Buildings
 building_type_RICE_sardinia_su_nuraxi:0 "Su Nuraxi"
 building_type_RICE_sardinia_su_nuraxi_desc:0 "Dans la nature sauvage de la Sardaigne, on trouve de nombreuses ruines en pierre #italic nuraghe#!. Su Nuraxi est peut-être la plus impressionnante d'entre elles. Les premiers bâtisseurs, quels qu'ils soient, sont peut-être décédés depuis longtemps, mais les structures qu'ils ont construites sont encore utilisées de temps en temps, que ce soit comme abri ou comme source gratuite de matériaux de construction."
 building_RICE_sardinia_su_nuraxi:0 "$building_type_RICE_sardinia_su_nuraxi$"
 building_RICE_sardinia_su_nuraxi_desc:0 "$building_type_RICE_sardinia_su_nuraxi_desc$"

 # Game Concepts
 game_concept_palio_races:0 "Courses du Palio"
 game_concept_palio_race:0 "Course du Palio"
 game_concept_palios:0 "Palios"
 game_concept_palio:0 "Palio"
 game_concept_palio_desc:0 "Le $game_concept_palio$ désigne un type de course de chevaux populaire en Italie. Les [GetActivityType( 'activity_RICE_sardinia_palio_race' ).GetName] est une [activity|E] qui est débloquée grâce à l'[innovation|E] $innovation_RICE_palio_races$, et constitue une excellente occasion de gagner du [prestige_i|E] [prestige|E], de la [piety_i|E] [piety|E], et de la [dynasty_prestige|E]. L'[activity|E] confère également un [county_modifier|E] là où elle se tient.\n\nIl existe trois types de palios, avec des bonus variés : religieux, civique et dynastique. Les [rulers|E] plus ambitieux peuvent prendre la [decision|E] d'$RICE_sardinia_inaugurate_major_palio$. Cela place un [county_modifier|E] spécial dans votre capitale qui améliore les bonus que vous obtenez d'un palio, bien qu'un seul puisse exister par [duchy|E].\n\nPendant l'[activity|E] du palio, l'hôte et les participants qui sont [house_heads|E] peuvent choisir de parrainer un jockey et un cheval pour la course, afin de remporter la très convoitée #bold bannière du palio#!. Les [rulers|E] peuvent prendre une [decision|E] pour $RICE_sardinia_invest_in_palio_horses$ afin d'augmenter leurs chances de victoire également."

 # Aspirations

 # Memories

 # Activities 
 activity_RICE_sardinia_palio_race_host_an_a:0 "$host_activity_a$"
 activity_RICE_sardinia_palio_race:0 "Course de chevaux du Palio"
 activity_RICE_sardinia_palio_race_desc:0 "Organisons une grande [palio_race|E] en ville. Ces courses de chevaux passionnantes peuvent constituer la pièce maîtresse d'une grande fête religieuse ou d'une occasion profane."
 activity_RICE_sardinia_palio_race_selection_tooltip: "Accueillez une [palio_race|E] dans votre [domain|E].\n\n$activity_RICE_sardinia_palio_race_context_tooltip$"
 activity_RICE_sardinia_palio_race_context_tooltip:0 "#emphasis Contexte Historique :#! Les Palios, et des pratiques similaires telles que la Sa Sartiglia en Sardaigne, sont un type de course de chevaux en Italie. Les premières traces de Palios remontent à la période médiévale, bien qu'elles aient pu avoir des antécédents à l'époque romaine. Au Moyen Âge et à la Renaissance, les palios étaient des événements religieux et civiques importants, souvent associés aux fêtes des saints. La plupart des palios modernes et des courses de chevaux équivalentes sont des inventions récentes ou des réinventions de traditions plus anciennes. Le plus ancien palio existant, et le plus célèbre, est celui de Sienne, dont la forme moderne remonte à 1633 de notre ère. Cependant, il est attesté dans un document datant de 1239, où les règles du palio sont discutées en détail, ce qui suggère qu'il était déjà organisé depuis des années."
 activity_RICE_sardinia_palio_race_host_desc:"\n$BULLET_WITH_TAB$ Perd du [stress|E] [stress_loss_i|E]\n$BULLET_WITH_TAB$ Gagnez du [prestige|E] [prestige_i|E], de la [piety|E] [piety_i|E], et/ou de la [dynasty_prestige|E] [dynasty_prestige_i|E] en fonction de votre [intent|E] et de vos [activity_options|E]\n$BULLET_WITH_TAB$ Le [county|E] du [location|E] d'[activity|E] gagne un [county_modifier|E] #P Positif#!\n$BULLET_WITH_TAB$ Augmentation de l'[opinion|E] des autres participants\n$BULLET_WITH_TAB$ D'autres récompenses pour avoir participé et gagné la [palio_race|E]"
 activity_RICE_sardinia_palio_race_guest_desc:"\n$BULLET_WITH_TAB$Perte de [stress_loss_i|E][stress|E]\n$BULLET_WITH_TAB$Gain de [prestige_i|E][prestige|E] et/ou de [piety_i|E][piety|E] dépendant de votre [intent|E] et des [activity_options|E] que l'organisateur choisit\n$BULLET_WITH_TAB$Récompenses supplémentaires pour participer et gagner une [palio_race|E] si vous êtes [house_head|E]"
 activity_RICE_sardinia_palio_race_province_desc: ""
 activity_RICE_sardinia_palio_race_destination_selection: "$activity_RICE_sardinia_palio_race_province_desc$"
 activity_RICE_sardinia_palio_race_guest_help_text: "$activity_RICE_sardinia_palio_race$"
 activity_RICE_sardinia_palio_race_predicted_cost: "Le coût de cette visite est fonction de votre [income|E] et des [activity_options|E] que vous choisissez."
 activity_RICE_sardinia_palio_race_conclusion_desc: "La [GetActivityType( 'activity_RICE_sardinia_palio_race' ).GetName] s'est achevée. Un spectacle passionnant, à couper le souffle !"
 RICE_sardinia_palio_race_religious: "Dévots"
 RICE_sardinia_palio_race_religious_desc:"$EFFECT_LIST_BULLET$ Le [palio|E] sera organisé en l'honneur d'un saint local ou d'une figure religieuse.\n$EFFECT_LIST_BULLET$ #P +25%#! de [piety_i][piety|E] #V au total#! comparé aux autres options\n$EFFECT_LIST_BULLET$ Le [county|E] dans lequel le [palio|E] est organisé a plus de chances d'obtenir un [county_modifier|E] qui augmente les [gold_i|E] [tax|E]\n$EFFECT_LIST_BULLET$ #P +50%#! de récompenses en [prestige_i|E][prestige|E] et [piety_i|E][piety|E], si le [county|E] dans lequel se trouve le [location|E] de l'[activity|E] possède le [county_modifier|E] [GetModifier('RICE_sardinia_palio_race_religious_modifier').GetNameWithTooltip]\n\n#weak Les jours sacrés sont une excellente occasion pour que tout le monde se rassemble en un même lieu pour une course de chevaux comme celle-ci.#!"
 RICE_sardinia_palio_race_civic: "Civique"
 RICE_sardinia_palio_race_civic_desc:"$EFFECT_LIST_BULLET$ Le [palio|E] sera organisé pour commémorer un événement majeur de l'histoire de la région.\n$EFFECT_LIST_BULLET$ #P +25%#! de [prestige_i][prestige|E] #V au total#! par rapport aux autres options\n$EFFECT_LIST_BULLET$ Le [county|E] dans lequel le [palio|E] est organisé a plus de chances d'obtenir un [county_modifier|E] qui augmente le [development_i|E] [development|E]\n$EFFECT_LIST_BULLET$ #P +50%#! de récompenses en [prestige_i|E][prestige|E] et [piety_i|E][piety|E], si le [county|E] dans lequel se trouve le [location|E] de l'[activity|E] possède le [county_modifier|E] [GetModifier('RICE_sardinia_palio_race_civic_modifier').GetNameWithTooltip]\n\n#weak En honorant les accomplissements de notre patrie, cette course de chevaux nous rassemblera en tant que communauté !#!"
 RICE_sardinia_palio_race_dynastic: "Dynastique"
 RICE_sardinia_palio_race_dynastic_desc:"$EFFECT_LIST_BULLET$ Le [palio|E] sera organisé pour célébrer le règne de votre [GetPlayer.GetDynastyNameNoTooltip] sur la région.\n$EFFECT_LIST_BULLET$ #P +25%#! de [dynasty_prestige_i|E][dynasty_prestige|E] #V au total#! par rapport aux autres options\n$EFFECT_LIST_BULLET$ Le [county|E] dans lequel le [palio|E] est organisé a plus de chances d'obtenir un [county_modifier|E] qui réduit les coûts de [building|E]\n$EFFECT_LIST_BULLET$ #P +50%#! de récompenses en [prestige_i|E][prestige|E] et [piety_i|E][piety|E], si le [county|E] dans lequel se trouve le [location|E] de l'[activity|E] possède le [county_modifier|E] [GetModifier('RICE_sardinia_palio_race_dynastic_modifier').GetNameWithTooltip]\n\n#weak Élevons l'estime de notre famille à travers cette course de chevaux, en montrant à tous quelle grande terre nous avons bâtie ici !#!"
 RICE_sardinia_palio_race_banner_type: "Bannière du Palio"
 RICE_sardinia_palio_race_banner_small: "Petite"
 RICE_sardinia_palio_race_banner_small_desc:"$EFFECT_LIST_BULLET$Gain de #V 100#! [prestige_i|E] [prestige|E] de base grâce au [palio|E]\n$EFFECT_LIST_BULLET$Pas de chances accrues d'obtenir de meilleurs [county_modifiers|E] du [palio|E]\n$EFFECT_LIST_BULLET$Si une [house|E] possédant des terres remporte le [palio|E], elle recevra le [modifier|E] [GetModifier('RICE_sardinia_palio_victory_minor').GetNameWithTooltip], et sa dynastie gagnera [dynasty_prestige_i|E] #V [EmptyScope.ScriptValue('RICE_sardinia_palio_horse_race_dynasty_prestige_victory_small')]#! de [dynasty_prestige|E]\n\n#weak Nous sponsoriserons des artisans pour créer le type habituel de bannière décernée au vainqueur de ces courses de chevaux.#!"
 RICE_sardinia_palio_race_banner_medium: "Moyenne"
 RICE_sardinia_palio_race_banner_medium_desc:"$EFFECT_LIST_BULLET$Gain de #V 200#! [prestige_i|E] [prestige|E] de base grâce au [palio|E]\n$EFFECT_LIST_BULLET$Chances quelque peu accrues d'obtenir de meilleurs [county_modifiers|E] du [palio|E]\n$EFFECT_LIST_BULLET$Si une [house|E] possédant des terres remporte le [palio|E], elle recevra le [modifier|E] [GetModifier('RICE_sardinia_palio_victory_minor').GetNameWithTooltip], et sa dynastie gagnera [dynasty_prestige_i|E] #V [EmptyScope.ScriptValue('RICE_sardinia_palio_horse_race_dynasty_prestige_victory_medium')]#! [dynasty_prestige|E]\n\n#weak Les artisans que nous engageons devraient créer une bannière digne d'un glorieux vainqueur de cette course de chevaux, une qui reflète bien notre communauté.#!"
 RICE_sardinia_palio_race_banner_large: "Grand"
 RICE_sardinia_palio_race_banner_large_desc:"$EFFECT_LIST_BULLET$Gain de #V 300#! [prestige_i|E] [prestige|E] de base grâce au [palio|E]\n$EFFECT_LIST_BULLET$Chances grandement accrues d'obtenir de meilleurs [county_modifiers|E] du [palio|E]\n$EFFECT_LIST_BULLET$Si une [house|E] possédant des terres remporte le [palio|E], elle recevra le [modifier|E] [GetModifier('RICE_sardinia_palio_victory_minor').GetNameWithTooltip], et sa dynastie gagnera [dynasty_prestige_i|E] #V [EmptyScope.ScriptValue('RICE_sardinia_palio_horse_race_dynasty_prestige_victory_large')]#! [dynasty_prestige|E]\n\n#weak N'épargnez aucune dépense ! Les artisans que nous commanditons créeront une magnifique bannière qui motivera les gens à remporter le palio.#!"
 RICE_sardinia_palio_race_charity_type: "Montant de la charité"
 RICE_sardinia_palio_race_charity_small: "Obligatoire"
 RICE_sardinia_palio_race_charity_small_desc:"$EFFECT_LIST_BULLET$Gain de #V 100#! [piety_i|E] [piety|E] de base grâce au [palio|E]\n$EFFECT_LIST_BULLET$Pas de gain d'[opinion|E] supplémentaire pour chaque [character|E] participant à cette [activity|E]\n\n#weak Nous fournirons les dons attendus aux pauvres, aux nécessiteux et aux femmes ayant besoin de dots lors de cette occasion.#!"
 RICE_sardinia_palio_race_charity_medium: "Généreux"
 RICE_sardinia_palio_race_charity_medium_desc:"$EFFECT_LIST_BULLET$Gain de #V 200#! [piety_i|E] [piety|E] de base grâce au [palio|E]\n$EFFECT_LIST_BULLET$Gain de #P 10#! [opinion|E] supplémentaires pour chaque [character|E] participant à cette [activity|E]\n\n#weak Nous ferons tout notre possible pour offrir de généreux dons aux pauvres, aux nécessiteux et aux femmes ayant besoin de dots lors de cette occasion.#!"
 RICE_sardinia_palio_race_charity_large: "Très généreux"
 RICE_sardinia_palio_race_charity_large_desc:"$EFFECT_LIST_BULLET$Gain de de #V 300#! [prestige_i|E] [prestige|E] grâce au [palio|E]\n$EFFECT_LIST_BULLET$Gain de #P 20#! [opinion|E] supplémentaires pour chaque [character|E] participant à cette [activity|E]\n\n#weak C'est un moment pour la communauté de se rassembler ! Nous devons distribuer d'importantes donations aux pauvres, aux nécessiteux et aux femmes ayant besoin de dots lors de cette occasion.#!"
 RICE_sardinia_palio_race_preparations_type: "Préparation de la course"
 RICE_sardinia_palio_race_preparations_none: "Pas d'implication"
 RICE_sardinia_palio_race_preparations_none_desc:"$EFFECT_LIST_BULLET$Votre [house|E] ne paiera aucun jockey pour participer à la  [palio_race|E]\n$EFFECT_LIST_BULLET$Vous #N renoncerez#! à vos chances d'obtenir des récompenses en remportant le [palio_race|E]\n\n#weak Participer à ces compétitions sportives coûte cher; nos fonds sont mieux employés à organiser l'événement en premier lieu.#!"
 RICE_sardinia_palio_race_preparations_basic: "Basique"
 RICE_sardinia_palio_race_preparations_basic_desc:"$EFFECT_LIST_BULLET$Votre [house|E] aura la chance par défaut de remporter la [palio_race|E]\n$EFFECT_LIST_BULLET$Cette chance peut être améliorée si quelqu'un de votre [house|E] a pris la [decision|E] d'#V $RICE_sardinia_invest_in_palio_horses$#!\n\n#weak Nos jockeys et chevaux devraient effectuer les préparations habituelles pour l'événement, comme l'entraînement et les exercices pour les chevaux ou l'ajustement de leur régime.#!"
 RICE_sardinia_palio_race_preparations_extensive:"Approfondis"
 RICE_sardinia_palio_race_preparations_extensive_desc:"$EFFECT_LIST_BULLET$Votre [house|E] aura la chance #P la plus élevée#! de remporter la [palio_race|E]\n$EFFECT_LIST_BULLET$Cette chance peut être améliorée si quelqu'un de votre [house|E] a pris la [decision|E] d'#V $RICE_sardinia_invest_in_palio_horses$#!\n\n#weak Si nous voulons remporter cet événement, nous devons faire le maximum, au-delà de l'ordinaire, pour nous assurer que nos jockeys et nos chevaux en sortiront victorieux.#!"
 RICE_sardinia_palio_race_palio_phase: "Palio"
 RICE_sardinia_palio_race_palio_phase_desc: "Une course de chevaux passionnante pour tous !"
 RICE_sardinia_palio_race_fun_intent_header: "Fun:"
 RICE_sardinia_palio_race_fun_intent: "Fun"
 RICE_sardinia_palio_race_fun_intent_desc: "Plongez dans une atmosphère de gaieté et d'excitation. Perdez du [stress|E] [stress_loss_i|E] supplémentaire."
 RICE_sardinia_palio_race_networking_intent_header: "Mise en réseau :"
 RICE_sardinia_palio_race_networking_intent: "Mise en réseau"
 RICE_sardinia_palio_race_networking_intent_desc: "Profitez de cette occasion pour rencontrer d'autres personnes. Gagnez un supplément de [prestige|E] #V 100#! [prestige_i|E]."
 RICE_sardinia_palio_race_veneration_intent_header: "Vénération:"
 RICE_sardinia_palio_race_veneration_intent: "Vénération"
 RICE_sardinia_palio_race_veneration_intent_desc: "Honorez la figure sacrée à laquelle cette occasion est dédiée. Gagnez un supplément de [piety|E] #V 100#! [piety_i|E]."
 RICE_sardinia_palio_race_pomp_intent_header: "Apparat :"
 RICE_sardinia_palio_race_pomp_intent: "Apparat"
 RICE_sardinia_palio_race_pomp_intent_desc:"Organisez un grand [palio|E] qui impressionnera tout le monde. Gagnez #V [GetPlayer.MakeScope.ScriptValue('minor_dynasty_prestige_value')]#! [dynasty_prestige|E] [dynasty_prestige_i|E] supplémentaires."
 RICE_sardinia_palio_race_completed_log_title:0 "$activity_RICE_sardinia_palio_race$ se conclue"
 RICE_sardinia_palio_race_completed_log:0 "[CHARACTER.GetShortUIName|U] a fini d'assister au [palio|E] de [PROVINCE.GetBaronyNameExplicitly] et aux festivités qui y sont associées."
 TRAVEL_NAME_FOR_activity_RICE_sardinia_palio_race:0 "[Character.GetFirstNamePossessiveNoTooltip] $activity_RICE_sardinia_palio_race$"
 RICE_sardinia_palio_race_banner_amount:0 "Coût de la bannière Palio"
 RICE_sardinia_palio_race_charity_amount:0 "Dons de charité pendant le Palio"
