 sardinia.0003.title:0 "Paludisme en [county.GetNameNoTierNoTooltip]"
 sardinia.0003.tooltip:0 "[GetModifier('RICE_sardinia_malaria_modifier').GetNameWithTooltip] s'est produit dans le [county.GetNameNoTier]."
 sardinia.malaria.tooltip:0 "\n [GetGeographicalRegion('RICE_sardinia_region').GetName] est tristement célèbre pour être un foyer de paludisme."
 sardinia.0004.t.catholic:0 "Les Judicati latins"
 sardinia.0004.t.orthodox:0 "Les Judicati Byzantins"
 sardinia.0004.t.north_african:0 "Les Judicati Nord-Africains"
 sardinia.0004.t.none:0 "Les Judicati Indépendants"
 sardinia.0004.t.backup:0 "Les Judicati"
 sardinia.0004.desc:0 "Depuis le déclin de l'autorité romaine sur la [GetGeographicalRegion('RICE_sardinia_region').GetName], ses dirigeants, les #italic judicati#!, ou juges, ont lutté pour maintenir la stabilité sur l'île. Malgré tout, en dépit de l'isolement de l'île, l'Occident latin, l'Orient grec, et même l'Afrique du Nord ont influencé sa trajectoire de différentes manières - parfois pacifiquement, d'autres fois moins.\n\n[sardinia_leader.GetTitledFirstName], qui exerce une grande influence sur l'île, comprend que l'avenir de la [GetGeographicalRegion('RICE_sardinia_region').GetNameNoTooltip] dépend de la manière dont elle s'oriente vis-à-vis du reste de la Méditerranée.\n\n"
 sardinia.0004.desc.catholic:0 "[sardinia_leader.GetFirstNameNoTooltip] et d'autres dirigeants de la [GetGeographicalRegion('RICE_sardinia_region').GetNameNoTooltip] ont fait des ouvertures auprès des autorités ecclésiastiques [GetFaithByKey('catholic').GetAdjective], soutenant leurs efforts pour renforcer l'Église sur l'île. En réorientant la [GetGeographicalRegion('RICE_sardinia_region').GetNameNoTooltip] vers l'Occident latin, les #italic judicati#! espèrent trouver des amis puissants et des protecteurs au sein de l'Église."
 sardinia.0004.desc.orthodox:0 "[sardinia_leader.GetFirstNameNoTooltip] et d'autres dirigeants de la [GetGeographicalRegion('RICE_sardinia_region').GetNameNoTooltip] ont fait l'effort de reconstruire l'ancienne administration romaine et de ramener l'île dans la sphère d'influence de l'Orient grec. En réorientant la [GetGeographicalRegion('RICE_sardinia_region').GetNameNoTooltip] vers l'Orient grec, les #italic judicati#! peuvent restaurer l'ordre sous une administration romaine stable."
 sardinia.0004.desc.north_african:0 "Malgré les attaques venues d'Afrique du Nord par le passé, [sardinia_leader.GetFirstNameNoTooltip] et d'autres dirigeants de [GetGeographicalRegion('RICE_sardinia_region').GetNameNoTooltip] comprennent l'importance des liens économiques, politiques et culturels qu'ils entretiennent avec leurs voisins du sud. En réorientant la [GetGeographicalRegion('RICE_sardinia_region').GetNameNoTooltip] vers l'Afrique du Nord, ces liens se renforceront toujours davantage, et les terres sur lesquelles les #italic judicati#! règnent pourront, espérons-le, prospérer."
 sardinia.0004.desc.none:0 "[sardinia_leader.GetFirstNameNoTooltip] et les autres dirigeants de [GetGeographicalRegion('RICE_sardinia_region').GetNameNoTooltip] savent qu'ils ne peuvent compter sur personne - après tout, personne dans l'Occident latin, l'Orient grec ou l'Afrique du Nord n'a leurs intérêts à cœur. En réorientant la [GetGeographicalRegion('RICE_sardinia_region').GetNameNoTooltip] vers une vision plus indépendante, bien qu'influencée par l'influence [GetPlayer.Custom('RICE_sardinia_none_ending_type')], les #italic judicati#! et leur peuple peuvent espérer échapper aux manipulations et à l'exploitation des forces extérieures."
 sardinia.0004.a:0 "Je devrais également embrasser [sardinia_leader.GetFaith.GetNameNoTooltip] pour compléter le processus...."
 sardinia.0004.b:0 "$sardinia.0004.a$"
 sardinia.0004.c:0 "Seul l'avenir nous dira si cette décision était judicieuse."
 sardinia.0004.catholic.tradition:0 "Pour toutes les [cultures|E] qui en disposent, la [tradition|E] $tradition_RICE_judicati_name$ est améliorée par la [tradition|E] $tradition_RICE_judicati_catholic_name$"
 sardinia.0004.orthodox.tradition:0 "Pour toutes les [cultures|E] qui en disposent, la [tradition|E] $tradition_RICE_judicati_name$ est améliorée par la [tradition|E] $tradition_RICE_judicati_orthodox_name$"
 sardinia.0004.north_african.tradition:0 "Pour toutes les [cultures|E] qui en disposent, la [tradition|E] $tradition_RICE_judicati_name$ est améliorée par la [tradition|E] $tradition_RICE_judicati_north_african_name$"
 sardinia.0004.none.tradition:0 "Pour toutes les [cultures|E] qui possèdent, la [tradition|E] $tradition_RICE_judicati_name$ est améliorée en [tradition|E] $tradition_RICE_judicati_none_name$"
 sardinia.0005.t:0 "[GetGeographicalRegion('RICE_sardinia_region').GetNameNoTooltip] et la Grande Indépendance"
 sardinia.0005.desc:0 "Les dirigeants de [GetGeographicalRegion('RICE_sardinia_region').GetName] comme moi-même ont, ces derniers temps, constaté la nécessité pour l'île d'avoir une vision plus indépendante.\n\nCela ne signifie pas pour autant qu'il faille isoler complètement l'île du monde, compte tenu des liens qu'elle entretient avec le reste de la Méditerranée. Les différentes influences qui s'exercent sur notre île peuvent en effet être un atout dans notre quête d'une plus grande indépendance.\n\nEn tant que dirigeant le plus important de l'île, il m'appartient désormais de déterminer notre avenir et de décider si nous devons nous inspirer des idées et des pratiques de l'Occident latin, de l'Orient grec ou de l'Afrique du Nord, sans nous laisser submerger par leur culture, afin de réaffirmer notre autonomie et notre force."
 sardinia.0005.a:0 "L'Occident latin - le foyer de la Rome antique"
 sardinia.0005.a.tooltip:0 "$RICE_sardinia_decide_sardinia_orientation_effect_tooltip.catholic.1$"
 sardinia.0005.b:0 "L'Orient grec - nous sommes les héritiers de l'héritage de la Rome orientale"
 sardinia.0005.b.tooltip:0 "$RICE_sardinia_decide_sardinia_orientation_effect_tooltip.orthodox.1$"
 sardinia.0005.c:0 "L'Afrique du Nord, terre de peuples divers et rudes"
 sardinia.0005.c.tooltip:0 "$RICE_sardinia_decide_sardinia_orientation_effect_tooltip.north_african.1$"
 sardinia.0006.t:0 "Une nouvelle communauté alghéroise"
 sardinia.0006.desc:0 "L'emprise [alghero_settlement_liege.GetTitledFirstNamePossessive] sur la [GetGeographicalRegion('RICE_sardinia_region').GetName] a été précaire, et marquée par la résistance des populations locales, quelles que soient leurs origines. Ses officiers et conseillers ont cependant proposé une solution à ce problème, qui fut ensuite mise en œuvre.\n\nDe nombreux [culture.GetCollectiveNoun] de [GetGeographicalRegion('world_europe_west_iberia').GetName] sont intéressés par une installation sur l'île, et la colonie de [GetTitleByKey('b_alghero').GetNameNoTier] est un emplacement parfait, car c'est une ville portuaire qui pourrait servir de lien principal entre la [GetGeographicalRegion('RICE_sardinia_region').GetNameNoTooltip] et [GetGeographicalRegion('world_europe_west_iberia').GetNameNoTooltip].\n\nAinsi, afin de prévenir tout trouble futur dans la région, [alghero_settlement_liege.GetFirstNameNoTooltip] a expulsé la majeure partie de la population locale avant d'installer de potentiels colons [culture.GetNameNoTooltip] dans la ville. Désormais, la cité sera emplie de locuteurs [culture.GetNameNoTooltip] de la langue [culture.GetLanguage.GetName], plus favorables à son autorité."
 sardinia.0006.a:0 "Les temps changent pour [GetGeographicalRegion('RICE_sardinia_region').GetNameNoTooltip]."
 sardinia.0007.t:0 "Une nouvelle tradition du Palio"
 sardinia.0007.desc:0 "Depuis que les courses de palio sont devenues plus populaires dans cette région, elles sont devenues une merveilleuse occasion pour les gens de se rassembler et de célébrer leur ville natale.\n\nDiverses cités organisent leurs propres palios en parallèle d'autres occasions majeures, mais il peut parfois s'agir d'événements improvisés. J'ai travaillé avec des notables de [capital.GetNameNoTier] pour inaugurer un grand palio là-bas, qui se tiendra désormais régulièrement, établissant une nouvelle tradition qui renforcera la fierté civique des habitants et rendra [capital.GetNameNoTierNoTooltip] célèbre dans la région.\n\nEn particulier, le palio se tiendra"
 sardinia.0007.desc.religious:0 "pendant une grande fête religieuse déjà très appréciée par la population locale. Cette nouvelle tradition du palio aura donc une forte connotation spirituelle, inspirant les habitants en combinant foi solennelle et excitation festive."
 sardinia.0007.desc.civic:0 "pour commémorer un événement historique majeur dans l'histoire de [capital.GetNameNoTierNoTooltip]. La fierté civique des habitants ne peut que s'accroître s'ils se souviennent des raisons pour lesquelles ils doivent être fiers de leur ville natale."
 sardinia.0007.desc.dynastic:0 "en l'honneur des récents événements heureux survenus à la Maison [ROOT.Char.GetHouse.GetName]. Il est prudent de se rapprocher des habitants, afin de célébrer ensemble nos triomphes."
 sardinia.0007.a:0 "Puisse cette tradition se perpétuer longtemps, très longtemps !"
 sardinia.0008.t:0 "xxxxx"
 sardinia.0008.desc:0 "xxxxx"
 sardinia.0008.a:0 "xxxxx"
 sardinia.0009.t:0 "xxxxx"
 sardinia.0009.desc:0 "xxxxx"
 sardinia.0009.a:0 "xxxxx"
 sardinia.0010.t:0 "Sardaniya"
 sardinia.0010.desc:0 "J'ai entendu parler d'un certain nombre de $christianity_religion_adherent_plural$ [sardinian.GetCollectiveNoun] qui cherchent à émigrer de l'île de [GetGeographicalRegion('RICE_sardinia_region').GetName] vers [GetGeographicalRegion('RICE_ifriqiya_region').GetName].\n\nPeut-être souhaitent-ils faire cela en raison de l'instabilité dans leurs terres natales, ou peut-être est-ce dû à un simple désir d'aventure et de meilleures opportunités ailleurs. J'ai également entendu dire que certains d'entre eux descendent de réfugiés [african_roman.GetName] qui ont fui [GetGeographicalRegion('RICE_ifriqiya_region').GetNameNoTooltip] il y a des années.\n\nQuoi qu'il en soit, leurs dirigeants espèrent établir une ville appelée #italic Sardaniya#! quelque part dans cette région, en particulier à [sardaniya_location.GetNameNoTier]. En les accueillant et en les laissant conserver leurs coutumes et leur foi, ils pourraient nous apporter certains avantages politiques et économiques, même s'ils ne sont pas très nombreux."
 sardinia.0010.a:0 "Que Sardaniya s'épanouisse sous notre protection."
 sardinia.0010.tooltip:0 "Les [courtiers|E] chrétiens sardes ont une faible chance d'apparaître à la [court|E] des [rulers|E] qui possèdent le [county|E] de [sardaniya_location.GetNameNoTier] ou se trouvent à proximité"
 sardinia.0011.t:0 "xxxxx"
 sardinia.0011.desc:0 "xxxxx"
 sardinia.0011.a:0 "xxxxx"
 sardinia.0012.t:0 "De Sardaniya"
 sardinia.0012.desc:0 "[GetGeographicalRegion('RICE_ifriqiya_region').GetName] abrite de nombreux peuples. La ville de #italic Sardaniya#!, située dans [sardaniya_county.GetNameNoTier], abrite une communauté dynamique de chrétiens dont les ancêtres étaient originaires de la [GetGeographicalRegion('RICE_sardinia_region').GetName].\n\nUn[courtier.Custom('FR_E')] [courtier.GetWomanMan] [sardinian_culture.GetName] nommé[courtier.Custom('FR_E')] [courtier.GetFullName], originaire de #italic Sardaniya#!, a offert ses services. Peut-être pourrais-je faire usage de ses talents...."
 sardinia.0012.a:0 "Oui, [courtier.GetSheHe] est [courtier.Custom('FR_LeLa')] bienvenu[courtier.Custom('FR_E')] à ma cour."
 sardinia.0012.b:0 "Non, ses services ne sont pas nécessaires."
 sardinia.0013.t:0 "Les [afro_roman.GetCollectiveNounNoTooltip]"
 sardinia.0013.desc:0 "Dans les temps anciens, [GetGeographicalRegion('RICE_ifriqiya_region').GetName] abritait un grand nombre de $christianity_religion_adherent_plural$ [afro_roman.GetCollectiveNoun] qui parlaient leur propre dialecte du latin. Depuis l'arrivée de [GetReligionByKey('islam_religion').GetName], cette communauté a décliné à mesure qu'ils se convertissaient ou émigraient ailleurs.\n\nQuoi qu'il en soit, [courtier.GetTitledFirstName] est l'un des membres survivants de cette ancienne communauté qui est arrivé à ma cour, cherchant à me servir."
 sardinia.0013.desc.north_africa:0 "Comme [courtier.GetSheHe] est originaire de [GetGeographicalRegion('RICE_ifriqiya_region').GetNameNoTooltip], [courtier.GetSheHe] espère nous aider dans les affaires locales."
 sardinia.0013.desc.other:0 "Comme certains de ses semblables, [courtier.GetSheHe] cherche de meilleures opportunités ailleurs, au-delà des côtes de [GetGeographicalRegion('RICE_ifriqiya_region').GetNameNoTooltip]."
 sardinia.0013.a:0 "$sardinia.0012.a$"
 sardinia.0013.b:0 "$sardinia.0012.b$"
 sardinia.0014.t:0 "Renforcer l'Église"
 sardinia.0014.desc.intro:0 "L'Église latine continue de se développer en [GetGeographicalRegion('RICE_sardinia_region').GetName], mais il reste encore beaucoup à faire. C'est pourquoi j'ai récemment invité le clergé [catholic.GetAdjective] sur l'île, reconstruit des sites de culte et consacré des fonds au soutien de l'infrastructure religieuse sur place.\n\n"
 sardinia.0014.desc.pope:0 "[pope.GetTitledFirstName] est particulièrement satisfait de mes actions."
 sardinia.0014.desc.priest:0 "En fait, l'un des [GetFaithByKey('catholic').PriestNeuterPlural], [priest.GetFirstName], a même rejoint ma cour pour m'aider à faciliter la croissance de l'Église en [GetGeographicalRegion('RICE_sardinia_region').GetNameNoTooltip].\n\n"
 sardinia.0014.desc.opportunist:0 "Hélas, nombre de ces clercs arrivants étaient parrainés par [opportunist.GetFullName], qui, grâce à ces connexions, a accru son influence sur mes territoires, en particulier [claimed_county.GetNameNoTier].\n\nPar la grâce de [ROOT.Char.GetFaith.HighGodName], les manipulations déshonorantes de [opportunist.GetFirstNamePossessiveNoTooltip] ne resteront ni inaperçues ni impunies, et cela n'affectera pas les résultats spirituellement bénéfiques de mes actes."
 sardinia.0014.desc.conclusion:0 "Dans l'ensemble, mes actions profiteront spirituellement à l'île et à l'Église dans son ensemble."
 sardinia.0014.a:0 "Puisse [ROOT.Char.GetFaith.HighGodNameAlternate] nous guider et nous protéger!"
 sardinia.0015.t:0 "Revitalisation administrative"
 sardinia.0015.desc.intro:0 "[GetGeographicalRegion('RICE_sardinia_region').GetName] a été l'une des premières provinces de l'Empire romain, mais avec l'effondrement de la moitié occidentale de l'Empire, elle est tombée dans l'oubli en tant que région isolée.\n\nBien que les choses se soient grandement améliorées, il est nécessaire de relancer l'administration romaine de l'île. J'ai donc pris des mesures pour réorganiser la bureaucratie de l'île, promulguer de nouvelles lois et chartes et réformer les procédures gouvernementales."
 sardinia.0015.desc.emperor:0 "L'empereur [emperor.GetFirstName] a envoyé un certain nombre de fonctionnaires pour m'assister."
 sardinia.0015.desc.no_emperor:0 "En tant que [ROOT.Char.GetTitleAsNameNoTooltip], je dispose d'un grand nombre de fonctionnaires qui peuvent m'aider."
 sardinia.0015.desc.official:0 "L'un d'entre eux, [official.GetFirstName], a même rejoint ma cour pour m'aider à mieux coordonner ces efforts."
 sardinia.0015.desc.opportunist:0 "\n\nMalheureusement, il semble que [opportunist.GetTitledFirstName] se soit grandement impliqué[opportunist.Custom('FR_E')] dans cette entreprise, manipulant la situation à son avantage. La [GetGeographicalRegion('RICE_sardinia_region').GetNameNoTooltip] bénéficiera de mes actions, mais je dois agir prudemment avec [opportunist.GetFirstNameNoTooltip]."
 sardinia.0015.desc.conclusion:0 "\n\nGrâce à mes actions, La [GetGeographicalRegion('RICE_sardinia_region').GetNameNoTooltip] deviendra une île stable et prospère."
 sardinia.0015.a:0 "[GetGeographicalRegion('RICE_sardinia_region').GetNameNoTooltip] prospérera, j'en suis sûr[ROOT.Char.Custom('FR_E')]."
 sardinia.0016.t:0 "Développer les réseaux nord-africains"
 sardinia.0016.desc.intro:0 "Depuis que [GetGeographicalRegion('RICE_sardinia_region').GetName] s'est réorientée vers l'Afrique du Nord, les réseaux politiques, économiques et culturels de l'île ont été renforcés à travers la Méditerranée. J'ai donc récemment tenté de nouer des liens avec l'Afrique du Nord en invitant des colons, en échangeant des ambassades, en encourageant le commerce, etc.\n\n"
 sardinia.0016.desc.north_african_ruler:0 "Mes efforts ne sont pas passés inaperçus auprès de [north_african_ruler.GetFullName], qui a également fait beaucoup pour renforcer les liens entre [north_african_ruler.GetSheHe] et la [GetGeographicalRegion('RICE_sardinia_region').GetNameNoTooltip]. C'est une chose dont nous pouvons tous deux bénéficier."
 sardinia.0016.desc.no_north_african_ruler:0 "J'espère que certains dirigeants et autres personnes importantes en Afrique du Nord apprécieront mes efforts, même si nous sommes séparés par une mer, ou par la foi et la culture."
 sardinia.0016.desc.merchant:0 "De plus, un marchand [north_african_culture.GetName] de [county.GetNameNoTier] nommé[merchant.Custom('FR_E')] [merchant.GetFirstName] est même arrivé à ma cour pour aider à faciliter ces liens améliorés entre nos terres."
 sardinia.0016.desc.conclusion:0 "\n\nUne telle prospérité pourrait attirer l'attention de pirates rapaces et de malfaiteurs qui cherchent à piller la [GetGeographicalRegion('RICE_sardinia_region').GetNameNoTooltip], ou même à l'utiliser comme base d'opérations contre le trafic maritime accru autour de l'île. J'espère toutefois que, même si cela se produit, les avantages à long terme en vaudront la peine."
 sardinia.0016.a:0 "La Méditerranée est vraiment une mer pleine d'opportunités."
 sardinia.0017.t:0 "Fortifier l'île"
 sardinia.0017.desc.intro:0 "Depuis que la [GetGeographicalRegion('RICE_sardinia_region').GetName] est devenue une île indépendante dans l'esprit, sinon dans la réalité, les communautés locales ont travaillé dur pour protéger l'île des incursions extérieures. J'ai récemment fait l'effort de m'impliquer dans de tels projets en reconstruisant les défenses de l'île ou en érigeant de nouvelles en utilisant des techniques éprouvées de [GetPlayer.Custom('RICE_sardinia_none_ending_type')], et en formant la population pour qu'elle soit prête à faire face à d'éventuels raids ou attaques."
 sardinia.0017.desc.local:0 "\n\nDe nombreux habitants sont satisfaits de mon implication. L'un[local.Custom('FR_E')] d'entre eux, un[local.Custom('FR_E')] notable du nom de [local.GetFirstName] de [county.GetNameNoTier], est même arrivé[local.Custom('FR_E')] à ma cour pour m'assister."
 sardinia.0017.desc.conclusion:0 "\n\nTant que nous resterons vigilants, [GetGeographicalRegion('RICE_sardinia_region').GetNameNoTooltip] restera une partie de la Méditerranée fière et autosuffisante qui n'est redevable d'aucun des petits caprices et des manipulations des forces extérieures."
 sardinia.0017.a:0 "Longue vie à la [GetGeographicalRegion('RICE_sardinia_region').GetNameNoTooltip] !"
 sardinia.0018.t:0 "Les Condaghes de la [ROOT.Char.GetDynasty.GetBaseNameNoTooltip]"
 sardinia.0018.desc:0 "Au fil du temps, le peuple [ROOT.Char.GetCulture.GetName] a fait un usage extensif des #italic condaghes#! afin de garder trace des dotations, donations, baux, achats, litiges et autres activités financières et juridiques liées à nos institutions et bâtiments religieux.\n\nLa plupart des familles [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip] de renom, y compris les [ROOT.Char.GetDynasty.GetBaseName], ont rédigé un certain nombre de #italic condaghes#! au fil des années. Cependant, ils sont dispersés - certains sont conservés dans nos propres résidences et bureaux, tandis que d'autres sont entreposés dans les [ROOT.Char.GetFaith.HouseOfWorshipPlural] locales, et ils ne sont pas toujours en bon état.\n\nC'est pourquoi j'ai ordonné que nous retrouvions autant de #italic condaghes#! de notre famille que possible et que nous les recompilions. Cela nous sera d'une grande utilité à l'avenir, par exemple lorsque nous serons impliqués dans des litiges juridiques, que nous voudrons nous engager dans diverses transactions comme la vente ou l'achat de propriétés, ou même simplement pour montrer aux autres les œuvres charitables passées de notre famille."
 sardinia.0018.a:0 "C'est une bonne chose que nous fassions cela maintenant !"
 sardinia.0019.t:0 "Investir dans les chevaux du Palio"
 sardinia.0019.desc.intro:0 "Les grandes maisons [GetPlayer.GetCulture.GetName] comme [GetPlayer.GetHouse.GetName] se doivent de posséder une écurie de chevaux de course bien élevés. Sans ces chevaux, nous ne pourrions pas rivaliser avec les autres maisons lors des glorieuses courses de chevaux du Palio.\n\nC'est pour cette raison"
 sardinia.0019.desc.investor:0 "J'ai pris l'initiative"
 sardinia.0019.desc.other:0 "[ROOT.Char.Custom2('RelationToMe', palio_horse_investor)] a pris l'initiative"
 sardinia.0019.desc.conclusion:0 "d'investir davantage dans les chevaux de course de notre maison, que ce soit par l'élevage dans notre écurie existante, par l'achat de nouveaux chevaux à l'étranger ou, plus vraisemblablement, par les deux. Si nous jouons bien nos cartes, nous dominerons Palios dans la région pendant de nombreuses années !"
 sardinia.0019.a:0 "Nos chevaux nous permettront de remporter de grandes victoires !"
 sardinia.0019.small.tooltip:0 "Tant que votre [house|E] possède le [modifier|E] [GetModifier('RICE_sardinia_palio_horse_investment_small_modifier').GetNameWithTooltip], vos chances de gagner une [palio_race|E] sont augmentées d'un petit pourcentage."
 sardinia.0019.medium.tooltip:0 "Tant que votre [house|E] possède le [modifier|E] [GetModifier('RICE_sardinia_palio_horse_investment_medium_modifier').GetNameWithTooltip], vos chances de gagner une [palio_race|E] sont augmentées d'un petit pourcentage"
 sardinia.0019.large.tooltip:0 "Tant que votre [house|E] possède le [modifier|E] [GetModifier('RICE_sardinia_palio_horse_investment_large_modifier').GetNameWithTooltip], vos chances de gagner une [palio_race|E] sont augmentées d'un pourcentage modéré"
 sardinia.0020.t:0 "Préparatifs de Départ"
 sardinia.0020.desc:0 "Lorsque j'ai appris que [host.GetTitledFirstName] allait organiser un grand Palio à [location.GetName], j'ai su que je devais y assister. Des dignitaires et des patriciens de toute la région pourraient être présents pour observer cette course de chevaux, et ce sera de toute façon une occasion festive pour tout le monde.\n\nAprès les préparatifs du voyage, il est temps de se rendre au palio."
 sardinia.0020.a:0 "J'espère que ce sera très amusant !"
 sardinia.0021.t:0 "Participer au Palio ?"
 sardinia.0021.desc:0 "En prévision du Palio, je me dis que ces courses sont une excellente occasion pour les grandes maisons comme [ROOT.Char.GetHouse.GetName] de gagner en prestige et en renommée... à condition que nous participions à cette compétition en amenant l'un des chevaux de course de notre famille. Cela dit, il est évidemment assez coûteux de préparer des chevaux pour un tel événement."
 sardinia.0021.a:0 "C'est pourquoi nous ne sommes là que pour regarder cette fois."
 sardinia.0021.a.tooltip:0 "Votre [house|E] ne paiera aucun jockey pour participer à la [palio_race|E], et vous #N renoncez#! à vos chances d'obtenir des récompenses en remportant la [palio_race|E]."
 sardinia.0021.b:0 "Notre meilleur cheval de course est préparé pour cette occasion."
 sardinia.0021.b.tooltip:0 "Votre [house|E] aura la chance par défaut de remporter la [palio_race|E]. Cette chance peut être améliorée si quelqu'un de votre [house|E] a pris la [decision|E] d'#V $RICE_sardinia_invest_in_palio_horses$#!."
 sardinia.0021.c:0 "J'ai beaucoup investi pour m'assurer que nous allions gagner cette course !"
 sardinia.0021.c.tooltip:0 "Votre [house|E] aura la chance la #P plus élevée#! de remporter la [palio_race|E]. Cette chance peut être améliorée si quelqu'un de votre [house|E] a pris la [decision|E] d'#V $RICE_sardinia_invest_in_palio_horses$#!."
 sardinia.0022.t:0 "Arrivée"
 sardinia.0022.desc:0 "Je suis maintenant à [actual_location.GetName], pile à l'heure. Les gens ici bourdonnent d'excitation, courant dans tous les sens pour préparer le palio qui aura bientôt lieu, tandis que des visiteurs arrivent de près et de loin.\n\nUn palio n'est pas seulement la course en elle-même - la course est, après tout, simplement le point culminant d'une période de festivités, il y a donc beaucoup à faire. Cette fois, le palio se tient"
 sardinia.0022.desc.religious.christian:0 "pour célébrer la fête d'un saint populaire [faith.GetAdjective] ici à [actual_location.GetName]."
 sardinia.0022.desc.religious.non_christian:0 "pour célébrer une occasion religieuse en l'honneur d'une figure sainte locale [faith.GetAdjective]."
 sardinia.0022.desc.civic:0 "pour commémorer un anniversaire important dans l'histoire civique de [actual_location.GetName]."
 sardinia.0022.desc.dynastic:0 "en l'honneur des événements et triomphes plus récents de la Maison [host.GetHouse.GetName]."
 sardinia.0022.desc.horses:0 "\n\nJe prends également des nouvelles de mon cheval et de mon jockey qui participeront plus tard au palio. Tout semble aller bien pour eux - pour l'instant. Espérons qu'ils gagneront cette fois-ci !"
 sardinia.0022.a:0 "Je devrais superviser les derniers préparatifs."
 #sardinia.0023.t:0 "xxxxx"
 #sardinia.0023.desc:0 "xxxxx"
 sardinia.0023.a:0 "Installons-nous."
 sardinia.0024.t:0 "Offerta et Banquet"
 sardinia.0024.desc:0 "Ce soir, toutes les personnes présentes - y compris les résidents de [actual_location.GetName] et les visiteurs - participent à l'#italic offerta#!, c'est-à-dire la cérémonie d'offrande [host.GetFaith.GetAdjective]. Cette cérémonie est si importante que des amendes sont délivrées aux résidents locaux qui n'y assistent pas.\n\nAprès une procession à travers la ville, qui inclut des [host.Custom('DefaultPriestTitlePlural')], des artistes, et ainsi de suite, nous arrivons à l'un des principaux bâtiments municipaux, où un grand banquet est organisé pour un large groupe d'invités de marque - moi y compris."
 sardinia.0024.a:0 "Une occasion merveilleuse et festive !"
 #sardinia.0025.t:0 "xxxxx"
 #sardinia.0025.desc:0 "xxxxx"
 #sardinia.0025.a:0 "xxxxx"
 sardinia.0026.t:0 "La course commence !"
 sardinia.0026.desc.intro.christian:0 "C'est le matin du jour de la fête du saint."
 sardinia.0026.desc.intro:0 "C'est le matin du jour de fête."
 sardinia.0026.desc:0 "Nous devons d'abord assister à une autre grande procession, avant d'offrir un nouvel hommage dans une importante [host.GetFaith.HouseOfWorship] à [actual_location.GetName]. Tout cela est bien joli et amusant, mais ne vaut pas l'excitation du palio.\n\nLorsque le palio est sur le point de commencer, les rues sont bordées d'une foule de gens de tous horizons, des mendiants et paysans de la campagne aux marchands et nobles comme moi. Les chevaux s'alignent,"
 sardinia.0026.desc.horses:0 "Je vois le cheval représentant notre maison, la [ROOT.Char.GetHouse.GetName], portant un équipement décoré à nos couleurs ! Mes serviteurs et moi-même applaudissons à tout rompre en encourageant le jockey."
 sardinia.0026.desc.none:0 "Je vois des chevaux portant des équipements décorés aux couleurs de nombreuses familles différentes, principalement de la noblesse, mais aussi de quelques roturiers. Tout le monde les applaudit à tout rompre."
 sardinia.0026.desc.conclusion:0 "\n\nAu son de la trompette, la course démarre et les chevaux s'élancent dans la ville à une vitesse surnaturelle !"
 sardinia.0026.a:0 "Go! Go! Go!"
 sardinia.0026.info:0 "#emphasis Contexte historique :#! À l'époque moderne, le plus ancien Palio encore existant, le #italic Palio di Siena#! à Sienne, se déroule généralement sur un circuit autour de la #italic Piazza del Campo#!, la place principale de la ville. Cependant, avant le XVIIe siècle, les palios de Sienne ne se couraient pas en circuit ; ils partaient à la porte de la ville ou à l'extérieur de celle-ci et traversaient la cité, avant de se terminer sur la place principale."
 #sardinia.0027.t:0 "xxxxx"
 #sardinia.0027.desc:0 "xxxxx"
 #sardinia.0027.a:0 "xxxxx"
 sardinia.0028.t:0 "Jusqu'à la ligne d'arrivée !"
 sardinia.0028.desc:0 "Il y a un bruit de tonnerre dans l'air : un tonnerre qui provient non seulement du galop des chevaux rapides qui s'approchent de la ligne d'arrivée, mais aussi des acclamations et des cris de la foule enthousiaste. Puis, nous le voyons tous : un cheval passe la ligne d'arrivée.\n\n"
 sardinia.0028.desc.house_host:0 "Le cheval gagnant n'est autre que notre propre [house|E] [palio_winner.GetHouse.GetName] ! Je ne peux m'empêcher de crier et de rire de joie ! Les autres maisons nobles nous regardent sûrement avec envie, sachant que tout le monde prononcera le nom de notre famille avec admiration."
 sardinia.0028.desc.house_other:0 "Le cheval vainqueur appartient à la [house|E] [palio_winner.GetHouse.GetName], parrainé par [palio_winner.GetTitledFirstName]. Sans aucun doute, les [palio_winner.GetHouse.GetNameNoTooltip] et leurs suivants sont des plus satisfaits de ce résultat."
 sardinia.0028.desc.merchant:0 "Le cheval gagnant appartient à une famille de marchands qui l'a manifestement bien payé. Bien qu'ils ne fassent pas partie de l'élite de la noblesse comme nous, je dois reconnaître à contrecœur que leur exploit est tout de même impressionnant."
 sardinia.0028.desc.patrician:0 "Le cheval gagnant appartient à l'une des petites maisons nobles de [actual_location.GetNameNoTooltip]. Ce sera certainement un grand jour dans l'histoire de leur famille."
 sardinia.0028.desc.conclusion:0 "\n\nLe jockey du cheval victorieux s'approche des officiels qui ont organisé ce palio pour recevoir la bannière du palio, en signe de victoire dans cette compétition. Un bruit de tonnerre retentit dans toute la ville, tandis que tout le monde applaudit et crie en signe de célébration."
 sardinia.0028.a:0 "La course du palio s'achève, mais ce n'est pas fini !"
 sardinia.0028.b:0 "La victoire est douce, mais les festivités ne sont pas terminées !"
 sardinia.0028.info:0 "#emphasis Contexte Historique :#! Les jockeys gagnants des palios médiévaux et de la Renaissance étaient souvent rémunérés pour leurs services. Certains étaient des femmes ou même des enfants, en raison de leur petite taille. Par exemple, le palio de Sienne du 15 août 1581 a été remporté par une bergère de 12 ans, Virginia Tacci. Elle fut non seulement immortalisée par les poètes comme une sorte de femme guerrière, mais, comme Sienne était alors gouvernée par Florence, elle devint un symbole de la fierté locale et de la résistance à la domination florentine."
#  sardinia.0029.t:0 "$sardinia.0028.t$"
#  sardinia.0029.desc:0 "$sardinia.0028.desc$"
