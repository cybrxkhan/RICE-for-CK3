 sardinia.0050.t:0 "Un fromage spécial très dangereux"
 sardinia.0050.desc:0 "Je suis à un #italic ispuntinu#!, un petit festin traditionnel [ROOT.Char.GetCulture.GetName] pour renforcer la solidarité et rendre la pareille pour l'aide passée. Celui-ci est organisé en mon honneur pour avoir aidé les notables locaux en ma qualité de [ROOT.Char.GetTitleAsNameNoTooltip].\n\nLa nourriture est délicieuse, mettant en valeur les délices de la cuisine rustique [ROOT.Char.GetCulture.GetNameNoTooltip], comme de nombreux pains et viandes qui ont été rôtis, bouillis et mijotés de toutes sortes de façons. Le point culminant du festin est le #italic casu marzu#! : du fromage de brebis putréfié avec des asticots vivants.\n\nLes étrangers pourraient trouver ce fromage répugnant, ou au moins en rire, mais nous savons ce qu'il en est. C'est savoureux ! Cela dit, il n'y a aucune honte à mettre le fromage dans un sac pour étouffer les larves grouillantes avant de le manger, bien que d'autres préfèrent les manger vivantes."
 sardinia.0050.a:0 "Je ne suis pas un lâche, je mangerai le fromage tel quel !"
 sardinia.0050.b:0 "Je mets d'abord le fromage dans le sac."
 sardinia.0050.c:0 "À bien y réfléchir, les étrangers ont un point..."
 sardinia.0050.info:0 "#emphasis Contexte historique :#! Le #italic casu marzu#! est sans doute le plat le plus notoire de la cuisine traditionnelle sarde. Parce que les larves présentes dans le fromage peuvent provoquer une infection parasitaire du tube digestif, sa vente est interdite en Italie, mais il est toujours produit et consommé à grande échelle.\n\nCela dit, la consommation de larves n'est pas propre à la cuisine sarde. Les larves comme source de nourriture étaient déjà attestées dans l'Antiquité, par exemple. Ainsi, l'écrivain romain Pline l'Ancien mentionnait que les larves étaient considérées comme un mets de luxe à son époque. Il est donc possible que le #italic casu marzu#! ait des antécédents plus anciens."
 sardinia.0050.bad.toast:0 "Votre estomac ne se sent pas très bien"
 sardinia.0051.t:0 "Seadas"
 sardinia.0051.desc:0 "En visitant un village [culture.GetName] en [ROOT.Char.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTier], les habitants m'offrent des #italic seadas#!, un dessert traditionnel [culture.GetNameNoTooltip] composé de beignets frits farcis de fromage pecorino, de jus et de zestes de citron et d'orange, et de saindoux, puis nappés de miel, de sucre et de sel. Malgré ses origines modestes, c'est un délice savoureux."
 sardinia.0051.a:0 "Un beau mélange de salé et de sucré !"
 sardinia.0052.t:0 "Les Mystérieux Nuraghes"
 sardinia.0052.desc:0 "#italic Les Nuraghes#! sont un spectacle omniprésent en [GetGeographicalRegion('RICE_sardinia_region').GetName]. Ces monuments de pierre sont tout simplement partout.\n\nPersonne ne sait vraiment d'où ils viennent, cependant. J'ai discuté du sujet avec certains de mes courtisans, qui avancent tous des théories différentes."
 sardinia.0052.a:0 "Il est clair que c'est une race de géants disparus depuis longtemps qui les a construits !"
 sardinia.0052.b:0 "Les structures doivent être des châteaux d'anciens souverains."
 sardinia.0052.c:0 "Il devait s'agir d'antiques [ROOT.Char.GetFaith.HouseOfWorshipPlural] [ROOT.Char.GetFaith.GetAdjectiveNoTooltip]."
 sardinia.0052.d:0 "Honnêtement, je ne sais pas ce que c'est et je m'en fiche."
 sardinia.0052.info:0 "#emphasis Contexte Historique :#! Les nuraghes sont un type de structure mégalithique ancienne que l'on trouve sur l'ensemble de l'île de Sardaigne. Ils ont été construits principalement à l'âge du bronze et à l'âge du fer ; leur fonction générale est incertaine et peut avoir varié d'un nuraghe à l'autre : palais pour les souverains, forteresses, maisons ordinaires, lieux de culte, etc.\n\nBien que la civilisation nuragique, telle qu'on la connaît, ait été supplantée par la domination punique, grecque et romaine, il est plausible que des éléments de leur culture aient survécu à des périodes ultérieures. Les Nuraghes étaient encore occasionnellement réoccupés jusqu'à la période médiévale, les gens réutilisant les pierres pour des projets de construction ou comme fondation de structures plus récentes telles que des églises, ou les utilisant pour s'abriter."
 sardinia.0053.t:0 "Un Présage Inquiétant"
 sardinia.0053.desc:0 "Dans le folklore [ROOT.Char.GetCulture.GetName], certaines personnes sont considérées comme des #italic bidemortos#!, capables de voir les morts. Plus précisément, elles peuvent voir ce que l'on appelle la Procession d'Hérodias, un cortège de morts à la lune ou à minuit.\n\nNous avons reçu des nouvelles alarmantes à ce sujet. Un #italic bidemortos#! local affirme qu'en voyageant dans la campagne, il a vu [doomed.GetTitledFirstName] dans l'une de ces processions. C'est généralement un mauvais présage : on dit que toute personne vivante aperçue dans une telle procession mourra dans l'année."
 sardinia.0053.a:0 "[doomed.GetFirstNameNoTooltip], vous devez prier [ROOT.Char.GetFaith.HighGodName]!"
 sardinia.0053.a.tooltip:0 "Si [doomed.GetFirstNameNoTooltip] prie assez fort, peut-être que [GetPlayer.GetFaith.HighGodName] [doomed.GetHerHim] sauvera et empêchera [ROOT.Char.GetFaith.DeathDeityName] de venir."
 sardinia.0053.b:0 "Cette idée de #italic bidemortos#! est ridicule - ce n'est que de la superstition."
 sardinia.0053.b.tooltip:0 "[doomed.GetFirstNameNoTooltip] n'a rien à craindre ! Le #italic bidemortos#! n'a fait que voir les choses. Il ne se passera sûrement rien de grave. Assurément."
 sardinia.0053.info:0 "#emphasis Contexte historique :#! Dans le folklore sarde, les #italic bidemortos#! sont des personnes qui auraient la capacité de voir la procession des morts. Cette procession est appelée #italic su traigozzu#! (le grand train), #italic sa regula morte#! (l'armée des morts), ou, en Gallura dans le nord-est de la Sardaigne, #italic sa frotta de Erode#! (l'armée d'Hérodias). Ce dernier nom est peut-être un lien avec les légendes chrétiennes entourant Hérodias, une princesse de la Judée hérodienne qui aurait causé l'exécution de Jean le Baptiste."
 sardinia.0054.t:0 "Un présage exaucé"
 sardinia.0054.desc:0 "Bien.... C'est quelque chose.\n\nIl semble que ce #italic bidemortos#! avait raison après tout. Je viens d'apprendre que [doomed.GetTitledFirstName] est décédé[doomed.Custom('FR_E')] hier soir des suites d'une maladie rapide et soudaine."
 sardinia.0054.a:0 "Comme c'est déconcertant...."
 sardinia.0055.t:0 "La Juste Aradia"
 sardinia.0055.desc:0 "[dreamer.GetTitledFirstName] dit que la Juste Aradia lui a rendu visite en rêve la nuit dernière.\n\nDans les récits [ROOT.Char.GetCulture.GetName], elle est la cheffe des #italic janas#!, ou bonnes fées, qui vivent dans les grottes et les monuments de pierre qui parsèment l'île. Elle est opposée à Aradia la Démone, sa contrepartie maléfique.\n\nQuoi qu'il en soit, les #italic janas#! récompensent les femmes qui travaillent dur au filage et au tissage, et punissent celles qui sont paresseuses. Ainsi, les femmes sont encouragées à travailler plus dur, bien que les [ROOT.Char.Custom('DefaultPriestTitlePlural')] [ROOT.Char.GetFaith.GetAdjective] disent que de telles choses sont de la superstition.\n\nToujours est-il que [dreamer.GetFirstNameNoTooltip] affirme que le rêve qu'[dreamer.GetSheHe] a eu à propos d'Aradia était un"
 sardinia.0055.desc.bad:0 "mauvais rêve."
 sardinia.0055.desc.good:0 "bon rêve."
 sardinia.0055.a:0 "Je suis sûr[ROOT.Char.Custom('FR_E')] qu'Aradia était là pour vous guider."
 sardinia.0055.b:0 "Cela ressemble à un tour de passe-passe."
 sardinia.0055.info:0 "#emphasis Contexte historique :#! Aradia était une figure de la mythologie sarde qui fut amenée sur l'île depuis l'Italie à l'époque médiévale.\n\nAradia combinait des éléments de Diane, l'ancienne déesse romaine, et d'Hérodiade, une princesse de la Judée hérodienne qui aurait causé l'exécution de Jean le Baptiste. Après son arrivée dans la Sardaigne médiévale, Aradia se scinda en deux figures distinctes - l'une bonne (la Juste Aradia), et l'autre mauvaise (Aradia la Démone) - mais les autorités ecclésiastiques décourageaient la croyance en de tels récits.\n\nContrairement à certaines affirmations, il est peu probable qu'Aradia soit la preuve d'une quelconque survivance du paganisme antique en Sardaigne. Au contraire, la figure d'Aradia montre l'évolution fascinante des mythes et légendes au fil du temps, reflétant un cas particulier de religion populaire chrétienne."
 sardinia.0056.t:0 "Saint Saturnin"
 sardinia.0056.desc:0 "Mon [chaplain.GetCouncilTitle] [chaplain.GetTitledFirstName] m'a récemment suggéré de prier plus ardemment Saint Saturnin de Cagliari.\n\n\"Il est le patron non seulement de [GetTitleByKey('b_cagliari').GetNameNoTier], mais aussi, en quelque sorte, le protecteur de toute l'île de [GetGeographicalRegion('RICE_sardinia_region').GetName]\", souligne [chaplain.GetFirstNameNoTooltip]. \"Il peut vous protéger afin que nous puissions accomplir la volonté de [ROOT.Char.GetFaith.HighGodName], et les habitants vous en seront reconnaissants.\""
 sardinia.0056.a:0 "Je peux faire quelques prières privées ici et là."
 sardinia.0056.b:0 "Il serait bon d'adresser des prières publiques à Saint Saturnin."
 sardinia.0056.info:0 "#emphasis Contexte Historique :#! Selon la légende, Saint Saturnin de Cagliari a été martyrisé par les Romains sous le règne de l'empereur romain Dioclétien (284 - 305 de notre ère). Il fait partie des saints sardes qui sont restés des figures populaires de la vénération locale, contrairement aux saints plus associés à l'église orthodoxe grecque, qui ont perdu en popularité pendant la période médiévale après que la Sardaigne s'est alignée sur l'Occident catholique."
 sardinia.0057.t:0 "Le Faux Bullatoriu"
 sardinia.0057.desc:0 "Dans une affaire judiciaire récente, une famille de serfs rattachée à [ROOT.Char.GetFaith.HouseOfWorship] a prétendu que [ROOT.Char.GetFaith.HouseOfWorship] n'avait aucun droit sur eux, et qu'ils étaient libres. Ils ont présenté une lettre scellée de mon propre #italic bullatoriu#! - le sceau d'un #italic judicati#! - pour le prouver, mais il s'est avéré que c'était un faux.\n\nCondamner ces paysans prétentieux et écervelés est la punition évidente pour avoir falsifié des documents sous #italic mon#! nom. Cependant, quelques-uns de mes courtisans suggèrent que ce serait trop sévère, et qu'en l'honneur de [ROOT.Char.GetFaith.HighGodName], je devrais faire preuve de clémence."
 sardinia.0057.a:0 "Pardonner les serfs et les renvoyer à [ROOT.Char.GetFaith.HouseOfWorship]."
 sardinia.0057.b:0 "Cela créera un mauvais précédent. Exécutez-les."
 sardinia.0057.info:0 "#emphasis Contexte historique :#! Cet événement est basé sur un incident survenu dans le Judicat d'Arborea, consigné au XIIe siècle dans le #italic Condaghe di Santa Maria di Bonarcado#!, l'un des rares #italic condaghes#! survivants d'Arborea et une source importante sur l'histoire médiévale de la Sardaigne.\n\nLa carte 132 de ce #italic condaghe#! relate comment sept frères et sœurs, serfs d'un certain monastère, affirmèrent qu'ils étaient en réalité des personnes libres et que le monastère n'avait aucun droit sur eux.\n\nL'affaire fut portée devant le tribunal où les frères et sœurs présentèrent comme preuve une lettre de Comita, le Juge et souverain de Sardaigne, scellée d'un #italic bullatoriu#!, un emprunt grec en sarde désignant la pince portant les matrices des deux faces des sceaux qui étaient imprimés avec force de part et d'autre.\n\nLa lettre s'avéra être un faux, selon le #italic condaghe#!, et Comita les condamna à mort. Les serfs furent sauvés de l'exécution grâce à une intervention de dernière minute de la mère de Comita, Anna, qui réussit à le convaincre de les épargner en l'honneur de la Vierge Marie. Ils furent ensuite rendus au monastère."
 sardinia.0058.t:0 "Réel ou frauduleux ?"
 sardinia.0058.desc:0 "Chez les [ROOT.Char.GetCulture.GetCollectiveNoun], les #italic condaghes#! sont des registres utiles pour régler les affaires juridiques. Bien entendu, cela signifie que parfois, ces documents sont falsifiés.\n\nOr, je me retrouve dans une situation délicate. Un noble et un [ROOT.Char.Custom('DefaultPriestTitle')] [ROOT.Char.GetFaith.GetAdjective] local se disputent la propriété d'un serf. Le noble a produit un #italic condaghe#! datant de l'époque de son père qui prétend fournir des preuves en sa faveur, mais aucun des témoins ayant signé ce #italic condaghe#! n'est encore en vie, comme par hasard. Le [ROOT.Char.Custom('DefaultPriestTitle')] affirme que le #italic condaghe#! est un faux.\n\nÀ l'issue de la procédure judiciaire, je dois rendre une décision en tant que [ROOT.Char.GetTitleAsNameNoTooltip]. J'examine le #italic condaghe#!, et je décide que..."
 sardinia.0058.a:0 "Le #italic condaghe#! de ce noble semble être légitime."
 sardinia.0058.b:0 "Le [ROOT.Char.Custom('DefaultPriestTitle')] a raison. L'absence de témoins vivants est suspect."
 sardinia.0058.info:0 "#emphasis Contexte historique :#! Cet événement est basé sur un incident survenu dans le Judicat d'Arborea, consigné au XIIe siècle dans le #italic Condaghe di Santa Maria di Bonarcado#!, l'un des rares #italic condaghes#! d'Arborea ayant survécu et une source importante sur l'histoire médiévale de la Sardaigne.\n\nLes fiches 178-179 relatent un procès entre un prieur Nicolau et un certain Goantine de Sogos, qui se disputaient la propriété d'un serviteur. Au cours du procès, Goantine présenta un #italic condaghe#! datant de l'époque de son père comme preuve, mais aucun des témoins qui l'avaient signé n'était encore en vie.\n\nToutes les personnes présentes au tribunal en conclurent que le #italic condaghe#! était un faux."
 sardinia.0059.t:0 "Dons"
 sardinia.0059.desc:0 "J'ai identifié une [ROOT.Char.GetFaith.HouseOfWorship] [ROOT.Char.GetFaith.GetAdjective] à proximité qui pourrait bénéficier de quelques donations de serviteurs et d'animaux. Une fois les donations effectuées, elles seront consignées dans un #italic condaghe#! en langue [ROOT.Char.GetCulture.GetLanguage.GetName] - ainsi, tous se souviendront de ma donation et de la générosité de la Maison [ROOT.Char.GetHouse.GetName] pour les générations à venir."
 sardinia.0059.a:0 "Préparez les dons !"
 sardinia.0059.b:0 "Je ne peux pas me permettre de faire ça."
 sardinia.0060.t:0 "Une réputation peu reluisante"
 sardinia.0060.desc:0 "Je reçois aujourd'hui un dignitaire venu de loin à ma cour en [ROOT.Char.GetCapitalLocation.GetName]. Il avoue avoir hésité à se rendre en Sardaigne, en raison de sa réputation de terre de maladie et de barbarie. De telles rumeurs ne sont pas rares dans les pays étrangers."
 sardinia.0060.a:0 "Comme vous le voyez, notre île est aussi très belle."
 sardinia.0060.b:0 "Non, vous vous trompez lourdement et vous êtes partial."
 sardinia.0060.c:0 "Honnêtement, notre île #italic est#! un endroit horrible."
 sardinia.0060.info:0 "#emphasis Contexte Historique :#! Dans l'Antiquité et au Moyen Âge, la Sardaigne avait une mauvaise réputation en raison de l'épidémie de paludisme qui sévissait sur l'île et du stéréotype selon lequel ses habitants (quelle que soit leur origine) étaient plutôt féroces et têtus, voire avaient des tendances criminelles.\n\nAinsi, lorsque l'archevêque pisan Frédéric Visconti, qui détenait l'autorité ecclésiastique sur l'île, s'apprête à la visiter en 1263, il déclare : "Comment allons-nous nous débrouiller dans cette terre d'horreur et de solitude, où les gens ne vont que pour faire un bon profit ?" et que "la Sardaigne était malade, et même la maladie personnifiée, car tous ceux qui quittent l'endroit tombent rapidement malades"."
 sardinia.0061.t:0 "Un Nuraghe prometteur"
 sardinia.0061.desc:0 "Des [ROOT.Char.Custom('DefaultPriestTitlePlural')] [ROOT.Char.GetFaith.GetAdjective] de mon royaume ont identifié un #italic nuraghe#! dans [county.GetNameNoTier] qui semble prometteur comme site potentiel pour un futur petit sanctuaire destiné à servir la communauté voisine. Ils espèrent que je puisse fournir des fonds pour transformer cet endroit en un véritable lieu de culte.\n\nIl est courant que ces anciens monuments de pierre soient réutilisés de cette manière, et ils sont fréquemment visités par les habitants, que ce soit pour des raisons religieuses ou commerciales. En transformer un en lieu de culte [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] local est une chose juste et avisée."
 sardinia.0061.a:0 "Les [ROOT.Char.Custom('DefaultPriestTitlePlural')] recevront des fonds pour cet effort."
 sardinia.0061.b:0 "Je ne peux pas les aider pour le moment."
 sardinia.0062.t:0 "Chant guttural [culture.GetNameNoTooltip]"
 sardinia.0062.desc:0 "Aujourd'hui, des roturiers [culture.GetName] de [county.GetNameNoTier] habiles dans le chant #italic cantu a tenore#! sont arrivés à ma cour pour se produire devant nous. Il s'agit d'une forme unique et ancienne de chant de gorge originaire de [GetGeographicalRegion('RICE_sardinia_region').GetName].\n\nQuatre chanteurs se tiennent en cercle pendant la majeure partie de la représentation. L'un d'eux récite un poème, tandis que les trois autres chantent en chœur d'accompagnement. C'est un son agréable, et leurs chansons abordent un vaste répertoire de sujets.\n\nÀ la fin de la représentation, je distribue des récompenses à ces talentueux chanteurs, comme il se doit."
 sardinia.0062.a:0 "Merci pour cette excellente performance."
 sardinia.0062.b:0 "Des chanteurs aussi compétents méritent plus qu'un simple cadeau !"
 sardinia.0062.info:0 "#emphasis Contexte historique :#! #italic Cantu a tenore#! ou #italic canto a tenore#! est une forme de chant de gorge originaire de Sardaigne, particulièrement de ses régions centrales, généralement interprétée par un groupe de quatre hommes. Il peut être exécuté lors d'occasions informelles, mais aussi lors de rassemblements formels, tels que des mariages et des fêtes religieuses."
 sardinia.0063.t:0 "Chemins des bergers"
 sardinia.0063.desc:0 "Des bergers peuvent être trouvés dans toute la [GetGeographicalRegion('RICE_sardinia_region').GetName]. Récemment, j'ai pris le temps d'explorer les sentiers de bergers disséminés à travers [ROOT.Char.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip], serpentant à travers ses montagnes escarpées, ses vallées, ses rivières, et bien plus encore.\n\nCe fut une excursion relaxante, et il est également important que je connaisse les routes potentielles que mes officiers et soldats peuvent emprunter dans la région environnante."
 sardinia.0063.a:0 "Ces informations seront très utiles."
 sardinia.0064.t:0 "Chevaux de Giara"
 sardinia.0064.desc:0 "Alors que nous nous promenions dans la campagne de [ROOT.Char.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip], nous avons croisé un petit troupeau de chevaux #italic Giara#! Aussi loin que quiconque s'en souvienne, on peut trouver des troupeaux de ces petits chevaux sauvages sur l'île. Ils vont librement et voyagent où bon leur semble à travers le terrain accidenté de l'île, et sont un plaisir à observer."
 sardinia.0064.a:0 "Ils ont beau être petits, ils n'en sont pas moins majestueux !"
 sardinia.0064.info:0 "#emphasis Contexte historique :#! Le cheval #italic giara#! est une race de petit cheval que l'on trouve dans toute la Sardaigne. Il est incertain s'il s'agit d'une race ancienne native de l'île, ou s'il descend de chevaux introduits en Sardaigne par des colons puniques ou romains plus tardivement. Quoi qu'il en soit, pendant des siècles, des troupeaux de chevaux #italic giara#! sauvages ont été attestés dans toute la Sardaigne. Actuellement, cependant, leur population s'est réduite à quelques centaines d'individus, et ils sont confinés à une région de plateau dans le sud de la Sardaigne appelée #italic Giara di Gesturi#!."
