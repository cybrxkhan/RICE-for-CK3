 RICE_sardinia_palio_prepare_race_extensive_log:0 "[house|E] [CHARACTER.GetHouse.GetBaseName], sur les instructions de [CHARACTER.GetShortUIName|U], participera au [palio|E] et aurait effectué #P des préparatifs #bold extensifs#!#! pour la course."
