 north_atlantic.0140.t:0 "Un avant-poste au Vinland"
 north_atlantic.0140.desc:0 "Vinland est un rêve que je #italic vais#! réaliser. Je n'ai pas été influencé par de pathétiques arguments sur les coûts ou les risques liés à la navigation vers cette terre légendaire à des milliers de lieues d'ici, ni sur le fardeau que cela représenterait pour la communauté du Groenland. Vinland est une terre fertile, parfaite pour s'y établir, même si elle n'offre pas grand-chose en termes de ressources précieuses.\n\nJ'ai pu recruter quelques colons qui partagent mon avis et sont impatients de prouver leur bravoure et leur ingéniosité. Ils devront d'abord établir un avant-poste plus modeste dans cette terre étrangère - cela nous permettra de mettre en place une base d'opérations au Vinland pour de futures activités dans la région. À l'avenir, peut-être que cet avant-poste deviendra une véritable colonie !"
 north_atlantic.0140.a:0 "Je leur souhaite bonne chance !"
 north_atlantic.0140.a.tooltip:0 "Il faudra environ un an pour mener à bien cette entreprise."
 #north_atlantic.0140.b:0 "Let's provide them extra supplies, just in case."
 #north_atlantic.0140.b.tooltip:0 "$north_atlantic.0140.a.tooltip$ This option will increase the chances of success by #P +10%#!."
 north_atlantic.0141.t:0 "Un surveillant au Vinland"
 north_atlantic.0141.desc.courtiers:0 "Certains membres de ma cour souhaitent superviser nos tentatives d'établissement d'un avant-poste au Vinland en mon nom. Le voyage sera dangereux, mais si nous réussissons, les générations futures se souviendront sûrement de leurs exploits héroïques !"
 north_atlantic.0141.desc.no_courtiers:0 "Personne à ma cour ne semble vouloir superviser nos efforts pour établir un avant-poste au Vinland. Mes courtisans ne sont-ils qu'une bande de lâches ? Ils se plaignent des coûts et des risques, ainsi que de leurs préoccupations prétendument pragmatiques quant à la façon dont les ressources du Groenland seront mises à rude épreuve ! Qu'en est-il de l'aventure ? De la bravoure ? De l'ambition ? Quelle pitié !"
 north_atlantic.0141.desc.local:0 "\n\nCertains m'ont également recommandé un[local.Custom('FR_E')] [local.GetWomanMan] local[local.Custom('FR_E')], nommé[local.Custom('FR_E')] [local.GetFullName], qui s'est fait connaître en tant que voyag[local.Custom('FR_RSe')] expérimenté[local.Custom('FR_E')]. [local.GetSheHe|U] pourrait convenir comme supervis[local.Custom('FR_RSe')] de notre avant-poste au Vinland. Cependant, [local.GetSheHe] s'attendra à une compensation financière pour ses efforts."
 north_atlantic.0141.a:0 "[candidate_1.GetFirstName] a les capacités et l'expérience pour être [candidate_1.GetHerHim] superviseur[candidate_1.Custom('FR_E')]."
 north_atlantic.0141.b:0 "Je ne doute pas que [candidate_2.GetFirstNameNoTooltip] fera du bon travail en tant que superviseur."
 north_atlantic.0141.c:0 "[local.GetFirstNameNoTooltip] a l'expérience requise - engagez [local.GetHerHim] pour le travail !"
 north_atlantic.0141.d:0 "À bien y réfléchir, nous n'avons pas besoin d'un superviseur officiel."
 north_atlantic.0142.t:0 "Nouvelles du Vinland"
 north_atlantic.0142.desc:0 "Aujourd'hui, j'ai reçu des nouvelles de notre récente tentative d'établir un avant-poste au Vinland."
 north_atlantic.0142.desc.success:0 "\n\nHeureusement, les détracteurs ont eu tort... pour l'instant. Le petit groupe de colons que j'ai envoyé dans le fertile Vinland a réussi à établir un petit avant-poste.\n\nPeut-être pourrons-nous même envisager d'y fonder un jour une véritable colonie permanente ! Mais je ne devrais pas m'emballer - les détracteurs ont raison, au moins, sur le fait que cela #italic a#! été coûteux. Nous devons d'abord nous assurer que cet avant-poste se développe bien, afin que les ressources que nous avons consacrées à cette entreprise n'aient pas été dépensées en vain."
 north_atlantic.0142.desc.fail:0 "\n\nMalheureusement, malgré tous nos efforts, il semble que les détracteurs avaient raison. Que ce soit en raison d'une planification inadéquate, de provisions et de ressources limitées, de l'hostilité des peuples autochtones locaux, d'un manque de volonté et d'un moral bas, ou d'autre chose, le petit groupe de colons que j'ai envoyé au Vinland n'a pas réussi à y établir un petit avant-poste. Ceux qui ont survécu à toute cette épreuve sont rentrés chez eux, abattus et découragés.\n\nPeut-être ai-je sous-estimé les difficultés d'établir un point d'ancrage au Vinland."
 north_atlantic.0142.a:0 "Nous verrons ce qui se passera ensuite."
 north_atlantic.0143.t:0 "$north_atlantic.0142.t$"
 north_atlantic.0143.desc:0 "[vinland_colonizer.GetTitledFirstName] a établi un avant-poste au Vinland au nom de notre grande dynastie, les [ROOT.Char.GetDynasty.GetName]. C'est son espoir que nous puissions utiliser ceci comme tremplin pour nos ambitions dans cette terre lointaine de légendes et de mythes.\n\nBien sûr, un bon nombre de personnes sont sceptiques quant à savoir si une telle entreprise prospérera à long terme. Si le Vinland est une terre luxuriante et fertile, il est aussi extrêmement éloigné, même du Groenland (qui est lui-même déjà loin de la civilisation), et manque de nombreuses ressources profitables.\n\nNous ne pouvons qu'espérer que les [ROOT.Char.GetDynasty.GetName] prévaudront à la fin, et que cet avant-poste du Vinland réussisse !"
 north_atlantic.0143.a:0 "Nous verrons bien ce qui se passera ensuite !"
 north_atlantic.0144.t:0 "La colonisation du Vinland... En continu"
 north_atlantic.0144.desc:0 "Il y a de nombreuses années, le brave aventurier [leif.GetFirstNameNicknamed] traversa l'océan bleu depuis le Groenland et découvrit une terre luxuriante qu'[leif.GetSheHe] nomma Vinland. À mesure que les colonies du Groenland grandissaient, nos activités au Vinland aussi : des gens du Groenland, d'Islande et d'ailleurs établirent de petits avant-postes le long des côtes du Vinland, pour se livrer à l'exploration, la collecte de ressources, ainsi qu'au commerce avec les locaux amicaux, et au combat contre les hostiles.\n\nNous, le clan [ROOT.Char.GetDynasty.GetName], avons été l'une des familles de premier plan au Vinland. La colonie du Groenland étant désormais fermement établie comme partie intégrante du monde de l'Atlantique Nord, il est temps que nous tournions enfin nos regards vers l'ouest.\n\nJ'ai rassemblé les ressources et les colons nécessaires pour transformer notre avant-poste du Vinland en une colonie permanente. Pour éviter les malentendus, j'ai également informé nos alliés locaux de nos intentions, et ils semblent désireux de renforcer les liens commerciaux, culturels et diplomatiques entre nos peuples."
 north_atlantic.0144.a:0 "Il ne reste plus qu'à espérer que tout se passe bien !"
 north_atlantic.0144.a.tooltip:0 "Il faudra environ un an pour mener à bien cette entreprise."
 north_atlantic.0145.t:0 "Une colonie permanente à Vinland"
 north_atlantic.0145.desc:0 "Nous l'avons fait.\n\nDe bonnes nouvelles sont arrivées du Vinland aujourd'hui. Les navires que j'ai envoyés avec des colons et des provisions ont réussi à transformer l'avant-poste existant de notre famille au Vinland en une colonie grande et prospère. Nos amis parmi les peuples locaux se réjouissent également des nouvelles opportunités de collaboration avec nous dans le commerce et la guerre.\n\nEn fait, cet événement a été si transformateur pour la colonie que beaucoup là-bas commencent à s'identifier comme un nouveau peuple, les [new_culture.GetCollectiveNoun].\n\nLe Vinland ne sera plus considéré comme une marge de notre monde connu, même comparé au Groenland. J'admettrai que le Vinland ne pourra jamais égaler le Groenland en termes d'utilité économique, mais sous la direction de notre famille, je suis certain que la colonie du Vinland peut néanmoins servir de lien vital entre l'Eurasie et les Amériques."
 north_atlantic.0145.a:0 "Je me réjouis de voir le Vinland se développer et prospérer."
 north_atlantic.0146.t:0 "$north_atlantic.0145.t$"
 north_atlantic.0146.desc:0 "Il y a des années, quand [leif.GetFirstNameNicknamed] découvrit le Vinland, beaucoup concédèrent qu'il était impraticable de coloniser le Vinland sur le long terme, étant donné sa grande distance même du Groenland (qui lui-même est déjà distant de l'Europe), et le manque de ressources rentables.\n\nLes choses ont changé depuis. Le Groenland s'est transformé en une partie importante et stable de la civilisation de l'Atlantique Nord, à mesure que les réseaux commerciaux, culturels et diplomatiques se développent. Au fil du temps, les Groenlandais établirent de petits avant-postes au Vinland, pour s'engager dans le commerce, l'exploration et l'extraction de ressources.\n\nSous la direction de [vinland_colonizer.GetTitledFirstName], l'un de ces avant-postes s'est suffisamment étendu pour devenir une ville de taille importante - le premier établissement permanent de personnes venues d'Eurasie au Vinland. Bien que petite et moins rentable que le Groenland, cette colonie servira assurément de pont majeur pour les deux côtés de l'Atlantique Nord. Beaucoup là-bas commencent même à s'identifier comme un nouveau peuple, les [new_culture.GetCollectiveNoun].\n\nEn accomplissant ce que peu pensaient possible, [vinland_colonizer.GetTitledFirstNameNoTooltip] sera rappelé aux côtés de [leif.GetFirstNameNicknamedNoTooltip] comme l'une des figures historiques les plus importantes de l'histoire de l'Atlantique Nord."
 north_atlantic.0146.a:0 "Un événement historique !"
 north_atlantic.0147.desc:0 "Depuis que [leif.GetFirstNameNicknamed] a découvert le Vinland, beaucoup ont envisagé la possibilité d'y créer un établissement permanent et d'envergure, semblable au Groenland. Désormais, avec la colonie groenlandaise stable et capable de perdurer sur le long terme, certains cherchent à atteindre un tel objectif au Vinland.\n\n[vinland_person.GetTitledFirstName] en particulier a décidé de prendre l'initiative et de montrer la voie en établissant une telle colonie. La nouvelle se répand que [vinland_person.GetSheHe] rassemble les ressources et les colons nécessaires pour transformer le petit avant-poste de sa famille au Vinland en un établissement de taille considérable.\n\nSi et quand cet effort aboutira, cette colonie du Vinland pourrait servir de lien important entre l'Eurasie et les Amériques, tout comme le Groenland."
 north_atlantic.0147.a:0 "Nous verrons ce qui se passera ensuite..."
 north_atlantic.0147.tooltip:0 "La [decision|E] de $RICE_north_atlantic_settle_vinland$ est désormais indisponible pour les autres [rulers|E], en supposant que [vinland_person.GetFirstNameNoTooltip] ou ses héritiers réussissent dans leur entreprise d'établir une [vinland_colony|E]."
