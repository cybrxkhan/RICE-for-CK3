 RICE_north_atlantic_minor_walrus_hunt_option_desc:0 "Préparer deux navires pour le voyage"
 RICE_north_atlantic_minor_walrus_hunt_option_tooltip:0 "#V #Bold Coût minimum : @gold_icon! [GetGlobalVariable('RICE_global_walrus_hunt_minor_cost').GetValue|0]#!#!\n\n$EFFECT_LIST_BULLET$Gagnez entre @gold_icon! #V [GetGlobalVariable('RICE_global_walrus_hunt_min_gain').GetValue]#! et @gold_icon! #V [GetGlobalVariable('RICE_global_walrus_hunt_minor_max_gain').GetValue]#! #italic si#! la chasse réussit (montant de base)\n$EFFECT_LIST_BULLET$Aucun effet sur les chances de réussite de la chasse"
