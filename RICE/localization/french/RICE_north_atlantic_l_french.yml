 north_atlantic.0200.t:0 "Auks"
 north_atlantic.0200.desc:0 "Les grands pingouins sont une présence remarquable dans une grande partie de l'océan Atlantique. Ces grands oiseaux incapables de voler se trouvent en colonies dans la région, et constituent une source de nourriture courante.\n\nUn certain nombre de marins de la région ont récemment chassé avec succès plusieurs de ces oiseaux, et proposent de me vendre la viande et les œufs à bon prix. Cela pourrait être utile à mes cuisiniers pour les prochains festins ou rassemblements."
 north_atlantic.0200.a:0 "Donnez-moi cette viande de pingouin."
 north_atlantic.0200.b:0 "J'achèterai quelques-uns de ces œufs !"
 north_atlantic.0200.c:0 "Puis-je acheter à la fois la viande et les œufs ?"
 north_atlantic.0200.d:0 "Non merci, je n'ai besoin d'aucun des deux !"
 north_atlantic.0201.t:0 "Hestavíg"
 north_atlantic.0201.desc:0 "Le combat de chevaux est populaire en Islande, où il est appelé #italic Hestavíg#!, et revêt une grande importance sociale. [horse_1.GetTitledFirstName] et [horse_2.GetTitledFirstName] participaient récemment à l'un de ces événements, soutenant des camps différents, et en sont venus aux mains.\n\nLes altercations de ce type ne sont pas rares lors de ces événements, qui peuvent même mener à des querelles. Heureusement, personne n'a été blessé.\n\nCependant, en tant que [ROOT.Char.GetTitleAsNameNoTooltip], je devrais peut-être parler à ces deux-là pour m'assurer que cela ne se reproduise plus à l'avenir. Après tout, cela fait mauvaise impression si je ne peux pas contrôler mes propres gens."
 north_atlantic.0201.a:0 "Je leur donnerai une sévère leçon de morale."
 north_atlantic.0201.a.success:0 "Ils conviennent d'enterrer la hache de guerre"
 north_atlantic.0201.a.failure:0 "Ils ne tiennent pas compte de mes demandes"
 north_atlantic.0201.b:0 "Leur querelle n'est pas mon problème."
 north_atlantic.0202.t:0 "Le Broch"
 north_atlantic.0202.desc:0 "Dans les parties septentrionales des îles Britanniques, on peut parfois tomber sur de mystérieuses tours de pierre aux murs creux, appelées brochs. Personne ne sait qui a construit ces structures ni à quoi elles servaient.\n\nIl n'y a pas si longtemps, j'ai rencontré un tel broch dans le [county.GetNameNoTier]. Notre guide nous a expliqué certaines des légendes qui l'entourent, et encore maintenant je me surprends à m'interroger sur ce broch et sur la raison pour laquelle il fut originellement construit."
 north_atlantic.0202.a:0 "Il y a beaucoup de mystères dans ce monde."
 north_atlantic.0203.t:0 "Le Meuglement du Taureau"
 north_atlantic.0203.desc:0 "Alors que nous voyagions dans [county.GetNameNoTier], mon entourage et moi avons entendu un bruit vrombissant et sifflant. Nous fûmes d'abord alarmés, et l'un de mes gardes marmonna même nerveusement quelque chose à propos d'esprits courroucés des morts.\n\nFinalement, nous découvrîmes que la source du bruit était d'origine humaine : un roturier local maniait un rhombe. Ce rhombe est un curieux instrument utilisé dans les highlands écossais, constitué d'une simple pièce de bois sculptée attachée à une corde, que l'on fait tourner continuellement en un large cercle pour produire un son vibrant.\n\nQuoi qu'il en soit, le roturier s'excuse pour le vacarme, mais dit que cela fait partie d'un rituel dans ces contrées pour se protéger de la foudre et d'autres dangers."
 north_atlantic.0203.a:0 "Continuez. Il est important de se protéger !"
 north_atlantic.0203.b:0 "Arrêtez ce bruit infernal !"
 north_atlantic.0204.t:0 "Contes des Moines"
 north_atlantic.0204.desc:0 "Un chanteur local se produit à ma cour aujourd'hui. Beaucoup de ses chansons parlent des aventures légendaires des moines chrétiens d'Irlande et d'Écosse, qui, prétendument, voyagèrent vers des îles lointaines et désolées de l'océan Atlantique il y a de nombreuses générations, afin de pouvoir prier sans distraction. Sur ces îles, ils étaient parfois connus sous le nom de #italic papar#!.\n\nParfois, les histoires concernent même les voyages légendaires que ces moines entreprirent vers des terres très lointaines. Dans ces lieux fantastiques et éloignés, les moines rencontraient toutes sortes de bêtes, de plantes et de civilisations spectaculaires."
 north_atlantic.0204.a:0 "La dévotion zélée des moines à leur foi m'intrigue."
 north_atlantic.0204.b:0 "Ce sont les légendes des pays lointains qui m'intéressent le plus !"
 north_atlantic.0204.c:0 "Les histoires de ces moines sont idiotes, mais assez amusantes."
 north_atlantic.0205.t:0 "Observation des geysers"
 north_atlantic.0205.desc:0 "Les geysers sont un phénomène remarquable en [GetGeographicalRegion('custom_iceland').GetName], et j'ai eu l'occasion de visiter mes territoires là-bas pour observer l'un de ces geysers en personne (à bonne distance, bien sûr). Ce n'est pas tous les jours que l'on a l'occasion de voir un spectacle aussi remarquable !"
 north_atlantic.0205.a:0 "C'était très intéressant à voir."
 north_atlantic.0206.t:0 "Mousse d'Islande"
 north_atlantic.0206.desc:0 "La mousse d'Islande, comme on l'appelle, est un lichen à la présence remarquable dans les régions montagneuses de l'Atlantique Nord, mais surtout en [GetGeographicalRegion('custom_iceland').GetName]. Bien que comestible, de nombreuses personnes de haut rang comme moi-même évitent d'en manger, car c'est évidemment une nourriture plus adaptée aux paysans.\n\nCependant, on m'a récemment dit que cette mousse d'Islande constitue un bon remède, pour aider en cas de manque d'appétit, ou pour apaiser les maux de poitrine ou la toux. Peut-être devrais-je m'en procurer pour mon usage."
 north_atlantic.0206.a:0 "C'est encore de la nourriture paysanne - mes médecins ont de meilleurs remèdes."
 north_atlantic.0206.b:0 "Une bonne idée ! Il y en a beaucoup, il sera donc facile à trouver."
 north_atlantic.0207.t:0 "Viande de macareux"
 north_atlantic.0207.desc:0 "On trouve des macareux sur toute la côte atlantique, et ici, ils sont souvent considérés comme un mets local. J'ai récemment eu l'honneur de servir de la viande de macareux en point d'orgue d'un petit festin que j'ai organisé pour un certain nombre de dignitaires en visite. Ces dignitaires ont félicité mes cuisiniers pour la qualité de la préparation de cette viande, et nous avons tous passé un excellent moment."
 north_atlantic.0207.a:0 "Mes cuisiniers ont fait du bon travail !"
 north_atlantic.0208.t:0 "Inhospitalité des laitiers"
 north_atlantic.0208.desc:0 "Tout le monde apprécie les produits laitiers comme le yaourt et le lait caillé. Cependant, en [GetGeographicalRegion('custom_iceland').GetName], il est considéré comme impoli de les servir à des invités de marque, surtout si l'on a de meilleurs mets à offrir.\n\n[milkdrinker.GetTitledFirstName], malheureusement, a la fâcheuse habitude de servir de tels produits à ses invités. [milkdrinker.GetSheHe|U] a donc la réputation de faire preuve d'une piètre hospitalité envers ses invités.\n\nRécemment, lorsque j'ai rendu une visite informelle à [milkdrinker.GetFirstNameNoTooltip], [milkdrinker.GetSheHe] ne m'a servi que du #italic skyr#!, le yaourt à l'islandaise ! [milkdrinker.GetFirstNameNoTooltip] a prétendu que puisque ce n'était pas l'heure du repas, il n'était pas nécessaire de servir un grand repas. Le #italic skyr#! est un mélange plutôt délicieux de saveurs crémeuses, acidulées et sucrées, certes, mais c'est tout de même une insulte pour [ROOT.Char.GetTitleAsNameNoTooltip] qui se respecte comme moi. Je ne peux pas laisser passer cela !"
 north_atlantic.0208.a:0 "J'aime le yaourt, cependant, alors je vais ignorer l'inconvénient cette fois-ci."
 north_atlantic.0208.b:0 "Scandaleux ! Comment ose-t-[milkdrinker.GetSheHe] ? Je vais l'insulter en retour !"
 north_atlantic.0208.c:0 "Peut-être puis-je [milkdrinker.GetHerHim] convaincre de changer ses habitudes."
 north_atlantic.0208.c.success:0 "[milkdrinker.GetFirstNameNoTooltip] accepte d'être plus hospitalier à l'avenir"
 north_atlantic.0208.c.failure:0 "[milkdrinker.GetFirstNameNoTooltip] refuse de changer ses habitudes"
 north_atlantic.0208.info:0 "\n#emphasis Contexte historique :#! Les produits laitiers sont consommés en Europe du Nord et de l'Ouest depuis des siècles, et le #italic skyr#! est le nom de la variante islandaise du yaourt. Il est intéressant de noter que, dans les sagas islandaises, servir des produits comme du lait, du fromage ou du yaourt à des invités était considéré comme inconvenant, surtout si d'autres aliments pouvaient être proposés. Être couvert de produits laitiers pouvait être considéré comme particulièrement humiliant.\n\nDans un épisode de la #italic Saga d'Egil#!, par exemple, le protagoniste Egil et ses compagnons rendent visite à un homme nommé Armod, qui ne leur sert que du #italic skyr#!. Egil prend cela comme une grande insulte et, en guise de vengeance, vomit le yaourt sur Armod, qui à son tour vomit sur Egil. Quand les hommes d'Armod demandent pourquoi Egil a fait une telle chose, il répond : \"Ne me blâmez pas de suivre l'exemple du maître de maison. Il vomit ses tripes tout autant que moi.\" "
