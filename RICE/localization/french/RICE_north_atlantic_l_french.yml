 north_atlantic.0169.desc:0 "xxxxx"
 north_atlantic.0169.a:0 "xxxxx"
 north_atlantic.0170.t:0 "$RICE_greenland_struggle_ending_integration_decision$"
 north_atlantic.0170.desc:0 "Pendant longtemps, le Groenland a chevauché la frontière de deux mondes séparés par le vaste océan. Certains se demandaient si les colonies du Groenland, fondées il y a si longtemps par d'intrépides pionniers venus d'Europe, pouvaient perdurer dans un climat aussi rude.\n\nSous ma direction, la colonie du Groenland n'est plus un coin appauvri du monde, survivant à peine : elle est devenue une partie forte, adaptable et vigoureuse de la civilisation nord-atlantique.\n\nCe qui n'était autrefois qu'un mince filet de marchandises entrant dans les ports d'Europe, comme l'ivoire de morse, est devenu un flot de peuples, d'idées, de cultures et de commerce à travers tout l'Atlantique. Désormais, c'est à nous de déterminer où se trouve la prochaine destinée du Groenland."
 north_atlantic.0170.a:0 "Les peuples de l'Atlantique Nord devraient développer des liens plus étroits !"
 north_atlantic.0170.b:0 "Le Groenland s'est développé grâce au commerce. Continuons à nous concentrer sur ce point."
 north_atlantic.0170.c:0 "Les colonies de l'extrême nord doivent être résistantes et solides."
 north_atlantic.0171.t:0 "$RICE_greenland_struggle_ending_integration_decision$ de l'Atlantique Nord"
 north_atlantic.0171.desc:0 "Le Groenland a longtemps été à la frontière de deux mondes séparés par le vaste océan. Certains se sont demandé si les colonies groenlandaises, fondées il y a si longtemps par d'intrépides pionniers venus d'Europe, pouvaient perdurer dans un climat aussi rude.\n\nCependant, sous la direction de [struggle_ender.GetTitledFirstName], la colonie du Groenland n'est plus un coin appauvri du monde, où l'on s'efforce à peine de survivre : elle est devenue un élément fort, adaptable et vigoureux de la civilisation de l'Atlantique Nord."
 north_atlantic.0171.desc.closing.cultural:0 "\n\n[struggle_ender.GetFirstNameNoTooltip] est déterminé à développer les liens culturels et diplomatiques entre les peuples qui habitent de part et d'autre de l'Atlantique. Serait-ce une nouvelle ère de coopération et de paix ?"
 north_atlantic.0171.desc.closing.economic:0 "\n\nLe Groenland a prospéré grâce au commerce, et en ce qui concerne [struggle_ender.GetFirstNameNoTooltip], il est essentiel de continuer à soutenir ces réseaux commerciaux, en particulier avec l'exportation d'ivoire de morse."
 north_atlantic.0171.desc.closing.community:0 "\n\nSelon [struggle_ender.GetFirstNameNoTooltip], la clé d'une prospérité durable réside dans le développement de colonies solides et résilientes à travers l'Atlantique Nord, capables de prospérer quel que soit le climat environnemental ou politique."
 north_atlantic.0171.desc.closing:0 "\n\nSeul l'avenir nous dira si l'approche [struggle_ender.GetFirstNamePossessiveNoTooltip] apportera davantage de prospérité au Groenland. Quoi qu'il en soit, la colonie groenlandaise est là pour rester."
 north_atlantic.0171.a:0 "Une nouvelle ère s'ouvre sur l'Atlantique Nord."
 north_atlantic.0172.t:0 "[struggle_ender.GetCulture.GetNameNoTooltip] Souveraineté"
 north_atlantic.0172.desc:0 "Cela fait longtemps que les peuples de l'est se sont installés au Groenland, avant d'entrer en contact avec nous, les [ROOT.Char.GetCulture.GetCollectiveNoun].\n\nCertains de ces peuples ont été plus pacifiques, désireux d'échanger des idées et des marchandises. D'autres... moins ; les hostiles et arrogants nous appellent, nous et les gens de notre côté de l'Atlantique, des \"skraelings\", entre autres noms peu flatteurs. Quoi qu'il en soit, nous aussi avons commencé à explorer et à nous installer en Europe.\n\nNous, les [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip], sommes devenus une puissance influente dans ces terres étranges à l'est, et servons désormais de lien principal entre les deux côtés de l'Atlantique, et non le Groenland. Nos ennemis nous craignent, tandis que nos amis nous respectent en tant que partenaires fiables en commerce et en politique.\n\nEn tant que plus influent des dirigeants [ROOT.Char.GetCulture.GetNameNoTooltip], il m'incombe de déterminer comment notre peuple doit affirmer sa souveraineté dans notre nouvelle patrie et étendre notre influence :"
 north_atlantic.0172.a:0 "Le faire pacifiquement par le biais de la culture et du commerce"
 north_atlantic.0172.b:0 "Utiliser les réseaux politiques directs et indirects"
 north_atlantic.0172.c:0 "La faire respecter en renforçant notre présence militaire"
 north_atlantic.0173.t:0 "$north_atlantic.0172.t$"
 north_atlantic.0173.desc:0 "Lorsque le Groenland fut colonisé pour la première fois, ses colons entrèrent inévitablement en contact avec les peuples autochtones du côté occidental de l'Atlantique. Ces peuples autochtones commencèrent finalement à explorer et à s'installer en Europe. Au fil du temps, ils gagnèrent en puissance et en influence, en particulier les [struggle_ender.GetCulture.GetCollectiveNoun].\n\nDésormais menés par le grand [struggle_ender.GetTitledFirstName], les [struggle_ender.GetCulture.GetCollectiveNounNoTooltip] sont craints par leurs ennemis et respectés et admirés par leurs amis. Dans leur nouvelle patrie, ils affirment leur souveraineté et remplacent le Groenland comme principal lien entre les deux côtés de l'Atlantique."
 north_atlantic.0173.desc.closing.social:0 "\n\n[struggle_ender.GetTitledFirstNameNoTooltip] est considéré[struggle_ender.Custom('FR_E')] comme un[struggle_ender.Custom('FR_E')] souverain[struggle_ender.Custom('FR_E')] sage, qui souhaite étendre l'influence [struggle_ender.GetCulture.GetNameNoTooltip] pacifiquement en développant des réseaux commerciaux et en s'engageant dans des échanges culturels avec ses voisins. Ils ne sont plus dénigrés comme des \"skraelings\", même par leurs ennemis ; au lieu de cela, beaucoup aiment les appeler les \"Orateurs du Couchant\", dont les talents en diplomatie et en commerce mènent l'Atlantique Nord vers un avenir plus radieux."
 north_atlantic.0173.desc.closing.political:0 "\n\n[struggle_ender.GetTitledFirstNameNoTooltip] est considéré[struggle_ender.Custom('FR_E')] comme un[struggle_ender.Custom('FR_E')] souverain[struggle_ender.Custom('FR_E')] avisé[struggle_ender.Custom('FR_E')], qui souhaite étendre l'influence [struggle_ender.GetCulture.GetNameNoTooltip] par des moyens politiques, trouvant des voies directes et indirectes pour se connecter aux dirigeants européens locaux et les contrôler. Les [struggle_ender.GetCulture.GetCollectiveNounNoTooltip] ne sont plus dénigrés comme des \"skraelings\", même par leurs ennemis ; à la place, beaucoup aiment les appeler les \"Seigneurs du Couchant\", reconnaissant leur autorité à travers l'Atlantique Nord."
 north_atlantic.0173.desc.closing.military:0 "\n\n[struggle_ender.GetTitledFirstNameNoTooltip] est considéré[struggle_ender.Custom('FR_E')] comme un[struggle_ender.Custom('FR_E')] souverain[struggle_ender.Custom('FR_E')] avisé[struggle_ender.Custom('FR_E')], qui souhaite étendre l'influence [struggle_ender.GetCulture.GetNameNoTooltip] en développant leur présence militaire. De braves guerriers de l'Atlantique ouest voyagent désormais avec enthousiasme vers l'Europe pour l'aventure, le pillage, ou pour servir comme mercenaires. Les [struggle_ender.GetCulture.GetCollectiveNounNoTooltip] ne sont plus dénigrés comme des \"skraelings\", même par leurs ennemis ; au contraire, beaucoup aiment les appeler les \"Guerriers du Couchant\", un signe de la maîtrise de ce peuple sur l'Atlantique Nord."
 north_atlantic.0173.a:0 "C'est sans aucun doute un nouveau jour dans l'Atlantique Nord."
 north_atlantic.0174.t:0 "Abandon du Groenland"
 north_atlantic.0174.desc:0 "Quand la colonie du Groenland fut établie il y a toutes ces années, qui aurait pu imaginer que son histoire se terminerait ainsi ? Les établissements groenlandais faisaient autrefois partie intégrante des réseaux commerciaux sillonnant l'Atlantique Nord.\n\nDésormais, la colonie n'est plus que l'ombre d'elle-même, en partie à cause de diverses pressions environnementales et socio-économiques. De nombreux Groenlandais partent en Europe pour de meilleures opportunités, et elle représente un gouffre financier pour quiconque y est encore impliqué.\n\nEn tant que l'un des dirigeants les plus influents de l'Atlantique Nord, j'ai décidé que nous devrions limiter nos pertes tant que nous le pouvons encore, et abandonner formellement la colonie. Les Groenlandais restants qui souhaitent partir peuvent être réinstallés sur nos terres, tandis que les quelques imprudents qui choisissent de rester peuvent être laissés à leur sort."
 north_atlantic.0174.a:0 "Il est temps de se concentrer sur d'autres choses dans notre pays."
 north_atlantic.0175.t:0 "$north_atlantic.0174.t$"
 north_atlantic.0175.desc:0 "Il fut un temps où le Groenland était renommé comme source de luxes exotiques tels que l'ivoire de morse. Ces jours sont révolus depuis longtemps.\n\nCes derniers temps, la colonie du Groenland a fait face à des défis environnementaux et socio-économiques insurmontables. De nombreux Groenlandais partaient en Europe pour de meilleures opportunités, et c'était un gouffre financier pour quiconque y était encore impliqué.\n\n[struggle_ender.GetTitledFirstName], un important dirigeant régional impliqué dans la colonie du Groenland, estime qu'il est inutile de retarder l'inévitable. [struggle_ender.GetSheHe|U] a pris des mesures pour abandonner formellement la colonie. La plupart des Groenlandais, qui approuvent cette décision, ont été volontairement réinstallés dans diverses communautés de l'Atlantique Nord.\n\nDésormais, sans aucun doute, tout ce qui reste des colonies groenlandaises autrefois florissantes est le son du vent lugubre, et le grondement doucement menaçant des vagues contre la glace."
 north_atlantic.0175.a:0 "$north_atlantic.0009.a$"
