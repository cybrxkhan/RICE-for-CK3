 north_atlantic.0270.t:0 "Premier évêque islandais"
 north_atlantic.0270.desc:0 "Il y a des années, je me suis rendu en Allemagne pour étudier [christian.GetName] auprès des moines et érudits savants de là-bas. Bien que ma patrie [GetTitleByKey('d_iceland').GetNameNoTier] soit désormais une terre fermement chrétienne, l'Église peine encore à s'y développer.\n\nPour remédier à cette situation, [aldabert.GetTitledFirstName] m'a nommé premier évêque de [GetTitleByKey('d_iceland').GetNameNoTierNoTooltip] il y a plusieurs années, en 1056, que ce soit en raison des aptitudes dont j'ai fait preuve durant mes études, ou grâce aux relations de ma famille. Quoi qu'il en soit, mon objectif en tant que premier évêque de [GetTitleByKey('d_iceland').GetNameNoTierNoTooltip] est désormais de veiller à ce que l'Église puisse prospérer dans cette terre lointaine.\n\nJ'ai de grands projets pour bâtir des sites religieux, éduquer une nouvelle génération de clercs, et faire tout ce qui est en mon pouvoir pour répandre la gloire de [ROOT.Char.GetFaith.HighGodName] à travers l'Atlantique Nord."
 north_atlantic.0270.a:0 "Que [ROOT.Char.GetFaith.HighGodNameAlternate] m'aide dans mon objectif."
 north_atlantic.0270.info:0 "$RICE_north_atlantic_skalholt_school_context_tooltip$"
 north_atlantic.0271.t:0 "$RICE_historical_aspiration_fulfilled_title$"
 north_atlantic.0271.desc:0 "Vraiment, même une terre reculée comme [GetTitleByKey('d_iceland').GetNameNoTier] peut être bénie par la présence de l'Église. Cela a pris de nombreuses années, mais grâce à nos efforts, je crois que l'île devient enfin un membre à part entière de la communauté [ROOT.Char.GetFaith.GetReligion.GetAdjective].\n\nD'après ce que je comprends, beaucoup ici s'accordent à dire que la confiance que [aldabert.GetTitledFirstNamePossessive] a placée en moi était bien méritée, et que j'ai réussi dans mon rôle de premier évêque de [GetTitleByKey('d_iceland').GetNameNoTierNoTooltip]. Nous avons désormais bien plus d'écoles et de lieux de culte, et avec la fondation de la première grande école de l'île, je peux reposer en paix en sachant que les générations futures continueront d'honorer et de louer [ROOT.Char.GetFaith.HighGodName], et d'apprendre tout ce qu'elles peuvent sur [ROOT.Char.GetFaith.HighGodHerHis|U] création et le monde."
 north_atlantic.0271.a:0 "Gloire à [ROOT.Char.GetFaith.HighGodName]!"
 north_atlantic.0272.t:0 "L'Écossais hongrois"
 north_atlantic.0272.desc:0 "Bien que mon mécène[aetheling.GetFullName] soit né en [GetGeographicalRegion('custom_hungary').GetName], [aetheling.GetSheHe] n'est pas né de parents [hungarian.GetName]. [aetheling.GetSheHe|U] est, bien entendu, le roi légitime d'[GetTitleByKey('k_england').GetNameNoTier] et fut élu comme tel plus tôt cette année après le décès de [edward.GetTitledFirstNameNicknamed].\n\nPourtant le chaos règne sur les îles Britanniques, alors que des prétendants au trône, de soi-disant rois, cherchent à prendre par la force ce qui revient de droit à [aetheling.GetFirstNamePossessiveNoTooltip]. J'ai accompagné [aetheling.GetHerHim] ainsi que sa sœur [margaret.GetFirstName] vers les terres voisines d'[GetTitleByKey('k_scotland').GetNameNoTier], mais en raison du climat politique actuel, il se peut que je doive trouver un emploi ailleurs. Cependant, j'admets que je trouve les [scots.GetCollectiveNoun] tout à fait charmants, et je me vois bien m'installer en [GetTitleByKey('k_scotland').GetNameNoTierNoTooltip]... mais d'un autre côté, peut-être devrais-je voyager pour trouver un emploi ailleurs."
 north_atlantic.0272.a:0 "Le peuple [scots.GetName] est merveilleux. Je vais rester ici un moment."
 north_atlantic.0272.b:0 "Je suis toujours un chevalier [hungarian.GetNameNoTooltip], et je devrais continuer à voyager."
 north_atlantic.0272.info:0 "#emphasis Contexte historique :#! Bartholomew Leslie était le supposé ancêtre hongrois du clan écossais Leslie, qui accompagna [aetheling.GetFullNameNoTooltip] et [margaret.GetFirstNameNoTooltip] en Écosse après la Conquête normande. Il serait arrivé là-bas en 1067, plutôt qu'en 1066 comme cela est représenté ici."
 north_atlantic.0273.t:0 "L'Occultiste Écossais"
 north_atlantic.0273.desc:0 "Bien que je sois jeune, j'ai déjà beaucoup appris des écoles ici, dans les îles Britanniques. J'ai cependant de plus grandes ambitions en matière d'érudition ; mes connaissances en mathématiques, en diverses langues, et surtout en astronomie me porteront loin, car je cherche à mieux comprendre le grand univers que [ROOT.Char.GetFaith.HighGodName] a créé.\n\nLes cieux sont parsemés d'innombrables étincelles, chacune un feu, et je connais bien ces étoiles. J'ai vu dans ces étoiles qu'il est peut-être temps pour moi de voyager loin d'ici, et d'en apprendre toujours plus sur ce monde. Peut-être, un jour, pourrai-je même devenir l'un des plus grands astrologues du monde.\n\n#weak \"Tout astrologue est digne de louange et d'honneur, car par une telle doctrine que l'astrologie, il connaît de nombreux secrets de [ROOT.Char.GetFaith.HighGodName], et des choses que peu connaissent.\"#!"
 north_atlantic.0273.a:0 "Il est temps d'accomplir ma destinée !"
 north_atlantic.0273.info:0 "#emphasis Contexte historique :#! Michael Scot, ou Michael Scotus, était un érudit, mathématicien et astrologue écossais médiéval. En tant qu'intellectuel polyglotte itinérant, il était très renommé de son vivant.\n\nPar exemple, Fibonacci dédia la seconde version de son célèbre livre de mathématiques, #italic Liber Abaci#!, à Scot ; à un moment donné, il se vit même offrir le rôle d'archevêque de Canterbury par le Pape en 1227. Le plus important mécène de Scot était Frédéric II, l'empereur du Saint-Empire romain germanique et roi de Sicile, qui l'a peut-être même utilisé comme diplomate dans ses échanges avec les entités politiques musulmanes, en raison de sa connaissance de l'arabe.\n\nEn fin de compte, la renommée de Scot, particulièrement en ce qui concerne sa connaissance de sujets occultes comme l'astrologie et l'alchimie, conduisit à l'émergence de nombreuses légendes sur ses prétendues capacités surnaturelles en tant que redoutable magicien. Il apparaît, par exemple, dans la #italic Divine Comédie#! de Dante Alighieri, dans le Huitième Cercle de l'Enfer, réservé aux sorciers, astrologues et faux prophètes."
