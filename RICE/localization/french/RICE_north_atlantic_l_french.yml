 north_atlantic.0090.t.thrall:0 "Un Thrall [thrall.GetCulture.GetNameNoTooltip] Talentueux"
 north_atlantic.0090.t.free:0 "Un colon [thrall.GetCulture.GetNameNoTooltip] talentueux"
 north_atlantic.0090.desc.thrall:0 "[thrall.GetFirstName] a récemment acquis une certaine reconnaissance à ma cour en tant que thrall compétent[thrall.Custom('FR_E')] et habile. [thrall.GetSheHe|U] est un[thrall.Custom('FR_E')] thrall qui a été capturé[thrall.Custom('FR_E')] lors d'un raid sur une colonie [thrall.GetCulture.GetName] et qui m'a été vendu[thrall.Custom('FR_E')] il y a quelque temps.\n\nPeut-être devrais-je lui accorder une position plus élevée et rehausser son statut. Si [thrall.GetSheHe] est à mes côtés, plutôt que de languir ailleurs à effectuer des tâches subalternes, je pourrais mieux exploiter ses talents."
 north_atlantic.0090.desc.free:0 "[thrall.GetFirstName] est un[thrall.Custom('FR_E')] autochtone qui a récemment acquis une certaine reconnaissance en tant qu'[thrall.GetWomanMan] capable et compétent[thrall.Custom('FR_E')]. [thrall.GetSheHe|U] n'est pas un[thrall.Custom('FR_E')] thrall (ou du moins ne l'est plus), mais plutôt un[thrall.Custom('FR_E')] libre originaire d'une lointaine colonie [thrall.GetCulture.GetName], qui s'est installé à [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier] il n'y a pas si longtemps.\n\nPeut-être devrais-je lui accorder une position plus importante et élever son statut. Si [thrall.GetSheHe] est à mes côtés, plutôt que de languir ailleurs, je pourrais mieux tirer parti de ses talents."
 north_atlantic.0090.a:0 "Oui, nous devrions utiliser les capacités [thrall.GetFirstNamePossessiveNoTooltip]."
 north_atlantic.0090.b:0 "Non, je n'ai aucun intérêt dans ce [thrall.GetFirstNameNoTooltip]."
 north_atlantic.0090.info:0 "\n#emphasis Contexte historique :#! Il existe des preuves génétiques, historiques et littéraires claires que les Islandais modernes possèdent une ascendance gaélique significative. Environ plus de 50 % des femmes et au moins 20 % des hommes impliqués dans la colonisation initiale de l'Islande étaient peut-être d'origine gaélique, et bien que beaucoup étaient probablement des esclaves ou des serviteurs, il n'est pas invraisemblable qu'une minorité importante d'entre eux soit venue en tant qu'hommes et femmes libres. Étant donné que les Norrois ont pillé et réduit en esclavage de nombreuses personnes à travers l'Europe, il est possible que des gens d'autres régions d'Europe aient fait partie de la colonisation initiale de l'Islande également.\n\nUn cas célèbre d'ascendance gaélique potentielle serait Leif Erikson, qui aurait pu descendre de loin de la noblesse irlandaise. Un autre cas célèbre est celui de Melkorka, une supposée princesse irlandaise qui fut prise comme concubine par un chef islandais. Son fils, Olaf le Paon, aurait voyagé en Irlande et se serait vu offrir le trône par son grand-père, avant de partir dans diverses aventures.\n\nBeaucoup de ces hommes et femmes gaéliques furent assimilés (probablement de force, dans de nombreux cas) dans la société norroise, et il est probable que les Islandais ultérieurs cachèrent leur ascendance gaélique, s'ils en avaient une, en raison de la honte de potentiellement descendre d'humbles esclaves. Néanmoins, ils ont peut-être influencé l'histoire et la culture islandaises de plus d'une manière. Par exemple, ils ont peut-être contribué à la présence précoce du christianisme en Islande. De plus, il existe des preuves que les Sagas, qui sont typiquement associées aux Vikings païens bien qu'elles aient été compilées par des Islandais chrétiens, ont peut-être emprunté des idées, des motifs et des intrigues à la mythologie et à la littérature irlandaises, même si aucun des personnages ou divinités n'est gaélique en soi."
 north_atlantic.0091.t.thrall:0 "Prendre un Thrall comme Consort"
 north_atlantic.0091.t.free:0 "Un Mariage entre Colons"
 north_atlantic.0091.desc.thrall:0 "[thrall.GetFirstName] est un[thrall.Custom('FR_E')] thrall qui a été capturé[thrall.Custom('FR_E')] lors d'un raid sur une colonie de [thrall.GetCulture.GetName] et vendu[thrall.Custom('FR_E')] à [courtier.GetTitledFirstName] il y a quelque temps."
 north_atlantic.0091.desc.free:0 "[thrall.GetFirstName] est un[thrall.Custom('FR_E')] libre originaire d'une lointaine colonie [thrall.GetCulture.GetName], qui s'est installé[thrall.Custom('FR_E')] à [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier] il n'y a pas si longtemps, et a fait la connaissance de [courtier.GetTitledFirstName]."
 north_atlantic.0091.desc.marriage:0 "\n\nJ'ai été informé[ROOT.Char.Custom('FR_E')] que [courtier.GetTitledFirstNameNoTooltip], pour une raison quelconque, a décidé de prendre [thrall.GetFirstNameNoTooltip] en épousailles.\n\n"
 north_atlantic.0091.desc.concubinage:0 "\n\nJ'ai été informé[ROOT.Char.Custom('FR_E')] que [courtier.GetTitledFirstNameNoTooltip], pour une raison quelconque, a décidé de prendre [thrall.GetFirstNameNoTooltip] comme sa concubine.\n\n"
 north_atlantic.0091.desc.conclusion.thrall:0 "Il y a de nombreux thralls venus de terres lointaines (en particulier des îles Britanniques), qui résident à [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier]. Quoi qu'il en soit, coucher avec son thrall n'est pas chose inouïe, et cela est donc prévisible. Après tout, bon nombre de colons ici descendent de telles unions."
 north_atlantic.0091.desc.conclusion.free:0 "Bien qu'il n'y ait pas beaucoup de gens venant de pays lointains ici, il y en a quand même un certain nombre qui résident à [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier]. Il n'est pas rare que les colons, malgré leurs différences culturelles et linguistiques, forment de telles unions, que ce soit pour des raisons économiques, pratiques ou de camaraderie. Après tout, un certain nombre de colons ici sont issus de telles unions."
 north_atlantic.0091.a:0 "J'espère que [thrall.GetFirstNameNoTooltip] est d'accord avec cela...."
 north_atlantic.0091.b:0 "J'espère que leur union sera couronnée de succès !"
 north_atlantic.0091.c:0 "Intéressant. Nous verrons ce qu'il en est."
 north_atlantic.0092.t:0 "Un étranger capturé"
 north_atlantic.0092.desc.intro:0 "Des aventuriers de [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier] ont fait parler d'eux. Alors qu'ils parcouraient les mers de l'Ouest, ils ont capturé un[native.Custom('FR_E')] indigène vivant dans l'une des terres qu'ils ont traversées. J'ai laissé ces aventuriers venir à ma cour pour me présenter cet étranger, nommé[native.Custom('FR_E')] [native.GetFirstName] .\n\n"
 north_atlantic.0092.desc.child:0 "Il s'avère que [native.GetFirstNameNoTooltip] est un enfant ! Il est clair que cet enfant à l'allure étrange est plutôt nerveux en notre présence."
 north_atlantic.0092.desc.adult:0 "[native.GetFirstNameNoTooltip] est un[native.Custom('FR_E')] [native.GetWomanMan] intéressant[native.Custom('FR_E')] et étrange. [native.GetSheHe|U] est manifestement aussi déconcerté[native.Custom('FR_E')] par nous que nous le sommes par [native.Custom('FR_LuiElle')]."
 north_atlantic.0092.desc.conclusion:0 "\n\nQuoi qu'il en soit, malgré la barrière de la langue, [native.GetFirstNameNoTooltip] parvient à communiquer un peu avec nous. Bien que beaucoup d'entre nous l'appellent un \"skraeling\", [native.GetSheHe] insiste sur le fait que son peuple s'appelle les [native.GetCulture.GetCollectiveNoun]. Quoi qu'il en soit, les aventuriers disent que je suis plus que bienvenu de garder [native.GetHerHim] à ma cour, si je le souhaite."
 north_atlantic.0092.a:0 "[native.GetSheHe|U] peut rester. Veillez à payer les arrangements."
 north_atlantic.0092.b:0 "Je n'ai aucun intérêt à garder [native.GetHerHim] avec moi à la cour."
 north_atlantic.0092.c:0 "C'est injuste pour [native.GetHerHim]. Aidez-[native.GetHerHim] à retourner dans sa patrie."
 north_atlantic.0093.t:0 "L'étranger"
 north_atlantic.0093.desc.vinland_colony:0 "Nos associés dans la lointaine colonie du Vinland rencontrent parfois des étrangers vivant dans les terres voisines."
 north_atlantic.0093.desc.vinland_outpost:0 "Les personnes qui vivent dans l'avant-poste de notre famille dans le lointain Vinland rencontrent parfois des étrangers qui vivent dans les terres voisines."
 north_atlantic.0093.desc.greenland:0 "Au fur et à mesure que la colonie groenlandaise se développe, les membres de ma famille rencontrent parfois des étrangers vivant dans les terres voisines."
 north_atlantic.0093.desc.conclusion:0 "Ainsi, interagir avec de tels étrangers n'est pas chose inouïe. L'un de ces étrangers, un[native.Custom('FR_E')] [native.GetWomanMan] nommé[native.Custom('FR_E')] [native.GetFirstName], a vécu près de notre peuple pendant un certain temps, et [native.GetSheHe] entretient de bonnes relations avec eux.\n\nFait intéressant, [native.GetFirstNameNoTooltip] a souhaité visiter ma cour après avoir entendu des histoires à mon sujet, et a réussi à obtenir un passage sur un navire se rendant dans nos terres. Aujourd'hui, [native.GetSheHe] est arrivé[native.Custom('FR_E')] en grande pompe.\n\nBien que beaucoup d'entre nous l'appellent [native.GetFirstNameNoTooltip] un[native.Custom('FR_E')] \"skraeling\", [native.GetSheHe] insiste sur le fait qu'[native.GetSheHe] vient du peuple [native.GetCulture.GetName]. Aussi fascinant[native.Custom('FR_E')] que nous [native.GetHerHim] trouvions, [native.GetSheHe] est clairement fasciné[native.Custom('FR_E')] par nous également. Peut-être pourrait-[native.GetSheHe] être convaincu[native.Custom('FR_E')] de rester...."
 north_atlantic.0093.a:0 "Je devrais essayer de convaincre [native.GetHerHim] de rester."
 north_atlantic.0093.a.success:0 "[native.GetFirstNameNoTooltip] est convaincu"
 north_atlantic.0093.a.failure:0 "[native.GetFirstNameNoTooltip] n'est pas convaincu"
 north_atlantic.0093.a.failure.tooltip:0 "[native.GetFirstNameNoTooltip] décline l'offre et rentre chez [native.Custom('FR_LuiElle')]."
 north_atlantic.0093.b:0 "[native.GetSheHe|U] est fascinant, mais je n'ai pas besoin de [native.GetHerHim] dans ma cour."
 north_atlantic.0093.c:0 "Un cadeau en or devrait [native.GetHerHim] convaincre de rester !"
 north_atlantic.0094.t:0 "Travailler en réseau avec le Groenland"
 north_atlantic.0094.desc:0 "La lointaine colonie du Groenland abrite une petite mais tenace communauté de personnes, établie pour la première fois lorsque [erik.GetFirstNameNicknamed] découvrit le Groenland il y a de nombreuses années. Certains de ces [greenlander.GetCulture.GetCollectiveNoun] voyagent régulièrement entre le Groenland et l'Europe, souvent pour des raisons liées au commerce de marchandises exotiques comme l'ivoire de morse.\n\nUn membre éminent de la communauté [greenlander.GetCulture.GetNameNoTooltip] du nom de [greenlander.GetFirstName] s'est récemment rendu à [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier] et souhaite s'y installer durablement, si je suis disposé à [greenlander.GetHerHim] accepter comme membre de ma cour. Ses connexions avec les réseaux commerciaux et politiques du Groenland pourraient s'avérer utiles...."
 north_atlantic.0094.a:0 "Bienvenue à ma cour, [greenlander.GetFirstNameNoTooltip]!"
 north_atlantic.0094.b:0 "Je n'ai pas besoin des services de [greenlander.GetFirstNamePossessiveNoTooltip]."
 north_atlantic.0095.t:0 "Etablir des liens avec le Vinland"
 north_atlantic.0095.desc:0 "Bien que la lointaine colonie du Vinland abrite un petit nombre de colons courageux et endurants qui poursuivent l'héritage du découvreur du Vinland, [leif.GetFirstNameNicknamed], certains de ces [vinlander.GetCulture.GetCollectiveNoun] voyagent régulièrement entre le Vinland, le Groenland et l'Europe pour diverses raisons.\n\nUn membre éminent de la communauté [vinlander.GetCulture.GetNameNoTooltip] du nom de [vinlander.GetFirstName] s'est récemment rendu à [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier] et souhaite s'y installer durablement, si je suis disposé à [vinlander.GetHerHim] accepter comme membre de ma cour. Ses connexions avec le Vinland pourraient s'avérer utiles...."
 north_atlantic.0095.a:0 "Bienvenue dans ma cour, [vinlander.GetFirstNameNoTooltip] !"
 north_atlantic.0095.b:0 "Je n'ai pas besoin des services de [vinlander.GetFirstNamePossessiveNoTooltip]."
