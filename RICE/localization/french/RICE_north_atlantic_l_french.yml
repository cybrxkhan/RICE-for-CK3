 north_atlantic.0161.t:0 "Découverte du Groenland"
 north_atlantic.0161.desc:0 "Il y a des aventuriers et des voyageurs ordinaires qui sont souvent oubliés après leur mort. Et puis il y a ceux dont la gloire et la renommée se perpétueront dans les légendes pour les siècles à venir. Aujourd'hui, il ne fait aucun doute que [leader.GetFirstName] est l'un de ces explorateurs légendaires."
 north_atlantic.0161.desc.leader_dead:0 "\n\nBien que [leader.GetFirstNameNoTooltip] soit décédé[leader.Custom('FR_E')] durant le voyage, son équipage s'est assuré de poursuivre leur périple en l'honneur de sa mémoire. Ils découvrirent une terre que [leader.GetFirstNameNoTooltip] avait nommée \" #Bold Groenland#! \", une manière astucieuse d'attirer des colons.\n\nBien que le Groenland soit une terre rude et isolée, c'est aussi une terre pleine d'opportunités. L'équipage de [leader.GetFirstNamePossessiveNoTooltip] a déjà fondé deux colonies dans les parties les plus arables du Groenland en mon nom, avec l'aide de colons [ROOT.Char.GetCulture.GetName] (qui s'identifient désormais comme [new_culture.GetCollectiveNoun]). L'équipage de [leader.GetFirstNamePossessiveNoTooltip] rapporte également la présence de nombreux morses dans les étendues septentrionales du Groenland. Si nous trouvons un bon moyen de les chasser systématiquement, nous pourrions réaliser de beaux profits en Europe, où la demande en ivoire est élevée."
 north_atlantic.0161.desc.leader_not_dead:0 "\n\n[leader.GetFirstNameNoTooltip] est revenu[leader.Custom('FR_E')] en triomphe, confirmant qu'il existe bien une vaste terre très loin à l'ouest, qu'[leader.GetSheHe] appelle "#Bold Groenland#!" [leader.GetSheHe|U] affirme que ce nom est un moyen astucieux d'attirer des colons.\n\nBien que le Groenland soit une terre rude et isolée, c'est aussi une terre pleine d'opportunités. [leader.GetFirstNameNoTooltip] a déjà fondé deux colonies dans les parties les plus arables du Groenland en mon nom, avec l'aide de colons [ROOT.Char.GetCulture.GetName] (qui s'identifient désormais comme [new_culture.GetCollectiveNoun]). [leader.GetFirstNameNoTooltip] rapporte également la présence de nombreux morses dans les régions septentrionales du Groenland. Si nous trouvons un bon moyen de les chasser systématiquement, nous pourrions réaliser de beaux profits en Europe, où la demande en ivoire est élevée."
 north_atlantic.0161.a:0 "C'est la naissance d'une nouvelle ère dans l'Atlantique Nord !"
 north_atlantic.0162.t:0 "Planifier la Grande Expédition"
 north_atlantic.0162.desc.greenland:0 "Un voyage de mille lieues commence par un seul pas - ou, dans ce cas, une seule décision. J'ai décidé de parrainer une grande expédition vers les mers occidentales, afin de vérifier s'il y a une part de vérité dans les récits selon lesquels une grande masse terrestre se trouverait là-bas, à l'ouest de l'Islande. La première chose que je dois faire est de choisir quelqu'un de capable et d'aventureux pour mener cette expédition."
 north_atlantic.0162.desc.americas:0 "Un voyage de mille lieues commence par un seul pas - ou, dans ce cas, une seule décision. J'ai décidé de parrainer une grande expédition vers les mers occidentales, afin de vérifier s'il y a une part de vérité dans les récits selon lesquels il existerait encore d'autres terres, au-delà du Groenland. La première chose que je dois faire est de choisir quelqu'un de capable et d'aventureux pour mener cette expédition."
 north_atlantic.0162.desc.some_courtiers:0 "\n\nCertains de mes courtisans ont exprimé leur intérêt pour mener cette expédition. J'apprécie certainement leur désir d'aventure !\n\nDe plus, un habitant du nom de [local.GetFirstName] a entendu parler de mes plans et m'a offert ses services. On m'a assuré que [local.GetSheHe] possède une certaine expérience de voyage à travers de nombreuses terres, donc [local.GetSheHe] pourrait également être une option pour diriger l'expédition."
 north_atlantic.0162.desc.no_courtiers:0 "\n\nMalheureusement, aucun de mes courtisans n'est disposé à accepter le rôle de chef de cette grande expédition. Je comprends leur hésitation, mais c'est décevant malgré tout.\n\nHeureusement, un habitant du nom de [local.GetFirstName] a entendu parler de mes projets et m'a offert ses services. Je suppose que je n'ai pas d'autre choix que de le nommer chef de cette expédition, mais on m'a assuré que [local.GetSheHe] a une certaine expérience des voyages à travers de nombreuses terres."
 north_atlantic.0162.a:0 "[candidate_1.GetFirstNameNoTooltip] devrait assumer cette responsabilité."
 north_atlantic.0162.b:0 "[candidate_2.GetFirstNameNoTooltip] est la bonne personne pour cette grande tâche."
 north_atlantic.0162.c:0 "[local.GetFirstNameNoTooltip] sera choisi pour diriger cette expédition."
