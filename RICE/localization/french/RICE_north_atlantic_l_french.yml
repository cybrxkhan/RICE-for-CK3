 north_atlantic.0120.t:0 "Chasse aux Morses : En route pour Nordsetur !"
 north_atlantic.0120.desc:0 "Chaque été, des hommes de la colonie du Groenland se rendent à Nordsetur, une région située le long de la côte occidentale du Groenland, loin au nord des agglomérations du Groenland, où les morses se rassemblent souvent. C'est à cette époque que la plupart des morses du Groenland sont chassés, ce qui constitue une source essentielle de la richesse du Groenland.\n\nLe domaine de ma famille au Groenland a fini de rassembler les hommes et les fournitures pour un voyage de ce type cette année. J'ai appris que l'équipage venait de mettre le cap sur Nordsetur. Espérons qu'ils reviendront avec de nombreuses défenses de morse !"
 north_atlantic.0120.a:0 "Je prie pour que [ROOT.Char.GetFaith.WaterGodName] protège ces hommes."
 north_atlantic.0120.a.tooltip:0 "Le voyage de chasse reviendra vers la fin du mois d'août - on ne peut qu'espérer qu'il sera couronné de succès, avec de nombreuses défenses de morses à la clé !"
 north_atlantic.0121.t:0 "Chasse aux Morses : Catastrophe !"
 north_atlantic.0121.desc:0 "Terrible nouvelle ! Le voyage de chasse que nous avons organisé à Nordsetur s'est terminé prématurément en raison de circonstances imprévues."
 north_atlantic.0121.desc.attack:0 "\n\nLe groupe de chasse a été attaqué par une bande de guerriers étranges. Selon les récits des survivants, ils ne pouvaient pas dire s'il s'agissait de locaux vivant à proximité, ou de gens venus de loin qui étaient également venus ici avec l'intention de chasser le morse.\n\nQuoi qu'il en soit, il y eut une certaine tension lorsque les deux groupes se rencontrèrent pour la première fois, et après quelques malentendus ou altercations, une bataille éclata. Malheureusement, mon groupe de chasse a perdu ; avec de nombreux morts, ils durent se replier vers les colonies du Groenland."
 north_atlantic.0121.desc.heavy_storm:0 "\n\nLes bateaux ont été pris dans une tempête et ont coulé. Il n'y a apparemment eu aucun survivant, car l'épave et un certain nombre de corps de mon groupe de chasseurs ont été découverts quelques jours plus tard par un autre groupe de chasseurs du Groenland. Ils ont alors rapporté cette tragédie à mon domaine."
 north_atlantic.0121.desc.mild_storm:0 "\n\nLes bateaux ont été pris dans une tempête et ont coulé. Une poignée de survivants (peut-être grâce à l'intervention et à la bienveillance de [ROOT.Char.GetFaith.HighGodName]) ont été retrouvés et secourus par un autre groupe de chasseurs du Groenland. Ces survivants sont ensuite revenus pour rapporter le triste sort de leurs compagnons et de leurs navires."
 north_atlantic.0121.desc.rescue_storm:0 "\n\nLes navires furent pris dans une tempête et ils sombrèrent. Certains membres de l'équipage survécurent, mais pensaient qu'ils succomberaient aux éléments jusqu'à ce qu'ils rencontrent un groupe de personnes aux vêtements inhabituels et à la langue étrange. Il était difficile de dire si ces étrangers étaient des habitants locaux vivant à proximité, ou des gens venus de terres lointaines qui étaient aussi venus à Nordsetur pour chasser le morse.\n\nMes hommes craignaient le pire, aussi furent-ils surpris quand ces étrangers, menés par un[native_leader.Custom('FR_E')] [native_leader.GetWomanMan] nommé[native_leader.Custom('FR_E')] [native_leader.GetFirstName], leur donnèrent de la nourriture et des provisions avant de se séparer. Ce fut suffisant pour les aider à rester en vie jusqu'à ce qu'un autre groupe de chasseurs du Groenland les trouve.\n\nBien que mes hommes furent sauvés par ces étrangers compatissants, j'ai tout de même perdu beaucoup d'autres bons hommes et navires."
 north_atlantic.0121.desc.kaboom:0 "\n\nQue ce soit par accident ou par manque d'expérience, l'équipage des navires semble s'être écrasé et avoir coulé les navires pendant le voyage. Heureusement, une bonne partie des hommes a survécu et ils ont pu récupérer une partie de leurs provisions.\n\nCependant, comme les navires étaient perdus en mer, mes hommes ont été contraints de s'abriter dans un poste de chasse voisin pendant plusieurs jours, jusqu'à ce qu'un autre groupe de chasseurs passe par là et les sauve. Les hommes que j'ai engagés ont bien sûr profondément honte de ce qui s'est passé, mais il n'y a rien que nous puissions faire pour l'instant."
 north_atlantic.0121.desc.supplies:0 "\n\nIl semble que les chefs du groupe de chasseurs aient mal évalué la quantité de nourriture nécessaire pour l'ensemble de l'opération. Les réserves diminuant, ils ont commencé à rationner la nourriture, jusqu'à ce qu'il n'en reste plus. Ils ont donc dû faire demi-tour et rentrer au Groenland."
 north_atlantic.0121.desc.deaths:0 "\n\nLa chasse se déroulait bien au début. Hélas, au cours de la chasse, trop d'hommes du groupe de chasseurs périrent, à cause d'une série de mésaventures dues à la malchance ou à l'inexpérience. Certains moururent sous les coups des morses violents, d'autres se noyèrent en naviguant autour des zones de chasse, et d'autres encore moururent d'épuisement ou de maladie.\n\nFinalement, l'équipage s'amenuisant, les chefs du groupe réalisèrent qu'il était inutile de continuer à chasser, et ils n'eurent d'autre choix que de retourner au Groenland les mains vides."
 north_atlantic.0121.desc.fled:0 "\n\nEn réalité, c'est un désastre pour moi, mais pas pour l'équipage. Il s'avère que bon nombre des hommes que nous avons engagés étaient en fait des criminels et n'avaient aucunement l'intention de se rendre à Nordsetur pour y chasser le morse. Ils ont pris l'argent et les provisions que nous leur avons fournis, avant de s'embarquer pour un autre endroit, probablement en Europe ou en Méditerranée, loin de ma portée.\n\nEn tout cas, il semble que je me sois fait avoir ! À l'heure qu'il est, ces fraudeurs peuvent se trouver n'importe où."
 north_atlantic.0121.a:0 "C'est très regrettable !"
 north_atlantic.0121.tooltip.hunt_ends:0 "La partie de chasse [nordsetur|E] que vous avez organisée se termine prématurément"
 north_atlantic.0121.tooltip.decrease_resilience:0 "La [greenland_resilience|E] [greenlands|E] diminue de #V [THIS.Char.MakeScope.Var('RICE_resilience_value_temp').GetValue]#! à @RICE_greenland_resilience_icon! #V [GetGlobalVariable('RICE_greenland_resilience').GetValue|0]#!"
 north_atlantic.0121.tooltip.decrease_networks:0 "Les [greenland_networks|E] [greenlands|E] diminuent de #V [THIS.Char.MakeScope.Var('RICE_networks_value_temp').GetValue]#! à @RICE_greenland_networks_icon! #V [GetGlobalVariable('RICE_greenland_networks').GetValue|0]#!"
 north_atlantic.0122.t:0 "Chasse au Morse : Retour"
 north_atlantic.0122.desc:0 "J'ai reçu un rapport du domaine de ma famille au Groenland : l'expédition de chasse que nous avons organisée vers le Nordsetur est revenue avec de l'ivoire de morse.\n\nLa grande question est de savoir si nous avons obtenu un retour raisonnable sur notre investissement dans cette entreprise. Quoi qu'il en soit, d'après les résultats de la chasse, les chasseurs que nous avons engagés ont collecté suffisamment de défenses de morse pour les vendre à divers marchands dans les marchés et ports de l'Atlantique Nord pour [gold_i|E] #V [ROOT.Char.MakeScope.Var('RICE_walrus_hunt_gold_gain_value').GetValue]#!"
 north_atlantic.0122.desc.extras:0 "\n\nEn outre, le rapport mentionne que quelque chose d'intéressant s'est produit au cours de la partie de chasse et que je devrais en être informé."
 north_atlantic.0122.desc.no_extras:0 "\n\nIl n'y eut aucun autre événement notable durant l'expédition de chasse, et les chasseurs ont désormais repris leur vie normale au Groenland."
 north_atlantic.0122.a:0 "Il est temps de tirer profit de cet ivoire !"
 north_atlantic.0122.a.extra:0 "Oh ? Que s'est-il passé d'autre pendant ce voyage ?"
 north_atlantic.0122.tooltip.hunt_ends:0 "La chasse au [nordsetur|E] que vous avez organisée prend fin"
 north_atlantic.0123.t:0 "Chasse au Morse : Préparatifs"
 north_atlantic.0123.desc:0 "Chaque année, des groupes de Groenlandais naviguent vers le Nordsetur, une région le long de la côte occidentale du Groenland, bien au nord des colonies groenlandaises, où les morses se rassemblent souvent. C'est à cette période que la plupart des morses du Groenland sont chassés, et c'est donc une source cruciale de la richesse du Groenland.\n\nCette année, j'ai ordonné à mon domaine au Groenland d'organiser une telle chasse au Nordsetur. Il leur faudra un certain temps pour ce faire, mais cela devrait être prêt d'ici l'été, lorsque la chasse commence et que les groupes de chasseurs partent des colonies groenlandaises vers le nord."
 north_atlantic.0123.a:0 "J'ai hâte de voir quels seront les résultats de cette chasse."
 north_atlantic.0123.a.tooltip:0 "Votre [greenland_estate_long|E] va maintenant organiser une partie de chasse vers [nordsetur|E], qui partira en juin."
 north_atlantic.0124.t:0 "Chasse aux Morses : Des étrangers bienveillants"
 north_atlantic.0124.desc:0 "Alors que mon groupe de chasse s'affairait à localiser et chasser des morses, il semble avoir rencontré un groupe d'étranges étrangers qui chassaient également là-bas et étaient menés par un certain [native_leader.GetFirstName]. Peut-être vivaient-ils à proximité, ou peut-être avaient-ils aussi voyagé jusqu'au Nordsetur depuis des terres lointaines.\n\nQuoi qu'il en soit, ces étrangers étaient plutôt amicaux, et [native_leader.GetFirstNameNoTooltip] a permis à ses chasseurs de faire un peu de commerce avec mes chasseurs.\n\nLes deux groupes ont passé quelques jours à proximité l'un de l'autre, s'adonnant à quelques échanges et ainsi de suite, avant que les étrangers ne repartent vers leurs foyers."
 north_atlantic.0124.a:0 "Il est intéressant de constater qu'ils ont rencontré des étrangers si sympathiques !"
 north_atlantic.0124.a.tooltip:0 "Les @RICE_greenland_networks_icon! [greenland_networks|E] [greenlands|E] augmentent de @RICE_greenland_networks_icon! #V 1#!"
 north_atlantic.0125.t:0 "Chasse au morse : Étrangers hostiles"
 north_atlantic.0125.desc:0 "Alors qu'ils s'affairaient à localiser et chasser des morses, mon groupe de chasseurs semble avoir rencontré un groupe d'étranges étrangers qui chassaient également là-bas et étaient menés par un certain [native_leader.GetFirstName]. Peut-être vivaient-ils à proximité, ou peut-être avaient-ils également voyagé jusqu'au Nordsetur depuis des terres lointaines.\n\nCes étrangers étaient soit d'une nature hostile et menaçante, soit ils ont mal compris les intentions de mes chasseurs, car les deux groupes en sont venus aux mains. La bataille fut heureusement brève, et les pertes furent minimes avant que les deux camps ne battent en retraite.\n\nCela a dû être éprouvant de rencontrer des étrangers hostiles dans une terre si désolée ! Bien que mon groupe de chasseurs ait perdu une partie de ses provisions, et que quelques-uns de mes chasseurs soient morts, je devrais être reconnaissant que cette rencontre malheureuse ne se soit pas davantage envenimée."
 north_atlantic.0125.a:0 "Espérons que nous ne reverrons plus jamais ces étrangers hostiles."
 north_atlantic.0125.a.tooltip:0 "Les @RICE_greenland_networks_icon! [greenland_networks|E] [greenlands|E] diminuent de @RICE_greenland_networks_icon! #V 1#!"
 north_atlantic.0126.t:0 "Chasse au morse : chasseurs morts"
 north_atlantic.0126.desc:0 "Au cours du voyage, mes chasseurs sont tombés sur quelque chose d'effroyable et d'inquiétant : les cadavres d'un autre groupe de chasseurs des colonies du Groenland.\n\nMes chasseurs ont examiné ces cadavres et ont déterminé que ces personnes devaient être mortes de froid et de manque de nourriture. De plus, ils semblent avoir péri peu de temps avant l'arrivée de mes chasseurs. Malheureusement, de telles rencontres ne sont pas rares dans les terres froides et désolées de Nordsetur.\n\nPourtant, je ne peux que me demander... si ces malheureux avaient survécu un peu plus longtemps, mes chasseurs auraient-ils pu les sauver ? Quoi qu'il en soit, mes chasseurs ont décidé de récupérer les outils, les armes et les provisions sur les cadavres, car les chasseurs morts n'en avaient manifestement pas besoin."
 north_atlantic.0126.a:0 "Que [ROOT.Char.GetFaith.HighGodName] guide leurs âmes dans l'au-delà."
 north_atlantic.0126.a.tooltip:0 "La @RICE_greenland_resilience_icon! [greenland_resilience|E] [greenlands|E] diminue de @RICE_greenland_resilience_icon! #V 1#!"
 north_atlantic.0127.t:0 "Chasse au morse : autres chasseurs"
 north_atlantic.0127.desc:0 "Durant mon voyage, mes chasseurs ont rencontré un autre groupe de chasse venant du Groenland. Cet autre groupe manquait de provisions et de nourriture, et nombre de ses membres étaient déjà morts.\n\nHeureusement, mon propre groupe avait suffisamment de provisions et de nourriture à partager, et a recueilli les survivants de l'autre groupe. Chasser au Nordsetur est une affaire dangereuse, et de tels incidents ne sont pas rares dans le terrain froid et désolé du Nordsetur.\n\nLe chef de l'autre groupe de chasse, [hunter.GetFirstName], est éternellement reconnaissant que mes chasseurs aient été là pour sauver sa vie. [hunter.GetSheHe|U] s'est même assuré de visiter mon domaine au Groenland après leur retour de la chasse, pour nous remercier formellement."
 north_atlantic.0127.a:0 "[hunter.GetFirstNameNoTooltip] semble compétent[hunter.Custom('FR_E')] - accepterait-[hunter.GetSheHe] de travailler pour moi ?"
 north_atlantic.0127.a.success:0 "[hunter.GetFirstNameNoTooltip] rejoint votre Cour"
 north_atlantic.0127.a.failure:0 "[hunter.GetFirstNameNoTooltip] ne rejoint pas votre cour"
 north_atlantic.0127.a.failure.tooltip:0 "Bien que reconnaissant pour l'offre, [hunter.GetFirstNameNoTooltip] n'a aucun intérêt à quitter le Groenland."
 north_atlantic.0127.b:0 "Quelle chance que mes chasseurs les aient trouvés !"
 north_atlantic.0128.t:0 "Chasse aux Morses : Défenses de narval"
 north_atlantic.0128.desc:0 "Alors que mes chasseurs traquaient des morses, ils sont tombés sur la carcasse d'un narval échouée sur la plage. C'était une trouvaille très chanceuse, car il est difficile d'attraper ces créatures en pleine mer.\n\nEn raison de leur rareté, beaucoup de gens ignorent la nature de ces créatures ; ce qui est certain, cependant, c'est que leurs défenses sont réputées posséder des propriétés magiques.\n\nLa défense de narval est maintenant en ma possession. Je pourrais peut-être garder cet objet spectaculaire pour moi ; d'un autre côté, je pourrais en tirer une belle somme en la vendant - surtout à des gens venus de loin qui paieraient cher pour acquérir un produit aussi exotique."
 north_atlantic.0128.a:0 "Je le garde pour moi."
 north_atlantic.0128.b:0 "Le vendre à un commerçant."
 north_atlantic.0129.t:0 "Chasse au morse : Ours polaire"
 north_atlantic.0129.desc:0 "Mes chasseurs ont chassé bien plus que du morse, semble-t-il ! Il s'avère qu'ils ont rencontré un ours polaire !\n\nTuer cette bête majestueuse et puissante ne fut pas chose aisée, mais mes chasseurs braves, audacieux et puissants ont réussi à l'abattre, gagnant pour eux-mêmes gloire et renommée dans les colonies du Groenland.\n\nLa peau de cet ours polaire est désormais en ma possession. D'un côté, je pourrais la garder pour moi. De l'autre, étant donné à quel point la fourrure d'ours polaire est prisée comme article de luxe en Europe et au-delà, je pourrais la vendre pour gagner quelque argent."
 north_atlantic.0129.a:0 "Je ne peux pas supporter de me séparer d'une si belle fourrure !"
 north_atlantic.0129.b:0 "Il est beau, mais je préférerais le vendre pour gagner de l'argent."
