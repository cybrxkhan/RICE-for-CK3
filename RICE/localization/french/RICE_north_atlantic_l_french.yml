 # Vinland Decisions
 RICE_north_atlantic_build_outpost_vinland:0 "Tentative de construction d'un avant-poste au Vinland"
 RICE_north_atlantic_build_outpost_vinland_desc:0 "Pour beaucoup, s'installer sur [vinland|E] n'est pas une perspective particulièrement prometteuse, étant donné qu'elle est éloignée et manque de ressources rentables. Quoi qu'il en soit, il faudra beaucoup d'efforts pour établir une présence permanente sur le [vinland|E], mais peut-être trouverai-je quelques colons prêts à relever le défi."
 RICE_north_atlantic_build_outpost_vinland_tooltip:1 "Bien que cela puisse être coûteux, je souhaite tout risquer pour établir un [vinland_outpost|E] à long terme dans le [vinland|E] !"
 RICE_north_atlantic_build_outpost_vinland_effect_tooltip_1:1 "En fonction de la [struggle_phase|E] actuelle de la [RICE_greenland_struggle|E], ainsi que de la @RICE_vinland_viability_icon! [vinland_viability|E] [vinlands|E], vous avez une chance estimée de #V [GetGlobalVariable('RICE_vinland_viability_chances').GetValue|0]%#! de réussir"
 RICE_north_atlantic_build_outpost_vinland_effect_tooltip_2:1 "Si les colons que vous envoyez au [vinland|E] réussissent, votre [dynasty|E] recevra le [modifier|E] [GetModifier('RICE_north_atlantic_vinland_outpost').GetNameWithTooltip], il y aura une légère augmentation ou diminution des bonus annuels de votre [greenland_estate_long|E] selon la [struggle_phase|E] de la [RICE_greenland_struggle|E], vous aurez accès à une [decision|E] pour $RICE_north_atlantic_support_vinland$, et les [greenland_expeditions|E] vers le [vinland|E] coûteront moins cher"
 RICE_north_atlantic_build_outpost_vinland_effect_tooltip_3:1 "Si l'expédition réussit, la @RICE_vinland_viability_icon! [vinland_viability|E] [vinlands|E] va #P augmenter#!, mais la @RICE_greenland_resilience_icon! [greenland_resilience|E] et les @RICE_greenland_networks_icon! [greenland_networks|E][greenlands|E] vont #N diminuer#! ; si cette tentative échoue, #italic toutes#! ces valeurs diminueront"
 RICE_north_atlantic_build_outpost_vinland_effect_tooltip_4:1 "@RICE_greenland_resilience_icon! [greenland_resilience|E] et @RICE_greenland_networks_icon! [greenland_networks|E] [greenlands|E]  #N diminueront #! chaque année pour chaque [vinland_outpost_long|E] actif."
 RICE_north_atlantic_build_outpost_vinland_effect_tooltip_5:1 "@warning_icon! #X La [RICE_greenland_struggle|E] n'a pas été résolue avec une #P bonne fin#!, donc même si vous réussissez à établir un [vinland_outpost|E] permanent, il y a une chance qu'il #N échoue#! chaque année, en fonction de la @RICE_vinland_viability_icon! [vinland_viability|E] [vinlands|E] !#!"
 RICE_north_atlantic_build_outpost_vinland_confirm:0 "J'aime les grands risques - faisons-le !"
 RICE_north_atlantic_build_outpost_vinland_context_tooltip:0 "#emphasis Contexte historique:#! Bien que nous ayons des preuves archéologiques d'une présence nordique à L'anse aux Meadows, à Terre-Neuve, il ne s'agissait pas d'une véritable colonie, mais plutôt d'une simple halte pour réparer les bateaux et les outils et se réapprovisionner. Contrairement à l'image de Leif Erikson et de ses semblables, présentés par la pop-histoire comme les équivalents des conquistadors vikings, il est probable que les Norvégiens ne voyaient pas l'intérêt de coloniser le Vinland : celui-ci était très éloigné, même du Groenland, et n'avait que peu de ressources utiles à offrir. Toute tentative de colonisation du Vinland aurait également épuisé les ressources limitées et la main-d'œuvre nécessaires aux colonies du Groenland, beaucoup plus lucratives."
 RICE_north_atlantic_support_vinland:0 "Soutenir le Vinland"
 RICE_north_atlantic_support_vinland_tooltip:0 "Il est temps de soutenir nos courageux frères et sœurs du lointain [vinland|E] !"
 RICE_north_atlantic_support_vinland_desc:0 "S'installer en [vinland|E] est une entreprise coûteuse, risquée, voire insensée. Actuellement, on y compte #V [GetGlobalVariable('RICE_north_atlantic_vinland_outposts').GetValue|0]#! [vinland_outposts|E]. Du [greenland_support|E] pour ces [vinland_outposts|E] ne serait pas de trop, mais [vinland|E] est si lointain et a peu de valeur pratique, donc ce serait un gaspillage de ressources mieux dépensées pour un [greenland|E] plus lucratif... n'est-ce pas ?"
 RICE_north_atlantic_support_vinland_effect_tooltip_1:0 "Il y a une chance que votre [greenland_support|E] n'atteigne pas le [vinland|E], surtout si la @RICE_greenland_resilience_icon! [greenland_resilience|E] [greenlands|E] est basse"
 RICE_north_atlantic_support_vinland_effect_tooltip_2:0 "Les différentes formes de [greenland_support|E] vous accordent des avantages comme du [prestige_i|E][prestige|E], de la [piety_i|E][piety|E], ou des [modifiers|E] bénéfiques, mais plus important encore, #P augmentent#! la @RICE_vinland_viability_icon! [vinland_viability|E] [vinlands|E] ; cependant, elles #N diminuent#! également la @RICE_greenland_resilience_icon! [greenland_resilience|E] et les @RICE_greenland_networks_icon! [greenland_networks|E] [greenlands|E]"
 RICE_north_atlantic_support_vinland_effect_tooltip_3:0 "Envoyer du [greenland_support|E] coûte plus cher car votre [house|E] ne possède pas de [greenland_estate_long|E]"
 RICE_north_atlantic_support_vinland_effect_tooltip_4:0 "Envoyer du [greenland_support|E] coûte plus cher si la @RICE_greenland_resilience_icon! [greenland_resilience|E] [greenlands|E] est basse, et si la [RICE_greenland_struggle|E] est actuellement dans les phases [struggle_phase_greenland_subsistence_simple|E] et [struggle_phase_greenland_marginalization|E]"
 RICE_north_atlantic_support_vinland_confirm:0 "Il s'agit d'une aide cruciale pour Vinland !"
 RICE_north_atlantic_support_vinland_context_tooltip:0 "$RICE_north_atlantic_build_outpost_vinland_context_tooltip$"
 RICE_north_atlantic_vinland_aid_type:0 "Choisir comment soutenir Vinland"
 RICE_north_atlantic_vinland_aid_type_gui:0 "Choisir comment soutenir [vinland|E]"
 RICE_north_atlantic_vinland_supplies_option:0 "#Bold #V Envoyer des vivres#!#!\n$RICE_north_atlantic_basic_supplies_option_desc$"
 RICE_north_atlantic_vinland_supplies_option_desc:0 "Une cargaison de nourriture, d'outils et d'autres fournitures"
 RICE_north_atlantic_vinland_supplies_option_tooltip:0 "#V #Bold Coût minimum : @gold_icon! [EmptyScope.ScriptValue('RICE_vinland_cost')|0]#!#!\n\n$EFFECT_LIST_BULLET$Vous obtenez [piety_i|E]50\n$EFFECT_LIST_BULLET$#P Augmente#! la @RICE_vinland_viability_icon! [vinland_viability|E] [vinlands|E] d'un montant aléatoire jusqu'à [vinland_viability_i|E] #V 2#!, en cas de succès\n$EFFECT_LIST_BULLET$#N Diminue#! la @RICE_greenland_resilience_icon! [greenland_resilience|E] et les @RICE_greenland_networks_icon! [greenland_networks|E] [greenlands|E] d'un montant aléatoire jusqu'à #V 10#! chacun, indépendamment du succès"
 RICE_north_atlantic_vinland_settlers_option:0 "#Bold #V Recruter des colons#!#!\n$RICE_north_atlantic_vinland_settlers_option_desc$"
 RICE_north_atlantic_vinland_settlers_option_desc:0 "Les personnes valides peuvent apporter leur contribution de diverses manières"
 RICE_north_atlantic_vinland_settlers_option_tooltip:0 "#V #Bold Coût minimum : @gold_icon! [EmptyScope.ScriptValue('RICE_vinland_cost')|0]#!#!\n\n$EFFECT_LIST_BULLET$Vous obtenez [prestige_i|E]50\n$EFFECT_LIST_BULLET$#P Augmente#! la @RICE_vinland_viability_icon! [vinland_viability|E] [vinlands|E] d'un montant aléatoire jusqu'à [vinland_viability_i|E] #V 2#!, en cas de succès\n$EFFECT_LIST_BULLET$#N Diminue#! la @RICE_greenland_resilience_icon! [greenland_resilience|E] et les @RICE_greenland_networks_icon! [greenland_networks|E] [greenlands|E] d'un montant aléatoire jusqu'à #V 10#! chacun, quel que soit le succès"
 RICE_north_atlantic_vinland_base_camps_option:0 "#Bold #V Construire des camps de base#!#!\n$RICE_north_atlantic_vinland_base_camps_option_desc$"
 RICE_north_atlantic_vinland_base_camps_option_desc:0 "Stations frontalières pour le commerce, l'exploration et les combats"
 RICE_north_atlantic_vinland_base_camps_option_tooltip:0 "#V #Bold Coût minimum : @gold_icon! [EmptyScope.ScriptValue('RICE_vinland_cost')|0]#!#!\n\n$EFFECT_LIST_BULLET$Vous obtenez [prestige_i|E]100\n$EFFECT_LIST_BULLET$#P Augmente#! la @RICE_vinland_viability_icon! [vinland_viability|E] [vinlands|E] d'un montant aléatoire jusqu'à [vinland_viability_i|E] #V 4#!, en cas de succès\n$EFFECT_LIST_BULLET$#N Diminue#! la @RICE_greenland_resilience_icon! [greenland_resilience|E] et les @RICE_greenland_networks_icon! [greenland_networks|E] [greenlands|E] d'un montant aléatoire jusqu'à #V 20#! chacun, quel que soit le succès"
 RICE_north_atlantic_vinland_temples_option:0 "#Bold #V Construire un lieu de culte#!#!\n$RICE_north_atlantic_vinland_temples_option_desc$"
 RICE_north_atlantic_vinland_temples_option_desc:0 "Un lieu de culte dans un pays lointain" 
 RICE_north_atlantic_vinland_temples_option_tooltip:0 "#V #Bold Coût minimum : @gold_icon! 50#!#!\n\n$EFFECT_LIST_BULLET$Vous obtenez  [piety_i|E]100\n$EFFECT_LIST_BULLET$#P Augmente#! la @RICE_vinland_viability_icon! [vinland_viability|E] [vinlands|E] d'un montant aléatoire jusqu'à [vinland_viability_i|E] #V 4#!, en cas de succès\n$EFFECT_LIST_BULLET$#N Diminue#! la @RICE_greenland_resilience_icon! [greenland_resilience|E] et les @RICE_greenland_networks_icon! [greenland_networks|E] [greenlands|E] d'un montant aléatoire jusqu'à #V 20#! chacun, indépendamment du succès"
 RICE_north_atlantic_attract_greenland_immigrants:0 "Attirer les immigrants du Groenland"
 RICE_north_atlantic_attract_greenland_immigrants_desc:0 "La rumeur dit que les [greenland_settlements|E] sont en déclin et que ceux qui y vivent souhaitent trouver de meilleures opportunités économiques ailleurs. Nous pourrions envoyer de l'aide [greenland|E], mais pourquoi ne pas inciter certains de ces Groenlandais à s'installer sur mes terres à la place ?"
 RICE_north_atlantic_attract_greenland_immigrants_tooltip:1 "Avec le [greenland|E] en déclin, nous pourrions peut-être inviter ceux qui y vivent à venir s'installer sur mes terres."
 RICE_north_atlantic_attract_greenland_immigrants_effect_tooltip_1:1 "Le [GetModifier('RICE_north_atlantic_immigration_from_greenland').GetNameWithTooltip] [county_modifier|E] est ajouté à chaque [county|E] que vous possédez pour #V 10#! ans"
 RICE_north_atlantic_attract_greenland_immigrants_effect_tooltip_2:1 "Il y a une petite chance qu'un [courtier|E] de [culture|E] [greenlandic.GetName] apparaisse dans votre [court|E] ; plus la @RICE_greenland_resilience_icon! [greenland_resilience|E] [greenlands|E] est basse, plus cela a de chances de se produire"
 RICE_north_atlantic_attract_greenland_immigrants_effect_tooltip_3:1 "Parce que la [RICE_greenland_struggle|E] est dans la [struggle_phase_greenland_subsistence|E], la @RICE_greenland_resilience_icon! [greenland_resilience|E] et les @RICE_greenland_networks_icon! [greenland_networks|E] [greenlands|E] vont #N diminuer#! d'un montant aléatoire jusqu'à #V 10#! chacun"
 RICE_north_atlantic_attract_greenland_immigrants_effect_tooltip_4:1 "Parce que la [RICE_greenland_struggle|E] est dans la [struggle_phase_greenland_marginalization|E], la @RICE_greenland_resilience_icon! [greenland_resilience|E] et les @RICE_greenland_networks_icon! [greenland_networks|E] [greenlands|E] vont #N diminuer#! d'un montant aléatoire jusqu'à #V 20#! chacun"
 RICE_north_atlantic_attract_greenland_immigrants_confirm:0 "Trouvez des personnes prêtes à s'installer ici !"
 RICE_north_atlantic_attract_greenland_immigrants_context_tooltip:0 "#emphasis Contexte historique :#! Certaines théories académiques sur le déclin du Groenland nordique postulent que les Groenlandais nordiques quittèrent progressivement les colonies pour chercher de meilleures opportunités économiques en Europe, que ce soit en raison d'une demande accrue de main-d'œuvre en Scandinavie causée par la dépopulation suivant la Peste Noire, d'un déclin du commerce de l'ivoire de morse réduisant la qualité de vie au Groenland, ou d'autre chose. Même si cette théorie est valide, cependant, elle ne constituerait peut-être qu'une pièce du puzzle concernant le déclin du Groenland nordique."

 # Misc Decisions
 RICE_north_atlantic_whale_hunt:0 "Parrainer une Chasse à la Baleine"
 RICE_north_atlantic_whale_hunt_desc:0 "Nous [ROOT.Char.GetCulture.GetCollectiveNoun] chassons la baleine depuis des générations. La carcasse d'une baleine est source de nombreux profits grâce à sa viande et à son lard, qui peut être transformé en une huile précieuse. J'aimerais donc financer une chasse à la baleine à mon nom."
 RICE_north_atlantic_whale_hunt_tooltip:1 ""Il n'y a pas de folie de la bête de la terre qui ne soit infiniment dépassée par la folie de l'homme.""
 RICE_north_atlantic_whale_hunt_effect_tooltip_1:1 "Vous avez #V [GetPlayer.MakeScope.ScriptValue('RICE_north_atlantic_whaling_success_chance')|0]%#! de chances de succès, ce qui est influencé par vos [traits|E] et [skills|E], en particulier l'[stewardship|E], mais aussi la [martial|E] et l'[learning|E]"
 RICE_north_atlantic_whale_hunt_effect_tooltip_2:1 "Si vous réussissez, vous gagnerez du [prestige|E] et un montant aléatoire d'[gold|E] entre #V [gold_i|E] 1#! jusqu'à un #bold maximum#! de #V [gold_i|E] [GetPlayer.MakeScope.ScriptValue('RICE_north_atlantic_whaling_max_gold_display_value')|0]#!"
 RICE_north_atlantic_whale_hunt_effect_tooltip_3:1 "Parce que la [culture|E] [THIS.Char.GetCulture.GetName] possède la [tradition|E] $tradition_RICE_master_whalers_name$, vos chances de réussir la chasse sont augmentées de #P 15%#!"
 RICE_north_atlantic_whale_hunt_confirm:0 "Lancez la recherche de baleiniers chevronnés !"
 RICE_north_atlantic_whale_hunt_context_tooltip:0 "#emphasis Contexte historique :#! La chasse à la baleine a été pratiquée par de nombreuses cultures à travers le monde depuis la préhistoire. À partir de la période médiévale, les Basques furent l'une des premières sociétés à pratiquer la chasse à la baleine commerciale à grande échelle et étaient considérés comme les meilleurs baleiniers du monde au début de l'ère moderne. Les souverains médiévaux interagissaient avec l'industrie baleinière de différentes manières, comme en accordant des privilèges aux villes baleinières ou en leur imposant des taxes supplémentaires, et cela était particulièrement vrai pour les baleiniers basques."
 RICE_north_atlantic_whale_neither_tax:0 "Aucun [county|E] dans votre [realm|E] a"
 RICE_north_atlantic_whale_exempt_tax:0 "Exonérer les villes de pêche à la baleine de l'impôt"
 RICE_north_atlantic_whale_exempt_tax_desc:0 "Comme nous [ROOT.Char.GetCulture.GetCollectiveNoun] sommes des experts de la chasse à la baleine, je devrais encourager cette industrie pour aider mon royaume à prospérer. Une façon de le faire serait d'exempter les villes fortement impliquées dans la chasse à la baleine de payer des impôts."
 RICE_north_atlantic_whale_exempt_tax_not_basque_desc:0 "Plusieurs villes côtières de mon royaume sont réputées pour la chasse à la baleine. Je devrais encourager cette industrie pour aider mon royaume à prospérer, et un moyen d'y parvenir serait d'exempter d'impôts les villes fortement impliquées dans la chasse à la baleine."
 RICE_north_atlantic_whale_exempt_tax_tooltip:1 "$RICE_north_atlantic_whale_hunt_tooltip$"
 RICE_north_atlantic_whale_exempt_tax_confirm:0 "Il est temps de réduire les impôts !"
 RICE_north_atlantic_whale_exempt_tax_context_tooltip:0 "$RICE_north_atlantic_whale_hunt_context_tooltip$"
 RICE_north_atlantic_whale_levy_extra_tax:0 "Prélèvement d'impôts supplémentaires sur les villes baleinières"
 RICE_north_atlantic_whale_levy_extra_tax_desc:0 "Nous, [ROOT.Char.GetCulture.GetCollectiveNoun], sommes renommés pour notre habileté dans la chasse à la baleine. La chasse à la baleine est une activité #italic très#! profitable, alors les villes baleinières de mon royaume sont sûrement assez riches pour me payer davantage en impôts !"
 RICE_north_atlantic_whale_levy_extra_tax_not_basque_desc:0 "Plusieurs villes côtières de mon royaume sont renommées pour la chasse à la baleine. La chasse à la baleine est une activité #italic très#! profitable, alors ces villes baleinières sont sûrement assez riches pour me payer davantage d'impôts !"
 RICE_north_atlantic_whale_levy_extra_tax_tooltip:1 "$RICE_north_atlantic_whale_hunt_tooltip$"
 RICE_north_atlantic_whale_levy_extra_tax_confirm:0 "Ils devraient payer plus d'impôts - à moi !"
 RICE_north_atlantic_whale_levy_extra_tax_context_tooltip:0 "$RICE_north_atlantic_whale_hunt_context_tooltip$"
 RICE_north_atlantic_walrus_ivory_workshop_scandinavia:0 "Établir un centre de sculpture nordique en ivoire"
 RICE_north_atlantic_walrus_ivory_workshop_scandinavia_desc:0 "Les [greenland_settlements|E] expédient chaque année de grandes quantités d'ivoire de morse vers les ports européens. Nous pourrions tirer un grand profit de ce commerce si nous devenions le principal exportateur d'ivoire sculpté dans les [GetGeographicalRegion('RICE_greenland_struggle_region').GetName]."
 RICE_north_atlantic_walrus_ivory_workshop_scandinavia_tooltip:1 "Établir un important atelier de sculpture sur ivoire en Scandinavie"
 RICE_north_atlantic_walrus_ivory_workshop_scandinavia_effect_tooltip_1:1 "Le [county_modifier|E] sera supprimé si le [RICE_greenland_struggle|E] passe en [struggle_phase_greenland_marginalization|E] (réactivant ainsi cette [decision|E])."
 RICE_north_atlantic_walrus_ivory_workshop_scandinavia_effect_tooltip_2:1 "Cette [decision|E] est moins chère si votre [house|E] a une [greenland_estate_long|E]"
 RICE_north_atlantic_walrus_ivory_workshop_scandinavia_confirm:0 "L'ivoire de morse doit couler à flots, c'est-à-dire vers nous !"
 RICE_north_atlantic_walrus_ivory_workshop_scandinavia_context_tooltip:0 "#emphasis Contexte Historique:#! Le Groenland a fourni la majorité de l'ivoire utilisé en Europe entre le XIe et le XIVe siècle, et les deux principaux centres de sculpture de cet ivoire, fabriqué à partir de morse, étaient les ateliers de Trondheim, en Norvège, et de Cologne, en Allemagne. Auparavant, les historiens pensaient que l'ivoire du Groenland était considéré comme une alternative bon marché à l'ivoire d'éléphant, mais des recherches plus récentes suggèrent qu'il était apprécié en tant que tel et exporté probablement jusqu'au monde islamique et à l'Asie, par exemple."
 RICE_north_atlantic_walrus_ivory_workshop_europe:0 "Etablir le Centre Européen de Sculpture sur Ivoire"
 RICE_north_atlantic_walrus_ivory_workshop_europe_desc:0 "D'importantes quantités d'ivoire de morse arrivent de [greenland|E] chaque année. Bien que nous ne soyons pas directement [struggle_involved|E] dans la [RICE_greenland_struggle|E], nous pouvons toujours profiter généreusement de ce marché si nous devenons les principaux exportateurs d'ivoire sculptée en dehors des [GetGeographicalRegion('RICE_greenland_struggle_region').GetName]."
 RICE_north_atlantic_walrus_ivory_workshop_europe_tooltip:1 "Établir un important atelier de sculpture sur ivoire en Scandinavie"
 RICE_north_atlantic_walrus_ivory_workshop_europe_effect_tooltip_1:1 "$RICE_north_atlantic_walrus_ivory_workshop_scandinavia_effect_tooltip_1$"
 RICE_north_atlantic_walrus_ivory_workshop_europe_confirm:0 "$RICE_north_atlantic_walrus_ivory_workshop_scandinavia_confirm$"
 RICE_north_atlantic_walrus_ivory_workshop_europe_context_tooltip:0 "$RICE_north_atlantic_walrus_ivory_workshop_scandinavia_context_tooltip$"
 RICE_north_atlantic_incorporate_inuit_ideas:0 "Intégrer les idées inuites"
 RICE_north_atlantic_incorporate_inuit_ideas_desc:0 "Bien que certains méprisent les étrangers qui vivent dans le nord du [greenland|E] en les qualifiant de \"skraelings\", moi et ceux associés à mon [greenland_estate_long|E] avons eu des interactions fructueuses, voire amicales avec eux. Ils semblent prospérer au [greenland|E] malgré les conditions difficiles - nos nouveaux amis seraient-ils disposés à nous transmettre quelques connaissances utiles sur leur mode de vie ?"
 RICE_north_atlantic_incorporate_inuit_ideas_tooltip:1 "Peut-être pouvons-nous enrichir la [greenland_colony|E] avec de nouvelles idées et [innovations|E] des Inuits du [greenland|E]"
 RICE_north_atlantic_incorporate_inuit_ideas_effect_tooltip_1:1 "La $tradition_RICE_arctic_adaptations_name$ [tradition|E] est débloquée pour les [cultures|E] présentes dans la région des [GetGeographicalRegion('RICE_greenland_struggle_region').GetName]"
 RICE_north_atlantic_incorporate_inuit_ideas_effect_tooltip_2:1 "La @RICE_greenland_resilience_icon! [greenland_resilience|E] et les @RICE_greenland_networks_icon! [greenland_networks|E] [greenlands|E] augmente de #V 200#! et #V 100#! respectivement"
 RICE_north_atlantic_incorporate_inuit_ideas_confirm:0 "Nous devrions apprendre les uns des autres !"
 RICE_north_atlantic_incorporate_inuit_ideas_context_tooltip:0 "#emphasis Contexte historique :#! Contrairement à certains récits d'histoire populaire qui dépeignent les Norrois du Groenland comme incapables de faire face au changement climatique des années 1200 et 1300, les Norrois se sont #italic bel et bien#! adaptés au fil des années, par exemple en adoptant un régime alimentaire principalement marin. Cependant, ils n'ont pas adopté les technologies que les Inuits utilisaient pour prospérer dans l'Arctique, que ce soit par désintérêt, méfiance, manque de connaissance ou pour d'autres raisons. Il est difficile de dire si ces innovations auraient pu changer le destin final de la colonie du Groenland, mais elles auraient pu aider considérablement les colonies norrois."
 RICE_north_atlantic_incorporate_inuit_ideas_greenlandic_effect:0 "[greenlandic.GetName] [culture|E] obtient la $tradition_RICE_arctic_adaptations_name$ [tradition|E], ainsi que les [innovations|E] #italic $innovation_RICE_dog_sleds$#!, #italic $innovation_RICE_toggling_harpoons$#! et #italic $innovation_RICE_arctic_boats$#! (qui atténuent les effets négatifs d'une faible @RICE_greenland_resilience_icon! [greenland_resilience|E] et @RICE_greenland_networks_icon! [greenland_networks|E]), et gagne #P 25%#! d'[cultural_acceptance|E] avec les [inuit.GetName] (#warning @warning_icon! Si la [culture|E] [greenlandic.GetName] est à sa limite de [tradition|E], cette [decision|E] pourrait retirer une [tradition|E].#!)"
 RICE_north_atlantic_incorporate_inuit_ideas_your_culture_effect:0 "Les [cultures|E] [greenlandic.GetName] et [adopter.GetCulture.GetName] obtiennent la [tradition|E] $tradition_RICE_arctic_adaptations_name$, ainsi que les [innovations|E] #italic $innovation_RICE_dog_sleds$#!, #italic $innovation_RICE_toggling_harpoons$#! et #italic $innovation_RICE_arctic_boats$#! (qui atténuent les effets négatifs d'une faible @RICE_greenland_resilience_icon! [greenland_resilience|E] et de faibles @RICE_greenland_networks_icon! [greenland_networks|E]), et les deux [cultures|E] gagnent #P 25%#! d'[cultural_acceptance|E] avec les [inuit.GetName] (#warning @warning_icon! Si les [cultures|E] [greenlandic.GetName] ou [adopter.GetCulture.GetName] sont à leur limite de [tradition|E], une [tradition|E] pourrait être retirée.#!)"
 RICE_north_atlantic_recruit_native_american_warriors:0 "Recruter [ROOT.Char.GetCulture.GetNameNoTooltip] des guerriers"
 RICE_north_atlantic_recruit_native_american_warriors_desc:0 "Alors que nous nous installons sur les rives orientales de l'Atlantique Nord, nous avons besoin de guerriers plus courageux et plus rusés pour protéger nos nouveaux foyers. Contactons nos patries pour voir si des guerriers de [ROOT.Char.GetCulture.GetName] sont prêts à venir ici."
 RICE_north_atlantic_recruit_native_american_warriors_tooltip:1 "Recruter des guerriers dans nos pays d'outre-Atlantique"
 RICE_north_atlantic_recruit_native_american_warriors_confirm:0 "Tous les guerriers nous seront d'une grande aide !"
 RICE_north_atlantic_recruit_native_american_warriors_context_tooltip:0 "#emphasis Contexte historique :#! Selon les premières sources européennes, les batailles en rase campagne étaient très ritualisées chez les Amérindiens du Nord-Est. Cependant, ces sources ont probablement négligé le rôle que jouaient les raids, les embuscades et la guérilla dans cette région. De grandes confédérations telles que les Haudenosaunee (c'est-à-dire les Iroqouis) ont peut-être été formées en partie pour limiter les ravages d'une guerre constante et endémique."
 RICE_north_atlantic_learn_dog_sleds:0 "Maîtriser l'utilisation des traîneaux à chiens"
 RICE_north_atlantic_learn_dog_sleds_desc:0 "Les [greenland_settlements|E] tissent des liens plus étroits avec les étrangers qui vivent dans le nord du [greenland|E] et du [helluland|E], et apprennent leurs modes de vie. Les #bold traîneaux à chiens#!, par exemple, fournissent à ces étrangers un moyen de transport fiable et les aident à chasser. Pourrions-nous faire usage d'une telle technologie ?"
 RICE_north_atlantic_learn_dog_sleds_tooltip:1 "Les traîneaux à chiens peuvent aider les [greenland_settlements|E] à se déplacer et à chasser."
 RICE_north_atlantic_learn_dog_sleds_effect_tooltip_1:1 "La [culture|E] [greenlandic.GetName] débloque l'#V $innovation_RICE_dog_sleds$#! [innovation|E], qui atténue les effets négatifs d'une faible @RICE_greenland_resilience_icon! [greenland_resilience|E] et @RICE_greenland_networks_icon! [greenland_networks|E], et réduit les coûts des [greenland_expeditions|E]"
 RICE_north_atlantic_learn_dog_sleds_effect_tooltip_2:1 "Les [greenlandic.GetName] et la [culture|E] [adopter.GetCulture.GetName] débloquent l'[innovation|E] #V $innovation_RICE_dog_sleds$#!, qui atténue les effets négatifs d'une faible @RICE_greenland_resilience_icon! [greenland_resilience|E] et @RICE_greenland_networks_icon! [greenland_networks|E], et réduit les coûts des [greenland_expeditions|E]"
 RICE_north_atlantic_learn_dog_sleds_confirm:0 "Ce n'est pas pour rien que les chiens sont les meilleurs amis de l'homme !"
 RICE_north_atlantic_learn_dog_sleds_context_tooltip:0 "#emphasis Contexte historique :#! Dans le Grand Nord, les chiens ont été élevés pour tirer des traîneaux pendant des milliers d'années, et de nombreuses cultures de ces régions les utilisaient abondamment pour les déplacements et la chasse. Les ancêtres des Inuits, la culture Thulé, étaient capables de chercher de la nourriture, de chasser et de voyager sur de grandes distances grâce à leur utilisation intensive des traîneaux à chiens."
 RICE_north_atlantic_learn_toggling_harpoons:0 "Maîtriser l'utilisation des harpons à bascule"
 RICE_north_atlantic_learn_toggling_harpoons_desc:0 "Les [greenland_settlements|E] tissent des liens plus étroits avec les étrangers qui vivent dans le nord du [greenland|E] et du [helluland|E], et apprennent leurs modes de vie. Par exemple, il semble que ces peuples utilisent des #bold harpons à bascule#! pour chasser plus efficacement les baleines, les phoques et d'autres animaux. Pourrions-nous faire usage d'une telle technologie ?"
 RICE_north_atlantic_learn_toggling_harpoons_tooltip:1 "Le changement de harpon peut aider les [greenland_settlements|E] lors des chasses et des batailles."
 RICE_north_atlantic_learn_toggling_harpoons_effect_tooltip_1:1 "La [culture|E] [greenlandic.GetName] débloque l'#V $innovation_RICE_toggling_harpoons$#! [innovation|E], qui atténue les effets négatifs d'une faible @RICE_greenland_resilience_icon! [greenland_resilience|E] et @RICE_greenland_networks_icon! [greenland_networks|E], et augmente les chances de succès lors de la prise de la [decision|E] de $RICE_north_atlantic_whale_hunt$"
 RICE_north_atlantic_learn_toggling_harpoons_effect_tooltip_2:1 "Les [greenlandic.GetName] et la [culture|E] [adopter.GetCulture.GetName] débloquent l'[innovation|E] #V $innovation_RICE_toggling_harpoons$#!, qui atténue les effets négatifs d'une faible @RICE_greenland_resilience_icon! [greenland_resilience|E] et @RICE_greenland_networks_icon! [greenland_networks|E], et augmente les chances de succès lors de la prise de [decision|E] de $RICE_north_atlantic_whale_hunt$"
 RICE_north_atlantic_learn_toggling_harpoons_confirm:0 "Cela nous facilitera la chasse !"
 RICE_north_atlantic_learn_toggling_harpoons_context_tooltip:0 "#emphasis Contexte historique :#! Les Inuits, ainsi que divers peuples des Amériques et de l'Arctique, utilisent des harpons à tête basculante pour la chasse. Contrairement aux harpons normaux, qui ont une seule pointe, les harpons à tête basculante en ont deux. Une pointe est attachée à la base de propulsion, et l'autre, détachable, est emboîtée sur la première comme un capuchon. Cela permet au harpon de se ficher plus facilement dans la proie."
 RICE_north_atlantic_learn_arctic_boats:0 "Maîtriser l'utilisation des bateaux arctiques"
 RICE_north_atlantic_learn_arctic_boats_desc:0 "Les [greenland_settlements|E] tissent des liens plus étroits avec les étrangers qui vivent dans le nord du [greenland|E] et du [helluland|E], et apprennent leurs modes de vie. Bien que nos navires fonctionnent bien, ces peuples, par exemple, utilisent différents types de #bold bateaux arctiques#! mieux adaptés à l'environnement froid dans certaines situations. Pourrions-nous tirer parti d'une telle technologie ?"
 RICE_north_atlantic_learn_arctic_boats_tooltip:1 "Les bateaux arctiques peuvent aider les [greenland_settlements|E] à se déplacer dans des conditions environnementales moins favorables."
 RICE_north_atlantic_learn_arctic_boats_effect_tooltip_1:1 "La [culture|E] [greenlandic.GetName] débloque l'[innovation|E] #V $innovation_RICE_arctic_boats$#!, qui atténue les effets négatifs d'une faible @RICE_greenland_resilience_icon! [greenland_resilience|E] et @RICE_greenland_networks_icon! [greenland_networks|E], et réduit les coûts de la [decision|E] $RICE_north_atlantic_whale_hunt$"
 RICE_north_atlantic_learn_arctic_boats_effect_tooltip_2:1 "[greenlandic.GetName] et la [culture|E] [adopter.GetCulture.GetName] débloquent l'[innovation|E] #V $innovation_RICE_arctic_boats$#!, qui atténue les effets négatifs d'une faible @RICE_greenland_resilience_icon! [greenland_resilience|E] et @RICE_greenland_networks_icon! [greenland_networks|E], et réduit les coûts de la [decision|E] $RICE_north_atlantic_whale_hunt$"
 RICE_north_atlantic_learn_arctic_boats_confirm:0 "Ramez, ramez, ramez sur votre bateau !"
 RICE_north_atlantic_learn_arctic_boats_context_tooltip:0 "#emphasis Contexte historique :#! Les peuples de l'Arctique, tels que les Inuits, utilisaient quelques variétés de bateaux ouverts en peau pour les déplacements sur l'eau. Les grands #italic umiaks#! se révélaient utiles pour transporter personnes et biens sur de longues distances, tandis que les plus petits #italic kayaks#! étaient généralement utilisés pour la chasse et les déplacements plus rapides."
 RICE_north_atlantic_make_culture_involved_in_greenland:0 "Répandre [ROOT.Char.GetCulture.GetNameNoTooltip] l'influence du Groenland"
 RICE_north_atlantic_make_culture_involved_in_greenland_desc:0 "Bien que les communautés [ROOT.Char.GetCulture.GetName] dans la [region|E] des [GetGeographicalRegion('RICE_greenland_struggle_region').GetName] aient certains liens économiques avec les [greenland_settlements|E], nous autres [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip] n'avons pas une présence majeure là-bas. Si nous voulons bénéficier du commerce de morse, nous devons être plus [struggle_involved|E] dans la [RICE_greenland_struggle|E]."
 RICE_north_atlantic_make_culture_involved_in_greenland_tooltip:1 "Notre [culture|E] devrait être [struggle_involved|E] dans la [RICE_greenland_struggle|E]."
 RICE_north_atlantic_make_culture_involved_in_greenland_effect_tooltip_1:1 "@RICE_greenland_resilience_icon! La [greenland_resilience|E] [greenlands|E]  augmente de #V [EmptyScope.ScriptValue('RICE_greenland_new_involved_change_value')|0]#!"
 RICE_north_atlantic_make_culture_involved_in_greenland_confirm:0 "En route pour le Groenland !"
 RICE_north_atlantic_make_culture_involved_in_greenland_context_tooltip:0 "$RICE_north_atlantic_support_greenland_context_tooltip$"
 RICE_north_atlantic_make_faith_involved_in_greenland:0 "Répandre l'influence [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] au Groenland"
 RICE_north_atlantic_make_faith_involved_in_greenland_desc:0 "Bien que [ROOT.Char.GetFaith.GetName] se soit répandu dans la [region|E] des [GetGeographicalRegion('RICE_greenland_struggle_region').GetName], notre foi n'a pas une grande présence dans les [greenland_settlements|E]. Il serait bon que notre [faith|E] soit plus [struggle_involved|E] dans le [RICE_greenland_struggle|E], afin que même ces rivages lointains puissent être illuminés par la parole de [ROOT.Char.GetFaith.HighGodName]."
 RICE_north_atlantic_make_faith_involved_in_greenland_tooltip:1 "Notre [faith|E] devrait être [struggle_involved|E] dans la [RICE_greenland_struggle|E]"
 RICE_north_atlantic_make_faith_involved_in_greenland_effect_tooltip_1:1 "@RICE_greenland_networks_icon! [greenland_networks|E] [greenlands|E] augmente de #V [EmptyScope.ScriptValue('RICE_greenland_new_involved_change_value')|0]#!"
 RICE_north_atlantic_make_faith_involved_in_greenland_confirm:0 "Le Groenland deviendra la terre de [ROOT.Char.GetFaith.HighGodName] !"
 RICE_north_atlantic_make_faith_involved_in_greenland_context_tooltip:0 "$RICE_north_atlantic_support_greenland_context_tooltip$"
 RICE_greenland_struggle_county_culture_req:0 "Au moins #V [EmptyScope.ScriptValue('RICE_greenland_county_involved_req_value')|0]#! [counties|E] dans la [region|E] des [GetGeographicalRegion('RICE_greenland_struggle_region').GetName] sont de votre [culture|E]"
 RICE_greenland_struggle_county_faith_req:0 "Au moins #V [EmptyScope.ScriptValue('RICE_greenland_county_involved_req_value')|0]#! [counties|E] dans la [region|E] des [GetGeographicalRegion('RICE_greenland_struggle_region').GetName] sont de votre [faith|E]"
 RICE_greenland_struggle_own_territory_req:0 "Posséder au moins #V [EmptyScope.ScriptValue('RICE_greenland_county_own_req_value')|0]#! [counties|E] dans la [region|E] des [GetGeographicalRegion('RICE_greenland_struggle_region').GetName] (y compris les [counties|E] possédés par vos [vassals|E])"



 # EXTRAS
 
 north_atlantic.0000.t:0 "xxxxx"
 north_atlantic.0000.desc:0 "xxxxx"
 north_atlantic.0000.a:0 "xxxxx"
 north_atlantic.0001.t:0 "La $RICE_greenland_struggle$"
 north_atlantic.0001.desc:0 "Le voyage d'[erik.GetFirstNameNicknamedPossessive] a ouvert la voie à d'autres pour participer à la colonisation de la terre qu'[erik.GetSheHe] nomma #V Groenland#!. Ceux qui s'installent sur ces rivages lointains et froids récolteront assurément de grands profits et une grande influence s'ils parviennent à contrôler ses exportations de produits de luxe comme l'ivoire de morse."
 north_atlantic.0001.desc.involved:0 "La Maison [ROOT.Char.GetHouse.GetName] sera-t-elle destinée à naviguer vers le Groenland également, et y a-t-il encore d'autres terres au-delà, attendant d'être découvertes ?"
 north_atlantic.0001.desc.interloper:0 "La Maison [ROOT.Char.GetHouse.GetName] s'impliquera-t-elle davantage dans ces efforts nordiques pour coloniser cette région frontalière ? Seul le temps nous le dira."
 north_atlantic.0001.a:0 "Les mers et les terres légendaires de l'Atlantique Nord nous appellent !"
 north_atlantic.0001.b:0 "Peut-être qu'un jour, nous naviguerons nous aussi à travers les mers."
 north_atlantic.0001.c:0 "Quelqu'un peut-il me conseiller sur le Groenland ?"
 north_atlantic.0001.tooltip:0 "Sélectionnez cette option si vous souhaitez apprendre les bases du fonctionnement des différents mécanismes du [RICE_greenland_struggle|E] - les comprendre vous aidera, vous et les colons des [greenlands|E], à en profiter mutuellement !"
 north_atlantic.0001.c.tooltip:0 "Sélectionnez cette option si vous souhaitez apprendre les bases du fonctionnement des différents mécanismes du [RICE_greenland_struggle|E] - les comprendre vous aidera, vous et les colons des [greenlands|E], à en profiter mutuellement !"
 north_atlantic.0002.t:0 "xxxxx"
 north_atlantic.0002.desc:0 "xxxxx"
 north_atlantic.0002.a:0 "xxxxx"
 north_atlantic.0003.t:0 "La colonie du Groenland"
 north_atlantic.0003.desc:0 "Bien que je ne prévoie pas de me rendre au Groenland, je veux trouver des moyens de m'impliquer dans la colonie pour renforcer l'influence de ma famille.\n\nUn notable local, [guide.GetFirstName], prévoit de s'y installer. Avant de partir, [guide.GetSheHe] me rend visite et me donne quelques conseils : \" Votre famille devrait établir un #bold domaine#! au Groenland et #bold soutenir#! les colons afin de bénéficier mutuellement de la colonie, comme les chasses au morse dans le #bold Nordsetur#!, car les défenses de morse peuvent être vendues avec grand profit ! Si vous êtes courageux, vous pouvez aussi gagner une gloire éternelle en parrainant des #bold expéditions#! pour découvrir ce qui se trouve là-bas. \""
 north_atlantic.0003.a:0 "Je pense avoir beaucoup appris. Je vous remercie de vos réflexions."
 north_atlantic.0003.b:0 "Pouvez-vous nous donner plus d'informations sur le Groenland lui-même ?"
 north_atlantic.0004.t:0 "Ressources et pressions du Groenland"
 north_atlantic.0004.desc:0 "La façon dont je vois les choses," dit [guide.GetFirstName], "tant que les colons du Groenland font preuve de #bold résilience#! et maintiennent de solides #bold réseaux#! avec le monde extérieur, ils surmonteront la plupart des difficultés. Il pourrait y avoir d'autres terres de mythe et de légende là-bas, mais ne soyez pas avide de gloire ; faites attention à la #bold viabilité#! de la colonisation de ces terres, car vous pourriez perdre votre temps et votre argent si ces terres sont trop reculées et ont peu de ressources rentables. Gardez tout cela à l'esprit, et qui sait ce que nous explorerons et accomplirons là-bas, au Groenland et au-delà ?"\n\n[guide.GetFirstNameNoTooltip] fournit d'autres conseils utiles concernant la situation du Groenland, et je [guide.GetHerHim] remercie avant qu'[guide.GetSheHe] ne prenne congé."
 north_atlantic.0004.a:0 "Nous vivons une époque intéressante, cela ne fait aucun doute !"
 north_atlantic.0005.t:0 "xxxxx"
 north_atlantic.0005.desc:0 "xxxxx"
 north_atlantic.0005.a:0 "xxxxx"
 north_atlantic.0006.t:0 "Le changement climatique dans le Nord"
 north_atlantic.0006.desc:0 "Il y a des siècles, les premiers colons arrivèrent au Groenland depuis l'Europe. Depuis lors, eux et leurs descendants ont bâti une communauté prospère - bien que modeste - sur ces rivages froids et isolés. Malheureusement, il semble que ces terres deviennent encore plus froides ces derniers temps.\n\nQuelque chose a changé dans les conditions météorologiques récemment : les tempêtes sont plus fréquentes, les hivers sont plus longs et les printemps plus courts. De tels changements n'ont pas échappé aux habitants, qui tentent de s'adapter de diverses manières. Face au déclin du bétail, par exemple, de nombreux colons augmentent la part de nourriture marine dans leur alimentation.\n\nSeul le temps dira si ces colons parviendront à s'acclimater à une terre en perpétuel changement sur le long terme, ou si la colonie du Groenland échouera à endurer ces conditions difficiles."
 north_atlantic.0006.a:0 "Que réserve l'avenir aux colonies du Groenland ?"
 north_atlantic.0006.tooltip:0 "\nDésormais, @RICE_greenland_resilience_icon! [greenland_resilience|E] peut #N diminuer#! de montants bien plus élevés, quelle que soit la [struggle_phase|E] dans laquelle se trouve le [RICE_greenland_struggle|E]. Cela affectera négativement les avantages des [greenland_expeditions|E] et des autres [decisions|E] disponibles pour les [rulers|E] qui possèdent des [greenland_estates|E] au [greenland|E].\n\nÀ long terme, surtout s'il y a d'autres signes de difficultés dans les [greenland_settlements|E], les [rulers|E] [struggle_involved|E] pourraient envisager d'abandonner ces domaines pour limiter leurs pertes s'ils ne parviennent pas à trouver les ressources nécessaires pour résoudre la [RICE_greenland_struggle|E] avec une #P bonne fin#!."
 north_atlantic.0007.t:0 "L'économie Atlantique en mutation"
 north_atlantic.0007.desc:0 "Il y a des siècles, les premiers colons arrivèrent au Groenland depuis l'Europe. Depuis lors, eux et leurs descendants ont bâti une communauté prospère - bien que modeste - sur ces rivages froids et isolés. Malheureusement, il semble que ces terres deviennent encore plus isolées ces derniers temps.\n\nL'économie du Groenland dépend principalement de l'exportation d'ivoire de morse (entre autres produits de luxe) à travers ses deux principaux établissements. Cependant, même les habitants du Groenland sont conscients des récents changements dans l'économie mondiale - des changements qui pourraient compromettre cette source de richesse ancestrale. Parmi ceux-ci, on compte des quantités croissantes d'ivoire d'éléphant en provenance d'Asie et d'Afrique arrivant en Europe, des expéditions de chasse au morse de plus en plus fréquentes en Bjarmie, et un commerce maritime dans le nord se détournant des routes atlantiques au profit de la mer Baltique.\n\nDepuis des âges, le Groenland s'est dressé comme la frontière lointaine de l'Eurasie, perdurant dans un isolement relatif. Désormais, les Groenlandais seront-ils capables de s'adapter aux effets des changements survenant ailleurs dans le monde ?"
 north_atlantic.0007.a:0 "Que réserve l'avenir aux colonies du Groenland ?"
 north_atlantic.0007.tooltip:0 "\nDésormais, @RICE_greenland_networks_icon! [greenland_networks|E] peut #N diminuer#! de montants bien plus élevés, quelle que soit la [struggle_phase|E] dans laquelle se trouve le [RICE_greenland_struggle|E]. Cela affectera au bout du compte de manière négative les bénéfices des [greenland_expeditions|E] et d'autres [decisions|E] disponibles pour les [rulers|E] possédant des [greenland_estates|E] au [greenland|E].\n\nÀ long terme, surtout s'il y a d'autres signes de troubles dans les [greenland_settlements|E], les [rulers|E] [struggle_involved|E] voudront peut-être envisager d'abandonner ces domaines pour limiter leurs pertes s'ils ne parviennent pas à trouver les ressources nécessaires pour résoudre le [RICE_greenland_struggle|E] avec une #P bonne fin#!."
 north_atlantic.0008.t:0 "$north_atlantic.0001.t$"
 north_atlantic.0008.desc:0 "La nouvelle se répand comme une traînée de poudre au sujet des aventures de [erik.GetFirstNameNicknamed], qui s'en revient d'un grand voyage vers l'ouest. Apparemment, [erik.GetSheHe] a découvert une vaste étendue de terre à l'ouest de l'Islande, qu'[erik.GetSheHe] appelle #V le Groenland#!. La rumeur veut que le Groenland soit en réalité une terre désolée et froide, et que ce nom ait été choisi comme une ruse astucieuse pour attirer des colons.\n\nNéanmoins, les esprits entreprenants ont pris note du fait que le Groenland abrite un grand nombre de morses (parmi d'autres biens de luxe précieux). En raison de la rareté de l'ivoire, il ne fait aucun doute que quiconque contrôlera le flux commercial au Groenland en tirera de grands profits et une grande influence, et des colons intrépides ont commencé à s'y rendre pour s'établir sur ses rivages lointains.\n\nBien que le Groenland soit trop éloigné pour que nous puissions influencer ses affaires de manière significative, sa découverte et sa colonisation pourraient avoir un impact profond sur les réseaux commerciaux, culturels et politiques du monde de l'Atlantique Nord."
 north_atlantic.0008.a:0 "De l'Islande au Groenland... et peut-être au-delà ?"
 north_atlantic.0008.tooltip:0 "La [RICE_greenland_struggle|E] commence, débloquant diverses [decisions|E] et mécaniques pour les [rulers|E] qui sont [struggle_involved|E] dans cette entreprise et dans la [region|E] des [GetGeographicalRegion('RICE_greenland_struggle_region').GetName]. Deux valeurs globales,  @RICE_greenland_resilience_icon! [greenland_resilience|E] [greenlands|E] et @RICE_greenland_networks_icon! [greenland_networks|E] [greenlands|E], suivront l'état de la colonie."
 north_atlantic.0009.t:0 "La fin de la colonie du Groenland"
 north_atlantic.0009.desc:0 "Il fut un temps où le Groenland était une frontière importante de l'Atlantique Nord, plus lucrative, plus importante et mieux reliée à l'Europe que l'Islande. Hélas, l'histoire n'est jamais favorable au statu quo. Au fil des ans, les changements climatiques et l'économie mondiale ont fait des ravages.\n\nRécemment, un navire marchand solitaire est revenu du Groenland, rapportant qu'il n'y avait trouvé que des structures abandonnées et des morts. Selon certaines rumeurs, il resterait quelques colons dispersés et certains nobles nominalement impliqués dans les affaires du Groenland revendiqueraient encore l'autorité sur celui-ci, mais il est clair que la colonie n'existe plus. Peut-être qu'un jour, les spécialistes s'interrogeront sur les raisons du déclin de la colonie groenlandaise.\n\nDepuis que [erik.GetTitledFirstNameNicknamed] a découvert et colonisé le Groenland il y a bien longtemps, des générations de gens y ont vécu. Pourtant, aujourd'hui, tout ce qui reste des colonies jadis florissantes du Groenland, c'est le bruit du vent maussade et le grondement doucement inquiétant des vagues contre la glace."
 north_atlantic.0009.a:0 "L'histoire de la colonie du Groenland touche à sa fin... pour l'instant."
 north_atlantic.0009.tooltip:0 "Le [RICE_greenland_struggle|E] s'achève. L'effondrement de la colonie clôt un chapitre de l'histoire de l'Atlantique Nord et en ouvre un nouveau."
 RICE_greenland_struggle_ending_no_more_estate_bonus_collapse_tt:0 "Le [GetModifier('RICE_north_atlantic_greenland_family_estate').GetNameWithTooltip] [modifier|E] sera retiré de toutes les [houses|E] qui le possèdent, et les [rulers|E] de ces [houses|E] ne recevront plus de paiement annuel de leurs [greenland_estates_long|E]"
 north_atlantic.0010.t:0 "La découverte du Vinland"
 north_atlantic.0010.desc:0 "Le brave aventurier [leif.GetFullName] et son équipage sont revenus de leur expédition pour explorer les mers occidentales, confirmant les rumeurs sur des terres à l'ouest du Groenland.\n\nSelon les rapports, ils ont découvert trois nouvelles terres. La première terre qu'ils ont traversée, qu'ils ont nommée #Bold Helluland#!, est dominée par des pierres plates. La deuxième terre, qu'ils ont nommée #Bold Markland#!, est couverte de forêts imposantes et de plages de sable blanc. La troisième terre, qu'ils ont nommée #Bold Vinland#!, regorge de raisins et de prairies fertiles, et pourrait être colonisée un jour - si elle n'était pas si éloignée de l'Europe et dépourvue d'autres ressources précieuses.\n\nPeut-être qu'un fou trop ambitieux tentera (et échouera probablement) de coloniser définitivement ce Vinland, mais des dirigeants plus sensés pourraient voir l'intérêt d'explorer ces terres, en particulier le Helluland et le Markland, pour trouver des alliés locaux ou des marchandises à échanger. Qui sait ce qui se passera ensuite dans le monde de l'Atlantique Nord ?"
 north_atlantic.0010.a:0 "Un exploit remarquable de [leif.GetFirstNameNoTooltip] et de son équipe !"
 north_atlantic.0010.tooltip.1:0 "Les [decisions|E] et mécaniques liées au [helluland|E], au [markland|E] et au [vinland|E] ont été débloquées pour les [rulers|E] qui sont [struggle_involved|E] dans la [RICE_greenland_struggle|E]."
 north_atlantic.0010.tooltip.2:0 "Parce que le [vinland|E] a été découvert pendant la [struggle_phase_greenland_settlement|E], ou après une conclusion réussie de la [RICE_greenland_struggle|E], la [vinland_viability|E] [vinlands|E] commence à @RICE_vinland_viability_icon! #V 20#!."
 north_atlantic.0010.tooltip.3:0 "Parce que le [vinland|E] a été découvert pendant la [struggle_phase_greenland_integration|E], la [vinland_viability|E] [vinlands|E] commence à @RICE_vinland_viability_icon! #V 10#!."
 north_atlantic.0010.tooltip.4:0 "Parce que [vinland|E] a été découvert pendant la [struggle_phase_greenland_subsistence|E], la [vinland_viability|E] [vinlands|E] commence à @RICE_vinland_viability_icon! #V 0#!."
 north_atlantic.0011.t:0 "La Fin de la Colonie de l'Ouest"
 north_atlantic.0011.desc:0 "Pendant des siècles, les deux principales communautés de la colonie du Groenland - la plus grande à l'Est, et la plus petite à l'Ouest - furent des fournisseurs essentiels d'ivoire de morse et d'autres luxes exotiques pour l'Europe et au-delà. Cependant, les récents changements climatiques et de l'économie mondiale ont réduit la viabilité à long terme de ces colonies, peut-être de manière permanente.\n\nEn fait, des nouvelles troublantes sont parvenues de la Colonie occidentale. Un navire a récemment voyagé de Norvège au Groenland, et a rapporté que, bizarrement, toutes les fermes et bâtiments de la zone étaient abandonnés !\n\nLa population de la colonie occidentale avait décliné au fil des années, mais il était encore censé y avoir quelques personnes dans les environs ; pourtant aucune trace d'eux n'a pu être trouvée. Ont-ils été tués ou réduits en esclavage lors d'un raid par des étrangers ? Sont-ils partis vers l'ouest, au Vinland ? Sont-ils tous morts de maladie ? Se cachaient-ils tous pour une raison quelconque ? Autre chose ?\n\nBien que la Colonie orientale reste relativement prospère, beaucoup s'inquiètent de l'avenir du Groenland, tant il est incertain."
 north_atlantic.0011.a:0 "Espérons que l'établissement de l'Est pourra survivre."
 north_atlantic.0011.tooltip.resilience:0 "[greenland_resilience|E] [greenlands|E] diminue de #V 50#! à @RICE_greenland_resilience_icon! #V [GetGlobalVariable('RICE_greenland_resilience').GetValue|0]#!"
 north_atlantic.0011.tooltip.networks:0 "[greenland_networks|E] [greenlands|E] diminue de #V 50#! à @RICE_greenland_networks_icon! #V [GetGlobalVariable('RICE_greenland_networks').GetValue|0]#!"
 north_atlantic.0011.tooltip.exile_send_courtier:0 "Il n'est plus possible pour ceux [struggle_involved|E] dans la [RICE_greenland_struggle|E] d'envoyer des [courtiers|E] ou d'exiler des [prisoners|E] vers la Colonie occidentale du [greenland|E]"
 north_atlantic.0011.tooltip:0 "\nIl y aura une période de grâce d'environ 10 à 25 ans après cet événement. Après cette période de grâce, il y aura chaque année une chance qu'un événement se déclenche, provoquant l'abandon de la Colonie occidentale.\n\nLorsque la Colonie occidentale sera abandonnée, la [RICE_greenland_struggle|E] prendra fin si elle n'a pas été résolue d'ici là. Si cela se produit, tout [ruler|E] dont la [house|E] possède une [greenland_estate_long|E] ne sera #italic pas#! indemnisé pour les pertes subies.\n\n@warning_icon! #X Les [rulers|E] [struggle_involved|E] devraient essayer de prendre la [decision|E] de $RICE_greenland_struggle_ending_abandonment_decision$, pour limiter leurs pertes tant qu'ils le peuvent encore.#!"
 north_atlantic.0012.t:0 "xxxxx"
 north_atlantic.0012.desc:0 "xxxxx"
 north_atlantic.0012.a:0 "xxxxx"
 north_atlantic.0013.t:0 "xxxxx"
 north_atlantic.0013.desc:0 "xxxxx"
 north_atlantic.0013.a:0 "xxxxx"
 north_atlantic.0014.t:0 "Les Inuits arrivent au Groenland"
 north_atlantic.0014.desc:0 "Des rumeurs sont arrivées du Groenland concernant l'arrivée d'un nouveau peuple dans la région qui se fait appeler les [inuit.GetName]. Le temps dira comment les Inuits interagiront avec les autres habitants du Groenland, comme les [dorset.GetName] et les colons venus d'Europe.\n\nDepuis la nuit des temps, les [inuit.GetNameNoTooltip] ont vécu dans les régions froides et septentrionales du monde. Ils prospèrent dans ces climats glacials, excellant dans tous les domaines, de la chasse à la baleine et au phoque, à la construction de maisons bien isolées, en passant par les migrations et les voyages à travers la neige et la glace en traîneaux à chiens.\n\nLes [inuit.GetNameNoTooltip], avec leurs innovations, vont-ils supplanter les autres groupes pour le contrôle de ressources vitales, provoquant tensions et conflits ? Est-ce une opportunité de coopération et de commerce entre eux ? Ou ces trois groupes s'ignoreront-ils mutuellement, chacun suivant sa propre destinée dans les contrées reculées du Grand Nord ?"
 north_atlantic.0014.a:0 "Même dans le Grand Nord, les temps changent constamment."
 north_atlantic.0014.a.tooltip:0 "Pour ceux qui sont [struggle_involved|E] dans la [RICE_greenland_struggle|E], les relations avec les [inuit.GetNameNoTooltip] joueront désormais un rôle dans plusieurs [decisions|E] et événements, comme lors des [greenland_expeditions|E]."
 north_atlantic.0015.t:0 "xxxxx"
 north_atlantic.0015.desc:0 "xxxxx"
 north_atlantic.0015.a:0 "xxxxx"
 north_atlantic.0016.t:0 "Abandon du Vinland"
 north_atlantic.0016.desc.intro.support:0 "Les navires que j'ai envoyés au Vinland sont rentrés plus tôt que prévu."
 north_atlantic.0016.desc.intro:0 "J'ai reçu de mauvaises nouvelles de l'avant-poste de notre famille à Vinland !"
 north_atlantic.0016.desc:0 "Il semble que la plupart des colons au Vinland - pas seulement ceux qui ont prêté allégeance à ma famille - ont abandonné tous les établissements qui y avaient été fondés.\n\nLes rapports divergent quant aux raisons de cet abandon. Certains colons accusent des peuples indigènes agressifs qui les ont pillés et attaqués. D'autres affirment qu'en raison d'une mauvaise planification, ils ne disposaient pas de suffisamment de provisions pour subsister à long terme. Certains ici même soupçonnent que les colons ont perdu la volonté de rester, réalisant qu'il y avait peu d'avantages économiques à demeurer dans cette région reculée et inexplorée aux rares ressources précieuses, aussi luxuriante soit-elle.\n\nQuelle qu'en soit la cause ou les causes, c'est assurément un revers pour quiconque souhaitait coloniser le Vinland à long terme."
 north_atlantic.0016.a:0 "Rester à Vinland a-t-il jamais été viable à long terme ?"
 north_atlantic.0016.tooltip:0 "Tous les [vinland_outposts|E] au [vinland|E] sont abandonnés, et la @RICE_vinland_viability_icon! [vinland_viability|E] [vinlands|E] diminue de #V [GetGlobalVariable('RICE_viability_vinland_fail_value_temp').GetValue]#! à @RICE_vinland_viability_icon! #V [GetGlobalVariable('RICE_vinland_viability').GetValue|0]#!"
 north_atlantic.0016.support.tooltip:0 "Votre aide n'atteint pas [vinland|E]"
 north_atlantic.0017.t:0 "Incorporer les idées [inuit.GetNameNoTooltip]"
 north_atlantic.0017.desc:0 "Les colonies du Groenland constituent une région frontalière importante mais éloignée. Ces derniers temps, elles ont fait face à de nombreux défis, et bien que le peuple [greenlandic.GetName] se soit bien adapté, nombreux sont ceux qui estiment que davantage peut être fait pour assurer la viabilité à long terme de la colonie.\n\n[adopter.GetTitledFirstName], un dirigeant éminent de la région des [GetGeographicalRegion('RICE_greenland_struggle_region').GetName], dont la famille est profondément impliquée dans la colonie du Groenland, a pris contact avec les [inuit.GetCollectiveNoun] du nord du Groenland. [adopter.GetSheHe|U] cherche à tisser des liens plus étroits avec eux, car [adopter.GetSheHe] a entendu des récits sur la façon dont ils se sont adaptés à la vie dans les climats froids et arctiques.\n\n[adopter.GetFirstNameNoTooltip] sera à l'avant-garde de cette nouvelle politique pour la colonie du Groenland, utilisant son influence et ses relations pour encourager les [greenlandic.GetCollectiveNoun] à en apprendre davantage sur le mode de vie [inuit.GetNameNoTooltip], et améliorant en retour les relations et les réseaux commerciaux avec les [inuit.GetNameNoTooltip]. De cette façon, les deux groupes pourront travailler ensemble pour bâtir une société plus forte et plus prospère dans le Grand Nord."
 north_atlantic.0017.a:0 "Nous verrons comment cela fonctionnera à long terme."
 north_atlantic.0018.t:0 "Sources thermales Islandaises"
 north_atlantic.0018.desc:0 "Je suis arrivé aux sources chaudes de [ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetLocation.GetName]. Bien qu'elles ne soient qu'une parmi tant d'autres sources chaudes en [GetGeographicalRegion('custom_iceland').GetName], j'ai beaucoup entendu parler de celle que je visite aujourd'hui, et je voulais en faire l'expérience par moi-même.\n\nPendant mon séjour ici, je prends autant de temps que possible pour me reposer. Il n'est guère étonnant que les héros des anciennes sagas visitaient des sources chaudes comme celles-ci, car c'est une expérience absolument relaxante !\n\nQuoi qu'il en soit, je me demande... y reviendrai-je la prochaine fois, ou en essaierai-je une autre sur l'île ?"
 north_atlantic.0018.a:0 "C'est tellement relaxant...."
 north_atlantic.0019.t:0 "$north_atlantic.0018.t$"
 north_atlantic.0019.desc:0 "[GetGeographicalRegion('custom_iceland').GetName] abrite de nombreuses sources chaudes. Les sagas parlent de personnages légendaires et historiques qui fréquentaient certaines de ces sources chaudes.\n\nJ'ai donc décidé d'aller faire un [ROOT.Char.GetInvolvedActivity.GetShortName] à [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetName] pour me détendre et revigorer mon esprit."
 north_atlantic.0019.a:0 "Allons-y !"
 north_atlantic.0020.t:0 "Arrivée au Groenland de la Maison [ROOT.Char.GetHouse.GetNameNoTooltip]"
 north_atlantic.0020.desc.establisher:0 "Après mûre délibération, j'ai décidé que la Maison [ROOT.Char.GetHouse.GetName] devrait revendiquer une place pour nous dans les colonies du Groenland. Bien que la terre soit froide et rude, il y a de nombreuses opportunités de profit grâce au commerce de produits animaux exotiques, en particulier l'ivoire de morse.\n\nJ'ai pris l'initiative de trouver un site approprié pour le domaine de notre famille au Groenland, et j'ai déjà donné l'ordre de construire une résidence sur cette terre, ainsi que des fermes pour les paysans locaux qui y seront rattachés. Très bientôt, des cargaisons de précieuses exportations de luxe provenant de notre domaine groenlandais arriveront dans les ports contrôlés par notre famille pour être vendues sur les marchés européens."
 north_atlantic.0020.desc.relative:0 "Après mûre délibération, [establisher.GetTitledFirstName] a décidé que la Maison [ROOT.Char.GetHouse.GetName] devrait revendiquer une place pour nous dans les colonies du Groenland. Bien que la terre soit froide et rude, il y a de nombreuses opportunités de profit grâce au commerce de produits animaux exotiques, en particulier l'ivoire de morse.\n\n[establisher.GetFirstName] a pris l'initiative de localiser un site approprié pour le domaine de notre famille au Groenland, et [establisher.GetSheHe] a déjà donné l'ordre de construire une résidence sur cette terre, ainsi que des fermes pour les paysans locaux qui y sont rattachés. Très bientôt, des cargaisons de précieuses exportations de luxe provenant de notre domaine au Groenland arriveront dans les ports contrôlés par notre famille pour être vendues sur les marchés européens."
 north_atlantic.0020.a:0 "Notre présence au Groenland sera payante à long terme."
 north_atlantic.0021.t:0 "Arrivée de nouveaux arrivants du Groenland"
 north_atlantic.0021.desc:0 "Comme les colonies du Groenland sont actuellement confrontées à un déclin économique pour diverses raisons, j'ai pu user de mon influence et de mes relations pour convaincre un certain nombre de [greenlandic.GetCollectiveNoun] vivant là-bas de se réinstaller sur mes terres. Bien que la plupart des membres de ce petit groupe soient des paysans, on y trouve aussi quelques notables. Quoi qu'il en soit, ils peuvent enseigner à mes sujets actuels diverses techniques pour survivre dans des climats plus froids, ou nous aider à maintenir nos réseaux avec le Groenland (même s'ils sont en déclin)."
 north_atlantic.0021.desc.immigrant:0 "\n\nL'un de ces immigrants était un[immigrant.Custom('FR_E')] membre éminent[immigrant.Custom('FR_E')] de la société groenlandaise du nom de [immigrant.GetFullName]. [immigrant.GetSheHe|U] a offert de me servir en tant que courtisan[immigrant.Custom('FR_E')], pour me remercier de l'avoir aidé[immigrant.Custom('FR_E')] à trouver un nouveau foyer."
 north_atlantic.0021.a:0 "Je suis sûr que ces nouveaux venus se débrouilleront très bien ici."
 north_atlantic.0021.b:0 "Nous serons heureux que [immigrant.GetFirstNameNoTooltip] reste parmi nous !"
 north_atlantic.0021.c:0 "Je n'ai pas besoin des services [immigrant.GetFirstNamePossessiveNoTooltip]."
 north_atlantic.0022.t:0 "Le premier Althing d'Islande"
 north_atlantic.0022.desc:0 "Nous sommes arrivés sur les rives de l'Islande il y a des années, à la recherche d'un nouveau foyer et d'une nouvelle terre. Aujourd'hui, des années plus tard, la majeure partie de l'île a été colonisée par diverses familles, tandis que notre communauté continue de s'agrandir et que nous commençons à nous identifier davantage à [icelandic.GetCollectiveNoun] qu'à nos terres ancestrales."
 north_atlantic.0022.desc.convener:0 "\n\n Des appels avaient récemment été lancés à travers l'île pour la formation d'une assemblée chargée de gouverner nos affaires. En tant que l'un des chefs éminents, j'ai pris l'initiative de faire exactement cela. Après avoir rassemblé le soutien d'autres dirigeants de l'île, j'ai convoqué le premier #italic Althing#! d'Islande dans les plaines de Thingvellir, car le site est facilement accessible depuis n'importe quel point de l'île. L'endroit possède également le fameux Rocher de la Loi, un affleurement rocheux parfait pour proclamer les lois et les jugements."
 north_atlantic.0022.desc.not_convener:0 "\n\n Des appels avaient récemment été lancés à travers l'île pour la formation d'une assemblée chargée de gouverner nos affaires. L'un des chefs éminents de l'île, [althing_convener.GetFirstName], a pris l'initiative de faire exactement cela. Après avoir rassemblé le soutien d'autres dirigeants de l'île comme moi-même, [althing_convener.GetSheHe] a convoqué le premier #italic Althing#! d'Islande dans les plaines de Thingvellir, car elles sont facilement accessibles depuis n'importe quel point de l'île. Le site possède également le fameux Rocher de la Loi, un affleurement rocheux parfait pour proclamer les lois et les jugements."
 north_atlantic.0022.desc.ending:0 "\n\nAujourd'hui, nous pouvons vraiment dire que le Commonwealth islandais est né. Je suis fier d'avoir participé à un tel tournant dans l'histoire de [icelandic.GetName] !"
 north_atlantic.0022.a:0 "Un nouveau jour se lève sur l'Islande !"
 north_atlantic.0022.vassal.tooltip:0 "Tous les [rulers|E] en [GetGeographicalRegion('custom_iceland').GetName] qui sont de [rank|E] [count|E] deviennent [vassal|E] de [althing_convener.GetTitledFirstNamePossessive]"
 north_atlantic.0023.t:0 "Centre de Sculpture Nordique en Ivoire"
 north_atlantic.0023.desc:0 "Le Groenland exporte beaucoup d'ivoire de morse vers les marchés de toute l'Europe, où il est souvent vendu à des prix élevés. Jusqu'à présent, les ateliers de sculpture d'ivoire qui utilisent le plus cet ivoire étaient dispersés à travers de nombreuses terres, ce que [walrus_person.GetTitledFirstName], doté d'un esprit entrepreneurial, a perçu comme une grande opportunité.\n\nEn travaillant avec des marchands locaux et des sculpteurs d'ivoire, [walrus_person.GetFirstNameNoTooltip] a développé sa capitale, [walrus_person.GetCapitalLocation.GetTitle.GetNameNoTier], en un centre de sculpture d'ivoire dans les [GetGeographicalRegion('RICE_greenland_struggle_region').GetName]. En investissant dans cette industrie, et en transformant [walrus_person.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] en une destination majeure pour les navires chargés d'ivoire de morse, [walrus_person.GetSheHe] et ses successeurs profiteront généreusement du commerce de l'ivoire pour les années à venir."
 north_atlantic.0023.a:0 "Une décision commerciale intelligente."
 north_atlantic.0024.t:0 "Centre Européen de Sculpture sur Ivoire"
 north_atlantic.0024.desc:0 "Le Groenland exporte de grandes quantités d'ivoire de morse vers les marchés de toute l'Europe, où il est souvent vendu à prix d'or. Jusqu'à présent, les ateliers de sculpture qui utilisent le plus cet ivoire étaient dispersés à travers de nombreux pays, ce que l'esprit entreprenant de [walrus_person.GetTitledFirstName] a perçu comme une formidable opportunité.\n\nEn collaboration avec les marchands locaux et les maîtres sculpteurs sur ivoire, [walrus_person.GetFirstNameNoTooltip] a fait de sa capitale, [walrus_person.GetCapitalLocation.GetTitle.GetNameNoTier], le principal centre européen de sculpture sur ivoire en dehors des [GetGeographicalRegion('RICE_greenland_struggle_region').GetName]. En investissant dans cette industrie et en faisant de [walrus_person.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] une destination incontournable pour les navires chargés d'ivoire de morse, [walrus_person.Custom('FR_LuiElle')] et ses successeurs tireront de substantiels profits du commerce de l'ivoire pendant de nombreuses années."
 north_atlantic.0024.a:0 "$north_atlantic.0023.a$"
 north_atlantic.0025.t:0 "Déclin du commerce de l'ivoire en [inside_county.GetNameNoTierNoTooltip]"
 north_atlantic.0025.desc:0 "Pendant des années, le Groenland a été le principal exportateur d'ivoire de morse vers les marchés européens. Cependant, la colonie groenlandaise fait face à des défis majeurs ces derniers temps, et connaît une période de marginalisation.\n\nLa situation actuelle a affecté le marché de l'ivoire de manière défavorable, et a provoqué un déclin brutal de l'industrie de la sculpture sur ivoire de [inside_county.GetNameNoTier]. En fait, [inside_county.GetNameNoTierNoTooltip] ne peut plus être considérée comme un centre majeur de sculpture sur ivoire dans les [GetGeographicalRegion('RICE_greenland_struggle_region').GetName], en raison du déclin du commerce de l'ivoire."
 north_atlantic.0025.a:0 "J'espère que les choses s'amélioreront pour le commerce de l'ivoire à l'avenir...."
 north_atlantic.0025.tooltip:0 "La [decision|E] de $RICE_north_atlantic_walrus_ivory_workshop_scandinavia$ est désormais réactivée pour tous les [rulers|E] qui remplissent les conditions préalables, bien qu'elle ne puisse être prise que si la [RICE_greenland_struggle|E] est dans la [struggle_phase_greenland_integration|E]."
 north_atlantic.0026.t:0 "Déclin du commerce de l'ivoire en [outside_county.GetNameNoTierNoTooltip]"
 north_atlantic.0026.desc:0 "Pendant des années, le Groenland a été le principal exportateur d'ivoire de morse vers les marchés européens. Cependant, la colonie groenlandaise fait face à des défis majeurs ces derniers temps, et traverse une période de marginalisation.\n\nLa situation actuelle a affecté le marché de l'ivoire de manière défavorable, et a provoqué un déclin brutal de l'industrie de la sculpture sur ivoire de [outside_county.GetNameNoTier]. En fait, [outside_county.GetNameNoTierNoTooltip] ne peut plus être considérée comme le centre majeur européen de la sculpture sur ivoire en dehors des [GetGeographicalRegion('RICE_greenland_struggle_region').GetName], en raison du déclin du commerce de l'ivoire."
 north_atlantic.0026.a:0 "$north_atlantic.0025.a$"
 north_atlantic.0026.tooltip:0 "La [decision|E] de $RICE_north_atlantic_walrus_ivory_workshop_europe$ est désormais réactivée pour tous les [rulers|E] qui remplissent les conditions préalables, bien qu'elle ne puisse être prise que si la [RICE_greenland_struggle|E] est dans la [struggle_phase_greenland_integration|E]."
 north_atlantic.0027.t:0 "La première grande école religieuse d'Islande"
 north_atlantic.0027.desc:0 "Alors que la religion [isleifur.GetFaith.GetReligion.GetAdjectiveNoTooltip] continue de s'étendre en [GetGeographicalRegion('custom_iceland').GetName], de nombreux Islandais estiment qu'il est important de renforcer l'autorité religieuse dans la région par divers moyens.\n\n[isleifur.GetTitledFirstName], en particulier, a mis de côté des fonds et des ressources pour fonder la première grande école [isleifur.GetFaith.GetReligion.GetAdjective] en [GetGeographicalRegion('custom_iceland').GetNameNoTooltip]. Les [isleifur.Custom('DefaultPriestTitlePlural')|U] n'ont plus besoin de voyager loin pour être formés aux questions religieuses, tandis que les élites locales peuvent envoyer leurs enfants y étudier. Cela contribuera assurément grandement non seulement au développement spirituel de l'île, mais aussi à son développement politique et culturel !"
 north_atlantic.0027.a:0 "Ainsi, [GetGeographicalRegion('custom_iceland').GetNameNoTooltip] continue de prospérer."
 north_atlantic.0028.t:0 "[greenland_colonizer.GetCulture.GetNameNoTooltip] L'influence s'étend au Groenland"
 north_atlantic.0028.desc:0 "Pendant longtemps, les [greenland_colonizer.GetCulture.GetCollectiveNoun] n'ont pas eu de présence significative dans la colonie du Groenland, malgré leur implication croissante dans les divers réseaux économiques et politiques des [GetGeographicalRegion('RICE_greenland_struggle_region').GetName].\n\nCela, cependant, est en train de changer sous la direction de [greenland_colonizer.GetTitledFirstName], qui reconnaît que si les [greenland_colonizer.GetCulture.GetCollectiveNounNoTooltip] veulent véritablement tirer profit du Groenland, ils doivent s'impliquer davantage dans ses affaires quotidiennes. Ainsi, [greenland_colonizer.GetSheHe] encourage désormais les [greenland_colonizer.GetCulture.GetCollectiveNounNoTooltip] à s'y installer, et ceux restés au pays à tisser des liens plus forts avec le Groenland et son lucratif commerce de morse."
 north_atlantic.0028.a:0 "Quel rôle futur les [greenland_colonizer.GetCulture.GetCollectiveNounNoTooltip] joueront-ils au Groenland ?"
 north_atlantic.0029.t:0 "[greenland_colonizer.GetFaith.GetNameNoTooltip] L'influence s'étend au Groenland"
 north_atlantic.0029.desc:0 "Bien que [greenland_colonizer.GetFaith.GetName] ait une présence non négligeable dans les [GetGeographicalRegion('RICE_greenland_struggle_region').GetName], la communauté [greenland_colonizer.GetFaith.GetAdjective] au Groenland et sa force institutionnelle étaient, en comparaison, très réduites.\n\n[greenland_colonizer.GetTitledFirstName] cherche cependant à changer l'état actuel des choses. Que ce soit par vraie dévotion ou non, [greenland_colonizer.GetSheHe] cherche à répandre la parole de [greenland_colonizer.GetFaith.HighGodName] jusqu'à la lointaine frontière glacée du monde qu'est le Groenland. [greenland_colonizer.GetSheHe|U] envoie des [greenland_colonizer.Custom('DefaultPriestTitlePlural')] dans ces colonies pour étendre la communauté des [greenland_colonizer.GetFaith.GetAdherentNamePlural] là-bas, et peut-être même attirer de nouveaux membres."
 north_atlantic.0029.a:0 "Même les prières à [greenland_colonizer.GetFaith.HighGodName] sont entendues au Groenland désormais !"
 north_atlantic.0030.t:0 "Expédition : Choisir un meneur"
 north_atlantic.0030.desc.helluland:0 "Il existe des terres au-delà du Groenland, comme l'Helluland."
 north_atlantic.0030.desc.markland:0 "Il y a des terres qui s'étendent au-delà du Groenland, comme le Markland."
 north_atlantic.0030.desc.vinland:0 "Il existe des terres au-delà du Groenland, comme le Vinland."
 north_atlantic.0030.desc:0 "En parrainant une expédition là-bas, nous pourrions localiser des ressources utiles, des autochtones avec qui commercer, et bien plus - #italic si#! nous réussissons.\n\nAlors que je commence à organiser cette expédition, je considère attentivement la question de savoir qui la dirigera. Cette personne doit être courageuse, intelligente et capable ; son leadership pourrait faire la différence entre le succès ou l'échec de l'expédition."
 north_atlantic.0030.desc.some_courtiers:0 "\n\nCertaines personnes de ma cour ont manifesté leur intérêt pour devenir le chef de l'expédition. Dois-je leur accorder cet honneur ou dois-je y réfléchir davantage ?"
 north_atlantic.0030.desc.no_courtiers:0 "\n\nMalheureusement, personne dans ma cour n'a exprimé le souhait de devenir le chef de l'expédition. Je dois trouver quelqu'un pour assumer cette fonction afin que l'expédition puisse avoir lieu."
 north_atlantic.0030.a:0 "[candidate_1.GetFirstNameNoTooltip] est la personne qu'il vous faut !"
 north_atlantic.0030.b:0 "[candidate_2.GetFirstNameNoTooltip] ferait sûrement un bon leader."
 north_atlantic.0030.c:0 "[candidate_3.GetFirstNameNoTooltip] a ce qu'il faut pour ce rôle."
 north_atlantic.0030.d:0 "Je dois y réfléchir avant de prendre une décision."
 north_atlantic.0030.d.tooltip:0 "Pour les 3 prochains mois, vous aurez accès à une [interaction|E] pour demander à l'un de vos [courtiers|E] de diriger l'[greenland_expedition|E]. Les [courtiers|E] qui ont exprimé un intérêt initial pour ce rôle peuvent toujours recevoir l'offre, et ils accepteront automatiquement. Si vous ne choisissez personne ou si personne n'accepte vos demandes après les 3 mois écoulés, un personnage généré aléatoirement sera sélectionné comme [greenland_leader|E]."
 north_atlantic.0031.opening:0 "[recipient.Custom2('AppropriateGreeting', ROOT.Char)]"
 north_atlantic.0031.desc:0 "C'est avec plaisir que j'accepte votre offre de me nommer chef de la prochaine expédition dans les mers occidentales ! L'idée de partir à l'aventure m'enthousiasme et je vous remercie de la confiance que vous m'accordez. Je vous promets de ne pas vous décevoir."
 north_atlantic.0031.a:0 "Merveilleux !"
 north_atlantic.0031.tooltip:0 "[recipient.GetTitledFirstName] a été nommé[recipient.Custom('FR_E')] [greenland_leader|E] de l'[greenland_expedition|E]."
 north_atlantic.0032.opening:0 "[recipient.Custom2('AppropriateGreeting', ROOT.Char)]"
 north_atlantic.0032.desc:0 "Malheureusement, je ne peux pas accepter votre offre de me nommer chef de la prochaine expédition dans les mers occidentales. Bien que j'apprécie votre confiance en mes capacités, j'ai des obligations qui m'empêchent de partir à l'aventure. Je suis sûr que vous comprendrez."
 north_atlantic.0032.a:0 "Quelle déception."
 north_atlantic.0032.tooltip:0 "Vous avez encore le temps de demander à un autre [courtier|E] de [greenland_lead|E] l'[greenland_expedition|E] via [interaction|E]. Si vous ne choisissez personne ou si personne n'accepte vos demandes avant la fin de la préparation de l'expédition, un personnage généré aléatoirement sera choisi comme [greenland_leader|E]."
 north_atlantic.0033.t:0 "Expédition : Larguez les amarres !"
 north_atlantic.0033.desc.helluland:0 "C'est aujourd'hui que l'expédition que j'ai organisée part pour l'Helluland. Je suis venu au port de [province.GetName] pour leur dire adieu."
 north_atlantic.0033.desc.markland:0 "C'est aujourd'hui que l'expédition que j'ai organisée part pour le Markland. Je suis venu au port de [province.GetName] pour leur faire mes adieux."
 north_atlantic.0033.desc.vinland:0 "C'est aujourd'hui que l'expédition que j'ai organisée part pour le Vinland. Je suis venu au port de [province.GetName] pour leur dire adieu."
 north_atlantic.0033.desc.picked_leader:0 "\n\nCette expédition est menée par nul autre que [leader.GetTitledFirstName], que j'ai personnellement choisi[leader.Custom('FR_E')] pour en être le chef. Espérons que ma confiance en ses capacités sera bien placée."
 north_atlantic.0033.desc.custom_leader:0 "\n\nJe n'ai pas trouvé de chef d'expédition parmi mes courtisans, alors j'ai dû recruter [leader.GetTitledFirstName], un[leader.Custom('FR_E')] voyag[leader.Custom('FR_RSe')] expérimenté[leader.Custom('FR_E')] qui vit dans mon royaume. Je ne connais pas bien [leader.GetHerHim], alors je ne peux qu'espérer que je n'ai pas fait d'erreur."
 north_atlantic.0033.desc:0 "\n\n[leader.GetFirstNameNoTooltip] me rassure que l'équipage est de bonne humeur, et qu'ils sont prêts pour cette grande aventure. Je ne peux qu'espérer que rien ne tourne mal pendant le voyage, et que [leader.GetSheHe] et son équipage reviennent avec un grand succès, que ce soit un trésor abondant, des opportunités commerciales avec les locaux, de nouvelles découvertes, ou autre chose."
 north_atlantic.0033.a:0 "Bon voyage !"
 north_atlantic.0033.tooltip:0 "L'[greenland_expedition|E] durera environ un à deux ans, durant lesquels elle traversera trois [expedition_episodes|E]. Ces [expedition_episodes|E] peuvent avoir des résultats #Bold #P positifs#!#!, #Bold #N négatifs#!#!, ou #Bold neutres#! qui déterminent si l'[greenland_expedition|E] est considérée comme un #P succès#! ou un #N échec#!. Parfois, les résultats peuvent être influencés par les [skills|E] du [greenland_expedition_leader_s|E]."
 north_atlantic.0034.t:0 "Expédition : Le Retour"
 north_atlantic.0034.desc.helluland:0 "Les navires que nous avons envoyés en expédition au Helluland sont revenus !\n\n"
 north_atlantic.0034.desc.markland:0 "Les navires que nous avons envoyés en expédition au Markland sont revenus !\n\n"
 north_atlantic.0034.desc.vinland:0 "Les navires que nous avons envoyés en expédition au Vinland sont revenus !\n\n"
 north_atlantic.0034.desc.leader_dead:0 "Malheureusement, [leader.GetFirstName] n'a pas vécu pour voir ce jour, car [leader.GetSheHe] est décédé[leader.Custom('FR_E')] durant le voyage. Néanmoins, j'ai rencontré les membres survivants de l'équipage pour m'assurer de la façon dont l'expédition s'est déroulée."
 north_atlantic.0034.desc.leader_not_dead:0 "Je suis allé rencontrer [leader.GetFirstName], et [leader.GetHerHim] questionner à propos des diverses aventures qu'[leader.GetSheHe] a vécues au cours de l'expédition. Comme on pouvait s'y attendre, [leader.GetSheHe] avait beaucoup à raconter."
 north_atlantic.0034.desc.failure:0 "\n\nMalheureusement, il semble que l'expédition fut en fin de compte un #bold #N échec#!#!. L'expédition fut assaillie par un certain nombre de calamités. [leader.GetFirstNameNoTooltip] a, au moins, fait de son mieux pour explorer cette région frontalière et trouver de nouvelles ressources ainsi que des autochtones amicaux.\n\nEn fin de compte, nous n'avons acquis aucun avantage durable ni information qui pourrait aider la colonie du Groenland, et l'expédition pourrait même avoir coûté à la colonie du Groenland beaucoup en termes de ressources et de main-d'œuvre."
 north_atlantic.0034.desc.success:0 "\n\nHeureusement, il semble que l'expédition fut finalement un #bold #P succès#!#! ! Durant l'expédition, [leader.GetFirstNameNoTooltip] a réussi à acquérir beaucoup de ressources utiles, de contacts et d'informations en explorant cette région frontalière.\n\nIl ne fait aucun doute que les bienfaits de cette expédition aideront grandement la colonie du Groenland. Peut-être pourrions-nous envoyer une autre expédition dans cette région à l'avenir - ce serait une autre belle opportunité de gagner plus de gloire pour nous-mêmes !"
 north_atlantic.0034.a.failure:0 "Ce résultat est très décevant."
 north_atlantic.0034.a.success:0 "C'est vraiment un résultat magnifique !"
 north_atlantic.0034.tooltip.success:0 "Parce que l'[greenland_expedition|E] a eu #Bold #P [THIS.Char.MakeScope.Var('RICE_expedition_success_value_temp').GetValue]#!#! bon(s) et #Bold #N [THIS.Char.MakeScope.Var('RICE_expedition_failure_value_temp').GetValue]#!#! mauvais [expedition_episodes|E], elle est considérée comme un #Bold #P succès#!#! !"
 north_atlantic.0034.tooltip.failure:0 "Parce que l'[greenland_expedition|E] a eu #Bold #P [THIS.Char.MakeScope.Var('RICE_expedition_success_value_temp').GetValue]#!#! bons et #Bold #N [THIS.Char.MakeScope.Var('RICE_expedition_failure_value_temp').GetValue]#!#! mauvais [expedition_episodes|E], elle est considérée comme un #Bold #N échec#!#! !"
 north_atlantic.0034.tooltip.increase.resilience:0 "[greenland_resilience|E]  [greenlands|E] augmente de #P [THIS.Char.MakeScope.Var('RICE_resilience_value_temp').GetValue]#! à @RICE_greenland_resilience_icon! #V [GetGlobalVariable('RICE_greenland_resilience').GetValue|0]#!"
 north_atlantic.0034.tooltip.increase.networks:0 "[greenland_networks|E] [greenlands|E] augmente de #P [THIS.Char.MakeScope.Var('RICE_networks_value_temp').GetValue]#! à @RICE_greenland_networks_icon! #V [GetGlobalVariable('RICE_greenland_networks').GetValue|0]#!"
 north_atlantic.0034.tooltip.increase.viability:0 "[vinland_viability|E] [vinlands|E] augmente de #P [THIS.Char.MakeScope.Var('RICE_viability_value_temp').GetValue]#! à @RICE_vinland_viability_icon! #V [GetGlobalVariable('RICE_vinland_viability').GetValue|0]#!"
 north_atlantic.0034.tooltip.decrease.resilience:0 "[greenland_resilience|E]  [greenlands|E] diminue de #N [THIS.Char.MakeScope.Var('RICE_resilience_value_temp').GetValue]#! à @RICE_greenland_resilience_icon! #V [GetGlobalVariable('RICE_greenland_resilience').GetValue|0]#!"
 north_atlantic.0034.tooltip.decrease.networks:0 "[greenland_networks|E] [greenlands|E] diminue de #N [THIS.Char.MakeScope.Var('RICE_networks_value_temp').GetValue]#! à @RICE_greenland_networks_icon! #V [GetGlobalVariable('RICE_greenland_networks').GetValue|0]#!"
 north_atlantic.0034.tooltip.decrease.viability:0 "[vinland_viability|E] [vinlands|E] diminue de #N [THIS.Char.MakeScope.Var('RICE_viability_value_temp').GetValue]#! à @RICE_vinland_viability_icon! #V [GetGlobalVariable('RICE_vinland_viability').GetValue|0]#!"
