 # Game Concepts
 game_concept_greenland_settlements:1 "Colonies du Groenland"
 game_concept_colonizing_greenland:1 "Colonisation du Groenland"
 game_concept_colonize_greenland:1 "Coloniser le Groenland"
 game_concept_greenland_colony:1 "Colonie du Groenland"
 game_concept_RICE_greenland_struggle:1 "Colonisation du Groenland"
 game_concept_RICE_greenland_struggle_desc:2 "La $game_concept_RICE_greenland_struggle$ est une [struggle|E] qui affecte la [region|E] des [GetGeographicalRegion('RICE_greenland_struggle_region').GetName]. Elle dépeint l'histoire des colonies nordiques au [greenland|E], qui fut à un moment une partie importante de l'économie de l'Atlantique Nord malgré son statut de région frontalière éloignée.\n\nDans les dates de départ après environ 980 de notre ère, cette [struggle|E] est déjà présent. Dans les dates de départ antérieures, la [struggle|E] est déclenché une fois qu'un [ruler|E] prend la [decision|E] d' $RICE_north_atlantic_explore_greenland$.\n\nLes [rulers|E] [struggle_involved|E] dans la $game_concept_colonizing_greenland$ ont accès à une multitude de [decisions|E] et mécaniques spéciales, comme la capacité de chasser le morse au [nordsetur|E] ou d'envoyer des [greenland_expeditions|E] vers l'ouest. Nombre de ces mécaniques sont liées à la @RICE_greenland_resilience_icon! [greenland_resilience|E] et aux @RICE_greenland_networks_icon! [greenland_networks|E], deux valeurs majeures qui doivent être maintenues élevées pour que le [greenland|E] prospère, notamment en [greenland_supporting|E] le [greenland|E].\n\nIl y a quatre façons dont ce [struggle|E] peut se terminer. Trois passent par des [decisions|E] de fin : deux #P bonnes fins#! qui sont $RICE_greenland_struggle_ending_integration_decision$ et $RICE_greenland_struggle_ending_indigenous_decision$, et une #N mauvaise fin#! qui est de $RICE_greenland_struggle_ending_abandonment_decision$. De plus, il y a une quatrième fin, où la colonie échoue naturellement. Cela se produit progressivement si la @RICE_greenland_resilience_icon! [greenland_resilience|E] et les @RICE_greenland_networks_icon! [greenland_networks|E] sont basses, et plusieurs événements historiques sont déclenchés en fin de partie."
 game_concept_greenlands:0 "du Groenland"
 game_concept_greenland:0 "Groenland"
 game_concept_greenland_desc:0 "Le Groenland est une grande île de l'Atlantique Nord. C'est l'objet principal de la [RICE_greenland_struggle|E], une [struggle|E] qui affecte la  [region|E] des [GetGeographicalRegion('RICE_greenland_struggle_region').GetName]\n\nBien qu'il s'agisse d'une région frontalière lointaine et périphérique, le Groenland joue un rôle important dans l'économie de l'Atlantique Nord grâce à l'exportation de divers produits de luxe, tels que les défenses de narval et les fourrures d'ours polaire, et #italic surtout#! l'ivoire de morse."
 game_concept_nordseturs:0 "de Nordsetur"
 game_concept_nordsetur:0 "Nordsetur"
 game_concept_nordsetur_desc:0 "Nordsetur est une région du nord du [greenland|E] qui correspond probablement à l'actuelle baie de Disko, et abrite un nombre important de morses. Comme le [greenland|E] exportait une grande partie de l'ivoire de morse utilisé en Europe durant une grande partie de la période médiévale, les chasses au morse faisaient partie intégrante de la vie et de la société dans la [greenland_colony|E].\n\nSi la [RICE_greenland_struggle|E] est encore en cours, ou a été résolue avec une #P bonne fin#!, les [rulers|E] dont les [houses|E] possèdent une [greenland_estate_long|E] peuvent prendre la [decision|E] d' $RICE_north_atlantic_hunting_trip$. Si vous jouez bien vos cartes, c'est un bon moyen de gagner beaucoup d'[gold|E]."
 game_concept_vinlands:0 "du Vinland"
 game_concept_vinland:0 "Vinland"
 game_concept_vinland_desc:0 "Vinland était le nom norrois d'une région à l'ouest du [greenland|E] et au sud du [markland|E] et du [helluland|E], qui correspond probablement à l'actuelle Terre-Neuve et au golfe du Saint-Laurent, et possiblement aussi loin au sud que le Maine aux États-Unis. On peut interagir avec elle une fois qu'un [ruler|E] qui est [struggle_involved|E] dans la [RICE_greenland_struggle|E] prend la [decision|E] d' $RICE_north_atlantic_explore_vinland$.\n\nEn raison de son éloignement et du manque de ressources lucratives (contrairement au [greenland|E]), coloniser le Vinland est extrêmement difficile si la [RICE_greenland_struggle|E] n'a pas été résolue avec une #P bonne fin#!. Envoyer des [greenland_expeditions|E] au Vinland est également coûteux.\n\nLa principale valeur globale liée au Vinland est la  @RICE_vinland_viability_icon! [vinland_viability|E], qui influence les chances de succès lors de la tentative d'établir une [vinland_outpost_long|E]. Si la [RICE_greenland_struggle|E] a une #P bonne fin#!, alors les [rulers|E] dans la [region|E] des [GetGeographicalRegion('RICE_greenland_struggle_region').GetName] auront accès à une [decision|E] pour établir une [vinland_colony_long|E] permanente."
 game_concept_marklands:0 "du Markland"
 game_concept_markland:0 "Markland"
 game_concept_markland_desc:0 "Markland était le nom norrois d'une région à l'ouest du [greenland|E] et au sud du [helluland|E], qui correspond probablement au Labrador moderne au Canada. Il est possible d'interagir avec elle une fois qu'un [ruler|E] qui est [struggle_involved|E] dans la [RICE_greenland_struggle|E] prend la [decision|E] d'$RICE_north_atlantic_explore_vinland$.\n\nLa principale façon d'interagir avec Markland est à travers les [greenland_expeditions|E]. L'avantage d'y envoyer des [greenland_expeditions|E] par opposition au [helluland|E] ou au [vinland|E] est que vous avez plus de chances de déclencher des [expedition_episodes_long|E] qui augmentent la @RICE_greenland_resilience_icon! [greenland_resilience|E] [greenlands|E] au Markland.\n\nHistoriquement, le Markland était réputé pour ses nombreuses forêts, et les Groenlandais ont peut-être voyagé là-bas jusqu'au XIVe siècle pour récolter du bois."
 game_concept_hellulands:0 "d'Helluland"
 game_concept_helluland:0 "Helluland"
 game_concept_helluland_desc:0 "Helluland est le nom d'une région à l'ouest du [greenland|E], qui correspond probablement à l'actuelle île de Baffin au Canada. Il est possible d'interagir avec elle une fois qu'un [ruler|E] qui est [struggle_involved|E] dans la [RICE_greenland_struggle|E] prend la [decision|E] d'$RICE_north_atlantic_explore_vinland$.\n\nLa principale façon d'interagir avec Helluland est à travers les [greenland_expeditions|E]. L'avantage d'y envoyer des [greenland_expeditions|E] par opposition au [markland|E] ou au [vinland|E] est que vous avez plus de chances de déclencher des [expedition_episodes_long|E] où vous rencontrez les peuples autochtones locaux, et d'augmenter les @RICE_greenland_networks_icon! [greenland_networks|E] [greenlands|E].\n\nHistoriquement, Helluland a peut-être été le site de contacts nordiques occasionnels avec les cultures locales, à savoir les Dorsétiens et, plus tard, les Inuits."
 game_concept_greenland_resilience_i:0 "@RICE_greenland_resilience_icon!"
 game_concept_greenland_resilience:0 "Résilience"
 game_concept_greenland_full_resilience:0 "Résilience du Groenland"
 game_concept_greenland_full_resilience_desc:0 "La Résilience est une valeur globale qui représente la capacité des [greenland_settlements|E] à s'adapter à tout changement pouvant affecter leur survie et leur croissance. C'est l'une des deux valeurs globales liées au [greenland|E], aux côtés des @RICE_greenland_networks_icon! [greenland_networks|E].\n\nPour ceux qui sont [struggle_involved|E] dans la [RICE_greenland_struggle|E], une Résilience plus élevée a des effets positifs sur un certain nombre de mécaniques et de [decisions|E]. En particulier, plus la Résilience est élevée, plus vous pouvez obtenir d'[gold|E] et de [piety|E] annuellement d'une [greenland_estate_long|E]. De plus, la Résilience et les [greenland_networks|E] doivent être à un niveau élevé afin d'obtenir une #P bonne#! fin pour la [RICE_greenland_struggle|E].\n\nLa Résilience augmente ou diminue naturellement à un rythme aléatoire chaque année en fonction de la [struggle_phase|E] dans laquelle se trouve actuellement la [RICE_greenland_struggle|E]. Elle peut également être influencée par diverses [decisions|E], notamment en [greenland_supporting|E] le [greenland|E]. Le montant maximum que la Résilience peut atteindre est de #Bold 1000#!.\n\nUne fois que la Résilience descend en dessous de 100, il y a une petite chance que les [greenland_settlements|E] échouent naturellement."
 game_concept_greenland_networks_i:0 "@RICE_greenland_networks_icon!"
 game_concept_greenland_networks:0 "Réseaux"
 game_concept_greenland_full_networks:0 "Réseaux du Groenland"
 game_concept_greenland_full_networks_desc:0 "Les Réseaux sont une valeur globale qui représentent la connexion que les [greenland_settlements|E] ont avec les autres régions et groupes, dont les Européens et les natifs des Amériques. Ils peuvent inclure des liens politiques, économiques et culturels. C'est l'une des deux formes de valeurs liées au [greenland|E], avec la @RICE_greenland_resilience_icon! [greenland_resilience|E].\n\nPour ceux [struggle_involved|E] dans la [RICE_greenland_struggle|E], des Réseaux élevés peuvent avoir des effets positifs sur un certain nombre de mécaniques et [decisions|E]. En particulier, plus les Réseaux sont élevés, plus les [greenland_estate_long|E] vous rapporteront d'[gold|E] et de [prestige|E] annuellement. De plus, les Réseaux et la [greenland_resilience|E] doivent être élevés afin d'obtenir une #P bonne#! fin pour la [RICE_greenland_struggle|E].\n\nLes Réseaux augmentent ou diminuent naturellement à un rythme plus ou moins aléatoire chaque année suivant la [struggle_phase|E] actuellement active de [RICE_greenland_struggle|E]. Ils peuvent être influencés par diverses [decisions|E], principalement par [greenland_supporting|E] [greenland|E]. Le nombre maximum de Réseaux est de #Bold 1000#!.\n\nSi les Réseaux sont assez bas dans les [struggle_phase_phases|E] de [struggle_phase_greenland_subsistence_simple|E] et [struggle_phase_greenland_marginalization_simple|E], certaines [decisions|E] seront plus coûteuses, voir même inaccessibles."
 game_concept_vinland_viability_i:0 "@RICE_vinland_viability_icon!"
 game_concept_vinland_viability:0 "Viabilité"
 game_concept_vinland_full_viability:0 "Viabilité du Vinland"
 game_concept_vinland_full_viability_desc:0 "La Viabilité est une valeur globale qui représente l'attrait de la colonisation du [vinland|E] pour ceux impliqués dans la [RICE_greenland_struggle|E]. Malgré sa renommée dans la culture populaire, les Norrois ne sont pas restés au [vinland|E] sur le long terme car il était trop éloigné et aurait été un gaspillage de ressources mieux employées pour un [greenland|E] plus profitable. Ainsi, ce sera un défi d'augmenter la @RICE_vinland_viability_icon! Viabilité [vinlands|E].\n\nLa principale façon d'augmenter la Viabilité [vinlands|E] pendant que la [RICE_greenland_struggle|E] est active passe par deux [decisions|E] : soit en envoyant des [greenland_expeditions|E] au [vinland|E], soit, si votre [dynasty|E] possède un [vinland_outpost|E], de [greenland_supporting|E] le [vinland|E]. Si la [RICE_greenland_struggle|E] a été résolue avec une #P bonne fin#!, alors la Viabilité augmentera de petites quantités aléatoires chaque année jusqu'à atteindre #V 50#! (si elle n'est pas déjà au-dessus)."
 game_concept_struggle_phase_greenland_settlement_simple:1 "Colonie"
 game_concept_struggle_phase_greenland_settlement:1 "Phase de Colonie"
 game_concept_struggle_phase_greenland_settlement_desc:1 "$struggle_RICE_greenland_phase_settlement_desc$"
 game_concept_struggle_phase_greenland_integration_simple:1 "Intégration"
 game_concept_struggle_phase_greenland_integration:1 "Phase d'Intégration"
 game_concept_struggle_phase_greenland_integration_desc:1 "$struggle_RICE_greenland_phase_integration_desc$"
 game_concept_struggle_phase_greenland_subsistence_simple:1 "Subsistance"
 game_concept_struggle_phase_greenland_subsistence:1 "Phase de Subsistance"
 game_concept_struggle_phase_greenland_subsistence_desc:1 "$struggle_RICE_greenland_phase_subsistence_desc$"
 game_concept_struggle_phase_greenland_marginalization_simple:1 "Marginalisation"
 game_concept_struggle_phase_greenland_marginalization:1 "Phase de Marginalisation"
 game_concept_struggle_phase_greenland_marginalization_desc:1 "$struggle_RICE_greenland_phase_marginalization_desc$"
 game_concept_greenland_expedition_s:1 "d'Expédition"
 game_concept_greenland_expeditions:1 "Expéditions"
 game_concept_greenland_expedition:1 "Expédition"
 game_concept_greenland_expedition_desc:1 "Si la [RICE_greenland_struggle|E] est encore en cours, ou a été résolue avec une #P bonne fin#!, les [rulers|E] dont les [houses|E] possèdent une [greenland_estate_long|E] peuvent prendre la [decision|E] d'$RICE_north_atlantic_explore_americas$.\n\nAvant qu'une expédition ne commence, vous devez sélectionner un [greenland_expedition_leader|E]. La chaîne d'événements de l'expédition elle-même est divisée en trois [expedition_episodes|E], qui peuvent avoir des résultats #Bold #P positifs#!#!, #Bold neutres#!, ou #Bold #N négatifs#!#! qui peuvent parfois être influencés par les [skills|E] [greenland_leader_s|E]. Ces résultats, à leur tour, jouent un rôle dans le fait que l'expédition #P réussisse#! ou #N échoue#!.\n\nIl y a trois zones vers lesquelles vous pouvez envoyer l'expédition : [markland|E], [helluland|E], et [vinland|E]. Elles bénéficient toutes (ou, dans le cas du [vinland|E], entravent même) la [greenland_colony|E] de diverses manières."
 game_concept_greenland_great_expedition_s:1 "de Grande Expédition"
 game_concept_greenland_great_expeditions:1 "Grandes Expéditions"
 game_concept_greenland_great_expedition:1 "Grande Expédition"
 game_concept_greenland_great_expedition_desc:1 "Contrairement aux [greenland_expeditions|E] normales, les $game_concept_greenland_great_expeditions$ sont des voyages d'exploration majeurs, correspondant à des événements historiques importants tels que la découverte du [greenland|E] par Erik le Rouge, ou les voyages de Leif Erikson vers [helluland|E], [markland|E] et [vinland|E]. Une seule peut être active à la fois."
 game_concept_greenland_lead:1 "Dirigeant"
 game_concept_greenland_leader_s:1 "du Dirigeant"
 game_concept_greenland_leaders:1 "Dirigeants"
 game_concept_greenland_leader:1 "Dirigeant"
 game_concept_greenland_expedition_leader_s:1 "du Dirigeant d'Expédition"
 game_concept_greenland_expedition_leaders:1 "Dirigeants d'Expédition"
 game_concept_greenland_expedition_leader:1 "Dirigeant d'Expédition"
 game_concept_greenland_expedition_leader_desc:1 "Chaque [greenland_expedition|E] doit se voir attribuer un chef. S'il n'est pas choisi parmi vos [courtiers|E], ou si aucun de vos [courtiers|E] n'est disposé à le faire, le jeu en créera un pour vous au début de l'[greenland_expedition|E].\n\nLe choix du chef est important, car ses compétences peuvent influencer les résultats des [expedition_episodes|E]. Comme on ne sait jamais ce que l'on va rencontrer lors des [greenland_expeditions|E], il est recommandé de choisir des chefs qui sont des touche-à-tout."
 game_concept_expedition_episode_long:1 "Épisode d'Expédition"
 game_concept_expedition_episodes_long:1 "Épisodes d'Expédition"
 game_concept_expedition_episode_s:1 "d'Épisode"
 game_concept_expedition_episode:1 "Épisode"
 game_concept_expedition_episodes:1 "Épisodes"
 game_concept_expedition_episode_long_desc:1 "Chaque [greenland_expedition|E] est divisée en trois \"épisodes\" dont les résultats peuvent être #Bold #P positif#!#!, #Bold neutre#! ou #Bold #N négatif#!#! Parfois, ces résultats peuvent être influencés par les [greenland_expedition_leader_s|E] [skills|E]. Quoi qu'il en soit, ces résultats déterminent si une [greenland_expedition|E] est considérée comme un succès ou un échec."
 game_concept_greenland_estate_s:1 "de Colonie"
 game_concept_greenland_estates:1 "Colonies"
 game_concept_greenland_estate:1 "Colonie"
 game_concept_greenland_estates_long:1 "Colonies du Groenland"
 game_concept_greenland_estate_long:1 "Colonie du Groenland"
 game_concept_greenland_estate_long_desc:1 "Si la [RICE_greenland_struggle|E] est toujours en cours, ou a été résolue avec une #P bonne fin#!, les [rulers|E] dans la [region|E] des [GetGeographicalRegion('RICE_greenland_struggle_region').GetName] peuvent prendre la [decision|E] d' $RICE_north_atlantic_family_estate_greenland$. Cela ajoute le [modifier|E] [GetModifier('RICE_north_atlantic_greenland_family_estate').GetNameWithTooltip] à votre [house|E] et, plus important encore, débloque de nombreuses [decisions|E] et mécaniques liées au [greenland|E].\n\nTant que ce [modifier|E] est actif, chaque membre de la [house|E] recevra chaque année une petite quantité d' [gold|E], [prestige|E] et [piety|E]. Il est également possible de perdre ces ressources, bien que cela ne soit pas aussi courant à moins que la [greenland_colony|E] ne soit dans la [struggle_phase_greenland_subsistence_simple|E] et [struggle_phase_greenland_marginalization|E], et/ou si les @RICE_greenland_resilience_icon! [greenland_resilience|E] ou @RICE_greenland_networks_icon! [greenland_networks|E] [greenlands|E] sont faibles."
 game_concept_greenland_supporting:1 "Soutenir"
 game_concept_greenland_supported:1 "Soutien"
 game_concept_greenland_support:1 "Soutien"
 game_concept_greenland_support_long:1 "Soutien au Groenland"
 game_concept_greenland_support_long_desc:1 "Dans le but d'aider la [RICE_greenland_struggle|E] à réussir, une chose que les [struggle_involved|E] [rulers|E] dans la [region|E] des [GetGeographicalRegion('RICE_greenland_struggle_region').GetName] peuvent faire est de prendre la [decision|E] de $RICE_north_atlantic_support_greenland$. Il existe plusieurs options pour soutenir [greenland|E], de la construction de lieux de culte au recrutement de colons pour s'y rendre. Chaque type de soutien a des avantages différents, mais tous augmenteront soit la @RICE_greenland_resilience_icon! [greenland_resilience|E], soit les @RICE_greenland_networks_icon! [greenland_networks|E] [greenlands|E].\n\nIl existe également une [decision|E] différente pour $RICE_north_atlantic_support_vinland$, qui améliore plutôt la @RICE_vinland_viability_icon! [vinland_viability|E] [vinlands|E]."
 game_concept_vinland_outpost:1 "Avant-poste"
 game_concept_vinland_outposts:1 "Avant-postes"
 game_concept_vinland_outpost_long:1 "Avant-poste du Vinland"
 game_concept_vinland_outposts_long:1 "Avant-postes du Vinland"
 game_concept_vinland_colony:1 "Colonie"
 game_concept_vinland_colonize:1 "Coloniser"
 game_concept_vinland_colony_long:1 "Colonie du Vinland"
 game_concept_vinland_colony_long_desc:1 "S'installer de manière permanente au [vinland|E] n'est pas une tâche facile. C'est même préjudiciable à la durabilité à long terme [greenlands|E], et cela sera probablement extrêmement coûteux et n'apportera que peu de bonus - voire aucun - aux [rulers|E] assez fous pour tenter l'aventure. Après tout, historiquement, la présence nordique au [vinland|E] fut assez éphémère.\n\nSi vous êtes déterminé à coloniser le [vinland|E], cela devra se faire en plusieurs étapes. D'abord, votre [dynasty|E] doit prendre la [decision|E] de $RICE_north_atlantic_build_outpost_vinland$, ce qui donnera à votre [dynasty|E] le [modifier|E] [GetModifier('RICE_north_atlantic_vinland_outpost').GetNameWithTooltip]. Cependant, cela a une chance d'échouer en fonction de la @RICE_vinland_viability_icon! [vinland_viability|E]  [vinlands|E]. Même en cas de succès (basé encore une fois sur la @RICE_vinland_viability_icon! [vinland_viability|E] [vinlands|E]), il y a toujours une chance chaque année que #italic tous#! les avant-postes au [vinland|E] échouent.\n\nAfin d'empêcher cet échec, vous devrez prendre la [decision|E] d'$RICE_north_atlantic_settle_vinland$, ce qui ne peut être fait que par une seule [dynasty|E]. Cependant, cette [decision|E] n'est disponible que si la [RICE_greenland_struggle|E] a été résolue avec une #P bonne fin#!.\n\nEn fin de compte, pour résumer, le [vinland|E] est une entreprise risquée et vous coûtera probablement beaucoup de temps et de ressources. Il est préférable de se concentrer d'abord sur le [greenland|E], puis de se tourner vers le [vinland|E] une fois que la [struggle|E] est réglée."

 # Innovations
 innovation_RICE_dog_sleds:0 "Traîneaux à chiens"
 innovation_RICE_dog_sleds_desc:0 "Dans le Grand Nord, certains chiens ont été élevés et dressés pour tirer des traîneaux sur la neige et même sur la glace. Ces traîneaux se sont avérés efficaces pour voyager, transporter des provisions et chasser sur de grandes distances."
 innovation_RICE_arctic_boats:0 "Bateaux Arctique"
 innovation_RICE_arctic_boats_desc:0 "Dans les régions froides de l'océan Arctique, deux types de navires appelés #italic kayak#! et #italic umiak#! sont utilisés pour transporter des personnes et aider à la chasse aux animaux marins, en particulier les grandes et redoutables baleines."
 innovation_RICE_toggling_harpoons:0 "Basculer les harpons"
 innovation_RICE_toggling_harpoons_desc:0 "Le harpon à bascule est une innovation par rapport au harpon ancien, souvent utilisé dans la chasse maritime. Au lieu d'avoir une seule pointe, il en a deux. L'une est attachée à la base de poussée, et l'autre, qui est détachable, s'emboîte sur la première pointe comme un capuchon. Cela permet au harpon de s'enfoncer beaucoup plus efficacement dans l'animal."
 innovation_RICE_skiing:0 "Ski"
 innovation_RICE_skiing_desc:0 "Les skis sont de fines bandes de bois utilisées pour glisser sur la neige et le terrain gelé. Ils sont utilisés pour les déplacements et le transport, en particulier pendant l'hiver ou dans les régions plus froides où la neige et la glace sont présentes."

