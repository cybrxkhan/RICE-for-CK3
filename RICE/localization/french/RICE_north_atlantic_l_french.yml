 # Aspirations 
 RICE_north_atlantic_aspiration_isleifur_desc:0 "\n\n#bold [historical_aspiration_main_objectives|E]#!\n$EFFECT_LIST_BULLET$Être le [ruler|E] de [GetTitleByKey('d_iceland').GetNameNoTier]\n$EFFECT_LIST_BULLET$[completely_control|E] [GetTitleByKey('d_iceland').GetNameNoTier]\n$EFFECT_LIST_BULLET$Compléter la [decision|E]  $RICE_north_atlantic_skalholt_school$\n$EFFECT_LIST_BULLET$Avoir le [piety_level|E] de [GetModifier( 'piety_level_3' ).GetNameWithTooltip|L] ou plus\n$EFFECT_LIST_BULLET$Rester de [faith|E] chrétienne\n\n#bold Récompenses#!\n$EFFECT_LIST_BULLET$Vous obtenez @piety_icon! #V [EmptyScope.ScriptValue('RICE_aspiration_large_resource_bonus')]#! de [piety|E]\n$EFFECT_LIST_BULLET$Vous obtenez @prestige_icon! #V [EmptyScope.ScriptValue('RICE_aspiration_medium_resource_bonus')]#! de [prestige|E]\n$EFFECT_LIST_BULLET$Chaque [county|E] en [GetGeographicalRegion('custom_iceland').GetName] gagne @development_icon! #V [EmptyScope.ScriptValue('RICE_red_sea_al_umari_aspiration_dev_bonus')]#! de [development|E]\n\n#bold [historical_aspiration_bonus_objectives|E]#!\n$EFFECT_LIST_BULLET$Prendre la [decision|E] de $RICE_normandy_build_minor_christian_holy_building$ et construire soit une grande église soit un grand monastère (Récompense : @prestige_icon! #V [EmptyScope.ScriptValue('RICE_aspiration_medium_resource_bonus')]#!)"
 RICE_north_atlantic_historical_aspiration_action_isleifur: "#italic L'Islande s'est convertie au christianisme il y a plusieurs décennies, mais la christianisation est un processus qui prend du temps. Ayant été nommé premier évêque d'Islande, vous cherchez à utiliser votre éducation pour fournir à l'île les conseils spirituels dont elle a besoin.#!$RICE_north_atlantic_aspiration_isleifur_desc$"
 RICE_north_atlantic_historical_aspiration_modifier_desc_isleifur: "[GetModifier('RICE_north_atlantic_aspiration_cultivate_icelands_church').GetNameWithTooltip]"

