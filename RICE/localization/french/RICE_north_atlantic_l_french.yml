 north_atlantic.0165.t:0 "La grande expédition prend le large"
 north_atlantic.0165.desc.greenland:0 "Aujourd'hui, c'est le grand jour ! La grande expédition que j'ai parrainée est sur le point de partir pour les mers occidentales, afin de voir s'il existe une grande masse continentale à l'ouest de l'Islande."
 north_atlantic.0165.desc.americas:0 "Aujourd'hui, c'est le grand jour ! La grande expédition que j'ai parrainée est sur le point de partir pour les mers occidentales, afin de voir s'il existe d'autres terres au-delà du Groenland."
 north_atlantic.0165.desc.leader_dead:0 "\n\nComme la personne initialement choisie pour diriger cette expédition n'est plus parmi nous, nous avons dû nous démener pour trouver un nouveau chef à la dernière minute. J'ai décidé de choisir un local, [leader.GetFirstName], qui est bien connu comme voyageur et aventurier chevronné. Espérons que [leader.GetSheHe] ne nous décevra pas !"
 north_atlantic.0165.desc:0 "\n\n[leader.GetFirstName], le chef que j'ai choisi pour cette expédition, dit qu'[leader.GetSheHe] a confiance en l'équipage, me rassurant qu'[leader.GetSheHe] fera tout son possible pour noter toute nouvelle terre qu'[leader.GetSheHe] découvrira, en particulier si nous pourrions coloniser ces terres à l'avenir."
 north_atlantic.0165.a:0 "Nous attendons votre retour avec impatience !"
 north_atlantic.0165.tooltip:0 "[leader.GetFirstNameNoTooltip] explorera les mers occidentales pendant au moins un an, voire un peu plus."
 north_atlantic.0166.t:0 "Découverte du Vinland"
 north_atlantic.0166.desc.intro:0 "$north_atlantic.0161.desc$"
 north_atlantic.0166.desc.leader_dead:0 "\n\nJ'ai reçu la triste nouvelle que [leader.GetFirstNameNoTooltip] est décédé[leader.Custom('FR_E')] en explorant les mers à l'ouest du Groenland lors de sa grande expédition, mais son équipage s'est assuré de poursuivre le voyage en l'honneur de sa mémoire.\n\nSelon l'équipage de [leader.GetFirstNamePossessiveNoTooltip], il y a trois autres terres à l'ouest, que [leader.GetSheHe] a nommées #Bold Helluland#!, #Bold Markland#! et #Bold Vinland#!."
 north_atlantic.0166.desc.leader_not_dead:0 "\n\n[leader.GetFirstNameNoTooltip] est revenu sur mes territoires, avec des nouvelles des mers et des terres qu'[leader.GetSheHe] a explorées lors de sa grande expédition pour explorer les mers à l'ouest du Groenland.\n\nSelon [leader.GetFirstNameNoTooltip], il y a trois autres terres à l'ouest ; [leader.GetSheHe] les a nommées #Bold Helluland#!, #Bold Markland#! et #Bold Vinland#!."
 north_atlantic.0166.desc:0 "Le Vinland, la plus fertile de ces trois terres, est aussi la plus éloignée.\n\nNous aurons tout le temps d'explorer davantage ces terres à l'avenir. Qui sait ce que nous pourrions découvrir d'autre ?"
 north_atlantic.0166.a:0 "Quels explorateurs courageux et inspirants !"
 north_atlantic.0167.t:0 "Une grande expédition vers l'Ouest"
 north_atlantic.0167.desc.greenland:0 "Depuis de nombreuses années, des rumeurs circulent au sujet d'une vaste masse terrestre à l'ouest de l'Islande. Pourtant, personne n'a osé investir dans une aventure risquée pour vérifier si de telles histoires sont vraies... jusqu'à maintenant.\n\nDes nouvelles se propagent à travers les mers du nord au sujet d'une expédition, financée par [leif_sponsor.GetTitledFirstName], pour explorer les mers à l'ouest de l'Islande et rechercher de nouvelles terres. L'expédition sera menée par un certain aventurier du nom de [leif_temp.GetFullName].\n\nSi ces terres existent, et si elles s'avèrent posséder un territoire pouvant être colonisé, alors il ne fait aucun doute que [leif_sponsor.GetFirstNameNoTooltip] sera parmi les premiers à établir la présence de sa famille là-bas en fondant une colonie."
 north_atlantic.0167.desc.americas:0 "Suite à la découverte du Groenland par [erik.GetTitledFirstName], on parle désormais de terres situées encore plus à l'ouest, d'après les récits de marins déviés de leur route. Cependant, le Groenland est déjà à une grande distance du reste du monde, et peu voudraient prendre le risque de voyager aussi loin à travers la mer... jusqu'à maintenant.\n\nDes nouvelles se répandent à travers les mers du nord au sujet d'une expédition, financée par [leif_sponsor.GetTitledFirstName], pour explorer les mers occidentales et voir s'il existe des terres au-delà même du Groenland. L'expédition sera menée par un certain aventurier du nom de [leif_temp.GetFullName].\n\nCe dont la plupart des gens doutent n'est pas de savoir si quelque chose peut être trouvé, mais si de telles terres - si elles existent - vaudront la peine d'être colonisées. Bien entendu, il n'y a qu'un seul moyen de le découvrir."
 north_atlantic.0167.a:0 "L'histoire est-elle sur le point de s'écrire ?"
 north_atlantic.0167.tooltip.no_greenland:0 "En supposant que cette [greenland_great_expedition|E] réussisse, la [decision|E] $RICE_north_atlantic_explore_greenland$ est définitivement indisponible pour les autres [rulers|E] dans la [region|E] des  [GetGeographicalRegion('RICE_greenland_struggle_region').GetName]"
 north_atlantic.0167.tooltip.no_vinland:0 "En supposant que cette [greenland_great_expedition|E] réussisse, la [decision|E] $RICE_north_atlantic_explore_vinland$ sera définitivement indisponible pour les autres [rulers|E] dans la [region|E] des [GetGeographicalRegion('RICE_greenland_struggle_region').GetName]"
 north_atlantic.0168.t:0 "xxxxx"
 north_atlantic.0168.desc:0 "xxxxx"
 north_atlantic.0168.a:0 "xxxxx"
