 # Legends
 RICE_greenland_ender_name: "La Colonie du Groenland Réussit"
 RICE_greenland_ender_desc: "Après des années de dur labeur, la colonie du Groenland n'est plus une lutte. Grâce à [struggle_ender.GetFirstName], elle est devenue une partie intégrante et prospère du monde de l'Atlantique Nord."
 RICE_greenland_legend_chapter_opening_struggle: "Longtemps après l'arrivée des premiers colons au Groenland, [ROOT.Legend.GetProtagonist.GetNameNoTooltip] achèverait le processus de [ROOT.Legend.GetProperty( 'struggle' ).GetFlagName] lorsqu'[ROOT.Legend.GetProtagonist.GetSheHe] mena les derniers efforts pour établir ces colonies groenlandaises comme une partie autosuffisante et intégrante de l'Atlantique Nord."
 RICE_greenland_legend_chapter_motivation_struggle: "Bien que le Groenland ait été connecté au reste de l'Eurasie pendant de nombreuses années, [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] savait que la colonie était, malgré les richesses qu'elle générait grâce à l'ivoire de morse, toujours en danger constant, avec la menace d'un effondrement planant de plus en plus. Ainsi, s'il devait y avoir un nouvel avenir pour le Groenland, et si [ROOT.Legend.GetProperty( 'struggle' ).GetFlagName] devait être un succès, la colonie avait besoin de leadership : un leadership que [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] fournit."
 RICE_greenland_legend_chapter_famous_deed_generic: "La légende de [ROOT.Legend.GetProtagonist.GetFirstNamePossessiveNoTooltip|U] est celle d'une aventure héroïque, qui implique à la fois de glorieuses batailles, mais aussi des initiatives dédiées au dialogue et au développement - en d'autres termes, un effort concerté pour construire la colonie du Groenland au-delà de sa raison d'être originelle. Pour survivre, elle devait devenir un centre économique, politique et culturel de l'Atlantique Nord."
 RICE_greenland_legend_chapter_extra_deed_struggle: "[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] a dû faire face à des ennemis de deux sortes. D'abord, bien sûr, ceux qui cherchaient à affaiblir, voire à détruire la colonie et ses amis autochtones, qu'il s'agisse d'ennemis dans les terres du Groenland ou d'ennemis en Europe qui enviaient l'argent qu'elle tirait de ses produits de luxe, comme l'ivoire de morse. Mais il y avait aussi d'autres ennemis. Le climat rigoureux de la colonie est un danger permanent, tout comme les chamailleries des colons et leurs petits différends. Les ambitions insensées de ceux qui souhaitaient naviguer vers le Vinland plutôt que de construire sagement la colonie du Groenland étaient également dangereuses."
 RICE_greenland_legend_chapter_conclusion_ended_struggle: "Il y avait ceux qui pensaient que la colonie du Groenland échouerait, mais [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] leur prouva le contraire. Par sa sagesse et ses conseils, [ROOT.Legend.GetProperty( 'struggle' ).GetFlagName] prit fin lorsque le Groenland s'établit comme une partie intégrante de l'Atlantique Nord, reliant à jamais l'Ancien Monde et le Nouveau Monde."
 RICE_greenland_sunset_invasion_ender_name: "Invasion du crépuscule"
 RICE_greenland_sunset_invasion_ender_desc: "Alors que les peuples indigènes d'Eurasie tentaient en vain de réussir à coloniser le Groenland, il a fallu un véritable dirigeant [struggle_ender.GetCulture.GetName] d'une grande sagesse et d'un grand courage pour unir le monde de l'Atlantique Nord : [struggle_ender.GetFirstName]."
 RICE_greenland_sunset_invasion_legend_chapter_opening_struggle: "Après l'arrivée des premiers colons d'Eurasie pour initier la [ROOT.Legend.GetProperty( 'struggle' ).GetFlagName], les contacts entre les peuples des deux côtés de l'Atlantique se sont intensifiés. Cependant, il a fallu un leader visionnaire, [ROOT.Legend.GetProtagonist.GetNameNoTooltip], pour accomplir ce que ces colons à courte vue ne pouvaient pas, et non seulement réunir l'Atlantique Nord, mais aussi affirmer la souveraineté [ROOT.Legend.GetProperty( 'culture' ).Culture.GetNameNoTooltip] sur ce vaste océan." # not only explore and discover more about the tapestry of pepoles 
 RICE_greenland_sunset_invasion_legend_chapter_motivation_struggle: "Lorsque les peuples natifs de l'Atlantique occidental rencontrèrent pour la première fois les peuples d'Eurasie, leurs interactions furent parfois pacifiques, avec un accroissement du commerce et de la diplomatie. D'autres fois, ces interactions furent moins que pacifiques, avec des colons arrogants du Groenland dénigrant ceux comme les [ROOT.Legend.GetProperty( 'culture' ).Culture.GetNameNoTooltip] en les qualifiant de non-civilisés, de soi-disant \"skraelings\". [ROOT.Legend.GetProtagonist.GetNameNoTooltip] souhaitait prouver que les ennemis des [ROOT.Legend.GetProperty( 'culture' ).Culture.GetCollectiveNounNoTooltip] avaient tort, et renforcer les bons liens avec leurs alliés."
 RICE_greenland_sunset_invasion_legend_chapter_famous_deed_generic:"La légende de [ROOT.Legend.GetProtagonist.GetFirstNamePossessiveNoTooltip|U] est celle d'aventures héroïques, qui impliquent à la fois de glorieuses batailles, mais aussi des initiatives dédiées au dialogue et au développement - en d'autres termes, un effort concerté non seulement pour conquérir et soumettre les ennemis [ROOT.Legend.GetProperty( 'culture' ).Culture.GetCollectiveNounNoTooltip], mais aussi pour bâtir des alliances et des réseaux commerciaux."
 RICE_greenland_sunset_invasion_legend_chapter_extra_deed_struggle:"Alors que [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] accroissait le pouvoir des [ROOT.Legend.GetProperty( 'culture' ).Culture.GetCollectiveNounNoTooltip] de l'autre côté de l'Atlantique, on parlait de [ROOT.Legend.GetProtagonist.GetHerHim] et des [ROOT.Legend.GetProperty( 'culture' ).Culture.GetCollectiveNounNoTooltip] comme d'une \"Invasion du Couchant\". Mais [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] adopta un tel qualificatif, car il semait la peur dans le cœur de ses ennemis, et la joie dans celui de ses amis."
 RICE_greenland_sunset_invasion_legend_chapter_conclusion_ended_struggle: "Après de nombreuses aventures, [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] a mené le peuple [ROOT.Legend.GetProperty( 'culture' ).Culture.GetNameNoTooltip] à dominer complètement l'Atlantique Nord, et à contrôler le passage stratégique du Groenland qui relie ces deux côtés de l'océan. Même leurs ennemis ne les appellent plus \"skraelings\", et parlent désormais d'eux avec un mélange de respect et de crainte. Il ne fait guère de doute que [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] sera un chef dont on se souviendra pendant des générations."
 RICE_vinland_settlement_success_legend_name: "Colonisation du Vinland"
 RICE_vinland_settlement_success_legend_desc: "S'installer au Vinland de façon permanente était un rêve de fous, pour ceux qui n'avaient aucun sens de la réalité économique et de la difficulté pratique d'une telle entreprise. [settler.GetTitledFirstName] était l'un de ces fous. Mais contrairement aux autres fous qui tentèrent de s'installer au Vinland de façon permanente, [settler.GetSheHe] fit ce qu'ils ne purent faire : [settler.GetSheHe] réussit."
 RICE_vinland_settlement_success_legend_chapter_opening_new_title: "Vinland le bon. Vinland le lointain. Le Vinland légendaire. Depuis que les premiers explorateurs ont traversé l'Atlantique en direction de l'ouest à partir du froid Groenland, les histoires et les chuchotements abondent au sujet d'une terre mythique, où poussent le blé autosuffisant et les raisins les plus doux. Néanmoins, les rêves de colonisation de cette terre ne se sont pas concrétisés avant de nombreuses années, car les peuples d'Eurasie ont sagement choisi d'investir dans le Groenland, une importante espèce d'ivoire de morse, à la place."
 RICE_vinland_settlement_success_legend_chapter_motivation_new_title: "[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip], comme certains des aventuriers et voyageurs de l'Atlantique Nord, rêvait des merveilles et des légendes du grand ouest. Contre la sagesse commune, [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] croyait qu'il était possible d'établir une colonie permanente au Vinland. Il croyait que cela pouvait être accompli, si les colons étaient ingénieux, bien financés, et travaillaient de concert avec des alliés autochtones."
 RICE_vinland_settlement_success_legend_chapter_famous_deed_new_title: "La famille de [ROOT.Legend.GetProtagonist.GetFirstNamePossessiveNoTooltip] était impliquée dans la colonie du Groenland depuis de nombreuses années. À ce stade, la colonie était prospère et stable grâce au commerce du morse, et les habitants avaient occasionnellement envoyé des expéditions vers l'extrême ouest pour acquérir des ressources et commercer avec les autochtones locaux. En utilisant ses relations, tant avec ceux vivant au Groenland ou impliqués dans ses affaires, qu'avec les alliés autochtones et partenaires commerciaux de l'extrême ouest, [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] explora soigneusement les côtes du Vinland pour trouver l'endroit parfait où s'établir. Bien que cela prît du temps, grâce à la guidance de [ROOT.Legend.GetProperty( 'faith' ).Faith.HighGodNamePossessive], [ROOT.Legend.GetProtagonist.GetSheHe] trouva une clairière paisible près de la côte, où poussaient certains des fameux raisins et du blé sauvage du Vinland."
 RICE_vinland_settlement_success_legend_chapter_extra_deed_new_title: "Il fallut plus de temps, voire des années, pour attirer davantage de colons et s'assurer que la colonie survivrait là où d'autres tentatives avaient échoué. Les robustes [ROOT.Legend.GetProperty( 'culture' ).Culture.GetCollectiveNounNoTooltip] qui constituaient la majorité des colons firent de leur mieux pour survivre et être autosuffisants, tout en maintenant de bonnes relations avec leurs alliés autochtones. Bien que ce fût difficile, la colonie commença à prospérer, et une nouvelle aube se leva sur le Vinland."
 RICE_vinland_settlement_success_legend_chapter_conclusion_new_title:0 "Il y avait ceux qui doutaient de [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] et de son aventure téméraire au Vinland. En effet, beaucoup d'autres avaient échoué avant. Cependant, [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] n'était pas comme les autres. [ROOT.Legend.GetProtagonist.GetSheHe|U] était un véritable enfant du monde toujours connecté, toujours prospère de l'Atlantique Nord, le genre de personne qui pouvait faire réussir la colonie du Vinland. Bien qu'il soit peu probable que le Vinland devienne un jour un acteur majeur sur la scène mondiale, comme le Groenland, l'histoire de la façon dont il a relié les peuples de deux continents, grâce à l'esprit pionnier et aventurier de [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip], sera racontée pour les générations à venir."

