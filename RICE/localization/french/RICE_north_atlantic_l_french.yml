 RICE_north_atlantic_send_to_americas_yes_vinland_desc:0 "Envoyer [recipient.GetShortUINameNoTooltip] au [greenland|E] ou au [vinland|E]"
 RICE_north_atlantic_send_greenland_close_family:0 "Puisque [recipient.GetTitledFirstName] est un [family_member|E], vous gagnerez plus de [prestige|E] et de [dynasty_prestige|E], et vous déclencherez un plus gros [struggle_catalyst|E]"
 RICE_north_atlantic_exile_americas_resilience_change:0 "La @RICE_greenland_resilience_icon! [greenland_resilience|E] [greenlands|E] augmente de #V [actor.MakeScope.Var('RICE_exile_courtier_global_resource_increase').GetValue]#! pour atteindre @RICE_greenland_resilience_icon! #V [GetGlobalVariable('RICE_greenland_resilience').GetValue|0]#!"
 RICE_north_atlantic_exile_americas_networks_change:0 "Les @RICE_greenland_networks_icon! [greenland_networks|E] [greenlands|E] augmentent de #V [actor.MakeScope.Var('RICE_exile_courtier_global_resource_increase').GetValue]#! pour atteindre @RICE_greenland_networks_icon! #V [GetGlobalVariable('RICE_greenland_networks').GetValue|0]#!"
 RICE_north_atlantic_exile_americas_viability_change:0 "La @RICE_vinland_viability_icon! [vinland_viability|E] [vinlands|E] augmente de #V [actor.MakeScope.Var('RICE_exile_courtier_global_resource_increase').GetValue]#! pour atteindre @RICE_vinland_viability_icon! #V [GetGlobalVariable('RICE_vinland_viability').GetValue|0]#!"
 RICE_north_atlantic_send_americas_resilience_change:0 "La @RICE_greenland_resilience_icon! [greenland_resilience|E] [greenlands|E] augmente de #V [actor.MakeScope.Var('RICE_send_courtier_global_resource_increase').GetValue]#! pour atteindre @RICE_greenland_resilience_icon! #V [GetGlobalVariable('RICE_greenland_resilience').GetValue|0]#!"
 RICE_north_atlantic_send_americas_networks_change:0 "Les @RICE_greenland_networks_icon! [greenland_networks|E] [greenlands|E] augmentent de #V [actor.MakeScope.Var('RICE_send_courtier_global_resource_increase').GetValue]#! pour atteindre @RICE_greenland_networks_icon! #V [GetGlobalVariable('RICE_greenland_networks').GetValue|0]#!"
 RICE_north_atlantic_send_americas_viability_change:0 "La @RICE_vinland_viability_icon! [vinland_viability|E] [vinlands|E] augmente de #V [actor.MakeScope.Var('RICE_send_courtier_global_resource_increase').GetValue]#! pour atteindre @RICE_vinland_viability_icon! #V [GetGlobalVariable('RICE_vinland_viability').GetValue|0]#!"
