 north_atlantic.expedition.intro.helluland:0 "Un oiseau messager m'apporte un message de [leader.GetTitledFirstName], avec des nouvelles de son expédition au Helluland."
 north_atlantic.expedition.intro.markland:0 "Un oiseau messager m'apporte un message de [leader.GetTitledFirstName], avec des nouvelles de son expédition au Markland."
 north_atlantic.expedition.intro.vinland:0 "Un oiseau messager m'apporte un message de [leader.GetTitledFirstName], avec des nouvelles de son expédition au Vinland."
 north_atlantic.expedition.intro.continue:0 "Je continue à lire le message.\n\n"
 north_atlantic.expedition.skill.diplomacy:0 "Les chances de réussite de cette option dépendent de votre [greenland_expedition_leader_s|E] [diplomacy_skill|E]."
 north_atlantic.expedition.skill.martial:0 "Les chances d'une issue favorable pour cette option dépendent de la [martial_skill|E] de votre [greenland_expedition_leader_s|E]."
 north_atlantic.expedition.skill.stewardship:0 "Les chances d'une issue favorable pour cette option dépendent de l'[stewardship_skill|E] de votre [greenland_expedition_leader_s|E]."
 north_atlantic.expedition.skill.intrigue:0 "Les chances d'une issue favorable pour cet [expedition_episodes|E] dépendent de l'[intrigue_skill|E] de votre [greenland_expedition_leader_s|E]."
 north_atlantic.expedition.skill.learning:0 "Les chances de réussite de cette option dépendent de votre [greenland_expedition_leader_s|E] [learning_skill|E]."
 north_atlantic.expedition.skill.prowess:0 "Les chances de réussite de cette option dépendent de votre [greenland_expedition_leader_s|E] [prowess_skill|E]."
 north_atlantic.expedition.result.intro:0 "\nEn raison de l'issue de cet [expedition_episode_s|E], vous pourriez recevoir un ou plusieurs des éléments suivants au retour de l'[greenland_expedition|E] :"
 north_atlantic.expedition.result.artifact:0 "Un [artifact|E]"
 north_atlantic.expedition.result.modifiers:0 "[character_modifiers|E] Bénéfique "
