 RICE_north_atlantic_great_walrus_hunt_option_tooltip:0 "#V #Bold Coût minimum : @gold_icon! [GetGlobalVariable('RICE_global_walrus_hunt_great_cost').GetValue|0]#!#!\n\n$EFFECT_LIST_BULLET$Gagnez entre @gold_icon! #V [GetGlobalVariable('RICE_global_walrus_hunt_min_gain').GetValue]#! et @gold_icon! #V [GetGlobalVariable('RICE_global_walrus_hunt_great_max_gain').GetValue]#! #italic si#! la chasse réussit (#P +50%#! du montant de base)\n$EFFECT_LIST_BULLET$Augmente les chances de réussite de la chasse de #P +20%#!"
