 north_atlantic.expedition.result.courtier:0 "Un [courtier|E] de la [culture|E] locale impliqué dans cette [expedition_episode|E]"
 north_atlantic.expedition.result.good:0 "Cet [expedition_episode|E] de l'[greenland_expedition|E] se termine par une issue #P #Bold favorable#!#!. $north_atlantic.expedition.success_failure_counter$. Si l'[greenland_expedition|E] compte plus de bons que de mauvais [expedition_episodes|E], ou au moins autant, elle sera considérée comme un #P succès#!."
 north_atlantic.expedition.result.bad:0 "Cet [expedition_episode|E] de l'[greenland_expedition|E] se termine par un résultat #N #Bold mauvais#!#!. $north_atlantic.expedition.success_failure_counter$. Si l'[greenland_expedition|E] a plus de mauvais [expedition_episodes|E] que de bons, alors elle sera considérée comme un #N échec#!."
 north_atlantic.expedition.result.neutral:0 "Cet [expedition_episode|E] de l'[greenland_expedition|E] se termine par un résultat #Bold neutre#! . $north_atlantic.expedition.success_failure_counter$. L'[greenland_expedition|E] nécessite plus de bons que de mauvais [expedition_episodes|E], ou au moins un nombre égal, pour être considérée comme un succès plutôt qu'un échec."
 north_atlantic.0040.t:0 "Expédition : De nouveaux amis ?"
 north_atlantic.0040.desc:0 "Selon le message, [leader.GetSheHe] est entré[leader.Custom('FR_E')] en contact avec un petit groupe d'autochtones, mené par un certain [native_leader.GetTitledFirstName]. Malgré la barrière de la langue, il semble que ces autochtones aient des intentions pacifiques et souhaitent commercer.\n\nLes membres de l'expédition de [leader.GetFirstNamePossessiveNoTooltip] sont divisés sur la marche à suivre. Certains ne veulent donner aux autochtones aucune arme ni outil qui pourrait être utilisé contre nous. D'autres arguent qu'il est important de gagner la confiance des autochtones, et de voir quels objets de valeur ils pourraient vouloir échanger. D'autres encore estiment que ces autochtones sont naïfs, et qu'il vaudrait mieux simplement les voler ou les kidnapper. Je me demande ce que [leader.GetFirstNameNoTooltip] a décidé de faire ?"
 north_atlantic.0040.a:0 "Je pense qu'[leader.GetSheHe] a sagement essayé de commercer avec le peuple de [native_leader.GetFirstNamePossessiveNoTooltip]"
 north_atlantic.0040.a.failure:0 "[leader.GetFirstNameNoTooltip] échoue à négocier un accord commercial acceptable pour les deux parties"
 north_atlantic.0040.a.success:0 "[leader.GetFirstNameNoTooltip] parvient à conclure un accord commercial acceptable pour les deux parties"
 north_atlantic.0040.b:0 "[leader.GetSheHe|U] a sûrement été prudent[leader.Custom('FR_E')], refusant de commercer avant de partir."
 north_atlantic.0040.c:0 "Vous savez, je [leader.GetHerHim] soupçonne d'avoir fait des enlèvements et des vols...."
 north_atlantic.0040.c.failure.battle:0 "[leader.GetFirstNameNoTooltip] échoue de manière spectaculaire, entraînant une bataille entre les deux camps."
 north_atlantic.0040.c.failure.get_away:0 "[leader.GetFirstNameNoTooltip] échoue mais [leader.GetSheHe] et son équipage parviennent à fuir"
 north_atlantic.0040.c.success.steal:0 "[leader.GetFirstNameNoTooltip] parvient à dérober des objets de valeur appartenant au peuple [native_leader.GetFirstNamePossessiveNoTooltip]"
 north_atlantic.0040.c.success.kidnap:0 "[leader.GetFirstNameNoTooltip] kidnappe avec succès quelqu'un de la bande de [native_leader.GetFirstNamePossessiveNoTooltip]"
 north_atlantic.0041.t:0 "Expédition : Accord commercial"
 north_atlantic.0041.desc.success:0 "Bien que [leader.GetFirstName] et son équipage aient eu des difficultés à communiquer avec [native_leader.GetFirstName] et son peuple au début, ils ont finalement réussi à parvenir à une sorte d'entente. Les deux parties ont convenu d'échanger divers biens : nous leur avons donné du tissu, de la ferraille, et ainsi de suite, tandis qu'ils nous ont donné une partie de leur art, des fourrures, des outils en bois et divers bibelots.\n\n[leader.GetFirstNameNoTooltip] me dit que si l'expédition revient avec succès, [leader.GetSheHe] me montrera les biens qu'[leader.GetSheHe] a acquis[leader.Custom('FR_E')] de ces étrangers. Tout compte fait, la rencontre fut un succès, et [leader.GetSheHe] est reparti[leader.Custom('FR_E')] avec le sentiment d'avoir trouvé un[native_leader.Custom('FR_E')] bo[native_leader.Custom('FR_NNne')] ami[native_leader.Custom('FR_E')] en [native_leader.GetFirstNameNoTooltip]."
 north_atlantic.0041.desc.failure:0 "[leader.GetFirstName] et son équipage ont eu des difficultés à communiquer avec [native_leader.GetFirstName] et son peuple, si bien qu'au final, aucun des deux camps ne parvint à un quelconque accord. [leader.GetFirstNameNoTooltip] ne ressentit heureusement aucune hostilité de la part de [native_leader.GetFirstNameNoTooltip] et son peuple, mais aucune cordialité non plus.\n\nAprès un moment de gêne, [native_leader.GetFirstNameNoTooltip] et son peuple partirent, et [leader.GetFirstNameNoTooltip] et son équipage retournèrent à leurs navires. Dans son message, [leader.GetFirstNameNoTooltip] exprime son inquiétude quant à d'éventuels malentendus futurs, voire des conflits, si nous rencontrons les mêmes habitants de la région."
 north_atlantic.0041.a:0 "J'espère que nous trouverons d'autres personnes amicales comme [native_leader.GetFirstNameNoTooltip] !"
 north_atlantic.0041.b:0 "Un résultat malheureux."
 north_atlantic.0042.t:0 "Expédition : Vol"
 north_atlantic.0042.desc.battle:0 "[leader.GetFirstName] et son équipage localisèrent et explorèrent la zone où [native_leader.GetFirstName] et ses gens campaient. Ils dérobèrent ensuite quelques objets appartenant aux étrangers, mais furent repérés alors qu'ils tentaient de quitter les lieux.\n\nÀ leur grande surprise, les gens de [native_leader.GetFirstNamePossessiveNoTooltip] réagirent rapidement, brandissant des armes redoutables et décochant de nombreuses flèches contre eux depuis leurs arcs. Il est désormais clair que ces étrangers, bien que pacifiques, n'étaient pas étrangers au combat !\n\n[leader.GetFirstNameNoTooltip] et son équipage battirent en retraite vers leurs navires aussi vite qu'ils le purent, subissant quelques pertes en chemin. Son message se conclut par [leader.GetHerHim] disant que [leader.GetSheHe] espère ne plus jamais rencontrer ces étrangers."
 north_atlantic.0042.desc.get_away:0 "[leader.GetFirstName] et son équipage ont localisé et exploré la zone où [native_leader.GetFirstName] et son peuple campaient. Ils ont ensuite dérobé certains objets des étrangers, mais furent repérés alors qu'ils tentaient de quitter les lieux.\n\nHeureusement, il semble que [native_leader.GetFirstNameNoTooltip] et son peuple furent pris par surprise et ne surent pas comment réagir à cette traîtrise dans un premier temps. Cela donna à [leader.GetFirstName] et son équipage tout juste assez de temps pour courir vers leurs navires et s'échapper. Bien qu'ils aient échoué, au moins ils s'en sont sortis sains et saufs !"
 north_atlantic.0042.desc.steal:0 "Par la ruse et la tromperie, [leader.GetFirstName] et son équipage ont réussi à dérober quelques objets à la bande de [native_leader.GetFirstNamePossessive], ces naïfs n'y ayant vu que du feu. Ils ont également envisagé d'enlever l'un des membres du groupe de [native_leader.GetFirstNamePossessiveNoTooltip], mais ont jugé que c'était trop risqué.\n\nAprès avoir entreposé le butin sur leurs navires, [leader.GetFirstNameNoTooltip] et son équipage ont pris la fuite et quitté la zone. Il ne fait aucun doute que [native_leader.GetFirstNameNoTooltip] finira par découvrir ce qui s'est passé, aussi [leader.GetFirstNameNoTooltip] espère que [leader.GetSheHe] ne rencontrera plus jamais ce groupe d'étrangers."
 north_atlantic.0042.desc.kidnap:0 "Par la ruse et la tromperie, [leader.GetFirstName] et son équipage ont réussi à voler quelques objets à la bande de [native_leader.GetFirstNamePossessive], sans que ces naïfs imbéciles ne s'en aperçoivent. De plus, ils sont parvenus à isoler un membre solitaire du groupe de [native_leader.GetFirstNamePossessiveNoTooltip] et à kidnapper cette personne, l'emmenant sur leur navire contre sa volonté.\n\nPar la suite, [leader.GetFirstNameNoTooltip] et son équipage ont fui la zone. Il ne fait aucun doute que [native_leader.GetFirstNameNoTooltip] finira par découvrir ce qui s'est passé, alors [leader.GetFirstNameNoTooltip] espère qu'[leader.GetSheHe] ne rencontrera plus jamais ce groupe d'étrangers."
 north_atlantic.0042.a:0 "Splendide travail ! J'ai hâte de voir ce que [leader.GetFirstNameNoTooltip] a pillé."
 north_atlantic.0042.b:0 "Comment [leader.GetFirstNameNoTooltip] a-t-il pu trahir des gens aussi sympathiques ?!"
 north_atlantic.0042.c:0 "Hélas, [leader.GetFirstNameNoTooltip] aurait dû connaître les risques !"
 north_atlantic.0043.t:0 "Expédition : Un étranger"
 north_atlantic.0043.desc:0 "En longeant la côte d'une zone inconnue, [leader.GetFirstName] débarqua sur une plage, pour y rencontrer un[native.Custom('FR_E')] [native.GetWomanMan] blotti[native.Custom('FR_E')] près d'un feu de camp. [native.GetSheHe|U] n'avait pas l'air [ROOT.Char.GetCulture.GetName], et portait d'étranges vêtements.\n\nMalgré la barrière de la langue, [leader.GetFirstNameNoTooltip] parvint à comprendre ce qui était arrivé à ce[native.Custom('FR_EEtte')] [native.GetWomanMan], nommé[native.Custom('FR_E')][native.GetFirstName]. [native.GetSheHe|U] venait d'une tribu du peuple [native.GetCulture.GetName], mais avait été séparé[native.Custom('FR_E')] de son groupe pour une raison quelconque et se retrouvait désormais seul[native.Custom('FR_E')]. Peut-être avait-[native.GetSheHe] été ostracisé[native.Custom('FR_E')], ou était [native.GetHerHim] dernier[native.Custom('FR_E')] survivant[native.Custom('FR_E')] d'une attaque ennemie, ou [native.GetSheHe] avait subi quelque autre calamité.\n\nJe me demande, comment [leader.GetFirstNameNoTooltip] a-t-[leader.GetSheHe] réagi[leader.Custom('FR_E')] face à cela ?"
 north_atlantic.0043.a:0 "Je sais que [leader.GetSheHe] aurait gentiment donné à [native.GetFirstNameNoTooltip] quelques provisions."
 north_atlantic.0043.b:0 "Évidemment, [leader.GetSheHe] aurait emmené [native.GetFirstNameNoTooltip] de force avec [leader.GetHerHim]."
 north_atlantic.0043.c:0 "[leader.GetSheHe|U] a définitivement laissé cet étranger indigne de confiance à son destin."
 north_atlantic.0043.a.failure.refuse:0 "[native.GetFirstNameNoTooltip] n'accepte pas [leader.GetFirstNamePossessiveNoTooltip] générosité."
 north_atlantic.0043.a.failure.not_alone:0 "Il s'avère que [native.GetFirstNameNoTooltip] n'est pas seul, et pas dans le bon sens du terme."
 north_atlantic.0043.a.success.accept:0 "[native.GetFirstNameNoTooltip] accepte la générosité du [leader.GetFirstNamePossessiveNoTooltip] et lui fournit en retour des fournitures ou des connaissances."
 north_atlantic.0043.a.success.not_alone:0 "Il s'avère que [native.GetFirstNameNoTooltip] n'est pas seul[native.Custom('FR_E')], mais dans le bon sens du terme."
 north_atlantic.0043.a.success.join:0 "[native.GetFirstNameNoTooltip] décide de rejoindre l'expédition [leader.GetFirstNamePossessiveNoTooltip]."
 north_atlantic.0043.b.failure.escape:0 "[native.GetFirstNameNoTooltip] parvient à résister et à s'enfuir."
 north_atlantic.0043.b.failure.not_alone:0 "Il s'avère que [native.GetFirstNameNoTooltip] n'est en fait pas seul[native.Custom('FR_E')], et est secouru[native.Custom('FR_E')] par sa tribu."
 north_atlantic.0043.b.success.loot:0 "[leader.GetFirstNameNoTooltip] ne parvient pas à capturer [native.GetFirstNameNoTooltip], mais pille certains de ses biens."
 north_atlantic.0043.b.success.capture:0 "[leader.GetFirstNameNoTooltip] capture avec succès [native.GetFirstNameNoTooltip]."
 north_atlantic.0044.t:0 "Expédition : Un bon samaritain"
 north_atlantic.0044.desc.refuse:0 "Malgré les efforts de [leader.GetFirstNamePossessive], [native.GetFirstName] ne voulait pas d'aide et rejeta toute tentative de lui fournir des provisions. Peut-être que [native.GetFirstName] avait mal compris, ou se méfiait d'inconnus lui offrant des choses.\n\nPendant que [leader.GetFirstNameNoTooltip] et son équipage délibéraient sur la marche à suivre, il s'avéra que [native.GetFirstNameNoTooltip] profita de ce temps pour s'éclipser discrètement. [leader.GetFirstNameNoTooltip] ne trouva aucune trace de [native.GetFirstNameNoTooltip] en fouillant les environs, et [leader.GetSheHe] n'eut d'autre choix que de poursuivre l'expédition."
 north_atlantic.0044.desc.not_alone_bad:0 "Alors que [leader.GetFirstName] tentait d'expliquer ses bonnes intentions à [native.GetFirstName], l'étranger semblait réticent à accepter les provisions. Avant qu'ils ne puissent parvenir à un accord, cependant, des cris de guerre terrifiants et des bruits démoniaques surgirent de nulle part, et d'étranges guerriers fondirent sur eux !\n\n[leader.GetFirstNameNoTooltip] et son équipage, pris par surprise, durent battre en retraite vers leurs navires et partir. Heureusement, leurs blessures et pertes furent peu nombreuses.\n\nEn raison de la nature soudaine et chaotique de cette attaque, [leader.GetFirstNameNoTooltip] ne put déterminer si ces étranges guerriers étaient des amis ou des proches de [native.GetFirstNameNoTooltip] qui pensaient que [leader.GetSheHe] et son équipage avaient de mauvaises intentions, ou s'il s'agissait d'ennemis qui en avaient après [native.GetFirstNameNoTooltip] et voulaient [native.GetHerHim] tuer ainsi que quiconque semblait être son ami."
 north_atlantic.0044.desc.accept:0 "[native.GetFirstName] fut naturellement prudent[native.Custom('FR_E')] au début, mais finalement, [native.GetSheHe] accepta les provisions que [leader.GetFirstName] lui offrit, que ce soit par désespoir, parce qu'[native.GetSheHe] fut convaincu[native.Custom('FR_E')] des bonnes intentions de [leader.GetFirstNamePossessiveNoTooltip], ou les deux.\n\n[native.GetFirstName] fournit alors à l'expédition quelques objets en retour. De plus, [leader.GetFirstName] et son équipage demandèrent ensuite à [native.GetFirstNameNoTooltip] des informations sur cette terre et sur son peuple, les [native.GetCulture.GetCollectiveNoun]. Bien que la communication fût difficile en raison de la barrière de la langue, [leader.GetFirstNameNoTooltip] pense que [native.GetFirstNameNoTooltip] nous a fourni des informations utiles qui pourraient être d'une grande aide à l'avenir si nous envoyons d'autres expéditions dans cette région."
 north_atlantic.0044.desc.not_alone_good:0 "[leader.GetFirstName] fit de son mieux pour expliquer à [native.GetFirstName] qu'[leader.GetSheHe] voulait l'aider en [native.GetHerHim] fournissant quelques provisions. Cependant, ils furent interrompus lorsqu'ils entendirent des voix fortes s'approcher d'eux.\n\nIl s'avéra que c'étaient d'autres [native.GetCulture.GetName] qui ressemblaient à [native.GetFirstNameNoTooltip], peut-être ses amis ou sa famille. Ces étrangers semblèrent hostiles au début, peut-être parce qu'ils pensaient que [leader.GetFirstNameNoTooltip] était un ennemi, mais [native.GetFirstNameNoTooltip] parvint à les calmer !\n\nPar la suite, les deux parties s'engagèrent dans un peu de commerce, avant de se séparer en bons termes. [leader.GetFirstName] dit que ces habitants étaient, dans l'ensemble, un peuple très amical bien que prudent."
 north_atlantic.0044.desc.join:0 "[native.GetFirstName] fut naturellement prudent[native.Custom('FR_E')] au début, mais finalement, [native.GetSheHe] accepta les provisions que [leader.GetFirstName] lui offrit, que ce soit par désespoir, parce qu'[native.GetSheHe] fut convaincu[native.Custom('FR_E')] des bonnes intentions de [leader.GetFirstNamePossessiveNoTooltip], ou les deux.\n\nDe plus, à mesure que [native.GetFirstNameNoTooltip] commençait à se sentir plus à l'aise autour de [leader.GetFirstNameNoTooltip] et de son équipage, [native.GetSheHe] sembla indiquer par des gestes et des mots inintelligibles qu'[native.GetSheHe] voulait se joindre à eux. [native.GetSheHe] n'avait nulle part où aller et sentait qu'[native.GetSheHe] n'avait guère le choix, ou était-[native.GetSheHe] curieux et voulait voyager, ou une combinaison des deux ?\n\n[leader.GetFirstNameNoTooltip] conclut le message en disant qu'[leader.GetSheHe] n'est pas sûr[leader.Custom('FR_E')] que j'approuverais, mais qu'[leader.GetSheHe] a décidé de laisser [native.GetFirstNameNoTooltip] les accompagner. Peut-être rencontrerons-nous d'autres [native.GetCulture.GetName] comme [native.GetFirstNameNoTooltip] à l'avenir !"
 north_atlantic.0044.a:0 "Quelle affaire confuse !"
 north_atlantic.0044.b:0 "Je suis content que ça ait marché !"
 north_atlantic.0044.c:0 "[native.GetFirstNameNoTooltip] seront les bienvenus dans ma cour !"
 north_atlantic.0044.d:0 "Pourquoi ? Pourquoi [leader.GetFirstNameNoTooltip] ferait-il confiance à cet étranger ?"
 north_atlantic.0045.t:0 "Expédition : Un enlèvement"
 north_atlantic.0045.desc.escape:0 "[leader.GetFirstName] a tenté d'attirer [native.GetFirstName] dans un faux sentiment de sécurité, lui promettant de la nourriture et d'autres provisions, dans le but de kidnapper [native.GetHerHim]. Cependant, [native.GetFirstNameNoTooltip] n'était ni assez naïf ni assez désespéré.\n\nQuand [leader.GetFirstNameNoTooltip] a tenté de s'emparer de [native.GetFirstNameNoTooltip] par la force, l'étranger a réussi à s'échapper, et non sans emporter une partie des provisions de [leader.GetFirstNamePossessiveNoTooltip] ! [leader.GetFirstNameNoTooltip] sent qu'[leader.GetSheHe] a mal évalué toute la situation, et admet qu'[leader.GetSheHe] est responsable de son échec à capturer cet étranger."
 north_atlantic.0045.desc.not_alone:0 "[leader.GetFirstName] a tenté d'attirer [native.GetFirstName] dans un faux sentiment de sécurité, en promettant à [native.GetHerHim] de la nourriture et d'autres provisions, dans le but de kidnapper [native.GetHerHim]. Cependant, avant que quoi que ce soit ne se produise, des cris de guerre terrifiants et des bruits démoniaques ont surgi de nulle part, et d'étranges guerriers se sont jetés sur eux !\n\nIl est clair que [native.GetFirstNameNoTooltip] n'était pas seule après tout, et soit [native.GetSheHe] a menti à [leader.GetFirstNameNoTooltip], soit il y a eu un malentendu. Quoi qu'il en soit, [leader.GetFirstNameNoTooltip] et son équipage, pris par surprise, ont dû se replier vers leurs vaisseaux et partir. Heureusement, il n'y a eu que peu de blessés et de morts."
 north_atlantic.0045.desc.loot:0 "[leader.GetFirstName] a tenté d'attirer [native.GetFirstName] dans un faux sentiment de sécurité, lui promettant de la nourriture et d'autres provisions, dans le but de kidnapper [native.GetHerHim]. Cependant, [native.GetFirstNameNoTooltip] n'était ni assez naïf ni assez désespéré.\n\n[leader.GetFirstNameNoTooltip] a peut-être déclenché le piège trop tôt, ou [native.GetFirstNameNoTooltip] a opposé plus de résistance que prévu, et l'étranger a réussi à s'échapper. Néanmoins, dans sa précipitation à fuir, [native.GetFirstNameNoTooltip] a laissé derrière [native.GetHerHim] certains de ses objets et bibelots à son campement, que [leader.GetFirstNameNoTooltip] a pillés. [leader.GetSheHe|U] dit qu'[leader.GetSheHe] me montrera ces objets et bibelots au retour de cette expédition."
 north_atlantic.0045.desc.capture:0 "[leader.GetFirstName] a attiré [native.GetFirstName] dans un faux sentiment de sécurité, lui promettant de la nourriture et d'autres provisions, dans une tentative de kidnapper [native.GetHerHim]. Soit cet étranger était trop naïf, trop désespéré, ou les deux, et [native.GetSheHe] a suivi [leader.GetFirstNameNoTooltip] jusqu'à son navire, et ensuite ils ont pris la mer.\n\n[leader.GetFirstNameNoTooltip] dit que [native.GetFirstNameNoTooltip] est contrarié par ce qui s'est passé, mais c'était à prévoir. [leader.GetSheHe|U] espère que lorsque l'expédition reviendra, je pourrai rencontrer [native.GetFirstNameNoTooltip] moi-même !"
 north_atlantic.0045.a:0 "Je m'attendais à mieux de la part de [leader.GetFirstNameNoTooltip]."
 north_atlantic.0045.b:0 "Je suis sûr que cela a dû être un défi pour [leader.GetFirstNameNoTooltip]."
 north_atlantic.0045.c:0 "Comment [leader.GetFirstNameNoTooltip] peut-il kidnapper quelqu'un sans provocation ?"
 north_atlantic.0046.t:0 "Expédition : Marins naufragés"
 north_atlantic.0046.desc:0 "Ils naviguaient le long des côtes d'une terre inconnue quand, à leur grande surprise, ils ont trouvé une épave sur le rivage. À leur grande surprise, un certain nombre de marins [ROOT.Char.GetCulture.GetName] s'y trouvaient également.\n\nSelon le capitaine du navire, [sailor.GetFirstName], ils faisaient partie de l'équipage d'un navire de commerce qui naviguait vers et depuis le Groenland, mais ils ont été détournés de leur route. Leurs réserves s'amenuisant, ils craignaient de ne jamais rencontrer de visages amicaux ou de ne jamais revoir leur terre natale.\n\nQuoi qu'il en soit, une partie de la cargaison que ces marins transportaient a réussi à survivre au naufrage. Ils ont donc aidé [leader.GetFirstNameNoTooltip] à récupérer ce qui restait avant de rejoindre son équipage."
 north_atlantic.0046.a:0 "Une fin heureuse pour une fois !"
 north_atlantic.0047.t:0 "Expédition : Pris dans une tempête"
 north_atlantic.0047.desc:0 "Selon [leader.GetFirstName], ils ont été pris dans une tempête plutôt terrible, si terrible que beaucoup de membres de l'équipage ont cru qu'ils allaient mourir sur-le-champ. Peut-être que [ROOT.Char.GetFaith.WaterGodName] a entendu leurs prières, car la tempête a fini par se dissiper.\n\nCependant, après coup, [leader.GetFirstNameNoTooltip] a noté qu'[leader.GetSheHe] avait perdu une partie de son équipage, et même quelques navires. Cela entravera sans aucun doute leur capacité à mener l'expédition, mais [leader.GetFirstNameNoTooltip] jure qu'ils poursuivront le voyage quoi qu'il arrive."
 north_atlantic.0047.a:0 "Quelle terrifiante épreuve !"
 north_atlantic.0048.t:0 "Expédition : Personne disparue"
 north_atlantic.0048.desc:0 "[leader.GetFirstNameNoTooltip] rapporte qu'ils campaient dans une partie du Vinland depuis plusieurs jours. Pendant ce temps, [leader.GetFirstNameNoTooltip] envoyait occasionnellement des groupes d'éclaireurs pour chercher de la nourriture et explorer la région.\n\nUn soir, l'un des éclaireurs de [leader.GetFirstNamePossessiveNoTooltip], [tyrker.GetFirstName], ne revint pas au camp avec son groupe. C'était, bien entendu, un événement des plus étranges.\n\nBien que l'heure fût tardive, [leader.GetFirstNameNoTooltip] et plusieurs membres de l'équipage voulurent partir à la recherche de [tyrker.GetFirstNamePossessiveNoTooltip]. D'autres membres de l'équipage, cependant, dirent que [tyrker.GetFirstNameNoTooltip] était probablement simplement en retard et reviendrait bientôt."
 north_atlantic.0048.a:0 "Je pense que [leader.GetFirstNameNoTooltip] a cherché [tyrker.GetFirstNameNoTooltip]."
 north_atlantic.0048.a.failure:0 "[leader.GetFirstNameNoTooltip] est incapable de retrouver [tyrker.GetFirstNameNoTooltip]."
 north_atlantic.0048.a.success:0 "[leader.GetFirstNameNoTooltip] découvre ce que fait [tyrker.GetFirstNameNoTooltip]."
 north_atlantic.0048.b:0 "Je suis sûr que [tyrker.GetFirstNameNoTooltip] est revenu plus tard, et qu'aucune recherche n'a été nécessaire."
 north_atlantic.0049.t.found:0 "Expédition : Les raisins !"
 north_atlantic.0049.t.lost:0 "Expédition : Perdue"
 north_atlantic.0049.desc.found:0 "[leader.GetFirstName] raconte que [leader.GetSheHe] et son équipage se sont immédiatement mis à chercher [tyrker.GetFirstName], bien que l'heure fût déjà tardive. Heureusement, ils n'avaient pas été bien loin quand ils trouvèrent [tyrker.GetWomanMan] disparu[tyrker.Custom('FR_E')] dans un état d'excitation et, curieusement, d'ébriété. Au début, [leader.GetFirstNameNoTooltip] était très en colère, mais [tyrker.GetFirstNameNoTooltip] expliqua qu'[tyrker.GetSheHe] avait fait une découverte incroyable : des raisins sauvages !\n\nTout le monde connaît la légende de comment le Vinland reçut son nom de [leif.GetTitledFirstNameNicknamed] quand son équipage y trouva des raisins. Cependant, trouver des raisins au Vinland est plus facile à dire qu'à faire, alors [leader.GetFirstNameNoTooltip] est content que [tyrker.GetFirstNameNoTooltip] ait réussi à en trouver par hasard.\n\nQuoi qu'il en soit, [leader.GetFirstNameNoTooltip] a conclu son message en disant que [leader.GetSheHe] me rapportera quelques-uns de ces raisins."
 north_atlantic.0049.desc.lost:0 "[leader.GetFirstName] dit que [leader.GetSheHe] et son équipage se sont immédiatement mis à chercher [tyrker.GetFirstName], bien que l'heure fût déjà tardive. Malheureusement, ils furent incapables de trouver [tyrker.GetFirstNameNoTooltip] cette nuit-là.\n\nLes recherches se poursuivirent pendant plusieurs semaines, également en vain. Finalement, comme il ne restait aucune trace de [tyrker.GetFirstNameNoTooltip], tout le monde supposa que [tyrker.GetSheHe] avait dû périr ou les avait délibérément abandonnés pour une raison quelconque.\n\nLe voyage se poursuivit donc, sans [tyrker.GetFirstNameNoTooltip]."
 north_atlantic.0049.a:0 "J'ai hâte de goûter les raisins !"
 north_atlantic.0049.b:0 "Hum.... Je me demande ce qui lui est arrivé à ?"
 north_atlantic.0050.t:0 "Expédition : Bois flotté"
 north_atlantic.0050.desc:0 "[leader.GetFirstNameNoTooltip] rapporte qu'en longeant la côte, ils ont découvert une zone jonchée d'une quantité importante de bois flotté de grande qualité.\n\nLe Groenland n'est pas étranger au bois flotté, bien entendu, car les restes d'arbres provenant de terres lointaines et étranges sont souvent portés par les vagues jusqu'à ses plages. Ce bois flotté peut servir à tout, du bois de chauffage à la construction navale.\n\nQuoi qu'il en soit, [leader.GetFirstNameNoTooltip] a indiqué qu'il est rare de trouver autant de bois flotté d'une telle qualité. Ainsi, [leader.GetSheHe] et son équipage passeront un certain temps à en rassembler autant que possible pour l'emporter sur leurs navires."
 north_atlantic.0050.a:0 "Une bonne trouvaille. Le Groenland a toujours besoin de plus de bois flotté."
 north_atlantic.0051.t:0 "Expédition : Squelettes"
 north_atlantic.0051.desc:0 "[leader.GetFirstNameNoTooltip] a rapporté que lors de l'exploration d'une zone, son équipage est tombé sur les restes de plusieurs squelettes. Ils étaient accompagnés de quelques curieux bibelots, certains de peu de valeur, mais d'autres qui semblaient plus utiles comme des bijoux et des outils.\n\nAprès avoir examiné plus en détail la zone et n'avoir trouvé aucun signe d'activité humaine récente, [leader.GetFirstNameNoTooltip] a décidé d'enterrer les squelettes et de prendre certains des matériaux les plus utiles du site."
 north_atlantic.0051.a:0 "Une découverte intéressante !"
 north_atlantic.0052.t:0 "Expédition : Ours !"
 north_atlantic.0052.desc:0 "[leader.GetFirstNameNoTooltip] rapporte qu'[leader.GetSheHe] a envoyé quelques membres de son équipage explorer une zone. [leader.GetSheHe|U] avait espéré qu'ils trouveraient quelque chose d'intéressant ou d'utile.\n\nMalheureusement, ces éclaireurs n'avaient pas voyagé bien loin lorsqu'ils tombèrent sur un ours d'une taille incommensurable ! Ils provoquèrent d'une manière ou d'une autre la fureur de cette bête, qui tua l'un des membres d'équipage tandis qu'ils fuyaient tous vers leurs bateaux.\n\nHélas, de tels incidents ne font que montrer les dangers que l'on peut rencontrer en explorant cette région."
 north_atlantic.0052.a:0 "Tout le monde sait qu'il ne faut pas jouer avec les ours."
 north_atlantic.0053.t:0 "Expédition : Les mystérieux attaquants"
 north_atlantic.0053.desc:0 "Apparemment, d'après son message, [leader.GetFirstNameNoTooltip] a trouvé ce qui ressemblait à un port prometteur pour ancrer leurs navires. Ils avaient à peine commencé à s'approcher du littoral que de nombreuses, très nombreuses flèches surgirent de nulle part vers eux !\n\nL'équipage s'empressa immédiatement de quitter le port. Heureusement, [leader.GetFirstNameNoTooltip] affirme qu'ils n'ont pas eu beaucoup de pertes graves.\n\nEn raison de la nature frénétique et soudaine de l'embuscade, l'équipage de [leader.GetFirstNamePossessiveNoTooltip] n'a pu entrevoir que brièvement leurs assaillants, et les témoignages divergent sur l'apparence de ces attaquants. Par exemple, certains membres de l'équipage affirment que ces assaillants étaient d'étranges êtres à une jambe qui sautillaient rapidement, mais d'autres disent que leurs camarades ont mal interprété la férocité de leurs ennemis clairement humains dans le feu de l'action."
 north_atlantic.0053.a:0 "Quels que soient ces agresseurs, ils semblent dangereux !"
 north_atlantic.0054.t:0 "Expédition : Sceaux"
 north_atlantic.0054.desc:0 "Selon le message, l'expédition se déroule bien.\n\n[leader.GetFirstNameNoTooltip] dit que l'équipage vient de rencontrer un grand nombre de phoques, qu'il a réussi à chasser. Chez les peuples du nord, les phoques sont couramment utilisés pour leur viande et leur huile, ce qui a grandement remonté le moral de l'équipage."
 north_atlantic.0054.a:0 "Je suis heureux de l'apprendre !"
 north_atlantic.0055.t:0 "Expédition : Navire en perdition"
 north_atlantic.0055.desc:0 "Selon le message, l'expédition a subi un revers, bien que [leader.GetFirstNameNoTooltip] m'assure que cela aurait pu être pire.\n\nAlors qu'ils naviguaient vers un port, avec l'intention d'explorer les environs, l'un des navires s'est échoué. Les dégâts étaient suffisamment graves pour que [leader.GetFirstNameNoTooltip] donne l'ordre d'abandonner le navire.\n\n[leader.GetFirstNameNoTooltip] regrette de m'informer que l'équipage a été démoralisé après cela, mais tout l'équipage du navire coulé a été transféré sur les navires restants, et ils ont tout de même réussi à récupérer une bonne quantité de la cargaison et du bois du navire coulé. [leader.GetSheHe|U] me dit que l'expédition continuera sa route, quoi qu'il en soit."
 north_atlantic.0055.a:0 "Un désastre coûteux ! Mais cela pourrait être pire, c'est vrai."
 north_atlantic.0056.t:0 "Expédition : Explorateurs précédents"
 north_atlantic.0056.desc:0 "C'est toujours une surprise, certes, mais une surprise bienvenue, lorsque des explorateurs découvrent des traces d'expéditions d'explorateurs précédents. Dans ce cas, [leader.GetFirstNameNoTooltip] a déclaré avoir découvert un ancien campement utilisé par un précédent groupe d'aventuriers venus d'Europe.\n\nIl est difficile de dire quel explorateur a construit cet endroit exactement, mais [leader.GetFirstNameNoTooltip] songe que peut-être, à son retour, [leader.GetSheHe] pourrait se pencher sur la question en comparant le site qu'[leader.GetSheHe] trouvé avec les archives ou les légendes des explorateurs précédents. Apparemment, il y a des structures rudimentaires avec des lits et d'autres commodités, ainsi que des endroits pour réparer les outils et les navires.\n\nQuoi qu'il en soit, [leader.GetFirstNameNoTooltip] prévoit de rester ici quelques semaines pour explorer la zone, peut-être même comprendre pourquoi les précédents explorateurs ont campé ici, avant de poursuivre l'expédition."
 north_atlantic.0056.a:0 "En vérité, nous marchons toujours dans les pas des autres."
 north_atlantic.0057.t:0 "Expédition : Étrange viande de baleine"
 north_atlantic.0057.desc:0 "Le rapport concerne un incident malheureux quoique amusant. Alors que les navires longeaient une plage, l'équipage remarqua un spectacle curieux : la carcasse d'une baleine à la forme étrange, manifestement morte récemment après s'être échouée.\n\nLorsqu'ils s'arrêtèrent pour se reposer sur cette plage, certains membres de l'équipage décidèrent que cette baleine morte était clairement un don de [ROOT.Char.GetFaith.HighGodName], et ils commencèrent immédiatement à s'en repaître. D'autres membres de l'équipage, cependant, étaient méfiants et refusèrent de manger la viande.\n\nLe lendemain, tous les membres de l'équipage qui avaient mangé la viande tombèrent malades. Ils décidèrent alors de rejeter ce qui restait de la baleine à la mer, et de prier [ROOT.Char.GetFaith.HighGodName]. Après cela, leur maladie se dissipa. [leader.GetFirstNameNoTooltip] présume qu'il s'agissait d'une sorte de message de [ROOT.Char.GetFaith.HighGodName]."
 north_atlantic.0057.a:0 "C'est un incident étrange si j'en ai déjà entendu un !"
 north_atlantic.0058.t:0 "Expédition : Collecte d'informations"
 north_atlantic.0058.desc:0 "[leader.GetFirstNameNoTooltip] indique que l'expédition se déroule bien, et que rien de significatif ne s'est produit, ce qui est une bonne chose.\n\n[leader.GetSheHe|U] et le reste de l'équipage se reposent actuellement dans un endroit plutôt paisible et prennent note des différentes espèces animales et végétales qui y prospèrent. [leader.GetSheHe|U] espère que ces informations pourront nous être utiles, ou du moins servir à d'autres explorateurs à l'avenir."
 north_atlantic.0058.a:0 "Ils font certainement du bon travail !"
 north_atlantic.0059.t:0 "Expédition : Attaquants... ou pas ?"
 north_atlantic.0059.desc:0 "Voyager aux confins du monde connu est semé de dangers, mais parfois ces dangers sont imaginaires. [leader.GetFirstNameNoTooltip] rapporte un cas intéressant à ce sujet, lorsqu'[leader.GetSheHe] a récemment envoyé quelques membres de l'expédition explorer l'intérieur des terres.\n\nL'équipage est revenu en toute hâte, hurlant qu'une embuscade avait été tendue par des êtres inhumains. [leader.GetFirstNameNoTooltip] a ordonné à chacun de saisir ses armes et de se préparer au combat, et éventuellement d'évacuer la zone si nécessaire. Puis ils ont attendu, tendus.\n\nAucun assaillant ne vint jamais.\n\nPourtant, ces membres d'équipage insistaient sur le fait qu'ils avaient vu quelque chose là-bas qui les avait attaqués. [leader.GetFirstNameNoTooltip] pense qu'ils ne cherchent pas à [leader.GetHerHim] tromper, alors que leur est-il arrivé ? Sont-ils devenus fous ? Ou ont-ils vraiment vu quelque chose là-bas ?"
 north_atlantic.0059.a:0 "Je suis sûr qu'il n'y avait rien à l'extérieur... n'est-ce pas ?"
 north_atlantic.0060.t:0 "Expédition : Étrangers hostiles"
 north_atlantic.0060.desc:0 "Dans le message, [leader.GetTitledFirstName] dit qu'ils sont arrivés dans un petit port et ont rencontré un groupe d'étranges individus menés par un certain [native_leader.GetFirstName]. Les deux camps ont d'abord tenté de communiquer, mais la violence a éclaté, peut-être à cause d'un malentendu, causant quelques morts des deux côtés. Les étrangers se sont retirés pour l'instant, mais [leader.GetFirstNameNoTooltip] craint qu'ils ne reviennent.\n\nCertains membres de l'équipage de [leader.GetFirstNamePossessiveNoTooltip] ont argué qu'ils devaient se retirer également, mais d'autres voulaient se venger, ou même tenter de voler ou de kidnapper certains de ces étrangers. Je me demande ce que [leader.GetFirstNameNoTooltip] a fait ?"
 north_atlantic.0060.a:0 "Peut-être que [leader.GetSheHe] a essayé d'utiliser la diplomatie pour faire la paix avec les étrangers."
 north_atlantic.0060.b:0 "Si je devais deviner, je dirais que [leader.GetSheHe] a sagement décidé de battre en retraite."
 north_atlantic.0060.c:0 "Manifestement, [leader.GetSheHe] a fortifié la zone et attendu le retour des guerriers."
 north_atlantic.0060.d:0 "Je pense qu'[leader.GetSheHe] a essayé de piller les camps des étrangers."
 north_atlantic.0060.a.success.peace:0 "[leader.GetFirstNameNoTooltip] parvient à faire la paix avec le [native_leader.GetFirstNameNoTooltip]."
 north_atlantic.0060.a.failure.tension:0 "[leader.GetFirstNameNoTooltip] échoue à faire la paix, mais [native_leader.GetFirstNameNoTooltip] n'attaque pas davantage."
 north_atlantic.0060.a.failure.no_peace:0 "[leader.GetFirstNameNoTooltip] échoue à faire la paix, et [native_leader.GetFirstNameNoTooltip] attaque l'[greenland_expedition|E]."
 north_atlantic.0060.c.success.kidnap_battle:0 "[leader.GetFirstNameNoTooltip] vainc [native_leader.GetFirstNameNoTooltip] au combat, et capture même quelqu'un de la bande de [native_leader.GetFirstNameNoTooltip]."
 north_atlantic.0060.c.success.loot_battle:0 "[leader.GetFirstNameNoTooltip] bat [native_leader.GetFirstNameNoTooltip] au combat, et acquiert beaucoup de butin."
 north_atlantic.0060.c.neutral.no_battle:0 "Aucune bataille n'a lieu en fin de compte."
 north_atlantic.0060.c.failure.defeat:0 "[native_leader.GetFirstNameNoTooltip] défaits [leader.GetFirstNameNoTooltip]."
 north_atlantic.0060.d.success.kidnap_raid:0 "[leader.GetFirstNameNoTooltip] a réussi à kidnapper un membre du groupe [native_leader.GetFirstNamePossessiveNoTooltip] lors d'un raid sur son camp."
 north_atlantic.0060.d.success.loot_raid:0 "[leader.GetFirstNameNoTooltip] parvient à piller le camp du [native_leader.GetFirstNamePossessiveNoTooltip]."
 north_atlantic.0060.d.neutral.abandoned:0 "Il n'y a personne au camp et il n'y a rien à piller."
 north_atlantic.0060.d.failure.caught:0 "[leader.GetFirstNameNoTooltip] échoue à piller le camp de [native_leader.GetFirstNamePossessiveNoTooltip], mais parvient à s'échapper quasiment indemne."
 north_atlantic.0060.d.failure.counterambush:0 "[leader.GetFirstNameNoTooltip] ne parvient pas à attaquer le camp du [native_leader.GetFirstNamePossessiveNoTooltip] et une bataille s'ensuit."
 north_atlantic.0061.t:0 "Expédition : Une tentative de diplomatie"
 north_atlantic.0061.desc.peace:0 "Certains membres de l'équipage de [leader.GetFirstNamePossessive] étaient sceptiques quant à savoir si ces étrangers voudraient même parler après que la violence eut éclaté, mais [leader.GetFirstNameNoTooltip] rassura son équipage en leur disant que ces gens étaient clairement des humains, et qu'on pouvait raisonner avec des humains. Il s'avère qu'[leader.GetSheHe] avait raison.\n\n[leader.GetFirstNameNoTooltip] parvint d'une manière ou d'une autre à approcher le groupe de [native_leader.GetFirstNamePossessive] et à convaincre les étrangers qu'[leader.GetSheHe] ne leur voulait aucun mal, et que tout cela n'était qu'un terrible malentendu. [leader.GetFirstNameNoTooltip] et [native_leader.GetFirstNameNoTooltip] se présentèrent mutuellement leurs excuses, et permirent à leurs subordonnés respectifs d'enterrer leurs morts.\n\nPar la suite, bien que l'atmosphère fût encore un peu tendue, en signe de bonne volonté, les deux camps acceptèrent de faire un peu de commerce en échangeant divers colifichets. En fin de compte, [leader.GetFirstNameNoTooltip] dit qu'[leader.GetSheHe] a le sentiment qu'[leader.GetSheHe] et [native_leader.GetFirstNameNoTooltip] en sont venus à se respecter mutuellement."
 north_atlantic.0061.desc.tension:0 "Certains membres de l'équipage [leader.GetFirstNamePossessive] étaient sceptiques quant à savoir si ces étrangers voudraient même parler après que la violence eut éclaté, mais [leader.GetFirstNameNoTooltip] rassura son équipage que ces gens étaient clairement des humains, et qu'on pouvait raisonner avec des humains.\n\nIndépendamment de l'optimisme [leader.GetFirstNamePossessiveNoTooltip], [native_leader.GetFirstNameNoTooltip] ne semblait pas intéressé par la paix. Chaque fois que [leader.GetFirstNameNoTooltip] tentait d'approcher le camp [native_leader.GetFirstNamePossessiveNoTooltip], [leader.GetSheHe] était chassé par de puissants cris de guerre, des provocations dans une langue étrange, et quelques flèches tirées au-dessus de sa tête pour [leader.GetHerHim] faire fuir.\n\nFinalement, [leader.GetFirstNameNoTooltip] conclut qu'au moins ces étrangers n'avaient pas l'intention de les tuer, et voulaient simplement qu'ils s'en aillent. En fin de compte, [leader.GetFirstNameNoTooltip] décida de faire exactement cela."
 north_atlantic.0061.desc.no_peace:0 "Certains membres de l'équipage de [leader.GetFirstNamePossessive] étaient sceptiques quant à savoir si ces étrangers voudraient même parler après que la violence eut éclaté, mais [leader.GetFirstNameNoTooltip] rassura son équipage que ces gens étaient clairement des humains, et qu'on pouvait raisonner avec des humains.\n\nIndépendamment de l'optimisme de [leader.GetFirstNamePossessiveNoTooltip], [native_leader.GetFirstNameNoTooltip] ne semblait pas intéressé par la paix. La première fois que [leader.GetFirstNameNoTooltip] tenta d'approcher le camp de [native_leader.GetFirstNamePossessiveNoTooltip], les étrangers attaquèrent avec enthousiasme. La bataille reprit de plus belle, avec un nombre considérable de victimes.\n\nFinalement, [leader.GetFirstNameNoTooltip] et son équipage durent battre en retraite vers leurs navires et prendre la mer. [leader.GetFirstNameNoTooltip] se demande, cependant, s'ils auraient pu établir la paix avec les étrangers dans des circonstances différentes."
 north_atlantic.0061.a:0 "[native_leader.GetFirstNameNoTooltip] semble être un[native_leader.Custom('FR_E')] [native_leader.GetWomanMan] bon[native_leader.Custom('FR_NNne')] et juste !"
 north_atlantic.0061.b:0 "Une erreur de calcul de la part de [leader.GetFirstNamePossessiveNoTooltip]."
 north_atlantic.0062.t:0 "Expédition : Bataille"
 north_atlantic.0062.desc.kidnap_battle:0 "Comme [leader.GetFirstName] l'avait prédit, les étrangers attaquèrent peu de temps après qu'[leader.GetSheHe] eut ordonné à son équipage d'ériger les défenses temporaires. Une grande bataille eut lieu, mais malgré la bravoure et la férocité des guerriers de [native_leader.GetFirstNamePossessiveNoTooltip], [leader.GetFirstNameNoTooltip] et son équipage l'emportèrent.\n\nFait intéressant, après la bataille, ils réussirent à capturer un membre de la bande de [native_leader.GetFirstNamePossessiveNoTooltip] alors qu'[captive.GetSheHe] tentait de fuir avec les autres étrangers.\n\n[captive.GetFirstName], comme c[captive.Custom('FR_EEtte')] capt[captive.Custom('FR_FVe')] se nomme [captive.GetHerselfHimself], n'est visiblement pas ravi[captive.Custom('FR_E')] de cette situation, mais semble résigné[captive.Custom('FR_E')] à son sort. [leader.GetFirstNameNoTooltip] pense qu'il pourrait être utile de garder c[captive.Custom('FR_EEtte')] étrang[captive.Custom('FR_ErEre')] à proximité, quoi qu'il en soit. [leader.GetSheHe|U] me dit qu'[leader.GetSheHe] me présentera [captive.GetFirstNameNoTooltip] au retour de l'expédition."
 north_atlantic.0062.desc.loot_battle:0 "Comme [leader.GetFirstName] l'avait prédit, les étrangers attaquèrent peu de temps après qu'[leader.GetSheHe] eut ordonné à son équipage d'ériger les défenses temporaires. Une grande bataille eut lieu, mais malgré la bravoure et la férocité des guerriers de [native_leader.GetFirstNamePossessiveNoTooltip], [leader.GetFirstNameNoTooltip] et son équipage l'emportèrent.\n\nAu lendemain de la bataille, [leader.GetFirstNameNoTooltip] et son équipage pillèrent un certain nombre d'objets sur les corps des guerriers étrangers tombés au combat, ainsi que des choses que les survivants avaient laissé tomber en battant en retraite. Tous ces bibelots ne sont pas utiles, mais certains d'entre eux semblent avoir une valeur pratique, ou au moins feraient de beaux trophées de guerre."
 north_atlantic.0062.desc.no_battle:0 "Il s'avère que la prédiction de [leader.GetFirstNamePossessive] selon laquelle les étrangers reviendraient les attaquer était complètement erronée. [leader.GetSheHe|U] et son équipage ont attendu toute la journée - plusieurs jours, en fait - et personne n'est venu.\n\n[leader.GetFirstNameNoTooltip] est, il faut l'admettre, soulagé[leader.Custom('FR_E')] de ce dénouement, mais se demande ce qui est arrivé aux étrangers. Étaient-ils lâches et craignaient-ils le combat ? Pensaient-ils que [leader.GetFirstNameNoTooltip] et son équipage étaient faibles et ne valaient pas la peine d'être combattus ? Retournaient-ils auprès de leurs rois ou chefs ailleurs pour faire un rapport sur la situation ? Ou bien autre chose s'est-il produit ?\n\nPeut-être ne le saurons-nous jamais. Quoi qu'il en soit, [leader.GetFirstNameNoTooltip] a pu quitter la zone en paix."
 north_atlantic.0062.desc.defeat:0 "Comme [leader.GetFirstName] l'avait prédit, les étrangers attaquèrent peu de temps après qu'[leader.GetSheHe] eut ordonné à son équipage d'ériger les défenses temporaires. Une grande bataille eut lieu, et malgré le courage et l'habileté de l'équipage de [leader.GetFirstNameNoTooltip], la bravoure et la férocité des guerriers de [native_leader.GetFirstNamePossessiveNoTooltip] furent supérieures.\n\nFinalement, [leader.GetFirstNameNoTooltip] dut sonner la retraite, et dans la panique, tous se précipitèrent vers leurs navires et quittèrent la zone. Les pertes furent nombreuses, mais [leader.GetFirstNameNoTooltip] me rassure dans son message que l'expédition #italic continuera#!."
 north_atlantic.0062.a:0 "Excellent leadership de [leader.GetFirstNameNoTooltip] !"
 north_atlantic.0062.b:0 "Ce n'est certainement pas la pire issue à cet incident."
 north_atlantic.0062.c:0 "$north_atlantic.0061.b$"
 north_atlantic.0063.t:0 "Expédition: Raid"
 north_atlantic.0063.desc.kidnap_raid:0 "Le raid de [leader.GetFirstNamePossessive] sur le camp de [native_leader.GetFirstNamePossessive] s'est bien passé ! [leader.GetSheHe|U] et son équipage ont causé tout un remue-ménage, prenant les étrangers au dépourvu, et ils en ont tué un bon nombre et pillé de nombreux objets dans le camp avant de regagner leurs bateaux en hâte.\n\nPlus étonnant encore, [leader.GetFirstNameNoTooltip] a réussi à capturer un membre de la bande de [native_leader.GetFirstNamePossessiveNoTooltip] durant le chaos.\n\n[captive.GetFirstName], comme c[captive.Custom('FR_EtEtte')] capt[captive.Custom('FR_FVe')] se nomme [captive.GetHerselfHimself], n'est visiblement pas très satisfait de cette situation, mais semble résigné à son sort. [leader.GetFirstNameNoTooltip] pense qu'il pourrait être utile de garder c[captive.Custom('FR_EtEtte')] étrang[captive.Custom('FR_ErEre')] dans les parages, quoi qu'il en soit. [leader.GetSheHe|U] me dit qu'[leader.GetSheHe] me présentera [captive.GetFirstNameNoTooltip] quand l'expédition reviendra."
 north_atlantic.0063.desc.loot_raid:0 "Le raid de [leader.GetFirstNamePossessive] sur le camp de [native_leader.GetFirstNamePossessive] s'est bien passé ! [leader.GetSheHe|U] et son équipage ont causé tout un vacarme, prenant les étrangers au dépourvu, et ils en ont tué un bon nombre et pillé de nombreux objets dans le camp avant de filer vers leurs bateaux.\n\nDans l'ensemble, [leader.GetFirstNameNoTooltip] affirme avoir obtenu un très bon butin, qu'[leader.GetSheHe] a hâte de me montrer au retour de l'expédition."
 north_atlantic.0063.desc.caught:0 "Le raid de [leader.GetFirstNamePossessive] sur le camp de [native_leader.GetFirstNamePossessive] s'est mal passé. Il semble que les guerriers de [native_leader.GetFirstNamePossessiveNoTooltip] étaient clairement expérimentés et rusés, car une fois l'alarme sonnée, ils furent capables de se rallier rapidement et de riposter, malgré l'effet de surprise.\n\n[leader.GetFirstNameNoTooltip] a heureusement réagi rapidement à la situation et a immédiatement ordonné à son équipage de battre en retraite de manière ordonnée avant de reprendre la mer. De plus, les guerriers étrangers ne les ont pas poursuivis trop loin, si bien que les pertes furent minimales."
 north_atlantic.0063.desc.counterambush:0 "Le raid de [leader.GetFirstNamePossessive] sur le camp de [native_leader.GetFirstNamePossessive] s'est mal passé. [native_leader.GetFirstNameNoTooltip] devait anticiper une embuscade, car [native_leader.GetSheHe] avait préparé une contre-embuscade dans son camp !\n\n[leader.GetFirstNameNoTooltip] tomba sur ce qui semblait être un campement sans défense, et commença à piller, pour se faire surprendre et attaquer par les féroces guerriers étrangers. Une grande bataille s'ensuivit, et bien que [leader.GetFirstNameNoTooltip] et une grande partie de son équipage réussirent à s'échapper, ils subirent un certain nombre de pertes."
 north_atlantic.0063.desc.abandoned:0 "Le raid de [leader.GetFirstNamePossessive] sur le camp de [native_leader.GetFirstNamePossessive] a été... eh bien, il s'avère que rien ne s'est passé. Bien qu'ils aient localisé et atteint le campement, personne n'était là.\n\nAu début, [leader.GetFirstNameNoTooltip] craignait que [native_leader.GetFirstNameNoTooltip] ait eu vent de leur raid. [leader.GetSheHe|U] envoya précipitamment une partie de l'équipage pour re-explorer la zone, mais ils ne trouvèrent aucune trace de [native_leader.GetFirstNameNoTooltip]. C'était comme s'ils avaient tous plié bagage et étaient partis. Ces étrangers craignaient-ils [leader.GetFirstNameNoTooltip] et son équipage ? Ou étaient-ils simplement prudents ? Difficile à dire.\n\nQuoi qu'il en soit, après avoir abandonné leur camp, les étrangers n'y ont pas laissé grand-chose, il n'y avait donc pas grand-chose à piller pour [leader.GetFirstNameNoTooltip] et son équipage. Malgré tout, [leader.GetFirstNameNoTooltip] est soulagé[leader.Custom('FR_E')] de l'issue - cela aurait définitivement pu bien plus mal se terminer !"
 north_atlantic.0063.a:0 "Un raid impressionnant et audacieux !"
 north_atlantic.0063.b:0 "$north_atlantic.0062.b$"
 north_atlantic.0063.c:0 "$north_atlantic.0061.b$"
 north_atlantic.0064.t:0 "Expédition : Village abandonné"
 north_atlantic.0064.desc:0 "il semble que l'expédition ait accosté sur une plage. Quelques membres de l'équipage, menés par [leader.GetFirstNameNoTooltip], se sont aventurés à l'intérieur des terres pour explorer la région.\n\nLe groupe n'a pas voyagé longtemps avant de trouver quelque chose d'intéressant : plusieurs bâtiments aux formes étranges, faits de bois et de peaux. Il ne faisait aucun doute qu'il s'agissait d'une sorte de village. Cependant, personne n'était présent, et il semble que ce village ait été abandonné il y a quelque temps.\n\n[leader.GetFirstNameNoTooltip] a débattu avec son équipage s'il fallait battre en retraite par prudence, ou prendre et récupérer tout ce qui semblait avoir de la valeur avant de partir. Je me demande ce que [leader.GetSheHe] a fait ensuite ?"
 north_atlantic.0064.a:0 "Mon intuition est que [leader.GetFirstNameNoTooltip] s'est replié par simple précaution."
 north_atlantic.0064.b:0 "Je crois que [leader.GetFirstNameNoTooltip] a saisi tout ce qui semblait utile."
 north_atlantic.0064.c:0 "Peut-être que [leader.GetFirstNameNoTooltip] a attendu de voir si des locaux se présentaient ?"
 north_atlantic.0064.return:0 "Les habitants du village reviennent"
 north_atlantic.0064.empty:0 "Le village est en effet inhabité"
 north_atlantic.0064.b.success.battle_victory:0 "Une bataille s'ensuit, mais [leader.GetFirstNameNoTooltip] en sort victorieux"
 north_atlantic.0064.b.failure.battle_defeat:0 "Une bataille s'ensuit et [leader.GetFirstNameNoTooltip] est battu à plate couture."
 north_atlantic.0064.b.failure.useless:0 "Le village a peu d'objets à piller"
 north_atlantic.0064.b.success.useful:0 "Le village regorge de butins utiles"
 north_atlantic.0064.c.failure.no_trade:0 "Les habitants du village ne sont pas intéressés par le commerce avec [leader.GetFirstNameNoTooltip]"
 north_atlantic.0064.c.success.trade:0 "Les habitants du village sont impatients d'échanger des marchandises avec [leader.GetFirstNameNoTooltip]"
 north_atlantic.0064.c.failure.useless:0 "$north_atlantic.0064.b.failure.useless$"
 north_atlantic.0064.c.success.useful:0 "$north_atlantic.0064.b.success.useful$"
 north_atlantic.0065.t:0 "Expédition : Bataille"
 north_atlantic.0065.desc.battle_defeat:0 "[leader.GetFirstName] et son équipage pensaient qu'il n'y avait effectivement plus personne dans ce village, alors ils commencèrent à le fouiller à la recherche de butin à ramener sur les navires. Cependant, il ne fallut pas longtemps avant qu'ils n'entendent d'étranges voix - les habitants du village étaient revenus ! Peut-être étaient-ils ailleurs pour une raison quelconque.\n\nQuoi qu'il en soit, les locaux étaient, bien sûr, fort mécontents de voir des gens saccager leurs bâtiments. Il y eut des cris et des disputes, et [leader.GetFirstNameNoTooltip] croit avoir entendu le nom du chef de ce village, [native_leader.GetFirstName].\n\nPeu après, une bataille s'engagea. Malheureusement, ces locaux étaient de féroces guerriers. Après avoir subi un certain nombre de pertes, [leader.GetFirstNameNoTooltip] et son équipage durent battre en retraite."
 north_atlantic.0065.desc.battle_victory:0 "[leader.GetFirstName] et son équipage pensaient qu'il n'y avait effectivement plus personne dans ce village, alors ils commencèrent à le fouiller à la recherche de bon butin à ramener sur les navires. Cependant, il ne fallut pas longtemps avant qu'ils n'entendent d'étranges voix - les habitants du village étaient revenus ! Peut-être étaient-ils ailleurs pour une raison quelconque.\n\nQuoi qu'il en soit, les locaux étaient, bien sûr, fort mécontents de voir des gens saccager leurs bâtiments. Il y eut des cris et des disputes, et [leader.GetFirstNameNoTooltip] croit avoir saisi le nom du chef de ce village, [native_leader.GetFirstNameNoTooltip].\n\nPeu après, une bataille s'engagea. [leader.GetFirstNameNoTooltip] avait l'avantage, et chassa les locaux. Ils reprirent le pillage une fois certains que les locaux étaient partis, et retournèrent en hâte à leurs navires avant de prendre la mer."
 north_atlantic.0065.a:0 "Il est bon d'entendre que [leader.GetFirstNameNoTooltip] a prévalu !"
 north_atlantic.0065.b:0 "Ces guerriers étrangers ont l'air d'être des durs à cuire."
 north_atlantic.0066.t:0 "Expédition : Village abandonné"
 north_atlantic.0066.desc.no_wait_text:0 "L'équipage [leader.GetFirstName] et [leader.GetSheHe] pensait qu'il n'y avait effectivement plus personne dans ce village, et ils ont donc commencé à le fouiller à la recherche d'un bon butin à ramener avec eux sur les navires."
 north_atlantic.0066.desc.wait_text:0 "[leader.GetFirstName] et son équipage ont attendu longtemps avant que quelqu'un ne se manifeste, et leurs soupçons initiaux se sont avérés exacts. Comme il n'y avait aucune trace d'autres personnes, ils se sont mis à la recherche d'un bon butin à rapporter sur les navires."
 north_atlantic.0066.desc.useless_text:0 "Il s'avère que le village ne contenait pas beaucoup d'objets utiles. Les habitants du village, supposa [leader.GetFirstNameNoTooltip], avaient dû emporter tout ce qui valait la peine d'être pris lorsqu'ils avaient abandonné le village. L'équipage a perdu beaucoup de temps et d'efforts pour rien, et est quelque peu démoralisé en conséquence.\n\nEn conclusion de [leader.son message, [leader.GetFirstNameNoTooltip] se demande pourquoi le village a été abandonné. Ses habitants ont-ils été chassés par des ennemis ? Cherchaient-ils de meilleures terres où vivre ? Était-ce un déplacement temporaire ou non ? Peut-être ne le saurons-nous jamais."
 north_atlantic.0066.desc.useful_text:0 "Il s'avère que le village abandonné était rempli d'objets utiles, notamment divers outils, du bois, des armes, et ce qui semblait être des bibelots précieux et des décorations. L'équipage a finalement passé un bon moment à piller le village.\n\n[leader.GetFirstNameNoTooltip] dit qu'[leader.GetSheHe] est absolument satisfait[leader.Custom('FR_E')] de ce résultat. [leader.GetSheHe|U] a fait charger autant que possible sur les navires."
 north_atlantic.0066.desc.useless_no_wait:0 "$north_atlantic.0066.desc.no_wait_text$\n\n$north_atlantic.0066.desc.useless_text$"
 north_atlantic.0066.desc.useless_wait:0 "$north_atlantic.0066.desc.wait_text$\n\n$north_atlantic.0066.desc.useless_text$"
 north_atlantic.0066.desc.useful_no_wait:0 "$north_atlantic.0066.desc.no_wait_text$\n\n$north_atlantic.0066.desc.useful_text$"
 north_atlantic.0066.desc.useful_wait:0 "$north_atlantic.0066.desc.wait_text$\n\n$north_atlantic.0066.desc.useful_text$"
 north_atlantic.0066.a:0 "Qu'est-il arrivé aux habitants de ce si joli village ?"
 north_atlantic.0066.b:0 "L'expédition y a perdu beaucoup de temps, semble-t-il."
 north_atlantic.0067.t:0 "Expédition : Pas abandonnée après tout"
 north_atlantic.0067.desc.no_trade:0 "[leader.GetFirstName] soupçonnait qu'il y avait encore des gens dans les environs, et dit à son équipage d'être patient. Ils attendirent et guettèrent tout signe de présence humaine depuis une distance sûre, afin de ne pas causer de malentendus.\n\nAprès un certain temps, il s'avéra que l'intuition de [leader.GetFirstNamePossessive] était correcte ! Les habitants du village revinrent (d'où, nul ne le sait), et [leader.GetFirstNameNoTooltip] sortit à leur rencontre. Malgré la barrière de la langue, [leader.GetSheHe] parvint à apprendre que ces gens étaient une tribu du peuple [native_leader.GetCulture.GetName], menée par un certain [native_leader.GetFirstName].\n\nLes deux parties discutèrent un moment, mais bien que [native_leader.GetFirstNameNoTooltip] et son peuple ne fussent pas hostiles, il semble qu'ils étaient également méfiants et peu intéressés par le commerce. [leader.GetFirstNameNoTooltip] et son équipage durent rentrer les mains vides, leur longue attente n'ayant servi à rien."
 north_atlantic.0067.desc.trade:0 "[leader.GetFirstName] soupçonnait qu'il y avait encore des gens dans les parages, et dit à son équipage d'être patient. Ils attendirent et guettèrent tout signe de présence humaine à distance sûre, afin de ne pas causer de malentendus.\n\nAprès un certain temps, il s'avéra que l'intuition de [leader.GetFirstNamePossessive] était correcte ! Les habitants du village revinrent (d'où, nul ne le sait), et [leader.GetFirstNameNoTooltip] sortit à leur rencontre. Malgré la barrière de la langue, [leader.GetSheHe] parvint à apprendre que ces gens étaient une tribu du peuple [native_leader.GetCulture.GetName], menée par un certain [native_leader.GetFirstName].\n\nLes deux parties discutèrent un moment, et il semble que ces [native_leader.GetCulture.GetCollectiveNoun] apprécièrent que [leader.GetFirstNameNoTooltip] n'ait pas profité de leur absence, et ait attendu leur retour. Les deux parties convinrent de procéder à un échange de marchandises. Ainsi, en ce qui concerne [leader.GetFirstNameNoTooltip], l'attente en valait la peine."
 north_atlantic.0067.a:0 "C'est une bonne chose que les étrangers soient sympathiques !"
 north_atlantic.0067.b:0 "Au moins, les étrangers ne sont pas hostiles."
 north_atlantic.0068.t:0 "Expédition : Du bon bois"
 north_atlantic.0068.desc:0 "Le Markland est renommé pour son abondance de bois. Après tout, c'était sans doute la raison principale pour laquelle nous y avons envoyé une expédition en premier lieu.\n\nQuoi qu'il en soit, [leader.GetFirstNameNoTooltip] rapporte qu'[leader.GetSheHe] a découvert un bon emplacement boisé au Markland. [leader.GetSheHe|U] et son équipage passeront quelques semaines là-bas, à abattre des arbres pour les ramener au Groenland. Ce bois sera d'une grande utilité pour la colonie du Groenland."
 north_atlantic.0068.a:0 "C'est d'ailleurs pour cela qu'ils ont été envoyés à Markland."
 north_atlantic.0069.t:0 "Expédition : Du mauvais bois"
 north_atlantic.0069.desc:0 "Le Markland est réputé pour son abondance de bois. Après tout, c'était sans doute la raison principale pour laquelle nous y avons envoyé une expédition.\n\nQuoi qu'il en soit, [leader.GetFirstNameNoTooltip] rapporte qu'[leader.GetSheHe] est tombé sur ce qu'[leader.GetSheHe] pensait être un bon emplacement boisé au Markland. Cependant, après avoir abattu quelques arbres, ils ont réalisé que ce bois était de qualité plutôt médiocre. Il s'avère que toute la zone manquait de bois convenable, et ils ont finalement perdu beaucoup de temps pour rien."
 north_atlantic.0069.a:0 "Peut-être trouveront-ils un meilleur bois ailleurs dans le Markland."
 north_atlantic.0070.t:0 "Expédition : Le camp des vieux bûcherons"
 north_atlantic.0070.desc:0 "Markland signifie la \"terre des forêts\", il n'est donc guère surprenant que des gens du Groenland visitent occasionnellement cette région à la recherche de bois d'œuvre.\n\nDans son message, [leader.GetFirstNameNoTooltip] dit avoir rencontré les vestiges d'un camp de bûcherons. Il ne fait aucun doute, d'après le style des structures et des outils trouvés, qu'il a été construit par une expédition similaire venue du Groenland ou d'Europe il y a quelque temps.\n\n[leader.GetFirstNameNoTooltip] explique que c'est tout à fait fortuit, car cela signifie que [leader.GetSheHe] et son équipage peuvent utiliser les outils et provisions restants pour localiser et extraire du bois de qualité. Cela leur fera gagner un temps précieux et des ressources, leur permettant de récolter plus efficacement le bois des environs."
 north_atlantic.0070.a:0 "Excellente trouvaille !"
 north_atlantic.0071.t:0 "Expédition : Accident de bûcheronnage"
 north_atlantic.0071.desc:0 "Markland signifie la \" terre des forêts \", il n'est donc guère surprenant que des habitants du Groenland visitent occasionnellement cette région à la recherche de bois d'œuvre.\n\nDans [leader.son message, [leader.GetFirstNameNoTooltip] dit qu'ils effectuaient une récolte de bois routinière le long du littoral boisé, quand le désastre a frappé.\n\nAlors qu'ils tentaient d'abattre un arbre, plusieurs membres de l'expédition ont été blessés ou tués lorsque ledit arbre leur est tombé dessus. C'est bien sûr une interruption grave pour toute l'expédition, car [leader.GetFirstNameNoTooltip] doit consacrer de la main-d'œuvre et des ressources aux soins des blessés."
 north_atlantic.0071.a:0 "Est-ce l'œuvre de [ROOT.Char.GetFaith.DevilName] ?"
 north_atlantic.0072.t:0 "Expédition : Instructions utiles"
 north_atlantic.0072.desc:0 "Une bonne partie du bois du Groenland provient de la dérive ou des exportations européennes, mais il arrive aussi qu'il provienne du Markland - ce n'est d'ailleurs pas la première expédition sur le Markland.\n\n[leader.GetFirstNameNoTooltip] raconte qu'avant son départ, [leader.GetSheHe] a obtenu des informations d'un couple de marins chevronnés sur les endroits où l'on pouvait trouver du bois de qualité à Markland. Grâce à ces informations, [leader.GetFirstNameNoTooltip] a pu localiser une zone riche en bois de qualité, qu'[leader.Custom('FR_IlElle')] est en train de récolter."
 north_atlantic.0072.a:0 "Heureux d'apprendre que l'expédition se déroule bien !"
 north_atlantic.0073.t:0 "Expédition : Mauvaises directions ?"
 north_atlantic.0073.desc:0 "Une bonne partie du bois du Groenland provient de bois flotté ou d'exportations européennes, mais parfois il vient aussi du Markland - en effet, ce n'est pas la première expédition au Markland.\n\n[leader.GetFirstNameNoTooltip] dit qu'avant de partir, [leader.GetSheHe] a obtenu quelques informations auprès de marins vétérans sur l'endroit où du bois de haute qualité pouvait être trouvé au Markland. Malheureusement, soit ces indications étaient fausses, soit [leader.GetFirstNameNoTooltip] les a mal comprises, car [leader.GetSheHe] admet qu'ils ont erré longtemps en essayant de trouver l'endroit, en vain.\n\nFinalement, [leader.GetFirstNameNoTooltip] a abandonné. [leader.GetSheHe|U] m'assure que l'expédition continuera, malgré tout."
 north_atlantic.0073.a:0 "Quel dommage."
 north_atlantic.0074.t:0 "Expédition : Un lieu Légendaire"
 north_atlantic.0074.desc:0 "Au cours de l'expédition, [leader.GetFirstNameNoTooltip] dit avoir été #italic légèrement#! dévié de sa route, et avoir abouti sur ce qui semblait être un littoral inconnu au premier abord. Cependant, tout le monde commença bientôt à reconnaître les caractéristiques géographiques, car elles correspondaient à la description d'un lieu mentionné dans une légende sur les voyages d'un explorateur plus ancien.\n\nComme la légende était quelque peu vague sur la nature de cette région, [leader.GetFirstNameNoTooltip] pensa que c'était une excellente occasion de vérifier l'exactitude des détails géographiques de la légende, de cartographier la zone et d'aider les futurs marins et explorateurs voyageant dans la région. D'un autre côté, peut-être [leader.GetSheHe] ne découvrirait rien de nouveau qui vaille la peine d'être noté, car la légende était clairement suffisante pour les aider à naviguer dans cette zone."
 north_atlantic.0074.a:0 "Je pense que [leader.GetSheHe] n'a pas perdu de temps et s'est contenté d'avancer."
 north_atlantic.0074.b:0 "J'imagine qu'[leader.GetSheHe] voulait enquêter sur cette zone."
 north_atlantic.0074.b.failure.no_info:0 "[leader.GetFirstNameNoTooltip] ne découvre aucune nouvelle information utile et gaspille les ressources de [greenland_expedition_s|E]."
 north_atlantic.0074.b.success.new_info:0 "[leader.GetFirstNameNoTooltip] découvre de nouvelles informations utiles, complétant ce qui était déjà connu de la légende."
 north_atlantic.0075.t:0 "Expédition : Un lieu légendaire"
 north_atlantic.0075.desc.no_info:0 "Après avoir passé deux semaines à étudier la région, [leader.GetFirstNameNoTooltip] a conclu que la légende était assez précise et qu'elle ne manquait pas de détails. En d'autres termes, [leader.GetSheHe] et l'équipe ont perdu beaucoup de temps et d'efforts à revérifier quelque chose qui n'avait pas besoin d'être vérifié.\n\n[leader.GetFirstNameNoTooltip] suppose qu'ils ont au moins vérifié que les détails de la légende étaient exacts."
 north_atlantic.0075.desc.new_info:0 "Après avoir passé quelques semaines à explorer la région, [leader.GetFirstNameNoTooltip] découvrit que si la légende n'était pas inexacte (après tout, c'est ainsi qu'ils avaient reconnu la géographie de cette région en premier lieu), elle omettait certaines autres informations. Peut-être que le précédent explorateur ne s'était pas aventuré trop profondément dans cette zone, ou peut-être qu'en raison de l'imprécision de la légende à certains endroits, certains détails avaient été omis.\n\n[leader.GetFirstNameNoTooltip] et l'équipage prirent des notes minutieuses sur la géographie de la région et d'autres détails tels que la faune et la flore qui y vivent. [leader.GetSheHe] espère que leurs découvertes compléteront les informations déjà contenues dans la légende."
 north_atlantic.0075.a:0 "Bon travail d'exploration de la région !"
 north_atlantic.0075.b:0 "Quelle perte de temps !"
