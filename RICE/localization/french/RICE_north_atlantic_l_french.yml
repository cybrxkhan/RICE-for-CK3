 RICE_north_atlantic_support_greenland:0 "Soutenir le Groenland"
 RICE_north_atlantic_support_greenland_tooltip:0 "Les [greenland_settlements|E] pourraient toujours bénéficier de plus de [greenland_support|E] pour assurer leur survie continue."
 RICE_north_atlantic_support_greenland_desc:0 "Il est impératif que les [rulers|E] clairvoyants fournissent un [greenland_support|E] aux [greenland_settlements|E] isolées, non seulement pour accroître leur influence sur la région, mais aussi pour aider ceux qui y vivent et s'assurer que le [greenland|E] continue d'exporter un flux régulier de produits de luxe précieux comme l'ivoire de morse vers les marchés européens."
 RICE_north_atlantic_support_greenland_effect_tooltip_1:0 "La plupart des formes de [greenland_support|E] vous accordent des avantages comme du [prestige_i|E][prestige|E], de la [piety_i|E][piety|E], ou des [modifiers|E] bénéfiques, mais plus important encore, elles peuvent améliorer la @RICE_greenland_resilience_icon! [greenland_resilience|E] et les @RICE_greenland_networks_icon! [greenland_networks|E] [greenlands|E]"
 RICE_north_atlantic_support_greenland_effect_tooltip_2:0 "Il y a une petite chance que votre [greenland_support|E] n'atteigne pas le [greenland|E] et #N #italic réduise#!#! la @RICE_greenland_resilience_icon! [greenland_resilience|E] et les @RICE_greenland_networks_icon! [greenland_networks|E] [greenlands|E], surtout si ces valeurs sont déjà basses au départ"
 RICE_north_atlantic_support_greenland_effect_tooltip_3:0 "Envoyer du [greenland_support|E] coûte plus cher car votre [house|E] ne possède pas de [greenland_estate_long|E]"
 RICE_north_atlantic_support_greenland_effect_tooltip_4:0 "Envoyer du [greenland_support|E] coûte plus cher si les @RICE_greenland_networks_icon! [greenland_networks|E] [greenlands|E] sont faibles, et si la [RICE_greenland_struggle|E] est actuellement dans les phases [struggle_phase_greenland_subsistence_simple|E] et [struggle_phase_greenland_marginalization|E]"
 RICE_north_atlantic_support_greenland_confirm:0 "Aidons le Groenland !"
 RICE_north_atlantic_support_greenland_context_tooltip:0 "#emphasis Contexte Historique:#! De la fin du Xe siècle au début du XVe siècle, le Groenland a servi de frontière septentrionale et occidentale à l'Ancien Monde. Malgré leur éloignement, les colonies nordiques du Groenland ont entretenu des liens importants avec le reste de l'Eurasie, qu'il s'agisse de l'ivoire de morse, des peaux d'ours polaire et des défenses de narval exportés vers les centres commerciaux d'Europe ou des évêques nommés par l'Église pour servir les fidèles du Groenland. Ces liens ont permis au Groenland de rester en contact et de s'impliquer dans les affaires de l'Eurasie."
 RICE_north_atlantic_greenland_aid_type:0 "Choisir comment soutenir le Groenland"
 RICE_north_atlantic_greenland_aid_type_gui:0 "Choisir comment [greenland_support|E] les [greenland_settlements|E]"
 RICE_north_atlantic_basic_supplies_option:0 "#Bold #V Envoyer des provisions de base#!#!\n$RICE_north_atlantic_basic_supplies_option_desc$"
 RICE_north_atlantic_basic_supplies_option_desc:0 "Une petite cargaison de produits de première nécessité"
 RICE_north_atlantic_basic_supplies_option_tooltip:0 "#V #Bold Coût minimum : @gold_icon! [EmptyScope.ScriptValue('RICE_greenland_support_small_cost')|0]#!#!\n\n$EFFECT_LIST_BULLET$Vous obtenez [prestige_i|E]50 et [piety_i|E]50\n$EFFECT_LIST_BULLET$Améliore la @RICE_greenland_resilience_icon! [greenland_resilience|E] et les @RICE_greenland_networks_icon! [greenland_networks|E] [greenlands|E] d'un montant aléatoire entre #V 1#! et #V [EmptyScope.ScriptValue('RICE_greenland_support_small_bonus_value')|0]#!\n$EFFECT_LIST_BULLET$Si ce [greenland_support|E] n'arrive pas, la @RICE_greenland_resilience_icon! [greenland_resilience|E] et les @RICE_greenland_networks_icon! [greenland_networks|E] [greenlands|E] diminuent d'un montant aléatoire entre #V 0#! et #V [EmptyScope.ScriptValue('RICE_greenland_support_very_tiny_bonus_value')|0]#!"
 RICE_north_atlantic_materials_option:0 "#Bold #V Envoyer des matériaux pratiques#!#!\n$RICE_north_atlantic_materials_option_desc$"
 RICE_north_atlantic_materials_option_desc:0 "Une cargaison d'outils utiles, de métaux, de bois de construction, etc."
 RICE_north_atlantic_materials_option_tooltip:0 "#V #Bold Coût minimum : @gold_icon! [EmptyScope.ScriptValue('RICE_greenland_support_medium_cost')|0]#!#!\n\n$EFFECT_LIST_BULLET$Obtenez [prestige_i|E]100\n$EFFECT_LIST_BULLET$Améliore la @RICE_greenland_resilience_icon! [greenland_resilience|E] [greenlands|E] d'un montant aléatoire entre #V 1#! et #V [EmptyScope.ScriptValue('RICE_greenland_support_medium_bonus_value')|0]#!\n$EFFECT_LIST_BULLET$Si ce [greenland_support|E] n'arrive pas, la @RICE_greenland_resilience_icon! [greenland_resilience|E] et les @RICE_greenland_networks_icon! [greenland_networks|E] [greenlands|E] diminuent d'un montant aléatoire entre #V 0#! et #V [EmptyScope.ScriptValue('RICE_greenland_support_tiny_bonus_value')|0]#!"
