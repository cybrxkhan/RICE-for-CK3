 north_atlantic.0101.tooltip.hunting_stations:0 "La [greenland_resilience|E] [greenlands|E] augmente de #V [THIS.Char.MakeScope.Var('RICE_primary_resource_value_temp').GetValue]#! à @RICE_greenland_resilience_icon! #V [GetGlobalVariable('RICE_greenland_resilience').GetValue|0]#!, et ses [greenland_networks|E] augmentent de #V [THIS.Char.MakeScope.Var('RICE_secondary_resource_value_temp').GetValue]#! à @RICE_greenland_networks_icon! #V [GetGlobalVariable('RICE_greenland_networks').GetValue|0]#!"
