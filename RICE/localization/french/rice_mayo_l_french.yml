 mayo.0020.t:0 "Consécration du Puits Sacré"
 mayo.0020.desc:0 "Depuis aussi longtemps que quiconque s'en souvienne, les sources sacrées et les puits saints ont joué un rôle important dans le folklore et la vie quotidienne du peuple [ROOT.Char.GetCulture.GetCollectiveNoun|l].\n\nSous ma direction, des [ROOT.Char.Custom('DefaultPriestTitlePlural')] [ROOT.Char.GetFaith.GetAdjective] ont localisé un puits saint en [county.GetNameNoTier], vénéré localement, qui mérite davantage de reconnaissance en tant que site de vénération et de prière. Après que nous avons accompli diverses cérémonies pour consacrer ce puits saint, la nouvelle se répand rapidement dans la région au sujet de ses prétendues propriétés spirituelles et curatives.\n\nIl ne fait aucun doute que ce puits saint deviendra un point focal important de l'activité religieuse [ROOT.Char.GetFaith.GetAdjective] locale pendant de nombreuses années."
 mayo.0020.a:0 "Quelle bonne nouvelle !"
 mayo.0020.tooltip:0 "$RICE_consecrate_holy_well_effect_tooltip_3$"
 mayo.0021.t:0 "Visite du puits sacré"
 mayo.0021.desc:0 "Depuis aussi longtemps que quiconque s'en souvienne, les sources sacrées et les puits saints ont joué un rôle important dans le folklore et la vie quotidienne du peuple [ROOT.Char.GetCulture.GetCollectiveNoun|l]. Beaucoup de gens visitent ces puits, ces sources ou ces petites mares d'eau disséminées à travers le pays pour des raisons religieuses. Je ne fais pas exception, car j'ai décidé de visiter un puits sacré jouissant d'une certaine renommée locale dans [county.GetNameNoTier].\n\nUne fois arrivé sur le site, bien qu'il soit relativement petit, l'endroit est serein et empreint d'humilité. Je ressens une paix spirituelle et physique que je n'avais pas éprouvée depuis longtemps. Je prie [ROOT.Char.GetFaith.PantheonTerm] selon la manière [ROOT.Char.GetFaith.GetAdjective], et laisse des offrandes avant de partir."
 mayo.0021.a:0 "Ce fut une expérience merveilleuse, somme toute."
 mayo.0021.toast:0 "Les eaux du puits sacré vous bénissent"
 mayo.0022.t:0 "Le Puits Sacré"
 mayo.0022.desc:0 "Les puits sacrés de [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetName] ont acquis une renommée ces derniers temps pour leurs pouvoirs spirituels - des pouvoirs dont même moi, [ROOT.Char.GetTitleAsNameNoTooltip], peux bénéficier. Comme beaucoup d'autres, je m'y rendrai pour demander les bénédictions de [ROOT.Char.GetFaith.PantheonTerm]."
 mayo.0022.a:0 "Maintenant, en route vers le puits sacré !"
 mayo.0023.t:0 "Autrefois [old_culture.GetNameNoTooltip], désormais [gaelic_culture.GetNameNoTooltip]"
 mayo.0023.desc:0 "Nous vivons parmi les [gaelic_culture.GetCollectiveNoun|l] depuis de nombreuses années maintenant, et avons, au fil du temps, adopté non seulement les attributs superficiels de leur culture - comme leur nourriture ou leurs vêtements - mais aussi leur langue et leur façon de penser, et nombre de mes compatriotes [old_culture.GetCollectiveNoun|l] se sont même mariés au sein de clans [gaelic_culture.GetNameNoTooltip|l].\n\nMême les [gaelic_culture.GetCollectiveNounNoTooltip|l] ont remarqué, à l'occasion, que j'étais devenu plus [gaelic_culture.GetNameNoTooltip|l] que les [gaelic_culture.GetCollectiveNounNoTooltip|l] eux-mêmes ! C'est un genre d'éloge dont je suis fier, car j'en suis venu à considérer ces terres et leur peuple comme les miens."
 mayo.0023.a:0 "Je suis à jamais [gaelic_culture.GetNameNoTooltip|l] !"
