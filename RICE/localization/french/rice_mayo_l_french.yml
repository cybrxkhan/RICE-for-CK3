 # Interactions
 RICE_mayo_butter_interaction:0 "Offrir du beurre de luxe"
 RICE_mayo_butter_interaction_desc:0 "Offrir à [recipient.GetShortUINamePossessiveNoTooltip] du [gift_luxury_butter_short|El] de bonne qualité"
 RICE_mayo_butter_interaction_notification:0 "Je vous prie d'accepter ce présent de [gift_luxury_butter_short|El] riche et onctueux de ma maisonnée, en témoignage de mon admiration. Comme le dit le proverbe, ce que le beurre ne guérit pas est sans remède."
 
 # Artifacts
 RICE_mayo_periphyseon_name:0 "Periphyseon"
 RICE_mayo_periphyseon_desc:0 "Ce texte, le [Glossary( 'Periphyseon', 'PERIPHYSEON_GLOSS' )], a été composé par [ROOT.Char.GetFirstName] au cours de plusieurs années, avec l'aide d'un scribe [ROOT.Char.GetCulture.GetName] anonyme. Cette œuvre, dédiée à l'ami de [ROOT.Char.GetFirstNamePossessiveNoTooltip], [wulfad.GetTitledFirstName], consiste en un long et profond dialogue entre un maître et un élève sur la théologie et la philosophie, portant particulièrement sur ce que [ROOT.Char.GetFirstNameNoTooltip] considère comme les quatre « espèces » de la réalité :\n\n$BULLET_WITH_TAB$Ce qui crée et n'est pas créé\n$BULLET_WITH_TAB$Ce qui est créé et crée\n$BULLET_WITH_TAB$Ce qui est créé et ne crée pas\n$BULLET_WITH_TAB$Ce qui ni n'est créé ni ne crée\n\nBien que les arguments de ce livre aient été critiqués par certains penseurs [GetReligionByKey('christianity_religion').GetAdjective] comme s'approchant trop du [Glossary( 'pantheism', 'PANTHEISM_GLOSS' )] et du paganisme néoplatonicien, d'autres apprécient sa rigueur intellectuelle, sa perspective audacieuse et sa capacité à intégrer la philosophie antique dans une vision du monde [GetReligionByKey('christianity_religion').GetAdjectiveNoTooltip]."
 
 # Buildings
 building_type_RICE_mayo_mayo_of_the_saxons_01:0 "Mayo des Saxons"
 building_type_RICE_mayo_mayo_of_the_saxons_01_desc:0 "Depuis des générations, depuis sa fondation par saint Colmán de Lindisfarne, le monastère de Mayo a servi de centre majeur d'apprentissage et de culte dans les îles Britanniques. L'institution joue un rôle dans l'encouragement des liens entre le clergé et les intellectuels d'Irlande et d'Angleterre."
 building_RICE_mayo_mayo_of_the_saxons_01:0 "$building_type_RICE_mayo_mayo_of_the_saxons_01$"
 building_RICE_mayo_mayo_of_the_saxons_01_desc:0 "$building_type_RICE_mayo_mayo_of_the_saxons_01_desc$"
 building_type_RICE_mayo_croagh_patrick:0 "Croagh Patrick"
 building_type_RICE_mayo_croagh_patrick_desc:0 "Saint Patrick aurait passé quarante jours à jeûner au sommet de cette montagne surplombant l'océan Atlantique, tel Moïse sur le mont Sinaï. Depuis lors, des chrétiens de toute l'Irlande ont fait le pèlerinage vers cette montagne sacrée pour suivre les pas de Saint Patrick. Autour des montagnes se trouvent de nombreux autels, des gravures rupestres anciennes et d'autres monuments formant un grand paysage rituel."
 building_RICE_mayo_croagh_patrick:0 "$building_type_RICE_mayo_croagh_patrick$"
 building_RICE_mayo_croagh_patrick_desc:0 "$building_type_RICE_mayo_croagh_patrick_desc$"
 building_type_RICE_mayo_giants_causeway:0 "Chaussée des Géants"
 building_type_RICE_mayo_giants_causeway_desc:0 "Des milliers de colonnes de basalte imbriquées convergent le long d'une partie de la côte ici. Selon le folklore local, cette magnifique structure naturelle serait les vestiges d'une chaussée construite par le légendaire Fionn mac Cumhaill."
 building_RICE_mayo_giants_causeway:0 "$building_type_RICE_mayo_giants_causeway$"
 building_RICE_mayo_giants_causeway_desc:0 "$building_type_RICE_mayo_giants_causeway_desc$"
 building_type_RICE_mayo_abbey_of_kells:0 "Abbaye de Kells"
 building_type_RICE_mayo_abbey_of_kells_desc:0 "Fondée par Saint Columba, venu de l'abbaye d'Iona, ce monastère est un centre de savoir en Irlande. Il est particulièrement connu pour abriter le Livre de Kells, un évangéliaire d'une beauté artistique sans pareille qui a ébloui et inspiré les chrétiens pieux pendant des siècles."
 building_RICE_mayo_abbey_of_kells:0 "$building_type_RICE_mayo_abbey_of_kells$"
 building_RICE_mayo_abbey_of_kells_desc:0 "$building_type_RICE_mayo_abbey_of_kells_desc$"
 building_type_RICE_mayo_rock_of_cashel_01:0 "Rocher de Cashel"
 building_type_RICE_mayo_rock_of_cashel_01_desc:0 "Surplombant une vaste plaine, la grande fortification de Cashel est réputée être le lieu où Saint Patrick convertit le roi de Munster au christianisme. Elle est le siège des rois de Munster depuis des siècles."
 building_RICE_mayo_rock_of_cashel_01:0 "Rocher de Cashel"
 building_RICE_mayo_rock_of_cashel_01_desc:0 "$building_type_RICE_mayo_rock_of_cashel_01_desc$"
 building_RICE_mayo_rock_of_cashel_02:0 "Rocher de Cashel sanctifié"
 building_RICE_mayo_rock_of_cashel_02_desc:0 "$building_type_RICE_mayo_rock_of_cashel_01_desc$ Les souverains récents ont fait don d'une grande partie du complexe aux institutions religieuses locales, qui ont bâti des structures spirituelles supplémentaires d'une grande majesté, et qui ont accumulé une vaste collection d'œuvres d'art inestimables."
 building_type_RICE_mayo_hill_of_tara:0 "Colline de Tara"
 building_type_RICE_mayo_hill_of_tara_desc:0 "Dans les temps anciens, Tara était le site cérémoniel et funéraire le plus important d'Irlande, où les Hauts Rois de l'île étaient couronnés lors de cérémonies sacrées auprès de la #italic Lia Fáil#!, la pierre du destin."
 building_RICE_mayo_hill_of_tara:0 "$building_type_RICE_mayo_hill_of_tara$"
 building_RICE_mayo_hill_of_tara_desc:0 "$building_type_RICE_mayo_hill_of_tara_desc$"
 
 # Traits
 
 # Aspirations
 RICE_mayo_aspiration_ruaidri_o_connor_desc:"\n\n#bold [historical_aspiration_main_objectives|E]#! (@warning_icon! Les [historical_aspiration_routes|El] sont mutuellement exclusives)\n#bold #italic [historical_aspiration_route|E] de #N l'Allégeance anglaise#!#!#!\n$EFFECT_LIST_BULLET$Devenir un [vassal|El] ou [tributary|El] $heritage_goidelic_name$ de l'[GetTitleByKey('k_england').GetNameNoTier]\n$EFFECT_LIST_BULLET$[completely_control|E], directement ou par l'intermédiaire de [vassals|El], au moins #V 6#! [counties|El] en [GetGeographicalRegion('custom_ireland').GetName]\n$EFFECT_LIST_BULLET$Avoir un [prestige_level|El] de niveau [GetModifier( 'prestige_level_3' ).GetNameWithTooltip|L] ou plus\n#bold #italic [historical_aspiration_route|E] du #P Dirigeant indépendant#!#!#!\n$EFFECT_LIST_BULLET$Rester un [ruler|El] $heritage_goidelic_name$ [independent|El], non-[tributary|El]\n$EFFECT_LIST_BULLET$[completely_control|E], directement ou par l'intermédiaire de [vassals|El], au moins #V 9#! [counties|El] en [GetGeographicalRegion('custom_ireland').GetName]\n$EFFECT_LIST_BULLET$Pas plus de #V 2#! [counties|El] en [GetGeographicalRegion('custom_ireland').GetName] ne sont directement possédés par des [rulers|El] qui ne sont pas d'une [culture|El] $heritage_goidelic_name$\n$EFFECT_LIST_BULLET$Avoir un [prestige_level|El] de niveau [GetModifier( 'prestige_level_3' ).GetNameWithTooltip|L] ou plus\n\n#bold Récompenses#!\n$EFFECT_LIST_BULLET$Gain de @prestige_icon! #V [EmptyScope.ScriptValue('RICE_aspiration_medium_resource_bonus')]#! de [prestige|El]\n#italic #bold [historical_aspiration_route|E] de l' #N Allégeance anglaise#!#!#!\n$EFFECT_LIST_BULLET$Gain de @gold_icon! #V [EmptyScope.ScriptValue('RICE_aspiration_medium_resource_bonus')]#! d'[gold|El]\n$EFFECT_LIST_BULLET$Vous recevrez #V 1000#! [special_troops|El] anglais, y compris des [men_at_arms|El]\n$EFFECT_LIST_BULLET$[cultural_acceptance|E] accrue entre votre [culture|El] et les [cultures|El] normande et anglaise\n#italic #bold [historical_aspiration_route|E] du #P Dirigeant indépendant#!#!#!\n$EFFECT_LIST_BULLET$Gain de @dynasty_prestige_icon! #V [EmptyScope.ScriptValue('RICE_aspiration_large_resource_bonus')]#! [dynasty_prestige|El]\n$EFFECT_LIST_BULLET$Vous recevrez #V 2000#! [special_troops|El] irlandais, y compris des [men_at_arms|El]\n$EFFECT_LIST_BULLET$Vous obtiendrez le titre de royaume d'[GetTitleByKey('k_ireland').GetNameNoTier] si vous ne l'avez pas déjà\n$EFFECT_LIST_BULLET$$RICE_irish_high_king_message_tooltip$\n\n#bold [historical_aspiration_bonus_objectives|E]#! (Disponibles pour les deux [historical_aspiration_routes|El])\n$EFFECT_LIST_BULLET$Avoir un [piety_level|El] de [GetModifier( 'piety_level_3' ).GetNameWithTooltip|L] ou plus (Récompense : Gain un [perk|El] de [diplomacy_lifestyle|El])\n$EFFECT_LIST_BULLET$Faire l'[activity|El] [GetActivityType( 'activity_RICE_mayo_croagh_patrick_pilgrimage' ).GetName] au moins une fois (Récompense : Gain de @piety_icon! #V [EmptyScope.ScriptValue('RICE_aspiration_medium_resource_bonus')]#! de [piety|El])"
 RICE_mayo_historical_aspiration_action_ruaidri_o_connor:"#italic J'ai passé des décennies à tenter d'affirmer mon autorité en tant que haut roi d'Irlande, contre d'insolents dirigeants irlandais rivaux, des parents intrigants et les aventuriers anglo-normands récemment arrivés aux motifs douteux. Je me fais vieux désormais, et j'espère regagner un semblant de pouvoir sur l'île légendaire de Saint Patrick.#!$RICE_mayo_aspiration_ruaidri_o_connor_desc$"
 RICE_mayo_historical_aspiration_modifier_desc_ruaidri_o_connor: "[GetModifier('RICE_mayo_aspiration_maintain_authority_in_ireland').GetNameWithTooltip]"

 # Aspiration Modifiers
 RICE_mayo_aspiration_maintain_authority_in_ireland: "[RICE_aspiration|E]: Maintenir l'autorité en Irlande"
 RICE_mayo_aspiration_maintain_authority_in_ireland_desc:"#italic Ruaidrí Ua Conchobair a passé des décennies à tenter d'affirmer son autorité en tant que haut roi d'Irlande, contre des dirigeants irlandais rivaux insolents, des parents intrigants et les aventuriers anglo-normands récemment arrivés aux motifs douteux. Il se fait maintenant vieux et espère regagner un semblant de pouvoir sur l'île légendaire de Saint Patrick.#!$RICE_mayo_aspiration_ruaidri_o_connor_desc$\n\n"
 
 # Memories
 
 # Activities
 activity_RICE_mayo_croagh_patrick_pilgrimage_host_an_a:0 "un"
 activity_RICE_mayo_croagh_patrick_pilgrimage:0 "Pèlerinage à Croagh Patrick"
 activity_RICE_mayo_croagh_patrick_pilgrimage_desc:0 "La montagne de Croagh Patrick est l'un des sites de pèlerinage les plus populaires d'Irlande, en raison de son association avec le saint patron de l'île, Saint Patrick."
 RICE_mayo_croagh_patrick_pilgrimage_context_tooltip:"#emphasis Contexte historique :#! Croagh Patrick était probablement déjà considéré comme sacré depuis l'ère néolithique. Depuis la christianisation, il est fortement associé au célèbre Saint Patrick, qui aurait jeûné quarante jours à son sommet, à l'instar de Moïse qui passa quarante jours sur le mont Sinaï. Encore aujourd'hui, de nombreux pèlerins s'y rendent chaque année, tentant d'escalader la montagne, en particulier lors du Reek Sunday."
 activity_RICE_mayo_croagh_patrick_pilgrimage_selection_tooltip:"Partez en [local_pilgrimage|El] vers le Croagh Patrick en [GetTitleByKey('c_mayo').GetNameNoTier].\n\n$RICE_mayo_croagh_patrick_pilgrimage_context_tooltip$"
 activity_RICE_mayo_croagh_patrick_pilgrimage_host_desc:"$activity_RICE_local_pilgrimage_host_desc$\n$BULLET_WITH_TAB$Chance d'obtenir avec succès des [character_modifiers|El] #P bénéfiques#! selon votre [piety_level|El]"
 activity_RICE_mayo_croagh_patrick_pilgrimage_guest_desc: "$activity_RICE_mayo_croagh_patrick_pilgrimage_host_desc$"
 activity_RICE_mayo_croagh_patrick_pilgrimage_province_desc:"Croagh Patrick se trouve près de [GetTitleByKey('b_castlebar').GetNameNoTier]."
 activity_RICE_mayo_croagh_patrick_pilgrimage_destination_selection: "$activity_RICE_mayo_croagh_patrick_pilgrimage_province_desc$"
 activity_RICE_mayo_croagh_patrick_pilgrimage_guest_help_text: "$activity_RICE_mayo_croagh_patrick_pilgrimage$"
 activity_RICE_mayo_croagh_patrick_pilgrimage_predicted_cost:"Le coût d'un [local_pilgrimage|El] à Croagh Patrick dépend des [activity_options|El] que vous sélectionnez."
 activity_RICE_mayo_croagh_patrick_pilgrimage_conclusion_desc:"Notre [GetActivityType( 'activity_RICE_mayo_croagh_patrick_pilgrimage' ).GetName] est arrivé à son terme. La majesté spirituelle de la montagne ne peut être niée !"
 RICE_mayo_croagh_patrick_pilgrimage_completed_log_title:0 "Pèlerinage à Croagh Patrick accompli"
 RICE_mayo_croagh_patrick_pilgrimage_completed_log:0 "[CHARACTER.GetShortUIName|U] a accompli son [local_pilgrimage|El] à Croagh Patrick"
 TRAVEL_NAME_FOR_activity_RICE_mayo_croagh_patrick_pilgrimage:0 "[Character.GetFirstNamePossessiveNoTooltip] $activity_RICE_mayo_croagh_patrick_pilgrimage$"
 RICE_mayo_croagh_patrick_injury_log_title:0 "Blessure d'escalade"
 RICE_mayo_croagh_patrick_injury_log:0 "[injured_person.GetShortUIName|U] s'est blessé[injured_person.Custom('FR_E')] en escaladant Croagh Patrick"
 RICE_mayo_croagh_patrick_lightning_harmless_log_title:0 "Foudre"
 RICE_mayo_croagh_patrick_lightning_harmless_log:0 "[lightning_person.GetShortUIName|U] a failli être frappé[lightning_person.Custom('FR_E')] par la foudre"
