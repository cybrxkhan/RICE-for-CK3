 activity_RICE_visit_holy_well_province_desc:"Un puits sacré se trouve ici."
 activity_RICE_visit_holy_well_destination_selection: "$activity_RICE_visit_holy_well_province_desc$"
 activity_RICE_visit_holy_well_guest_help_text: "$activity_RICE_visit_holy_well$"
 activity_RICE_visit_holy_well_predicted_cost:"Le coût de cette visite est principalement basé sur votre [income|El]."
 activity_RICE_visit_holy_well_conclusion_desc:"La [GetActivityType( 'activity_RICE_visit_holy_well' ).GetName] est terminée. Une humble expérience spirituelle !"
 RICE_visit_holy_well_prayer_phase:"Prière"
 RICE_visit_holy_well_prayer_phase_desc:"Le puits sacré est un lieu de culte spirituel, de guérison et de recueillement."
 RICE_visit_holy_well_worship_intent_header:"Vénération :"
 RICE_visit_holy_well_worship_intent:"Vénération"
