 mayo.0080.t:0 "Île de Saint-Macdara"
 mayo.0080.desc:0 "Au large des côtes de [GetTitleByKey('b_galway').GetNameNoTier] se trouve la légendaire île de Saint Macdara, où un saint de ce nom aurait bâti une petite église et vécu en ermite au sixième siècle. Les habitants l'ont vénéré comme un protecteur des marins et des pêcheurs, et osent même parfois braver les flots pour effectuer de petits pèlerinages vers son île.\n\nEn tant que [ROOT.Char.GetTitleAsNameNoTooltip] régnant sur [GetTitleByKey('c_connacht').GetNameNoTier], des dirigeants locaux m'ont demandé si je serais disposé à consacrer quelques ressources pour soutenir la petite église de l'île et les pèlerins qui s'y rendent. Même si le saint est peu connu en dehors de la région, cela contribuerait grandement à renforcer mon image auprès des gens de mer qui vivent le long de ces côtes."
 mayo.0080.a:0 "J'en serais ravi, au nom de Saint Macdara !"
 mayo.0080.info:0 "#emphasis Contexte historique :#! L'île de Saint Macdara, une île au large des côtes de Galway, est depuis longtemps associée à un saint local du VIe siècle, Saint Macdara. Bien que peu connu en dehors de la région (il est en fait à peine mentionné dans les sources hagiographiques), il est très populaire dans les environs en tant que protecteur des gens de mer, et ce encore aujourd'hui. Un certain nombre de coutumes maritimes et de pratiques spirituelles sont associées à Saint Macdara, comme les marins et les pêcheurs qui baissent leurs voiles trois fois en passant devant l'île, ou les pèlerinages réguliers qu'y effectuent les habitants."
 mayo.0080.b:0 "Je ne peux pas me permettre de telles dépenses."
 mayo.0081.t:0 "Noisetier, Seigneur du Bois"
 mayo.0081.desc:0 "Dans les lois anciennes des [ROOT.Char.GetCulture.GetCollectiveNoun|l], il existe sept arbres considérés comme les [Glossary( 'seigneurs des bois', 'LORDS_OF_THE_WOOD_GLOSS' )] en raison des importantes ressources qu'ils nous fournissent.\n\nL'un d'entre eux, le noisetier, a fourni une récolte plutôt abondante cette année en [county.GetNameNoTier]. J'ai même reçu des rapports indiquant que la récolte de noisettes était si importante que certaines petites rivières en étaient obstruées !\n\nSelon nos lois anciennes, j'ai droit à une part des baguettes de noisetier prélevées sur cette récolte en tant que [ROOT.Char.GetTitleAsNameNoTooltip], et les gens du commun m'ont envoyé une charretée de baguettes de noisetier."
 mayo.0081.a:0 "Cela sera des plus utiles !"
 mayo.0081.info:0 "#emphasis Contexte historique :#! Dans l'Irlande médiévale, sept arbres étaient considérés comme si importants qu'ils furent classés parmi les [Glossary( 'seigneurs de la forêt', 'LORDS_OF_THE_WOOD_GLOSS' )] et de nombreuses lois étaient associées à ces arbres et à leurs usages. Le noisetier était l'un de ces arbres, prisé pour son bois, utilisé dans divers types de construction, et la noisette comme source de nourriture ; en vertu du droit médiéval irlandais, les seigneurs avaient droit à une part de la récolte de noisettes. Le noisetier était si important que les chroniques irlandaises prenaient la peine de consigner les bonnes années à noisettes. Les #italic Annales d'Ulster#!, une importante source primaire sur l'Irlande médiévale, notèrent avec amusement qu'en 836 et 1066, par exemple, la récolte de noisettes fut si abondante qu'elles finirent par obstruer les rivières !"
 mayo.0082.t:0 "Intrus"
 mayo.0082.desc:0 "[trespasser.GetTitledFirstName] me regarde d'un air penaud, en me tendant l'argent. « Je m'excuse pour cette intrusion, [ROOT.Char.GetLadyLord], mais mon impatience a pris le dessus. »\n\nNous savons tous que les lois [ROOT.Char.GetCulture.GetName] sont claires concernant les amendes pour intrusion. Une personne est autorisée à ouvrir un portail de l'extérieur sans pénalité, pour voir si quelqu'un est chez soi, mais quiconque entre sans permission doit payer une amende, surtout s'il ouvre une porte de la maison.\n\n[trespasser.GetFirstNameNoTooltip] n'avait probablement pas l'intention de faire quoi que ce soit d'illégal, mais était trop agité et impatient d'entrer pour discuter d'affaires importantes avec moi l'autre jour. [trespasser.GetSheHe|U] ne s'est pas donné la peine d'attendre que mes serviteurs [trespasser.GetHerHim] fassent entrer, comme [trespasser.GetSheHe] aurait dû le faire."
 mayo.0082.a:0 "Très bien. J'accepte votre restitution."
 mayo.0082.b:0 "Gardez l'argent, mais retenez la leçon pour la prochaine fois."
 mayo.0082.info:0 "#emphasis Contexte historique :#! Cet événement est basé sur les lois relatives à l'intrusion dans l'Irlande du haut Moyen Âge, telles qu'elles sont discutées dans des textes juridiques comme le #italic Crith Gablach#! (signifiant « L'Achat Ramifié »), un texte de loi du VIIIe siècle centré sur la question du statut et les différences entre les divers niveaux de classe sociale dans l'Irlande médiévale. L'Irlande à cette époque était une société hautement stratifiée, et les sanctions légales pouvaient varier considérablement en fonction du rang de la victime comme de celui de l'auteur de l'infraction."
 mayo.0083.t:0 "Humbles Peigniers"
 mayo.0083.desc:0 "« Peigniers », se moque [arrogant.GetTitledFirstName]. « J'en ai vu un l'autre jour, et ils sont répugnants, n'est-ce pas ? Ils sont comme des chiens et des tas de fumier, là d'où ils tirent leurs matériaux. »\n\nJ'avais simplement demandé à [arrogant.GetFirstNameNoTooltip] comment s'était passée sa sortie en ville l'autre jour, mais il semblerait qu'[arrogant.GetSheHe] ait vu quelques humbles artisans qu'[arrogant.GetSheHe] ne souhaitait pas voir et en est fort contrarié."
 mayo.0083.a:0 "Ils sont de basse condition, mais il ne faut pas trop se moquer d'eux."
 mayo.0083.b:0 "Ces fabricants de peignes sont vraiment des gens répugnants, je suis d'accord !"
 mayo.0083.info:0 "#emphasis Contexte historique :#! L'Irlande médiévale était une société très stratifiée, et les gens bénéficiaient de privilèges et d'un statut variables selon leur rang et leur occupation. Certains artisans, tels que les charpentiers, les chaudronniers et les forgerons, étaient considérés comme ayant un statut élevé, disposant parfois même d'un prix d'honneur similaire à celui de la petite noblesse. En revanche, d'autres artisans, tels que les fabricants de peignes, étaient perçus comme ayant un statut social bas ; les textes juridiques, par exemple, associaient les fabricants de peignes aux chiens et aux tas de fumier, où ils trouvaient leurs matières premières."
 mayo.0084.t:0 "Rares Pins irlandais"
 mayo.0084.desc:0 "Ce fut une découverte remarquable : un grand bosquet de pins, niché dans une forêt lointaine en [county.GetNameNoTier].\n\nMon [councilor.GetCouncilTitle], [councilor.GetTitledFirstName], dit que nous pourrions utiliser ces arbres rares pour produire de la résine, ou pour la construction. Ils sont considérés comme l'un des [Glossary( 'seigneurs des bois', 'LORDS_OF_THE_WOOD_GLOSS' )] parmi les [ROOT.Char.GetCulture.GetCollectiveNoun], après tout, et trouver un pin est en soi quelque chose de miraculeux."
 mayo.0084.a:0 "Ces pins seront des plus utiles !"
 mayo.0084.b:0 "Je ne pense pas que cela en vaille la peine."
 mayo.0084.info:0 "#emphasis Contexte historique :#! Historiquement, le pin sylvestre (#italic Pinus Sylvestris#!), une espèce de pin, pouvait être trouvé en Irlande, mais sa population diminua considérablement au cours de la période médiévale jusqu'à son extinction. L'arbre fut réintroduit sur l'île au XVIIIe siècle. Il n'en conservait pas moins une grande importance en tant que l'un des [Glossary( 'seigneurs de la forêt', 'LORDS_OF_THE_WOOD_GLOSS' )] pour son bois d'œuvre et sa résine. Reflétant la rareté de l'arbre, une légende médiévale raconte qu'un monastère tenta de construire un réfectoire en pin ; ses bâtisseurs ne purent trouver aucune trace de pins même après avoir parcouru les bois pendant des jours, et ce n'est que par l'intervention miraculeuse de Sainte Samthann, une légendaire nonne et abbesse irlandaise du VIIIe siècle, que les pins purent être trouvés."
 mayo.0085.t:0 "Les Grottes de Keash"
 mayo.0085.desc:0 "Les grottes de Keash en [GetTitleByKey('b_sligo').GetNameNoTier] sont associées à la royauté depuis de nombreuses années, grâce aux légendes qui les entourent. Aujourd'hui, mes bardes me régalent du récit de ce qui pourrait être la plus célèbre légende associée aux grottes de Keash.\n\nOn raconte que jadis, le légendaire Haut Roi d'[GetGeographicalRegion('custom_ireland').GetName], Cormac Mac Airt, était un homme d'un grand honneur, d'une grande générosité, d'une grande sagesse et d'une grande bienveillance. Après que son père fut tué au combat par un parent, qui s'empara du trône, le jeune Cormac fut emporté par une louve qui l'éleva dans les grottes de Keash, et des années plus tard, il regagna son héritage légitime en tant que Haut Roi."
 mayo.0085.a:0 "Un excellent récit - quoique fantaisiste."
 mayo.0085.b:0 "Les grottes émanent une aura royale pour une bonne raison."
 mayo.0086.t:0 "Un juriste [ROOT.Char.GetCulture.GetNameNoTooltip] suspect"
 mayo.0086.desc:0 "Alors que le juriste [ROOT.Char.GetCulture.GetCollectiveNoun|l] parlait sans fin, m'expliquant les détails et les nuances de l'affaire juridique sur laquelle il me conseillait, tout le monde le remarqua : une rougeur inhabituelle apparut sur ses joues, légère mais indéniablement visible.\n\nTous les présents chuchotèrent avec excitation en voyant cela. Se pouvait-il ? Ce juriste s'écartait-il de la vérité ? Des taches sur les joues comme celles-ci sont un signe révélateur de telles choses.\n\nFinalement, quelqu'un parmi mes courtisans assemblés fit remarquer à voix haute ce que tout le monde pensait. La voix du juriste passa rapidement de son monotone ennuyeux à un ton paniqué, tandis qu'il nous assurait qu'il ne disait que la vérité, et qu'il rougissait simplement de nervosité."
 mayo.0086.a:0 "Faire confiance au juriste"
 mayo.0086.b:0 "Punir le juriste pour avoir menti"
 mayo.0086.c:0 "Souligner les lacunes dans les conseils juridiques du juriste"
 mayo.0086.info:0 "#emphasis Contexte historique :#! Les juristes occupaient un rôle important dans la société irlandaise du haut Moyen Âge, entourés d'une aura de mystère surnaturel et de respect semblable à celle des poètes d'Irlande. Leur insigne de fonction était un torque, et l'on croyait que si un juriste proférait un mensonge, son torque se resserrait autour de son cou, et pouvait même l'étrangler. Ainsi, le #italic Senchas Már#!, une compilation du VIIIe siècle de divers textes juridiques irlandais, mentionne que des taches apparaissaient sur le cou d'un juriste lorsqu'il s'écartait de la vérité."
 mayo.0087.t:0 "Les Trois Rochers de la culture [ROOT.Char.GetCulture.GetNameNoTooltip]"
 mayo.0087.desc:0 "J'ai entendu dire que le fondement du droit [ROOT.Char.GetCulture.GetCollectiveNoun|l], et du comportement licite, repose sur les "trois piliers" que sont la religion, le seigneur et la famille. Leur influence imprègne notre vie et nous guide. Pourtant, je ne puis m'empêcher de me demander... lequel est le plus important, du moins en matière juridique ?"
 mayo.0087.a:0 "Que sont les lois sans [ROOT.Char.GetFaith.HighGodName] ?"
 mayo.0087.b:0 "Les dirigeants sont la clé pour rendre la justice."
 mayo.0087.c:0 "Par la famille, nous apprenons et pratiquons le bon comportement."
 mayo.0087.info:0 "#emphasis Contexte historique :#! Cet événement a été inspiré par un extrait des #italic Triades d'Irlande#!, une collection de textes du VIIIe siècle couvrant une variété de sujets tels que le droit, l'étiquette et la géographie. L'extrait affirme que « les trois rochers auxquels le comportement légitime est attaché : le monastère, le seigneur, la parenté. » Cette déclaration reflète les idéaux et les valeurs de la culture irlandaise ancienne, et la manière dont le droit et le comportement approprié étaient intimement liés à la religion, à la royauté et à la famille."
