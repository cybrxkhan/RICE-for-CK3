 RICE_every_goidelic_ruler_in_realm:0 "Chaque [ruler|El] de votre [realm|El] dont la [culture|El] est d'[heritage|El] $heritage_goidelic_name$"
 RICE_every_non_goidelic_ruler_in_realm:0 "Chaque [ruler|El] de votre [realm|El] dont la [culture|El] n'est PAS d'[heritage|El] $heritage_goidelic_name$"
 RICE_opinion_embraced_gaelicization:0 "A embrassé la gaélicisation"
 RICE_every_goidelic_county:0 "Chaque [county|El] avec une [culture|El] d'[heritage|El] $heritage_goidelic_name$"
 dynn_RICE_eriugena:0 "Eriugena"
 nick_RICE_scottus:0 "Scottus"
 nick_RICE_scottus_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat] était originaire de l'île d'Irlande, habitée par un peuple connu en latin sous le nom de [Glossary( 'Scotti', 'SCOTTI_GLOSS' )], c'est pourquoi [CHARACTER.GetSheHe] est ainsi connu sous le nom de #italic Scottus#!, signifiant Irlandais en latin."
 Wulfad:0 "Wulfad"
 Winibert:0 "Winibert"
 RICE_nick_butterlord:0 "le Seigneur du Beurre"
 RICE_nick_butterlord_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharHaveHas(CHARACTER)] acquis une réputation pour son amour du beurre, et pour l'organisation de festins somptueux où les meilleurs et les plus savoureux types de beurres sont servis, du beurre frais aux variétés au goût distinct de beurre de tourbière."
 RICE_anglo_norman_mercenaries_event_troops:0 "Aventuriers anglo-normands"
 RICE_irish_event_troops:0 "Ost irlandais"
 RICE_irish_high_king_message_tooltip:0 "Les [dukes|El] et [counts|El] [independent|El] en [GetGeographicalRegion('custom_ireland').GetName] choisiront entre devenir vos [vassals|El] ou [tributaries|El]"
 Bega:0 "Bega"
 
 # Custom Localization 

 # Game Concepts
 game_concept_bog_butter_bog:0 "Tourbière"
 game_concept_bog_butter_short:0 "Beurre"
 game_concept_bog_butter:0 "Beurre de tourbière"
 game_concept_bog_butter_desc:0 "Le $game_concept_bog_butter$ est une méthode traditionnelle de conservation du beurre dans certaines régions des îles Britanniques durant l'Antiquité et le Moyen Âge. Elle est représentée par deux [decisions|El] pour #V $RICE_mayo_bury_bog_butter$#! et #V $RICE_mayo_retrieve_bog_butter$#!.\n\nCes deux [decisions|El] sont disponibles pour toute [culture|El] possédant l'[innovation|El] #V $game_concept_bog_butter$#!. Après avoir pris la première [decision|El], vous devez attendre au moins un an avant de prendre la seconde."
 game_concept_gift_of_luxury_butter:0 "Don de Beurre de Luxe"
 game_concept_gift_luxury_butter_gift:0 "Don"
 game_concept_gift_luxury_butter_short:0 "Beurre"
 game_concept_gift_luxury_butter:0 "Don de Beurre de Luxe"
 game_concept_gift_luxury_butter_desc:0 "Les [cultures|El] avec la [tradition|El] #V $tradition_RICE_brehon_law_name$#! ont accès à une [character_interaction|El] pour #V $RICE_mayo_butter_interaction$#!. Cela représente comment, dans l'Irlande pré-moderne, le bétail et le beurre étaient d'importants symboles de statut et de richesse. Le beurre était traditionnellement offert aux invités en signe d'hospitalité, et la classe sociale de chacun dictait la quantité de beurre que l'on était censé recevoir.\n\nL'[interaction|El] augmente l'[opinion_i|E] [opinion|El] de l'autre partie envers vous et lui confère un [modifier|El] positif. Plus le [rank|El] des deux parties est élevé, selon que l'une ou l'autre ou l'un de leurs membres de la [close_family|El] ou [spouse|El] détient un [title|El] et quel [title_tier|El] il est, plus les deux parties reçoivent de [prestige_i|E] [prestige|El] en retour. Si le receveur est de [title_tier|El] [duchy|El] ou supérieur, celui qui offre reçoit également un peu de [legitimacy_i|E] [legitimacy|El] en fonction du [title_tier|El] du receveur."

