 RICE_mayo_butter_gift_modifier_desc:1 "Ce personnage a récemment reçu un [gift_luxury_butter|El] d'un autre [ruler|El], ce qui reflète bien son importance et son statut social."
 TFE_holy_well_level_1:0 "Puits sacré mineur récemment consacré"
 TFE_holy_well_level_1_desc:0 "Les autorités religieuses de cette région ont récemment consacré un puits sacré d'une certaine renommée. Les dévots affluent vers le site depuis les régions voisines pour prier et laisser des offrandes.\n\n#italic Améliore les bonus de l'[activity|El] #V [GetActivityType( 'activity_RICE_visit_holy_well' ).GetName] #! pour les [rulers|El] qui possèdent ce [county|El] ou y ont un [domicile|El] si leur [culture|El] est d'un [heritage|El] $heritage_goidelic_name$, $heritage_brythonic_name$ ou $heritage_west_germanic_name$. Un puits sacré mineur offre moins de bonus lors de cette [decision|El], comparé aux puits sacrés majeurs et grands.#!"
 TFE_holy_well_level_2:0 "Puits sacré majeur récemment consacré"
 TFE_holy_well_level_2_desc:0 "Les autorités religieuses de cette région ont récemment consacré un puits sacré d'une certaine renommée. Les dévots affluent vers le site depuis la région environnante pour prier et déposer des offrandes.\n\n#italic Améliore les bonus de l'[activity|El] #V [GetActivityType( 'activity_RICE_visit_holy_well' ).GetName] #! pour les [rulers|El] qui possèdent ce [county|El] ou y ont un [domicile|El] si leur [culture|El] est d'un [heritage|El] $heritage_goidelic_name$, $heritage_brythonic_name$ ou $heritage_west_germanic_name$. Un puits sacré majeur offre plus de bonus lors de cette [decision|El] par rapport à un puits sacré mineur, mais moins par rapport à un grand puits sacré.#!"
 TFE_holy_well_level_3:0 "Grand puits sacré récemment consacré"
 TFE_holy_well_level_3_desc:0 "Les autorités religieuses de cette région ont récemment consacré un puits sacré d'une certaine renommée. Les dévots affluent vers le site depuis les régions voisines pour prier et laisser des offrandes.\n\n#italic Améliore les bonus de l'[activity|El] #V [GetActivityType( 'activity_RICE_visit_holy_well' ).GetName] #! pour les [rulers|El] qui possèdent ce [county|El] ou y ont un [domicile|El] si leur [culture|El] est d'un [heritage|El] $heritage_goidelic_name$, $heritage_brythonic_name$ ou $heritage_west_germanic_name$. Un grand puits sacré offre plus de bonus lors de cette [decision|El], comparé aux puits sacrés mineurs et majeurs.#!"
 TFE_healing_waters_of_a_holy_well:0 "Eaux guérisseuses d'un puits sacré"
 TFE_healing_waters_of_a_holy_well_desc:0 "Ce personnage a récemment visité un puits sacré pour prier et faire des offrandes religieuses. Après cela, ce personnage s'est senti spirituellement et physiquement régénéré."
 RICE_recently_gaelicized:0 "Récemment gaélicisé"
 RICE_rulers_recently_gaelicized:0 "Dirigeants récemment gaélicisés"
 RICE_mayo_supported_galway_bay_seafarers:0 "A soutenu les marins de la baie de Galway"
 RICE_mayo_supported_galway_bay_seafarers_desc:0 "Ce personnage a utilisé son rang élevé pour aider généreusement les communautés côtières de la baie de Galway de diverses manières, gagnant leur gratitude et leur approbation."
 RICE_mayo_saint_macdara_support:0 "Dons pour l'île de Saint Macdara"
 RICE_mayo_saint_macdara_support_desc:0 "Une île au large des côtes de Galway est depuis longtemps associée à Saint Macdara, un saint local considéré comme le protecteur des marins. Des dirigeants ont récemment fourni des ressources et des fonds pour aider les habitants dans leurs pratiques religieuses traditionnelles et leurs pèlerinages locaux vers l'île."
 RICE_mayo_hazelnut_tribute:0 "Tribut de noisettes"
 RICE_mayo_hazelnut_tribute_desc:0 "Dans l'ancien droit irlandais, les noisetiers sont considérés comme l'un des [Glossary( 'seigneurs du bois', 'LORDS_OF_THE_WOOD_GLOSS' )], et les seigneurs ont le droit de recevoir une portion de baguettes de noisetier de leurs clients chaque année. Récemment, les subordonnés de ce personnage ont récolté une grande quantité de bois de noisetier pour la construction de clôtures, d'enclos et de murs de maisons, ainsi que des noisettes pour la consommation."
 RICE_mayo_bountiful_hazelnut_harvest:0 "Récolte abondante de noisettes"
 RICE_mayo_pine_trees:0 "Pins irlandais"
 RICE_mayo_school_irish_modifier:0 "École florissante de Mayo"
 RICE_mayo_school_irish_modifier_desc:0 "Les dirigeants locaux ont soutenu l'École de Mayo, une ancienne institution autrefois dominée par les Anglo-Saxons, alors qu'elle devient davantage un centre de culture et d'apprentissage irlandais."
 RICE_mayo_school_irish_character_modifier:0 "Soutien à l'École de Mayo"
 RICE_mayo_school_irish_character_modifier_desc:0 "Grâce au soutien financier et politique de ce personnage, l'École de Mayo s'est transformée avec succès en un centre majeur de culture et d'érudition irlandaise."
 RICE_mayo_school_english_modifier:0 "École de Mayo restaurée"
 RICE_mayo_school_english_modifier_desc:0 "Les dirigeants locaux ont soutenu l'École de Mayo, une ancienne institution dominée par les Anglo-Saxons, et ont ravivé ses liens avec l'Angleterre."
 RICE_mayo_school_english_character_modifier:0 "A ravivé l'École de Mayo"
 RICE_mayo_school_english_character_modifier_desc:0 "Grâce au soutien financier et politique de ce personnage, l'École de Mayo a réussi à raviver ses liens avec l'Église en Angleterre, et a retrouvé son rôle de lien majeur entre l'Irlande et l'Angleterre une fois de plus."
 RICE_mayo_school_destroy_character_modifier:0 "A retiré son soutien à l'École de Mayo"
 RICE_mayo_school_destroy_character_modifier_desc:0 "Que ce soit par conviction sincère ou pour des raisons matérielles plus cyniques, ce personnage a accusé l'ancienne École de Mayo, une vieille institution autrefois dominée par les Anglo-Saxons, de ."
 
 # Struggle Ending Decisions
 
 # Decisions
 RICE_mayo_school_of_mayo_decision:0 "Influencer la direction de Mayo des Saxons"
 RICE_mayo_school_of_mayo_decision_tooltip:1 "L'École de Mayo change sous nos yeux, et il est temps d'influencer la direction qu'elle prendra."
 RICE_mayo_school_of_mayo_decision_desc:0 "Mayo des Saxons, ou l'École de Mayo, s'est imposée comme l'un des grands centres d'apprentissage en Irlande, grâce en partie au soutien enthousiaste des Irlandais et des Anglo-Saxons. Cependant, alors que les liens de l'école avec ses racines anglo-saxonnes déclinent, quel sera son destin ?"
 RICE_mayo_school_of_mayo_decision_effect_tooltip_1:1 "Des moines ou des nonnes [GetReligionByKey('christianity_religion').GetAdjective] d'[heritage|El] $heritage_west_germanic_name$ peuvent occasionnellement apparaître en [GetGeographicalRegion('custom_ireland').GetName], surtout tant que le [county_modifier|El] est encore actif"
 RICE_mayo_school_of_mayo_decision_confirm:0 "Nous influencerons l'avenir de l'école"
 RICE_mayo_school_of_mayo_decision_context_tooltip:0 "#emphasis Contexte historique :#! La colonie de Mayo telle que nous la connaissons trouve son origine dans un monastère connu sous le nom de Mayo des Saxons, fondé vers 668 de notre ère par des moines anglo-saxons après un désaccord qu'eux-mêmes et des moines irlandais alliés eurent avec les résultats du Synode de Whitby en Angleterre en 664. Au fil du temps, l'école de Mayo devint un important centre religieux reliant les mondes irlandais et anglo-saxon, ainsi qu'un centre éducatif majeur pour les Anglo-Saxons qui cherchaient à étudier en Irlande. L'apogée de Mayo des Saxons se situa aux VIIIe et début du IXe siècle, et bien qu'il restât un centre chrétien majeur en Irlande pendant encore quelques siècles, il perdit progressivement son caractère anglo-saxon unique, avant de sombrer dans l'obscurité à l'époque de la Réforme protestante."
 RICE_mayo_school_of_mayo_decision_PICK_TYPE: "$RICE_mayo_school_of_mayo_decision_confirm$"
 RICE_mayo_school_of_mayo_decision_select_text:"Quel avenir se dessine pour Mayo des Saxons ?\n$select_one_of_the_available_option_step_one_top_text$"
 RICE_mayo_school_of_mayo_decision_irish_name:"#Bold Adopter le savoir irlandais#!"
 RICE_mayo_school_of_mayo_decision_irish_desc: "$RICE_mayo_school_of_mayo_decision_irish_name$"
 RICE_mayo_school_of_mayo_decision_irish_tooltip:"#italic Les anciennes influences anglo-saxonnes de l'École de Mayo s'estompent, et il est temps de soutenir une nouvelle génération d'érudits et de monastiques issus d'un milieu irlandais.#!"
 RICE_mayo_school_of_mayo_decision_english_name:"#Bold Revitaliser les connexions anglaises#!"
 RICE_mayo_school_of_mayo_decision_english_desc: "$RICE_mayo_school_of_mayo_decision_english_name$"
 RICE_mayo_school_of_mayo_decision_english_tooltip:"#italic L'École de Mayo, pendant des années, fut un témoignage des liens religieux étroits entre l'Irlande et l'Angleterre, des liens qui peuvent être renforcés pour devenir encore plus grands qu'auparavant.#!"
 RICE_mayo_school_of_mayo_decision_destroy_name:"#Bold Retirer le soutien à l'École#!"
 RICE_mayo_school_of_mayo_decision_destroy_desc: "$RICE_mayo_school_of_mayo_decision_destroy_name$"
 RICE_mayo_school_of_mayo_decision_destroy_tooltip:"#italic L'École de Mayo est une institution en déclin, ne remplissant plus ses fonctions de pont entre l'Angleterre et l'Irlande ni de centre d'apprentissage. Nous devrions retirer notre soutien et confisquer une partie de ses biens.#!"
 RICE_mayo_bury_bog_butter:0 "Enterrer du beurre de tourbière"
 RICE_mayo_bury_bog_butter_tooltip:1 "Enterrer le [bog_butter_short|El] dans les tourbières est un excellent moyen de le conserver."
 RICE_mayo_bury_bog_butter_desc:0 "Enterrer du [bog_butter_short|El] dans les tourbières est une méthode ancestrale pour le conserver sur le long terme. Il devrait y avoir des tourbières à proximité où nous pouvons enterrer mon beurre."
 RICE_mayo_bury_bog_butter_effect_tooltip_1:1 "La [decision|El] de #V $RICE_mayo_retrieve_bog_butter$#! peut être prise après #V 1#! an pour obtenir le  [character_modifier|El] [GetModifier('RICE_mayo_bog_butter_modifier').GetNameWithTooltip], entre autres bonus"
 RICE_mayo_bury_bog_butter_effect_tooltip_2:1 "La [tradition|El] #V $tradition_RICE_brehon_law_name$#! augmente les bonus de cette [decision|El]"
 RICE_mayo_bury_bog_butter_confirm:0 "J'adore mon beurre !"
 RICE_mayo_bury_bog_butter_context_tooltip:0 "#emphasis Contexte historique :#! Le beurre était très prisé historiquement dans de nombreuses sociétés des îles Britanniques en raison de ses multiples usages : alimentation, cosmétiques, onguent, et bien d'autres. Dans les temps anciens et médiévaux, en Irlande et en Écosse, il était parfois conservé en étant enterré dans des tourbières. Cela lui conférait également un goût distinctif, différent du beurre frais ordinaire."
 RICE_mayo_retrieve_bog_butter:0 "Récupérer le beurre de tourbière"
 RICE_mayo_retrieve_bog_butter_tooltip:1 "Il est temps de retrouver ce beurre que nous avons enterré il y a quelque temps dans les tourbières."
 RICE_mayo_retrieve_bog_butter_desc:0 "J'ai enterré du [bog_butter_short|El] dans une tourbière il y a quelque temps pour mieux le conserver. Peut-être serait-ce le bon moment de le déterrer et de savourer ce qu'il est devenu ?"
 RICE_mayo_retrieve_bog_butter_effect_tooltip_1:1 "xxxxxxxxxxx"
 RICE_mayo_retrieve_bog_butter_confirm:0 "C'est la saison de la récolte du beurre !"
 RICE_mayo_retrieve_bog_butter_context_tooltip:0 "$RICE_mayo_bury_bog_butter_context_tooltip$"
 RICE_consecrate_holy_well:0 "Consacrer un puits sacré"
 RICE_consecrate_holy_well_tooltip:0 "Les terres regorgent de sources d'eau sacrées qui peuvent être consacrées"
 RICE_consecrate_holy_well_desc:0 "Les sources sacrées et les puits saints jouent un rôle important dans le folklore [ROOT.Char.GetCulture.GetCollectiveNoun|l], et bien qu'il existe de nombreux sites de ce type disséminés à travers mes terres, je souhaite en consacrer un près de ma [capital|El] et élever son importance aux yeux des fidèles [ROOT.Char.GetFaith.GetAdherentNamePlural] partout."
 RICE_consecrate_holy_well_effect_tooltip_1:0 "Cette [decision|El] ne peut être prise qu'#V UNE SEULE FOIS#! dans une vie"
 RICE_consecrate_holy_well_effect_tooltip_2:0 "Votre [capital|El] recevra un [county_modifier|El] pendant #V 20#! ans qui augmente l'[county_opinion|El] et le [control|El]. Bien que la puissance de ce modificateur soit aléatoire, elle est influencée par votre [piety_level|El]"
 RICE_consecrate_holy_well_effect_tooltip_3:0 "Tant que ce [county_modifier|El] est actif, les [rulers|El] qui possèdent le [county|El] dans lequel il se trouve ou qui y ont un [domicile|El] ont accès à l'[activity|El] #V [GetActivityType( 'activity_RICE_visit_holy_well' ).GetName] #!"
 RICE_consecrate_holy_well_confirm:0 "Trouvez un puits sacré approprié !"
 RICE_consecrate_holy_well_context_tooltip:0 "#emphasis Contexte historique :#! Depuis le Néolithique, les puits et les sources ont eu une grande importance parmi les peuples des îles Britanniques, indépendamment de l'ethnie ou de la religion. Bien que certains travaux universitaires récents aient remis en question le « puits sacré » britannique en tant que concept cohérent - par exemple, en mettant en doute l'existence d'un lien entre les pratiques païennes et chrétiennes aux puits sacrés, autre que le fait qu'elles tournent autour de l'eau - il est certain que ces puits ont été des lieux de spiritualité pendant des générations."
 RICE_no_holy_well_county:0 "Vous ne possédez pas de [county|El] avec un [county_modifier|El] de puits sacré"
 RICE_yes_holy_well_county:0 "Vous possédez un [county|El] avec un [county_modifier|El] de puits sacré"
 RICE_embrace_gaelicization:0 "Adopter la gaélicisation"
 RICE_embrace_gaelicization_tooltip:1 "Les coutumes et la vision du monde des peuples gaéliques vous appellent."
 RICE_embrace_gaelicization_desc:0 "Quelles que soient mes origines, je commence à me sentir chez moi parmi les [ROOT.Char.GetCapitalLocation.GetCulture.GetCollectiveNoun] de [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier]. Leur langue, leur musique, leur nourriture, leur mode vestimentaire, leurs manières... Tout cela est là, au plus profond de mon âme."
 RICE_embrace_gaelicization_effect_tooltip_1:1 "xxxxxxxxxxx"
 RICE_embrace_gaelicization_confirm:0 "Nous deviendrons plus [ROOT.Char.GetCapitalLocation.GetCulture.GetNameNoTooltip] que les [ROOT.Char.GetCapitalLocation.GetCulture.GetCollectiveNounNoTooltip] eux-mêmes !"
 RICE_embrace_gaelicization_context_tooltip:0 "#emphasis Contexte historique :#! Les descendants des Anglo-Normands qui s'installèrent en Irlande s'assimilèrent si bien à la culture gaélique indigène que des commentateurs ultérieurs affirmèrent de manière romantique que ces Anglo-Normands étaient devenus « plus Irlandais que les Irlandais eux-mêmes ». Lorsque les monarques anglais ultérieurs entreprirent des tentatives plus directes de contrôler et de conquérir l'Irlande au début de la période moderne, de nombreux descendants à la fois de familles irlandaises « indigènes » et de ces Hiberno-Normands, également appelés les « Vieux Anglais », s'étaient fortement mélangés par le mariage et avaient parfois collaboré pour résister à la domination anglaise."
 
