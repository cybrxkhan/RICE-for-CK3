 activity_RICE_visit_holy_well_host_an_a:0 "une"
 activity_RICE_visit_holy_well:0 "Visite d'un puits sacré"
 activity_RICE_visit_holy_well_desc:0 "Il y a un puits sacré à proximité qui est un lieu de vénération populaire parmi les habitants. Je peux y prier et y laisser des offrandes à [GetPlayer.GetFaith.PantheonTerm]."
 RICE_visit_holy_well_context_tooltip: "$RICE_consecrate_holy_well_context_tooltip$"
 activity_RICE_visit_holy_well_selection_tooltip:"Visitez un puits sacré local.\n\n$RICE_visit_holy_well_context_tooltip$"
 activity_RICE_visit_holy_well_host_desc:"\n$BULLET_WITH_TAB$Perte de [stress_loss_i|E] [stress|El]\n$BULLET_WITH_TAB$Gain de [piety_i|E] [piety|El]\n$BULLET_WITH_TAB$Gain de [legitimacy_i|E] [legitimacy|El]\n$BULLET_WITH_TAB$Possibilité d'obtenir le [character_modifier|El] [GetStaticModifier('TFE_healing_waters_of_a_holy_well').GetNameWithTooltip]"
