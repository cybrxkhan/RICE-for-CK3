 RICE_mayo_croagh_patrick_lightning_injury_log:0 "[lightning_person.GetShortUIName|U] a été blessé[lightning_person.Custom('FR_E')] par la foudre"
 RICE_mayo_croagh_patrick_lightning_death_log_title:0 "$RICE_mayo_croagh_patrick_lightning_harmless_log_title$"
