 # Misc
 Cu_Connacht:0 "Cú Connacht"
 dynn_RICE_dalaigh:0 "Dálaigh"
 innovation_RICE_bog_butter:0 "Beurre de tourbière"
 innovation_RICE_bog_butter_desc:0 "Dans de nombreuses régions des îles Britanniques, le beurre est souvent conservé en étant enfoui dans des tourbières, une pratique ancienne qui persiste depuis des millénaires, en raison de l'importance du beurre et de ses nombreux usages, de l'alimentation aux cosmétiques en passant par les onguents et bien d'autres."
 innovation_RICE_crannogs:0 "Crannogs"
 innovation_RICE_crannogs_desc:0 "Dans certaines parties des îles Britanniques, en particulier les régions celtiques, les Crannogs sont un type spécialisé de structure en bois, une île artificielle construite sur des lacs et des tourbières."
 RICE_any_held_county_bog_butter_terrain_capital_req:1 "Votre [capital|El] est en [terrain|El] de #V collines#!, de #V forêt#!, de #V zones humides#! ou de #V taïga#!"
 RICE_any_held_county_bog_butter_terrain_domicile_req:1 "Votre [domicile|El] est en [terrain|El] de #V collines#!, de #V forêt#!, de #V zones humides#! ou de #V taïga#!"
 RICE_any_held_county_not_bog_butter_flag_req:1 "Vous n'avez pas de beurre de tourbière que vous avez laissé enterré pendant au moins un an que vous pouvez actuellement déterrer"
 RICE_any_held_county_bog_butter_flag_req:1 "Vous avez du beurre de tourbière que vous avez laissé enfoui pendant au moins un an  que vous pouvez actuellement déterrer"
