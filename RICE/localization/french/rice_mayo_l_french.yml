 mayo.0040.t:0 "Enterrer le Beurre"
 mayo.0040.desc:0 "J'ai ordonné à mes serviteurs de déposer une grande quantité de [bog_butter_short|El] dans les tourbières près de ma résidence.\n\nAvec le temps, ce beurre ne sera pas seulement bien conservé, mais se transformera en quelque chose de délicieux, avec son propre goût distinct."
 mayo.0040.a:0 "J'ai hâte !"
 mayo.0041.t:0 "Récupérer le Beurre"
 mayo.0041.desc:0 "Il y a quelque temps, j'ai ordonné à mes serviteurs d'enterrer du [bog_butter_short|El] dans l'une des tourbières voisines. Suffisamment de temps s'est écoulé, et le beurre de tourbière devrait avoir bien mûri.\n\nJ'ordonne donc à mes serviteurs de récupérer le beurre que nous avons enterré. Il est maintenant temps d'en profiter, que ce soit pour des festins ou pour ma consommation personnelle."
 mayo.0041.a:0 "Mmm... du beurre de tourbière !"
 mayo.0042.t:0 "Le Seigneur du Beurre"
 mayo.0042.desc:0 "Mon amour du [bog_butter_short|El] est bien connu à travers tout le pays. Il semble qu'à cause de cela, certaines personnes ont pris l'habitude de me surnommer #V '$RICE_nick_butterlord|U$'#! en conséquence.\n\nCe surnom n'est pas des plus flatteurs, mais il ne se veut pas non plus une insulte, plutôt une attestation ironique de la quantité de beurre que j'ai utilisée et consommée au fil des années."
 mayo.0042.a:0 "C'est un surnom amusant. Je l'aime bien !"
 mayo.0042.b:0 "Bah ! Ça ne me convient pas du tout !"
 mayo.0042.b.tooltip:0 "Vous n'aurez pas d'autre occasion de recevoir ce [nickname|El] par la suite."
 mayo.0043.t:0 "Un don de beurre"
 mayo.0043.desc:0 "Le [bog_butter_short|El] est très estimé parmi les [actor.GetCulture.GetCollectiveNoun|l], et pour de bonnes raisons - le bétail a une valeur inestimable, et les produits qu'il fournit, comme le beurre, sont tout aussi précieux.\n\nJ'ai offert à [recipient.GetTitledFirstName] une quantité appropriée de beurre correspondant à son statut social, en signe de bonne volonté et d'amitié."
 mayo.0043.a:0 "Puissiez-vous trouver le beurre savoureux et agréable !"
 mayo.0044.t:0 "$mayo.0043.t$"
 mayo.0044.desc:0 "Le [bog_butter_short|El] est très estimé parmi les [recipient.GetCulture.GetCollectiveNoun|l], et pour de bonnes raisons - le bétail a une valeur inestimable, et les produits qu'il fournit, comme le beurre, sont tout aussi précieux.\n\n[actor.GetTitledFirstName] m'a offert une quantité appropriée de beurre correspondant à mon statut social, en signe de bonne volonté et d'amitié."
 mayo.0044.a:0 "Un cadeau délicieux et très apprécié !"
