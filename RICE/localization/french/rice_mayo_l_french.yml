 mayo.0030.t:0 "Vers la Montagne"
 mayo.0030.desc:0 "L'[GetGeographicalRegion('custom_ireland').GetName] est une île regorgeant de nombreux sites sacrés, mais l'un des plus populaires est Croagh Patrick, la montagne où Saint Patrick lui-même jeûna quarante jours à son sommet.\n\nMalgré les dangers auxquels ils s'exposent en le faisant, les pèlerins ont gravi cette montagne, parfois même pieds nus, depuis des siècles. Aujourd'hui, j'entame mon voyage vers cette montagne pour faire de même."
 mayo.0030.a:0 "Que Saint Patrick me protège !"
 mayo.0031.t:0 "Le Pied de la Montagne"
 mayo.0031.desc:0 "Louange à [ROOT.Char.GetFaith.HighGodName] !\n\nComme beaucoup avant moi, j'ai enfin atteint le pied du grand Croagh Patrick, où Saint Patrick lui-même jeûna quarante jours à son sommet, tel Moïse sur le Mont Sinaï.\n\nBien que je me reposerai ici ce soir, demain, j'entamerai la pénible ascension de la montagne. Traditionnellement, de nombreux pèlerins ont gravi la montagne pieds nus, comme épreuve de leur force et de leur zèle, et comme acte de pénitence pour leurs péchés."
 mayo.0031.a:0 "Je gravirai la montagne pieds nus."
 mayo.0031.b:0 "Mes pieds sont las - je ne puis marcher pieds nus."
 mayo.0032.t:0 "Une Ascension Ardue"
 mayo.0032.desc.intro:0 "Mes pieds sont fatigués d'avoir grimpé le flanc rocheux de Croagh Patrick pendant ce qui semble être des heures. Mais je ne suis pas seul - d'innombrables autres pèlerins autour de moi font de même.\n\n"
 mayo.0032.desc.injury_you:0 "Hélas, en chemin vers le sommet, je me suis blessé, bien que heureusement pas trop gravement - une telle souffrance est le risque que nous devons prendre lorsque nous gravissons la montagne rocheuse. Je dois maintenant compter sur les autres pour m'aider à poursuivre, même si cela pourrait être douloureux.\n\n"
 mayo.0032.desc.injury_other:0 "Hélas, lors de l'ascension, [injured_person.GetTitledFirstName] s'est blessé[injured_person.Custom('FR_E')], bien que heureusement pas trop gravement - de telles souffrances sont le risque que nous devons prendre lorsque nous gravissons la montagne rocheuse. [injured_person.GetSheHe|U] doit maintenant compter sur les autres pour l'aider à continuer, même si cela peut être douloureux.\n\n"
 mayo.0032.desc:0 "Quoi qu'il en soit, lors de l'ascension, nous passons devant de nombreuses pierres anciennes et des cairns, comme [Glossary( 'la Chaise de Saint Patrick', 'SAINT_PATRICKS_CHAIR_GLOSS' )], certains ornés de gravures faites par ceux qui sont venus ici avant nous. Lorsque je m'arrête près de l'une de ces pierres pour me reposer, j'adresse des prières à Saint Patrick."
 mayo.0032.a:0 "Continuons ! Encore un petit effort !"
 mayo.0033.t:0 "Le Sommet"
 mayo.0033.desc:0 "Nos pieds ont beaucoup enduré, et nous font souffrir sans aucun répit apparent, lorsque nous atteignons le sommet de Croagh Patrick. Le soulagement nous envahit en voyant l'humble chapelle bâtie en l'honneur de Saint Patrick !\n\nÀ la chapelle, nous prions et demandons le pardon de nos péchés, méditant sur [ROOT.Char.GetFaith.HighGodName] et la gloire de la création. Nous méditons aussi sur les récits de Saint Patrick passant quarante jours à jeûner au sommet, à l'image de Moïse sur le mont Sinaï, et bannissant tous les démons et serpents d'[GetGeographicalRegion('custom_ireland').GetName]. On raconte que lorsque son jeûne prit fin, [ROOT.Char.GetFaith.HighGodName] lui accorda le droit de juger tout le peuple d'[GetGeographicalRegion('custom_ireland').GetNameNoTooltip] lors du Jugement dernier."
 mayo.0033.a:0 "Nous resterons ici cette nuit pour y prier."
 mayo.0034.t:0 "La boule de Feu"
 mayo.0034.desc:0 "Alors que la soirée avançait, le ciel d'onyx grondait au loin, et le vent se levait ; un tel temps n'est pas inhabituel sur cette dangereuse montagne, et Saint Patrick affronta ce genre de dangers lorsqu'il passa quarante jours à jeûner ici. Plaçant notre confiance en [ROOT.Char.GetFaith.HighGodNameAlternate], nous poursuivîmes notre jeûne nocturne et notre veillée.\n\nPuis, un craquement retentit, plus fort que tous les sons du monde, comme si l'enfer lui-même s'était abattu sur nous.\n\nUne boule de feu fondit sur nous, plus rapide que quiconque n'aurait pu réagir. Ce fut le chaos, une cacophonie de cris et de hurlements, tandis que la foudre accomplissait son œuvre. En quelques instants, certains des pèlerins gisaient morts."
 mayo.0034.a:0 "[ROOT.Char.GetFaith.HighGodName] préservez-nous ! [ROOT.Char.GetFaith.HighGodName] protégez-nous !"
 mayo.0034.info:0 "#emphasis Contexte historique :#! Croagh Patrick se trouve dans une zone exposée à des conditions météorologiques dangereuses en raison de sa situation géographique. Au fil des siècles, les pèlerins se rendant sur la montagne ont été victimes de blessures et même de la mort à cause de ces intempéries, ainsi que d'hypothermie. Un exemple médiéval notable survint en 1113 de notre ère lorsque, selon les #italic Annales d'Ulster#!, trente pèlerins rassemblés au sommet de la montagne le jour de la fête de Saint Patrick (17 mars) furent tués dans la nuit lorsque la foudre frappa."
 mayo.0035.t:0 "En Bas des Pentes"
 mayo.0035.desc:0 "La descente de la montagne sembla plus facile que la montée. Les rigueurs de notre pèlerinage à Croagh Patrick ne sont pas faites pour les âmes sensibles, mais Saint Patrick a persévéré lorsqu'il atteignit le sommet il y a des éons - le moins que nous puissions faire est d'essayer de suivre son exemple.\n\nNous retournons au pied de la montagne, changés à jamais."
 mayo.0035.a:0 "Comme l'a dit Saint Patrick: [Glossary( 'Le Christ avec moi, le Christ devant moi', 'SAINT_PATRICKS_BREASTPLATE_GLOSS' )]." # This line comes from a line of Saint Patrick's Breastplate, a famous Irish prayer
