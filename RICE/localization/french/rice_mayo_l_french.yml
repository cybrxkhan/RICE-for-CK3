 RICE_mayo_in_castlebar_req:0 "Votre [camp|El] est à [GetTitleByKey('b_castlebar').GetNameNoTier]"
 RICE_all_family_members_at_court_sharing_old_heritage:0 "Tous les membres de votre [close_family|El] à votre [court|El] qui partagent le même [heritage|El] que votre ancienne [culture|El]"
