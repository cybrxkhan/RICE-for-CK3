 mayo.0010.t:0 "La Haute Royauté Troublée"
 mayo.0010.desc:0 "Les [norman.GetCollectiveNoun] sont initialement venus sur notre île en tant que mercenaires et aventuriers, intervenant dans les querelles politiques sur lesquelles moi, en tant que Haut Roi d'[GetTitleByKey('k_ireland').GetNameNoTier], j'étais censé avoir autorité. Les dirigeants [irish.GetCollectiveNoun|l] de l'île étaient malheureusement devenus trop indisciplinés au fil des années, refusant de se plier à ma volonté.\n\n[henry_ii.GetTitledFirstName] a jugé bon de cautionner ces [norman.GetCollectiveNounNoTooltip], avec le soutien de l'Église, mais nous sommes parvenus à un accord grâce au Traité de Windsor il y a quelques années. C'était un compromis acceptable qui divisait l'île entre ma sphère d'influence et celle de [henry_ii.GetFirstNamePossessiveNoTooltip], tant que je versais un tribut annuel à [henry_ii.GetHerHim], un maigre sacrifice pour réaffirmer mon autorité en tant que Haut Roi.\n\nLes subordonnés de [henry_ii.GetFirstNamePossessiveNoTooltip], cependant, se sont montrés traîtres, rompant le traité en empiétant continuellement sur ma sphère d'influence. J'ai peu confiance en ces [norman.GetCollectiveNounNoTooltip]... et pourtant, certains pensent que nous pourrions encore parvenir à un autre accord."
 mayo.0010.a:0 "J'ai lutté si longtemps pour rester Haut Roi..."
 mayo.0010.info:0 "#emphasis Contexte historique :#! Ruaidrí Ua Conchobair (anglicisé en Rory O'Connor) fut le dernier Ard Rí (Haut Roi) d'Irlande largement reconnu. Ruaidrí passa une grande partie de sa vie à tenter d'imposer son autorité en tant que Haut Roi, avec des résultats mitigés. Les choses se compliquèrent davantage avec l'implication de mercenaires anglo-normands dans les conflits locaux irlandais, ce qui dégénéra en une invasion par ces mêmes Anglo-Normands, sanctionnée par le roi Henri II d'Angleterre. Ruaidrí et Henri signèrent le Traité de Windsor en 1175, par lequel Henri et Ruaidrí se partagèrent leurs sphères d'influence en Irlande, et Ruaidrí prêta allégeance à Henri. Cependant, cet accord se délita rapidement car les vassaux normands et irlandais de chaque roi ignorèrent le traité et se firent ouvertement la guerre. Après la mort de Ruaidrí en 1198, quelques autres revendiquèrent le titre (dont Edward Bruce, frère du plus célèbre Robert the Bruce, au XIVe siècle) mais aucun d'entre eux ne bénéficia d'un large soutien."
 mayo.0011.t:0 "xxxxx"
 mayo.0011.desc:0 "xxxxx"
 mayo.0011.a:0 "xxxxx"
 mayo.0012.t:0 "De la Nature"
 mayo.0012.desc:0 "Après des années de labeur acharné, j'ai enfin achevé le [Glossary( 'Periphyseon', 'PERIPHYSEON_GLOSS' )], dédié à mon cher ami et compagnon d'études [wulfad.GetTitledFirstName]. C'est l'aboutissement de l'œuvre de ma vie, où je me plonge dans la philosophie de la nature de l'univers, et la relation entre [ROOT.Char.GetFaith.HighGodName] et la création.\n\nJe suis certain que mes rivaux intellectuels qui me dénigrent comme un philistin incivilisé d'[GetGeographicalRegion('custom_ireland').GetName] qualifieront cette œuvre d'hérésie, prétendant que mes arguments flirtent de trop près avec le [Glossary( 'pantheism', 'PANTHEISM_GLOSS' )].\n\nPourtant, même ces rivaux reconnaissent qu'un « barbare » comme moi possède une bonne connaissance de la langue [greek.GetLanguage.GetName] et des questions théologiques, et que j'ai été maintes fois patronné par le grand [charles.GetTitledFirstName], qui a favorisé ma carrière en [GetGeographicalRegion('world_europe_west_francia').GetName]. Ils peuvent être en désaccord avec mes positions théologiques, mais ils ne peuvent nier que je suis au moins leur égal sur le plan intellectuel."
 mayo.0012.a:0 "Et j'ai fait tout cela en tant que laïc, en plus !"
 mayo.0012.b:0 "Ma formation de moine en [GetGeographicalRegion('custom_ireland').GetNameNoTooltip] a porté ses fruits."
 mayo.0012.info:0 "#emphasis Contexte historique :#! Jean Scot Érigène était un théologien irlandais considéré comme l'un des plus grands penseurs chrétiens du IXe siècle, qui servit également comme directeur de l'École du Palais en tant que principal érudit de la Renaissance carolingienne. Il acheva la rédaction de son œuvre maîtresse en 866 ap. J.-C., intitulée le [Glossary( 'Periphyseon', 'PERIPHYSEON_GLOSS' )]. Il est difficile de déterminer s'il était un laïc ou un clerc, bien que son haut niveau d'éducation (incluant la connaissance de plusieurs langues, comme le grec) rendait plus probable qu'il fût un clerc ou un moine, ou qu'il eût au moins reçu une formation en tant que tel. Bien qu'il existe une histoire apocryphe selon laquelle il se rendit plus tard en Angleterre à l'invitation d'Alfred le Grand, où il fut poignardé à mort par ses élèves avec leurs stylets, il est plus probable qu'il resta en France durant une grande partie de sa vie ultérieure."
 mayo.0013.t:0 "L'Assistant"
 mayo.0013.desc:0 "J'ai été grandement aidé dans l'écriture du [Glossary( 'Periphyseon', 'PERIPHYSEON_GLOSS' )] par mon cher disciple [nisifortinus.GetFirstName] - même si [nisifortinus.GetSheHe] a dû atténuer la sévérité de certaines de mes remarques les plus mordantes et de mes arguments les plus combatifs, à mon grand regret. Combien de fois est-[nisifortinus.GetSheHe] intervenu[nisifortinus.Custom('FR_E')] en écrivant [Glossary( 'nisi forte', 'NISI_FORTE_GLOSS' )] à nouveau ?\n\nMalgré tout, en dépit de ces interventions que [nisifortinus.GetFirstNameNoTooltip] jugeait nécessaires pour rendre mon œuvre moins controversée, j'apprécie son travail acharné. Maintenant, alors que je poursuis mon voyage dans la vie et que je décide où aller ensuite et quoi faire, je me demande si nous devrions poursuivre ce partenariat."
 mayo.0013.a:0 "Nos chemins se séparent à présent - peut-être nous reverrons-nous un jour."
 mayo.0013.b:0 "[ROOT.Char.GetFaith.HighGodName] nous a réunis pour œuvrer ensemble pour une raison."
 mayo.0013.info:0 "#emphasis Contexte historique :#! Jean Scot Érigène avait un assistant et disciple qui l'aida à rédiger son œuvre majeure, le [Glossary( 'Periphyseon', 'PERIPHYSEON_GLOSS' )], entre autres choses. Le nom du disciple a été perdu par l'histoire, mais les chercheurs modernes lui ont donné (à lui ou à elle) le surnom de #italic Nisifortinus#!, en raison de son habitude d'écrire [Glossary( 'nisi forte', 'NISI_FORTE_GLOSS' )] chaque fois qu'il intervenait pour adoucir les propos d'Érigène et les rendre plus diplomatiques et moins controversés."
 mayo.0014.t:0 "$RICE_historical_aspiration_fulfilled_title$"
 mayo.0014.desc:0 "À une époque, ma position actuelle aurait pu être indésirable. Mais prêter allégeance à l'[GetTitleByKey('k_england').GetNameNoTier] n'est pas sans avantages.\n\nJe ne suis plus un Haut Roi incontestablement indépendant d'[GetTitleByKey('k_ireland').GetNameNoTier], et pourtant j'exerce plus d'autorité sur l'île qu'à l'époque où elle était ravagée par les déprédations de petits chefs et rois [irish.GetCollectiveNoun|l], se disputant amèrement pour de simples parcelles de terre et quelques têtes de bétail.\n\nLes [norman.GetCollectiveNoun|l] sont un fléau, mais un fléau que j'ai habilement utilisé pour restaurer un semblant d'ordre et de prospérité sur l'île. Même ma relation avec eux est assez ambiguë, et il se pourrait qu'un jour moi ou mes descendants devions les combattre à nouveau, mais pour l'instant, la paix régnera."
 mayo.0014.a:0 "Ma vie, je le sens, touchera bientôt à sa fin..."
 mayo.0015.t:0 "$RICE_historical_aspiration_fulfilled_title$"
 mayo.0015.desc:0 "Les décennies ont été difficiles et remplies de sang et de larmes, alors que je luttais pour revendiquer mon droit légitime en tant que Haut Roi d'[GetTitleByKey('k_ireland').GetNameNoTier]. Même les perfides [norman.GetCollectiveNounNoTooltip|l] cherchaient à intervenir dans les querelles locales irlandaises, alors qu'ils tentaient d'étendre leur influence par la trahison et la cruauté.\n\nMais des années ont passé, et nous avons établi pour nous-mêmes une nouvelle [GetTitleByKey('k_ireland').GetNameNoTierNoTooltip], avec moi comme son Haut Roi, par des moyens militaires et diplomatiques. Il faudra du temps pour fortifier et reconstruire notre force après des années de conflit et de désordre, et nous devons toujours être méfiants envers nos voisins à travers les îles - ils m'ont trahi une fois, lorsqu'ils ont répudié le Traité de Windsor, et je n'ai aucun doute qu'ils le feraient à nouveau s'ils le pouvaient.\n\nPour l'instant, cependant, je peux me reposer un peu en tant que premier Haut Roi incontesté d'[GetTitleByKey('k_ireland').GetNameNoTierNoTooltip] uni depuis longtemps, longtemps."
 mayo.0015.a:0 "$mayo.0014.a$"
 mayo.0016.t:0 "Le Retour du Haut Roi"
 mayo.0016.desc:0 "Bien que [rory_o_connor.GetFirstName] ait revendiqué le titre de « Haut Roi » d'[GetTitleByKey('k_ireland').GetNameNoTier] depuis des décennies, ce n'est que récemment qu'il est parvenu à réellement exercer son autorité et non plus simplement la revendiquer. L'invasion éphémère des perfides [norman.GetCollectiveNoun|l], ainsi que leur trahison et leur répudiation du Traité de Windsor, que [rory_o_connor.GetFirstNameNoTooltip] avait initialement signé avec eux, semble avoir été le catalyseur de son ascension vers le statut de véritable Haut Roi.\n\n[rory_o_connor.GetFirstNameNoTooltip] se dresse désormais comme le seigneur le plus puissant d'[GetTitleByKey('k_ireland').GetNameNoTierNoTooltip]."
 mayo.0016.desc.irish:0 "Certains pensent que je devrais prêter allégeance à [rory_o_connor.GetHerHim], ou du moins lui offrir un tribut, en tant que dirigeant d'[GetTitleByKey('k_ireland').GetNameNoTierNoTooltip]. Pourtant, d'autres disent que je ne devrais pas me laisser impressionner par les démonstrations de puissance trompeuses de [rory_o_connor.GetFirstNamePossessive], car son pouvoir pourrait être éphémère, ou la Grande Royauté s'effondrera après la mort du vieil [rory_o_connor.GetWomanMan]."
 mayo.0016.a:0 "Nous verrons combien de temps cet état de fait durera."
 mayo.0016.b:0 "Jamais je ne prêterai allégeance à ce parvenu !"
 mayo.0016.c:0 "Nous offrirons prudemment un tribut, comme du bétail et du beurre."
 mayo.0016.d:0 "Avons-nous le choix ? Je prêterai serment d'allégeance."
