 mayo.0050.intro:0 "Après que Saint Colmán a fondé la grande école [GetReligionByKey('christianity_religion').GetAdjective] de Mayo en l'an 668, l'école a prospéré pendant de nombreuses années, grâce à son important contingent de moines [anglo_saxon_culture.GetName] enthousiastes, qui voyageaient jusqu'à [GetTitleByKey('c_mayo').GetNameNoTier] depuis [GetGeographicalRegion('custom_england').GetName] pour y étudier. Bien qu'elle demeure un centre d'apprentissage important, l'école a vu son prestige décliner ces derniers temps.\n\nDésormais, l'histoire de l'école a pris un tournant intéressant en raison des actions récentes de [mayo_leader.GetTitledFirstName], dirigeant de [GetTitleByKey('c_mayo').GetNameNoTierNoTooltip]."
 mayo.0050.t:0 "L'École de Mayo"
 mayo.0050.desc:0 "$mayo.0050.intro$Au fil du temps, l'école a perdu une grande partie de son caractère [anglo_saxon_culture.GetNameNoTooltip|l] originel, et a adopté de plus en plus de traits $heritage_goidelic_name$.\n\nPlutôt que de résister à ce changement, [mayo_leader.GetFirstNameNoTooltip] a encouragé l'École de Mayo à tisser des liens plus étroits avec d'autres institutions [GetReligionByKey('christianity_religion').GetAdjectiveNoTooltip] en [GetGeographicalRegion('custom_ireland').GetName]. Son objectif est d'aider l'École de Mayo à devenir une institution de premier plan sur l'île."
 mayo.0050.a:0 "C'est un nouveau chapitre dans l'histoire de [GetTitleByKey('c_mayo').GetNameNoTierNoTooltip]..."
 mayo.0051.t:0 "$mayo.0050.t$"
 mayo.0051.desc:0 "$mayo.0050.intro$[mayo_leader.GetSheHe|U] estime que l'école doit raviver ses anciens liens avec l'[GetGeographicalRegion('custom_england').GetNameNoTooltip], étant donné qu'ils furent historiquement une source de sa force - un maillon essentiel dans l'établissement de relations entre les différentes parties des îles Britanniques.\n\nÀ ce titre, [mayo_leader.GetFirstNameNoTooltip] a aidé l'école à rétablir ses liens formels avec d'autres institutions religieuses en [GetGeographicalRegion('custom_england').GetNameNoTooltip]. Son espoir est qu'en agissant ainsi, la fortune de l'école sera restaurée et son influence à nouveau étendue."
 mayo.0051.a:0 "$mayo.0050.a$"
 mayo.0052.t:0 "$mayo.0050.t$"
 mayo.0052.desc:0 "$mayo.0050.intro$En fait, grâce aux actions [mayo_leader.GetFirstNamePossessiveNoTooltip], l'école ne retrouvera probablement #italic jamais#! sa gloire d'antan.\n\nAprès avoir accusé les habitants de l'école de divers crimes, [mayo_leader.GetFirstNameNoTooltip] a retiré son soutien à l'école. Non seulement cela, mais certains des biens de l'école - de ses terres à ses livres et reliques sacrées - ont été saisis pour [mayo_leader.GetSheHe]. Certains se demandent s'il y avait des raisons politiques ou financières derrière cet acte.\n\nBien que l'école subsiste, elle n'est plus que l'ombre d'elle-même."
 mayo.0052.a:0 "$mayo.0050.a$"
 mayo.0053.t:0 "[saxon_monk.Custom('FR_LeLa')|U] [saxon_monk.Custom('NunMonk')|U] d'[GetGeographicalRegion('custom_england').GetNameNoTooltip]"
 mayo.0053.desc:0 "Depuis que l'École de Mayo, une importante institution [GetReligionByKey('christianity_religion').GetAdjective] en [GetGeographicalRegion('custom_ireland').GetName], a rétabli ses liens avec l'[GetGeographicalRegion('custom_england').GetName] - les mêmes liens qui l'ont rendue si éminente à l'origine - de nombreux érudits d'[GetGeographicalRegion('custom_england').GetNameNoTooltip] se sont rendus sur l'île d'émeraude pour étudier à [GetTitleByKey('c_mayo').GetNameNoTier].\n\nL'un de ces érudits se trouve être un[saxon_monk.Custom('FR_E')] certain[saxon_monk.Custom('FR_E')] [saxon_monk.Custom('NunMonk')] [saxon_monk.GetCulture.GetName] du nom de [saxon_monk.GetFirstName]. [saxon_monk.GetSheHe|U] a passé beaucoup de temps à étudier à l'École de Mayo et à y nouer des relations, mais envisage désormais de s'installer à [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier], et a proposé de m'aider dans les affaires religieuses et grâce à ses relations."
 mayo.0053.a:0 "Bienvenue ! On aurait bien besoin de quelqu'un comme vous."
 mayo.0053.b:0 "[saxon_monk.GetSheHe|U] ne m'impressionne pas."
