 beja_pagan_desc:0 "'Sun, The great god, lord of Kalabsha, the all-seeing master, king of all,'\n\nMandulis (or Merwel in Old Nubian) is the great sun god of Lower Nubia. Though he was worshipped by Egyptians and Kushites, the centre of a cult was amongst the Blemmeyes of the Eastern Desert. Mandulis, usually shown as a falcon with the head of a man, is the Kushite form of the Egyptian god Horus, who was the god of the sky and the son of Isis and Osiris. His main temple in Philae served as the chief site of pilgrimage."

